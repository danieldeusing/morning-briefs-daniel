<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daniels Morning Briefs</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="lib/tokens.css">
<script>
  // Pre-paint animation policy (mirrors the terminal core / pagr): an explicit
  // "off" in localStorage — or no pick while the OS prefers reduced motion —
  // marks html.anim-off so components.css kills keyframes (incl. the brand
  // cursor blink) with no flash. The footer anim toggle persists "on"/"off".
  (function () {
    let pref = null;
    try { pref = localStorage.getItem('anim'); } catch (_) {}
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (pref === 'off' || (pref === null && reduced)) {
      document.documentElement.classList.add('anim-off');
    }
  })();
  // Resolution-independent zoom (mirrors pagr): lay out at a 1920px reference, then
  // scale the whole view up on wider screens — a true zoom of everything, never below
  // 1×. Pre-paint to avoid a flash.
  (function () {
    var applyZoom = function () {
      document.documentElement.style.zoom = String(Math.max(1, window.innerWidth / 1920));
    };
    applyZoom();
    window.addEventListener('resize', applyZoom);
  })();
</script>
<style>
  /* Dashboard chrome styles. Design tokens (colours, shadow, typography vars)
     come from lib/tokens.css — keep them there so the dashboard and the
     newsletter content stay in sync. */
  * { box-sizing: border-box; }
  /* Lock the outer document — only inner scroll containers (the .home view
     and the iframe) handle scrolling. Without this, a tiny mismatch between
     header.app + .app-shell heights and 100vh adds a few pixels of overflow
     to <html>, producing a second outer scrollbar alongside the one inside
     .home. overflow: hidden on both html and body kills that outer track. */
  html, body {
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    height: 100%;
    overflow: hidden;
  }
  html { position: relative; }

  /* Paper-grain noise overlay — same texture as the newsletter pages.
     Imperceptible up close, breaks LCD flatness at distance. Disabled under
     reduced-motion / high-contrast preferences. */
  html::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image: none;
    opacity: 0.04;
    mix-blend-mode: multiply;
  }
  @media (prefers-reduced-motion: reduce), (prefers-contrast: more) {
    html::before { display: none; }
  }
  body > *, header.app { position: relative; z-index: 1; }
  body {
    font-family: var(--font-body);
    line-height: 1.5;
    font-size: 15px;
    font-feature-settings: "kern", "liga", "onum";
    -webkit-font-smoothing: antialiased;
  }

  /* Terminal header bar — mirrors the pagr/seedr chrome: a single row on a
     --card surface with a --border bottom rule. LEFT: the brand wordmark
     (mono + .glow) and a blinking .cursor-block. RIGHT: the nav-rail minimize
     toggle. */
  header.app {
    border-bottom: 1px solid var(--border);
    background: var(--card);
    font-family: var(--font-mono); /* chrome is terminal mono; the content stays serif */
    /* Lift the header above the content, which is also a positioned body child
       at z-index 1 and would otherwise paint over it. */
    z-index: 50;
    padding: 0 1rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    min-height: 3rem;
  }
  /* LEFT zone — brand only. */
  .header-left {
    display: flex;
    align-items: center;
    flex: none;
    min-width: 0;
  }
  .header-brand {
    display: inline-flex;
    align-items: center;
    flex: none;
    text-decoration: none;
    cursor: pointer;
  }
  .header-brand .brand-word {
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: -0.01em;
  }

  /* RIGHT zone — the nav-rail minimize toggle, pushed to the far right
     (the header has no center zone). */
  .header-right {
    flex: none;
    margin-left: auto;
    display: flex;
    align-items: center;
  }

  /* Layout: two columns — flexible main + a fixed-width nav-rail on the right.
     The fixed footer is 2rem tall, so the shell is the viewport minus the
     header (3rem) and the footer (2rem). When the rail is collapsed the
     --rail-w track narrows to the icon-only strip. */
  .app-shell {
    display: grid;
    grid-template-columns: minmax(0, 1fr) var(--rail-w, 16rem);
    height: calc(100vh - 3rem - 2rem);
    height: calc(100dvh - 3rem - 2rem);
  }
  .app-shell.rail-collapsed { --rail-w: 3rem; }

  /* The nav lives in the sticky right sidebar (.nav-rail). It holds the
     Übersicht control (#home-btn) and #nav-groups (the grouped category nav,
     populated by JS). */
  .nav-label {
    font-family: var(--font-mono);
    font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--muted-foreground); padding: 0.5rem 0.85rem 0.2rem; font-weight: 600;
  }
  #nav-groups { padding-bottom: 0.2rem; }

  .cat {
    margin: 0;
    border-radius: 0;
    overflow: hidden;
    border: 0;
  }
  .cat-head {
    display: flex; align-items: center; gap: 0.55rem;
    padding: 0.45rem 0.85rem;
    cursor: pointer;
    border-radius: 0;
    transition: background 120ms;
    min-height: 2.1rem;
  }
  .cat-head:hover { background: var(--muted); }
  .cat-head:hover .cat-name { color: var(--primary); }
  .cat.active .cat-head { background: var(--muted); }
  .cat.active .cat-name { color: var(--primary); }
  .cat-color { width: 6px; height: 18px; border-radius: 0; flex: none; }
  .cat-name {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 0.8rem;
    color: var(--foreground);
    transition: color 0.15s ease;
    flex: 1;
    /* Single-line; ellipsise rather than wrap to two lines. */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .cat-icon { font-size: 1.05rem; }
  .cat-latest {
    font-family: var(--font-mono);
    font-size: 0.68rem; color: var(--soft);
    font-feature-settings: "tnum"; font-weight: 500;
  }
  .cat-toggle {
    background: transparent; border: none;
    color: var(--soft); cursor: pointer;
    transition: transform 150ms ease, background 120ms, color 120ms;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    padding: 0.55rem 0.7rem;
    border-radius: var(--radius-inline);
    line-height: 1;
    min-height: 2.25rem; min-width: 2.25rem;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .cat-toggle:hover { background: var(--rule-soft); color: var(--fg); }
  .cat.open > .cat-head .cat-toggle { transform: rotate(90deg); }

  .cat-dates { display: none; padding: 0.15rem 0.7rem 0.4rem 1.45rem; }

  .cat.open .cat-dates { display: block; }
  /* The category dropdown holds only the archive month-picker: days with a
     brief are clickable (ringed in the category accent), the selected day is
     filled, hovering one previews its title. Border + marks use the
     per-category --cat-accent scoped on the .cat row. */
  .cat-cal {
    margin: 0.2rem 0;
    padding: 0.5rem;
    border: 1px solid var(--cat-accent);
    border-radius: 6px;
    background: var(--rule-soft);
  }
  .cal-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 0.45rem;
  }
  .cal-title {
    font-family: var(--font-mono); font-size: 0.74rem;
    font-weight: 600; color: var(--fg);
  }
  .cal-nav {
    width: 1.7rem; height: 1.7rem; line-height: 1;
    background: transparent; border: 1px solid var(--rule); border-radius: 4px;
    color: var(--muted-ink); font-size: 0.95rem; cursor: pointer;
    transition: color 120ms, border-color 120ms;
  }
  .cal-nav:hover:not(:disabled) { color: var(--fg); border-color: var(--soft); }
  .cal-nav:focus-visible { outline: 2px solid var(--cat-accent, var(--fg)); outline-offset: 2px; }
  .cal-nav:disabled { opacity: 0.3; cursor: default; }
  .cal-week, .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
  }
  .cal-week { margin-bottom: 3px; }
  .cal-week span {
    text-align: center; font-family: var(--font-mono);
    font-size: 0.58rem; color: var(--muted-ink);
  }
  .cal-day {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 0.7rem;
    border-radius: 4px; color: var(--soft);
    font-feature-settings: "tnum";
  }
  .cal-day.none { color: var(--rule); }
  .cal-day.blank { visibility: hidden; }
  .cal-day.has {
    color: var(--fg); font-weight: 600; cursor: pointer; text-decoration: none;
    background: var(--panel);
    box-shadow: inset 0 0 0 1px var(--cat-accent);
    transition: background 100ms, color 100ms;
  }
  .cal-day.has:hover, .cal-day.has:focus-visible,
  .cal-day.has.current {
    background: var(--cat-accent); color: #fff; outline: none;
  }
  .cal-preview {
    margin-top: 0.5rem; padding-top: 0.45rem;
    border-top: 1px solid var(--rule);
    font-family: var(--font-body); font-size: 0.72rem;
    color: var(--muted-ink); line-height: 1.35; min-height: 1.7rem;
  }
  /* ────────────────────────────────────────────────────────────────────
     Fixed footer status bar — mirrors the pagr/seedr StatusBar: a 2rem bar
     pinned to the viewport bottom on a --card surface with a --border top
     rule. LEFT: `[briefs] reader@briefs:~/path` status line. RIGHT: the
     relocated controls (theme menu, language menu) + an anim toggle.
     ──────────────────────────────────────────────────────────────────── */
  footer.status-bar {
    position: fixed;
    inset-inline: 0;
    bottom: 0;
    z-index: 60;
    height: 2rem;
    border-top: 1px solid var(--border);
    background: var(--card);
    font-family: var(--font-mono); /* chrome is terminal mono */
    font-size: 11px;
  }
  .status-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    height: 100%;
    padding: 0 0.85rem;
  }
  .status-path {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted-foreground);
  }
  .status-path .status-tag { color: var(--primary); }
  .status-path .status-loc { color: var(--foreground); }
  .status-controls {
    display: flex;
    align-items: center;
    gap: 1.1rem;
    flex: none;
  }
  .status-sep { height: 0.9rem; width: 1px; background: var(--border); flex: none; }

  /* Footer control buttons — flat, muted, warm to --primary on hover. No
     boxes, no shadows; terminal-plain. */
  .status-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: inherit;
    line-height: 1;
    color: var(--muted-foreground);
    text-decoration: none;
    background: none;
    border: 0;
    border-radius: 0;
    padding: 0;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .status-btn:hover { color: var(--primary); }

  /* Theme + language dropdowns reuse the core .dropdown / .dropdown-panel /
     .dropdown-item primitives. The summary mirrors .status-btn. */
  .status-controls .dropdown > summary { font: inherit; }
  /* Settings icons (.dd-dot theme indicator, .dd-flag language flags) come from
     the shared @danieldeusing/design components.css — no local copy here. */

  /* Anim toggle — `[x] anim` / `[ ] anim`, mirroring pagr's footer toggle. */
  .anim-toggle { white-space: nowrap; }
  .anim-toggle[aria-pressed="true"] .anim-box { color: var(--primary); }

  /* Language picker — the trigger anchors the upward dropdown menu. The menu
     reuses the core .dropdown-panel (absolute, opens above, right-aligned),
     toggled open/closed via the [hidden] attribute by the existing JS. */
  .lang-picker { position: relative; }
  .lang-caret { font-size: 0.6rem; margin-left: 0.1rem; }
  .lang-menu[hidden] { display: none; }
  .lang-option[aria-selected="true"] {
    color: var(--primary);
    text-shadow: 0 0 8px var(--glow);
  }

  .cat-empty {
    font-family: var(--font-mono);
    font-size: 0.7rem; color: var(--soft);
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 0.5rem 0.6rem;
  }

  /* Main area — full width, fills the shell (viewport minus header + footer). */
  .main {
    overflow: hidden;
    background: var(--bg);
    position: relative;
    height: 100%;
  }
  .iframe-host { width: 100%; height: 100%; border: none; background: var(--bg); }

  /* ────────────────────────────────────────────────────────────────────
     Sticky right sidebar (.nav-rail) — terminal mono, --card surface with a
     --border left rule, full shell height with its own scroll. Holds the
     Übersicht control + the grouped category nav. Collapses to a 3rem icon-
     only strip; the width animates via the grid track on .app-shell.
     ──────────────────────────────────────────────────────────────────── */
  .nav-rail {
    grid-column: 2;
    font-family: var(--font-mono);
    background: var(--card);
    border-left: 1px solid var(--border);
    height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 2;
  }
  .nav-rail-head {
    display: flex;
    align-items: center;
    min-height: 2.1rem;
    padding: 0.4rem 0.85rem;
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .nav-rail-title {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 600;
    color: var(--muted-foreground);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-rail-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0.3rem 0 0.4rem;
  }

  /* Minimize toggle — the `»`/`«` chevron in the header right zone. Flat, muted,
     warm to --primary on hover (terminal-plain, no box). */
  .rail-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    flex: none;
    background: none;
    border: 0;
    border-radius: 0;
    color: var(--muted-foreground);
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 1rem;
    line-height: 1;
    transition: color 0.15s ease;
  }
  .rail-toggle:hover { color: var(--primary); }
  /* Expanded → `»` (collapse-to-right); collapsed → `«` (re-open). The button's
     aria-expanded drives the glyph; JS rewrites the text content too as a fallback. */
  .rail-toggle[aria-expanded="false"] .rail-toggle-glyph::before { content: "«"; }
  .rail-toggle[aria-expanded="true"]  .rail-toggle-glyph::before { content: "»"; }
  .rail-toggle-glyph { font-size: 0; }
  .rail-toggle-glyph::before { font-size: 1rem; }

  /* Collapsed strip — keep only the per-category accent bar + icon, hide labels,
     calendars and the home wordmark. The 3rem track clips the rest. */
  .app-shell.rail-collapsed .nav-rail-title,
  .app-shell.rail-collapsed .nav-label,
  .app-shell.rail-collapsed .cat-name,
  .app-shell.rail-collapsed .cat-latest,
  .app-shell.rail-collapsed .cat-toggle,
  .app-shell.rail-collapsed .cat-dates,
  .app-shell.rail-collapsed .home-btn .nav-label-text,
  .app-shell.rail-collapsed .home-btn .brand-mark {
    display: none;
  }
  .app-shell.rail-collapsed .nav-rail-head { justify-content: center; padding: 0.4rem 0; }
  .app-shell.rail-collapsed .cat-head,
  .app-shell.rail-collapsed .home-btn {
    justify-content: center;
    padding-left: 0;
    padding-right: 0;
    gap: 0;
  }
  .app-shell.rail-collapsed .cat-color,
  .app-shell.rail-collapsed .home-btn .cat-color { margin-right: 0.4rem; }

  /* The width transition reads off the grid track; animate it. */
  .app-shell { transition: grid-template-columns 0.18s ease; }
  @media (prefers-reduced-motion: reduce) {
    .app-shell { transition: none; }
  }

  /* Mobile re-open button (a floating ☰); shown only when the rail is an
     off-canvas drawer (≤720px). Hidden on desktop. */
  .rail-fab {
    display: none;
    position: fixed;
    right: 0.75rem;
    bottom: 2.6rem;
    z-index: 55;
    width: 2.6rem;
    height: 2.6rem;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--foreground);
    font-family: var(--font-mono);
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow: 0 0 18px var(--glow-soft);
  }

  /* Home view */
  .home {
    display: none;
    padding: 1.5rem 1.8rem;
    overflow-y: auto; height: 100%;
    /* Container for the responsive .tldr-grid below — column-count tracks
       the actual available width, not the viewport (which changes with
       sidebar collapsed/expanded state). */
    container-type: inline-size;
    container-name: home;
  }
  .home.show { display: block; }
  .home h2 {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 48;
    font-size: 1.55rem; font-weight: 600;
    margin: 0 0 0.5rem; letter-spacing: -0.005em;
  }
  .home .lead { color: var(--muted-ink); margin-bottom: 1.4rem; font-family: var(--font-body); }

  /* Freshness line — "Stand: DD.MM.YYYY" from the manifest's `generated`
     date. Mono-caps to read as a dateline, not body copy. When the manifest
     wasn't rebuilt today (a silently-failed nightly task), .stale flips it to
     the warn accent and appends a hint, so a missed run is visible at a glance
     instead of looking like fresh content. */
  .home-stand {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--soft);
    font-feature-settings: "tnum";
    margin: 0 0 1.2rem;
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .home-stand .stand-date { font-weight: 600; color: var(--muted-ink); }
  .home-stand.stale { color: var(--warn); }
  .home-stand.stale .stand-date { color: var(--warn); }
  .home-stand .stand-note { text-transform: none; letter-spacing: 0.02em; font-style: italic; }

  /* Newsprint column grid — the dashboard reads like one paper folded into
     seven adjacent columns. No card chrome: backgrounds, borders, shadows
     and radii are stripped. Adjacent columns are separated only by a
     hairline column rule, the same way the body-grid inside a newsletter
     uses column-rule between deep-dive sections. */
  /* Responsive column grid — caps at 3 wide so the columns stay readable
     on huge screens instead of shrinking to 5-6 narrow strips. The min
     width per column is the larger of 320 px (floor for readability) or
     1/3 of the container (so no more than 3 fit). Single declaration —
     no media or container queries needed.

     The column-rule + row-rule logic uses container queries against .home
     so the layout responds to actual available width (which changes with
     sidebar collapsed/expanded), not viewport. */
  .tldr-grid {
    display: grid;
    grid-template-columns:
      repeat(auto-fit, minmax(min(100%, max(320px, calc((100% - 2px) / 3))), 1fr));
    gap: 0;
    margin-top: 0.5rem;
  }
  .tldr-card {
    background: transparent;
    border: none;
    border-radius: 0;
    padding: var(--space-2) var(--space-4) var(--space-5);
    box-shadow: none;
    cursor: pointer;
    transition: background 150ms;
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    border-left: 1px solid var(--rule);
  }

  /* Grouped layout: a full-width header band (Wirtschaft / IT / Sport / …)
     precedes each group's cards. The header spans every grid column so the
     column flow restarts beneath it — each group reads as its own newsprint
     block, matching the sidebar's grouping. */
  .tldr-group-head {
    grid-column: 1 / -1;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    font-weight: 600;
    color: var(--soft);
    margin: var(--space-5) 0 0;
    padding: var(--space-3) 0 var(--space-2);
    border-top: 1px solid var(--rule);
  }
  /* The first group header sits right under the "Stand:" line — no big top gap
     or top rule, so the grid doesn't open with a stray divider. */
  .tldr-group-head:first-child { margin-top: 0; border-top: none; padding-top: 0; }

  /* The leading card of each group clears its left column rule so the group's
     first column starts clean (JS marks it; nth-child can't track per-group
     position once headers are interspersed). */
  .tldr-card.group-first { border-left: none; padding-left: 0; }

  /* Single-column band (narrow): no column rules at all; cards in the same
     group separate by a dashed row rule. The group header already divides
     groups, so only same-group siblings (a card directly after another card)
     get the dashed top. */
  @container home (max-width: 639px) {
    .tldr-card { border-left: none; padding-left: 0; }
    .tldr-card + .tldr-card {
      margin-top: var(--space-3);
      padding-top: var(--space-5);
      border-top: 1px dashed var(--rule);
    }
  }
  /* Subtle tinted-paper feedback on hover — no transform, no shadow swap,
     so adjacent columns never visually shift. */
  .tldr-card:hover {
    background: color-mix(in srgb, var(--cat-accent) 4%, transparent);
  }
  .tldr-card:focus-visible {
    outline: 2px solid var(--cat-accent, var(--fg));
    outline-offset: 4px;
  }
  .crumb:focus-visible {
    outline: 2px solid var(--fg);
    outline-offset: 2px;
    border-radius: var(--radius-inline);
  }

  /* Kicker line — same mono-caps treatment as the newsletter masthead-issue.
     Icon left, date right, category name in the middle. */
  .tldr-card-head {
    display: flex; align-items: center; gap: var(--space-2);
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.68rem;
    color: var(--muted-ink);
    border-bottom: none;
    padding-bottom: 0;
    margin-bottom: 0;
  }
  .tldr-card-head .tile-icon {
    font-size: 1rem;
    letter-spacing: normal;
    text-transform: none;
  }
  .tldr-card-head .tile-name {
    font-family: inherit;
    font-variation-settings: normal;
    font-weight: 600;
    font-size: inherit;
    color: var(--cat-accent-text, var(--fg));
    flex: 1;
  }
  .tldr-card-head .tile-date {
    font-family: inherit;
    font-size: inherit;
    color: var(--muted-ink);
    font-weight: 500;
    font-feature-settings: "tnum";
    letter-spacing: 0.1em;
  }

  /* Section title — the actual newsletter headline, rendered as a section
     dek in Fraunces with the same accent-bar treatment as .col h2 inside
     a newsletter. Acts as the "front-page headline" for that category. */
  .tldr-card-headline {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 36, "SOFT" 60;
    font-size: 1.18rem;
    font-weight: 600;
    font-style: normal;
    line-height: 1.18;
    color: var(--fg);
    margin: var(--space-2) 0 var(--space-3);
    letter-spacing: -0.005em;
  }
  .tldr-card-headline::before {
    content: "";
    display: block;
    width: 2rem;
    height: 2px;
    background: var(--cat-accent);
    margin-bottom: var(--space-2);
  }

  /* Strip the embedded TL;DR section's own chrome — it inherits the column
     instead. The lead keeps its drop-cap treatment but at a smaller scale
     suited to the narrower column width. */
  .tldr-card-body .tldr {
    background: transparent; border: none; padding: 0; margin: 0; border-radius: 0;
    display: block;       /* override the .tldr:has(.lead) grid from styles.css */
    column-gap: 0;
  }
  .tldr-card-body .tldr > .lead {
    font-family: var(--font-body);
    font-size: 0.92rem;
    line-height: 1.5;
    color: var(--fg);
    margin: 0 0 var(--space-3);
    max-width: none;
  }
  .tldr-card-body .tldr > .lead::first-letter {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 144, "SOFT" 100;
    font-size: 2.7rem;
    float: left;
    line-height: 0.85;
    padding: 0.25rem 0.45rem 0 0;
    color: var(--cat-accent);
    font-weight: 700;
  }
  .tldr-card-body .tldr ul {
    padding-left: 1rem;
    margin: 0;
    column-count: 1;       /* override 2-col bullet layout in narrow card */
  }
  .tldr-card-body .tldr li { font-size: 0.86rem; margin: 0.4rem 0; line-height: 1.5; }
  .tldr-card-body strong { color: var(--fg); font-weight: 700; }
  .tldr-card-body em { color: var(--muted-ink); font-style: italic; }
  .tldr-card-body a { color: inherit; text-decoration: underline; }
  /* Chips inside TL;DR bullets — tinted by the card's accent. */
  .tldr-card-body .chip {
    display: inline-block;
    font-family: var(--font-mono);
    background: color-mix(in srgb, var(--cat-accent, var(--rule-soft)) 14%, transparent);
    color: var(--fg);
    font-size: 0.6rem; font-weight: 600; padding: 0.05rem 0.45rem;
    border-radius: var(--radius-inline); letter-spacing: 0.04em; margin-right: 0.2rem;
    text-transform: uppercase; vertical-align: middle;
  }
  /* Same two rules as .chip.hot/.chip.good in lib/styles.css — the dashboard does not
     load styles.css, so it restates them. Tokens, not the literals that were here
     (#b6402f / #3f7a4f: single hexes on a four-theme page, measuring 3.06–3.83:1).
     The tint is 10%, not the 18% it was: the ink sits on its OWN tint, which is a
     surface the design system never measured — at 18% the composite is 4.15:1 on
     warm and 4.23:1 on paper, under AA. Measured worst case at 10% is 4.66:1. */
  .tldr-card-body .chip.hot  { background: color-mix(in srgb, var(--warn) 10%, transparent); color: var(--warn); }
  .tldr-card-body .chip.good { background: color-mix(in srgb, var(--good) 10%, transparent); color: var(--good); }
  /* Suppress the external-link arrow inside TL;DR snippets — too noisy. */
  .tldr-card-body a[href^="http"]::after { content: none; }
  /* "+N weitere" overflow marker — the home snapshot caps the TL;DR at a few
     bullets (the full set is one click away). Reads as a muted continuation
     cue, list-style stripped so it doesn't get its own bullet dot. */
  .tldr-card-body .tldr li.tldr-more {
    list-style: none;
    margin-left: -1rem;
    color: var(--soft);
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    font-style: normal;
  }

  /* DE-fallback chip — shown in a card's kicker when the active language has
     no translation for this date and the card is showing the DE original.
     Understated outline so it informs without competing with the accent. */
  .tldr-card-head .fallback-flag {
    font-family: var(--font-mono);
    font-size: 0.58rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--soft);
    border: 1px solid var(--rule);
    border-radius: var(--radius-inline);
    padding: 0.02rem 0.3rem;
    text-transform: uppercase;
    flex: none;
  }

  .tldr-read {
    background: transparent; border: none; color: var(--fg);
    font-family: var(--font-mono);
    font-weight: 600; cursor: pointer;
    font-size: 0.78rem; text-align: left;
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 0.7rem 0.2rem 0.4rem 0; margin-top: auto;
    min-height: 2.25rem;
    border-radius: var(--radius-inline);
  }
  .tldr-read:focus-visible {
    outline: 2px solid var(--cat-accent);
    outline-offset: 2px;
  }
  .tldr-read:hover { text-decoration: underline; }
  .tldr-empty {
    font-family: var(--font-body);
    font-size: 0.88rem; color: var(--soft); font-style: italic; padding: 0.4rem 0;
  }

     so the category identity is preserved, but the body is muted, dashed,
     and self-evidently dormant. Not clickable. */
  .tldr-card--empty {
    cursor: default;
    background: color-mix(in srgb, var(--bg) 50%, var(--panel));
    box-shadow: none;
  }
  .tldr-card--empty:hover {
    transform: none;
    box-shadow: none;
  }
  .tldr-card--empty .tile-date {
    color: var(--rule);
  }
  .tldr-empty-block {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.5rem;
    padding: 1.2rem 0.4rem 0.8rem;

    border-bottom: 1px dashed var(--rule);
    margin: 0.4rem 0 0;
  }
  .tldr-empty-kicker {

    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.7rem;
    color: var(--cat-accent, var(--muted-ink));
    font-weight: 600;
  }
  .tldr-empty-msg {
    font-family: var(--font-body);
    font-size: 0.88rem;
    color: var(--muted-ink);
    line-height: 1.5;
    font-style: italic;
    margin: 0;

  /* Per-category accents — each card scopes its own --cat-accent and
     --cat-accent-text so descendant rules (kicker tile-name, accent bar above
     the headline, drop cap, chips, CTA) all pick up the right colour. */
  .tldr-card[data-cat="economy"]        { --cat-accent: var(--c-economy);        --cat-accent-text: var(--c-economy-text); }
  .tldr-card[data-cat="software"]       { --cat-accent: var(--c-software);       --cat-accent-text: var(--c-software-text); }
  .tldr-card[data-cat="ai-dev"]         { --cat-accent: var(--c-ai-dev);         --cat-accent-text: var(--c-ai-dev-text); }

  .tldr-card .tldr-read { color: var(--cat-accent-text); }

  /* Loading */
  .loading {
    position: absolute; inset: 0;

  [data-cat="learn-language"] .cat-color { background: var(--c-learn-language); }

  /* Sidebar rows scope their own --cat-accent so the archive calendar's border,
     day rings and selected-day fill match the category colour. */
  .cat[data-cat="economy"]        { --cat-accent: var(--c-economy); }
  .cat[data-cat="software"]       { --cat-accent: var(--c-software); }
  .cat[data-cat="ai-dev"]         { --cat-accent: var(--c-ai-dev); }

  /* Home button — the "Übersicht" control at the top of the nav dropdown
     panel. Black accent bar (the dashboard's "house" colour) + favicon-style
     M brand mark + label, styled like a terminal .dropdown-item row. */
  .home-btn {

    width: 6px; height: 18px; border-radius: 0; flex: none;

  }
  /* Brand mark = the favicon design at category-icon size. */
  .home-btn .brand-mark {
    width: 1.1rem;
    height: 1.1rem;
    flex: none;
  }
  .home-btn:focus-visible,

    outline-offset: -2px;
  }

  /* ────────────────────────────────────────────────────────────────────
     Mobile / narrow responsiveness — the nav-rail becomes an off-canvas
     drawer (the .app-shell collapses to a single main column), toggled by
     the floating .rail-fab. The header keeps brand + history controls.
     ──────────────────────────────────────────────────────────────────── */
  @media (max-width: 720px) {
    header.app { padding: 0 0.75rem; gap: 0.6rem; }

    .home h2 { font-size: 1.2rem; }
    .status-controls { gap: 0.9rem; }

    /* Single main column; the rail floats as an off-canvas drawer pinned
       under the header / above the footer, slid off to the right until opened. */
    .app-shell,
    .app-shell.rail-collapsed { grid-template-columns: 1fr; }
    .nav-rail {
      position: fixed;
      top: 3rem;
      right: 0;
      bottom: 2rem;
      width: min(80vw, 18rem);
      transform: translateX(100%);
      transition: transform 0.2s ease;
      z-index: 56;

    .app-shell.rail-collapsed .nav-rail-title,
    .app-shell.rail-collapsed .nav-label,
    .app-shell.rail-collapsed .cat-name,
    .app-shell.rail-collapsed .cat-latest,
    .app-shell.rail-collapsed .cat-toggle,
    .app-shell.rail-collapsed .cat-dates,

    .app-shell.rail-collapsed .nav-rail-head { justify-content: flex-start; padding: 0.4rem 0.85rem; }
    .app-shell.rail-collapsed .cat-head,
    .app-shell.rail-collapsed .home-btn {
      justify-content: flex-start; padding-left: 0.85rem; padding-right: 0.85rem; gap: 0.55rem;

    .rail-fab { display: inline-flex; align-items: center; justify-content: center; }
  }
  @media (max-width: 400px) {
    header.app { padding: 0 0.6rem; }
    .header-brand .brand-word { font-size: 0.85rem; }

<!-- Terminal header bar (mirrors pagr): LEFT brand wordmark + cursor; RIGHT the
     nav-rail minimize toggle. The grouped category nav lives in the sticky right
     sidebar (.nav-rail). -->
<header class="app">

    </button>
  </div>
</header>

<div class="app-shell">

  </main>

  <!-- Sticky right sidebar: the relocated Übersicht control (#home-btn) and the
       grouped category nav (#nav-groups, populated by JS from NAV_GROUPS). Can be
       minimized to an icon-only strip; collapsed state persists in localStorage. -->
  <aside class="nav-rail" id="nav-rail" aria-label="Navigation">

      <span class="nav-rail-title">~/briefs</span>
    </div>
    <div class="nav-rail-body">

        <span class="cat-color"></span>
        <!-- Full favicon design inline: dark frame + cream page + red
             double-rule + serif M. Identical SVG to favicon.svg so the
             browser tab and the home control read as the same "house" mark. -->
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">

           nav (Wirtschaft / IT / jobs / Sport / Freizeit / Sprachen), each group
           with its own .nav-label header (standalone groups render headerless). --></div>
    </div>
  </aside>
</div>

        aria-label="Navigation öffnen" title="Navigation">☰</button>

    </nav>
  </div>
</footer>

      "latestTldrHtml": "<div class=\"tldr\"><h2>Das Wichtigste in 30 Sekunden</h2>\n    <p class=\"lead\">Der Real hat gestern über ein Prozent verloren, während der Dollar gegen den Rest der Welt stillstand. Ausgelöst haben das zwei brasilianische Nachrichten — ein Inflationswert einen Tick über der Erwartung und eine Wahlumfrage, die dem Markt nicht gefiel. Für Daniels Umtauschkurs ist das die beste Lage seit zwei Monaten. Und wie am Vortag hat der ECB-Fix die Bewegung nicht mehr gesehen: Heute wiederholt sich das Muster, denn die US-Inflationszahl kommt fünfzehn Minuten nach dem Fix.</p>\n    <ul>\n      <li><span class=\"chip hot\">FX</span> <strong>Kassa 5,9666</strong> (12.08., 02:14 BRT) — <strong>1,28 % über</strong> dem gestrigen ECB-Fix von <strong>5,8910</strong>. Höher als jeder ECB-Fix seit dem 10.06.2026.</li>\n      <li><span class=\"chip\">CHECK</span> <strong>Der Kreuzkurs bestätigt die Kassa.</strong> USD/BRL 5,1743 × EUR/USD 1,1533 = <strong>5,9675</strong> — nur <strong>0,02 %</strong> neben der gehandelten Kassa, weit unter der 0,5-%-Schwelle.</li>\n      <li><span class=\"chip hot\">AUSLÖSER</span> <strong>CNT/MDA-Umfrage:</strong> Lula 48 % gegen Flávio Bolsonaro 39,1 % in der Stichwahl. Der Markt liest den Vorsprung als Fiskal-Risiko und verlangt sofort mehr Prämie.</li>\n      <li><span class=\"chip\">DATEN</span> <strong>Juli-IPCA 0,07 % im Monat</strong> gegen 0,03 % erwartet — im Jahr auf <strong>4,44 %</strong> gefallen, erstmals wieder unter der Zielobergrenze von 4,50 %.</li>\n      <li><span class=\"chip hot\">HEUTE</span> <strong>US-Juli-Inflation 09:30 BRT</strong>, der ECB-Fix schon um 09:15 BRT — <em>vor</em> der Zahl. Die Zahl liegt noch nicht vor; hier steht bewusst keine.</li>\n      <li><span class=\"chip good\">UMTAUSCH</span> <strong>Bestes Fenster seit Juni:</strong> 100 € bringen <strong>596,66 R$</strong> statt 577,75 R$ am Monatstief — auf 5.000 € rund <strong>945 R$ mehr</strong>.</li>\n      <li><span class=\"chip hot\">BESTÄTIGUNG</span> <strong>EWZ −3,44 %</strong> auf 33,98 $ am 11.08. Aktien und Währung fielen gemeinsam: Brasilien-Risiko, kein Dollar-Effekt.</li>\n      <li><span class=\"chip\">PROGNOSE-TEST</span> Gestern hier für den Fix: <strong>5,86–5,93, Punkt 5,89</strong>. Gekommen ist <strong>5,8910</strong> — richtige Zahl, falsche Begründung.</li>\n      <li><span class=\"chip\">KORB</span> <strong>DXY 99,8754</strong> (12.08.) gegen 99,8383 (11.08.) — <strong>+0,04 %</strong>. Nicht der Dollar wurde stärker, der Real wurde schwächer.</li>\n      <li><span class=\"chip\">ZINSEN</span> <strong>Selic 14,00 %</strong> gegen Fed <strong>3,50–3,75 %</strong>. Der Vorsprung trägt den Real weiter — gestern hat er bewiesen, dass er kein Airbag ist.</li>\n    </ul></div>",
      "latestTldrHtmlByLang": {
        "de": "<div class=\"tldr\"><h2>Das Wichtigste in 30 Sekunden</h2>\n    <p class=\"lead\">Der Real hat gestern über ein Prozent verloren, während der Dollar gegen den Rest der Welt stillstand. Ausgelöst haben das zwei brasilianische Nachrichten — ein Inflationswert einen Tick über der Erwartung und eine Wahlumfrage, die dem Markt nicht gefiel. Für Daniels Umtauschkurs ist das die beste Lage seit zwei Monaten. Und wie am Vortag hat der ECB-Fix die Bewegung nicht mehr gesehen: Heute wiederholt sich das Muster, denn die US-Inflationszahl kommt fünfzehn Minuten nach dem Fix.</p>\n    <ul>\n      <li><span class=\"chip hot\">FX</span> <strong>Kassa 5,9666</strong> (12.08., 02:14 BRT) — <strong>1,28 % über</strong> dem gestrigen ECB-Fix von <strong>5,8910</strong>. Höher als jeder ECB-Fix seit dem 10.06.2026.</li>\n      <li><span class=\"chip\">CHECK</span> <strong>Der Kreuzkurs bestätigt die Kassa.</strong> USD/BRL 5,1743 × EUR/USD 1,1533 = <strong>5,9675</strong> — nur <strong>0,02 %</strong> neben der gehandelten Kassa, weit unter der 0,5-%-Schwelle.</li>\n      <li><span class=\"chip hot\">AUSLÖSER</span> <strong>CNT/MDA-Umfrage:</strong> Lula 48 % gegen Flávio Bolsonaro 39,1 % in der Stichwahl. Der Markt liest den Vorsprung als Fiskal-Risiko und verlangt sofort mehr Prämie.</li>\n      <li><span class=\"chip\">DATEN</span> <strong>Juli-IPCA 0,07 % im Monat</strong> gegen 0,03 % erwartet — im Jahr auf <strong>4,44 %</strong> gefallen, erstmals wieder unter der Zielobergrenze von 4,50 %.</li>\n      <li><span class=\"chip hot\">HEUTE</span> <strong>US-Juli-Inflation 09:30 BRT</strong>, der ECB-Fix schon um 09:15 BRT — <em>vor</em> der Zahl. Die Zahl liegt noch nicht vor; hier steht bewusst keine.</li>\n      <li><span class=\"chip good\">UMTAUSCH</span> <strong>Bestes Fenster seit Juni:</strong> 100 € bringen <strong>596,66 R$</strong> statt 577,75 R$ am Monatstief — auf 5.000 € rund <strong>945 R$ mehr</strong>.</li>\n      <li><span class=\"chip hot\">BESTÄTIGUNG</span> <strong>EWZ −3,44 %</strong> auf 33,98 $ am 11.08. Aktien und Währung fielen gemeinsam: Brasilien-Risiko, kein Dollar-Effekt.</li>\n      <li><span class=\"chip\">PROGNOSE-TEST</span> Gestern hier für den Fix: <strong>5,86–5,93, Punkt 5,89</strong>. Gekommen ist <strong>5,8910</strong> — richtige Zahl, falsche Begründung.</li>\n      <li><span class=\"chip\">KORB</span> <strong>DXY 99,8754</strong> (12.08.) gegen 99,8383 (11.08.) — <strong>+0,04 %</strong>. Nicht der Dollar wurde stärker, der Real wurde schwächer.</li>\n      <li><span class=\"chip\">ZINSEN</span> <strong>Selic 14,00 %</strong> gegen Fed <strong>3,50–3,75 %</strong>. Der Vorsprung trägt den Real weiter — gestern hat er bewiesen, dass er kein Airbag ist.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><h2>The Essentials in 30 Seconds</h2>\n    <p class=\"lead\">The real lost more than one percent yesterday while the dollar stood still against the rest of the world. Two Brazilian headlines triggered it — an inflation reading a tick above expectations and an election poll the market didn't like. For Daniel's exchange rate, that's the best window in two months. And just like the day before, the ECB fix never saw the move: today repeats the pattern, since the US inflation number lands fifteen minutes after the fix.</p>\n    <ul>\n      <li><span class=\"chip hot\">FX</span> <strong>Spot 5.9666</strong> (Aug 12, 02:14 BRT) — <strong>1.28% above</strong> yesterday's ECB fix of <strong>5.8910</strong>. Higher than any ECB fix since Jun 10, 2026.</li>\n      <li><span class=\"chip\">CHECK</span> <strong>The cross rate confirms the spot.</strong> USD/BRL 5.1743 × EUR/USD 1.1533 = <strong>5.9675</strong> — only <strong>0.02%</strong> off the traded spot, well under the 0.5% threshold.</li>\n      <li><span class=\"chip hot\">TRIGGER</span> <strong>CNT/MDA poll:</strong> Lula at 48% against Senator Flávio Bolsonaro's 39.1% in a runoff matchup. The market reads the lead as fiscal risk and immediately demands more premium.</li>\n      <li><span class=\"chip\">DATA</span> <strong>July IPCA 0.07% for the month</strong> against 0.03% expected — the annual rate fell to <strong>4.44%</strong>, back below the 4.50% target ceiling for the first time.</li>\n      <li><span class=\"chip hot\">TODAY</span> <strong>US July inflation at 09:30 BRT</strong>, the ECB fix already at 09:15 BRT — <em>before</em> the number. The figure isn't available yet; deliberately no number here.</li>\n      <li><span class=\"chip good\">EXCHANGE</span> <strong>Best window since June:</strong> €100 buys <strong>R$596.66</strong> instead of R$577.75 at the monthly low — on €5,000, roughly <strong>R$945 more</strong>.</li>\n      <li><span class=\"chip hot\">CONFIRMATION</span> <strong>EWZ −3.44%</strong> to $33.98 on Aug 11. Stocks and currency fell together: Brazil risk, not a dollar effect.</li>\n      <li><span class=\"chip\">FORECAST TEST</span> Yesterday here, for the fix: <strong>5.86–5.93, point estimate 5.89</strong>. What came in was <strong>5.8910</strong> — right number, wrong reasoning.</li>\n      <li><span class=\"chip\">BASKET</span> <strong>DXY 99.8754</strong> (Aug 12) against 99.8383 (Aug 11) — <strong>+0.04%</strong>. It wasn't the dollar getting stronger, it was the real getting weaker.</li>\n      <li><span class=\"chip\">RATES</span> <strong>Selic 14.00%</strong> against Fed <strong>3.50–3.75%</strong>. The gap keeps carrying the real — yesterday it proved it's not an airbag.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><h2>O essencial em 30 segundos</h2>\n    <p class=\"lead\">O real perdeu mais de um por cento ontem, enquanto o dólar ficou parado contra o resto do mundo. Duas notícias brasileiras dispararam isso — um dado de inflação um pouco acima do esperado e uma pesquisa eleitoral que o mercado não gostou. Para a cotação de câmbio de Daniel, essa é a melhor janela em dois meses. E, como no dia anterior, o fixing do BCE não chegou a ver o movimento: hoje o padrão se repete, porque o dado de inflação dos EUA sai quinze minutos depois do fixing.</p>\n    <ul>\n      <li><span class=\"chip hot\">FX</span> <strong>Cotação à vista 5,9666</strong> (12/08, 02h14, horário de Brasília) — <strong>1,28% acima</strong> do fixing do BCE de ontem, de <strong>5,8910</strong>. Mais alto que qualquer fixing do BCE desde 10/06/2026.</li>\n      <li><span class=\"chip\">VERIFICAÇÃO</span> <strong>O câmbio cruzado confirma a cotação à vista.</strong> USD/BRL 5,1743 × EUR/USD 1,1533 = <strong>5,9675</strong> — apenas <strong>0,02%</strong> de diferença da cotação negociada, bem abaixo do limite de 0,5%.</li>\n      <li><span class=\"chip hot\">GATILHO</span> <strong>Pesquisa CNT/MDA:</strong> Lula com 48% contra 39,1% do senador Flávio Bolsonaro em um segundo turno hipotético. O mercado lê a vantagem como risco fiscal e exige mais prêmio na hora.</li>\n      <li><span class=\"chip\">DADOS</span> <strong>IPCA de julho em 0,07% no mês</strong> contra 0,03% esperado — no acumulado de 12 meses, caiu para <strong>4,44%</strong>, de volta abaixo do teto da meta de 4,50% pela primeira vez.</li>\n      <li><span class=\"chip hot\">HOJE</span> <strong>Inflação de julho dos EUA às 09h30, horário de Brasília</strong>, o fixing do BCE já sai às 09h15 — <em>antes</em> do dado. O número ainda não está disponível; propositalmente, não há valor aqui.</li>\n      <li><span class=\"chip good\">TROCA</span> <strong>Melhor janela desde junho:</strong> 100 € rendem <strong>R$ 596,66</strong> em vez de R$ 577,75 na mínima do mês — em 5.000 €, cerca de <strong>R$ 945 a mais</strong>.</li>\n      <li><span class=\"chip hot\">CONFIRMAÇÃO</span> <strong>EWZ −3,44%</strong>, para US$ 33,98, em 11/08. Ações e moeda caíram juntas: risco Brasil, não efeito dólar.</li>\n      <li><span class=\"chip\">TESTE DE PREVISÃO</span> Ontem aqui, para o fixing: <strong>5,86–5,93, ponto central 5,89</strong>. Veio <strong>5,8910</strong> — número certo, justificativa errada.</li>\n      <li><span class=\"chip\">CESTA</span> <strong>DXY em 99,8754</strong> (12/08) contra 99,8383 (11/08) — <strong>+0,04%</strong>. Não foi o dólar que ficou mais forte, foi o real que ficou mais fraco.</li>\n      <li><span class=\"chip\">JUROS</span> <strong>Selic em 14,00%</strong> contra Fed em <strong>3,50–3,75%</strong>. A vantagem continua sustentando o real — ontem ela provou que não é um airbag.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><h2>Lo esencial en 30 segundos</h2>\n    <p class=\"lead\">El real perdió más de un uno por ciento ayer, mientras el dólar se quedó quieto frente al resto del mundo. Dos noticias brasileñas lo desataron — un dato de inflación apenas por encima de lo esperado y una encuesta electoral que no le gustó al mercado. Para el tipo de cambio de Daniel, esta es la mejor ventana en dos meses. Y, igual que el día anterior, el fixing del BCE no llegó a ver el movimiento: hoy se repite el patrón, porque el dato de inflación de EE. UU. sale quince minutos después del fixing.</p>\n    <ul>\n      <li><span class=\"chip hot\">FX</span> <strong>Spot 5,9666</strong> (12/08, 02:14 hora de Brasilia) — <strong>1,28% por encima</strong> del fixing del BCE de ayer, de <strong>5,8910</strong>. Más alto que cualquier fixing del BCE desde el 10/06/2026.</li>\n      <li><span class=\"chip\">VERIFICACIÓN</span> <strong>El tipo de cambio cruzado confirma el spot.</strong> USD/BRL 5,1743 × EUR/USD 1,1533 = <strong>5,9675</strong> — solo <strong>0,02%</strong> de diferencia respecto al spot negociado, muy por debajo del umbral del 0,5%.</li>\n      <li><span class=\"chip hot\">DETONANTE</span> <strong>Encuesta CNT/MDA:</strong> Lula con 48% contra 39,1% del senador Flávio Bolsonaro en una segunda vuelta hipotética. El mercado lee la ventaja como riesgo fiscal y exige más prima de inmediato.</li>\n      <li><span class=\"chip\">DATOS</span> <strong>IPCA de julio en 0,07% mensual</strong> frente a 0,03% esperado — en el acumulado interanual, bajó a <strong>4,44%</strong>, de vuelta por debajo del techo de la meta de 4,50% por primera vez.</li>\n      <li><span class=\"chip hot\">HOY</span> <strong>Inflación de julio de EE. UU. a las 09:30 hora de Brasilia</strong>, el fixing del BCE ya a las 09:15 — <em>antes</em> del dato. La cifra todavía no está disponible; deliberadamente no aparece aquí.</li>\n      <li><span class=\"chip good\">CAMBIO</span> <strong>Mejor ventana desde junio:</strong> 100 € rinden <strong>R$596,66</strong> en vez de R$577,75 en el mínimo del mes — en 5.000 €, unos <strong>R$945 más</strong>.</li>\n      <li><span class=\"chip hot\">CONFIRMACIÓN</span> <strong>EWZ −3,44%</strong>, a US$33,98, el 11/08. Acciones y moneda cayeron juntas: riesgo Brasil, no efecto dólar.</li>\n      <li><span class=\"chip\">PRUEBA DE PRONÓSTICO</span> Ayer aquí, para el fixing: <strong>5,86–5,93, punto central 5,89</strong>. Llegó a <strong>5,8910</strong> — cifra correcta, razonamiento equivocado.</li>\n      <li><span class=\"chip\">CANASTA</span> <strong>DXY en 99,8754</strong> (12/08) contra 99,8383 (11/08) — <strong>+0,04%</strong>. No fue el dólar el que se fortaleció, fue el real el que se debilitó.</li>\n      <li><span class=\"chip\">TASAS</span> <strong>Selic en 14,00%</strong> contra Fed en <strong>3,50–3,75%</strong>. La ventaja sigue sosteniendo al real — ayer demostró que no es un airbag.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Microsoft hat gestern einen der größten Patchdays überhaupt ausgeliefert — <strong>421</strong> Schwachstellen, sagt Rapid7; <strong>400</strong>, sagt BleepingComputer; beide zählen dieselbe Veröffentlichung. Der Rekord steht weiter beim Juli mit <strong>570</strong>. Wenige Stunden später stand der Gegenbeweis im Netz: <strong>ShieldBreak</strong> umgeht Microsofts <em>Juli</em>-Fix für CVE-2026-50656 mit 100 % Erfolgsquote. Und während alle auf die neue SharePoint-Kette schauen, läuft Ransomware über eine SharePoint-Lücke, für die es seit <strong>Ende Mai</strong> einen Patch gibt. Der Engpass ist nicht das Angebot an Patches.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>Patchday-Volumen</strong>: 421 CVEs (Rapid7) bzw. 400 (BleepingComputer), 236 davon in Windows — einer der größten Patchdays überhaupt, aber unter dem Juli-Rekord von 570. Ein aktiv ausgenutzter Zero-Day: <strong>CVE-2026-68820</strong>, Rechteausweitung im WinSock-Treiber. <span class=\"chip\">USA</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>ShieldBreak</strong>: PoC umgeht den Juli-Patch für CVE-2026-50656 („RoguePlanet\") vollständig, <strong>100 % Erfolgsquote</strong> auf Windows 11 25H2 und Server 2025. Microsoft schweigt, kein Fix. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>SharePoint</strong>: Die Rapid7-Kette ist komplett — <strong>CVE-2026-63520</strong> (8,1) plus der Juli-Auth-Bypass CVE-2026-55040 ergeben unauthentifizierte RCE. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Ransomware auf Mai-Patch</strong>: CVE-2026-45659 (8,8) wird für Erpressung ausgenutzt; Shadowserver fand am Montag noch <strong>über 200</strong> ungepatchte Server, rund ein Dutzend in Deutschland. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>npm-Wurm mit Zählproblem</strong>: <strong>444 Pakete</strong> — aber 1.381 (Aikido) oder 2.234 (SafeDep) vergiftete Versionen. Persistenz über <code>tasks.json</code> und Agenten-Hooks. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>SAP-Patchday</strong>: 33 Security Notes, darunter eine <strong>10,0</strong> in der Commerce Cloud (Note 3771065) und 9,8 im ABAP-DIAG-Parser. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Regulierung</span> <strong>AI Act scharf</strong>: Seit 02.08. setzt das AI Office die Transparenzpflichten durch — Chatbots müssen sich zu erkennen geben, Deepfakes gekennzeichnet werden. Trifft auch Auftragsentwickler. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>Kernel</strong>: Mainline steht weiter bei <strong>7.2-rc7</strong>; Torvalds peilt das Finale aufs Wochenende. Tailscale-K8s-Operator 1.102.2 ist raus. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>KEV-Woche</strong>: fünf CVEs neu im Katalog (Langflow 9,8 · Tomcat 7,5 · N-central 8,2 · LoadMaster 9,6) — drei von fünf sind Rand-Systeme. <span class=\"chip\">USA</span></li>\n    </ul></div>",
      "latestTldrHtmlByLang": {
        "de": "<div class=\"tldr\"><p class=\"lead\">Microsoft hat gestern einen der größten Patchdays überhaupt ausgeliefert — <strong>421</strong> Schwachstellen, sagt Rapid7; <strong>400</strong>, sagt BleepingComputer; beide zählen dieselbe Veröffentlichung. Der Rekord steht weiter beim Juli mit <strong>570</strong>. Wenige Stunden später stand der Gegenbeweis im Netz: <strong>ShieldBreak</strong> umgeht Microsofts <em>Juli</em>-Fix für CVE-2026-50656 mit 100 % Erfolgsquote. Und während alle auf die neue SharePoint-Kette schauen, läuft Ransomware über eine SharePoint-Lücke, für die es seit <strong>Ende Mai</strong> einen Patch gibt. Der Engpass ist nicht das Angebot an Patches.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>Patchday-Volumen</strong>: 421 CVEs (Rapid7) bzw. 400 (BleepingComputer), 236 davon in Windows — einer der größten Patchdays überhaupt, aber unter dem Juli-Rekord von 570. Ein aktiv ausgenutzter Zero-Day: <strong>CVE-2026-68820</strong>, Rechteausweitung im WinSock-Treiber. <span class=\"chip\">USA</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>ShieldBreak</strong>: PoC umgeht den Juli-Patch für CVE-2026-50656 („RoguePlanet\") vollständig, <strong>100 % Erfolgsquote</strong> auf Windows 11 25H2 und Server 2025. Microsoft schweigt, kein Fix. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>SharePoint</strong>: Die Rapid7-Kette ist komplett — <strong>CVE-2026-63520</strong> (8,1) plus der Juli-Auth-Bypass CVE-2026-55040 ergeben unauthentifizierte RCE. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Ransomware auf Mai-Patch</strong>: CVE-2026-45659 (8,8) wird für Erpressung ausgenutzt; Shadowserver fand am Montag noch <strong>über 200</strong> ungepatchte Server, rund ein Dutzend in Deutschland. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>npm-Wurm mit Zählproblem</strong>: <strong>444 Pakete</strong> — aber 1.381 (Aikido) oder 2.234 (SafeDep) vergiftete Versionen. Persistenz über <code>tasks.json</code> und Agenten-Hooks. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>SAP-Patchday</strong>: 33 Security Notes, darunter eine <strong>10,0</strong> in der Commerce Cloud (Note 3771065) und 9,8 im ABAP-DIAG-Parser. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Regulierung</span> <strong>AI Act scharf</strong>: Seit 02.08. setzt das AI Office die Transparenzpflichten durch — Chatbots müssen sich zu erkennen geben, Deepfakes gekennzeichnet werden. Trifft auch Auftragsentwickler. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>Kernel</strong>: Mainline steht weiter bei <strong>7.2-rc7</strong>; Torvalds peilt das Finale aufs Wochenende. Tailscale-K8s-Operator 1.102.2 ist raus. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>KEV-Woche</strong>: fünf CVEs neu im Katalog (Langflow 9,8 · Tomcat 7,5 · N-central 8,2 · LoadMaster 9,6) — drei von fünf sind Rand-Systeme. <span class=\"chip\">USA</span></li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Yesterday Microsoft shipped one of the biggest Patch Tuesdays ever — <strong>421</strong> vulnerabilities, says Rapid7; <strong>400</strong>, says BleepingComputer; both are counting the same release. The record still belongs to July, at <strong>570</strong>. A few hours later, the counter-evidence was online: <strong>ShieldBreak</strong> bypasses Microsoft's <em>July</em> fix for CVE-2026-50656 with a 100% success rate. And while everyone's watching the new SharePoint chain, ransomware is running through a SharePoint hole that's had a patch since <strong>the end of May</strong>. The bottleneck isn't the supply of patches.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>Patch Tuesday Volume</strong>: 421 CVEs (Rapid7) or 400 (BleepingComputer), 236 of them in Windows — one of the biggest Patch Tuesdays ever, but below July's record of 570. One actively exploited zero-day: <strong>CVE-2026-68820</strong>, a privilege escalation in the WinSock driver. <span class=\"chip\">USA</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>ShieldBreak</strong>: PoC fully bypasses the July patch for CVE-2026-50656 (\"RoguePlanet\"), <strong>100% success rate</strong> on Windows 11 25H2 and Server 2025. Microsoft stays silent, no fix. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>SharePoint</strong>: Rapid7's chain is complete — <strong>CVE-2026-63520</strong> (8.1) plus the July auth bypass CVE-2026-55040 add up to unauthenticated RCE. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Ransomware on a May Patch</strong>: CVE-2026-45659 (8.8) is being exploited for extortion; Shadowserver still found <strong>over 200</strong> unpatched servers on Monday, around a dozen in Germany. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>npm Worm With a Counting Problem</strong>: <strong>444 packages</strong> — but 1,381 (Aikido) or 2,234 (SafeDep) poisoned versions. Persistence via <code>tasks.json</code> and agent hooks. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>SAP Patch Day</strong>: 33 security notes, including a <strong>10.0</strong> in Commerce Cloud (Note 3771065) and a 9.8 in the ABAP DIAG parser. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Regulation</span> <strong>AI Act Goes Live</strong>: Since 08/02, the AI Office has been enforcing the transparency obligations — chatbots must identify themselves, deepfakes must be labeled. Contract developers are affected too. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>Kernel</strong>: Mainline still sits at <strong>7.2-rc7</strong>; Torvalds is aiming for the final release this weekend. The Tailscale K8s operator 1.102.2 is out. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>KEV Week</strong>: five CVEs newly added to the catalog (Langflow 9.8 · Tomcat 7.5 · N-central 8.2 · LoadMaster 9.6) — three of five are edge systems. <span class=\"chip\">USA</span></li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Ontem a Microsoft lançou um dos maiores Patch Tuesdays de todos os tempos — <strong>421</strong> vulnerabilidades, segundo a Rapid7; <strong>400</strong>, segundo a BleepingComputer; ambas contam o mesmo lançamento. O recorde continua sendo o de julho, com <strong>570</strong>. Poucas horas depois, surgiu a prova em contrário na rede: o <strong>ShieldBreak</strong> contorna a correção de <em>julho</em> da Microsoft para a CVE-2026-50656 com 100% de taxa de sucesso. E enquanto todo mundo olha para a nova cadeia do SharePoint, um ransomware está passando por uma falha do SharePoint que tem correção desde o <strong>fim de maio</strong>. O gargalo não é a oferta de patches.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>Volume do Patch Tuesday</strong>: 421 CVEs (Rapid7) ou 400 (BleepingComputer), 236 deles no Windows — um dos maiores Patch Tuesdays de todos os tempos, mas abaixo do recorde de julho, de 570. Um zero-day ativamente explorado: <strong>CVE-2026-68820</strong>, escalada de privilégios no driver WinSock. <span class=\"chip\">USA</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>ShieldBreak</strong>: PoC contorna totalmente o patch de julho para a CVE-2026-50656 (\"RoguePlanet\"), <strong>100% de taxa de sucesso</strong> no Windows 11 25H2 e Server 2025. Microsoft fica em silêncio, sem correção. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>SharePoint</strong>: a cadeia da Rapid7 está completa — <strong>CVE-2026-63520</strong> (8,1) mais o auth bypass de julho, a CVE-2026-55040, resultam em RCE não autenticada. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Ransomware em patch de maio</strong>: a CVE-2026-45659 (8,8) está sendo explorada para extorsão; a Shadowserver ainda encontrou <strong>mais de 200</strong> servidores sem correção na segunda-feira, cerca de uma dúzia na Alemanha. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Worm no npm com problema de contagem</strong>: <strong>444 pacotes</strong> — mas 1.381 (Aikido) ou 2.234 (SafeDep) versões envenenadas. Persistência via <code>tasks.json</code> e hooks de agentes. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Patch Day da SAP</strong>: 33 security notes, incluindo uma <strong>10,0</strong> na Commerce Cloud (Note 3771065) e uma 9,8 no parser DIAG do ABAP. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Regulação</span> <strong>AI Act em vigor</strong>: desde 02/08, o AI Office está fazendo cumprir as obrigações de transparência — chatbots precisam se identificar, deepfakes precisam ser sinalizados. Atinge também desenvolvedores contratados. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>Kernel</strong>: a mainline segue em <strong>7.2-rc7</strong>; Torvalds mira o lançamento final para o fim de semana. Saiu o operador Kubernetes 1.102.2 da Tailscale. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Semana do KEV</strong>: cinco CVEs novos no catálogo (Langflow 9,8 · Tomcat 7,5 · N-central 8,2 · LoadMaster 9,6) — três de cinco são sistemas de borda. <span class=\"chip\">USA</span></li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Ayer Microsoft lanzó uno de los Patch Tuesday más grandes de la historia — <strong>421</strong> vulnerabilidades, según Rapid7; <strong>400</strong>, según BleepingComputer; ambas cuentan el mismo lanzamiento. El récord lo sigue teniendo julio, con <strong>570</strong>. Pocas horas después apareció la prueba en contra en la red: <strong>ShieldBreak</strong> elude el parche de <em>julio</em> de Microsoft para la CVE-2026-50656 con una tasa de éxito del 100%. Y mientras todos miran la nueva cadena de SharePoint, hay ransomware corriendo a través de una falla de SharePoint que tiene parche desde <strong>finales de mayo</strong>. El cuello de botella no es la oferta de parches.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>Volumen del Patch Tuesday</strong>: 421 CVE (Rapid7) o 400 (BleepingComputer), 236 de ellas en Windows — uno de los Patch Tuesday más grandes de la historia, pero por debajo del récord de julio, de 570. Un día cero activamente explotado: <strong>CVE-2026-68820</strong>, escalada de privilegios en el driver WinSock. <span class=\"chip\">USA</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>ShieldBreak</strong>: el PoC elude por completo el parche de julio para la CVE-2026-50656 (\"RoguePlanet\"), <strong>100% de tasa de éxito</strong> en Windows 11 25H2 y Server 2025. Microsoft guarda silencio, sin parche. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>SharePoint</strong>: la cadena de Rapid7 está completa — <strong>CVE-2026-63520</strong> (8,1) más el bypass de autenticación de julio, CVE-2026-55040, dan RCE no autenticada. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Ransomware sobre un parche de mayo</strong>: la CVE-2026-45659 (8,8) se está explotando para extorsión; Shadowserver todavía encontró <strong>más de 200</strong> servidores sin parchar el lunes, cerca de una docena en Alemania. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Gusano en npm con problema de conteo</strong>: <strong>444 paquetes</strong> — pero 1.381 (Aikido) o 2.234 (SafeDep) versiones envenenadas. Persistencia vía <code>tasks.json</code> y hooks de agentes. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Patch Day de SAP</strong>: 33 security notes, entre ellas una <strong>10,0</strong> en Commerce Cloud (Note 3771065) y una 9,8 en el parser DIAG de ABAP. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Regulación</span> <strong>La AI Act entra en vigor</strong>: desde el 02/08, la AI Office está haciendo cumplir las obligaciones de transparencia — los chatbots deben identificarse, los deepfakes deben marcarse. También afecta a desarrolladores contratados. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>Kernel</strong>: la mainline sigue en <strong>7.2-rc7</strong>; Torvalds apunta al lanzamiento final para el fin de semana. Salió el operador de Kubernetes 1.102.2 de Tailscale. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Semana del KEV</strong>: cinco CVE nuevas en el catálogo (Langflow 9,8 · Tomcat 7,5 · N-central 8,2 · LoadMaster 9,6) — tres de cinco son sistemas de borde. <span class=\"chip\">USA</span></li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Seit gestern ist kein Modell und kein Werkzeug erschienen. Der Tag gehört deshalb zwei Terminen in deinem Kalender, die beide nichts mit einer Ankündigung zu tun haben. Am <strong>19.08.</strong> endet die Aktion, die dein Claude-Code-Wochenkontingent seit Mai um die Hälfte anhebt — noch sieben Tage. Und im laufenden Quartal soll der Verkauf von Cursors Mutterfirma an SpaceX abgeschlossen werden: 60 Mrd. $ in Aktien, seit dem 16.06. angekündigt, bis heute nicht vollzogen. Dazwischen liegt eine Preisliste, die sich in den letzten drei Wochen unten stärker bewegt hat als oben — und ein sehr günstiger Tarif, den du nicht mit Geld bezahlst.</p>\n    <ul>\n      <li><span class=\"chip hot\">Tool</span> <strong>Cursor wechselt den Besitzer</strong>: 60 Mrd. $ im Aktientausch, Abschluss angekündigt für <span class=\"stat\">Q3 2026</span>, vorbehaltlich der Freigaben — vollzogen ist er nicht.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Was <em>nicht</em> bestätigt ist</strong>: „schließt nächste Woche\" und eine Umbenennung Richtung Grok stehen bei genau einem Aggregator-Blog. Nicht bei CNBC, nicht bei TechCrunch.</li>\n      <li><span class=\"chip hot\">Claude</span> <strong>+50 % Wochenkontingent nur noch bis 19.08.</strong>: wörtlich von @ClaudeDevs am 18.07. — „for all Pro, Max, Team, and seat-based Enterprise users\".</li>\n      <li><span class=\"chip\">Claude</span> <strong>Am 14.08. wird der Auto-Modus Vorgabe</strong> (hier am 11.08. berichtet). Mehr Kontingent und weniger Rückfragen in derselben Woche — das ist kein Zufall.</li>\n      <li><span class=\"chip good\">OpenAI</span> <strong>GPT-5.6 Luna kostet 0,20 $ / 1,20 $</strong> je Mio. Token — heute direkt von der Preisseite geholt. Das ist der Boden, an dem sich gerade alles ausrichtet.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Metas Contributor-Tarif</strong>: Muse Spark 1.2 steht regulär bei <span class=\"stat\">1,25 $ / 4,25 $</span>. Der billigere Zugang ist ein eigenes Modell — Kontingent nach Token, nicht nach Anfragen.</li>\n      <li><span class=\"chip\">OpenAI</span> <strong>„Astra\" wurde in einem Mathe-Beitrag versteckt</strong>: ein Wurzel-Agent, der Unteragenten startet. Kein Termin, kein Preis, keine Verfügbarkeit.</li>\n      <li><span class=\"chip\">Regeln</span> <strong>Verordnung 14409, richtiggestellt</strong>: Das Prüfverfahren bauen Finanzministerium, NSA und CISA — nicht das Handelsministerium. Bis zu 30 Tage Vorab-Zugang, ausdrücklich <em>keine</em> Genehmigungspflicht.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Heute kein Balkendiagramm</strong>: kein neuer unabhängig nachgerechneter Score. Die kursierenden 42 von 42 Punkten im Mathe-Wettbewerb stehen nicht auf Anthropics eigener Seite.</li>\n    </ul></div>",

        "en": "<div class=\"tldr\"><p class=\"lead\">No model and no tool has launched since yesterday. So today belongs to two dates on your calendar, neither of which has anything to do with an announcement. On <strong>Aug 19</strong>, the promotion that's been raising your Claude Code weekly quota by half since May comes to an end — seven days left. And this quarter, the sale of Cursor's parent company to SpaceX is supposed to close: $60B in stock, announced since Jun 16, still not finalized as of today. In between sits a pricing list that has moved more at the bottom than at the top over the last three weeks — and one very cheap tier you don't pay for with money.</p>\n    <ul>\n      <li><span class=\"chip hot\">Tool</span> <strong>Cursor changes hands</strong>: $60B stock swap, close announced for <span class=\"stat\">Q3 2026</span>, subject to approvals — not finalized yet.</li>\n      <li><span class=\"chip\">Tool</span> <strong>What's <em>not</em> confirmed</strong>: \"closes next week\" and a rebrand toward Grok appear on exactly one aggregator blog. Not at CNBC, not at TechCrunch.</li>\n      <li><span class=\"chip hot\">Claude</span> <strong>+50% weekly quota only until Aug 19</strong>: verbatim from @ClaudeDevs on Jul 18 — \"for all Pro, Max, Team, and seat-based Enterprise users.\"</li>\n      <li><span class=\"chip\">Claude</span> <strong>On Aug 14, auto mode becomes the default</strong> (reported here on Aug 11). More quota and fewer permission prompts in the same week — that's not a coincidence.</li>\n      <li><span class=\"chip good\">OpenAI</span> <strong>GPT-5.6 Luna costs $0.20 / $1.20</strong> per million tokens — pulled directly from the pricing page today. That's the floor everything else is aligning to right now.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Meta's contributor tier</strong>: Muse Spark 1.2 stands at a regular <span class=\"stat\">$1.25 / $4.25</span>. The cheaper access path is its own model — rate-limited by tokens, not by request count.</li>\n      <li><span class=\"chip\">OpenAI</span> <strong>\"Astra\" got smuggled into a math post</strong>: a root agent that spawns sub-agents. No date, no price, no availability.</li>\n      <li><span class=\"chip\">Rules</span> <strong>Executive Order 14409, corrected</strong>: the review process is being built by Treasury, the NSA, and CISA — not the Commerce Department. Up to 30 days of advance access, explicitly <em>no</em> licensing requirement.</li>\n      <li><span class=\"chip\">Bench</span> <strong>No bar chart today</strong>: no new independently reproduced score. The 42-of-42 math-competition claim making the rounds doesn't appear on Anthropic's own page.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Desde ontem, nenhum modelo e nenhuma ferramenta novos apareceram. Por isso, o dia é de dois compromissos na sua agenda, e nenhum deles tem a ver com anúncio. Em <strong>19/08</strong> termina a promoção que eleva pela metade seu limite semanal do Claude Code desde maio — faltam sete dias. E, neste trimestre, deve se fechar a venda da controladora da Cursor para a SpaceX: US$ 60 bilhões em ações, anunciada desde 16/06, ainda não concluída até hoje. No meio disso está uma lista de preços que, nas últimas três semanas, se mexeu mais embaixo do que em cima — e uma tarifa bem mais barata que você não paga em dinheiro.</p>\n    <ul>\n      <li><span class=\"chip hot\">Tool</span> <strong>A Cursor muda de dono</strong>: troca de ações de US$ 60 bilhões, fechamento anunciado para o <span class=\"stat\">terceiro trimestre de 2026</span>, sujeito às aprovações — ainda não concluído.</li>\n      <li><span class=\"chip\">Tool</span> <strong>O que <em>não</em> está confirmado</strong>: \"fecha semana que vem\" e uma troca de marca para Grok aparecem em exatamente um blog agregador. Não na CNBC, não no TechCrunch.</li>\n      <li><span class=\"chip hot\">Claude</span> <strong>+50% no limite semanal só até 19/08</strong>: literal, do @ClaudeDevs em 18/07 — \"for all Pro, Max, Team, and seat-based Enterprise users\".</li>\n      <li><span class=\"chip\">Claude</span> <strong>Em 14/08, o modo automático passa a ser padrão</strong> (reportado aqui em 11/08). Mais limite e menos confirmações na mesma semana — não é coincidência.</li>\n      <li><span class=\"chip good\">OpenAI</span> <strong>O GPT-5.6 Luna custa US$ 0,20 / US$ 1,20</strong> por milhão de tokens — pego hoje direto da página de preços. Esse é o piso ao redor do qual tudo está se alinhando agora.</li>\n      <li><span class=\"chip\">Tool</span> <strong>O plano contributor da Meta</strong>: o Muse Spark 1.2 está no regular a <span class=\"stat\">US$ 1,25 / US$ 4,25</span>. O acesso mais barato é um modelo à parte — limite por token, não por número de requisições.</li>\n      <li><span class=\"chip\">OpenAI</span> <strong>\"Astra\" foi escondido num post sobre matemática</strong>: um agente raiz que dispara subagentes. Sem data, sem preço, sem disponibilidade.</li>\n      <li><span class=\"chip\">Regras</span> <strong>Ordem executiva 14409, corrigida</strong>: quem está construindo o processo de revisão é o Tesouro, a NSA e a CISA — não o Departamento de Comércio. Até 30 dias de acesso antecipado, expressamente <em>sem</em> exigência de licenciamento.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Hoje sem gráfico de barras</strong>: nenhum novo escore recalculado de forma independente. Os 42 de 42 pontos na competição de matemática, que estão circulando, não aparecem na própria página da Anthropic.</li>\n    </ul></div>",

strong>: Muse Spark 1.2 está en el regular a <span class=\"stat\">$1,25 / $4,25</span>. El acceso más barato es un modelo aparte — límite por token, no por número de solicitudes.</li>\n      <li><span class=\"chip\">OpenAI</span> <strong>\"Astra\" se escondió en una publicación sobre matemáticas</strong>: un agente raíz que lanza subagentes. Sin fecha, sin precio, sin disponibilidad.</li>\n      <li><span class=\"chip\">Reglas</span> <strong>Orden ejecutiva 14409, corregida</strong>: quien construye el proceso de revisión es el Tesoro, la NSA y la CISA — no el Departamento de Comercio. Hasta 30 días de acceso anticipado, expresamente <em>sin</em> exigencia de licencia.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Hoy sin gráfica de barras</strong>: no hay ningún puntaje nuevo recalculado de forma independiente. Los 42 de 42 puntos en la competencia de matemáticas que circulan no aparecen en la propia página de Anthropic.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Heute hängen zwei sehr verschiedene Meldungen an derselben Frage: <strong>Erfährt der Mensch am anderen Ende, dass er es mit einer Maschine zu tun hat?</strong> In Berlin lässt der Bundesdigitalminister Reden und Gastbeiträge maschinell schreiben; das Ministerium hält eine Kennzeichnung für entbehrlich, solange ein Mensch drübergeschaut hat.<sup>[1]</sup> In den USA baut Google seit neun Monaten die andere Richtung: Agenten, die im Laden <em>anrufen</em>, Warenkörbe über Händlergrenzen hinweg führen und bei Preisziel selbst kaufen.<sup>[4][8]</sup> Beide Male entscheidet jemand anders darüber, was der Empfänger erfährt. Der eine Fall fällt nicht unter Artikel 50, der andere fände in der EU so gar nicht statt — und genau dieser Unterschied ist heute die interessantere Nachricht als jede Adoptionsstudie.</p>\n    <ul>\n      <li><span class=\"chip hot\">PUBLIC · DE</span> <strong>Ministerrede aus dem Sprachmodell — heute die Antwort, nicht die Enthüllung:</strong> Dass Bundesdigitalminister <strong>Karsten Wildberger</strong> (CDU) ganz oder teilweise KI-erzeugte Reden und Gastbeiträge verwendet hat, steht seit der <em>Zeit</em>-Recherche vom <strong>13.06.2026</strong> im Raum. Die Fraktion Die Linke fragte am <strong>17.07.2026</strong> per Kleiner Anfrage (Drucksache 21/7187) nach Modell, Prompts und Aktenlage; am <strong>10.08.2026</strong> wurde die Antwort des Ministeriums berichtet.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">POSITION</span> <strong>Und genau diese Antwort ist der Streitpunkt:</strong> KI sei ein <em>„alltägliches, unterstützendes Werkzeug\"</em> — solange ein Mensch das Ergebnis prüfe, sei <em>„in der Regel keine gesonderte Kennzeichnung erforderlich\"</em>.<sup>[1]</sup> Juristisch vertretbar. Politisch ist es ausgerechnet das Ressort, das die nationale Umsetzung der KI-Verordnung koordiniert — und es hatte drei Wochen Zeit, sich diesen Satz zu überlegen.</li>\n      <li><span class=\"chip good\">PUBLIC · DE</span> <strong>Der konstruktive Teil geht unter:</strong> Der Bund betreibt mit <strong>Kipitz</strong> (ITZBund) eine interne Plattform für eingestufte Dokumente ohne externen Datenabfluss, das Wirtschaftsministerium verlangt einen <strong>„KI-Führerschein\"</strong> als Zugangsvoraussetzung.<sup>[1]</sup></li>\n      <li><span class=\"chip\">CONSUMER · US</span> <strong>Bestandsaufnahme, kein Tagesereignis:</strong> Googles Konsumenten-Agenten sind in drei Wellen entstanden — Telefonanruf im Laden plus agentischer Checkout (13.11.2025), <em>Business Agent</em> in der Suche (12.01.2026), <strong>Universal Cart</strong> über Händlergrenzen (19.05.2026). Hier zum ersten Mal am Stück.<sup>[4][6][8]</sup></li>\n      <li><span class=\"chip\">HANDEL · US</span> <strong>Universal Cart ist der Bruch:</strong> ein Warenkorb, der in Suche, Gemini, YouTube und Gmail derselbe ist — <em>„across merchants and across services\"</em> — mit Google Pay als Kasse und AP2 als Zahlungs-Vollmacht. Rollout: <strong>USA, Sommer 2026</strong>, für die EU kein Termin.<sup>[8]</sup></li>\n      <li><span class=\"chip hot\">VORBEHALT</span> <strong>Die Vertrauenszahl ist dünn:</strong> <strong>73 %</strong> der Amerikaner seien <em>„uneasy\"</em>, wie KI ihre Einkaufsdaten nutzt, <strong>54 %</strong> fänden den Zugriff auf die Einkaufshistorie <em>„unappealing\"</em> — Quad/Harris Poll, n=2.180 US-Erwachsene, Feldzeit 05.–07.02.2026.<sup>[9]</sup> Methodisch solider als zunächst vermutet, misst aber Einstellung, nicht Verhalten.</li>\n      <li><span class=\"chip\">EINORDNUNG</span> <strong>Warum es den Anruf gibt:</strong> Googles eigene Spezifikation für Filialbestände verlangt als Pflichtfelder nur <em>id</em>, <em>store code</em> und <em>availability</em> — Menge und Preis optional, Aktualisierungsfrequenz nicht vorgeschrieben.<sup>[10]</sup> Der Telefon-Agent ersetzt Daten, die es nicht gibt.</li>\n      <li><span class=\"chip\">REG · EU</span> <strong>Artikel 50 läuft seit zehn Tagen</strong>, heute ohne neues Verfahren. Das nächste Datum, das beim Kunden ankommt, bleibt der <strong>02.12.2026</strong>.<sup>[2][3]</sup></li>\n      <li><span class=\"chip good\">twiceD</span> Zwei Ideen aus genau diesen zwei Meldungen: <strong>Verfügbarkeit als Datensatz</strong> statt als Telefonat — und die <strong>aktenfeste KI-Notiz</strong>, die die Kleine Anfrage abfragt.</li>\n    </ul></div>",
