      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Zwei Dinge sind diese Woche gleichzeitig passiert, und zusammen ergeben sie eine unangenehme Lage. Erstens spreizt sich der Preis für ein Coding-Modell auf das gut Hundertfache: 0,28 $ je Million Ausgabe-Token bei DeepSeeks V4-Flash gegen 30 $ bei GPT-5.6 Sol, mit Meta und Alibaba frisch dazwischen. Zweitens ist genau in diesem Monat die Instanz ausgefallen, die dir sagen könnte, ob der billige Anbieter reicht: Für keines der neuen Modelle existiert ein unabhängig nachgerechneter SWE-Bench-Verified-Wert. Und obendrauf nimmt Anthropic am Freitag die Rückfrage aus Claude Code — mit der Begründung, dass du sie ohnehin immer wegklickst.</p>\n    <ul>\n      <li><span class=\"chip hot\">Claude</span> <strong>Auto-Modus wird Vorgabe</strong>: ab <span class=\"stat\">14.08.</span> für Pro, Max und Team — die Erlaubnis-Rückfrage vor jedem Werkzeug-Aufruf entfällt standardmäßig.</li>\n      <li><span class=\"chip hot\">Claude</span> <strong>Die Zahl, die alles trägt</strong>: Nutzer bestätigen <span class=\"stat\">97 %</span> aller Rückfragen ohnehin. Der Klick war nie eine Kontrolle, er war ein Ritual.</li>\n      <li><span class=\"chip\">Claude</span> <strong>Anthropics eigener Test</strong>: 1.053 zahlende Nutzer, der Auto-Modus erkannte <span class=\"stat\">89 %</span> der schädlichen Aktionen, die menschliche Durchsicht <span class=\"stat\">13,6 %</span>. Anbieter-Messung, nirgends unabhängig nachgeprüft.</li>\n      <li><span class=\"chip hot\">Tool</span> <strong>Meta steigt ein</strong>: Muse Code (Terminal-Agent, Beta) plus Muse Spark 1.2 seit <span class=\"stat\">05.08.</span> — <span class=\"stat\">1,25 $ / 4,25 $</span> je Mio. Token, knapp sechsmal billiger als Opus 5 in der Ausgabe.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>DeepSeek V4-Flash-0731</strong>: 0,14 $ / 0,28 $, Cache-Treffer bei <span class=\"stat\">0,003 $</span> — laut Artificial Analysis das günstigste bekannte Modell weltweit, rund 3 Cent je Testlauf.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>Qwen3.8-Max geht offen</strong>: erstes Max-Modell von Alibaba mit offenen Gewichten, angekündigt für diese Woche. 2 $ / 6 $, Platz 4 in der Frontend-Arena.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>Niemand misst mehr</strong>: Im offiziellen SWE-Bench-Verified-Repository steht seit <span class=\"stat\">Juni 2025</span> kein neuer Eintrag. Alle kursierenden Zahlen sind Anbieter-Angaben.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Aiders Board ist tot</strong>: Stand weiterhin 20.11.2025, oben <code>gpt-5 (high)</code> mit 88,0 % — fast neun Monate alt.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Rundruf</strong>: Cline gestern bei <code>v4.1.7</code>, OpenHands <code>v1.12.0</code> vom 07.08., Continue seit <span class=\"stat\">52 Tagen</span> ohne Freigabe.</li>\n    </ul></div>",
      "latestTldrHtmlByLang": {
        "de": "<div class=\"tldr\"><p class=\"lead\">Zwei Dinge sind diese Woche gleichzeitig passiert, und zusammen ergeben sie eine unangenehme Lage. Erstens spreizt sich der Preis für ein Coding-Modell auf das gut Hundertfache: 0,28 $ je Million Ausgabe-Token bei DeepSeeks V4-Flash gegen 30 $ bei GPT-5.6 Sol, mit Meta und Alibaba frisch dazwischen. Zweitens ist genau in diesem Monat die Instanz ausgefallen, die dir sagen könnte, ob der billige Anbieter reicht: Für keines der neuen Modelle existiert ein unabhängig nachgerechneter SWE-Bench-Verified-Wert. Und obendrauf nimmt Anthropic am Freitag die Rückfrage aus Claude Code — mit der Begründung, dass du sie ohnehin immer wegklickst.</p>\n    <ul>\n      <li><span class=\"chip hot\">Claude</span> <strong>Auto-Modus wird Vorgabe</strong>: ab <span class=\"stat\">14.08.</span> für Pro, Max und Team — die Erlaubnis-Rückfrage vor jedem Werkzeug-Aufruf entfällt standardmäßig.</li>\n      <li><span class=\"chip hot\">Claude</span> <strong>Die Zahl, die alles trägt</strong>: Nutzer bestätigen <span class=\"stat\">97 %</span> aller Rückfragen ohnehin. Der Klick war nie eine Kontrolle, er war ein Ritual.</li>\n      <li><span class=\"chip\">Claude</span> <strong>Anthropics eigener Test</strong>: 1.053 zahlende Nutzer, der Auto-Modus erkannte <span class=\"stat\">89 %</span> der schädlichen Aktionen, die menschliche Durchsicht <span class=\"stat\">13,6 %</span>. Anbieter-Messung, nirgends unabhängig nachgeprüft.</li>\n      <li><span class=\"chip hot\">Tool</span> <strong>Meta steigt ein</strong>: Muse Code (Terminal-Agent, Beta) plus Muse Spark 1.2 seit <span class=\"stat\">05.08.</span> — <span class=\"stat\">1,25 $ / 4,25 $</span> je Mio. Token, knapp sechsmal billiger als Opus 5 in der Ausgabe.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>DeepSeek V4-Flash-0731</strong>: 0,14 $ / 0,28 $, Cache-Treffer bei <span class=\"stat\">0,003 $</span> — laut Artificial Analysis das günstigste bekannte Modell weltweit, rund 3 Cent je Testlauf.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>Qwen3.8-Max geht offen</strong>: erstes Max-Modell von Alibaba mit offenen Gewichten, angekündigt für diese Woche. 2 $ / 6 $, Platz 4 in der Frontend-Arena.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>Niemand misst mehr</strong>: Im offiziellen SWE-Bench-Verified-Repository steht seit <span class=\"stat\">Juni 2025</span> kein neuer Eintrag. Alle kursierenden Zahlen sind Anbieter-Angaben.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Aiders Board ist tot</strong>: Stand weiterhin 20.11.2025, oben <code>gpt-5 (high)</code> mit 88,0 % — fast neun Monate alt.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Rundruf</strong>: Cline gestern bei <code>v4.1.7</code>, OpenHands <code>v1.12.0</code> vom 07.08., Continue seit <span class=\"stat\">52 Tagen</span> ohne Freigabe.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Two things happened at once this week, and together they add up to an uncomfortable situation. First, the price for a coding model has spread to a good hundredfold: $0.28 per million output tokens for DeepSeek's V4-Flash versus $30 for GPT-5.6 Sol, with Meta and Alibaba freshly wedged in between. Second, this is exactly the month in which the one instance that could tell you whether the cheap provider is good enough went dark: not one of the new models has an independently reproduced SWE-Bench Verified score. And on top of that, Anthropic is removing the permission prompt from Claude Code on Friday — with the justification that you always click through it anyway.</p>\n    <ul>\n      <li><span class=\"chip hot\">Claude</span> <strong>Auto mode becomes the default</strong>: starting <span class=\"stat\">Aug 14</span> for Pro, Max, and Team — the permission prompt before every tool call goes away by default.</li>\n      <li><span class=\"chip hot\">Claude</span> <strong>The number carrying the whole argument</strong>: users approve <span class=\"stat\">97%</span> of all prompts anyway. The click was never a control, it was a ritual.</li>\n      <li><span class=\"chip\">Claude</span> <strong>Anthropic's own test</strong>: 1,053 paying users, auto mode caught <span class=\"stat\">89%</span> of harmful actions, human review caught <span class=\"stat\">13.6%</span>. A vendor measurement, nowhere independently verified.</li>\n      <li><span class=\"chip hot\">Tool</span> <strong>Meta enters the race</strong>: Muse Code (terminal agent, beta) plus Muse Spark 1.2 since <span class=\"stat\">Aug 5</span> — <span class=\"stat\">$1.25 / $4.25</span> per million tokens, nearly six times cheaper than Opus 5 on output.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>DeepSeek V4-Flash-0731</strong>: $0.14 / $0.28, cache hits at <span class=\"stat\">$0.003</span> — per Artificial Analysis, the cheapest known model in the world, around 3 cents per test run.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>Qwen3.8-Max goes open</strong>: Alibaba's first Max model with open weights, announced for this week. $2 / $6, rank 4 in the frontend arena.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>Nobody is measuring anymore</strong>: the official SWE-Bench Verified repository hasn't seen a new entry since <span class=\"stat\">June 2025</span>. Every number in circulation is a vendor claim.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Aider's board is dead</strong>: still dated Nov 20, 2025, topped by <code>gpt-5 (high)</code> at 88.0% — nearly nine months old.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Roundup</strong>: Cline at <code>v4.1.7</code> yesterday, OpenHands <code>v1.12.0</code> from Aug 7, Continue with no release in <span class=\"stat\">52 days</span>.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Duas coisas aconteceram ao mesmo tempo esta semana, e juntas formam um quadro incômodo. Primeiro, o preço de um modelo de código se espalha por mais de cem vezes: US$ 0,28 por milhão de tokens de saída no V4-Flash da DeepSeek contra US$ 30 no GPT-5.6 Sol, com Meta e Alibaba recém-chegadas no meio do caminho. Segundo, é justamente neste mês que sai do ar a instância que poderia te dizer se o fornecedor barato dá conta do recado: nenhum dos novos modelos tem um valor de SWE-Bench Verified recalculado de forma independente. E, para completar, a Anthropic tira a confirmação de permissão do Claude Code na sexta-feira — com a justificativa de que você sempre clica em \"sim\" mesmo assim.</p>\n    <ul>\n      <li><span class=\"chip hot\">Claude</span> <strong>Modo automático vira padrão</strong>: a partir de <span class=\"stat\">14/08</span> para Pro, Max e Team — a confirmação de permissão antes de cada chamada de ferramenta deixa de existir por padrão.</li>\n      <li><span class=\"chip hot\">Claude</span> <strong>O número que sustenta tudo</strong>: os usuários confirmam <span class=\"stat\">97%</span> de todas as solicitações de qualquer forma. O clique nunca foi um controle, era um ritual.</li>\n      <li><span class=\"chip\">Claude</span> <strong>O teste da própria Anthropic</strong>: 1.053 usuários pagantes, o modo automático identificou <span class=\"stat\">89%</span> das ações prejudiciais, a revisão humana, <span class=\"stat\">13,6%</span>. Medição do próprio fornecedor, não verificada de forma independente em lugar nenhum.</li>\n      <li><span class=\"chip hot\">Tool</span> <strong>A Meta entra na disputa</strong>: Muse Code (agente de terminal, beta) mais Muse Spark 1.2 desde <span class=\"stat\">05/08</span> — <span class=\"stat\">US$ 1,25 / US$ 4,25</span> por milhão de tokens, quase seis vezes mais barato que o Opus 5 na saída.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>DeepSeek V4-Flash-0731</strong>: US$ 0,14 / US$ 0,28, acerto de cache a <span class=\"stat\">US$ 0,003</span> — segundo a Artificial Analysis, o modelo mais barato conhecido no mundo, cerca de 3 centavos por rodada de teste.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>Qwen3.8-Max fica aberto</strong>: primeiro modelo Max da Alibaba com pesos abertos, anunciado para esta semana. US$ 2 / US$ 6, quarto lugar na arena de frontend.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>Ninguém mede mais</strong>: no repositório oficial do SWE-Bench Verified não há entrada nova desde <span class=\"stat\">junho de 2025</span>. Todos os números em circulação são divulgação de fornecedor.</li>\n      <li><span class=\"chip\">Bench</span> <strong>O board da Aider está morto</strong>: continua com data de 20/11/2025, no topo <code>gpt-5 (high)</code> com 88,0% — quase nove meses defasado.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Resumo geral</strong>: Cline ontem na <code>v4.1.7</code>, OpenHands <code>v1.12.0</code> de 07/08, Continue sem lançamento há <span class=\"stat\">52 dias</span>.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Dos cosas pasaron al mismo tiempo esta semana, y juntas arman una situación incómoda. Primero, el precio de un modelo de código se dispara hasta unas cien veces: US$ 0,28 por millón de tokens de salida en el V4-Flash de DeepSeek contra US$ 30 en GPT-5.6 Sol, con Meta y Alibaba metidos de lleno en medio. Segundo, justo este mes se apagó la instancia que podría decirte si el proveedor barato es suficiente: ninguno de los modelos nuevos tiene un valor de SWE-Bench Verified recalculado de forma independiente. Y encima, Anthropic quita la confirmación de permiso de Claude Code el viernes — con el argumento de que de todos modos siempre le das clic sin pensar.</p>\n    <ul>\n      <li><span class=\"chip hot\">Claude</span> <strong>El modo automático se vuelve predeterminado</strong>: a partir del <span class=\"stat\">14/08</span> para Pro, Max y Team — la confirmación de permiso antes de cada llamada a una herramienta desaparece por defecto.</li>\n      <li><span class=\"chip hot\">Claude</span> <strong>La cifra que sostiene todo</strong>: los usuarios confirman el <span class=\"stat\">97%</span> de todas las solicitudes de todos modos. El clic nunca fue un control, era un ritual.</li>\n      <li><span class=\"chip\">Claude</span> <strong>La propia prueba de Anthropic</strong>: 1.053 usuarios de pago, el modo automático detectó el <span class=\"stat\">89%</span> de las acciones dañinas, la revisión humana el <span class=\"stat\">13,6%</span>. Medición del proveedor, no verificada de forma independiente en ningún lado.</li>\n      <li><span class=\"chip hot\">Tool</span> <strong>Meta entra a la competencia</strong>: Muse Code (agente de terminal, beta) más Muse Spark 1.2 desde el <span class=\"stat\">05/08</span> — <span class=\"stat\">US$ 1,25 / US$ 4,25</span> por millón de tokens, casi seis veces más barato que Opus 5 en la salida.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>DeepSeek V4-Flash-0731</strong>: US$ 0,14 / US$ 0,28, acierto de caché a <span class=\"stat\">US$ 0,003</span> — según Artificial Analysis, el modelo más barato conocido del mundo, unos 3 centavos por corrida de prueba.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>Qwen3.8-Max se vuelve abierto</strong>: primer modelo Max de Alibaba con pesos abiertos, anunciado para esta semana. US$ 2 / US$ 6, cuarto lugar en la arena de frontend.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>Ya nadie mide</strong>: en el repositorio oficial de SWE-Bench Verified no hay una entrada nueva desde <span class=\"stat\">junio de 2025</span>. Todas las cifras en circulación son datos del proveedor.</li>\n      <li><span class=\"chip\">Bench</span> <strong>El tablero de Aider está muerto</strong>: sigue fechado el 20/11/2025, con <code>gpt-5 (high)</code> arriba con 88,0% — casi nueve meses de retraso.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Resumen rápido</strong>: Cline ayer en <code>v4.1.7</code>, OpenHands <code>v1.12.0</code> del 07/08, Continue sin lanzamiento hace <span class=\"stat\">52 días</span>.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">OpenAI hat am Samstag vor einer Woche zehn Lösungen zu offenen Problemen aus Mathematik und theoretischer Informatik veröffentlicht — Rechenkosten für alle zehn zusammen rund <strong>2.000 $</strong>.<sup>[1]</sup> Die Zahl, die hängen bleibt, ist aber eine andere: Der <em>„sorry\"</em>-Zähler im mitgelieferten Beweis-Repository steht auf <strong>null</strong>.<sup>[2]</sup> Ein Programm hat jeden Schritt abgenommen, kein Gutachter mit Zeitmangel. Genau darin liegt der Unterschied zwischen den Feldern, in denen KI belegbar liefert, und denen, in denen sie seit drei Jahren pilotiert: Nicht das Modell entscheidet, sondern ob ein billiger, mechanischer Prüfer existiert. Bradesco kann eine Milliarde Real nennen, weil Kredite ohnehin gebucht werden. Der deutsche Mittelstand streitet derweil über zwei Adoptionsquoten, die 13,5 Punkte auseinanderliegen.</p>\n    <ul>\n      <li><span class=\"chip hot\">FORSCHUNG · GLOBAL</span> <strong>Zehn offene Probleme, 2.000 $ Rechenkosten:</strong> OpenAIs unveröffentlichtes Modell <em>Astra</em> liefert u. a. eine explizite Konstruktion einer nicht-sofischen Gruppe und die Widerlegung von Connes' Rigiditätsvermutung — dazu 249 Seiten Manuskript und Lean-4-Zertifikate unter Apache 2.0.<sup>[1][2]</sup></li>\n      <li><span class=\"chip hot\">VORBEHALT</span> <strong>Keins der zehn Ergebnisse hat ein Peer-Review durchlaufen.</strong><sup>[2]</sup> OpenAI hat außerdem selbst ausgewählt, was veröffentlicht wird, eigene Leute halfen beim Papier, das Modell bleibt proprietär.<sup>[1]</sup> Die OpenAI-Seite selbst war für mich nicht abrufbar (403).</li>\n      <li><span class=\"chip good\">FINANZEN · BR</span> <strong>Bradesco nennt &gt; R$ 1 Mrd.</strong> zusätzlichen Erlös aus KI-gestützter Kreditanalyse — ohne Zeitraum, ohne Vergleichsbasis, aus der Berichterstattung zum Evident AI Index vom 21.07.<sup>[3]</sup></li>\n      <li><span class=\"chip\">STUDIE · DE</span> <strong>41 % gegen 54,5 %:</strong> Bitkom misst für Januar/Februar 41 % KI-Nutzer unter Firmen ab 20 Beschäftigten, das ifo für Mai 54,5 % aller Unternehmen.<sup>[6][7]</sup> Beides Selbstauskunft, beides „Deutschland\".</li>\n      <li><span class=\"chip\">STUDIE · DE</span> <strong>Der eigentliche Klopfer:</strong> ifo maß <strong>40,9 %</strong> im Vorjahr — praktisch derselbe Wert, den Bitkom ein Jahr später als Fortschritt meldet.<sup>[6][7]</sup></li>\n      <li><span class=\"chip\">REG · EU</span> <strong>Artikel 50 läuft seit dem 02.08.</strong> Heute nichts Neues; das Datum, das jetzt zählt, ist der <strong>02.12.2026</strong> — Ende der Schonfrist für bereits ausgelieferte generative Systeme.<sup>[4]</sup></li>\n      <li><span class=\"chip\">NICHT BELEGBAR</span> <strong>Zwei Zahlen fliegen heute raus:</strong> die kursierenden CAC-Bußgelder aus China und die Investitions-Zahlen des Stanford-HAI-Index — beide ohne belastbaren Primärbeleg.</li>\n      <li><span class=\"chip good\">twiceD</span> Zwei Ideen, beide aus demselben Gedanken: ein <strong>Abnahme-Harnisch</strong> für KI-Ausgaben und ein <strong>Wirkungs-Nachweis</strong> für einen laufenden KI-Einsatz.</li>\n    </ul></div>",

        "de": "<div class=\"tldr\"><p class=\"lead\">OpenAI hat am Samstag vor einer Woche zehn Lösungen zu offenen Problemen aus Mathematik und theoretischer Informatik veröffentlicht — Rechenkosten für alle zehn zusammen rund <strong>2.000 $</strong>.<sup>[1]</sup> Die Zahl, die hängen bleibt, ist aber eine andere: Der <em>„sorry\"</em>-Zähler im mitgelieferten Beweis-Repository steht auf <strong>null</strong>.<sup>[2]</sup> Ein Programm hat jeden Schritt abgenommen, kein Gutachter mit Zeitmangel. Genau darin liegt der Unterschied zwischen den Feldern, in denen KI belegbar liefert, und denen, in denen sie seit drei Jahren pilotiert: Nicht das Modell entscheidet, sondern ob ein billiger, mechanischer Prüfer existiert. Bradesco kann eine Milliarde Real nennen, weil Kredite ohnehin gebucht werden. Der deutsche Mittelstand streitet derweil über zwei Adoptionsquoten, die 13,5 Punkte auseinanderliegen.</p>\n    <ul>\n      <li><span class=\"chip hot\">FORSCHUNG · GLOBAL</span> <strong>Zehn offene Probleme, 2.000 $ Rechenkosten:</strong> OpenAIs unveröffentlichtes Modell <em>Astra</em> liefert u. a. eine explizite Konstruktion einer nicht-sofischen Gruppe und die Widerlegung von Connes' Rigiditätsvermutung — dazu 249 Seiten Manuskript und Lean-4-Zertifikate unter Apache 2.0.<sup>[1][2]</sup></li>\n      <li><span class=\"chip hot\">VORBEHALT</span> <strong>Keins der zehn Ergebnisse hat ein Peer-Review durchlaufen.</strong><sup>[2]</sup> OpenAI hat außerdem selbst ausgewählt, was veröffentlicht wird, eigene Leute halfen beim Papier, das Modell bleibt proprietär.<sup>[1]</sup> Die OpenAI-Seite selbst war für mich nicht abrufbar (403).</li>\n      <li><span class=\"chip good\">FINANZEN · BR</span> <strong>Bradesco nennt &gt; R$ 1 Mrd.</strong> zusätzlichen Erlös aus KI-gestützter Kreditanalyse — ohne Zeitraum, ohne Vergleichsbasis, aus der Berichterstattung zum Evident AI Index vom 21.07.<sup>[3]</sup></li>\n      <li><span class=\"chip\">STUDIE · DE</span> <strong>41 % gegen 54,5 %:</strong> Bitkom misst für Januar/Februar 41 % KI-Nutzer unter Firmen ab 20 Beschäftigten, das ifo für Mai 54,5 % aller Unternehmen.<sup>[6][7]</sup> Beides Selbstauskunft, beides „Deutschland\".</li>\n      <li><span class=\"chip\">STUDIE · DE</span> <strong>Der eigentliche Klopfer:</strong> ifo maß <strong>40,9 %</strong> im Vorjahr — praktisch derselbe Wert, den Bitkom ein Jahr später als Fortschritt meldet.<sup>[6][7]</sup></li>\n      <li><span class=\"chip\">REG · EU</span> <strong>Artikel 50 läuft seit dem 02.08.</strong> Heute nichts Neues; das Datum, das jetzt zählt, ist der <strong>02.12.2026</strong> — Ende der Schonfrist für bereits ausgelieferte generative Systeme.<sup>[4]</sup></li>\n      <li><span class=\"chip\">NICHT BELEGBAR</span> <strong>Zwei Zahlen fliegen heute raus:</strong> die kursierenden CAC-Bußgelder aus China und die Investitions-Zahlen des Stanford-HAI-Index — beide ohne belastbaren Primärbeleg.</li>\n      <li><span class=\"chip good\">twiceD</span> Zwei Ideen, beide aus demselben Gedanken: ein <strong>Abnahme-Harnisch</strong> für KI-Ausgaben und ein <strong>Wirkungs-Nachweis</strong> für einen laufenden KI-Einsatz.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">A week ago Saturday, OpenAI published solutions to ten open problems from mathematics and theoretical computer science — compute cost for all ten combined: roughly <strong>$2,000</strong>.<sup>[1]</sup> But the number that sticks is a different one: the <em>\"sorry\"</em> count in the accompanying proof repository stands at <strong>zero</strong>.<sup>[2]</sup> A program signed off on every step, not a reviewer short on time. That's exactly the difference between the fields where AI demonstrably delivers and the ones it's been piloting in for three years: it's not the model that decides, but whether a cheap, mechanical checker exists. Bradesco can cite a billion reais because credit decisions get booked anyway. Germany's Mittelstand, meanwhile, is arguing over two adoption rates that sit 13.5 points apart.</p>\n    <ul>\n      <li><span class=\"chip hot\">RESEARCH · GLOBAL</span> <strong>Ten open problems, $2,000 in compute:</strong> OpenAI's unreleased model <em>Astra</em> delivers, among other things, an explicit construction of a non-sofic group and the disproof of Connes' rigidity conjecture — plus a 249-page manuscript and Lean 4 certificates under Apache 2.0.<sup>[1][2]</sup></li>\n      <li><span class=\"chip hot\">CAVEAT</span> <strong>None of the ten results has been through peer review.</strong><sup>[2]</sup> OpenAI also selected what got published itself, its own staff helped with the paper, and the model remains proprietary.<sup>[1]</sup> OpenAI's own page wasn't accessible to me (403).</li>\n      <li><span class=\"chip good\">FINANCE · BR</span> <strong>Bradesco cites &gt; R$1 billion</strong> in additional revenue from AI-driven credit analysis — no time frame, no baseline, from coverage of the Evident AI Index dated 07/21.<sup>[3]</sup></li>\n      <li><span class=\"chip\">STUDY · DE</span> <strong>41% versus 54.5%:</strong> Bitkom measures 41% AI users among companies with 20+ employees for January/February, ifo measures 54.5% of all companies for May.<sup>[6][7]</sup> Both self-reported, both labeled \"Germany.\"</li>\n      <li><span class=\"chip\">STUDY · DE</span> <strong>The real kicker:</strong> ifo measured 40.9% the year before — practically the same figure Bitkom reports a year later as progress.<sup>[6][7]</sup></li>\n      <li><span class=\"chip\">REG · EU</span> <strong>Article 50 has been in effect since 08/02.</strong> Nothing new today; the date that matters now is <strong>12/02/2026</strong> — the end of the grace period for generative systems already on the market.<sup>[4]</sup></li>\n      <li><span class=\"chip\">UNVERIFIED</span> <strong>Two figures get cut today:</strong> the circulating CAC fines from China and the investment numbers from the Stanford HAI index — neither has a solid primary source.</li>\n      <li><span class=\"chip good\">twiceD</span> Two ideas, both from the same insight: an <strong>acceptance harness</strong> for AI output and an <strong>impact proof</strong> for an AI deployment already in production.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">No sábado, há uma semana, a OpenAI publicou soluções para dez problemas em aberto de matemática e ciência da computação teórica — custo computacional para os dez juntos: cerca de <strong>US$ 2.000</strong>.<sup>[1]</sup> Mas o número que fica é outro: o contador de <em>\"sorry\"</em> no repositório de provas que acompanha o anúncio está em <strong>zero</strong>.<sup>[2]</sup> Um programa aprovou cada passo, não um avaliador com pouco tempo. É exatamente aí que está a diferença entre os campos em que a IA entrega de forma comprovável e aqueles em que ela vem sendo pilotada há três anos: quem decide não é o modelo, e sim se existe um verificador barato e mecânico. O Bradesco pode citar um bilhão de reais porque o crédito já é registrado de qualquer forma. As pequenas e médias empresas alemãs, enquanto isso, discutem duas taxas de adoção que ficam 13,5 pontos distantes uma da outra.</p>\n    <ul>\n      <li><span class=\"chip hot\">PESQUISA · GLOBAL</span> <strong>Dez problemas em aberto, US$ 2.000 de custo computacional:</strong> o modelo ainda não lançado da OpenAI, <em>Astra</em>, entrega, entre outras coisas, uma construção explícita de um grupo não sófico e a refutação da conjectura da rigidez de Connes — além de 249 páginas de manuscrito e certificados Lean 4 sob licença Apache 2.0.<sup>[1][2]</sup></li>\n      <li><span class=\"chip hot\">RESSALVA</span> <strong>Nenhum dos dez resultados passou por revisão por pares.</strong><sup>[2]</sup> A OpenAI também escolheu sozinha o que seria publicado, funcionários próprios ajudaram no artigo, e o modelo continua proprietário.<sup>[1]</sup> A própria página da OpenAI não estava acessível para mim (403).</li>\n      <li><span class=\"chip good\">FINANÇAS · BR</span> <strong>Bradesco cita &gt; R$ 1 bilhão</strong> de receita adicional com análise de crédito apoiada por IA — sem período, sem base de comparação, a partir da cobertura sobre o Evident AI Index de 21/07.<sup>[3]</sup></li>\n      <li><span class=\"chip\">ESTUDO · DE</span> <strong>41% contra 54,5%:</strong> o Bitkom mede, para janeiro/fevereiro, 41% de usuárias de IA entre empresas com 20 ou mais funcionários; o ifo mede, para maio, 54,5% de todas as empresas.<sup>[6][7]</sup> Ambos são autodeclaração, ambos \"Alemanha\".</li>\n      <li><span class=\"chip\">ESTUDO · DE</span> <strong>O verdadeiro detalhe:</strong> o ifo mediu 40,9% no ano anterior — praticamente o mesmo valor que o Bitkom relata um ano depois como avanço.<sup>[6][7]</sup></li>\n      <li><span class=\"chip\">REG · EU</span> <strong>O Artigo 50 vale desde 02/08.</strong> Hoje sem novidade; a data que importa agora é <strong>02/12/2026</strong> — fim da carência para sistemas generativos já entregues.<sup>[4]</sup></li>\n      <li><span class=\"chip\">NÃO COMPROVADO</span> <strong>Duas cifras ficam de fora hoje:</strong> as multas da CAC chinesa que estão circulando e os números de investimento do índice Stanford HAI — nenhuma delas tem fonte primária sólida.</li>\n      <li><span class=\"chip good\">twiceD</span> Duas ideias, nascidas da mesma constatação: um <strong>arnês de aceite</strong> para saídas de IA e uma <strong>comprovação de impacto</strong> para um uso de IA já em funcionamento.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">El sábado de hace una semana, OpenAI publicó soluciones a diez problemas abiertos de matemáticas y ciencias de la computación teórica — costo de cómputo para los diez juntos: unos <strong>US$ 2.000</strong>.<sup>[1]</sup> Pero la cifra que se queda es otra: el contador de <em>\"sorry\"</em> en el repositorio de pruebas que lo acompaña está en <strong>cero</strong>.<sup>[2]</sup> Un programa aprobó cada paso, no un revisor con poco tiempo. Ahí está exactamente la diferencia entre los campos donde la IA entrega de forma comprobable y aquellos donde lleva tres años en fase piloto: no decide el modelo, sino si existe un verificador barato y mecánico. Bradesco puede citar mil millones de reales porque los créditos de todos modos se registran. Las pymes alemanas, mientras tanto, discuten dos tasas de adopción que están separadas por 13,5 puntos.</p>\n    <ul>\n      <li><span class=\"chip hot\">INVESTIGACIÓN · GLOBAL</span> <strong>Diez problemas abiertos, US$ 2.000 de costo de cómputo:</strong> el modelo aún no publicado de OpenAI, <em>Astra</em>, entrega, entre otras cosas, una construcción explícita de un grupo no sófico y la refutación de la conjetura de rigidez de Connes — además de 249 páginas de manuscrito y certificados Lean 4 bajo licencia Apache 2.0.<sup>[1][2]</sup></li>\n      <li><span class=\"chip hot\">RESERVA</span> <strong>Ninguno de los diez resultados pasó por revisión por pares.</strong><sup>[2]</sup> Además, OpenAI eligió por su cuenta qué se publicaba, personal propio ayudó con el artículo, y el modelo sigue siendo propietario.<sup>[1]</sup> La propia página de OpenAI no estuvo accesible para mí (403).</li>\n      <li><span class=\"chip good\">FINANZAS · BR</span> <strong>Bradesco cita &gt; R$ 1.000 millones</strong> en ingresos adicionales por análisis de crédito con IA — sin periodo, sin base de comparación, según la cobertura del Evident AI Index del 21/07.<sup>[3]</sup></li>\n      <li><span class=\"chip\">ESTUDIO · DE</span> <strong>41% contra 54,5%:</strong> Bitkom mide, para enero/febrero, 41% de empresas usuarias de IA entre las que tienen 20 o más empleados; el ifo mide, para mayo, 54,5% de todas las empresas.<sup>[6][7]</sup> Ambos son autodeclaración, ambos \"Alemania\".</li>\n      <li><span class=\"chip\">ESTUDIO · DE</span> <strong>El verdadero detalle:</strong> el ifo midió 40,9% el año anterior — prácticamente la misma cifra que Bitkom reporta un año después como avance.<sup>[6][7]</sup></li>\n      <li><span class=\"chip\">REG · EU</span> <strong>El Artículo 50 rige desde el 02/08.</strong> Hoy sin novedad; la fecha que importa ahora es el <strong>02/12/2026</strong> — fin del periodo de gracia para sistemas generativos ya desplegados.<sup>[4]</sup></li>\n      <li><span class=\"chip\">NO VERIFICABLE</span> <strong>Hoy quedan fuera dos cifras:</strong> las multas de la CAC china que circulan y las cifras de inversión del índice Stanford HAI — ninguna tiene una fuente primaria sólida.</li>\n      <li><span class=\"chip good\">twiceD</span> Dos ideas, nacidas de la misma idea: un <strong>arnés de aceptación</strong> para las salidas de IA y una <strong>comprobación de impacto</strong> para un uso de IA que ya está en marcha.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Der Montagslauf tut, was Montagsläufe tun: acht Neuzugänge, kein Abgang, 128 Zeilen — und sieben der acht sind Java-Standardmandate im gewohnten Band. Die eigentliche Nachricht steht in der Vergabespalte. In Leipzig schreibt die <strong>ACOD GmbH</strong> — der Automotive-Cluster Ostdeutschland — eine <strong>KI-gestützte Matching-Plattform ausdrücklich als MVP</strong> aus: angewandte KI, Webplattform, Automotive-Umfeld, drei Treffer auf einmal für dieses Profil. Frist <strong>26.08.2026</strong>. Und dann hört die Auskunft auf: kein CPV, kein Auftragswert, keine einzige Eignungsschwelle auf irgendeiner erreichbaren Seite. Ein Stack-Match lässt sich belegen, ein Bietbarkeits-Urteil nicht.</p>\n    <ul>\n      <li><span class=\"chip hot\">Vergabe</span> <strong>ACOD GmbH, Leipzig: „KI-gestützte Webplattform für das Matching von Veranstaltungen, Bildungsangeboten und Unternehmen (MVP)\"</strong>, Frist <strong>26.08.2026</strong> — von zwei unabhängigen Spiegelseiten übereinstimmend genannt.<sup>[1][2]</sup> ACOD ist der Automotive-Cluster Ostdeutschland mit BMW Leipzig, VW Sachsen, Porsche und Fraunhofer im Netzwerk.<sup>[3]</sup></li>\n      <li><span class=\"chip warn\">Vorbehalt</span> <strong>Kein Verdict zur ACOD-Ausschreibung.</strong> CPV, geschätzter Wert, Verfahrensart und sämtliche Eignungskriterien fehlen auf beiden Spiegeln; die Leistungsverzeichnisse liegen als Anlagen hinter dem Vergabeportal. <strong>Stack-Match ja, Bietbarkeit unbekannt</strong> — alles andere wäre geraten.</li>\n      <li><span class=\"chip\">Vergabe</span> <strong>Stadtwerke Leipzig: Rahmenvertrag CMS-Dienstleistungen (TYPO3)</strong>, Teilnahmeantrag bis <strong>21.08.2026</strong> — <strong>Skip-Klasse</strong>, TYPO3-Betrieb ist PHP-CMS und kein Java/Angular-Mandat.<sup>[1]</sup></li>\n      <li><span class=\"chip\">Board</span> <strong>128 Listings</strong> (105 Freelance, 12 Employee, 11 Intriguing): <strong>+8</strong>, <strong>null Abgänge</strong>. Zum <strong>achten Lauf in Folge</strong> verschiebt sich unter den Bestandseinträgen kein einziger Score; Spitze unverändert <strong>83</strong>, Median <strong>63,0</strong>.</li>\n      <li><span class=\"chip\">twiceD</span> <strong>Bester Neuzugang: AS Recruitment</strong> — Java/Spring Boot/Angular/AWS, 100 % remote Deutschland, ab sofort, 6+ Monate, <strong>90–115 €/h*</strong>, Fit <strong>79</strong>. Sechs der acht Zugänge sind Java-Mandate, alle im Standardband.</li>\n      <li><span class=\"chip hot\">IoT</span> <strong>Etengo AG, Passau: ESP32/Modbus/TLS, 100 % remote, 95–120 €/h*, Fit 58</strong> — die einzige Nischen-Position des Tages. Sie stand vom <strong>27. bis 30.07.</strong> schon einmal im Board: die <strong>zweite Wiederkehr-Anzeige in zwei Tagen</strong>.</li>\n      <li><span class=\"chip\">Employee</span> <strong>DeepL, Senior Backend, Köln/Remote DE</strong>, Fit <strong>63</strong>. Das ausgewiesene Band <strong>84.000–183.000 €/Jahr*</strong> ist ein Levels.fyi-Median (~117.000 €), <strong>keine Angabe des Arbeitgebers</strong> — und sein unteres Ende liegt unter der 100-k€-Schwelle dieser Spur.</li>\n      <li><span class=\"chip\">Rate</span> <strong>Das Board bleibt unter dem Marktmedian.</strong> IT-Freelancer im DACH-Raum: <strong>95 €/h</strong>, Spitze SAP/ERP 120 €/h, Software- und Webentwicklung <strong>90 €/h</strong> am unteren Ende.<sup>[4]</sup> Von 90 Euro-Stundenbändern im Board beginnen <strong>80 bei 85 oder 90 €/h</strong>, nur neun bei 95 €/h oder mehr.</li>\n      <li><span class=\"chip warn\">Vorbehalt</span> <strong>11 von 128 Einträgen tragen einen Live-Prüfvermerk von heute</strong>, 117 sind übernommen. <strong>118 Vergütungsbänder sind recherchiert</strong>, acht bestätigt, zwei fehlen. Die vier nachweislich falschen Übernahme-Stempel von gestern stehen unverändert im Board.</li>\n    </ul></div>",

rong>null Abgänge</strong>. Zum <strong>achten Lauf in Folge</strong> verschiebt sich unter den Bestandseinträgen kein einziger Score; Spitze unverändert <strong>83</strong>, Median <strong>63,0</strong>.</li>\n      <li><span class=\"chip\">twiceD</span> <strong>Bester Neuzugang: AS Recruitment</strong> — Java/Spring Boot/Angular/AWS, 100 % remote Deutschland, ab sofort, 6+ Monate, <strong>90–115 €/h*</strong>, Fit <strong>79</strong>. Sechs der acht Zugänge sind Java-Mandate, alle im Standardband.</li>\n      <li><span class=\"chip hot\">IoT</span> <strong>Etengo AG, Passau: ESP32/Modbus/TLS, 100 % remote, 95–120 €/h*, Fit 58</strong> — die einzige Nischen-Position des Tages. Sie stand vom <strong>27. bis 30.07.</strong> schon einmal im Board: die <strong>zweite Wiederkehr-Anzeige in zwei Tagen</strong>.</li>\n      <li><span class=\"chip\">Employee</span> <strong>DeepL, Senior Backend, Köln/Remote DE</strong>, Fit <strong>63</strong>. Das ausgewiesene Band <strong>84.000–183.000 €/Jahr*</strong> ist ein Levels.fyi-Median (~117.000 €), <strong>keine Angabe des Arbeitgebers</strong> — und sein unteres Ende liegt unter der 100-k€-Schwelle dieser Spur.</li>\n      <li><span class=\"chip\">Rate</span> <strong>Das Board bleibt unter dem Marktmedian.</strong> IT-Freelancer im DACH-Raum: <strong>95 €/h</strong>, Spitze SAP/ERP 120 €/h, Software- und Webentwicklung <strong>90 €/h</strong> am unteren Ende.<sup>[4]</sup> Von 90 Euro-Stundenbändern im Board beginnen <strong>80 bei 85 oder 90 €/h</strong>, nur neun bei 95 €/h oder mehr.</li>\n      <li><span class=\"chip warn\">Vorbehalt</span> <strong>11 von 128 Einträgen tragen einen Live-Prüfvermerk von heute</strong>, 117 sind übernommen. <strong>118 Vergütungsbänder sind recherchiert</strong>, acht bestätigt, zwei fehlen. Die vier nachweislich falschen Übernahme-Stempel von gestern stehen unverändert im Board.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Monday's run does what Monday runs do: eight newcomers, zero departures, 128 lines — and seven of the eight are standard Java assignments in the usual band. The real news is in the procurement column. In Leipzig, ACOD GmbH — the Automotive Cluster Ostdeutschland — is tendering an AI-powered matching platform explicitly as an MVP: applied AI, a web platform, an automotive setting — three hits at once for this profile. Deadline Aug 26, 2026. And then the information stops: no CPV code, no contract value, not a single eligibility threshold on any reachable page. A stack match can be documented; a biddability verdict can't.</p>\n    <ul>\n      <li><span class=\"chip hot\">Procurement</span> <strong>ACOD GmbH, Leipzig: \"AI-powered web platform for matching events, training offers, and companies (MVP)\"</strong>, deadline <strong>Aug 26, 2026</strong> — confirmed consistently by two independent mirror sites.<sup>[1][2]</sup> ACOD is the Automotive Cluster Ostdeutschland, with BMW Leipzig, VW Sachsen, Porsche, and Fraunhofer in its network.<sup>[3]</sup></li>\n      <li><span class=\"chip warn\">Caveat</span> <strong>No verdict on the ACOD tender.</strong> CPV code, estimated value, procedure type, and every eligibility criterion are missing from both mirrors; the specifications sit as attachments behind the procurement portal. <strong>Stack match: yes. Biddability: unknown</strong> — anything more would be a guess.</li>\n      <li><span class=\"chip\">Procurement</span> <strong>Stadtwerke Leipzig: framework contract for CMS services (TYPO3)</strong>, request to participate by <strong>Aug 21, 2026</strong> — <strong>skip-class</strong>, TYPO3 operations is a PHP CMS, not a Java/Angular assignment.<sup>[1]</sup></li>\n      <li><span class=\"chip\">Board</span> <strong>128 listings</strong> (105 freelance, 12 employee, 11 intriguing): <strong>+8</strong>, <strong>zero departures</strong>. For the <strong>eighth run in a row</strong>, not a single score moved among carried-over entries; top score unchanged at <strong>83</strong>, median <strong>63.0</strong>.</li>\n      <li><span class=\"chip\">twiceD</span> <strong>Best newcomer: AS Recruitment</strong> — Java/Spring Boot/Angular/AWS, 100% remote Germany, starting immediately, 6+ months, <strong>€90–115/h*</strong>, fit <strong>79</strong>. Six of the eight newcomers are Java assignments, all in the standard band.</li>\n      <li><span class=\"chip hot\">IoT</span> <strong>Etengo AG, Passau: ESP32/Modbus/TLS, 100% remote, €95–120/h*, fit 58</strong> — the only niche position today. It already ran in the board from <strong>Jul 27 to 30</strong>: the <strong>second returning listing in two days</strong>.</li>\n      <li><span class=\"chip\">Employee</span> <strong>DeepL, Senior Backend, Cologne/Remote DE</strong>, fit <strong>63</strong>. The stated band <strong>€84,000–183,000/year*</strong> is a Levels.fyi median (~€117,000), <strong>not an employer-stated figure</strong> — and its low end sits below this track's €100k threshold.</li>\n      <li><span class=\"chip\">Rate</span> <strong>The board stays below the market median.</strong> IT freelancers in the DACH region: <strong>€95/h</strong>, top SAP/ERP €120/h, software and web development <strong>€90/h</strong> at the lower end.<sup>[4]</sup> Of 90 euro hourly bands on the board, <strong>80 start at €85 or €90/h</strong>, only nine at €95/h or more.</li>\n      <li><span class=\"chip warn\">Caveat</span> <strong>11 of 128 entries carry a live-verification note from today</strong>, 117 are carried over. <strong>118 compensation bands are researched</strong>, eight confirmed, two missing. The four demonstrably wrong carry-forward stamps from yesterday remain unchanged on the board.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">A rodada de segunda-feira faz o que rodadas de segunda-feira fazem: oito vagas novas, nenhuma saída, cento e vinte e oito linhas — e sete das oito são mandatos padrão de Java na faixa de sempre. A notícia de verdade está na coluna de licitações. Em Leipzig, a ACOD GmbH — o Automotive Cluster Ostdeutschland — licita uma plataforma de matching com inteligência artificial explicitamente como MVP: IA aplicada, plataforma web, ambiente automotivo, três acertos de uma vez só para este perfil. Prazo 26/08/2026. E então a informação para: sem CPV, sem valor de contrato, nem uma barreira de habilitação sequer em nenhuma página acessível. Um match de stack dá para comprovar; um veredito de participação, não.</p>\n    <ul>\n      <li><span class=\"chip hot\">Licitação</span> <strong>ACOD GmbH, Leipzig: \"Plataforma web com IA para o matching de eventos, ofertas de capacitação e empresas (MVP)\"</strong>, prazo <strong>26/08/2026</strong> — confirmado de forma coincidente por dois espelhos independentes.<sup>[1][2]</sup> A ACOD é o Automotive Cluster Ostdeutschland, com BMW Leipzig, VW Sachsen, Porsche e Fraunhofer na rede.<sup>[3]</sup></li>\n      <li><span class=\"chip warn\">Ressalva</span> <strong>Sem veredito para a licitação da ACOD.</strong> CPV, valor estimado, tipo de procedimento e todos os critérios de habilitação faltam nos dois espelhos; os termos de referência estão em anexos por trás do portal de licitações. <strong>Match de stack sim, possibilidade de participar desconhecida</strong> — qualquer outra coisa seria chute.</li>\n      <li><span class=\"chip\">Licitação</span> <strong>Stadtwerke Leipzig: contrato-quadro de serviços de CMS (TYPO3)</strong>, pedido de participação até <strong>21/08/2026</strong> — <strong>classe skip</strong>, operação de TYPO3 é CMS em PHP e não é mandato Java/Angular.<sup>[1]</sup></li>\n      <li><span class=\"chip\">Board</span> <strong>128 vagas</strong> (105 freelance, 12 CLT, 11 Intriguing): <strong>+8</strong>, <strong>zero saídas</strong>. Pela <strong>oitava rodada seguida</strong>, nenhum score se move entre as vagas já existentes; topo segue em <strong>83</strong>, mediana <strong>63,0</strong>.</li>\n      <li><span class=\"chip\">twiceD</span> <strong>Melhor novidade: AS Recruitment</strong> — Java/Spring Boot/Angular/AWS, 100% remoto na Alemanha, início imediato, 6+ meses, <strong>€ 90–115/h*</strong>, fit <strong>79</strong>. Seis das oito novidades são mandatos Java, todos na faixa padrão.</li>\n      <li><span class=\"chip hot\">IoT</span> <strong>Etengo AG, Passau: ESP32/Modbus/TLS, 100% remoto, € 95–120/h*, fit 58</strong> — a única vaga de nicho do dia. Já esteve no board de <strong>27 a 30/07</strong>: é a <strong>segunda vaga que retorna em dois dias</strong>.</li>\n      <li><span class=\"chip\">CLT</span> <strong>DeepL, Senior Backend, Colônia/Remoto Alemanha</strong>, fit <strong>63</strong>. A faixa informada de <strong>€ 84.000–183.000/ano*</strong> é uma mediana do Levels.fyi (~€ 117.000), <strong>sem indicação do empregador</strong> — e o extremo inferior fica abaixo do piso de € 100 mil desta trilha.</li>\n      <li><span class=\"chip\">Rate</span> <strong>O board segue abaixo da mediana de mercado.</strong> Freelancers de TI na região DACH: <strong>€ 95/h</strong>, topo SAP/ERP € 120/h, desenvolvimento de software e web <strong>€ 90/h</strong> no extremo inferior.<sup>[4]</sup> Das faixas em euros por hora de 90 no board, <strong>80 começam em € 85 ou € 90/h</strong>, só nove em € 95/h ou mais.</li>\n      <li><span class=\"chip warn\">Ressalva</span> <strong>11 das 128 vagas trazem hoje um aviso de checagem ao vivo</strong>, 117 são reaproveitadas. <strong>118 faixas de remuneração são pesquisadas</strong>, oito confirmadas, duas faltam. Os quatro carimbos comprovadamente errados de ontem seguem sem mudança no board.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">La corrida del lunes hace lo que hacen las corridas de lunes: ocho entradas nuevas, ninguna salida, ciento veintiocho líneas — y siete de las ocho son mandatos estándar de Java en la banda de siempre. La noticia real está en la columna de licitaciones. En Leipzig, ACOD GmbH — el Automotive Cluster Ostdeutschland — licita una plataforma de matching con inteligencia artificial explícitamente como MVP: IA aplicada, plataforma web, entorno automotriz, tres aciertos a la vez para este perfil. Plazo 26/08/2026. Y ahí se acaba la información: sin CPV, sin valor del contrato, ni un solo umbral de habilitación en ninguna página accesible. Un match de stack se puede comprobar; un veredicto de participación, no.</p>\n    <ul>\n      <li><span class=\"chip hot\">Licitación</span> <strong>ACOD GmbH, Leipzig: \"Plataforma web con IA para el matching de eventos, ofertas de capacitación y empresas (MVP)\"</strong>, plazo <strong>26/08/2026</strong> — confirmado de forma coincidente por dos espejos independientes.<sup>[1][2]</sup> ACOD es el Automotive Cluster Ostdeutschland, con BMW Leipzig, VW Sachsen, Porsche y Fraunhofer en su red.<sup>[3]</sup></li>\n      <li><span class=\"chip warn\">Salvedad</span> <strong>Sin veredicto para la licitación de ACOD.</strong> CPV, valor estimado, tipo de procedimiento y todos los criterios de habilitación faltan en ambos espejos; los términos de referencia están en anexos detrás del portal de licitaciones. <strong>Match de stack sí, posibilidad real de ofertar desconocida</strong> — cualquier otra cosa sería adivinar.</li>\n      <li><span class=\"chip\">Licitación</span> <strong>Stadtwerke Leipzig: contrato marco de servicios de CMS (TYPO3)</strong>, solicitud de participación hasta <strong>21/08/2026</strong> — <strong>clase skip</strong>, la operación de TYPO3 es un CMS en PHP y no un mandato Java/Angular.<sup>[1]</sup></li>\n      <li><span class=\"chip\">Board</span> <strong>128 vacantes</strong> (105 freelance, 12 empleo fijo, 11 Intriguing): <strong>+8</strong>, <strong>cero salidas</strong>. Por <strong>octava corrida consecutiva</strong>, ningún puntaje se mueve entre las entradas heredadas; el máximo sigue en <strong>83</strong>, mediana <strong>63,0</strong>.</li>\n      <li><span class=\"chip\">twiceD</span> <strong>Mejor novedad: AS Recruitment</strong> — Java/Spring Boot/Angular/AWS, 100% remoto en Alemania, inicio inmediato, 6+ meses, <strong>€ 90–115/h*</strong>, fit <strong>79</strong>. Seis de las ocho novedades son mandatos de Java, todos en la banda estándar.</li>\n      <li><span class=\"chip hot\">IoT</span> <strong>Etengo AG, Passau: ESP32/Modbus/TLS, 100% remoto, € 95–120/h*, fit 58</strong> — la única entrada de nicho del día. Ya estuvo en el tablero del <strong>27 al 30/07</strong>: es la <strong>segunda vacante que reaparece en dos días</strong>.</li>\n      <li><span class=\"chip\">Empleo</span> <strong>DeepL, Senior Backend, Colonia/Remoto Alemania</strong>, fit <strong>63</strong>. La banda indicada de <strong>€ 84.000–183.000/año*</strong> es una mediana de Levels.fyi (~€ 117.000), <strong>sin indicación del empleador</strong> — y su extremo inferior queda por debajo del piso de € 100 mil de esta vía.</li>\n      <li><span class=\"chip\">Rate</span> <strong>El tablero sigue por debajo de la mediana de mercado.</strong> Freelancers de TI en la región DACH: <strong>€ 95/h</strong>, máximo SAP/ERP € 120/h, desarrollo de software y web <strong>€ 90/h</strong> en el extremo inferior.<sup>[4]</sup> De las bandas en euros por hora de 90 en el tablero, <strong>80 empiezan en € 85 o € 90/h</strong>, solo nueve en € 95/h o más.</li>\n      <li><span class=\"chip warn\">Salvedad</span> <strong>11 de las 128 entradas llevan hoy una nota de verificación en vivo</strong>, 117 son heredadas. <strong>118 bandas de compensación son investigadas</strong>, ocho confirmadas, dos faltan. Los cuatro sellos comprobadamente erróneos de ayer siguen sin cambios en el tablero.</li>\n    </ul></div>"

a <strong>14–25 °C</strong>, qui <strong>16–29 °C</strong> — cada um com <strong>0,0 mm</strong>. A quarta-feira em Jacarezinho cai bem dentro da janela seca.</li>\n      <li><span class=\"chip\">CLIMA</span> <strong>O alerta de tempestade acabou:</strong> o alerta amarelo do INMET para 395 municípios, incluindo o Norte Pioneiro, expirou ontem às <strong>23h59</strong>. Hoje nenhum alerta ativo; o CEMADEN não vê risco significativo no país.</li>\n      <li><span class=\"chip hot\">SAÚDE</span> <strong>VSR domina a temporada respiratória:</strong> InfoGripe <strong>SE 30/2026</strong> — nas últimas quatro semanas, o VSR responde nacionalmente por <strong>54,1%</strong> das amostras de SRAG positivas e <strong>30,3%</strong> dos óbitos. O Paraná está entre <strong>14 unidades</strong> em nível de alerta, risco ou alto risco (semana anterior: doze).</li>\n      <li><span class=\"chip\">BEBÊ</span> <strong>Traduzindo para um bebê de um mês:</strong> ao ar livre sim, ambiente fechado lotado com moderação. A sessão das 14h30 na quarta-feira é um salão pequeno, não é shopping no horário de pico.</li>\n      <li><span class=\"chip\">SAÚDE</span> <strong>Dengue segue estável e tranquila:</strong> o Informe nº 24 (04/08) continua sendo o mais recente, dado de referência <strong>SE 01–30/2026</strong>: <strong>94 casos, zero óbitos</strong> aqui, Paraná <strong>5.775 / 5</strong>. A chuva de hoje enche de novo os pratinhos — a ronda pelo terreno fica para terça-feira.</li>\n      <li><span class=\"chip\">ESCOLA</span> <strong>Semana normal de aula.</strong> Nenhuma janela de recesso em agosto, <span class=\"stat\">21 dias letivos</span>; amanhã é <em>Dia do Estudante</em> — data comemorativa, aula normal.</li>\n      <li><span class=\"chip\">DE-BR</span> <strong>Na Alemanha, as férias ainda duram muito:</strong> a janela em que os 16 estados alemães tinham férias de verão ao mesmo tempo (03–07/08) já fechou — mas Baviera e Baden-Württemberg vão até <strong>14 e 12/09</strong>. /strong>, mié <strong>14–25 °C</strong>, jue <strong>16–29 °C</strong> — cada uno con <strong>0,0 mm</strong>. El miércoles en Jacarezinho cae justo dentro de la ventana seca.</li>\n      <li><span class=\"chip\">CLIMA</span> <strong>La alerta de tormenta ya pasó:</strong> la alerta amarilla del INMET para 395 municipios, incluido el Norte Pioneiro, venció ayer a las <strong>23:59</strong>. Hoy ninguna alerta activa; el CEMADEN no ve riesgo significativo a nivel nacional.</li>\n      <li><span class=\"chip hot\">SALUD</span> <strong>El VSR domina la temporada respiratoria:</strong> InfoGripe <strong>SE 30/2026</strong> — en las últimas cuatro semanas, el VSR representa a nivel nacional el <strong>54,1 %</strong> de las muestras de SRAG positivas y el <strong>30,3 %</strong> de las muertes. Paraná está entre <strong>14 entidades</strong> en nivel de alerta, riesgo o alto riesgo (semana anterior: doce).</li>\n      <li><span class=\"chip\">BEBÉ</span> <strong>Traducido para una bebé de un mes:</strong> al aire libre sí, espacio cerrado lleno con moderación. La función de las 14:30 del miércoles es un salón pequeño, no es el centro comercial en hora pico.</li>\n      <li><span class=\"chip\">SALUD</span> <strong>Dengue sigue igual de tranquilo:</strong> el Informe nº 24 (04/08) sigue siendo el más reciente, dato de referencia <strong>SE 01–30/2026</strong>: <strong>94 casos, cero muertes</strong> en nuestra zona, Paraná <strong>5.775 / 5</strong>. La lluvia de hoy vuelve a llenar los platos de las macetas — la recorrida por el terreno queda para el martes.</li>\n      <li><span class=\"chip\">ESCUELA</span> <strong>Semana normal de clases.</strong> Ninguna ventana de receso en agosto, <span class=\"stat\">21 días de clases</span>; mañana es <em>Dia do Estudante</em> — fecha conmemorativa, clases normales.</li>\n      <li><span class=\"chip\">DE-BR</span> <strong>En Alemania, las vacaciones todavía duran mucho:</strong> la ventana en la que los 16 estados alemanes tenía       "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Montag, der 10. August — Rotationsthema <em>Wirtschaft &amp; Finanzen</em>, zwölfte Folge, und der Anlass ist heute eine Korrektur in eigener Sache. Der Wirtschafts-Brief desselben Tages nimmt einen Zollsatz zurück: Statt der zuletzt geführten <strong>37,5 %</strong> auf brasilianische Waren ist nur <strong>25 %</strong> belegbar — aus einem Section-301-Verfahren, wirksam seit dem <strong>22.07.</strong>, auf rund <strong>24 Mrd. $</strong> Warenwert.<sup>[1]</sup> Der Zwangsarbeits-Aufschlag, der die Zahl aufgebläht hatte, gehört in ein eigenes Verfahren. Dazu zwei ruhige Anker: die Selic steht nach der einstimmigen Senkung vom <strong>05.08.</strong> bei <strong>14,00 %</strong>,<sup>[2]</sup> und EUR/BRL notiert Montagfrüh bei <strong>5,8739</strong> — 0,15 % unter dem letzten EZB-Fix von <strong>5,8826</strong> vom Freitag. Daraus wird heute ein Wortfeld, das man beim Übersetzen von Wirtschaftsnachrichten dauernd braucht: <strong>10 Einträge, davon 3 Verben mit voller Konjugation</strong>, darunter 2 Auffrischungen vom 20. Juli.</p>\n    <ul>\n      <li><span class=\"chip\">KONJUGATION</span> <strong>korrigiert — ohne ge-</strong> Verbformen.de führt <em>korrigieren</em> als regelmäßiges Verb, und das Partizip lautet <em>korrigiert</em>, nicht <em>*gekorrigiert</em>. Der Grund ist reine Betonung: Wer die erste Silbe nicht betont, bekommt kein ge-. Das gilt für <em>alle</em> Verben auf <em>-ieren</em> — ein Regelchen, das hundert Wörter auf einmal erledigt. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/korrigieren.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip hot\">FALSE FRIEND</span> <strong>der Konzern ≠ concern</strong> — <em>Konzern</em> ist ein Firmenverbund, ein Konglomerat; das englische <em>concern</em> heißt „Besorgnis\" oder „Angelegenheit\". Wer „the Petrobras concern\" schreibt, sagt auf Englisch „die Petrobras-Sorge\". <span class=\"src\"><a href=\"https://www.linguee.com/german-english/translation/konzern.html\">linguee.com</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>o tarifaço</strong> — die brasilianische Wirtschaftspresse hat für die US-Zollwelle ein eigenes Wort gebaut: Basis <em>tarifa</em>, Endung <em>-aço</em>, fertig ist die Zoll-Keule. Kein Wörterbuchbegriff, sondern lebendige Journalisten-Sprache — und das mexikanische Spanisch macht mit <em>-azo</em> genau dasselbe. <span class=\"src\"><a href=\"https://www.taxgroup.com.br/intelligence/tarifaco-de-trump-o-que-esta-em-jogo-entre-brasil-e-eua/\">taxgroup.com.br</a></span></li>\n      <li><span class=\"chip\">GENUS</span> <strong>eine Zinssenkung, drei Wörter</strong> — Deutsch presst Zins + Senkung in ein Substantiv, Portugiesisch und Spanisch brauchen eine Wortkette: <em>o corte de juros</em>, <em>el recorte de tasas</em>. Und Achtung beim Lexikon: in Mexiko heißt der Zinssatz <em>la tasa de interés</em>, nur in Spanien <em>el tipo de interés</em>.</li>\n      <li><span class=\"chip\">KONJUGATION</span> <strong>abgleichen ist stark <em>und</em> trennbar — Perfekt trotzdem mit haben</strong> Verbformen.de führt die Ablautreihe <em>ei – i – i</em>: <em>ich gleiche ab</em>, <em>ich glich ab</em>, <em>ich habe abgeglichen</em>. Die Versuchung, bei einem starken Verb auf <em>sein</em> zu tippen, geht hier ins Leere — abgleichen ist eine Tätigkeit am Objekt, keine Bewegung. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/abgleichen.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip good\">IDIOM</span> <strong>über das Ziel hinausschießen</strong> — der Duden erklärt das Bild wörtlich mit dem Schützen, der den Bogen zu stark spannt, sodass der Pfeil weit hinter dem Ziel landet. Genau das ist mit 37,5 % statt 25 % passiert. PT-BR sagt <em>passar do ponto</em>, ES-MX <em>pasarse de la raya</em>. <span class=\"src\"><a href=\"https://www.duden.de/rechtschreibung/Ziel\">duden.de</a></span></li>\n    </ul></div>",

></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Monday, August 10 — rotation theme <em>Economy &amp; Finance</em>, twelfth installment, and today's occasion is a correction of our own. The same day's economy brief walks back a tariff rate: instead of the <strong>37.5%</strong> on Brazilian goods carried until now, only <strong>25%</strong> is actually verifiable — from a Section 301 proceeding, effective since <strong>Jul 22</strong>, on roughly <strong>$24 billion</strong> in goods value.<sup>[1]</sup> The forced-labor surcharge that had inflated the number belongs to a separate proceeding. Two steady anchors alongside that: the Selic stands at <strong>14.00%</strong> after the unanimous cut on <strong>Aug 5</strong>,<sup>[2]</sup> and EUR/BRL trades at <strong>5.8739</strong> Monday morning — 0.15% below Friday's last ECB fix of <strong>5.8826</strong>. Out of that comes today's vocabulary field, the one you constantly need when translating economic news: <strong>10 entries, 3 of them verbs with full conjugation</strong>, including 2 refreshers from July 20.</p>\n    <ul>\n      <li><span class=\"chip\">CONJUGATION</span> <strong>korrigiert — without ge-</strong> Verbformen.de lists <em>korrigieren</em> as a regular verb, and the participle is <em>korrigiert</em>, not <em>*gekorrigiert</em>. The reason is pure stress: if the first syllable isn't stressed, you get no ge-. That holds for <em>every</em> verb ending in <em>-ieren</em> — one small rule that clears up a hundred words at once. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/korrigieren.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip hot\">FALSE FRIEND</span> <strong>der Konzern ≠ concern</strong> — <em>Konzern</em> is a corporate group, a conglomerate; the English <em>concern</em> means \"worry\" or \"matter.\" Write \"the Petrobras concern\" and in English you've just said \"the Petrobras worry.\" <span class=\"src\"><a href=\"https://www.linguee.com/german-english/translation/konzern.html\">linguee.com</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>o tarifaço</strong> — Brazil's business press built its own word for the US tariff wave: base <em>tarifa</em>, ending <em>-aço</em>, and there's your tariff sledgehammer. Not a dictionary entry, but living journalist's language — and Mexican Spanish does exactly the same thing with <em>-azo</em>. <span class=\"src\"><a href=\"https://www.taxgroup.com.br/intelligence/tarifaco-de-trump-o-que-esta-em-jogo-entre-brasil-e-eua/\">taxgroup.com.br</a></span></li>\n      <li><span class=\"chip\">GENDER</span> <strong>one Zinssenkung, three words</strong> — German squeezes Zins (interest) plus Senkung (cut) into one noun; Portuguese and Spanish need a word chain: <em>o corte de juros</em>, <em>el recorte de tasas</em>. And watch the lexicon: in Mexico the interest rate is <em>la tasa de interés</em> — only in Spain is it <em>el tipo de interés</em>.</li>\n      <li><span class=\"chip\">CONJUGATION</span> <strong>abgleichen is strong <em>and</em> separable — the perfect tense still takes haben</strong> Verbformen.de lists the ablaut series <em>ei – i – i</em>: <em>ich gleiche ab</em>, <em>ich glich ab</em>, <em>ich habe abgeglichen</em>. The temptation to guess sein for a strong verb misses here — abgleichen acts on an object, it isn't movement. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/abgleichen.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip good\">IDIOM</span> <strong>über das Ziel hinausschießen</strong> — Duden literally explains the image with the archer who draws the bow too hard, so the arrow lands well past the target. That's exactly what happened with 37.5% instead of 25%. PT-BR says <em>passar do ponto</em>, ES-MX <em>pasarse de la raya</em>. <span class=\"src\"><a href=\"https://www.duden.de/rechtschreibung/Ziel\">duden.de</a></span></li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Segunda-feira, 10 de agosto — tema da rotação <em>Economia &amp; Finanças</em>, décimo segundo capítulo, e o motivo de hoje é uma correção da própria casa. O boletim de economia do mesmo dia recua uma alíquota: em vez dos <strong>37,5%</strong> sobre produtos brasileiros que vinham sendo usados, só <strong>25%</strong> é comprovável — de um processo pela Seção 301, vigente desde <strong>22/07</strong>, sobre cerca de <strong>US$ 24 bi</strong> em valor de mercadorias.<sup>[1]</sup> O adicional por trabalho forçado, que tinha inflado o número, pertence a um processo separado. Além disso, duas âncoras tranquilas: a Selic está em <strong>14,00%</strong> depois do corte unânime de <strong>05/08</strong>,<sup>[2]</sup> e o EUR/BRL cota a <strong>5,8739</strong> na manhã de segunda-feira — 0,15% abaixo do último fixing do BCE, de <strong>5,8826</strong>, de sexta-feira. Disso sai o campo lexical de hoje, aquele de que a gente sempre precisa ao traduzir notícias de economia: <strong>10 verbetes, 3 deles verbos com conjugação completa</strong>, incluindo 2 revisões de 20 de julho.</p>\n    <ul>\n      <li><span class=\"chip\">CONJUGAÇÃO</span> <strong>korrigiert — sem ge-</strong> O Verbformen.de lista <em>korrigieren</em> como verbo regular, e o particípio é <em>korrigiert</em>, não <em>*gekorrigiert</em>. O motivo é puramente a tonicidade: quem não acentua a primeira sílaba não ganha o ge-. Isso vale para <em>todos</em> os verbos terminados em <em>-ieren</em> — uma reguinha que resolve cem palavras de uma vez. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/korrigieren.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip hot\">FALSO COGNATO</span> <strong>der Konzern ≠ concern</strong> — <em>Konzern</em> é um grupo empresarial, um conglomerado; a palavra inglesa <em>concern</em> significa \"preocupação\" ou \"assunto\". Quem escreve \"the Petrobras concern\" está dizendo, em inglês, \"a preocupação da Petrobras\". <span class=\"src\"><a href=\"https://www.linguee.com/german-english/translation/konzern.html\">linguee.com</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>o tarifaço</strong> — a imprensa econômica brasileira criou uma palavra própria para a onda de tarifas dos EUA: base <em>tarifa</em>, sufixo <em>-aço</em>, e pronto, a marreta tarifária está feita. Não é verbete de dicionário, é língua viva de jornalista — e o espanhol mexicano faz exatamente o mesmo com <em>-azo</em>. <span class=\"src\"><a href=\"https://www.taxgroup.com.br/intelligence/tarifaco-de-trump-o-que-esta-em-jogo-entre-brasil-e-eua/\">taxgroup.com.br</a></span></li>\n      <li><span class=\"chip\">GÊNERO</span> <strong>um Zinssenkung, três palavras</strong> — o alemão espreme Zins (juro) mais Senkung (corte) num único substantivo; português e espanhol precisam de uma cadeia de palavras: <em>o corte de juros</em>, <em>el recorte de tasas</em>. E atenção ao léxico: no México a taxa de juros é <em>la tasa de interés</em> — só na Espanha é <em>el tipo de interés</em>.</li>\n      <li><span class=\"chip\">CONJUGAÇÃO</span> <strong>abgleichen é forte <em>e</em> separável — mesmo assim, o perfeito usa haben</strong> O Verbformen.de traz a série de apofonia <em>ei – i – i</em>: <em>ich gleiche ab</em>, <em>ich glich ab</em>, <em>ich habe abgeglichen</em>. A tentação de chutar sein por ser um verbo forte não funciona aqui — abgleichen age sobre um objeto, não é movimento. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/abgleichen.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip good\">EXPRESSÃO</span> <strong>über das Ziel hinausschießen</strong> — o Duden explica a imagem ao pé da letra com o arqueiro que estica demais o arco, fazendo a flecha cair bem além do alvo. Foi exatamente isso que aconteceu com os 37,5% em vez de 25%. Em PT-BR se diz <em>passar do ponto</em>, em ES-MX <em>pasarse de la raya</em>. <span class=\"src\"><a href=\"https://www.duden.de/rechtschreibung/Ziel\">duden.de</a></span></li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Lunes 10 de agosto — tema de la rotación <em>Economía y Finanzas</em>, duodécima entrega, y el motivo de hoy es una corrección propia. El boletín de economía del mismo día retira un arancel: en vez del <strong>37,5%</strong> sobre productos brasileños que se venía manejando, solo el <strong>25%</strong> es comprobable — de un proceso bajo la Sección 301, vigente desde el <strong>22/07</strong>, sobre unos <strong>US$24 mil millones</strong> en valor de mercancías.<sup>[1]</sup> El recargo por trabajo forzado, que había inflado la cifra, pertenece a un proceso aparte. A eso se suman dos anclas tranquilas: la Selic está en <strong>14,00%</strong> después del recorte unánime del <strong>05/08</strong>,<sup>[2]</sup> y el EUR/BRL cotiza a <strong>5,8739</strong> la mañana del lunes — 0,15% por debajo del último fixing del BCE, de <strong>5,8826</strong>, del viernes. De ahí sale el campo léxico de hoy, el que siempre hace falta al traducir noticias económicas: <strong>10 entradas, 3 de ellas verbos con conjugación completa</strong>, incluidos 2 repasos del 20 de julio.</p>\n    <ul>\n      <li><span class=\"chip\">CONJUGACIÓN</span> <strong>korrigiert — sin ge-</strong> Verbformen.de registra <em>korrigieren</em> como verbo regular, y el participio es <em>korrigiert</em>, no <em>*gekorrigiert</em>. La razón es puramente el acento: quien no acentúa la primera sílaba no recibe el ge-. Esto vale para <em>todos</em> los verbos terminados en <em>-ieren</em> — una reglita que resuelve cien palabras de una vez. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/korrigieren.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip hot\">FALSO AMIGO</span> <strong>der Konzern ≠ concern</strong> — <em>Konzern</em> es un grupo empresarial, un conglomerado; la palabra inglesa <em>concern</em> significa \"preocupación\" o \"asunto\". Quien escribe \"the Petrobras concern\" está diciendo, en inglés, \"la preocupación de Petrobras\". <span class=\"src\"><a href=\"https://www.linguee.com/german-english/translation/konzern.html\">linguee.com</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>o tarifaço</strong> — la prensa económica brasileña creó una palabra propia para la ola de aranceles de EE. UU.: base <em>tarifa</em>, terminación <em>-aço</em>, y listo, el mazo arancelario. No es entrada de diccionario, sino lenguaje vivo de periodista — y el español mexicano hace exactamente lo mismo con <em>-azo</em>. <span class=\"src\"><a href=\"https://www.taxgroup.com.br/intelligence/tarifaco-de-trump-o-que-esta-em-jogo-entre-brasil-e-eua/\">taxgroup.com.br</a></span></li>\n      <li><span class=\"chip\">GÉNERO</span> <strong>un Zinssenkung, tres palabras</strong> — el alemán comprime Zins (interés) más Senkung (recorte) en un solo sustantivo; portugués y español necesitan una cadena de palabras: <em>o corte de juros</em>, <em>el recorte de tasas</em>. Y ojo con el léxico: en México la tasa de interés es <em>la tasa de interés</em> — solo en España es <em>el tipo de interés</em>.</li>\n      <li><span class=\"chip\">CONJUGACIÓN</span> <strong>abgleichen es fuerte <em>y</em> separable — el perfecto igual lleva haben</strong> Verbformen.de registra la serie de apofonía <em>ei – i – i</em>: <em>ich gleiche ab</em>, <em>ich glich ab</em>, <em>ich habe abgeglichen</em>. La tentación de usar sein por ser un verbo fuerte no aplica aquí — abgleichen actúa sobre un objeto, no es movimiento. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/abgleichen.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip good\">MODISMO</span> <strong>über das Ziel hinausschießen</strong> — el Duden explica la imagen al pie de la letra con el arquero que tensa demasiado el arco, y la flecha cae muy más allá del blanco. Eso fue exactamente lo que pasó con el 37,5% en lugar del 25%. En PT-BR se dice <em>passar do ponto</em>, en ES-MX <em>pasarse de la raya</em>. <span class=\"src\"><a href=\"https://www.duden.de/rechtschreibung/Ziel\">duden.de</a></span></li>\n    </ul></div>"
