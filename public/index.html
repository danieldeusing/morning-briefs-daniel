      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Der Versicherungssektor ist gerade das beste Studienobjekt für angewandte KI — weil dort in einer Woche beide Hälften der Geschichte sichtbar wurden. Oben: <strong>AXA</strong> rollt seit dem <strong>20.07.</strong> Microsoft 365 Copilot weltweit aus, <strong>Legal &amp; General</strong> zeichnete Ende Juni <strong>10.000</strong> Lizenzen. Unten, aus einer Umfrage unter <strong>750</strong> Fachleuten: <strong>91 %</strong> der Führungskräfte glauben, ihr Portfolio in Echtzeit im Griff zu haben — bei den Risikoprüfern sagen das <strong>27 %</strong>. Und in Deutschland streiten zwei Erhebungen, ob <strong>54,5 %</strong> oder <strong>41 %</strong> der Unternehmen KI nutzen. Gemeinsamer Nenner: Der Einkauf ist dokumentiert, die Wirkung nicht.</p>\n    <ul>\n      <li><span class=\"chip hot\">DEPLOY · EU · Finance</span> <strong>AXA</strong> startete am <strong>20.07.2026</strong> den weltweiten Copilot-Rollout; <strong>Legal &amp; General</strong> zeichnete am <strong>29.06.</strong> einen Dreijahresvertrag für <strong>10.000</strong> Mitarbeitende. Von AXA gibt es <em>keine</em> eigene Kennzahl zum Effekt.</li>\n      <li><span class=\"chip hot\">STUDY · Global · Finance</span> <strong>Wahrnehmungs-Riss:</strong> <strong>91 %</strong> der Führungskräfte vs. <strong>27 %</strong> der Underwriter zur Portfolio-Kontrolle; <strong>89 %</strong> der Mitarbeitenden geben zu, nicht freigegebene KI-Tools zu benutzen (n=750, Auftraggeber verkauft die Lösung — Methodik-Flag unten).</li>\n      <li><span class=\"chip\">STUDY · DE</span> <strong>Zwei Wahrheiten:</strong> ifo misst <strong>54,5 %</strong> KI-Nutzung (Mai 2026, zuvor 40,9 %), Bitkom <strong>41 %</strong> (Jan/Feb 2026, zuvor 17 %) — die Niveaus trennt Feldzeit und Panel, nicht die Wahrheit. Kurios: kleine Firmen (<strong>51,2 %</strong>) liegen bei ifo vor mittleren (<strong>47,2 %</strong>).</li>\n      <li><span class=\"chip\">DEPLOY · BR · Health</span> <strong>Brasilien:</strong> <strong>18 %</strong> der Gesundheitseinrichtungen nutzten 2025 KI, bei &gt;50 Betten <strong>31 %</strong> — aber überwiegend für Verwaltung, nicht für Diagnostik (CGI.br, n=3.270).</li>\n      <li><span class=\"chip hot\">REG · EU</span> <strong>Sechs Tage bis Artikel 50:</strong> Die Kommission hat die finalen Transparenz-Leitlinien erst am <strong>20.07.</strong> veröffentlicht — zwölf Tage vor Geltung am <strong>02.08.2026</strong>, samt Verhaltenskodex zur Kennzeichnung KI-erzeugter Inhalte.</li>\n      <li><span class=\"chip good\">twiceD</span> Zwei Ideen: ein <strong>Wirkungs-Nachweis für gekaufte KI-Lizenzen</strong> (Microsofts eigener Report misst Nutzung, nicht Nutzen) und eine <strong>Vorprüf-Assistenz für kleine deutsche Versicherer und Assekuradeure</strong>.</li>\n    </ul></div>",
      "latestTldrHtmlByLang": {
        "de": "<div class=\"tldr\"><p class=\"lead\">Der Versicherungssektor ist gerade das beste Studienobjekt für angewandte KI — weil dort in einer Woche beide Hälften der Geschichte sichtbar wurden. Oben: <strong>AXA</strong> rollt seit dem <strong>20.07.</strong> Microsoft 365 Copilot weltweit aus, <strong>Legal &amp; General</strong> zeichnete Ende Juni <strong>10.000</strong> Lizenzen. Unten, aus einer Umfrage unter <strong>750</strong> Fachleuten: <strong>91 %</strong> der Führungskräfte glauben, ihr Portfolio in Echtzeit im Griff zu haben — bei den Risikoprüfern sagen das <strong>27 %</strong>. Und in Deutschland streiten zwei Erhebungen, ob <strong>54,5 %</strong> oder <strong>41 %</strong> der Unternehmen KI nutzen. Gemeinsamer Nenner: Der Einkauf ist dokumentiert, die Wirkung nicht.</p>\n    <ul>\n      <li><span class=\"chip hot\">DEPLOY · EU · Finance</span> <strong>AXA</strong> startete am <strong>20.07.2026</strong> den weltweiten Copilot-Rollout; <strong>Legal &amp; General</strong> zeichnete am <strong>29.06.</strong> einen Dreijahresvertrag für <strong>10.000</strong> Mitarbeitende. Von AXA gibt es <em>keine</em> eigene Kennzahl zum Effekt.</li>\n      <li><span class=\"chip hot\">STUDY · Global · Finance</span> <strong>Wahrnehmungs-Riss:</strong> <strong>91 %</strong> der Führungskräfte vs. <strong>27 %</strong> der Underwriter zur Portfolio-Kontrolle; <strong>89 %</strong> der Mitarbeitenden geben zu, nicht freigegebene KI-Tools zu benutzen (n=750, Auftraggeber verkauft die Lösung — Methodik-Flag unten).</li>\n      <li><span class=\"chip\">STUDY · DE</span> <strong>Zwei Wahrheiten:</strong> ifo misst <strong>54,5 %</strong> KI-Nutzung (Mai 2026, zuvor 40,9 %), Bitkom <strong>41 %</strong> (Jan/Feb 2026, zuvor 17 %) — die Niveaus trennt Feldzeit und Panel, nicht die Wahrheit. Kurios: kleine Firmen (<strong>51,2 %</strong>) liegen bei ifo vor mittleren (<strong>47,2 %</strong>).</li>\n      <li><span class=\"chip\">DEPLOY · BR · Health</span> <strong>Brasilien:</strong> <strong>18 %</strong> der Gesundheitseinrichtungen nutzten 2025 KI, bei &gt;50 Betten <strong>31 %</strong> — aber überwiegend für Verwaltung, nicht für Diagnostik (CGI.br, n=3.270).</li>\n      <li><span class=\"chip hot\">REG · EU</span> <strong>Sechs Tage bis Artikel 50:</strong> Die Kommission hat die finalen Transparenz-Leitlinien erst am <strong>20.07.</strong> veröffentlicht — zwölf Tage vor Geltung am <strong>02.08.2026</strong>, samt Verhaltenskodex zur Kennzeichnung KI-erzeugter Inhalte.</li>\n      <li><span class=\"chip good\">twiceD</span> Zwei Ideen: ein <strong>Wirkungs-Nachweis für gekaufte KI-Lizenzen</strong> (Microsofts eigener Report misst Nutzung, nicht Nutzen) und eine <strong>Vorprüf-Assistenz für kleine deutsche Versicherer und Assekuradeure</strong>.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">The insurance sector is right now the best case study in applied AI — because in a single week, both halves of the story became visible. On top: <strong>AXA</strong> has been rolling out Microsoft 365 Copilot worldwide since <strong>July 20</strong>, and <strong>Legal &amp; General</strong> signed for <strong>10,000</strong> licenses in late June. Underneath, from a survey of <strong>750</strong> professionals: <strong>91%</strong> of executives believe they have real-time control of their portfolio — among underwriters, just <strong>27%</strong> agree. And in Germany, two surveys are at odds over whether <strong>54.5%</strong> or <strong>41%</strong> of companies use AI. The common denominator: the purchase is documented, the impact isn't.</p>\n    <ul>\n      <li><span class=\"chip hot\">DEPLOY · EU · Finance</span> <strong>AXA</strong> started its global Copilot rollout on <strong>2026-07-20</strong>; <strong>Legal &amp; General</strong> signed a three-year contract for <strong>10,000</strong> employees on <strong>June 29</strong>. AXA has published <em>no</em> impact metric of its own for this rollout.</li>\n      <li><span class=\"chip hot\">STUDY · Global · Finance</span> <strong>Perception gap:</strong> <strong>91%</strong> of executives vs. <strong>27%</strong> of underwriters on real-time portfolio control; <strong>89%</strong> of employees admit to using unsanctioned AI tools (n=750, survey funded by the vendor selling the fix — methodology flag below).</li>\n      <li><span class=\"chip\">STUDY · DE</span> <strong>Two truths:</strong> ifo measures <strong>54.5%</strong> AI usage (May 2026, up from 40.9%), Bitkom says <strong>41%</strong> (Jan/Feb 2026, up from 17%) — the gap is field timing and panel, not conflicting truth. Curious detail: small firms (<strong>51.2%</strong>) beat mid-sized ones (<strong>47.2%</strong>) in the ifo data.</li>\n      <li><span class=\"chip\">DEPLOY · BR · Health</span> <strong>Brazil:</strong> <strong>18%</strong> of health facilities used AI in 2025, <strong>31%</strong> among those with &gt;50 beds — but mostly for administration, not diagnostics (CGI.br, n=3,270).</li>\n      <li><span class=\"chip hot\">REG · EU</span> <strong>Six days to Article 50:</strong> the Commission only published the final transparency guidelines on <strong>July 20</strong> — twelve days before they take effect on <strong>2026-08-02</strong>, alongside a code of practice on labeling AI-generated content.</li>\n      <li><span class=\"chip good\">twiceD</span> Two ideas: an <strong>impact-proof service for already-purchased AI licenses</strong> (Microsoft's own report measures usage, not benefit) and a <strong>pre-screening assistant for small German insurers and underwriting agencies</strong>.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">O setor de seguros é, neste momento, o melhor objeto de estudo para IA aplicada — porque em uma única semana as duas metades da história ficaram visíveis. Em cima: a <strong>AXA</strong> vem lançando o Microsoft 365 Copilot mundialmente desde <strong>20/07</strong>, e a <strong>Legal &amp; General</strong> fechou <strong>10.000</strong> licenças no fim de junho. Embaixo, de uma pesquisa com <strong>750</strong> profissionais: <strong>91%</strong> dos executivos acreditam ter controle em tempo real do portfólio — entre os subscritores de risco, apenas <strong>27%</strong> concordam. E na Alemanha, duas pesquisas discordam sobre se <strong>54,5%</strong> ou <strong>41%</strong> das empresas usam IA. O denominador comum: a compra está documentada, o impacto não.</p>\n    <ul>\n      <li><span class=\"chip hot\">IMPLANTAÇÃO · UE · Finanças</span> A <strong>AXA</strong> iniciou em <strong>20/07/2026</strong> o lançamento global do Copilot; a <strong>Legal &amp; General</strong> assinou em <strong>29/06</strong> um contrato de três anos para <strong>10.000</strong> funcionários. A AXA não divulgou <em>nenhuma</em> métrica própria de efeito.</li>\n      <li><span class=\"chip hot\">PESQUISA · Global · Finanças</span> <strong>Fenda de percepção:</strong> <strong>91%</strong> dos executivos vs. <strong>27%</strong> dos subscritores sobre controle do portfólio em tempo real; <strong>89%</strong> dos funcionários admitem usar ferramentas de IA não autorizadas (n=750, pesquisa financiada pelo próprio fornecedor da solução — sinalização de metodologia abaixo).</li>\n      <li><span class=\"chip\">PESQUISA · DE</span> <strong>Duas verdades:</strong> o ifo mede <strong>54,5%</strong> de uso de IA (maio de 2026, ante 40,9%), o Bitkom aponta <strong>41%</strong> (jan/fev de 2026, ante 17%) — o que separa os níveis é o período de campo e o painel, não a verdade. Curioso: empresas pequenas (<strong>51,2%</strong>) ficam à frente das médias (<strong>47,2%</strong>) no ifo.</li>\n      <li><span class=\"chip\">IMPLANTAÇÃO · BR · Saúde</span> <strong>Brasil:</strong> <strong>18%</strong> dos estabelecimentos de saúde usaram IA em 2025, chegando a <strong>31%</strong> naqueles com mais de 50 leitos — mas majoritariamente para administração, não para diagnóstico (CGI.br, n=3.270).</li>\n      <li><span class=\"chip hot\">REGULAÇÃO · UE</span> <strong>Seis dias até o Artigo 50:</strong> a Comissão só publicou as diretrizes finais de transparência em <strong>20/07</strong> — doze dias antes de entrarem em vigor, em <strong>02/08/2026</strong>, junto com um código de conduta para rotulagem de conteúdo gerado por IA.</li>\n      <li><span class=\"chip good\">twiceD</span> Duas ideias: uma <strong>comprovação de impacto para licenças de IA já compradas</strong> (o relatório da própria Microsoft mede uso, não benefício) e uma <strong>assistência de pré-análise para pequenas seguradoras e corretoras de subscrição alemãs</strong>.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">El sector asegurador es justo ahora el mejor caso de estudio de IA aplicada, porque en una sola semana se hicieron visibles las dos mitades de la historia. Arriba: <strong>AXA</strong> lleva desde el <strong>20/07</strong> desplegando Microsoft 365 Copilot en todo el mundo, y <strong>Legal &amp; General</strong> firmó a finales de junio <strong>10,000</strong> licencias. Abajo, según una encuesta a <strong>750</strong> profesionales: el <strong>91%</strong> de los directivos cree tener el portafolio bajo control en tiempo real; entre los suscriptores de riesgo, solo el <strong>27%</strong> lo cree así. Y en Alemania, dos encuestas no se ponen de acuerdo sobre si el <strong>54.5%</strong> o el <strong>41%</strong> de las empresas usa IA. El denominador común: la compra está documentada, el impacto no.</p>\n    <ul>\n      <li><span class=\"chip hot\">DESPLIEGUE · UE · Finanzas</span> <strong>AXA</strong> arrancó el <strong>20/07/2026</strong> el despliegue mundial de Copilot; <strong>Legal &amp; General</strong> firmó el <strong>29/06</strong> un contrato de tres años para <strong>10,000</strong> empleados. AXA no publicó <em>ninguna</em> métrica propia sobre el efecto.</li>\n      <li><span class=\"chip hot\">ESTUDIO · Global · Finanzas</span> <strong>Brecha de percepción:</strong> <strong>91%</strong> de los directivos vs. <strong>27%</strong> de los suscriptores de riesgo sobre el control del portafolio en tiempo real; <strong>89%</strong> del personal admite usar herramientas de IA no autorizadas (n=750, encuesta pagada por el mismo proveedor que vende la solución; ver alerta metodológica abajo).</li>\n      <li><span class=\"chip\">ESTUDIO · DE</span> <strong>Dos verdades:</strong> el ifo mide <strong>54.5%</strong> de uso de IA (mayo de 2026, antes 40.9%), el Bitkom reporta <strong>41%</strong> (ene/feb de 2026, antes 17%); lo que separa los niveles es el periodo de campo y el panel, no la verdad. Curioso: las empresas pequeñas (<strong>51.2%</strong>) superan a las medianas (<strong>47.2%</strong>) en el ifo.</li>\n      <li><span class=\"chip\">DESPLIEGUE · BR · Salud</span> <strong>Brasil:</strong> el <strong>18%</strong> de los establecimientos de salud usó IA en 2025, y llega a <strong>31%</strong> en los que tienen más de 50 camas, pero sobre todo para administración, no para diagnóstico (CGI.br, n=3,270).</li>\n      <li><span class=\"chip hot\">REG · UE</span> <strong>Seis días para el Artículo 50:</strong> la Comisión publicó las guías finales de transparencia apenas el <strong>20/07</strong>, doce días antes de que entren en vigor el <strong>02/08/2026</strong>, junto con un código de conducta para etiquetar contenido generado por IA.</li>\n      <li><span class=\"chip good\">twiceD</span> Dos ideas: una <strong>comprobación de impacto para licencias de IA ya compradas</strong> (el propio reporte de Microsoft mide uso, no beneficio) y una <strong>asistencia de preevaluación para aseguradoras y agencias de suscripción alemanas pequeñas</strong>.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Fast alle Freelance-Anzeigen in diesem Board schweigen über Geld — deshalb steht neben fast jedem €-Band ein Stern, der „recherchierter Benchmark\" heißt. Heute ist das eigene Juli-Archiv weit genug, um die Gegenprobe zu machen: <strong>19 Freelance-Einträge</strong> haben seit dem 1. Juli ihren Preis selbst genannt. Zwölf davon tragen Java-, Spring- oder Angular-Tags. Der <strong>Median dieser zwölf liegt bei 70 €/h</strong>, der Höchstwert bei <strong>80 €/h</strong> — während das Board denselben Projekten mangels Angabe routinemäßig <strong>90–115 €/h</strong> unterstellt. Über 85 €/h steht in diesem Archiv nichts, was Java-Fullstack heißt: die vier höheren Sätze sind DevOps, Cloud und Python/KI. Dazu: 60 Listings, davon 49 wortgleich aus gestern übernommen, und eine TED-Spur, die heute nichts Neues verifizieren konnte.</p>\n    <ul>\n      <li><span class=\"chip hot\">Rate</span> <strong>Zwölf genannte Java-Sätze, Median 70 €/h</strong>: 75 · 75 · 70 · 70 · 70 · 70 · 70 · 65 · 63 · 80 · 57,5 · 70 (Mittelwerte der Bänder). Höchster Wert 80 €/h (CIMPCO, 14.07.). Vier der zwölf sind dieselbe Angular-München-Anzeige einer Vermittlung — bereinigt bleiben neun Rollen, Median unverändert 70.</li>\n      <li><span class=\"chip hot\">Rate</span> <strong>Drei Anker, 46 % Spanne</strong>: genannte Preise im Board 70 €/h · Malt-Tarifbarometer für Java-Entwickler mit 8–15 Jahren 699 €/Tag ≈ <strong>87 €/h</strong> bei 8 Stunden · Panel-Durchschnitte der Branchenstudien rund 102 €/h (Stand 26.07.). Jede Zahl misst etwas anderes — der Abschnitt links buchstabiert aus, was.</li>\n      <li><span class=\"chip\">Board</span> <strong>60 Listings</strong>: 39 Freelance, 16 Employee, 5 Intriguing. Gegenüber gestern: <strong>49 übernommen, 11 neu, null gefallen</strong> — und die 49 sind Byte für Byte dieselben Datensätze wie gestern, Scoring-Text inklusive.</li>\n      <li><span class=\"chip hot\">twiceD</span> <strong>Fit 88 heute von Hand nachgeprüft — die Anzeige lebt</strong>: Das Telematik-Projekt von Keil Business Solutions ist auf freelancermap weiter offen, „Bewerben\"-Button aktiv, <strong>Start 8/2026, 3 Monate + langfristige Option, 100 % Remote</strong>. Kein Stundensatz in der Anzeige.</li>\n      <li><span class=\"chip\">twiceD</span> <strong>Fit 87 lebt auch — misst aber etwas anderes</strong>: Das iSAX-Mandat (Java 21, Spring Boot 3, Angular, Flutter) nennt als Projektfenster <strong>01.09.2025 bis 31.12.2027</strong>. Eine Anzeige für ein Projekt, das vor zehn Monaten begonnen hat, ist Dauerbedarf, kein Start.</li>\n      <li><span class=\"chip good\">Neu</span> <strong>11 Neuzugänge</strong>, stärkster: Amoria Bond, Java/Angular Stuttgart, 100 % remote, Fit 79. Dazu erstmals <strong>DeepL</strong> (Senior SWE API, Fit 62) und <strong>Aleph Alpha</strong> in zweiter Rolle (AI Solutions Engineer, 56) — beide ohne genannte Zahl.</li>\n      <li><span class=\"chip\">Employee</span> <strong>Die CH-Schwelle dieses Briefs liegt 38 % über dem Schweizer Median</strong>: lohnanalyse.ch nennt für Senior Software Engineer einen Median von <strong>CHF 109.000</strong>; die Pflicht-Schwelle der Employee-Spur steht bei CHF 150.000. Keiner der vier Schweizer Einträge nennt eine Zahl.</li>\n      <li><span class=\"chip\">Employee</span> <strong>Sechs von 60 nennen eine Vergütung</strong>: Camunda 2×, Grafana Labs 2×, Smartsheet — und heute erstmals seit dem 24.07. wieder ein Freelance-Projekt, Randstad Darmstadt mit <strong>85,00 € Budget</strong>.</li>\n      <li><span class=\"chip\">Markt</span> <strong>SAP friert seit dem 02.07. den Großteil der Neueinstellungen ein</strong> und lenkt die Ersparnis in KI; CEO Christian Klein spricht von einer „very, very different work force\" (Bloomberg). Die kursierende Zahl von 101.743 KI-begründeten Streichungen bleibt aggregatorbelegt und wird hier zum zweiten Tag in Folge <em>nicht</em> beziffert.</li>\n      <li><span class=\"chip\">TED</span> <strong>Heute keine neu verifizierte Ausschreibung</strong>: Der PDF-Volltext-Abruf auf ted.europa.eu lieferte bei drei Versuchen einen leeren Körper. Der aufgekommene OSKAR-Treffer ist erledigt (Frist 29.05. abgelaufen), vier Aggregator-Leads bleiben ohne Primärtext ungelistet. Heute 16:00 endet die BSI-„PRAKI\"-Frist (Stand 25.07.).</li>\n    </ul></div>",

rong>Heute keine neu verifizierte Ausschreibung</strong>: Der PDF-Volltext-Abruf auf ted.europa.eu lieferte bei drei Versuchen einen leeren Körper. Der aufgekommene OSKAR-Treffer ist erledigt (Frist 29.05. abgelaufen), vier Aggregator-Leads bleiben ohne Primärtext ungelistet. Heute 16:00 endet die BSI-„PRAKI\"-Frist (Stand 25.07.).</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Almost every freelance listing on this board stays silent about money — that's why an asterisk sits next to nearly every €-band, meaning \"researched benchmark.\" Today the brief's own July archive is finally deep enough to run the counter-check: <strong>19 freelance entries</strong> have stated their own price since July 1. Twelve of those carry a Java, Spring, or Angular tag. The <strong>median of those twelve is €70/h</strong>, the highest <strong>€80/h</strong> — while the board's default assumption for the same kind of project, absent a stated number, is routinely <strong>€90–115/h</strong>. Nothing above €85/h in this archive is Java full-stack: the four higher rates are DevOps, cloud, and Python/AI. On top of that: 60 listings, 49 of them carried over word-for-word from yesterday, and a TED tender lane that couldn't verify anything new today.</p>\n    <ul>\n      <li><span class=\"chip hot\">Rate</span> <strong>Twelve stated Java rates, median €70/h</strong>: 75 · 75 · 70 · 70 · 70 · 70 · 70 · 65 · 63 · 80 · 57.5 · 70 (band midpoints). Highest value €80/h (CIMPCO, Jul 14). Four of the twelve are the same Angular-Munich listing from one agency — adjusted for that, nine distinct roles remain, median still 70.</li>\n      <li><span class=\"chip hot\">Rate</span> <strong>Three anchors, 46% spread</strong>: stated board prices €70/h · Malt's rate barometer for Java developers with 8–15 years' experience €699/day ≈ <strong>€87/h</strong> at 8 hours · industry-study panel averages around €102/h (as of Jul 26). Each number measures something different — the left column spells out what.</li>\n      <li><span class=\"chip\">Board</span> <strong>60 listings</strong>: 39 freelance, 16 employee, 5 intriguing. Versus yesterday: <strong>49 carried over, 11 new, zero dropped</strong> — and the 49 are byte-for-byte the same records as yesterday, scoring text included.</li>\n      <li><span class=\"chip hot\">twiceD</span> <strong>Fit 88 hand-checked today — the listing is alive</strong>: Keil Business Solutions' telematics project is still open on freelancermap, \"Apply\" button active, <strong>start 8/2026, 3 months + long-term option, 100% remote</strong>. No hourly rate stated in the listing.</li>\n      <li><span class=\"chip\">twiceD</span> <strong>Fit 87 is alive too — but measures something else</strong>: the iSAX mandate (Java 21, Spring Boot 3, Angular, Flutter) lists its project window as <strong>Sep 1, 2025 to Dec 31, 2027</strong>. A listing for a project that started ten months ago is ongoing demand, not a fresh start.</li>\n      <li><span class=\"chip good\">New</span> <strong>11 new entries</strong>, the strongest: Amoria Bond, Java/Angular Stuttgart, 100% remote, Fit 79. Also new: <strong>DeepL</strong> for the first time (Senior SWE API, Fit 62) and <strong>Aleph Alpha</strong> in a second role (AI Solutions Engineer, 56) — both without a stated figure.</li>\n      <li><span class=\"chip\">Employee</span> <strong>This brief's CH threshold sits 38% above the Swiss median</strong>: lohnanalyse.ch puts the median for Senior Software Engineer at <strong>CHF 109,000</strong>; the Employee lane's mandatory threshold is CHF 150,000. None of the four Swiss entries states a figure.</li>\n      <li><span class=\"chip\">Employee</span> <strong>Six of 60 state compensation</strong>: Camunda 2×, Grafana Labs 2×, Smartsheet — and today, for the first time since Jul 24, a freelance project again: Randstad Darmstadt with an <strong>€85.00 budget</strong>.</li>\n      <li><span class=\"chip\">Market</span> <strong>SAP has frozen most new hiring since Jul 2</strong> and is redirecting the savings into AI; CEO Christian Klein speaks of a \"very, very different work force\" (Bloomberg). The circulating figure of 101,743 AI-attributed cuts remains aggregator-sourced and, for the second day running, isn't quantified here.</li>\n      <li><span class=\"chip\">TED</span> <strong>No newly verified tender today</strong>: the full-text PDF pull on ted.europa.eu came back empty on all three attempts. The OSKAR lead that surfaced is closed out (deadline May 29 passed), and four aggregator leads stay unlisted for lack of primary text. Today at 16:00 the BSI \"PRAKI\" deadline expires (as of Jul 25).</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Quase todos os anúncios Freelance neste board ficam calados sobre dinheiro — por isso, ao lado de quase toda faixa em €, há um asterisco que significa apenas \"benchmark pesquisado\". Hoje o próprio arquivo de julho já é extenso o suficiente para fazer a contraprova: <strong>19 vagas Freelance</strong> informaram seu próprio preço desde 1º de julho. Doze delas trazem tag de Java, Spring ou Angular. A <strong>mediana dessas doze fica em 70 €/h</strong>, o valor máximo em <strong>80 €/h</strong> — enquanto o board, na falta de informação, atribui rotineiramente <strong>90–115 €/h</strong> aos mesmos projetos. Acima de 85 €/h, nada neste arquivo é Java fullstack: os quatro valores mais altos são DevOps, cloud e Python/IA. Além disso: 60 vagas, das quais 49 repetidas palavra por palavra de ontem, e uma trilha TED que hoje não conseguiu verificar nada novo.</p>\n    <ul>\n      <li><span class=\"chip hot\">Taxa</span> <strong>Doze taxas Java informadas, mediana 70 €/h</strong>: 75 · 75 · 70 · 70 · 70 · 70 · 70 · 65 · 63 · 80 · 57,5 · 70 (médias das faixas). Valor mais alto 80 €/h (CIMPCO, 14/07). Quatro das doze são o mesmo anúncio Angular de Munique de uma mesma intermediária — depois de ajustado, restam nove vagas, mediana permanece 70.</li>\n      <li><span class=\"chip hot\">Taxa</span> <strong>Três âncoras, 46% de diferença</strong>: preços informados no board 70 €/h · barômetro de tarifas da Malt para desenvolvedores Java com 8–15 anos 699 €/dia ≈ <strong>87 €/h</strong> em 8 horas · médias de painel dos estudos setoriais em torno de 102 €/h (posição de 26/07). Cada número mede algo diferente — a coluna à esquerda detalha o quê.</li>\n      <li><span class=\"chip\">Board</span> <strong>60 vagas</strong>: 39 Freelance, 16 Employee, 5 Intriguing. Em relação a ontem: <strong>49 mantidas, 11 novas, zero saíram</strong> — e as 49 são idênticas byte a byte às de ontem, incluindo o texto de pontuação.</li>\n      <li><span class=\"chip hot\">twiceD</span> <strong>Fit 88 reverificado hoje à mão — o anúncio segue vivo</strong>: o projeto de telemática da Keil Business Solutions segue aberto na freelancermap, botão \"Bewerben\" ativo, <strong>início 8/2026, 3 meses + opção de longo prazo, 100% remoto</strong>. Nenhuma taxa horária informada no anúncio.</li>\n      <li><span class=\"chip\">twiceD</span> <strong>Fit 87 também segue vivo — mas mede outra coisa</strong>: o mandato da iSAX (Java 21, Spring Boot 3, Angular, Flutter) informa como janela do projeto <strong>01/09/2025 a 31/12/2027</strong>. Um anúncio para um projeto que começou há dez meses é demanda contínua, não um início.</li>\n      <li><span class=\"chip good\">Novo</span> <strong>11 novas entradas</strong>, a mais forte: Amoria Bond, Java/Angular em Stuttgart, 100% remoto, Fit 79. Além disso, pela primeira vez, <strong>DeepL</strong> (Senior SWE API, Fit 62) e <strong>Aleph Alpha</strong> em um segundo papel (AI Solutions Engineer, 56) — as duas sem valor informado.</li>\n      <li><span class=\"chip\">Employee</span> <strong>O limiar CH deste brief fica 38% acima da mediana suíça</strong>: a lohnanalyse.ch informa, para Senior Software Engineer, uma mediana de <strong>CHF 109.000</strong>; o limiar obrigatório da trilha Employee está em CHF 150.000. Nenhuma das quatro vagas suíças informa um valor.</li>\n      <li><span class=\"chip\">Employee</span> <strong>Seis das 60 informam remuneração</strong>: Camunda 2×, Grafana Labs 2×, Smartsheet — e hoje, pela primeira vez desde 24/07, novamente um projeto Freelance: Randstad Darmstadt, com <strong>orçamento de 85,00 €</strong>.</li>\n      <li><span class=\"chip\">Mercado</span> <strong>A SAP congela desde 02/07 a maior parte das novas contratações</strong> e direciona a economia para IA; o CEO Christian Klein fala de uma \"very, very different work force\" (Bloomberg). O número de 101.743 cortes \"atribuídos à IA\" que circula segue sem confirmação além de um agregador e, pelo segundo dia seguido, não é numerado aqui.</li>\n      <li><span class=\"chip\">TED</span> <strong>Hoje nenhuma licitação nova verificada</strong>: a consulta ao texto integral em PDF no ted.europa.eu trouxe corpo vazio nas três tentativas. O achado OSKAR está encerrado (prazo de 29/05 vencido), quatro leads de agregador seguem fora da lista por falta de texto primário. Hoje às 16h termina o prazo do BSI \"PRAKI\" (posição de 25/07).</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Casi todos los anuncios Freelance en este board se quedan callados sobre el dinero — por eso, junto a casi cada banda en €, hay un asterisco que solo significa \"benchmark investigado\". Hoy el propio archivo de julio ya es lo bastante extenso para hacer la contraprueba: <strong>19 vacantes Freelance</strong> han declarado su propio precio desde el 1 de julio. Doce de ellas llevan etiqueta de Java, Spring o Angular. La <strong>mediana de esas doce es de 70 €/h</strong>, el valor más alto <strong>80 €/h</strong> — mientras que el board, a falta de dato, asigna por defecto <strong>90–115 €/h</strong> a los mismos proyectos. Por encima de 85 €/h, nada en este archivo es Java fullstack: los cuatro valores más altos son DevOps, cloud y Python/IA. Además: 60 vacantes, de las cuales 49 repetidas palabra por palabra de ayer, y una vía TED que hoy no pudo verificar nada nuevo.</p>\n    <ul>\n      <li><span class=\"chip hot\">Tarifa</span> <strong>Doce tarifas Java declaradas, mediana 70 €/h</strong>: 75 · 75 · 70 · 70 · 70 · 70 · 70 · 65 · 63 · 80 · 57,5 · 70 (promedios de las bandas). Valor más alto 80 €/h (CIMPCO, 14/07). Cuatro de las doce son el mismo anuncio Angular de Múnich de una misma intermediaria — ajustado, quedan nueve vacantes, la mediana sigue en 70.</li>\n      <li><span class=\"chip hot\">Tarifa</span> <strong>Tres anclas, 46 % de diferencia</strong>: precios declarados en el board 70 €/h · barómetro de tarifas de Malt para desarrolladores Java con 8–15 años 699 €/día ≈ <strong>87 €/h</strong> en 8 horas · promedios de panel de los estudios del sector, alrededor de 102 €/h (al 26/07). Cada cifra mide algo distinto — la columna de la izquierda detalla qué.</li>\n      <li><span class=\"chip\">Board</span> <strong>60 vacantes</strong>: 39 Freelance, 16 Employee, 5 Intriguing. Frente a ayer: <strong>49 mantenidas, 11 nuevas, cero salieron</strong> — y las 49 son idénticas byte por byte a las de ayer, incluido el texto de puntuación.</li>\n      <li><span class=\"chip hot\">twiceD</span> <strong>Fit 88 reverificado hoy a mano — el anuncio sigue vivo</strong>: el proyecto de telemática de Keil Business Solutions sigue abierto en freelancermap, botón \"Bewerben\" activo, <strong>inicio 8/2026, 3 meses + opción de largo plazo, 100 % remoto</strong>. Sin tarifa por hora indicada en el anuncio.</li>\n      <li><span class=\"chip\">twiceD</span> <strong>Fit 87 también sigue vivo — pero mide otra cosa</strong>: el mandato de iSAX (Java 21, Spring Boot 3, Angular, Flutter) indica como ventana del proyecto del <strong>01/09/2025 al 31/12/2027</strong>. Un anuncio para un proyecto que empezó hace diez meses es demanda continua, no un inicio.</li>\n      <li><span class=\"chip good\">Nuevo</span> <strong>11 entradas nuevas</strong>, la más fuerte: Amoria Bond, Java/Angular en Stuttgart, 100 % remoto, Fit 79. Además, por primera vez, <strong>DeepL</strong> (Senior SWE API, Fit 62) y <strong>Aleph Alpha</strong> en un segundo puesto (AI Solutions Engineer, 56) — ambas sin cifra declarada.</li>\n      <li><span class=\"chip\">Employee</span> <strong>El umbral CH de este boletín queda 38 % por encima de la mediana suiza</strong>: lohnanalyse.ch reporta, para Senior Software Engineer, una mediana de <strong>CHF 109.000</strong>; el umbral obligatorio de la vía Employee está en CHF 150.000. Ninguna de las cuatro vacantes suizas declara una cifra.</li>\n      <li><span class=\"chip\">Employee</span> <strong>Seis de 60 declaran una remuneración</strong>: Camunda 2×, Grafana Labs 2×, Smartsheet — y hoy, por primera vez desde el 24/07, de nuevo un proyecto Freelance: Randstad Darmstadt, con <strong>presupuesto de 85,00 €</strong>.</li>\n      <li><span class=\"chip\">Mercado</span> <strong>SAP congela desde el 02/07 la mayor parte de las nuevas contrataciones</strong> y dirige el ahorro hacia la IA; el CEO Christian Klein habla de una \"very, very different work force\" (Bloomberg). La cifra que circula, de 101.743 recortes \"justificados por IA\", sigue respaldada solo por un agregador y, por segundo día consecutivo, no se cuantifica aquí.</li>\n      <li><span class=\"chip\">TED</span> <strong>Hoy ninguna licitación nueva verificada</strong>: la consulta al texto completo en PDF en ted.europa.eu trajo un cuerpo vacío en los tres intentos. El hallazgo OSKAR queda cerrado (plazo del 29/05 vencido), cuatro leads de agregador siguen sin listar por falta de texto primario. Hoy a las 16:00 vence el plazo del BSI \"PRAKI\" (al 25/07).</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Montag, der 27. Juli — Ranzen raus. Nach dem Recesso seit dem 13. Juli beginnt heute für <strong>1,1 Millionen Schülerinnen und Schüler</strong> der Rede Estadual das zweite Halbjahr, und der Himmel spielt mit: <strong>15 bis 25 °C, null Millimeter Regen</strong>. Zwei Dinge machen den Tag aber wichtiger als „erster Schultag\": Endlich ist die Dengue-Zahl da, auf die wir seit Tagen warten — und sie ist <em>sehr</em> gut für unsere Region. Zugleich steigt VSR in Paraná weiter, und ab heute bringen zwei Schulkinder wieder mit heim, was in einer Klasse zirkuliert. Mit einem vier Wochen alten Baby im Haus ist das die eigentliche Nachricht des Tages.</p>\n    <ul>\n      <li><span class=\"chip good\">WETTER</span> <strong>Heute 25°/15°, 0 % Regen</strong> — „Dia de sol com algumas nuvens e névoa ao amanhecer\". Morgen noch besser (26°/15°, trocken), <strong>ab Mittwoch kommt der Regen zurück</strong>.</li>\n      <li><span class=\"chip\">SCHULE</span> <strong>Unterrichtsbeginn heute.</strong> Das zweite Halbjahr bringt noch <strong>100 Schultage</strong>, insgesamt 201 im Jahr 2026.</li>\n      <li><span class=\"chip good\">DENGUE</span> <strong>Informe nº 23 ist da — und unsere 19ª Regional ist der ruhigste Fleck weit und breit.</strong> SE 01–28/2026: nur <strong>84 bestätigte Fälle, null Todesfälle</strong>, autochthone Inzidenz 22,98 je 100.000.</li>\n      <li><span class=\"chip hot\">DENGUE</span> <strong>Im Day-Trip-Ring sieht es ganz anders aus:</strong> die 18ª Regional Cornélio Procópio meldet <strong>491 Fälle und 219,98 je 100.000</strong> — fast das Zehnfache unserer Inzidenz.</li>\n      <li><span class=\"chip hot\">GESUNDHEIT</span> <strong>VSR steigt in Paraná weiter</strong> (InfoGripe SE 27/2026, 05.–11.07.). Landesweit ist VSR aktuell <strong>57,2 %</strong> aller positiven Atemwegsproben — und trifft Kinder unter zwei Jahren am härtesten.</li>\n      <li><span class=\"chip good\">EVENT</span> <strong>Wochenende gefunden: „Show com Souza\", So 02.08., 17 Uhr, Sesc Londrina Cadeião</strong> (Rua Sergipe 52). Im selben Haus dazu kostenlose Kinder-Erzählstunde und eine Ausstellung.</li>\n      <li><span class=\"chip\">EVENT</span> <strong>Expo Pinhalão endet heute.</strong> 23.–27.07., Eintritt frei, Rodeo plus Abschluss-Show — der letzte Abend im Day-Trip-Ring.</li>\n      <li><span class=\"chip\">TRIP</span> <strong>54ª EFAPI, 19.–23.08. in Santo Antônio da Platina</strong> — Rodeo, Agrar- und Gewerbeschau, Praça de Alimentação. Jetzt schon im Kalender markieren.</li>\n      <li><span class=\"chip hot\">FALLE</span> <strong>„EnCena Jacarezinho, 21.–30. August\" ist die Angabe von 2025.</strong> Für 2026 sind die August-Termine noch nicht veröffentlicht — nicht danach planen.</li>\n      <li><span class=\"chip\">DE-BR</span> <strong>Winter mit UV-Index „extrem\".</strong> Der deutsche Instinkt „kühl = keine Sonnencreme\" ist hier falsch — und der Dia dos Pais fällt auf den 09.08.</li>\n    </ul></div>",

        "de": "<div class=\"tldr\"><p class=\"lead\">Montag, der 27. Juli — Ranzen raus. Nach dem Recesso seit dem 13. Juli beginnt heute für <strong>1,1 Millionen Schülerinnen und Schüler</strong> der Rede Estadual das zweite Halbjahr, und der Himmel spielt mit: <strong>15 bis 25 °C, null Millimeter Regen</strong>. Zwei Dinge machen den Tag aber wichtiger als „erster Schultag\": Endlich ist die Dengue-Zahl da, auf die wir seit Tagen warten — und sie ist <em>sehr</em> gut für unsere Region. Zugleich steigt VSR in Paraná weiter, und ab heute bringen zwei Schulkinder wieder mit heim, was in einer Klasse zirkuliert. Mit einem vier Wochen alten Baby im Haus ist das die eigentliche Nachricht des Tages.</p>\n    <ul>\n      <li><span class=\"chip good\">WETTER</span> <strong>Heute 25°/15°, 0 % Regen</strong> — „Dia de sol com algumas nuvens e névoa ao amanhecer\". Morgen noch besser (26°/15°, trocken), <strong>ab Mittwoch kommt der Regen zurück</strong>.</li>\n      <li><span class=\"chip\">SCHULE</span> <strong>Unterrichtsbeginn heute.</strong> Das zweite Halbjahr bringt noch <strong>100 Schultage</strong>, insgesamt 201 im Jahr 2026.</li>\n      <li><span class=\"chip good\">DENGUE</span> <strong>Informe nº 23 ist da — und unsere 19ª Regional ist der ruhigste Fleck weit und breit.</strong> SE 01–28/2026: nur <strong>84 bestätigte Fälle, null Todesfälle</strong>, autochthone Inzidenz 22,98 je 100.000.</li>\n      <li><span class=\"chip hot\">DENGUE</span> <strong>Im Day-Trip-Ring sieht es ganz anders aus:</strong> die 18ª Regional Cornélio Procópio meldet <strong>491 Fälle und 219,98 je 100.000</strong> — fast das Zehnfache unserer Inzidenz.</li>\n      <li><span class=\"chip hot\">GESUNDHEIT</span> <strong>VSR steigt in Paraná weiter</strong> (InfoGripe SE 27/2026, 05.–11.07.). Landesweit ist VSR aktuell <strong>57,2 %</strong> aller positiven Atemwegsproben — und trifft Kinder unter zwei Jahren am härtesten.</li>\n      <li><span class=\"chip good\">EVENT</span> <strong>Wochenende gefunden: „Show com Souza\", So 02.08., 17 Uhr, Sesc Londrina Cadeião</strong> (Rua Sergipe 52). Im selben Haus dazu kostenlose Kinder-Erzählstunde und eine Ausstellung.</li>\n      <li><span class=\"chip\">EVENT</span> <strong>Expo Pinhalão endet heute.</strong> 23.–27.07., Eintritt frei, Rodeo plus Abschluss-Show — der letzte Abend im Day-Trip-Ring.</li>\n      <li><span class=\"chip\">TRIP</span> <strong>54ª EFAPI, 19.–23.08. in Santo Antônio da Platina</strong> — Rodeo, Agrar- und Gewerbeschau, Praça de Alimentação. Jetzt schon im Kalender markieren.</li>\n      <li><span class=\"chip hot\">FALLE</span> <strong>„EnCena Jacarezinho, 21.–30. August\" ist die Angabe von 2025.</strong> Für 2026 sind die August-Termine noch nicht veröffentlicht — nicht danach planen.</li>\n      <li><span class=\"chip\">DE-BR</span> <strong>Winter mit UV-Index „extrem\".</strong> Der deutsche Instinkt „kühl = keine Sonnencreme\" ist hier falsch — und der Dia dos Pais fällt auf den 09.08.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Monday, July 27 — backpacks out. After the recesso that began on July 13, today marks the start of the second half-year for 1.1 million students in the rede estadual, and the sky is cooperating: 15 to 25 °C, zero millimeters of rain. But two things make today bigger than just \"first day back\": the dengue figure we've been waiting days for has finally arrived — and it's very good news for our region. At the same time, RSV keeps rising in Paraná, and starting today two schoolkids will once again bring home whatever's circulating in a classroom. With a four-week-old baby in the house, that's the real story of the day.</p>\n    <ul>\n      <li><span class=\"chip good\">WEATHER</span> <strong>Today 25°/15°, 0% rain</strong> — \"Dia de sol com algumas nuvens e névoa ao amanhecer\": a sunny day with a few clouds and morning fog. Tomorrow even better (26°/15°, dry), <strong>rain returns starting Wednesday</strong>.</li>\n      <li><span class=\"chip\">SCHOOL</span> <strong>Classes resume today.</strong> The second half-year brings <strong>100 more school days</strong>, for a total of 201 in 2026.</li>\n      <li><span class=\"chip good\">DENGUE</span> <strong>Informe nº 23 is here — and our 19ª Regional is the calmest spot around.</strong> SE 01–28/2026: only <strong>84 confirmed cases, zero deaths</strong>, autochthonous incidence 22.98 per 100,000.</li>\n      <li><span class=\"chip hot\">DENGUE</span> <strong>The day-trip ring looks very different:</strong> the 18ª Regional Cornélio Procópio reports <strong>491 cases and 219.98 per 100,000</strong> — almost ten times our incidence.</li>\n      <li><span class=\"chip hot\">HEALTH</span> <strong>RSV keeps rising in Paraná</strong> (InfoGripe SE 27/2026, 07/05–11). Nationwide, RSV currently accounts for <strong>57.2%</strong> of all positive respiratory samples — and hits children under two the hardest.</li>\n      <li><span class=\"chip good\">EVENT</span> <strong>Weekend find: \"Show com Souza,\" Sun 08/02, 5 PM, Sesc Londrina Cadeião</strong> (Rua Sergipe 52). Same building also has a free kids' storytelling hour and an exhibit.</li>\n      <li><span class=\"chip\">EVENT</span> <strong>Expo Pinhalão ends today.</strong> 07/23–27, free admission, rodeo plus closing show — the last evening in the day-trip ring.</li>\n      <li><span class=\"chip\">TRIP</span> <strong>54ª EFAPI, 08/19–23 in Santo Antônio da Platina</strong> — rodeo, agricultural and trade fair, food court. Mark it on the calendar now.</li>\n      <li><span class=\"chip hot\">TRAP</span> <strong>\"EnCena Jacarezinho, August 21–30\" is the 2025 listing.</strong> For 2026, the August dates haven't been published yet — don't plan around them.</li>\n      <li><span class=\"chip\">DE-BR</span> <strong>Winter with a UV index of \"extreme.\"</strong> The German instinct that \"cool = no sunscreen\" is wrong here — and Dia dos Pais falls on 08/09.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Segunda-feira, 27 de julho — mochila na mão. Depois do recesso que começou em 13 de julho, hoje começa o segundo semestre para 1,1 milhão de alunos e alunas da rede estadual, e o céu colabora: 15 a 25 °C, zero milímetro de chuva. Mas duas coisas tornam o dia mais importante do que apenas \"primeiro dia de aula\": finalmente chegou o número de dengue que esperávamos há dias — e ele é muito bom para a nossa região. Ao mesmo tempo, o VSR continua subindo no Paraná, e a partir de hoje duas crianças em idade escolar voltam a trazer para casa o que circula numa turma. Com um bebê de quatro semanas em casa, essa é a notícia de verdade do dia.</p>\n    <ul>\n      <li><span class=\"chip good\">CLIMA</span> <strong>Hoje 25°/15°, 0% de chuva</strong> — \"Dia de sol com algumas nuvens e névoa ao amanhecer\": dia de sol com algumas nuvens e neblina ao amanhecer. Amanhã ainda melhor (26°/15°, seco), <strong>a partir de quarta a chuva volta</strong>.</li>\n      <li><span class=\"chip\">ESCOLA</span> <strong>Início das aulas hoje.</strong> O segundo semestre traz mais <strong>100 dias letivos</strong>, totalizando 201 em 2026.</li>\n      <li><span class=\"chip good\">DENGUE</span> <strong>O Informe nº 23 chegou — e a nossa 19ª Regional é o ponto mais tranquilo por perto.</strong> SE 01–28/2026: apenas <strong>84 casos confirmados, nenhum óbito</strong>, incidência autóctone de 22,98 por 100.000.</li>\n      <li><span class=\"chip hot\">DENGUE</span> <strong>No anel de passeio de um dia, o quadro é bem diferente:</strong> a 18ª Regional Cornélio Procópio registra <strong>491 casos e 219,98 por 100.000</strong> — quase dez vezes a nossa incidência.</li>\n      <li><span class=\"chip hot\">SAÚDE</span> <strong>O VSR continua subindo no Paraná</strong> (InfoGripe SE 27/2026, 05 a 11/07). Em todo o país, o VSR já representa <strong>57,2%</strong> de todas as amostras respiratórias positivas — e atinge com mais força as crianças menores de dois anos.</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Achado para o fim de semana: \"Show com Souza\", dom 02/08, 17h, Sesc Londrina Cadeião</strong> (Rua Sergipe, 52). No mesmo prédio, também tem contação de histórias gratuita para crianças e uma exposição.</li>\n      <li><span class=\"chip\">EVENTO</span> <strong>A Expo Pinhalão termina hoje.</strong> 23 a 27/07, entrada franca, rodeio mais show de encerramento — a última noite no anel de passeio de um dia.</li>\n      <li><span class=\"chip\">PASSEIO</span> <strong>54ª EFAPI, 19 a 23/08 em Santo Antônio da Platina</strong> — rodeio, feira agropecuária e comercial, praça de alimentação. Já vale marcar no calendário.</li>\n      <li><span class=\"chip hot\">ARMADILHA</span> <strong>\"EnCena Jacarezinho, 21 a 30 de agosto\" é a informação de 2025.</strong> Para 2026, as datas de agosto ainda não foram divulgadas — não planeje com base nisso.</li>\n      <li><span class=\"chip\">DE-BR</span> <strong>Inverno com índice UV \"extremo\".</strong> O instinto alemão de que \"frio = sem protetor solar\" está errado por aqui — e o Dia dos Pais cai em 09/08.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Lunes 27 de julio — mochila lista. Después del receso que empezó el 13 de julio, hoy comienza el segundo semestre para 1,1 millones de estudiantes de la rede estadual, y el cielo coopera: de 15 a 25 °C, cero milímetros de lluvia. Pero dos cosas hacen que el día sea más importante que solo el \"primer día de clases\": por fin llegó la cifra de dengue que esperábamos desde hace días — y es muy buena para nuestra región. Al mismo tiempo, el VSR sigue subiendo en Paraná, y a partir de hoy dos niños en edad escolar vuelven a traer a casa lo que circula en un salón. Con un bebé de cuatro semanas en casa, esa es la verdadera noticia del día.</p>\n    <ul>\n      <li><span class=\"chip good\">CLIMA</span> <strong>Hoy 25°/15°, 0% de lluvia</strong> — «Dia de sol com algumas nuvens e névoa ao amanhecer»: día soleado con algunas nubes y neblina al amanecer. Mañana todavía mejor (26°/15°, seco), <strong>desde el miércoles vuelve la lluvia</strong>.</li>\n      <li><span class=\"chip\">ESCUELA</span> <strong>Hoy inician las clases.</strong> El segundo semestre trae <strong>100 días de clases más</strong>, para un total de 201 en 2026.</li>\n      <li><span class=\"chip good\">DENGUE</span> <strong>Llegó el Informe nº 23 — y nuestra 19ª Regional es el lugar más tranquilo a la redonda.</strong> SE 01–28/2026: solo <strong>84 casos confirmados, cero muertes</strong>, incidencia autóctona de 22,98 por 100.000.</li>\n      <li><span class=\"chip hot\">DENGUE</span> <strong>En el anillo de excursiones el panorama es muy distinto:</strong> la 18ª Regional Cornélio Procópio reporta <strong>491 casos y 219,98 por 100.000</strong> — casi diez veces nuestra incidencia.</li>\n      <li><span class=\"chip hot\">SALUD</span> <strong>El VSR sigue subiendo en Paraná</strong> (InfoGripe SE 27/2026, 05 al 11/07). A nivel nacional, el VSR representa actualmente <strong>57,2%</strong> de todas las muestras respiratorias positivas — y golpea con más fuerza a los niños menores de dos años.</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Hallazgo para el fin de semana: «Show com Souza», dom 02/08, 17:00, Sesc Londrina Cadeião</strong> (Rua Sergipe 52). En el mismo edificio también hay una hora de cuentos gratuita para niños y una exposición.</li>\n      <li><span class=\"chip\">EVENTO</span> <strong>La Expo Pinhalão termina hoy.</strong> Del 23 al 27/07, entrada libre, rodeo más show de clausura — la última noche en el anillo de excursiones.</li>\n      <li><span class=\"chip\">PASEO</span> <strong>54ª EFAPI, 19 al 23/08 en Santo Antônio da Platina</strong> — rodeo, feria agropecuaria y comercial, plaza de comida. Ya vale la pena anotarlo en el calendario.</li>\n      <li><span class=\"chip hot\">TRAMPA</span> <strong>«EnCena Jacarezinho, 21 al 30 de agosto» es el dato de 2025.</strong> Para 2026, las fechas de agosto todavía no se han publicado — no hay que planear con base en eso.</li>\n      <li><span class=\"chip\">DE-BR</span> <strong>Invierno con índice UV \"extremo\".</strong> El instinto alemán de que \"frío = sin bloqueador\" aquí está equivocado — y el Dia dos Pais cae el 09/08.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Montag, der 27. Juli — Rotationsthema <em>Wirtschaft &amp; Finanzen</em>, und der Anlass liefert sich selbst. Der Wirtschafts-Brief von heute Morgen führt mit einem Ölpreis-Einbruch: Brent bei 92,11 $, 6,4 % unter dem Freitagsschluss von 98,38 $ — zwei Tage bevor die Fed am Mittwoch, 29.07., um 15:00 BRT über ihr Zielband von 3,50–3,75 % entscheidet. Damit fällt die Säule weg, auf der die Zinserhöhungs-Wette der vergangenen Woche stand. Daran hängt heute das Vokabular: <strong>9 Einträge, davon 3 Verben mit voller Konjugation</strong>, dazu 2 Auffrischungen vom 6. Juli. Roter Faden: Deutsch presst einen ganzen Satz in ein Wort (<em>einpreisen</em>, <em>die Zinssenkung</em>), Portugiesisch und Spanisch packen ihn wieder aus — bis auf ein einziges brasilianisches Verb, das kürzer ist als alles, was Deutsch dafür hat.</p>\n    <ul>\n      <li><span class=\"chip hot\">FALSE FRIEND</span> <strong>Billion ≠ billion</strong> — Duden definiert <em>die Billion</em> als <em>„eine Million Millionen\"</em>, also 10<sup>12</sup>. Die englische <em>billion</em> und das brasilianische <em>bilhão</em> sind nur 10<sup>9</sup> — deutsch <em>eine Milliarde</em>. Portugiesisch und Spanisch fallen hier auseinander: <em>bilhão</em> = 10<sup>9</sup>, <em>billón</em> = 10<sup>12</sup>. <span class=\"src\"><a href=\"https://www.duden.de/rechtschreibung/Billion\">duden.de</a> · <a href=\"https://rebeccajowers.com/2016/10/05/false-friends-when-is-a-billon-not-a-billion/\">rebeccajowers.com</a></span></li>\n      <li><span class=\"chip\">KONJUGATION</span> <strong>eu despenquei, yo descuento</strong> — zwei völlig verschiedene Unregelmäßigkeiten in einem Brief. <em>despencar</em> tauscht nur Buchstaben, um den Klang zu retten (c→qu vor <em>e</em>). <em>descontar</em> tauscht den Stammvokal selbst (o→ue), aber nur unter Betonung — <em>nosotros descontamos</em> bleibt schlicht. <span class=\"src\"><a href=\"https://www.conjugacao.com.br/verbo-despencar/\">conjugacao.com.br</a> · <a href=\"https://conjugator.reverso.net/conjugation-spanish-verb-descontar.html\">reverso.net</a></span></li>\n      <li><span class=\"chip\">KONJUGATION</span> <strong>ist eingebrochen, aber hat nachgegeben</strong> — beide trennbar, beide heute im Brief, verschiedene Hilfsverben. verbformen.de: <em>„Als Hilfsverb von einbrechen wird 'sein' verwendet\"</em> gegen <em>„Als Hilfsverb von nachgeben wird 'haben' verwendet\"</em>. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/einbrechen.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip\">BR-PT</span> <strong>a commodity</strong> — brasilianisches Finanz-Portugiesisch nimmt das englische Wort und macht es weiblich. Priberam führt es als <em>nome feminino</em>, Plural <em>commodities</em>, Herkunft <em>„palavra inglesa\"</em>. Spanisch bleibt bei <em>la materia prima</em>, Deutsch bei <em>der Rohstoff</em>. <span class=\"src\"><a href=\"https://dicionario.priberam.org/commodity\">priberam.org</a></span></li>\n      <li><span class=\"chip\">PHRASE</span> <strong>Zielband · intervalo · rango objetivo</strong> — dieselbe Fed-Spanne, drei Fachwörter. Die brasilianische Finanzpresse schreibt <em>intervalo entre 3,50% e 3,75%</em>, die spanische <em>el rango objetivo</em>. Niemand sagt <em>banda</em>. <span class=\"src\"><a href=\"https://www.diariolibre.com/economia/finanzas/2026/07/08/tipos-de-interes-reserva-federal-se-mantienen-en-reunion-del-fomc/3593771\">diariolibre.com</a></span></li>\n      <li><span class=\"chip good\">IDIOM</span> <strong>den Gürtel enger schnallen</strong> — ausnahmsweise dasselbe Bild in allen vier Sprachen. Duden: <em>„sich in seinen Bedürfnissen einschränken\"</em>; Priberam zu <em>apertar o cinto</em>: <em>„Reduzir gastos, sobretudo em época de crise\"</em>; das Instituto Cervantes zu <em>apretarse el cinturón</em>: <em>„Reducir los gastos\"</em>. <span class=\"src\"><a href=\"https://www.duden.de/rechtschreibung/Guertel\">duden.de</a> · <a href=\"https://cvc.cervantes.es/lengua/biblioteca_fraseologica/r8_montero/repertorio_3.htm\">cvc.cervantes.es</a></span></li>\n      <li><span class=\"chip\">BR-PT</span> <strong>Kohle · grana · lana</strong> — vier Sprachen, vier Materialien, ein Sinn: Geld. Kohle, gefärbter Stoff, Wolle, Teig. Und <em>lana</em> ist ausdrücklich Latein-Amerika (Mexiko, Chile, Peru, El Salvador), nicht Spanien. <span class=\"src\"><a href=\"https://dicionario.priberam.org/grana\">priberam.org</a> · <a href=\"https://es.wiktionary.org/wiki/lana\">es.wiktionary.org</a></span></li>\n    </ul></div>",

        "en": "<div class=\"tldr\"><p class=\"lead\">Monday, July 27 — rotation theme <em>Economy &amp; Finance</em>, and this time the occasion supplies itself. This morning's economy brief leads with an oil-price plunge: Brent at $92.11, 6.4% below Friday's close of $98.38 — two days before the Fed decides on its target range of 3.50–3.75% on Wednesday, July 29, at 15:00 BRT. That knocks out the pillar the rate-hike bet of the past week was standing on. Today's vocabulary hangs on exactly that: <strong>9 entries, 3 of them verbs with full conjugation</strong>, plus 2 refreshers from July 6. Throughline: German presses a whole sentence into one word (<em>einpreisen</em>, <em>die Zinssenkung</em>), Portuguese and Spanish unpack it again — except for a single Brazilian verb that's shorter than anything German has for it.</p>\n    <ul>\n      <li><span class=\"chip hot\">FALSE FRIEND</span> <strong>Billion ≠ billion</strong> — Duden defines <em>die Billion</em> as <em>„eine Million Millionen\"</em>, i.e., 10<sup>12</sup>. English <em>billion</em> and Brazilian <em>bilhão</em> are only 10<sup>9</sup> — German <em>eine Milliarde</em>. Portuguese and Spanish split apart right here: <em>bilhão</em> = 10<sup>9</sup>, <em>billón</em> = 10<sup>12</sup>. <span class=\"src\"><a href=\"https://www.duden.de/rechtschreibung/Billion\">duden.de</a> · <a href=\"https://rebeccajowers.com/2016/10/05/false-friends-when-is-a-billon-not-a-billion/\">rebeccajowers.com</a></span></li>\n      <li><span class=\"chip\">CONJUGATION</span> <strong>eu despenquei, yo descuento</strong> — two completely different irregularities in one brief. <em>despencar</em> only swaps letters to rescue the sound (c→qu before <em>e</em>). <em>descontar</em> swaps the stem vowel itself (o→ue), but only under stress — <em>nosotros descontamos</em> stays plain. <span class=\"src\"><a href=\"https://www.conjugacao.com.br/verbo-despencar/\">conjugacao.com.br</a> · <a href=\"https://conjugator.reverso.net/conjugation- (function () {
  const $ = (s, root) => (root || document).querySelector(s);
  const $$ = (s, root) => Array.from((root || document).querySelectorAll(s));
  const M = window.__MANIFESTS;
  const frame = $('#frame');
  const home = $('#home-view');
  const loading = $('#loading');
  const tldrGrid = $('#tldr-grid');

  // ── Language state ──────────────────────────────────────────────────
  // DE is the canonical language (always present). EN/PT/ES are produced
  // alongside by the nightly tasks; if a translation is missing for a
  // given date, urlFor() and the home/sidebar renderers transparently
  // fall back to the DE version so the dashboard keeps working as
  // translations roll out.
  const SUPPORTED_LANGS = ['de', 'en', 'pt', 'es'];
  const LANG_KEY = 'mb-lang';
  let currentLang = (function () {
    try {
      const v = localStorage.getItem(LANG_KEY);
      return SUPPORTED_LANGS.includes(v) ? v : 'de';
    } catch (_) { return 'de'; }
  })();

  function urlFor(catId, date, lang) {
    const cat = M.categories.find(c => c.id === catId);
    let useLang = 'de';
    if (cat) {
      const entry = cat.entries.find(e => e.date === date);
      if (entry && Array.isArray(entry.langs) && entry.langs.includes(lang)) {
        useLang = lang;
      }
    }
    return catId + '/' + useLang + '/' + date + '.html';
  }

  function headlineFor(entry, lang) {
    if (!entry) return '';
    if (entry.headlines && entry.headlines[lang]) return entry.headlines[lang];
    return entry.headline || '';
  }

  function tldrFor(cat, lang) {
    if (cat.latestTldrHtmlByLang && cat.latestTldrHtmlByLang[lang]) {
      return cat.latestTldrHtmlByLang[lang];
    }
    return cat.latestTldrHtml || '';
  }
  const navGroups = $('#nav-groups');
  // Grouped nav config — drives BOTH the sidebar and the home tile grid so the
  // two never drift. Each group has a `header` (the .nav-label text, or null for
  // a standalone/unheadered group like jobs) and the ordered category ids it
  // contains. The flat order here must match build_manifest.CATEGORIES; a
  // category missing from every group would silently never render, so
  // renderSidebar/renderHome assert coverage against M.categories.
  const NAV_GROUPS = [
    { header: 'Wirtschaft', cats: ['economy'] },
    { header: 'IT',         cats: ['software', 'ai-dev', 'ai-usecases'] },
    { header: null,         cats: ['jobs'] },          // standalone between IT and Freizeit
    { header: 'Freizeit',   cats: ['family'] },
    { header: 'Sprachen',   cats: ['learn-language'] }, // own trailing section
  ];
  // Ordered (group, cat) pairs, resolved against the live manifest. Skips ids
  // not present in M (defensive) and warns in the console about any manifest
  // category not placed in a group, so adding a category without updating
  // NAV_GROUPS is loud rather than silent.
  function groupedCategories() {
    const byId = new Map(M.categories.map(c => [c.id, c]));
    const placed = new Set();
    const groups = NAV_GROUPS.map(g => {
      const cats = g.cats.map(id => byId.get(id)).filter(Boolean);
      cats.forEach(c => placed.add(c.id));
      return { header: g.header, cats };
    }).filter(g => g.cats.length);
    const orphans = M.categories.filter(c => !placed.has(c.id));
    if (orphans.length) {
      console.warn('NAV_GROUPS missing categories (appended ungrouped):',
                   orphans.map(c => c.id));
      groups.push({ header: null, cats: orphans });
    }
    return groups;
  }

  function fmtDate(d) {
    const parts = d.split('-');
    return parts[2] + '.' + parts[1] + '.' + parts[0].slice(2);
  }

  // Wire a click handler that also fires on Enter / Space for keyboard users.
  // For elements that aren't natively focusable (div, article, span), we set
  // tabindex=0 and a role so screen readers announce them correctly.
  function addClickAndKey(el, handler, opts = {}) {
    const role = opts.role || 'button';
    if (!el.hasAttribute('tabindex')) el.tabIndex = 0;
    if (!el.hasAttribute('role')) el.setAttribute('role', role);
    el.addEventListener('click', handler);
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        handler(e);
      }
    });
  }

  // Home-card TL;DR snapshot caps the bullet list at this many items — the
  // card is a scan teaser, the full set is one click away in the brief.
  const HOME_TLDR_BULLET_CAP = 5;
  // The active route as {catId, date}, parsed from the hash (#cat/date).
  function currentRoute() {
    const parts = location.hash.replace(/^#/, '').split('/');
    return { catId: parts[0] || null, date: parts[1] || null };
  }

  // The category dropdown holds only the month-calendar archive picker — no
  // flat date list. The calendar marks the selected day, jumps to its month,
  // and previews titles on hover.
  function renderDates(container, cat, activeDate) {
    container.innerHTML = '';
    if (cat.entries.length === 0) {
      container.innerHTML = '<div class="cat-empty">Heute kein Brief</div>';
      return;
    }
    if (activeDate === undefined) {
      const r = currentRoute();
      activeDate = r.catId === cat.id ? r.date : null;

    const cal = document.createElement('div');

  // Month-calendar archive picker: only days that actually have a brief are
  // clickable; hovering/focusing one previews its title, clicking opens it.
  // Replaces the unbounded "show everything" list so the picker stays usable

  const CAL_WEEKDAYS = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
  const CAL_MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni',
    'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
  const pad2 = n => String(n).padStart(2, '0');
  const monthIndex = iso => {
    const [y, m] = iso.split('-').map(Number);
    return y * 12 + (m - 1);
  };

  function renderCalendar(calEl, cat, activeDate) {
    const byDate = new Map(cat.entries.map(e => [e.date, e]));
    const newest = cat.entries[0].date;                       // manifest is newest-first
    const oldest = cat.entries[cat.entries.length - 1].date;

    const maxMonth = monthIndex(newest);

    // Open on the selected day's month when one is selected, else the newest.
    let cur = Math.min(maxMonth, Math.max(minMonth,
      hasActive ? monthIndex(activeDate) : maxMonth));

      <div class="cal-bar">
        <button class="cal-nav" type="button" data-dir="-1" aria-label="Vorheriger Monat">‹</button>
        <span class="cal-title"></span>
        <button class="cal-nav" type="button" data-dir="1" aria-label="Nächster Monat">›</button>
      </div>
      <div class="cal-week">${CAL_WEEKDAYS.map(w => '<span>' + w + '</span>').join('')}</div>
      <div class="cal-grid"></div>
      <div class="cal-preview" aria-live="polite"></div>`;

    const title = calEl.querySelector('.cal-title');
    const grid = calEl.querySelector('.cal-grid');
    const preview = calEl.querySelector('.cal-preview');
    const prevBtn = calEl.querySelector('.cal-nav[data-dir="-1"]');
    const nextBtn = calEl.querySelector('.cal-nav[data-dir="1"]');

    function draw() {
      const year = Math.floor(cur / 12);
      const month = cur % 12;                                 // 0-based
      title.textContent = CAL_MONTHS[month] + ' ' + year;
      prevBtn.disabled = cur <= minMonth;
      nextBtn.disabled = cur >= maxMonth;
      grid.innerHTML = '';
      const startCol = (new Date(year, month, 1).getDay() + 6) % 7;   // shift so Monday = 0
      for (let i = 0; i < startCol; i++) {
        const blank = document.createElement('span');
