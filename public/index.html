<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daniels Morning Briefs</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="lib/tokens.css">
<script>
  // Pre-paint animation policy (mirrors the terminal core / pagr): an explicit
  // "off" in localStorage — or no pick while the OS prefers reduced motion —
  // marks html.anim-off so components.css kills keyframes (incl. the brand
  // cursor blink) with no flash. The footer anim toggle persists "on"/"off".
  (function () {
    let pref = null;
    try { pref = localStorage.getItem('anim'); } catch (_) {}
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (pref === 'off' || (pref === null && reduced)) {
      document.documentElement.classList.add('anim-off');
    }
  })();
  // Resolution-independent zoom (mirrors pagr): lay out at a 1920px reference, then
  // scale the whole view up on wider screens — a true zoom of everything, never below
  // 1×. Pre-paint to avoid a flash.
  (function () {
    var applyZoom = function () {
      document.documentElement.style.zoom = String(Math.max(1, window.innerWidth / 1920));
    };
    applyZoom();
    window.addEventListener('resize', applyZoom);
  })();
</script>
<style>
  /* Dashboard chrome styles. Design tokens (colours, shadow, typography vars)
     come from lib/tokens.css — keep them there so the dashboard and the
     newsletter content stay in sync. */
  * { box-sizing: border-box; }
  /* Lock the outer document — only inner scroll containers (the .home view
     and the iframe) handle scrolling. Without this, a tiny mismatch between
     header.app + .app-shell heights and 100vh adds a few pixels of overflow
     to <html>, producing a second outer scrollbar alongside the one inside
     .home. overflow: hidden on both html and body kills that outer track. */
  html, body {
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    height: 100%;
    overflow: hidden;
  }
  html { position: relative; }

  /* Paper-grain noise overlay — same texture as the newsletter pages.
     Imperceptible up close, breaks LCD flatness at distance. Disabled under
     reduced-motion / high-contrast preferences. */
  html::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image: none;
    opacity: 0.04;
    mix-blend-mode: multiply;
  }
  @media (prefers-reduced-motion: reduce), (prefers-contrast: more) {
    html::before { display: none; }
  }
  body > *, header.app { position: relative; z-index: 1; }
  body {
    font-family: var(--font-body);
    line-height: 1.5;
    font-size: 15px;
    font-feature-settings: "kern", "liga", "onum";
    -webkit-font-smoothing: antialiased;
  }

  /* Terminal header bar — mirrors the pagr/seedr chrome: a single row on a
     --card surface with a --border bottom rule. LEFT: the brand wordmark
     (mono + .glow) and a blinking .cursor-block. RIGHT: the nav-rail minimize
     toggle. */
  header.app {
    border-bottom: 1px solid var(--border);
    background: var(--card);
    font-family: var(--font-mono); /* chrome is terminal mono; the content stays serif */
    /* Lift the header above the content, which is also a positioned body child
       at z-index 1 and would otherwise paint over it. */
    z-index: 50;
    padding: 0 1rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    min-height: 3rem;
  }
  /* LEFT zone — brand only. */
  .header-left {
    display: flex;
    align-items: center;
    flex: none;
    min-width: 0;
  }
  .header-brand {
    display: inline-flex;
    align-items: center;
    flex: none;
    text-decoration: none;
    cursor: pointer;
  }
  .header-brand .brand-word {
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: -0.01em;
  }

  /* RIGHT zone — the nav-rail minimize toggle, pushed to the far right
     (the header has no center zone). */
  .header-right {
    flex: none;
    margin-left: auto;
    display: flex;
    align-items: center;
  }

  /* Layout: two columns — flexible main + a fixed-width nav-rail on the right.
     The fixed footer is 2rem tall, so the shell is the viewport minus the
     header (3rem) and the footer (2rem). When the rail is collapsed the
     --rail-w track narrows to the icon-only strip. */
  .app-shell {
    display: grid;
    grid-template-columns: minmax(0, 1fr) var(--rail-w, 16rem);
    height: calc(100vh - 3rem - 2rem);
    height: calc(100dvh - 3rem - 2rem);
  }
  .app-shell.rail-collapsed { --rail-w: 3rem; }

  /* The nav lives in the sticky right sidebar (.nav-rail). It holds the
     Übersicht control (#home-btn) and #nav-groups (the grouped category nav,
     populated by JS). */
  .nav-label {
    font-family: var(--font-mono);
    font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--muted-foreground); padding: 0.5rem 0.85rem 0.2rem; font-weight: 600;
  }
  #nav-groups { padding-bottom: 0.2rem; }

  .cat {
    margin: 0;
    border-radius: 0;
    overflow: hidden;
    border: 0;
  }
  .cat-head {
    display: flex; align-items: center; gap: 0.55rem;
    padding: 0.45rem 0.85rem;
    cursor: pointer;
    border-radius: 0;
    transition: background 120ms;
    min-height: 2.1rem;
  }
  .cat-head:hover { background: var(--muted); }
  .cat-head:hover .cat-name { color: var(--primary); }
  .cat.active .cat-head { background: var(--muted); }
  .cat.active .cat-name { color: var(--primary); }
  .cat-color { width: 6px; height: 18px; border-radius: 0; flex: none; }
  .cat-name {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 0.8rem;
    color: var(--foreground);
    transition: color 0.15s ease;
    flex: 1;
    /* Single-line; ellipsise rather than wrap to two lines. */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .cat-icon { font-size: 1.05rem; }
  .cat-latest {
    font-family: var(--font-mono);
    font-size: 0.68rem; color: var(--soft);
    font-feature-settings: "tnum"; font-weight: 500;
  }
  .cat-toggle {
    background: transparent; border: none;
    color: var(--soft); cursor: pointer;
    transition: transform 150ms ease, background 120ms, color 120ms;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    padding: 0.55rem 0.7rem;
    border-radius: var(--radius-inline);
    line-height: 1;
    min-height: 2.25rem; min-width: 2.25rem;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .cat-toggle:hover { background: var(--rule-soft); color: var(--fg); }
  .cat.open > .cat-head .cat-toggle { transform: rotate(90deg); }

  .cat-dates { display: none; padding: 0.15rem 0.7rem 0.4rem 1.45rem; }

  .cat.open .cat-dates { display: block; }
  /* The category dropdown holds only the archive month-picker: days with a
     brief are clickable (ringed in the category accent), the selected day is
     filled, hovering one previews its title. Border + marks use the
     per-category --cat-accent scoped on the .cat row. */
  .cat-cal {
    margin: 0.2rem 0;
    padding: 0.5rem;
    border: 1px solid var(--cat-accent);
    border-radius: 6px;
    background: var(--rule-soft);
  }
  .cal-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 0.45rem;
  }
  .cal-title {
    font-family: var(--font-mono); font-size: 0.74rem;
    font-weight: 600; color: var(--fg);
  }
  .cal-nav {
    width: 1.7rem; height: 1.7rem; line-height: 1;
    background: transparent; border: 1px solid var(--rule); border-radius: 4px;
    color: var(--muted-ink); font-size: 0.95rem; cursor: pointer;
    transition: color 120ms, border-color 120ms;
  }
  .cal-nav:hover:not(:disabled) { color: var(--fg); border-color: var(--soft); }
  .cal-nav:focus-visible { outline: 2px solid var(--cat-accent, var(--fg)); outline-offset: 2px; }
  .cal-nav:disabled { opacity: 0.3; cursor: default; }
  .cal-week, .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
  }
  .cal-week { margin-bottom: 3px; }
  .cal-week span {
    text-align: center; font-family: var(--font-mono);
    font-size: 0.58rem; color: var(--muted-ink);
  }
  .cal-day {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 0.7rem;
    border-radius: 4px; color: var(--soft);
    font-feature-settings: "tnum";
  }
  .cal-day.none { color: var(--rule); }
  .cal-day.blank { visibility: hidden; }
  .cal-day.has {
    color: var(--fg); font-weight: 600; cursor: pointer; text-decoration: none;
    background: var(--panel);
    box-shadow: inset 0 0 0 1px var(--cat-accent);
    transition: background 100ms, color 100ms;
  }
  .cal-day.has:hover, .cal-day.has:focus-visible,
  .cal-day.has.current {
    background: var(--cat-accent); color: #fff; outline: none;
  }
  .cal-preview {
    margin-top: 0.5rem; padding-top: 0.45rem;
    border-top: 1px solid var(--rule);
    font-family: var(--font-body); font-size: 0.72rem;
    color: var(--muted-ink); line-height: 1.35; min-height: 1.7rem;
  }
  /* ────────────────────────────────────────────────────────────────────
     Fixed footer status bar — mirrors the pagr/seedr StatusBar: a 2rem bar
     pinned to the viewport bottom on a --card surface with a --border top
     rule. LEFT: `[briefs] reader@briefs:~/path` status line. RIGHT: the
     relocated controls (theme menu, language menu) + an anim toggle.
     ──────────────────────────────────────────────────────────────────── */
  footer.status-bar {
    position: fixed;
    inset-inline: 0;
    bottom: 0;
    z-index: 60;
    height: 2rem;
    border-top: 1px solid var(--border);
    background: var(--card);
    font-family: var(--font-mono); /* chrome is terminal mono */
    font-size: 11px;
  }
  .status-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    height: 100%;
    padding: 0 0.85rem;
  }
  .status-path {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted-foreground);
  }
  .status-path .status-tag { color: var(--primary); }
  .status-path .status-loc { color: var(--foreground); }
  .status-controls {
    display: flex;
    align-items: center;
    gap: 1.1rem;
    flex: none;
  }
  .status-sep { height: 0.9rem; width: 1px; background: var(--border); flex: none; }

  /* Footer control buttons — flat, muted, warm to --primary on hover. No
     boxes, no shadows; terminal-plain. */
  .status-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: inherit;
    line-height: 1;
    color: var(--muted-foreground);
    text-decoration: none;
    background: none;
    border: 0;
    border-radius: 0;
    padding: 0;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .status-btn:hover { color: var(--primary); }

  /* Theme + language dropdowns reuse the core .dropdown / .dropdown-panel /
     .dropdown-item primitives. The summary mirrors .status-btn. */
  .status-controls .dropdown > summary { font: inherit; }
  /* Settings icons (.dd-dot theme indicator, .dd-flag language flags) come from
     the shared @danieldeusing/design components.css — no local copy here. */

  /* Anim toggle — `[x] anim` / `[ ] anim`, mirroring pagr's footer toggle. */
  .anim-toggle { white-space: nowrap; }
  .anim-toggle[aria-pressed="true"] .anim-box { color: var(--primary); }

  /* Language picker — the trigger anchors the upward dropdown menu. The menu
     reuses the core .dropdown-panel (absolute, opens above, right-aligned),
     toggled open/closed via the [hidden] attribute by the existing JS. */
  .lang-picker { position: relative; }
  .lang-caret { font-size: 0.6rem; margin-left: 0.1rem; }
  .lang-menu[hidden] { display: none; }
  .lang-option[aria-selected="true"] {
    color: var(--primary);
    text-shadow: 0 0 8px var(--glow);
  }

  .cat-empty {
    font-family: var(--font-mono);
    font-size: 0.7rem; color: var(--soft);
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 0.5rem 0.6rem;
  }

  /* Main area — full width, fills the shell (viewport minus header + footer). */
  .main {
    overflow: hidden;
    background: var(--bg);
    position: relative;
    height: 100%;
  }
  .iframe-host { width: 100%; height: 100%; border: none; background: var(--bg); }

  /* ────────────────────────────────────────────────────────────────────
     Sticky right sidebar (.nav-rail) — terminal mono, --card surface with a
     --border left rule, full shell height with its own scroll. Holds the
     Übersicht control + the grouped category nav. Collapses to a 3rem icon-
     only strip; the width animates via the grid track on .app-shell.
     ──────────────────────────────────────────────────────────────────── */
  .nav-rail {
    grid-column: 2;
    font-family: var(--font-mono);
    background: var(--card);
    border-left: 1px solid var(--border);
    height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 2;
  }
  .nav-rail-head {
    display: flex;
    align-items: center;
    min-height: 2.1rem;
    padding: 0.4rem 0.85rem;
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .nav-rail-title {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 600;
    color: var(--muted-foreground);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-rail-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0.3rem 0 0.4rem;
  }

  /* Minimize toggle — the `»`/`«` chevron in the header right zone. Flat, muted,
     warm to --primary on hover (terminal-plain, no box). */
  .rail-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    flex: none;
    background: none;
    border: 0;
    border-radius: 0;
    color: var(--muted-foreground);
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 1rem;
    line-height: 1;
    transition: color 0.15s ease;
  }
  .rail-toggle:hover { color: var(--primary); }
  /* Expanded → `»` (collapse-to-right); collapsed → `«` (re-open). The button's
     aria-expanded drives the glyph; JS rewrites the text content too as a fallback. */
  .rail-toggle[aria-expanded="false"] .rail-toggle-glyph::before { content: "«"; }
  .rail-toggle[aria-expanded="true"]  .rail-toggle-glyph::before { content: "»"; }
  .rail-toggle-glyph { font-size: 0; }
  .rail-toggle-glyph::before { font-size: 1rem; }

  /* Collapsed strip — keep only the per-category accent bar + icon, hide labels,
     calendars and the home wordmark. The 3rem track clips the rest. */
  .app-shell.rail-collapsed .nav-rail-title,
  .app-shell.rail-collapsed .nav-label,
  .app-shell.rail-collapsed .cat-name,
  .app-shell.rail-collapsed .cat-latest,
  .app-shell.rail-collapsed .cat-toggle,
  .app-shell.rail-collapsed .cat-dates,
  .app-shell.rail-collapsed .home-btn .nav-label-text,
  .app-shell.rail-collapsed .home-btn .brand-mark {
    display: none;
  }
  .app-shell.rail-collapsed .nav-rail-head { justify-content: center; padding: 0.4rem 0; }
  .app-shell.rail-collapsed .cat-head,
  .app-shell.rail-collapsed .home-btn {
    justify-content: center;
    padding-left: 0;
    padding-right: 0;
    gap: 0;
  }
  .app-shell.rail-collapsed .cat-color,
  .app-shell.rail-collapsed .home-btn .cat-color { margin-right: 0.4rem; }

  /* The width transition reads off the grid track; animate it. */
  .app-shell { transition: grid-template-columns 0.18s ease; }
  @media (prefers-reduced-motion: reduce) {
    .app-shell { transition: none; }
  }

  /* Mobile re-open button (a floating ☰); shown only when the rail is an
     off-canvas drawer (≤720px). Hidden on desktop. */
  .rail-fab {
    display: none;
    position: fixed;
    right: 0.75rem;
    bottom: 2.6rem;
    z-index: 55;
    width: 2.6rem;
    height: 2.6rem;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--foreground);
    font-family: var(--font-mono);
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow: 0 0 18px var(--glow-soft);
  }

  /* Home view */
  .home {
    display: none;
    padding: 1.5rem 1.8rem;
    overflow-y: auto; height: 100%;
    /* Container for the responsive .tldr-grid below — column-count tracks
       the actual available width, not the viewport (which changes with
       sidebar collapsed/expanded state). */
    container-type: inline-size;
    container-name: home;
  }
  .home.show { display: block; }
  .home h2 {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 48;
    font-size: 1.55rem; font-weight: 600;
    margin: 0 0 0.5rem; letter-spacing: -0.005em;
  }
  .home .lead { color: var(--muted-ink); margin-bottom: 1.4rem; font-family: var(--font-body); }

  /* Freshness line — "Stand: DD.MM.YYYY" from the manifest's `generated`
     date. Mono-caps to read as a dateline, not body copy. When the manifest
     wasn't rebuilt today (a silently-failed nightly task), .stale flips it to
     the warn accent and appends a hint, so a missed run is visible at a glance
     instead of looking like fresh content. */
  .home-stand {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--soft);
    font-feature-settings: "tnum";
    margin: 0 0 1.2rem;
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .home-stand .stand-date { font-weight: 600; color: var(--muted-ink); }
  .home-stand.stale { color: var(--warn); }
  .home-stand.stale .stand-date { color: var(--warn); }
  .home-stand .stand-note { text-transform: none; letter-spacing: 0.02em; font-style: italic; }

  /* Newsprint column grid — the dashboard reads like one paper folded into
     seven adjacent columns. No card chrome: backgrounds, borders, shadows
     and radii are stripped. Adjacent columns are separated only by a
     hairline column rule, the same way the body-grid inside a newsletter
     uses column-rule between deep-dive sections. */
  /* Responsive column grid — caps at 3 wide so the columns stay readable
     on huge screens instead of shrinking to 5-6 narrow strips. The min
     width per column is the larger of 320 px (floor for readability) or
     1/3 of the container (so no more than 3 fit). Single declaration —
     no media or container queries needed.

     The column-rule + row-rule logic uses container queries against .home
     so the layout responds to actual available width (which changes with
     sidebar collapsed/expanded), not viewport. */
  .tldr-grid {
    display: grid;
    grid-template-columns:
      repeat(auto-fit, minmax(min(100%, max(320px, calc((100% - 2px) / 3))), 1fr));
    gap: 0;
    margin-top: 0.5rem;
  }
  .tldr-card {
    background: transparent;
    border: none;
    border-radius: 0;
    padding: var(--space-2) var(--space-4) var(--space-5);
    box-shadow: none;
    cursor: pointer;
    transition: background 150ms;
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    border-left: 1px solid var(--rule);
  }

  /* Grouped layout: a full-width header band (Wirtschaft / IT / Sport / …)
     precedes each group's cards. The header spans every grid column so the
     column flow restarts beneath it — each group reads as its own newsprint
     block, matching the sidebar's grouping. */
  .tldr-group-head {
    grid-column: 1 / -1;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    font-weight: 600;
    color: var(--soft);
    margin: var(--space-5) 0 0;
    padding: var(--space-3) 0 var(--space-2);
    border-top: 1px solid var(--rule);
  }
  /* The first group header sits right under the "Stand:" line — no big top gap
     or top rule, so the grid doesn't open with a stray divider. */
  .tldr-group-head:first-child { margin-top: 0; border-top: none; padding-top: 0; }

  /* The leading card of each group clears its left column rule so the group's
     first column starts clean (JS marks it; nth-child can't track per-group
     position once headers are interspersed). */
  .tldr-card.group-first { border-left: none; padding-left: 0; }

  /* Single-column band (narrow): no column rules at all; cards in the same
     group separate by a dashed row rule. The group header already divides
     groups, so only same-group siblings (a card directly after another card)
     get the dashed top. */
  @container home (max-width: 639px) {
    .tldr-card { border-left: none; padding-left: 0; }
    .tldr-card + .tldr-card {
      margin-top: var(--space-3);
      padding-top: var(--space-5);
      border-top: 1px dashed var(--rule);
    }
  }
  /* Subtle tinted-paper feedback on hover — no transform, no shadow swap,
     so adjacent columns never visually shift. */
  .tldr-card:hover {
    background: color-mix(in srgb, var(--cat-accent) 4%, transparent);
  }
  .tldr-card:focus-visible {
    outline: 2px solid var(--cat-accent, var(--fg));
    outline-offset: 4px;
  }
  .crumb:focus-visible {
    outline: 2px solid var(--fg);
    outline-offset: 2px;
    border-radius: var(--radius-inline);
  }

  /* Kicker line — same mono-caps treatment as the newsletter masthead-issue.
     Icon left, date right, category name in the middle. */
  .tldr-card-head {
    display: flex; align-items: center; gap: var(--space-2);
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.68rem;
    color: var(--muted-ink);
    border-bottom: none;
    padding-bottom: 0;
    margin-bottom: 0;
  }
  .tldr-card-head .tile-icon {
    font-size: 1rem;
    letter-spacing: normal;
    text-transform: none;
  }
  .tldr-card-head .tile-name {
    font-family: inherit;
    font-variation-settings: normal;
    font-weight: 600;
    font-size: inherit;
    color: var(--cat-accent-text, var(--fg));
    flex: 1;
  }
  .tldr-card-head .tile-date {
    font-family: inherit;
    font-size: inherit;
    color: var(--muted-ink);
    font-weight: 500;
    font-feature-settings: "tnum";
    letter-spacing: 0.1em;
  }

  /* Section title — the actual newsletter headline, rendered as a section
     dek in Fraunces with the same accent-bar treatment as .col h2 inside
     a newsletter. Acts as the "front-page headline" for that category. */
  .tldr-card-headline {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 36, "SOFT" 60;
    font-size: 1.18rem;
    font-weight: 600;
    font-style: normal;
    line-height: 1.18;
    color: var(--fg);
    margin: var(--space-2) 0 var(--space-3);
    letter-spacing: -0.005em;
  }
  .tldr-card-headline::before {
    content: "";
    display: block;
    width: 2rem;
    height: 2px;
    background: var(--cat-accent);
    margin-bottom: var(--space-2);
  }

  /* Strip the embedded TL;DR section's own chrome — it inherits the column
     instead. The lead keeps its drop-cap treatment but at a smaller scale
     suited to the narrower column width. */
  .tldr-card-body .tldr {
    background: transparent; border: none; padding: 0; margin: 0; border-radius: 0;
    display: block;       /* override the .tldr:has(.lead) grid from styles.css */
    column-gap: 0;

  .tldr-card-body .tldr > .lead {
    font-family: var(--font-body);
    font-size: 0.92rem;
    line-height: 1.5;
    color: var(--fg);
    margin: 0 0 var(--space-3);
    max-width: none;

  .tldr-card-body .tldr > .lead::first-letter {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 144, "SOFT" 100;
    font-size: 2.7rem;
    float: left;
    line-height: 0.85;
    padding: 0.25rem 0.45rem 0 0;
    color: var(--cat-accent);
    font-weight: 700;
  }
  .tldr-card-body .tldr ul {
    padding-left: 1rem;
    margin: 0;
    column-count: 1;       /* override 2-col bullet layout in narrow card */
  }
  .tldr-card-body .tldr li { font-size: 0.86rem; margin: 0.4rem 0; line-height: 1.5; }
  .tldr-card-body strong { color: var(--fg); font-weight: 700; }
  .tldr-card-body em { color: var(--muted-ink); font-style: italic; }
  .tldr-card-body a { color: inherit; text-decoration: underline; }
  /* Chips inside TL;DR bullets — tinted by the card's accent. */
  .tldr-card-body .chip {
    display: inline-block;
    font-family: var(--font-mono);
    background: color-mix(in srgb, var(--cat-accent, var(--rule-soft)) 14%, transparent);
    color: var(--fg);
    font-size: 0.6rem; font-weight: 600; padding: 0.05rem 0.45rem;
    border-radius: var(--radius-inline); letter-spacing: 0.04em; margin-right: 0.2rem;
    text-transform: uppercase; vertical-align: middle;
  }
  .tldr-card-body .chip.hot  { background: rgba(182, 64, 47, 0.18); color: #b6402f; }
  .tldr-card-body .chip.good { background: rgba(63, 122, 79, 0.18); color: #3f7a4f; }

  .tldr-card-body a[href^="http"]::after { content: none; }
  /* "+N weitere" overflow marker — the home snapshot caps the TL;DR at a few
     bullets (the full set is one click away). Reads as a muted continuation
     cue, list-style stripped so it doesn't get its own bullet dot. */
  .tldr-card-body .tldr li.tldr-more {
    list-style: none;
    margin-left: -1rem;
    color: var(--soft);
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    font-style: normal;
  }

  /* DE-fallback chip — shown in a card's kicker when the active language has
     no translation for this date and the card is showing the DE original.
     Understated outline so it informs without competing with the accent. */
  .tldr-card-head .fallback-flag {
    font-family: var(--font-mono);
    font-size: 0.58rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--soft);
    border: 1px solid var(--rule);
    border-radius: var(--radius-inline);
    padding: 0.02rem 0.3rem;
    text-transform: uppercase;
    flex: none;
  }

  .tldr-read {
    background: transparent; border: none; color: var(--fg);
    font-family: var(--font-mono);
    font-weight: 600; cursor: pointer;
    font-size: 0.78rem; text-align: left;
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 0.7rem 0.2rem 0.4rem 0; margin-top: auto;
    min-height: 2.25rem;
    border-radius: var(--radius-inline);
  }
  .tldr-read:focus-visible {
    outline: 2px solid var(--cat-accent);
    outline-offset: 2px;
  }
  .tldr-read:hover { text-decoration: underline; }
  .tldr-empty {
    font-family: var(--font-body);
    font-size: 0.88rem; color: var(--soft); font-style: italic; padding: 0.4rem 0;
  }

  /* Empty-state card — "Heute kein Brief". Same per-category accent stripe
     so the category identity is preserved, but the body is muted, dashed,
     and self-evidently dormant. Not clickable. */
  .tldr-card--empty {
    cursor: default;
    background: color-mix(in srgb, var(--bg) 50%, var(--panel));
    box-shadow: none;
  }
  .tldr-card--empty:hover {
    transform: none;
    box-shadow: none;
  }
  .tldr-card--empty .tile-date {
    color: var(--rule);
  }
  .tldr-empty-block {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.5rem;
    padding: 1.2rem 0.4rem 0.8rem;
    border-top: 1px dashed var(--rule);
    border-bottom: 1px dashed var(--rule);
    margin: 0.4rem 0 0;
  }
  .tldr-empty-kicker {
    font-family: var(--font-mono);

    font-size: 0.7rem;

  .tldr-empty-msg {
    font-family: var(--font-body);

    color: var(--muted-ink);
    line-height: 1.5;
    font-style: italic;

  /* Per-category accents — each card scopes its own --cat-accent and
     --cat-accent-text so descendant rules (kicker tile-name, accent bar above
     the headline, drop cap, chips, CTA) all pick up the right colour. */
  .tldr-card[data-cat="economy"]        { --cat-accent: var(--c-economy);        --cat-accent-text: var(--c-economy-text); }
  .tldr-card[data-cat="software"]       { --cat-accent: var(--c-software);       --cat-accent-text: var(--c-software-text); }
  .tldr-card[data-cat="ai-dev"]         { --cat-accent: var(--c-ai-dev);         --cat-accent-text: var(--c-ai-dev-text); }

  .loading {

  /* Color helpers per category */

  /* Sidebar rows scope their own --cat-accent so the archive calendar's border,
     day rings and selected-day fill match the category colour. */
  .cat[data-cat="economy"]        { --cat-accent: var(--c-economy); }
  .cat[data-cat="software"]       { --cat-accent: var(--c-software); }
  .cat[data-cat="ai-dev"]         { --cat-accent: var(--c-ai-dev); }
  .cat[data-cat="ai-usecases"]    { --cat-accent: var(--c-ai-usecases); }

  /* Home button — the "Übersicht" control at the top of the nav dropdown
     panel. Black accent bar (the dashboard's "house" colour) + favicon-style
     M brand mark + label, styled like a terminal .dropdown-item row. */
  .home-btn {

  .home-btn.active { background: var(--muted); color: var(--primary); }
  .home-btn .cat-color {
    width: 6px; height: 18px; border-radius: 0; flex: none;
    background: var(--foreground);
  }
  /* Brand mark = the favicon design at category-icon size. */
  .home-btn .brand-mark {
    width: 1.1rem;
    height: 1.1rem;
    flex: none;
  }
  .home-btn:focus-visible,

    outline: 2px solid var(--ring, var(--primary));
    outline-offset: -2px;
  }

  /* ────────────────────────────────────────────────────────────────────
     Mobile / narrow responsiveness — the nav-rail becomes an off-canvas
     drawer (the .app-shell collapses to a single main column), toggled by
     the floating .rail-fab. The header keeps brand + history controls.
     ──────────────────────────────────────────────────────────────────── */
  @media (max-width: 720px) {

    .tldr-grid { grid-template-columns: 1fr; gap: 0.85rem; }
    .home h2 { font-size: 1.2rem; }
    .status-controls { gap: 0.9rem; }

    /* Single main column; the rail floats as an off-canvas drawer pinned
       under the header / above the footer, slid off to the right until opened. */
    .app-shell,
    .app-shell.rail-collapsed { grid-template-columns: 1fr; }
    .nav-rail {
      position: fixed;
      top: 3rem;
      right: 0;
      bottom: 2rem;
      width: min(80vw, 18rem);
      transform: translateX(100%);
      transition: transform 0.2s ease;
      z-index: 56;
      box-shadow: -8px 0 24px var(--glow-soft);

    .app-shell.rail-collapsed .nav-rail-title,
    .app-shell.rail-collapsed .nav-label,
    .app-shell.rail-collapsed .cat-name,
    .app-shell.rail-collapsed .cat-latest,
    .app-shell.rail-collapsed .cat-toggle,
    .app-shell.rail-collapsed .cat-dates,
    .app-shell.rail-collapsed .home-btn .nav-label-text,
    .app-shell.rail-collapsed .home-btn .brand-mark { display: revert; }
    .app-shell.rail-collapsed .nav-rail-head { justify-content: flex-start; padding: 0.4rem 0.85rem; }
    .app-shell.rail-collapsed .cat-head,
    .app-shell.rail-collapsed .home-btn {
      justify-content: flex-start; padding-left: 0.85rem; padding-right: 0.85rem; gap: 0.55rem;

    .rail-fab { display: inline-flex; align-items: center; justify-content: center; }
  }

    header.app { padding: 0 0.6rem; }
    .header-brand .brand-word { font-size: 0.85rem; }

    .tldr-card { padding: 0.8rem 0.9rem 0.7rem; }
    .tldr-card-body .tldr li { font-size: 0.8rem; }
  }

<!-- Terminal header bar (mirrors pagr): LEFT brand wordmark + cursor; RIGHT the
     nav-rail minimize toggle. The grouped category nav lives in the sticky right
     sidebar (.nav-rail). -->
<header class="app">
  <div class="header-left">
    <a class="header-brand" id="brand-home" href="#home" title="Übersicht">
      <span class="glow brand-word">Daniels Morning Briefs</span>
      <span class="cursor-block" aria-hidden="true"></span>
    </a>
  </div>

  <div class="header-right">

            title="Navigation ein-/ausblenden">
      <span class="rail-toggle-glyph" aria-hidden="true">»</span>
    </button>
  </div>
</header>

<div class="app-shell">

  </main>

  <!-- Sticky right sidebar: the relocated Übersicht control (#home-btn) and the
       grouped category nav (#nav-groups, populated by JS from NAV_GROUPS). Can be
       minimized to an icon-only strip; collapsed state persists in localStorage. -->
  <aside class="nav-rail" id="nav-rail" aria-label="Navigation">
    <div class="nav-rail-head">
      <span class="nav-rail-title">~/briefs</span>
    </div>
    <div class="nav-rail-body">
      <div class="home-btn active" id="home-btn" role="button" tabindex="0" title="Übersicht">
        <span class="cat-color"></span>
        <!-- Full favicon design inline: dark frame + cream page + red
             double-rule + serif M. Identical SVG to favicon.svg so the
             browser tab and the home control read as the same "house" mark. -->
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">

        <span class="nav-label-text">Übersicht</span>
      </div>
      <div id="nav-groups"><!-- populated by JS from NAV_GROUPS: grouped category
           nav (Wirtschaft / IT / jobs / Sport / Freizeit / Sprachen), each group
           with its own .nav-label header (standalone groups render headerless). --></div>
    </div>
  </aside>
</div>

<button class="rail-fab" id="rail-fab" type="button" aria-controls="nav-rail"
        aria-label="Navigation öffnen" title="Navigation">☰</button>

     toggle (right). Controls keep their original ids so the existing handlers

        <span>anim</span>
      </button>
    </nav>
  </div>
</footer>

 <li><span class=\"chip good\">PUFFER</span> <strong>BCB-Netto-Devisenposition 260,1 Mrd. $</strong> (29.07.) — über dem Stand von Ende 2025. Die Notenbank musste nicht stützen.</li>\n      <li><span class=\"chip\">TEST</span> <strong>Gestrige Prognose</strong>: 5,80–5,87, am ehesten 5,84. Gekommen ist 5,8095 — Spanne getroffen, unterer Rand.</li>\n      <li><span class=\"chip hot\">PROGNOSE</span> <strong>Für den Montag-Fix erwarte ich 5,77–5,86</strong>, am ehesten 5,81 (~35 %).</li>\n    </ul></div>",

 class=\"chip good\">PUFFER</span> <strong>BCB-Netto-Devisenposition 260,1 Mrd. $</strong> (29.07.) — über dem Stand von Ende 2025. Die Notenbank musste nicht stützen.</li>\n      <li><span class=\"chip\">TEST</span> <strong>Gestrige Prognose</strong>: 5,80–5,87, am ehesten 5,84. Gekommen ist 5,8095 — Spanne getroffen, unterer Rand.</li>\n      <li><span class=\"chip hot\">PROGNOSE</span> <strong>Für den Montag-Fix erwarte ich 5,77–5,86</strong>, am ehesten 5,81 (~35 %).</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><h2>The 30-second version</h2>\n    <p class=\"lead\">Yesterday the euro carried the whole move; on Friday it was the exact mirror image: the fix fell 0.75%, and practically all of it came from Brazil. The dollar index stood still — so this wasn't dollar weakness, it was genuine real strength. For Daniel's exchange, that means Thursday's better rate has been wiped out again. Next week's question gets decided Wednesday evening in Brasília.</p>\n    <ul>\n      <li><span class=\"chip\">FX</span> <strong>EUR/BRL 5.8095</strong> (ECB fix, Fri Jul 31): <strong>−0.75%</strong> versus the prior day. The week's balance still comes out positive at +0.47%.</li>\n      <li><span class=\"chip\">MECHANICS</span> <strong>Decomposed</strong>: USD/BRL −0.83%, EUR/USD +0.08%. The real carried the whole move — the exact reverse of Thursday.</li>\n      <li><span class=\"chip hot\">HEADS UP</span> <strong>Concretely for the exchange</strong>: 100 € got 585.35 R$ on Thursday, only 580.95 R$ on Friday — 4.40 R$ less per hundred euros.</li>\n      <li><span class=\"chip\">DOLLAR</span> <strong>DXY around 99.8</strong> (−0.06%, Jul 31 close) — the world-market dollar stood still. The real ran away from it on its own.</li>\n      <li><span class=\"chip hot\">BR</span> <strong>Copom #280 meets Tue/Wed Aug 4–5</strong>, announcement Wednesday evening. Selic at 14.25%, Focus median for year-end 14.00% — exactly one cut left.</li>\n      <li><span class=\"chip\">BR</span> <strong>CDI 14.15%</strong> (Aug 1) — the interbank rate confirms: no cut yet.</li>\n      <li><span class=\"chip\">OIL</span> <strong>Brent about a quarter pricier than a month ago</strong> (+24.4%). On the price level itself, sources diverge by 5% — so no point figure is given here.</li>\n      <li><span class=\"chip\">RISK</span> <strong>5-year CDS 125.90</strong> (Jul 31 close) — notably calm for a country three months from the election.</li>\n      <li><span class=\"chip good\">BUFFER</span> <strong>BCB net FX position $260.1B</strong> (Jul 29) — above the end-of-2025 level. The central bank didn't need to intervene.</li>\n      <li><span class=\"chip\">TEST</span> <strong>Yesterday's forecast</strong>: 5.80–5.87, most likely 5.84. What came was 5.8095 — range hit, lower edge.</li>\n      <li><span class=\"chip hot\">FORECAST</span> <strong>For the Monday fix I expect 5.77–5.86</strong>, most likely 5.81 (~35%).</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><h2>O essencial em 30 segundos</h2>\n    <p class=\"lead\">Ontem o euro carregou todo o movimento; na sexta-feira foi o espelho exato: o fixing caiu 0,75 %, e praticamente tudo veio do Brasil. O índice do dólar ficou parado — ou seja, não foi fraqueza do dólar, e sim força real do real. Para o câmbio do Daniel, isso significa que a cotação melhor de quinta-feira foi apagada de novo. A pergunta da semana que vem se decide na quarta à noite, em Brasília.</p>\n    <ul>\n      <li><span class=\"chip\">FX</span> <strong>EUR/BRL 5,8095</strong> (fixing do BCE, sex 31/07): <strong>−0,75 %</strong> em relação ao dia anterior. O saldo da semana ainda fica positivo, em +0,47 %.</li>\n      <li><span class=\"chip\">MECÂNICA</span> <strong>Decomposto</strong>: USD/BRL −0,83 %, EUR/USD +0,08 %. O real carregou tudo — exatamente o inverso de quinta-feira.</li>\n      <li><span class=\"chip hot\">ATENÇÃO</span> <strong>Na prática, para o câmbio</strong>: 100 € renderam 585,35 R$ na quinta-feira, e só 580,95 R$ na sexta — 4,40 R$ a menos a cada cem euros.</li>\n      <li><span class=\"chip\">DÓLAR</span> <strong>DXY em torno de 99,8</strong> (−0,06 %, fechamento de 31/07) — o dólar do mercado global ficou parado. O real disparou sozinho.</li>\n      <li><span class=\"chip hot\">BR</span> <strong>Copom #280 se reúne ter/qua 04–05/08</strong>, anúncio na quarta à noite. Selic em 14,25 %, mediana Focus para o fim do ano em 14,00 % — exatamente um corte restante.</li>\n      <li><span class=\"chip\">BR</span> <strong>CDI 14,15 %</strong> (01/08) — a taxa interbancária confirma: ainda não houve corte.</li>\n      <li><span class=\"chip\">PETRÓLEO</span> <strong>Brent cerca de um quarto mais caro que há um mês</strong> (+24,4 %). No nível do preço em si, as fontes divergem 5 % — por isso não há uma cifra pontual aqui.</li>\n      <li><span class=\"chip\">RISCO</span> <strong>CDS de 5 anos 125,90</strong> (fechamento de 31/07) — notavelmente calmo para um país a três meses da eleição.</li>\n      <li><span class=\"chip good\">COLCHÃO</span> <strong>Posição cambial líquida do BC de US$ 260,1 bi</strong> (29/07) — acima do nível de fim de 2025. O Banco Central não precisou intervir.</li>\n      <li><span class=\"chip\">TESTE</span> <strong>Previsão de ontem</strong>: 5,80–5,87, mais provável 5,84. Veio 5,8095 — faixa acertada, na borda inferior.</li>\n      <li><span class=\"chip hot\">PREVISÃO</span> <strong>Para o fixing de segunda-feira espero 5,77–5,86</strong>, mais provável 5,81 (~35 %).</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><h2>Lo esencial en 30 segundos</h2>\n    <p class=\"lead\">Ayer el euro cargó con todo el movimiento; el viernes fue el espejo exacto: el fixing cayó 0,75 %, y prácticamente todo vino de Brasil. El índice del dólar se quedó quieto — o sea, no fue debilidad del dólar, sino fortaleza genuina del real. Para el cambio de Daniel, eso significa que el mejor tipo de cambio del jueves volvió a borrarse. La pregunta de la próxima semana se decide el miércoles por la noche en Brasilia.</p>\n    <ul>\n      <li><span class=\"chip\">FX</span> <strong>EUR/BRL 5,8095</strong> (fixing del BCE, vie 31/07): <strong>−0,75 %</strong> respecto al día anterior. El saldo de la semana sigue siendo positivo, en +0,47 %.</li>\n      <li><span class=\"chip\">MECÁNICA</span> <strong>Descompuesto</strong>: USD/BRL −0,83 %, EUR/USD +0,08 %. El real cargó con todo — justo lo inverso del jueves.</li>\n      <li><span class=\"chip hot\">ATENCIÓN</span> <strong>En concreto, para el cambio</strong>: 100 € dieron 585,35 R$ el jueves, y solo 580,95 R$ el viernes — 4,40 R$ menos por cada cien euros.</li>\n      <li><span class=\"chip\">DÓLAR</span> <strong>DXY alrededor de 99,8</strong> (−0,06 %, cierre del 31/07) — el dólar del mercado mundial se quedó quieto. El real se le escapó solo.</li>\n      <li><span class=\"chip hot\">BR</span> <strong>El Copom #280 se reúne mar/mié 04–05/08</strong>, anuncio el miércoles por la noche. Selic en 14,25 %, mediana Focus a fin de año en 14,00 % — queda exactamente un recorte.</li>\n      <li><span class=\"chip\">BR</span> <strong>CDI 14,15 %</strong> (01/08) — la tasa interbancaria confirma: todavía no hubo recorte.</li>\n      <li><span class=\"chip\">PETRÓLEO</span> <strong>El Brent, cerca de un cuarto más caro que hace un mes</strong> (+24,4 %). En el nivel del precio en sí, las fuentes difieren 5 % — por eso aquí no hay una cifra puntual.</li>\n      <li><span class=\"chip\">RIESGO</span> <strong>CDS a 5 años 125,90</strong> (cierre del 31/07) — notablemente tranquilo para un país a tres meses de la elección.</li>\n      <li><span class=\"chip good\">COLCHÓN</span> <strong>Posición cambiaria neta del BCB de US$ 260,1 mil millones</strong> (29/07) — por encima del nivel de fines de 2025. El banco central no tuvo que intervenir.</li>\n      <li><span class=\"chip\">PRUEBA</span> <strong>Pronóstico de ayer</strong>: 5,80–5,87, lo más probable 5,84. Llegó a 5,8095 — rango acertado, en el borde inferior.</li>\n      <li><span class=\"chip hot\">PRONÓSTICO</span> <strong>Para el fixing del lunes espero 5,77–5,86</strong>, lo más probable 5,81 (~35 %).</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Wiz hat vorgestern eine Lücke in <strong>Azure Cosmos DB</strong> offengelegt, die es erlaubt hätte, den Hauptschlüssel <em>jedes</em> Kunden-Kontos abzuholen — über öffentlich erreichbare Endpunkte. Sie ist längst geschlossen, es gab nie eine CVE-Nummer, und kein Werkzeug in deiner Kette hätte sie je angezeigt. Am selben Wochenende: ein <strong>CVSS 9,8</strong> in CodeIgniter, das man selbst patchen muss, und eine Behördenfrist für ein Cisco-Passwort, die <strong>heute</strong> abläuft. Drei Lücken, drei völlig verschiedene Zuständigkeiten — und unsere Werkzeuge kennen nur eine davon.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>CosmosEscape</strong>: plattformweiter Schlüssel in Azure Cosmos DB, der den Primary Key jedes Kontos herausgab. Gemeldet 20.11.2025, Einstieg in <strong>48 Stunden</strong> dicht, vollständig behoben erst <strong>Juli 2026</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Keine CVE-Nummer</strong> für die Cosmos-Lücke — Microsoft meldet „no evidence of customer impact\". Für Scanner, SBOM und KEV-Feed hat sie nie existiert. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>CodeIgniter 4</strong>: CVE-2026-63223, <strong>CVSS 9,8</strong>, Upload-Regeln <code>is_image</code>/<code>mime_in</code> prüfen die Dateiendung nicht mit. Fix in <strong>4.7.4</strong> (NVD, 31.07.). <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Heute Frist</strong>: CVE-2026-20316 (Cisco Secure FMC, fest einkompiliertes Passwort, aktiv ausgenutzt) — Basis-Score nur <strong>5,3</strong>, Cisco stuft trotzdem „High\" ein. <span class=\"chip\">USA</span></li>\n      <li><span class=\"chip good\">Regulierung</span> <strong>Bundeskartellamt</strong> schließt die SAP-Vorermittlungen (30.07.): <em>derzeit</em> keine Anhaltspunkte für Missbrauch beim ERP-Datenzugang. Celonis geht leer aus. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>Vegas-Woche</strong>: Black Hat Trainings ab heute, Briefings Mi/Do, DEF CON 34 ab Donnerstag. Die dichteste Offenlegungs-Woche des Jahres. <span class=\"chip\">USA</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Turso</strong> baut ein Postgres in Rust — angekündigt aber schon am <strong>16.07.</strong>, nicht diese Woche. Die Fachpresse hat es erst am 29.07. aufgegriffen. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Release</span> <strong>Ruhige Punkt-Releases</strong>: Firefox 153.0.1 (28.07.), Angular 22.0.8 (22.07.), SQLite 3.53.4 (24.07.), PostgreSQL 19 Beta 2 (16.07.) — alle nur sekundär bestätigt. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">BR</span> <strong>Brasilien</strong>: heute nichts Datierbares aus der BR-Dev-Ecke. Lücke statt Platzhalter. <span class=\"chip\">BR</span></li>\n    </ul></div>",
      "latestTldrHtmlByLang": {
        "de": "<div class=\"tldr\"><p class=\"lead\">Wiz hat vorgestern eine Lücke in <strong>Azure Cosmos DB</strong> offengelegt, die es erlaubt hätte, den Hauptschlüssel <em>jedes</em> Kunden-Kontos abzuholen — über öffentlich erreichbare Endpunkte. Sie ist längst geschlossen, es gab nie eine CVE-Nummer, und kein Werkzeug in deiner Kette hätte sie je angezeigt. Am selben Wochenende: ein <strong>CVSS 9,8</strong> in CodeIgniter, das man selbst patchen muss, und eine Behördenfrist für ein Cisco-Passwort, die <strong>heute</strong> abläuft. Drei Lücken, drei völlig verschiedene Zuständigkeiten — und unsere Werkzeuge kennen nur eine davon.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>CosmosEscape</strong>: plattformweiter Schlüssel in Azure Cosmos DB, der den Primary Key jedes Kontos herausgab. Gemeldet 20.11.2025, Einstieg in <strong>48 Stunden</strong> dicht, vollständig behoben erst <strong>Juli 2026</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Keine CVE-Nummer</strong> für die Cosmos-Lücke — Microsoft meldet „no evidence of customer impact\". Für Scanner, SBOM und KEV-Feed hat sie nie existiert. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>CodeIgniter 4</strong>: CVE-2026-63223, <strong>CVSS 9,8</strong>, Upload-Regeln <code>is_image</code>/<code>mime_in</code> prüfen die Dateiendung nicht mit. Fix in <strong>4.7.4</strong> (NVD, 31.07.). <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Heute Frist</strong>: CVE-2026-20316 (Cisco Secure FMC, fest einkompiliertes Passwort, aktiv ausgenutzt) — Basis-Score nur <strong>5,3</strong>, Cisco stuft trotzdem „High\" ein. <span class=\"chip\">USA</span></li>\n      <li><span class=\"chip good\">Regulierung</span> <strong>Bundeskartellamt</strong> schließt die SAP-Vorermittlungen (30.07.): <em>derzeit</em> keine Anhaltspunkte für Missbrauch beim ERP-Datenzugang. Celonis geht leer aus. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>Vegas-Woche</strong>: Black Hat Trainings ab heute, Briefings Mi/Do, DEF CON 34 ab Donnerstag. Die dichteste Offenlegungs-Woche des Jahres. <span class=\"chip\">USA</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Turso</strong> baut ein Postgres in Rust — angekündigt aber schon am <strong>16.07.</strong>, nicht diese Woche. Die Fachpresse hat es erst am 29.07. aufgegriffen. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Release</span> <strong>Ruhige Punkt-Releases</strong>: Firefox 153.0.1 (28.07.), Angular 22.0.8 (22.07.), SQLite 3.53.4 (24.07.), PostgreSQL 19 Beta 2 (16.07.) — alle nur sekundär bestätigt. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">BR</span> <strong>Brasilien</strong>: heute nichts Datierbares aus der BR-Dev-Ecke. Lücke statt Platzhalter. <span class=\"chip\">BR</span></li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Wiz disclosed a flaw in <strong>Azure Cosmos DB</strong> the day before yesterday that would have let an attacker pull the primary key of <em>any</em> customer account — through publicly reachable endpoints. It's long since closed, it never got a CVE number, and no tool in your chain would ever have flagged it. Same weekend: a <strong>CVSS 9.8</strong> in CodeIgniter that you have to patch yourself, and a federal deadline for a Cisco password that expires <strong>today</strong>. Three flaws, three completely different zones of responsibility — and our tools only know one of them.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>CosmosEscape</strong>: a platform-wide key in Azure Cosmos DB that handed out the primary key for any account. Reported 2025-11-20, entry point closed within <strong>48 hours</strong>, fully fixed only by <strong>July 2026</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>No CVE number</strong> was assigned to the Cosmos flaw — Microsoft reports \"no evidence of customer impact.\" For scanners, SBOMs, and the KEV feed, it never existed. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>CodeIgniter 4</strong>: CVE-2026-63223, <strong>CVSS 9.8</strong>, upload rules <code>is_image</code>/<code>mime_in</code> don't validate the file extension. Fix in <strong>4.7.4</strong> (NVD, Jul 31). <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Deadline today</strong>: CVE-2026-20316 (Cisco Secure FMC, hardcoded password, actively exploited) — base score only <strong>5.3</strong>, Cisco still rates it \"High.\" <span class=\"chip\">USA</span></li>\n      <li><span class=\"chip good\">Regulation</span> <strong>Germany's antitrust authority</strong> closes its preliminary inquiry into SAP (Jul 30): <em>currently</em> no evidence of abuse in ERP data access. Celonis comes away empty-handed. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>Vegas week</strong>: Black Hat trainings start today, briefings Wed/Thu, DEF CON 34 starts Thursday. The densest disclosure week of the year. <span class=\"chip\">USA</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Turso</strong> is building a Postgres in Rust — announced back on <strong>Jul 16</strong>, not this week. Trade press only picked it up on Jul 29. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Release</span> <strong>Quiet point releases</strong>: Firefox 153.0.1 (Jul 28), Angular 22.0.8 (Jul 22), SQLite 3.53.4 (Jul 24), PostgreSQL 19 Beta 2 (Jul 16) — all confirmed only via secondary sources. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">BR</span> <strong>Brazil</strong>: nothing dateable out of the BR dev corner today. A gap, not a placeholder. <span class=\"chip\">BR</span></li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Anteontem, a Wiz revelou uma falha no <strong>Azure Cosmos DB</strong> que teria permitido obter a chave principal de <em>qualquer</em> conta de cliente — por meio de endpoints acessíveis publicamente. Ela já está fechada há tempos, nunca recebeu um número de CVE, e nenhuma ferramenta na sua cadeia jamais a teria detectado. No mesmo fim de semana: um <strong>CVSS 9,8</strong> no CodeIgniter que cada um precisa corrigir por conta própria, e um prazo regulatório para uma senha da Cisco que vence <strong>hoje</strong>. Três falhas, três responsabilidades completamente diferentes — e nossas ferramentas só conhecem uma delas.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>CosmosEscape</strong>: chave válida para toda a plataforma no Azure Cosmos DB, que entregava a chave primária de qualquer conta. Reportado em 20/11/2025, ponto de entrada fechado em <strong>48 horas</strong>, correção completa só em <strong>julho de 2026</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Nenhum número de CVE</strong> para a falha do Cosmos — a Microsoft relata \"no evidence of customer impact\". Para scanners, SBOM e o feed da KEV, ela nunca existiu. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>CodeIgniter 4</strong>: CVE-2026-63223, <strong>CVSS 9,8</strong>, as regras de upload <code>is_image</code>/<code>mime_in</code> não checam a extensão do arquivo. Correção na <strong>4.7.4</strong> (NVD, 31/07). <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Prazo hoje</strong>: CVE-2026-20316 (Cisco Secure FMC, senha fixa embutida, explorada ativamente) — base score de apenas <strong>5,3</strong>, mas a Cisco classifica como \"High\" mesmo assim. <span class=\"chip\">EUA</span></li>\n      <li><span class=\"chip good\">Regulação</span> <strong>Bundeskartellamt</strong> (autoridade antitruste alemã) encerra a apuração preliminar sobre a SAP (30/07): <em>por ora</em>, sem indícios de abuso no acesso a dados de ERP. A Celonis fica sem nada. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>Semana de Vegas</strong>: treinamentos da Black Hat a partir de hoje, briefings quarta/quinta, DEF CON 34 a partir de quinta. A semana de divulgações mais densa do ano. <span class=\"chip\">EUA</span></li>\n      <li><span class=\"chip\">OSS</span> A <strong>Turso</strong> está construindo um Postgres em Rust — anunciado já em <strong>16/07</strong>, não nesta semana. A imprensa especializada só repercutiu em 29/07. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Release</span> <strong>Releases pontuais tranquilos</strong>: Firefox 153.0.1 (28/07), Angular 22.0.8 (22/07), SQLite 3.53.4 (24/07), PostgreSQL 19 Beta 2 (16/07) — todos confirmados só por fontes secundárias. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">BR</span> <strong>Brasil</strong>: hoje não saiu nada datável do universo dev brasileiro. Lacuna em vez de espaço de preenchimento. <span class=\"chip\">BR</span></li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Anteayer, Wiz reveló una falla en <strong>Azure Cosmos DB</strong> que habría permitido obtener la llave principal de <em>cualquier</em> cuenta de cliente — a través de endpoints accesibles públicamente. Ya está cerrada desde hace tiempo, nunca tuvo un número de CVE, y ninguna herramienta de tu cadena la habría detectado jamás. El mismo fin de semana: un <strong>CVSS 9,8</strong> en CodeIgniter que hay que parchar uno mismo, y un plazo regulatorio para una contraseña de Cisco que vence <strong>hoy</strong>. Tres fallas, tres responsabilidades completamente distintas — y nuestras herramientas solo conocen una de ellas.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>CosmosEscape</strong>: llave válida para toda la plataforma en Azure Cosmos DB, que entregaba la llave primaria de cualquier cuenta. Reportado el 20/11/2025, punto de entrada cerrado en <strong>48 horas</strong>, corrección completa recién en <strong>julio de 2026</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Ningún número de CVE</strong> para la falla de Cosmos — Microsoft reporta \"no evidence of customer impact\". Para scanners, SBOM y el feed de la KEV, nunca existió. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>CodeIgniter 4</strong>: CVE-2026-63223, <strong>CVSS 9,8</strong>, las reglas de subida <code>is_image</code>/<code>mime_in</code> no validan la extensión del archivo. Corrección en <strong>4.7.4</strong> (NVD, 31/07). <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Plazo hoy</strong>: CVE-2026-20316 (Cisco Secure FMC, contraseña fija embebida, explotada activamente) — puntaje base de solo <strong>5,3</strong>, pero Cisco lo clasifica como \"High\" de todas formas. <span class=\"chip\">EE. UU.</span></li>\n      <li><span class=\"chip good\">Regulación</span> El <strong>Bundeskartellamt</strong> (autoridad antimonopolio alemana) cierra la investigación preliminar sobre SAP (30/07): <em>por ahora</em>, sin indicios de abuso en el acceso a datos de ERP. Celonis se queda sin nada. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>Semana de Vegas</strong>: los entrenamientos de Black Hat empiezan hoy, briefings mié/jue, DEF CON 34 desde el jueves. La semana de divulgaciones más densa del año. <span class=\"chip\">EE. UU.</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Turso</strong> está construyendo un Postgres en Rust — anunciado ya el <strong>16/07</strong>, no esta semana. La prensa especializada recién lo recogió el 29/07. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Release</span> <strong>Releases menores tranquilos</strong>: Firefox 153.0.1 (28/07), Angular 22.0.8 (22/07), SQLite 3.53.4 (24/07), PostgreSQL 19 Beta 2 (16/07) — todos confirmados solo por fuentes secundarias. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">BR</span> <strong>Brasil</strong>: hoy no salió nada fechable del rincón dev brasileño. Vacío en vez de relleno. <span class=\"chip\">BR</span></li>\n    </ul></div>"
      }

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Beide großen SWE-Bench-Verified-Tracker tragen heute ein frisches Datum — llm-stats den 1. August, vals.ai den 31. Juli. Nur: Hinter dem neuen Datum bei vals.ai steht Ziffer für Ziffer dasselbe Feld, das hier am Donnerstag schon mit Board-Stand 22.07. abgedruckt war, und bei llm-stats fehlt Claude Opus 5 acht Tage nach seinem Erscheinen immer noch komplett. Die eigentliche Nachricht steckt im Vergleich der beiden: Wo die Boards dieselben Modelle führen, nennen sie <em>exakt</em> dieselbe Zahl. Der Widerspruch ist keine Messdifferenz, sondern eine Abdeckungsfrage — und das ändert, wie man solche Ranglisten liest.</p>\n    <ul>\n      <li><span class=\"chip hot\">Bench</span> <strong>Zwei Boards, zwei Sieger</strong>: vals.ai (<em>„Updated: 7/31/2026\"</em>) führt <strong>Claude Opus 5</strong> mit <span class=\"stat\">97,0 %</span> an; llm-stats (<em>„Last updated August 1, 2026\"</em>) führt <strong>Claude Fable 5</strong> mit <span class=\"stat\">95,0 %</span> an — und listet Opus 5 überhaupt nicht.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>Der Befund, der die Divergenz auflöst</strong>: In den Modellen, die beide Boards führen, stimmen sie auf die Nachkommastelle überein — Fable 5 <span class=\"stat\">95,0 %</span>, Opus 4.8 <span class=\"stat\">88,6 %</span>. Gestritten wird nicht über Zahlen, sondern über die Teilnehmerliste.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Neues Datum, altes Feld</strong>: vals.ais Top 7 sind identisch mit dem Stand vom <strong>22.07.</strong>, den dieser Newsletter am Donnerstag abgedruckt hat. Sieben Modelle, sieben unveränderte Werte, ein neues Datum.</li>\n      <li><span class=\"chip hot\">OpenAI</span> <strong>Harter Termin in 30 Tagen</strong>: <em>„On August 31, 2026, GPT-5.4 and GPT-5.4 mini will no longer be available in Codex\"</em> — Ersatz laut OpenAI: <code>gpt-5.4</code> → <code>gpt-5.6-terra</code>, <code>gpt-5.4-mini</code> → <code>gpt-5.6-luna</code>.</li>\n      <li><span class=\"chip\">Claude</span> <strong>Die Anbieter-Zahl daneben gelegt</strong>: Anthropic selbst schreibt zu Opus 5 <em>„performs within 0.5% of Fable 5's peak score, but at half the cost per task\"</em> — auf CursorBench 3.2. vals.ai sieht auf SWE-Bench zwei ganze Punkte Vorsprung. Anderer Maßstab, anderes Bild.</li>\n      <li><span class=\"chip\">OSS</span> <strong>82 % aus genau einer Quelle</strong>: Die viel zitierte SWE-Verified-Zahl von <strong>Qwen 4 Coder 32B-A3B</strong> steht in einem Review-Blog — nicht auf einem unabhängigen Board, nicht auf Qwens eigener Seite. Bis dahin: Behauptung, kein Messwert.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Aider bleibt eingefroren</strong>: Board-Stand weiterhin <strong>20.11.2025</strong>, an der Spitze gpt-5 (high) mit <span class=\"stat\">88,0 %</span>. Als Gegenprobe zu irgendetwas aus 2026 unbrauchbar.</li>\n      <li><span class=\"chip good\">Local</span> <strong>Ollama hat eine Kommandozeile weniger</strong>: Seit <code>v0.32.0</code> (11.07.) startet das nackte <code>ollama</code> eine interaktive Agenten-Sitzung statt einer Hilfeseite.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Ruhige Woche bei Claude Code</strong>: Der eigene Wochen-Digest hat seit <strong>Woche 29 (13.–17.07.)</strong> keinen neuen Eintrag. Zwei Wochen Stille sind selbst eine Information.</li>\n    </ul></div>",

e>gpt-5.6-luna</code>.</li>\n      <li><span class=\"chip\">Claude</span> <strong>Die Anbieter-Zahl daneben gelegt</strong>: Anthropic selbst schreibt zu Opus 5 <em>„performs within 0.5% of Fable 5's peak score, but at half the cost per task\"</em> — auf CursorBench 3.2. vals.ai sieht auf SWE-Bench zwei ganze Punkte Vorsprung. Anderer Maßstab, anderes Bild.</li>\n      <li><span class=\"chip\">OSS</span> <strong>82 % aus genau einer Quelle</strong>: Die viel zitierte SWE-Verified-Zahl von <strong>Qwen 4 Coder 32B-A3B</strong> steht in einem Review-Blog — nicht auf einem unabhängigen Board, nicht auf Qwens eigener Seite. Bis dahin: Behauptung, kein Messwert.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Aider bleibt eingefroren</strong>: Board-Stand weiterhin <strong>20.11.2025</strong>, an der Spitze gpt-5 (high) mit <span class=\"stat\">88,0 %</span>. Als Gegenprobe zu irgendetwas aus 2026 unbrauchbar.</li>\n      <li><span class=\"chip good\">Local</span> <strong>Ollama hat eine Kommandozeile weniger</strong>: Seit <code>v0.32.0</code> (11.07.) startet das nackte <code>ollama</code> eine interaktive Agenten-Sitzung statt einer Hilfeseite.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Ruhige Woche bei Claude Code</strong>: Der eigene Wochen-Digest hat seit <strong>Woche 29 (13.–17.07.)</strong> keinen neuen Eintrag. Zwei Wochen Stille sind selbst eine Information.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Both major SWE-Bench Verified trackers carry a fresh date today — llm-stats says August 1, vals.ai says July 31. Only: behind vals.ai's new date sits digit-for-digit the same field this space already printed on Thursday at the July 22 board state, and llm-stats still doesn't list Claude Opus 5 at all, eight days after it shipped. The real story is in comparing the two: where the boards feature the same models, they cite <em>exactly</em> the same number. The contradiction isn't a measurement gap — it's a coverage question, and that changes how you should read rankings like these.</p>\n    <ul>\n      <li><span class=\"chip hot\">Bench</span> <strong>Two boards, two winners</strong>: vals.ai (<em>\"Updated: 7/31/2026\"</em>) has <strong>Claude Opus 5</strong> on top with <span class=\"stat\">97.0%</span>; llm-stats (<em>\"Last updated August 1, 2026\"</em>) has <strong>Claude Fable 5</strong> on top with <span class=\"stat\">95.0%</span> — and doesn't list Opus 5 at all.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>The finding that resolves the divergence</strong>: on the models both boards feature, they match to the decimal — Fable 5 at <span class=\"stat\">95.0%</span>, Opus 4.8 at <span class=\"stat\">88.6%</span>. The disagreement isn't over numbers, it's over the roster.</li>\n      <li><span class=\"chip\">Bench</span> <strong>New date, old field</strong>: vals.ai's top 7 is identical to the July 22 state this newsletter printed on Thursday. Seven models, seven unchanged values, one new date.</li>\n      <li><span class=\"chip hot\">OpenAI</span> <strong>A hard deadline in 30 days</strong>: <em>\"On August 31, 2026, GPT-5.4 and GPT-5.4 mini will no longer be available in Codex\"</em> — replacements per OpenAI: <code>gpt-5.4</code> → <code>gpt-5.6-terra</code>, <code>gpt-5.4-mini</code> → <code>gpt-5.6-luna</code>.</li>\n      <li><span class=\"chip\">Claude</span> <strong>The vendor's own number lands elsewhere</strong>: Anthropic itself writes about Opus 5 that it <em>\"performs within 0.5% of Fable 5's peak score, but at half the cost per task\"</em> — on CursorBench 3.2. vals.ai sees a full two-point lead on SWE-Bench. Different yardstick, different picture.</li>\n      <li><span class=\"chip\">OSS</span> <strong>82% from exactly one source</strong>: the widely cited SWE-Verified figure for <strong>Qwen 4 Coder 32B-A3B</strong> lives in a review blog — not on an independent board, not on Qwen's own page. Until then: a claim, not a measurement.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Aider stays frozen</strong>: board state still <strong>Nov 20, 2025</strong>, topped by gpt-5 (high) at <span class=\"stat\">88.0%</span>. Useless as a cross-check against anything from 2026.</li>\n      <li><span class=\"chip good\">Local</span> <strong>Ollama has one fewer command line</strong>: since <code>v0.32.0</code> (Jul 11), bare <code>ollama</code> now launches an interactive agent session instead of a help page.</li>\n      <li><span class=\"chip\">Tool</span> <strong>A quiet week for Claude Code</strong>: its own weekly digest hasn't had a new entry since <strong>Week 29 (Jul 13–17)</strong>. Two weeks of silence is information in itself.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Os dois grandes rastreadores do SWE-Bench Verified trazem hoje uma data recente — o llm-stats aponta 1º de agosto, o vals.ai aponta 31 de julho. Só que, por trás da nova data do vals.ai, está exatamente o mesmo campo que este espaço já publicou na quinta-feira com o estado do quadro de 22/07, e no llm-stats o Claude Opus 5 ainda está totalmente ausente oito dias depois de seu lançamento. A notícia de verdade está na comparação entre os dois: onde os quadros trazem os mesmos modelos, eles citam <em>exatamente</em> o mesmo número. A contradição não é uma diferença de medição — é uma questão de cobertura, e isso muda a forma de ler esse tipo de ranking.</p>\n    <ul>\n      <li><span class=\"chip hot\">Bench</span> <strong>Dois quadros, dois vencedores</strong>: o vals.ai (<em>\"Updated: 7/31/2026\"</em>) coloca <strong>Claude Opus 5</strong> na liderança com <span class=\"stat\">97,0%</span>; o llm-stats (<em>\"Last updated August 1, 2026\"</em>) coloca <strong>Claude Fable 5</strong> na liderança com <span class=\"stat\">95,0%</span> — e sequer lista o Opus 5.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>O achado que resolve a divergência</strong>: nos modelos presentes nos dois quadros, os números coincidem até a casa decimal — Fable 5 em <span class=\"stat\">95,0%</span>, Opus 4.8 em <span class=\"stat\">88,6%</span>. A disputa não é sobre números, é sobre a lista de participantes.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Data nova, campo antigo</strong>: o top 7 do vals.ai é idêntico ao estado de <strong>22/07</strong>, publicado por este boletim na quinta-feira. Sete modelos, sete valores inalterados, uma data nova.</li>\n      <li><span class=\"chip hot\">OpenAI</span> <strong>Prazo definido em 30 dias</strong>: <em>\"On August 31, 2026, GPT-5.4 and GPT-5.4 mini will no longer be available in Codex\"</em> — substitutos segundo a OpenAI: <code>gpt-5.4</code> → <code>gpt-5.6-terra</code>, <code>gpt-5.4-mini</code> → <code>gpt-5.6-luna</code>.</li>\n      <li><span class=\"chip\">Claude</span> <strong>O número do próprio fornecedor cai em outro lugar</strong>: a própria Anthropic escreve sobre o Opus 5 que ele <em>\"performs within 0.5% of Fable 5's peak score, but at half the cost per task\"</em> — no CursorBench 3.2. O vals.ai vê uma vantagem de dois pontos inteiros no SWE-Bench. Régua diferente, retrato diferente.</li>\n      <li><span class=\"chip\">OSS</span> <strong>82% de exatamente uma fonte</strong>: o número, muito citado, do SWE-Verified do <strong>Qwen 4 Coder 32B-A3B</strong> está registrado em um blog de análise — não em um quadro independente, nem na própria página do Qwen. Até lá: afirmação, não medição.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Aider continua congelado</strong>: estado do quadro ainda em <strong>20/11/2025</strong>, na liderança o gpt-5 (high) com <span class=\"stat\">88,0%</span>. Inútil como contraprova de qualquer coisa de 2026.</li>\n      <li><span class=\"chip good\">Local</span> <strong>Ollama tem uma linha de comando a menos</strong>: desde a <code>v0.32.0</code> (11/07), o comando puro <code>ollama</code> agora inicia uma sessão de agente interativa em vez de uma página de ajuda.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Semana tranquila no Claude Code</strong>: o próprio resumo semanal não recebe uma entrada nova desde a <strong>Semana 29 (13–17/07)</strong>. Duas semanas de silêncio já são, em si, uma informação.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Los dos grandes rastreadores de SWE-Bench Verified traen hoy una fecha reciente — llm-stats marca el 1 de agosto, vals.ai marca el 31 de julio. Solo que detrás de la nueva fecha de vals.ai está, cifra por cifra, el mismo campo que este espacio ya publicó el jueves con el estado del tablero del 22/07, y en llm-stats el Claude Opus 5 sigue completamente ausente ocho días después de su lanzamiento. La noticia real está en comparar los dos: donde los tableros presentan los mismos modelos, citan <em>exactamente</em> el mismo número. La contradicción no es una diferencia de medición, es una cuestión de cobertura — y eso cambia cómo hay que leer este tipo de rankings.</p>\n    <ul>\n      <li><span class=\"chip hot\">Bench</span> <strong>Dos tableros, dos ganadores</strong>: vals.ai (<em>\"Updated: 7/31/2026\"</em>) pone a <strong>Claude Opus 5</strong> a la cabeza con <span class=\"stat\">97.0%</span>; llm-stats (<em>\"Last updated August 1, 2026\"</em>) pone a <strong>Claude Fable 5</strong> a la cabeza con <span class=\"stat\">95.0%</span> — y ni siquiera lista a Opus 5.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>El hallazgo que resuelve la divergencia</strong>: en los modelos que aparecen en ambos tableros, las cifras coinciden hasta el decimal — Fable 5 en <span class=\"stat\">95.0%</span>, Opus 4.8 en <span class=\"stat\">88.6%</span>. La disputa no es por números, es por la lista de participantes.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Fecha nueva, campo viejo</strong>: el top 7 de vals.ai es idéntico al estado del <strong>22/07</strong> que este boletín publicó el jueves. Siete modelos, siete valores sin cambio, una fecha nueva.</li>\n      <li><span class=\"chip hot\">OpenAI</span> <strong>Un plazo duro en 30 días</strong>: <em>\"On August 31, 2026, GPT-5.4 and GPT-5.4 mini will no longer be available in Codex\"</em> — reemplazos según OpenAI: <code>gpt-5.4</code> → <code>gpt-5.6-terra</code>, <code>gpt-5.4-mini</code> → <code>gpt-5.6-luna</code>.</li>\n      <li><span class=\"chip\">Claude</span> <strong>La cifra del propio fabricante cae en otro lado</strong>: la propia Anthropic escribe sobre Opus 5 que <em>\"performs within 0.5% of Fable 5's peak score, but at half the cost per task\"</em> — en CursorBench 3.2. vals.ai ve dos puntos enteros de ventaja en SWE-Bench. Otra vara, otro panorama.</li>\n      <li><span class=\"chip\">OSS</span> <strong>82% de exactamente una fuente</strong>: la muy citada cifra de SWE-Verified de <strong>Qwen 4 Coder 32B-A3B</strong> está registrada en un blog de reseñas — no en un tablero independiente, ni en la propia página de Qwen. Hasta entonces: una afirmación, no una medición.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Aider sigue congelado</strong>: estado del tablero todavía en <strong>20/11/2025</strong>, a la cabeza gpt-5 (high) con <span class=\"stat\">88.0%</span>. Inservible como contraprueba de cualquier cosa de 2026.</li>\n      <li><span class=\"chip good\">Local</span> <strong>Ollama tiene una línea de comandos menos</strong>: desde <code>v0.32.0</code> (11/07), el comando pelón <code>ollama</code> ahora abre una sesión de agente interactiva en vez de una página de ayuda.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Semana tranquila para Claude Code</strong>: su propio resumen semanal no tiene una entrada nueva desde la <strong>semana 29 (13–17/07)</strong>. Dos semanas de silencio ya son, en sí mismas, información.</li>\n    </ul></div>"
