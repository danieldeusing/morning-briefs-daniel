ikel 50 läuft seit zehn Tagen</strong>, heute ohne neues Verfahren. Das nächste Datum, das beim Kunden ankommt, bleibt der <strong>02.12.2026</strong>.<sup>[2][3]</sup></li>\n      <li><span class=\"chip good\">twiceD</span> Zwei Ideen aus genau diesen zwei Meldungen: <strong>Verfügbarkeit als Datensatz</strong> statt als Telefonat — und die <strong>aktenfeste KI-Notiz</strong>, die die Kleine Anfrage abfragt.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Today, two very different stories hang on the same question: <strong>Does the person on the other end know they're dealing with a machine?</strong> In Berlin, the federal digital minister has machine-generated speeches and op-eds written for him; the ministry considers labeling unnecessary as long as a human has looked it over.<sup>[1]</sup> In the US, Google has spent nine months building the opposite direction: agents that <em>call</em> the store, carry shopping carts across merchant boundaries, and buy on your behalf once the price target is hit.<sup>[4][8]</sup> In both cases, someone else decides what the recipient gets to know. One case doesn't fall under Article 50; the other wouldn't happen in the EU at all — and that difference is today's more interesting story, more than any adoption survey.</p>\n    <ul>\n      <li><span class=\"chip hot\">PUBLIC · DE</span> <strong>A ministerial speech from the language model — today it's the answer, not the revelation:</strong> That Federal Digital Minister <strong>Karsten Wildberger</strong> (CDU) used wholly or partly AI-generated speeches and op-eds has been on the table since <em>Die Zeit</em>'s investigation of <strong>2026-06-13</strong>. The Left Party parliamentary group filed a formal inquiry on <strong>2026-07-17</strong> (Bundestag document 21/7187) asking about the model, the prompts, and the file record; on <strong>2026-08-10</strong> the ministry's answer was reported.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">POSITION</span> <strong>And that very answer is the sticking point:</strong> AI is supposedly <em>\"an everyday, supportive tool\"</em> — as long as a human checks the result, <em>\"no separate labeling is generally required.\"</em><sup>[1]</sup> Legally defensible. Politically, this happens to be the very department coordinating the national implementation of the AI Act — and it had three weeks to think that sentence over.</li>\n      <li><span class=\"chip good\">PUBLIC · DE</span> <strong>The constructive part gets lost:</strong> the federal government runs <strong>Kipitz</strong> (ITZBund), an internal platform for classified documents with no external data transfer, and the Economics Ministry requires an <strong>\"AI license\"</strong> as a precondition for system access.<sup>[1]</sup></li>\n      <li><span class=\"chip\">CONSUMER · US</span> <strong>A status report, not a same-day event:</strong> Google's consumer agents emerged in three waves — the in-store phone call plus agentic checkout (2025-11-13), the <em>Business Agent</em> in Search (2026-01-12), <strong>Universal Cart</strong> across merchant boundaries (2026-05-19). Covered here together for the first time.<sup>[4][6][8]</sup></li>\n      <li><span class=\"chip\">RETAIL · US</span> <strong>Universal Cart is the break:</strong> one shopping cart that's identical across Search, Gemini, YouTube, and Gmail — <em>\"across merchants and across services\"</em> — with Google Pay as checkout and AP2 as payment authority. Rollout: <strong>US, summer 2026</strong>, no date for the EU.<sup>[8]</sup></li>\n      <li><span class=\"chip hot\">CAVEAT</span> <strong>The trust number is thin:</strong> <strong>73 %</strong> of Americans are said to be <em>\"uneasy\"</em> about how AI uses their shopping data, <strong>54 %</strong> reportedly find access to their purchase history <em>\"unappealing\"</em> — Quad/Harris Poll, n=2,180 US adults, fieldwork Feb 5–7, 2026.<sup>[9]</sup> More methodologically solid than first assumed, but it measures attitude, not behavior.</li>\n      <li><span class=\"chip\">CONTEXT</span> <strong>Why the call exists at all:</strong> Google's own specification for local inventory requires only <em>id</em>, <em>store code</em>, and <em>availability</em> as mandatory fields — quantity and price are optional, and there's no mandated update frequency.<sup>[10]</sup> The phone agent is standing in for data that doesn't exist.</li>\n      <li><span class=\"chip\">REG · EU</span> <strong>Article 50 has been in force for ten days</strong>, no new proceedings today. The next date that actually reaches customers remains <strong>2026-12-02</strong>.<sup>[2][3]</sup></li>\n      <li><span class=\"chip good\">twiceD</span> Two ideas straight out of these two stories: <strong>availability as a dataset</strong> instead of a phone call — and the <strong>audit-proof AI note</strong> that the parliamentary inquiry is asking for.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Hoje, duas notícias muito diferentes estão ligadas à mesma pergunta: <strong>a pessoa do outro lado sabe que está lidando com uma máquina?</strong> Em Berlim, o ministro federal do Digital manda escrever discursos e artigos de opinião por máquina; o ministério considera dispensável a sinalização, desde que um humano tenha revisado o resultado.<sup>[1]</sup> Nos Estados Unidos, o Google constrói há nove meses o caminho oposto: agentes que <em>ligam</em> para a loja, carregam carrinhos de compra entre diferentes varejistas e compram sozinhos quando o preço-alvo é atingido.<sup>[4][8]</sup> Nos dois casos, é outra parte que decide o que o destinatário fica sabendo. Um caso não se enquadra no Artigo 50, o outro nem aconteceria na UE — e é justamente essa diferença que hoje é a notícia mais interessante do que qualquer estudo de adoção.</p>\n    <ul>\n      <li><span class=\"chip hot\">PUBLIC · DE</span> <strong>Discurso ministerial saído do modelo de linguagem — hoje é a resposta, não a revelação:</strong> que o ministro federal do Digital <strong>Karsten Wildberger</strong> (CDU) usou discursos e artigos de opinião gerados por IA, no todo ou em parte, está posto desde a apuração do <em>Die Zeit</em> de <strong>13/06/2026</strong>. A bancada da Esquerda (Die Linke) apresentou em <strong>17/07/2026</strong> uma consulta formal (documento do Bundestag 21/7187) sobre modelo, prompts e registro nos autos; em <strong>10/08/2026</strong> foi noticiada a resposta do ministério.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">POSIÇÃO</span> <strong>E é justamente essa resposta o ponto de discórdia:</strong> a IA seria uma <em>\"ferramenta cotidiana e de apoio\"</em> — desde que um humano revise o resultado, <em>\"em geral não é necessária uma sinalização separada\"</em>.<sup>[1]</sup> Juridicamente defensável. Politicamente, é justamente a pasta que coordena a implementação nacional do Regulamento de IA — e teve três semanas para pensar nessa frase.</li>\n      <li><span class=\"chip good\">PUBLIC · DE</span> <strong>A parte construtiva passa despercebida:</strong> o governo federal opera, com o <strong>Kipitz</strong> (ITZBund), uma plataforma interna para documentos classificados sem vazamento externo de dados, e o Ministério da Economia exige uma <strong>\"carteira de habilitação em IA\"</strong> como pré-requisito de acesso.<sup>[1]</sup></li>\n      <li><span class=\"chip\">CONSUMIDOR · EUA</span> <strong>Um balanço, não um fato do dia:</strong> os agentes de consumo do Google surgiram em três ondas — a ligação para a loja mais o checkout agêntico (13/11/2025), o <em>Business Agent</em> na busca (12/01/2026), o <strong>Universal Cart</strong> entre varejistas (19/05/2026). Aqui reunidos pela primeira vez.<sup>[4][6][8]</sup></li>\n      <li><span class=\"chip\">COMÉRCIO · EUA</span> <strong>O Universal Cart é a ruptura:</strong> um carrinho de compras que é o mesmo na busca, no Gemini, no YouTube e no Gmail — <em>\"across merchants and across services\"</em> — com o Google Pay como caixa e o AP2 como procuração de pagamento. Lançamento: <strong>EUA, verão de 2026</strong>, sem data para a UE.<sup>[8]</sup></li>\n      <li><span class=\"chip hot\">RESSALVA</span> <strong>O número de confiança é frágil:</strong> <strong>73 %</strong> dos americanos estariam <em>\"uneasy\"</em> com a forma como a IA usa seus dados de compra, e <strong>54 %</strong> achariam <em>\"unappealing\"</em> o acesso ao histórico de compras — Quad/Harris Poll, n=2.180 adultos americanos, período de campo 05–07/02/2026.<sup>[9]</sup> Metodologicamente mais sólido do que parecia à primeira vista, mas mede atitude, não comportamento.</li>\n      <li><span class=\"chip\">CONTEXTUALIZAÇÃO</span> <strong>Por que a ligação existe:</strong> a própria especificação do Google para estoque de lojas exige como campos obrigatórios apenas <em>id</em>, <em>store code</em> e <em>availability</em> — quantidade e preço são opcionais, e não há frequência de atualização definida.<sup>[10]</sup> O agente por telefone substitui dados que não existem.</li>\n      <li><span class=\"chip\">REG · UE</span> <strong>O Artigo 50 vigora há dez dias</strong>, hoje sem novo processo. A próxima data que de fato chega ao cliente continua sendo <strong>02/12/2026</strong>.<sup>[2][3]</sup></li>\n      <li><span class=\"chip good\">twiceD</span> Duas ideias saídas exatamente dessas duas notícias: <strong>disponibilidade como conjunto de dados</strong> em vez de ligação telefônica — e a <strong>anotação de IA à prova de auditoria</strong> que a consulta parlamentar está pedindo.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Hoy, dos noticias muy distintas giran alrededor de la misma pregunta: <strong>¿sabe la persona del otro lado que está tratando con una máquina?</strong> En Berlín, el ministro federal de lo Digital manda escribir discursos y artículos de opinión con una máquina; el ministerio considera que el etiquetado es prescindible mientras un humano haya revisado el resultado.<sup>[1]</sup> En Estados Unidos, Google lleva nueve meses construyendo el camino contrario: agentes que <em>llaman</em> a la tienda, llevan carritos de compra entre distintos comercios y compran por cuenta propia al alcanzar el precio objetivo.<sup>[4][8]</sup> En ambos casos, alguien más decide qué llega a saber el destinatario. Un caso no cae bajo el Artículo 50, el otro ni siquiera ocurriría en la UE — y justo esa diferencia es hoy la noticia más interesante, más que cualquier estudio de adopción.</p>\n    <ul>\n      <li><span class=\"chip hot\">PUBLIC · DE</span> <strong>Discurso ministerial salido del modelo de lenguaje — hoy es la respuesta, no la revelación:</strong> que el ministro federal de lo Digital <strong>Karsten Wildberger</strong> (CDU) usó discursos y artículos de opinión generados por IA, total o parcialmente, está sobre la mesa desde la investigación de <em>Die Zeit</em> del <strong>13/06/2026</strong>. La fracción de La Izquierda (Die Linke) presentó el <strong>17/07/2026</strong> una consulta formal (documento del Bundestag 21/7187) sobre modelo, prompts y registro en los expedientes; el <strong>10/08/2026</strong> se informó la respuesta del ministerio.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">POSICIÓN</span> <strong>Y es justamente esa respuesta el punto de conflicto:</strong> la IA sería una <em>\"herramienta cotidiana y de apoyo\"</em> — mientras un humano revise el resultado, <em>\"por lo general no se requiere un etiquetado aparte\"</em>.<sup>[1]</sup> Jurídicamente defendible. Políticamente, es justo la dependencia que coordina la implementación nacional del Reglamento de IA — y tuvo tres semanas para pensar esa frase.</li>\n      <li><span class=\"chip good\">PUBLIC · DE</span> <strong>La parte constructiva pasa desapercibida:</strong> el gobierno federal opera, con <strong>Kipitz</strong> (ITZBund), una plataforma interna para documentos clasificados sin fuga externa de datos, y el Ministerio de Economía exige una <strong>\"licencia de IA\"</strong> como requisito de acceso.<sup>[1]</sup></li>\n      <li><span class=\"chip\">CONSUMIDOR · EE. UU.</span> <strong>Un balance, no un hecho del día:</strong> los agentes de consumo de Google surgieron en tres olas — la llamada a la tienda más el checkout agéntico (13/11/2025), el <em>Business Agent</em> en la búsqueda (12/01/2026), el <strong>Universal Cart</strong> entre distintos comercios (19/05/2026). Aquí reunidos por primera vez.<sup>[4][6][8]</sup></li>\n      <li><span class=\"chip\">COMERCIO · EE. UU.</span> <strong>Universal Cart es la ruptura:</strong> un carrito de compras que es el mismo en la Búsqueda, Gemini, YouTube y Gmail — <em>\"across merchants and across services\"</em> — con Google Pay como caja y AP2 como poder de pago. Lanzamiento: <strong>EE. UU., verano de 2026</strong>, sin fecha para la UE.<sup>[8]</sup></li>\n      <li><span class=\"chip hot\">SALVEDAD</span> <strong>La cifra de confianza es endeble:</strong> el <strong>73 %</strong> de los estadounidenses estaría <em>\"uneasy\"</em> con cómo la IA usa sus datos de compra, y el <strong>54 %</strong> encontraría <em>\"unappealing\"</em> el acceso a su historial de compras — Quad/Harris Poll, n=2.180 adultos estadounidenses, trabajo de campo 05–07/02/2026.<sup>[9]</sup> Metodológicamente más sólido de lo que parecía, pero mide actitud, no comportamiento.</li>\n      <li><span class=\"chip\">CONTEXTO</span> <strong>Por qué existe la llamada:</strong> la propia especificación de Google para el inventario de tiendas exige como campos obligatorios solo <em>id</em>, <em>store code</em> y <em>availability</em> — cantidad y precio son opcionales, y no hay una frecuencia de actualización obligatoria.<sup>[10]</sup> El agente telefónico sustituye datos que no existen.</li>\n      <li><span class=\"chip\">REG · UE</span> <strong>El Artículo 50 lleva diez días vigente</strong>, hoy sin ningún proceso nuevo. La próxima fecha que de verdad llega al cliente sigue siendo el <strong>02/12/2026</strong>.<sup>[2][3]</sup></li>\n      <li><span class=\"chip good\">twiceD</span> Dos ideas surgidas exactamente de estas dos noticias: <strong>disponibilidad como conjunto de datos</strong> en lugar de una llamada telefónica — y la <strong>nota de IA a prueba de auditoría</strong> que la consulta parlamentaria está pidiendo.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Die Bekanntmachung der <strong>Oberfinanzdirektion Baden-Württemberg</strong> wurde heute noch einmal aus der Primärquelle gelesen — und sie ist unverändert: Versionsstand <strong>01</strong>, keine Änderungs-, keine Aufhebungsbekanntmachung. Damit steht auch die Uhr, die zählt: Die Frist für Rückfragen endet <strong>morgen, 13.08.2026 um 23:59 MESZ</strong>. Der einzige offene Punkt dieser Ausschreibung ist nicht die Größe des Bieters — es sind die beiden Erfüllungsorte Karlsruhe und Stuttgart, zu denen die acht Seiten <em>kein Wort</em> über Remote-Arbeit sagen. Nach morgen ist diese Frage nicht mehr offiziell klärbar. Und die Bekanntmachung schreibt ausdrücklich hin, dass ein Bieter <em>keinen Anspruch</em> darauf hat, vergessene Unterlagen später nachreichen zu dürfen.</p>\n    <ul>\n      <li><span class=\"chip hot\">Frist</span> <strong>Morgen 23:59 MESZ endet die Rückfragefrist</strong> zur Ausschreibung „Dienstleistungen TCK Testautomation\" (TED 512867-2026). Die Angebotsfrist selbst ist der <strong>25.08.2026, 11:00 MESZ</strong>, danach 59 Tage Bindefrist.<sup>[1]</sup></li>\n      <li><span class=\"chip good\">Nachgeprüft</span> <strong>Die Bekanntmachung ist heute erneut im PDF-Volltext gelesen worden</strong> — Notice-Version „01\", Absendedatum 23.07.2026, veröffentlicht im Amtsblatt S 141/2026 am 24.07.2026. Alle Fristen und Bedingungen decken sich mit dem gestrigen Stand.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">Neu gefunden</span> <strong>Die Vergabestelle sieht Eignungsleihe und Unterauftrag ausdrücklich vor</strong> — das Formblatt „C3_Eigenerklärung zur Eignung\" ist „auch durch den Unterauftragnehmer/im Falle einer Eignungsleihe vorzulegen\". Der Partner-Weg ist also formal vorgesehen, obwohl er hier gar nicht nötig wäre.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">Vorbehalt</span> <strong>Kein Anspruch auf Nachforderung.</strong> Fehlende Unterlagen <em>dürfen</em> nachgefordert werden, § 56 Abs. 2 und 3 VgV — „Die Bewerber haben keinen Anspruch auf Nachforderung / Nachreichung oder Aufklärung von Unterlagen.\" Der Versicherungs- oder Banknachweis gehört ins Angebot, nicht ins Nachspiel.<sup>[1]</sup></li>\n      <li><span class=\"chip\">Board</span> <strong>97 Listings</strong> (84 Freelance, 7 Employee, 6 Intriguing): <strong>+5 / −0</strong>. Der große Schnitt von gestern setzt sich nicht fort — das Board wächst sofort wieder. Median <strong>67</strong>, Spitze <strong>83</strong>, fünf Einträge ≥ 80: alle drei Kennzahlen zum <strong>zehnten Lauf in Folge unverändert</strong>.</li>\n      <li><span class=\"chip hot\">Frische</span> <strong>7 von 97 Einträgen wurden heute angefasst</strong> (5 Zugänge, 2 Nachprüfungen). Die übrigen <strong>90</strong> tragen „carried forward from 2026-08-11\". Der Kern dieser Gruppe wurde zuletzt am <strong>06.08. tatsächlich geprüft</strong> — inzwischen sechs Tage.</li>\n      <li><span class=\"chip\">twiceD</span> <strong>Kein Zugang schafft es in die oberen 40.</strong> Bester Freelance-Neuzugang: <strong>One Day Ahead, Angular + Python, Frankfurt, 100 % remote, 4 Monate, 85–110 €/h*, Fit 66</strong> — Platz 51 von 97. Dieselbe Vermittlung steht jetzt mit drei Mandaten im Board.</li>\n      <li><span class=\"chip hot\">AI-Harness</span> <strong>Zwei Wunsch-Arbeitgeber des Profils tauchen am selben Tag auf — und ranken schwach.</strong> <strong>JetBrains AppGlass</strong> (AI-first Production Debugging) kommt auf Fit <strong>68</strong>, <strong>Cognition</strong> (Devin/Windsurf) auf <strong>44</strong> — Platz <strong>96 von 97</strong>. Beide mit voller Intrigue-Wertung 10/10.</li>\n      <li><span class=\"chip hot\">Quellenlage</span> <strong>Die Layoff-Kulisse ist heute schwächer belegt als die Vergabe.</strong> Telefónica Deutschland (bis 1.100 Stellen) und Bosch (rund 22.000 bis 2030) stehen nur über Sekundärquellen; SAP und Continental gar nur über Suchmaschinen-Zusammenfassungen. Die Bitkom-Zahl von 109.000 offenen IT-Stellen ist vom <strong>07.08.2025</strong> — ein Jahr alt.<sup>[4][5][6]</sup></li>\n    </ul></div>",

        "en": "<div class=\"tldr\"><p class=\"lead\">The notice from the <strong>Oberfinanzdirektion Baden-Württemberg</strong> (Baden-Württemberg regional tax authority) was re-read from the primary source again today — and it's unchanged: version status <strong>01</strong>, no amendment notice, no cancellation notice. So the clock that matters is still running: the deadline for follow-up questions ends <strong>tomorrow, 2026-08-13 at 23:59 CEST</strong>. The only open point in this tender isn't the size of the bidder — it's the two places of performance, Karlsruhe and Stuttgart, about which the eight pages say <em>not a word</em> on remote work. After tomorrow, this question can no longer be clarified officially. And the notice explicitly states that a bidder has <em>no right</em> to submit forgotten documents later.</p>\n    <ul>\n      <li><span class=\"chip hot\">Deadline</span> <strong>Tomorrow 23:59 CEST the question deadline ends</strong> for the tender \"TCK Test Automation Services\" (TED 512867-2026). The tender deadline itself is <strong>2026-08-25, 11:00 CEST</strong>, followed by a 59-day binding period.<sup>[1]</sup></li>\n      <li><span class=\"chip good\">Re-verified</span> <strong>The notice was read again in full-text PDF today</strong> — notice version \"01,\" dispatch date 2026-07-23, published in Official Journal S 141/2026 on 2026-07-24. All deadlines and conditions match yesterday's status.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">New finding</span> <strong>The contracting authority explicitly allows for capacity borrowing and subcontracting</strong> — form \"C3_Self-declaration of suitability\" must be \"submitted by the subcontractor/in the case of capacity borrowing as well.\" So the partner route is formally provided for, even though it isn't actually needed here.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">Caveat</span> <strong>No right to request supplementary documents.</strong> Missing documents <em>may</em> be requested afterward, per Section 56(2) and (3) VgV — \"Applicants have no right to a supplementary request/submission or clarification of documents.\" The insurance or bank confirmation belongs in the bid, not in the aftermath.<sup>[1]</sup></li>\n      <li><span class=\"chip\">Board</span> <strong>97 listings</strong> (84 freelance, 7 employee, 6 intriguing): <strong>+5 / −0</strong>. Yesterday's big cut doesn't continue — the board is growing again immediately. Median <strong>67</strong>, top <strong>83</strong>, five entries ≥ 80: all three metrics <strong>unchanged for the tenth run in a row</strong>.</li>\n      <li><span class=\"chip hot\">Freshness</span> <strong>7 of 97 entries were touched today</strong> (5 additions, 2 re-checks). The remaining <strong>90</strong> carry \"carried forward from 2026-08-11.\" The core of that group was last <strong>actually checked on 08-06</strong> — six days ago now.</li>\n      <li><span class=\"chip\">twiceD</span> <strong>No new entry makes the top 40.</strong> Best new freelance entry: <strong>One Day Ahead, Angular + Python, Frankfurt, 100% remote, 4 months, €85–110/h*, Fit 66</strong> — rank 51 of 97. The same agency now has three mandates in the board.</li>\n      <li><span class=\"chip hot\">AI harness</span> <strong>Two of the profile's wish-list employers appear on the same day — and rank weakly.</strong> <strong>JetBrains AppGlass</strong> (AI-first production debugging) scores Fit <strong>68</strong>, <strong>Cognition</strong> (Devin/Windsurf) scores <strong>44</strong> — rank <strong>96 of 97</strong>. Both carry a full intrigue score of 10/10.</li>\n      <li><span class=\"chip hot\">Source quality</span> <strong>The layoff backdrop is more thinly sourced today than the tender.</strong> Telefónica Deutschland (up to 1,100 jobs) and Bosch (roughly 22,000 by 2030) rest only on secondary sources; SAP and Continental are backed only by search-engine summaries. The Bitkom figure of 109,000 open IT positions is from <strong>2025-08-07</strong> — a year old.<sup>[4][5][6]</sup></li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">O edital da <strong>Oberfinanzdirektion Baden-Württemberg</strong> (Diretoria Regional de Finanças de Baden-Württemberg) foi lido novamente hoje direto da fonte primária — e continua inalterado: versão <strong>01</strong>, sem aviso de alteração, sem aviso de cancelamento. Ou seja, o relógio que importa continua correndo: o prazo para perguntas adicionais termina <strong>amanhã, 13/08/2026 às 23h59 CEST</strong>. O único ponto em aberto nessa licitação não é o porte do licitante — são os dois locais de execução, Karlsruhe e Stuttgart, sobre os quais as oito páginas <em>não dizem uma palavra</em> a respeito de trabalho remoto. Depois de amanhã, essa questão não poderá mais ser esclarecida oficialmente. E o edital afirma expressamente que um licitante <em>não tem direito</em> a apresentar documentos esquecidos depois.</p>\n    <ul>\n      <li><span class=\"chip hot\">Prazo</span> <strong>Amanhã às 23h59 CEST termina o prazo de perguntas</strong> sobre a licitação \"Serviços de Automação de Testes TCK\" (TED 512867-2026). O prazo para a proposta em si é <strong>25/08/2026, 11h00 CEST</strong>, seguido de 59 dias de prazo de vinculação.<sup>[1]</sup></li>\n      <li><span class=\"chip good\">Reverificado</span> <strong>O edital foi lido novamente na íntegra em PDF hoje</strong> — versão \"01\", data de envio 23/07/2026, publicado no Jornal Oficial S 141/2026 em 24/07/2026. Todos os prazos e condições coincidem com o status de ontem.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">Novidade</span> <strong>O órgão licitante prevê expressamente empréstimo de capacidade e subcontratação</strong> — o formulário \"C3_Autodeclaração de aptidão\" deve ser \"apresentado também pelo subcontratado/em caso de empréstimo de capacidade\". A via do parceiro está, portanto, formalmente prevista, mesmo que não seja necessária neste caso.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">Ressalva</span> <strong>Sem direito a solicitação posterior de documentos.</strong> Documentos faltantes <em>podem</em> ser solicitados depois, conforme § 56, itens 2 e 3, do VgV — \"Os candidatos não têm direito a solicitação posterior/apresentação adicional ou esclarecimento de documentos.\" O comprovante de seguro ou a confirmação bancária pertencem à proposta, não ao pós-jogo.<sup>[1]</sup></li>\n      <li><span class=\"chip\">Board</span> <strong>97 vagas</strong> (84 freelance, 7 CLT/efetivo, 6 intrigantes): <strong>+5 / −0</strong>. O grande corte de ontem não se repete — o board volta a crescer imediatamente. Mediana <strong>67</strong>, topo <strong>83</strong>, cinco vagas ≥ 80: as três métricas <strong>inalteradas pela décima rodada seguida</strong>.</li>\n      <li><span class=\"chip hot\">Frescor</span> <strong>7 das 97 vagas foram tocadas hoje</strong> (5 novas, 2 reverificações). As demais <strong>90</strong> trazem \"carried forward from 2026-08-11\". O núcleo desse grupo foi <strong>efetivamente checado pela última vez em 06/08</strong> — já faz seis dias.</li>\n      <li><span class=\"chip\">twiceD</span> <strong>Nenhuma vaga nova entra no top 40.</strong> Melhor entrada freelance nova: <strong>One Day Ahead, Angular + Python, Frankfurt, 100% remoto, 4 meses, € 85–110/h*, Fit 66</strong> — posição 51 de 97. A mesma consultoria agora tem três mandatos no board.</li>\n      <li><span class=\"chip hot\">AI harness</span> <strong>Dois empregadores da lista de desejos do perfil aparecem no mesmo dia — e ranqueiam mal.</strong> <strong>JetBrains AppGlass</strong> (depuração de produção com IA em primeiro lugar) marca Fit <strong>68</strong>, <strong>Cognition</strong> (Devin/Windsurf) marca <strong>44</strong> — posição <strong>96 de 97</strong>. Ambos com pontuação máxima de intriga, 10/10.</li>\n      <li><span class=\"chip hot\">Qualidade da fonte</span> <strong>O pano de fundo de demissões está pior sustentado hoje do que a licitação.</strong> Telefónica Deutschland (até 1.100 vagas) e Bosch (cerca de 22.000 até 2030) se apoiam apenas em fontes secundárias; SAP e Continental têm apenas resumos de buscadores. O número da Bitkom de 109.000 vagas de TI em aberto é de <strong>07/08/2025</strong> — um ano atrás.<sup>[4][5][6]</sup></li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">El anuncio de la <strong>Oberfinanzdirektion Baden-Württemberg</strong> (Dirección Regional de Finanzas de Baden-Württemberg) se volvió a leer hoy directamente de la fuente primaria — y sigue igual: versión <strong>01</strong>, sin aviso de modificación, sin aviso de cancelación. Es decir, el reloj que importa sigue corriendo: el plazo para preguntas adicionales termina <strong>mañana, 13/08/2026 a las 23:59 CEST</strong>. El único punto abierto de esta licitación no es el tamaño del licitante — son los dos lugares de ejecución, Karlsruhe y Stuttgart, sobre los que las ocho páginas <em>no dicen ni una palabra</em> respecto al trabajo remoto. Después de mañana, esta pregunta ya no podrá aclararse oficialmente. Y el anuncio deja explícito que un licitante <em>no tiene derecho</em> a presentar después documentos olvidados.</p>\n    <ul>\n      <li><span class=\"chip hot\">Plazo</span> <strong>Mañana a las 23:59 CEST termina el plazo de preguntas</strong> de la licitación \"Servicios de Automatización de Pruebas TCK\" (TED 512867-2026). El plazo de la propuesta en sí es el <strong>25/08/2026, 11:00 CEST</strong>, seguido de 59 días de periodo de vinculación.<sup>[1]</sup></li>\n      <li><span class=\"chip good\">Reverificado</span> <strong>El anuncio se volvió a leer hoy en PDF completo</strong> — versión \"01\", fecha de envío 23/07/2026, publicado en el Diario Oficial S 141/2026 el 24/07/2026. Todos los plazos y condiciones coinciden con el estado de ayer.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">Hallazgo nuevo</span> <strong>La entidad contratante prevé expresamente el préstamo de capacidad y la subcontratación</strong> — el formulario \"C3_Autodeclaración de idoneidad\" debe \"presentarse también por el subcontratista/en caso de préstamo de capacidad\". La vía del socio está, entonces, formalmente prevista, aunque aquí no sea realmente necesaria.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">Reserva</span> <strong>Sin derecho a requerimiento posterior de documentos.</strong> Los documentos faltantes <em>pueden</em> solicitarse después, conforme al § 56, apartados 2 y 3, del VgV — \"Los candidatos no tienen derecho a un requerimiento posterior/presentación adicional o aclaración de documentos\". El comprobante de seguro o la confirmación bancaria van en la propuesta, no después.<sup>[1]</sup></li>\n      <li><span class=\"chip\">Board</span> <strong>97 vacantes</strong> (84 freelance, 7 en plantilla, 6 intrigantes): <strong>+5 / −0</strong>. El gran recorte de ayer no continúa — el board vuelve a crecer de inmediato. Mediana <strong>67</strong>, tope <strong>83</strong>, cinco vacantes ≥ 80: las tres métricas <strong>sin cambios por décima corrida consecutiva</strong>.</li>\n      <li><span class=\"chip hot\">Frescura</span> <strong>7 de las 97 vacantes se tocaron hoy</strong> (5 nuevas, 2 reverificaciones). Las <strong>90</strong> restantes llevan \"carried forward from 2026-08-11\". El núcleo de ese grupo se verificó <strong>de verdad por última vez el 06/08</strong> — ya son seis días.</li>\n      <li><span class=\"chip\">twiceD</span> <strong>Ninguna vacante nueva entra al top 40.</strong> Mejor entrada freelance nueva: <strong>One Day Ahead, Angular + Python, Fráncfort, 100% remoto, 4 meses, 85–110 €/h*, Fit 66</strong> — lugar 51 de 97. La misma consultora ya tiene tres mandatos en el board.</li>\n      <li><span class=\"chip hot\">AI harness</span> <strong>Dos empleadores de la lista de deseos del perfil aparecen el mismo día — y rankean bajo.</strong> <strong>JetBrains AppGlass</strong> (depuración de producción con IA en primer lugar) obtiene Fit <strong>68</strong>, <strong>Cognition</strong> (Devin/Windsurf) obtiene <strong>44</strong> — lugar <strong>96 de 97</strong>. Ambos con puntaje de intriga máximo, 10/10.</li>\n      <li><span class=\"chip hot\">Calidad de fuente</span> <strong>El telón de fondo de despidos está peor respaldado hoy que la licitación.</strong> Telefónica Deutschland (hasta 1,100 puestos) y Bosch (cerca de 22,000 para 2030) se sostienen solo en fuentes secundarias; SAP y Continental solo tienen resúmenes de buscadores. La cifra de Bitkom de 109,000 vacantes de TI sin cubrir es del <strong>07/08/2025</strong> — hace un año.<sup>[4][5][6]</sup></li>\n    </ul></div>"
      }

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Gestern stand hier eine Reihe von sechs trockenen Tagen. Heute hat sie einen Riss: <strong>tempo.com</strong> und <strong>theweather.com</strong> melden für morgen leichten Regen und für <strong>Freitag 60 % Gewitter</strong> — <strong>Climatempo</strong> bleibt bei <span class=\"stat\">0,0 mm</span>. SIMEPAR, der das entscheiden könnte, antwortet erneut mit einer Fehlermeldung. Deshalb steht hier heute beides und kein Urteil: den Freitag mit Innen-Plan B denken, Samstag und Sonntag als die verlässlicheren Draußen-Tage. Ansonsten ist heute der Tag, an dem der Termin aus dem gestrigen Brief tatsächlich stattfindet.</p>\n    <ul>\n      <li><span class=\"chip hot\">WETTER</span> <strong>Der Widerspruch:</strong> Do 13.08. — Climatempo <span class=\"stat\">0,0 mm</span>, die beiden anderen <strong>30 %</strong> Regen. Fr 14.08. — <strong>60 % Gewitter</strong>. Nicht stillschweigend aufgelöst.</li>\n      <li><span class=\"chip\">WETTER</span> <strong>Heute ist unstrittig:</strong> alle drei Portale <strong>0 %</strong> Regen, <strong>24–26 °C</strong> Höchstwert, <strong>13–18 °C</strong> nachts. Sa <strong>27 °/17 °</strong> und So <strong>28 °/16 °</strong> bleiben trocken.</li>\n      <li><span class=\"chip good\">EVENT</span> <strong>Heute, gratis, ~50 km:</strong> „<em>Nina Brondi conta Pedro Malasartes</em>\" um <strong>9:30 und 14:30 Uhr</strong>, Auditório SENAC/SESC Jacarezinho — dazu 14 h Oficina, 20 h Stück, 21 h Bate-papo.</li>\n      <li><span class=\"chip\">EVENT</span> <strong>Vormerken, nicht diese Woche:</strong> Das <strong>20º FEJACAN</strong> in Jacarezinho läuft laut Sesc-Edital <strong>05.–07.11.2026</strong> — nicht im August, wie Suchtreffer nahelegten. Sesc und Prefeitura, Eintritt frei.</li>\n      <li><span class=\"chip\">TRIP</span> <strong>In einer Woche:</strong> die <strong>54ª EFAPI Expo</strong>, <strong>19.–23.08.</strong> in Santo Antônio da Platina — Tierschau, Rodeo mit Palhaço Furunfo, Rummel. Eintrittspreis nirgends belegt.</li>\n      <li><span class=\"chip hot\">GESUNDHEIT</span> <strong>RSV bleibt der Grund für Zurückhaltung:</strong> InfoGripe <strong>SE 30/2026</strong> — <span class=\"stat\">54,1 %</span> der positiven SRAG-Fälle sind RSV, Paraná bleibt im Alarm-/Risikoband.</li>\n      <li><span class=\"chip\">GESUNDHEIT</span> <strong>Multivacinação:</strong> <strong>03.08.–01.09.</strong>, <strong>Dia D am Sa 22.08.</strong>, <span class=\"stat\">20 Impfstoffe</span> für alle unter 15 — in Paraná über <span class=\"stat\">1.800</span> Impfräume. Dengue-Informe <strong>nº 24</strong> ist acht Tage alt, Zahlen heute nicht abrufbar.</li>\n      <li><span class=\"chip\">SCHULE</span> <strong>Voller Unterrichtsmonat:</strong> Julipause 13.–24.07. ist durch, im August kein Ferienfenster. In Ribeirão Claro läuft bis <strong>24.08.</strong> die Anmeldung zum <em>Concurso do Prato Típico</em>.</li>\n    </ul></div>",

        "en": "<div class=\"tldr\"><p class=\"lead\">Yesterday this brief had a run of six dry days. Today that run has a crack: tempo.com and theweather.com report light rain for tomorrow and <strong>60% thunderstorms for Friday</strong> — <strong>Climatempo</strong> stays at <span class=\"stat\">0.0 mm</span>. SIMEPAR, which could settle this, again answers with an error. So today we lay out both readings and no verdict: plan an indoor Plan B for Friday, and treat Saturday and Sunday as the more reliable outdoor days. Otherwise, today is the day the event from yesterday's brief actually happens.</p>\n    <ul>\n      <li><span class=\"chip hot\">WEATHER</span> <strong>The contradiction:</strong> Thu 08/13 — Climatempo <span class=\"stat\">0.0 mm</span>, the other two <strong>30%</strong> rain. Fri 08/14 — <strong>60% thunderstorms</strong>. Not quietly resolved.</li>\n      <li><span class=\"chip\">WEATHER</span> <strong>Today is undisputed:</strong> all three portals show <strong>0%</strong> rain, <strong>24–26°C</strong> highs, <strong>13–18°C</strong> overnight. Sat <strong>27°/17°</strong> and Sun <strong>28°/16°</strong> stay dry.</li>\n      <li><span class=\"chip good\">EVENT</span> <strong>Today, free, ~50 km:</strong> \"<em>Nina Brondi conta Pedro Malasartes</em>\" at <strong>9:30 and 2:30 PM</strong>, Auditório SENAC/SESC Jacarezinho — plus a 2 PM workshop, 8 PM play, 9 PM chat session.</li>\n      <li><span class=\"chip\">EVENT</span> <strong>Note for later, not this week:</strong> the <strong>20th FEJACAN</strong> in Jacarezinho runs, per the Sesc edital, <strong>November 5–7, 2026</strong> — not in August, as search results had suggested. Run by Sesc and the Prefeitura, free admission.</li>\n      <li><span class=\"chip\">TRIP</span> <strong>In a week:</strong> the <strong>54th EFAPI Expo</strong>, <strong>08/19–08/23</strong> in Santo Antônio da Platina — livestock show, rodeo with Palhaço Furunfo, midway rides. Admission price confirmed nowhere.</li>\n      <li><span class=\"chip hot\">HEALTH</span> <strong>RSV remains the reason for caution:</strong> InfoGripe <strong>SE 30/2026</strong> — <span class=\"stat\">54.1%</span> of positive SARI cases are RSV, Paraná stays in the alert/risk band.</li>\n      <li><span class=\"chip\">HEALTH</span> <strong>Multivacinação:</strong> <strong>08/03–09/01</strong>, Dia D on Sat <strong>08/22</strong>, <span class=\"stat\">20 vaccines</span> for everyone under 15 — over <span class=\"stat\">1,800</span> vaccination sites in Paraná. Dengue Informe <strong>nº 24</strong> is eight days old, figures unreachable today.</li>\n      <li><span class=\"chip\">SCHOOL</span> <strong>Full month of classes:</strong> the July break (07/13–07/24) is over, no break window in August. In Ribeirão Claro, registration for the <em>Concurso do Prato Típico</em> runs through <strong>08/24</strong>.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Ontem, este boletim trazia uma sequência de seis dias secos. Hoje essa sequência tem uma rachadura: tempo.com e theweather.com preveem chuva fraca para amanhã e <strong>60% de chance de temporal para sexta-feira</strong> — a <strong>Climatempo</strong> continua em <span class=\"stat\">0,0 mm</span>. O SIMEPAR, que poderia decidir isso, volta a responder com erro. Por isso, hoje ficam registrados os dois lados e nenhum veredito: pensar a sexta-feira com um plano B para ambiente fechado, e tratar sábado e domingo como os dias mais confiáveis para atividades ao ar livre. De resto, hoje é o dia em que o compromisso do boletim de ontem finalmente acontece.</p>\n    <ul>\n      <li><span class=\"chip hot\">CLIMA</span> <strong>A contradição:</strong> qui 13/08 — Climatempo <span class=\"stat\">0,0 mm</span>, os outros dois <strong>30%</strong> de chuva. Sex 14/08 — <strong>60% de temporal</strong>. Não resolvida em silêncio.</li>\n      <li><span class=\"chip\">CLIMA</span> <strong>Hoje é indiscutível:</strong> os três portais indicam <strong>0%</strong> de chuva, máxima de <strong>24–26 °C</strong>, <strong>13–18 °C</strong> à noite. Sáb <strong>27°/17°</strong> e dom <strong>28°/16°</strong> seguem secos.</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Hoje, grátis, ~50 km:</strong> \"<em>Nina Brondi conta Pedro Malasartes</em>\" às <strong>9h30 e 14h30</strong>, Auditório SENAC/SESC Jacarezinho — além de oficina às 14h, peça às 20h, bate-papo às 21h.</li>\n      <li><span class=\"chip\">EVENTO</span> <strong>Para anotar, não nesta semana:</strong> o <strong>20º FEJACAN</strong> em Jacarezinho acontece, segundo o edital do Sesc, de <strong>05 a 07/11/2026</strong> — não em agosto, como sugeriam resultados de busca. Promovido pelo Sesc e pela Prefeitura, entrada gratuita.</li>\n      <li><span class=\"chip\">VIAGEM</span> <strong>Em uma semana:</strong> a <strong>54ª EFAPI Expo</strong>, <strong>19–23/08</strong> em Santo Antônio da Platina — exposição de animais, rodeio com Palhaço Furunfo, parque de diversões. Preço do ingresso não confirmado em lugar nenhum.</li>\n      <li><span class=\"chip hot\">SAÚDE</span> <strong>O VSR continua sendo o motivo da cautela:</strong> InfoGripe <strong>SE 30/2026</strong> — <span class=\"stat\">54,1%</span> dos casos positivos de SRAG são VSR, Paraná permanece na faixa de alerta/risco.</li>\n      <li><span class=\"chip\">SAÚDE</span> <strong>Multivacinação:</strong> <strong>03/08–01/09</strong>, Dia D no sáb <strong>22/08</strong>, <span class=\"stat\">20 imunizantes</span> para todos os menores de 15 anos — em mais de <span class=\"stat\">1.800</span> salas de vacinação no Paraná. O Informe nº 24 da dengue tem oito dias, números indisponíveis hoje.</li>\n      <li><span class=\"chip\">ESCOLA</span> <strong>Mês letivo completo:</strong> o recesso de julho (13–24/07) já passou, agosto não tem janela de férias. Em Ribeirão Claro, a inscrição para o <em>Concurso do Prato Típico</em> vai até <strong>24/08</strong>.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Ayer, en este boletín, había una racha de seis días secos. Hoy esa racha tiene una grieta: tempo.com y theweather.com pronostican lluvia ligera para mañana y <strong>60 % de probabilidad de tormenta para el viernes</strong> — <strong>Climatempo</strong> se mantiene en <span class=\"stat\">0,0 mm</span>. El SIMEPAR, que podría resolver esto, vuelve a responder con un error. Por eso hoy quedan registradas ambas lecturas y ningún veredicto: pensar el viernes con un plan B bajo techo, y tratar el sábado y el domingo como los días más confiables para estar al aire libre. Fuera de eso, hoy es el día en que finalmente ocurre el compromiso del boletín de ayer.</p>\n    <ul>\n      <li><span class=\"chip hot\">CLIMA</span> <strong>La contradicción:</strong> jue 13/08 — Climatempo <span class=\"stat\">0,0 mm</span>, los otros dos <strong>30 %</strong> de lluvia. Vie 14/08 — <strong>60 % de tormenta</strong>. No resuelta en silencio.</li>\n      <li><span class=\"chip\">CLIMA</span> <strong>Hoy no hay discusión:</strong> los tres portales marcan <strong>0 %</strong> de lluvia, máxima de <strong>24–26 °C</strong>, <strong>13–18 °C</strong> en la noche. Sáb <strong>27°/17°</strong> y dom <strong>28°/16°</strong> siguen secos.</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Hoy, gratis, ~50 km:</strong> \"<em>Nina Brondi conta Pedro Malasartes</em>\" a las <strong>9:30 y 14:30</strong>, Auditório SENAC/SESC Jacarezinho — además taller a las 14:00, obra a las 20:00, plática a las 21:00.</li>\n      <li><span class=\"chip\">EVENTO</span> <strong>Para anotar, no esta semana:</strong> el <strong>20º FEJACAN</strong> en Jacarezinho se realiza, según el edital del Sesc, del <strong>5 al 7/11/2026</strong> — no en agosto, como sugerían los resultados de búsqueda. Organizado por el Sesc y la Prefeitura, entrada gratuita.</li>\n      <li><span class=\"chip\">PASEO</span> <strong>En una semana:</strong> la <strong>54ª EFAPI Expo</strong>, <strong>19–23/08</strong> en Santo Antônio da Platina — exhibición de animales, rodeo con Palhaço Furunfo, juegos mecánicos. El precio de entrada no está confirmado en ningún lado.</li>\n      <li><span class=\"chip hot\">SALUD</span> <strong>El VSR sigue siendo el motivo de la cautela:</strong> InfoGripe <strong>SE 30/2026</strong> — <span class=\"stat\">54,1 %</span> de los casos positivos de SRAG son VSR, Paraná permanece en la franja de alerta/riesgo.</li>\n      <li><span class=\"chip\">SALUD</span> <strong>Multivacinação:</strong> <strong>03/08–01/09</strong>, Dia D el sáb <strong>22/08</strong>, <span class=\"stat\">20 vacunas</span> para todos los menores de 15 años — con más de <span class=\"stat\">1.800</span> salas de vacunación en Paraná. El Informe nº 24 de dengue tiene ocho días, cifras no disponibles hoy.</li>\n      <li><span class=\"chip\">ESCUELA</span> <strong>Mes escolar completo:</strong> el receso de julio (13–24/07) ya pasó, agosto no tiene ventana de vacaciones. En Ribeirão Claro, la inscripción para el <em>Concurso do Prato Típico</em> sigue abierta hasta el <strong>24/08</strong>.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Mittwoch, der 12. August — Rotationsthema <em>Familie &amp; Alltag</em>, dreizehnte Folge. Das Thema sucht sich heute nicht der Kalender aus, sondern die Lage: Das InfoGripe-Bulletin der Fiocruz zur epidemiologischen Woche 30 führt Paraná weiter im Alarm- und Risikoband, und im Vier-Wochen-Fenster gehen <strong>54,1 %</strong> der positiven SRAG-Fälle auf das RS-Virus zurück — die Erregergruppe, die vor allem Säuglinge trifft. Mit einem einen Monat alten Baby im Haus sind das keine Nachrichten, sondern eine Packliste. Also die Wörter, die man in genau dieser Woche braucht: <strong>Fieber messen, husten, Kinderarzt, Rezept, Hausmittel</strong> — und dazu die drei Grammatik-Beuten des Tages: das portugiesische <em>tossir</em>, das nur in der Ich-Form aufbricht (<em>eu tusso</em>), das Verb <em>messen</em>, das in allen drei Sprachen unregelmäßig ist und in jeder an einer <em>anderen</em> Stelle, und der spanische falsche Freund <em>constipado</em>, der Erkältung heißt und nicht das, was Englischsprachige vermuten. <strong>10 Einträge, davon 3 Verben mit voller Konjugation</strong>, plus 2 Auffrischungen vom 2. und 29. Juli.</p>\n    <ul>\n      <li><span class=\"chip hot\">FALSCHER FREUND</span> <strong>constipado ≠ constipated</strong> — die RAE führt <em>constipado</em> schlicht als <em>catarro</em> bzw. <em>resfriado</em>: Wer auf Spanisch sagt „estoy constipado\", ist <strong>erkältet</strong>. Das englische <em>constipated</em> (Darm-Verstopfung) heißt auf Spanisch <em>estreñido</em>. Und im BR-Portugiesisch ist <em>constipado</em> <strong>zweideutig</strong> — dort also besser <em>resfriado</em> sagen. <span class=\"src\"><a href=\"https://dle.rae.es/constipado\">dle.rae.es</a> · <a href=\"https://www.dicio.com.br/constipado/\">dicio.com.br</a></span></li>\n      <li><span class=\"chip\">KONJUGATION</span> <strong>eu tusso, aber você tosse</strong> — <em>tossir</em> hebt den Stammvokal o→u genau dort, wo die Endung ein <em>-o</em> oder ein <em>-a</em> des Subjuntivs bringt: <em>eu tusso</em>, <em>que eu tussa, que nós tussamos</em> — sonst bleibt es <em>tosse, tossiu, tossia</em>. Das spanische <em>toser</em> macht diesen Sprung nicht mit: <em>yo toso</em>, glatt durch. <span class=\"src\"><a href=\"https://www.conjugacao.com.br/verbo-tossir/\">conjugacao.com.br</a> · <a href=\"https://conjugator.reverso.net/conjugation-spanish-verb-toser.html\">reverso.net</a></span></li>\n      <li><span class=\"chip\">KONJUGATION</span> <strong>messen bricht dreimal verschieden</strong> — Deutsch in der zweiten und dritten Person (<em>du misst</em>) und in der Vergangenheit (<em>maß, gemessen</em>); Portugiesisch nur in der Ich-Form und im Subjuntivo (<em>eu meço, que eu meça</em>); Spanisch unter Betonung und in der dritten Person Vergangenheit (<em>yo mido, él midió</em>). Dasselbe Wort <em>medir</em>, zwei verschiedene Bruchstellen. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/messen.htm\">verbformen.de</a> · <a href=\"https://www.conjugacao.com.br/verbo-medir/\">conjugacao.com.br</a> · <a href=\"https://conjugator.reverso.net/conjugation-spanish-verb-medir.html\">reverso.net</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>estar de molho</strong> — brasilianisch für „flachliegen, das Bett hüten\"; das informelle Wörterbuch übersetzt die Wendung direkt mit „doente; acamado\". Wörtlich heißt sie „eingeweicht sein\" — das Bild kommt aus der Küche, wo Bohnen über Nacht im Wasser stehen. Deutsch und Spanisch nehmen dagegen das Bild vom Bewachen: <em>das Bett hüten</em>, <em>guardar cama</em>. <span class=\"src\"><a href=\"https://www.dicionarioinformal.com.br/significado/de%20molho/13731/\">dicionarioinformal.com.br</a></span></li>\n      <li><span class=\"chip hot\">PHRASE</span> <strong>Fieber: drei Sprachen, drei Verben</strong> — Deutsch <em>hat</em> man Fieber, Spanisch <em>tiene</em> man es (<em>tiene fiebre</em>), und im brasilianischen Alltag <em>ist</em> man damit: <em>estar com febre</em>. Dieselbe Formel trägt die halbe Krankheits-Sprechstunde: <em>estou com tosse</em>, <em>estou com dor de garganta</em>, <em>está com febre</em>.</li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>gripe ist nicht resfriado</strong> — Brasilien trennt sauber, was das Deutsche zusammenwirft: <em>gripe</em> ist die Influenza (plötzlicher Beginn, hohes Fieber, Gliederschmerz), <em>resfriado</em> der milde, langsam kommende Schnupfen durch Rhinoviren; Niesen und <em>coriza</em> sprechen für den <em>resfriado</em>. Der deutsche „grippale Infekt\" ist genau <strong>nicht</strong> die Grippe. <span class=\"src\"><a href=\"https://bvsms.saude.gov.br/gripe-e-resfriado/\">bvsms.saude.gov.br</a></span></li>\n      <li><span class=\"chip\">GENUS</span> <strong>o pediatra / a pediatra</strong> — ein Wort auf <em>-a</em>, das trotzdem beide Geschlechter trägt; nur der Artikel wechselt. Das Deutsche baut stattdessen ein neues Wort (<em>Kinderarzt → Kinderärztin</em>) und schiebt sogar noch einen Umlaut hinein. <span class=\"src\"><a href=\"https://www.linguee.de/deutsch-englisch/uebersetzung/kinderarzt.html\">linguee.de</a></span></li>\n    </ul></div>",

        "de": "<div class=\"tldr\"><p class=\"lead\">Mittwoch, der 12. August — Rotationsthema <em>Familie &amp; Alltag</em>, dreizehnte Folge. Das Thema sucht sich heute nicht der Kalender aus, sondern die Lage: Das InfoGripe-Bulletin der Fiocruz zur epidemiologischen Woche 30 führt Paraná weiter im Alarm- und Risikoband, und im Vier-Wochen-Fenster gehen <strong>54,1 %</strong> der positiven SRAG-Fälle auf das RS-Virus zurück — die Erregergruppe, die vor allem Säuglinge trifft. Mit einem einen Monat alten Baby im Haus sind das keine Nachrichten, sondern eine Packliste. Also die Wörter, die man in genau dieser Woche braucht: <strong>Fieber messen, husten, Kinderarzt, Rezept, Hausmittel</strong> — und dazu die drei Grammatik-Beuten des Tages: das portugiesische <em>tossir</em>, das nur in der Ich-Form aufbricht (<em>eu tusso</em>), das Verb <em>messen</em>, das in allen drei Sprachen unregelmäßig ist und in jeder an einer <em>anderen</em> Stelle, und der spanische falsche Freund <em>constipado</em>, der Erkältung heißt und nicht das, was Englischsprachige vermuten. <strong>10 Einträge, davon 3 Verben mit voller Konjugation</strong>, plus 2 Auffrischungen vom 2. und 29. Juli.</p>\n    <ul>\n      <li><span class=\"chip hot\">FALSCHER FREUND</span> <strong>constipado ≠ constipated</strong> — die RAE führt <em>constipado</em> schlicht als <em>catarro</em> bzw. <em>resfriado</em>: Wer auf Spanisch sagt „estoy constipado\", ist <strong>erkältet</strong>. Das englische <em>constipated</em> (Darm-Verstopfung) heißt auf Spanisch <em>estreñido</em>. Und im BR-Portugiesisch ist <em>constipado</em> <strong>zweideutig</strong> — dort also besser <em>resfriado</em> sagen. <span class=\"src\"><a href=\"https://dle.rae.es/constipado\">dle.rae.es</a> · <a href=\"https://www.dicio.com.br/constipado/\">dicio.com.br</a></span></li>\n      <li><span class=\"chip\">KONJUGATION</span> <strong>eu tusso, aber você tosse</strong> — <em>tossir</em> hebt den Stammvokal o→u genau dort, wo die Endung ein <em>-o</em> oder ein <em>-a</em> des Subjuntivs bringt: <em>eu tusso</em>, <em>que eu tussa, que nós tussamos</em> — sonst bleibt es <em>tosse, tossiu, tossia</em>. Das spanische <em>toser</em> macht diesen Sprung nicht mit: <em>yo toso</em>, glatt durch. <span class=\"src\"><a href=\"https://www.conjugacao.com.br/verbo-tossir/\">conjugacao.com.br</a> · <a href=\"https://conjugator.reverso.net/conjugation-spanish-verb-toser.html\">reverso.net</a></span></li>\n      <li><span class=\"chip\">KONJUGATION</span> <strong>messen bricht dreimal verschieden</strong> — Deutsch in der zweiten und dritten Person (<em>du misst</em>) und in der Vergangenheit (<em>maß, gemessen</em>); Portugiesisch nur in der Ich-Form und im Subjuntivo (<em>eu meço, que eu meça</em>); Spanisch unter Betonung und in der dritten Person Vergangenheit (<em>yo mido, él midió</em>). Dasselbe Wort <em>medir</em>, zwei verschiedene Bruchstellen. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/messen.htm\">verbformen.de</a> · <a href=\"https://www.conjugacao.com.br/verbo-medir/\">conjugacao.com.br</a> · <a href=\"https://conjugator.reverso.net/conjugation-spanish-verb-medir.html\">reverso.net</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>estar de molho</strong> — brasilianisch für „flachliegen, das Bett hüten\"; das informelle Wörterbuch übersetzt die Wendung direkt mit „doente; acamado\". Wörtlich heißt sie „eingeweicht sein\" — das Bild kommt aus der Küche, wo Bohnen über Nacht im Wasser stehen. Deutsch und Spanisch nehmen dagegen das Bild vom Bewachen: <em>das Bett hüten</em>, <em>guardar cama</em>. <span class=\"src\"><a href=\"https://www.dicionarioinformal.com.br/significado/de%20molho/13731/\">dicionarioinformal.com.br</a></span></li>\n      <li><span class=\"chip hot\">PHRASE</span> <strong>Fieber: drei Sprachen, drei Verben</strong> — Deutsch <em>hat</em> man Fieber, Spanisch <em>tiene</em> man es (<em>tiene fiebre</em>), und im brasilianischen Alltag <em>ist</em> man damit: <em>estar com febre</em>. Dieselbe Formel trägt die halbe Krankheits-Sprechstunde: <em>estou com tosse</em>, <em>estou com dor de garganta</em>, <em>está com febre</em>.</li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>gripe ist nicht resfriado</strong> — Brasilien trennt sauber, was das Deutsche zusammenwirft: <em>gripe</em> ist die Influenza (plötzlicher Beginn, hohes Fieber, Gliederschmerz), <em>resfriado</em> der milde, langsam kommende Schnupfen durch Rhinoviren; Niesen und <em>coriza</em> sprechen für den <em>resfriado</em>. Der deutsche „grippale Infekt\" ist genau <strong>nicht</strong> die Grippe. <span class=\"src\"><a href=\"https://bvsms.saude.gov.br/gripe-e-resfriado/\">bvsms.saude.gov.br</a></span></li>\n      <li><span class=\"chip\">GENUS</span> <strong>o pediatra / a pediatra</strong> — ein Wort auf <em>-a</em>, das trotzdem beide Geschlechter trägt; nur der Artikel wechselt. Das Deutsche baut stattdessen ein neues Wort (<em>Kinderarzt → Kinderärztin</em>) und schiebt sogar noch einen Umlaut hinein. <span class=\"src\"><a href=\"https://www.linguee.de/deutsch-englisch/uebersetzung/kinderarzt.html\">linguee.de</a></span></li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Wednesday, August 12 — rotation theme <em>Family &amp; Everyday Life</em>, thirteenth installment. Today the calendar isn't picking the topic, the situation is: Fiocruz's InfoGripe bulletin for epidemiological week 30 still keeps Paraná in the alert-and-risk band, and within the four-week window, <strong>54.1%</strong> of positive SRAG cases (severe respiratory illness) trace back to RSV — the pathogen group that hits infants hardest. With a one-month-old baby in the house, that's not news, it's a packing list. So here are the words you need this exact week: <strong>taking a temperature, coughing, pediatrician, prescription, home remedy</strong> — plus today's three grammar hauls: Portuguese <em>tossir</em>, which only breaks in the I-form (<em>eu tusso</em>); the verb <em>to measure</em>, irregular in all three languages and irregular in a different spot each time, and the Spanish false friend <em>constipado</em>, which means \"having a cold,\" not what English speakers assume. <strong>10 entries, 3 of them verbs with full conjugation</strong>, plus 2 refreshers from July 2 and July 29.</p>\n    <ul>\n      <li><span class=\"chip hot\">FALSE FRIEND</span> <strong>constipado ≠ constipated</strong> — the RAE simply defines <em>constipado</em> as <em>catarro</em> or <em>resfriado</em>: saying \"estoy constipado\" in Spanish means you have a cold. English <em>constipated</em> (bowel blockage) is <em>estreñido</em> in Spanish. And in BR Portuguese, <em>constipado</em> is <strong>ambiguous</strong> — better to say <em>resfriado</em> there instead. <span class=\"src\"><a href=\"https://dle.rae.es/constipado\">dle.rae.es</a> · <a href=\"https://www.dicio.com.br/constipado/\">dicio.com.br</a></span></li>\n      <li><span class=\"chip\">CONJUGATION</span> <strong>eu tusso, but você tosse</strong> — <em>tossir</em> raises the stem vowel o→u exactly where the ending brings an <em>-o</em> or the subjunctive's <em>-a</em>: <em>eu tusso</em>, <em>que eu tussa, que nós tussamos</em> — everywhere else it stays <em>tosse, tossiu, tossia</em>. Spanish <em>toser</em> doesn't make this jump: <em>yo toso</em>, flat throughout. <span class=\"src\"><a href=\"https://www.conjugacao.com.br/verbo-tossir/\">conjugacao.com.br</a> · <a href=\"https://conjugator.reverso.net/conjugation-spanish-verb-toser.html\">reverso.net</a></span></li>\n      <li><span class=\"chip\">CONJUGATION</span> <strong>to measure breaks three different ways</strong> — German in the second and third person (<em>du misst</em>) and in the past tense (<em>maß, gemessen</em>); Portuguese only in the I-form and the subjunctive (<em>eu meço, que eu meça</em>); Spanish under stress and in the third-person preterite (<em>yo mido, él midió</em>). Same word <em>medir</em>, two different break points. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/messen.htm\">verbformen.de</a> · <a href=\"https://www.conjugacao.com.br/verbo-medir/\">conjugacao.com.br</a> · <a href=\"https://conjugator.reverso.net/conjugation-spanish-verb-medir.html\">reverso.net</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>estar de molho</strong> — Brazilian for \"being laid up, staying in bed\"; the informal dictionary translates the phrase directly as \"doente; acamado\" (sick; bedridden). Literally it means \"being soaked\" — the image comes from the kitchen, where beans sit in water overnight. German and Spanish instead reach for the image of standing guard: <em>das Bett hüten</em>, <em>guardar cama</em>. <span class=\"src\"><a href=\"https://www.dicionarioinformal.com.br/significado/de%20molho/13731/\">dicionarioinformal.com.br</a></span></li>\n      <li><span class=\"chip hot\">PHRASE</span> <strong>fever: three languages, three verbs</strong> — German you <em>have</em> a fever, Spanish you also <em>have</em> one (<em>tiene fiebre</em>), and in Brazilian everyday speech you <em>are with</em> one: <em>estar com febre</em>. That same formula carries half the sick-visit vocabulary: <em>estou com tosse</em>, <em>estou com dor de garganta</em>, <em>está com febre</em>.</li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>gripe is not resfriado</strong> — Brazil cleanly separates what German lumps together: <em>gripe</em> is the flu (sudden onset, high fever, body aches), <em>resfriado</em> the mild, slow-building cold caused by rhinoviruses; sneezing and <em>coriza</em> point to <em>resfriado</em>. The German \"grippaler Infekt\" is precisely <strong>not</strong> the flu. <span class=\"src\"><a href=\"https://bvsms.saude.gov.br/gripe-e-resfriado/\">bvsms.saude.gov.br</a></span></li>\n      <li><span class=\"chip\">GENDER</span> <strong>o pediatra / a pediatra</strong> — a word ending in <em>-a</em> that still carries both genders; only the article changes. German instead builds a whole new word (<em>Kinderarzt → Kinderärztin</em>), umlaut and all. <span class=\"src\"><a href=\"https://www.linguee.de/deutsch-englisch/uebersetzung/kinderarzt.html\">linguee.de</a></span></li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Quarta-feira, 12 de agosto — tema da rotação <em>Família &amp; Cotidiano</em>, décimo terceiro capítulo. Hoje quem escolhe o assunto não é o calendário, é a situação: o boletim InfoGripe da Fiocruz para a semana epidemiológica 30 mantém o Paraná na faixa de alerta e risco, e na janela de quatro semanas 54,1% dos casos positivos de SRAG (síndrome respiratória aguda grave) são causados pelo vírus sincicial respiratório — o grupo de patógenos que mais atinge bebês. Com um bebê de um mês em casa, isso não é notícia, é lista de bagagem. Então, as palavras que você precisa exatamente nesta semana: <strong>medir febre, tossir, pediatra, receita, remédio caseiro</strong> — e mais os três troféus gramaticais do dia: o português <em>tossir</em>, que só quebra na primeira pessoa (<em>eu tusso</em>), o verbo <em>medir</em>, irregular nas três línguas e irregular em um ponto diferente em cada uma, e o falso cognato espanhol <em>constipado</em>, que significa resfriado, e não o que os falantes de inglês imaginam. <strong>10 verbetes, sendo 3 verbos com conjugação completa</strong>, mais 2 revisões de 2 e 29 de julho.</p>\n    <ul>\n      <li><span class=\"chip hot\">FALSO COGNATO</span> <strong>constipado ≠ constipated</strong> — a RAE define <em>constipado</em> simplesmente como <em>catarro</em> ou <em>resfriado</em>: quem diz \"estoy constipado\" em espanhol está avisando que está resfriado. O inglês <em>constipated</em> (prisão de ventre) é <em>estreñido</em> em espanhol. E no português do Brasil, <em>constipado</em> é <strong>ambíguo</strong> — melhor dizer <em>resfriado</em> por aqui. <span class=\"src\"><a href=\"https://dle.rae.es/constipado\">dle.rae.es</a> · <a href=\"https://www.dicio.com.br/constipado/\">dicio.com.br</a></span></li>\n      <li><span class=\"chip\">CONJUGAÇÃO</span> <strong>eu tusso, mas você tosse</strong> — <em>tossir</em> eleva a vogal do radical de o para u exatamente onde a terminação traz um <em>-o</em> ou o <em>-a</em> do subjuntivo: <em>eu tusso</em>, <em>que eu tussa, que nós tussamos</em> — no resto fica <em>tosse, tossiu, tossia</em>. O espanhol <em>toser</em> não faz esse salto: <em>yo toso</em>, reto do começo ao fim. <span class=\"src\"><a href=\"https://www.conjugacao.com.br/verbo-tossir/\">conjugacao.com.br</a> · <a href=\"https://conjugator.reverso.net/conjugation-spanish-verb-toser.html\">reverso.net</a></span></li>\n      <li><span class=\"chip\">CONJUGAÇÃO</span> <strong>medir quebra de três jeitos diferentes</strong> — o alemão na segunda e na terceira pessoa (<em>du misst</em>) e no passado (<em>maß, gemessen</em>); o português só na primeira pessoa e no subjuntivo (<em>eu meço, que eu meça</em>); o espanhol sob acentuação e na terceira pessoa do pretérito (<em>yo mido, él midió</em>). A mesma palavra <em>medir</em>, dois pontos de quebra diferentes. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/messen.htm\">verbformen.de</a> · <a href=\"https://www.conjugacao.com.br/verbo-medir/\">conjugacao.com.br</a> · <a href=\"https://conjugator.reverso.net/conjugation-spanish-verb-medir.html\">reverso.net</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>estar de molho</strong> — expressão brasileira para \"estar doente, de cama\"; o dicionário informal traduz a expressão diretamente por \"doente; acamado\". Literalmente significa \"estar de molho na água\" — a imagem vem da cozinha, do feijão que fica de molho a noite toda. Já o alemão e o espanhol usam a imagem da guarda: <em>das Bett hüten</em> (guardar a cama), <em>guardar cama</em>. <span class=\"src\"><a href=\"https://www.dicionarioinformal.com.br/significado/de%20molho/13731/\">dicionarioinformal.com.br</a></span></li>\n      <li><span class=\"chip hot\">FRASE</span> <strong>febre: três línguas, três verbos</strong> — em alemão a pessoa <em>tem</em> febre, em espanhol também <em>tiene</em> (<em>tiene fiebre</em>), e no dia a dia brasileiro a pessoa <em>está com</em>: <em>estar com febre</em>. A mesma fórmula carrega metade do vocabulário da consulta: <em>estou com tosse</em>, <em>estou com dor de garganta</em>, <em>está com febre</em>.</li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>gripe não é resfriado</strong> — o Brasil separa com clareza o que o alemão joga no mesmo saco: <em>gripe</em> é a influenza (início súbito, febre alta, dor no corpo), <em>resfriado</em> é o quadro leve e de início lento causado por rinovírus; espirro e coriza indicam mais o <em>resfriado</em>. O alemão \"grippaler Infekt\" (infecção gripal) <strong>não</strong> é a gripe de verdade. <span class=\"src\"><a href=\"https://bvsms.saude.gov.br/gripe-e-resfriado/\">bvsms.saude.gov.br</a></span></li>\n      <li><span class=\"chip\">GÊNERO</span> <strong>o pediatra / a pediatra</strong> — uma palavra terminada em <em>-a</em> que mesmo assim carrega os dois gêneros; só o artigo muda. O alemão, em vez disso, cria uma palavra nova (<em>Kinderarzt → Kinderärztin</em>) e ainda encaixa um trema no meio. <span class=\"src\"><a href=\"https://www.linguee.de/deutsch-englisch/uebersetzung/kinderarzt.html\">linguee.de</a></span></li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Miércoles 12 de agosto — tema de la rotación <em>Familia y vida cotidiana</em>, decimotercera entrega. Hoy el tema no lo elige el calendario, sino la situación: el boletín InfoGripe de Fiocruz para la semana epidemiológica 30 mantiene a Paraná en la franja de alerta y riesgo, y en la ventana de cuatro semanas, el 54,1% de los casos positivos de SRAG (síndrome respiratorio agudo grave) se deben al virus sincicial respiratorio — el grupo de patógenos que más golpea a los bebés. Con un bebé de un mes en casa, eso no son noticias, es una lista de equipaje. Así que las palabras que necesitas justo esta semana: <strong>tomar la temperatura, toser, pediatra, receta, remedio casero</strong> — y de yapa, el botín gramatical de hoy: el portugués <em>tossir</em>, que solo se rompe en la primera persona (<em>eu tusso</em>); el verbo <em>medir</em>, irregular en los tres idiomas y en un punto distinto en cada uno, y el falso amigo español <em>constipado</em>, que significa resfriado y no lo que suponen los hablantes de inglés. <strong>10 entradas, 3 de ellas verbos con conjugación completa</strong>, más 2 repasos del 2 y el 29 de julio.</p>\n    <ul>\n      <li><span class=\"chip hot\">FALSO AMIGO</span> <strong>constipado ≠ constipated</strong> — la RAE define <em>constipado</em> simplemente como <em>catarro</em> o <em>resfriado</em>: quien dice \"estoy constipado\" está avisando que tiene resfriado. El inglés <em>constipated</em> (estreñimiento) se dice en español <em>estreñido</em>. Y en el portugués de Brasil, <em>constipado</em> es <strong>ambiguo</strong> — ahí mejor decir <em>resfriado</em>. <span class=\"src\"><a href=\"https://dle.rae.es/constipado\">dle.rae.es</a> · <a href=\"https://www.dicio.com.br/constipado/\">dicio.com.br</a></span></li>\n      <li><span class=\"chip\">CONJUGACIÓN</span> <strong>eu tusso, pero você tosse</strong> — <em>tossir</em> sube la vocal de la raíz de o a u justo donde la terminación trae una <em>-o</em> o la <em>-a</em> del subjuntivo: <em>eu tusso</em>, <em>que eu tussa, que nós tussamos</em> — en todo lo demás se queda <em>tosse, tossiu, tossia</em>. El español <em>toser</em> no da ese salto: <em>yo toso</em>, parejo de principio a fin. <span class=\"src\"><a href=\"https://www.conjugacao.com.br/verbo-tossir/\">conjugacao.com.br</a> · <a href=\"https://conjugator.reverso.net/conjugation-spanish-verb-toser.html\">reverso.net</a></span></li>\n      <li><span class=\"chip\">CONJUGACIÓN</span> <strong>medir se rompe de tres formas distintas</strong> — el alemán en la segunda y tercera persona (<em>du misst</em>) y en el pasado (<em>maß, gemessen</em>); el portugués solo en la primera persona y en el subjuntivo (<em>eu meço, que eu meça</em>); el español bajo acentuación y en la tercera persona del pretérito (<em>yo mido, él midió</em>). La misma palabra <em>medir</em>, dos puntos de quiebre distintos. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/messen.htm\">verbformen.de</a> · <a href=\"https://www.conjugacao.com.br/verbo-medir/\">conjugacao.com.br</a> · <a href=\"https://conjugator.reverso.net/conjugation-spanish-verb-medir.html\">reverso.net</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>estar de molho</strong> — expresión brasileña para \"estar guardando cama\"; el diccionario informal traduce la frase directamente como \"doente; acamado\" (enfermo; postrado). Literalmente significa \"estar en remojo\" — la imagen viene de la cocina, de los frijoles que se dejan en agua toda la noche. En cambio, el alemán y el español recurren a la imagen de hacer guardia: <em>das Bett hüten</em>, <em>guardar cama</em>. <span class=\"src\"><a href=\"https://www.dicionarioinformal.com.br/significado/de%20molho/13731/\">dicionarioinformal.com.br</a></span></li>\n      <li><span class=\"chip hot\">FRASE</span> <strong>fiebre: tres idiomas, tres verbos</strong> — en alemán uno <em>tiene</em> fiebre, en español también se <em>tiene</em> (<em>tiene fiebre</em>), y en el día a día brasileño uno <em>está con</em> ella: <em>estar com febre</em>. Esa misma fórmula carga la mitad del vocabulario de consultorio: <em>estou com tosse</em>, <em>estou com dor de garganta</em>, <em>está com febre</em>.</li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>gripe no es resfriado</strong> — Brasil separa con claridad lo que el alemán mete en el mismo costal: <em>gripe</em> es la influenza (inicio repentino, fiebre alta, dolor de cuerpo), <em>resfriado</em> es el cuadro leve y de aparición lenta causado por rinovirus; estornudos y <em>coriza</em> (moqueo) apuntan más al <em>resfriado</em>. El alemán \"grippaler Infekt\" (infección gripal) <strong>no</strong> es la gripe de verdad. <span class=\"src\"><a href=\"https://bvsms.saude.gov.br/gripe-e-resfriado/\">bvsms.saude.gov.br</a></span></li>\n      <li><span class=\"chip\">GÉNERO</span> <strong>o pediatra / a pediatra</strong> — una palabra terminada en <em>-a</em> que aun así lleva los dos géneros; solo cambia el artículo. El alemán, en cambio, construye una palabra nueva (<em>Kinderarzt → Kinderärztin</em>) y hasta le mete una diéresis. <span class=\"src\"><a href=\"https://www.linguee.de/deutsch-englisch/uebersetzung/kinderarzt.html\">linguee.de</a></span></li>\n    </ul></div>"
