        "en": "<div class=\"tldr\"><p class=\"lead\">Today isn't about a new model — it's about plugs and price, the two things that hit your daily workflow harder than any benchmark. On Tuesday, the MCP specification <strong>2026-07-28</strong> drops: the biggest overhaul since launch, the protocol goes stateless, and the <code>initialize</code> handshake plus the session ID disappear — with explicit breaking changes. Five weeks later, on August 31, Claude Sonnet 5's launch pricing expires and token costs jump 50%. I also ran down the circulating \"82.1% on SWE-bench Verified, first model over 80\" claim — it doesn't hold up. And GitHub lets an open-weight model into the Copilot picker for the first time.</p>\n    <ul>\n      <li><span class=\"chip hot\">MCP</span> <strong>Final spec 2026-07-28</strong> drops on Tuesday: \"the biggest overhaul of the protocol since launch.\" The core goes <strong>stateless</strong> — the <code>initialize</code>/<code>initialized</code> handshake and the <code>Mcp-Session-Id</code> header disappear, and any request can land on any server instance.</li>\n      <li><span class=\"chip hot\">MCP</span> <strong>Breaking changes, explicit</strong>: the <code>2025-11-25</code> initialize flow and session-based routing stop working. Tasks moves out of the core into an extension framework (<code>tasks/get</code>, <code>tasks/update</code>, <code>tasks/cancel</code>); Roots, Sampling, and Logging are deprecated with a 12-month grace period.</li>\n      <li><span class=\"chip\">Claude</span> <strong>Sonnet 5 price cliff on Aug 31</strong>: currently <span class=\"stat\">$2</span>/<span class=\"stat\">$10</span> per million input/output tokens, rising to <span class=\"stat\">$3</span>/<span class=\"stat\">$15</span> on September 1 — plus 50% on both sides, on the same unchanged model.</li>\n      <li><span class=\"chip\">Bench</span> <strong>The 82.1% doesn't hold up.</strong> Anthropic's own announcement page (checked July 25) doesn't cite a single SWE-bench figure; the dated BenchLM aggregate has Sonnet 5 at <span class=\"stat\">85.2%</span>, <strong>rank 6</strong> — behind five Anthropic models. \"First model over 80%\" is simply wrong on this board: eight entries are above 80.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Independent second opinions</strong> on Sonnet 5: Artificial Analysis Intelligence Index <span class=\"stat\">53</span> points; Arena.ai WebDev rank 10 at <span class=\"stat\">1541</span> ±11. Strong, but not the top.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>Kimi K2.7 Code in GitHub Copilot</strong> (Jul 1) — per GitHub, \"the first open-weight model offered as a selectable option in the Copilot model picker.\" <span class=\"stat\">$0.95</span>/<span class=\"stat\">$4.00</span> per million tokens, roughly a third to half of the proprietary options next to it.</li>\n      <li><span class=\"chip\">Local</span> <strong>NVIDIA Nemotron-Labs-TwoTower</strong> (Jul 1): 2.42x throughput at 98.7% of base quality, open weights on Hugging Face. But it's a base model with no instruction tuning, and code/math lag behind the reference — no tool for your coding chain today.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Roundup</strong>: Cursor Router since Jul 22, Windsurf finally \"Devin Desktop,\" Continue.dev discontinued, OpenHands 1.0 on LiteLLM, Cline with headless CLI 2.0 — and Aider's board still stuck on Nov 20, 2025.</li>\n      <li><span class=\"chip\">Source</span> <strong>Sourcing note</strong>: swebench.com still wasn't readable as a table today either; the bench figures below come from a dated aggregate plus two independent boards. All flagged as such.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Hoje não é sobre um modelo novo, mas sobre tomada e preço — as duas coisas que atingem seu dia a dia com mais força do que qualquer benchmark. Na terça-feira sai a especificação do MCP <strong>2026-07-28</strong>: a maior revisão desde o lançamento, o protocolo fica <strong>sem estado</strong>, e o handshake <code>initialize</code> e o ID de sessão desaparecem — com mudanças que quebram compatibilidade de propósito. Cinco semanas depois, em 31 de agosto, termina o preço de lançamento do Claude Sonnet 5 e o custo por token sobe 50%. Também fui checar o \"82,1% no SWE-bench Verified, primeiro modelo acima de 80\" que está circulando — não se sustenta. E o GitHub deixa, pela primeira vez, um modelo aberto entrar no seletor do Copilot.</p>\n    <ul>\n      <li><span class=\"chip hot\">MCP</span> <strong>Spec final 2026-07-28</strong> sai na terça: \"a maior revisão do protocolo desde o lançamento\". O núcleo fica <strong>sem estado</strong> — o handshake <code>initialize</code>/<code>initialized</code> e o cabeçalho <code>Mcp-Session-Id</code> deixam de existir, e qualquer requisição pode cair em qualquer instância do servidor.</li>\n      <li><span class=\"chip hot\">MCP</span> <strong>Mudanças que quebram compatibilidade, de propósito</strong>: o fluxo de initialize <code>2025-11-25</code> e o roteamento baseado em sessão param de funcionar. Tasks sai do núcleo e vai para um framework de extensão (<code>tasks/get</code>, <code>tasks/update</code>, <code>tasks/cancel</code>); Roots, Sampling e Logging ficam obsoletos com prazo de 12 meses.</li>\n      <li><span class=\"chip\">Claude</span> <strong>Corte de preço do Sonnet 5 em 31/08</strong>: hoje <span class=\"stat\">US$ 2</span>/<span class=\"stat\">US$ 10</span> por milhão de tokens de entrada/saída, e a partir de 1º de setembro <span class=\"stat\">US$ 3</span>/<span class=\"stat\">US$ 15</span> — mais 50% dos dois lados, com o mesmo modelo inalterado.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Os 82,1% não se sustentam.</strong> A própria página de anúncio da Anthropic (checada em 25/07) não cita nenhum número de SWE-bench; o agregado datado do BenchLM coloca o Sonnet 5 em <span class=\"stat\">85,2%</span>, <strong>posição 6</strong> — atrás de cinco modelos da Anthropic. \"Primeiro modelo acima de 80%\" está simplesmente errado nesse ranking: oito entradas ficam acima de 80.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Segundas opiniões independentes</strong> sobre o Sonnet 5: Artificial Analysis Intelligence Index com <span class=\"stat\">53</span> pontos; Arena.ai WebDev posição 10 com <span class=\"stat\">1541</span> ±11. Forte, mas não é o topo.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>Kimi K2.7 Code no GitHub Copilot</strong> (01/07) — segundo o GitHub, \"o primeiro modelo de peso aberto oferecido como opção selecionável no seletor de modelos do Copilot\". <span class=\"stat\">US$ 0,95</span>/<span class=\"stat\">US$ 4,00</span> por milhão de tokens, ou seja, de um terço a metade das opções proprietárias ao lado.</li>\n      <li><span class=\"chip\">Local</span> <strong>NVIDIA Nemotron-Labs-TwoTower</strong> (01/07): 2,42× de throughput com 98,7% da qualidade do modelo base, pesos abertos no Hugging Face. Mas é um modelo base sem instruction-tuning, e código/matemática perdem para a referência — hoje não é ferramenta para sua cadeia de programação.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Rodada geral</strong>: Cursor Router desde 22/07, Windsurf definitivamente virou \"Devin Desktop\", Continue.dev descontinuado, OpenHands 1.0 sobre LiteLLM, Cline com CLI headless 2.0 — e o ranking do Aider segue parado em 20/11/2025.</li>\n      <li><span class=\"chip\">Fonte</span> <strong>Base de evidências</strong>: o swebench.com também não pôde ser lido como tabela hoje; os números de benchmark abaixo vêm de um agregado datado mais dois rankings independentes. Tudo sinalizado como tal.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Hoy no se trata de un modelo nuevo, sino de enchufe y precio — las dos cosas que golpean tu día a día más fuerte que cualquier benchmark. El martes sale la especificación de MCP <strong>2026-07-28</strong>: la revisión más grande desde el lanzamiento, el protocolo se vuelve <strong>sin estado</strong>, y el handshake <code>initialize</code> y el ID de sesión desaparecen — con cambios explícitos que rompen compatibilidad. Cinco semanas después, el 31 de agosto, termina el precio de lanzamiento de Claude Sonnet 5 y el costo por token sube 50%. También revisé el \"82.1% en SWE-bench Verified, primer modelo por encima de 80\" que circula — no resiste el análisis. Y GitHub deja entrar, por primera vez, un modelo abierto al selector de Copilot.</p>\n    <ul>\n      <li><span class=\"chip hot\">MCP</span> <strong>Spec final 2026-07-28</strong> sale el martes: \"la revisión más grande del protocolo desde el lanzamiento\". El núcleo se vuelve <strong>sin estado</strong> — el handshake <code>initialize</code>/<code>initialized</code> y el encabezado <code>Mcp-Session-Id</code> desaparecen, y cualquier solicitud puede caer en cualquier instancia del servidor.</li>\n      <li><span class=\"chip hot\">MCP</span> <strong>Cambios que rompen compatibilidad, de forma explícita</strong>: el flujo de initialize <code>2025-11-25</code> y el enrutamiento basado en sesión dejan de funcionar. Tasks sale del núcleo hacia un framework de extensión (<code>tasks/get</code>, <code>tasks/update</code>, <code>tasks/cancel</code>); Roots, Sampling y Logging quedan obsoletos con un plazo de 12 meses.</li>\n      <li><span class=\"chip\">Claude</span> <strong>Corte de precio de Sonnet 5 el 31/08</strong>: hoy <span class=\"stat\">$2</span>/<span class=\"stat\">$10</span> por millón de tokens de entrada/salida, y a partir del 1 de septiembre <span class=\"stat\">$3</span>/<span class=\"stat\">$15</span> — un 50% más en ambos lados, con el mismo modelo sin cambios.</li>\n      <li><span class=\"chip\">Bench</span> <strong>El 82.1% no resiste el análisis.</strong> La propia página de anuncio de Anthropic (revisada el 25/07) no menciona ninguna cifra de SWE-bench; el agregado fechado de BenchLM ubica a Sonnet 5 con <span class=\"stat\">85.2%</span>, <strong>puesto 6</strong> — detrás de cinco modelos de Anthropic. \"Primer modelo por encima de 80%\" está simplemente equivocado en ese ranking: ocho entradas están por encima de 80.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Segundas opiniones independientes</strong> sobre Sonnet 5: Artificial Analysis Intelligence Index con <span class=\"stat\">53</span> puntos; Arena.ai WebDev puesto 10 con <span class=\"stat\">1541</span> ±11. Fuerte, pero no la cima.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>Kimi K2.7 Code en GitHub Copilot</strong> (01/07) — según GitHub, \"el primer modelo de peso abierto ofrecido como opción seleccionable en el selector de modelos de Copilot\". <span class=\"stat\">$0.95</span>/<span class=\"stat\">$4.00</span> por millón de tokens, es decir, entre un tercio y la mitad de las opciones propietarias al lado.</li>\n      <li><span class=\"chip\">Local</span> <strong>NVIDIA Nemotron-Labs-TwoTower</strong> (01/07): 2.42× de throughput con 98.7% de la calidad del modelo base, pesos abiertos en Hugging Face. Pero es un modelo base sin instruction-tuning, y código/matemáticas pierden frente a la referencia — hoy no es una herramienta para tu cadena de programación.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Recuento general</strong>: Cursor Router desde el 22/07, Windsurf definitivamente convertido en \"Devin Desktop\", Continue.dev descontinuado, OpenHands 1.0 sobre LiteLLM, Cline con CLI headless 2.0 — y el ranking de Aider sigue congelado en el 20/11/2025.</li>\n      <li><span class=\"chip\">Fuente</span> <strong>Situación de las fuentes</strong>: swebench.com tampoco pudo leerse como tabla hoy; las cifras de benchmark de abajo vienen de un agregado fechado más dos rankings independientes. Todo señalado como tal.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Nachrichtenarm heute — Samstag. Also der Blick aufs Muster statt auf die Meldung: Seit Mai haben Microsoft, Amazon, Anthropic und das OpenAI-Umfeld in vier großen Zügen <strong>Milliarden nicht in Modelle, sondern in Einführungs-Personal</strong> gesteckt — der jüngste ist Microsofts <strong>Frontier Company</strong> vom 02.07. Das ist der Preis-Zettel an einer Erkenntnis: Das Modell ist längst nicht mehr das Problem, die letzte Meile ist es. Ironischerweise kommen die einzigen sauber gemessenen Vorher-Nachher-Zahlen dieses Sommers nicht von einem Anbieter, sondern aus <strong>19 deutschen Kommunen</strong> — während 1.505 befragte Finanzchefs zugeben, unter ROI-Druck zu deployen und sich beim Erklären ihrer Agenten gegenüber Prüfern nur mäßig sicher zu fühlen.</p>\n    <ul>\n      <li><span class=\"chip hot\">DEPLOY · US</span> <strong>Milliarden für die Einführung:</strong> Microsoft steckt <strong>2,5 Mrd. $</strong> und ~<strong>6.000 Fachleute</strong> in eine eigene Deployment-Einheit (02.07.), Amazon <strong>1 Mrd. $</strong>, Anthropic ein <strong>1,5-Mrd.-$</strong>-Joint-Venture, das OpenAI-Umfeld <strong>4 Mrd. $</strong> plus 150 zugekaufte Ingenieure.</li>\n      <li><span class=\"chip\">STUDY · Global</span> <strong>Engpass ist nicht die Technik:</strong> <strong>71 %</strong> der Führungskräfte in Milliarden-Unternehmen nennen <em>organisatorische</em> Reife als Hauptbremse, nur <strong>11 %</strong> die Technologie (PYMNTS Intelligence — Methodik-Flag unten).</li>\n      <li><span class=\"chip good\">DEPLOY · DE · Public</span> <strong>Agentic AI Hub:</strong> 19 Kommunen, 20 Piloten, <strong>70 %</strong> operativ. DSGVO-Auskunft <strong>&gt;90 %</strong> schneller (bis zu <strong>28 Std.</strong> je Vorgang), „Hilfe zur Pflege\" <strong>−45 %</strong> Durchlaufzeit. <em>Bilanz vom 15.06. — nicht taufrisch, aber die belastbarsten Zahlen weit und breit.</em></li>\n      <li><span class=\"chip hot\">STUDY · Finance</span> <strong>Tempo schlägt Kontrolle:</strong> <strong>92 %</strong> von 1.505 Finanzentscheidern spüren Karriere-Druck, KI-ROI zu zeigen, nur <strong>7 %</strong> stellen Governance vor Geschwindigkeit, <strong>44 %</strong> sind nur mäßig zuversichtlich, Agenten-Handlungen Prüfern erklären zu können. Auftragsstudie (Avalara).</li>\n      <li><span class=\"chip\">STUDY · Global</span> <strong>Forrester/FPT</strong> (n=397): nur <strong>26 %</strong> gelten beim Skalieren als „fortgeschritten\" — <strong>35 %</strong> erheben gar keine quantifizierten Kennzahlen, <strong>10 %</strong> messen KI-Ergebnisse in überhaupt keiner Form.</li>\n      <li><span class=\"chip\">MARKT</span> <strong>Gartner:</strong> <strong>234 Mrd. $</strong> Enterprise-Software-Umsatz bis 2030 „gefährdet\" — rund <strong>20 %</strong> der SaaS-Ausgaben. Das Lizenz-pro-Nutzer-Modell bricht, wenn ein Agent die Arbeit von fünf Nutzern macht.</li>\n      <li><span class=\"chip\">REG · EU</span> <strong>Noch acht Tage:</strong> Am <strong>02.08.</strong> greifen GPAI-Pflichten und die Durchsetzungsbefugnisse des AI Office <em>unverändert</em>; die Hochrisiko-Pflichten sind auf <strong>02.12.2027</strong> verschoben.</li>\n      <li><span class=\"chip good\">twiceD</span> Zwei Ideen: ein <strong>Art.-15-Auskunftsagent on-prem</strong> (direkt aus der bestgemessenen Kommunal-Zahl) und ein <strong>SaaS-Lizenz-Röntgen</strong> für die Frage, welche Seats den Agenten überleben.</li>\n    </ul></div>",

        "de": "<div class=\"tldr\"><p class=\"lead\">Nachrichtenarm heute — Samstag. Also der Blick aufs Muster statt auf die Meldung: Seit Mai haben Microsoft, Amazon, Anthropic und das OpenAI-Umfeld in vier großen Zügen <strong>Milliarden nicht in Modelle, sondern in Einführungs-Personal</strong> gesteckt — der jüngste ist Microsofts <strong>Frontier Company</strong> vom 02.07. Das ist der Preis-Zettel an einer Erkenntnis: Das Modell ist längst nicht mehr das Problem, die letzte Meile ist es. Ironischerweise kommen die einzigen sauber gemessenen Vorher-Nachher-Zahlen dieses Sommers nicht von einem Anbieter, sondern aus <strong>19 deutschen Kommunen</strong> — während 1.505 befragte Finanzchefs zugeben, unter ROI-Druck zu deployen und sich beim Erklären ihrer Agenten gegenüber Prüfern nur mäßig sicher zu fühlen.</p>\n    <ul>\n      <li><span class=\"chip hot\">DEPLOY · US</span> <strong>Milliarden für die Einführung:</strong> Microsoft steckt <strong>2,5 Mrd. $</strong> und ~<strong>6.000 Fachleute</strong> in eine eigene Deployment-Einheit (02.07.), Amazon <strong>1 Mrd. $</strong>, Anthropic ein <strong>1,5-Mrd.-$</strong>-Joint-Venture, das OpenAI-Umfeld <strong>4 Mrd. $</strong> plus 150 zugekaufte Ingenieure.</li>\n      <li><span class=\"chip\">STUDY · Global</span> <strong>Engpass ist nicht die Technik:</strong> <strong>71 %</strong> der Führungskräfte in Milliarden-Unternehmen nennen <em>organisatorische</em> Reife als Hauptbremse, nur <strong>11 %</strong> die Technologie (PYMNTS Intelligence — Methodik-Flag unten).</li>\n      <li><span class=\"chip good\">DEPLOY · DE · Public</span> <strong>Agentic AI Hub:</strong> 19 Kommunen, 20 Piloten, <strong>70 %</strong> operativ. DSGVO-Auskunft <strong>&gt;90 %</strong> schneller (bis zu <strong>28 Std.</strong> je Vorgang), „Hilfe zur Pflege\" <strong>−45 %</strong> Durchlaufzeit. <em>Bilanz vom 15.06. — nicht taufrisch, aber die belastbarsten Zahlen weit und breit.</em></li>\n      <li><span class=\"chip hot\">STUDY · Finance</span> <strong>Tempo schlägt Kontrolle:</strong> <strong>92 %</strong> von 1.505 Finanzentscheidern spüren Karriere-Druck, KI-ROI zu zeigen, nur <strong>7 %</strong> stellen Governance vor Geschwindigkeit, <strong>44 %</strong> sind nur mäßig zuversichtlich, Agenten-Handlungen Prüfern erklären zu können. Auftragsstudie (Avalara).</li>\n      <li><span class=\"chip\">STUDY · Global</span> <strong>Forrester/FPT</strong> (n=397): nur <strong>26 %</strong> gelten beim Skalieren als „fortgeschritten\" — <strong>35 %</strong> erheben gar keine quantifizierten Kennzahlen, <strong>10 %</strong> messen KI-Ergebnisse in überhaupt keiner Form.</li>\n      <li><span class=\"chip\">MARKT</span> <strong>Gartner:</strong> <strong>234 Mrd. $</strong> Enterprise-Software-Umsatz bis 2030 „gefährdet\" — rund <strong>20 %</strong> der SaaS-Ausgaben. Das Lizenz-pro-Nutzer-Modell bricht, wenn ein Agent die Arbeit von fünf Nutzern macht.</li>\n      <li><span class=\"chip\">REG · EU</span> <strong>Noch acht Tage:</strong> Am <strong>02.08.</strong> greifen GPAI-Pflichten und die Durchsetzungsbefugnisse des AI Office <em>unverändert</em>; die Hochrisiko-Pflichten sind auf <strong>02.12.2027</strong> verschoben.</li>\n      <li><span class=\"chip good\">twiceD</span> Zwei Ideen: ein <strong>Art.-15-Auskunftsagent on-prem</strong> (direkt aus der bestgemessenen Kommunal-Zahl) und ein <strong>SaaS-Lizenz-Röntgen</strong> für die Frage, welche Seats den Agenten überleben.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Light on news today — it's Saturday. So the focus is on the pattern rather than the headline: since May, Microsoft, Amazon, Anthropic, and the OpenAI orbit have made four major moves, pouring billions not into models, but into <strong>deployment staff</strong> — the most recent being Microsoft's Frontier Company from July 2. That's the price tag on a realization: the model hasn't been the problem for a while now — the last mile is. Ironically, the only cleanly measured before-and-after numbers this summer come not from a vendor, but from <strong>19 German municipalities</strong> — while 1,505 surveyed finance chiefs admit to deploying under ROI pressure and feeling only moderately confident about explaining their agents' actions to auditors.</p>\n    <ul>\n      <li><span class=\"chip hot\">DEPLOY · US</span> <strong>Billions for deployment:</strong> Microsoft is putting <strong>$2.5B</strong> and ~<strong>6,000 professionals</strong> into its own deployment unit (Jul 2), Amazon <strong>$1B</strong>, Anthropic a <strong>$1.5B</strong> joint venture, the OpenAI orbit <strong>$4B</strong> plus 150 acquired engineers.</li>\n      <li><span class=\"chip\">STUDY · Global</span> <strong>The bottleneck isn't the tech:</strong> <strong>71%</strong> of executives at billion-dollar companies name organizational maturity as the main brake, only <strong>11%</strong> cite the technology (PYMNTS Intelligence — methodology flag below).</li>\n      <li><span class=\"chip good\">DEPLOY · DE · Public</span> <strong>Agentic AI Hub:</strong> 19 municipalities, 20 pilots, <strong>70%</strong> operational. GDPR access requests <strong>&gt;90%</strong> faster (up to <strong>28 hrs</strong> per case), \"long-term care assistance\" <strong>−45%</strong> turnaround time. <em>Wrap-up from Jun 15 — not brand new, but the most solid numbers around.</em></li>\n      <li><span class=\"chip hot\">STUDY · Finance</span> <strong>Speed beats control:</strong> <strong>92%</strong> of 1,505 finance decision-makers feel career pressure to show AI ROI, only <strong>7%</strong> put governance ahead of speed, <strong>44%</strong> are only moderately confident they could explain their agents' actions to auditors. Commissioned study (Avalara).</li>\n      <li><span class=\"chip\">STUDY · Global</span> <strong>Forrester/FPT</strong> (n=397): only <strong>26%</strong> are rated \"advanced\" at scaling — <strong>35%</strong> collect no quantified metrics at all, <strong>10%</strong> measure AI results in no form whatsoever.</li>\n      <li><span class=\"chip\">MARKET</span> <strong>Gartner:</strong> <strong>$234B</strong> in enterprise software revenue \"at risk\" by 2030 — about <strong>20%</strong> of SaaS spending. The per-user license model breaks when one agent does the work of five users.</li>\n      <li><span class=\"chip\">REG · EU</span> <strong>Eight days left:</strong> on <strong>Aug 2</strong>, GPAI obligations and the AI Office's enforcement powers kick in unchanged; the high-risk obligations are postponed to <strong>Dec 2, 2027</strong>.</li>\n      <li><span class=\"chip good\">twiceD</span> Two ideas: an <strong>on-prem Article 15 access agent</strong> (straight from the best-measured municipal number) and a <strong>SaaS license X-ray</strong> for the question of which seats survive the agent.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Dia de poucas notícias — é sábado. Então o foco vai para o padrão, não para a manchete: desde maio, Microsoft, Amazon, Anthropic e o entorno da OpenAI fizeram quatro grandes movimentos, despejando bilhões não em modelos, mas em <strong>pessoal de implantação</strong> — o mais recente é a Frontier Company da Microsoft, de 02/07. Essa é a etiqueta de preço de uma constatação: o modelo já não é o problema há muito tempo — a última milha é. Ironicamente, os únicos números de antes-e-depois medidos com rigor neste verão não vêm de um fornecedor, mas de <strong>19 municípios alemães</strong> — enquanto 1.505 diretores financeiros entrevistados admitem implantar sob pressão de ROI e se sentir apenas moderadamente confiantes para explicar as ações de seus agentes a auditores.</p>\n    <ul>\n      <li><span class=\"chip hot\">IMPLANTAÇÃO · EUA</span> <strong>Bilhões para a implantação:</strong> a Microsoft investe <strong>US$ 2,5 bi</strong> e ~<strong>6 mil profissionais</strong> em uma unidade própria de implantação (02/07), a Amazon <strong>US$ 1 bi</strong>, a Anthropic uma joint venture de <strong>US$ 1,5 bi</strong>, o entorno da OpenAI <strong>US$ 4 bi</strong> mais 150 engenheiros contratados.</li>\n      <li><span class=\"chip\">ESTUDO · Global</span> <strong>O gargalo não é a tecnologia:</strong> <strong>71 %</strong> dos executivos em empresas bilionárias apontam a maturidade organizacional como o principal freio, só <strong>11 %</strong> citam a tecnologia (PYMNTS Intelligence — alerta de metodologia abaixo).</li>\n      <li><span class=\"chip good\">IMPLANTAÇÃO · DE · Público</span> <strong>Agentic AI Hub:</strong> 19 municípios, 20 pilotos, <strong>70 %</strong> operacionais. Solicitações DSGVO <strong>&gt;90 %</strong> mais rápidas (até <strong>28 h</strong> por processo), \"auxílio para cuidados\" <strong>−45 %</strong> no tempo de tramitação. <em>Balanço de 15/06 — não é notícia fresca, mas são os números mais sólidos que existem por aí.</em></li>\n      <li><span class=\"chip hot\">ESTUDO · Finanças</span> <strong>Velocidade vence controle:</strong> <strong>92 %</strong> de 1.505 tomadores de decisão financeira sentem pressão de carreira para mostrar ROI de IA, só <strong>7 %</strong> colocam governança à frente da velocidade, <strong>44 %</strong> estão apenas moderadamente confiantes de que conseguiriam explicar as ações de seus agentes a auditores. Estudo encomendado (Avalara).</li>\n      <li><span class=\"chip\">ESTUDO · Global</span> <strong>Forrester/FPT</strong> (n=397): só <strong>26 %</strong> são considerados \"avançados\" na escala — <strong>35 %</strong> não coletam nenhuma métrica quantificada, <strong>10 %</strong> não medem os resultados de IA de forma alguma.</li>\n      <li><span class=\"chip\">MERCADO</span> <strong>Gartner:</strong> <strong>US$ 234 bi</strong> em receita de software corporativo \"em risco\" até 2030 — cerca de <strong>20 %</strong> dos gastos com SaaS. O modelo de licença por usuário quebra quando um agente faz o trabalho de cinco usuários.</li>\n      <li><span class=\"chip\">REGULAÇÃO · UE</span> <strong>Ainda faltam oito dias:</strong> em <strong>02/08</strong>, as obrigações GPAI e os poderes de fiscalização do AI Office entram em vigor sem alterações; as obrigações de alto risco foram adiadas para <strong>02/12/2027</strong>.</li>\n      <li><span class=\"chip good\">twiceD</span> Duas ideias: um <strong>agente de acesso ao art. 15 on-prem</strong> (direto do número municipal mais bem medido) e um <strong>raio X de licenças SaaS</strong> para responder quais assentos sobrevivem ao agente.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Poca noticia hoy — es sábado. Así que la mirada se centra en el patrón y no en el titular puntual: desde mayo, Microsoft, Amazon, Anthropic y el entorno de OpenAI hicieron cuatro grandes movimientos, metiendo miles de millones no en modelos, sino en <strong>personal de implementación</strong> — el más reciente es Frontier Company, de Microsoft, del 02/07. Esa es la etiqueta de precio de una constatación: el modelo dejó de ser el problema hace tiempo — la última milla es el problema. Irónicamente, las únicas cifras de antes y después medidas con rigor este verano no vienen de un proveedor, sino de <strong>19 municipios alemanes</strong> — mientras 1.505 directores financieros encuestados admiten desplegar bajo presión de ROI y sentirse solo moderadamente seguros de poder explicarle a los auditores las acciones de sus agentes.</p>\n    <ul>\n      <li><span class=\"chip hot\">DESPLIEGUE · US</span> <strong>Miles de millones para la implementación:</strong> Microsoft destina <strong>$2,5 mil millones</strong> y ~<strong>6.000 profesionales</strong> a su propia unidad de implementación (02/07), Amazon <strong>$1.000 millones</strong>, Anthropic una empresa conjunta de <strong>$1,5 mil millones</strong>, el entorno de OpenAI <strong>$4 mil millones</strong> más 150 ingenieros incorporados por adquisición.</li>\n      <li><span class=\"chip\">ESTUDIO · Global</span> <strong>El cuello de botella no es la tecnología:</strong> el <strong>71 %</strong> de los directivos en empresas multimillonarias señala la madurez organizacional como el principal freno, solo el <strong>11 %</strong> culpa a la tecnología (PYMNTS Intelligence — alerta de metodología más abajo).</li>\n      <li><span class=\"chip good\">DESPLIEGUE · DE · Público</span> <strong>Agentic AI Hub:</strong> 19 municipios, 20 pilotos, <strong>70 %</strong> operativos. Solicitudes DSGVO <strong>&gt;90 %</strong> más rápidas (hasta <strong>28 h</strong> por trámite), \"ayuda de cuidados\" <strong>−45 %</strong> en tiempo de trámite. <em>Balance del 15/06 — no es noticia fresca, pero son las cifras más sólidas que hay.</em></li>\n      <li><span class=\"chip hot\">ESTUDIO · Finanzas</span> <strong>La velocidad le gana al control:</strong> el <strong>92 %</strong> de 1.505 tomadores de decisiones financieras siente presión profesional por mostrar ROI de IA, solo el <strong>7 %</strong> pone la gobernanza antes que la velocidad, el <strong>44 %</strong> solo se siente moderadamente seguro de poder explicarle a los auditores las acciones de sus agentes. Estudio encargado (Avalara).</li>\n      <li><span class=\"chip\">ESTUDIO · Global</span> <strong>Forrester/FPT</strong> (n=397): solo el <strong>26 %</strong> se considera \"avanzado\" al escalar — el <strong>35 %</strong> no recopila ninguna métrica cuantificada, el <strong>10 %</strong> no mide resultados de IA de ninguna forma.</li>\n      <li><span class=\"chip\">MERCADO</span> <strong>Gartner:</strong> <strong>$234 mil millones</strong> en ingresos de software empresarial \"en riesgo\" para 2030 — cerca del <strong>20 %</strong> del gasto en SaaS. El modelo de licencia por usuario se rompe cuando un agente hace el trabajo de cinco usuarios.</li>\n      <li><span class=\"chip\">REGULACIÓN · UE</span> <strong>Aún faltan ocho días:</strong> el <strong>02/08</strong> entran en vigor, sin cambios, las obligaciones GPAI y las facultades de fiscalización de la Oficina de IA; las obligaciones de alto riesgo se posponen al <strong>02/12/2027</strong>.</li>\n      <li><span class=\"chip good\">twiceD</span> Dos ideas: un <strong>agente de acceso al art. 15 on-prem</strong> (directo de la cifra municipal mejor medida) y una <strong>radiografía de licencias SaaS</strong> para responder qué asientos sobreviven al agente.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Zwei belastbare Zahlen zeigen heute in dieselbe Richtung, und es ist nicht die freundliche: freelancermap meldet aus dem eigenen Freelancer-Kompass 2026, dass <strong>49 % der Befragten eine schlechtere Auftragslage als im Vorjahr</strong> berichten — und der Bitkom beziffert die Lücke an IT-Fachkräften in Deutschland auf <strong>109.000</strong> gegenüber <strong>149.000</strong> zwei Jahre zuvor. Beides heißt dasselbe: Die Verhandlungsseite des Auftraggebers ist stärker geworden. Das Board sagt scheinbar das Gegenteil — <strong>121 Listings</strong>, Wochenhoch, 14 neue, kein einziges verschwunden. Nur zählt ein Board Anzeigen, keine Vergaben. Der beste Beleg dafür steht ganz oben: dieselben drei Java-Projekte auf Fit 88 — seit <strong>18 aufeinanderfolgenden Tagen</strong>.</p>\n    <ul>\n      <li><span class=\"chip hot\">Markt</span> <strong>49 % melden eine schlechtere Auftragslage</strong> als im Vorjahr — Zahl von der Kompass-Seite von freelancermap selbst, Befragung 17.11.2025–08.02.2026, rund 5.400 Teilnehmende. Der Durchschnittsstundensatz 2026 steht dort bei <strong>103 €</strong>.</li>\n      <li><span class=\"chip\">DE</span> <strong>Die Fachkräftelücke schrumpft</strong>: Der Bitkom zählt <strong>109.000</strong> unbesetzte IT-Stellen — „deutlich weniger als noch vor zwei Jahren mit 149.000\". Aber: Die Erhebung ist von KW 20–27/2025, veröffentlicht am 07.08.2025 — sie ist rund ein Jahr alt und der aktuellste Bitkom-Wert.</li>\n      <li><span class=\"chip warn\">Quelle</span> <strong>Ein oft zitierter Satz ließ sich heute nicht bestätigen</strong>: Die Aussage, der Durchschnittsstundensatz sei <em>erstmals seit Beginn der Erhebung 2016 gesunken</em>, steht in einer Zusammenfassung Dritter — auf der Kompass-Seite von freelancermap selbst steht sie nicht. Als unbestätigt behandeln.</li>\n      <li><span class=\"chip good\">Board</span> <strong>121 Listings, Wochenhoch</strong>: 94 Freelance, 16 Employee, 11 Intriguing. Median-Fit <strong>70</strong>, 17 Einträge ab 80, 8 ab 85, <strong>107 von 121</strong> mit Remote-Tag. Gegenüber gestern: <strong>14 neu, null verschwunden</strong>.</li>\n      <li><span class=\"chip hot\">twiceD</span> <strong>Die Spitze steht den 18. Tag</strong>: iSAX Consulting (Java 21/Spring Boot 3/Angular/AWS, Frankfurt, 80 % remote), BridgingIT (Spring Boot/Kubernetes/Kafka, 100 % remote) und Keil Business Solutions (Java/Angular mit Telematikinfrastruktur, 100 % remote) halten Fit 88 durchgehend seit dem 08.07.</li>\n      <li><span class=\"chip\">Rate</span> <strong>6 von 121 Listings nennen eine Vergütung selbst</strong> — und nur zwei davon sind Freelance: Right People Group mit <strong>70 €/h</strong> (Angular, München, 100 % remote) und ProTIP mit <strong>680 €/Tag</strong> (≈ 85 €/h, DB-Systel-Umfeld). Alle 90–120-€-Bänder im Board sind recherchierter Benchmark.</li>\n      <li><span class=\"chip\">CH</span> <strong>Die Schweiz-Schwelle ist eine Spitzenband-Schwelle</strong>: Jede heute greifbare Quelle setzt den Zürcher Software-Engineer-Schnitt zwischen <strong>CHF 111.000 und 128.000</strong> im Jahr — unter der CHF-150k-Pflichtschwelle der Employee-Spur. Selbst der Senior-Schnitt (8+ Jahre) liegt mit rund CHF 144.000 darunter.</li>\n      <li><span class=\"chip\">Employee</span> <strong>Neu: ti&amp;m AG Zürich</strong>, Fullstack Java/Angular, Fit <strong>77</strong>, ausgeschrieben am 26.06.2026 — nennt Claude Code, Cursor und GitHub Copilot ausdrücklich als Plus. Vorn bleiben ELCA Zürich (81), Camunda „work from anywhere\" (80) und AXA Zürich/Winterthur (80).</li>\n      <li><span class=\"chip warn\">TED</span> <strong>Heute keine bietbare EU-Ausschreibung</strong>: Der einzige stack-nahe Neufund — die BSI-Ausschreibung zu Prüfanforderungen für agentische KI — hat Angebotsfrist <strong>Montag, 27.07., 16:00</strong>. Zwei Kalendertage sind unter der Fünf-Werktage-Regel dieses Briefs; der Fall wird deshalb nicht als Kandidat geführt.</li>\n      <li><span class=\"chip\">Skills</span> <strong>Stack-Mix über 121 Einträge</strong>: Java 59×, Spring Boot 43×, Angular 37×, AI-Integration 30×, Kubernetes 22×, AWS 19×, Python 19×, Kafka 15×, TypeScript 15×, Kotlin 9×, IoT 8×, Automotive 6×.</li>\n    </ul></div>",

        "en": "<div class=\"tldr\"><p class=\"lead\">Two solid numbers point the same direction today, and it's not the friendly one: freelancermap's own Freelancer Compass 2026 reports that <strong>49% of respondents describe a weaker order situation</strong> than a year ago — and Bitkom puts Germany's IT-talent gap at <strong>109,000</strong>, down from <strong>149,000</strong> two years earlier. Both say the same thing: the client's side of the negotiating table has gotten stronger. The board seems to say the opposite — <strong>121 listings</strong>, a weekly high, 14 new, none gone. But a board counts postings, not awards. The clearest proof sits right at the top: the same three Java projects at Fit 88 — for <strong>18 straight days</strong>.</p>\n    <ul>\n      <li><span class=\"chip hot\">Market</span> <strong>49% report a weaker order situation</strong> than a year ago — the figure comes straight from freelancermap's own Compass page, survey Nov 17, 2025–Feb 8, 2026, roughly 5,400 respondents. The average hourly rate for 2026 listed there is €103.</li>\n      <li><span class=\"chip\">DE</span> <strong>The talent gap is shrinking</strong>: Bitkom counts 109,000 unfilled IT positions — \"significantly fewer than two years ago, when it was 149,000.\" But the survey dates to weeks 20–27 of 2025, published Aug 7, 2025 — roughly a year old, and still Bitkom's most current figure.</li>\n      <li><span class=\"chip warn\">Source</span> <strong>One frequently cited line couldn't be confirmed today</strong>: the claim that the average hourly rate fell for the first time since the survey began in 2016 appears in a third-party summary — it's not on freelancermap's own Compass page. Treat as unconfirmed.</li>\n      <li><span class=\"chip good\">Board</span> <strong>121 listings, a weekly high</strong>: 94 freelance, 16 employee, 11 intriguing. Median fit <strong>70</strong>, 17 entries at 80+, 8 at 85+, <strong>107 of 121</strong> tagged remote. Versus yesterday: <strong>14 new, none gone</strong>.</li>\n      <li><span class=\"chip hot\">twiceD</span> <strong>The lead holds for an 18th day</strong>: iSAX Consulting (Java 21/Spring Boot 3/Angular/AWS, Frankfurt, 80% remote), BridgingIT (Spring Boot/Kubernetes/Kafka, 100% remote) and Keil Business Solutions (Java/Angular with telematics infrastructure, 100% remote) have held Fit 88 without a break since Jul 8.</li>\n      <li><span class=\"chip\">Rate</span> <strong>6 of 121 listings actually state a rate</strong> — and only two of those are freelance: Right People Group at <strong>€70/h</strong> (Angular, Munich, 100% remote) and ProTIP at <strong>€680/day</strong> (≈ €85/h, DB Systel environment). Every €90–120 band on the board is a researched benchmark.</li>\n      <li><span class=\"chip\">CH</span> <strong>The Switzerland threshold is a top-band threshold</strong>: every source available today puts the Zurich software-engineer average between <strong>CHF 111,000 and 128,000</strong> a year — below the CHF 150k mandatory floor for the employee lane. Even the senior average (8+ years) lands below it, at roughly CHF 144,000.</li>\n      <li><span class=\"chip\">Employee</span> <strong>New: ti&amp;m AG Zurich</strong>, full-stack Java/Angular, Fit <strong>77</strong>, posted Jun 26, 2026 — explicitly lists Claude Code, Cursor and GitHub Copilot as a plus. Still leading: ELCA Zurich (81), Camunda \"work from anywhere\" (80) and AXA Zurich/Winterthur (80).</li>\n      <li><span class=\"chip warn\">TED</span> <strong>No biddable EU tender today</strong>: the only stack-relevant new find — BSI's tender for testing requirements for agentic AI — has a bid deadline of <strong>Monday, Jul 27, 16:00</strong>. Two calendar days fall short of this brief's five-business-day rule, so the case isn't tracked as a candidate.</li>\n      <li><span class=\"chip\">Skills</span> <strong>Stack mix across 121 entries</strong>: Java 59×, Spring Boot 43×, Angular 37×, AI Integration 30×, Kubernetes 22×, AWS 19×, Python 19×, Kafka 15×, TypeScript 15×, Kotlin 9×, IoT 8×, Automotive 6×.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Duas cifras sólidas apontam hoje na mesma direção, e não é a direção amigável: a própria freelancermap informa, no seu Freelancer-Kompass 2026, que <strong>49% dos entrevistados relatam uma carteira de pedidos pior</strong> do que no ano anterior — e o Bitkom calcula a lacuna de profissionais de TI na Alemanha em <strong>109.000</strong> contra <strong>149.000</strong> dois anos antes. As duas coisas dizem o mesmo: o lado do contratante ficou mais forte na negociação. O board parece dizer o contrário — <strong>121 vagas</strong>, máxima da semana, 14 novas, nenhuma desaparecida. Só que um board conta anúncios, não contratos fechados. A prova mais clara está bem no topo: os mesmos três projetos Java com fit 88 — há <strong>18 dias seguidos</strong>.</p>\n    <ul>\n      <li><span class=\"chip hot\">Mercado</span> <strong>49% relatam uma carteira de pedidos pior</strong> do que no ano anterior — número que vem direto da própria página do Kompass da freelancermap, pesquisa entre 17/11/2025 e 08/02/2026, cerca de 5.400 participantes. A taxa horária média de 2026 informada ali é de 103 €.</li>\n      <li><span class=\"chip\">DE</span> <strong>A lacuna de mão de obra está encolhendo</strong>: o Bitkom conta 109.000 vagas de TI não preenchidas — \"bem menos do que há dois anos, quando eram 149.000\". Mas: o levantamento é das semanas 20–27 de 2025, publicado em 07/08/2025 — tem cerca de um ano e é o valor mais recente do Bitkom.</li>\n      <li><span class=\"chip warn\">Fonte</span> <strong>Uma frase frequentemente citada não pôde ser confirmada hoje</strong>: a afirmação de que a taxa horária média teria caído pela primeira vez desde o início do levantamento em 2016 aparece em um resumo de terceiros — não está na própria página do Kompass da freelancermap. Tratar como não confirmada.</li>\n      <li><span class=\"chip good\">Board</span> <strong>121 vagas, máxima da semana</strong>: 94 Freelance, 16 Employee, 11 Intriguing. Fit mediano <strong>70</strong>, 17 vagas a partir de 80, 8 a partir de 85, <strong>107 das 121</strong> com marcação Remote. Em relação a ontem: <strong>14 novas, nenhuma desaparecida</strong>.</li>\n      <li><span class=\"chip hot\">twiceD</span> <strong>O topo se mantém pelo 18º dia</strong>: iSAX Consulting (Java 21/Spring Boot 3/Angular/AWS, Frankfurt, 80% remoto), BridgingIT (Spring Boot/Kubernetes/Kafka, 100% remoto) e Keil Business Solutions (Java/Angular com infraestrutura de telemática, 100% remoto) mantêm fit 88 sem interrupção desde 08/07.</li>\n      <li><span class=\"chip\">Taxa</span> <strong>6 das 121 vagas informam uma remuneração</strong> — e só duas delas são freelance: Right People Group com <strong>70 €/h</strong> (Angular, Munique, 100% remoto) e ProTIP com <strong>680 €/dia</strong> (≈ 85 €/h, ambiente DB Systel). Todas as faixas de 90–120 € no board são benchmark pesquisado.</li>\n      <li><span class=\"chip\">CH</span> <strong>O limiar da Suíça é um limiar de topo de faixa</strong>: toda fonte disponível hoje coloca a média de engenheiro de software em Zurique entre <strong>CHF 111.000 e 128.000</strong> por ano — abaixo do piso obrigatório de CHF 150 mil da trilha Employee. Até a média sênior (8+ anos) fica abaixo, em cerca de CHF 144.000.</li>\n      <li><span class=\"chip\">Employee</span> <strong>Nova: ti&amp;m AG Zurique</strong>, Fullstack Java/Angular, fit <strong>77</strong>, publicada em 26/06/2026 — cita Claude Code, Cursor e GitHub Copilot explicitamente como diferencial. Seguem à frente: ELCA Zurique (81), Camunda \"work from anywhere\" (80) e AXA Zurique/Winterthur (80).</li>\n      <li><span class=\"chip warn\">TED</span> <strong>Hoje, nenhuma licitação da UE dá para disputar</strong>: o único achado novo próximo ao stack — a licitação do BSI sobre requisitos de teste para IA agêntica — tem prazo <strong>segunda, 27/07, às 16h</strong>. Dois dias de calendário ficam abaixo da regra de cinco dias úteis deste briefing; o caso, por isso, não entra como candidato.</li>\n      <li><span class=\"chip\">Skills</span> <strong>Mix de stack em 121 vagas</strong>: Java 59×, Spring Boot 43×, Angular 37×, AI-Integration 30×, Kubernetes 22×, AWS 19×, Python 19×, Kafka 15×, TypeScript 15×, Kotlin 9×, IoT 8×, Automotive 6×.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Dos cifras sólidas apuntan hoy en la misma dirección, y no es la amigable: la propia freelancermap informa, en su Freelancer-Kompass 2026, que <strong>49 % de los encuestados reporta una cartera de proyectos peor</strong> que hace un año — y el Bitkom calcula la brecha de profesionales de TI en Alemania en <strong>109.000</strong>, frente a <strong>149.000</strong> dos años antes. Ambas cosas dicen lo mismo: el lado del cliente se volvió más fuerte en la negociación. El board parece decir lo contrario — <strong>121 vacantes</strong>, máximo semanal, 14 nuevas, ninguna desaparecida. Solo que un board cuenta anuncios, no contratos cerrados. La prueba más clara está hasta arriba: los mismos tres proyectos de Java con fit 88 — desde hace <strong>18 días seguidos</strong>.</p>\n    <ul>\n      <li><span class=\"chip hot\">Mercado</span> <strong>49 % reporta una cartera de proyectos peor</strong> que hace un año — la cifra viene directo de la propia página del Kompass de freelancermap, encuesta del 17/11/2025 al 08/02/2026, unos 5.400 participantes. La tarifa por hora promedio de 2026 que ahí se reporta es de 103 €.</li>\n      <li><span class=\"chip\">DE</span> <strong>La brecha de talento se está reduciendo</strong>: el Bitkom cuenta 109.000 vacantes de TI sin cubrir — \"bastante menos que hace dos años, cuando eran 149.000\". Pero: el levantamiento es de las semanas 20–27 de 2025, publicado el 07/08/2025 — tiene alrededor de un año y es el dato más reciente del Bitkom.</li>\n      <li><span class=\"chip warn\">Fuente</span> <strong>Una frase muy citada no pudo confirmarse hoy</strong>: la afirmación de que la tarifa horaria promedio habría bajado por primera vez desde que empezó el levantamiento en 2016 aparece en un resumen de terceros — no está en la propia página del Kompass de freelancermap. Tratar como no confirmada.</li>\n      <li><span class=\"chip good\">Board</span> <strong>121 vacantes, máximo semanal</strong>: 94 Freelance, 16 Employee, 11 Intriguing. Fit mediano <strong>70</strong>, 17 entradas con 80 o más, 8 con 85 o más, <strong>107 de 121</strong> con etiqueta Remote. Frente a ayer: <strong>14 nuevas, ninguna desaparecida</strong>.</li>\n      <li><span class=\"chip hot\">twiceD</span> <strong>La punta se mantiene el día 18</strong>: iSAX Consulting (Java 21/Spring Boot 3/Angular/AWS, Fráncfort, 80 % remoto), BridgingIT (Spring Boot/Kubernetes/Kafka, 100 % remoto) y Keil Business Solutions (Java/Angular con infraestructura de telemática, 100 % remoto) mantienen fit 88 sin interrupción desde el 08/07.</li>\n      <li><span class=\"chip\">Tarifa</span> <strong>6 de 121 vacantes sí publican una tarifa</strong> — y solo dos de ellas son freelance: Right People Group con <strong>70 €/h</strong> (Angular, Múnich, 100 % remoto) y ProTIP con <strong>680 €/día</strong> (≈ 85 €/h, entorno DB Systel). Todas las bandas de 90–120 € en el board son benchmark investigado.</li>\n      <li><span class=\"chip\">CH</span> <strong>El umbral de Suiza es un umbral de banda alta</strong>: cada fuente disponible hoy ubica el promedio de ingeniero de software en Zúrich entre <strong>CHF 111.000 y 128.000</strong> al año — por debajo del piso obligatorio de CHF 150 mil de la vía Employee. Incluso el promedio senior (8+ años) queda por debajo, en unos CHF 144.000.</li>\n      <li><span class=\"chip\">Employee</span> <strong>Nueva: ti&amp;m AG Zúrich</strong>, Fullstack Java/Angular, fit <strong>77</strong>, publicada el 26/06/2026 — menciona Claude Code, Cursor y GitHub Copilot explícitamente como un plus. Siguen a la cabeza: ELCA Zúrich (81), Camunda \"work from anywhere\" (80) y AXA Zúrich/Winterthur (80).</li>\n      <li><span class=\"chip warn\">TED</span> <strong>Hoy no hay ninguna licitación de la UE que se pueda ofertar</strong>: el único hallazgo nuevo cercano al stack — la licitación del BSI sobre requisitos de prueba para IA agéntica — tiene plazo el <strong>lunes 27/07, a las 16:00</strong>. Dos días de calendario quedan por debajo de la regla de cinco días hábiles de este boletín; por eso el caso no se lleva como candidato.</li>\n      <li><span class=\"chip\">Skills</span> <strong>Mezcla de stack en 121 entradas</strong>: Java 59×, Spring Boot 43×, Angular 37×, AI-Integration 30×, Kubernetes 22×, AWS 19×, Python 19×, Kafka 15×, TypeScript 15×, Kotlin 9×, IoT 8×, Automotive 6×.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Es ist Samstag, der 25. Juli — das <em>letzte</em> freie Wochenende, denn am Montag klingelt wieder die Schulglocke. Und diesmal steht im Radar etwas Belegtes: In Londrina läuft Samstag und Sonntag das <strong>Festival DOBRA</strong> — 85 Aussteller, Kindershows, offene Druckwerkstätten, Eintritt bis 18 Uhr frei, keine 110 km entfernt. Dazu zieht der Regen ab: heute noch Schauer, morgen 25 Grad und trocken. Bei der Gesundheit ist die Nachricht zweigeteilt — die RSV-Fälle bei den Allerkleinsten in Paraná sind um 81,1 % eingebrochen, der Landes-Alarm für schwere Atemwegsinfekte gilt aber weiter. Beides stimmt. Entwarnung ist es trotzdem keine.</p>\n    <ul>\n      <li><span class=\"chip good\">EVENT</span> <strong>Festival DOBRA, Londrina</strong>: Feira de Arte Impressa mit 85 Ausstellern, Sa 25. + So 26.07. in der Funcart (R. Senador Souza Naves 2.380). <strong>Gratis bis 18 Uhr</strong>, danach R$ 15. Kindershows und freie Druck-Praktiken 15–18 Uhr.</li>\n      <li><span class=\"chip good\">WETTER</span> <strong>Heute 22°/14°</strong> bei 61 % Regen und 2,4 mm — Schauer tagsüber, abends trocken. <strong>Morgen 25°/16°, 0 mm</strong>, Sonne nach Frühnebel. Der Sonntag ist der Ausflugstag.</li>\n      <li><span class=\"chip\">SCHULE</span> <span class=\"update-since\">Update seit gestern</span> <strong>Schulstart Montag, 27.07.</strong> — heute wieder direkt am amtlichen SEED-Schulkalender 2026 belegt (Recesso 13.–26.07.), nachdem die Landesquelle gestern mit 404 antwortete.</li>\n      <li><span class=\"chip good\">GESUNDHEIT</span> <strong>−81,1 % RSV-bedingte schwere Atemwegsfälle bei Säuglingen unter 6 Monaten</strong> in Paraná — die SESA führt das auf die seit Dezember 2025 laufende RSV-Impfung zurück (Stand 16.07.2026).</li>\n      <li><span class=\"chip hot\">ABER</span> <strong>Paraná bleibt auf Alarm-Niveau</strong>: Fiocruz zählt den Bundesstaat zu fünf mit SRAG-Inzidenz in Alarm-/Risiko-Lage <em>und</em> Langfrist-Wachstumssignal (InfoGripe SE 27/2026, 05.–11.07.). Kein Freibrief für volle Innenräume.</li>\n      <li><span class=\"chip\">DENGUE</span> <strong>Informe nº 23 (21.07.2026) gelistet, Zahlen nur im PDF.</strong> Letzter voll belegter Stand bleibt SE 1–14/2026: 2.028 Fälle, 1 Todesfall — −96,1 % bzw. −98,8 % gegenüber 2025.</li>\n      <li><span class=\"chip hot\">FALLE</span> <strong>Achtung bei Dengue-Schlagzeilen</strong>: Die kursierende Zahl „4.549 neue Fälle\" stammt aus dem <em>epidemiologischen Jahr 2025</em>, nicht aus dieser Saison. Nicht verwechseln.</li>\n      <li><span class=\"chip\">SP-RANGE</span> <strong>Fünf gratis Familien-Termine im Großraum São Paulo</strong> an genau diesem Wochenende — Festival do Milho, São João de Nóis Tudim, Feira do Bem, Quermesse und die Ruth-Rocha-Ausstellung. Nur mit 4–6 h Anfahrt.</li>\n      <li><span class=\"chip\">LÜCKE</span> <strong>Kern- und Day-Trip-Ring bleiben leer</strong> — kein datierter Termin belegbar. Prefeitura-Nachrichten stehen weiter auf dem 12.05.2026, das Regionalportal antwortet mit HTTP 403.</li>\n    </ul></div>",

> Langfrist-Wachstumssignal (InfoGripe SE 27/2026, 05.–11.07.). Kein Freibrief für volle Innenräume.</li>\n      <li><span class=\"chip\">DENGUE</span> <strong>Informe nº 23 (21.07.2026) gelistet, Zahlen nur im PDF.</strong> Letzter voll belegter Stand bleibt SE 1–14/2026: 2.028 Fälle, 1 Todesfall — −96,1 % bzw. −98,8 % gegenüber 2025.</li>\n      <li><span class=\"chip hot\">FALLE</span> <strong>Achtung bei Dengue-Schlagzeilen</strong>: Die kursierende Zahl „4.549 neue Fälle\" stammt aus dem <em>epidemiologischen Jahr 2025</em>, nicht aus dieser Saison. Nicht verwechseln.</li>\n      <li><span class=\"chip\">SP-RANGE</span> <strong>Fünf gratis Familien-Termine im Großraum São Paulo</strong> an genau diesem Wochenende — Festival do Milho, São João de Nóis Tudim, Feira do Bem, Quermesse und die Ruth-Rocha-Ausstellung. Nur mit 4–6 h Anfahrt.</li>\n      <li><span class=\"chip\">LÜCKE</span> <strong>Kern- und Day-Trip-Ring bleiben leer</strong> — kein datierter Termin belegbar. Prefeitura-Nachrichten stehen weiter auf dem 12.05.2026, das Regionalportal antwortet mit HTTP 403.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">It's Saturday, July 25 — the <em>last</em> free weekend, since the school bell rings again on Monday. And this time the radar has something concrete: in Londrina, the <strong>DOBRA Festival</strong> runs Saturday and Sunday — 85 exhibitors, kids' shows, open printmaking workshops, free admission until 6 PM, less than 110 km away. On top of that the rain clears out: still showers today, tomorrow 25 degrees and dry. On health, the news is split — RSV cases among the very youngest in Paraná have dropped 81.1%, but the state alarm for severe respiratory infections still stands. Both are true. It's not the all-clear either way.</p>\n    <ul>\n      <li><span class=\"chip good\">EVENT</span> <strong>DOBRA Festival, Londrina</strong>: Feira de Arte Impressa with 85 exhibitors, Sat 07/25 + Sun 07/26 at Funcart (R. Senador Souza Naves 2,380). <strong>Free until 6 PM</strong>, then R$ 15. Kids' shows and free printmaking sessions 3–6 PM.</li>\n      <li><span class=\"chip good\">WEATHER</span> <strong>Today 22°/14°</strong> with 61% rain and 2.4 mm — showers during the day, dry by evening. <strong>Tomorrow 25°/16°, 0 mm</strong>, sun after early fog. Sunday is the outing day.</li>\n      <li><span class=\"chip\">SCHOOL</span> <span class=\"update-since\">Update since yesterday</span> <strong>School starts Monday, 07/27</strong> — today confirmed again directly against the official SEED 2026 school calendar (recesso 07/13–26), after the state source returned a 404 yesterday.</li>\n      <li><span class=\"chip good\">HEALTH</span> <strong>−81.1% RSV-driven severe respiratory cases among infants under 6 months</strong> in Paraná — SESA attributes this to the RSV immunization program running since December 2025 (as of 07/16/2026).</li>\n      <li><span class=\"chip hot\">BUT</span> <strong>Paraná stays at alarm level</strong>: Fiocruz counts the state among five with SARI incidence at alarm/risk level <em>and</em> a longer-term growth signal (InfoGripe epi-week 27/2026, 07/05–11). No free pass for crowded indoor spaces.</li>\n      <li><span class=\"chip\">DENGUE</span> <strong>Informe no. 23 (07/21/2026) listed, figures PDF-only.</strong> Last fully documented status remains epi-weeks 1–14/2026: 2,028 cases, 1 death — down 96.1% and 98.8% versus 2025.</li>\n      <li><span class=\"chip hot\">TRAP</span> <strong>Watch out for dengue headlines</strong>: the circulating figure \"4,549 new cases\" comes from the <em>2025 epidemiological year</em>, not this season. Don't mix them up.</li>\n      <li><span class=\"chip\">SP RING</span> <strong>Five free family events across greater São Paulo</strong> this exact weekend — Festival do Milho, São João de Nóis Tudim, Feira do Bem, Quermesse, and the Ruth Rocha exhibition. Only with a 4–6 hour drive.</li>\n      <li><span class=\"chip\">GAP</span> <strong>Core and day-trip ring stay empty</strong> — no dated event documented. City-hall news still sits on 05/12/2026, the regional portal returns HTTP 403.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Hoje é sábado, 25 de julho — o <em>último</em> fim de semana livre, porque na segunda-feira o sinal da escola volta a tocar. E desta vez tem algo concreto no radar: em Londrina acontece sábado e domingo o <strong>Festival DOBRA</strong> — 85 expositores, atrações infantis, oficinas de gravura abertas, entrada franca até as 18h, a menos de 110 km daqui. Além disso, a chuva vai embora: hoje ainda tem pancadas, amanhã 25 graus e seco. Na saúde, a notícia é dividida — os casos de VSR entre os bebês mais novos no Paraná caíram 81,1%, mas o alerta estadual para infecções respiratórias graves continua valendo. As duas coisas são verdade. Ainda assim, não é sinal verde total.</p>\n    <ul>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Festival DOBRA, Londrina</strong>: Feira de Arte Impressa com 85 expositores, sáb 25/07 + dom 26/07, na Funcart (R. Senador Souza Naves, 2.380). <strong>Grátis até as 18h</strong>, depois R$ 15. Atrações infantis e oficinas de gravura livre das 15h às 18h.</li>\n      <li><span class=\"chip good\">CLIMA</span> <strong>Hoje 22°/14°</strong> com 61% de chance de chuva e 2,4 mm — pancadas durante o dia, seco à noite. <strong>Amanhã 25°/16°, 0 mm</strong>, sol depois de neblina de manhã cedo. O domingo é o dia do passeio.</li>\n      <li><span class=\"chip\">ESCOLA</span> <span class=\"update-since\">Atualização desde ontem</span> <strong>Volta às aulas na segunda, 27/07</strong> — hoje confirmado de novo diretamente no calendário escolar oficial do SEED 2026 (recesso de 13 a 26/07), depois que a fonte estadual respondeu com erro 404 ontem.</li>\n      <li><span class=\"chip good\">SAÚDE</span> <strong>−81,1% nos casos graves de doença respiratória causados por VSR em bebês com menos de 6 meses</strong> no Paraná — a SESA atribui isso à campanha de imunização contra o VSR em vigor desde dezembro de 2025 (dado de 16/07/2026).</li>\n      <li><span class=\"chip hot\">MAS</span> <strong>O Paraná continua em nível de alerta</strong>: a Fiocruz coloca o estado entre os cinco com incidência de SRAG em nível de alerta/risco <em>e</em> sinal de crescimento de longo prazo (InfoGripe SE 27/2026, 05 a 11/07). Não é carta branca para ambientes fechados e lotados.</li>\n      <li><span class=\"chip\">DENGUE</span> <strong>Informe nº 23 (21/07/2026) listado, números só no PDF.</strong> O último dado totalmente confirmado continua sendo SE 1–14/2026: 2.028 casos, 1 óbito — queda de 96,1% e 98,8% em relação a 2025.</li>\n      <li><span class=\"chip hot\">ARMADILHA</span> <strong>Cuidado com manchetes sobre dengue</strong>: o número que circula, \"4.549 novos casos\", é do <em>ano epidemiológico de 2025</em>, não desta temporada. Não confunda.</li>\n      <li><span class=\"chip\">ANEL SP</span> <strong>Cinco compromissos gratuitos para a família na Grande São Paulo</strong> justamente neste fim de semana — Festival do Milho, São João de Nóis Tudim, Feira do Bem, Quermesse e a exposição de Ruth Rocha. Só que com 4 a 6h de viagem.</li>\n      <li><span class=\"chip\">LACUNA</span> <strong>Anel central e de passeio de um dia continuam vazios</strong> — nenhum compromisso com data confirmado. As notícias da prefeitura seguem paradas em 12/05/2026, o portal regional responde com erro HTTP 403.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Hoy es sábado 25 de julio, el <em>último</em> fin de semana libre, porque el lunes vuelve a sonar la campana de la escuela. Y esta vez sí hay algo concreto en el radar: en Londrina se lleva a cabo sábado y domingo el <strong>Festival DOBRA</strong> — 85 expositores, funciones para niños, talleres de grabado abiertos, entrada libre hasta las 18:00, a menos de 110 km de distancia. Además, la lluvia se retira: hoy todavía hay chubascos, mañana 25 grados y seco. En cuanto a salud, la noticia está dividida — los casos de VSR entre los bebés más pequeños en Paraná cayeron 81,1%, pero la alerta estatal por infecciones respiratorias graves sigue vigente. Las dos cosas son ciertas. Aun así, no es una luz verde total.</p>\n    <ul>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Festival DOBRA, Londrina</strong>: Feira de Arte Impressa con 85 expositores, sáb 25/07 + dom 26/07, en Funcart (R. Senador Souza Naves, 2.380). <strong>Gratis hasta las 18:00</strong>, después R$ 15. Funciones para niños y talleres de grabado libre de 15:00 a 18:00.</li>\n      <li><span class=\"chip good\">CLIMA</span> <strong>Hoy 22°/14°</strong> con 61% de probabilidad de lluvia y 2,4 mm — chubascos durante el día, seco por la noche. <strong>Mañana 25°/16°, 0 mm</strong>, sol después de neblina matutina. El domingo es el día para salir.</li>\n      <li><span class=\"chip\">ESCUELA</span> <span class=\"update-since\">Actualización desde ayer</span> <strong>Inicio de clases el lunes 27/07</strong> — hoy confirmado de nuevo directamente en el calendario escolar oficial del SEED 2026 (receso del 13 al 26/07), después de que la fuente estatal respondiera con error 404 ayer.</li>\n      <li><span class=\"chip good\">SALUD</span> <strong>−81,1% en los casos respiratorios graves causados por VSR en bebés menores de 6 meses</strong> en Paraná — la SESA lo atribuye a la campaña de inmunización contra el VSR vigente desde diciembre de 2025 (dato del 16/07/2026).</li>\n      <li><span class=\"chip hot\">PERO</span> <strong>Paraná se mantiene en nivel de alerta</strong>: la Fiocruz coloca al estado entre los cinco con incidencia de SRAG en nivel de alerta/riesgo <em>y</em> señal de crecimiento a largo plazo (InfoGripe SE 27/2026, 05 al 11/07). No es un pase libre para los espacios cerrados y llenos.</li>\n      <li><span class=\"chip\">DENGUE</span> <strong>Informe nº 23 (21/07/2026) listado, cifras solo en el PDF.</strong> El último dato totalmente confirmado sigue siendo SE 1–14/2026: 2.028 casos, 1 muerte — una baja de 96,1% y 98,8% frente a 2025.</li>\n      <li><span class=\"chip hot\">TRAMPA</span> <strong>Cuidado con los titulares sobre dengue</strong>: la cifra que circula, «4.549 casos nuevos», es del <em>año epidemiológico 2025</em>, no de esta temporada. No hay que confundirlas.</li>\n      <li><span class=\"chip\">ANILLO SP</span> <strong>Cinco actividades familiares gratuitas en la zona metropolitana de São Paulo</strong> justo este fin de semana — Festival do Milho, São João de Nóis Tudim, Feira do Bem, Quermesse y la exposición de Ruth Rocha. Solo que con 4 a 6 horas de camino.</li>\n      <li><span class=\"chip\">VACÍO</span> <strong>El anillo central y el de excursiones siguen vacíos</strong> — no se pudo confirmar ningún evento con fecha. Las noticias de la alcaldía siguen ancladas en el 12/05/2026, el portal regional responde con error HTTP 403.</li>\n    </ul></div>"
      }

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Samstag, der 25. Juli — Wochenthema <em>Essen, Kochen, Restaurant</em>, und zwar dort, wo das Essen anfängt: auf dem Wochenmarkt. Nicht Straßenküche (die war am 18.07.), nicht die eigene Küche (04.07.), sondern die <em>feira livre</em> am Samstagmorgen: handeln, wiegen, bezahlen, und vor allem beurteilen, ob die Ware reif oder schon hinüber ist. Ein Wort trägt heute den ganzen Tag: <strong><em>a feira</em></strong>. Es meint den Gemüsemarkt <em>und</em> die Messe — der Familien-Brief von heute schickt die Familie zur <em>Feira de Arte Impressa</em> nach Londrina, und das ist lexikalisch exakt dasselbe Wort wie der Stand mit den Mangos. <strong>11 Einträge, davon 3 Verben mit voller Konjugation</strong>, plus 3 Auffrischungen (<em>günstig / erschwinglich</em> vom 27.06., <em>der Pix</em> vom 29.06., <em>die Küchenwaage</em> vom 04.07.). Dazu der lehrreichste Fund des Tages: ein brasilianisches Alltagsverb, das im portugiesischen Wörterbuch in genau dieser Bedeutung gar nicht steht.</p>\n    <ul>\n      <li><span class=\"chip hot\">FALSE FRIEND</span> <strong>a receita ≠ EN <em>receipt</em></strong> — <em>receita</em> ist das Koch-Rezept, das ärztliche Rezept und die Einnahme (deshalb heißt die brasilianische Steuerbehörde <em>Receita Federal</em>, wörtlich „Bundes-Einnahmen\"). Der Kassenbeleg dagegen ist <em>o recibo</em>. Wer im Laden nach „a receita\" fragt, bekommt bestenfalls ein Kochrezept — im Spanischen läuft dieselbe Falle über <em>la receta</em> ↔ <em>el recibo</em>.</li>\n      <li><span class=\"chip\">BR-PT</span> <strong>pechinchar — das Wort, das im Wörterbuch fehlt</strong> — in Brasilien heißt Feilschen <em>pechinchar</em>. Der Priberam-Eintrag zu <em>pechinchar</em> (portugiesische Lexikografie) listet diese Bedeutung überhaupt nicht, sondern nur „unerwartet gewinnen\", „profitieren\", „unvorhergesehene Vorteile bekommen\". Rückendeckung gibt derselbe Verlag an anderer Stelle: unter <em>barganhar</em> steht Bedeutung 3 „Pedir para baixar o preço\" mit den Synonymen <em>PECHINCHAR, REGATEAR</em>. <span class=\"src\"><a href=\"https://dicionario.priberam.org/barganhar\">priberam.org</a> · <a href=\"https://dicionario.priberam.org/pechinchar\">pechinchar</a></span></li>\n      <li><span class=\"chip\">BR-PT</span> <strong>o hortifrúti</strong> — ein Kofferwort aus <em>horticultura</em> + <em>fruticultura</em>, das Deutsch nur mit einem Bandwurm („Obst- und Gemüsestand\") übersetzen kann. Priberam: <em>„Cada um dos produtos provenientes da horticultura, da fruticultura ou das granjas, isto é, frutas, hortaliças e legumes.\"</em> <span class=\"src\"><a href=\"https://dicionario.priberam.org/hortifr%C3%BAti\">priberam.org</a></span></li>\n      <li><span class=\"chip\">BR-PT</span> <strong>el tianguis (ES-MX) ↔ a feira livre (PT-BR)</strong> — Mexiko hat für denselben fliegenden Straßenmarkt ein Wort aus dem Nahuatl: <em>tianguis</em>, von <em>tianquiztli</em>. Im Norden Mexikos heißt er auch <em>mercado sobre ruedas</em>, „Markt auf Rädern\". Zwei Länder, zwei Wörter, ein Samstagmorgen. <span class=\"src\"><a href=\"https://es.hispanopedia.com/wiki/Tianguis\">hispanopedia.com</a></span></li>\n      <li><span class=\"chip\">KONJUGATION</span> <strong>eu amadureço, que ela amadureça</strong> — <em>amadurecer</em> (reifen) schreibt vor <em>o</em> und <em>a</em> ein <em>ç</em>, sonst würde aus dem weichen /s/ ein hartes /k/. Gleiche Familie wie <em>conhecer → conheço</em>. Und im Spanischen macht <em>regatear</em> etwas Ähnliches mit Vokalen: <em>yo regateé</em> im Indefinido und <em>que yo regatee</em> im Subjuntivo — beide mit doppeltem <em>e</em>.</li>\n      <li><span class=\"chip good\">GENUS</span> <strong>a colher (Löffel) vs. colher (ernten)</strong> — gleiche Schreibung, verschiedene Wortart, verschiedene Aussprache: das Substantiv <em>a colher</em> hat ein offenes <em>e</em>, das Verb <em>colher</em> ein geschlossenes. Ein Homograph mit unterschiedlichem Klang — auf Portugiesisch <em>homógrafo heterofônico</em>. Auf dem Markt <em>colhe</em> man, am Tisch benutzt man <em>a colher</em>.</li>\n      <li><span class=\"chip good\">IDIOM</span> <strong>trocar seis por meia dúzia</strong> — „sechs gegen ein halbes Dutzend tauschen\", also: macht keinen Unterschied. Das Englische hat exakt dasselbe Bild (<em>six of one, half a dozen of the other</em>), das Deutsche ein völlig anderes: <em>gehupft wie gesprungen</em>. Herkunft laut Dicionário inFormal: der alte Handel, in dem verschiedene Maßeinheiten dieselbe Menge bezeichneten. <span class=\"src\"><a href=\"https://www.dicionarioinformal.com.br/significado/trocar+seis+por+meia+d%FAzia/10046/\">dicionarioinformal.com.br</a></span></li>\n    </ul></div>",
