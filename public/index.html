<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daniels Morning Briefs</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="lib/tokens.css">
<script>
  // Pre-paint animation policy (mirrors the terminal core / pagr): an explicit
  // "off" in localStorage — or no pick while the OS prefers reduced motion —
  // marks html.anim-off so components.css kills keyframes (incl. the brand
  // cursor blink) with no flash. The footer anim toggle persists "on"/"off".
  (function () {
    let pref = null;
    try { pref = localStorage.getItem('anim'); } catch (_) {}
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (pref === 'off' || (pref === null && reduced)) {
      document.documentElement.classList.add('anim-off');
    }
  })();
  // Resolution-independent zoom (mirrors pagr): lay out at a 1920px reference, then
  // scale the whole view up on wider screens — a true zoom of everything, never below
  // 1×. Pre-paint to avoid a flash.
  (function () {
    var applyZoom = function () {
      document.documentElement.style.zoom = String(Math.max(1, window.innerWidth / 1920));
    };
    applyZoom();
    window.addEventListener('resize', applyZoom);
  })();
</script>
<style>
  /* Dashboard chrome styles. Design tokens (colours, shadow, typography vars)
     come from lib/tokens.css — keep them there so the dashboard and the
     newsletter content stay in sync. */
  * { box-sizing: border-box; }
  /* Lock the outer document — only inner scroll containers (the .home view
     and the iframe) handle scrolling. Without this, a tiny mismatch between
     header.app + .app-shell heights and 100vh adds a few pixels of overflow
     to <html>, producing a second outer scrollbar alongside the one inside
     .home. overflow: hidden on both html and body kills that outer track. */
  html, body {
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    height: 100%;
    overflow: hidden;
  }
  html { position: relative; }

  /* Paper-grain noise overlay — same texture as the newsletter pages.
     Imperceptible up close, breaks LCD flatness at distance. Disabled under
     reduced-motion / high-contrast preferences. */
  html::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image: none;
    opacity: 0.04;
    mix-blend-mode: multiply;
  }
  @media (prefers-reduced-motion: reduce), (prefers-contrast: more) {
    html::before { display: none; }
  }
  body > *, header.app { position: relative; z-index: 1; }
  body {
    font-family: var(--font-body);
    line-height: 1.5;
    font-size: 15px;
    font-feature-settings: "kern", "liga", "onum";
    -webkit-font-smoothing: antialiased;
  }

  /* Terminal header bar — mirrors the pagr/seedr chrome: a single row on a
     --card surface with a --border bottom rule. LEFT: the brand wordmark
     (mono + .glow) and a blinking .cursor-block. RIGHT: the nav-rail minimize
     toggle. */
  header.app {
    border-bottom: 1px solid var(--border);
    background: var(--card);
    font-family: var(--font-mono); /* chrome is terminal mono; the content stays serif */
    /* Lift the header above the content, which is also a positioned body child
       at z-index 1 and would otherwise paint over it. */
    z-index: 50;
    padding: 0 1rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    min-height: 3rem;
  }
  /* LEFT zone — brand only. */
  .header-left {
    display: flex;
    align-items: center;
    flex: none;
    min-width: 0;
  }
  .header-brand {
    display: inline-flex;
    align-items: center;
    flex: none;
    text-decoration: none;
    cursor: pointer;
  }
  .header-brand .brand-word {
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: -0.01em;
  }

  /* RIGHT zone — the nav-rail minimize toggle, pushed to the far right
     (the header has no center zone). */
  .header-right {
    flex: none;
    margin-left: auto;
    display: flex;
    align-items: center;
  }

  /* Layout: two columns — flexible main + a fixed-width nav-rail on the right.
     The fixed footer is 2rem tall, so the shell is the viewport minus the
     header (3rem) and the footer (2rem). When the rail is collapsed the
     --rail-w track narrows to the icon-only strip. */
  .app-shell {
    display: grid;
    grid-template-columns: minmax(0, 1fr) var(--rail-w, 16rem);
    height: calc(100vh - 3rem - 2rem);
    height: calc(100dvh - 3rem - 2rem);
  }
  .app-shell.rail-collapsed { --rail-w: 3rem; }

  /* The nav lives in the sticky right sidebar (.nav-rail). It holds the
     Übersicht control (#home-btn) and #nav-groups (the grouped category nav,
     populated by JS). */
  .nav-label {
    font-family: var(--font-mono);
    font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--muted-foreground); padding: 0.5rem 0.85rem 0.2rem; font-weight: 600;
  }
  #nav-groups { padding-bottom: 0.2rem; }

  .cat {
    margin: 0;
    border-radius: 0;
    overflow: hidden;
    border: 0;
  }
  .cat-head {
    display: flex; align-items: center; gap: 0.55rem;
    padding: 0.45rem 0.85rem;
    cursor: pointer;
    border-radius: 0;
    transition: background 120ms;
    min-height: 2.1rem;
  }
  .cat-head:hover { background: var(--muted); }
  .cat-head:hover .cat-name { color: var(--primary); }
  .cat.active .cat-head { background: var(--muted); }
  .cat.active .cat-name { color: var(--primary); }
  .cat-color { width: 6px; height: 18px; border-radius: 0; flex: none; }
  .cat-name {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 0.8rem;
    color: var(--foreground);
    transition: color 0.15s ease;
    flex: 1;
    /* Single-line; ellipsise rather than wrap to two lines. */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .cat-icon { font-size: 1.05rem; }
  .cat-latest {
    font-family: var(--font-mono);
    font-size: 0.68rem; color: var(--soft);
    font-feature-settings: "tnum"; font-weight: 500;
  }
  .cat-toggle {
    background: transparent; border: none;
    color: var(--soft); cursor: pointer;
    transition: transform 150ms ease, background 120ms, color 120ms;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    padding: 0.55rem 0.7rem;
    border-radius: var(--radius-inline);
    line-height: 1;
    min-height: 2.25rem; min-width: 2.25rem;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .cat-toggle:hover { background: var(--rule-soft); color: var(--fg); }
  .cat.open > .cat-head .cat-toggle { transform: rotate(90deg); }

  .cat-dates { display: none; padding: 0.15rem 0.7rem 0.4rem 1.45rem; }

  .cat.open .cat-dates { display: block; }
  /* The category dropdown holds only the archive month-picker: days with a
     brief are clickable (ringed in the category accent), the selected day is
     filled, hovering one previews its title. Border + marks use the
     per-category --cat-accent scoped on the .cat row. */
  .cat-cal {
    margin: 0.2rem 0;
    padding: 0.5rem;
    border: 1px solid var(--cat-accent);
    border-radius: 6px;
    background: var(--rule-soft);
  }
  .cal-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 0.45rem;
  }
  .cal-title {
    font-family: var(--font-mono); font-size: 0.74rem;
    font-weight: 600; color: var(--fg);
  }
  .cal-nav {
    width: 1.7rem; height: 1.7rem; line-height: 1;
    background: transparent; border: 1px solid var(--rule); border-radius: 4px;
    color: var(--muted-ink); font-size: 0.95rem; cursor: pointer;
    transition: color 120ms, border-color 120ms;
  }
  .cal-nav:hover:not(:disabled) { color: var(--fg); border-color: var(--soft); }
  .cal-nav:focus-visible { outline: 2px solid var(--cat-accent, var(--fg)); outline-offset: 2px; }
  .cal-nav:disabled { opacity: 0.3; cursor: default; }
  .cal-week, .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
  }
  .cal-week { margin-bottom: 3px; }
  .cal-week span {
    text-align: center; font-family: var(--font-mono);
    font-size: 0.58rem; color: var(--muted-ink);
  }
  .cal-day {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 0.7rem;
    border-radius: 4px; color: var(--soft);
    font-feature-settings: "tnum";
  }
  .cal-day.none { color: var(--rule); }
  .cal-day.blank { visibility: hidden; }
  .cal-day.has {
    color: var(--fg); font-weight: 600; cursor: pointer; text-decoration: none;
    background: var(--panel);
    box-shadow: inset 0 0 0 1px var(--cat-accent);
    transition: background 100ms, color 100ms;
  }
  .cal-day.has:hover, .cal-day.has:focus-visible,
  .cal-day.has.current {
    background: var(--cat-accent); color: #fff; outline: none;
  }
  .cal-preview {
    margin-top: 0.5rem; padding-top: 0.45rem;
    border-top: 1px solid var(--rule);
    font-family: var(--font-body); font-size: 0.72rem;
    color: var(--muted-ink); line-height: 1.35; min-height: 1.7rem;
  }
  /* ────────────────────────────────────────────────────────────────────
     Fixed footer status bar — mirrors the pagr/seedr StatusBar: a 2rem bar
     pinned to the viewport bottom on a --card surface with a --border top
     rule. LEFT: `[briefs] reader@briefs:~/path` status line. RIGHT: the
     relocated controls (theme menu, language menu) + an anim toggle.
     ──────────────────────────────────────────────────────────────────── */
  footer.status-bar {
    position: fixed;
    inset-inline: 0;
    bottom: 0;
    z-index: 60;
    height: 2rem;
    border-top: 1px solid var(--border);
    background: var(--card);
    font-family: var(--font-mono); /* chrome is terminal mono */
    font-size: 11px;
  }
  .status-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    height: 100%;
    padding: 0 0.85rem;
  }
  .status-path {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted-foreground);
  }
  .status-path .status-tag { color: var(--primary); }
  .status-path .status-loc { color: var(--foreground); }
  .status-controls {
    display: flex;
    align-items: center;
    gap: 1.1rem;
    flex: none;
  }
  .status-sep { height: 0.9rem; width: 1px; background: var(--border); flex: none; }

  /* Footer control buttons — flat, muted, warm to --primary on hover. No
     boxes, no shadows; terminal-plain. */
  .status-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: inherit;
    line-height: 1;
    color: var(--muted-foreground);
    text-decoration: none;
    background: none;
    border: 0;
    border-radius: 0;
    padding: 0;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .status-btn:hover { color: var(--primary); }

  /* Theme + language dropdowns reuse the core .dropdown / .dropdown-panel /
     .dropdown-item primitives. The summary mirrors .status-btn. */
  .status-controls .dropdown > summary { font: inherit; }
  /* Settings icons (.dd-dot theme indicator, .dd-flag language flags) come from
     the shared @danieldeusing/design components.css — no local copy here. */

  /* Anim toggle — `[x] anim` / `[ ] anim`, mirroring pagr's footer toggle. */
  .anim-toggle { white-space: nowrap; }
  .anim-toggle[aria-pressed="true"] .anim-box { color: var(--primary); }

  /* Language picker — the trigger anchors the upward dropdown menu. The menu
     reuses the core .dropdown-panel (absolute, opens above, right-aligned),
     toggled open/closed via the [hidden] attribute by the existing JS. */
  .lang-picker { position: relative; }
  .lang-caret { font-size: 0.6rem; margin-left: 0.1rem; }
  .lang-menu[hidden] { display: none; }
  .lang-option[aria-selected="true"] {
    color: var(--primary);
    text-shadow: 0 0 8px var(--glow);
  }

  .cat-empty {
    font-family: var(--font-mono);
    font-size: 0.7rem; color: var(--soft);
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 0.5rem 0.6rem;
  }

  /* Main area — full width, fills the shell (viewport minus header + footer). */
  .main {
    overflow: hidden;
    background: var(--bg);
    position: relative;
    height: 100%;
  }
  .iframe-host { width: 100%; height: 100%; border: none; background: var(--bg); }

  /* ────────────────────────────────────────────────────────────────────
     Sticky right sidebar (.nav-rail) — terminal mono, --card surface with a
     --border left rule, full shell height with its own scroll. Holds the
     Übersicht control + the grouped category nav. Collapses to a 3rem icon-
     only strip; the width animates via the grid track on .app-shell.
     ──────────────────────────────────────────────────────────────────── */
  .nav-rail {
    grid-column: 2;
    font-family: var(--font-mono);
    background: var(--card);
    border-left: 1px solid var(--border);
    height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 2;
  }
  .nav-rail-head {
    display: flex;
    align-items: center;
    min-height: 2.1rem;
    padding: 0.4rem 0.85rem;
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .nav-rail-title {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 600;
    color: var(--muted-foreground);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-rail-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0.3rem 0 0.4rem;
  }

  /* Minimize toggle — the `»`/`«` chevron in the header right zone. Flat, muted,
     warm to --primary on hover (terminal-plain, no box). */
  .rail-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    flex: none;
    background: none;
    border: 0;
    border-radius: 0;
    color: var(--muted-foreground);
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 1rem;
    line-height: 1;
    transition: color 0.15s ease;
  }
  .rail-toggle:hover { color: var(--primary); }
  /* Expanded → `»` (collapse-to-right); collapsed → `«` (re-open). The button's
     aria-expanded drives the glyph; JS rewrites the text content too as a fallback. */
  .rail-toggle[aria-expanded="false"] .rail-toggle-glyph::before { content: "«"; }
  .rail-toggle[aria-expanded="true"]  .rail-toggle-glyph::before { content: "»"; }
  .rail-toggle-glyph { font-size: 0; }
  .rail-toggle-glyph::before { font-size: 1rem; }

  /* Collapsed strip — keep only the per-category accent bar + icon, hide labels,
     calendars and the home wordmark. The 3rem track clips the rest. */
  .app-shell.rail-collapsed .nav-rail-title,
  .app-shell.rail-collapsed .nav-label,
  .app-shell.rail-collapsed .cat-name,
  .app-shell.rail-collapsed .cat-latest,
  .app-shell.rail-collapsed .cat-toggle,
  .app-shell.rail-collapsed .cat-dates,
  .app-shell.rail-collapsed .home-btn .nav-label-text,
  .app-shell.rail-collapsed .home-btn .brand-mark {
    display: none;
  }
  .app-shell.rail-collapsed .nav-rail-head { justify-content: center; padding: 0.4rem 0; }
  .app-shell.rail-collapsed .cat-head,
  .app-shell.rail-collapsed .home-btn {
    justify-content: center;
    padding-left: 0;
    padding-right: 0;
    gap: 0;
  }
  .app-shell.rail-collapsed .cat-color,
  .app-shell.rail-collapsed .home-btn .cat-color { margin-right: 0.4rem; }

  /* The width transition reads off the grid track; animate it. */
  .app-shell { transition: grid-template-columns 0.18s ease; }
  @media (prefers-reduced-motion: reduce) {
    .app-shell { transition: none; }
  }

  /* Mobile re-open button (a floating ☰); shown only when the rail is an
     off-canvas drawer (≤720px). Hidden on desktop. */
  .rail-fab {
    display: none;
    position: fixed;
    right: 0.75rem;
    bottom: 2.6rem;
    z-index: 55;
    width: 2.6rem;
    height: 2.6rem;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--foreground);
    font-family: var(--font-mono);
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow: 0 0 18px var(--glow-soft);
  }

  /* Home view */
  .home {
    display: none;
    padding: 1.5rem 1.8rem;
    overflow-y: auto; height: 100%;
    /* Container for the responsive .tldr-grid below — column-count tracks
       the actual available width, not the viewport (which changes with
       sidebar collapsed/expanded state). */
    container-type: inline-size;
    container-name: home;
  }
  .home.show { display: block; }
  .home h2 {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 48;
    font-size: 1.55rem; font-weight: 600;
    margin: 0 0 0.5rem; letter-spacing: -0.005em;
  }
  .home .lead { color: var(--muted-ink); margin-bottom: 1.4rem; font-family: var(--font-body); }

  /* Freshness line — "Stand: DD.MM.YYYY" from the manifest's `generated`
     date. Mono-caps to read as a dateline, not body copy. When the manifest
     wasn't rebuilt today (a silently-failed nightly task), .stale flips it to
     the warn accent and appends a hint, so a missed run is visible at a glance
     instead of looking like fresh content. */
  .home-stand {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--soft);
    font-feature-settings: "tnum";
    margin: 0 0 1.2rem;
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .home-stand .stand-date { font-weight: 600; color: var(--muted-ink); }
  .home-stand.stale { color: var(--warn); }
  .home-stand.stale .stand-date { color: var(--warn); }
  .home-stand .stand-note { text-transform: none; letter-spacing: 0.02em; font-style: italic; }

  /* Newsprint column grid — the dashboard reads like one paper folded into
     seven adjacent columns. No card chrome: backgrounds, borders, shadows
     and radii are stripped. Adjacent columns are separated only by a
     hairline column rule, the same way the body-grid inside a newsletter
     uses column-rule between deep-dive sections. */
  /* Responsive column grid — caps at 3 wide so the columns stay readable
     on huge screens instead of shrinking to 5-6 narrow strips. The min
     width per column is the larger of 320 px (floor for readability) or
     1/3 of the container (so no more than 3 fit). Single declaration —
     no media or container queries needed.

     The column-rule + row-rule logic uses container queries against .home
     so the layout responds to actual available width (which changes with
     sidebar collapsed/expanded), not viewport. */
  .tldr-grid {
    display: grid;
    grid-template-columns:
      repeat(auto-fit, minmax(min(100%, max(320px, calc((100% - 2px) / 3))), 1fr));
    gap: 0;
    margin-top: 0.5rem;
  }
  .tldr-card {
    background: transparent;
    border: none;
    border-radius: 0;
    padding: var(--space-2) var(--space-4) var(--space-5);
    box-shadow: none;
    cursor: pointer;
    transition: background 150ms;
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    border-left: 1px solid var(--rule);
  }

  /* Grouped layout: a full-width header band (Wirtschaft / IT / Sport / …)
     precedes each group's cards. The header spans every grid column so the
     column flow restarts beneath it — each group reads as its own newsprint
     block, matching the sidebar's grouping. */
  .tldr-group-head {
    grid-column: 1 / -1;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    font-weight: 600;
    color: var(--soft);
    margin: var(--space-5) 0 0;
    padding: var(--space-3) 0 var(--space-2);
    border-top: 1px solid var(--rule);
  }
  /* The first group header sits right under the "Stand:" line — no big top gap
     or top rule, so the grid doesn't open with a stray divider. */
  .tldr-group-head:first-child { margin-top: 0; border-top: none; padding-top: 0; }

  /* The leading card of each group clears its left column rule so the group's
     first column starts clean (JS marks it; nth-child can't track per-group
     position once headers are interspersed). */
  .tldr-card.group-first { border-left: none; padding-left: 0; }

  /* Single-column band (narrow): no column rules at all; cards in the same
     group separate by a dashed row rule. The group header already divides
     groups, so only same-group siblings (a card directly after another card)
     get the dashed top. */
  @container home (max-width: 639px) {
    .tldr-card { border-left: none; padding-left: 0; }
    .tldr-card + .tldr-card {
      margin-top: var(--space-3);
      padding-top: var(--space-5);
      border-top: 1px dashed var(--rule);
    }
  }
  /* Subtle tinted-paper feedback on hover — no transform, no shadow swap,
     so adjacent columns never visually shift. */
  .tldr-card:hover {
    background: color-mix(in srgb, var(--cat-accent) 4%, transparent);
  }
  .tldr-card:focus-visible {
    outline: 2px solid var(--cat-accent, var(--fg));
    outline-offset: 4px;
  }
  .crumb:focus-visible {
    outline: 2px solid var(--fg);
    outline-offset: 2px;
    border-radius: var(--radius-inline);
  }

  /* Kicker line — same mono-caps treatment as the newsletter masthead-issue.
     Icon left, date right, category name in the middle. */
  .tldr-card-head {
    display: flex; align-items: center; gap: var(--space-2);
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.68rem;
    color: var(--muted-ink);
    border-bottom: none;
    padding-bottom: 0;
    margin-bottom: 0;
  }
  .tldr-card-head .tile-icon {
    font-size: 1rem;
    letter-spacing: normal;
    text-transform: none;
  }
  .tldr-card-head .tile-name {
    font-family: inherit;
    font-variation-settings: normal;
    font-weight: 600;
    font-size: inherit;
    color: var(--cat-accent-text, var(--fg));
    flex: 1;
  }
  .tldr-card-head .tile-date {
    font-family: inherit;
    font-size: inherit;
    color: var(--muted-ink);
    font-weight: 500;
    font-feature-settings: "tnum";
    letter-spacing: 0.1em;
  }

  /* Section title — the actual newsletter headline, rendered as a section
     dek in Fraunces with the same accent-bar treatment as .col h2 inside
     a newsletter. Acts as the "front-page headline" for that category. */
  .tldr-card-headline {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 36, "SOFT" 60;
    font-size: 1.18rem;
    font-weight: 600;
    font-style: normal;
    line-height: 1.18;
    color: var(--fg);
    margin: var(--space-2) 0 var(--space-3);
    letter-spacing: -0.005em;
  }
  .tldr-card-headline::before {
    content: "";
    display: block;
    width: 2rem;
    height: 2px;
    background: var(--cat-accent);
    margin-bottom: var(--space-2);
  }

  /* Strip the embedded TL;DR section's own chrome — it inherits the column
     instead. The lead keeps its drop-cap treatment but at a smaller scale
     suited to the narrower column width. */
  .tldr-card-body .tldr {
    background: transparent; border: none; padding: 0; margin: 0; border-radius: 0;
    display: block;       /* override the .tldr:has(.lead) grid from styles.css */
    column-gap: 0;

  .tldr-card-body .tldr > .lead {
    font-family: var(--font-body);
    font-size: 0.92rem;
    line-height: 1.5;
    color: var(--fg);
    margin: 0 0 var(--space-3);
    max-width: none;
  }
  .tldr-card-body .tldr > .lead::first-letter {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 144, "SOFT" 100;
    font-size: 2.7rem;
    float: left;
    line-height: 0.85;
    padding: 0.25rem 0.45rem 0 0;
    color: var(--cat-accent);
    font-weight: 700;
  }
  .tldr-card-body .tldr ul {
    padding-left: 1rem;
    margin: 0;
    column-count: 1;       /* override 2-col bullet layout in narrow card */
  }
  .tldr-card-body .tldr li { font-size: 0.86rem; margin: 0.4rem 0; line-height: 1.5; }
  .tldr-card-body strong { color: var(--fg); font-weight: 700; }
  .tldr-card-body em { color: var(--muted-ink); font-style: italic; }
  .tldr-card-body a { color: inherit; text-decoration: underline; }
  /* Chips inside TL;DR bullets — tinted by the card's accent. */
  .tldr-card-body .chip {
    display: inline-block;
    font-family: var(--font-mono);
    background: color-mix(in srgb, var(--cat-accent, var(--rule-soft)) 14%, transparent);
    color: var(--fg);
    font-size: 0.6rem; font-weight: 600; padding: 0.05rem 0.45rem;
    border-radius: var(--radius-inline); letter-spacing: 0.04em; margin-right: 0.2rem;
    text-transform: uppercase; vertical-align: middle;
  }
  .tldr-card-body .chip.hot  { background: rgba(182, 64, 47, 0.18); color: #b6402f; }
  .tldr-card-body .chip.good { background: rgba(63, 122, 79, 0.18); color: #3f7a4f; }
  /* Suppress the external-link arrow inside TL;DR snippets — too noisy. */
  .tldr-card-body a[href^="http"]::after { content: none; }
  /* "+N weitere" overflow marker — the home snapshot caps the TL;DR at a few
     bullets (the full set is one click away). Reads as a muted continuation
     cue, list-style stripped so it doesn't get its own bullet dot. */
  .tldr-card-body .tldr li.tldr-more {
    list-style: none;
    margin-left: -1rem;
    color: var(--soft);
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    font-style: normal;
  }

  /* DE-fallback chip — shown in a card's kicker when the active language has
     no translation for this date and the card is showing the DE original.
     Understated outline so it informs without competing with the accent. */
  .tldr-card-head .fallback-flag {
    font-family: var(--font-mono);
    font-size: 0.58rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--soft);
    border: 1px solid var(--rule);
    border-radius: var(--radius-inline);
    padding: 0.02rem 0.3rem;
    text-transform: uppercase;
    flex: none;
  }

  .tldr-read {
    background: transparent; border: none; color: var(--fg);
    font-family: var(--font-mono);
    font-weight: 600; cursor: pointer;
    font-size: 0.78rem; text-align: left;
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 0.7rem 0.2rem 0.4rem 0; margin-top: auto;
    min-height: 2.25rem;
    border-radius: var(--radius-inline);
  }
  .tldr-read:focus-visible {
    outline: 2px solid var(--cat-accent);
    outline-offset: 2px;
  }
  .tldr-read:hover { text-decoration: underline; }
  .tldr-empty {
    font-family: var(--font-body);
    font-size: 0.88rem; color: var(--soft); font-style: italic; padding: 0.4rem 0;
  }

  /* Empty-state card — "Heute kein Brief". Same per-category accent stripe
     so the category identity is preserved, but the body is muted, dashed,
     and self-evidently dormant. Not clickable. */
  .tldr-card--empty {
    cursor: default;
    background: color-mix(in srgb, var(--bg) 50%, var(--panel));
    box-shadow: none;
  }
  .tldr-card--empty:hover {
    transform: none;
    box-shadow: none;
  }
  .tldr-card--empty .tile-date {
    color: var(--rule);
  }
  .tldr-empty-block {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.5rem;
    padding: 1.2rem 0.4rem 0.8rem;
    border-top: 1px dashed var(--rule);
    border-bottom: 1px dashed var(--rule);
    margin: 0.4rem 0 0;
  }
  .tldr-empty-kicker {
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.7rem;
    color: var(--cat-accent, var(--muted-ink));
    font-weight: 600;
  }
  .tldr-empty-msg {
    font-family: var(--font-body);
    font-size: 0.88rem;
    color: var(--muted-ink);
    line-height: 1.5;
    font-style: italic;
    margin: 0;
  }

  /* Per-category accents — each card scopes its own --cat-accent and
     --cat-accent-text so descendant rules (kicker tile-name, accent bar above
     the headline, drop cap, chips, CTA) all pick up the right colour. */
  .tldr-card[data-cat="economy"]        { --cat-accent: var(--c-economy);        --cat-accent-text: var(--c-economy-text); }
  .tldr-card[data-cat="software"]       { --cat-accent: var(--c-software);       --cat-accent-text: var(--c-software-text); }
  .tldr-card[data-cat="ai-dev"]         { --cat-accent: var(--c-ai-dev);         --cat-accent-text: var(--c-ai-dev-text); }

  .tldr-card .tldr-read { color: var(--cat-accent-text); }

  /* Loading */
  .loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;

  }

  /* Color helpers per category */
  [data-cat="economy"]        .cat-color { background: var(--c-economy); }

  [data-cat="jobs"]           .cat-color { background: var(--c-jobs); }
  [data-cat="learn-language"] .cat-color { background: var(--c-learn-language); }

  /* Sidebar rows scope their own --cat-accent so the archive calendar's border,
     day rings and selected-day fill match the category colour. */
  .cat[data-cat="economy"]        { --cat-accent: var(--c-economy); }
  .cat[data-cat="software"]       { --cat-accent: var(--c-software); }
  .cat[data-cat="ai-dev"]         { --cat-accent: var(--c-ai-dev); }
  .cat[data-cat="ai-usecases"]    { --cat-accent: var(--c-ai-usecases); }
  .cat[data-cat="family"]         { --cat-accent: var(--c-family); }
  .cat[data-cat="jobs"]           { --cat-accent: var(--c-jobs); }
  .cat[data-cat="learn-language"] { --cat-accent: var(--c-learn-language); }

  /* Home button — the "Übersicht" control at the top of the nav dropdown
     panel. Black accent bar (the dashboard's "house" colour) + favicon-style
     M brand mark + label, styled like a terminal .dropdown-item row. */
  .home-btn {
    display: flex; align-items: center; gap: 0.55rem;
    padding: 0.45rem 0.85rem;

    min-height: 2.1rem;
  }
  .home-btn:hover { background: var(--muted); color: var(--primary); }
  .home-btn.active { background: var(--muted); color: var(--primary); }
  .home-btn .cat-color {
    width: 6px; height: 18px; border-radius: 0; flex: none;
    background: var(--foreground);
  }
  /* Brand mark = the favicon design at category-icon size. */
  .home-btn .brand-mark {
    width: 1.1rem;
    height: 1.1rem;
    flex: none;
  }
  .home-btn:focus-visible,
  .cat-head:focus-visible,
  .cat-toggle:focus-visible,

    outline: 2px solid var(--ring, var(--primary));
    outline-offset: -2px;
  }

  /* ────────────────────────────────────────────────────────────────────
     Mobile / narrow responsiveness — the nav-rail becomes an off-canvas
     drawer (the .app-shell collapses to a single main column), toggled by
     the floating .rail-fab. The header keeps brand + history controls.
     ──────────────────────────────────────────────────────────────────── */
  @media (max-width: 720px) {
    header.app { padding: 0 0.75rem; gap: 0.6rem; }

    .tldr-grid { grid-template-columns: 1fr; gap: 0.85rem; }
    .home h2 { font-size: 1.2rem; }
    .status-controls { gap: 0.9rem; }

    /* Single main column; the rail floats as an off-canvas drawer pinned
       under the header / above the footer, slid off to the right until opened. */
    .app-shell,
    .app-shell.rail-collapsed { grid-template-columns: 1fr; }
    .nav-rail {
      position: fixed;
      top: 3rem;
      right: 0;
      bottom: 2rem;
      width: min(80vw, 18rem);
      transform: translateX(100%);
      transition: transform 0.2s ease;
      z-index: 56;
      box-shadow: -8px 0 24px var(--glow-soft);
    }
    .app-shell.rail-open .nav-rail { transform: translateX(0); }
    /* On mobile the drawer always shows full labels — never the icon strip. */
    .app-shell.rail-collapsed .nav-rail-title,
    .app-shell.rail-collapsed .nav-label,
    .app-shell.rail-collapsed .cat-name,
    .app-shell.rail-collapsed .cat-latest,
    .app-shell.rail-collapsed .cat-toggle,
    .app-shell.rail-collapsed .cat-dates,
    .app-shell.rail-collapsed .home-btn .nav-label-text,
    .app-shell.rail-collapsed .home-btn .brand-mark { display: revert; }
    .app-shell.rail-collapsed .nav-rail-head { justify-content: flex-start; padding: 0.4rem 0.85rem; }
    .app-shell.rail-collapsed .cat-head,
    .app-shell.rail-collapsed .home-btn {
      justify-content: flex-start; padding-left: 0.85rem; padding-right: 0.85rem; gap: 0.55rem;
    }
    /* The header chevron toggle is meaningless on mobile (drawer uses the FAB). */
    .rail-toggle--header { display: none; }
    .rail-fab { display: inline-flex; align-items: center; justify-content: center; }
  }
  @media (max-width: 400px) {
    header.app { padding: 0 0.6rem; }
    .header-brand .brand-word { font-size: 0.85rem; }
    .home { padding: 0.85rem 0.85rem 1.2rem; }
    .tldr-card { padding: 0.8rem 0.9rem 0.7rem; }
    .tldr-card-body .tldr li { font-size: 0.8rem; }
  }

<!-- Terminal header bar (mirrors pagr): LEFT brand wordmark + cursor; RIGHT the
     nav-rail minimize toggle. The grouped category nav lives in the sticky right
     sidebar (.nav-rail). -->
<header class="app">
  <div class="header-left">
    <a class="header-brand" id="brand-home" href="#home" title="Übersicht">
      <span class="glow brand-word">Daniels Morning Briefs</span>
      <span class="cursor-block" aria-hidden="true"></span>
    </a>
  </div>

  <div class="header-right">
    <button class="rail-toggle rail-toggle--header" id="rail-toggle" type="button"
            aria-controls="nav-rail" aria-expanded="true" aria-label="Navigation ein-/ausblenden"
            title="Navigation ein-/ausblenden">
      <span class="rail-toggle-glyph" aria-hidden="true">»</span>
    </button>
  </div>
</header>

<div class="app-shell">
  <main class="main">

    </div>

    <iframe class="iframe-host" id="frame" style="display:none;" title="Newsletter"></iframe>
  </main>

  <!-- Sticky right sidebar: the relocated Übersicht control (#home-btn) and the
       grouped category nav (#nav-groups, populated by JS from NAV_GROUPS). Can be
       minimized to an icon-only strip; collapsed state persists in localStorage. -->
  <aside class="nav-rail" id="nav-rail" aria-label="Navigation">
    <div class="nav-rail-head">
      <span class="nav-rail-title">~/briefs</span>
    </div>
    <div class="nav-rail-body">
      <div class="home-btn active" id="home-btn" role="button" tabindex="0" title="Übersicht">
        <span class="cat-color"></span>
        <!-- Full favicon design inline: dark frame + cream page + red
             double-rule + serif M. Identical SVG to favicon.svg so the
             browser tab and the home control read as the same "house" mark. -->
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <rect width="64" height="64" rx="9" fill="#221a13"/>
          <rect x="2.5" y="2.5" width="59" height="59" rx="7" fill="#f1e7d3"/>

        </svg>
        <span class="nav-label-text">Übersicht</span>
      </div>
      <div id="nav-groups"><!-- populated by JS from NAV_GROUPS: grouped category
           nav (Wirtschaft / IT / jobs / Sport / Freizeit / Sprachen), each group
           with its own .nav-label header (standalone groups render headerless). --></div>
    </div>
  </aside>
</div>

<button class="rail-fab" id="rail-fab" type="button" aria-controls="nav-rail"
        aria-label="Navigation öffnen" title="Navigation">☰</button>

     toggle (right). Controls keep their original ids so the existing handlers

        <span class="anim-box" aria-hidden="true">[x]</span>
        <span>anim</span>
      </button>
    </nav>
  </div>
</footer>

 <strong>14,25 %</strong>, Copom <strong>Di 04./Mi 05.08.</strong>; Marktberichte sehen ~<strong>78 %</strong> der Preisung auf 14,00 %.</li>\n      <li><span class=\"chip\">JOBS</span> <strong>Oracle:</strong> bis zu <strong>30.000</strong> Stellen finanzieren den Stargate-Ausbau — Quellen von April bis Juni, laufender Umbau statt Tagesnachricht.</li>\n      <li><span class=\"chip\">PROGNOSE</span> Heute <strong>5,84–5,92</strong>, am ehesten <strong>5,87</strong>. <strong>Nicht verifizierbar:</strong> DI-Kurve, NTN-B, CFTC-Netto, EWZ.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><h2>The Essentials in 30 Seconds</h2>\n    <p class=\"lead\">The Fed held, as expected — but three of twelve voting members wanted to <em>hike</em>. What followed doesn't normally happen: stocks fell, long rates rose, and the dollar fell <em>right along with them</em>. For Daniel that means: EUR/BRL is trading 0.78% above the last ECB fix — this time almost entirely from euro strength, not real weakness. Yesterday it was the reverse.</p>\n    <ul>\n      <li><span class=\"chip hot\">FED</span> <strong>Held at 3.50–3.75%</strong> — but by <strong>9-3</strong>. Hammack, Kashkari, and Logan wanted 25 basis points <em>higher</em>.</li>\n      <li><span class=\"chip\">FX</span> <strong>EUR/BRL 5.8268</strong> (ECB fix Wed Jul 29, <em>before</em> the decision) vs. <strong>5.8723</strong> live-implied (xe, Thu Jul 30, 05:13 UTC) — <strong>+0.78%</strong>, above the reporting threshold. About <strong>85% of that is euro strength</strong>, only 15% real weakness.</li>\n      <li><span class=\"chip hot\">USA</span> <strong>The pattern is the signal:</strong> stocks down, the 10-year yield up to <strong>4.643%</strong>, the 30-year at 2007 levels — the dollar <em>weaker anyway intraday</em> (DXY <strong>100.9459</strong>, −0.32% versus the pre-Fed level). A risk premium, not a rate advantage. <em>Market-reaction figures per search-engine summaries, not pulled from a primary source — a sentiment read, not a decision-grade number.</em></li>\n      <li><span class=\"chip good\">BR RISK</span> <strong>5-year CDS at 127.73 bp</strong> (close Jul 29, +2.65) — <em>below</em> the 130 bp I set yesterday as the falsification test.</li>\n      <li><span class=\"chip hot\">OIL</span> <strong>Brent $90.26</strong> (Jul 30, intraday pull, −0.53% vs. yesterday's close) — yesterday the same source showed $87.29 intraday; the value moves continuously, and a later pull the same day already showed $91.28.</li>\n      <li><span class=\"chip\">RATES</span> Selic <strong>14.25%</strong>, Copom <strong>Tue Aug 4 / Wed Aug 5</strong>; market reports put ~<strong>78%</strong> of pricing on 14.00%.</li>\n      <li><span class=\"chip\">JOBS</span> <strong>Oracle:</strong> up to <strong>30,000</strong> jobs are funding the Stargate build-out — sources from April through June, an ongoing restructuring, not today's news.</li>\n      <li><span class=\"chip\">FORECAST</span> Today <strong>5.84–5.92</strong>, most likely <strong>5.87</strong>. <strong>Not verifiable:</strong> DI curve, NTN-B, CFTC net positioning, EWZ.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><h2>O essencial em 30 segundos</h2>\n    <p class=\"lead\">O Fed manteve os juros, como esperado — mas três dos doze votantes queriam <em>subir</em>. Depois aconteceu o que normalmente não acontece: as ações caíram, os juros longos subiram, e o dólar caiu <em>junto</em>. Para o Daniel, isso significa: o EUR/BRL está 0,78% acima do último fixing do BCE — desta vez quase inteiramente por força do euro, não por fraqueza do real. Ontem foi o contrário.</p>\n    <ul>\n      <li><span class=\"chip hot\">FED</span> <strong>Manutenção em 3,50–3,75%</strong> — mas por <strong>9 a 3</strong>. Hammack, Kashkari e Logan queriam subir 25 pontos-base.</li>\n      <li><span class=\"chip\">Câmbio</span> <strong>EUR/BRL 5,8268</strong> (fixing do BCE, qua. 29/07, <em>antes</em> da decisão) vs. <strong>5,8723</strong> ao vivo implícito (xe, qui. 30/07, 05h13 UTC) — <strong>+0,78%</strong>, acima do limiar de aviso. Disso, cerca de <strong>85% é força do euro</strong>, só 15% é fraqueza do real.</li>\n      <li><span class=\"chip hot\">EUA</span> <strong>O padrão é o sinal:</strong> ações em queda, juro de 10 anos subindo para <strong>4,643%</strong>, o de 30 anos em patamar de 2007 — o dólar <em>mais fraco mesmo assim no intradia</em> (DXY <strong>100,9459</strong>, −0,32% frente ao nível pré-Fed). Prêmio de risco, não vantagem de juros. <em>Números da reação de mercado a partir de resumos de buscadores, não coletados de fonte primária — retrato de humor, não um número de fechamento oficial.</em></li>\n      <li><span class=\"chip good\">RISCO BR</span> <strong>CDS de 5 anos em 127,73 bp</strong> (fechamento de 29/07, +2,65) — <em>abaixo</em> dos 130 bp que eu tinha marcado ontem como teste de refutação.</li>\n      <li><span class=\"chip hot\">Petróleo</span> <strong>Brent US$ 90,26</strong> (30/07, coleta intradiária, −0,53% sobre o fechamento anterior) — ontem a mesma fonte mostrava US$ 87,29 intradiário; o valor oscila continuamente, e uma coleta posterior no mesmo dia já mostrava US$ 91,28.</li>\n      <li><span class=\"chip\">JUROS</span> Selic <strong>14,25%</strong>, Copom <strong>ter. 04 / qua. 05/08</strong>; relatos de mercado veem ~<strong>78%</strong> da precificação em 14,00%.</li>\n      <li><span class=\"chip\">EMPREGOS</span> <strong>Oracle:</strong> até <strong>30.000</strong> vagas financiam a expansão do Stargate — fontes de abril a junho, um ajuste em curso, não uma notícia de hoje.</li>\n      <li><span class=\"chip\">PREVISÃO</span> Hoje <strong>5,84–5,92</strong>, mais provável <strong>5,87</strong>. <strong>Não verificável:</strong> curva de DI, NTN-B, líquido da CFTC, EWZ.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><h2>Lo esencial en 30 segundos</h2>\n    <p class=\"lead\">La Fed mantuvo la tasa, como se esperaba — pero tres de los doce votantes querían <em>subirla</em>. Después pasó lo que normalmente no pasa: las acciones cayeron, las tasas largas subieron, y el dólar cayó <em>junto con ellas</em>. Para Daniel eso significa: el EUR/BRL está 0,78% por encima del último fixing del BCE — esta vez casi enteramente por fortaleza del euro, no por debilidad del real. Ayer fue al revés.</p>\n    <ul>\n      <li><span class=\"chip hot\">FED</span> <strong>Se mantiene en 3,50–3,75%</strong> — pero por <strong>9 a 3</strong>. Hammack, Kashkari y Logan querían subir 25 puntos base.</li>\n      <li><span class=\"chip\">FX</span> <strong>EUR/BRL 5,8268</strong> (fixing del BCE, mié. 29/07, <em>antes</em> de la decisión) vs. <strong>5,8723</strong> en vivo implícito (xe, jue. 30/07, 05:13 UTC) — <strong>+0,78%</strong>, por encima del umbral de aviso. De eso, cerca de <strong>85% es fortaleza del euro</strong>, solo 15% es debilidad del real.</li>\n      <li><span class=\"chip hot\">EUA</span> <strong>El patrón es la señal:</strong> acciones a la baja, el rendimiento a 10 años sube a <strong>4,643%</strong>, el de 30 años en nivel de 2007 — el dólar <em>más débil aun así en el intradía</em> (DXY <strong>100,9459</strong>, −0,32% frente al nivel previo a la Fed). Prima de riesgo, no ventaja de tasas. <em>Cifras de reacción del mercado según resúmenes de buscadores, no obtenidas de una fuente primaria — un indicador de ánimo, no un dato definitivo.</em></li>\n      <li><span class=\"chip good\">RIESGO BR</span> <strong>CDS a 5 años en 127,73 pb</strong> (cierre del 29/07, +2,65) — <em>por debajo</em> de los 130 pb que fijé ayer como prueba de refutación.</li>\n      <li><span class=\"chip hot\">Petróleo</span> <strong>Brent 90,26 dólares</strong> (30/07, consulta intradía, −0,53% frente al cierre del día anterior) — ayer la misma fuente marcaba 87,29 dólares intradía; el valor cambia de forma continua, y una consulta posterior el mismo día ya marcaba 91,28 dólares.</li>\n      <li><span class=\"chip\">TASAS</span> Selic <strong>14,25%</strong>, Copom <strong>mar. 04 / mié. 05/08</strong>; reportes de mercado ven ~<strong>78%</strong> de la valuación en 14,00%.</li>\n      <li><span class=\"chip\">EMPLEOS</span> <strong>Oracle:</strong> hasta <strong>30.000</strong> puestos financian la expansión de Stargate — fuentes de abril a junio, un ajuste en curso, no una noticia de hoy.</li>\n      <li><span class=\"chip\">PRONÓSTICO</span> Hoy <strong>5,84–5,92</strong>, lo más probable <strong>5,87</strong>. <strong>No verificable:</strong> curva de DI, NTN-B, neto de la CFTC, EWZ.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Drei der Sicherheits-Geschichten heute haben keinen Programmierfehler im Kern, sondern eine Voreinstellung. Bei <strong>Ruflos MCP-Bridge</strong> steht die Tür offen, weil sie standardmäßig offen steht — 233 aufrufbare Werkzeuge, Shell-Zugriff inklusive, ohne Anmeldung. Bei <strong>Claudes Teilen-Links</strong> fehlte das eine Tag, das Suchmaschinen fernhält. Bei <strong>Node.js</strong> ist die Speicherobergrenze für HTTP/2 keine Obergrenze. Dazu Javas größte Sprachänderung seit einem Jahrzehnt und zwei Behördenfristen, von denen eine heute abläuft.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>Node.js</strong>: die angekündigten Security-Releases kamen am <strong>29.07.</strong> — 22.23.2, 24.18.1, 26.5.1, zusammen <strong>elf CVEs</strong>, drei HIGH. Der Patch kommt bei den meisten über das Container-Basis-Image. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Ruflo MCP Bridge</strong>: CVE-2026-59726, <strong>CVSS 10,0</strong>, Codeausführung ohne Anmeldung — <strong>233 Werkzeuge</strong> standardmäßig offen im Netz. Fix in 3.16.3. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Geteilte Claude-Chats</strong> landeten in Google, Bing und Brave, weil den Seiten das <code>noindex</code> fehlte — auffindbar über <code>site:claude.ai/share</code>. Anthropic widerspricht. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Frist heute</strong>: CVE-2026-16812 im Arista VeloCloud Orchestrator, CVSS 10,0, aktiv ausgenutzt. Nächste gemeldete Frist <strong>Dienstag</strong>: die WordPress-Kette wp2shell — Datum je nach Quelle uneinheitlich. <span class=\"chip\">USA</span></li>\n      <li><span class=\"chip\">Release</span> <strong>JDK 28</strong>: Valhallas Wertklassen als Preview — <strong>197.000 Zeilen</strong> in 1.816 Dateien. Dazu eine JSON-API im Inkubator und das Ende des macOS/x64-Ports. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">OSS</span> <strong>Bundestags-Gutachten</strong>: Behörden dürfen Open Source in der Ausschreibung verlangen — wenn sachlich begründet, verhältnismäßig und dokumentiert. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip good\">Infra</span> <strong>Banco do Brasil</strong>: <strong>43.000 Geldautomaten</strong> auf SUSE Linux Enterprise plus Open Build Service. Die Prozentzahlen sind Hersteller-Zahlen. <span class=\"chip\">BR</span></li>\n      <li><span class=\"chip\">Browser</span> <strong>Firefox 153</strong> (21.07.) bringt Containers eingebaut mit — Nachtrag zu gestern, jetzt primär belegt. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Revolut</strong>: 75 Millionen Datensätze für 500 Dollar angeboten; keine Kennung der Stichprobe passt zu einem echten Konto. <span class=\"chip\">EU</span></li>\n    </ul></div>",
      "latestTldrHtmlByLang": {
        "de": "<div class=\"tldr\"><p class=\"lead\">Drei der Sicherheits-Geschichten heute haben keinen Programmierfehler im Kern, sondern eine Voreinstellung. Bei <strong>Ruflos MCP-Bridge</strong> steht die Tür offen, weil sie standardmäßig offen steht — 233 aufrufbare Werkzeuge, Shell-Zugriff inklusive, ohne Anmeldung. Bei <strong>Claudes Teilen-Links</strong> fehlte das eine Tag, das Suchmaschinen fernhält. Bei <strong>Node.js</strong> ist die Speicherobergrenze für HTTP/2 keine Obergrenze. Dazu Javas größte Sprachänderung seit einem Jahrzehnt und zwei Behördenfristen, von denen eine heute abläuft.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>Node.js</strong>: die angekündigten Security-Releases kamen am <strong>29.07.</strong> — 22.23.2, 24.18.1, 26.5.1, zusammen <strong>elf CVEs</strong>, drei HIGH. Der Patch kommt bei den meisten über das Container-Basis-Image. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Ruflo MCP Bridge</strong>: CVE-2026-59726, <strong>CVSS 10,0</strong>, Codeausführung ohne Anmeldung — <strong>233 Werkzeuge</strong> standardmäßig offen im Netz. Fix in 3.16.3. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Geteilte Claude-Chats</strong> landeten in Google, Bing und Brave, weil den Seiten das <code>noindex</code> fehlte — auffindbar über <code>site:claude.ai/share</code>. Anthropic widerspricht. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Frist heute</strong>: CVE-2026-16812 im Arista VeloCloud Orchestrator, CVSS 10,0, aktiv ausgenutzt. Nächste gemeldete Frist <strong>Dienstag</strong>: die WordPress-Kette wp2shell — Datum je nach Quelle uneinheitlich. <span class=\"chip\">USA</span></li>\n      <li><span class=\"chip\">Release</span> <strong>JDK 28</strong>: Valhallas Wertklassen als Preview — <strong>197.000 Zeilen</strong> in 1.816 Dateien. Dazu eine JSON-API im Inkubator und das Ende des macOS/x64-Ports. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">OSS</span> <strong>Bundestags-Gutachten</strong>: Behörden dürfen Open Source in der Ausschreibung verlangen — wenn sachlich begründet, verhältnismäßig und dokumentiert. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip good\">Infra</span> <strong>Banco do Brasil</strong>: <strong>43.000 Geldautomaten</strong> auf SUSE Linux Enterprise plus Open Build Service. Die Prozentzahlen sind Hersteller-Zahlen. <span class=\"chip\">BR</span></li>\n      <li><span class=\"chip\">Browser</span> <strong>Firefox 153</strong> (21.07.) bringt Containers eingebaut mit — Nachtrag zu gestern, jetzt primär belegt. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Revolut</strong>: 75 Millionen Datensätze für 500 Dollar angeboten; keine Kennung der Stichprobe passt zu einem echten Konto. <span class=\"chip\">EU</span></li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Three of today's security stories don't have a coding bug at their core — they have a default setting. At Ruflo's MCP bridge, the door stands open because it's open by default — 233 callable tools, including shell access, with no login required. At Claude's share links, the one tag that keeps search engines away was missing. At Node.js, the memory ceiling for HTTP/2 isn't a ceiling. Add Java's biggest language change in a decade, and two federal deadlines — one of which expires today.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>Node.js</strong>: the announced security releases landed on <strong>July 29</strong> — 22.23.2, 24.18.1, 26.5.1, <strong>eleven CVEs</strong> combined, three HIGH. For most setups, the patch arrives via the container base image. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Ruflo MCP Bridge</strong>: CVE-2026-59726, <strong>CVSS 10.0</strong>, code execution with no login required — <strong>233 tools</strong> open to the network by default. Fixed in 3.16.3. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Shared Claude chats</strong> ended up in Google, Bing, and Brave because the pages were missing <code>noindex</code> — discoverable via <code>site:claude.ai/share</code>. Anthropic disputes it. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Deadline today</strong>: CVE-2026-16812 in Arista VeloCloud Orchestrator, CVSS 10.0, actively exploited. Next reported deadline <strong>Tuesday</strong>: the WordPress chain wp2shell — date inconsistent across sources. <span class=\"chip\">USA</span></li>\n      <li><span class=\"chip\">Release</span> <strong>JDK 28</strong>: Valhalla's value classes as a preview — <strong>197,000 lines</strong> across 1,816 files. Plus a JSON API in the incubator and the end of the macOS/x64 port. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">OSS</span> <strong>Bundestag legal opinion</strong>: German public agencies may require open source in tenders — if the reasoning is factual, proportionate, and documented. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip good\">Infra</span> <strong>Banco do Brasil</strong>: <strong>43,000 ATMs</strong> on SUSE Linux Enterprise plus the Open Build Service. The percentage figures are vendor numbers. <span class=\"chip\">BR</span></li>\n      <li><span class=\"chip\">Browser</span> <strong>Firefox 153</strong> (July 21) ships Containers built in — a follow-up to yesterday, now confirmed by the primary source. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Revolut</strong>: 75 million records offered for $500; none of the sample's identifiers match a real account. <span class=\"chip\">EU</span></li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Três das histórias de segurança de hoje não têm, no fundo, um erro de programação — têm uma configuração padrão. Na MCP Bridge do Ruflo, a porta está aberta porque vem aberta por padrão — 233 ferramentas acionáveis, acesso a shell incluído, sem login. Nos links de compartilhamento do Claude, faltava a única tag que mantém os buscadores afastados. No Node.js, o limite de memória para HTTP/2 não é um limite. Some a isso a maior mudança de linguagem do Java em uma década e dois prazos regulatórios, um dos quais vence hoje.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>Node.js</strong>: os releases de segurança anunciados saíram em <strong>29/07</strong> — 22.23.2, 24.18.1, 26.5.1, juntos <strong>onze CVEs</strong>, três HIGH. Na maioria dos casos, o patch chega pela imagem base do container. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Ruflo MCP Bridge</strong>: CVE-2026-59726, <strong>CVSS 10,0</strong>, execução de código sem login — <strong>233 ferramentas</strong> abertas na rede por padrão. Correção na 3.16.3. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Chats compartilhados do Claude</strong> foram parar no Google, Bing e Brave porque faltava <code>noindex</code> nas páginas — encontráveis via <code>site:claude.ai/share</code>. A Anthropic contesta. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Prazo hoje</strong>: CVE-2026-16812 no Arista VeloCloud Orchestrator, CVSS 10,0, ativamente explorada. Próximo prazo divulgado <strong>terça-feira</strong>: a cadeia wp2shell do WordPress — data inconsistente entre fontes. <span class=\"chip\">EUA</span></li>\n      <li><span class=\"chip\">Release</span> <strong>JDK 28</strong>: as value classes do Valhalla como preview — <strong>197.000 linhas</strong> em 1.816 arquivos. Além de uma API JSON no incubator e o fim da porta macOS/x64. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">OSS</span> <strong>Parecer do Bundestag</strong>: órgãos públicos alemães podem exigir código aberto em licitações — se a justificativa for objetiva, proporcional e documentada. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip good\">Infra</span> <strong>Banco do Brasil</strong>: <strong>43.000 caixas eletrônicos</strong> no SUSE Linux Enterprise, mais o Open Build Service. Os percentuais são números do fabricante. <span class=\"chip\">BR</span></li>\n      <li><span class=\"chip\">Browser</span> <strong>Firefox 153</strong> (21/07) traz Containers nativo — retomada de ontem, agora confirmado pela fonte primária. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Revolut</strong>: 75 milhões de registros oferecidos por US$ 500; nenhum identificador da amostra corresponde a uma conta real. <span class=\"chip\">UE</span></li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Tres de las historias de seguridad de hoy no tienen en el fondo un error de programación, sino una configuración predeterminada. En el MCP Bridge de Ruflo, la puerta está abierta porque viene abierta por defecto — 233 herramientas invocables, acceso a shell incluido, sin inicio de sesión. En los enlaces para compartir de Claude, faltaba la única etiqueta que mantiene alejados a los buscadores. En Node.js, el límite de memoria para HTTP/2 no es un límite. A eso se suma el mayor cambio de lenguaje de Java en una década y dos plazos regulatorios, uno de los cuales vence hoy.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>Node.js</strong>: los releases de seguridad anunciados salieron el <strong>29/07</strong> — 22.23.2, 24.18.1, 26.5.1, en conjunto <strong>once CVEs</strong>, tres HIGH. En la mayoría de los casos, el parche llega a través de la imagen base del contenedor. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Ruflo MCP Bridge</strong>: CVE-2026-59726, <strong>CVSS 10,0</strong>, ejecución de código sin inicio de sesión — <strong>233 herramientas</strong> abiertas a la red por defecto. Corregido en 3.16.3. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Chats compartidos de Claude</strong> terminaron en Google, Bing y Brave porque a las páginas les faltaba <code>noindex</code> — localizables mediante <code>site:claude.ai/share</code>. Anthropic lo desmiente. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Plazo hoy</strong>: CVE-2026-16812 en Arista VeloCloud Orchestrator, CVSS 10,0, explotada activamente. Próximo plazo reportado <strong>el martes</strong>: la cadena wp2shell de WordPress — fecha inconsistente según la fuente. <span class=\"chip\">EE. UU.</span></li>\n      <li><span class=\"chip\">Release</span> <strong>JDK 28</strong>: las value classes de Valhalla como preview — <strong>197.000 líneas</strong> en 1.816 archivos. Además, una API JSON en el incubator y el fin del port macOS/x64. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">OSS</span> <strong>Dictamen del Bundestag</strong>: las dependencias públicas alemanas pueden exigir código abierto en licitaciones — si la justificación es objetiva, proporcional y está documentada. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip good\">Infra</span> <strong>Banco do Brasil</strong>: <strong>43.000 cajeros automáticos</strong> con SUSE Linux Enterprise más Open Build Service. Las cifras porcentuales son del fabricante. <span class=\"chip\">BR</span></li>\n      <li><span class=\"chip\">Browser</span> <strong>Firefox 153</strong> (21/07) trae Containers integrado — seguimiento de ayer, ahora confirmado con fuente primaria. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Revolut</strong>: 75 millones de registros ofrecidos por US$ 500; ningún identificador de la muestra corresponde a una cuenta real. <span class=\"chip\">UE</span></li>\n    </ul></div>"
      }

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Gestern Abend warfen die Claude-Modelle Fehler, und heute stehen zwei Zahlen dazu im Netz: „rund drei Stunden\" in der Presse und ein Zeitfenster von 101 Minuten in Anthropics eigenem Vorfall-Protokoll. Beide sind richtig — sie beschreiben verschiedene Dinge, und nur eine davon taugt für die Nachschau deiner eigenen abgebrochenen Läufe. Dazu hat OpenAI in der Codex-CLI still die Schicht aufgezogen, die MCP bewusst offen lässt: Paketierung und Marktplatz für Agenten-Werkzeuge. Und ein Benchmark-Board erklärt sich heute selbst für gesättigt.</p>\n    <ul>\n      <li><span class=\"chip hot\">Claude</span> <strong>Der Vorfall, datiert</strong>: Anthropics Statusarchiv führt für den <strong>29.07.</strong> den Eintrag <em>„Elevated errors across all models\"</em> — Ticket von <span class=\"stat\">19:49</span> bis <span class=\"stat\">22:36 UTC</span>. Das gemessene Fehlerfenster nennt Anthropic selbst enger: <span class=\"stat\">19:45–21:26 UTC</span>, also <span class=\"stat\">101 Minuten</span>. Bei dir in Ribeirão Claro war das 16:45–18:26.</li>\n      <li><span class=\"chip\">Claude</span> <strong>Was die Primärquelle <em>nicht</em> sagt</strong>: Der Eintrag nennt <em>„Claude models\"</em> als betroffen — keine Aufschlüsselung nach claude.ai, API und Claude Code. Diese Dreiteilung stammt aus Sekundärberichten, nicht aus dem Protokoll.</li>\n      <li><span class=\"chip hot\">OpenAI</span> <strong>Codex CLI v0.146.0 (29.07.)</strong>: <em>„Agent Plugins manifests, workspace plugin publishing\"</em> plus weitere Plugin-Marktplätze. Dazu Sitzungsnamen und angepinnte Threads. Heute liegt schon <code>v0.147.0-alpha.2</code> nach.</li>\n      <li><span class=\"chip\">MCP</span> <strong>Frage von gestern geschlossen</strong>: Die Versionierungsseite sagt heute <em>„The current protocol version is 2026-07-28\"</em>. Das Etikett ist nachgezogen — wer sein SDK an dieser Zeile festmacht, darf jetzt umschalten.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>Ein Board erklärt sich selbst für gesättigt</strong>: benchlm.ai schreibt zu SWE-Bench Verified, die Spitzenmodelle lägen <em>„clustered within 1.0 points, suggesting this benchmark is nearing saturation\"</em>. Führend dort: Opus 5 mit <span class=\"stat\">96 %</span>.</li>\n      <li><span class=\"chip\">Bench</span> <strong>llm-stats hat heute neu datiert — und nichts nachgetragen</strong>: weiter <span class=\"stat\">0</span> verifizierte gegen <span class=\"stat\">104</span> selbstberichtete Einträge, weiter kein Opus 5, kein Mythos 5, kein Kimi K3, kein Grok 4.5. Der Abdeckungsunterschied von gestern schließt sich nicht.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Der Gegen-Maßstab spreizt noch</strong>: Im Artificial-Analysis-Index liegen die Top 10 laut benchlm über <span class=\"stat\">7,3</span> Punkte auseinander — Opus 5 <span class=\"stat\">60,7</span>, Kimi K3 <span class=\"stat\">57,1</span>. Wo SWE-Bench nur noch Rauschen trennt, trennt der breitere Index noch.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Korrektur zu gestern</strong>: Clines Changelog ist doch datiert — <code>v4.0.10</code> vom <strong>20.07.</strong>, <code>v4.0.11</code> vom <strong>24.07.</strong>, letzteres mit einem Fix für nativen Tool-Aufruf bei Kimi K3 (vorher leere Antworten).</li>\n      <li><span class=\"chip\">Tool</span> <strong>Cursor läuft jetzt auf dem iPad</strong> (29.07.) — die erste Bewegung dort seit dem Indien-Tarif vom 28.07. Aiders Rangliste steht unverändert auf dem <strong>20.11.2025</strong>.</li>\n      <li><span class=\"chip\">Local</span> <strong>DeepSeek V4 „allgemein verfügbar\": noch keine Tatsache</strong>. Aggregatoren melden GA am 20.07. samt Spitzenlast-Tarif; DeepSeeks eigenes Änderungsprotokoll führt weiter nur den Preview-Eintrag vom <strong>24.04.</strong></li>\n    </ul></div>",

i><span class=\"chip hot\">Bench</span> <strong>Ein Board erklärt sich selbst für gesättigt</strong>: benchlm.ai schreibt zu SWE-Bench Verified, die Spitzenmodelle lägen <em>„clustered within 1.0 points, suggesting this benchmark is nearing saturation\"</em>. Führend dort: Opus 5 mit <span class=\"stat\">96 %</span>.</li>\n      <li><span class=\"chip\">Bench</span> <strong>llm-stats hat heute neu datiert — und nichts nachgetragen</strong>: weiter <span class=\"stat\">0</span> verifizierte gegen <span class=\"stat\">104</span> selbstberichtete Einträge, weiter kein Opus 5, kein Mythos 5, kein Kimi K3, kein Grok 4.5. Der Abdeckungsunterschied von gestern schließt sich nicht.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Der Gegen-Maßstab spreizt noch</strong>: Im Artificial-Analysis-Index liegen die Top 10 laut benchlm über <span class=\"stat\">7,3</span> Punkte auseinander — Opus 5 <span class=\"stat\">60,7</span>, Kimi K3 <span class=\"stat\">57,1</span>. Wo SWE-Bench nur noch Rauschen trennt, trennt der breitere Index noch.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Korrektur zu gestern</strong>: Clines Changelog ist doch datiert — <code>v4.0.10</code> vom <strong>20.07.</strong>, <code>v4.0.11</code> vom <strong>24.07.</strong>, letzteres mit einem Fix für nativen Tool-Aufruf bei Kimi K3 (vorher leere Antworten).</li>\n      <li><span class=\"chip\">Tool</span> <strong>Cursor läuft jetzt auf dem iPad</strong> (29.07.) — die erste Bewegung dort seit dem Indien-Tarif vom 28.07. Aiders Rangliste steht unverändert auf dem <strong>20.11.2025</strong>.</li>\n      <li><span class=\"chip\">Local</span> <strong>DeepSeek V4 „allgemein verfügbar\": noch keine Tatsache</strong>. Aggregatoren melden GA am 20.07. samt Spitzenlast-Tarif; DeepSeeks eigenes Änderungsprotokoll führt weiter nur den Preview-Eintrag vom <strong>24.04.</strong></li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Last night the Claude models started throwing errors, and today two different numbers describe it: \"roughly three hours\" in the press, and a 101-minute window in Anthropic's own incident log. Both are correct — they describe different things, and only one of them is useful for reviewing your own failed runs. Meanwhile OpenAI quietly built out, in the Codex CLI, the layer MCP deliberately leaves open: packaging and a marketplace for agent tools. And a benchmark board today declares itself saturated.</p>\n    <ul>\n      <li><span class=\"chip hot\">Claude</span> <strong>The incident, dated</strong>: Anthropic's status archive logs an entry for <strong>Jul 29</strong> titled <em>\"Elevated errors across all models\"</em> — ticket open from <span class=\"stat\">19:49</span> to <span class=\"stat\">22:36 UTC</span>. Anthropic itself names a tighter measured error window: <span class=\"stat\">19:45–21:26 UTC</span>, i.e. <span class=\"stat\">101 minutes</span>. For you in Ribeirão Claro, that was 16:45–18:26.</li>\n      <li><span class=\"chip\">Claude</span> <strong>What the primary source <em>doesn't</em> say</strong>: The entry names <em>\"Claude models\"</em> as affected — no breakdown by claude.ai, API, and Claude Code. That three-way split comes from secondary reporting, not the log.</li>\n      <li><span class=\"chip hot\">OpenAI</span> <strong>Codex CLI v0.146.0 (Jul 29)</strong>: <em>\"Agent Plugins manifests, workspace plugin publishing\"</em> plus additional plugin marketplaces. Also session names and pinned threads. Today, <code>v0.147.0-alpha.2</code> is already out.</li>\n      <li><span class=\"chip\">MCP</span> <strong>Yesterday's question, closed</strong>: The versioning page today says <em>\"The current protocol version is 2026-07-28\"</em>. The label has caught up — anyone gating their SDK on that line can now switch over.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>A board declares itself saturated</strong>: benchlm.ai writes of SWE-Bench Verified that the top models are <em>\"clustered within 1.0 points, suggesting this benchmark is nearing saturation\"</em>. Leading there: Opus 5 at <span class=\"stat\">96%</span>.</li>\n      <li><span class=\"chip\">Bench</span> <strong>llm-stats re-dated today — and added nothing</strong>: still <span class=\"stat\">0</span> verified against <span class=\"stat\">104</span> self-reported entries, still no Opus 5, no Mythos 5, no Kimi K3, no Grok 4.5. Yesterday's coverage gap hasn't closed.</li>\n      <li><span class=\"chip\">Bench</span> <strong>The counter-benchmark still spreads out</strong>: In the Artificial Analysis Index, the top 10 span <span class=\"stat\">7.3</span> points per benchlm — Opus 5 <span class=\"stat\">60.7</span>, Kimi K3 <span class=\"stat\">57.1</span>. Where SWE-Bench separates only noise, the broader index still separates models.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Correction to yesterday</strong>: Cline's changelog is dated after all — <code>v4.0.10</code> from <strong>Jul 20</strong>, <code>v4.0.11</code> from <strong>Jul 24</strong>, the latter with a fix for native tool calling on Kimi K3 (previously empty responses).</li>\n      <li><span class=\"chip\">Tool</span> <strong>Cursor now runs on iPad</strong> (Jul 29) — the first movement there since the India pricing tier on Jul 28. Aider's leaderboard remains unchanged at <strong>Nov 20, 2025</strong>.</li>\n      <li><span class=\"chip\">Local</span> <strong>DeepSeek V4 \"generally available\": still not a fact</strong>. Aggregators report GA on Jul 20 along with a peak-hour pricing tier; DeepSeek's own changelog still lists only the preview entry from <strong>Apr 24</strong>.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Ontem à noite os modelos Claude começaram a apresentar erros, e hoje há dois números diferentes circulando sobre isso: \"cerca de três horas\" na imprensa e uma janela de 101 minutos no próprio registro de incidentes da Anthropic. Os dois estão certos — descrevem coisas diferentes, e só um deles serve para você revisar suas próprias execuções interrompidas. Além disso, a OpenAI construiu silenciosamente, no Codex CLI, a camada que o MCP deixa deliberadamente em aberto: empacotamento e um marketplace para ferramentas de agentes. E um board de benchmark hoje se declara saturado.</p>\n    <ul>\n      <li><span class=\"chip hot\">Claude</span> <strong>O incidente, datado</strong>: o arquivo de status da Anthropic registra, para <strong>29/07</strong>, o item <em>\"Elevated errors across all models\"</em> — chamado aberto de <span class=\"stat\">19:49</span> a <span class=\"stat\">22:36 UTC</span>. A própria Anthropic aponta uma janela de erro medida mais estreita: <span class=\"stat\">19:45–21:26 UTC</span>, ou seja, <span class=\"stat\">101 minutos</span>. Para você em Ribeirão Claro, isso foi 16:45–18:26.</li>\n      <li><span class=\"chip\">Claude</span> <strong>O que a fonte primária <em>não</em> diz</strong>: o registro cita <em>\"Claude models\"</em> como afetados — sem discriminar claude.ai, API e Claude Code. Essa divisão em três vem de reportagens secundárias, não do registro.</li>\n      <li><span class=\"chip hot\">OpenAI</span> <strong>Codex CLI v0.146.0 (29/07)</strong>: <em>\"Agent Plugins manifests, workspace plugin publishing\"</em> mais outros marketplaces de plugins. Além de nomes de sessão e threads fixados. Hoje já saiu a <code>v0.147.0-alpha.2</code>.</li>\n      <li><span class=\"chip\">MCP</span> <strong>Pergunta de ontem, encerrada</strong>: a página de versionamento hoje diz <em>\"The current protocol version is 2026-07-28\"</em>. O rótulo foi atualizado — quem trava o SDK nessa linha já pode migrar.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>Um board se declara saturado</strong>: o benchlm.ai escreve sobre o SWE-Bench Verified que os modelos de ponta estão <em>\"clustered within 1.0 points, suggesting this benchmark is nearing saturation\"</em>. Líder ali: Opus 5 com <span class=\"stat\">96 %</span>.</li>\n      <li><span class=\"chip\">Bench</span> <strong>O llm-stats redatou hoje — e não acrescentou nada</strong>: seguem <span class=\"stat\">0</span> verificados contra <span class=\"stat\">104</span> autorreportados, seguem sem Opus 5, sem Mythos 5, sem Kimi K3, sem Grok 4.5. A diferença de cobertura de ontem não fecha.</li>\n      <li><span class=\"chip\">Bench</span> <strong>O contraponto ainda se espalha</strong>: no Artificial Analysis Index, o top 10 varia mais de <span class=\"stat\">7,3</span> pontos segundo o benchlm — Opus 5 <span class=\"stat\">60,7</span>, Kimi K3 <span class=\"stat\">57,1</span>. Onde o SWE-Bench já só separa ruído, o índice mais amplo ainda separa.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Correção de ontem</strong>: o changelog do Cline afinal tem data — <code>v4.0.10</code> de <strong>20/07</strong>, <code>v4.0.11</code> de <strong>24/07</strong>, esta última com uma correção para chamada nativa de ferramentas no Kimi K3 (antes retornava respostas vazias).</li>\n      <li><span class=\"chip\">Tool</span> <strong>O Cursor agora roda no iPad</strong> (29/07) — o primeiro movimento por lá desde o plano indiano de 28/07. O ranking do Aider segue inalterado em <strong>20/11/2025</strong>.</li>\n      <li><span class=\"chip\">Local</span> <strong>DeepSeek V4 \"geralmente disponível\": ainda não é fato</strong>. Agregadores relatam GA em 20/07, com tarifa de horário de pico; o próprio changelog da DeepSeek segue mostrando apenas o item de pré-visualização de <strong>24/04</strong>.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Anoche los modelos de Claude empezaron a arrojar errores, y hoy circulan dos cifras distintas al respecto: \"unas tres horas\" en la prensa y una ventana de 101 minutos en el propio registro de incidentes de Anthropic. Ambas son correctas — describen cosas distintas, y solo una de ellas sirve para revisar tus propias ejecuciones interrumpidas. Además, OpenAI construyó en silencio, dentro del Codex CLI, la capa que MCP deja deliberadamente abierta: empaquetado y un marketplace para herramientas de agentes. Y un board de benchmarks hoy se declara a sí mismo saturado.</p>\n    <ul>\n      <li><span class=\"chip hot\">Claude</span> <strong>El incidente, con fecha</strong>: el archivo de estado de Anthropic registra, para el <strong>29/07</strong>, la entrada <em>\"Elevated errors across all models\"</em> — ticket abierto de <span class=\"stat\">19:49</span> a <span class=\"stat\">22:36 UTC</span>. La propia Anthropic señala una ventana de error medida más estrecha: <span class=\"stat\">19:45–21:26 UTC</span>, es decir, <span class=\"stat\">101 minutos</span>. Para ti en Ribeirão Claro, eso fue de 16:45 a 18:26.</li>\n      <li><span class=\"chip\">Claude</span> <strong>Lo que la fuente primaria <em>no</em> dice</strong>: la entrada nombra a <em>\"Claude models\"</em> como afectados — sin desglose entre claude.ai, la API y Claude Code. Esa división en tres viene de reportes secundarios, no del registro.</li>\n      <li><span class=\"chip hot\">OpenAI</span> <strong>Codex CLI v0.146.0 (29/07)</strong>: <em>\"Agent Plugins manifests, workspace plugin publishing\"</em> más otros marketplaces de plugins. Además, nombres de sesión e hilos anclados. Hoy ya salió la <code>v0.147.0-alpha.2</code>.</li>\n      <li><span class=\"chip\">MCP</span> <strong>Pregunta de ayer, cerrada</strong>: la página de versionado hoy dice <em>\"The current protocol version is 2026-07-28\"</em>. La etiqueta ya se actualizó — quien tenga su SDK atado a esa línea puede cambiar ahora.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>Un board se declara saturado</strong>: benchlm.ai escribe sobre SWE-Bench Verified que los modelos de punta están <em>\"clustered within 1.0 points, suggesting this benchmark is nearing saturation\"</em>. Líder ahí: Opus 5 con <span class=\"stat\">96 %</span>.</li>\n      <li><span class=\"chip\">Bench</span> <strong>llm-stats cambió la fecha hoy — y no añadió nada</strong>: sigue con <span class=\"stat\">0</span> verificados contra <span class=\"stat\">104</span> autorreportados, sigue sin Opus 5, sin Mythos 5, sin Kimi K3, sin Grok 4.5. La diferencia de cobertura de ayer no se cierra.</li>\n      <li><span class=\"chip\">Bench</span> <strong>El contraste sigue abierto</strong>: en el Artificial Analysis Index, el top 10 se separa por más de <span class=\"stat\">7,3</span> puntos según benchlm — Opus 5 <span class=\"stat\">60,7</span>, Kimi K3 <span class=\"stat\">57,1</span>. Donde SWE-Bench ya solo separa ruido, el índice más amplio todavía separa.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Corrección de ayer</strong>: el changelog de Cline sí tiene fecha — <code>v4.0.10</code> del <strong>20/07</strong>, <code>v4.0.11</code> del <strong>24/07</strong>, esta última con una corrección para la llamada nativa de herramientas en Kimi K3 (antes devolvía respuestas vacías).</li>\n      <li><span class=\"chip\">Tool</span> <strong>Cursor ahora corre en iPad</strong> (29/07) — el primer movimiento ahí desde la tarifa para India del 28/07. La tabla de Aider sigue sin cambios, fechada el <strong>20/11/2025</strong>.</li>\n      <li><span class=\"chip\">Local</span> <strong>DeepSeek V4 \"disponible de forma general\": todavía no es un hecho</strong>. Los agregadores reportan disponibilidad general el 20/07, con tarifa de hora pico; el propio changelog de DeepSeek sigue mostrando solo la entrada de vista previa del <strong>24/04</strong>.</li>\n    </ul></div>"
