<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daniels Morning Briefs</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="lib/tokens.css">
<script>
  // Pre-paint animation policy (mirrors the terminal core / pagr): an explicit
  // "off" in localStorage — or no pick while the OS prefers reduced motion —
  // marks html.anim-off so components.css kills keyframes (incl. the brand
  // cursor blink) with no flash. The footer anim toggle persists "on"/"off".
  (function () {
    let pref = null;
    try { pref = localStorage.getItem('anim'); } catch (_) {}
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (pref === 'off' || (pref === null && reduced)) {
      document.documentElement.classList.add('anim-off');
    }
  })();
  // Resolution-independent zoom (mirrors pagr): lay out at a 1920px reference, then
  // scale the whole view up on wider screens — a true zoom of everything, never below
  // 1×. Pre-paint to avoid a flash.
  (function () {
    var applyZoom = function () {
      document.documentElement.style.zoom = String(Math.max(1, window.innerWidth / 1920));
    };
    applyZoom();
    window.addEventListener('resize', applyZoom);
  })();
</script>
<style>
  /* Dashboard chrome styles. Design tokens (colours, shadow, typography vars)
     come from lib/tokens.css — keep them there so the dashboard and the
     newsletter content stay in sync. */
  * { box-sizing: border-box; }
  /* Lock the outer document — only inner scroll containers (the .home view
     and the iframe) handle scrolling. Without this, a tiny mismatch between
     header.app + .app-shell heights and 100vh adds a few pixels of overflow
     to <html>, producing a second outer scrollbar alongside the one inside
     .home. overflow: hidden on both html and body kills that outer track. */
  html, body {
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    height: 100%;
    overflow: hidden;
  }
  html { position: relative; }

  /* Paper-grain noise overlay — same texture as the newsletter pages.
     Imperceptible up close, breaks LCD flatness at distance. Disabled under
     reduced-motion / high-contrast preferences. */
  html::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image: none;
    opacity: 0.04;
    mix-blend-mode: multiply;
  }
  @media (prefers-reduced-motion: reduce), (prefers-contrast: more) {
    html::before { display: none; }
  }
  body > *, header.app { position: relative; z-index: 1; }
  body {
    font-family: var(--font-body);
    line-height: 1.5;
    font-size: 15px;
    font-feature-settings: "kern", "liga", "onum";
    -webkit-font-smoothing: antialiased;
  }

  /* Terminal header bar — mirrors the pagr/seedr chrome: a single row on a
     --card surface with a --border bottom rule. LEFT: the brand wordmark
     (mono + .glow) and a blinking .cursor-block. RIGHT: the nav-rail minimize
     toggle. */
  header.app {
    border-bottom: 1px solid var(--border);
    background: var(--card);
    font-family: var(--font-mono); /* chrome is terminal mono; the content stays serif */
    /* Lift the header above the content, which is also a positioned body child
       at z-index 1 and would otherwise paint over it. */
    z-index: 50;
    padding: 0 1rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    min-height: 3rem;
  }
  /* LEFT zone — brand only. */
  .header-left {
    display: flex;
    align-items: center;
    flex: none;
    min-width: 0;
  }
  .header-brand {
    display: inline-flex;
    align-items: center;
    flex: none;
    text-decoration: none;
    cursor: pointer;
  }
  .header-brand .brand-word {
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: -0.01em;
  }

  /* RIGHT zone — the nav-rail minimize toggle, pushed to the far right
     (the header has no center zone). */
  .header-right {
    flex: none;
    margin-left: auto;
    display: flex;
    align-items: center;
  }

  /* Layout: two columns — flexible main + a fixed-width nav-rail on the right.
     The fixed footer is 2rem tall, so the shell is the viewport minus the
     header (3rem) and the footer (2rem). When the rail is collapsed the
     --rail-w track narrows to the icon-only strip. */
  .app-shell {
    display: grid;
    grid-template-columns: minmax(0, 1fr) var(--rail-w, 16rem);
    height: calc(100vh - 3rem - 2rem);
    height: calc(100dvh - 3rem - 2rem);
  }
  .app-shell.rail-collapsed { --rail-w: 3rem; }

  /* The nav lives in the sticky right sidebar (.nav-rail). It holds the
     Übersicht control (#home-btn) and #nav-groups (the grouped category nav,
     populated by JS). */
  .nav-label {
    font-family: var(--font-mono);
    font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--muted-foreground); padding: 0.5rem 0.85rem 0.2rem; font-weight: 600;
  }
  #nav-groups { padding-bottom: 0.2rem; }

  .cat {
    margin: 0;
    border-radius: 0;
    overflow: hidden;
    border: 0;
  }
  .cat-head {
    display: flex; align-items: center; gap: 0.55rem;
    padding: 0.45rem 0.85rem;
    cursor: pointer;
    border-radius: 0;
    transition: background 120ms;
    min-height: 2.1rem;
  }
  .cat-head:hover { background: var(--muted); }
  .cat-head:hover .cat-name { color: var(--primary); }
  .cat.active .cat-head { background: var(--muted); }
  .cat.active .cat-name { color: var(--primary); }
  .cat-color { width: 6px; height: 18px; border-radius: 0; flex: none; }
  .cat-name {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 0.8rem;
    color: var(--foreground);
    transition: color 0.15s ease;
    flex: 1;
    /* Single-line; ellipsise rather than wrap to two lines. */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .cat-icon { font-size: 1.05rem; }
  .cat-latest {
    font-family: var(--font-mono);
    font-size: 0.68rem; color: var(--soft);
    font-feature-settings: "tnum"; font-weight: 500;
  }
  .cat-toggle {
    background: transparent; border: none;
    color: var(--soft); cursor: pointer;
    transition: transform 150ms ease, background 120ms, color 120ms;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    padding: 0.55rem 0.7rem;
    border-radius: var(--radius-inline);
    line-height: 1;
    min-height: 2.25rem; min-width: 2.25rem;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .cat-toggle:hover { background: var(--rule-soft); color: var(--fg); }
  .cat.open > .cat-head .cat-toggle { transform: rotate(90deg); }

  .cat-dates { display: none; padding: 0.15rem 0.7rem 0.4rem 1.45rem; }

  .cat.open .cat-dates { display: block; }
  /* The category dropdown holds only the archive month-picker: days with a
     brief are clickable (ringed in the category accent), the selected day is
     filled, hovering one previews its title. Border + marks use the
     per-category --cat-accent scoped on the .cat row. */
  .cat-cal {
    margin: 0.2rem 0;
    padding: 0.5rem;
    border: 1px solid var(--cat-accent);
    border-radius: 6px;
    background: var(--rule-soft);
  }
  .cal-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 0.45rem;
  }
  .cal-title {
    font-family: var(--font-mono); font-size: 0.74rem;
    font-weight: 600; color: var(--fg);
  }
  .cal-nav {
    width: 1.7rem; height: 1.7rem; line-height: 1;
    background: transparent; border: 1px solid var(--rule); border-radius: 4px;
    color: var(--muted-ink); font-size: 0.95rem; cursor: pointer;
    transition: color 120ms, border-color 120ms;
  }
  .cal-nav:hover:not(:disabled) { color: var(--fg); border-color: var(--soft); }
  .cal-nav:focus-visible { outline: 2px solid var(--cat-accent, var(--fg)); outline-offset: 2px; }
  .cal-nav:disabled { opacity: 0.3; cursor: default; }
  .cal-week, .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
  }
  .cal-week { margin-bottom: 3px; }
  .cal-week span {
    text-align: center; font-family: var(--font-mono);
    font-size: 0.58rem; color: var(--muted-ink);
  }
  .cal-day {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 0.7rem;
    border-radius: 4px; color: var(--soft);
    font-feature-settings: "tnum";
  }
  .cal-day.none { color: var(--rule); }
  .cal-day.blank { visibility: hidden; }
  .cal-day.has {
    color: var(--fg); font-weight: 600; cursor: pointer; text-decoration: none;
    background: var(--panel);
    box-shadow: inset 0 0 0 1px var(--cat-accent);
    transition: background 100ms, color 100ms;
  }
  .cal-day.has:hover, .cal-day.has:focus-visible,
  .cal-day.has.current {
    background: var(--cat-accent); color: #fff; outline: none;
  }
  .cal-preview {
    margin-top: 0.5rem; padding-top: 0.45rem;
    border-top: 1px solid var(--rule);
    font-family: var(--font-body); font-size: 0.72rem;
    color: var(--muted-ink); line-height: 1.35; min-height: 1.7rem;
  }
  /* ────────────────────────────────────────────────────────────────────
     Fixed footer status bar — mirrors the pagr/seedr StatusBar: a 2rem bar
     pinned to the viewport bottom on a --card surface with a --border top
     rule. LEFT: `[briefs] reader@briefs:~/path` status line. RIGHT: the
     relocated controls (theme menu, language menu) + an anim toggle.
     ──────────────────────────────────────────────────────────────────── */
  footer.status-bar {
    position: fixed;
    inset-inline: 0;
    bottom: 0;
    z-index: 60;
    height: 2rem;
    border-top: 1px solid var(--border);
    background: var(--card);
    font-family: var(--font-mono); /* chrome is terminal mono */
    font-size: 11px;
  }
  .status-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    height: 100%;
    padding: 0 0.85rem;
  }
  .status-path {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted-foreground);
  }
  .status-path .status-tag { color: var(--primary); }
  .status-path .status-loc { color: var(--foreground); }
  .status-controls {
    display: flex;
    align-items: center;
    gap: 1.1rem;
    flex: none;
  }
  .status-sep { height: 0.9rem; width: 1px; background: var(--border); flex: none; }

  /* Footer control buttons — flat, muted, warm to --primary on hover. No
     boxes, no shadows; terminal-plain. */
  .status-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: inherit;
    line-height: 1;
    color: var(--muted-foreground);
    text-decoration: none;
    background: none;
    border: 0;
    border-radius: 0;
    padding: 0;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .status-btn:hover { color: var(--primary); }

  /* Theme + language dropdowns reuse the core .dropdown / .dropdown-panel /
     .dropdown-item primitives. The summary mirrors .status-btn. */
  .status-controls .dropdown > summary { font: inherit; }
  /* Settings icons (.dd-dot theme indicator, .dd-flag language flags) come from
     the shared @danieldeusing/design components.css — no local copy here. */

  /* Anim toggle — `[x] anim` / `[ ] anim`, mirroring pagr's footer toggle. */
  .anim-toggle { white-space: nowrap; }
  .anim-toggle[aria-pressed="true"] .anim-box { color: var(--primary); }

  /* Language picker — the trigger anchors the upward dropdown menu. The menu
     reuses the core .dropdown-panel (absolute, opens above, right-aligned),
     toggled open/closed via the [hidden] attribute by the existing JS. */
  .lang-picker { position: relative; }
  .lang-caret { font-size: 0.6rem; margin-left: 0.1rem; }
  .lang-menu[hidden] { display: none; }
  .lang-option[aria-selected="true"] {
    color: var(--primary);
    text-shadow: 0 0 8px var(--glow);
  }

  .cat-empty {
    font-family: var(--font-mono);
    font-size: 0.7rem; color: var(--soft);
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 0.5rem 0.6rem;
  }

  /* Main area — full width, fills the shell (viewport minus header + footer). */
  .main {
    overflow: hidden;
    background: var(--bg);
    position: relative;
    height: 100%;
  }
  .iframe-host { width: 100%; height: 100%; border: none; background: var(--bg); }

  /* ────────────────────────────────────────────────────────────────────
     Sticky right sidebar (.nav-rail) — terminal mono, --card surface with a
     --border left rule, full shell height with its own scroll. Holds the
     Übersicht control + the grouped category nav. Collapses to a 3rem icon-
     only strip; the width animates via the grid track on .app-shell.
     ──────────────────────────────────────────────────────────────────── */
  .nav-rail {
    grid-column: 2;
    font-family: var(--font-mono);
    background: var(--card);
    border-left: 1px solid var(--border);
    height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 2;
  }
  .nav-rail-head {
    display: flex;
    align-items: center;
    min-height: 2.1rem;
    padding: 0.4rem 0.85rem;
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .nav-rail-title {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 600;
    color: var(--muted-foreground);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-rail-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0.3rem 0 0.4rem;
  }

  /* Minimize toggle — the `»`/`«` chevron in the header right zone. Flat, muted,
     warm to --primary on hover (terminal-plain, no box). */
  .rail-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    flex: none;
    background: none;
    border: 0;
    border-radius: 0;
    color: var(--muted-foreground);
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 1rem;
    line-height: 1;
    transition: color 0.15s ease;
  }
  .rail-toggle:hover { color: var(--primary); }
  /* Expanded → `»` (collapse-to-right); collapsed → `«` (re-open). The button's
     aria-expanded drives the glyph; JS rewrites the text content too as a fallback. */
  .rail-toggle[aria-expanded="false"] .rail-toggle-glyph::before { content: "«"; }
  .rail-toggle[aria-expanded="true"]  .rail-toggle-glyph::before { content: "»"; }
  .rail-toggle-glyph { font-size: 0; }
  .rail-toggle-glyph::before { font-size: 1rem; }

  /* Collapsed strip — keep only the per-category accent bar + icon, hide labels,
     calendars and the home wordmark. The 3rem track clips the rest. */
  .app-shell.rail-collapsed .nav-rail-title,
  .app-shell.rail-collapsed .nav-label,
  .app-shell.rail-collapsed .cat-name,
  .app-shell.rail-collapsed .cat-latest,
  .app-shell.rail-collapsed .cat-toggle,
  .app-shell.rail-collapsed .cat-dates,
  .app-shell.rail-collapsed .home-btn .nav-label-text,
  .app-shell.rail-collapsed .home-btn .brand-mark {
    display: none;
  }
  .app-shell.rail-collapsed .nav-rail-head { justify-content: center; padding: 0.4rem 0; }
  .app-shell.rail-collapsed .cat-head,
  .app-shell.rail-collapsed .home-btn {
    justify-content: center;
    padding-left: 0;
    padding-right: 0;
    gap: 0;
  }
  .app-shell.rail-collapsed .cat-color,
  .app-shell.rail-collapsed .home-btn .cat-color { margin-right: 0.4rem; }

  /* The width transition reads off the grid track; animate it. */
  .app-shell { transition: grid-template-columns 0.18s ease; }
  @media (prefers-reduced-motion: reduce) {
    .app-shell { transition: none; }
  }

  /* Mobile re-open button (a floating ☰); shown only when the rail is an
     off-canvas drawer (≤720px). Hidden on desktop. */
  .rail-fab {
    display: none;
    position: fixed;
    right: 0.75rem;
    bottom: 2.6rem;
    z-index: 55;
    width: 2.6rem;
    height: 2.6rem;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--foreground);
    font-family: var(--font-mono);
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow: 0 0 18px var(--glow-soft);
  }

  /* Home view */
  .home {
    display: none;
    padding: 1.5rem 1.8rem;
    overflow-y: auto; height: 100%;
    /* Container for the responsive .tldr-grid below — column-count tracks
       the actual available width, not the viewport (which changes with
       sidebar collapsed/expanded state). */
    container-type: inline-size;
    container-name: home;
  }
  .home.show { display: block; }
  .home h2 {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 48;
    font-size: 1.55rem; font-weight: 600;
    margin: 0 0 0.5rem; letter-spacing: -0.005em;
  }
  .home .lead { color: var(--muted-ink); margin-bottom: 1.4rem; font-family: var(--font-body); }

  /* Freshness line — "Stand: DD.MM.YYYY" from the manifest's `generated`
     date. Mono-caps to read as a dateline, not body copy. When the manifest
     wasn't rebuilt today (a silently-failed nightly task), .stale flips it to
     the warn accent and appends a hint, so a missed run is visible at a glance
     instead of looking like fresh content. */
  .home-stand {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--soft);
    font-feature-settings: "tnum";
    margin: 0 0 1.2rem;
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .home-stand .stand-date { font-weight: 600; color: var(--muted-ink); }
  .home-stand.stale { color: var(--warn); }
  .home-stand.stale .stand-date { color: var(--warn); }
  .home-stand .stand-note { text-transform: none; letter-spacing: 0.02em; font-style: italic; }

  /* Newsprint column grid — the dashboard reads like one paper folded into
     seven adjacent columns. No card chrome: backgrounds, borders, shadows
     and radii are stripped. Adjacent columns are separated only by a
     hairline column rule, the same way the body-grid inside a newsletter
     uses column-rule between deep-dive sections. */
  /* Responsive column grid — caps at 3 wide so the columns stay readable
     on huge screens instead of shrinking to 5-6 narrow strips. The min
     width per column is the larger of 320 px (floor for readability) or
     1/3 of the container (so no more than 3 fit). Single declaration —
     no media or container queries needed.

     The column-rule + row-rule logic uses container queries against .home
     so the layout responds to actual available width (which changes with
     sidebar collapsed/expanded), not viewport. */
  .tldr-grid {
    display: grid;
    grid-template-columns:
      repeat(auto-fit, minmax(min(100%, max(320px, calc((100% - 2px) / 3))), 1fr));
    gap: 0;
    margin-top: 0.5rem;
  }
  .tldr-card {
    background: transparent;
    border: none;
    border-radius: 0;
    padding: var(--space-2) var(--space-4) var(--space-5);
    box-shadow: none;
    cursor: pointer;
    transition: background 150ms;
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    border-left: 1px solid var(--rule);
  }

  /* Grouped layout: a full-width header band (Wirtschaft / IT / Sport / …)
     precedes each group's cards. The header spans every grid column so the
     column flow restarts beneath it — each group reads as its own newsprint
     block, matching the sidebar's grouping. */
  .tldr-group-head {
    grid-column: 1 / -1;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    font-weight: 600;
    color: var(--soft);
    margin: var(--space-5) 0 0;
    padding: var(--space-3) 0 var(--space-2);
    border-top: 1px solid var(--rule);
  }
  /* The first group header sits right under the "Stand:" line — no big top gap
     or top rule, so the grid doesn't open with a stray divider. */
  .tldr-group-head:first-child { margin-top: 0; border-top: none; padding-top: 0; }

  /* The leading card of each group clears its left column rule so the group's
     first column starts clean (JS marks it; nth-child can't track per-group
     position once headers are interspersed). */
  .tldr-card.group-first { border-left: none; padding-left: 0; }

  /* Single-column band (narrow): no column rules at all; cards in the same
     group separate by a dashed row rule. The group header already divides
     groups, so only same-group siblings (a card directly after another card)
     get the dashed top. */
  @container home (max-width: 639px) {
    .tldr-card { border-left: none; padding-left: 0; }
    .tldr-card + .tldr-card {
      margin-top: var(--space-3);
      padding-top: var(--space-5);
      border-top: 1px dashed var(--rule);
    }
  }
  /* Subtle tinted-paper feedback on hover — no transform, no shadow swap,
     so adjacent columns never visually shift. */
  .tldr-card:hover {
    background: color-mix(in srgb, var(--cat-accent) 4%, transparent);
  }
  .tldr-card:focus-visible {
    outline: 2px solid var(--cat-accent, var(--fg));
    outline-offset: 4px;
  }
  .crumb:focus-visible {
    outline: 2px solid var(--fg);
    outline-offset: 2px;
    border-radius: var(--radius-inline);
  }

  /* Kicker line — same mono-caps treatment as the newsletter masthead-issue.
     Icon left, date right, category name in the middle. */
  .tldr-card-head {
    display: flex; align-items: center; gap: var(--space-2);
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.68rem;
    color: var(--muted-ink);
    border-bottom: none;
    padding-bottom: 0;
    margin-bottom: 0;
  }
  .tldr-card-head .tile-icon {
    font-size: 1rem;
    letter-spacing: normal;
    text-transform: none;
  }
  .tldr-card-head .tile-name {
    font-family: inherit;
    font-variation-settings: normal;
    font-weight: 600;
    font-size: inherit;
    color: var(--cat-accent-text, var(--fg));
    flex: 1;
  }
  .tldr-card-head .tile-date {
    font-family: inherit;
    font-size: inherit;
    color: var(--muted-ink);
    font-weight: 500;
    font-feature-settings: "tnum";
    letter-spacing: 0.1em;
  }

  /* Section title — the actual newsletter headline, rendered as a section
     dek in Fraunces with the same accent-bar treatment as .col h2 inside
     a newsletter. Acts as the "front-page headline" for that category. */
  .tldr-card-headline {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 36, "SOFT" 60;
    font-size: 1.18rem;
    font-weight: 600;
    font-style: normal;
    line-height: 1.18;
    color: var(--fg);
    margin: var(--space-2) 0 var(--space-3);
    letter-spacing: -0.005em;
  }
  .tldr-card-headline::before {
    content: "";
    display: block;
    width: 2rem;
    height: 2px;
    background: var(--cat-accent);
    margin-bottom: var(--space-2);
  }

  /* Strip the embedded TL;DR section's own chrome — it inherits the column
     instead. The lead keeps its drop-cap treatment but at a smaller scale
     suited to the narrower column width. */
  .tldr-card-body .tldr {
    background: transparent; border: none; padding: 0; margin: 0; border-radius: 0;
    display: block;       /* override the .tldr:has(.lead) grid from styles.css */
    column-gap: 0;
  }
  .tldr-card-body .tldr > .lead {
    font-family: var(--font-body);
    font-size: 0.92rem;
    line-height: 1.5;
    color: var(--fg);
    margin: 0 0 var(--space-3);
    max-width: none;
  }
  .tldr-card-body .tldr > .lead::first-letter {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 144, "SOFT" 100;
    font-size: 2.7rem;
    float: left;
    line-height: 0.85;
    padding: 0.25rem 0.45rem 0 0;
    color: var(--cat-accent);
    font-weight: 700;
  }
  .tldr-card-body .tldr ul {
    padding-left: 1rem;
    margin: 0;
    column-count: 1;       /* override 2-col bullet layout in narrow card */
  }
  .tldr-card-body .tldr li { font-size: 0.86rem; margin: 0.4rem 0; line-height: 1.5; }
  .tldr-card-body strong { color: var(--fg); font-weight: 700; }
  .tldr-card-body em { color: var(--muted-ink); font-style: italic; }
  .tldr-card-body a { color: inherit; text-decoration: underline; }
  /* Chips inside TL;DR bullets — tinted by the card's accent. */
  .tldr-card-body .chip {
    display: inline-block;
    font-family: var(--font-mono);
    background: color-mix(in srgb, var(--cat-accent, var(--rule-soft)) 14%, transparent);
    color: var(--fg);
    font-size: 0.6rem; font-weight: 600; padding: 0.05rem 0.45rem;
    border-radius: var(--radius-inline); letter-spacing: 0.04em; margin-right: 0.2rem;
    text-transform: uppercase; vertical-align: middle;
  }
  /* Same two rules as .chip.hot/.chip.good in lib/styles.css — the dashboard does not
     load styles.css, so it restates them. Tokens, not the literals that were here
     (#b6402f / #3f7a4f: single hexes on a four-theme page, measuring 3.06–3.83:1).
     The tint is 10%, not the 18% it was: the ink sits on its OWN tint, which is a
     surface the design system never measured — at 18% the composite is 4.15:1 on
     warm and 4.23:1 on paper, under AA. Measured worst case at 10% is 4.66:1. */
  .tldr-card-body .chip.hot  { background: color-mix(in srgb, var(--warn) 10%, transparent); color: var(--warn); }
  .tldr-card-body .chip.good { background: color-mix(in srgb, var(--good) 10%, transparent); color: var(--good); }
  /* Suppress the external-link arrow inside TL;DR snippets — too noisy. */
  .tldr-card-body a[href^="http"]::after { content: none; }
  /* "+N weitere" overflow marker — the home snapshot caps the TL;DR at a few
     bullets (the full set is one click away). Reads as a muted continuation
     cue, list-style stripped so it doesn't get its own bullet dot. */
  .tldr-card-body .tldr li.tldr-more {
    list-style: none;
    margin-left: -1rem;
    color: var(--soft);
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    font-style: normal;
  }

  /* DE-fallback chip — shown in a card's kicker when the active language has
     no translation for this date and the card is showing the DE original.
     Understated outline so it informs without competing with the accent. */
  .tldr-card-head .fallback-flag {
    font-family: var(--font-mono);
    font-size: 0.58rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--soft);
    border: 1px solid var(--rule);
    border-radius: var(--radius-inline);
    padding: 0.02rem 0.3rem;
    text-transform: uppercase;
    flex: none;
  }

  .tldr-read {
    background: transparent; border: none; color: var(--fg);
    font-family: var(--font-mono);
    font-weight: 600; cursor: pointer;
    font-size: 0.78rem; text-align: left;
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 0.7rem 0.2rem 0.4rem 0; margin-top: auto;
    min-height: 2.25rem;
    border-radius: var(--radius-inline);
  }
  .tldr-read:focus-visible {
    outline: 2px solid var(--cat-accent);
    outline-offset: 2px;
  }
  .tldr-read:hover { text-decoration: underline; }
  .tldr-empty {
    font-family: var(--font-body);
    font-size: 0.88rem; color: var(--soft); font-style: italic; padding: 0.4rem 0;
  }

     so the category identity is preserved, but the body is muted, dashed,
     and self-evidently dormant. Not clickable. */
  .tldr-card--empty {
    cursor: default;
    background: color-mix(in srgb, var(--bg) 50%, var(--panel));
    box-shadow: none;
  }
  .tldr-card--empty:hover {
    transform: none;
    box-shadow: none;
  }
  .tldr-card--empty .tile-date {
    color: var(--rule);
  }
  .tldr-empty-block {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.5rem;
    padding: 1.2rem 0.4rem 0.8rem;
    border-top: 1px dashed var(--rule);
    border-bottom: 1px dashed var(--rule);
    margin: 0.4rem 0 0;
  }
  .tldr-empty-kicker {
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.7rem;
    color: var(--cat-accent, var(--muted-ink));
    font-weight: 600;
  }
  .tldr-empty-msg {
    font-family: var(--font-body);
    font-size: 0.88rem;
    color: var(--muted-ink);
    line-height: 1.5;
    font-style: italic;
    margin: 0;
  }

  /* Per-category accents — each card scopes its own --cat-accent and
     --cat-accent-text so descendant rules (kicker tile-name, accent bar above
     the headline, drop cap, chips, CTA) all pick up the right colour. */
  .tldr-card[data-cat="economy"]        { --cat-accent: var(--c-economy);        --cat-accent-text: var(--c-economy-text); }
  .tldr-card[data-cat="software"]       { --cat-accent: var(--c-software);       --cat-accent-text: var(--c-software-text); }
  .tldr-card[data-cat="ai-dev"]         { --cat-accent: var(--c-ai-dev);         --cat-accent-text: var(--c-ai-dev-text); }
  .tldr-card[data-cat="ai-usecases"]    { --cat-accent: var(--c-ai-usecases);    --cat-accent-text: var(--c-ai-usecases-text); }

  .tldr-card .tldr-read { color: var(--cat-accent-text); }

  /* Loading */
  .loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;

  /* Color helpers per category */
  [data-cat="economy"]        .cat-color { background: var(--c-economy); }

  [data-cat="jobs"]           .cat-color { background: var(--c-jobs); }
  [data-cat="learn-language"] .cat-color { background: var(--c-learn-language); }

  /* Sidebar rows scope their own --cat-accent so the archive calendar's border,
     day rings and selected-day fill match the category colour. */
  .cat[data-cat="economy"]        { --cat-accent: var(--c-economy); }
  .cat[data-cat="software"]       { --cat-accent: var(--c-software); }
  .cat[data-cat="ai-dev"]         { --cat-accent: var(--c-ai-dev); }

  .cat[data-cat="learn-language"] { --cat-accent: var(--c-learn-language); }

  /* Home button — the "Übersicht" control at the top of the nav dropdown
     panel. Black accent bar (the dashboard's "house" colour) + favicon-style
     M brand mark + label, styled like a terminal .dropdown-item row. */
  .home-btn {
    display: flex; align-items: center; gap: 0.55rem;

  .home-btn.active { background: var(--muted); color: var(--primary); }
  .home-btn .cat-color {
    width: 6px; height: 18px; border-radius: 0; flex: none;
    background: var(--foreground);
  }
  /* Brand mark = the favicon design at category-icon size. */
  .home-btn .brand-mark {
    width: 1.1rem;
    height: 1.1rem;
    flex: none;
  }
  .home-btn:focus-visible,
  .cat-head:focus-visible,
  .cat-toggle:focus-visible,

    outline: 2px solid var(--ring, var(--primary));
    outline-offset: -2px;
  }

  /* ────────────────────────────────────────────────────────────────────
     Mobile / narrow responsiveness — the nav-rail becomes an off-canvas
     drawer (the .app-shell collapses to a single main column), toggled by
     the floating .rail-fab. The header keeps brand + history controls.
     ──────────────────────────────────────────────────────────────────── */
  @media (max-width: 720px) {
    header.app { padding: 0 0.75rem; gap: 0.6rem; }

    .tldr-grid { grid-template-columns: 1fr; gap: 0.85rem; }
    .home h2 { font-size: 1.2rem; }
    .status-controls { gap: 0.9rem; }

    /* Single main column; the rail floats as an off-canvas drawer pinned
       under the header / above the footer, slid off to the right until opened. */
    .app-shell,
    .app-shell.rail-collapsed { grid-template-columns: 1fr; }
    .nav-rail {
      position: fixed;
      top: 3rem;
      right: 0;
      bottom: 2rem;
      width: min(80vw, 18rem);
      transform: translateX(100%);
      transition: transform 0.2s ease;
      z-index: 56;
      box-shadow: -8px 0 24px var(--glow-soft);
    }
    .app-shell.rail-open .nav-rail { transform: translateX(0); }
    /* On mobile the drawer always shows full labels — never the icon strip. */
    .app-shell.rail-collapsed .nav-rail-title,
    .app-shell.rail-collapsed .nav-label,
    .app-shell.rail-collapsed .cat-name,
    .app-shell.rail-collapsed .cat-latest,
    .app-shell.rail-collapsed .cat-toggle,
    .app-shell.rail-collapsed .cat-dates,
    .app-shell.rail-collapsed .home-btn .nav-label-text,
    .app-shell.rail-collapsed .home-btn .brand-mark { display: revert; }
    .app-shell.rail-collapsed .nav-rail-head { justify-content: flex-start; padding: 0.4rem 0.85rem; }
    .app-shell.rail-collapsed .cat-head,
    .app-shell.rail-collapsed .home-btn {
      justify-content: flex-start; padding-left: 0.85rem; padding-right: 0.85rem; gap: 0.55rem;
    }
    /* The header chevron toggle is meaningless on mobile (drawer uses the FAB). */
    .rail-toggle--header { display: none; }
    .rail-fab { display: inline-flex; align-items: center; justify-content: center; }
  }
  @media (max-width: 400px) {
    header.app { padding: 0 0.6rem; }
    .header-brand .brand-word { font-size: 0.85rem; }
    .home { padding: 0.85rem 0.85rem 1.2rem; }
    .tldr-card { padding: 0.8rem 0.9rem 0.7rem; }
    .tldr-card-body .tldr li { font-size: 0.8rem; }
  }

<body>

<!-- Terminal header bar (mirrors pagr): LEFT brand wordmark + cursor; RIGHT the
     nav-rail minimize toggle. The grouped category nav lives in the sticky right
     sidebar (.nav-rail). -->
<header class="app">
  <div class="header-left">
    <a class="header-brand" id="brand-home" href="#home" title="Übersicht">

      <span class="cursor-block" aria-hidden="true"></span>

  </div>

  <div class="header-right">
    <button class="rail-toggle rail-toggle--header" id="rail-toggle" type="button"
            aria-controls="nav-rail" aria-expanded="true" aria-label="Navigation ein-/ausblenden"
            title="Navigation ein-/ausblenden">
      <span class="rail-toggle-glyph" aria-hidden="true">»</span>
    </button>
  </div>
</header>

<div class="app-shell">
  <main class="main">

    </div>

    <iframe class="iframe-host" id="frame" style="display:none;" title="Newsletter"></iframe>
  </main>

  <!-- Sticky right sidebar: the relocated Übersicht control (#home-btn) and the
       grouped category nav (#nav-groups, populated by JS from NAV_GROUPS). Can be
       minimized to an icon-only strip; collapsed state persists in localStorage. -->
  <aside class="nav-rail" id="nav-rail" aria-label="Navigation">
    <div class="nav-rail-head">
      <span class="nav-rail-title">~/briefs</span>
    </div>
    <div class="nav-rail-body">
      <div class="home-btn active" id="home-btn" role="button" tabindex="0" title="Übersicht">
        <span class="cat-color"></span>
        <!-- Full favicon design inline: dark frame + cream page + red
             double-rule + serif M. Identical SVG to favicon.svg so the
             browser tab and the home control read as the same "house" mark. -->
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <rect width="64" height="64" rx="9" fill="#221a13"/>
          <rect x="2.5" y="2.5" width="59" height="59" rx="7" fill="#f1e7d3"/>

        </svg>
        <span class="nav-label-text">Übersicht</span>
      </div>
      <div id="nav-groups"><!-- populated by JS from NAV_GROUPS: grouped category
           nav (Wirtschaft / IT / jobs / Sport / Freizeit / Sprachen), each group
           with its own .nav-label header (standalone groups render headerless). --></div>
    </div>
  </aside>
</div>

<!-- Mobile: floating button re-opens the nav-rail drawer (≤720px it overlays). -->
<button class="rail-fab" id="rail-fab" type="button" aria-controls="nav-rail"
        aria-label="Navigation öffnen" title="Navigation">☰</button>

<!-- Fixed footer status bar: status path (left), relocated controls + anim
     toggle (right). Controls keep their original ids so the existing handlers
     (theme cycle, language switch) work unchanged. -->

  <div class="status-inner">

            <span class="dd-flag dd-flag-es" aria-hidden="true"></span><span>Español</span>

        </div>
      </div>
      <details class="dropdown theme-dropdown" id="theme-dropdown">

          <span class="dd-dot" aria-hidden="true"></span>

        <span class="anim-box" aria-hidden="true">[x]</span>
        <span>anim</span>
      </button>
    </nav>
  </div>
</footer>

        "pt": "<div class=\"tldr\"><h2>O essencial em 30 segundos</h2>\n    <p class=\"lead\">Ontem esta página dizia que o relatório de emprego dos EUA chegaria quinze minutos tarde demais para o fixing. Foi exatamente isso que aconteceu — e o número foi um choque: <strong>menos 23.000 vagas</strong> em vez de mais 80.000. O fixing de sexta-feira fechou em <strong>5,8826</strong> e não viu nada disso. Hoje é sábado: sem pregão, sem fixing. A primeira cotação que vai conhecer o choque do emprego surge na <strong>segunda-feira</strong>.</p>\n    <ul>\n      <li><span class=\"chip hot\">FX</span> <strong>EUR/BRL fixing do BCE 5,8826</strong> (sex, 07/08) contra 5,9138 na quinta-feira — <strong>−0,53%</strong>, a maior queda diária da semana.</li>\n      <li><span class=\"chip good\">TESTE DE PREVISÃO</span> <strong>Ontem esta página dizia 5,85–5,94, mais provável 5,89.</strong> O fixing veio em 5,8826 — <strong>dentro da faixa</strong>, o ponto central errou por <strong>0,13%</strong>.</li>\n      <li><span class=\"chip hot\">EUA</span> <strong>Payrolls de julho −23.000</strong> (consenso ~+80.000), taxa de desemprego <strong>4,1%</strong> (de 4,2%). Relatório às 09h30 (horário de Brasília), fixing às 09h15.</li>\n      <li><span class=\"chip hot\">DÓLAR</span> <strong>DXY 99,60</strong> (07/08), <strong>−0,33%</strong> — o rompimento abaixo da marca de 100, à qual a cesta ficou colada a semana toda.</li>\n      <li><span class=\"chip\">MECÂNICA</span> <strong>As duas pernas se moveram juntas</strong>: USD/BRL <strong>−0,47%</strong>, EUR/USD <strong>−0,06%</strong>. Na semana, ainda <strong>+1,26%</strong> desde 31/07 (5,8095).</li>\n      <li><span class=\"chip\">RISCO</span> <strong>CDS de 5 anos em 121,91 pontos-base</strong> (07/08), <strong>+0,15 pb</strong> — terceira alta seguida, e a menor. Além disso, <strong>EWZ US$ 35,34</strong>, <strong>−1,31%</strong>: ações em queda, moeda em alta — um trade de juros, não de crescimento.</li>\n      <li><span class=\"c       "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Eine Woche lang ging es hier um Lieferwege — kompromittierte Maintainer, gefälschte Pakete, ein Wurm, der sich selbst weiterschickt. Heute steht das unscheinbarste Stück Infrastruktur im Zentrum: das interne Dashboard. <strong>Metabase</strong>, das Open-Source-BI-Tool, das in tausenden Firmen zwischen Fachabteilung und Produktionsdatenbank hängt, hatte in der Passwort-vergessen-Funktion eine <strong>SQL-Injection ohne jede Anmeldung</strong> — <strong>CVSS 10,0</strong>, der Höchstwert. Ausgenutzt wurde sie, bevor irgendjemand davon wusste: Laptop-Hersteller <strong>Framework</strong> und Formular-Anbieter <strong>Tally</strong> melden Datenabflüsse ab dem <strong>3. August</strong>, veröffentlicht wurde die Lücke erst am <strong>6.</strong> Und der eigentliche Schaden ist nicht Metabase, sondern das, wozu Metabase die Zugangsdaten hält. Daneben: eine Nichtregierungs-Antwort auf genau dieses Jahr, Rust zieht eine Linie um LLM-Beiträge, und der Kernel patcht seinen eigenen Patch nach einem Tag.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>Metabase</strong>: unauthentifizierte SQL-Injection über <code>/api/session/reset_password</code>, <strong>CVSS 10,0</strong>, kein CVE. Betroffen v58 bis v63, gefixt in <code>x.58.24</code> bis <code>x.63.5</code>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Framework &amp; Tally</strong>: beide bestätigen Zugriff am <strong>03.08.</strong> — drei Tage vor der Offenlegung. Namen, Adressen, Login-IPs, bei Tally auch Passwort-Hashes. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Software Stewardship Lab</strong>: gestern in Edinburgh gestartet, gemeinnützig, will den Abhängigkeitsgraphen kartieren — inklusive der Pakete, die nur so <em>aussehen</em>, als würden sie gepflegt. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Rust</strong> hat am 05.08. eine LLM-Richtlinie für <code>rust-lang/rust</code> beschlossen: lesen, prüfen, zusammenfassen ja — erzeugen nur mit Offenlegung <em>und</em> einem Reviewer, der vorher zusagt. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>Kernel</strong>: fünf Stable-Releases am Freitag, weil der Donnerstags-Fix für die Spectre-Lücke <code>CVE-2026-68480</code> einen Fehler mitbrachte. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>macOS</strong>: <code>CVE-2026-65400</code> ließ Screen Sharing im lokalen Netz ohne gültige Anmeldedaten zu. Gefixt in 14.8.9, 15.7.9, 26.6.1. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>n8n</strong> schließt <strong>18 Lücken</strong> — mehrheitlich „hoch\", ohne eine einzige CVE-Nummer. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Tailscale</strong> <code>TS-2026-010</code>: Tailscale SSH reichte Umgebungsvariablen an Kindprozesse durch. Behoben ab <strong>1.102.1</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">Release</span> <strong>Angular 22.1.1</strong>, <strong>Rust-Coreutils 0.10</strong> (645 von 690 GNU-Tests), <strong>LightDM 1.33.0</strong> nach vier Jahren Stille. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>DEF CON 34</strong>, Tag 3 — und aus Brasilien wie aus der deutschen OSS-Ecke: den vierten Tag in Folge nichts Datiertes. <span class=\"chip\">BR</span></li>\n    </ul></div>",
      "latestTldrHtmlByLang": {
        "de": "<div class=\"tldr\"><p class=\"lead\">Eine Woche lang ging es hier um Lieferwege — kompromittierte Maintainer, gefälschte Pakete, ein Wurm, der sich selbst weiterschickt. Heute steht das unscheinbarste Stück Infrastruktur im Zentrum: das interne Dashboard. <strong>Metabase</strong>, das Open-Source-BI-Tool, das in tausenden Firmen zwischen Fachabteilung und Produktionsdatenbank hängt, hatte in der Passwort-vergessen-Funktion eine <strong>SQL-Injection ohne jede Anmeldung</strong> — <strong>CVSS 10,0</strong>, der Höchstwert. Ausgenutzt wurde sie, bevor irgendjemand davon wusste: Laptop-Hersteller <strong>Framework</strong> und Formular-Anbieter <strong>Tally</strong> melden Datenabflüsse ab dem <strong>3. August</strong>, veröffentlicht wurde die Lücke erst am <strong>6.</strong> Und der eigentliche Schaden ist nicht Metabase, sondern das, wozu Metabase die Zugangsdaten hält. Daneben: eine Nichtregierungs-Antwort auf genau dieses Jahr, Rust zieht eine Linie um LLM-Beiträge, und der Kernel patcht seinen eigenen Patch nach einem Tag.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>Metabase</strong>: unauthentifizierte SQL-Injection über <code>/api/session/reset_password</code>, <strong>CVSS 10,0</strong>, kein CVE. Betroffen v58 bis v63, gefixt in <code>x.58.24</code> bis <code>x.63.5</code>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Framework &amp; Tally</strong>: beide bestätigen Zugriff am <strong>03.08.</strong> — drei Tage vor der Offenlegung. Namen, Adressen, Login-IPs, bei Tally auch Passwort-Hashes. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Software Stewardship Lab</strong>: gestern in Edinburgh gestartet, gemeinnützig, will den Abhängigkeitsgraphen kartieren — inklusive der Pakete, die nur so <em>aussehen</em>, als würden sie gepflegt. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Rust</strong> hat am 05.08. eine LLM-Richtlinie für <code>rust-lang/rust</code> beschlossen: lesen, prüfen, zusammenfassen ja — erzeugen nur mit Offenlegung <em>und</em> einem Reviewer, der vorher zusagt. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>Kernel</strong>: fünf Stable-Releases am Freitag, weil der Donnerstags-Fix für die Spectre-Lücke <code>CVE-2026-68480</code> einen Fehler mitbrachte. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>macOS</strong>: <code>CVE-2026-65400</code> ließ Screen Sharing im lokalen Netz ohne gültige Anmeldedaten zu. Gefixt in 14.8.9, 15.7.9, 26.6.1. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>n8n</strong> schließt <strong>18 Lücken</strong> — mehrheitlich „hoch\", ohne eine einzige CVE-Nummer. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Tailscale</strong> <code>TS-2026-010</code>: Tailscale SSH reichte Umgebungsvariablen an Kindprozesse durch. Behoben ab <strong>1.102.1</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">Release</span> <strong>Angular 22.1.1</strong>, <strong>Rust-Coreutils 0.10</strong> (645 von 690 GNU-Tests), <strong>LightDM 1.33.0</strong> nach vier Jahren Stille. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>DEF CON 34</strong>, Tag 3 — und aus Brasilien wie aus der deutschen OSS-Ecke: den vierten Tag in Folge nichts Datiertes. <span class=\"chip\">BR</span></li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">For a week this space was about supply chains — compromised maintainers, forged packages, a worm that mails itself onward. Today the most unassuming piece of infrastructure takes center stage: the internal dashboard. <strong>Metabase</strong>, the open-source BI tool that sits between the business team and the production database in thousands of companies, had an <strong>unauthenticated SQL injection</strong> in its forgot-password function — <strong>CVSS 10.0</strong>, the maximum score. It was exploited before anyone even knew about it: laptop maker <strong>Framework</strong> and form provider <strong>Tally</strong> report data breaches starting <strong>August 3</strong>, while the flaw itself wasn't disclosed until the <strong>6th</strong>. And the real damage isn't Metabase — it's whatever Metabase holds the credentials for. Also today: a non-governmental answer to exactly this problem, Rust draws a line around LLM contributions, and the kernel patches its own patch after one day.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>Metabase</strong>: unauthenticated SQL injection via <code>/api/session/reset_password</code>, <strong>CVSS 10.0</strong>, no CVE. Affects v58 through v63, fixed in <code>x.58.24</code> through <code>x.63.5</code>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Framework &amp; Tally</strong>: both confirm access on <strong>08/03</strong> — three days before disclosure. Names, addresses, login IPs, and at Tally also password hashes. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Software Stewardship Lab</strong>: launched yesterday in Edinburgh, nonprofit, aims to map the dependency graph — including the packages that only <em>look</em> maintained. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Rust</strong> adopted an LLM policy for <code>rust-lang/rust</code> on 08/05: reading, checking, summarizing — fine; generating only with disclosure <em>and</em> a reviewer who commits upfront. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>Kernel</strong>: five stable releases on Friday, because Thursday's fix for the Spectre flaw <code>CVE-2026-68480</code> shipped with a bug. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>macOS</strong>: <code>CVE-2026-65400</code> let Screen Sharing on the local network work without valid credentials. Fixed in 14.8.9, 15.7.9, 26.6.1. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>n8n</strong> closes <strong>18 flaws</strong> — mostly \"high,\" without a single CVE number. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Tailscale</strong> <code>TS-2026-010</code>: Tailscale SSH passed environment variables to child processes. Fixed as of <strong>1.102.1</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">Release</span> <strong>Angular 22.1.1</strong>, <strong>Rust Coreutils 0.10</strong> (645 of 690 GNU tests), <strong>LightDM 1.33.0</strong> after four years of silence. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>DEF CON 34</strong>, day 3 — and from Brazil as from the German OSS corner: a fourth straight day of nothing dated. <span class=\"chip\">BR</span></li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Durante uma semana, o assunto por aqui foi cadeia de suprimentos — mantenedores comprometidos, pacotes falsificados, um worm que se reenvia sozinho. Hoje o pedaço mais discreto da infraestrutura vai para o centro do palco: o dashboard interno. O <strong>Metabase</strong>, a ferramenta de BI open source que fica entre a área de negócio e o banco de dados de produção em milhares de empresas, tinha na função de esqueci-minha-senha uma <strong>injeção SQL sem qualquer autenticação</strong> — <strong>CVSS 10,0</strong>, a nota máxima. Foi explorada antes de alguém sequer saber que existia: a fabricante de notebooks <strong>Framework</strong> e a provedora de formulários <strong>Tally</strong> relatam vazamentos de dados a partir do dia <strong>3 de agosto</strong>, enquanto a brecha só foi divulgada no dia <strong>6</strong>. E o dano de verdade não é o Metabase, e sim aquilo para o qual o Metabase guarda as credenciais. Também hoje: uma resposta não governamental para exatamente esse problema, o Rust traça uma linha para contribuições de LLM, e o kernel corrige o próprio patch depois de um dia.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>Metabase</strong>: injeção SQL sem autenticação via <code>/api/session/reset_password</code>, <strong>CVSS 10,0</strong>, sem CVE. Afeta de v58 a v63, corrigido em <code>x.58.24</code> a <code>x.63.5</code>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Framework e Tally</strong>: ambas confirmam acesso em <strong>03/08</strong> — três dias antes da divulgação. Nomes, endereços, IPs de login, e na Tally também hashes de senha. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Software Stewardship Lab</strong>: lançado ontem em Edimburgo, sem fins lucrativos, quer mapear o grafo de dependências — inclusive os pacotes que só <em>parecem</em> mantidos. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Rust</strong> aprovou em 05/08 uma política de LLM para o <code>rust-lang/rust</code>: ler, checar, resumir, sim; gerar, só com divulgação <em>e</em> um revisor que se comprometa antes. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>Kernel</strong>: cinco releases estáveis na sexta-feira, porque o fix de quinta para a falha Spectre <code>CVE-2026-68480</code> veio com um bug. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>macOS</strong>: <code>CVE-2026-65400</code> permitia usar o Compartilhamento de Tela na rede local sem credenciais válidas. Corrigido em 14.8.9, 15.7.9, 26.6.1. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>n8n</strong> fecha <strong>18 brechas</strong> — a maioria classificada como \"alta\", sem um único número de CVE. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Tailscale</strong> <code>TS-2026-010</code>: o Tailscale SSH repassava variáveis de ambiente para processos filhos. Corrigido a partir da <strong>1.102.1</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">Release</span> <strong>Angular 22.1.1</strong>, <strong>Rust-Coreutils 0.10</strong> (645 de 690 testes GNU), <strong>LightDM 1.33.0</strong> depois de quatro anos de silêncio. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>DEF CON 34</strong>, dia 3 — e tanto do Brasil quanto do canto do OSS alemão: quarto dia seguido sem nada datado. <span class=\"chip\">BR</span></li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Durante una semana, aquí se habló de cadenas de suministro — mantenedores comprometidos, paquetes falsificados, un gusano que se reenvía a sí mismo. Hoy el pedazo más discreto de la infraestructura ocupa el centro: el dashboard interno. <strong>Metabase</strong>, la herramienta de BI de código abierto que en miles de empresas queda entre el área de negocio y la base de datos de producción, tenía en la función de recuperar contraseña una <strong>inyección SQL sin ninguna autenticación</strong> — <strong>CVSS 10.0</strong>, el puntaje máximo. Se explotó antes de que nadie supiera que existía: el fabricante de laptops <strong>Framework</strong> y el proveedor de formularios <strong>Tally</strong> reportan fugas de datos desde el <strong>3 de agosto</strong>, mientras que la falla se dio a conocer apenas el <strong>6</strong>. Y el daño real no es Metabase, sino aquello para lo que Metabase guarda las credenciales. Además hoy: una respuesta no gubernamental a exactamente ese problema, Rust traza una línea alrededor de las contribuciones con LLM, y el kernel corrige su propio parche después de un día.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>Metabase</strong>: inyección SQL sin autenticación vía <code>/api/session/reset_password</code>, <strong>CVSS 10.0</strong>, sin CVE. Afecta de v58 a v63, corregido en <code>x.58.24</code> a <code>x.63.5</code>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Framework y Tally</strong>: ambas confirman acceso el <strong>03/08</strong> — tres días antes de la divulgación. Nombres, direcciones, IPs de inicio de sesión, y en Tally también hashes de contraseña. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Software Stewardship Lab</strong>: lanzado ayer en Edimburgo, sin fines de lucro, quiere mapear el grafo de dependencias — incluidos los paquetes que solo <em>parecen</em> mantenidos. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Rust</strong> aprobó el 05/08 una política de LLM para <code>rust-lang/rust</code>: leer, revisar, resumir, sí; generar, solo con divulgación <em>y</em> un revisor que se comprometa por adelantado. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>Kernel</strong>: cinco versiones estables el viernes, porque el parche del jueves para la falla Spectre <code>CVE-2026-68480</code> venía con un bug. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>macOS</strong>: <code>CVE-2026-65400</code> permitía usar Compartir Pantalla en la red local sin credenciales válidas. Corregido en 14.8.9, 15.7.9, 26.6.1. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>n8n</strong> cierra <strong>18 fallas</strong> — la mayoría clasificadas como \"altas\", sin un solo número de CVE. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Tailscale</strong> <code>TS-2026-010</code>: Tailscale SSH pasaba variables de entorno a procesos hijos. Corregido a partir de <strong>1.102.1</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">Release</span> <strong>Angular 22.1.1</strong>, <strong>Rust-Coreutils 0.10</strong> (645 de 690 pruebas GNU), <strong>LightDM 1.33.0</strong> después de cuatro años de silencio. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>DEF CON 34</strong>, día 3 — y tanto desde Brasil como desde el rincón OSS alemán: cuarto día seguido sin nada fechado. <span class=\"chip\">BR</span></li>\n    </ul></div>"
      }

g>Muse Spark 1.2 hat keine eigene Zahl</strong>: Veröffentlicht ist nur der Wert der Vorgängerfassung 1.1 (Terminal-Bench 2.1: <span class=\"stat\">80,0</span>) und eine Liste von Vergleichsmodellen ohne Punktzahlen dahinter.</li>\n      <li><span class=\"chip good\">Tool</span> <strong>Cline hat den Tarif schon im Menü</strong>: <code>v4.1.6</code> vom 06.08. bietet ausgerechnet <code>meta/muse-spark-1.2-contributor</code> an — die Datenspende-Variante, namentlich.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>86,1 ja, Vergleich nein</strong>: Ein fremdes Board führt Qwen3.8-Max mit Stand <span class=\"stat\">07.08.</span> tatsächlich mit 86,1 auf OSWorld-Verified. GPT-5.6 Sol Max und Gemini 3.1 Pro, Alibabas Vergleichsgegner, stehen dort überhaupt nicht.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>Der Methodenfehler mit Namen</strong>: Vals.ai stellt fest, dass Alibabas eigene Terminal-Bench-Zahl mit veränderten Zeitlimits zustande kam — bei unveränderten Limits nicht.</li>\n      <li><span class=\"chip\">OSS</span> <strong>Geschwätzigkeit ist ein Preisfaktor</strong>: Qwen3.8-Max kostet <span class=\"stat\">2 $</span> / <span class=\"stat\">6 $</span>, erzeugte in einer unabhängigen Auswertung aber 150 Mio. Ausgabe-Token statt der üblichen 66 Mio. Der Listenpreis ist damit nicht der Rechnungspreis.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Still im Schatten</strong>: Cursors letzter Eintrag bleibt der 03.08.; der vielzitierte „Cursor Router\" ist vom <span class=\"stat\">22.07.</span> — und die kursierenden Prozentzahlen dazu stehen im Änderungsprotokoll nicht drin.</li>\n    </ul></div>",

rk 1.2 hat keine eigene Zahl</strong>: Veröffentlicht ist nur der Wert der Vorgängerfassung 1.1 (Terminal-Bench 2.1: <span class=\"stat\">80,0</span>) und eine Liste von Vergleichsmodellen ohne Punktzahlen dahinter.</li>\n      <li><span class=\"chip good\">Tool</span> <strong>Cline hat den Tarif schon im Menü</strong>: <code>v4.1.6</code> vom 06.08. bietet ausgerechnet <code>meta/muse-spark-1.2-contributor</code> an — die Datenspende-Variante, namentlich.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>86,1 ja, Vergleich nein</strong>: Ein fremdes Board führt Qwen3.8-Max mit Stand <span class=\"stat\">07.08.</span> tatsächlich mit 86,1 auf OSWorld-Verified. GPT-5.6 Sol Max und Gemini 3.1 Pro, Alibabas Vergleichsgegner, stehen dort überhaupt nicht.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>Der Methodenfehler mit Namen</strong>: Vals.ai stellt fest, dass Alibabas eigene Terminal-Bench-Zahl mit veränderten Zeitlimits zustande kam — bei unveränderten Limits nicht.</li>\n      <li><span class=\"chip\">OSS</span> <strong>Geschwätzigkeit ist ein Preisfaktor</strong>: Qwen3.8-Max kostet <span class=\"stat\">2 $</span> / <span class=\"stat\">6 $</span>, erzeugte in einer unabhängigen Auswertung aber 150 Mio. Ausgabe-Token statt der üblichen 66 Mio. Der Listenpreis ist damit nicht der Rechnungspreis.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Still im Schatten</strong>: Cursors letzter Eintrag bleibt der 03.08.; der vielzitierte „Cursor Router\" ist vom <span class=\"stat\">22.07.</span> — und die kursierenden Prozentzahlen dazu stehen im Änderungsprotokoll nicht drin.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">As of <span class=\"stat\">Aug 5</span>, there's <strong>Muse Code</strong>, Meta's terminal agent built on <strong>Muse Spark 1.2</strong> — and with it, a pricing table with a level of openness we haven't seen before: anyone who lets Meta train future models on their own inputs and outputs pays <span class=\"stat\">$0.20</span> instead of <span class=\"stat\">$4.25</span> per million output tokens. That's not a discount campaign, it's a purchase offer — and the price is public for the first time. The other half of today: Alibaba's <span class=\"stat\">86.1</span> for Qwen3.8-Max on OSWorld-Verified does turn up on an outside board — the rivals from the same table don't.</p>\n    <ul>\n      <li><span class=\"chip hot\">Tool</span> <strong>Muse Code is here</strong>: Meta's terminal agent has been running as a beta for macOS and Linux since <span class=\"stat\">Aug 5</span>, powered by Muse Spark 1.2 — not the 1.1 covered here on Aug 3.</li>\n      <li><span class=\"chip hot\">Tool</span> <strong>Two rates, one trade</strong>: Standard costs <span class=\"stat\">$1.25</span> / <span class=\"stat\">$4.25</span> per million tokens in/out. The \"Contributor\" rate costs <span class=\"stat\">$0.10</span> / <span class=\"stat\">$0.20</span> — in exchange for permission to train on your prompts and responses.</li>\n      <li><span class=\"chip\">Tool</span> <strong>What Meta pays you</strong>: the difference comes to $1.15 per million input tokens and <span class=\"stat\">$4.05</span> per million output tokens. That's the posted market price for your work product.</li>\n      <li><span class=\"chip hot\">Tool</span> <strong>For client code, the rate is off the table</strong> before the invoice even arrives: any standard NDA prohibits exactly what generates the discount here.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Muse Spark 1.2 has no figure of its own</strong>: the only published number is the predecessor 1.1's (Terminal-Bench 2.1: <span class=\"stat\">80.0</span>), plus a list of comparison models with no scores attached.</li>\n      <li><span class=\"chip good\">Tool</span> <strong>Cline already has the rate on the menu</strong>: <code>v4.1.6</code> from 06.08 offers, of all things, <code>meta/muse-spark-1.2-contributor</code> — the data-donation variant, by name.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>86.1, yes. Comparison, no.</strong>: an outside board dated <span class=\"stat\">Aug 7</span> does list Qwen3.8-Max at 86.1 on OSWorld-Verified. GPT-5.6 Sol Max and Gemini 3.1 Pro, Alibaba's chosen rivals, aren't on it at all.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>The methodology flaw, named</strong>: Vals.ai finds that Alibaba's own Terminal-Bench figure came about with modified time limits — not with the original ones.</li>\n      <li><span class=\"chip\">OSS</span> <strong>Verbosity is a pricing factor</strong>: Qwen3.8-Max costs <span class=\"stat\">$2</span> / <span class=\"stat\">$6</span>, but in an independent evaluation it generated 150 million output tokens instead of the usual 66 million. The list price isn't the invoice price.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Quiet in the shadows</strong>: Cursor's latest entry stays at Aug 3; the widely cited \"Cursor Router\" dates to <span class=\"stat\">Jul 22</span> — and the percentages circulating about it aren't in the changelog.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Desde o dia <span class=\"stat\">05/08</span> existe o <strong>Muse Code</strong>, o agente de terminal da Meta baseado no <strong>Muse Spark 1.2</strong> — e com ele, uma tabela de preços com um nível de transparência que ainda não existia: quem permite que a Meta treine modelos futuros com as próprias entradas e respostas paga <span class=\"stat\">US$ 0,20</span> em vez de <span class=\"stat\">US$ 4,25</span> por milhão de tokens de saída. Isso não é uma promoção, é uma proposta de compra — e o preço está público pela primeira vez. A outra metade do dia: o 86,1 da Alibaba para o Qwen3.8-Max no OSWorld-Verified aparece de fato em um board de terceiros — os concorrentes da mesma tabela, não.</p>\n    <ul>\n      <li><span class=\"chip hot\">Tool</span> <strong>Muse Code chegou</strong>: o agente de terminal da Meta roda como beta para macOS e Linux desde <span class=\"stat\">05/08</span>, movido pelo Muse Spark 1.2 — não pelo 1.1, que foi tema aqui em 03/08.</li>\n      <li><span class=\"chip hot\">Tool</span> <strong>Dois planos, uma troca</strong>: o Standard custa <span class=\"stat\">US$ 1,25</span> / <span class=\"stat\">US$ 4,25</span> por milhão de tokens de entrada/saída. O plano \"Contributor\" custa <span class=\"stat\">US$ 0,10</span> / <span class=\"stat\">US$ 0,20</span> — em troca da permissão de treinar com seus prompts e respostas.</li>\n      <li><span class=\"chip\">Tool</span> <strong>O que a Meta te paga</strong>: a diferença é de US$ 1,15 por milhão de tokens de entrada e <span class=\"stat\">US$ 4,05</span> por milhão de tokens de saída. Esse é o preço de mercado declarado para o resultado do seu trabalho.</li>\n      <li><span class=\"chip hot\">Tool</span> <strong>Para código de cliente, o plano já está fora de cogitação</strong> antes mesmo de a fatura chegar: qualquer NDA padrão proíbe exatamente o que gera esse desconto aqui.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Muse Spark 1.2 não tem número próprio</strong>: o único valor publicado é o da versão anterior, 1.1 (Terminal-Bench 2.1: <span class=\"stat\">80,0</span>), além de uma lista de modelos de comparação sem nenhuma pontuação ao lado.</li>\n      <li><span class=\"chip good\">Tool</span> <strong>A Cline já tem o plano no menu</strong>: a <code>v4.1.6</code> de 06/08 oferece justamente o <code>meta/muse-spark-1.2-contributor</code> — a variante de doação de dados, nomeada assim.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>86,1 existe. A comparação, não.</strong>: um board de terceiros, datado de <span class=\"stat\">07/08</span>, lista de fato o Qwen3.8-Max com 86,1 no OSWorld-Verified. GPT-5.6 Sol Max e Gemini 3.1 Pro, os concorrentes escolhidos pela Alibaba, nem aparecem lá.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>A falha de método tem nome</strong>: a Vals.ai constata que o número de Terminal-Bench da própria Alibaba foi obtido com limites de tempo alterados — e não com os limites originais.</li>\n      <li><span class=\"chip\">OSS</span> <strong>Tagarelice é fator de preço</strong>: o Qwen3.8-Max custa <span class=\"stat\">US$ 2</span> / <span class=\"stat\">US$ 6</span>, mas em uma avaliação independente gerou 150 milhões de tokens de saída em vez dos 66 milhões habituais. O preço de tabela, portanto, não é o preço da fatura.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Quieto nas sombras</strong>: a última entrada da Cursor continua sendo 03/08; o tão citado \"Cursor Router\" é de <span class=\"stat\">22/07</span> — e os percentuais que circulam sobre ele não aparecem no changelog.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Desde el <span class=\"stat\">05/08</span> existe <strong>Muse Code</strong>, el agente de terminal de Meta basado en <strong>Muse Spark 1.2</strong> — y con él, una tabla de precios con un nivel de transparencia que no se había visto: quien le permite a Meta entrenar futuros modelos con sus propias entradas y respuestas paga <span class=\"stat\">US$ 0,20</span> en lugar de <span class=\"stat\">US$ 4,25</span> por millón de tokens de salida. Esto no es una promoción, es una oferta de compra — y el precio es público por primera vez. La otra mitad del día: el 86,1 de Alibaba para Qwen3.8-Max en OSWorld-Verified sí aparece en un tablero ajeno — los rivales de esa misma tabla, no.</p>\n    <ul>\n      <li><span class=\"chip hot\">Tool</span> <strong>Muse Code ya está aquí</strong>: el agente de terminal de Meta corre como beta para macOS y Linux desde el <span class=\"stat\">05/08</span>, impulsado por Muse Spark 1.2 — no por el 1.1, que fue tema aquí el 03/08.</li>\n      <li><span class=\"chip hot\">Tool</span> <strong>Dos planes, un intercambio</strong>: el Standard cuesta <span class=\"stat\">US$ 1,25</span> / <span class=\"stat\">US$ 4,25</span> por millón de tokens de entrada/salida. El plan \"Contributor\" cuesta <span class=\"stat\">US$ 0,10</span> / <span class=\"stat\">US$ 0,20</span> — a cambio del permiso de entrenar con tus prompts y respuestas.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Lo que Meta te paga</strong>: la diferencia es de US$ 1,15 por millón de tokens de entrada y <span class=\"stat\">US$ 4,05</span> por millón de tokens de salida. Ese es el precio de mercado declarado por tu trabajo.</li>\n      <li><span class=\"chip hot\">Tool</span> <strong>Para código de cliente, el plan queda descartado</strong> antes de que llegue la factura: cualquier NDA estándar prohíbe justo lo que genera este descuento.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Muse Spark 1.2 no tiene cifra propia</strong>: lo único publicado es el valor de la versión anterior, 1.1 (Terminal-Bench 2.1: <span class=\"stat\">80,0</span>), más una lista de modelos de comparación sin puntuaciones al lado.</li>\n      <li><span class=\"chip good\">Tool</span> <strong>Cline ya tiene el plan en el menú</strong>: la <code>v4.1.6</code> del 06/08 ofrece justamente <code>meta/muse-spark-1.2-contributor</code> — la variante de donación de datos, nombrada así.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>86,1 sí, comparación no</strong>: un tablero ajeno, fechado el <span class=\"stat\">07/08</span>, sí lista a Qwen3.8-Max con 86,1 en OSWorld-Verified. GPT-5.6 Sol Max y Gemini 3.1 Pro, los rivales elegidos por Alibaba, ni siquiera aparecen ahí.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>La falla de método tiene nombre</strong>: Vals.ai constata que la cifra de Terminal-Bench de la propia Alibaba se obtuvo con límites de tiempo modificados — no con los límites originales.</li>\n      <li><span class=\"chip\">OSS</span> <strong>La verbosidad es un factor de precio</strong>: Qwen3.8-Max cuesta <span class=\"stat\">US$ 2</span> / <span class=\"stat\">US$ 6</span>, pero en una evaluación independiente generó 150 millones de tokens de salida en vez de los 66 millones habituales. El precio de lista, entonces, no es el precio de la factura.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Quieto en las sombras</strong>: la última entrada de Cursor sigue siendo el 03/08; el tan citado \"Cursor Router\" es del <span class=\"stat\">22/07</span> — y los porcentajes que circulan sobre él no aparecen en el changelog.</li>\n    </ul></div>"
