      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Es gilt. Seit heute ist der Rest der KI-Verordnung anwendbar; der Verordnungs-Tracker formuliert es trocken: „The remainder of the AI Act starts to apply, except Article 6(1).\"<sup>[1]</sup> Gestern eine Frist im Kalender, heute Rechtslage — und sie trifft erstmals nicht die Modellbauer in Kalifornien, sondern jeden, der in Europa einen Bot, eine Zusammenfassung oder ein generiertes Bild ausliefert. Zwei Tage vorher hat Y Combinator die Maschine veröffentlicht, mit der es seine eigene Buchhaltung, Rechtsabteilung und Eventplanung betreibt: „QM\", MIT-Lizenz, heute Vormittag bei 5,3k Sternen.<sup>[5]</sup> Beides gehört zusammen: Die eine Nachricht verlangt, dass Maschinen sich zu erkennen geben. Die andere beschreibt eine Maschine, die ausdrücklich <em>als Mensch</em> handelt — „with their credentials and permissions\".<sup>[5]</sup></p>\n    <ul>\n      <li><span class=\"chip hot\">REG · EU</span> <strong>Heute, nicht morgen:</strong> Artikel 50 ist scharf — Offenlegung beim Chatbot, maschinenlesbare Markierung synthetischer Inhalte, sichtbare Deepfake-Kennzeichnung. Sanktionsrahmen: <strong>15 Mio. €</strong> oder <strong>3 %</strong> Weltjahresumsatz, der höhere Wert zählt.<sup>[3]</sup></li>\n      <li><span class=\"chip\">REG · EU</span> <strong>Was heute <em>nicht</em> anfängt:</strong> Hochrisiko-Pflichten (Anhang III ab 02.12.2027, produktintegrierte KI ab 02.08.2028)<sup>[2]</sup> — und die Markierungspflicht für synthetische Inhalte aus Systemen, die vor heute schon im Markt waren, greift erst am <strong>02.12.2026</strong>.<sup>[4]</sup></li>\n      <li><span class=\"chip hot\">DEPLOY</span> <strong>YC macht seinen Rückraum quelloffen:</strong> „QM — a multiplayer agent harness for work. In Slack and on the web\", MIT-Lizenz, im Einsatz „across accounting, legal, events, and engineering\".<sup>[5][6]</sup> Von rund 2k Sternen am Freitag auf <strong>5,3k</strong> heute.<sup>[5]</sup></li>\n      <li><span class=\"chip hot\">ACHTUNG</span> <strong>Der Satz, über den man stolpern sollte:</strong> QMs Sicherheitsmodell sagt, „the agent acts as the person it's working for, with their credentials and permissions, and everything it does is audited\".<sup>[5]</sup> Im Protokoll sieht die Handlung des Agenten aus wie die Handlung des Mitarbeiters.</li>\n      <li><span class=\"chip\">STUDIE · GLOBAL</span> <strong>88 % nutzen, 6 % verdienen:</strong> Stanford AI Index: 88 % organisatorische Adoption<sup>[7]</sup>; bei McKinsey berichten <strong>39 %</strong> überhaupt einen EBIT-Effekt, rund <strong>6 %</strong> sind „AI high performers\".<sup>[8]</sup> Methodik-Vorbehalt unten.</li>\n      <li><span class=\"chip\">STUDIE · DE</span> <strong>Deutscher Bodenrichtwert:</strong> Bitkom misst <strong>41 %</strong> aktive Nutzer (604 Unternehmen ab 20 Beschäftigten) — und im selben Datensatz <strong>33 %</strong> mit deutlich höheren Kosten als erwartet.<sup>[9]</sup></li>\n      <li><span class=\"chip\">FINANZEN · BR</span> <strong>Brasiliens Banken, nachgerechnet:</strong> R$ 50,4 Mrd. IT-Budget für 2026 (+8 %), davon KI/GenAI 2025 <strong>R$ 826 Mio.</strong> (+39 %).<sup>[10]</sup> Eigene Rechnung: das sind <strong>rund 1,8 %</strong> des Technologie-Budgets — bei Prioritätsplatz zwei.</li>\n      <li><span class=\"chip\">STUDIE</span> <strong>Governance-Lücke:</strong> Nur <strong>53 %</strong> der Führungskräfte sagen, ihr Unternehmen habe eine etablierte Strategie für den KI-Einsatz (Okta-Auftragsstudie, 27.05.2026).<sup>[12]</sup> Fast die Hälfte betreibt Agenten ohne Regelwerk.</li>\n      <li><span class=\"chip good\">twiceD</span> Zwei Ideen aus der QM-Nachricht: ein <strong>Rückraum-Agent auf eigener Infrastruktur</strong> und ein <strong>Handlungs-Nachweis für Agenten, die als Mensch handeln</strong>.</li>\n    </ul></div>",

an class=\"chip hot\">ACHTUNG</span> <strong>Der Satz, über den man stolpern sollte:</strong> QMs Sicherheitsmodell sagt, „the agent acts as the person it's working for, with their credentials and permissions, and everything it does is audited\".<sup>[5]</sup> Im Protokoll sieht die Handlung des Agenten aus wie die Handlung des Mitarbeiters.</li>\n      <li><span class=\"chip\">STUDIE · GLOBAL</span> <strong>88 % nutzen, 6 % verdienen:</strong> Stanford AI Index: 88 % organisatorische Adoption<sup>[7]</sup>; bei McKinsey berichten <strong>39 %</strong> überhaupt einen EBIT-Effekt, rund <strong>6 %</strong> sind „AI high performers\".<sup>[8]</sup> Methodik-Vorbehalt unten.</li>\n      <li><span class=\"chip\">STUDIE · DE</span> <strong>Deutscher Bodenrichtwert:</strong> Bitkom misst <strong>41 %</strong> aktive Nutzer (604 Unternehmen ab 20 Beschäftigten) — und im selben Datensatz <strong>33 %</strong> mit deutlich höheren Kosten als erwartet.<sup>[9]</sup></li>\n      <li><span class=\"chip\">FINANZEN · BR</span> <strong>Brasiliens Banken, nachgerechnet:</strong> R$ 50,4 Mrd. IT-Budget für 2026 (+8 %), davon KI/GenAI 2025 <strong>R$ 826 Mio.</strong> (+39 %).<sup>[10]</sup> Eigene Rechnung: das sind <strong>rund 1,8 %</strong> des Technologie-Budgets — bei Prioritätsplatz zwei.</li>\n      <li><span class=\"chip\">STUDIE</span> <strong>Governance-Lücke:</strong> Nur <strong>53 %</strong> der Führungskräfte sagen, ihr Unternehmen habe eine etablierte Strategie für den KI-Einsatz (Okta-Auftragsstudie, 27.05.2026).<sup>[12]</sup> Fast die Hälfte betreibt Agenten ohne Regelwerk.</li>\n      <li><span class=\"chip good\">twiceD</span> Zwei Ideen aus der QM-Nachricht: ein <strong>Rückraum-Agent auf eigener Infrastruktur</strong> und ein <strong>Handlungs-Nachweis für Agenten, die als Mensch handeln</strong>.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">It's in effect. As of today, the rest of the AI Act is applicable; the Regulation tracker puts it flatly: \"The remainder of the AI Act starts to apply, except Article 6(1).\"<sup>[1]</sup> Yesterday it was a deadline on the calendar, today it's law — and for the first time it doesn't hit the model builders in California, but anyone in Europe delivering a bot, a summary, or a generated image. Two days earlier, Y Combinator open-sourced the machine that runs its own accounting, legal department, and event planning: \"QM,\" MIT-licensed, at 5.3k stars this morning.<sup>[5]</sup> The two stories belong together: one demands that machines identify themselves. The other describes a machine that explicitly acts as a human — \"with their credentials and permissions.\"<sup>[5]</sup></p>\n    <ul>\n      <li><span class=\"chip hot\">REG · EU</span> <strong>Today, not tomorrow:</strong> Article 50 has teeth — chatbot disclosure, machine-readable marking of synthetic content, visible deepfake labeling. Penalty cap: <strong>€15 million</strong> or <strong>3%</strong> of worldwide annual revenue, whichever is higher.<sup>[3]</sup></li>\n      <li><span class=\"chip\">REG · EU</span> <strong>What <em>doesn't</em> start today:</strong> high-risk obligations (Annex III from 12/02/2027, product-embedded AI from 08/02/2028)<sup>[2]</sup> — and the marking obligation for synthetic content from systems already on the market before today doesn't kick in until <strong>12/02/2026</strong>.<sup>[4]</sup></li>\n      <li><span class=\"chip hot\">HEADS UP</span> <strong>The sentence to trip over:</strong> QM's security model states, \"the agent acts as the person it's working for, with their credentials and permissions, and everything it does is audited.\"<sup>[5]</sup> In the log, the agent's action looks like the employee's action.</li>\n      <li><span class=\"chip hot\">DEPLOY</span> <strong>YC open-sources its back office:</strong> \"QM — a multiplayer agent harness for work. In Slack and on the web,\" MIT-licensed, in use \"across accounting, legal, events, and engineering.\"<sup>[5][6]</sup> From roughly 2k stars on Friday to <strong>5.3k</strong> today.<sup>[5]</sup></li>\n      <li><span class=\"chip\">STUDY · GLOBAL</span> <strong>88% use it, 6% profit from it:</strong> Stanford AI Index: 88% organizational adoption<sup>[7]</sup>; at McKinsey, only 39% report any EBIT impact at all, roughly 6% are \"AI high performers.\"<sup>[8]</sup> Methodology caveat below.</li>\n      <li><span class=\"chip\">STUDY · DE</span> <strong>Germany's baseline:</strong> Bitkom measures 41% active users (604 companies with 20+ employees) — and in the same dataset, 33% report markedly higher costs than expected.<sup>[9]</sup></li>\n      <li><span class=\"chip\">FINANCE · BR</span> <strong>Brazil's banks, recalculated:</strong> R$50.4 billion IT budget for 2026 (+8%), of which AI/GenAI came to <strong>R$826 million</strong> in 2025 (+39%).<sup>[10]</sup> My own math: that's <strong>roughly 1.8%</strong> of the technology budget — at priority rank two.</li>\n      <li><span class=\"chip\">STUDY</span> <strong>Governance gap:</strong> Only 53% of executives say their organization has an established strategy for AI deployment (Okta-commissioned study, 05/27/2026).<sup>[12]</sup> Nearly half are running agents with no rulebook.</li>\n      <li><span class=\"chip good\">twiceD</span> Two ideas from the QM story: a <strong>back-office agent on your own infrastructure</strong> and an <strong>action ledger for agents that act as humans</strong>.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Está em vigor. Desde hoje, o restante do Regulamento de IA é aplicável; o rastreador do Regulamento formula de modo seco: \"The remainder of the AI Act starts to apply, except Article 6(1).\"<sup>[1]</sup> Ontem era um prazo no calendário, hoje é lei — e, pela primeira vez, atinge não os fabricantes de modelos na Califórnia, mas qualquer um que entregue na Europa um bot, um resumo ou uma imagem gerada. Dois dias antes, a Y Combinator abriu o código da máquina com que opera sua própria contabilidade, departamento jurídico e organização de eventos: \"QM\", licença MIT, com 5,3k estrelas nesta manhã.<sup>[5]</sup> As duas coisas se encaixam: uma notícia exige que as máquinas se identifiquem. A outra descreve uma máquina que age explicitamente como humano — \"with their credentials and permissions\".<sup>[5]</sup></p>\n    <ul>\n      <li><span class=\"chip hot\">REG · UE</span> <strong>Hoje, não amanhã:</strong> o Artigo 50 tem força — divulgação no chatbot, marcação legível por máquina de conteúdo sintético, rotulagem visível de deepfake. Teto de sanção: <strong>€ 15 milhões</strong> ou <strong>3%</strong> do faturamento mundial anual, o que for maior.<sup>[3]</sup></li>\n      <li><span class=\"chip\">REG · UE</span> <strong>O que <em>não</em> começa hoje:</strong> obrigações de alto risco (Anexo III a partir de 02/12/2027, IA embutida em produtos a partir de 02/08/2028)<sup>[2]</sup> — e a obrigação de marcação para conteúdo sintético de sistemas que já estavam no mercado antes de hoje só entra em vigor em <strong>02/12/2026</strong>.<sup>[4]</sup></li>\n      <li><span class=\"chip hot\">ATENÇÃO</span> <strong>A frase em que você deveria tropeçar:</strong> o modelo de segurança do QM diz que \"the agent acts as the person it's working for, with their credentials and permissions, and everything it does is audited\".<sup>[5]</sup> No registro, a ação do agente parece a ação do funcionário.</li>\n      <li><span class=\"chip hot\">DEPLOY</span> <strong>A YC abre o código do próprio backoffice:</strong> \"QM — a multiplayer agent harness for work. In Slack and on the web\", licença MIT, em uso \"across accounting, legal, events, and engineering\".<sup>[5][6]</sup> De cerca de 2k estrelas na sexta-feira para <strong>5,3k</strong> hoje.<sup>[5]</sup></li>\n      <li><span class=\"chip\">ESTUDO · GLOBAL</span> <strong>88% usam, 6% lucram:</strong> Stanford AI Index: 88% de adoção organizacional<sup>[7]</sup>; na McKinsey, apenas 39% relatam algum efeito no EBIT, cerca de 6% são \"AI high performers\".<sup>[8]</sup> Ressalva metodológica abaixo.</li>\n      <li><span class=\"chip\">ESTUDO · DE</span> <strong>O valor de referência alemão:</strong> a Bitkom mede 41% de usuários ativos (604 empresas com 20 ou mais funcionários) — e, no mesmo conjunto de dados, 33% com custos bem mais altos do que o esperado.<sup>[9]</sup></li>\n      <li><span class=\"chip\">FINANÇAS · BR</span> <strong>Os bancos do Brasil, recalculados:</strong> R$ 50,4 bilhões de orçamento de TI para 2026 (+8%), dos quais IA/IA generativa somou <strong>R$ 826 milhões</strong> em 2025 (+39%).<sup>[10]</sup> Conta própria: isso é <strong>cerca de 1,8%</strong> do orçamento de tecnologia — no segundo lugar de prioridade.</li>\n      <li><span class=\"chip\">ESTUDO</span> <strong>Lacuna de governança:</strong> apenas 53% dos executivos dizem que sua empresa tem uma estratégia estabelecida para o uso de IA (estudo encomendado pela Okta, 27/05/2026).<sup>[12]</sup> Quase metade opera agentes sem regras.</li>\n      <li><span class=\"chip good\">twiceD</span> Duas ideias a partir da notícia do QM: um <strong>agente de backoffice em infraestrutura própria</strong> e um <strong>comprovante de ação para agentes que agem como humanos</strong>.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Está en vigor. Desde hoy, el resto del Reglamento de IA es aplicable; el rastreador del Reglamento lo dice sin rodeos: \"The remainder of the AI Act starts to apply, except Article 6(1).\"<sup>[1]</sup> Ayer era una fecha límite en el calendario, hoy es ley — y por primera vez no afecta a los fabricantes de modelos en California, sino a cualquiera que entregue en Europa un bot, un resumen o una imagen generada. Dos días antes, Y Combinator liberó el código de la máquina con la que opera su propia contabilidad, departamento legal y organización de eventos: \"QM\", licencia MIT, con 5,3k estrellas esta mañana.<sup>[5]</sup> Las dos noticias van juntas: una exige que las máquinas se identifiquen. La otra describe una máquina que actúa explícitamente como humano — \"with their credentials and permissions\".<sup>[5]</sup></p>\n    <ul>\n      <li><span class=\"chip hot\">REG · UE</span> <strong>Hoy, no mañana:</strong> el Artículo 50 tiene dientes — divulgación en el chatbot, marcado legible por máquina de contenido sintético, etiquetado visible de deepfakes. Tope de sanción: <strong>15 millones de euros</strong> o <strong>3%</strong> de la facturación mundial anual, lo que sea mayor.<sup>[3]</sup></li>\n      <li><span class=\"chip\">REG · UE</span> <strong>Lo que <em>no</em> empieza hoy:</strong> obligaciones de alto riesgo (Anexo III desde el 02/12/2027, IA integrada en productos desde el 02/08/2028)<sup>[2]</sup> — y la obligación de marcado para contenido sintético de sistemas que ya estaban en el mercado antes de hoy no entra en vigor hasta el <strong>02/12/2026</strong>.<sup>[4]</sup></li>\n      <li><span class=\"chip hot\">ATENCIÓN</span> <strong>La frase con la que hay que tropezar:</strong> el modelo de seguridad de QM dice que \"the agent acts as the person it's working for, with their credentials and permissions, and everything it does is audited\".<sup>[5]</sup> En el registro, la acción del agente se ve como la acción del empleado.</li>\n      <li><span class=\"chip hot\">DEPLOY</span> <strong>YC libera el código de su back office:</strong> \"QM — a multiplayer agent harness for work. In Slack and on the web\", licencia MIT, en uso \"across accounting, legal, events, and engineering\".<sup>[5][6]</sup> De unas 2k estrellas el viernes a <strong>5,3k</strong> hoy.<sup>[5]</sup></li>\n      <li><span class=\"chip\">ESTUDIO · GLOBAL</span> <strong>88% usa, 6% gana:</strong> Stanford AI Index: 88% de adopción organizacional<sup>[7]</sup>; en McKinsey, solo el 39% reporta algún efecto en el EBIT, cerca del 6% son \"AI high performers\".<sup>[8]</sup> Salvedad metodológica más abajo.</li>\n      <li><span class=\"chip\">ESTUDIO · DE</span> <strong>El valor de referencia alemán:</strong> Bitkom mide 41% de usuarios activos (604 empresas con 20 o más empleados) — y, en el mismo conjunto de datos, 33% con costos bastante más altos de lo esperado.<sup>[9]</sup></li>\n      <li><span class=\"chip\">FINANZAS · BR</span> <strong>Los bancos de Brasil, recalculados:</strong> R$ 50,4 mil millones de presupuesto de TI para 2026 (+8%), de los cuales IA/IA generativa sumó <strong>R$ 826 millones</strong> en 2025 (+39%).<sup>[10]</sup> Cuenta propia: eso es <strong>alrededor del 1,8%</strong> del presupuesto de tecnología — en el segundo lugar de prioridad.</li>\n      <li><span class=\"chip\">ESTUDIO</span> <strong>Brecha de gobernanza:</strong> solo el 53% de los ejecutivos dice que su organización tiene una estrategia establecida para el despliegue de IA (estudio encargado por Okta, 27/05/2026).<sup>[12]</sup> Casi la mitad opera agentes sin reglas.</li>\n      <li><span class=\"chip good\">twiceD</span> Dos ideas a partir de la noticia de QM: un <strong>agente de back office en infraestructura propia</strong> y un <strong>registro de acción para agentes que actúan como humanos</strong>.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Der Sonntags-Abruf bringt <strong>71 Listings</strong> nach 42 am Samstag, der stärkste Zuwachs seit Wochen — und er kommt vollständig von einer einzigen Plattform: <strong>alle 30 Neuzugänge stammen von freelancermap.de</strong>, das dort von 29 auf 59 Einträge geht. 41 der 42 Vortags-Einträge sind punktgleich wieder da, genau <strong>einer</strong> ist gefallen. Ein Markt, der über ein Wochenende dreißig Java-Mandate ausschreibt und dabei nichts abräumt, wäre eine Nachricht; ein Aggregator, der tiefer in denselben Bestand blättert, ist keine. Der Beleg für die zweite Lesart steht in den Anzeigen selbst: <strong>13 der 30 Neuzugänge nennen einen Projektstart, der bereits vergangen ist</strong> — vier davon aus Januar und Februar. Damit kippt zugleich die These vom Freitag: Java verdoppelt sich (16 → 30), Angular mehr als das (11 → 28), <strong>KI-Integration bleibt bei exakt 11</strong> und rutscht vom häufigsten Skill-Tag auf Platz acht. Der externe Anker bleibt davon unberührt und zeigt in die andere Richtung — 103 €/h im DACH-Durchschnitt nach 104 im Vorjahr, bei einem Monatseinkommen, das um 21 % gefallen ist.</p>\n    <ul>\n      <li><span class=\"chip hot\">Board</span> <strong>71 Listings, plus 69 %</strong>: 61 Freelance, 6 Employee, 4 Intriguing. 41 Einträge übernommen, <strong>30 neu, 1 gefallen</strong> — und die 41 Übernahmen tragen alle exakt denselben Fit-Score wie gestern. Ein sauberes Vergleichspaar, deshalb sind die Verschiebungen unten belastbar.</li>\n      <li><span class=\"chip hot\">Board</span> <strong>Die Freitags-These ist widerlegt</strong>: Java 16 → 30 (×1,88), Angular 11 → 28 (×2,55), TypeScript ×2,75, AWS ×3,33 — <strong>KI-Integration ×1,00</strong> (11 → 11). Am 31.07. stand hier, KI-Integration sei erstmals der häufigste Skill-Tag. Zwei Abrufe später steht sie auf Platz acht der Tag-Rangliste, hinter Java, Angular, Spring Boot, Kubernetes und DevOps. Der Tag-Mix misst die Abruftiefe bei freelancermap, nicht den Markt.</li>\n      <li><span class=\"chip\">Board</span> <strong>13 der 30 Neuzugänge werben mit einem Startdatum in der Vergangenheit</strong> — zweimal 01.01., 02.01., 01.02., 01.05., 11.05., 26.05., 01.06., viermal 01.07., 01.08. Das Board ist nicht frischer geworden, es reicht tiefer in den Altbestand.</li>\n      <li><span class=\"chip good\">twiceD</span> <strong>Die Spitze ist neu und trotzdem alt bekannt</strong>: <strong>iSAX mit Fit 83</strong> (Java 21, Spring Boot 3, Angular, Flutter, AWS Cognito, 100 % remote ab Frankfurt) — dieselbe Anzeige, die am 31.07. mit Fit 87 vorn stand, gestern fehlte und heute unter anderem Slug zurückkommt. Dahinter teclift (82), JetBrains (82), ELCA Zürich (81), Keil (80). <strong>22 Einträge ≥ Fit 70</strong> nach 12 gestern.</li>\n      <li><span class=\"chip hot\">Rate</span> <strong>Vier von 71 nennen eine Vergütung ohne Sternchen</strong>: ProTIP ~85 €/h (680 €/Tag bestätigt), Grafana Labs € 109.000–137.000/Jahr, Right People Group 70 €/h, Anthropic $ 405.000–485.000/Jahr. 64 Bänder sind recherchierter Benchmark, drei Anzeigen nennen gar nichts. Ein echtes Veröffentlichungsdatum trägt <strong>5 von 71</strong>.</li>\n      <li><span class=\"chip hot\">Rate</span> <strong>Der externe Anker sinkt</strong>: DACH-Durchschnittssatz <strong>103 €/h</strong> nach 104 €/h, Monatseinkommen <strong>6.653 €</strong> nach 8.432 € (−21 %), und <strong>62 %</strong> der Befragten planen für 2026 keine Preiserhöhung, 9 % wollen senken (N = 5.412, veröffentlicht 17.03.2026).<sup>[1]</sup></li>\n      <li><span class=\"chip good\">Vergabe</span> <strong>BSI schreibt Prüfanforderungen für agentische KI aus</strong>: „Projekt 1000 – PRAKI\", CPV 72000000, 18 Monate, <strong>KMU-geeignet: ja</strong>, Abgabefrist <strong>10.08.2026, 16:00 MESZ</strong>, Angebotsöffnung 11.08. um 10:00.<sup>[7]</sup> Thematisch der beste Vergabe-Treffer seit Wochen — die Eignungsschwellen stehen aber <strong>nicht in der Bekanntmachung</strong>, nur in der Leistungsbeschreibung hinter dem Vergabeportal.</li>\n      <li><span class=\"chip\">Vergabe</span> <strong>Stadtwerke Leipzig, Microservices-Rahmenvertrag, 48 Monate</strong>, Frist 21.08.2026 08:00 MESZ — Stack-Match wörtlich (Java, Micro-Services, 2nd/3rd-Level). Als Bieter dennoch außer Reichweite: <strong>≥ 4,0 Mio. € Umsatz je Geschäftsjahr, ≥ 20 Mitarbeitende im Dreijahresschnitt, 3 Mio. € Haftpflicht dreifach</strong>.<sup>[8]</sup></li>\n      <li><span class=\"chip\">CH</span> <strong>Die eigene Schweiz-Schwelle liegt über dem Schweizer Durchschnitt</strong>: CHF 150 k/Jahr verlangt dieser Filter, Glassdoor weist für Senior Software Engineers <strong>CHF 130.000</strong> im Landesschnitt und CHF 141.000 in Zürich aus (Stand Juni 2026, n = 1.704), Payscale <strong>CHF 119.722</strong> (Stand 15.12.2025, n = 160).<sup>[5][6]</sup></li>\n      <li><span class=\"chip\">Markt</span> <strong>Makro leicht freundlicher, Konzerne nicht</strong>: ifo-Geschäftsklimaindex Juli <strong>86,6</strong> nach 85,7 im Juni<sup>[3]</sup>; SAP hält einen nahezu firmenweiten Einstellungsstopp über rund 110.000 Beschäftigte, ausgenommen sind nur geschäftskritische KI-Rollen<sup>[4]</sup>.</li>\n    </ul></div>",

fe bei freelancermap, nicht den Markt.</li>\n      <li><span class=\"chip\">Board</span> <strong>13 der 30 Neuzugänge werben mit einem Startdatum in der Vergangenheit</strong> — zweimal 01.01., 02.01., 01.02., 01.05., 11.05., 26.05., 01.06., viermal 01.07., 01.08. Das Board ist nicht frischer geworden, es reicht tiefer in den Altbestand.</li>\n      <li><span class=\"chip good\">twiceD</span> <strong>Die Spitze ist neu und trotzdem alt bekannt</strong>: <strong>iSAX mit Fit 83</strong> (Java 21, Spring Boot 3, Angular, Flutter, AWS Cognito, 100 % remote ab Frankfurt) — dieselbe Anzeige, die am 31.07. mit Fit 87 vorn stand, gestern fehlte und heute unter anderem Slug zurückkommt. Dahinter teclift (82), JetBrains (82), ELCA Zürich (81), Keil (80). <strong>22 Einträge ≥ Fit 70</strong> nach 12 gestern.</li>\n      <li><span class=\"chip hot\">Rate</span> <strong>Vier von 71 nennen eine Vergütung ohne Sternchen</strong>: ProTIP ~85 €/h (680 €/Tag bestätigt), Grafana Labs € 109.000–137.000/Jahr, Right People Group 70 €/h, Anthropic $ 405.000–485.000/Jahr. 64 Bänder sind recherchierter Benchmark, drei Anzeigen nennen gar nichts. Ein echtes Veröffentlichungsdatum trägt <strong>5 von 71</strong>.</li>\n      <li><span class=\"chip hot\">Rate</span> <strong>Der externe Anker sinkt</strong>: DACH-Durchschnittssatz <strong>103 €/h</strong> nach 104 €/h, Monatseinkommen <strong>6.653 €</strong> nach 8.432 € (−21 %), und <strong>62 %</strong> der Befragten planen für 2026 keine Preiserhöhung, 9 % wollen senken (N = 5.412, veröffentlicht 17.03.2026).<sup>[1]</sup></li>\n      <li><span class=\"chip good\">Vergabe</span> <strong>BSI schreibt Prüfanforderungen für agentische KI aus</strong>: „Projekt 1000 – PRAKI\", CPV 72000000, 18 Monate, <strong>KMU-geeignet: ja</strong>, Abgabefrist <strong>10.08.2026, 16:00 MESZ</strong>, Angebotsöffnung 11.08. um 10:00.<sup>[7]</sup> Thematisch der beste Vergabe-Treffer seit Wochen — die Eignungsschwellen stehen aber <strong>nicht in der Bekanntmachung</strong>, nur in der Leistungsbeschreibung hinter dem Vergabeportal.</li>\n      <li><span class=\"chip\">Vergabe</span> <strong>Stadtwerke Leipzig, Microservices-Rahmenvertrag, 48 Monate</strong>, Frist 21.08.2026 08:00 MESZ — Stack-Match wörtlich (Java, Micro-Services, 2nd/3rd-Level). Als Bieter dennoch außer Reichweite: <strong>≥ 4,0 Mio. € Umsatz je Geschäftsjahr, ≥ 20 Mitarbeitende im Dreijahresschnitt, 3 Mio. € Haftpflicht dreifach</strong>.<sup>[8]</sup></li>\n      <li><span class=\"chip\">CH</span> <strong>Die eigene Schweiz-Schwelle liegt über dem Schweizer Durchschnitt</strong>: CHF 150 k/Jahr verlangt dieser Filter, Glassdoor weist für Senior Software Engineers <strong>CHF 130.000</strong> im Landesschnitt und CHF 141.000 in Zürich aus (Stand Juni 2026, n = 1.704), Payscale <strong>CHF 119.722</strong> (Stand 15.12.2025, n = 160).<sup>[5][6]</sup></li>\n      <li><span class=\"chip\">Markt</span> <strong>Makro leicht freundlicher, Konzerne nicht</strong>: ifo-Geschäftsklimaindex Juli <strong>86,6</strong> nach 85,7 im Juni<sup>[3]</sup>; SAP hält einen nahezu firmenweiten Einstellungsstopp über rund 110.000 Beschäftigte, ausgenommen sind nur geschäftskritische KI-Rollen<sup>[4]</sup>.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Sunday's pull brings <strong>71 listings</strong> after 42 on Saturday, the strongest jump in weeks — and it comes entirely from a single platform: <strong>all 30 newcomers are from freelancermap.de</strong>, which goes from 29 to 59 entries there. 41 of the 42 prior-day entries are back with identical scores, exactly <strong>one</strong> has dropped. A market that posts thirty Java mandates over a weekend without filling any of them would be news; an aggregator paging deeper into the same inventory is not. The evidence for the second reading sits in the listings themselves: <strong>13 of the 30 newcomers state a project start that has already passed</strong> — four of them from January and February. That also topples Friday's thesis: Java doubles (16 → 30), Angular more than doubles (11 → 28), <strong>AI integration stays flat at exactly 11</strong> and slides from the most common skill tag to eighth place. The external anchor is untouched by any of this and points the other way — €103/h DACH average, down from €104 the year before, with monthly income down 21%.</p>\n    <ul>\n      <li><span class=\"chip hot\">Board</span> <strong>71 listings, up 69%</strong>: 61 freelance, 6 employee, 4 intriguing. 41 entries carried over, <strong>30 new, 1 dropped</strong> — and all 41 carryovers hold the exact same fit score as yesterday. A clean comparison pair, so the shifts below hold up.</li>\n      <li><span class=\"chip hot\">Board</span> <strong>Friday's thesis is disproved</strong>: Java 16 → 30 (×1.88), Angular 11 → 28 (×2.55), TypeScript ×2.75, AWS ×3.33 — <strong>AI integration ×1.00</strong> (11 → 11). On Jul 31 this brief said AI integration was, for the first time, the most common skill tag. Two pulls later it sits eighth on the tag ranking, behind Java, Angular, Spring Boot, Kubernetes, and DevOps. The tag mix measures freelancermap's pull depth, not the market.</li>\n      <li><span class=\"chip\">Board</span> <strong>13 of the 30 newcomers advertise a start date in the past</strong> — Jan 1 twice, Jan 2, Feb 1, May 1, May 11, May 26, Jun 1, Jul 1 four times, and Aug 1. The board hasn't gotten fresher, it's reaching deeper into old inventory.</li>\n      <li><span class=\"chip good\">twiceD</span> <strong>The top spot is new and yet an old acquaintance</strong>: <strong>iSAX at fit 83</strong> (Java 21, Spring Boot 3, Angular, Flutter, AWS Cognito, 100% remote from Frankfurt) — the same listing that led with fit 87 on Jul 31, was missing yesterday, and returns today under a different slug. Behind it: teclift (82), JetBrains (82), ELCA Zurich (81), Keil (80). <strong>22 entries ≥ fit 70</strong>, up from 12 yesterday.</li>\n      <li><span class=\"chip hot\">Rate</span> <strong>Four of 71 state a self-reported rate</strong>: ProTIP ~€85/h (€680/day confirmed), Grafana Labs €109,000–137,000/yr, Right People Group €70/h, Anthropic $405,000–485,000/yr. 64 bands are a researched benchmark, three listings state nothing at all. Only <strong>5 of 71</strong> carry an actual publication date.</li>\n      <li><span class=\"chip hot\">Rate</span> <strong>The external anchor is falling</strong>: DACH average rate <strong>€103/h</strong>, down from €104/h, monthly income <strong>€6,653</strong>, down from €8,432 (−21%), and <strong>62%</strong> of respondents plan no rate increase for 2026, 9% plan to lower it (N = 5,412, published Mar 17, 2026).<sup>[1]</sup></li>\n      <li><span class=\"chip good\">Tender</span> <strong>BSI tenders assessment requirements for agentic AI</strong>: „Projekt 1000 – PRAKI\", CPV 72000000, 18 months, <strong>SME-suitable: yes</strong>, submission deadline <strong>Aug 10, 2026, 16:00 CEST</strong>, bid opening Aug 11 at 10:00.<sup>[7]</sup> Thematically the best tender match in weeks — but the eligibility thresholds are <strong>not in the notice</strong>, only in the scope description behind the procurement portal.</li>\n      <li><span class=\"chip\">Tender</span> <strong>Stadtwerke Leipzig, microservices framework agreement, 48 months</strong>, deadline Aug 21, 2026, 08:00 CEST — a literal stack match (Java, microservices, 2nd/3rd-level). Still out of reach as a bidder: <strong>≥ €4.0M revenue per fiscal year, ≥ 20 employees on a three-year average, €3M liability coverage times three</strong>.<sup>[8]</sup></li>\n      <li><span class=\"chip\">CH</span> <strong>This profile's own Swiss threshold sits above the Swiss average</strong>: this filter requires CHF 150k/year, Glassdoor puts senior software engineers at CHF 130,000 nationally and CHF 141,000 in Zurich (as of June 2026, n = 1,704), Payscale at <strong>CHF 119,722</strong> (as of Dec 15, 2025, n = 160).<sup>[5][6]</sup></li>\n      <li><span class=\"chip\">Market</span> <strong>Macro slightly friendlier, corporates not so much</strong>: ifo business climate index for July at <strong>86.6</strong>, up from 85.7 in June<sup>[3]</sup>; SAP holds a near-company-wide hiring freeze across roughly 110,000 employees, with only business-critical AI roles exempt<sup>[4]</sup>.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">O levantamento de domingo traz <strong>71 vagas</strong> depois de 42 no sábado, o maior salto em semanas — e ele vem inteiramente de uma única plataforma: <strong>todos os 30 registros novos vêm do freelancermap.de</strong>, que ali passa de 29 para 59 registros. 41 dos 42 registros do dia anterior estão de volta com a pontuação idêntica, exatamente <strong>um</strong> caiu. Um mercado que publica trinta mandatos Java num fim de semana sem preencher nenhum seria notícia; um agregador que folheia mais fundo no mesmo estoque não é. A prova para a segunda leitura está nos próprios anúncios: <strong>13 dos 30 registros novos informam um início de projeto que já passou</strong> — quatro deles de janeiro e fevereiro. Isso também derruba a tese de sexta-feira: Java dobra (16 → 30), Angular mais que dobra (11 → 28), <strong>Integração de IA fica estável em exatamente 11</strong> e cai da tag de habilidade mais comum para a oitava posição. A âncora externa permanece intocada por tudo isso e aponta na direção oposta — 103 €/h de média DACH, abaixo dos 104 do ano anterior, com a renda mensal caindo 21%.</p>\n    <ul>\n      <li><span class=\"chip hot\">Board</span> <strong>71 vagas, mais 69%</strong>: 61 Freelance, 6 Employee, 4 Intriguing. 41 registros mantidos, <strong>30 novos, 1 caiu</strong> — e os 41 mantidos trazem exatamente a mesma pontuação de fit de ontem. Um par de comparação limpo, por isso as mudanças abaixo são confiáveis.</li>\n      <li><span class=\"chip hot\">Board</span> <strong>A tese de sexta-feira está refutada</strong>: Java 16 → 30 (×1,88), Angular 11 → 28 (×2,55), TypeScript ×2,75, AWS ×3,33 — <strong>Integração de IA ×1,00</strong> (11 → 11). Em 31/07 esta edição dizia que Integração de IA era, pela primeira vez, a tag de habilidade mais comum. Duas coletas depois, ela está na oitava posição do ranking de tags, atrás de Java, Angular, Spring Boot, Kubernetes e DevOps. A mistura de tags mede a profundidade da coleta no freelancermap, não o mercado.</li>\n      <li><span class=\"chip\">Board</span> <strong>13 dos 30 registros novos anunciam uma data de início no passado</strong> — 01/01 duas vezes, 02/01, 01/02, 01/05, 11/05, 26/05, 01/06, quatro vezes 01/07 e 01/08. O board não ficou mais recente, ele está indo mais fundo no estoque antigo.</li>\n      <li><span class=\"chip good\">twiceD</span> <strong>A liderança é nova e, ainda assim, uma velha conhecida</strong>: <strong>iSAX com fit 83</strong> (Java 21, Spring Boot 3, Angular, Flutter, AWS Cognito, 100% remoto a partir de Frankfurt) — o mesmo anúncio que liderou com fit 87 em 31/07, esteve ausente ontem e volta hoje sob outro slug. Atrás dele: teclift (82), JetBrains (82), ELCA Zurique (81), Keil (80). <strong>22 registros ≥ fit 70</strong> ante 12 ontem.</li>\n      <li><span class=\"chip hot\">Taxa</span> <strong>Quatro dos 71 informam uma tarifa por conta própria</strong>: ProTIP ~85 €/h (680 €/dia confirmado), Grafana Labs € 109.000–137.000/ano, Right People Group 70 €/h, Anthropic $ 405.000–485.000/ano. 64 faixas são benchmark pesquisado, três anúncios não informam nada. Apenas <strong>5 dos 71</strong> trazem uma data de publicação real.</li>\n      <li><span class=\"chip hot\">Taxa</span> <strong>A âncora externa está caindo</strong>: tarifa média DACH <strong>103 €/h</strong> ante 104 €/h, renda mensal <strong>6.653 €</strong> ante 8.432 € (−21%), e <strong>62%</strong> dos entrevistados não planejam reajuste para 2026, 9% querem reduzir (N = 5.412, publicado em 17/03/2026).<sup>[1]</sup></li>\n      <li><span class=\"chip good\">Licitação</span> <strong>BSI licita requisitos de verificação para IA agêntica</strong>: „Projekt 1000 – PRAKI\", CPV 72000000, 18 meses, <strong>apta para PME: sim</strong>, prazo de envio <strong>10/08/2026, 16h00 CEST</strong>, abertura das propostas em 11/08 às 10h00.<sup>[7]</sup> Tematicamente, o melhor achado de licitação em semanas — mas os limiares de habilitação <strong>não estão na convocação</strong>, apenas na descrição do objeto atrás do portal de licitações.</li>\n      <li><span class=\"chip\">Licitação</span> <strong>Stadtwerke Leipzig, contrato-quadro de microsserviços, 48 meses</strong>, prazo 21/08/2026 08h00 CEST — stack-match literal (Java, microsserviços, 2º/3º nível). Ainda assim fora de alcance como licitante: <strong>≥ 4,0 milhões de € de faturamento por exercício, ≥ 20 funcionários na média trienal, 3 milhões de € de responsabilidade civil em triplo</strong>.<sup>[8]</sup></li>\n      <li><span class=\"chip\">CH</span> <strong>O próprio limiar suíço deste perfil fica acima da média suíça</strong>: este filtro exige CHF 150 mil/ano, o Glassdoor aponta CHF 130.000 na média nacional para engenheiros de software sênior e CHF 141.000 em Zurique (posição de junho de 2026, n = 1.704), o Payscale aponta <strong>CHF 119.722</strong> (posição de 15/12/2025, n = 160).<sup>[5][6]</sup></li>\n      <li><span class=\"chip\">Mercado</span> <strong>Macro levemente mais favorável, as grandes empresas não</strong>: índice de clima de negócios ifo de julho em <strong>86,6</strong> ante 85,7 em junho<sup>[3]</sup>; a SAP mantém um congelamento de contratações praticamente em toda a empresa, atingindo cerca de 110.000 funcionários, com exceção apenas para funções de IA críticas para o negócio<sup>[4]</sup>.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">El rastreo del domingo trae <strong>71 vacantes</strong> después de 42 el sábado, el mayor salto en semanas — y viene por completo de una sola plataforma: <strong>las 30 incorporaciones nuevas provienen de freelancermap.de</strong>, que ahí pasa de 29 a 59 registros. 41 de los 42 registros del día anterior están de vuelta con el mismo puntaje, exactamente <strong>uno</strong> cayó. Un mercado que publica treinta mandatos Java en un fin de semana sin cubrir ninguno sería noticia; un agregador que hojea más profundo en el mismo inventario no lo es. La prueba de la segunda lectura está en los propios anuncios: <strong>13 de las 30 incorporaciones nuevas indican un inicio de proyecto que ya pasó</strong> — cuatro de ellas de enero y febrero. Eso también tumba la tesis del viernes: Java se duplica (16 → 30), Angular más que se duplica (11 → 28), <strong>la Integración de IA se mantiene fija en exactamente 11</strong> y cae de la etiqueta de habilidad más frecuente al octavo lugar. El ancla externa permanece intocada por todo esto y apunta en la dirección contraria — 103 €/h de promedio DACH tras 104 el año anterior, con el ingreso mensual cayendo 21 %.</p>\n    <ul>\n      <li><span class=\"chip hot\">Board</span> <strong>71 vacantes, +69 %</strong>: 61 Freelance, 6 Employee, 4 Intriguing. 41 registros se mantienen, <strong>30 nuevos, 1 cayó</strong> — y los 41 mantenidos tienen exactamente el mismo puntaje de fit que ayer. Un par de comparación limpio, por lo que los cambios de abajo son confiables.</li>\n      <li><span class=\"chip hot\">Board</span> <strong>La tesis del viernes queda refutada</strong>: Java 16 → 30 (×1,88), Angular 11 → 28 (×2,55), TypeScript ×2,75, AWS ×3,33 — <strong>Integración de IA ×1,00</strong> (11 → 11). El 31/07 aquí se decía que la Integración de IA era, por primera vez, la etiqueta de habilidad más frecuente. Dos rastreos después, está en el octavo lugar del ranking de etiquetas, detrás de Java, Angular, Spring Boot, Kubernetes y DevOps. La mezcla de etiquetas mide la profundidad del rastreo en freelancermap, no el mercado.</li>\n      <li><span class=\"chip\">Board</span> <strong>13 de las 30 incorporaciones nuevas anuncian una fecha de inicio en el pasado</strong> — 01/01 dos veces, 02/01, 01/02, 01/05, 11/05, 26/05, 01/06, cuatro veces 01/07 y 01/08. El board no se volvió más reciente, está llegando más profundo al inventario antiguo.</li>\n      <li><span class=\"chip good\">twiceD</span> <strong>La cima es nueva y, aun así, una vieja conocida</strong>: <strong>iSAX con fit 83</strong> (Java 21, Spring Boot 3, Angular, Flutter, AWS Cognito, 100 % remoto desde Fráncfort) — el mismo anuncio que encabezó con fit 87 el 31/07, faltó ayer y regresa hoy bajo otro slug. Detrás: teclift (82), JetBrains (82), ELCA Zúrich (81), Keil (80). <strong>22 registros ≥ fit 70</strong> frente a 12 ayer.</li>\n      <li><span class=\"chip hot\">Tarifa</span> <strong>Cuatro de 71 declaran una tarifa por cuenta propia</strong>: ProTIP ~85 €/h (680 €/día confirmado), Grafana Labs € 109,000–137,000/año, Right People Group 70 €/h, Anthropic $ 405,000–485,000/año. 64 bandas son benchmark investigado, tres anuncios no declaran nada. Solo <strong>5 de 71</strong> tienen una fecha de publicación real.</li>\n      <li><span class=\"chip hot\">Tarifa</span> <strong>El ancla externa sigue cayendo</strong>: tarifa promedio DACH <strong>103 €/h</strong> tras 104 €/h, ingreso mensual <strong>6,653 €</strong> tras 8,432 € (−21 %), y <strong>62 %</strong> de los encuestados no planea un aumento de tarifa para 2026, 9 % quiere bajarla (N = 5,412, publicado el 17/03/2026).<sup>[1]</sup></li>\n      <li><span class=\"chip good\">Licitación</span> <strong>El BSI licita requisitos de verificación para IA agéntica</strong>: „Projekt 1000 – PRAKI\", CPV 72000000, 18 meses, <strong>apto para pymes: sí</strong>, plazo de envío <strong>10/08/2026, 16:00 CEST</strong>, apertura de propuestas el 11/08 a las 10:00.<sup>[7]</sup> Temáticamente, el mejor hallazgo de licitación en semanas — pero los umbrales de aptitud <strong>no están en la convocatoria</strong>, solo en la descripción del objeto detrás del portal de licitaciones.</li>\n      <li><span class=\"chip\">Licitación</span> <strong>Stadtwerke Leipzig, contrato marco de microservicios, 48 meses</strong>, plazo 21/08/2026 08:00 CEST — coincidencia de stack literal (Java, microservicios, 2º/3er nivel). Aun así fuera de alcance como licitante: <strong>≥ 4.0 millones de € de facturación por ejercicio, ≥ 20 empleados en promedio trienal, 3 millones de € de responsabilidad civil por triplicado</strong>.<sup>[8]</sup></li>\n      <li><span class=\"chip\">CH</span> <strong>El propio umbral suizo de este perfil está por encima del promedio suizo</strong>: este filtro exige CHF 150 mil/año, Glassdoor reporta CHF 130,000 de promedio nacional para ingenieros de software senior y CHF 141,000 en Zúrich (con fecha de junio de 2026, n = 1,704), Payscale reporta <strong>CHF 119,722</strong> (con fecha del 15/12/2025, n = 160).<sup>[5][6]</sup></li>\n      <li><span class=\"chip\">Mercado</span> <strong>Macro un poco más favorable, las corporativas no</strong>: índice de clima empresarial ifo de julio en <strong>86.6</strong> tras 85.7 en junio<sup>[3]</sup>; SAP mantiene un congelamiento de contrataciones prácticamente en toda la empresa, sobre unos 110,000 empleados, con excepción solo de los roles de IA críticos para el negocio<sup>[4]</sup>.</li>\n    </ul></div>"

        "en": "<div class=\"tldr\"><p class=\"lead\">Sunday, August 2 — and for the first time in weeks, this brief doesn't have to open with \"nothing dated to be found online in the core ring.\" From <strong>August 12 to 16</strong>, Sesc brings the 45th Semana Literária to 27 cities across Paraná, and <strong>Jacarezinho</strong> is one of them: about 50 km away, our own neighboring town. On top of that comes a Saturday worth marking on the calendar now — <strong>08/08</strong> fills the Sesc Londrina from morning to afternoon with free workshops, including a <em>music hour for babies</em>. And hovering above it all, unchanged, is this household's winter question: a national bulletin currently attributes half of all positive respiratory tests to a virus that mainly hits children <strong>under two</strong>. Both belong in today's same plan.</p>\n    <ul>\n      <li><span class=\"chip good\">WEATHER</span> <strong>Three dry days ahead:</strong> today <strong>16–26°C</strong>, 0.0 mm, plus Monday 16–26°C and Tuesday 17–27°C — <strong>0% rain</strong> each day. Two independently checked portals agree on precipitation.</li>\n      <li><span class=\"chip\">WEATHER</span> <strong>The break comes Thursday:</strong> both portals see rain again for the first time on <strong>Thu 08/06</strong> — Climatempo <strong>40%</strong>, theweather <strong>70%</strong>. For Wednesday they disagree by six degrees.</li>\n      <li><span class=\"chip hot\">BABY</span> <strong>The number shaping the plan:</strong> InfoGripe (Fiocruz) reports for the four weeks through <strong>epi week 27/2026</strong>: <strong>57.2%</strong> of all positive respiratory samples were <strong>RSV</strong> — the virus that mainly sends children under 2 to the hospital. Paraná is among the states with elevated SARI incidence.</li>\n      <li><span class=\"chip good\">EVENT</span> <strong>Core ring, finally:</strong> 45ª Semana Literária e Feira do Livro, <strong>Aug 12–16</strong>, with <strong>Jacarezinho</strong> and Cornélio Procópio among the 27 cities. 2026 honored author: Adélia Prado.</li>\n      <li><span class=\"chip good\">EVENT</span> <strong>Saturday 08/08 at Sesc Londrina:</strong> \"Musicalização para bebês\" <strong>9 and 9:30 AM</strong>, drum workshop 10:30 AM, group percussion 3:30 PM — all explicitly <strong>gratuito</strong>.</li>\n      <li><span class=\"chip\">TODAY</span> <strong>Anyone still heading out today:</strong> Sesc Londrina is open Sundays until <strong>6 PM</strong> — 3 PM \"Desenhando com o corpo e o som\" (free), 5 PM \"Show com Souza\".</li>\n      <li><span class=\"chip good\">HEALTH</span> <strong>Dengue, now cleanly quantified:</strong> Informe nº 23 (epi weeks 01–28/2026) reports <strong>5,701</strong> confirmed cases and <strong>4</strong> deaths nationwide — <strong>−93.6%</strong> and <strong>−97.1%</strong> versus 2025. Our 19ª Regional Jacarezinho: <strong>84</strong> cases, <strong>0</strong> deaths.</li>\n      <li><span class=\"chip\">SCHOOL</span> <strong>No day off in sight:</strong> August 2026 has no public holiday in Brazil; <strong>Dia dos Pais on Sun 08/09</strong> isn't one either. Winter break ran 07/13–07/24 and is over.</li>\n      <li><span class=\"chip\">TRIP</span> <strong>For later this month:</strong> CIRCOS, the 8th Sesc circus festival, <strong>08/08–08/24</strong> in São Paulo — 101 performances at 14 Sesc venues, paid admission.</li>\n      <li><span class=\"chip hot\">HEADS UP</span> <strong>BR-153:</strong> since <strong>07/22</strong>, the concessionaire has been rerouting traffic at <strong>three points</strong> — viaduct construction on our route toward Jacarezinho. Build in buffer time.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Domingo, 2 de agosto — e pela primeira vez em semanas, esta edição não precisa começar com \"no anel-núcleo não há nada com data marcada disponível online\". De <strong>12 a 16 de agosto</strong>, o Sesc leva a 45ª Semana Literária a 27 cidades do Paraná, e <strong>Jacarezinho</strong> é uma delas: cerca de 50 km, nossa própria cidade vizinha. Some-se a isso um sábado que já vale anotar na agenda — o dia <strong>08/08</strong> enche o Sesc Londrina, de manhã à tarde, com oficinas gratuitas, incluindo uma <em>hora de música para bebês</em>. E pairando sobre tudo isso, sem mudança, está a questão do inverno nesta casa: um boletim nacional atribui atualmente metade de todos os testes respiratórios positivos a um vírus que atinge principalmente crianças <strong>menores de dois anos</strong>. As duas coisas entram no mesmo plano de hoje.</p>\n    <ul>\n      <li><span class=\"chip good\">CLIMA</span> <strong>Três dias secos pela frente:</strong> hoje <strong>16–26 °C</strong>, 0,0 mm, além de segunda 16–26 °C e terça 17–27 °C — <strong>0% de chuva</strong> em cada dia. Dois portais consultados de forma independente concordam quanto à chuva.</li>\n      <li><span class=\"chip\">CLIMA</span> <strong>A virada chega na quinta:</strong> os dois portais preveem chuva novamente pela primeira vez na <strong>qui 06/08</strong> — Climatempo <strong>40%</strong>, theweather <strong>70%</strong>. Para a quarta, eles discordam em seis graus.</li>\n      <li><span class=\"chip hot\">BEBÊ</span> <strong>O número que molda o plano:</strong> o InfoGripe (Fiocruz) informa, para as quatro semanas até a <strong>SE 27/2026</strong>: <strong>57,2%</strong> de todas as amostras respiratórias positivas eram de <strong>VSR</strong> — o vírus que leva sobretudo crianças menores de 2 anos ao hospital. O Paraná está no grupo com incidência elevada de SRAG.</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Anel-núcleo, finalmente:</strong> 45ª Semana Literária e Feira do Livro, <strong>de 12 a 16/08</strong>, com <strong>Jacarezinho</strong> e Cornélio Procópio entre as 27 cidades. Autora homenageada de 2026: Adélia Prado.</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Sábado 08/08 no Sesc Londrina:</strong> \"Musicalização para bebês\" <strong>às 9h e 9h30</strong>, oficina de tambor às 10h30, percussão em grupo às 15h30 — tudo explicitamente <strong>gratuito</strong>.</li>\n      <li><span class=\"chip\">HOJE</span> <strong>Para quem ainda vai sair hoje:</strong> o Sesc Londrina fica aberto aos domingos até as <strong>18h</strong> — às 15h \"Desenhando com o corpo e o som\" (grátis), às 17h \"Show com Souza\".</li>\n      <li><span class=\"chip good\">SAÚDE</span> <strong>Dengue, agora com números limpos:</strong> o Informe nº 23 (SE 01–28/2026) registra <strong>5.701</strong> casos confirmados e <strong>4</strong> óbitos em todo o país — <strong>−93,6%</strong> e <strong>−97,1%</strong> em relação a 2025. Nossa 19ª Regional Jacarezinho: <strong>84</strong> casos, <strong>0</strong> óbitos.</li>\n      <li><span class=\"chip\">ESCOLA</span> <strong>Nenhum dia de folga à vista:</strong> agosto de 2026 não tem feriado no Brasil; o <strong>Dia dos Pais no dom 09/08</strong> também não é. O recesso de inverno foi de 13 a 24/07 e já terminou.</li>\n      <li><span class=\"chip\">PASSEIO</span> <strong>Para o fim do mês:</strong> CIRCOS, o 8º Festival Sesc de Circo, <strong>de 08 a 24/08</strong> em São Paulo — 101 apresentações em 14 unidades do Sesc, com ingresso pago.</li>\n      <li><span class=\"chip hot\">ATENÇÃO</span> <strong>BR-153:</strong> desde <strong>22/07</strong>, a concessionária desvia o tráfego em <strong>três pontos</strong> — obras de viaduto no nosso eixo em direção a Jacarezinho. Reserve um tempo extra.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Domingo 2 de agosto — y por primera vez en semanas, esta edición no tiene que empezar con «en el anillo núcleo no hay nada con fecha disponible en línea». Del <strong>12 al 16 de agosto</strong>, el Sesc lleva la 45ª Semana Literária a 27 ciudades de Paraná, y <strong>Jacarezinho</strong> es una de ellas: unos 50 km, nuestra propia ciudad vecina. A eso se suma un sábado que ya vale la pena anotar en el calendario — el <strong>08/08</strong> llena el Sesc Londrina, de la mañana a la tarde, con talleres gratuitos, incluida una <em>hora de música para bebés</em>. Y por encima de todo esto, sin cambios, está la pregunta de invierno de esta casa: un boletín nacional atribuye actualmente la mitad de todas las pruebas respiratorias positivas a un virus que afecta sobre todo a niños <strong>menores de dos años</strong>. Ambas cosas entran hoy en el mismo plan.</p>\n    <ul>\n      <li><span class=\"chip good\">CLIMA</span> <strong>Tres días secos por delante:</strong> hoy <strong>16–26 °C</strong>, 0,0 mm, además lunes 16–26 °C y martes 17–27 °C — <strong>0 % de lluvia</strong> cada día. Dos portales consultados de forma independiente coinciden en la precipitación.</li>\n      <li><span class=\"chip\">CLIMA</span> <strong>El cambio llega el jueves:</strong> los dos portales prevén lluvia de nuevo por primera vez el <strong>jue 06/08</strong> — Climatempo <strong>40 %</strong>, theweather <strong>70 %</strong>. Para el miércoles difieren en seis grados.</li>\n      <li><span class=\"chip hot\">BEBÉ</span> <strong>El número que define el plan:</strong> InfoGripe (Fiocruz) informa que, en las cuatro semanas hasta la <strong>SE 27/2026</strong>: <strong>57,2 %</strong> de todas las muestras respiratorias positivas fueron <strong>VSR</strong> — el virus que sobre todo lleva al hospital a niños menores de 2 años. Paraná está en el grupo con incidencia elevada de SRAG.</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Anillo núcleo, por fin:</strong> 45ª Semana Literária e Feira do Livro, <strong>del 12 al 16/08</strong>, con <strong>Jacarezinho</strong> y Cornélio Procópio entre las 27 ciudades. Autora homenajeada 2026: Adélia Prado.</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Sábado 08/08 en el Sesc Londrina:</strong> «Musicalização para bebês» <strong>9:00 y 9:30</strong>, taller de tambor 10:30, percusión grupal 15:30 — todo explícitamente <strong>gratuito</strong>.</li>\n      <li><span class=\"chip\">HOY</span> <strong>Para quien todavía quiera salir hoy:</strong> el Sesc Londrina abre los domingos hasta las <strong>18:00</strong> — 15:00 «Desenhando com o corpo e o som» (gratis), 17:00 «Show com Souza».</li>\n      <li><span class=\"chip good\">SALUD</span> <strong>Dengue, ahora con cifras claras:</strong> el Informe nº 23 (SE 01–28/2026) registra <strong>5.701</strong> casos confirmados y <strong>4</strong> muertes en todo el país — <strong>−93,6 %</strong> y <strong>−97,1 %</strong> respecto a 2025. Nuestra 19ª Regional Jacarezinho: <strong>84</strong> casos, <strong>0</strong> muertes.</li>\n      <li><span class=\"chip\">ESCUELA</span> <strong>Ningún día libre a la vista:</strong> agosto de 2026 no tiene ningún feriado en Brasil; el <strong>Dia dos Pais del dom 09/08</strong> tampoco lo es. Las vacaciones de invierno fueron del 13 al 24/07 y ya terminaron.</li>\n      <li><span class=\"chip\">PASEO</span> <strong>Para fin de mes:</strong> CIRCOS, el 8º Festival Sesc de Circo, <strong>del 08 al 24/08</strong> en São Paulo — 101 funciones en 14 sedes del Sesc, con entrada de pago.</li>\n      <li><span class=\"chip hot\">ATENCIÓN</span> <strong>BR-153:</strong> desde el <strong>22/07</strong>, la concesionaria desvía el tráfico en <strong>tres puntos</strong> — obras de viaducto en nuestro eje hacia Jacarezinho. Hay que calcular tiempo extra.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Sonntag, der 2. August — Rotationsthema <em>Politik, Recht &amp; Gesundheit</em>, siebte Folge, und diesmal geht es ins Krankenhaus. Der Anlass ist einen Monat alt und trotzdem der beste, den Brasilien im Moment hergibt: Anfang Juli kündigte das Gesundheitsministerium eine nationale Mobilisierung von <strong>R$ 3,95 Milliarden</strong> für das SUS an, davon <strong>R$ 668,2 Millionen</strong> allein für Fahrzeuge — inklusive neuer SAMU-Ambulanzen. „Der beste, den es hergibt\" heißt: an der Originalquelle lässt sich das heute nicht mehr nachlesen. <em>gov.br</em> liefert nur noch eine „Conteúdo Restrito\"-Hülle, die staatlichen Agenturen <em>agenciagov</em> und <em>agenciabrasil</em> sind ganz abgeschaltet — „em cumprimento à legislação eleitoral\", wegen des Wahlgesetzes vor der Oktoberwahl. Die Zahlen stehen damit auf einer einzigen Spiegel-Quelle: nimm sie als Aufhänger, nicht als Beleg. Inhaltlich setzen wir bewusst <em>hinter</em> der Notaufnahme an — Notruf, SAMU und Erste Hilfe waren am 28. Juni dran. Heute: Einweisung, Station, OP, Befund, Entlassung. <strong>11 Einträge, davon 3 Verben mit voller Konjugation</strong>, plus 3 Auffrischungen vom 5. und 9. Juli.</p>\n    <ul>\n      <li><span class=\"chip hot\">FALSE FRIEND</span> <strong>constipado hat drei Böden</strong> — Englisch „constipated\" heißt verstopft. Priberam führt <em>constipação</em> als Erkältung ausdrücklich als portugiesische (Portugal-)Bedeutung, mit <em>resfriado</em> als brasilianischem Äquivalent — und daneben die allgemeinmedizinische Bedeutung „dificuldade em defecar\". In Brasilien also besser <em>estou resfriado</em> sagen. <span class=\"src\"><a href=\"https://dicionario.priberam.org/constipa%C3%A7%C3%A3o\">priberam.org</a></span></li>\n      <li><span class=\"chip\">GENUS</span> <strong>el alta, aber las altas</strong> — <em>alta</em> (Krankenhaus-Entlassung) ist ein Femininum, nimmt wegen des betonten a- aber den Artikel <em>el</em>. Die RAE stellt klar: „El sustantivo «alta» es femenino, por lo que lo indicado es decir «alta médica», «las altas».\" <span class=\"src\"><a href=\"https://www.rae.es/dpd/alta\">rae.es/dpd</a></span></li>\n      <li><span class=\"chip hot\">FALSE FRIEND</span> <strong>die Station ist kein Bahnhof</strong> — Duden führt neben „Haltestelle\" ausdrücklich die „Abteilung eines Krankenhauses\". Englisch heißt das <em>ward</em>, Portugiesisch <em>a enfermaria</em>, Spanisch <em>la sala</em>. <span class=\"src\"><a href=\"https://www.duden.de/rechtschreibung/Station\">duden.de</a></span></li>\n      <li><span class=\"chip\">KONJUGATION</span> <strong>operiert, niemals *geoperiert</strong> — Verben auf <em>-ieren</em> bilden das Partizip II ohne <em>ge-</em>. Umgekehrt schiebt das trennbare <em>einweisen</em> das ge- in die Mitte: <em>eingewiesen</em>. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/operieren.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>ficar internado</strong> — im Brasilianischen braucht <em>internar</em> kein „no hospital\": <em>ele está internado</em> heißt schon „er liegt im Krankenhaus\". Priberam führt <em>internação</em> und das in Portugal übliche <em>internamento</em> als gleichbedeutend — in Brasilien hörst du praktisch nur <em>internação</em>. <span class=\"src\"><a href=\"https://dicionario.priberam.org/interna%C3%A7%C3%A3o\">priberam.org</a></span></li>\n      <li><span class=\"chip good\">IDIOM</span> <strong>an einem seidenen Faden hängen</strong> = <em>estar por um fio</em> = <em>pender de un hilo</em> — alle drei zitieren dasselbe Damoklesschwert, das nur an einem Rosshaar hing. <span class=\"src\"><a href=\"https://de.wiktionary.org/wiki/an_einem_seidenen_Faden_h%C3%A4ngen\">wiktionary.org</a></span></li>\n      <li><span class=\"chip\">PHRASE</span> <strong>o laudo</strong> — der Befund, aber nicht nur der medizinische: Priberam definiert ihn als „texto ou documento com um parecer técnico\". In Brasilien bekommst du einen <em>laudo</em> auch beim Autokauf und bei der Wohnungsabnahme. <span class=\"src\"><a href=\"https://dicionario.priberam.org/laudo\">priberam.org</a></span></li>\n    </ul></div>",

        "en": "<div class=\"tldr\"><p class=\"lead\">Sunday, August 2 — rotation theme <em>Politics, Law &amp; Health</em>, seventh installment, and this time we're heading into the hospital. The hook is a month old and still the best Brazil has to offer right now: in early July, the Ministry of Health announced a national mobilization of <strong>R$ 3.95 billion</strong> for the SUS public health system, <strong>R$ 668.2 million</strong> of it for vehicles alone — including new SAMU ambulances. \"The best it has to offer\" means: the original source can no longer be read today. <em>gov.br</em> now serves up nothing but a \"Conteúdo Restrito\" shell, and the state news agencies <em>agenciagov</em> and <em>agenciabrasil</em> are completely shut down — \"em cumprimento à legislação eleitoral,\" because of the election-law blackout ahead of the October vote. That leaves the numbers resting on a single mirror source: take them as a hook, not as proof. Content-wise, we're deliberately picking up after the ER — the emergency line, SAMU, and first aid were covered on June 28. Today: admission, ward, surgery, findings, discharge. <strong>11 entries, 3 of them verbs with full conjugation</strong>, plus 3 refreshers from July 5 and July 9.</p>\n    <ul>\n      <li><span class=\"chip hot\">FALSE FRIEND</span> <strong>constipado has three layers</strong> — English \"constipated\" means backed up in the bowels. Priberam lists <em>constipação</em> in the sense of a cold explicitly as the Portugal usage, with <em>resfriado</em> as the Brazilian equivalent — alongside the general-medical meaning \"difficulty passing stool.\" In Brazil, better to say <em>estou resfriado</em>. <span class=\"src\"><a href=\"https://dicionario.priberam.org/constipa%C3%A7%C3%A3o\">priberam.org</a></span></li>\n      <li><span class=\"chip\">GENDER</span> <strong>el alta, but las altas</strong> — <em>alta</em> (hospital discharge) is a feminine noun, but takes the article <em>el</em> because of its stress         "pt": "<div class=\"tldr\"><p class=\"lead\">Domingo, 2 de agosto — tema da rotação <em>Política, Direito &amp; Saúde</em>, sétima parte, e desta vez o assunto é o hospital. O gancho tem um mês, mas ainda é o melhor que o Brasil oferece no momento: no início de julho, o Ministério da Saúde anunciou uma mobilização nacional de <strong>R$ 3,95 bilhões</strong> para o SUS, sendo <strong>R$ 668,2 milhões</strong> só para veículos — incluindo novas ambulâncias do SAMU. \"O melhor que há\" quer dizer: hoje não dá mais para conferir isso na fonte original. O <em>gov.br</em> só entrega uma casca de \"Conteúdo Restrito\", e as agências estatais <em>agenciagov</em> e <em>agenciabrasil</em> estão totalmente fora do ar — \"em cumprimento à legislação eleitoral\", por causa da lei eleitoral antes da votação de outubro. Os números ficam, assim, apoiados numa única fonte-espelho: use-os como gancho, não como prova. No conteúdo, a proposta é entrar deliberadamente depois do pronto-socorro — SAMU, emergência e primeiros socorros já foram tema em 28 de junho. Hoje: internação, enfermaria, cirurgia, laudo, alta. <strong>11 verbetes, sendo 3 verbos com conjugação completa</strong>, além de 3 revisões de 5 e 9 de julho.</p>\n    <ul>\n      <li><span class=\"chip hot\">FALSO COGNATO</span> <strong>constipado tem três camadas</strong> — o inglês \"constipated\" significa preso no intestino. O Priberam registra <em>constipação</em> no sentido de resfriado explicitamente como uso português (de Portugal), com <em>resfriado</em> como equivalente brasileiro — e ao lado, o sentido clínico geral de \"dificuldade em defecar\". No Brasil, portanto, o melhor é dizer <em>estou resfriado</em>. <span class=\"src\"><a href=\"https://dicionario.priberam.org/constipa%C3%A7%C3%A3o\">priberam.org</a></span></li>\n      <li><span class=\"chip\">GÊNERO</span> <strong>el alta, mas las altas</strong> — <em>alta</em> (a saída do hospital) é uma palavra feminina, mas usa o artigo <em>el</em> por causa d
