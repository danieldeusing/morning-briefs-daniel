<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daniels Morning Briefs</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="lib/tokens.css">
<script>
  // Pre-paint animation policy (mirrors the terminal core / pagr): an explicit
  // "off" in localStorage — or no pick while the OS prefers reduced motion —
  // marks html.anim-off so components.css kills keyframes (incl. the brand
  // cursor blink) with no flash. The footer anim toggle persists "on"/"off".
  (function () {
    let pref = null;
    try { pref = localStorage.getItem('anim'); } catch (_) {}
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (pref === 'off' || (pref === null && reduced)) {
      document.documentElement.classList.add('anim-off');
    }
  })();
  // Resolution-independent zoom (mirrors pagr): lay out at a 1920px reference, then
  // scale the whole view up on wider screens — a true zoom of everything, never below
  // 1×. Pre-paint to avoid a flash.
  (function () {
    var applyZoom = function () {
      document.documentElement.style.zoom = String(Math.max(1, window.innerWidth / 1920));
    };
    applyZoom();
    window.addEventListener('resize', applyZoom);
  })();
</script>
<style>
  /* Dashboard chrome styles. Design tokens (colours, shadow, typography vars)
     come from lib/tokens.css — keep them there so the dashboard and the
     newsletter content stay in sync. */
  * { box-sizing: border-box; }
  /* Lock the outer document — only inner scroll containers (the .home view
     and the iframe) handle scrolling. Without this, a tiny mismatch between
     header.app + .app-shell heights and 100vh adds a few pixels of overflow
     to <html>, producing a second outer scrollbar alongside the one inside
     .home. overflow: hidden on both html and body kills that outer track. */
  html, body {
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    height: 100%;
    overflow: hidden;
  }
  html { position: relative; }

  /* Paper-grain noise overlay — same texture as the newsletter pages.
     Imperceptible up close, breaks LCD flatness at distance. Disabled under
     reduced-motion / high-contrast preferences. */
  html::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image: none;
    opacity: 0.04;
    mix-blend-mode: multiply;
  }
  @media (prefers-reduced-motion: reduce), (prefers-contrast: more) {
    html::before { display: none; }
  }
  body > *, header.app { position: relative; z-index: 1; }
  body {
    font-family: var(--font-body);
    line-height: 1.5;
    font-size: 15px;
    font-feature-settings: "kern", "liga", "onum";
    -webkit-font-smoothing: antialiased;
  }

  /* Terminal header bar — mirrors the pagr/seedr chrome: a single row on a
     --card surface with a --border bottom rule. LEFT: the brand wordmark
     (mono + .glow) and a blinking .cursor-block. RIGHT: the nav-rail minimize
     toggle. */
  header.app {
    border-bottom: 1px solid var(--border);
    background: var(--card);
    font-family: var(--font-mono); /* chrome is terminal mono; the content stays serif */
    /* Lift the header above the content, which is also a positioned body child
       at z-index 1 and would otherwise paint over it. */
    z-index: 50;
    padding: 0 1rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    min-height: 3rem;
  }
  /* LEFT zone — brand only. */
  .header-left {
    display: flex;
    align-items: center;
    flex: none;
    min-width: 0;
  }
  .header-brand {
    display: inline-flex;
    align-items: center;
    flex: none;
    text-decoration: none;
    cursor: pointer;
  }
  .header-brand .brand-word {
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: -0.01em;
  }

  /* RIGHT zone — the nav-rail minimize toggle, pushed to the far right
     (the header has no center zone). */
  .header-right {
    flex: none;
    margin-left: auto;
    display: flex;
    align-items: center;
  }

  /* Layout: two columns — flexible main + a fixed-width nav-rail on the right.
     The fixed footer is 2rem tall, so the shell is the viewport minus the
     header (3rem) and the footer (2rem). When the rail is collapsed the
     --rail-w track narrows to the icon-only strip. */
  .app-shell {
    display: grid;
    grid-template-columns: minmax(0, 1fr) var(--rail-w, 16rem);
    height: calc(100vh - 3rem - 2rem);
    height: calc(100dvh - 3rem - 2rem);
  }
  .app-shell.rail-collapsed { --rail-w: 3rem; }

  /* The nav lives in the sticky right sidebar (.nav-rail). It holds the
     Übersicht control (#home-btn) and #nav-groups (the grouped category nav,
     populated by JS). */
  .nav-label {
    font-family: var(--font-mono);
    font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--muted-foreground); padding: 0.5rem 0.85rem 0.2rem; font-weight: 600;
  }
  #nav-groups { padding-bottom: 0.2rem; }

  .cat {
    margin: 0;
    border-radius: 0;
    overflow: hidden;
    border: 0;
  }
  .cat-head {
    display: flex; align-items: center; gap: 0.55rem;
    padding: 0.45rem 0.85rem;
    cursor: pointer;
    border-radius: 0;
    transition: background 120ms;
    min-height: 2.1rem;
  }
  .cat-head:hover { background: var(--muted); }
  .cat-head:hover .cat-name { color: var(--primary); }
  .cat.active .cat-head { background: var(--muted); }
  .cat.active .cat-name { color: var(--primary); }
  .cat-color { width: 6px; height: 18px; border-radius: 0; flex: none; }
  .cat-name {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 0.8rem;
    color: var(--foreground);
    transition: color 0.15s ease;
    flex: 1;
    /* Single-line; ellipsise rather than wrap to two lines. */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .cat-icon { font-size: 1.05rem; }
  .cat-latest {
    font-family: var(--font-mono);
    font-size: 0.68rem; color: var(--soft);
    font-feature-settings: "tnum"; font-weight: 500;
  }
  .cat-toggle {
    background: transparent; border: none;
    color: var(--soft); cursor: pointer;
    transition: transform 150ms ease, background 120ms, color 120ms;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    padding: 0.55rem 0.7rem;
    border-radius: var(--radius-inline);
    line-height: 1;
    min-height: 2.25rem; min-width: 2.25rem;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .cat-toggle:hover { background: var(--rule-soft); color: var(--fg); }
  .cat.open > .cat-head .cat-toggle { transform: rotate(90deg); }

  .cat-dates { display: none; padding: 0.15rem 0.7rem 0.4rem 1.45rem; }

  .cat.open .cat-dates { display: block; }
  /* The category dropdown holds only the archive month-picker: days with a
     brief are clickable (ringed in the category accent), the selected day is
     filled, hovering one previews its title. Border + marks use the
     per-category --cat-accent scoped on the .cat row. */
  .cat-cal {
    margin: 0.2rem 0;
    padding: 0.5rem;
    border: 1px solid var(--cat-accent);
    border-radius: 6px;
    background: var(--rule-soft);
  }
  .cal-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 0.45rem;
  }
  .cal-title {
    font-family: var(--font-mono); font-size: 0.74rem;
    font-weight: 600; color: var(--fg);
  }
  .cal-nav {
    width: 1.7rem; height: 1.7rem; line-height: 1;
    background: transparent; border: 1px solid var(--rule); border-radius: 4px;
    color: var(--muted-ink); font-size: 0.95rem; cursor: pointer;
    transition: color 120ms, border-color 120ms;
  }
  .cal-nav:hover:not(:disabled) { color: var(--fg); border-color: var(--soft); }
  .cal-nav:focus-visible { outline: 2px solid var(--cat-accent, var(--fg)); outline-offset: 2px; }
  .cal-nav:disabled { opacity: 0.3; cursor: default; }
  .cal-week, .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
  }
  .cal-week { margin-bottom: 3px; }
  .cal-week span {
    text-align: center; font-family: var(--font-mono);
    font-size: 0.58rem; color: var(--muted-ink);
  }
  .cal-day {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 0.7rem;
    border-radius: 4px; color: var(--soft);
    font-feature-settings: "tnum";
  }
  .cal-day.none { color: var(--rule); }
  .cal-day.blank { visibility: hidden; }
  .cal-day.has {
    color: var(--fg); font-weight: 600; cursor: pointer; text-decoration: none;
    background: var(--panel);
    box-shadow: inset 0 0 0 1px var(--cat-accent);
    transition: background 100ms, color 100ms;
  }
  .cal-day.has:hover, .cal-day.has:focus-visible,
  .cal-day.has.current {
    background: var(--cat-accent); color: #fff; outline: none;
  }
  .cal-preview {
    margin-top: 0.5rem; padding-top: 0.45rem;
    border-top: 1px solid var(--rule);
    font-family: var(--font-body); font-size: 0.72rem;
    color: var(--muted-ink); line-height: 1.35; min-height: 1.7rem;
  }
  /* ────────────────────────────────────────────────────────────────────
     Fixed footer status bar — mirrors the pagr/seedr StatusBar: a 2rem bar
     pinned to the viewport bottom on a --card surface with a --border top
     rule. LEFT: `[briefs] reader@briefs:~/path` status line. RIGHT: the
     relocated controls (theme menu, language menu) + an anim toggle.
     ──────────────────────────────────────────────────────────────────── */
  footer.status-bar {
    position: fixed;
    inset-inline: 0;
    bottom: 0;
    z-index: 60;
    height: 2rem;
    border-top: 1px solid var(--border);
    background: var(--card);
    font-family: var(--font-mono); /* chrome is terminal mono */
    font-size: 11px;
  }
  .status-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    height: 100%;
    padding: 0 0.85rem;
  }
  .status-path {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted-foreground);
  }
  .status-path .status-tag { color: var(--primary); }
  .status-path .status-loc { color: var(--foreground); }
  .status-controls {
    display: flex;
    align-items: center;
    gap: 1.1rem;
    flex: none;
  }
  .status-sep { height: 0.9rem; width: 1px; background: var(--border); flex: none; }

  /* Footer control buttons — flat, muted, warm to --primary on hover. No
     boxes, no shadows; terminal-plain. */
  .status-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: inherit;
    line-height: 1;
    color: var(--muted-foreground);
    text-decoration: none;
    background: none;
    border: 0;
    border-radius: 0;
    padding: 0;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .status-btn:hover { color: var(--primary); }

  /* Theme + language dropdowns reuse the core .dropdown / .dropdown-panel /
     .dropdown-item primitives. The summary mirrors .status-btn. */
  .status-controls .dropdown > summary { font: inherit; }
  /* Settings icons (.dd-dot theme indicator, .dd-flag language flags) come from
     the shared @danieldeusing/design components.css — no local copy here. */

  /* Anim toggle — `[x] anim` / `[ ] anim`, mirroring pagr's footer toggle. */
  .anim-toggle { white-space: nowrap; }
  .anim-toggle[aria-pressed="true"] .anim-box { color: var(--primary); }

  /* Language picker — the trigger anchors the upward dropdown menu. The menu
     reuses the core .dropdown-panel (absolute, opens above, right-aligned),
     toggled open/closed via the [hidden] attribute by the existing JS. */
  .lang-picker { position: relative; }
  .lang-caret { font-size: 0.6rem; margin-left: 0.1rem; }
  .lang-menu[hidden] { display: none; }
  .lang-option[aria-selected="true"] {
    color: var(--primary);
    text-shadow: 0 0 8px var(--glow);
  }

  .cat-empty {
    font-family: var(--font-mono);
    font-size: 0.7rem; color: var(--soft);
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 0.5rem 0.6rem;
  }

  /* Main area — full width, fills the shell (viewport minus header + footer). */
  .main {
    overflow: hidden;
    background: var(--bg);
    position: relative;
    height: 100%;
  }
  .iframe-host { width: 100%; height: 100%; border: none; background: var(--bg); }

  /* ────────────────────────────────────────────────────────────────────
     Sticky right sidebar (.nav-rail) — terminal mono, --card surface with a
     --border left rule, full shell height with its own scroll. Holds the
     Übersicht control + the grouped category nav. Collapses to a 3rem icon-
     only strip; the width animates via the grid track on .app-shell.
     ──────────────────────────────────────────────────────────────────── */
  .nav-rail {
    grid-column: 2;
    font-family: var(--font-mono);
    background: var(--card);
    border-left: 1px solid var(--border);
    height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 2;
  }
  .nav-rail-head {
    display: flex;
    align-items: center;
    min-height: 2.1rem;
    padding: 0.4rem 0.85rem;
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .nav-rail-title {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 600;
    color: var(--muted-foreground);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-rail-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0.3rem 0 0.4rem;
  }

  /* Minimize toggle — the `»`/`«` chevron in the header right zone. Flat, muted,
     warm to --primary on hover (terminal-plain, no box). */
  .rail-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    flex: none;
    background: none;
    border: 0;
    border-radius: 0;
    color: var(--muted-foreground);
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 1rem;
    line-height: 1;
    transition: color 0.15s ease;
  }
  .rail-toggle:hover { color: var(--primary); }
  /* Expanded → `»` (collapse-to-right); collapsed → `«` (re-open). The button's
     aria-expanded drives the glyph; JS rewrites the text content too as a fallback. */
  .rail-toggle[aria-expanded="false"] .rail-toggle-glyph::before { content: "«"; }
  .rail-toggle[aria-expanded="true"]  .rail-toggle-glyph::before { content: "»"; }
  .rail-toggle-glyph { font-size: 0; }
  .rail-toggle-glyph::before { font-size: 1rem; }

  /* Collapsed strip — keep only the per-category accent bar + icon, hide labels,
     calendars and the home wordmark. The 3rem track clips the rest. */
  .app-shell.rail-collapsed .nav-rail-title,
  .app-shell.rail-collapsed .nav-label,
  .app-shell.rail-collapsed .cat-name,
  .app-shell.rail-collapsed .cat-latest,
  .app-shell.rail-collapsed .cat-toggle,
  .app-shell.rail-collapsed .cat-dates,
  .app-shell.rail-collapsed .home-btn .nav-label-text,
  .app-shell.rail-collapsed .home-btn .brand-mark {
    display: none;
  }
  .app-shell.rail-collapsed .nav-rail-head { justify-content: center; padding: 0.4rem 0; }
  .app-shell.rail-collapsed .cat-head,
  .app-shell.rail-collapsed .home-btn {
    justify-content: center;
    padding-left: 0;
    padding-right: 0;
    gap: 0;
  }
  .app-shell.rail-collapsed .cat-color,
  .app-shell.rail-collapsed .home-btn .cat-color { margin-right: 0.4rem; }

  /* The width transition reads off the grid track; animate it. */
  .app-shell { transition: grid-template-columns 0.18s ease; }
  @media (prefers-reduced-motion: reduce) {
    .app-shell { transition: none; }
  }

  /* Mobile re-open button (a floating ☰); shown only when the rail is an
     off-canvas drawer (≤720px). Hidden on desktop. */
  .rail-fab {
    display: none;
    position: fixed;
    right: 0.75rem;
    bottom: 2.6rem;
    z-index: 55;
    width: 2.6rem;
    height: 2.6rem;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--foreground);
    font-family: var(--font-mono);
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow: 0 0 18px var(--glow-soft);
  }

  /* Home view */
  .home {
    display: none;
    padding: 1.5rem 1.8rem;
    overflow-y: auto; height: 100%;
    /* Container for the responsive .tldr-grid below — column-count tracks
       the actual available width, not the viewport (which changes with
       sidebar collapsed/expanded state). */
    container-type: inline-size;
    container-name: home;
  }
  .home.show { display: block; }
  .home h2 {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 48;
    font-size: 1.55rem; font-weight: 600;
    margin: 0 0 0.5rem; letter-spacing: -0.005em;
  }
  .home .lead { color: var(--muted-ink); margin-bottom: 1.4rem; font-family: var(--font-body); }

  /* Freshness line — "Stand: DD.MM.YYYY" from the manifest's `generated`
     date. Mono-caps to read as a dateline, not body copy. When the manifest
     wasn't rebuilt today (a silently-failed nightly task), .stale flips it to
     the warn accent and appends a hint, so a missed run is visible at a glance
     instead of looking like fresh content. */
  .home-stand {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--soft);
    font-feature-settings: "tnum";
    margin: 0 0 1.2rem;
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .home-stand .stand-date { font-weight: 600; color: var(--muted-ink); }
  .home-stand.stale { color: var(--warn); }
  .home-stand.stale .stand-date { color: var(--warn); }
  .home-stand .stand-note { text-transform: none; letter-spacing: 0.02em; font-style: italic; }

  /* Newsprint column grid — the dashboard reads like one paper folded into
     seven adjacent columns. No card chrome: backgrounds, borders, shadows
     and radii are stripped. Adjacent columns are separated only by a
     hairline column rule, the same way the body-grid inside a newsletter
     uses column-rule between deep-dive sections. */
  /* Responsive column grid — caps at 3 wide so the columns stay readable
     on huge screens instead of shrinking to 5-6 narrow strips. The min
     width per column is the larger of 320 px (floor for readability) or
     1/3 of the container (so no more than 3 fit). Single declaration —
     no media or container queries needed.

     The column-rule + row-rule logic uses container queries against .home
     so the layout responds to actual available width (which changes with
     sidebar collapsed/expanded), not viewport. */
  .tldr-grid {
    display: grid;
    grid-template-columns:
      repeat(auto-fit, minmax(min(100%, max(320px, calc((100% - 2px) / 3))), 1fr));
    gap: 0;
    margin-top: 0.5rem;
  }
  .tldr-card {
    background: transparent;
    border: none;
    border-radius: 0;
    padding: var(--space-2) var(--space-4) var(--space-5);
    box-shadow: none;
    cursor: pointer;
    transition: background 150ms;
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    border-left: 1px solid var(--rule);
  }

  /* Grouped layout: a full-width header band (Wirtschaft / IT / Sport / …)
     precedes each group's cards. The header spans every grid column so the
     column flow restarts beneath it — each group reads as its own newsprint
     block, matching the sidebar's grouping. */
  .tldr-group-head {
    grid-column: 1 / -1;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    font-weight: 600;
    color: var(--soft);
    margin: var(--space-5) 0 0;
    padding: var(--space-3) 0 var(--space-2);
    border-top: 1px solid var(--rule);
  }
  /* The first group header sits right under the "Stand:" line — no big top gap
     or top rule, so the grid doesn't open with a stray divider. */
  .tldr-group-head:first-child { margin-top: 0; border-top: none; padding-top: 0; }

  /* The leading card of each group clears its left column rule so the group's
     first column starts clean (JS marks it; nth-child can't track per-group
     position once headers are interspersed). */
  .tldr-card.group-first { border-left: none; padding-left: 0; }

  /* Single-column band (narrow): no column rules at all; cards in the same
     group separate by a dashed row rule. The group header already divides
     groups, so only same-group siblings (a card directly after another card)
     get the dashed top. */
  @container home (max-width: 639px) {
    .tldr-card { border-left: none; padding-left: 0; }
    .tldr-card + .tldr-card {
      margin-top: var(--space-3);
      padding-top: var(--space-5);
      border-top: 1px dashed var(--rule);
    }
  }
  /* Subtle tinted-paper feedback on hover — no transform, no shadow swap,
     so adjacent columns never visually shift. */
  .tldr-card:hover {
    background: color-mix(in srgb, var(--cat-accent) 4%, transparent);
  }
  .tldr-card:focus-visible {
    outline: 2px solid var(--cat-accent, var(--fg));
    outline-offset: 4px;
  }
  .crumb:focus-visible {
    outline: 2px solid var(--fg);
    outline-offset: 2px;
    border-radius: var(--radius-inline);
  }

  /* Kicker line — same mono-caps treatment as the newsletter masthead-issue.
     Icon left, date right, category name in the middle. */
  .tldr-card-head {
    display: flex; align-items: center; gap: var(--space-2);
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.68rem;
    color: var(--muted-ink);
    border-bottom: none;
    padding-bottom: 0;
    margin-bottom: 0;
  }
  .tldr-card-head .tile-icon {
    font-size: 1rem;
    letter-spacing: normal;
    text-transform: none;
  }
  .tldr-card-head .tile-name {
    font-family: inherit;
    font-variation-settings: normal;
    font-weight: 600;
    font-size: inherit;
    color: var(--cat-accent-text, var(--fg));
    flex: 1;
  }
  .tldr-card-head .tile-date {
    font-family: inherit;
    font-size: inherit;
    color: var(--muted-ink);
    font-weight: 500;
    font-feature-settings: "tnum";
    letter-spacing: 0.1em;
  }

  /* Section title — the actual newsletter headline, rendered as a section
     dek in Fraunces with the same accent-bar treatment as .col h2 inside
     a newsletter. Acts as the "front-page headline" for that category. */
  .tldr-card-headline {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 36, "SOFT" 60;
    font-size: 1.18rem;
    font-weight: 600;
    font-style: normal;
    line-height: 1.18;
    color: var(--fg);
    margin: var(--space-2) 0 var(--space-3);
    letter-spacing: -0.005em;
  }
  .tldr-card-headline::before {
    content: "";
    display: block;
    width: 2rem;
    height: 2px;
    background: var(--cat-accent);
    margin-bottom: var(--space-2);
  }

  /* Strip the embedded TL;DR section's own chrome — it inherits the column
     instead. The lead keeps its drop-cap treatment but at a smaller scale
     suited to the narrower column width. */
  .tldr-card-body .tldr {
    background: transparent; border: none; padding: 0; margin: 0; border-radius: 0;
    display: block;       /* override the .tldr:has(.lead) grid from styles.css */
    column-gap: 0;
  }
  .tldr-card-body .tldr > .lead {
    font-family: var(--font-body);
    font-size: 0.92rem;
    line-height: 1.5;
    color: var(--fg);
    margin: 0 0 var(--space-3);
    max-width: none;
  }
  .tldr-card-body .tldr > .lead::first-letter {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 144, "SOFT" 100;
    font-size: 2.7rem;
    float: left;
    line-height: 0.85;
    padding: 0.25rem 0.45rem 0 0;
    color: var(--cat-accent);
    font-weight: 700;
  }
  .tldr-card-body .tldr ul {
    padding-left: 1rem;
    margin: 0;
    column-count: 1;       /* override 2-col bullet layout in narrow card */
  }
  .tldr-card-body .tldr li { font-size: 0.86rem; margin: 0.4rem 0; line-height: 1.5; }
  .tldr-card-body strong { color: var(--fg); font-weight: 700; }
  .tldr-card-body em { color: var(--muted-ink); font-style: italic; }
  .tldr-card-body a { color: inherit; text-decoration: underline; }
  /* Chips inside TL;DR bullets — tinted by the card's accent. */
  .tldr-card-body .chip {
    display: inline-block;
    font-family: var(--font-mono);
    background: color-mix(in srgb, var(--cat-accent, var(--rule-soft)) 14%, transparent);
    color: var(--fg);
    font-size: 0.6rem; font-weight: 600; padding: 0.05rem 0.45rem;
    border-radius: var(--radius-inline); letter-spacing: 0.04em; margin-right: 0.2rem;
    text-transform: uppercase; vertical-align: middle;
  }
  /* Same two rules as .chip.hot/.chip.good in lib/styles.css — the dashboard does not
     load styles.css, so it restates them. Tokens, not the literals that were here
     (#b6402f / #3f7a4f: single hexes on a four-theme page, measuring 3.06–3.83:1).
     The tint is 10%, not the 18% it was: the ink sits on its OWN tint, which is a
     surface the design system never measured — at 18% the composite is 4.15:1 on
     warm and 4.23:1 on paper, under AA. Measured worst case at 10% is 4.66:1. */
  .tldr-card-body .chip.hot  { background: color-mix(in srgb, var(--warn) 10%, transparent); color: var(--warn); }
  .tldr-card-body .chip.good { background: color-mix(in srgb, var(--good) 10%, transparent); color: var(--good); }
  /* Suppress the external-link arrow inside TL;DR snippets — too noisy. */
  .tldr-card-body a[href^="http"]::after { content: none; }
  /* "+N weitere" overflow marker — the home snapshot caps the TL;DR at a few
     bullets (the full set is one click away). Reads as a muted continuation
     cue, list-style stripped so it doesn't get its own bullet dot. */
  .tldr-card-body .tldr li.tldr-more {
    list-style: none;
    margin-left: -1rem;
    color: var(--soft);
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    font-style: normal;
  }

     no translation for this date and the card is showing the DE original.
     Understated outline so it informs without competing with the accent. */
  .tldr-card-head .fallback-flag {
    font-family: var(--font-mono);
    font-size: 0.58rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--soft);
    border: 1px solid var(--rule);
    border-radius: var(--radius-inline);
    padding: 0.02rem 0.3rem;
    text-transform: uppercase;

    padding: 0.7rem 0.2rem 0.4rem 0; margin-top: auto;

  .tldr-empty {
    font-family: var(--font-body);

  .tldr-card--empty {
    cursor: default;
    background: color-mix(in srgb, var(--bg) 50%, var(--panel));

  .tldr-empty-block {

    font-style: italic;

  /* Per-category accents — each card scopes its own --cat-accent and

  .tldr-card[data-cat="economy"]        { --cat-accent: var(--c-economy);        --cat-accent-text: var(--c-economy-text); }
  .tldr-card[data-cat="software"]       { --cat-accent: var(--c-software);       --cat-accent-text: var(--c-software-text); }

  /* Sidebar rows scope their own --cat-accent so the archive calendar's border,

  .cat[data-cat="economy"]        { --cat-accent: var(--c-economy); }

     drawer (the .app-shell collapses to a single main column), toggled by
     the floating .rail-fab. The header keeps brand + history controls.
     ──────────────────────────────────────────────────────────────────── */
  @media (max-width: 720px) {

    .app-shell,
    .app-shell.rail-collapsed { grid-template-columns: 1fr; }
    .nav-rail {

      top: 3rem;
      right: 0;

      "latestTldrHtml": "<div class=\"tldr\"><h2>Das Wichtigste in 30 Sekunden</h2>\n    <p class=\"lead\">Der EZB-Fix von gestern steht bei <strong>6,0666</strong> — dem höchsten Referenzkurs seit dem 24. März. Damit passiert etwas, das dieser Brief so noch nicht schreiben konnte: Dein Kurs liegt <em>über</em> jedem datierten Analysten-Pfad für die nächsten drei bis zwölf Monate. Und der entscheidende Satz dazu steht weiter unten: Dieser bärische Konsens ist keine Wette gegen den Real. Er ist eine Wette gegen den Euro — und die läuft seit sechs Wochen in die falsche Richtung.</p>\n    <ul>\n      <li><span class=\"chip good\">FX</span> <strong>EUR/BRL 6,0666</strong> (EZB-Fix, Do 20.08.) — <strong>+0,45 %</strong> zum Vortag, <strong>+1,52 %</strong> auf Wochensicht, <strong>+4,02 %</strong> auf Monatssicht. Höchster Fix seit dem <strong>24.03.2026</strong> (6,0949) und <strong>5,60 %</strong> über dem Jahrestief vom 13.05. Der Fix für heute entsteht erst gegen 09:15 BRT.</li>\n      <li><span class=\"chip\">HEUTE</span> <strong>Marktkreuz heute früh: 6,0730</strong> — laufender Euro-Dollar (1,1693, 21.08.) auf den zuletzt quotierten Dollar-Real (5,1937), <strong>0,11 %</strong> über dem gestrigen Fix und weit unter der 0,5-%-Flagge.</li>\n      <li><span class=\"chip good\">BILANZ</span> <strong>Meine gestrige Heute-Spanne hat gehalten:</strong> 6,00–6,09 gerufen, 6,0666 geliefert; der Punkt (6,05) lag <strong>0,27 %</strong> daneben. Das gestrige Marktkreuz (6,0444) unterschätzte den Fix um 0,37 %, weil der Real seinen Nachtgewinn bis zum Fixing abgab.</li>\n      <li><span class=\"chip hot\">MECHANIK</span> <strong>Es ist ein Euro-Move, kein Real-Move.</strong> Am Donnerstag: Euro-Dollar <strong>+0,65 %</strong>, Dollar-Real <strong>−0,20 %</strong> — der Real gewann sogar. Auf Wochensicht kamen <strong>84 %</strong> der Bewegung aus dem Euro-Bein, auf Monatssicht 2,23 von 4,02 Prozentpunkten.</li>\n      <li><span class=\"chip hot\">KONSENS</span> <strong>Du stehst über allen.</strong> Abgeleitet aus den Ankern: Goldman <strong>5,93 / 5,71 / 5,60</strong> (3/6/12 Mon.), Focus Ende 2026 <strong>5,93</strong>, Itaú Ende 2026 <strong>6,04</strong>. Nur Itaús Ende-2027-Wert (6,16) liegt darüber.</li>\n      <li><span class=\"chip hot\">DISSENS</span> <strong>Dieser Konsens ist eine reine Euro-Wette.</strong> In Goldmans Drei-Monats-Pfad hebt das Real-Bein EUR/BRL sogar um <strong>+0,12 %</strong>; die gesamten −2,3 % kommen aus dem Euro, der von 1,1681 auf 1,14 fallen soll — eine Zahl vom <strong>11. Juli</strong>.</li>\n      <li><span class=\"chip\">USA</span> <strong>Das US-Schatzamt verdoppelt die Langläufer-Rückkäufe</strong> — von 2 auf mindestens <strong>4 Mrd. $</strong> je Operation, 09.09. bis 04.11. Zehnjährige <strong>−6 Bp</strong> auf 4,647 %, Dreißigjährige <strong>−9 Bp</strong> auf 5,196 %; der Dollar-Index fiel erstmals seit Ende Mai unter 99, im Monat <strong>−2,34 %</strong>.</li>\n      <li><span class=\"chip\">ZINSEN</span> <strong>Die Fed-Erhöhungswette für September ist implodiert:</strong> von rund <strong>65 %</strong> am 05.08. auf etwa <strong>ein Drittel</strong>; Goldman erwartet Halten bis Jahresende. Gegenüber steht die EZB mit <strong>79–83 %</strong> für den 10.09. — eher Fallhöhe als Auftrieb, weil längst eingepreist.</li>\n      <li><span class=\"chip\">BR</span> <strong>Die Wahlprämie steht jetzt namentlich in den Prognosen.</strong> Goldman nennt die Oktoberwahl als Grund für höhere Kurzfristziele; Quaest sieht in der Stichwahl Lula bei 43–44 % gegen Flávio Bolsonaro bei 39–40 % — innerhalb der Fehlermarge. Der Focus-Median klebt seit <strong>neun Wochen</strong> bei 5,20.</li>\n      <li><span class=\"chip hot\">KORREKTUR</span> <strong>Die kommende Woche ist nicht leer</strong> — anders als gestern hier geschrieben. Am <strong>Mi 26.08.</strong> kommt der Kern-PCE, dazu Jackson Hole und Warshs erste Rede am <strong>Fr 28.08.</strong></li>\n      <li><span class=\"chip good\">PROGNOSE</span> Heute <strong>6,03–6,11</strong> (75 %), am ehesten 6,07. Auf zwölf Monate <strong>5,70–6,45</strong> (50 %), am ehesten <strong>6,08</strong> — <span class=\"update-since\">Punkt angehoben</span> von 6,05, weil die EZB-Erhöhungspreisung das Euro-Bein strukturell stützt.</li>\n    </ul></div>",

        "en": "<div class=\"tldr\"><h2>The Essentials in 30 Seconds</h2>\n    <p class=\"lead\">Yesterday's ECB fix stands at <strong>6.0666</strong> — the highest reference rate since March 24. That means something this brief has never been able to write before: your rate sits <em>above</em> every dated analyst path for the next three to twelve months. And the key sentence on that is further down: this bearish consensus isn't a bet against the real. It's a bet against the euro — and that bet has been running the wrong direction for six weeks.</p>\n    <ul>\n      <li><span class=\"chip good\">FX</span> <strong>EUR/BRL 6.0666</strong> (ECB fix, Thu 08/20) — <strong>+0.45%</strong> versus the previous day, <strong>+1.52%</strong> on the week, <strong>+4.02%</strong> on the month. Highest fix since <strong>03/24/2026</strong> (6.0949) and <strong>5.60%</strong> above the year-to-date low on 05/13. Today's fix isn't set until around 09:15 BRT.</li>\n      <li><span class=\"chip\">TODAY</span> <strong>This morning's market cross: 6.0730</strong> — the live euro-dollar rate (1.1693, 08/21) against the most recently quoted dollar-real rate (5.1937), <strong>0.11%</strong> above yesterday's fix and well below the 0.5% flag threshold.</li>\n      <li><span class=\"chip good\">SCORECARD</span> <strong>Yesterday's today-range held:</strong> I called 6.00–6.09, got 6.0666; the point estimate (6.05) missed by <strong>0.27%</strong>. Yesterday's market cross (6.0444) undershot the fix by 0.37%, because the real gave back its overnight gain by the time of fixing.</li>\n      <li><span class=\"chip hot\">MECHANICS</span> <strong>This is a euro move, not a real move.</strong> On Thursday: euro-dollar <strong>+0.65%</strong>, dollar-real <strong>−0.20%</strong> — the real actually gained. On the week, <strong>84%</strong> of the move came from the euro leg; on the month, 2.23 of 4.02 percentage points.</li>\n      <li><span class=\"chip hot\">CONSENSUS</span> <strong>You're above all of them.</strong> Derived from the anchors: Goldman <strong>5.93 / 5.71 / 5.60</strong> (3/6/12 mo.), Focus end-2026 <strong>5.93</strong>, Itaú end-2026 <strong>6.04</strong>. Only Itaú's end-2027 figure (6.16) sits higher.</li>\n      <li><span class=\"chip hot\">DISSENT</span> <strong>This consensus is a pure euro bet.</strong> In Goldman's three-month path, the real leg actually lifts EUR/BRL by <strong>+0.12%</strong>; the entire −2.3% comes from the euro, which is projected to fall from 1.1681 to 1.14 — a figure from <strong>July 11</strong>.</li>\n      <li><span class=\"chip\">USA</span> <strong>The US Treasury is doubling its long-bond buybacks</strong> — from $2 billion to at least <strong>$4 billion</strong> per operation, 09/09 through 11/04. The 10-year fell <strong>6bp</strong> to 4.647%, the 30-year <strong>9bp</strong> to 5.196%; the Dollar Index dropped below 99 for the first time since late May, down <strong>2.34%</strong> this month.</li>\n      <li><span class=\"chip\">RATES</span> <strong>The Fed rate-hike bet for September has collapsed:</strong> from roughly <strong>65%</strong> on 08/05 to about <strong>one-third</strong>; Goldman expects the Fed to hold through year-end. Against that stands the ECB at <strong>79–83%</strong> for 09/10 — more downside risk than upside fuel, since it's already priced in.</li>\n      <li><span class=\"chip\">BR</span> <strong>The election premium is now named explicitly in the forecasts.</strong> Goldman cites the October election as the reason for higher near-term targets; Quaest has Lula at 43–44% against Flávio Bolsonaro at 39–40% in a simulated runoff — within the margin of error. The Focus median has been stuck at <strong>5.20</strong> for <strong>nine weeks</strong>.</li>\n      <li><span class=\"chip hot\">CORRECTION</span> <strong>Next week isn't empty</strong> — contrary to what this brief said yesterday. Core PCE lands <strong>Wed 08/26</strong>, plus Jackson Hole and Warsh's first speech on <strong>Fri 08/28</strong>.</li>\n      <li><span class=\"chip good\">FORECAST</span> Today <strong>6.03–6.11</strong> (75%), most likely 6.07. Over twelve months, <strong>5.70–6.45</strong> (50%), most likely <strong>6.08</strong> — <span class=\"update-since\">point raised</span> from 6.05, because ECB hike pricing is structurally supporting the euro leg.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Gestern früh hat es <strong>crates.io</strong> erwischt — lehrreicher als seine Größe. Der Angreifer hat den Quellcode der betroffenen Rust-Pakete <em>nicht</em> angefasst, sondern ihnen eine Abhängigkeit untergeschoben, deren <strong>Build-Skript</strong> die Nutzlast nachlud. Ein <code>cargo build</code> genügte. Interessant ist der Vergleich, der sich aufdrängt: crates.io hatte das erste Artefakt nach <strong>86 Minuten</strong> vom Netz und listet jeden Zeitstempel auf die Sekunde. Beim npm-Wurm <strong>ChainDrop</strong> streiten sich <strong>17 Tage</strong> später zwei seriöse Quellen noch darüber, ob 444 oder 868 Pakete betroffen waren. Dazu ein Tag voller „wird jetzt wirklich angegriffen\": GitLab, Zimbra — und in Berlin sind zwei Senatsverwaltungen seit einer Woche vom Landesnetz getrennt.</p>\n    <ul>\n      <li><span class=\"chip hot\">OSS</span> <strong>Rust-Lieferkette</strong>: <strong>arrayref 0.3.10</strong>, <strong>internment 0.8.7</strong>, <strong>append-only-vec 0.1.9</strong> mit einer typosquatteten Abhängigkeit versehen, online zwischen <strong>86</strong> und <strong>107 Minuten</strong>. <code>arrayref</code> allein: über <strong>245 Mio.</strong> Downloads; darunter blake3, egui, iced. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>ChainDrop-Zahlen</strong> gehen weiter auseinander: <strong>444 Pakete / 2.212 Versionen</strong> gegen <strong>868 / 1.381</strong>. Die saubere Erklärung von gestern hält nicht. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>GitLab</strong> <strong>CVE-2026-19478</strong> (9,4): watchTowr sieht Angriffsversuche im eigenen Honeypot-Netz — <strong>drei Tage</strong> nach dem Notfall-Patch. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Zimbra</strong> <strong>CVE-2026-73570</strong> (8,9): Patch seit dem <strong>20.07.</strong>, Ausnutzung seit dieser Woche. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Citrix NetScaler</strong> <strong>CVE-2026-19490</strong> (9,3): Anmeldung umgehbar auf Gateway- und AAA-Servern, Fix in <strong>14.1-73.32</strong> / <strong>13.1-63.21</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Berlin</strong>: zwei Senatsverwaltungen seit dem <strong>14.08.</strong> vom Landesnetz getrennt, Wohngeld für über <strong>50.000</strong> Haushalte in Gefahr. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>KEV-Frist heute</strong> für die vier Einträge vom 18.08. — Windows IKE, SharePoint, vCenter, macOS. <span class=\"chip\">USA</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>GitHub</strong> nennt die Ursache für den Ausfall vom 17.08.: <strong>7 h 47 min</strong>, kein Code-Fehler, sondern Kapazität plus Retry-Sturm. Azure trägt inzwischen rund <strong>58 %</strong> der Plattformlast. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">OSS</span> <strong>Mojo-Compiler</strong> ist offen — <strong>Apache 2.0</strong> mit LLVM-Ausnahmen. Genau das, was hier am Dienstag noch gefehlt hat. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Web</span> <strong>CDN Tsunami</strong>: HTTP/3 → HTTP/1.1 verstärkt bis <strong>350×</strong>; bei Cloudflare, CloudFront und Fastly <strong>36,41×–51,2×</strong>. Kein CVE, keine Ausnutzung. <span class=\"chip\">Global</span></li>\n    </ul></div>",

7.</strong>, Ausnutzung seit dieser Woche. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Citrix NetScaler</strong> <strong>CVE-2026-19490</strong> (9,3): Anmeldung umgehbar auf Gateway- und AAA-Servern, Fix in <strong>14.1-73.32</strong> / <strong>13.1-63.21</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Berlin</strong>: zwei Senatsverwaltungen seit dem <strong>14.08.</strong> vom Landesnetz getrennt, Wohngeld für über <strong>50.000</strong> Haushalte in Gefahr. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>KEV-Frist heute</strong> für die vier Einträge vom 18.08. — Windows IKE, SharePoint, vCenter, macOS. <span class=\"chip\">USA</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>GitHub</strong> nennt die Ursache für den Ausfall vom 17.08.: <strong>7 h 47 min</strong>, kein Code-Fehler, sondern Kapazität plus Retry-Sturm. Azure trägt inzwischen rund <strong>58 %</strong> der Plattformlast. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">OSS</span> <strong>Mojo-Compiler</strong> ist offen — <strong>Apache 2.0</strong> mit LLVM-Ausnahmen. Genau das, was hier am Dienstag noch gefehlt hat. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Web</span> <strong>CDN Tsunami</strong>: HTTP/3 → HTTP/1.1 verstärkt bis <strong>350×</strong>; bei Cloudflare, CloudFront und Fastly <strong>36,41×–51,2×</strong>. Kein CVE, keine Ausnutzung. <span class=\"chip\">Global</span></li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">crates.io got hit early yesterday — more instructive than its size suggests. The attacker never touched the source code of the affected Rust packages; instead they slipped in a dependency whose <strong>build script</strong> pulled down the payload. A single <code>cargo build</code> was enough. The comparison that jumps out: crates.io had the first artifact off the network within <strong>86 minutes</strong> and lists every timestamp down to the second. With the npm worm <strong>ChainDrop</strong>, <strong>17 days</strong> later, two credible sources still can't agree on whether 444 or 868 packages were affected. On top of that, a day full of \"now it's actually being exploited\": GitLab, Zimbra — and in Berlin, two Senate departments have been cut off from the state network for a week.</p>\n    <ul>\n      <li><span class=\"chip hot\">OSS</span> <strong>Rust supply chain</strong>: <strong>arrayref 0.3.10</strong>, <strong>internment 0.8.7</strong>, <strong>append-only-vec 0.1.9</strong> shipped with a typosquatted dependency, live for between <strong>86</strong> and <strong>107 minutes</strong>. <code>arrayref</code> alone: over <strong>245M</strong> downloads; among the affected downstream projects are blake3, egui, iced. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>ChainDrop figures</strong> keep diverging: <strong>444 packages / 2,212 versions</strong> versus <strong>868 / 1,381</strong>. Yesterday's clean explanation doesn't hold up. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>GitLab</strong> <strong>CVE-2026-19478</strong> (9.4): watchTowr is seeing attack attempts in its own honeypot network — <strong>three days</strong> after the emergency patch. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Zimbra</strong> <strong>CVE-2026-73570</strong> (8.9): patch available since <strong>Jul 20</strong>, exploitation since this week. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Citrix NetScaler</strong> <strong>CVE-2026-19490</strong> (9.3): authentication bypass on Gateway and AAA servers, fixed in <strong>14.1-73.32</strong> / <strong>13.1-63.21</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Berlin</strong>: two Senate departments cut off from the state network since <strong>Aug 14</strong>, housing benefit payments for over <strong>50,000</strong> households at risk. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>KEV deadline today</strong> for the four entries from Aug 18 — Windows IKE, SharePoint, vCenter, macOS. <span class=\"chip\">USA</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>GitHub</strong> names the cause of the Aug 17 outage: <strong>7h 47m</strong>, not a code bug but capacity plus a retry storm. Azure now carries roughly <strong>58%</strong> of the platform's load. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">OSS</span> The <strong>Mojo compiler</strong> is open — <strong>Apache 2.0</strong> with LLVM exceptions. Exactly what was still missing here on Tuesday. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Web</span> <strong>CDN Tsunami</strong>: HTTP/3 → HTTP/1.1 amplification up to <strong>350×</strong>; at Cloudflare, CloudFront, and Fastly, <strong>36.41×–51.2×</strong>. No CVE, no exploitation. <span class=\"chip\">Global</span></li>\n    </ul></div>"
      }

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Google hat gestern aufgehört, um deinen Editor zu kämpfen. Antigravity — der agentische Coding-Assistent, auf den Google im Juni sein eigenes Gemini CLI eingedampft hat — ist ab sofort Bestandteil von Gemini Enterprise Standard, Plus und Standard Emerging Market und kommt als native Erweiterung in VS Code, Visual Studio, JetBrains und Zed. Der Entwickler installiert ihn nicht mehr; der Administrator schaltet ihn frei. Das ist keine Modellnachricht, sondern eine Vertriebsnachricht — und sie beschreibt die Front, an der Cursor, Copilot und Claude Code dieses Jahr wirklich stehen: nicht bei der Codequalität, sondern bei der Frage, ob die Rechtsabteilung das Ding anhaken kann.</p>\n    <ul>\n      <li><span class=\"chip hot\">Google</span> <strong>Antigravity steckt jetzt in der Firmenlizenz</strong>: enthalten in Gemini Enterprise Standard, Plus und Standard Emerging Market, angekündigt am <span class=\"stat\">20.08.</span> Admins schalten frei — mit Ausgaben-, Sicherheits- und Nutzungsmetriken in einer Konsole.</li>\n      <li><span class=\"chip\">Google</span> <strong>Vier Editoren statt einer eigenen IDE</strong>: VS Code allgemein verfügbar, Visual Studio, JetBrains und Zed in Vorschau. Daneben weiter App und CLI.</li>\n      <li><span class=\"chip\">Google</span> <strong>Der Vorlauf ist zwei Monate alt</strong>: Gemini CLI und die Code-Assist-Erweiterungen stellten am <span class=\"stat\">18.06.</span> Gratis-, Pro- und Ultra-Anfragen ein. Erst räumen, dann neu besetzen.</li>\n      <li><span class=\"chip good\">Claude</span> <strong>Claude Code v2.1.238 gestern Abend, v2.1.237 am 19.08.</strong>: <code>headersHelper</code> für authentifizierte Plugin-Marktplätze, <code>keybindingFlavor</code>, Abschalt-Aufschub für selbstgehostete Runner, behobenes Speicherwachstum in langen Sitzungen.</li>\n      <li><span class=\"chip hot\">Achtung</span> <strong>Der teuerste Fehler steckt in v2.1.237</strong>: Wer Claude Code über ein LLM-Gateway oder eine eigene Basis-URL fährt, hatte kaputtes Prompt-Caching und abgestandene Prompts. Heute aktualisieren.</li>\n      <li><span class=\"chip hot\">OSS</span> <strong>GLM-5.3 heißt „stärkstes offenes Coding-Modell\" — und ist nicht offen</strong>. Die Gewichte sollen zwei Wochen nach dem 14.08. kommen, also um den <span class=\"stat\">28.08.</span> Herunterladbar ist heute GLM-5.2. Die kursierende „+50 %\"-Zahl lasse ich weg: Im Artikel, den ich selbst aufgeschlagen habe, steht sie nicht — dort steht, alle Gewinne kämen aus verlängertem Nachtraining auf derselben Basis.</li>\n      <li><span class=\"chip good\">Tool</span> <strong>GitHub Copilot für JetBrains spricht lokale Ollama-Modelle an</strong> (11.08.) und bekommt ein Gedächtnis. Der geschlossene Platzhirsch baut sich eine Brücke zur lokalen Ausführung.</li>\n      <li><span class=\"chip\">MCP</span> <strong>Roter Faden im August: Verwaltung statt Installation</strong> — Antigravity regelt MCP-Server-Zugriff per Richtlinie, Claude Code authentifiziert Plugin-Marktplätze, die MCP-Spezifikation vom 28.07. stellte die Unternehmens-Autorisierung stabil.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Heute kein Bench-Chart</strong>: keine neue, unabhängig belegte Zahl. swebench.com liefert weiter nichts Auslesbares, das LiveCodeBench-Board kam als leere JavaScript-Hülle zurück.</li>\n    </ul></div>",

e über ein LLM-Gateway oder eine eigene Basis-URL fährt, hatte kaputtes Prompt-Caching und abgestandene Prompts. Heute aktualisieren.</li>\n      <li><span class=\"chip hot\">OSS</span> <strong>GLM-5.3 heißt „stärkstes offenes Coding-Modell\" — und ist nicht offen</strong>. Die Gewichte sollen zwei Wochen nach dem 14.08. kommen, also um den <span class=\"stat\">28.08.</span> Herunterladbar ist heute GLM-5.2. Die kursierende „+50 %\"-Zahl lasse ich weg: Im Artikel, den ich selbst aufgeschlagen habe, steht sie nicht — dort steht, alle Gewinne kämen aus verlängertem Nachtraining auf derselben Basis.</li>\n      <li><span class=\"chip good\">Tool</span> <strong>GitHub Copilot für JetBrains spricht lokale Ollama-Modelle an</strong> (11.08.) und bekommt ein Gedächtnis. Der geschlossene Platzhirsch baut sich eine Brücke zur lokalen Ausführung.</li>\n      <li><span class=\"chip\">MCP</span> <strong>Roter Faden im August: Verwaltung statt Installation</strong> — Antigravity regelt MCP-Server-Zugriff per Richtlinie, Claude Code authentifiziert Plugin-Marktplätze, die MCP-Spezifikation vom 28.07. stellte die Unternehmens-Autorisierung stabil.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Heute kein Bench-Chart</strong>: keine neue, unabhängig belegte Zahl. swebench.com liefert weiter nichts Auslesbares, das LiveCodeBench-Board kam als leere JavaScript-Hülle zurück.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Google stopped fighting for your editor yesterday. Antigravity — the agentic coding assistant Google folded its own Gemini CLI into back in June — is now part of Gemini Enterprise Standard, Plus, and Standard Emerging Market, and ships as a native extension for VS Code, Visual Studio, JetBrains, and Zed. Developers no longer install it; administrators enable it. This isn't a model story, it's a sales story — and it describes the front line where Cursor, Copilot, and Claude Code are really fighting this year: not code quality, but whether legal can check the box.</p>\n    <ul>\n      <li><span class=\"chip hot\">Google</span> <strong>Antigravity is now bundled into the enterprise license</strong>: included in Gemini Enterprise Standard, Plus, and Standard Emerging Market, announced <span class=\"stat\">Aug 20</span>. Admins enable it — with spend, security, and usage metrics in a single console.</li>\n      <li><span class=\"chip\">Google</span> <strong>Four editors instead of one dedicated IDE</strong>: VS Code generally available, Visual Studio, JetBrains, and Zed in preview. The standalone app and CLI remain alongside them.</li>\n      <li><span class=\"chip\">Google</span> <strong>The setup is two months old</strong>: Gemini CLI and the Code Assist extensions stopped serving Free, Pro, and Ultra requests on <span class=\"stat\">Jun 18</span>. Clear the field first, then move back in.</li>\n      <li><span class=\"chip good\">Claude</span> <strong>Claude Code v2.1.238 last night, v2.1.237 on Aug 19</strong>: <code>headersHelper</code> for authenticated plugin marketplaces, <code>keybindingFlavor</code>, a shutdown-delay flag for self-hosted runners, and fixed memory growth in long sessions.</li>\n      <li><span class=\"chip hot\">Heads up</span> <strong>The costliest bug is in v2.1.237</strong>: anyone running Claude Code through an LLM gateway or a custom base URL had broken prompt caching and stale prompts. Update today.</li>\n      <li><span class=\"chip hot\">OSS</span> <strong>GLM-5.3 is billed as the \"strongest open coding model\" — and it isn't open</strong>. Weights are due two weeks after Aug 14, so around <span class=\"stat\">Aug 28</span>. What you can download today is GLM-5.2. I'm dropping the \"+50%\" figure making the rounds: it isn't in the article I opened myself — that piece says all the gains come from extended post-training on the same base.</li>\n      <li><span class=\"chip good\">Tool</span> <strong>GitHub Copilot for JetBrains now talks to local Ollama models</strong> (Aug 11) and gets a memory feature. The closed incumbent is building itself a bridge to local execution.</li>\n      <li><span class=\"chip\">MCP</span> <strong>This month's throughline: management, not installation</strong> — Antigravity governs MCP server access by policy, Claude Code authenticates plugin marketplaces, and the Jul 28 MCP spec stabilized enterprise authorization.</li>\n      <li><span class=\"chip\">Bench</span> <strong>No bench chart today</strong>: no new, independently verified figure. swebench.com still returns nothing readable, and the LiveCodeBench board came back as an empty JavaScript shell.</li>\n    </ul></div>"
      }

%</strong> ein Plus von über 50 %, in Nordamerika nur 12 %.<sup>[1]</sup></li>\n      <li><span class=\"chip\">DEPLOY · US</span> <strong>Der Preis eines Dauer-Agenten fiel um vier Fünftel:</strong> Gemini Spark startete als Exklusivfunktion des <strong>99,99-$</strong>-Tarifs<sup>[4]</sup> und ist seit dem <strong>23.07.2026</strong> auch im <strong>19,99-$</strong>-Tarif AI Pro enthalten.<sup>[3]</sup> Nicht im EWR, nicht in UK, nicht in der Schweiz — Stand der Berichterstattung.<sup>[4]</sup></li>\n      <li><span class=\"chip\">DEPLOY · GLOBAL</span> <strong>Claude Cowork verlässt die Oberklasse:</strong> seit dem <strong>18.08.2026</strong> auf Mobilgerät und im Browser für <em>alle</em> bezahlten Pläne;<sup>[5]</sup> die Preisseite führt es heute unter dem <strong>20-$</strong>-Plan Pro (17 $ im Jahresabo).<sup>[6]</sup></li>\n      <li><span class=\"chip\">DEPLOY · IN</span> <strong>Agent statt Modul, Beispiel Personalabrechnung:</strong> Kredily 3.0 stellt <strong>KAI</strong> vor — <strong>110+ Fertigkeiten</strong> quer durch Lohnlauf, Zeiterfassung und Urlaub, mit Ausnahme-Vorlage zur menschlichen Freigabe; Basis sind <strong>25.000+</strong> Betriebe und über <strong>1 Mio.</strong> Beschäftigte.<sup>[7]</sup></li>\n      <li><span class=\"chip\">DEPLOY · US</span> <strong>Und die Preisformel, die aufhorchen lässt:</strong> Octane verkauft ein „Betriebssystem\" für Tankstellen-Shops ab <strong>1 $ pro Stunde und Filiale</strong> — abgerechnet gegen eine Schicht, nicht gegen einen Arbeitsplatz.<sup>[8]</sup> 12 Pilotstandorte, Erstquelle nicht abrufbar.<sup>[9]</sup></li>\n      <li><span class=\"chip\">STUDY · DE</span> <strong>Zum Gegenhalten, ausdrücklich nicht vergleichbar:</strong> Im deutschen Mittelstand lag der Einsatz von Agenten-Systemen bei <strong>16,6 %</strong> — Erhebung im November 2025, rund 700 Betriebe, veröffentlicht im März 2026.<sup>[2]</sup> Andere Grundgesamtheit, neun Monate älter.</li>\n      <li><span class=\"chip good\">twiceD</span> Zwei Ideen aus dieser Woche: der <strong>Rückholpfad</strong> (nicht „wie weit käme der Agent\", sondern „wie machen wir rückgängig, was er schon getan hat\") und der <strong>Vorgangs-Agent zum Betriebsstundenpreis</strong> nach Octane-Muster.</li>\n      <li><span class=\"chip\">ABGRENZUNG</span> Coding-Agenten und Entwickler-Werkzeuge — auch der Programmier-Teil von Cowork — stehen im <em>ai-dev</em>-Brief. Die Artikel-50-Pflicht der EU wurde am 19. und 20.08. hier ausführlich behandelt und heute nicht wiederholt.</li>\n    </ul></div>",

i Ideen aus dieser Woche: der <strong>Rückholpfad</strong> (nicht „wie weit käme der Agent\", sondern „wie machen wir rückgängig, was er schon getan hat\") und der <strong>Vorgangs-Agent zum Betriebsstundenpreis</strong> nach Octane-Muster.</li>\n      <li><span class=\"chip\">ABGRENZUNG</span> Coding-Agenten und Entwickler-Werkzeuge — auch der Programmier-Teil von Cowork — stehen im <em>ai-dev</em>-Brief. Die Artikel-50-Pflicht der EU wurde am 19. und 20.08. hier ausführlich behandelt und heute nicht wiederholt.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Nothing happened today itself — no fresh news in the 24-hour window that would carry this brief on its own. But the week behind it has a very clear shape, and it's a pricing story with two sides. The <strong>entry price</strong> for an autonomous agent dropped to consumer level this month: Google's <strong>Gemini Spark</strong> has been available in the <strong>$19.99</strong> tier as well as the $99.99 tier since 2026-07-23,<sup>[3]</sup> and Anthropic's <strong>Claude Cowork</strong> has been included in every paid plan starting at <strong>$20</strong> since 2026-08-18, now running on phones too.<sup>[5][6]</sup> The <strong>exit price</strong> didn't fall with it. From Brazil — the country with the highest agent-adoption rate in the whole survey — comes the number that belongs next to it: <strong>four out of five</strong> organizations have already had to stop or roll back an AI deployment.<sup>[1]</sup> That's the real finding of the week: starting costs almost nothing anymore. Stopping still costs a lot.</p>\n    <ul>\n      <li><span class=\"chip hot\">STUDY · BR</span> <strong>Brazil leads the deployment stats:</strong> <strong>76%</strong> of Brazilian companies run AI agents in production — against <strong>62%</strong> globally and <strong>67%</strong> in the US.<sup>[1]</sup> Vendor-funded self-reporting, methodology box below.</li>\n      <li><span class=\"chip hot\">STUDY · BR</span> <strong>And the flip side in the same survey:</strong> <strong>80%</strong> of Brazilian organizations have paused or reversed an AI deployment; <strong>39%</strong> of those rollbacks started with a data breach.<sup>[1]</sup></li>\n      <li><span class=\"chip\">STUDY · BR</span> <strong>Still no retreat from the topic, though:</strong> <strong>66%</strong> want to increase their AI investment by more than 25%; in Latin America, <strong>21%</strong> are planning a jump of over 50%, versus just 12% in North America.<sup>[1]</sup></li>\n      <li><span class=\"chip\">DEPLOY · US</span> <strong>The price of a standing agent dropped by four-fifths:</strong> Gemini Spark launched as an exclusive feature of the <strong>$99.99</strong> tier<sup>[4]</sup> and has been included in the <strong>$19.99</strong> AI Pro tier since <strong>2026-07-23</strong>.<sup>[3]</sup> Not in the EEA, not in the UK, not in Switzerland — as of the reporting.<sup>[4]</sup></li>\n      <li><span class=\"chip\">DEPLOY · GLOBAL</span> <strong>Claude Cowork leaves the premium tier behind:</strong> on mobile and in the browser for <em>all</em> paid plans since <strong>2026-08-18</strong>;<sup>[5]</sup> the pricing page today lists it under the <strong>$20</strong> Pro plan ($17 with annual billing).<sup>[6]</sup></li>\n      <li><span class=\"chip\">DEPLOY · IN</span> <strong>Agent instead of a module, payroll example:</strong> Kredily 3.0 introduces <strong>KAI</strong> — <strong>110+ skills</strong> across payroll, attendance, and leave, with exceptions routed for human approval; built on a base of <strong>25,000+</strong> businesses and over <strong>1 million</strong> employees.<sup>[7]</sup></li>\n      <li><span class=\"chip\">DEPLOY · US</span> <strong>And the pricing formula worth noting:</strong> Octane is selling an \"operating system\" for gas-station convenience stores starting at <strong>$1 per hour per location</strong> — billed against a shift, not a seat.<sup>[8]</sup> 12 pilot sites, primary source unreachable.<sup>[9]</sup></li>\n      <li><span class=\"chip\">STUDY · DE</span> <strong>For comparison, explicitly not comparable:</strong> In the German Mittelstand, agent-system adoption stood at <strong>16.6%</strong> — surveyed in November 2025, roughly 700 businesses, published in March 2026.<sup>[2]</sup> Different population, nine months older.</li>\n      <li><span class=\"chip good\">twiceD</span> Two ideas from this week: the <strong>Recall Path</strong> (not \"how far could the agent go,\" but \"how do we undo what it already did\") and the <strong>Per-Process Agent Priced by the Operating Hour</strong>, modeled on Octane.</li>\n      <li><span class=\"chip\">SCOPE NOTE</span> Coding agents and developer tooling — including the coding side of Cowork — belong in the <em>ai-dev</em> brief. The EU's Article 50 obligation was covered at length here on 2026-08-19 and 2026-08-20 and isn't repeated today.</li>\n    </ul></div>"
      }

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Der Freistaat Bayern schreibt Anwendungsentwicklung in <strong>Java, Spring, JPA, TypeScript und Angular</strong> aus — fünf gleiche Lose, je rund <strong>9,375 Mio. €</strong> für je rund <strong>75.000 Arbeitsstunden</strong>. Diese Division geht glatt auf: <strong>exakt 125,00 € je Stunde</strong>, der Rahmen-Höchstwert ebenso glatt 187,50 €.<sup>[1]</sup> Damit steht heute zum ersten Mal eine Zahl über 100 € im Brief, die nicht aus einer Umfrage stammt: <strong>ein öffentlicher Auftraggeber kalkuliert mit 125 € für die Arbeit, die dieses Board an anderer Stelle zu bestätigten 85,29 € vermittelt.</strong> Die zweite Nachricht ist unbequemer — ein Los verlangt rechnerisch rund <strong>zwölf bis dreizehn Vollzeitkräfte</strong>, twiceD hat zwei. Und der bislang beste Kandidat der Woche, die Vergabe der FU Berlin, fällt <em>heute</em> aus der Fünf-Werktage-Regel dieses Briefs.</p>\n    <ul>\n      <li><span class=\"chip hot\">Vergabe</span> <strong>Neue Ausschreibung, Daniels Hauptstrom eins zu eins.</strong> Bayerisches Staatsministerium für Ernährung, Landwirtschaft und Forsten (StMELF): fünf identische Lose Anwendungsentwicklung für Agrarförderung und EU-Zahlungsabwicklung. Stack laut Bekanntmachung <em>Racy25 (Java/TypeScript, Angular, Spring, JPA — Standard für Neuentwicklungen)</em> neben dem Altsystem <em>Racy10 (Java, Apache Wicket, Spring, JPA)</em>. Abgabefrist <strong>Do 24.09.26, 10:00</strong>, elektronisch über auftraege.bayern.de.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">Anker</span> <strong>125,00 €/h — die erste nicht-selbstberichtete Zahl über 100 €.</strong> 9,375 Mio. € ÷ 75.000 h. Das sind <strong>+46,6 %</strong> gegenüber dem Mittelwert der sieben vom Auftraggeber veröffentlichten Board-Sätze (85,29 €), <strong>+22,6 %</strong> gegenüber dem freelance.de-Durchschnitt (101,98 €)<sup>[2]</sup> und <strong>+31,6 %</strong> gegenüber dem Freelancer-Kompass-Median (95 €).<sup>[3]</sup> Wichtig: Es ist ein <em>Generalunternehmer</em>-Preis, kein Freelancer-Satz — die Auflösung steht unten.</li>\n      <li><span class=\"chip\">Vergabe</span> <strong>Und genau deshalb ist es kein Direct Fit.</strong> 75.000 h über 45 Monate sind rund <strong>20.000 h pro Jahr und Los</strong> — bei 1.600 produktiven Jahresstunden je Kopf <strong>etwa 12,5 Vollzeitkräfte</strong>. Für alle fünf Lose zusammen: 375.000 Stunden, 46,875 Mio. € geschätzt, bis zu 70,3 Mio. € Rahmen. Verdict: <span class=\"chip\">⚠️ Partner</span> — realistisch nur als Unterauftragnehmer, nicht als Bieter.</li>\n      <li><span class=\"chip hot\">Frist</span> <strong>Das Berliner Fenster ist heute zugefallen.</strong> Die Vergabe der Freien Universität Berlin (elektronische Projektanzeige, Java Spring Boot, Kubernetes) ist heute erneut als offen bestätigt, Frist unverändert <strong>Fr 28.08.26, 11:00</strong>.<sup>[4]</sup> Ab morgen bleiben aber nur noch <strong>vier volle Werktage</strong> (Mo–Do) — die Vorlaufregel dieses Briefs verlangt fünf. Sie steht ab heute im Kalender, nicht mehr in der Empfehlung.</li>\n      <li><span class=\"chip\">Vergabe</span> <strong>TED schweigt den vierten Tag.</strong> Die Such-API antwortet auf GET weiter mit HTTP 405, ein direkter Notice-PDF-Abruf ebenso.<sup>[5]</sup> Beide Ausschreibungen oben mussten über Spiegel bestätigt werden. Seit dem 18.08. sagt dieser Brief über <em>neue</em> EU-Bekanntmachungen nichts — weder dass es welche gibt noch dass es keine gibt.</li>\n      <li><span class=\"chip good\">Board</span> <strong>137 Listings</strong> (115 Freelance / 11 Employee / 11 Intriguing): <strong>6 Zugänge, 0 Abgänge</strong>, alle sechs neu von freelancermap.de. Spitze 83, Median 66, fünf Einträge ≥ 80 — die Spitzengruppe steht zum <strong>neunzehnten Lauf in Folge</strong> still.</li>\n      <li><span class=\"chip hot\">IoT</span> <strong>Der beste Zugang ist ein Nischen-Premium-Mandat.</strong> Amoria Bond sucht einen „Fullstack Entwickler IoT (Java / AWS)\", 100 % remote in Deutschland, 6+ Monate — <strong>Fit 78</strong>, Band 100–130 €/h*. Das ist der <strong>höchstbewertete IoT-Eintrag des gesamten Boards</strong> (nächster: 68) und der einzige der sechs Zugänge im Premium-Band.</li>\n      <li><span class=\"chip\">Anker</span> <strong>Keine neue bestätigte Rate heute.</strong> Alle sechs Zugänge tragen recherchierte Bänder mit Sternchen. Die Zahl der vom Auftraggeber veröffentlichten Vergütungen bleibt bei <strong>neun</strong> (sieben Stundensätze, Mittelwert unverändert <strong>85,29 €</strong>, Median 85 €; dazu zwei Jahresgehälter).</li>\n      <li><span class=\"chip\">Markt</span> <strong>Frankfurt und lange Laufzeiten.</strong> Vier der sechs Zugänge nennen Frankfurt (Board gesamt: 37 von 137). Und drei laufen <strong>12 Monate oder länger</strong> — 34 Monate, 2–3 Jahre, 12 Monate + Option; der Tag <code>Long-Term</code> steigt von 13 auf 15. Zwei Mandate sind ausdrücklich als Arbeitnehmerüberlassung beziehungsweise „ANÜ-ähnlich\" ausgeschrieben — was für eine GmbH etwas anderes bedeutet als für eine Einzelperson.</li>\n      <li><span class=\"chip\">Abbau</span> <strong>Continental hat endlich eine belastbare 2026er-Zahl.</strong> <strong>1.600</strong> Stellen in Deutschland, <strong>3.000</strong> weltweit bei ContiTech, Beleg vom <strong>12.05.2026</strong><sup>[6]</sup> — er ersetzt die gestern zurückgewiesene Marke aus einem Februar-2025-Aggregator. SAP stellt seit dem 06.07.2026 fast nur noch für Kern-KI-Rollen ein.<sup>[7]</sup> Die kursierenden „weitere 13.000 Stellen\" bei Bosch stammen dagegen vom <strong>25.09.2025</strong> und sind keine frische Meldung.<sup>[8]</sup></li>\n    </ul></div>",

        "en": "<div class=\"tldr\"><p class=\"lead\">The Free State of Bavaria is putting application development in <strong>Java, Spring, JPA, TypeScript, and Angular</strong> out to tender — five identical lots, each worth roughly <strong>€9.375 million</strong> for roughly <strong>75,000 work hours</strong>. That division comes out even: <strong>exactly €125.00 per hour</strong>, with the framework ceiling landing just as evenly at €187.50.<sup>[1]</sup> For the first time, this brief carries a figure above €100 that doesn't come from a survey: <strong>a public contracting authority is budgeting €125 for the same work this board elsewhere brokers at a confirmed €85.29.</strong> The second story is less comfortable — one lot works out to roughly <strong>twelve to thirteen full-time employees</strong>, and twiceD has two. And the best candidate of the week so far, the FU Berlin tender, drops out of this brief's five-business-day rule <em>today</em>.</p>\n    <ul>\n      <li><span class=\"chip hot\">Tender</span> <strong>New tender, Daniel's core stack one to one.</strong> Bavarian State Ministry for Food, Agriculture and Forestry (StMELF): five identical lots of application development for agricultural subsidy programs and EU payment processing. Per the notice, the stack is <em>Racy25 (Java/TypeScript, Angular, Spring, JPA — the standard for new development)</em> alongside the legacy system <em>Racy10 (Java, Apache Wicket, Spring, JPA)</em>. Submission deadline <strong>Thu 09-24, 10:00</strong>, electronic only via auftraege.bayern.de.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">Anchor</span> <strong>€125.00/h — the first not-self-reported figure above €100.</strong> €9.375 million ÷ 75,000 h. That's <strong>+46.6%</strong> over the average of the seven client-published board rates (€85.29), <strong>+22.6%</strong> over the freelance.de average (€101.98)<sup>[2]</sup>, and <strong>+31.6%</strong> over the Freelancer-Kompass median (€95).<sup>[3]</sup> Important: this is a <em>general-contractor</em> price, not a freelancer rate — the breakdown is below.</li>\n      <li><span class=\"chip\">Tender</span> <strong>And that's exactly why it's not a direct fit.</strong> 75,000 h over 45 months works out to roughly <strong>20,000 h per year and per lot</strong> — at 1,600 productive hours per head per year, that's <strong>about 12.5 full-time employees</strong>. Across all five lots: 375,000 hours, an estimated €46.875 million, up to €70.3 million at the framework ceiling. Verdict: <span class=\"chip\">⚠️ Partner</span> — realistically only as a subcontractor, not as a bidder.</li>\n      <li><span class=\"chip hot\">Deadline</span> <strong>The Berlin window closed today.</strong> The Freie Universität Berlin tender (electronic project notice, Java Spring Boot, Kubernetes) is confirmed open again today, deadline unchanged at <strong>Fri 08-28, 11:00</strong>.<sup>[4]</sup> But from tomorrow only <strong>four full business days</strong> remain (Mon–Thu) — this brief's lead-time rule requires five. It stays on the calendar from today on, but no longer in the recommendation.</li>\n      <li><span class=\"chip\">Tender</span> <strong>TED has been silent for the fourth day.</strong> The search API still responds to GET with HTTP 405, and so does a direct notice-PDF fetch.<sup>[5]</sup> Both tenders above had to be confirmed via mirrors. Since 08-18 this brief has had nothing to say about <em>new</em> EU notices — neither that there are any nor that there aren't.</li>\n      <li><span class=\"chip good\">Board</span> <strong>137 listings</strong> (115 freelance / 11 employee / 11 intriguing): <strong>6 additions, 0 departures</strong>, all six new from freelancermap.de. High 83, median 66, five entries ≥ 80 — the top group has stood still for the <strong>nineteenth run in a row</strong>.</li>\n      <li><span class=\"chip hot\">IoT</span> <strong>The best addition is a niche premium mandate.</strong> Amoria Bond is looking for a \"Full-Stack Developer IoT (Java / AWS),\" 100% remote in Germany, 6+ months — <strong>fit 78</strong>, band €100–130/h*. That's the <strong>highest-rated IoT entry on the entire board</strong> (next: 68) and the only one of the six additions in the premium band.</li>\n      <li><span class=\"chip\">Anchor</span> <strong>No new confirmed rate today.</strong> All six additions carry researched, asterisked bands. The count of client-published pay figures stays at <strong>nine</strong> (seven hourly rates, average unchanged at <strong>€85.29</strong>, median €85; plus two annual salaries).</li>\n      <li><span class=\"chip\">Market</span> <strong>Frankfurt and long terms.</strong> Four of the six additions name Frankfurt (board-wide: 37 of 137). And three run <strong>12 months or longer</strong> — 34 months, 2–3 years, 12 months + option; the <code>Long-Term</code> tag rises from 13 to 15. Two mandates are explicitly advertised as Arbeitnehmerüberlassung or \"ANÜ-like\" — which means something different for a GmbH than for an individual.</li>\n      <li><span class=\"chip\">Layoffs</span> <strong>Continental finally has a solid 2026 figure.</strong> <strong>1,600</strong> jobs in Germany, <strong>3,000</strong> worldwide at ContiTech, sourced <strong>2026-05-12</strong><sup>[6]</sup> — replacing the mark rejected yesterday, which traced back to a February 2025 aggregator. SAP has limited new hiring almost entirely to core AI roles since 2026-07-06.<sup>[7]</sup> The widely circulated \"further 13,000 jobs\" at Bosch, by contrast, date from <strong>2025-09-25</strong> and aren't a fresh report.<sup>[8]</sup></li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Die Unwetterwarnung, die gestern über halb Paraná lag, ist gestern Nacht um 23:59 Uhr ausgelaufen — und für heute findet sich keine neue. Was bleibt, ist das seltene Zusammentreffen, auf das man im August wartet: <strong>drei trockene, sonnige Tage hintereinander</strong>, genau in dem Fenster, in dem die 54. EFAPI in Santo Antônio da Platina zum letzten Mal offen hat. Samstag kommt noch der nationale Impftag dazu, Sonntag hat der Sesc in Londrina zwei Gratis-Formate für Kinder. Das Wochenende plant sich damit fast von allein — und in der Gesundheitsspalte gibt es nach Wochen des Wartens endlich wieder eine belastbare Dengue-Zahl, wenn auch nur für Londrina.</p>\n    <ul>\n      <li><span class=\"chip good\">WETTER</span> <strong>Drei trockene Tage am Stück:</strong> heute <strong>14–22 °C</strong>, Sa <strong>12–25 °C</strong>, So <strong>11–26 °C</strong> — an allen drei Tagen <span class=\"stat\">0,0 mm</span> und 0 % Regenwahrscheinlichkeit, von zwei Portalen unabhängig bestätigt.</li>\n      <li><span class=\"chip\">WETTER</span> <strong>Sonntag hat 15 Grad Spanne:</strong> 11 °C mit leichtem Frühnebel am Morgen, 26 °C am Nachmittag. Zwiebelprinzip — Jacke und T-Shirt in dieselbe Tasche.</li>\n      <li><span class=\"chip hot\">EVENT</span> <strong>EFAPI-Finale:</strong> die 54. Ausgabe läuft nur noch <strong>heute, Samstag und Sonntag</strong> im Parque de Exposições in Santo Antônio da Platina, <strong>51 km / ca. 48 min</strong>. Geländezutritt frei, nur die Abendshows kosten.</li>\n      <li><span class=\"chip hot\">GESUNDHEIT</span> <strong>Samstag ist Dia D der Multivacinação</strong> — nationaler Impfpass-Check für alle unter 15 Jahren, die Kampagne läuft noch bis 1. September.</li>\n      <li><span class=\"chip good\">GESUNDHEIT</span> <strong>Endlich wieder eine Dengue-Zahl:</strong> Londrinas Stadtbulletin vom <strong>30.07.2026</strong> meldet <strong>1.309</strong> bestätigte Fälle gegenüber <strong>4.731</strong> im Vorjahreszeitraum — minus <strong>72 %</strong> — und <strong>2 statt 9</strong> Todesfälle.</li>\n      <li><span class=\"chip\">GESUNDHEIT</span> <strong>Atemwegs-Alarm bleibt:</strong> Paraná steht in <strong>SE 31/2026</strong> weiter unter den 14 Bundesstaaten im Alert-/Risiko-Bereich, VSR ist mit <strong>42,2 %</strong> der häufigste laborbestätigte Erreger. Für ein einen Monat altes Kind ist genau das die relevante Zahl.</li>\n      <li><span class=\"chip good\">EVENT</span> <strong>Sonntag im Sesc Cadeião Londrina:</strong> <strong>15:00</strong> „Experimentação sensorial para crianças\", <strong>17:00</strong> das Konzert „Yakã\" — beides gratis, heute früh direkt auf der Sesc-Seite gegengeprüft.</li>\n      <li><span class=\"chip\">EVENT</span> <strong>Mundo Bita</strong> im Catuaí Londrina, Sa und So je <strong>14–17 Uhr</strong> — Kleinkind-Territorium, Preisfrage weiter offen.</li>\n      <li><span class=\"chip\">STRASSE</span> <strong>Stop-and-Go auf der EFAPI-Route:</strong> Baustellen auf <strong>BR-153</strong> und <strong>PR-092</strong>, einspurige Abschnitte mit Wechselverkehr. Zeitpuffer einplanen, im Hellen zurückfahren.</li>\n      <li><span class=\"chip\">TRIP</span> <strong>September vormerken:</strong> Wet'n Wild in Itupeva startet am <strong>17.09.</strong> die 10. „Noites Macabras\" — der <em>Tagesbetrieb</em> ist der Familienteil, der Abendteil ausdrücklich nicht.</li>\n      <li><span class=\"chip\">OFFEN</span> <strong>Zwei Lücken bleiben:</strong> die statewide Dengue-Zahlen aus dem <strong>Informe nº 25</strong> (18.08.) sind weiter nicht abrufbar, und für „Sextou na Concha\" heute Abend in Londrina gibt es noch keine Ankündigung.</li>\n    </ul></div>",

        "en": "<div class=\"tldr\"><p class=\"lead\">The severe-weather warning that covered half of Paraná yesterday expired last night at 11:59 p.m. — and there's no new one for today. What's left is the rare convergence you wait for in August: <strong>three dry, sunny days in a row</strong>, landing exactly in the window when the 54th EFAPI in Santo Antônio da Platina is open for the last time. Saturday adds the national vaccination day, and Sunday brings two free kids' programs at the Sesc in Londrina. The weekend practically plans itself — and in the health column, after weeks of waiting, there's finally a solid dengue number again, even if only for Londrina.</p>\n    <ul>\n      <li><span class=\"chip good\">WEATHER</span> <strong>Three dry days in a row:</strong> today <strong>14–22°C</strong>, Sat <strong>12–25°C</strong>, Sun <strong>11–26°C</strong> — all three days at <span class=\"stat\">0.0 mm</span> and 0% chance of rain, independently confirmed by two portals.</li>\n      <li><span class=\"chip\">WEATHER</span> <strong>Sunday swings 15 degrees:</strong> 11°C with light morning fog, 26°C by afternoon. Layer up — pack a jacket and a T-shirt in the same bag.</li>\n      <li><span class=\"chip hot\">EVENT</span> <strong>EFAPI finale:</strong> the 54th edition runs only through <strong>today, Saturday, and Sunday</strong> at the Parque de Exposições in Santo Antônio da Platina, <strong>51 km / about 48 min</strong> away. Grounds admission is free; only the evening shows cost money.</li>\n      <li><span class=\"chip hot\">HEALTH</span> <strong>Saturday is Multivacinação Day D</strong> — a national vaccination-card check for everyone under 15; the campaign runs through September 1.</li>\n      <li><span class=\"chip good\">HEALTH</span> <strong>Finally, a dengue number again:</strong> Londrina's city bulletin from <strong>Jul 30, 2026</strong>, reports <strong>1,309</strong> confirmed cases versus <strong>4,731</strong> in the same period last year — down <strong>72%</strong> — and <strong>2 deaths instead of 9</strong>.</li>\n      <li><span class=\"chip\">HEALTH</span> <strong>Respiratory alert continues:</strong> Paraná remains among the 14 states in the alert/risk band in <strong>epi week 31/2026</strong>, with RSV the most common lab-confirmed pathogen at <strong>42.2%</strong>. For a one-month-old, that's exactly the number that matters.</li>\n      <li><span class=\"chip good\">EVENT</span> <strong>Sunday at Sesc Cadeião Londrina:</strong> <strong>3:00 p.m.</strong> \"Experimentação sensorial para crianças,\" <strong>5:00 p.m.</strong> the concert \"Yakã\" — both free, cross-checked directly on the Sesc site this morning.</li>\n      <li><span class=\"chip\">EVENT</span> <strong>Mundo Bita</strong> at Catuaí Londrina, Sat and Sun <strong>2–5 p.m.</strong> — toddler territory, price question still open.</li>\n      <li><span class=\"chip\">ROADS</span> <strong>Stop-and-go on the EFAPI route:</strong> roadwork on <strong>BR-153</strong> and <strong>PR-092</strong>, single-lane sections with alternating traffic. Build in extra time, and drive back while it's still light.</li>\n      <li><span class=\"chip\">TRIP</span> <strong>Mark September:</strong> Wet'n Wild in Itupeva kicks off the 10th \"Noites Macabras\" on <strong>Sep 17</strong> — the <em>daytime operation</em> is the family part, the evening portion explicitly is not.</li>\n      <li><span class=\"chip\">OPEN</span> <strong>Two gaps remain:</strong> the statewide dengue numbers from <strong>Informe nº 25</strong> (Aug 18) are still unavailable, and there's no announcement yet for \"Sextou na Concha\" tonight in Londrina.</li>\n    </ul></div>"
