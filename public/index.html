      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Seit Dienstag steht ein offener Brief im Netz, den man zwei Jahre lang für unmöglich gehalten hätte: Beschäftigte von <strong>OpenAI</strong>, <strong>Anthropic</strong>, <strong>Google DeepMind</strong> und <strong>Meta AI</strong> bitten die US-Regierung, eine internationale Anstrengung zu unterstützen, um das Tempo der KI-Entwicklung <em>absichtlich</em> zu drosseln — und ihre Arbeitgeber haben binnen Stunden zugestimmt.<sup>[1][2]</sup> Das ändert an keinem Rollout dieses Quartals etwas. Es ändert aber, was ein Einkäufer bei einem Drei-Jahres-Vertrag fragen sollte. Und in drei Tagen gilt in Europa der Rest des AI Act.</p>\n    <ul>\n      <li><span class=\"chip hot\">POLITIK · Global</span> <strong>„Pacing the Frontier\":</strong> <strong>1.293</strong> Unterzeichner (Eigenangabe der Kampagnenseite, mein Abruf 30.07.); die Fachpresse zählte am 28.07. zwischen <strong>1.100</strong> und <strong>1.178</strong>. Kern-Bitte: Werkzeuge, um die Grenze der <em>automatisierten</em> KI-Entwicklung zu takten — kein Stopp, keine Frist.<sup>[1][5]</sup></li>\n      <li><span class=\"chip hot\">POLITIK · Global</span> <strong>Der Arbeitgeber unterschreibt die Belegschafts-Petition mit:</strong> OpenAI erklärt, das Tempo könne so hoch sein, „dass die Welt die Geschwindigkeit des KI-Fortschritts takten muss\"; Anthropic verweist auf eigene Forschung zur rekursiven Selbstverbesserung.<sup>[2][4]</sup></li>\n      <li><span class=\"chip hot\">REG · EU</span> <strong>Drei Tage bis zum 02.08.:</strong> Dann gilt „der Rest der Verordnung\" — Artikel 6(1) ausgenommen.<sup>[6]</sup> Eine juristische Lesart datiert darauf den Start des Kommissions-Vollzugs gegen Modell-Anbieter, Rahmen bis <strong>15 Mio. €</strong> oder <strong>3 %</strong>.<sup>[7]</sup></li>\n      <li><span class=\"chip\">REG · EU</span> <strong>DMA-Faden, neu seit dem 26.07.:</strong> Ein EuG-Urteil vom <strong>08.07.</strong> etabliert eine „Sequencing-Rule\" — Google kann die Android-Anordnung nicht vorab gerichtlich prüfen lassen. Betroffen: rund <strong>60 %</strong> der EU-Android-Nutzer.<sup>[8][9]</sup></li>\n      <li><span class=\"chip\">STUDIE · Global</span> <strong>Fünf Zahlen zirkulieren diese Woche</strong> — <strong>234 Mrd. $</strong>, <strong>13 %</strong>, <strong>40 %</strong>, <strong>R$ 1,76 Mrd.</strong> und zwei brasilianische Bankenwerte. Nach Quellenprüfung überstehen <em>zwei</em>. Was das für die Lektüre von KI-Zahlen heißt: unten.</li>\n      <li><span class=\"chip good\">twiceD</span> Zwei Ideen, beide Engineering statt Papier: ein <strong>Agenten-Abnahmetest</strong> für gekaufte KI-Agenten und ein <strong>Umzugstest</strong> zur Zweitanbieter-Fähigkeit.</li>\n    </ul></div>",

        "de": "<div class=\"tldr\"><p class=\"lead\">Seit Dienstag steht ein offener Brief im Netz, den man zwei Jahre lang für unmöglich gehalten hätte: Beschäftigte von <strong>OpenAI</strong>, <strong>Anthropic</strong>, <strong>Google DeepMind</strong> und <strong>Meta AI</strong> bitten die US-Regierung, eine internationale Anstrengung zu unterstützen, um das Tempo der KI-Entwicklung <em>absichtlich</em> zu drosseln — und ihre Arbeitgeber haben binnen Stunden zugestimmt.<sup>[1][2]</sup> Das ändert an keinem Rollout dieses Quartals etwas. Es ändert aber, was ein Einkäufer bei einem Drei-Jahres-Vertrag fragen sollte. Und in drei Tagen gilt in Europa der Rest des AI Act.</p>\n    <ul>\n      <li><span class=\"chip hot\">POLITIK · Global</span> <strong>„Pacing the Frontier\":</strong> <strong>1.293</strong> Unterzeichner (Eigenangabe der Kampagnenseite, mein Abruf 30.07.); die Fachpresse zählte am 28.07. zwischen <strong>1.100</strong> und <strong>1.178</strong>. Kern-Bitte: Werkzeuge, um die Grenze der <em>automatisierten</em> KI-Entwicklung zu takten — kein Stopp, keine Frist.<sup>[1][5]</sup></li>\n      <li><span class=\"chip hot\">POLITIK · Global</span> <strong>Der Arbeitgeber unterschreibt die Belegschafts-Petition mit:</strong> OpenAI erklärt, das Tempo könne so hoch sein, „dass die Welt die Geschwindigkeit des KI-Fortschritts takten muss\"; Anthropic verweist auf eigene Forschung zur rekursiven Selbstverbesserung.<sup>[2][4]</sup></li>\n      <li><span class=\"chip hot\">REG · EU</span> <strong>Drei Tage bis zum 02.08.:</strong> Dann gilt „der Rest der Verordnung\" — Artikel 6(1) ausgenommen.<sup>[6]</sup> Eine juristische Lesart datiert darauf den Start des Kommissions-Vollzugs gegen Modell-Anbieter, Rahmen bis <strong>15 Mio. €</strong> oder <strong>3 %</strong>.<sup>[7]</sup></li>\n      <li><span class=\"chip\">REG · EU</span> <strong>DMA-Faden, neu seit dem 26.07.:</strong> Ein EuG-Urteil vom <strong>08.07.</strong> etabliert eine „Sequencing-Rule\" — Google kann die Android-Anordnung nicht vorab gerichtlich prüfen lassen. Betroffen: rund <strong>60 %</strong> der EU-Android-Nutzer.<sup>[8][9]</sup></li>\n      <li><span class=\"chip\">STUDIE · Global</span> <strong>Fünf Zahlen zirkulieren diese Woche</strong> — <strong>234 Mrd. $</strong>, <strong>13 %</strong>, <strong>40 %</strong>, <strong>R$ 1,76 Mrd.</strong> und zwei brasilianische Bankenwerte. Nach Quellenprüfung überstehen <em>zwei</em>. Was das für die Lektüre von KI-Zahlen heißt: unten.</li>\n      <li><span class=\"chip good\">twiceD</span> Zwei Ideen, beide Engineering statt Papier: ein <strong>Agenten-Abnahmetest</strong> für gekaufte KI-Agenten und ein <strong>Umzugstest</strong> zur Zweitanbieter-Fähigkeit.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Since Tuesday, an open letter has been live online that would have seemed impossible two years ago: employees of <strong>OpenAI</strong>, <strong>Anthropic</strong>, <strong>Google DeepMind</strong>, and <strong>Meta AI</strong> are asking the US government to support an international effort to <em>deliberately</em> slow the pace of AI development — and their employers agreed within hours.<sup>[1][2]</sup> That changes nothing about this quarter's rollouts. But it changes what a buyer should be asking before signing a three-year contract. And in three days, the rest of the AI Act takes effect in Europe.</p>\n    <ul>\n      <li><span class=\"chip hot\">POLICY · Global</span> <strong>\"Pacing the Frontier\":</strong> <strong>1,293</strong> signatories (per the campaign site's own count, my check on 07/30); trade press counted between <strong>1,100</strong> and <strong>1,178</strong> on 07/28. Core ask: tools to pace the frontier of <em>automated</em> AI development — not a stop, not a deadline.<sup>[1][5]</sup></li>\n      <li><span class=\"chip hot\">POLICY · Global</span> <strong>The employer co-signs the workforce petition:</strong> OpenAI states the pace could get high enough \"that the world will need to pace the rate of AI advancement\"; Anthropic points to its own research on recursive self-improvement.<sup>[2][4]</sup></li>\n      <li><span class=\"chip hot\">REG · EU</span> <strong>Three days to 08/02:</strong> that's when \"the remainder of the Act\" applies — Article 6(1) excepted.<sup>[6]</sup> One legal reading dates the start of Commission enforcement against model providers to that day, with a cap of <strong>€15 million</strong> or <strong>3%</strong>.<sup>[7]</sup></li>\n      <li><span class=\"chip\">REG · EU</span> <strong>DMA thread, new since 07/26:</strong> A General Court ruling on <strong>07/08</strong> establishes a \"sequencing rule\" — Google can't get the Android order reviewed by a court beforehand. Affected: roughly <strong>60%</strong> of EU Android users.<sup>[8][9]</sup></li>\n      <li><span class=\"chip\">STUDY · Global</span> <strong>Five numbers are circulating this week</strong> — <strong>$234 billion</strong>, <strong>13%</strong>, <strong>40%</strong>, <strong>R$1.76 billion</strong>, and two Brazilian bank figures. After checking sources, <em>two</em> survive. What that means for reading AI numbers: below.</li>\n      <li><span class=\"chip good\">twiceD</span> Two ideas, both engineering rather than paper: an <strong>agent acceptance test</strong> for purchased AI agents and a <strong>migration test</strong> for second-vendor capability.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Desde terça-feira, uma carta aberta circula na internet — algo que, dois anos atrás, pareceria impossível: funcionários da <strong>OpenAI</strong>, <strong>Anthropic</strong>, <strong>Google DeepMind</strong> e <strong>Meta AI</strong> pedem ao governo dos EUA que apoie um esforço internacional para desacelerar <em>deliberadamente</em> o ritmo do desenvolvimento de IA — e seus empregadores concordaram em questão de horas.<sup>[1][2]</sup> Isso não muda nada em nenhum rollout deste trimestre. Mas muda o que um comprador deveria perguntar antes de assinar um contrato de três anos. E em três dias entra em vigor, na Europa, o restante do AI Act.</p>\n    <ul>\n      <li><span class=\"chip hot\">POLÍTICA · Global</span> <strong>\"Pacing the Frontier\":</strong> <strong>1.293</strong> signatários (número informado pelo próprio site da campanha, minha checagem em 30/07); a imprensa especializada contou entre <strong>1.100</strong> e <strong>1.178</strong> em 28/07. Pedido central: ferramentas para pautar a fronteira do desenvolvimento <em>automatizado</em> de IA — nem uma parada, nem um prazo.<sup>[1][5]</sup></li>\n      <li><span class=\"chip hot\">POLÍTICA · Global</span> <strong>O empregador assina junto a petição dos funcionários:</strong> a OpenAI declara que o ritmo pode ficar alto o bastante \"that the world will need to pace the rate of AI advancement\"; a Anthropic remete à própria pesquisa sobre autoaperfeiçoamento recursivo.<sup>[2][4]</sup></li>\n      <li><span class=\"chip hot\">REG · UE</span> <strong>Três dias até 02/08:</strong> a partir daí vale \"o restante do Regulamento\" — com exceção do Artigo 6(1).<sup>[6]</sup> Uma leitura jurídica data desse dia o início da fiscalização da Comissão contra fornecedores de modelos, com teto de <strong>€ 15 milhões</strong> ou <strong>3%</strong>.<sup>[7]</sup></li>\n      <li><span class=\"chip\">REG · UE</span> <strong>Frente do DMA, nova desde 26/07:</strong> uma decisão do Tribunal Geral da UE de <strong>08/07</strong> estabelece uma \"regra de sequenciamento\" — o Google não pode pedir revisão judicial prévia da ordem sobre o Android. Afetados: cerca de <strong>60%</strong> dos usuários de Android na UE.<sup>[8][9]</sup></li>\n      <li><span class=\"chip\">ESTUDO · Global</span> <strong>Cinco números circulam nesta semana</strong> — <strong>US$ 234 bilhões</strong>, <strong>13%</strong>, <strong>40%</strong>, <strong>R$ 1,76 bilhão</strong> e dois valores de bancos brasileiros. Após checagem de fontes, <em>dois</em> sobrevivem. O que isso significa para ler números de IA: mais abaixo.</li>\n      <li><span class=\"chip good\">twiceD</span> Duas ideias, ambas de engenharia e não de papel: um <strong>teste de homologação de agentes</strong> para agentes de IA comprados e um <strong>teste de mudança</strong> para a capacidade de trocar de fornecedor.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Desde el martes circula en internet una carta abierta que, hace dos años, habría parecido imposible: empleados de <strong>OpenAI</strong>, <strong>Anthropic</strong>, <strong>Google DeepMind</strong> y <strong>Meta AI</strong> piden al gobierno de Estados Unidos que apoye un esfuerzo internacional para frenar <em>deliberadamente</em> el ritmo del desarrollo de IA — y sus empleadores lo respaldaron en cuestión de horas.<sup>[1][2]</sup> Eso no cambia nada en ningún despliegue de este trimestre. Pero sí cambia lo que un comprador debería preguntar antes de firmar un contrato de tres años. Y en tres días entra en vigor, en Europa, el resto de la Ley de IA.</p>\n    <ul>\n      <li><span class=\"chip hot\">POLÍTICA · Global</span> <strong>\"Pacing the Frontier\":</strong> <strong>1.293</strong> firmantes (cifra propia del sitio de la campaña, mi consulta del 30/07); la prensa especializada contó entre <strong>1.100</strong> y <strong>1.178</strong> el 28/07. Petición central: herramientas para pautar la frontera del desarrollo <em>automatizado</em> de IA — ni una pausa, ni un plazo.<sup>[1][5]</sup></li>\n      <li><span class=\"chip hot\">POLÍTICA · Global</span> <strong>El empleador cofirma la petición del personal:</strong> OpenAI declara que el ritmo podría llegar a ser tan alto \"that the world will need to pace the rate of AI advancement\"; Anthropic remite a su propia investigación sobre autosuperación recursiva.<sup>[2][4]</sup></li>\n      <li><span class=\"chip hot\">REG · UE</span> <strong>Tres días para el 02/08:</strong> a partir de entonces rige \"el resto del Reglamento\" — con excepción del Artículo 6(1).<sup>[6]</sup> Una lectura jurídica sitúa ahí el inicio de la fiscalización de la Comisión contra los proveedores de modelos, con un tope de <strong>15 millones de euros</strong> o <strong>3%</strong>.<sup>[7]</sup></li>\n      <li><span class=\"chip\">REG · UE</span> <strong>Frente del DMA, nuevo desde el 26/07:</strong> un fallo del Tribunal General de la UE del <strong>08/07</strong> establece una \"regla de secuenciación\" — Google no puede pedir una revisión judicial previa de la orden sobre Android. Afectados: cerca del <strong>60%</strong> de los usuarios de Android en la UE.<sup>[8][9]</sup></li>\n      <li><span class=\"chip\">ESTUDIO · Global</span> <strong>Cinco cifras circulan esta semana</strong> — <strong>234 mil millones de dólares</strong>, <strong>13%</strong>, <strong>40%</strong>, <strong>R$ 1,76 mil millones</strong> y dos cifras de bancos brasileños. Tras revisar las fuentes, <em>dos</em> sobreviven. Lo que eso implica para leer cifras de IA: más abajo.</li>\n      <li><span class=\"chip good\">twiceD</span> Dos ideas, ambas de ingeniería y no de papel: una <strong>prueba de aceptación de agentes</strong> para agentes de IA comprados y una <strong>prueba de mudanza</strong> para la capacidad de cambiar de proveedor.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Vier Tage in Folge wuchs dieses Board, gestern auf <strong>87 Einträge</strong>. Der heutige Pull bringt <strong>42</strong>: 24 übernommen, 18 neu, 63 gefallen. Bevor man das als Marktereignis liest, lohnt der Blick auf die Zusammensetzung — und die ist praktisch unverändert: Freelance-Anteil 72,4 % → 71,4 %, Remote-Kennzeichen 87,4 % → 85,7 %, twiceD-Tag 62,1 % → 64,3 %. Java, Spring Boot, Angular, Kubernetes und AI-Integration schrumpfen alle um <strong>Faktor 0,44 bis 0,54</strong>, das Board selbst um Faktor 0,48. Ein echter Nachfrageeinbruch verschiebt die Mischung; dieser hier hat nur die Tiefe der Stichprobe halbiert. Daneben zwei Befunde mit Substanz: Das Bayerische Landesamt für Steuern schreibt <strong>Java plus web-basiertes Frontend für Identity- und Access-Management</strong> aus — der genaueste Stack-Treffer, den die TED-Spur je hatte, und ohne belegbare Frist vermutlich schon geschlossen. Und die frische Satzstudie von freelancermap nennt <strong>95 €/h Median</strong> für DACH-IT, während der einzige heute selbst genannte Freelance-Satz bei 85 €/h deckelt.</p>\n    <ul>\n      <li><span class=\"chip hot\">Board</span> <strong>42 Listings, minus 52 %</strong>: 30 Freelance, 8 Employee, 4 Intriguing. 24 Einträge von gestern übernommen, <strong>18 neu, 63 gefallen</strong> — der stärkste Tagesrückgang seit Beginn dieser Zählung, und er kippt das Board unter den bisherigen Tiefstand vom 26.07. (49).</li>\n      <li><span class=\"chip\">Board</span> <strong>Die Mischung überlebt, nur die Tiefe nicht</strong>: Java 41× → 22×, Spring Boot 32× → 14×, Angular 29× → 14×, AI-Integration 23× → 11×, Kubernetes 15× → 8×, twiceD-Tag 54× → 27×, Remote-Kennzeichen 76× → 36×. Jede dieser Reihen halbiert sich, keine verschiebt sich gegen die anderen. Median-Fit 67 → 62,5, Einträge ab Fit 80: 8 → 7.</li>\n      <li><span class=\"chip\">Board</span> <strong>Vier Quellen liefern heute null</strong>: freelancermap.com (gestern 4 Einträge), lever.co, builtin.com und cursor.com (je 1). freelancermap.de fällt von 57 auf 29, greenhouse.io von 10 auf 6, ashbyhq.com von 9 auf 5 — die Quellenbreite schrumpft von neun auf <strong>fünf</strong>.</li>\n      <li><span class=\"chip hot\">twiceD</span> <strong>Die Spitze steht, morgen läuft sie ab</strong>: Alle zehn höchstbewerteten Einträge sind Übernahmen. Vorn bleibt das Telematik-Mandat von Keil Business Solutions mit <strong>Fit 88</strong> — 23. Tag im Board, Projektstart laut Anzeige am Samstag, <strong>morgen ist der letzte Werktag davor</strong>. Der höchstbewertete der 18 Neuzugänge kommt auf 66.</li>\n      <li><span class=\"chip good\">TED</span> <strong>Der genaueste Stack-Treffer dieser Spur</strong>: Das Bayerische Landesamt für Steuern (Zentrale Vergabestelle, München) hat unter <strong>86435-2026</strong> IT-Dienstleistungen für Java-Softwareentwicklung und die Entwicklung web-basierter Frontends im Bereich Identity- und Access-Management bekannt gemacht. Mindestabnahmemenge <strong>640 Personentage</strong>, geschätzte Abnahmemenge <strong>2.560 PT</strong>, Mindestlaufzeit zwei Jahre mit zweimaliger Verlängerungsoption um je ein Jahr.<sup>[9]</sup></li>\n      <li><span class=\"chip hot\">TED</span> <strong>Und warum daraus kein Angebot wird</strong>: Die Bekanntmachung ist laut PDF-Metadaten vom <strong>27.06.2026</strong>. Angebotsfrist und geschätzter Auftragswert stehen in keiner zugänglichen Quelle — zwei Suchdurchgänge und der direkte PDF-Abruf liefern sie nicht. Die gesetzliche Mindest-Angebotsfrist im offenen Verfahren beträgt 30 Tage ab Absendung der Bekanntmachung, war also um den <strong>27.07.</strong> herum abgelaufen. Ohne belegte Frist gilt der Fund als vermutlich geschlossen; der einzige deterministische nächste Schritt ist die Vergabestelle selbst.</li>\n      <li><span class=\"chip\">TED</span> <strong>Heute nur Teilabdeckung</strong>: Die TED-Suchschnittstelle antwortet weiterhin nur auf POST-Anfragen, die heutige Runde war eine Discovery-Suche über Spiegel- und Vergabeportale, <em>keine</em> vollständige CPV-72-Abfrage. Von zwei weiteren Kandidaten fällt SPRIND (EUDI-Wallet-Support-Organisation, Frist 03.08.) mit zwei Werktagen Vorlauf unter die Fünf-Werktage-Regel; Stiftung Kinder forschen (KI-Lernbegleitungs-App, Frist 24.08.) hat Frist-Luft, aber unbelegte Größenordnung.<sup>[10][11]</sup></li>\n      <li><span class=\"chip hot\">Rate</span> <strong>Median 95 €/h — Board 85 €/h</strong>: Die Satzstudie von freelancermap (Artikel vom 02.07.2026) nennt für DACH-IT-Freelancer einen Median von <strong>95 €/h</strong> bei einem Durchschnitt von 97 €/h; Software- und Webentwicklung liegt bei <strong>90 €/h</strong>, SAP/ERP mit 120 €/h an der Spitze. 28 % der IT-Freelancer planen 2026 eine Erhöhung, rund jeder Zehnte eine Senkung.<sup>[1]</sup> Auf dem Board nennt heute <strong>genau ein</strong> Freelance-Eintrag einen Satz: ProTIP für DB Systel, maximal 680 €/Tag ≈ 85 €/h.</li>\n      <li><span class=\"chip\">Board</span> <strong>Fünf von 42 nennen eine Vergütung selbst</strong> (gestern 10 von 87), einer nennt gar keine, die übrigen 36 Bänder sind recherchierter Benchmark. Ein echtes Veröffentlichungsdatum tragen <strong>3 von 42</strong> Einträgen — die anderen 39 stehen auf „n/a\", weil die Quellseite keines ausweist.</li>\n      <li><span class=\"chip warn\">Korrektur</span> <strong>Die 109.000 unbesetzten IT-Stellen sind kein 2026er Wert</strong>: Dieser Brief hat die Zahl gestern über Sekundärquellen als aktuell geführt. Die jüngste belegbare Bitkom-Veröffentlichung dazu ist vom <strong>07.08.2025</strong> (rund 109.000, zwei Jahre vorher 149.000); eine 2026er Fortschreibung ließ sich nicht finden. Ab heute nur noch mit diesem Datum oder gar nicht.<sup>[8]</sup></li>\n    </ul></div>",

        "en": "<div class=\"tldr\"><p class=\"lead\">This board grew for four straight days, reaching 87 entries yesterday. Today's pull brings 42: 24 carried over, 18 new, 63 dropped. Before reading that as a market event, it's worth looking at the composition — which is practically unchanged: freelance share 72.4% → 71.4%, remote flag 87.4% → 85.7%, twiceD tag 62.1% → 64.3%. Java, Spring Boot, Angular, Kubernetes, and AI integration all shrink by a factor of 0.44 to 0.54, the board itself by a factor of 0.48. A genuine demand collapse shifts the mix; this one has only halved the depth of the sample. Alongside that, two findings with substance: Bavaria's State Tax Office is tendering <strong>Java plus a web-based frontend for identity and access management</strong> — the most precise stack match this TED lane has ever had, and, without a confirmed deadline, probably already closed. And freelancermap's fresh rate study puts the <strong>DACH-IT median at €95/h</strong>, while the only freelance rate stated on the board today caps out at €85/h.</p>\n    <ul>\n      <li><span class=\"chip hot\">Board</span> <strong>42 listings, down 52%</strong>: 30 freelance, 8 employee, 4 intriguing. 24 entries carried over from yesterday, <strong>18 new, 63 dropped</strong> — the steepest daily decline since this count began, and it pushes the board below the previous low of Jul 26 (49).</li>\n      <li><span class=\"chip\">Board</span> <strong>The mix survives, the depth doesn't</strong>: Java 41× → 22×, Spring Boot 32× → 14×, Angular 29× → 14×, AI integration 23× → 11×, Kubernetes 15× → 8×, twiceD tag 54× → 27×, remote flag 76× → 36×. Every one of these rows halves, none shifts against the others. Median fit 67 → 62.5, entries at fit 80+: 8 → 7.</li>\n      <li><span class=\"chip\">Board</span> <strong>Four sources deliver zero today</strong>: freelancermap.com (4 entries yesterday), lever.co, builtin.com, and cursor.com (1 each). freelancermap.de falls from 57 to 29, greenhouse.io from 10 to 6, ashbyhq.com from 9 to 5 — source breadth shrinks from nine to <strong>five</strong>.</li>\n      <li><span class=\"chip hot\">twiceD</span> <strong>The top holds, and it expires tomorrow</strong>: all ten highest-rated entries are carryovers. Keil Business Solutions' telematics mandate still leads with <strong>fit 88</strong> — day 23 on the board, project start per the listing on Saturday, <strong>tomorrow is the last business day before it</strong>. The top-rated of the 18 new entries reaches 66.</li>\n      <li><span class=\"chip good\">TED</span> <strong>This lane's most precise stack match</strong>: Bavaria's State Tax Office (Zentrale Vergabestelle, Munich) published a notice under <strong>86435-2026</strong> for IT services covering Java software development and the development of web-based frontends for identity and access management. Minimum call-off volume <strong>640 person-days</strong>, estimated call-off volume <strong>2,560 PD</strong>, minimum term two years with two one-year renewal options.<sup>[9]</sup></li>\n      <li><span class=\"chip hot\">TED</span> <strong>And why that doesn't turn into a bid</strong>: per the PDF metadata, the notice is dated <strong>Jun 27, 2026</strong>. The submission deadline and estimated contract value appear in no accessible source — two search passes and a direct PDF pull don't turn them up. The statutory minimum submission period for an open procedure is 30 days from when the notice was sent, so it would have expired around <strong>Jul 27</strong>. Without a confirmed deadline, this find counts as probably closed; the only deterministic next step is the procuring authority itself.</li>\n      <li><span class=\"chip\">TED</span> <strong>Only partial coverage today</strong>: the TED search interface still answers only POST requests, so today's round was a discovery search across mirror and procurement portals, <em>not</em> a full CPV-72 query. Of two further candidates, SPRIND (EUDI wallet support organization, deadline Aug 3) falls under the five-business-day rule with only two business days of lead time; Stiftung Kinder forschen (AI learning-companion app, deadline Aug 24) has deadline room but an unconfirmed scale.<sup>[10][11]</sup></li>\n      <li><span class=\"chip hot\">Rate</span> <strong>Median €95/h — board €85/h</strong>: freelancermap's rate study (article dated Jul 2, 2026) puts the median for DACH-IT freelancers at <strong>€95/h</strong>, with an average of €97/h; software and web development sits at <strong>€90/h</strong>, with SAP/ERP leading at €120/h. 28% of IT freelancers plan to raise their rate in 2026, roughly one in ten to lower it.<sup>[1]</sup> On the board today, <strong>exactly one</strong> freelance entry states a rate: ProTIP for DB Systel, max. €680/day ≈ €85/h.</li>\n      <li><span class=\"chip\">Board</span> <strong>Five of 42 state compensation themselves</strong> (10 of 87 yesterday), one states none at all, the remaining 36 bands are a researched benchmark. Only <strong>3 of 42</strong> entries carry a real posting date — the other 39 read „n/a\" because the source page doesn't list one.</li>\n      <li><span class=\"chip warn\">Correction</span> <strong>The 109,000 unfilled IT jobs aren't a 2026 figure</strong>: this brief carried that number as current yesterday via secondary sources. The most recent confirmable Bitkom publication on it is from <strong>Aug 7, 2025</strong> (roughly 109,000, versus 149,000 two years earlier); no 2026 update could be found. From today on, only with this date attached, or not at all.<sup>[8]</sup></li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Este board cresceu quatro dias seguidos, chegando a 87 registros ontem. A coleta de hoje traz 42: 24 mantidos, 18 novos, 63 caídos. Antes de ler isso como um evento de mercado, vale olhar para a composição — que está praticamente inalterada: fatia Freelance 72,4% → 71,4%, marcação Remote 87,4% → 85,7%, tag twiceD 62,1% → 64,3%. Java, Spring Boot, Angular, Kubernetes e AI-Integration encolhem todos por um fator de 0,44 a 0,54, o board em si por um fator de 0,48. Um recuo de demanda de verdade desloca a mistura; este aqui só cortou pela metade a profundidade da amostra. Ao lado disso, dois achados com substância: o Bayerisches Landesamt für Steuern está licitando <strong>Java mais um frontend web para gestão de identidade e acesso</strong> — o encaixe de stack mais preciso que esta trilha do TED já teve, e, sem prazo comprovado, provavelmente já encerrado. E o estudo recente de tarifas da freelancermap aponta <strong>mediana de 95 €/h para TI na DACH</strong>, enquanto a única tarifa freelance informada hoje no board para em 85 €/h.</p>\n    <ul>\n      <li><span class=\"chip hot\">Board</span> <strong>42 vagas, queda de 52%</strong>: 30 Freelance, 8 Employee, 4 Intriguing. 24 registros mantidos de ontem, <strong>18 novos, 63 caíram</strong> — a queda diária mais forte desde o início desta contagem, e ela derruba o board abaixo do piso anterior, de 26/07 (49).</li>\n      <li><span class=\"chip\">Board</span> <strong>A mistura sobrevive, a profundidade não</strong>: Java 41× → 22×, Spring Boot 32× → 14×, Angular 29× → 14×, AI-Integration 23× → 11×, Kubernetes 15× → 8×, tag twiceD 54× → 27×, marcação Remote 76× → 36×. Cada uma dessas séries cai pela metade, nenhuma se desloca em relação às outras. Fit mediano 67 → 62,5, registros a partir de fit 80: 8 → 7.</li>\n      <li><span class=\"chip\">Board</span> <strong>Quatro fontes entregam zero hoje</strong>: freelancermap.com (4 registros ontem), lever.co, builtin.com e cursor.com (1 cada). freelancermap.de cai de 57 para 29, greenhouse.io de 10 para 6, ashbyhq.com de 9 para 5 — a amplitude de fontes encolhe de nove para <strong>cinco</strong>.</li>\n      <li><span class=\"chip hot\">twiceD</span> <strong>O topo se mantém, e expira amanhã</strong>: todos os dez registros mais bem avaliados são mantidos de ontem. Segue na frente o mandato de telemática da Keil Business Solutions com <strong>fit 88</strong> — 23º dia no board, início de projeto conforme o anúncio no sábado, <strong>amanhã é o último dia útil antes disso</strong>. O melhor dos 18 novos registros chega a 66.</li>\n      <li><span class=\"chip good\">TED</span> <strong>O encaixe de stack mais preciso desta trilha</strong>: o Bayerisches Landesamt für Steuern (Zentrale Vergabestelle, Munique) publicou sob o número <strong>86435-2026</strong> uma convocação para serviços de TI cobrindo desenvolvimento de software Java e o desenvolvimento de frontends baseados em web na área de gestão de identidade e acesso. Volume mínimo <strong>640 dias-pessoa</strong>, volume estimado <strong>2.560 DP</strong>, prazo mínimo de dois anos com duas opções de prorrogação de um ano cada.<sup>[9]</sup></li>\n      <li><span class=\"chip hot\">TED</span> <strong>E por que isso não vira uma proposta</strong>: segundo os metadados do PDF, a convocação é datada de <strong>27/06/2026</strong>. O prazo de propostas e o valor estimado do contrato não constam em nenhuma fonte acessível — duas buscas e o acesso direto ao PDF não os revelam. O prazo mínimo legal de propostas em procedimento aberto é de 30 dias a partir do envio da convocação, portanto teria expirado por volta de <strong>27/07</strong>. Sem prazo comprovado, este achado conta como provavelmente encerrado; o único próximo passo determinístico é o próprio órgão licitante.</li>\n      <li><span class=\"chip\">TED</span> <strong>Hoje só cobertura parcial</strong>: a interface de busca do TED continua respondendo apenas a requisições POST, então a rodada de hoje foi uma busca exploratória em portais espelho e de licitações, <em>não</em> uma consulta CPV-72 completa. Dos dois outros candidatos, a SPRIND (organização de suporte à carteira EUDI, prazo 03/08) cai na regra dos cinco dias úteis com apenas dois dias úteis de antecedência; a Stiftung Kinder forschen (app de acompanhamento de aprendizagem com IA, prazo 24/08) tem folga de prazo, mas porte não comprovado.<sup>[10][11]</sup></li>\n      <li><span class=\"chip hot\">Taxa</span> <strong>Mediana 95 €/h — board 85 €/h</strong>: o estudo de tarifas da freelancermap (artigo de 02/07/2026) aponta, para freelancers de TI na DACH, uma mediana de <strong>95 €/h</strong> com média de 97 €/h; desenvolvimento de software e web fica em <strong>90 €/h</strong>, com SAP/ERP na liderança a 120 €/h. 28% dos freelancers de TI planejam aumentar a taxa em 2026, cerca de um em cada dez pretende reduzir.<sup>[1]</sup> No board hoje, <strong>exatamente um</strong> registro freelance informa uma tarifa: ProTIP para a DB Systel, no máximo 680 €/dia ≈ 85 €/h.</li>\n      <li><span class=\"chip\">Board</span> <strong>Cinco de 42 informam a própria remuneração</strong> (10 de 87 ontem), um não informa nenhuma, as outras 36 faixas são benchmark pesquisado. Apenas <strong>3 de 42</strong> registros trazem uma data de publicação real — os outros 39 marcam „n/a\" porque a página de origem não indica nenhuma.</li>\n      <li><span class=\"chip warn\">Correção</span> <strong>As 109 mil vagas de TI não preenchidas não são um número de 2026</strong>: este boletim tratou esse número como atual ontem, via fontes secundárias. A publicação da Bitkom mais recente e comprovável sobre isso é de <strong>07/08/2025</strong> (cerca de 109 mil, contra 149 mil dois anos antes); não foi encontrada uma atualização de 2026. A partir de hoje, só com essa data, ou nem assim.<sup>[8]</sup></li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Este board creció cuatro días seguidos y llegó a 87 registros ayer. El rastreo de hoy trae 42: 24 se mantienen, 18 nuevos, 63 cayeron. Antes de leer esto como un evento de mercado, vale la pena mirar la composición — que está prácticamente sin cambios: participación Freelance 72,4 % → 71,4 %, marca Remote 87,4 % → 85,7 %, etiqueta twiceD 62,1 % → 64,3 %. Java, Spring Boot, Angular, Kubernetes y AI-Integration se reducen todos por un factor de 0,44 a 0,54, el board mismo por un factor de 0,48. Un desplome de demanda real desplaza la mezcla; este solo redujo a la mitad la profundidad de la muestra. Junto a eso, dos hallazgos con sustancia: el Bayerisches Landesamt für Steuern licita <strong>Java más un frontend web para gestión de identidad y acceso</strong> — la coincidencia de stack más precisa que esta vía del TED ha tenido, y, sin plazo confirmado, probablemente ya cerrada. Y el estudio reciente de tarifas de freelancermap indica una <strong>mediana de 95 €/h para TI en la DACH</strong>, mientras la única tarifa freelance declarada hoy en el board topa en 85 €/h.</p>\n    <ul>\n      <li><span class=\"chip hot\">Board</span> <strong>42 vacantes, −52 %</strong>: 30 Freelance, 8 Employee, 4 Intriguing. 24 registros se mantienen de ayer, <strong>18 nuevos, 63 cayeron</strong> — la caída diaria más fuerte desde que empezó este conteo, y hunde el board por debajo del mínimo anterior, del 26/07 (49).</li>\n      <li><span class=\"chip\">Board</span> <strong>La mezcla sobrevive, la profundidad no</strong>: Java 41× → 22×, Spring Boot 32× → 14×, Angular 29× → 14×, AI-Integration 23× → 11×, Kubernetes 15× → 8×, etiqueta twiceD 54× → 27×, marca Remote 76× → 36×. Cada una de estas series se reduce a la mitad, ninguna se desplaza frente a las demás. Fit mediano 67 → 62,5, registros a partir de fit 80: 8 → 7.</li>\n      <li><span class=\"chip\">Board</span> <strong>Cuatro fuentes entregan cero hoy</strong>: freelancermap.com (4 registros ayer), lever.co, builtin.com y cursor.com (1 cada una). freelancermap.de cae de 57 a 29, greenhouse.io de 10 a 6, ashbyhq.com de 9 a 5 — la amplitud de fuentes se reduce de nueve a <strong>cinco</strong>.</li>\n      <li><span class=\"chip hot\">twiceD</span> <strong>La cima se mantiene, y vence mañana</strong>: los diez registros mejor calificados se mantienen todos de ayer. Sigue al frente el mandato de telemática de Keil Business Solutions con <strong>fit 88</strong> — día 23 en el board, inicio de proyecto según el anuncio el sábado, <strong>mañana es el último día hábil antes de eso</strong>. El mejor de los 18 registros nuevos llega a 66.</li>\n      <li><span class=\"chip good\">TED</span> <strong>La coincidencia de stack más precisa de esta vía</strong>: el Bayerisches Landesamt für Steuern (Zentrale Vergabestelle, Múnich) publicó bajo el número <strong>86435-2026</strong> una convocatoria de servicios de TI que cubre desarrollo de software Java y el desarrollo de frontends basados en web en el área de gestión de identidad y acceso. Volumen mínimo <strong>640 días-persona</strong>, volumen estimado <strong>2.560 DP</strong>, plazo mínimo de dos años con dos opciones de prórroga de un año cada una.<sup>[9]</sup></li>\n      <li><span class=\"chip hot\">TED</span> <strong>Y por qué eso no se convierte en una oferta</strong>: según los metadatos del PDF, la convocatoria está fechada el <strong>27/06/2026</strong>. El plazo de ofertas y el valor estimado del contrato no aparecen en ninguna fuente accesible — dos búsquedas y la descarga directa del PDF no los revelan. El plazo mínimo legal de ofertas en un procedimiento abierto es de 30 días desde el envío de la convocatoria, por lo que habría vencido alrededor del <strong>27/07</strong>. Sin plazo confirmado, este hallazgo se considera probablemente cerrado; el único siguiente paso determinístico es la propia entidad contratante.</li>\n      <li><span class=\"chip\">TED</span> <strong>Hoy solo cobertura parcial</strong>: la interfaz de búsqueda del TED sigue respondiendo solo a solicitudes POST, así que la ronda de hoy fue una búsqueda exploratoria en portales espejo y de contratación, <em>no</em> una consulta CPV-72 completa. De dos candidatos adicionales, SPRIND (organización de soporte a la cartera EUDI, plazo 03/08) cae bajo la regla de los cinco días hábiles con solo dos días hábiles de margen; Stiftung Kinder forschen (app de acompañamiento de aprendizaje con IA, plazo 24/08) tiene margen de plazo, pero magnitud no confirmada.<sup>[10][11]</sup></li>\n      <li><span class=\"chip hot\">Tarifa</span> <strong>Mediana 95 €/h — board 85 €/h</strong>: el estudio de tarifas de freelancermap (artículo del 02/07/2026) indica, para freelancers de TI en la DACH, una mediana de <strong>95 €/h</strong> con un promedio de 97 €/h; desarrollo de software y web se ubica en <strong>90 €/h</strong>, con SAP/ERP a la cabeza con 120 €/h. El 28 % de los freelancers de TI planea subir su tarifa en 2026, cerca de uno de cada diez piensa bajarla.<sup>[1]</sup> En el board de hoy, <strong>exactamente un</strong> registro freelance declara una tarifa: ProTIP para DB Systel, máximo 680 €/día ≈ 85 €/h.</li>\n      <li><span class=\"chip\">Board</span> <strong>Cinco de 42 declaran su propia remuneración</strong> (10 de 87 ayer), uno no declara ninguna, las otras 36 bandas son benchmark investigado. Solo <strong>3 de 42</strong> registros llevan una fecha de publicación real — los otros 39 marcan „n/a\" porque la página de origen no indica ninguna.</li>\n      <li><span class=\"chip warn\">Corrección</span> <strong>Las 109 mil vacantes de TI sin cubrir no son una cifra de 2026</strong>: este boletín trató ese número como vigente ayer, vía fuentes secundarias. La publicación de Bitkom más reciente y confirmable sobre esto es del <strong>07/08/2025</strong> (unas 109 mil, contra 149 mil dos años antes); no se encontró una actualización de 2026. Desde hoy, solo con esta fecha, o de ninguna forma.<sup>[8]</sup></li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Donnerstag, der 30. Juli, Schultag vier des zweiten Halbjahrs — und das Wetterfenster hat sich noch weiter geöffnet. Gestern standen vier trockene Tage im Modell, heute stehen dort <strong>sechs</strong>: von heute bis Dienstag sagen beide Portale 0 % Regen, mit Samstag und Sonntag bei <strong>28 °C</strong>. Das Wochenende ist damit nicht nur offen, es ist das beste seit Wochen. Zwei Dinge trüben den Tag: Im Kern-Ring findet sich zum wiederholten Mal kein datierter Termin — und beim Baby müssen wir eine gestrige Einschätzung <strong>zurücknehmen</strong>: zwei neuere Fiocruz-Bulletins stellen Paraná nicht in die Gruppe der abflachenden, sondern in die der <em>steigenden</em> Staaten. Dazu ein echter neuer Fund, eine Stunde von hier.</p>\n    <ul>\n      <li><span class=\"chip good\">WETTER</span> <strong>Sechs trockene Tage:</strong> Climatempo sieht von heute bis Di 04.08. durchgehend <strong>0 % Regen und 0,0 mm</strong> — theweather bestätigt 0 % für Fr bis Di. Aufwärtstrend: heute 24 °C, Samstag und Sonntag <strong>28 °C</strong>, Dienstag 29 °C.</li>\n      <li><span class=\"chip\">WETTER</span> <strong>Nur heute strittig:</strong> Climatempo 0 % / 0,0 mm, theweather <strong>30 %</strong> / 0,6 mm „light rain\". Beim Maximum sind sich beide einig (24 °C). Streitwert: ein paar Tropfen.</li>\n      <li><span class=\"chip good\">TRIP</span> <strong>Samstag ist der wolkenlose Tag</strong> — Climatempo: „Sol o dia todo sem nuvens no céu … Não chove.\" Der gehört nach draußen, nicht ins Auto.</li>\n      <li><span class=\"chip good\">EVENT</span> <strong>Neu und nah:</strong> Der Sesc hat eine eigene Unit in <strong>Santo Antônio da Platina</strong> (Day-Trip-Ring, rund 1 h) — Musicalização Infantil ab <strong>R$ 35/Monat</strong>, Canto Coral ab R$ 13. Wiederkehrend statt Einmal-Ausflug.</li>\n      <li><span class=\"chip hot\">BABY</span> <strong>Korrektur von gestern:</strong> InfoGripe SE 27/2026 (16.07.) schreibt „Os casos de SRAG por VSR continuam aumentando em toda a Região Sul (Paraná …)\" und listet Paraná unter den fünf Staaten mit <strong>Wachstums-Signal</strong>. SE 28 bestätigt die Richtung.</li>\n      <li><span class=\"chip\">GESUNDHEIT</span> <strong>Dengue unverändert niedrig:</strong> Informe nº 23 (21.07.2026, SE 01–28/2026) bleibt der neueste Stand — 19ª Regional Jacarezinho <strong>84</strong> Fälle, <strong>0</strong> Todesfälle. Kein nº 24 veröffentlicht.</li>\n      <li><span class=\"chip hot\">ACHTUNG</span> <strong>Die „–85 %\"-Meldung ist ein Jahr alt.</strong> Sie vergleicht Jan–Jul <em>2025</em> mit 2024, nicht 2026. Wer sie als aktuelle Entwarnung liest, liest die falsche Saison.</li>\n      <li><span class=\"chip\">SCHULE</span> <strong>Tag vier.</strong> Recesso 13.–24.07., Unterricht seit Mo 27.07. — und ein verbreiteter Online-Ferienkalender behauptet weiter, es sei bis zum 31.07. frei. Er irrt.</li>\n      <li><span class=\"chip\">EVENT</span> <strong>Kern-Ring wieder leer:</strong> Das Nachrichtenportal von Ribeirão Claro hat seit <strong>12. Mai</strong> nichts Neues veröffentlicht. Der nächste belastbare Termin vor der Haustür ist die Feira de Artesanato in Jacarezinho am Sa 08.08.</li>\n      <li><span class=\"chip\">DE-BR</span> <strong>Warum brasilianische Ferientermine wandern</strong> — und woran man den verlässlichen Kalender erkennt.</li>\n    </ul></div>",

        "en": "<div class=\"tldr\"><p class=\"lead\">Thursday, July 30, school day four of the second semester — and the weather window has opened even further. Yesterday the model showed four dry days; today it shows six: from today through Tuesday, both portals agree on 0% rain, with Saturday and Sunday at 28°C. That makes the weekend not just open, but the best one in weeks. Two things cloud the day: once again, no dated event turns up in the core ring — and on the baby front we have to walk back yesterday's assessment: two newer Fiocruz bulletins place Paraná not among the states where the wave is flattening, but among those where it's still rising. Plus a genuine new find, one hour from here.</p>\n    <ul>\n      <li><span class=\"chip good\">WEATHER</span> <strong>Six dry days:</strong> Climatempo shows 0% rain and 0.0 mm straight through from today to Tue 08/04 — theweather confirms 0% for Fri through Tue. Upward trend: today 24°C, Saturday and Sunday 28°C, Tuesday 29°C.</li>\n      <li><span class=\"chip\">WEATHER</span> <strong>Only today is disputed:</strong> Climatempo 0% / 0.0 mm, theweather 30% / 0.6 mm \"light rain.\" Both agree on the high (24°C). What's in dispute: a few drops.</li>\n      <li><span class=\"chip good\">TRIP</span> <strong>Saturday is the cloudless day</strong> — Climatempo: \"Sol o dia todo sem nuvens no céu … Não chove.\" That one belongs outdoors, not in the car.</li>\n      <li><span class=\"chip good\">EVENT</span> <strong>New and close:</strong> Sesc has its own unit in Santo Antônio da Platina (day-trip ring, about 1 hr) — Musicalização Infantil from R$ 35/month, Canto Coral from R$ 13. Recurring, not a one-off outing.</li>\n      <li><span class=\"chip hot\">BABY</span> <strong>Correction from yesterday:</strong> InfoGripe SE 27/2026 (07/16) states \"Os casos de SRAG por VSR continuam aumentando em toda a Região Sul (Paraná …)\" and lists Paraná among the five states with a growth signal. SE 28 confirms the direction.</li>\n      <li><span class=\"chip\">HEALTH</span> <strong>Dengue unchanged and low:</strong> Informe nº 23 (07/21/2026, SE 01–28/2026) remains the latest status — 19ª Regional Jacarezinho 84 cases, 0 deaths. No nº 24 published.</li>\n      <li><span class=\"chip hot\">HEADS UP</span> <strong>The \"–85%\" report is a year old.</strong> It compares Jan–Jul 2025 with 2024, not 2026. Reading it as current all-clear news means reading the wrong season.</li>\n      <li><span class=\"chip\">SCHOOL</span> <strong>Day four.</strong> Recesso ran 07/13–24, classes since Mon 07/27 — and a widely used online holiday calendar still claims the break runs through 07/31. It's wrong.</li>\n      <li><span class=\"chip\">EVENT</span> <strong>Core ring empty again:</strong> Ribeirão Claro's news portal hasn't published anything new since May 12. The next solid event nearby is the Feira de Artesanato in Jacarezinho on Sat 08/08.</li>\n      <li><span class=\"chip\">DE-BR</span> <strong>Why Brazilian school-holiday dates shift</strong> — and how to spot the calendar you can trust.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Quinta-feira, 30 de julho, quarto dia de aula do segundo semestre — e a janela do clima se abriu ainda mais. Ontem o modelo indicava quatro dias secos, hoje são seis: de hoje até terça-feira, os dois portais concordam em 0% de chuva, com sábado e domingo a 28 °C. O fim de semana não está só aberto, é o melhor em semanas. Duas coisas turvam o dia: no anel-núcleo, mais uma vez não aparece nenhum compromisso datado — e sobre o bebê precisamos voltar atrás numa avaliação de ontem: dois boletins mais recentes da Fiocruz colocam o Paraná não no grupo dos estados em queda, mas no dos estados em alta. Além disso, um achado novo de verdade, a uma hora daqui.</p>\n    <ul>\n      <li><span class=\"chip good\">CLIMA</span> <strong>Seis dias secos:</strong> o Climatempo indica de hoje até ter 04/08 0% de chuva e 0,0 mm sem interrupção — o theweather confirma 0% de sex a ter. Tendência de alta: hoje 24 °C, sábado e domingo 28 °C, terça 29 °C.</li>\n      <li><span class=\"chip\">CLIMA</span> <strong>Só hoje está em disputa:</strong> Climatempo 0% / 0,0 mm, theweather 30% / 0,6 mm \"light rain\". No máximo, os dois concordam (24 °C). Objeto da disputa: algumas gotas.</li>\n      <li><span class=\"chip good\">PASSEIO</span> <strong>Sábado é o dia sem nuvens</strong> — Climatempo: \"Sol o dia todo sem nuvens no céu … Não chove.\" Esse é para ficar ao ar livre, não dentro do carro.</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Novo e perto:</strong> o Sesc tem uma unidade própria em Santo Antônio da Platina (anel de passeios de um dia, cerca de 1h) — Musicalização Infantil a partir de R$ 35/mês, Canto Coral a partir de R$ 13. Recorrente, não um passeio único.</li>\n      <li><span class=\"chip hot\">BEBÊ</span> <strong>Correção de ontem:</strong> o InfoGripe da SE 27/2026 (16/07) diz \"Os casos de SRAG por VSR continuam aumentando em toda a Região Sul (Paraná …)\" e coloca o Paraná entre os cinco estados com sinal de crescimento. A SE 28 confirma a direção.</li>\n      <li><span class=\"chip\">SAÚDE</span> <strong>Dengue segue baixa:</strong> o Informe nº 23 (21/07/2026, SE 01–28/2026) continua sendo o dado mais recente — 19ª Regional Jacarezinho 84 casos, 0 óbitos. Nenhum nº 24 publicado.</li>\n      <li><span class=\"chip hot\">ATENÇÃO</span> <strong>A notícia de \"–85%\" tem um ano.</strong> Ela compara jan–jul de 2025 com 2024, não 2026. Quem a lê como uma boa notícia atual está lendo a temporada errada.</li>\n      <li><span class=\"chip\">ESCOLA</span> <strong>Quarto dia.</strong> Recesso de 13 a 24/07, aulas desde segunda-feira, 27/07 — e um calendário de férias online bastante acessado ainda afirma que o recesso vai até 31/07. Ele está errado.</li>\n      <li><span class=\"chip\">EVENTO</span> <strong>Anel-núcleo de novo vazio:</strong> o portal de notícias de Ribeirão Claro não publica nada novo desde 12 de maio. O próximo compromisso confiável perto de casa é a Feira de Artesanato em Jacarezinho, no sáb 08/08.</li>\n      <li><span class=\"chip\">DE-BR</span> <strong>Por que as datas de férias no Brasil mudam</strong> — e como reconhecer o calendário confiável.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Jueves 30 de julio, cuarto día de clases del segundo semestre — y la ventana del clima se abrió todavía más. Ayer el modelo mostraba cuatro días secos, hoy son seis: de hoy hasta el martes, los dos portales coinciden en 0% de lluvia, con sábado y domingo a 28 °C. El fin de semana no solo está abierto, es el mejor en semanas. Dos cosas empañan el día: en el anillo núcleo, otra vez no aparece ningún evento con fecha — y sobre el bebé tenemos que corregir una evaluación de ayer: dos boletines más recientes de Fiocruz ubican a Paraná no en el grupo de estados donde la ola se está aplanando, sino en el de los que siguen en aumento. Además, un hallazgo nuevo de verdad, a una hora de aquí.</p>\n    <ul>\n      <li><span class=\"chip good\">CLIMA</span> <strong>Seis días secos:</strong> Climatempo indica 0% de lluvia y 0,0 mm sin interrupción de hoy hasta el mar 04/08 — theweather confirma 0% de vie a mar. Tendencia al alza: hoy 24 °C, sábado y domingo 28 °C, martes 29 °C.</li>\n      <li><span class=\"chip\">CLIMA</span> <strong>Solo hoy está en disputa:</strong> Climatempo 0% / 0,0 mm, theweather 30% / 0,6 mm \"light rain\". En la máxima, ambos coinciden (24 °C). Lo que está en juego: unas gotas.</li>\n      <li><span class=\"chip good\">PASEO</span> <strong>El sábado es el día sin nubes</strong> — Climatempo: \"Sol o dia todo sem nuvens no céu … Não chove.\" Ese es para estar al aire libre, no dentro del carro.</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Nuevo y cerca:</strong> el Sesc tiene una unidad propia en Santo Antônio da Platina (anillo de excursiones de un día, cerca de 1 h) — Musicalização Infantil desde R$ 35/mes, Canto Coral desde R$ 13. Algo recurrente, no un paseo único.</li>\n      <li><span class=\"chip hot\">BEBÉ</span> <strong>Corrección de ayer:</strong> el InfoGripe de la SE 27/2026 (16/07) dice \"Os casos de SRAG por VSR continuam aumentando em toda a Região Sul (Paraná …)\" y coloca a Paraná entre los cinco estados con señal de crecimiento. La SE 28 confirma la dirección.</li>\n      <li><span class=\"chip\">SALUD</span> <strong>El dengue sigue bajo:</strong> el Informe nº 23 (21/07/2026, SE 01–28/2026) sigue siendo el dato más reciente — 19ª Regional Jacarezinho 84 casos, 0 muertes. No se publicó el nº 24.</li>\n      <li><span class=\"chip hot\">ATENCIÓN</span> <strong>La noticia del \"–85%\" tiene un año.</strong> Compara enero–julio de 2025 con 2024, no con 2026. Quien la lea como una buena noticia actual está leyendo la temporada equivocada.</li>\n      <li><span class=\"chip\">ESCUELA</span> <strong>Cuarto día.</strong> Receso del 13 al 24/07, clases desde el lunes 27/07 — y un calendario de vacaciones en línea muy consultado sigue afirmando que el receso llega hasta el 31/07. Está equivocado.</li>\n      <li><span class=\"chip\">EVENTO</span> <strong>El anillo núcleo, otra vez vacío:</strong> el portal de noticias de Ribeirão Claro no publica nada nuevo desde el 12 de mayo. El próximo evento confiable cerca de casa es la Feira de Artesanato en Jacarezinho, el sáb 08/08.</li>\n      <li><span class=\"chip\">DE-BR</span> <strong>Por qué las fechas de vacaciones escolares en Brasil cambian</strong> — y cómo reconocer el calendario confiable.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Donnerstag, der 30. Juli — Rotationsthema <em>Fußball &amp; Sport</em>, und der Anlass liegt buchstäblich vor der Tür: heute um 19:30 Uhr (Brasília-Zeit) empfängt Corinthians den Athletico-PR im Neo Química Arena, 21. Spieltag der Série A. Tabellenführer ist seit dieser Runde amtlich Palmeiras mit 47 Punkten — und im Pokalwettbewerb Copa Sul-Americana haben in derselben Nacht gleich zwei brasilianische Klubs, Vasco da Gama und Red Bull Bragantino, mit demselben Ergebnis (1:0) das Achtelfinale erreicht. Daraus ergibt sich das Wortfeld des Tages: wie man auf Portugiesisch und Spanisch übers Auf- und Weiterkommen im K.-o.-System spricht, und ein Fußball-Fallstrick zwischen den beiden Sprachen, der es in sich hat. <strong>10 Einträge, davon 2 Verben mit voller Konjugation</strong>, plus 3 Auffrischungen vom 16. und 23. Juli.</p>\n    <ul>\n      <li><span class=\"chip hot\">FALSE FRIEND</span> <strong>escalar (PT) ≠ escalar (ES)</strong> — Portugiesisch <em>escalar</em> heißt „die Mannschaft aufstellen/benennen\"; Spanisch <em>escalar</em> heißt „klettern\", auch „in der Tabelle aufsteigen\". Gleiche Schreibung, andere Sportart-Bedeutung. <span class=\"src\"><a href=\"https://dicionario.priberam.org/escalar\">priberam.org</a> · <a href=\"https://www.spanishdict.com/translate/escalar\">spanishdict.com</a></span></li>\n      <li><span class=\"chip\">BR-PT</span> <strong>a rodada ↔ a jornada</strong> — Brasilien sagt „rodada\" für einen Spieltag der Meisterschaft, Portugal „jornada\". Heute läuft die 21ª rodada. <span class=\"src\"><a href=\"https://ncnews.com.br/2026/07/28/corinthians-tenta-encostar-no-g5-diante-do-athletico-pr-veja-onde-assistir-horario-e-os-desfalques/\">ncnews.com.br</a></span></li>\n      <li><span class=\"chip\">KONJUGATION</span> <strong>classifiquei, nicht *classificei</strong> — vor „e\" wird aus dem c ein qu: <em>eu me classifiquei</em>. Dieselbe Regel gilt im Spanischen: <em>yo me clasifiqué</em>. <span class=\"src\"><a href=\"https://www.conjugacao.com.br/verbo-classificar/\">conjugacao.com.br</a> · <a href=\"https://conjugator.reverso.net/conjugation-spanish-verb-clasificar.html\">reverso.net</a></span></li>\n      <li><span class=\"chip good\">PHRASE</span> <strong>o mata-mata</strong> — brasilianisches Fußball-Slang fürs K.-o.-Format: „vencer ou ser eliminado\", gewinnen oder raus. <span class=\"src\"><a href=\"https://senhoresporte.com/mata-mata-no-futebol/\">senhoresporte.com</a></span></li>\n      <li>Tabellenführer nach 21 Spieltagen: <strong>Palmeiras mit 47 Punkten</strong>, acht vor Flamengo (39) und elf vor Athletico-PR (36, aus 20 Spielen). <span class=\"src\"><a href=\"https://www.lance.com.br/tabela/brasileirao\">lance.com.br</a></span></li>\n      <li>Zwei Klubs, ein Resultat: <strong>Vasco da Gama und Red Bull Bragantino</strong> gewannen ihre Rückspiele in der Copa Sul-Americana am Mittwoch beide hauchdünn 1:0 und ziehen ins Achtelfinale ein. <span class=\"src\"><a href=\"https://www.netvasco.com.br/n/389276/vasco-vence-o-independiente-medellin-e-vai-as-oitavas-da-sul-americana-1-a-0\">netvasco.com.br</a> · <a href=\"https://www.lance.com.br/temporeal/partida/copa-sul-americana-2026-29-07-2026-red-bull-bragantinoxsporting-cristal\">lance.com.br</a></span></li>\n      <li><span class=\"chip\">GENUS</span> <strong>as oitavas de final (f) ↔ los octavos de final (m)</strong> — beide Sprachen zählen wie das Deutsche in „Achteln\" (16 Teams, 8 Duelle), nur das Genus dreht sich.</li>\n    </ul></div>",

        "en": "<div class=\"tldr\"><p class=\"lead\">Thursday, July 30 — rotation theme <em>Soccer &amp; Sports</em>, and the hook is quite literally on the doorstep: today at 19:30 (Brasília time) Corinthians hosts Athletico-PR at the Neo Química Arena, matchday 21 of the Série A. Palmeiras are now officially the table leader as of this round with 47 points — and in the Copa Sul-Americana cup competition, two Brazilian clubs, Vasco da Gama and Red Bull Bragantino, both reached the round of 16 the same night with the same result (1-0). That gives us today's word field: how to talk about advancing and moving on in a knockout system in Portuguese and Spanish, plus a football trap between the two languages that really has teeth. <strong>10 entries, 2 of them verbs with full conjugation</strong>, plus 3 refreshers from July 16 and 23.</p>\n    <ul>\n      <li><span class=\"chip hot\">FALSE FRIEND</span> <strong>escalar (PT) ≠ escalar (ES)</strong> — Portuguese <em>escalar</em> means \"to name/set the lineup\"; Spanish <em>escalar</em> means \"to climb,\" including \"to climb the table.\" Same spelling, different sporting meaning. <span class=\"src\"><a href=\"https://dicionario.priberam.org/escalar\">priberam.org</a> · <a href=\"https://www.spanishdict.com/translate/escalar\">spanishdict.com</a></span></li>\n      <li><span class=\"chip\">BR-PT</span> <strong>a rodada ↔ a jornada</strong> — Brazil says \"rodada\" for a matchday of the championship, Portugal says \"jornada.\" Today is the 21ª rodada. <span class=\"src\"><a href=\"https://ncnews.com.br/2026/07/28/corinthians-tenta-encostar-no-g5-diante-do-athletico-pr-veja-onde-assistir-horario-e-os-desfalques/\">ncnews.com.br</a></span></li>\n      <li><span class=\"chip\">CONJUGATION</span> <strong>classifiquei, not *classificei</strong> — before \"e,\" the c becomes qu: <em>eu me classifiquei</em>. The same rule applies in Spanish: <em>yo me clasifiqué</em>. <span class=\"src\"><a href=\"https://www.conjugacao.com.br/verbo-classificar/\">conjugacao.com.br</a> · <a href=\"https://conjugator.reverso.net/conjugation-spanish-verb-clasificar.html\">reverso.net</a></span></li>\n      <li><span class=\"chip good\">PHRASE</span> <strong>o mata-mata</strong> — Brazilian football slang for the knockout format: \"vencer ou ser eliminado,\" win or go home. <span class=\"src\"><a href=\"https://senhoresporte.com/mata-mata-no-futebol/\">senhoresporte.com</a></span></li>\n      <li>Table leader after 21 matchdays: <strong>Palmeiras with 47 points</strong>, eight ahead of Flamengo (39) and eleven ahead of Athletico-PR (36, from 20 games). <span class=\"src\"><a href=\"https://www.lance.com.br/tabela/brasileirao\">lance.com.br</a></span></li>\n      <li>Two clubs, one result: <strong>Vasco da Gama and Red Bull Bragantino</strong> both won their Copa Sul-Americana second legs on Wednesday by a razor-thin 1-0 and advance to the round of 16. <span class=\"src\"><a href=\"https://www.netvasco.com.br/n/389276/vasco-vence-o-independiente-medellin-e-vai-as-oitavas-da-sul-americana-1-a-0\">netvasco.com.br</a> · <a href=\"https://www.lance.com.br/temporeal/partida/copa-sul-americana-2026-29-07-2026-red-bull-bragantinoxsporting-cristal\">lance.com.br</a></span></li>\n      <li><span class=\"chip\">GENDER</span> <strong>as oitavas de final (f) ↔ los octavos de final (m)</strong> — both languages count \"in eighths\" just like German (16 teams, 8 duels), only the gender flips.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Quinta-feira, 30 de julho — tema da rotação <em>Futebol &amp; Esporte</em>, e o gancho está literalmente batendo à porta: hoje, às 19h30 (horário de Brasília), o Corinthians recebe o Athletico-PR na Neo Química Arena, pela 21ª rodada da Série A. O Palmeiras é oficialmente o líder da tabela desde esta rodada, com 47 pontos — e na Copa Sul-Americana, dois clubes brasileiros, Vasco da Gama e Red Bull Bragantino, chegaram às oitavas de final na mesma noite com o mesmo resultado (1 a 0). Daí sai o campo lexical de hoje: como se fala, em português e espanhol, sobre avançar e se classificar num sistema eliminatório, e uma pegadinha futebolística entre as duas línguas que é daquelas de doer. <strong>10 itens, 2 deles verbos com conjugação completa</strong>, além de 3 revisões de 16 e 23 de julho.</p>\n    <ul>\n      <li><span class=\"chip hot\">FALSO COGNATO</span> <strong>escalar (PT) ≠ escalar (ES)</strong> — em português, <em>escalar</em> significa \"definir/escalar o time\"; em espanhol, <em>escalar</em> significa \"subir, trepar\", também \"subir na tabela\". Mesma grafia, significado esportivo diferente. <span class=\"src\"><a href=\"https://dicionario.priberam.org/escalar\">priberam.org</a> · <a href=\"https://www.spanishdict.com/translate/escalar\">spanishdict.com</a></span></li>\n      <li><span class=\"chip\">BR-PT</span> <strong>a rodada ↔ a jornada</strong> — o Brasil diz \"rodada\" para uma rodada do campeonato, Portugal diz \"jornada\". Hoje é a 21ª rodada. <span class=\"src\"><a href=\"https://ncnews.com.br/2026/07/28/corinthians-tenta-encostar-no-g5-diante-do-athletico-pr-veja-onde-assistir-horario-e-os-desfalques/\">ncnews.com.br</a></span></li>\n      <li><span class=\"chip\">CONJUGAÇÃO</span> <strong>classifiquei, e não *classificei</strong> — antes de \"e\", o c vira qu: <em>eu me classifiquei</em>. A mesma regra vale no espanhol: <em>yo me clasifiqué</em>. <span class=\"src\"><a href=\"https://www.conjugacao.com.br/verbo-classificar/\">conjugacao.com.br</a> · <a href=\"https://conjugator.reverso.net/conjugation-spanish-verb-clasificar.html\">reverso.net</a></span></li>\n      <li><span class=\"chip good\">FRASE</span> <strong>o mata-mata</strong> — gíria do futebol brasileiro para o formato eliminatório: \"vencer ou ser eliminado\", vencer ou cair fora. <span class=\"src\"><a href=\"https://senhoresporte.com/mata-mata-no-futebol/\">senhoresporte.com</a></span></li>\n      <li>Líder da tabela após 21 rodadas: <strong>Palmeiras com 47 pontos</strong>, oito à frente do Flamengo (39) e onze à frente do Athletico-PR (36, em 20 jogos). <span class=\"src\"><a href=\"https://www.lance.com.br/tabela/brasileirao\">lance.com.br</a></span></li>\n      <li>Dois clubes, um resultado: <strong>Vasco da Gama e Red Bull Bragantino</strong> venceram os jogos de volta da Copa Sul-Americana na quarta-feira, ambos por um apertadíssimo 1 a 0, e avançam às oitavas de final. <span class=\"src\"><a href=\"https://www.netvasco.com.br/n/389276/vasco-vence-o-independiente-medellin-e-vai-as-oitavas-da-sul-americana-1-a-0\">netvasco.com.br</a> · <a href=\"https://www.lance.com.br/temporeal/partida/copa-sul-americana-2026-29-07-2026-red-bull-bragantinoxsporting-cristal\">lance.com.br</a></span></li>\n      <li><span class=\"chip\">GÊNERO</span> <strong>as oitavas de final (f) ↔ los octavos de final (m)</strong> — as duas línguas contam \"em oitavos\", assim como o alemão (16 times, 8 confrontos), só o gênero se inverte.</li>\n    </ul></div>",
