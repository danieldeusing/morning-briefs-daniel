<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daniels Morning Briefs</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="lib/tokens.css">
<script>
  // Pre-paint animation policy (mirrors the terminal core / pagr): an explicit
  // "off" in localStorage — or no pick while the OS prefers reduced motion —
  // marks html.anim-off so components.css kills keyframes (incl. the brand
  // cursor blink) with no flash. The footer anim toggle persists "on"/"off".
  (function () {
    let pref = null;
    try { pref = localStorage.getItem('anim'); } catch (_) {}
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (pref === 'off' || (pref === null && reduced)) {
      document.documentElement.classList.add('anim-off');
    }
  })();
  // Resolution-independent zoom (mirrors pagr): lay out at a 1920px reference, then
  // scale the whole view up on wider screens — a true zoom of everything, never below
  // 1×. Pre-paint to avoid a flash.
  (function () {
    var applyZoom = function () {
      document.documentElement.style.zoom = String(Math.max(1, window.innerWidth / 1920));
    };
    applyZoom();
    window.addEventListener('resize', applyZoom);
  })();
</script>
<style>
  /* Dashboard chrome styles. Design tokens (colours, shadow, typography vars)
     come from lib/tokens.css — keep them there so the dashboard and the
     newsletter content stay in sync. */
  * { box-sizing: border-box; }
  /* Lock the outer document — only inner scroll containers (the .home view
     and the iframe) handle scrolling. Without this, a tiny mismatch between
     header.app + .app-shell heights and 100vh adds a few pixels of overflow
     to <html>, producing a second outer scrollbar alongside the one inside
     .home. overflow: hidden on both html and body kills that outer track. */
  html, body {
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    height: 100%;
    overflow: hidden;
  }
  html { position: relative; }

  /* Paper-grain noise overlay — same texture as the newsletter pages.
     Imperceptible up close, breaks LCD flatness at distance. Disabled under
     reduced-motion / high-contrast preferences. */
  html::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image: none;
    opacity: 0.04;
    mix-blend-mode: multiply;
  }
  @media (prefers-reduced-motion: reduce), (prefers-contrast: more) {
    html::before { display: none; }
  }
  body > *, header.app { position: relative; z-index: 1; }
  body {
    font-family: var(--font-body);
    line-height: 1.5;
    font-size: 15px;
    font-feature-settings: "kern", "liga", "onum";
    -webkit-font-smoothing: antialiased;
  }

  /* Terminal header bar — mirrors the pagr/seedr chrome: a single row on a
     --card surface with a --border bottom rule. LEFT: the brand wordmark
     (mono + .glow) and a blinking .cursor-block. RIGHT: the nav-rail minimize
     toggle. */
  header.app {
    border-bottom: 1px solid var(--border);
    background: var(--card);
    font-family: var(--font-mono); /* chrome is terminal mono; the content stays serif */
    /* Lift the header above the content, which is also a positioned body child
       at z-index 1 and would otherwise paint over it. */
    z-index: 50;
    padding: 0 1rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    min-height: 3rem;
  }
  /* LEFT zone — brand only. */
  .header-left {
    display: flex;
    align-items: center;
    flex: none;
    min-width: 0;
  }
  .header-brand {
    display: inline-flex;
    align-items: center;
    flex: none;
    text-decoration: none;
    cursor: pointer;
  }
  .header-brand .brand-word {
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: -0.01em;
  }

  /* RIGHT zone — the nav-rail minimize toggle, pushed to the far right
     (the header has no center zone). */
  .header-right {
    flex: none;
    margin-left: auto;
    display: flex;
    align-items: center;
  }

  /* Layout: two columns — flexible main + a fixed-width nav-rail on the right.
     The fixed footer is 2rem tall, so the shell is the viewport minus the
     header (3rem) and the footer (2rem). When the rail is collapsed the
     --rail-w track narrows to the icon-only strip. */
  .app-shell {
    display: grid;
    grid-template-columns: minmax(0, 1fr) var(--rail-w, 16rem);
    height: calc(100vh - 3rem - 2rem);
    height: calc(100dvh - 3rem - 2rem);
  }
  .app-shell.rail-collapsed { --rail-w: 3rem; }

  /* The nav lives in the sticky right sidebar (.nav-rail). It holds the
     Übersicht control (#home-btn) and #nav-groups (the grouped category nav,
     populated by JS). */
  .nav-label {
    font-family: var(--font-mono);
    font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--muted-foreground); padding: 0.5rem 0.85rem 0.2rem; font-weight: 600;
  }
  #nav-groups { padding-bottom: 0.2rem; }

  .cat {
    margin: 0;
    border-radius: 0;
    overflow: hidden;
    border: 0;
  }
  .cat-head {
    display: flex; align-items: center; gap: 0.55rem;
    padding: 0.45rem 0.85rem;
    cursor: pointer;
    border-radius: 0;
    transition: background 120ms;
    min-height: 2.1rem;
  }
  .cat-head:hover { background: var(--muted); }
  .cat-head:hover .cat-name { color: var(--primary); }
  .cat.active .cat-head { background: var(--muted); }
  .cat.active .cat-name { color: var(--primary); }
  .cat-color { width: 6px; height: 18px; border-radius: 0; flex: none; }
  .cat-name {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 0.8rem;
    color: var(--foreground);
    transition: color 0.15s ease;
    flex: 1;
    /* Single-line; ellipsise rather than wrap to two lines. */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .cat-icon { font-size: 1.05rem; }
  .cat-latest {
    font-family: var(--font-mono);
    font-size: 0.68rem; color: var(--soft);
    font-feature-settings: "tnum"; font-weight: 500;
  }
  .cat-toggle {
    background: transparent; border: none;
    color: var(--soft); cursor: pointer;
    transition: transform 150ms ease, background 120ms, color 120ms;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    padding: 0.55rem 0.7rem;
    border-radius: var(--radius-inline);
    line-height: 1;
    min-height: 2.25rem; min-width: 2.25rem;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .cat-toggle:hover { background: var(--rule-soft); color: var(--fg); }
  .cat.open > .cat-head .cat-toggle { transform: rotate(90deg); }

  .cat-dates { display: none; padding: 0.15rem 0.7rem 0.4rem 1.45rem; }

  .cat.open .cat-dates { display: block; }
  /* The category dropdown holds only the archive month-picker: days with a
     brief are clickable (ringed in the category accent), the selected day is
     filled, hovering one previews its title. Border + marks use the
     per-category --cat-accent scoped on the .cat row. */
  .cat-cal {
    margin: 0.2rem 0;
    padding: 0.5rem;
    border: 1px solid var(--cat-accent);
    border-radius: 6px;
    background: var(--rule-soft);
  }
  .cal-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 0.45rem;
  }
  .cal-title {
    font-family: var(--font-mono); font-size: 0.74rem;
    font-weight: 600; color: var(--fg);
  }
  .cal-nav {
    width: 1.7rem; height: 1.7rem; line-height: 1;
    background: transparent; border: 1px solid var(--rule); border-radius: 4px;
    color: var(--muted-ink); font-size: 0.95rem; cursor: pointer;
    transition: color 120ms, border-color 120ms;
  }
  .cal-nav:hover:not(:disabled) { color: var(--fg); border-color: var(--soft); }
  .cal-nav:focus-visible { outline: 2px solid var(--cat-accent, var(--fg)); outline-offset: 2px; }
  .cal-nav:disabled { opacity: 0.3; cursor: default; }
  .cal-week, .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
  }
  .cal-week { margin-bottom: 3px; }
  .cal-week span {
    text-align: center; font-family: var(--font-mono);
    font-size: 0.58rem; color: var(--muted-ink);
  }
  .cal-day {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 0.7rem;
    border-radius: 4px; color: var(--soft);
    font-feature-settings: "tnum";
  }
  .cal-day.none { color: var(--rule); }
  .cal-day.blank { visibility: hidden; }
  .cal-day.has {
    color: var(--fg); font-weight: 600; cursor: pointer; text-decoration: none;
    background: var(--panel);
    box-shadow: inset 0 0 0 1px var(--cat-accent);
    transition: background 100ms, color 100ms;
  }
  .cal-day.has:hover, .cal-day.has:focus-visible,
  .cal-day.has.current {
    background: var(--cat-accent); color: #fff; outline: none;
  }
  .cal-preview {
    margin-top: 0.5rem; padding-top: 0.45rem;
    border-top: 1px solid var(--rule);
    font-family: var(--font-body); font-size: 0.72rem;
    color: var(--muted-ink); line-height: 1.35; min-height: 1.7rem;
  }
  /* ────────────────────────────────────────────────────────────────────
     Fixed footer status bar — mirrors the pagr/seedr StatusBar: a 2rem bar
     pinned to the viewport bottom on a --card surface with a --border top
     rule. LEFT: `[briefs] reader@briefs:~/path` status line. RIGHT: the
     relocated controls (theme menu, language menu) + an anim toggle.
     ──────────────────────────────────────────────────────────────────── */
  footer.status-bar {
    position: fixed;
    inset-inline: 0;
    bottom: 0;
    z-index: 60;
    height: 2rem;
    border-top: 1px solid var(--border);
    background: var(--card);
    font-family: var(--font-mono); /* chrome is terminal mono */
    font-size: 11px;
  }
  .status-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    height: 100%;
    padding: 0 0.85rem;
  }
  .status-path {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted-foreground);
  }
  .status-path .status-tag { color: var(--primary); }
  .status-path .status-loc { color: var(--foreground); }
  .status-controls {
    display: flex;
    align-items: center;
    gap: 1.1rem;
    flex: none;
  }
  .status-sep { height: 0.9rem; width: 1px; background: var(--border); flex: none; }

  /* Footer control buttons — flat, muted, warm to --primary on hover. No
     boxes, no shadows; terminal-plain. */
  .status-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: inherit;
    line-height: 1;
    color: var(--muted-foreground);
    text-decoration: none;
    background: none;
    border: 0;
    border-radius: 0;
    padding: 0;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .status-btn:hover { color: var(--primary); }

  /* Theme + language dropdowns reuse the core .dropdown / .dropdown-panel /
     .dropdown-item primitives. The summary mirrors .status-btn. */
  .status-controls .dropdown > summary { font: inherit; }
  /* Settings icons (.dd-dot theme indicator, .dd-flag language flags) come from
     the shared @danieldeusing/design components.css — no local copy here. */

  /* Anim toggle — `[x] anim` / `[ ] anim`, mirroring pagr's footer toggle. */
  .anim-toggle { white-space: nowrap; }
  .anim-toggle[aria-pressed="true"] .anim-box { color: var(--primary); }

  /* Language picker — the trigger anchors the upward dropdown menu. The menu
     reuses the core .dropdown-panel (absolute, opens above, right-aligned),
     toggled open/closed via the [hidden] attribute by the existing JS. */
  .lang-picker { position: relative; }
  .lang-caret { font-size: 0.6rem; margin-left: 0.1rem; }
  .lang-menu[hidden] { display: none; }
  .lang-option[aria-selected="true"] {
    color: var(--primary);
    text-shadow: 0 0 8px var(--glow);
  }

  .cat-empty {
    font-family: var(--font-mono);
    font-size: 0.7rem; color: var(--soft);
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 0.5rem 0.6rem;
  }

  /* Main area — full width, fills the shell (viewport minus header + footer). */
  .main {
    overflow: hidden;
    background: var(--bg);
    position: relative;
    height: 100%;
  }
  .iframe-host { width: 100%; height: 100%; border: none; background: var(--bg); }

  /* ────────────────────────────────────────────────────────────────────
     Sticky right sidebar (.nav-rail) — terminal mono, --card surface with a
     --border left rule, full shell height with its own scroll. Holds the
     Übersicht control + the grouped category nav. Collapses to a 3rem icon-
     only strip; the width animates via the grid track on .app-shell.
     ──────────────────────────────────────────────────────────────────── */
  .nav-rail {
    grid-column: 2;
    font-family: var(--font-mono);
    background: var(--card);
    border-left: 1px solid var(--border);
    height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 2;
  }
  .nav-rail-head {
    display: flex;
    align-items: center;
    min-height: 2.1rem;
    padding: 0.4rem 0.85rem;
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .nav-rail-title {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 600;
    color: var(--muted-foreground);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-rail-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0.3rem 0 0.4rem;
  }

  /* Minimize toggle — the `»`/`«` chevron in the header right zone. Flat, muted,
     warm to --primary on hover (terminal-plain, no box). */
  .rail-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    flex: none;
    background: none;
    border: 0;
    border-radius: 0;
    color: var(--muted-foreground);
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 1rem;
    line-height: 1;
    transition: color 0.15s ease;
  }
  .rail-toggle:hover { color: var(--primary); }
  /* Expanded → `»` (collapse-to-right); collapsed → `«` (re-open). The button's
     aria-expanded drives the glyph; JS rewrites the text content too as a fallback. */
  .rail-toggle[aria-expanded="false"] .rail-toggle-glyph::before { content: "«"; }
  .rail-toggle[aria-expanded="true"]  .rail-toggle-glyph::before { content: "»"; }
  .rail-toggle-glyph { font-size: 0; }
  .rail-toggle-glyph::before { font-size: 1rem; }

  /* Collapsed strip — keep only the per-category accent bar + icon, hide labels,
     calendars and the home wordmark. The 3rem track clips the rest. */
  .app-shell.rail-collapsed .nav-rail-title,
  .app-shell.rail-collapsed .nav-label,
  .app-shell.rail-collapsed .cat-name,
  .app-shell.rail-collapsed .cat-latest,
  .app-shell.rail-collapsed .cat-toggle,
  .app-shell.rail-collapsed .cat-dates,
  .app-shell.rail-collapsed .home-btn .nav-label-text,
  .app-shell.rail-collapsed .home-btn .brand-mark {
    display: none;
  }
  .app-shell.rail-collapsed .nav-rail-head { justify-content: center; padding: 0.4rem 0; }
  .app-shell.rail-collapsed .cat-head,
  .app-shell.rail-collapsed .home-btn {
    justify-content: center;
    padding-left: 0;
    padding-right: 0;
    gap: 0;
  }
  .app-shell.rail-collapsed .cat-color,
  .app-shell.rail-collapsed .home-btn .cat-color { margin-right: 0.4rem; }

  /* The width transition reads off the grid track; animate it. */
  .app-shell { transition: grid-template-columns 0.18s ease; }
  @media (prefers-reduced-motion: reduce) {
    .app-shell { transition: none; }
  }

  /* Mobile re-open button (a floating ☰); shown only when the rail is an
     off-canvas drawer (≤720px). Hidden on desktop. */
  .rail-fab {
    display: none;
    position: fixed;
    right: 0.75rem;
    bottom: 2.6rem;
    z-index: 55;
    width: 2.6rem;
    height: 2.6rem;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--foreground);
    font-family: var(--font-mono);
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow: 0 0 18px var(--glow-soft);
  }

  /* Home view */
  .home {
    display: none;
    padding: 1.5rem 1.8rem;
    overflow-y: auto; height: 100%;
    /* Container for the responsive .tldr-grid below — column-count tracks
       the actual available width, not the viewport (which changes with
       sidebar collapsed/expanded state). */
    container-type: inline-size;
    container-name: home;
  }
  .home.show { display: block; }
  .home h2 {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 48;
    font-size: 1.55rem; font-weight: 600;
    margin: 0 0 0.5rem; letter-spacing: -0.005em;
  }
  .home .lead { color: var(--muted-ink); margin-bottom: 1.4rem; font-family: var(--font-body); }

  /* Freshness line — "Stand: DD.MM.YYYY" from the manifest's `generated`
     date. Mono-caps to read as a dateline, not body copy. When the manifest
     wasn't rebuilt today (a silently-failed nightly task), .stale flips it to
     the warn accent and appends a hint, so a missed run is visible at a glance
     instead of looking like fresh content. */
  .home-stand {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--soft);
    font-feature-settings: "tnum";
    margin: 0 0 1.2rem;
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .home-stand .stand-date { font-weight: 600; color: var(--muted-ink); }
  .home-stand.stale { color: var(--warn); }
  .home-stand.stale .stand-date { color: var(--warn); }
  .home-stand .stand-note { text-transform: none; letter-spacing: 0.02em; font-style: italic; }

  /* Newsprint column grid — the dashboard reads like one paper folded into
     seven adjacent columns. No card chrome: backgrounds, borders, shadows
     and radii are stripped. Adjacent columns are separated only by a
     hairline column rule, the same way the body-grid inside a newsletter
     uses column-rule between deep-dive sections. */
  /* Responsive column grid — caps at 3 wide so the columns stay readable
     on huge screens instead of shrinking to 5-6 narrow strips. The min
     width per column is the larger of 320 px (floor for readability) or
     1/3 of the container (so no more than 3 fit). Single declaration —
     no media or container queries needed.

     The column-rule + row-rule logic uses container queries against .home
     so the layout responds to actual available width (which changes with
     sidebar collapsed/expanded), not viewport. */
  .tldr-grid {
    display: grid;
    grid-template-columns:
      repeat(auto-fit, minmax(min(100%, max(320px, calc((100% - 2px) / 3))), 1fr));
    gap: 0;
    margin-top: 0.5rem;
  }
  .tldr-card {
    background: transparent;
    border: none;
    border-radius: 0;
    padding: var(--space-2) var(--space-4) var(--space-5);
    box-shadow: none;
    cursor: pointer;
    transition: background 150ms;
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    border-left: 1px solid var(--rule);
  }

  /* Grouped layout: a full-width header band (Wirtschaft / IT / Sport / …)
     precedes each group's cards. The header spans every grid column so the
     column flow restarts beneath it — each group reads as its own newsprint
     block, matching the sidebar's grouping. */
  .tldr-group-head {
    grid-column: 1 / -1;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    font-weight: 600;
    color: var(--soft);
    margin: var(--space-5) 0 0;
    padding: var(--space-3) 0 var(--space-2);
    border-top: 1px solid var(--rule);
  }
  /* The first group header sits right under the "Stand:" line — no big top gap
     or top rule, so the grid doesn't open with a stray divider. */
  .tldr-group-head:first-child { margin-top: 0; border-top: none; padding-top: 0; }

  /* The leading card of each group clears its left column rule so the group's
     first column starts clean (JS marks it; nth-child can't track per-group
     position once headers are interspersed). */
  .tldr-card.group-first { border-left: none; padding-left: 0; }

  /* Single-column band (narrow): no column rules at all; cards in the same
     group separate by a dashed row rule. The group header already divides
     groups, so only same-group siblings (a card directly after another card)
     get the dashed top. */
  @container home (max-width: 639px) {
    .tldr-card { border-left: none; padding-left: 0; }
    .tldr-card + .tldr-card {
      margin-top: var(--space-3);
      padding-top: var(--space-5);
      border-top: 1px dashed var(--rule);
    }
  }
  /* Subtle tinted-paper feedback on hover — no transform, no shadow swap,
     so adjacent columns never visually shift. */
  .tldr-card:hover {
    background: color-mix(in srgb, var(--cat-accent) 4%, transparent);
  }
  .tldr-card:focus-visible {
    outline: 2px solid var(--cat-accent, var(--fg));
    outline-offset: 4px;
  }
  .crumb:focus-visible {
    outline: 2px solid var(--fg);
    outline-offset: 2px;
    border-radius: var(--radius-inline);
  }

  /* Kicker line — same mono-caps treatment as the newsletter masthead-issue.
     Icon left, date right, category name in the middle. */
  .tldr-card-head {
    display: flex; align-items: center; gap: var(--space-2);
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.68rem;
    color: var(--muted-ink);
    border-bottom: none;
    padding-bottom: 0;
    margin-bottom: 0;
  }
  .tldr-card-head .tile-icon {
    font-size: 1rem;
    letter-spacing: normal;
    text-transform: none;
  }
  .tldr-card-head .tile-name {
    font-family: inherit;
    font-variation-settings: normal;
    font-weight: 600;
    font-size: inherit;
    color: var(--cat-accent-text, var(--fg));
    flex: 1;
  }
  .tldr-card-head .tile-date {
    font-family: inherit;
    font-size: inherit;
    color: var(--muted-ink);
    font-weight: 500;
    font-feature-settings: "tnum";
    letter-spacing: 0.1em;
  }

  /* Section title — the actual newsletter headline, rendered as a section
     dek in Fraunces with the same accent-bar treatment as .col h2 inside
     a newsletter. Acts as the "front-page headline" for that category. */
  .tldr-card-headline {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 36, "SOFT" 60;
    font-size: 1.18rem;
    font-weight: 600;
    font-style: normal;
    line-height: 1.18;
    color: var(--fg);
    margin: var(--space-2) 0 var(--space-3);
    letter-spacing: -0.005em;
  }
  .tldr-card-headline::before {
    content: "";
    display: block;
    width: 2rem;
    height: 2px;
    background: var(--cat-accent);
    margin-bottom: var(--space-2);
  }

  /* Strip the embedded TL;DR section's own chrome — it inherits the column
     instead. The lead keeps its drop-cap treatment but at a smaller scale
     suited to the narrower column width. */
  .tldr-card-body .tldr {
    background: transparent; border: none; padding: 0; margin: 0; border-radius: 0;

    font-family: var(--font-body);
    font-size: 0.92rem;
    line-height: 1.5;
    color: var(--fg);
    margin: 0 0 var(--space-3);
    max-width: none;

  .tldr-card-body .tldr > .lead::first-letter {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 144, "SOFT" 100;
    font-size: 2.7rem;
    float: left;
    line-height: 0.85;
    padding: 0.25rem 0.45rem 0 0;
    color: var(--cat-accent);
    font-weight: 700;
  }
  .tldr-card-body .tldr ul {
    padding-left: 1rem;
    margin: 0;
    column-count: 1;       /* override 2-col bullet layout in narrow card */
  }
  .tldr-card-body .tldr li { font-size: 0.86rem; margin: 0.4rem 0; line-height: 1.5; }
  .tldr-card-body strong { color: var(--fg); font-weight: 700; }
  .tldr-card-body em { color: var(--muted-ink); font-style: italic; }
  .tldr-card-body a { color: inherit; text-decoration: underline; }
  /* Chips inside TL;DR bullets — tinted by the card's accent. */
  .tldr-card-body .chip {
    display: inline-block;
    font-family: var(--font-mono);
    background: color-mix(in srgb, var(--cat-accent, var(--rule-soft)) 14%, transparent);
    color: var(--fg);
    font-size: 0.6rem; font-weight: 600; padding: 0.05rem 0.45rem;
    border-radius: var(--radius-inline); letter-spacing: 0.04em; margin-right: 0.2rem;
    text-transform: uppercase; vertical-align: middle;
  }
  .tldr-card-body .chip.hot  { background: rgba(182, 64, 47, 0.18); color: #b6402f; }
  .tldr-card-body .chip.good { background: rgba(63, 122, 79, 0.18); color: #3f7a4f; }

  .tldr-card-body a[href^="http"]::after { content: none; }
  /* "+N weitere" overflow marker — the home snapshot caps the TL;DR at a few
     bullets (the full set is one click away). Reads as a muted continuation
     cue, list-style stripped so it doesn't get its own bullet dot. */
  .tldr-card-body .tldr li.tldr-more {
    list-style: none;
    margin-left: -1rem;
    color: var(--soft);
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    font-style: normal;
  }

  /* DE-fallback chip — shown in a card's kicker when the active language has
     no translation for this date and the card is showing the DE original.
     Understated outline so it informs without competing with the accent. */
  .tldr-card-head .fallback-flag {
    font-family: var(--font-mono);
    font-size: 0.58rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--soft);
    border: 1px solid var(--rule);
    border-radius: var(--radius-inline);
    padding: 0.02rem 0.3rem;
    text-transform: uppercase;
    flex: none;
  }

  .tldr-read {
    background: transparent; border: none; color: var(--fg);
    font-family: var(--font-mono);
    font-weight: 600; cursor: pointer;
    font-size: 0.78rem; text-align: left;
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 0.7rem 0.2rem 0.4rem 0; margin-top: auto;
    min-height: 2.25rem;
    border-radius: var(--radius-inline);
  }

    outline: 2px solid var(--cat-accent);

  }
  .tldr-read:hover { text-decoration: underline; }
  .tldr-empty {
    font-family: var(--font-body);
    font-size: 0.88rem; color: var(--soft); font-style: italic; padding: 0.4rem 0;
  }

     so the category identity is preserved, but the body is muted, dashed,
     and self-evidently dormant. Not clickable. */
  .tldr-card--empty {
    cursor: default;
    background: color-mix(in srgb, var(--bg) 50%, var(--panel));
    box-shadow: none;
  }
  .tldr-card--empty:hover {
    transform: none;
    box-shadow: none;
  }
  .tldr-card--empty .tile-date {
    color: var(--rule);

  .tldr-empty-block {

    gap: 0.5rem;

    border-bottom: 1px dashed var(--rule);
    margin: 0.4rem 0 0;

  .tldr-empty-kicker {

    font-style: italic;

  /* Per-category accents — each card scopes its own --cat-accent and
     --cat-accent-text so descendant rules (kicker tile-name, accent bar above
     the headline, drop cap, chips, CTA) all pick up the right colour. */
  .tldr-card[data-cat="economy"]        { --cat-accent: var(--c-economy);        --cat-accent-text: var(--c-economy-text); }
  .tldr-card[data-cat="software"]       { --cat-accent: var(--c-software);       --cat-accent-text: var(--c-software-text); }

  /* Sidebar rows scope their own --cat-accent so the archive calendar's border,
     day rings and selected-day fill match the category colour. */
  .cat[data-cat="economy"]        { --cat-accent: var(--c-economy); }
  .cat[data-cat="software"]       { --cat-accent: var(--c-software); }
  .cat[data-cat="ai-dev"]         { --cat-accent: var(--c-ai-dev); }
  .cat[data-cat="ai-usecases"]    { --cat-accent: var(--c-ai-usecases); }

  }

  }

  /* ────────────────────────────────────────────────────────────────────
     Mobile / narrow responsiveness — the nav-rail becomes an off-canvas
     drawer (the .app-shell collapses to a single main column), toggled by
     the floating .rail-fab. The header keeps brand + history controls.
     ──────────────────────────────────────────────────────────────────── */
  @media (max-width: 720px) {

    .home h2 { font-size: 1.2rem; }
    .status-controls { gap: 0.9rem; }

    /* Single main column; the rail floats as an off-canvas drawer pinned
       under the header / above the footer, slid off to the right until opened. */
    .app-shell,
    .app-shell.rail-collapsed { grid-template-columns: 1fr; }
    .nav-rail {
      position: fixed;
      top: 3rem;
      right: 0;
      bottom: 2rem;
      width: min(80vw, 18rem);
      transform: translateX(100%);

      z-index: 56;

    .app-shell.rail-collapsed .nav-rail-title,
    .app-shell.rail-collapsed .nav-label,
    .app-shell.rail-collapsed .cat-name,
    .app-shell.rail-collapsed .cat-latest,
    .app-shell.rail-collapsed .cat-toggle,
    .app-shell.rail-collapsed .cat-dates,
    .app-shell.rail-collapsed .home-btn .nav-label-text,
    .app-shell.rail-collapsed .home-btn .brand-mark { display: revert; }
    .app-shell.rail-collapsed .nav-rail-head { justify-content: flex-start; padding: 0.4rem 0.85rem; }
    .app-shell.rail-collapsed .cat-head,

      justify-content: flex-start; padding-left: 0.85rem; padding-right: 0.85rem; gap: 0.55rem;

  }

    header.app { padding: 0 0.6rem; }

<!-- Terminal header bar (mirrors pagr): LEFT brand wordmark + cursor; RIGHT the
     nav-rail minimize toggle. The grouped category nav lives in the sticky right
     sidebar (.nav-rail). -->
<header class="app">

    <a class="header-brand" id="brand-home" href="#home" title="Übersicht">

            title="Navigation ein-/ausblenden">
      <span class="rail-toggle-glyph" aria-hidden="true">»</span>
    </button>
  </div>
</header>

<div class="app-shell">

  </main>

  <!-- Sticky right sidebar: the relocated Übersicht control (#home-btn) and the
       grouped category nav (#nav-groups, populated by JS from NAV_GROUPS). Can be
       minimized to an icon-only strip; collapsed state persists in localStorage. -->
  <aside class="nav-rail" id="nav-rail" aria-label="Navigation">
    <div class="nav-rail-head">
      <span class="nav-rail-title">~/briefs</span>
    </div>
    <div class="nav-rail-body">
      <div class="home-btn active" id="home-btn" role="button" tabindex="0" title="Übersicht">
        <span class="cat-color"></span>

             double-rule + serif M. Identical SVG to favicon.svg so the
             browser tab and the home control read as the same "house" mark. -->

      <div id="nav-groups"><!-- populated by JS from NAV_GROUPS: grouped category
           nav (Wirtschaft / IT / jobs / Sport / Freizeit / Sprachen), each group
           with its own .nav-label header (standalone groups render headerless). --></div>
    </div>
  </aside>
</div>

        aria-label="Navigation öffnen" title="Navigation">☰</button>

        <span>anim</span>
      </button>
    </nav>
  </div>
</footer>

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Vor drei Wochen ging die Debatte noch darum, <em>wann</em> die Fed senkt. Jetzt preisen die Terminmärkte eine <strong>38-prozentige Wahrscheinlichkeit</strong> ein, dass sie am Mittwoch <strong>erhöht</strong> — vor einer Woche waren es 12 %. Auslöser ist nicht die US-Konjunktur, sondern ein Ölpreis, der kurz über 100 $ sprang. Für Daniels Kurs wiegt das schwerer als der Zoll: Es greift den Zinsvorsprung des Real von der US-Seite an, während der Copom ihn von der brasilianischen abbaut. Gehandelt wird heute nichts — alle Kurse hier sind Freitags-Stände.</p>\n    <ul>\n      <li><span class=\"chip hot\">USA</span> <strong>Von 12 auf 38 Prozent.</strong> Die CME-FedWatch sah am 24.07. eine <strong>38-%-Chance</strong> auf eine Erhöhung schon <em>am Mittwoch</em> — nach unter 12 % eine Woche zuvor. Konsens bleibt: halten bei <strong>3,50–3,75 %</strong>.</li>\n      <li><span class=\"chip hot\">Global</span> <strong>Öl ist der einzige Grund.</strong> Brent stand Donnerstag über <strong>100 $</strong>, fiel Freitag auf <strong>98,38 $</strong> (−2,29 %) — bleibt <strong>+30,3 %</strong> im Monat, <strong>+43,8 %</strong> im Jahr.</li>\n      <li><span class=\"chip\">FX</span> <strong>Anker vom Freitag:</strong> EUR/BRL <strong>5,7826</strong>, USD/BRL <strong>5,0827</strong>, DXY <strong>101,47</strong>. Sonntag heißt: kein Fix, kein Spot. Nächster ECB-Fix <strong>Mo ~11:15 BRT</strong>.</li>\n      <li><span class=\"chip good\">FX</span> <strong>Kreuzkurs-Check sauber:</strong> Fix 5,7826 gegen implizierte <strong>5,7826</strong> — <strong>0,00 % Divergenz</strong> (Schwelle 0,5 %), mit unabhängig gezogenem EUR/USD <strong>1,1377</strong>.</li>\n      <li><span class=\"chip hot\">Carry</span> <strong>Der Zinsvorsprung schrumpft von zwei Seiten.</strong> Heute <strong>10,6 Punkte</strong> (Selic 14,25 % gegen Fed-Mitte 3,625 %). Erhöht die Fed <em>und</em> senkt der Copom: <strong>gut 10,1</strong>.</li>\n pan class=\"chip\">Zoll</span> <strong>37,5 % sind der Normalfall.</strong> <strong>3.985</strong> Produkte (<strong>10,8 Mrd. $</strong>) zahlen 25 % seit Mi 22.07. plus 12,5 % seit Fr 24.07.; betroffen sind <strong>48,7 %</strong> der BR-Ausfuhren in die USA.</li>\n      <li><span class=\"chip\">Wahl</span> <strong>Politischer Bumerang.</strong> Brasília plant WTO-Klage und Reziprozitäts-Gesetz, Lula legt eine Kreditlinie auf — drei Monate vor der Wahl liest sich das wie Wahlkampfhilfe für den Amtsinhaber.</li>\n      <li><span class=\"chip\">BR</span> <strong>Billigeres Öl tut Brasilien weh:</strong> Ibovespa <strong>174.041,95</strong> (−1,52 %), gebremst von Petrobras. Was der Fed hilft, kostet São Paulo Punkte.</li>\n      <li><span class=\"chip\">Hinweis</span> Die Wahrscheinlichkeiten unten sind <strong>meine Konfidenz</strong>, nicht markt-implizit. Die Spot-Anker sind live gezogen und datiert.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Three weeks ago, the debate was still about <em>when</em> the Fed would cut. Now the futures markets are pricing in a <strong>38% probability</strong> that it <strong>hikes</strong> on Wednesday instead — a week ago that number was 12%. The trigger isn't the US economy, it's an oil price that briefly jumped above $100. For Daniel's exchange rate, that matters more than the tariff: it attacks the real's rate spread from the US side, while the Copom is eroding it from the Brazilian side. Nothing trades today — all rates here are Friday levels.</p>\n    <ul>\n      <li><span class=\"chip hot\">US</span> <strong>From 12 to 38 percent.</strong> CME FedWatch showed a <strong>38% chance</strong> of a hike as soon as <em>Wednesday</em> on Jul 24 — up from under 12% a week earlier. Consensus remains: hold at <strong>3.50–3.75%</strong>.</li>\n      <li><span class=\"chip hot\">Global</span> <strong>Oil is the only reason.</strong> Brent stood above <strong>$100</strong> on Thursday, fell to <strong>$98.38</strong> on Friday (−2.29%) — still <strong>+30.3%</strong> for the month, <strong>+43.8%</strong> for the year.</li>\n      <li><span class=\"chip\">FX</span> <strong>Friday's anchor:</strong> EUR/BRL <strong>5.7826</strong>, USD/BRL <strong>5.0827</strong>, DXY <strong>101.47</strong>. Sunday means: no fix, no spot. Next ECB fix <strong>Mon ~11:15 BRT</strong>.</li>\n      <li><span class=\"chip good\">FX</span> <strong>Cross-rate check clean:</strong> fix 5.7826 against an implied <strong>5.7826</strong> — <strong>0.00% divergence</strong> (threshold 0.5%), with an independently pulled EUR/USD <strong>1.1377</strong>.</li>\n      <li><span class=\"chip hot\">Carry</span> <strong>The rate spread is shrinking from two sides.</strong> Today <strong>10.6 points</strong> (Selic 14.25% against a Fed midpoint of 3.625%). If the Fed hikes <em>and</em> the Copom cuts: <strong>a good 10.1</strong>.</li>\n      <li><span class=\"chip\">Tariff</span> <strong>37.5% is now the standard case.</strong> <strong>3,985</strong> products (<strong>$10.8 billion</strong>) pay 25% since Wed Jul 22 plus 12.5% since Fri Jul 24; some form of surcharge hits <strong>48.7%</strong> of Brazilian exports to the US.</li>\n      <li><span class=\"chip\">Election</span> <strong>Political boomerang.</strong> Brasília is planning a WTO complaint and a reciprocity law, Lula is rolling out a credit line — three months before the election, this reads like campaign help for the incumbent.</li>\n      <li><span class=\"chip\">BR</span> <strong>Cheaper oil hurts Brazil:</strong> Ibovespa <strong>174,041.95</strong> (−1.52%), dragged down by Petrobras. What helps the Fed costs São Paulo points.</li>\n      <li><span class=\"chip\">Heads up</span> The probabilities below are <strong>my confidence levels</strong>, not market-implied. The spot anchors are pulled live and dated.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Três semanas atrás, o debate ainda era sobre <em>quando</em> o Fed cortaria os juros. Agora, os mercados futuros precificam uma <strong>probabilidade de 38%</strong> de que ele <strong>suba</strong> os juros na quarta-feira — uma semana atrás, esse número era 12%. O gatilho não é a economia americana, e sim um preço do petróleo que chegou a ultrapassar os 100 dólares. Para o câmbio de Daniel, isso pesa mais do que a tarifa: ataca o diferencial de juros do real pelo lado americano, enquanto o Copom o corrói pelo lado brasileiro. Hoje não há negociação — todas as cotações aqui são de sexta-feira.</p>\n    <ul>\n      <li><span class=\"chip hot\">EUA</span> <strong>De 12 para 38%.</strong> O CME FedWatch mostrava em 24/07 uma <strong>chance de 38%</strong> de uma alta já <em>na quarta-feira</em> — ante menos de 12% uma semana antes. O consenso segue: manter em <strong>3,50–3,75%</strong>.</li>\n      <li><span class=\"chip hot\">Global</span> <strong>O petróleo é o único motivo.</strong> O Brent ficou acima de <strong>US$ 100</strong> na quinta-feira, caiu para <strong>US$ 98,38</strong> na sexta (−2,29%) — ainda assim <strong>+30,3%</strong> no mês, <strong>+43,8%</strong> no ano.</li>\n      <li><span class=\"chip\">Câmbio</span> <strong>Âncora de sexta-feira:</strong> EUR/BRL <strong>5,7826</strong>, USD/BRL <strong>5,0827</strong>, DXY <strong>101,47</strong>. Domingo significa: nenhum fixing, nenhum spot. Próximo fixing do BCE <strong>seg. ~11:15 BRT</strong>.</li>\n      <li><span class=\"chip good\">Câmbio</span> <strong>Checagem de câmbio cruzado limpa:</strong> fixing de 5,7826 contra 5,7826 implícito — <strong>0,00% de divergência</strong> (limiar de 0,5%), com EUR/USD <strong>1,1377</strong> coletado de forma independente.</li>\n      <li><span class=\"chip hot\">Carry</span> <strong>O diferencial de juros encolhe por dois lados.</strong> Hoje, <strong>10,6 pontos</strong> (Selic 14,25% contra o ponto médio do Fed de 3,625%). Se o Fed subir <em>e</em> o Copom cortar: <strong>uns 10,1</strong>.</li>\n      <li><span class=\"chip\">Tarifa</span> <strong>37,5% já é o caso padrão.</strong> <strong>3.985</strong> produtos (<strong>US$ 10,8 bilhões</strong>) pagam 25% desde qua. 22/07 mais 12,5% desde sex. 24/07; algum tipo de sobretaxa atinge <strong>48,7%</strong> das exportações brasileiras para os EUA.</li>\n      <li><span class=\"chip\">Eleição</span> <strong>Bumerangue político.</strong> Brasília planeja uma queixa na OMC e a Lei da Reciprocidade, Lula lança uma linha de crédito — a três meses da eleição, isso soa como ajuda de campanha para o titular.</li>\n      <li><span class=\"chip\">BR</span> <strong>Petróleo mais barato dói para o Brasil:</strong> Ibovespa em <strong>174.041,95</strong> (−1,52%), puxado para baixo pela Petrobras. O que ajuda o Fed custa pontos a São Paulo.</li>\n      <li><span class=\"chip\">Nota</span> As probabilidades abaixo são <strong>minha confiança pessoal</strong>, não implícitas de mercado. As âncoras à vista são coletadas ao vivo e datadas.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Hace tres semanas, el debate todavía era sobre <em>cuándo</em> la Fed recortaría las tasas. Ahora los mercados de futuros descuentan una <strong>probabilidad del 38%</strong> de que las <strong>suba</strong> el miércoles — frente al 12% de hace una semana. El detonante no es la economía estadounidense, sino un precio del petróleo que llegó a superar brevemente los 100 dólares. Para el tipo de cambio de Daniel, eso pesa más que el arancel: golpea el diferencial de tasas del real desde el lado estadounidense, mientras el Copom lo erosiona desde el lado brasileño. Hoy no hay operaciones — todas las cotizaciones aquí son niveles del viernes.</p>\n    <ul>\n      <li><span class=\"chip hot\">EUA</span> <strong>De 12 a 38 por ciento.</strong> El CME FedWatch mostraba el 24/07 una <strong>probabilidad del 38%</strong> de una subida ya <em>el miércoles</em> — frente a menos del 12% una semana antes. El consenso sigue siendo: mantener en <strong>3,50–3,75%</strong>.</li>\n      <li><span class=\"chip hot\">Global</span> <strong>El petróleo es la única razón.</strong> El Brent estuvo por encima de <strong>100 dólares</strong> el jueves, cayó a <strong>98,38 dólares</strong> el viernes (−2,29%) — sigue con <strong>+30,3%</strong> en el mes, <strong>+43,8%</strong> en el año.</li>\n      <li><span class=\"chip\">FX</span> <strong>Ancla del viernes:</strong> EUR/BRL <strong>5,7826</strong>, USD/BRL <strong>5,0827</strong>, DXY <strong>101,47</strong>. Domingo significa: sin fixing, sin spot. Próximo fixing del BCE <strong>lun. ~11:15 hora de Brasilia</strong>.</li>\n      <li><span class=\"chip good\">FX</span> <strong>Verificación de tipo cruzado limpia:</strong> fixing de 5,7826 frente a un implícito de <strong>5,7826</strong> — <strong>0,00% de divergencia</strong> (umbral de 0,5%), con un EUR/USD <strong>1,1377</strong> obtenido de forma independiente.</li>\n      <li><span class=\"chip hot\">Carry</span> <strong>El diferencial de tasas se reduce por dos lados.</strong> Hoy, <strong>10,6 puntos</strong> (Selic 14,25% frente al punto medio de la Fed de 3,625%). Si la Fed sube <em>y</em> el Copom recorta: <strong>unos 10,1</strong>.</li>\n      <li><span class=\"chip\">Arancel</span> <strong>37,5% ya es el caso estándar.</strong> <strong>3.985</strong> productos (<strong>10,8 mil millones de dólares</strong>) pagan 25% desde el mié. 22/07 más 12,5% desde el vie. 24/07; algún tipo de recargo golpea al <strong>48,7%</strong> de las exportaciones brasileñas a EE. UU.</li>\n      <li><span class=\"chip\">Elección</span> <strong>Bumerán político.</strong> Brasília planea una queja ante la OMC y la Ley de Reciprocidad, Lula lanza una línea de crédito — a tres meses de la elección, esto suena a ayuda de campaña para el mandatario en funciones.</li>\n      <li><span class=\"chip\">BR</span> <strong>El petróleo más barato le duele a Brasil:</strong> Ibovespa en <strong>174.041,95</strong> (−1,52%), lastrado por Petrobras. Lo que ayuda a la Fed le cuesta puntos a São Paulo.</li>\n      <li><span class=\"chip\">Nota</span> Las probabilidades de abajo son <strong>mi propia confianza</strong>, no implícitas del mercado. Las anclas spot son en vivo y con fecha.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Sonntag, dünner Nachrichtentag — aber die Woche hinter uns ergibt zusammengezählt eine unbequeme Zahl. Sechshundertzweiundzwanzig Lücken an einem einzigen Microsoft-Patchtag, zweihundertvier Zero-Day-Beispiele aus einem einzigen anonymen Repo, und jetzt zwei 9,8er-Lücken in Bing, gefunden von einem autonomen Security-System. Die Fundmaschine ist schneller geworden. Die Fixmaschine nicht: Der fünfzehn Jahre alte Kernel-Bug GhostLock ist seit April upstream behoben — Ubuntu 22.04 und 20.04 stehen im Ubuntu-eigenen Tracker bis heute auf „Vulnerable\". Dazwischen ein GitLab-Loch, das als schlichter Bugfix ausgeliefert wurde und deshalb durch jeden CVE-getriebenen Patch-Prozess fällt. Morgen früh gibt es Node.js-Security-Releases über alle drei Linien.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>Bing Images</strong>: ein präpariertes SVG an die Bildersuche führte Befehle als <code>NT AUTHORITY\\SYSTEM</code> auf Microsofts Bildverarbeitungs-Flotte aus, auf den Linux-Maschinen als root. CVE-2026-32194 und CVE-2026-32191, beide CVSS 9,8 — serverseitig gefixt, technischer Bericht seit 23.07. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>GitLab</strong>: Exploit-Code seit 24.07 öffentlich für eine Lücke, die GitLab sechs Wochen vorher als reinen <em>Bugfix</em> ausgeliefert hat — kein CVE, kein Score. Wer nach CVE-Listen patcht, hat sie nicht bekommen. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Release</span> <strong>Node.js</strong>: Security-Releases für 26.x, 24.x und 22.x am Montag, 27.07. Höchste Stufe der behobenen Lücken: HIGH. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>GhostLock, Stand heute</strong>: Ubuntu 26.04 und 24.04 sind gepatcht (6.8.0-136.136), 22.04 LTS, 20.04 LTS und älter stehen laut Ubuntu-Tracker (Stand 21.07.) weiter auf „Vulnerable, work in progress\". <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Exploitarium</strong>: Ende Juni kippte ein anonymer Account 204 Zero-Day-PoCs für Linux-Kernel, FFmpeg, PHP, Gitea, VLC &amp; Co. in ein GitHub-Repo — angeblich per automatisiertem Fuzzing erzeugt. Repo entfernt, Forks nicht. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>SharePoint</strong>: Die KEV-Frist für CVE-2026-50522 ist gestern abgelaufen. Drei getrennte On-Prem-Lücken in acht Tagen — und beim Machine-Key-Diebstahl reicht Patchen allein nicht. <span class=\"chip\">USA</span></li>\n      <li><span class=\"chip hot\">Regulierung</span> <strong>NIS-2</strong>: Freitag, 31.07., endet die BSI-Nachfrist. Von rund 29.500 betroffenen Unternehmen waren Ende Mai erst rund 18.500 registriert; allein die versäumte Registrierung kann mit bis zu 500.000 € geahndet werden. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Kurz</strong>: Windows VMSwitch CVE-2026-57092 (CVSS 9,9) aus dem Rekord-Patchtag, BSI-Warnung zu XWiki CVE-2026-23734, zweiter 7-Zip-Heap-Overflow im NTFS-Handler. <span class=\"chip\">DE</span> <span class=\"chip\">Global</span></li>\n    </ul></div>",

        "de": "<div class=\"tldr\"><p class=\"lead\">Sonntag, dünner Nachrichtentag — aber die Woche hinter uns ergibt zusammengezählt eine unbequeme Zahl. Sechshundertzweiundzwanzig Lücken an einem einzigen Microsoft-Patchtag, zweihundertvier Zero-Day-Beispiele aus einem einzigen anonymen Repo, und jetzt zwei 9,8er-Lücken in Bing, gefunden von einem autonomen Security-System. Die Fundmaschine ist schneller geworden. Die Fixmaschine nicht: Der fünfzehn Jahre alte Kernel-Bug GhostLock ist seit April upstream behoben — Ubuntu 22.04 und 20.04 stehen im Ubuntu-eigenen Tracker bis heute auf „Vulnerable\". Dazwischen ein GitLab-Loch, das als schlichter Bugfix ausgeliefert wurde und deshalb durch jeden CVE-getriebenen Patch-Prozess fällt. Morgen früh gibt es Node.js-Security-Releases über alle drei Linien.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>Bing Images</strong>: ein präpariertes SVG an die Bildersuche führte Befehle als <code>NT AUTHORITY\\SYSTEM</code> auf Microsofts Bildverarbeitungs-Flotte aus, auf den Linux-Maschinen als root. CVE-2026-32194 und CVE-2026-32191, beide CVSS 9,8 — serverseitig gefixt, technischer Bericht seit 23.07. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>GitLab</strong>: Exploit-Code seit 24.07 öffentlich für eine Lücke, die GitLab sechs Wochen vorher als reinen <em>Bugfix</em> ausgeliefert hat — kein CVE, kein Score. Wer nach CVE-Listen patcht, hat sie nicht bekommen. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Release</span> <strong>Node.js</strong>: Security-Releases für 26.x, 24.x und 22.x am Montag, 27.07. Höchste Stufe der behobenen Lücken: HIGH. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>GhostLock, Stand heute</strong>: Ubuntu 26.04 und 24.04 sind gepatcht (6.8.0-136.136), 22.04 LTS, 20.04 LTS und älter stehen laut Ubuntu-Tracker (Stand 21.07.) weiter auf „Vulnerable, work in progress\". <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Exploitarium</strong>: Ende Juni kippte ein anonymer Account 204 Zero-Day-PoCs für Linux-Kernel, FFmpeg, PHP, Gitea, VLC &amp; Co. in ein GitHub-Repo — angeblich per automatisiertem Fuzzing erzeugt. Repo entfernt, Forks nicht. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>SharePoint</strong>: Die KEV-Frist für CVE-2026-50522 ist gestern abgelaufen. Drei getrennte On-Prem-Lücken in acht Tagen — und beim Machine-Key-Diebstahl reicht Patchen allein nicht. <span class=\"chip\">USA</span></li>\n      <li><span class=\"chip hot\">Regulierung</span> <strong>NIS-2</strong>: Freitag, 31.07., endet die BSI-Nachfrist. Von rund 29.500 betroffenen Unternehmen waren Ende Mai erst rund 18.500 registriert; allein die versäumte Registrierung kann mit bis zu 500.000 € geahndet werden. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Kurz</strong>: Windows VMSwitch CVE-2026-57092 (CVSS 9,9) aus dem Rekord-Patchtag, BSI-Warnung zu XWiki CVE-2026-23734, zweiter 7-Zip-Heap-Overflow im NTFS-Handler. <span class=\"chip\">DE</span> <span class=\"chip\">Global</span></li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Sunday, a slow news day — but the week behind us adds up to an uncomfortable number. Six hundred twenty-two flaws on a single Microsoft Patch Tuesday, two hundred four zero-day examples from a single anonymous repo, and now two 9.8-rated flaws in Bing, found by an autonomous security system. The discovery machine has gotten faster. The fix machine hasn't: the fifteen-year-old kernel bug GhostLock has been fixed upstream since April — Ubuntu 22.04 and 20.04 still sit at \"Vulnerable\" in Ubuntu's own tracker to this day. In between, a GitLab hole that was shipped as a plain bugfix and therefore slips through any CVE-driven patch process. Tomorrow morning brings Node.js security releases across all three lines.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>Bing Images</strong>: a crafted SVG sent to image search executed commands as <code>NT AUTHORITY\\SYSTEM</code> on Microsoft's image-processing fleet, as root on the Linux machines. CVE-2026-32194 and CVE-2026-32191, both CVSS 9.8 — fixed server-side, technical writeup since Jul 23. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>GitLab</strong>: exploit code public since Jul 24 for a flaw GitLab shipped six weeks earlier as a plain <em>bugfix</em> — no CVE, no score. Anyone patching off CVE lists never got it. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Release</span> <strong>Node.js</strong>: security releases for 26.x, 24.x, and 22.x on Monday, Jul 27. Highest severity among the fixed flaws: HIGH. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>GhostLock, as of today</strong>: Ubuntu 26.04 and 24.04 are patched (6.8.0-136.136), 22.04 LTS, 20.04 LTS and older still sit at \"Vulnerable, work in progress\" per Ubuntu's tracker (as of Jul 21). <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Exploitarium</strong>: in late June, an anonymous account dumped 204 zero-day PoCs for the Linux kernel, FFmpeg, PHP, Gitea, VLC & co. into a GitHub repo — allegedly generated via automated fuzzing. Repo removed, forks not. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>SharePoint</strong>: the KEV deadline for CVE-2026-50522 passed yesterday. Three separate on-prem flaws in eight days — and with machine-key theft, patching alone isn't enough. <span class=\"chip\">US</span></li>\n      <li><span class=\"chip hot\">Regulation</span> <strong>NIS2</strong>: the BSI grace period ends Friday, Jul 31. Of roughly 29,500 affected companies, only about 18,500 had registered by the end of May; missing registration alone can be fined up to €500,000. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Briefly</strong>: Windows VMSwitch CVE-2026-57092 (CVSS 9.9) from the record Patch Tuesday, a BSI warning on XWiki CVE-2026-23734, a second 7-Zip heap overflow in the NTFS handler. <span class=\"chip\">DE</span> <span class=\"chip\">Global</span></li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Domingo, dia de notícias fracas — mas a semana que passou soma um número incômodo. Seiscentas e vinte e duas falhas em um único Patch Tuesday da Microsoft, duzentos e quatro exemplos de zero-day de um único repositório anônimo, e agora duas falhas de 9,8 no Bing, encontradas por um sistema de segurança autônomo. A máquina de achar ficou mais rápida. A de corrigir, não: o bug de kernel GhostLock, com quinze anos de idade, está corrigido no upstream desde abril — Ubuntu 22.04 e 20.04 continuam marcados como \"Vulnerable\" no rastreador da própria Ubuntu até hoje. No meio do caminho, um buraco no GitLab que foi lançado como simples correção de bug e por isso escapa de qualquer processo de patch orientado por CVE. Amanhã de manhã saem releases de segurança do Node.js nas três linhas.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>Bing Images</strong>: um SVG malicioso enviado à busca de imagens executou comandos como <code>NT AUTHORITY\\SYSTEM</code> na frota de processamento de imagens da Microsoft, e como root nas máquinas Linux. CVE-2026-32194 e CVE-2026-32191, ambas CVSS 9,8 — corrigidas no lado do servidor, relatório técnico desde 23/07. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>GitLab</strong>: código de exploração público desde 24/07 para uma falha que o GitLab havia corrigido seis semanas antes como puro <em>bugfix</em> — sem CVE, sem score. Quem faz patch a partir de listas de CVE não recebeu esse aviso. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Release</span> <strong>Node.js</strong>: releases de segurança para as linhas 26.x, 24.x e 22.x na segunda-feira, 27/07. Maior gravidade entre as falhas corrigidas: HIGH. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>GhostLock, hoje</strong>: Ubuntu 26.04 e 24.04 estão corrigidos (6.8.0-136.136); 22.04 LTS, 20.04 LTS e versões mais antigas continuam em \"Vulnerable, work in progress\" segundo o rastreador da Ubuntu (posição de 21/07). <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Exploitarium</strong>: no fim de junho, uma conta anônima despejou 204 PoCs de zero-day para o kernel Linux, FFmpeg, PHP, Gitea, VLC e afins em um repositório do GitHub — supostamente gerados por fuzzing automatizado. O repositório foi removido, os forks não. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>SharePoint</strong>: o prazo do KEV para CVE-2026-50522 venceu ontem. Três falhas on-prem distintas em oito dias — e, no roubo de machine keys, só aplicar o patch não basta. <span class=\"chip\">EUA</span></li>\n      <li><span class=\"chip hot\">Regulação</span> <strong>NIS-2</strong>: a sexta-feira, 31/07, marca o fim do prazo de tolerância do BSI. Das cerca de 29.500 empresas afetadas, apenas cerca de 18.500 estavam registradas até o fim de maio; só a falta de registro pode ser multada em até 500.000 €. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Resumo</strong>: Windows VMSwitch CVE-2026-57092 (CVSS 9,9) do Patch Tuesday recorde, alerta do BSI sobre o XWiki CVE-2026-23734, segundo heap overflow do 7-Zip no handler de NTFS. <span class=\"chip\">DE</span> <span class=\"chip\">Global</span></li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Domingo, día de pocas noticias — pero la semana que dejamos atrás suma un número incómodo. Seiscientas veintidós brechas en un solo Patch Tuesday de Microsoft, doscientos cuatro ejemplos de día cero de un solo repositorio anónimo, y ahora dos fallas de 9,8 en Bing, encontradas por un sistema de seguridad autónomo. La máquina de encontrar se volvió más rápida. La de corregir, no: el bug de kernel GhostLock, de quince años de antigüedad, está corregido en upstream desde abril — Ubuntu 22.04 y 20.04 siguen marcados como \"Vulnerable\" en el rastreador propio de Ubuntu hasta hoy. En medio, un hueco de GitLab que se entregó como simple corrección de errores y por eso se escapa de cualquier proceso de parcheo guiado por CVE. Mañana por la mañana llegan lanzamientos de seguridad de Node.js en las tres líneas.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>Bing Images</strong>: un SVG manipulado enviado a la búsqueda de imágenes ejecutó comandos como <code>NT AUTHORITY\\SYSTEM</code> en la flota de procesamiento de imágenes de Microsoft, y como root en las máquinas Linux. CVE-2026-32194 y CVE-2026-32191, ambas con CVSS 9,8 — corregidas del lado del servidor, informe técnico disponible desde el 23/07. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>GitLab</strong>: código de explotación público desde el 24/07 para una falla que GitLab había corregido seis semanas antes como simple <em>bugfix</em> — sin CVE, sin puntaje. Quien parchea a partir de listas de CVE nunca lo recibió. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Release</span> <strong>Node.js</strong>: lanzamientos de seguridad para las líneas 26.x, 24.x y 22.x el lunes 27/07. Severidad máxima entre las fallas corregidas: HIGH. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>GhostLock, a hoy</strong>: Ubuntu 26.04 y 24.04 están parchados (6.8.0-136.136); 22.04 LTS, 20.04 LTS y versiones más antiguas siguen en \"Vulnerable, work in progress\" según el rastreador de Ubuntu (a fecha del 21/07). <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Exploitarium</strong>: a fines de junio, una cuenta anónima volcó 204 PoCs de día cero para el kernel de Linux, FFmpeg, PHP, Gitea, VLC y otros en un repositorio de GitHub — supuestamente generados mediante fuzzing automatizado. El repositorio fue eliminado, los forks no. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>SharePoint</strong>: el plazo del KEV para CVE-2026-50522 venció ayer. Tres fallas on-prem distintas en ocho días — y con el robo de machine keys, parchar solo no basta. <span class=\"chip\">EE. UU.</span></li>\n      <li><span class=\"chip hot\">Regulación</span> <strong>NIS-2</strong>: el viernes 31/07 termina el plazo de gracia del BSI. De aproximadamente 29.500 empresas afectadas, solo unas 18.500 estaban registradas a fines de mayo; el simple hecho de no registrarse puede sancionarse con hasta 500.000 €. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>En breve</strong>: Windows VMSwitch CVE-2026-57092 (CVSS 9,9) del Patch Tuesday récord, advertencia del BSI sobre XWiki CVE-2026-23734, segundo desbordamiento de heap de 7-Zip en el manejador de NTFS. <span class=\"chip\">DE</span> <span class=\"chip\">Global</span></li>\n    </ul></div>"
      }

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Heute gehört der Tag einem offenen Modell — und einer Lücke. Googles <strong>Gemma 4</strong> steht mit seiner 31B-Variante jetzt auf <strong>Rang 3 unter den offenen Modellen</strong> in der Text Arena, und der Technical Report (eingereicht am 02.07.) liefert endlich Zahlen: LiveCodeBench v6 bei <span class=\"stat\">80,0</span>, Codeforces-Elo <span class=\"stat\">2150</span>, agentische Werkzeug-Nutzung auf τ²-Bench Retail bei <span class=\"stat\">86,4</span>. Was fehlt, ist ausgerechnet das Board, auf das man bei einem Coding-Modell zuerst schaut: Gemma 4 taucht auf <strong>SWE-Bench Verified nirgends auf</strong> — und die Prozentzahlen, die dafür kursieren, halten keiner Prüfung stand. Dazu drei Termine, die deinen Alltag direkter treffen als jeder Benchmark.</p>\n    <ul>\n      <li><span class=\"chip good\">OSS</span> <strong>Gemma 4, vier Größen</strong>: E2B, E4B, 26B-MoE und 31B dicht, <strong>Apache 2.0</strong>, bis <span class=\"stat\">256K</span> Kontext (Edge-Modelle 128K), auf Hugging Face, Kaggle und Ollama, mit Day-one-Unterstützung in vLLM, llama.cpp und LiteRT-LM.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Text Arena</strong>: das 31B steht auf <strong>Rang 3 unter den offenen Modellen</strong> (Rang 27 insgesamt), das 26B-MoE auf Rang 6. Erste unabhängige Einordnung überhaupt — die Familie ist seit dem 02.04. draußen.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Hersteller-Zahlen</strong> aus dem Technical Report: LiveCodeBench v6 <span class=\"stat\">80,0</span>, Codeforces-Elo <span class=\"stat\">2150</span>, τ²-Bench Retail <span class=\"stat\">86,4</span>, Airline <span class=\"stat\">75,0</span>, AIME 2026 <span class=\"stat\">89,2</span>, MMLU Pro <span class=\"stat\">85,2</span> — selbst gemessen.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>Kein SWE-Bench-Verified-Eintrag.</strong> Drei unabhängige Prüfungen führen Gemma 4 schlicht nicht. Die kursierenden „61,4 %\" und „41,6 %\" ließen sich auf keinen Lauf zurückführen. <strong>Nicht verwenden.</strong></li>\n      <li><span class=\"chip\">Claude</span> <strong>Claude Code 2.1.219</strong> (24.07.): Claude Opus 5 ist der neue Standard-Opus — 1M Kontext, Fast Mode zu <span class=\"stat\">10 $</span>/<span class=\"stat\">50 $</span> je Mio. Tokens.</li>\n      <li><span class=\"chip hot\">Claude</span> <strong>Dein Default fragt wieder nach</strong>: seit 2.1.200 (03.07.) ist der „default\"-Berechtigungsmodus <strong>„Manual\"</strong> — in CLI, VS Code und JetBrains. Wer den Agenten still durchlaufen ließ, merkt das an mehr Rückfragen.</li>\n      <li><span class=\"chip\">Tool</span> <strong>SpaceX übernimmt Cursor</strong>: <span class=\"stat\">60 Mrd. $</span> in Aktien, angekündigt am 16.06., Abschluss im dritten Quartal. Größte Konsolidierung, die der Coding-Werkzeugmarkt je gesehen hat.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>Kimi K3 morgen</strong>: 2,8 Bio. Parameter als MoE, 1M Kontext, Rang 1 in der Frontend Code Arena mit <span class=\"stat\">1679</span> Elo. Gewichte für den 27.07. angekündigt, modifizierte MIT-Lizenz.</li>\n      <li><span class=\"chip hot\">MCP</span> <strong>Übermorgen bricht die Spec</strong>: Revision 2026-07-28 macht das Protokoll staatenlos, alte und neue Seite sprechen nicht mehr miteinander. Betrifft ein Feld von über 10.000 öffentlichen Servern.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Rundruf</strong>: Cursor seit 22.07. still, Cline v4.0.11 mit Opus-5- und K3-Unterstützung, Aider-Board unverändert auf 20.11.2025.</li>\n    </ul></div>",

        "en": "<div class=\"tldr\"><p class=\"lead\">Today belongs to an open model — and to a gap. Google's <strong>Gemma 4</strong> now sits with its 31B variant at <strong>rank 3 among open models</strong> in the Text Arena, and the technical report (submitted July 2) finally delivers numbers: LiveCodeBench v6 at <span class=\"stat\">80.0</span>, Codeforces Elo <span class=\"stat\">2150</span>, agentic tool use on τ²-Bench Retail at <span class=\"stat\">86.4</span>. What's missing is exactly the board you'd check first for a coding model: Gemma 4 is <strong>nowhere to be found on SWE-Bench Verified</strong> — and the percentages circulating for it don't hold up under scrutiny. Plus three dates that will hit your daily workflow more directly than any benchmark.</p>\n    <ul>\n      <li><span class=\"chip good\">OSS</span> <strong>Gemma 4, four sizes</strong>: E2B, E4B, 26B MoE, and 31B dense, <strong>Apache 2.0</strong>, up to <span class=\"stat\">256K</span> context (edge models 128K), on Hugging Face, Kaggle, and Ollama, with day-one support in vLLM, llama.cpp, and LiteRT-LM.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Text Arena</strong>: the 31B sits at <strong>rank 3 among open models</strong> (rank 27 overall), the 26B MoE at rank 6. The first independent read on the family ever — it's been out since April 2.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Vendor figures</strong> from the technical report: LiveCodeBench v6 <span class=\"stat\">80.0</span>, Codeforces Elo <span class=\"stat\">2150</span>, τ²-Bench Retail <span class=\"stat\">86.4</span>, Airline <span class=\"stat\">75.0</span>, AIME 2026 <span class=\"stat\">89.2</span>, MMLU Pro <span class=\"stat\">85.2</span> — self-measured.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>No SWE-Bench Verified entry.</strong> Three independent checks simply don't list Gemma 4. The circulating \"61.4%\" and \"41.6%\" trace back to no actual run. <strong>Don't use them.</strong></li>\n      <li><span class=\"chip\">Claude</span> <strong>Claude Code 2.1.219</strong> (Jul 24): Claude Opus 5 is the new default Opus — 1M context, Fast Mode at <span class=\"stat\">$10</span>/<span class=\"stat\">$50</span> per million tokens.</li>\n      <li><span class=\"chip hot\">Claude</span> <strong>Your default is asking again</strong>: since 2.1.200 (Jul 3), the \"default\" permission mode is <strong>\"Manual\"</strong> — in the CLI, VS Code, and JetBrains. If you let the agent run quietly, you'll notice more prompts.</li>\n      <li><span class=\"chip\">Tool</span> <strong>SpaceX acquires Cursor</strong>: <span class=\"stat\">$60 billion</span> in stock, announced June 16, closing expected in Q3. The biggest consolidation the coding-tool market has ever seen.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>Kimi K3 tomorrow</strong>: 2.8 trillion parameters as an MoE, 1M context, rank 1 in the Frontend Code Arena at <span class=\"stat\">1679</span> Elo. Weights announced for July 27, modified MIT license.</li>\n      <li><span class=\"chip hot\">MCP</span> <strong>The spec breaks the day after tomorrow</strong>: revision 2026-07-28 makes the protocol stateless, and old and new sides stop talking to each other. Affects a field of over 10,000 public servers.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Roundup</strong>: Cursor quiet since Jul 22, Cline v4.0.11 with Opus 5 and K3 support, Aider's board still stuck on Nov 20, 2025.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Hoje o dia é de um modelo aberto — e de uma lacuna. O <strong>Gemma 4</strong> do Google, na sua variante de 31B, está agora na <strong>posição 3 entre os modelos abertos</strong> na Text Arena, e o technical report (enviado em 02/07) finalmente traz números: LiveCodeBench v6 em <span class=\"stat\">80,0</span>, Codeforces Elo <span class=\"stat\">2150</span>, uso agêntico de ferramentas no τ²-Bench Retail em <span class=\"stat\">86,4</span>. O que falta é justamente o ranking que se olha primeiro para um modelo de código: o Gemma 4 <strong>não aparece em lugar nenhum no SWE-Bench Verified</strong> — e os percentuais que circulam por aí não resistem a uma checagem. Além disso, três datas que atingem seu dia a dia mais diretamente do que qualquer benchmark.</p>\n    <ul>\n      <li><span class=\"chip good\">OSS</span> <strong>Gemma 4, quatro tamanhos</strong>: E2B, E4B, 26B MoE e 31B dense, <strong>Apache 2.0</strong>, até <span class=\"stat\">256K</span> de contexto (modelos de borda com 128K), no Hugging Face, Kaggle e Ollama, com suporte desde o primeiro dia em vLLM, llama.cpp e LiteRT-LM.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Text Arena</strong>: o 31B está na <strong>posição 3 entre os modelos abertos</strong> (posição 27 no geral), o 26B MoE na posição 6. A primeira avaliação independente da família até agora — ela está no ar desde 02/04.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Números do fabricante</strong> do technical report: LiveCodeBench v6 <span class=\"stat\">80,0</span>, Codeforces Elo <span class=\"stat\">2150</span>, τ²-Bench Retail <span class=\"stat\">86,4</span>, Airline <span class=\"stat\">75,0</span>, AIME 2026 <span class=\"stat\">89,2</span>, MMLU Pro <span class=\"stat\">85,2</span> — medidos pela própria empresa.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>Nenhum registro no SWE-Bench Verified.</strong> Três checagens independentes simplesmente não listam o Gemma 4. Os \"61,4%\" e \"41,6%\" que circulam não vêm de nenhuma execução real. <strong>Não use esses números.</strong></li>\n      <li><span class=\"chip\">Claude</span> <strong>Claude Code 2.1.219</strong> (24/07): o Claude Opus 5 é o novo Opus padrão — 1M de contexto, Fast Mode a <span class=\"stat\">US$ 10</span>/<span class=\"stat\">US$ 50</span> por milhão de tokens.</li>\n      <li><span class=\"chip hot\">Claude</span> <strong>Seu padrão volta a perguntar</strong>: desde a versão 2.1.200 (03/07), o modo de permissão \"default\" é <strong>\"Manual\"</strong> — na CLI, no VS Code e no JetBrains. Quem deixava o agente rodar em silêncio vai notar mais perguntas.</li>\n      <li><span class=\"chip\">Tool</span> <strong>SpaceX compra a Cursor</strong>: <span class=\"stat\">US$ 60 bilhões</span> em ações, anunciado em 16/06, fechamento previsto para o terceiro trimestre. A maior consolidação que o mercado de ferramentas de programação já viu.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>Kimi K3 amanhã</strong>: 2,8 trilhões de parâmetros como MoE, 1M de contexto, posição 1 na Frontend Code Arena com <span class=\"stat\">1679</span> de Elo. Pesos anunciados para 27/07, licença MIT modificada.</li>\n      <li><span class=\"chip hot\">MCP</span> <strong>Depois de amanhã a spec quebra</strong>: a revisão 2026-07-28 torna o protocolo sem estado, e o lado antigo e o novo deixam de se falar. Afeta um universo de mais de 10.000 servidores públicos.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Rodada geral</strong>: Cursor quieto desde 22/07, Cline v4.0.11 com suporte a Opus 5 e K3, ranking do Aider ainda parado em 20/11/2025.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Hoy el día es de un modelo abierto — y de un vacío. El <strong>Gemma 4</strong> de Google, en su variante de 31B, está ahora en el <strong>puesto 3 entre los modelos abiertos</strong> en la Text Arena, y el technical report (presentado el 02/07) por fin trae cifras: LiveCodeBench v6 con <span class=\"stat\">80,0</span>, Codeforces Elo <span class=\"stat\">2150</span>, uso agéntico de herramientas en τ²-Bench Retail con <span class=\"stat\">86,4</span>. Lo que falta es justo el ranking al que uno recurre primero para un modelo de código: Gemma 4 <strong>no aparece por ningún lado en SWE-Bench Verified</strong> — y los porcentajes que circulan sobre él no resisten un análisis. Además, tres fechas que golpean tu día a día más directamente que cualquier benchmark.</p>\n    <ul>\n      <li><span class=\"chip good\">OSS</span> <strong>Gemma 4, cuatro tamaños</strong>: E2B, E4B, 26B MoE y 31B dense, <strong>Apache 2.0</strong>, hasta <span class=\"stat\">256K</span> de contexto (modelos de borde con 128K), en Hugging Face, Kaggle y Ollama, con soporte desde el primer día en vLLM, llama.cpp y LiteRT-LM.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Text Arena</strong>: el 31B está en el <strong>puesto 3 entre los modelos abiertos</strong> (puesto 27 en general), el 26B MoE en el puesto 6. La primera evaluación independiente de la familia hasta ahora — lleva disponible desde el 02/04.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Cifras del fabricante</strong> según el technical report: LiveCodeBench v6 <span class=\"stat\">80,0</span>, Codeforces Elo <span class=\"stat\">2150</span>, τ²-Bench Retail <span class=\"stat\">86,4</span>, Airline <span class=\"stat\">75,0</span>, AIME 2026 <span class=\"stat\">89,2</span>, MMLU Pro <span class=\"stat\">85,2</span> — medidas por la propia empresa.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>Sin registro en SWE-Bench Verified.</strong> Tres revisiones independientes simplemente no listan a Gemma 4. El \"61,4%\" y el \"41,6%\" que circulan no se pueden rastrear a ninguna corrida real. <strong>No los uses.</strong></li>\n      <li><span class=\"chip\">Claude</span> <strong>Claude Code 2.1.219</strong> (24/07): Claude Opus 5 es el nuevo Opus por defecto — 1M de contexto, Fast Mode a <span class=\"stat\">$10</span>/<span class=\"stat\">$50</span> por millón de tokens.</li>\n      <li><span class=\"chip hot\">Claude</span> <strong>Tu modo por defecto vuelve a preguntar</strong>: desde la versión 2.1.200 (03/07), el modo de permisos \"default\" es <strong>\"Manual\"</strong> — en la CLI, VS Code y JetBrains. Quien dejaba correr al agente en silencio va a notar más preguntas.</li>\n      <li><span class=\"chip\">Tool</span> <strong>SpaceX compra Cursor</strong>: <span class=\"stat\">$60 mil millones</span> en acciones, anunciado el 16/06, cierre previsto para el tercer trimestre. La mayor consolidación que ha visto el mercado de herramientas de programación.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>Kimi K3 mañana</strong>: 2,8 billones de parámetros como MoE, 1M de contexto, puesto 1 en la Frontend Code Arena con <span class=\"stat\">1679</span> de Elo. Pesos anunciados para el 27/07, licencia MIT modificada.</li>\n      <li><span class=\"chip hot\">MCP</span> <strong>Pasado mañana se rompe la spec</strong>: la revisión 2026-07-28 vuelve el protocolo sin estado, y el lado viejo y el nuevo dejan de hablarse. Afecta a un campo de más de 10.000 servidores públicos.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Recuento general</strong>: Cursor en silencio desde el 22/07, Cline v4.0.11 con soporte para Opus 5 y K3, el ranking de Aider sigue sin cambios en el 20/11/2025.</li>\n    </ul></div>"
