      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Die Schlagzeile der letzten Wochen heißt „Tausende Humanoide in deutschen Werken\". Die interessantere Zeile steht im zweiten Absatz derselben Meldung: Schaeffler beliefert den Roboterbauer gleichzeitig mit den Gelenken — mehr als die Hälfte des Aktuatorbedarfs bis 2031, erwartet wird eine „siebenstellige Zahl\" von Aktuatoren.<sup>[1]</sup> Deutschland kauft also nicht nur Roboter, es verkauft die Teile, aus denen alle Roboter bestehen. Dazu heute: BMW schickt den ersten Humanoiden in eine deutsche Produktion,<sup>[2]</sup> Figure hat den tausendsten Roboter gebaut,<sup>[4]</sup> in Brasilien zahlen Agenten über Pix<sup>[7]</sup> — und McKinsey lässt zehntausend Führungskräfte ausrichten, dass sechs Prozent den vollen Wert holen.<sup>[8]</sup></p>\n    <ul>\n      <li><span class=\"chip hot\">ROBOTIK · DE</span> <strong>Schaeffler auf beiden Seiten des Tisches:</strong> vierstellige Zahl radgebundener Humanoide bis 2032, erste Einheiten vor Jahresende 2026 in Herzogenaurach und Schweinfurt — <em>und</em> Vorzugslieferant für über <strong>50 %</strong> der Gelenkaktuatoren bis 2031.<sup>[1]</sup></li>\n      <li><span class=\"chip\">DEPLOY · DE</span> <strong>BMW, Werk Leipzig:</strong> der Humanoid AEON (gebaut von Hexagon Robotics, Zürich) geht diesen Sommer in die Pilotphase — Montage von Hochvoltbatterien und Komponentenfertigung. Erster Humanoid in einer deutschen BMW-Produktion.<sup>[2]</sup></li>\n      <li><span class=\"chip\">DEPLOY · US</span> <strong>Nicht verwechseln:</strong> BMWs zweites Humanoiden-Projekt läuft mit Figure 03 in Spartanburg — anderer Roboter, andere Firma, anderer Kontinent.<sup>[3]</sup></li>\n      <li><span class=\"chip hot\">PRODUKTION</span> <strong>Figure baut Roboter am Band:</strong> der 1.000. Figure 03 lief am 23.07. bei BotQ vom Band; Ende April waren es rund 350.<sup>[4]</sup> Eigene Rechnung: das sind knapp <strong>8 Roboter pro Tag</strong> — die beworbene Stundenrate ist offenbar eine Schichtleistung, keine 24/7-Leistung.</li>\n      <li><span class=\"chip\">REG · EU</span> <strong>Tag eins:</strong> heute ist der erste Werktag unter der Transparenzpflicht des AI Act (seit gestern anwendbar) — Offenlegung am Chatbot, Markierung generierter Inhalte, Sanktionsrahmen <strong>15 Mio. €</strong> oder <strong>3 %</strong> Weltjahresumsatz.<sup>[5][6]</sup></li>\n      <li><span class=\"chip hot\">FINANZEN · BR</span> <strong>Agenten mit Kontozugriff:</strong> Iniciador verkauft „die technologische und regulatorische Schicht\", mit der KI-Agenten selbst Pix-Zahlungen auslösen. Umsatz 2025 <strong>R$ 10 Mio.</strong> (4-fach), Runde <strong>6 Mio. US$</strong> (Valor Capital, Prosus).<sup>[7]</sup></li>\n      <li><span class=\"chip\">STUDIE · GLOBAL</span> <strong>Der Dämpfer:</strong> McKinsey misst <strong>6 %</strong> der Organisationen, die den vollen Wert aus fortgeschrittener Technik holen, und nur <strong>25 %</strong>, die binnen zwei Jahren mit autonomen KI-Kollegen rechnen.<sup>[8][9]</sup> Feldarbeit endete im September 2025 — Methodik-Vorbehalt unten.</li>\n      <li><span class=\"chip good\">twiceD</span> Zwei Ideen: ein <strong>neutrales Arbeitsplatz-Screening vor dem Humanoiden-Piloten</strong> und eine <strong>Ausgabe-Vollmacht für zahlende Agenten</strong> nach EU-Regeln.</li>\n    </ul></div>",
      "latestTldrHtmlByLang": {
        "de": "<div class=\"tldr\"><p class=\"lead\">Die Schlagzeile der letzten Wochen heißt „Tausende Humanoide in deutschen Werken\". Die interessantere Zeile steht im zweiten Absatz derselben Meldung: Schaeffler beliefert den Roboterbauer gleichzeitig mit den Gelenken — mehr als die Hälfte des Aktuatorbedarfs bis 2031, erwartet wird eine „siebenstellige Zahl\" von Aktuatoren.<sup>[1]</sup> Deutschland kauft also nicht nur Roboter, es verkauft die Teile, aus denen alle Roboter bestehen. Dazu heute: BMW schickt den ersten Humanoiden in eine deutsche Produktion,<sup>[2]</sup> Figure hat den tausendsten Roboter gebaut,<sup>[4]</sup> in Brasilien zahlen Agenten über Pix<sup>[7]</sup> — und McKinsey lässt zehntausend Führungskräfte ausrichten, dass sechs Prozent den vollen Wert holen.<sup>[8]</sup></p>\n    <ul>\n      <li><span class=\"chip hot\">ROBOTIK · DE</span> <strong>Schaeffler auf beiden Seiten des Tisches:</strong> vierstellige Zahl radgebundener Humanoide bis 2032, erste Einheiten vor Jahresende 2026 in Herzogenaurach und Schweinfurt — <em>und</em> Vorzugslieferant für über <strong>50 %</strong> der Gelenkaktuatoren bis 2031.<sup>[1]</sup></li>\n      <li><span class=\"chip\">DEPLOY · DE</span> <strong>BMW, Werk Leipzig:</strong> der Humanoid AEON (gebaut von Hexagon Robotics, Zürich) geht diesen Sommer in die Pilotphase — Montage von Hochvoltbatterien und Komponentenfertigung. Erster Humanoid in einer deutschen BMW-Produktion.<sup>[2]</sup></li>\n      <li><span class=\"chip\">DEPLOY · US</span> <strong>Nicht verwechseln:</strong> BMWs zweites Humanoiden-Projekt läuft mit Figure 03 in Spartanburg — anderer Roboter, andere Firma, anderer Kontinent.<sup>[3]</sup></li>\n      <li><span class=\"chip hot\">PRODUKTION</span> <strong>Figure baut Roboter am Band:</strong> der 1.000. Figure 03 lief am 23.07. bei BotQ vom Band; Ende April waren es rund 350.<sup>[4]</sup> Eigene Rechnung: das sind knapp <strong>8 Roboter pro Tag</strong> — die beworbene Stundenrate ist offenbar eine Schichtleistung, keine 24/7-Leistung.</li>\n      <li><span class=\"chip\">REG · EU</span> <strong>Tag eins:</strong> heute ist der erste Werktag unter der Transparenzpflicht des AI Act (seit gestern anwendbar) — Offenlegung am Chatbot, Markierung generierter Inhalte, Sanktionsrahmen <strong>15 Mio. €</strong> oder <strong>3 %</strong> Weltjahresumsatz.<sup>[5][6]</sup></li>\n      <li><span class=\"chip hot\">FINANZEN · BR</span> <strong>Agenten mit Kontozugriff:</strong> Iniciador verkauft „die technologische und regulatorische Schicht\", mit der KI-Agenten selbst Pix-Zahlungen auslösen. Umsatz 2025 <strong>R$ 10 Mio.</strong> (4-fach), Runde <strong>6 Mio. US$</strong> (Valor Capital, Prosus).<sup>[7]</sup></li>\n      <li><span class=\"chip\">STUDIE · GLOBAL</span> <strong>Der Dämpfer:</strong> McKinsey misst <strong>6 %</strong> der Organisationen, die den vollen Wert aus fortgeschrittener Technik holen, und nur <strong>25 %</strong>, die binnen zwei Jahren mit autonomen KI-Kollegen rechnen.<sup>[8][9]</sup> Feldarbeit endete im September 2025 — Methodik-Vorbehalt unten.</li>\n      <li><span class=\"chip good\">twiceD</span> Zwei Ideen: ein <strong>neutrales Arbeitsplatz-Screening vor dem Humanoiden-Piloten</strong> und eine <strong>Ausgabe-Vollmacht für zahlende Agenten</strong> nach EU-Regeln.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">The headline of the past few weeks reads \"Thousands of humanoids in German plants.\" The more interesting line sits in the second paragraph of the same report: Schaeffler is simultaneously supplying the robot builder with the joints — more than half of its actuator demand through 2031, with an expected \"seven-figure number\" of actuators.<sup>[1]</sup> So Germany isn't just buying robots — it's selling the parts every robot is made of. Also today: BMW sends its first humanoid into a German production line,<sup>[2]</sup> Figure has built its thousandth robot,<sup>[4]</sup> in Brazil agents are paying via Pix,<sup>[7]</sup> and McKinsey has ten thousand executives report that six percent are capturing full value.<sup>[8]</sup></p>\n    <ul>\n      <li><span class=\"chip hot\">ROBOTICS · DE</span> <strong>Schaeffler on both sides of the table:</strong> a four-digit number of wheeled humanoids by 2032, first units before the end of 2026 in Herzogenaurach and Schweinfurt — <em>and</em> preferred supplier for over <strong>50%</strong> of the joint actuators through 2031.<sup>[1]</sup></li>\n      <li><span class=\"chip\">DEPLOY · DE</span> <strong>BMW, Leipzig plant:</strong> the humanoid AEON (built by Hexagon Robotics, Zurich) enters its pilot phase this summer — high-voltage battery assembly and component manufacturing. First humanoid in a German BMW production line.<sup>[2]</sup></li>\n      <li><span class=\"chip\">DEPLOY · US</span> <strong>Don't confuse the two:</strong> BMW's second humanoid project runs with Figure 03 in Spartanburg — different robot, different company, different continent.<sup>[3]</sup></li>\n      <li><span class=\"chip hot\">PRODUCTION</span> <strong>Figure is building robots on a line:</strong> the 1,000th Figure 03 rolled off BotQ's line on July 23; at the end of April it was around 350.<sup>[4]</sup> Own math: that's just under <strong>8 robots a day</strong> — the advertised hourly rate is apparently a per-shift figure, not a 24/7 one.</li>\n      <li><span class=\"chip\">REG · EU</span> <strong>Day one:</strong> today is the first business day under the AI Act's transparency obligation (applicable since yesterday) — chatbot disclosure, labeling of generated content, penalty range <strong>€15 million</strong> or <strong>3%</strong> of global annual turnover.<sup>[5][6]</sup></li>\n      <li><span class=\"chip hot\">FINANCE · BR</span> <strong>Agents with account access:</strong> Iniciador sells \"the technological and regulatory layer\" that lets AI agents trigger Pix payments themselves. 2025 revenue <strong>R$10 million</strong> (4x), funding round <strong>US$6 million</strong> (Valor Capital, Prosus).<sup>[7]</sup></li>\n      <li><span class=\"chip\">STUDY · GLOBAL</span> <strong>The reality check:</strong> McKinsey measures <strong>6%</strong> of organizations capturing full value from advanced technology, and just <strong>25%</strong> expect autonomous AI teammates within two years.<sup>[8][9]</sup> Fieldwork ended in September 2025 — methodology caveat below.</li>\n      <li><span class=\"chip good\">twiceD</span> Two ideas: a <strong>neutral workstation screening ahead of a humanoid pilot</strong> and a <strong>spending authority for paying agents</strong> under EU rules.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">A manchete das últimas semanas é \"milhares de humanoides em fábricas alemãs\". A linha mais interessante está no segundo parágrafo da mesma notícia: a Schaeffler fornece ao fabricante de robôs, ao mesmo tempo, as articulações — mais da metade da demanda de atuadores até 2031, com um número esperado \"de sete dígitos\" de atuadores.<sup>[1]</sup> Ou seja, a Alemanha não está só comprando robôs, está vendendo as peças que compõem todos os robôs. Além disso hoje: a BMW envia seu primeiro humanoide para uma linha de produção alemã,<sup>[2]</sup> a Figure construiu seu robô de número mil,<sup>[4]</sup> no Brasil agentes pagam via Pix<sup>[7]</sup> — e a McKinsey ouviu dez mil executivos, dos quais seis por cento dizem capturar o valor total.<sup>[8]</sup></p>\n    <ul>\n      <li><span class=\"chip hot\">ROBÓTICA · DE</span> <strong>Schaeffler dos dois lados da mesa:</strong> um número de quatro dígitos de humanoides sobre rodas até 2032, primeiras unidades antes do fim de 2026 em Herzogenaurach e Schweinfurt — <em>e</em> fornecedora preferencial de mais de <strong>50%</strong> dos atuadores de articulação até 2031.<sup>[1]</sup></li>\n      <li><span class=\"chip\">IMPLANTAÇÃO · DE</span> <strong>BMW, fábrica de Leipzig:</strong> o humanoide AEON (construído pela Hexagon Robotics, Zurique) entra em fase piloto neste verão europeu — montagem de baterias de alta tensão e fabricação de componentes. Primeiro humanoide em uma linha de produção alemã da BMW.<sup>[2]</sup></li>\n      <li><span class=\"chip\">IMPLANTAÇÃO · EUA</span> <strong>Não confundir:</strong> o segundo projeto de humanoide da BMW roda com o Figure 03 em Spartanburg — robô diferente, empresa diferente, continente diferente.<sup>[3]</sup></li>\n      <li><span class=\"chip hot\">PRODUÇÃO</span> <strong>A Figure produz robôs em linha de montagem:</strong> o milésimo Figure 03 saiu da linha da BotQ em 23/07; no fim de abril eram cerca de 350.<sup>[4]</sup> Conta própria: são pouco menos de <strong>8 robôs por dia</strong> — a taxa horária anunciada parece ser um ritmo de turno, não de operação 24 horas.</li>\n      <li><span class=\"chip\">REG · UE</span> <strong>Dia um:</strong> hoje é o primeiro dia útil sob a obrigação de transparência do AI Act (aplicável desde ontem) — divulgação em chatbots, marcação de conteúdo gerado, faixa de sanções de <strong>€ 15 milhões</strong> ou <strong>3%</strong> do faturamento global anual.<sup>[5][6]</sup></li>\n      <li><span class=\"chip hot\">FINANÇAS · BR</span> <strong>Agentes com acesso à conta:</strong> a Iniciador vende \"a camada tecnológica e regulatória\" que permite que agentes de IA disparem pagamentos via Pix por conta própria. Receita de 2025 de <strong>R$ 10 milhões</strong> (4x), rodada de <strong>US$ 6 milhões</strong> (Valor Capital, Prosus).<sup>[7]</sup></li>\n      <li><span class=\"chip\">ESTUDO · GLOBAL</span> <strong>O freio de arrumação:</strong> a McKinsey mede <strong>6%</strong> das organizações que extraem o valor total da tecnologia avançada, e apenas <strong>25%</strong> que esperam colegas autônomos de IA dentro de dois anos.<sup>[8][9]</sup> Coleta de campo terminou em setembro de 2025 — ressalva metodológica abaixo.</li>\n      <li><span class=\"chip good\">twiceD</span> Duas ideias: uma <strong>avaliação neutra de posto de trabalho antes do piloto com humanoides</strong> e uma <strong>procuração de gastos para agentes pagadores</strong> sob as regras da UE.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">El titular de las últimas semanas es \"miles de humanoides en plantas alemanas\". La línea más interesante está en el segundo párrafo de la misma nota: Schaeffler le suministra al fabricante de robots, al mismo tiempo, las articulaciones — más de la mitad de la demanda de actuadores hasta 2031, con una cifra esperada \"de siete dígitos\" de actuadores.<sup>[1]</sup> Es decir, Alemania no solo está comprando robots, está vendiendo las piezas de las que están hechos todos los robots. Además hoy: BMW manda a su primer humanoide a una línea de producción alemana,<sup>[2]</sup> Figure construyó su robot número mil,<sup>[4]</sup> en Brasil los agentes pagan vía Pix<sup>[7]</sup> — y McKinsey encuestó a diez mil directivos, de los cuales seis por ciento dice capturar el valor total.<sup>[8]</sup></p>\n    <ul>\n      <li><span class=\"chip hot\">ROBÓTICA · DE</span> <strong>Schaeffler en los dos lados de la mesa:</strong> una cifra de cuatro dígitos de humanoides sobre ruedas para 2032, primeras unidades antes de que termine 2026 en Herzogenaurach y Schweinfurt — <em>y</em> proveedor preferente de más de <strong>50%</strong> de los actuadores de articulación hasta 2031.<sup>[1]</sup></li>\n      <li><span class=\"chip\">DESPLIEGUE · DE</span> <strong>BMW, planta de Leipzig:</strong> el humanoide AEON (construido por Hexagon Robotics, Zúrich) entra en fase piloto este verano — ensamblaje de baterías de alto voltaje y fabricación de componentes. Primer humanoide en una línea de producción de BMW en Alemania.<sup>[2]</sup></li>\n      <li><span class=\"chip\">DESPLIEGUE · EE. UU.</span> <strong>Que no se confunda:</strong> el segundo proyecto de humanoides de BMW corre con el Figure 03 en Spartanburg — robot distinto, empresa distinta, continente distinto.<sup>[3]</sup></li>\n      <li><span class=\"chip hot\">PRODUCCIÓN</span> <strong>Figure fabrica robots en línea de montaje:</strong> el robot 1,000 de Figure 03 salió de la línea de BotQ el 23/07; a fines de abril iban unos 350.<sup>[4]</sup> Cuenta propia: son casi <strong>8 robots al día</strong> — la tasa horaria anunciada parece ser un ritmo por turno, no de operación las 24 horas.</li>\n      <li><span class=\"chip\">REG · UE</span> <strong>Día uno:</strong> hoy es el primer día hábil bajo la obligación de transparencia del AI Act (vigente desde ayer) — divulgación en el chatbot, etiquetado de contenido generado, rango de sanciones de <strong>15 millones de €</strong> o <strong>3%</strong> de la facturación global anual.<sup>[5][6]</sup></li>\n      <li><span class=\"chip hot\">FINANZAS · BR</span> <strong>Agentes con acceso a la cuenta:</strong> Iniciador vende \"la capa tecnológica y regulatoria\" que permite que agentes de IA disparen pagos vía Pix por su cuenta. Ingresos 2025 de <strong>R$ 10 millones</strong> (4x), ronda de <strong>US$ 6 millones</strong> (Valor Capital, Prosus).<sup>[7]</sup></li>\n      <li><span class=\"chip\">ESTUDIO · GLOBAL</span> <strong>El frenazo:</strong> McKinsey mide que solo <strong>6%</strong> de las organizaciones capturan el valor total de la tecnología avanzada, y solo <strong>25%</strong> espera colegas autónomos de IA en dos años.<sup>[8][9]</sup> El trabajo de campo terminó en septiembre de 2025 — advertencia metodológica más abajo.</li>\n      <li><span class=\"chip good\">twiceD</span> Dos ideas: una <strong>evaluación neutral de puesto de trabajo antes del piloto con humanoides</strong> y un <strong>poder de gasto para agentes pagadores</strong> bajo reglas de la UE.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Der Montags-Abruf bringt <strong>82 Listings</strong> nach 71 am Sonntag — und zum ersten Mal in dieser Serie lässt sich Zuwachs gegen Ertrag sauber gegenrechnen. <strong>65 Einträge sind punktgleich übernommen</strong> (null Score-Drift), 17 sind neu, 6 gefallen. Von den 17 Neuzugängen schafft es <strong>keiner in die Top 10</strong>: Die gesamte Spitze ist Bestand vom Vortag, der beste Neuzugang steht auf <strong>Rang 13 mit Fit 75</strong>. Deshalb bleibt die Zahl der Einträge über Fit 70 bei exakt <strong>22</strong>, obwohl das Board um elf gewachsen ist, und der Median fällt von 63,0 auf <strong>61,5</strong>. Die sechs Abgänge waren im Schnitt besser (Median 66,5) als die siebzehn Zugänge (Median 58,0). Elf Listings mehr, null zusätzliche Kandidaten in dem Band, das für dieses Profil überhaupt in Frage kommt. Dafür wird die zweite Spur konkret: <strong>fünf deutsche Ausschreibungen</strong> stehen mit belegter Frist im Filter, und bei der wichtigsten läuft ab heute die Uhr.</p>\n    <ul>\n      <li><span class=\"chip hot\">Board</span> <strong>82 Listings</strong>: 68 Freelance, 9 Employee, 5 Intriguing. 65 übernommen, 17 neu, 6 gefallen — und die 65 Übernahmen tragen <strong>exakt dieselben Fit-Scores wie gestern</strong>. Sauberes Vergleichspaar, die Verschiebungen unten sind belastbar.</li>\n      <li><span class=\"chip hot\">Board</span> <strong>Das Trefferband steht still</strong>: ≥ Fit 70 bleibt bei 22 (gestern 22), ≥ 75 steigt von 12 auf 13, der Median fällt von 63,0 auf 61,5. Alle zehn besten Einträge sind Übernahmen; der beste Neuzugang liegt auf Rang 13.</li>\n      <li><span class=\"chip good\">twiceD</span> <strong>Die Spitze unverändert</strong>: iSAX 83 (Java 21, Spring Boot 3, Angular, Flutter, Auth, 100 % remote ab Frankfurt), teclift 82, JetBrains 82, ELCA Zürich 81, Keil 80. Der beste Neuzugang: Contractor Consulting, Java/Spring Boot/OpenShift, 100 % remote, <strong>Fit 75</strong>.</li>\n      <li><span class=\"chip hot\">Rate</span> <strong>Sechs von 82 nennen einen Preis ohne Sternchen</strong> — und drei davon kommen von derselben Firma. <strong>Grafana Labs</strong> schreibt für Deutschland-Remote <strong>97.034–116.441 €</strong>, <strong>109.709–131.651 €</strong> und <strong>109.000–137.000 €</strong> im Jahr aus. Die eigene DE-Senior-Schwelle (≥ 100 k€) schneidet mitten durch das unterste Band.</li>\n      <li><span class=\"chip\">Rate</span> <strong>Externer Anker</strong>: 95 €/h für IT-Freelancer im DACH-Raum, Altersspanne 80 €/h (20–30) bis 96 €/h (ab Mitte 40), Stichprobe 620 IT-Freelancer.<sup>[1]</sup> Zehn Jahre Berufserfahrung sind in dieser Erhebung einen Euro wert.</li>\n      <li><span class=\"chip good\">Vergabe</span> <strong>Fünf deutsche Ausschreibungen im Filter</strong>: PRAKI/BSI (Frist Mo 10.08.), KomMonitor/NRW (18.08.), MNSW/ITZBund (31.08.), EUginius-2.0/BLE (01.09.), KARLAS/Sachsen (07.09.) — vier davon heute erstmals hier.<sup>[6][7][8][9][10]</sup></li>\n      <li><span class=\"chip hot\">Vergabe</span> <strong>Heute ist Werktag 1 von 5 bis zur BSI-Frist</strong> — und der Direktlink auf die Vergabeunterlagen liefert <strong>HTTP 400</strong>. Sie sind nur über eine Sitzung im Vergabeportal zu bekommen; ohne diesen Schritt heute oder morgen ist die Frist nicht zu halten.</li>\n      <li><span class=\"chip\">Vergabe</span> <strong>Alle fünf Verdicts stehen konservativ auf „⚠️ Partner nötig, Unterlagen ausstehend\"</strong>: Keine der fünf Bekanntmachungen nennt Umsatz-, Personal- oder Referenzschwellen. Hier steht deshalb <strong>keine Zahl</strong> — auch keine geschätzte.</li>\n      <li><span class=\"chip\">Markt</span> <strong>Der Mangel ist ein Jahr alt, der Rückgang ein halbes</strong>: Die 109.000 fehlenden IT-Fachkräfte stammen aus einer Mitteilung vom <strong>07.08.2025</strong><sup>[2]</sup>; die Nachfrage nach hochqualifizierten IT-Experten ging laut Februar-Auswertung um knapp <strong>20 %</strong> zurück<sup>[3]</sup>. Beides gleichzeitig wahr.</li>\n      <li><span class=\"chip hot\">IoT</span> <strong>Ein neuer Nischen-Eintrag</strong>: Freiberuflicher IoT-Architekt, Berlin, 100 % remote, 6 Monate, Fit 65 — recherchiertes Band 100–130 €/h. Der einzige Neuzugang mit Premium-Charakter.</li>\n    </ul></div>",

        "en": "<div class=\"tldr\"><p class=\"lead\">Monday's pull brings <strong>82 listings</strong> after 71 on Sunday — and for the first time in this series, growth and yield can be cleanly reconciled against each other. <strong>65 entries carried over with identical scores</strong> (zero score drift), 17 are new, 6 dropped out. Of the 17 newcomers, <strong>none makes the top 10</strong>: the entire top tier is holdover from the prior day, and the best newcomer sits at <strong>rank 13 with a fit of 75</strong>. That's why the count of entries above fit 70 stays at exactly <strong>22</strong> even though the board grew by eleven, and the median falls from 63.0 to <strong>61.5</strong>. The six that fell off averaged better (median 66.5) than the seventeen that arrived (median 58.0). Eleven more listings, zero additional candidates in the band that actually matters for this profile. The second track, though, turns concrete: <strong>five German tenders</strong> now sit in the filter with confirmed deadlines, and the clock starts running on the most important one today.</p>\n    <ul>\n      <li><span class=\"chip hot\">Board</span> <strong>82 listings</strong>: 68 freelance, 9 employee, 5 intriguing. 65 carried over, 17 new, 6 dropped — and the 65 carryovers carry <strong>the exact same fit scores as yesterday</strong>. A clean comparison pair; the shifts below hold up.</li>\n      <li><span class=\"chip hot\">Board</span> <strong>The hit rate is standing still</strong>: ≥ fit 70 stays at 22 (yesterday 22), ≥ 75 climbs from 12 to 13, the median falls from 63.0 to 61.5. All ten top entries are carryovers; the best newcomer sits at rank 13.</li>\n      <li><span class=\"chip good\">twiceD</span> <strong>The top tier unchanged</strong>: iSAX 83 (Java 21, Spring Boot 3, Angular, Flutter, Auth, 100% remote from Frankfurt), teclift 82, JetBrains 82, ELCA Zurich 81, Keil 80. The best newcomer: Contractor Consulting, Java/Spring Boot/OpenShift, 100% remote, <strong>fit 75</strong>.</li>\n      <li><span class=\"chip hot\">Rate</span> <strong>Six of 82 name a rate without an asterisk</strong> — and three of those come from the same company. <strong>Grafana Labs</strong> is advertising three Germany-remote bands: <strong>€97,034–116,441</strong>, <strong>€109,709–131,651</strong>, and <strong>€109,000–137,000</strong> per year. This profile's own DE-senior threshold (≥ €100k) cuts right through the bottom of that lowest band.</li>\n      <li><span class=\"chip\">Rate</span> <strong>External anchor</strong>: €95/h for IT freelancers in the DACH region, age spread from €80/h (20–30) to €96/h (mid-40s and up), sample of 620 IT freelancers.<sup>[1]</sup> Ten years of professional experience is worth one euro in this survey.</li>\n      <li><span class=\"chip good\">Tenders</span> <strong>Five German tenders in the filter</strong>: PRAKI/BSI (deadline Mon 08/10), KomMonitor/NRW (08/18), MNSW/ITZBund (08/31), EUginius-2.0/BLE (09/01), KARLAS/Saxony (09/07) — four of these appear here for the first time today.<sup>[6][7][8][9][10]</sup></li>\n      <li><span class=\"chip hot\">Tenders</span> <strong>Today is business day 1 of 5 until the BSI deadline</strong> — and the direct link to the tender documents returns <strong>HTTP 400</strong>. They're only reachable through a logged-in session on the procurement portal; without that step today or tomorrow, the deadline can't be met.</li>\n      <li><span class=\"chip\">Tenders</span> <strong>All five verdicts conservatively read \"⚠️ Partner needed, documents pending\"</strong>: none of the five notices states a revenue, staffing, or reference-project threshold. So no number appears here — not even an estimated one.</li>\n      <li><span class=\"chip\">Market</span> <strong>The shortage is a year old, the decline is six months old</strong>: the 109,000 missing IT specialists come from a release dated <strong>08/07/2025</strong><sup>[2]</sup>; demand for highly qualified IT experts dropped by nearly <strong>20%</strong> according to a February analysis<sup>[3]</sup>. Both are true at the same time.</li>\n      <li><span class=\"chip hot\">IoT</span> <strong>One new niche entry</strong>: freelance IoT architect, Berlin, 100% remote, 6 months, fit 65 — researched band €100–130/h. The only newcomer with premium character.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">A coleta de segunda-feira traz <strong>82 vagas</strong> depois de 71 no domingo — e, pela primeira vez nesta série, dá para comparar crescimento e rendimento de forma limpa. <strong>65 entradas foram mantidas com a mesma pontuação</strong> (zero variação de score), 17 são novas, 6 saíram. Das 17 recém-chegadas, <strong>nenhuma entra no top 10</strong>: todo o topo é herança do dia anterior, e a melhor recém-chegada está na <strong>posição 13, com fit 75</strong>. Por isso o número de entradas acima de fit 70 continua em exatos <strong>22</strong>, mesmo com o board crescendo em onze, e a mediana cai de 63,0 para <strong>61,5</strong>. As seis que saíram tinham em média um desempenho melhor (mediana 66,5) do que as dezessete que entraram (mediana 58,0). Onze vagas a mais, zero candidatos adicionais na faixa que realmente importa para este perfil. Já a segunda frente ganha corpo: <strong>cinco licitações alemãs</strong> aparecem no filtro com prazo confirmado, e o relógio da mais importante começa a correr hoje.</p>\n    <ul>\n      <li><span class=\"chip hot\">Board</span> <strong>82 vagas</strong>: 68 freelance, 9 CLT/empregado, 5 curiosidades. 65 mantidas, 17 novas, 6 saíram — e as 65 mantidas trazem <strong>exatamente os mesmos scores de ontem</strong>. Par de comparação limpo; as variações abaixo são confiáveis.</li>\n      <li><span class=\"chip hot\">Board</span> <strong>A taxa de acerto está parada</strong>: ≥ fit 70 continua em 22 (ontem 22), ≥ 75 sobe de 12 para 13, a mediana cai de 63,0 para 61,5. As dez melhores entradas são todas mantidas; a melhor recém-chegada está na posição 13.</li>\n      <li><span class=\"chip good\">twiceD</span> <strong>O topo inalterado</strong>: iSAX 83 (Java 21, Spring Boot 3, Angular, Flutter, Auth, 100% remoto a partir de Frankfurt), teclift 82, JetBrains 82, ELCA Zurique 81, Keil 80. A melhor recém-chegada: Contractor Consulting, Java/Spring Boot/OpenShift, 100% remoto, <strong>fit 75</strong>.</li>\n      <li><span class=\"chip hot\">Rate</span> <strong>Seis das 82 informam um valor sem asterisco</strong> — e três delas vêm da mesma empresa. A <strong>Grafana Labs</strong> anuncia para remoto-Alemanha faixas de <strong>€ 97.034–116.441</strong>, <strong>€ 109.709–131.651</strong> e <strong>€ 109.000–137.000</strong> por ano. O próprio piso sênior-DE deste perfil (≥ € 100 mil) corta bem no meio da faixa mais baixa.</li>\n      <li><span class=\"chip\">Rate</span> <strong>Âncora externa</strong>: € 95/h para freelancers de TI na região DACH, faixa etária de € 80/h (20–30 anos) a € 96/h (a partir dos 40 e poucos), amostra de 620 freelancers de TI.<sup>[1]</sup> Dez anos de experiência profissional valem um euro nesse levantamento.</li>\n      <li><span class=\"chip good\">Licitação</span> <strong>Cinco licitações alemãs no filtro</strong>: PRAKI/BSI (prazo seg. 10/08), KomMonitor/NRW (18/08), MNSW/ITZBund (31/08), EUginius-2.0/BLE (01/09), KARLAS/Saxônia (07/09) — quatro delas aparecem aqui pela primeira vez hoje.<sup>[6][7][8][9][10]</sup></li>\n      <li><span class=\"chip hot\">Licitação</span> <strong>Hoje é o dia útil 1 de 5 até o prazo do BSI</strong> — e o link direto para os documentos da licitação retorna <strong>HTTP 400</strong>. Só são acessíveis por uma sessão logada no portal de licitações; sem esse passo hoje ou amanhã, o prazo não é mais viável.</li>\n      <li><span class=\"chip\">Licitação</span> <strong>Os cinco vereditos seguem, com prudência, \"⚠️ Parceiro necessário, documentos pendentes\"</strong>: nenhum dos cinco editais informa limite de faturamento, de equipe ou de projetos de referência. Por isso, não há número aqui — nem sequer estimado.</li>\n      <li><span class=\"chip\">Mercado</span> <strong>A escassez tem um ano, a queda tem seis meses</strong>: os 109 mil profissionais de TI em falta vêm de um comunicado de <strong>07/08/2025</strong><sup>[2]</sup>; a demanda por especialistas de TI altamente qualificados caiu quase <strong>20%</strong>, segundo uma análise de fevereiro<sup>[3]</sup>. As duas coisas são verdadeiras ao mesmo tempo.</li>\n      <li><span class=\"chip hot\">IoT</span> <strong>Uma nova vaga de nicho</strong>: arquiteto de IoT freelance, Berlim, 100% remoto, 6 meses, fit 65 — faixa pesquisada de € 100–130/h. A única recém-chegada com perfil premium.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">La consulta del lunes trae <strong>82 vacantes</strong> tras 71 el domingo — y, por primera vez en esta serie, se puede comparar limpiamente el crecimiento contra el rendimiento. <strong>65 entradas se mantuvieron con el mismo puntaje</strong> (cero variación de score), 17 son nuevas, 6 se cayeron. De las 17 recién llegadas, <strong>ninguna entra al top 10</strong>: toda la cima es herencia del día anterior, y la mejor recién llegada está en el <strong>puesto 13, con fit 75</strong>. Por eso el número de entradas por encima de fit 70 se mantiene en exactos <strong>22</strong>, aunque el tablero creció en once, y la mediana baja de 63.0 a <strong>61.5</strong>. Las seis que se cayeron eran en promedio mejores (mediana 66.5) que las diecisiete que entraron (mediana 58.0). Once vacantes más, cero candidatos adicionales en la banda que realmente importa para este perfil. En cambio, la segunda vía se vuelve concreta: <strong>cinco licitaciones alemanas</strong> aparecen en el filtro con plazo confirmado, y el reloj de la más importante empieza a correr hoy.</p>\n    <ul>\n      <li><span class=\"chip hot\">Tablero</span> <strong>82 vacantes</strong>: 68 freelance, 9 en nómina, 5 de la vía \"curiosidad\". 65 se mantuvieron, 17 nuevas, 6 se cayeron — y las 65 que se mantuvieron traen <strong>exactamente los mismos scores que ayer</strong>. Par de comparación limpio; los cambios de abajo son confiables.</li>\n      <li><span class=\"chip hot\">Tablero</span> <strong>La tasa de aciertos está estancada</strong>: ≥ fit 70 se mantiene en 22 (ayer 22), ≥ 75 sube de 12 a 13, la mediana baja de 63.0 a 61.5. Las diez mejores entradas son todas herencia del día anterior; la mejor recién llegada está en el puesto 13.</li>\n      <li><span class=\"chip good\">twiceD</span> <strong>La cima sin cambios</strong>: iSAX 83 (Java 21, Spring Boot 3, Angular, Flutter, Auth, 100% remoto desde Frankfurt), teclift 82, JetBrains 82, ELCA Zúrich 81, Keil 80. La mejor recién llegada: Contractor Consulting, Java/Spring Boot/OpenShift, 100% remoto, <strong>fit 75</strong>.</li>\n      <li><span class=\"chip hot\">Tarifa</span> <strong>Seis de 82 mencionan un monto sin asterisco</strong> — y tres de ellas vienen de la misma empresa. <strong>Grafana Labs</strong> publica para remoto-Alemania tres bandas: <strong>97,034–116,441 €</strong>, <strong>109,709–131,651 €</strong> y <strong>109,000–137,000 €</strong> al año. El propio umbral sénior-DE de este perfil (≥ 100 mil €) corta justo por en medio de la banda más baja.</li>\n      <li><span class=\"chip\">Tarifa</span> <strong>Ancla externa</strong>: 95 €/h para freelancers de TI en la región DACH, rango por edad de 80 €/h (20–30 años) a 96 €/h (a partir de mediados de los 40), muestra de 620 freelancers de TI.<sup>[1]</sup> Diez años de experiencia profesional valen un euro en ese estudio.</li>\n      <li><span class=\"chip good\">Licitación</span> <strong>Cinco licitaciones alemanas en el filtro</strong>: PRAKI/BSI (plazo lun. 10/08), KomMonitor/NRW (18/08), MNSW/ITZBund (31/08), EUginius-2.0/BLE (01/09), KARLAS/Sajonia (07/09) — cuatro de ellas aparecen aquí por primera vez hoy.<sup>[6][7][8][9][10]</sup></li>\n      <li><span class=\"chip hot\">Licitación</span> <strong>Hoy es el día hábil 1 de 5 hasta el plazo del BSI</strong> — y el enlace directo a los documentos de la licitación devuelve <strong>HTTP 400</strong>. Solo son accesibles mediante una sesión iniciada en el portal de contrataciones; sin ese paso hoy o mañana, el plazo ya no es viable.</li>\n      <li><span class=\"chip\">Licitación</span> <strong>Los cinco veredictos se mantienen, con cautela, en \"⚠️ Se necesita socio, documentos pendientes\"</strong>: ninguno de los cinco avisos indica un umbral de facturación, personal o proyectos de referencia. Por eso aquí no aparece ninguna cifra — ni siquiera estimada.</li>\n      <li><span class=\"chip\">Mercado</span> <strong>La escasez tiene un año, la caída tiene seis meses</strong>: los 109,000 profesionales de TI que faltan provienen de un comunicado del <strong>07/08/2025</strong><sup>[2]</sup>; la demanda de expertos de TI altamente calificados cayó casi <strong>20%</strong>, según un análisis de febrero<sup>[3]</sup>. Ambas cosas son ciertas al mismo tiempo.</li>\n      <li><span class=\"chip hot\">IoT</span> <strong>Una nueva vacante de nicho</strong>: arquitecto de IoT freelance, Berlín, 100% remoto, 6 meses, fit 65 — banda investigada de 100–130 €/h. La única recién llegada con carácter premium.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Montag, der 3. August — und die Woche hat eine sehr klare Form. Von heute bis Mittwoch ist es trocken, ab Donnerstag kommt der Regen zurück, und ausgerechnet <strong>Dia dos Pais am Sonntag, den 09.08.</strong>, ist im Modell der nasseste Tag der Woche: <strong>23,4 mm</strong>. Wer diese Woche etwas draußen vorhat, macht es in den nächsten drei Tagen. Dazu zwei Nachrichten, die Korrekturen sind statt Neuigkeiten: Das aktuellere InfoGripe-Bulletin nimmt <strong>Paraná aus der Wachstums-Gruppe</strong> heraus — das Bild, das dieser Brief gestern gezeichnet hat, war zwei Wochen alt. Und das Theaterfestival EnCena, das gerade in mehreren Meldungen „ab 21. August\" auftaucht, hat seine <strong>21. Ausgabe bereits im Mai gespielt</strong>. Wer danach den Kalender richtet, richtet ihn nach 2025.</p>\n    <ul>\n      <li><span class=\"chip good\">WETTER</span> <strong>Das Fenster ist jetzt:</strong> heute <strong>15–26 °C</strong> bei 0,0 mm, Dienstag 15–26 °C, Mittwoch 15–23 °C — alle drei Tage <strong>0 % Regen</strong>. Zwei unabhängig abgerufene Portale sind sich darin einig.</li>\n      <li><span class=\"chip hot\">WETTER</span> <strong>Ab Donnerstag kippt es:</strong> Do <strong>8,3 mm</strong> (45 %), Fr <strong>7,2 mm</strong> (41 %) — und So 09.08. <strong>23,4 mm</strong> bei nur noch 24 °C Höchstwert. Der Vatertag ist der nasseste Tag der Woche.</li>\n      <li><span class=\"chip\">WETTER</span> <strong>Wo die Portale streiten:</strong> Für <strong>Sa 08.08.</strong> sagt Climatempo 40 % Schauer, theweather 0 % und „klar\". Beim Höchstwert sind sie einig: <strong>31–32 °C</strong>. Wir drucken beide Werte.</li>\n      <li><span class=\"chip good\">GESUNDHEIT</span> <strong>Paraná ist aus der Wachstums-Gruppe raus:</strong> InfoGripe <strong>SE 29/2026</strong> (30.07.) listet nur noch <strong>3 von 27</strong> Bundesstaaten mit steigender SRAG — Maranhão, RS, SC. Paraná gehört jetzt zu den 12 mit erhöhter, aber <em>nicht</em> wachsender Inzidenz.</li>\n      <li><span class=\"chip hot\">BABY</span> <strong>Der neue Name im Bulletin:</strong> Metapneumovirus — Krankenhaus-Einweisungen steigen „<em>em todo o Sul</em>\", also in ganz Südbrasilien. Für ein einen Monat altes Kind ändert das die Vorsicht nicht, nur ihren Grund.</li>\n      <li><span class=\"chip good\">EVENT</span> <strong>Samstag 08.08., gratis in Londrina:</strong> „Churrasco do Paizão\" am Londrina Norte Shopping ab <strong>11 h</strong> — Hüpfburgen, Oldtimer-Schau, Live-Musik, Eintritt frei.</li>\n      <li><span class=\"chip good\">TRIP</span> <strong>Der Ganzjahres-Joker:</strong> Das <strong>Aquário de Londrina</strong> im Parque Ney Braga ist dauerhaft geöffnet und <strong>kostenlos</strong> — Sa/So 9–17 h, 15 Becken, über 40 Fischarten, drinnen. Regensicher.</li>\n      <li><span class=\"chip\">EVENT</span> <strong>Dia dos Pais im Norte Pioneiro:</strong> Concurso da Rainha der EFAPI in Santo Antônio da Platina am <strong>Sa 08.08.</strong>; die <strong>54ª EFAPI Expo</strong> selbst läuft <strong>19.–23.08.</strong></li>\n      <li><span class=\"chip hot\">ACHTUNG</span> <strong>Jahres-Falle EnCena:</strong> Die Meldung „20. EnCena beginnt am 21. August\" ist von <strong>2025</strong>. Die <strong>21. Ausgabe lief 18.–29. Mai 2026</strong> und ist vorbei — kein Theaterfestival im August.</li>\n      <li><span class=\"chip\">SCHULE</span> <strong>Normale Woche:</strong> Das 2. Trimester läuft durch bis <strong>04.09.</strong>, kein Ferienfenster im August. Dia dos Pais fällt auf einen Sonntag und ist kein Feiertag — Montag ist regulär Schule.</li>\n    </ul></div>",

        "de": "<div class=\"tldr\"><p class=\"lead\">Montag, der 3. August — und die Woche hat eine sehr klare Form. Von heute bis Mittwoch ist es trocken, ab Donnerstag kommt der Regen zurück, und ausgerechnet <strong>Dia dos Pais am Sonntag, den 09.08.</strong>, ist im Modell der nasseste Tag der Woche: <strong>23,4 mm</strong>. Wer diese Woche etwas draußen vorhat, macht es in den nächsten drei Tagen. Dazu zwei Nachrichten, die Korrekturen sind statt Neuigkeiten: Das aktuellere InfoGripe-Bulletin nimmt <strong>Paraná aus der Wachstums-Gruppe</strong> heraus — das Bild, das dieser Brief gestern gezeichnet hat, war zwei Wochen alt. Und das Theaterfestival EnCena, das gerade in mehreren Meldungen „ab 21. August\" auftaucht, hat seine <strong>21. Ausgabe bereits im Mai gespielt</strong>. Wer danach den Kalender richtet, richtet ihn nach 2025.</p>\n    <ul>\n      <li><span class=\"chip good\">WETTER</span> <strong>Das Fenster ist jetzt:</strong> heute <strong>15–26 °C</strong> bei 0,0 mm, Dienstag 15–26 °C, Mittwoch 15–23 °C — alle drei Tage <strong>0 % Regen</strong>. Zwei unabhängig abgerufene Portale sind sich darin einig.</li>\n      <li><span class=\"chip hot\">WETTER</span> <strong>Ab Donnerstag kippt es:</strong> Do <strong>8,3 mm</strong> (45 %), Fr <strong>7,2 mm</strong> (41 %) — und So 09.08. <strong>23,4 mm</strong> bei nur noch 24 °C Höchstwert. Der Vatertag ist der nasseste Tag der Woche.</li>\n      <li><span class=\"chip\">WETTER</span> <strong>Wo die Portale streiten:</strong> Für <strong>Sa 08.08.</strong> sagt Climatempo 40 % Schauer, theweather 0 % und „klar\". Beim Höchstwert sind sie einig: <strong>31–32 °C</strong>. Wir drucken beide Werte.</li>\n      <li><span class=\"chip good\">GESUNDHEIT</span> <strong>Paraná ist aus der Wachstums-Gruppe raus:</strong> InfoGripe <strong>SE 29/2026</strong> (30.07.) listet nur noch <strong>3 von 27</strong> Bundesstaaten mit steigender SRAG — Maranhão, RS, SC. Paraná gehört jetzt zu den 12 mit erhöhter, aber <em>nicht</em> wachsender Inzidenz.</li>\n      <li><span class=\"chip hot\">BABY</span> <strong>Der neue Name im Bulletin:</strong> Metapneumovirus — Krankenhaus-Einweisungen steigen „<em>em todo o Sul</em>\", also in ganz Südbrasilien. Für ein einen Monat altes Kind ändert das die Vorsicht nicht, nur ihren Grund.</li>\n      <li><span class=\"chip good\">EVENT</span> <strong>Samstag 08.08., gratis in Londrina:</strong> „Churrasco do Paizão\" am Londrina Norte Shopping ab <strong>11 h</strong> — Hüpfburgen, Oldtimer-Schau, Live-Musik, Eintritt frei.</li>\n      <li><span class=\"chip good\">TRIP</span> <strong>Der Ganzjahres-Joker:</strong> Das <strong>Aquário de Londrina</strong> im Parque Ney Braga ist dauerhaft geöffnet und <strong>kostenlos</strong> — Sa/So 9–17 h, 15 Becken, über 40 Fischarten, drinnen. Regensicher.</li>\n      <li><span class=\"chip\">EVENT</span> <strong>Dia dos Pais im Norte Pioneiro:</strong> Concurso da Rainha der EFAPI in Santo Antônio da Platina am <strong>Sa 08.08.</strong>; die <strong>54ª EFAPI Expo</strong> selbst läuft <strong>19.–23.08.</strong></li>\n      <li><span class=\"chip hot\">ACHTUNG</span> <strong>Jahres-Falle EnCena:</strong> Die Meldung „20. EnCena beginnt am 21. August\" ist von <strong>2025</strong>. Die <strong>21. Ausgabe lief 18.–29. Mai 2026</strong> und ist vorbei — kein Theaterfestival im August.</li>\n      <li><span class=\"chip\">SCHULE</span> <strong>Normale Woche:</strong> Das 2. Trimester läuft durch bis <strong>04.09.</strong>, kein Ferienfenster im August. Dia dos Pais fällt auf einen Sonntag und ist kein Feiertag — Montag ist regulär Schule.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Monday, August 3 — and the week has a very clear shape. From today through Wednesday it's dry, the rain comes back starting Thursday, and of all days, <strong>Dia dos Pais on Sunday, 08/09</strong>, is the wettest day of the week in the model: <strong>23.4 mm</strong>. Anyone planning something outdoors this week should do it in the next three days. Plus two stories that are corrections rather than news: the more recent InfoGripe bulletin takes <strong>Paraná out of the growth group</strong> — the picture this brief drew yesterday was two weeks old. And the EnCena theater festival, which is currently showing up in several reports as \"starting August 21,\" already played its <strong>21st edition back in May</strong>. Anyone setting their calendar by that is setting it by 2025.</p>\n    <ul>\n      <li><span class=\"chip good\">WEATHER</span> <strong>The window is now:</strong> today <strong>15–26°C</strong> at 0.0 mm, Tuesday 15–26°C, Wednesday 15–23°C — all three days <strong>0% rain</strong>. Two independently checked portals agree on this.</li>\n      <li><span class=\"chip hot\">WEATHER</span> <strong>It turns starting Thursday:</strong> Thu <strong>8.3 mm</strong> (45%), Fri <strong>7.2 mm</strong> (41%) — and Sun 08/09 <strong>23.4 mm</strong> with a high of just 24°C. Dia dos Pais is the wettest day of the week.</li>\n      <li><span class=\"chip\">WEATHER</span> <strong>Where the portals disagree:</strong> For <strong>Sat 08/08</strong>, Climatempo says 40% showers, theweather says 0% and \"clear.\" They agree on the high: <strong>31–32°C</strong>. We're printing both figures.</li>\n      <li><span class=\"chip good\">HEALTH</span> <strong>Paraná is out of the growth group:</strong> InfoGripe <strong>SE 29/2026</strong> (07/30) lists only <strong>3 of 27</strong> states with rising SARI — Maranhão, RS, SC. Paraná now belongs to the 12 with elevated but <em>not</em> growing incidence.</li>\n      <li><span class=\"chip hot\">BABY</span> <strong>The new name in the bulletin:</strong> Metapneumovirus — hospital admissions rising \"<em>em todo o Sul</em>,\" meaning across all of southern Brazil. For a one-month-old, that doesn't change the caution, only its reason.</li>\n      <li><span class=\"chip good\">EVENT</span> <strong>Saturday 08/08, free in Londrina:</strong> \"Churrasco do Paizão\" at Londrina Norte Shopping from <strong>11 AM</strong> — bounce houses, classic-car show, live music, free admission.</li>\n      <li><span class=\"chip good\">TRIP</span> <strong>The year-round joker:</strong> The <strong>Aquário de Londrina</strong> in Parque Ney Braga is open year-round and <strong>free</strong> — Sat/Sun 9 AM–5 PM, 15 tanks, over 40 fish species, indoors. Rain-proof.</li>\n      <li><span class=\"chip\">EVENT</span> <strong>Dia dos Pais in the Norte Pioneiro:</strong> EFAPI's Concurso da Rainha in Santo Antônio da Platina on <strong>Sat 08/08</strong>; the <strong>54th EFAPI Expo</strong> itself runs <strong>08/19–08/23</strong>.</li>\n      <li><span class=\"chip hot\">HEADS UP</span> <strong>Year trap — EnCena:</strong> The report \"20th EnCena begins August 21\" is from <strong>2025</strong>. The <strong>21st edition ran 05/18–05/29, 2026</strong> and is over — no theater festival in August.</li>\n      <li><span class=\"chip\">SCHOOL</span> <strong>Normal week:</strong> The 2nd trimester runs through <strong>09/04</strong>, no break window in August. Dia dos Pais falls on a Sunday and isn't a holiday — Monday is a regular school day.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Segunda-feira, 3 de agosto — e a semana tem um formato bem definido. De hoje até quarta-feira o tempo fica seco, a partir de quinta a chuva volta, e justamente o <strong>Dia dos Pais, no domingo, 09/08</strong>, é o dia mais chuvoso da semana no modelo: <strong>23,4 mm</strong>. Quem tem planos ao ar livre esta semana deve aproveitar os próximos três dias. Além disso, duas notícias que são correções, não novidades: o boletim mais recente do InfoGripe <strong>tira o Paraná do grupo de crescimento</strong> — o quadro que esta edição traçou ontem já tinha duas semanas. E o festival de teatro EnCena, que aparece agora em várias notícias como \"a partir de 21 de agosto\", já <strong>encerrou sua 21ª edição em maio</strong>. Quem se guiar por essa data está se guiando por 2025.</p>\n    <ul>\n      <li><span class=\"chip good\">CLIMA</span> <strong>A janela é agora:</strong> hoje <strong>15–26 °C</strong> com 0,0 mm, terça 15–26 °C, quarta 15–23 °C — os três dias com <strong>0% de chuva</strong>. Dois portais consultados de forma independente concordam.</li>\n      <li><span class=\"chip hot\">CLIMA</span> <strong>A virada chega na quinta:</strong> qui <strong>8,3 mm</strong> (45%), sex <strong>7,2 mm</strong> (41%) — e dom 09/08 <strong>23,4 mm</strong> com máxima de apenas 24 °C. O Dia dos Pais é o dia mais chuvoso da semana.</li>\n      <li><span class=\"chip\">CLIMA</span> <strong>Onde os portais discordam:</strong> para <strong>sáb 08/08</strong>, a Climatempo prevê 40% de pancadas, o theweather prevê 0% e \"tempo firme\". Na máxima, concordam: <strong>31–32 °C</strong>. Publicamos os dois valores.</li>\n      <li><span class=\"chip good\">SAÚDE</span> <strong>O Paraná saiu do grupo de crescimento:</strong> o InfoGripe <strong>SE 29/2026</strong> (30/07) lista apenas <strong>3 de 27</strong> estados com SRAG em alta — Maranhão, RS, SC. O Paraná agora está entre os 12 com incidência elevada, mas <em>não</em> crescente.</li>\n      <li><span class=\"chip hot\">BEBÊ</span> <strong>O novo nome no boletim:</strong> metapneumovírus — as internações crescem \"<em>em todo o Sul</em>\". Para uma criança de um mês, isso não muda o cuidado, só o motivo dele.</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Sábado 08/08, grátis em Londrina:</strong> \"Churrasco do Paizão\" no Londrina Norte Shopping a partir das <strong>11h</strong> — pula-pula, mostra de carros antigos, música ao vivo, entrada gratuita.</li>\n      <li><span class=\"chip good\">PASSEIO</span> <strong>O coringa o ano todo:</strong> o <strong>Aquário de Londrina</strong>, no Parque Ney Braga, funciona o ano inteiro e é <strong>gratuito</strong> — sáb/dom das 9h às 17h, 15 aquários, mais de 40 espécies de peixes, ambiente interno. À prova de chuva.</li>\n      <li><span class=\"chip\">EVENTO</span> <strong>Dia dos Pais no Norte Pioneiro:</strong> Concurso da Rainha da EFAPI em Santo Antônio da Platina no <strong>sáb 08/08</strong>; a <strong>54ª EFAPI Expo</strong> em si vai de <strong>19 a 23/08</strong>.</li>\n      <li><span class=\"chip hot\">ATENÇÃO</span> <strong>A armadilha do ano no EnCena:</strong> a notícia \"20ª edição do EnCena começa em 21 de agosto\" é de <strong>2025</strong>. A <strong>21ª edição foi de 18 a 29/05/2026</strong> e já terminou — não há festival de teatro em agosto.</li>\n      <li><span class=\"chip\">ESCOLA</span> <strong>Semana normal:</strong> o 2º trimestre segue até <strong>04/09</strong>, sem recesso em agosto. O Dia dos Pais cai num domingo e não é feriado — na segunda tem aula normal.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Lunes 3 de agosto — y la semana tiene una forma muy clara. De hoy a miércoles el tiempo estará seco, a partir del jueves vuelve la lluvia, y justamente el <strong>Dia dos Pais, el domingo 09/08</strong>, es el día más lluvioso de la semana según el modelo: <strong>23,4 mm</strong>. Quien tenga planes al aire libre esta semana debe aprovechar los próximos tres días. Además, dos noticias que son correcciones y no novedades: el boletín más reciente de InfoGripe <strong>saca a Paraná del grupo en crecimiento</strong> — el panorama que esta edición trazó ayer ya tenía dos semanas. Y el festival de teatro EnCena, que ahora aparece en varias notas como \"a partir del 21 de agosto\", ya <strong>presentó su 21ª edición en mayo</strong>. Quien se guíe por esa fecha se está guiando por 2025.</p>\n    <ul>\n      <li><span class=\"chip good\">CLIMA</span> <strong>La ventana es ahora:</strong> hoy <strong>15–26 °C</strong> con 0,0 mm, martes 15–26 °C, miércoles 15–23 °C — los tres días con <strong>0 % de lluvia</strong>. Dos portales consultados de forma independiente coinciden.</li>\n      <li><span class=\"chip hot\">CLIMA</span> <strong>El cambio llega el jueves:</strong> jue <strong>8,3 mm</strong> (45 %), vie <strong>7,2 mm</strong> (41 %) — y dom 09/08 <strong>23,4 mm</strong> con máxima de apenas 24 °C. El Dia dos Pais es el día más lluvioso de la semana.</li>\n      <li><span class=\"chip\">CLIMA</span> <strong>Donde los portales discrepan:</strong> para el <strong>sáb 08/08</strong>, Climatempo prevé 40 % de chubascos, theweather prevé 0 % y \"despejado\". En la máxima coinciden: <strong>31–32 °C</strong>. Publicamos los dos valores.</li>\n      <li><span class=\"chip good\">SALUD</span> <strong>Paraná salió del grupo en crecimiento:</strong> InfoGripe <strong>SE 29/2026</strong> (30/07) enumera solo <strong>3 de 27</strong> estados con SRAG en aumento — Maranhão, RS, SC. Paraná ahora está entre los 12 con incidencia elevada, pero <em>no</em> creciente.</li>\n      <li><span class=\"chip hot\">BEBÉ</span> <strong>El nombre nuevo en el boletín:</strong> metapneumovirus — las hospitalizaciones aumentan \"<em>em todo o Sul</em>\", es decir, en todo el sur de Brasil. Para una niña de un mes, eso no cambia la precaución, solo su motivo.</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Sábado 08/08, gratis en Londrina:</strong> \"Churrasco do Paizão\" en el Londrina Norte Shopping desde las <strong>11:00</strong> — inflables, exhibición de autos antiguos, música en vivo, entrada libre.</li>\n      <li><span class=\"chip good\">PASEO</span> <strong>El comodín de todo el año:</strong> el <strong>Aquário de Londrina</strong>, en el Parque Ney Braga, abre todo el año y es <strong>gratuito</strong> — sáb/dom de 9:00 a 17:00, 15 acuarios, más de 40 especies de peces, bajo techo. A prueba de lluvia.</li>\n      <li><span class=\"chip\">EVENTO</span> <strong>Dia dos Pais en el Norte Pioneiro:</strong> Concurso da Rainha de la EFAPI en Santo Antônio da Platina el <strong>sáb 08/08</strong>; la <strong>54ª EFAPI Expo</strong> en sí se extiende del <strong>19 al 23/08</strong>.</li>\n      <li><span class=\"chip hot\">ATENCIÓN</span> <strong>La trampa del año con EnCena:</strong> la nota \"la 20ª edición del EnCena comienza el 21 de agosto\" es de <strong>2025</strong>. La <strong>21ª edición se realizó del 18 al 29/05/2026</strong> y ya terminó — no hay festival de teatro en agosto.</li>\n      <li><span class=\"chip\">ESCUELA</span> <strong>Semana normal:</strong> el 2º trimestre sigue hasta el <strong>04/09</strong>, sin receso en agosto. El Dia dos Pais cae en domingo y no es feriado — el lunes hay clases normales.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Montag, der 3. August — Rotationsthema <em>Wirtschaft &amp; Finanzen</em>, elfte Folge, und der Anlass steht heute im eigenen Haus: Der Economy-Brief desselben Tages meldet einen Brent-Preis von <strong>83,26 $ je Fass</strong>, <strong>−5,31 %</strong> an einem einzigen Tag nach 87,93 $ am 31. Juli. Der Real gibt nach, EUR/BRL steht Montagfrüh bei <strong>5,8582</strong> gegen den Freitags-Fix der EZB von 5,8095. Dazu drei Termine, die dieselbe Wortfamilie brauchen: Das Copom tagt Dienstag und Mittwoch über die Selic (seit dem 17.06. bei 14,25 %), die Fed hielt am 29. Juli bei 3,50–3,75 % — aber <strong>9:3</strong>, drei Mitglieder wollten <em>erhöhen</em> — und die Fazenda prüft, Brasiliens Ausgabenregel zu verschärfen. <strong>11 Einträge, davon 3 Verben mit voller Konjugation</strong>, plus 2 Auffrischungen vom 6. und 12. Juli.</p>\n    <ul>\n      <li><span class=\"chip\">KONJUGATION</span> <strong>endureço, aber endurezco</strong> — dasselbe lateinische Verb, zwei verschiedene Reparaturen für dasselbe Lautproblem: Portugiesisch schreibt in der 1. Person <em>eu endureço</em> (c → ç), Spanisch schiebt ein z ein: <em>yo endurezco</em>. Der Rest der Tabelle läuft in beiden Sprachen parallel. <span class=\"src\"><a href=\"https://www.conjugacao.com.br/verbo-endurecer/\">conjugacao.com.br</a> · <a href=\"https://conjugator.reverso.net/conjugation-spanish-verb-endurecer.html\">reverso.net</a></span></li>\n      <li><span class=\"chip hot\">FALSE FRIEND</span> <strong>aktuell = atual = actual ≠ „actual\"</strong> — alle drei romanisch-germanischen Formen heißen „gegenwärtig\", das englische <em>actual</em> dagegen „tatsächlich\". Heute hängt genau daran ein Kurs: der <em>aktuelle</em> EUR/BRL-Kurs 5,8582 ist nicht derselbe wie der letzte EZB-Fix 5,8095 vom Freitag. <span class=\"src\"><a href=\"https://br.investing.com/currencies/eur-brl\">br.investing.com</a> · <a href=\"https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-brl.en.html\">ecb.europa.eu</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>o arcabouço fiscal</strong> — Priberam führt <em>arcabouço</em> als „conjunto dos ossos de um vertebrado\", also als Knochengerüst, und im übertragenen Sinn als Gerüst eines Baus. Seit 2023 heißt so Brasiliens Haushaltsregel. Deutsch würde „Fiskalregel\" oder „Haushaltsrahmen\" sagen — Brasilien sagt „Gerippe\". <span class=\"src\"><a href=\"https://dicionario.priberam.org/arcabou%C3%A7o\">priberam.org</a> · <a href=\"https://www12.senado.leg.br/noticias/materias/2023/08/31/novo-arcabouco-fiscal-entra-em-vigencia-no-brasil\">senado.leg.br</a></span></li>\n      <li><span class=\"chip\">PHRASE</span> <strong>je Fass, nicht je Barrel</strong> — der Duden führt <em>das Barrel</em> als Hohlmaß und übersetzt es gleich selbst mit „Fass, Tonne\": für Petroleum in den USA 158,9871 Liter. In deutschen Wirtschaftsmeldungen steht deshalb „83,26 $ je Fass\", auf Portugiesisch und Spanisch schlicht <em>o barril</em> / <em>el barril</em>. <span class=\"src\"><a href=\"https://www.duden.de/rechtschreibung/Barrel\">duden.de</a> · <a href=\"https://tradingeconomics.com/commodity/brent-crude-oil\">tradingeconomics.com</a></span></li>\n      <li><span class=\"chip\">KONJUGATION</span> <strong>anheben ist stark <em>und</em> trennbar</strong> — beides zusammen ist selten: <em>ich hebe an</em>, <em>ich hob an</em>, <em>ich habe angehoben</em>, Konjunktiv II <em>ich höbe an</em>. Das ge- klemmt sich in die Mitte. Portugiesisch und Spanisch kennen dieses Auseinanderfallen gar nicht: <em>elevar</em>, <em>subir</em>. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/anheben.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip good\">IDIOM</span> <strong>die Zügel anziehen</strong> = <em>apertar as rédeas</em> = <em>apretar las riendas</em> — Duden führt „die Zügel straffer anziehen\" fürs Strengerwerden, Priberam die <em>rédea</em> übertragen als „direcção, poder, governo\". Drei Sprachen, ein Pferd. <span class=\"src\"><a href=\"https://www.duden.de/rechtschreibung/Zuegel\">duden.de</a> · <a href=\"https://dicionario.priberam.org/r%C3%A9dea\">priberam.org</a></span></li>\n    </ul></div>",

exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-brl.en.html\">ecb.europa.eu</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>o arcabouço fiscal</strong> — Priberam führt <em>arcabouço</em> als „conjunto dos ossos de um vertebrado\", also als Knochengerüst, und im übertragenen Sinn als Gerüst eines Baus. Seit 2023 heißt so Brasiliens Haushaltsregel. Deutsch würde „Fiskalregel\" oder „Haushaltsrahmen\" sagen — Brasilien sagt „Gerippe\". <span class=\"src\"><a href=\"https://dicionario.priberam.org/arcabou%C3%A7o\">priberam.org</a> · <a href=\"https://www12.senado.leg.br/noticias/materias/2023/08/31/novo-arcabouco-fiscal-entra-em-vigencia-no-brasil\">senado.leg.br</a></span></li>\n      <li><span class=\"chip\">PHRASE</span> <strong>je Fass, nicht je Barrel</strong> — der Duden führt <em>das Barrel</em> als Hohlmaß und übersetzt es gleich selbst mit „Fass, Tonne\": für Petroleum in den USA 158,9871 Liter. In deutschen Wirtschaftsmeldungen steht deshalb „83,26 $ je Fass\", auf Portugiesisch und Spanisch schlicht <em>o barril</em> / <em>el barril</em>. <span class=\"src\"><a href=\"https://www.duden.de/rechtschreibung/Barrel\">duden.de</a> · <a href=\"https://tradingeconomics.com/commodity/brent-crude-oil\">tradingeconomics.com</a></span></li>\n      <li><span class=\"chip\">KONJUGATION</span> <strong>anheben ist stark <em>und</em> trennbar</strong> — beides zusammen ist selten: <em>ich hebe an</em>, <em>ich hob an</em>, <em>ich habe angehoben</em>, Konjunktiv II <em>ich höbe an</em>. Das ge- klemmt sich in die Mitte. Portugiesisch und Spanisch kennen dieses Auseinanderfallen gar nicht: <em>elevar</em>, <em>subir</em>. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/anheben.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip good\">IDIOM</span> <strong>die Zügel anziehen</strong> = <em>apertar as rédeas</em> = <em>apretar las riendas</em> — Duden führt „die Zügel straffer anziehen\" fürs Strengerwerden, Priberam die <em>rédea</em> übertragen als „direcção, poder, governo\". Drei Sprachen, ein Pferd. <span class=\"src\"><a href=\"https://www.duden.de/rechtschreibung/Zuegel\">duden.de</a> · <a href=\"https://dicionario.priberam.org/r%C3%A9dea\">priberam.org</a></span></li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Monday, August 3 — rotation theme <em>Economy &amp; Finance</em>, eleventh installment, and this time the hook is right at home: today's Economy brief itself reports a Brent price of <strong>$83.26 per barrel</strong>, <strong>−5.31%</strong> in a single day, down from $87.93 on July 31. The real is weakening too — EUR/BRL stands at <strong>5.8582</strong> Monday morning against Friday's ECB fix of 5.8095. On top of that, three calendar events all need the same word family: the Copom meets Tuesday and Wednesday on the Selic rate (at 14.25% since June 17), the Fed held at 3.50–3.75% on July 29 — but <strong>9:3</strong>, three members wanted to <em>raise</em> it — and Brazil's treasury is weighing whether to tighten the spending rule. <strong>11 entries, 3 of them verbs with full conjugation</strong>, plus 2 refreshers from July 6 and July 12.</p>\n    <ul>\n      <li><span class=\"chip\">CONJUGATION</span> <strong>endureço, but endurezco</strong> — the same Latin verb, two different repairs for the same sound problem: Portuguese writes <em>eu endureço</em> in the 1st person (c → ç), Spanish inserts a z instead: <em>yo endurezco</em>. The rest of the table runs parallel in both languages. <span class=\"src\"><a href=\"https://www.conjugacao.com.br/verbo-endurecer/\">conjugacao.com.br</a> · <a href=\"https://conjugator.reverso.net/conjugation-spanish-verb-endurecer.html\">reverso.net</a></span></li>\n      <li><span class=\"chip hot\">FALSE FRIEND</span> <strong>aktuell = atual = actual ≠ \"actual\"</strong> — all three Romance/Germanic forms mean \"current,\" while English <em>actual</em> means \"tatsächlich,\" i.e. \"real.\" Today a real amount of money hinges on exactly that: the <em>current</em> EUR/BRL rate of 5.8582 is not the same as Friday's last ECB fix of 5.8095. <span class=\"src\"><a href=\"https://br.investing.com/currencies/eur-brl\">br.investing.com</a> · <a href=\"https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-brl.en.html\">ecb.europa.eu</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>o arcabouço fiscal</strong> — Priberam lists <em>arcabouço</em> as \"conjunto dos ossos de um vertebrado,\" i.e. a skeleton, and figuratively as the framework of a building. Since 2023 that's what Brazil calls its fiscal rule. English would say \"fiscal framework\" or \"spending framework\" — Brazil says \"skeleton.\" <span class=\"src\"><a href=\"https://dicionario.priberam.org/arcabou%C3%A7o\">priberam.org</a> · <a href=\"https://www12.senado.leg.br/noticias/materias/2023/08/31/novo-arcabouco-fiscal-entra-em-vigencia-no-brasil\">senado.leg.br</a></span></li>\n      <li><span class=\"chip\">PHRASE</span> <strong>per barrel, not per Barrel</strong> — Duden lists <em>das Barrel</em> as a unit of volume and translates it itself as \"Fass, Tonne\": for petroleum in the US, 158.9871 liters. That's why German business reports say \"83,26 $ je Fass,\" while Portuguese and Spanish simply say <em>o barril</em> / <em>el barril</em>. <span class=\"src\"><a href=\"https://www.duden.de/rechtschreibung/Barrel\">duden.de</a> · <a href=\"https://tradingeconomics.com/commodity/brent-crude-oil\">tradingeconomics.com</a></span></li>\n      <li><span class=\"chip\">CONJUGATION</span> <strong>anheben is strong <em>and</em> separable</strong> — that combination is rare: <em>ich hebe an</em>, <em>ich hob an</em>, <em>ich habe angehoben</em>, subjunctive II <em>ich höbe an</em>. The ge- wedges itself into the middle. Portuguese and Spanish don't know this split at all: <em>elevar</em>, <em>subir</em>. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/anheben.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip good\">IDIOM</span> <strong>die Zügel anziehen</strong> = <em>apertar as rédeas</em> = <em>apretar las riendas</em> — Duden lists \"die Zügel straffer anziehen\" for getting stricter, Priberam gives the figurative sense of <em>rédea</em> as \"direcção, poder, governo.\" Three languages, one horse. <span class=\"src\"><a href=\"https://www.duden.de/rechtschreibung/Zuegel\">duden.de</a> · <a href=\"https://dicionario.priberam.org/r%C3%A9dea\">priberam.org</a></span></li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Segunda-feira, 3 de agosto — tema da rotação <em>Economia &amp; Finanças</em>, décima primeira edição, e hoje o gancho está em casa: o próprio brief de Economia do mesmo dia registra um preço do Brent de <strong>US$ 83,26 o barril</strong>, <strong>−5,31%</strong> em um único dia, depois de US$ 87,93 em 31 de julho. O real cede junto, e o EUR/BRL está em <strong>5,8582</strong> na manhã de segunda-feira, contra o fixing de sexta-feira do BCE de 5,8095. Além disso, três compromissos que precisam da mesma família de palavras: o Copom se reúne terça e quarta-feira para decidir a Selic (em 14,25% desde 17/06), o Fed manteve a taxa em 3,50–3,75% em 29 de julho — mas por <strong>9 a 3</strong>, três membros queriam <em>subir</em> — e a Fazenda estuda endurecer a regra de gastos do Brasil. <strong>11 entradas, 3 delas verbos com conjugação completa</strong>, mais 2 revisões de 6 e 12 de julho.</p>\n    <ul>\n      <li><span class=\"chip\">CONJUGAÇÃO</span> <strong>endureço, mas endurezco</strong> — o mesmo verbo latino, dois reparos diferentes para o mesmo problema de som: o português escreve <em>eu endureço</em> na 1ª pessoa (c → ç), o espanhol insere um z: <em>yo endurezco</em>. O resto da tabela segue em paralelo nas duas línguas. <span class=\"src\"><a href=\"https://www.conjugacao.com.br/verbo-endurecer/\">conjugacao.com.br</a> · <a href=\"https://conjugator.reverso.net/conjugation-spanish-verb-endurecer.html\">reverso.net</a></span></li>\n      <li><span class=\"chip hot\">FALSO COGNATO</span> <strong>aktuell = atual = actual ≠ \"actual\"</strong> — as três formas românicas/germânicas significam \"atual, do presente\", enquanto o inglês <em>actual</em> quer dizer \"de fato, real\". Hoje é exatamente disso que depende uma quantia em dinheiro: a cotação <em>atual</em> do EUR/BRL, 5,8582, não é a mesma coisa que o último fixing do BCE de sexta-feira, 5,8095. <span class=\"src\"><a href=\"https://br.investing.com/currencies/eur-brl\">br.investing.com</a> · <a href=\"https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-brl.en.html\">ecb.europa.eu</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>o arcabouço fiscal</strong> — o Priberam registra <em>arcabouço</em> como \"conjunto dos ossos de um vertebrado\", ou seja, um esqueleto, e no sentido figurado como a estrutura de uma construção. Desde 2023 é assim que o Brasil chama sua regra fiscal. O alemão diria \"Fiskalregel\" (regra fiscal) ou \"Haushaltsrahmen\" (quadro orçamentário) — o Brasil diz \"esqueleto\". <span class=\"src\"><a href=\"https://dicionario.priberam.org/arcabou%C3%A7o\">priberam.org</a> · <a href=\"https://www12.senado.leg.br/noticias/materias/2023/08/31/novo-arcabouco-fiscal-entra-em-vigencia-no-brasil\">senado.leg.br</a></span></li>\n      <li><span class=\"chip\">FRASE</span> <strong>je Fass, não je Barrel</strong> — o Duden registra <em>das Barrel</em> como unidade de volume e já o traduz na mesma entrada como \"Fass, Tonne\": para petróleo nos EUA, 158,9871 litros. Por isso, nas notícias econômicas alemãs se lê \"83,26 $ je Fass\", enquanto em português e espanhol se diz simplesmente <em>o barril</em> / <em>el barril</em>. <span class=\"src\"><a href=\"https://www.duden.de/rechtschreibung/Barrel\">duden.de</a> · <a href=\"https://tradingeconomics.com/commodity/brent-crude-oil\">tradingeconomics.com</a></span></li>\n      <li><span class=\"chip\">CONJUGAÇÃO</span> <strong>anheben é forte <em>e</em> separável</strong> — a combinação é rara: <em>ich hebe an</em>, <em>ich hob an</em>, <em>ich habe angehoben</em>, subjuntivo II <em>ich höbe an</em>. O ge- se encaixa bem no meio. Português e espanhol não conhecem essa separação: <em>elevar</em>, <em>subir</em>. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/anheben.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip good\">EXPRESSÃO</span> <strong>die Zügel anziehen</strong> = <em>apertar as rédeas</em> = <em>apretar las riendas</em> — o Duden registra \"die Zügel straffer anziehen\" para ficar mais rígido, o Priberam traz a <em>rédea</em> no sentido figurado como \"direcção, poder, governo\". Três línguas, um só cavalo. <span class=\"src\"><a href=\"https://www.duden.de/rechtschreibung/Zuegel\">duden.de</a> · <a href=\"https://dicionario.priberam.org/r%C3%A9dea\">priberam.org</a></span></li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Lunes 3 de agosto — tema de la rotación <em>Economía y finanzas</em>, undécima entrega, y hoy el gancho está en casa: el propio boletín de Economía del mismo día reporta un precio del Brent de <strong>US$ 83,26 por barril</strong>, <strong>−5,31%</strong> en un solo día, tras los US$ 87,93 del 31 de julio. El real también cede, y el EUR/BRL está en <strong>5,8582</strong> este lunes por la mañana frente al fix del viernes del BCE de 5,8095. Además hay tres citas que necesitan la misma familia de palabras: el Copom se reúne martes y miércoles para decidir sobre la Selic (en 14,25% desde el 17/06), la Fed mantuvo su tasa en 3,50–3,75% el 29 de julio — pero por <strong>9 a 3</strong>, tres miembros querían <em>subirla</em> — y la hacienda brasileña estudia endurecer la regla de gasto del país. <strong>11 entradas, 3 de ellas verbos con conjugación completa</strong>, más 2 repasos del 6 y el 12 de julio.</p>\n    <ul>\n      <li><span class=\"chip\">CONJUGACIÓN</span> <strong>endureço, pero endurezco</strong> — el mismo verbo latino, dos reparaciones distintas para el mismo problema de sonido: el portugués escribe <em>eu endureço</em> en la 1ª persona (c → ç), el español inserta una z: <em>yo endurezco</em>. El resto de la tabla corre en paralelo en ambos idiomas. <span class=\"src\"><a href=\"https://www.conjugacao.com.br/verbo-endurecer/\">conjugacao.com.br</a> · <a href=\"https://conjugator.reverso.net/conjugation-spanish-verb-endurecer.html\">reverso.net</a></span></li>\n      <li><span class=\"chip hot\">FALSO AMIGO</span> <strong>aktuell = atual = actual ≠ \"actual\"</strong> — las tres formas románicas/germánicas significan \"vigente, del momento\", mientras que el inglés <em>actual</em> significa \"real, verdadero\". Hoy justo de eso depende una cantidad de dinero: la cotización <em>actual</em> del EUR/BRL, 5,8582, no es lo mismo que el último fix del BCE del viernes, 5,8095. <span class=\"src\"><a href=\"https://br.investing.com/currencies/eur-brl\">br.investing.com</a> · <a href=\"https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-brl.en.html\">ecb.europa.eu</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>o arcabouço fiscal</strong> — el Priberam registra <em>arcabouço</em> como \"conjunto dos ossos de um vertebrado\", es decir, un esqueleto, y en sentido figurado como el armazón de una construcción. Desde 2023 así le llama Brasil a su regla fiscal. El alemán diría \"Fiskalregel\" (regla fiscal) o \"Haushaltsrahmen\" (marco presupuestario) — Brasil dice \"esqueleto\". <span class=\"src\"><a href=\"https://dicionario.priberam.org/arcabou%C3%A7o\">priberam.org</a> · <a href=\"https://www12.senado.leg.br/noticias/materias/2023/08/31/novo-arcabouco-fiscal-entra-em-vigencia-no-brasil\">senado.leg.br</a></span></li>\n      <li><span class=\"chip\">FRASE</span> <strong>je Fass, no je Barrel</strong> — el Duden registra <em>das Barrel</em> como unidad de volumen y, en la misma entrada, ya lo traduce como \"Fass, Tonne\": para petróleo en Estados Unidos, 158,9871 litros. Por eso en las noticias económicas alemanas se lee \"83,26 $ je Fass\", mientras que en portugués y español se dice simplemente <em>o barril</em> / <em>el barril</em>. <span class=\"src\"><a href=\"https://www.duden.de/rechtschreibung/Barrel\">duden.de</a> · <a href=\"https://tradingeconomics.com/commodity/brent-crude-oil\">tradingeconomics.com</a></span></li>\n      <li><span class=\"chip\">CONJUGACIÓN</span> <strong>anheben es fuerte <em>y</em> separable</strong> — esa combinación es rara: <em>ich hebe an</em>, <em>ich hob an</em>, <em>ich habe angehoben</em>, subjuntivo II <em>ich höbe an</em>. El ge- se mete justo en medio. Portugués y español no conocen esta separación: <em>elevar</em>, <em>subir</em>. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/anheben.htm\">verbformen.de</a></span></li>\n      <li>
