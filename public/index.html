nen zwei Jahren, 21 % haben ein reifes Governance-Modell dafür.<sup>[13]</sup></li>\n      <li><span class=\"chip good\">twiceD</span> Zwei Ideen genau aus diesen zwei Meldungen: der <strong>Modell-Exit</strong> als bezahlter Beweis statt als Absichtserklärung — und <strong>der Umschalter</strong>, die Mensch-Übergabe als nachweisbares Bauteil.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Anyone with an AI feature in production has an emergency exit planned — and for most, it's called <em>\"we'll just switch to an open model.\"</em> Overnight, that emergency exit got its first public stress test, and it's narrower than expected: Alibaba shipped the promised open weights for <strong>Qwen3.8-Max</strong>, but trimmed — no vision, a shorter default context, its own license. This isn't a rumor; it's in the model card on Hugging Face: Alibaba itself lists what only the paid cloud version can do. Second story, opposite direction: an F-16 under AI control — interesting not because of the fighter jet, but because of one sentence about how it was built. And in California, a procedural step today decides the fate of roughly 30 AI bills, without anyone having to vote against them.</p>\n    <ul>\n      <li><span class=\"chip hot\">DEPLOY · CN</span> <strong>Open weights with an asterisk:</strong> the model card for <strong>Qwen3.8-2.4T-A95B</strong> says it outright — <em>\"a text-only model\"</em>, <em>\"Multimodal inputs are not supported\"</em>, context <strong>262,144</strong> tokens natively instead of the API's 1M. The API variant reportedly has <em>\"more features, such as vision input &amp; non-thinking support, 1M context length by default, official built-in tools\"</em>.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">POSITION</span> <strong>This isn't a glitch, it's product policy</strong> — and the forum read it exactly that way: <em>\"removing vision is clearly a push for people to use their cloud endpoint so they can make money\"</em>.<sup>[3]</sup> The point, for me, isn't the outrage — it's the lesson: \"open weights\" isn't a feature of the product, it's a lever the vendor holds.</li>\n      <li><span class=\"chip\">CONTEXT</span> <strong>Even the full version wouldn't be a way out:</strong> 2.4 trillion parameters total, 95 billion active per token<sup>[1]</sup> — memory footprint tracks the first number. On price: Alibaba's Max API costs <strong>$2.00</strong> / <strong>$6.00</strong> per 1M input/output tokens<sup>[2]</sup>, a Germany-hosted endpoint for a large open Qwen runs <strong>€0.60</strong> / <strong>€3.60</strong> — different model, so no swap without testing.<sup>[15]</sup></li>\n      <li><span class=\"chip\">PUBLIC · US</span> <strong>AI flies an F-16 — the important sentence is the boring one:</strong> DARPA and the US Air Force automated flight controls and sensors on a standard F-16, <em>\"without changing the jet's core software\"</em>, with a human/AI toggle <em>\"with the flip of a switch.\"</em> Six jets, Eglin AFB, AI-controlled flights since July 2026, a safety pilot always on board.<sup>[6][7]</sup></li>\n      <li><span class=\"chip hot\">POLICY · US</span> <strong>Today in California:</strong> the budget committees in both chambers begin their suspense-file votes — bills without a majority are dead for this legislative session.<sup>[8]</sup> The widely cited figure of roughly 30 AI bills comes from a secondary source that couldn't be opened directly.<sup>[9]</sup></li>\n      <li><span class=\"chip\">REG · EU</span> <strong>Eleven days of enforcement:</strong> since 2026-08-02, the Commission can actually penalize GPAI violations — up to €15 million or 3% of global turnover, retroactive to violations since 2025-08-02.<sup>[10]</sup> Illinois is taking the opposite path: mandatory third-party audits starting 2028.<sup>[11]</sup></li>\n      <li><span class=\"chip good\">STUDY · DE</span> <strong>The baseline all this lands on:</strong> 51.2% of German SMEs use or are testing AI, AI agents have nearly doubled to 16.6% — but the survey is from November 2025, and one co-publisher is an AI vendor.<sup>[12]</sup> Against that: 74% plan to deploy agentic AI within two years, only 21% have a mature governance model for it.<sup>[13]</sup></li>\n      <li><span class=\"chip good\">twiceD</span> Two ideas straight out of these two stories: the <strong>model exit</strong> as a paid proof instead of a statement of intent — and <strong>the switch</strong>, human handoff as a verifiable component.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Quem tem um recurso de IA em produção também tem uma saída de emergência planejada — e para a maioria ela se chama <em>\"aí a gente usa um modelo aberto\"</em>. Durante a noite, essa saída de emergência foi testada publicamente pela primeira vez, e ela é mais estreita do que se imaginava: a Alibaba entregou os pesos abertos prometidos do <strong>Qwen3.8-Max</strong>, mas cortados — sem compreensão de imagem, contexto padrão mais curto, licença própria. Isso não está em um boato, e sim na ficha do modelo no Hugging Face: a própria Alibaba lista o que só a versão paga na nuvem consegue fazer. Segunda história, direção oposta: um F-16 sob controle de IA — interessante não pelo caça, mas por uma frase sobre a forma como foi construído. E na Califórnia, hoje uma etapa processual decide o destino de cerca de 30 projetos de lei de IA, sem que ninguém precise votar contra.</p>\n    <ul>\n      <li><span class=\"chip hot\">DEPLOY · CN</span> <strong>Pesos abertos com asterisco:</strong> a ficha do modelo <strong>Qwen3.8-2.4T-A95B</strong> diz isso com todas as letras — <em>\"a text-only model\"</em>, <em>\"Multimodal inputs are not supported\"</em>, contexto de <strong>262.144</strong> tokens nativamente em vez do 1 milhão da API. A variante de API teria, segundo a ficha, <em>\"more features, such as vision input &amp; non-thinking support, 1M context length by default, official built-in tools\"</em>.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">POSIÇÃO</span> <strong>Isso não é uma falha, é política de produto</strong> — e foi lido exatamente assim no fórum: <em>\"removing vision is clearly a push for people to use their cloud endpoint so they can make money\"</em>.<sup>[3]</sup> O ponto, para mim, não é a indignação, e sim a lição: \"pesos abertos\" não é uma característica do produto, é uma alavanca nas mãos do fornecedor.</li>\n      <li><span class=\"chip\">CONTEXTUALIZAÇÃO</span> <strong>Nem a versão completa seria uma saída:</strong> 2,4 trilhões de parâmetros no total, 95 bilhões ativados por token<sup>[1]</sup> — a memória depende do primeiro número. No preço: a API Max da Alibaba custa <strong>US$ 2,00</strong> / <strong>US$ 6,00</strong> por 1 milhão de tokens de entrada/saída<sup>[2]</sup>, um endpoint hospedado na Alemanha para um grande Qwen aberto sai por <strong>€ 0,60</strong> / <strong>€ 3,60</strong> — modelo diferente, então nada de trocar sem testar.<sup>[15]</sup></li>\n      <li><span class=\"chip\">PUBLIC · US</span> <strong>IA pilota um F-16 — a frase importante é a chata:</strong> a DARPA e a Força Aérea dos EUA automatizaram os controles de voo e os sensores de um F-16 padrão, <em>\"without changing the jet's core software\"</em>, com uma chave de alternância entre humano e IA <em>\"with the flip of a switch\"</em>. Seis jatos, base de Eglin, voos controlados por IA desde julho de 2026, piloto de segurança sempre a bordo.<sup>[6][7]</sup></li>\n      <li><span class=\"chip hot\">POLICY · US</span> <strong>Hoje na Califórnia:</strong> as comissões de orçamento das duas câmaras começam suas votações do chamado <em>suspense file</em> — projetos sem maioria estão mortos para esta sessão legislativa.<sup>[8]</sup> O número de cerca de 30 projetos de IA que circula por aí vem de uma fonte secundária que não pôde ser aberta diretamente.<sup>[9]</sup></li>\n      <li><span class=\"chip\">REG · UE</span> <strong>Onze dias de fiscalização:</strong> desde 02/08/2026, a Comissão pode de fato punir violações de GPAI — até € 15 milhões ou 3 % do faturamento mundial, retroativo a violações desde 02/08/2025.<sup>[10]</sup> Illinois segue o caminho oposto: auditorias obrigatórias por terceiros a partir de 2028.<sup>[11]</sup></li>\n      <li><span class=\"chip good\">ESTUDO · DE</span> <strong>A base sobre a qual tudo isso acontece:</strong> 51,2 % das pequenas e médias empresas alemãs usam ou testam IA, os agentes de IA quase dobraram para 16,6 % — mas a pesquisa é de novembro de 2025, e uma das coeditoras é uma fornecedora de IA.<sup>[12]</sup> Em contraste: 74 % planejam usar IA agêntica em até dois anos, só 21 % têm um modelo de governança maduro para isso.<sup>[13]</sup></li>\n      <li><span class=\"chip good\">twiceD</span> Duas ideias direto dessas duas notícias: a <strong>saída de modelo</strong> como prova paga em vez de declaração de intenção — e <strong>o interruptor</strong>, a transferência humana como componente comprovável.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Quien tiene una función de IA en producción también tiene planeada una salida de emergencia — y para la mayoría se llama <em>\"entonces usamos un modelo abierto\"</em>. Durante la noche, esa salida de emergencia se puso a prueba en público por primera vez, y resulta más angosta de lo esperado: Alibaba entregó los pesos abiertos prometidos de <strong>Qwen3.8-Max</strong>, pero recortados — sin comprensión de imágenes, contexto estándar más corto, licencia propia. Esto no está en un rumor, sino en la ficha del modelo en Hugging Face: la propia Alibaba enumera lo que solo la versión de pago en la nube puede hacer. Segunda historia, dirección opuesta: un F-16 bajo control de IA — interesante no por el caza, sino por una frase sobre cómo se construyó. Y en California, hoy un paso procesal decide el destino de unos 30 proyectos de ley de IA, sin que nadie tenga que votar en contra.</p>\n    <ul>\n      <li><span class=\"chip hot\">DEPLOY · CN</span> <strong>Pesos abiertos con asterisco:</strong> la ficha del modelo <strong>Qwen3.8-2.4T-A95B</strong> lo dice sin rodeos — <em>\"a text-only model\"</em>, <em>\"Multimodal inputs are not supported\"</em>, contexto de <strong>262.144</strong> tokens de forma nativa en lugar del millón de la API. La variante de API tendría, según la ficha, <em>\"more features, such as vision input &amp; non-thinking support, 1M context length by default, official built-in tools\"</em>.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">POSICIÓN</span> <strong>Esto no es una falla, es política de producto</strong> — y así se leyó exactamente en el foro: <em>\"removing vision is clearly a push for people to use their cloud endpoint so they can make money\"</em>.<sup>[3]</sup> El punto, para mí, no es la indignación, sino la lección: \"pesos abiertos\" no es una característica del producto, es una palanca en manos del proveedor.</li>\n      <li><span class=\"chip\">CONTEXTO</span> <strong>Ni siquiera la versión completa sería una salida:</strong> 2,4 billones de parámetros en total, 95 mil millones activos por token<sup>[1]</sup> — la memoria depende del primer número. En precio: la API Max de Alibaba cuesta <strong>US$ 2,00</strong> / <strong>US$ 6,00</strong> por 1 millón de tokens de entrada/salida<sup>[2]</sup>, un endpoint alojado en Alemania para un Qwen abierto grande sale en <strong>€ 0,60</strong> / <strong>€ 3,60</strong> — modelo distinto, así que nada de cambiar sin probar antes.<sup>[15]</sup></li>\n      <li><span class=\"chip\">PUBLIC · US</span> <strong>La IA pilotea un F-16 — la frase importante es la aburrida:</strong> la DARPA y la Fuerza Aérea de EE. UU. automatizaron los controles de vuelo y los sensores de un F-16 estándar, <em>\"without changing the jet's core software\"</em>, con un interruptor humano/IA <em>\"with the flip of a switch\"</em>. Seis cazas, base de Eglin, vuelos controlados por IA desde julio de 2026, piloto de seguridad siempre a bordo.<sup>[6][7]</sup></li>\n      <li><span class=\"chip hot\">POLICY · US</span> <strong>Hoy en California:</strong> los comités de presupuesto de ambas cámaras comienzan sus votaciones del llamado <em>suspense file</em> — los proyectos sin mayoría quedan muertos para esta sesión legislativa.<sup>[8]</sup> La cifra de unos 30 proyectos de IA que circula por todas partes viene de una fuente secundaria que no se pudo abrir directamente.<sup>[9]</sup></li>\n      <li><span class=\"chip\">REG · UE</span> <strong>Once días de fiscalización:</strong> desde el 02/08/2026, la Comisión puede sancionar de verdad las violaciones de GPAI — hasta € 15 millones o 3 % de la facturación mundial, retroactivo a violaciones desde el 02/08/2025.<sup>[10]</sup> Illinois sigue el camino opuesto: auditorías obligatorias por terceros a partir de 2028.<sup>[11]</sup></li>\n      <li><span class=\"chip good\">ESTUDIO · DE</span> <strong>La base sobre la que cae todo esto:</strong> 51,2 % de las pymes alemanas usan o están probando IA, los agentes de IA casi se duplicaron a 16,6 % — pero la encuesta es de noviembre de 2025, y una de las coeditoras es una proveedora de IA.<sup>[12]</sup> En contraste: 74 % planea usar IA agéntica en dos años, solo 21 % tiene un modelo de gobernanza maduro para ello.<sup>[13]</sup></li>\n      <li><span class=\"chip good\">twiceD</span> Dos ideas que salen directo de estas dos noticias: la <strong>salida de modelo</strong> como prueba pagada en vez de declaración de intenciones — y <strong>el interruptor</strong>, la transferencia humana como componente comprobable.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Diese Spur hat heute zum ersten Mal ihr Mengenziel erreicht: <strong>drei</strong> aktive deutsche Software-Ausschreibungen im Filter statt einer. Der Fund ist allerdings ein zweischneidiger. Die beiden neuen — der Dataport-Rahmenvertrag „SAID\" und das sächsische Projekt „KARLAS\" — tragen im eForm beide dasselbe Feld: <em>„geeignet für kleine und mittlere Unternehmen: nein\"</em>. Dataport beziffert das sogar: <strong>8 Mio. € Mindestjahresumsatz</strong> für Los 1, <strong>20 Mio. €</strong> für Los 2, in <em>jedem</em> der letzten drei Geschäftsjahre, Unterschreiten heißt zwingender Ausschluss. Genau eine der drei Bekanntmachungen ist ausdrücklich für Freelancer markiert, verlangt ein einziges Eignungskriterium und keine Personalnamen — und deren Rückfragefrist läuft <strong>heute um 23:59 MESZ</strong> ab.</p>\n    <ul>\n      <li><span class=\"chip hot\">Frist</span> <strong>Heute 23:59 MESZ endet die Rückfragefrist</strong> zur Ausschreibung „Dienstleistungen TCK Testautomation\" der Oberfinanzdirektion Baden-Württemberg (TED 512867-2026). Heute erneut im PDF-Volltext geprüft: Versionsstand <strong>01</strong>, keine Änderungs- und keine Aufhebungsbekanntmachung. Angebotsfrist bleibt <strong>25.08., 11:00 MESZ</strong>.<sup>[1]</sup></li>\n      <li><span class=\"chip good\">Neu</span> <strong>Zwei weitere aktive Ausschreibungen gefunden und im Volltext gelesen</strong> — Dataport AöR, Rahmenvertrag „Software, AI &amp; Digital Services\" (TED 514376-2026, Teilnahmefrist <strong>24.08., 12:00 MESZ</strong>) und das Landesamt für Umwelt, Landwirtschaft und Geologie Sachsen, „KARLAS\" (TED 524134-2026, Angebotsfrist <strong>07.09., 23:59 MESZ</strong>).<sup>[2][3]</sup></li>\n      <li><span class=\"chip hot\">Umsatzhürde</span> <strong>Dataport verlangt harte Umsatzzahlen</strong>: Los 1 mindestens <strong>8 Mio. €</strong> Gesamtumsatz pro Jahr in den letzten drei Geschäftsjahren, Los 2 <strong>20 Mio. €</strong>, Los 3 <strong>5 Mio. €</strong> allein im Bereich KI &amp; Daten. Wörtlich: „der Teilnahmeantrag ist dann zwingend vom Verfahren auszuschließen\".<sup>[2]</sup></li>\n      <li><span class=\"chip hot\">Referenzen</span> <strong>Dazu drei Referenzprojekte à mindestens 200.000 €</strong> — und zwar „ausschließlich Referenzen im öffentlichen Sektor aus Deutschland\". Am Ende der ersten Stufe werden genau <strong>neun</strong> Bewerber zum Verhandlungsverfahren eingeladen. Die Rückfragefrist dieser Vergabe ist bereits am 10.08. abgelaufen.<sup>[2]</sup></li>\n      <li><span class=\"chip good\">Kontrast</span> <strong>Die OFD-Ausschreibung verlangt genau ein Eignungskriterium</strong> — Bankbestätigung oder Berufshaftpflicht-Nachweis. Personalnamen: „Not required\". Und sie ist als geeignet für <em>freelance</em>, <em>selbst</em>, <em>startup</em> markiert. Von den drei Bekanntmachungen ist sie die einzige mit „KMU geeignet: ja\".<sup>[1][2][3]</sup></li>\n      <li><span class=\"chip\">Board</span> <strong>99 Listings</strong> (85 Freelance, 8 Employee, 6 Intriguing): <strong>+3 / −1</strong>. Der erste Abgang mit nachvollziehbarem Grund seit Beginn dieser Zählung: Constaff, AUTOSAR-Klimatisierung — Bewerbungsfrist am <strong>29.07. abgelaufen</strong>. Median <strong>67</strong>, Spitze <strong>83</strong>, fünf Einträge ≥ 80: elfter Lauf in Folge unverändert.</li>\n      <li><span class=\"chip\">twiceD</span> <strong>Bester Zugang seit Tagen wieder in der oberen Hälfte</strong>: <strong>Montash</strong>, Angular- und Java/Spring-Fullstack für den Versicherungssektor, München, 100 % remote, 90–115 €/h*, Fit <strong>71</strong> — <strong>Platz 28 von 99</strong>.</li>\n      <li><span class=\"chip hot\">Employee</span> <strong>Personio steht namentlich auf der Wunschliste dieses Profils — und landet auf Platz 95.</strong> „Staff Software Engineer – AI\", München/Berlin/Dublin, Fit <strong>54</strong>. Der Grund ist nicht die Firma: zwei Bürotage pro Woche und ein Python-Kern ohne Java/Angular.</li>\n      <li><span class=\"chip hot\">Frische</span> <strong>6 von 99 Einträgen wurden heute angefasst</strong> (3 Zugänge, 3 Nachprüfungen). Die übrigen <strong>93</strong> tragen „carried forward from 2026-08-12\" und wurden heute nicht einzeln geöffnet. Kein neues Rate-Signal: Freelancer-Kompass unverändert, Details im Market Pulse.<sup>[4][5]</sup></li>\n    </ul></div>",

        "en": "<div class=\"tldr\"><p class=\"lead\">This track hit its volume target for the first time today: three active German software tenders in the filter instead of one. The find cuts both ways, though. The two new ones — Dataport's \"SAID\" framework agreement and Saxony's \"KARLAS\" project — both carry the same eForm field: <em>\"suitable for small and medium-sized enterprises: no.\"</em> Dataport even puts a number on it: <strong>€8 million minimum annual revenue</strong> for Lot 1, <strong>€20 million</strong> for Lot 2, in <em>each</em> of the last three fiscal years — falling short means mandatory exclusion. Exactly one of the three notices is explicitly marked for freelancers, requires a single eligibility criterion, and no named staff — and its question deadline expires <strong>tonight at 23:59 CEST</strong>.</p>\n    <ul>\n      <li><span class=\"chip hot\">Deadline</span> <strong>Today at 23:59 CEST the question deadline ends</strong> for the \"TCK Test Automation Services\" tender from the Oberfinanzdirektion Baden-Württemberg (TED 512867-2026). Re-checked in the full-text PDF again today: version status <strong>01</strong>, no amendment notice, no cancellation notice. The tender deadline stays at <strong>2026-08-25, 11:00 CEST</strong>.<sup>[1]</sup></li>\n      <li><span class=\"chip good\">New</span> <strong>Two more active tenders found and read in full</strong> — Dataport AöR, framework agreement \"Software, AI &amp; Digital Services\" (TED 514376-2026, participation deadline <strong>2026-08-24, 12:00 CEST</strong>) and the Landesamt für Umwelt, Landwirtschaft und Geologie Sachsen, \"KARLAS\" (TED 524134-2026, tender deadline <strong>2026-09-07, 23:59 CEST</strong>).<sup>[2][3]</sup></li>\n      <li><span class=\"chip hot\">Revenue Floor</span> <strong>Dataport demands hard revenue numbers</strong>: Lot 1 at least <strong>€8 million</strong> total annual revenue in each of the last three fiscal years, Lot 2 <strong>€20 million</strong>, Lot 3 <strong>€5 million</strong> in the AI &amp; data field alone. Verbatim: \"the participation request must then be mandatorily excluded from the procedure.\"<sup>[2]</sup></li>\n      <li><span class=\"chip hot\">References</span> <strong>Plus three reference projects at €200,000 or more each</strong> — and specifically \"exclusively public-sector references from Germany.\" At the end of the first stage, exactly <strong>nine</strong> applicants are invited into the negotiation procedure. This tender's question deadline already expired on 2026-08-10.<sup>[2]</sup></li>\n      <li><span class=\"chip good\">Contrast</span> <strong>The OFD tender requires exactly one eligibility criterion</strong> — a bank confirmation or proof of professional liability insurance. Named staff: \"Not required.\" And it's flagged as suitable for <em>freelance</em>, <em>self-employed</em>, <em>startup</em>. Of the three notices, it's the only one with \"SME-suitable: yes.\"<sup>[1][2][3]</sup></li>\n      <li><span class=\"chip\">Board</span> <strong>99 listings</strong> (85 freelance, 8 employee, 6 intriguing): <strong>+3 / −1</strong>. The first departure with a traceable reason since this count began: Constaff, AUTOSAR climate control — application deadline expired <strong>2026-07-29</strong>. Median <strong>67</strong>, top <strong>83</strong>, five entries ≥ 80: unchanged for the eleventh run in a row.</li>\n      <li><span class=\"chip\">twiceD</span> <strong>Best new entry in days back in the upper half</strong>: <strong>Montash</strong>, Angular and Java/Spring fullstack for the insurance sector, Munich, 100% remote, €90–115/h*, Fit <strong>71</strong> — <strong>rank 28 of 99</strong>.</li>\n      <li><span class=\"chip hot\">Employee</span> <strong>Personio is named on this profile's wish list — and lands at rank 95.</strong> \"Staff Software Engineer – AI,\" Munich/Berlin/Dublin, Fit <strong>54</strong>. The reason isn't the company: two office days a week and a Python core without Java/Angular.</li>\n      <li><span class=\"chip hot\">Freshness</span> <strong>6 of 99 entries were touched today</strong> (3 additions, 3 re-checks). The remaining <strong>93</strong> carry \"carried forward from 2026-08-12\" and weren't individually opened today. No new rate signal: Freelancer Compass unchanged, details in Market Pulse.<sup>[4][5]</sup></li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Esta trilha atingiu hoje, pela primeira vez, sua meta de volume: três licitações ativas de software alemãs no filtro, em vez de uma. O achado, porém, é uma faca de dois gumes. As duas novas — o contrato-quadro \"SAID\" da Dataport e o projeto saxônico \"KARLAS\" — trazem no eForm o mesmo campo: <em>\"adequado para pequenas e médias empresas: não\"</em>. A Dataport chega a colocar números nisso: <strong>€ 8 milhões de faturamento mínimo anual</strong> para o Lote 1, <strong>€ 20 milhões</strong> para o Lote 2, em <em>cada um</em> dos últimos três exercícios fiscais — ficar abaixo disso significa exclusão obrigatória. Exatamente uma das três licitações está explicitamente marcada para freelancers, exige um único critério de habilitação e nenhum nome de equipe — e o prazo de perguntas dela termina <strong>hoje à noite, às 23h59 CEST</strong>.</p>\n    <ul>\n      <li><span class=\"chip hot\">Prazo</span> <strong>Hoje às 23h59 CEST termina o prazo de perguntas</strong> da licitação \"Dienstleistungen TCK Testautomation\" da Oberfinanzdirektion Baden-Württemberg (TED 512867-2026). Verificado de novo hoje no PDF na íntegra: versão <strong>01</strong>, sem aviso de alteração e sem aviso de cancelamento. O prazo da proposta continua em <strong>25/08/2026, 11h00 CEST</strong>.<sup>[1]</sup></li>\n      <li><span class=\"chip good\">Novidade</span> <strong>Mais duas licitações ativas encontradas e lidas na íntegra</strong> — Dataport AöR, contrato-quadro \"Software, AI &amp; Digital Services\" (TED 514376-2026, prazo de participação <strong>24/08/2026, 12h00 CEST</strong>) e o Landesamt für Umwelt, Landwirtschaft und Geologie Sachsen, \"KARLAS\" (TED 524134-2026, prazo da proposta <strong>07/09/2026, 23h59 CEST</strong>).<sup>[2][3]</sup></li>\n      <li><span class=\"chip hot\">Piso de Faturamento</span> <strong>A Dataport exige números duros de faturamento</strong>: Lote 1 no mínimo <strong>€ 8 milhões</strong> de faturamento total anual em cada um dos últimos três exercícios fiscais, Lote 2 <strong>€ 20 milhões</strong>, Lote 3 <strong>€ 5 milhões</strong> só na área de IA e dados. Literalmente: \"a candidatura deve então ser obrigatoriamente excluída do processo.\"<sup>[2]</sup></li>\n      <li><span class=\"chip hot\">Referências</span> <strong>Além de três projetos de referência de € 200.000 ou mais cada</strong> — e especificamente \"exclusivamente referências do setor público da Alemanha\". Ao final da primeira etapa, exatamente <strong>nove</strong> candidatos são convidados ao procedimento negociado. O prazo de perguntas dessa licitação já venceu em 10/08/2026.<sup>[2]</sup></li>\n      <li><span class=\"chip good\">Contraste</span> <strong>A licitação da OFD exige exatamente um critério de habilitação</strong> — confirmação bancária ou comprovante de seguro de responsabilidade civil profissional. Nomes da equipe: \"Não exigido.\" E está marcada como adequada para <em>freelance</em>, <em>autônomo</em>, <em>startup</em>. Das três licitações, é a única com \"adequado para PMEs: sim.\"<sup>[1][2][3]</sup></li>\n      <li><span class=\"chip\">Board</span> <strong>99 vagas</strong> (85 freelance, 8 CLT/efetivo, 6 intrigantes): <strong>+3 / −1</strong>. A primeira saída com motivo rastreável desde o início dessa contagem: Constaff, climatização AUTOSAR — prazo de candidatura vencido em <strong>29/07/2026</strong>. Mediana <strong>67</strong>, topo <strong>83</strong>, cinco vagas ≥ 80: sem mudanças pela décima primeira rodada seguida.</li>\n      <li><span class=\"chip\">twiceD</span> <strong>Melhor vaga nova em dias, de volta à metade superior</strong>: <strong>Montash</strong>, fullstack Angular e Java/Spring para o setor de seguros, Munique, 100% remoto, € 90–115/h*, Fit <strong>71</strong> — <strong>posição 28 de 99</strong>.</li>\n      <li><span class=\"chip hot\">CLT/efetivo</span> <strong>A Personio está nomeada na lista de desejos deste perfil — e fica na posição 95.</strong> \"Staff Software Engineer – AI\", Munique/Berlim/Dublin, Fit <strong>54</strong>. O motivo não é a empresa: dois dias de escritório por semana e um núcleo em Python sem Java/Angular.</li>\n      <li><span class=\"chip hot\">Frescor</span> <strong>6 das 99 vagas foram tocadas hoje</strong> (3 entradas, 3 reverificações). As demais <strong>93</strong> trazem \"carried forward from 2026-08-12\" e não foram abertas individualmente hoje. Nenhum sinal novo de taxa: Freelancer-Kompass inalterado, detalhes no Pulso de Mercado.<sup>[4][5]</sup></li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Esta línea alcanzó hoy, por primera vez, su meta de volumen: tres licitaciones activas de software alemanas en el filtro, en lugar de una. El hallazgo, sin embargo, tiene doble filo. Las dos nuevas — el contrato marco \"SAID\" de Dataport y el proyecto sajón \"KARLAS\" — llevan en el eForm el mismo campo: <em>\"apta para pequeñas y medianas empresas: no\"</em>. Dataport incluso le pone cifras: <strong>8 millones de € de facturación mínima anual</strong> para el lote 1, <strong>20 millones de €</strong> para el lote 2, en <em>cada uno</em> de los últimos tres ejercicios fiscales — quedar por debajo significa exclusión obligatoria. Exactamente una de las tres licitaciones está marcada explícitamente para freelancers, exige un único criterio de elegibilidad y ningún nombre de personal — y su plazo de preguntas vence <strong>esta noche a las 23:59 CEST</strong>.</p>\n    <ul>\n      <li><span class=\"chip hot\">Plazo</span> <strong>Hoy a las 23:59 CEST termina el plazo de preguntas</strong> de la licitación \"Dienstleistungen TCK Testautomation\" de la Oberfinanzdirektion Baden-Württemberg (TED 512867-2026). Reverificado hoy de nuevo en el PDF completo: versión <strong>01</strong>, sin aviso de modificación y sin aviso de cancelación. El plazo de la propuesta sigue en <strong>25/08/2026, 11:00 CEST</strong>.<sup>[1]</sup></li>\n      <li><span class=\"chip good\">Nuevo</span> <strong>Dos licitaciones activas más encontradas y leídas en su totalidad</strong> — Dataport AöR, contrato marco \"Software, AI &amp; Digital Services\" (TED 514376-2026, plazo de participación <strong>24/08/2026, 12:00 CEST</strong>) y el Landesamt für Umwelt, Landwirtschaft und Geologie Sachsen, \"KARLAS\" (TED 524134-2026, plazo de la propuesta <strong>07/09/2026, 23:59 CEST</strong>).<sup>[2][3]</sup></li>\n      <li><span class=\"chip hot\">Piso de Facturación</span> <strong>Dataport exige cifras duras de facturación</strong>: lote 1, al menos <strong>8 millones de €</strong> de facturación total anual en cada uno de los últimos tres ejercicios fiscales; lote 2, <strong>20 millones de €</strong>; lote 3, <strong>5 millones de €</strong> solo en el área de IA y datos. Textualmente: \"la solicitud de participación debe entonces excluirse obligatoriamente del procedimiento.\"<sup>[2]</sup></li>\n      <li><span class=\"chip hot\">Referencias</span> <strong>Además, tres proyectos de referencia de 200,000 € o más cada uno</strong> — y específicamente \"exclusivamente referencias del sector público de Alemania\". Al final de la primera etapa, exactamente <strong>nueve</strong> candidatos son invitados al procedimiento negociado. El plazo de preguntas de esta licitación ya venció el 10/08/2026.<sup>[2]</sup></li>\n      <li><span class=\"chip good\">Contraste</span> <strong>La licitación de la OFD exige exactamente un criterio de elegibilidad</strong> — confirmación bancaria o comprobante de seguro de responsabilidad civil profesional. Nombres del personal: \"No se requiere.\" Y está marcada como apta para <em>freelance</em>, <em>independiente</em>, <em>startup</em>. De las tres licitaciones, es la única con \"apta para pymes: sí.\"<sup>[1][2][3]</sup></li>\n      <li><span class=\"chip\">Board</span> <strong>99 vacantes</strong> (85 freelance, 8 en plantilla, 6 intrigantes): <strong>+3 / −1</strong>. La primera baja con motivo rastreable desde que empezó este conteo: Constaff, climatización AUTOSAR — plazo de postulación vencido el <strong>29/07/2026</strong>. Mediana <strong>67</strong>, tope <strong>83</strong>, cinco vacantes ≥ 80: sin cambios por undécima corrida consecutiva.</li>\n      <li><span class=\"chip\">twiceD</span> <strong>Mejor vacante nueva en días, de vuelta en la mitad superior</strong>: <strong>Montash</strong>, fullstack Angular y Java/Spring para el sector de seguros, Múnich, 100% remoto, 90–115 €/h*, Fit <strong>71</strong> — <strong>lugar 28 de 99</strong>.</li>\n      <li><span class=\"chip hot\">En plantilla</span> <strong>Personio figura por su nombre en la lista de deseos de este perfil — y queda en el lugar 95.</strong> \"Staff Software Engineer – AI\", Múnich/Berlín/Dublín, Fit <strong>54</strong>. El motivo no es la empresa: dos días de oficina por semana y un núcleo en Python sin Java/Angular.</li>\n      <li><span class=\"chip hot\">Frescura</span> <strong>6 de las 99 vacantes se tocaron hoy</strong> (3 altas, 3 reverificaciones). Las <strong>93</strong> restantes llevan \"carried forward from 2026-08-12\" y no se abrieron individualmente hoy. Ninguna señal nueva de tarifa: Freelancer-Kompass sin cambios, detalles en el Pulso de Mercado.<sup>[4][5]</sup></li>\n    </ul></div>"

nto</em> läuft <strong>15.–21.08.</strong> mit kostenlosen Bühnenstücken, und die <em>Semana Nacional da Família</em> endet <strong>Sonntag</strong> am Santuário Nossa Senhora Aparecida.</li>\n      <li><span class=\"chip good\">EVENT</span> <strong>Vormerken, Kern-Ring:</strong> Das <strong>EnCena</strong>-Theaterfestival bespielt vom <strong>21. bis 30.08.</strong> elf Orte in Jacarezinho mit <strong>neun kostenlosen Vorstellungen</strong> — Eröffnung am 21.08. um 20 Uhr im CAT mit dem Balé Teatro Guaíra.</li>\n      <li><span class=\"chip hot\">GESUNDHEIT</span> <strong>Paraná bleibt im Alarmband:</strong> InfoGripe <strong>SE 30/2026</strong> ist heute weiterhin das jüngste Bulletin — das erwartete SE 31 ist bis zum Redaktionsschluss nicht erschienen. <strong>42,1 %</strong> aller positiven SRAG-Fälle des Jahres gehen bundesweit auf RSV zurück.</li>\n      <li><span class=\"chip\">GESUNDHEIT</span> <strong>Dengue:</strong> Informe <strong>nº 24</strong> vom 04.08. bleibt der Stand; die Saison 2026 liegt rund <strong>96 %</strong> unter dem Epidemiejahr 2025. <strong>Dia D</strong> der Multivacinação: Samstag <strong>22.08.</strong></li>\n      <li><span class=\"chip\">SCHULE</span> <strong>Voller Unterrichtsmonat:</strong> kein Ferienfenster im August. In Ribeirão Claro läuft die Anmeldung zum <em>Concurso do Prato Típico</em> noch bis <strong>24.08.</strong></li>\n    </ul></div>",

        "en": "<div class=\"tldr\"><p class=\"lead\">The weekend has a plan, and a good one: on <strong>Sunday morning</strong> Assaí blesses its tropeiro horses and sends a <strong>Cavalgada</strong> parade through town — free, outdoors, and just right for three of the four kids. Before that comes a Friday whose thunderstorm risk is shrinking: from <strong>60% to 50%</strong> at tempo.com, while Climatempo still shows <span class=\"stat\">0.0 mm</span>. And this afternoon, 50 kilometers away, there's free storytelling theater again — Sesc Jacarezinho is this week's most reliable host in the core ring, even if it stubbornly only posts its program the day before.</p>\n    <ul>\n      <li><span class=\"chip good\">EVENT</span> <strong>Today, free, ~50 km:</strong> \"<em>História com gente, bicho e o balanço do forró</em>\" at <strong>9:30 AM and 2:30 PM</strong> at the Auditório SENAC/SESC Jacarezinho — storytelling theater, indoors, weather-independent.</li>\n      <li><span class=\"chip hot\">EVENT</span> <strong>Sunday, 08/16:</strong> <em>Festa do Tropeiro</em> in Assaí — <strong>9 AM Bênção do Tropeiro</strong>, <strong>9:30 AM Grande Cavalgada</strong>, noon Viola Caipira orchestra. Free admission, but the longest drive on this radar.</li>\n      <li><span class=\"chip\">WEATHER</span> <strong>The gap is shrinking:</strong> Friday now <strong>50%</strong> instead of 60% thunderstorms (tempo.com) versus <span class=\"stat\">0.0 mm</span> (Climatempo). Today <strong>29–30°/17°C</strong> — rain still disputed: 0% vs. 30%.</li>\n      <li><span class=\"chip hot\">WEATHER</span> <strong>UV index \"extreme\":</strong> Climatempo lists it today for Ribeirão Claro at the highest level. From Monday on, the Jacarezinho series shows <strong>34°C</strong> — shade, a hat, and a midday break stop being optional.</li>\n      <li><span class=\"chip\">EVENT</span> <strong>Londrina this weekend:</strong> <em>Cena em Movimento</em> runs <strong>08/15–08/21</strong> with free stage plays, and the <em>Semana Nacional da Família</em> ends <strong>Sunday</strong> at the Santuário Nossa Senhora Aparecida.</li>\n      <li><span class=\"chip good\">EVENT</span> <strong>Save the date, core ring:</strong> the <strong>EnCena</strong> theater festival runs <strong>08/21–08/30</strong> across eleven venues in Jacarezinho with <strong>nine free performances</strong> — opening 08/21 at 8 PM at the CAT with the Balé Teatro Guaíra.</li>\n      <li><span class=\"chip hot\">HEALTH</span> <strong>Paraná stays in the alert band:</strong> InfoGripe <strong>SE 30/2026</strong> remains today's latest bulletin — the expected SE 31 hadn't appeared by deadline. <strong>42.1%</strong> of all positive SARI cases this year nationwide trace back to RSV.</li>\n      <li><span class=\"chip\">HEALTH</span> <strong>Dengue:</strong> Informe <strong>nº 24</strong> from 08/04 remains the latest word; the 2026 season is running about <strong>96%</strong> below the 2025 epidemic year. <strong>Dia D</strong> of the Multivacinação: Saturday <strong>08/22</strong>.</li>\n      <li><span class=\"chip\">SCHOOL</span> <strong>Full month of classes:</strong> no break window in August. In Ribeirão Claro, registration for the <em>Concurso do Prato Típico</em> runs through <strong>08/24</strong>.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">O fim de semana tem programação, e uma boa: no <strong>domingo de manhã</strong>, Assaí abençoa seus cavalos tropeiros e manda uma <strong>Cavalgada</strong> pelas ruas da cidade — grátis, ao ar livre, e perfeita para três das quatro crianças. Antes disso vem uma sexta-feira cujo temporal está encolhendo: de <strong>60% para 50%</strong> no tempo.com, enquanto a Climatempo continua marcando <span class=\"stat\">0,0 mm</span>. E hoje à tarde, a 50 quilômetros daqui, tem de novo teatro de contação de histórias grátis — o Sesc Jacarezinho é o organizador mais confiável desta semana no anel núcleo, mesmo insistindo em só divulgar a programação na véspera.</p>\n    <ul>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Hoje, grátis, ~50 km:</strong> \"<em>História com gente, bicho e o balanço do forró</em>\" às <strong>9h30 e 14h30</strong> no Auditório SENAC/SESC Jacarezinho — teatro de contação de histórias, em ambiente fechado, independente do clima.</li>\n      <li><span class=\"chip hot\">EVENTO</span> <strong>Domingo, 16/08:</strong> <em>Festa do Tropeiro</em> em Assaí — <strong>9h Bênção do Tropeiro</strong>, <strong>9h30 Grande Cavalgada</strong>, ao meio-dia orquestra de viola caipira. Entrada gratuita, mas a viagem mais longa deste radar.</li>\n      <li><span class=\"chip\">CLIMA</span> <strong>A divergência está diminuindo:</strong> sexta-feira agora com <strong>50%</strong> em vez de 60% de temporal (tempo.com) contra <span class=\"stat\">0,0 mm</span> (Climatempo). Hoje <strong>29–30°/17°C</strong> — chuva ainda controversa: 0% vs. 30%.</li>\n      <li><span class=\"chip hot\">CLIMA</span> <strong>Índice UV \"extremo\":</strong> a Climatempo classifica hoje Ribeirão Claro no nível mais alto. A partir de segunda, a série de Jacarezinho mostra <strong>34°C</strong> — sombra, chapéu e pausa ao meio-dia deixam de ser detalhe opcional.</li>\n      <li><span class=\"chip\">EVENTO</span> <strong>Londrina no fim de semana:</strong> o <em>Cena em Movimento</em> acontece de <strong>15 a 21/08</strong> com espetáculos gratuitos, e a <em>Semana Nacional da Família</em> termina no <strong>domingo</strong> no Santuário Nossa Senhora Aparecida.</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Para anotar, anel núcleo:</strong> o festival de teatro <strong>EnCena</strong> ocupa onze locais em Jacarezinho de <strong>21 a 30/08</strong> com <strong>nove apresentações gratuitas</strong> — abertura em 21/08 às 20h no CAT com o Balé Teatro Guaíra.</li>\n      <li><span class=\"chip hot\">SAÚDE</span> <strong>Paraná continua na faixa de alerta:</strong> o InfoGripe <strong>SE 30/2026</strong> segue sendo hoje o boletim mais recente — o SE 31 esperado não saiu até o fechamento desta edição. <strong>42,1%</strong> de todos os casos positivos de SRAG do ano no país são causados pelo VSR.</li>\n      <li><span class=\"chip\">SAÚDE</span> <strong>Dengue:</strong> o Informe nº <strong>24</strong> de 04/08 continua sendo o dado mais recente; a temporada 2026 está cerca de <strong>96%</strong> abaixo do ano epidêmico de 2025. <strong>Dia D</strong> da Multivacinação: sábado, <strong>22/08</strong>.</li>\n      <li><span class=\"chip\">ESCOLA</span> <strong>Mês letivo completo:</strong> agosto não tem janela de férias. Em Ribeirão Claro, a inscrição para o <em>Concurso do Prato Típico</em> segue aberta até <strong>24/08</strong>.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">El fin de semana tiene programa, y uno bueno: el <strong>domingo por la mañana</strong>, Assaí bendice a sus caballos tropeiros y manda una <strong>Cavalgada</strong> por las calles del pueblo — gratis, al aire libre, y perfecta para tres de los cuatro niños. Antes llega un viernes cuya tormenta se está reduciendo: de <strong>60 % a 50 %</strong> según tempo.com, mientras Climatempo sigue marcando <span class=\"stat\">0,0 mm</span>. Y esta tarde, a 50 kilómetros de aquí, vuelve a haber teatro de narración oral gratis — el Sesc Jacarezinho es el organizador más confiable de la semana en el anillo núcleo, aunque insiste en publicar su programa apenas un día antes.</p>\n    <ul>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Hoy, gratis, ~50 km:</strong> \"<em>História com gente, bicho e o balanço do forró</em>\" a las <strong>9:30 y 14:30</strong> en el Auditório SENAC/SESC Jacarezinho — teatro de narración oral, bajo techo, sin depender del clima.</li>\n      <li><span class=\"chip hot\">EVENTO</span> <strong>Domingo 16/08:</strong> <em>Festa do Tropeiro</em> en Assaí — <strong>9:00 Bênção do Tropeiro</strong>, <strong>9:30 Grande Cavalgada</strong>, al mediodía orquesta de viola caipira. Entrada gratis, pero el trayecto más largo de este radar.</li>\n      <li><span class=\"chip\">CLIMA</span> <strong>La disputa se está reduciendo:</strong> el viernes ahora con <strong>50 %</strong> en vez de 60 % de tormenta (tempo.com) contra <span class=\"stat\">0,0 mm</span> (Climatempo). Hoy <strong>29–30°/17 °C</strong> — la lluvia sigue en disputa: 0 % contra 30 %.</li>\n      <li><span class=\"chip hot\">CLIMA</span> <strong>Índice UV \"extremo\":</strong> hoy Climatempo lo marca en el nivel más alto para Ribeirão Claro. Desde el lunes, la serie de Jacarezinho muestra <strong>34 °C</strong> — la sombra, el sombrero y la pausa del mediodía dejan de ser un adorno.</li>\n      <li><span class=\"chip\">EVENTO</span> <strong>Londrina el fin de semana:</strong> Cena em Movimento va del <strong>15 al 21/08</strong> con obras de teatro gratuitas, y la <em>Semana Nacional da Família</em> termina el <strong>domingo</strong> en el Santuário Nossa Senhora Aparecida.</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Para anotar, anillo núcleo:</strong> el festival de teatro <strong>EnCena</strong> ocupa once sedes en Jacarezinho del <strong>21 al 30/08</strong> con <strong>nueve funciones gratuitas</strong> — inauguración el 21/08 a las 20:00 en el CAT con el Balé Teatro Guaíra.</li>\n      <li><span class=\"chip hot\">SALUD</span> <strong>Paraná se mantiene en la franja de alerta:</strong> el InfoGripe <strong>SE 30/2026</strong> sigue siendo hoy el boletín más reciente — el SE 31 esperado no salió antes del cierre de esta edición. El <strong>42,1 %</strong> de todos los casos positivos de SRAG del año a nivel nacional se deben al VSR.</li>\n      <li><span class=\"chip\">SALUD</span> <strong>Dengue:</strong> el Informe nº <strong>24</strong> del 04/08 sigue siendo el dato más reciente; la temporada 2026 está cerca de <strong>96 %</strong> por debajo del año epidémico 2025. <strong>Dia D</strong> de la Multivacinação: sábado <strong>22/08</strong>.</li>\n      <li><span class=\"chip\">ESCUELA</span> <strong>Mes escolar completo:</strong> agosto no tiene ventana de vacaciones. En Ribeirão Claro, la inscripción para el <em>Concurso do Prato Típico</em> sigue abierta hasta el <strong>24/08</strong>.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Donnerstag, der 13. August — Rotationsthema <em>Fußball &amp; Sport</em>. Zwei Tabellen liefern heute das Vokabular. In Brasilien steht nach der <strong>22. Runde</strong> (Spiele vom 8. und 9. August) Palmeiras mit <strong>48 Punkten aus 22 Spielen</strong> oben — 14 Siege, 6 Unentschieden, 2 Niederlagen, 38:16 Tore und damit die beste Abwehr der Liga (<a href=\"https://www.lance.com.br/tabela/brasileirao\">lance.com.br</a>). Weil es gegen Internacional nur zum <strong>0:0</strong> reichte, ist der Vorsprung auf Flamengo (42 Punkte, ein Spiel weniger) von acht auf <strong>sechs Punkte</strong> geschrumpft (<a href=\"https://colunadofla.com/2026/08/flamengo-vence-e-palmeiras-empata-veja-tabela-atualizada-do-brasileirao-apos-22a-rodada/\">colunadofla.com</a>). In Deutschland läuft parallel die Uhr: Die Bundesliga startet am <strong>Freitag, 28.08.2026, 20:30 Uhr</strong> mit Bayern gegen Stuttgart (<a href=\"https://anstosszeiten.de/bundesliga/spieltag-1/\">anstosszeiten.de</a>), und das Transferfenster schließt am <strong>Dienstag, 01.09.2026, 20:00 Uhr</strong> (<a href=\"https://sport.sky.de/fussball/artikel/deadlineday/11129720/34240\">sport.sky.de</a>). Beides zusammen ergibt genau den Wortschatz, den man abends beim <em>Globo Esporte</em> und morgens beim Kicker-Ticker braucht: <em>subir</em>, <em>perder</em>, <em>o empate</em>, <em>o Z4</em>, <em>a torcida</em>. <strong>10 Einträge, davon 3 Verben mit voller Konjugation</strong>, plus 2 Auffrischungen vom 23. Juli.</p>\n    <ul>\n      <li><span class=\"chip hot\">FALSCHER FREUND</span> <strong>o time ≠ time</strong> — das brasilianische Wort für Mannschaft ist <em>o time</em>, und es kommt laut Priberam direkt aus dem englischen <em>team</em>. Wer Englisch oder Deutsch denkt, liest reflexhaft „Zeit\". In Portugal sagt man dagegen <em>a equipa</em> — <em>time</em> ist im Wörterbuch ausdrücklich als <strong>[Brasil]</strong> markiert. <span class=\"src\"><a href=\"https://dicionario.priberam.org/time\">priberam.org</a></span></li>\n      <li><span class=\"chip\">KONJUGATION</span> <strong>eu perco, aber yo pierdo</strong> — dasselbe Verb, zwei völlig verschiedene Bruchstellen. Portugiesisch tauscht den Stamm <em>perd-</em> gegen <em>perc-</em>, aber nur in der Ich-Form und im Subjuntivo (<em>eu perco, que eu perca</em>). Spanisch macht das nie, dafür bricht der Vokal unter Betonung auf (<em>pierdo, pierdes, pierde</em>) — und bleibt bei <em>nosotros perdemos</em> glatt. <span class=\"src\"><a href=\"https://www.conjugacao.com.br/verbo-perder/\">conjugacao.com.br</a> · <a href=\"https://conjugator.reverso.net/conjugation-spanish-verb-perder.html\">reverso.net</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>Z4</strong> — brasilianische Kurzform für die <em>zona de rebaixamento</em>: die letzten vier Plätze der 20er-Tabelle, die direkt in die Série B absteigen. „Estar no Z4\" ist das, was im Deutschen umständlich „auf einem Abstiegsplatz stehen\" heißt. <span class=\"src\"><a href=\"https://sorteador.com.br/apostas/guia-apostar-na-zona-de-rebaixamento-como-apostar-no-z-4-do-brasileirao/\">sorteador.com.br</a></span></li>\n      <li><span class=\"chip\">KONJUGATION</span> <strong>defender: identisch geschrieben, verschieden gebaut</strong> — im Portugiesischen ist <em>defender</em> laut Konjugator <strong>regelmäßig</strong> (<em>eu defendo, nós defendemos</em>), im Spanischen ein e→ie-Stammwechsler (<em>yo defiendo</em>, aber <em>nosotros defendemos</em>). Wer aus dem Spanischen kommt, sagt im Portugiesischen zuverlässig <em>*eu defiendo</em> — falsch. <span class=\"src\"><a href=\"https://www.conjugacao.com.br/verbo-defender/\">conjugacao.com.br</a> · <a href=\"https://conjugator.reverso.net/conjugation-spanish-verb-defender.html\">reverso.net</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>a torcida</strong> — ein <em>Kollektiv</em>-Singular für die gesamte Fangemeinde, den das Deutsche gar nicht hat; der Einzelne ist <em>o torcedor</em>. Das europäische Portugiesisch nimmt stattdessen <em>os adeptos</em> bzw. <em>a claque</em>. Die Wurzel ist das lateinische <em>torqueo</em>, „drehen, winden\" — vom Händeringen vor Spannung. <span class=\"src\"><a href=\"https://dicionario.priberam.org/torcida\">priberam.org</a></span></li>\n      <li><span class=\"chip\">IDIOM</span> <strong>pendurar as chuteiras</strong> — „die Fußballschuhe aufhängen\", also die Karriere beenden. Das Wörterbuch der Umgangssprache setzt es schlicht mit <em>se aposentar</em> gleich und lässt es ausdrücklich für <em>jede</em> Tätigkeit gelten, nicht nur Sport — genau wie das deutsche „etwas an den Nagel hängen\". <span class=\"src\"><a href=\"https://qualeagiria.com.br/giria/pendurar-as-chuteiras\">qualeagiria.com.br</a></span></li>\n      <li><span class=\"chip good\">PHRASE</span> <strong>acréscimos steht im Plural</strong> — die Nachspielzeit heißt in Brasilien meist <em>os acréscimos</em>, wörtlich „die Zugaben\" (auch <em>tempo adicionado</em>). Das mexikanische Spanisch nimmt den Singular: <em>el tiempo añadido</em>, in der Übertragung oft auch <em>el descuento</em>. <span class=\"src\"><a href=\"https://www.appsbyalejo.com/id/blog/o-que-e-acrescimo-futebol\">appsbyalejo.com</a> · <a href=\"https://www.olympics.com/es/noticias/futbol-que-es-tiempo-anadido-descuento\">olympics.com</a></span></li>\n    </ul></div>",
      "latestTldrHtmlByLang": {

 den das Deutsche gar nicht hat; der Einzelne ist <em>o torcedor</em>. Das europäische Portugiesisch nimmt stattdessen <em>os adeptos</em> bzw. <em>a claque</em>. Die Wurzel ist das lateinische <em>torqueo</em>, „drehen, winden\" — vom Händeringen vor Spannung. <span class=\"src\"><a href=\"https://dicionario.priberam.org/torcida\">priberam.org</a></span></li>\n      <li><span class=\"chip\">IDIOM</span> <strong>pendurar as chuteiras</strong> — „die Fußballschuhe aufhängen\", also die Karriere beenden. Das Wörterbuch der Umgangssprache setzt es schlicht mit <em>se aposentar</em> gleich und lässt es ausdrücklich für <em>jede</em> Tätigkeit gelten, nicht nur Sport — genau wie das deutsche „etwas an den Nagel hängen\". <span class=\"src\"><a href=\"https://qualeagiria.com.br/giria/pendurar-as-chuteiras\">qualeagiria.com.br</a></span></li>\n      <li><span class=\"chip good\">PHRASE</span> <strong>acréscimos steht im Plural</strong> — die Nachspielzeit heißt in Brasilien meist <em>os acréscimos</em>, wörtlich „die Zugaben\" (auch <em>tempo adicionado</em>). Das mexikanische Spanisch nimmt den Singular: <em>el tiempo añadido</em>, in der Übertragung oft auch <em>el descuento</em>. <span class=\"src\"><a href=\"https://www.appsbyalejo.com/id/blog/o-que-e-acrescimo-futebol\">appsbyalejo.com</a> · <a href=\"https://www.olympics.com/es/noticias/futbol-que-es-tiempo-anadido-descuento\">olympics.com</a></span></li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Thursday, August 13 — rotation theme <em>Soccer &amp; Sports</em>. Two tables supply today's vocabulary. In Brazil, after <strong>round 22</strong> (matches played August 8 and 9), Palmeiras sits on top with <strong>48 points from 22 games</strong> — 14 wins, 6 draws, 2 losses, a 38-16 goal difference, and with it the league's best defense (<a href=\"https://www.lance.com.br/tabela/brasileirao\">lance.com.br</a>). Because a match against Internacional produced only a <strong>0-0</strong> draw, the lead over Flamengo (42 points, one game in hand) has shrunk from eight to <strong>six points</strong> (<a href=\"https://colunadofla.com/2026/08/flamengo-vence-e-palmeiras-empata-veja-tabela-atualizada-do-brasileirao-apos-22a-rodada/\">colunadofla.com</a>). In Germany the clock is running in parallel: the Bundesliga kicks off on <strong>Friday, August 28, 2026, at 8:30 p.m.</strong> with Bayern against Stuttgart (<a href=\"https://anstosszeiten.de/bundesliga/spieltag-1/\">anstosszeiten.de</a>), and the transfer window closes on <strong>Tuesday, September 1, 2026, at 8:00 p.m.</strong> (<a href=\"https://sport.sky.de/fussball/artikel/deadlineday/11129720/34240\">sport.sky.de</a>). Put together, that's exactly the vocabulary you need for <em>Globo Esporte</em> in the evening and the kicker ticker in the morning: <em>subir</em>, <em>perder</em>, <em>o empate</em>, <em>o Z4</em>, <em>a torcida</em>. <strong>10 entries, 3 of them verbs with full conjugation</strong>, plus 2 refreshers from July 23.</p>\n    <ul>\n      <li><span class=\"chip hot\">FALSE FRIEND</span> <strong>o time ≠ time</strong> — the Brazilian word for team is <em>o time</em>, and according to Priberam it comes directly from the English <em>team</em>. If you think in English or German, you reflexively read \"time\" as the clock word. In Portugal, on the other hand, people say <em>a equipa</em> — <em>time</em> is explicitly marked in the dictionary as <strong>[Brazil]</strong>. <span class=\"src\"><a href=\"https://dicionario.priberam.org/time\">priberam.org</a></span></li>\n      <li><span class=\"chip\">CONJUGATION</span> <strong>eu perco, but yo pierdo</strong> — the same verb, two completely different break points. Portuguese swaps the stem <em>perd-</em> for <em>perc-</em>, but only in the I-form and the subjunctive (<em>eu perco, que eu perca</em>). Spanish never does that — instead the vowel splits under stress (<em>pierdo, pierdes, pierde</em>) — and stays flat in <em>nosotros perdemos</em>. <span class=\"src\"><a href=\"https://www.conjugacao.com.br/verbo-perder/\">conjugacao.com.br</a> · <a href=\"https://conjugator.reverso.net/conjugation-spanish-verb-perder.html\">reverso.net</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>Z4</strong> — Brazilian shorthand for the <em>zona de rebaixamento</em>: the bottom four places of the 20-team table, which drop straight into Série B. \"Estar no Z4\" is what English clunkily calls \"being in the relegation zone.\" <span class=\"src\"><a href=\"https://sorteador.com.br/apostas/guia-apostar-na-zona-de-rebaixamento-como-apostar-no-z-4-do-brasileirao/\">sorteador.com.br</a></span></li>\n      <li><span class=\"chip\">CONJUGATION</span> <strong>defender: written identically, built differently</strong> — in Portuguese, <em>defender</em> is, per the conjugator, <strong>regular</strong> (<em>eu defendo, nós defendemos</em>); in Spanish it's an e→ie stem-changer (<em>yo defiendo</em>, but <em>nosotros defendemos</em>). Anyone coming from Spanish reliably says <em>*eu defiendo</em> in Portuguese — wrong. <span class=\"src\"><a href=\"https://www.conjugacao.com.br/verbo-defender/\">conjugacao.com.br</a> · <a href=\"https://conjugator.reverso.net/conjugation-spanish-verb-defender.html\">reverso.net</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>a torcida</strong> — a <em>collective</em> singular for the entire fan base, something English doesn't really have; the individual is <em>o torcedor</em>. European Portuguese instead uses <em>os adeptos</em> or <em>a claque</em>. The root is the Latin <em>torqueo</em>, \"to twist, to wring\" — from wringing your hands with tension. <span class=\"src\"><a href=\"https://dicionario.priberam.org/torcida\">priberam.org</a></span></li>\n      <li><span class=\"chip\">IDIOM</span> <strong>pendurar as chuteiras</strong> — literally \"to hang up the cleats,\" i.e., to end one's career. The slang dictionary equates it simply with <em>se aposentar</em> and explicitly lets it apply to <em>any</em> activity, not just sports — exactly like the English \"to hang up one's boots.\" <span class=\"src\"><a href=\"https://qualeagiria.com.br/giria/pendurar-as-chuteiras\">qualeagiria.com.br</a></span></li>\n      <li><span class=\"chip good\">PHRASE</span> <strong>acréscimos is plural</strong> — stoppage time in Brazil is usually called <em>os acréscimos</em>, literally \"the additions\" (also <em>tempo adicionado</em>). Mexican Spanish uses the singular: <em>el tiempo añadido</em>, and in broadcasts often <em>el descuento</em>. <span class=\"src\"><a href=\"https://www.appsbyalejo.com/id/blog/o-que-e-acrescimo-futebol\">appsbyalejo.com</a> · <a href=\"https://www.olympics.com/es/noticias/futbol-que-es-tiempo-anadido-descuento\">olympics.com</a></span></li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Quinta-feira, 13 de agosto — tema em rotação <em>Futebol e Esportes</em>. Duas tabelas fornecem o vocabulário de hoje. No Brasil, depois da <strong>22ª rodada</strong> (jogos de 8 e 9 de agosto), o Palmeiras lidera com <strong>48 pontos em 22 jogos</strong> — 14 vitórias, 6 empates, 2 derrotas, saldo de gols de 38 a 16 e, com isso, a melhor defesa da liga (<a href=\"https://www.lance.com.br/tabela/brasileirao\">lance.com.br</a>). Como o confronto contra o Internacional terminou apenas em <strong>0 a 0</strong>, a vantagem sobre o Flamengo (42 pontos, um jogo a menos) caiu de oito para <strong>seis pontos</strong> (<a href=\"https://colunadofla.com/2026/08/flamengo-vence-e-palmeiras-empata-veja-tabela-atualizada-do-brasileirao-apos-22a-rodada/\">colunadofla.com</a>). Na Alemanha, o relógio corre em paralelo: a Bundesliga começa na <strong>sexta-feira, 28/08/2026, às 20h30</strong>, com Bayern contra Stuttgart (<a href=\"https://anstosszeiten.de/bundesliga/spieltag-1/\">anstosszeiten.de</a>), e a janela de transferências fecha na <strong>terça-feira, 01/09/2026, às 20h00</strong> (<a href=\"https://sport.sky.de/fussball/artikel/deadlineday/11129720/34240\">sport.sky.de</a>). Juntando tudo, é exatamente o vocabulário necessário para acompanhar o <em>Globo Esporte</em> à noite e o noticiário esportivo de manhã: <em>subir</em>, <em>perder</em>, <em>o empate</em>, <em>o Z4</em>, <em>a torcida</em>. <strong>10 verbetes, sendo 3 verbos com conjugação completa</strong>, além de 2 revisões do dia 23 de julho.</p>\n    <ul>\n      <li><span class=\"chip hot\">FALSO AMIGO</span> <strong>o time ≠ time</strong> — a palavra brasileira para equipe é <em>o time</em>, e segundo o Priberam ela vem diretamente do inglês <em>team</em>. Quem pensa em inglês ou alemão lê reflexivamente \"tempo\", a palavra ligada ao relógio. Em Portugal, por sua vez, diz-se <em>a equipa</em> — <em>time</em> está no dicionário explicitamente marcado como <strong>[Brasil]</strong>. <span class=\"src\"><a href=\"https://dicionario.priberam.org/time\">priberam.org</a></span></li>\n      <li><span class=\"chip\">CONJUGAÇÃO</span> <strong>eu perco, mas yo pierdo</strong> — o mesmo verbo, dois pontos de ruptura completamente diferentes. O português troca o radical <em>perd-</em> por <em>perc-</em>, mas só na primeira pessoa e no subjuntivo (<em>eu perco, que eu perca</em>). O espanhol nunca faz isso — em vez disso, a vogal se abre sob acento tônico (<em>pierdo, pierdes, pierde</em>) — e permanece intacta em <em>nosotros perdemos</em>. <span class=\"src\"><a href=\"https://www.conjugacao.com.br/verbo-perder/\">conjugacao.com.br</a> · <a href=\"https://conjugator.reverso.net/conjugation-spanish-verb-perder.html\">reverso.net</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>Z4</strong> — abreviação brasileira para a <em>zona de rebaixamento</em>: os últimos quatro lugares da tabela de 20 times, que caem direto para a Série B. \"Estar no Z4\" é o que o alemão diz de forma bem mais complicada: \"auf einem Abstiegsplatz stehen\" (estar em posição de rebaixamento). <span class=\"src\"><a href=\"https://sorteador.com.br/apostas/guia-apostar-na-zona-de-rebaixamento-como-apostar-no-z-4-do-brasileirao/\">sorteador.com.br</a></span></li>\n      <li><span class=\"chip\">CONJUGAÇÃO</span> <strong>defender: escrito igual, construído diferente</strong> — em português, <em>defender</em> é, segundo o conjugador, <strong>regular</strong> (<em>eu defendo, nós defendemos</em>); em espanhol é um verbo com mudança de radical e→ie (<em>yo defiendo</em>, mas <em>nosotros defendemos</em>). Quem vem do espanhol diz recorrentemente <em>*eu defiendo</em> em português — errado. <span class=\"src\"><a href=\"https://www.conjugacao.com.br/verbo-defender/\">conjugacao.com.br</a> · <a href=\"https://conjugator.reverso.net/conjugation-spanish-verb-defender.html\">reverso.net</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>a torcida</strong> — um singular <em>coletivo</em> para toda a torcida, algo que o alemão não tem; o indivíduo é <em>o torcedor</em>. O português europeu usa em vez disso <em>os adeptos</em> ou <em>a claque</em>. A raiz é o latim <em>torqueo</em>, \"torcer, retorcer\" — do gesto de torcer as mãos de tensão. <span class=\"src\"><a href=\"https://dicionario.priberam.org/torcida\">priberam.org</a></span></li>\n      <li><span class=\"chip\">EXPRESSÃO</span> <strong>pendurar as chuteiras</strong> — \"pendurar as chuteiras\", ou seja, encerrar a carreira. O dicionário de gírias equipara a expressão simplesmente a <em>se aposentar</em> e deixa claro que ela vale para <em>qualquer</em> atividade, não só o esporte — exatamente como a expressão alemã \"etwas an den Nagel hängen\" (pendurar algo no prego). <span class=\"src\"><a href=\"https://qualeagiria.com.br/giria/pendurar-as-chuteiras\">qualeagiria.com.br</a></span></li>\n      <li><span class=\"chip good\">FRASE</span> <strong>acréscimos está no plural</strong> — o tempo extra no Brasil costuma ser chamado de <em>os acréscimos</em>, literalmente \"os adicionais\" (também <em>tempo adicionado</em>). O espanhol mexicano usa o singular: <em>el tiempo añadido</em>, e nas transmissões, muitas vezes, <em>el descuento</em>. <span class=\"src\"><a href=\"https://www.appsbyalejo.com/id/blog/o-que-e-acrescimo-futebol\">appsbyalejo.com</a> · <a href=\"https://www.olympics.com/es/noticias/futbol-que-es-tiempo-anadido-descuento\">olympics.com</a></span></li>\n    </ul></div>",

/conjugation-spanish-verb-defender.html\">reverso.net</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>a torcida</strong> — un singular <em>colectivo</em> para toda la afición, algo que el alemán no tiene; el individuo es <em>o torcedor</em>. El portugués europeo usa en cambio <em>os adeptos</em> o <em>a claque</em>. La raíz es el latín <em>torqueo</em>, \"torcer, retorcer\" — del gesto de retorcerse las manos por la tensión. <span class=\"src\"><a href=\"https://dicionario.priberam.org/torcida\">priberam.org</a></span></li>\n      <li><span class=\"chip\">EXPRESIÓN</span> <strong>pendurar as chuteiras</strong> — \"colgar los botines\", es decir, terminar la carrera. El diccionario de jerga equipara la expresión simplemente con <em>se aposentar</em> y deja claro que aplica para <em>cualquier</em> actividad, no solo el deporte — exactamente como la expresión alemana \"etwas an den Nagel hängen\" (colgar algo del clavo). <span class=\"src\"><a href=\"https://qualeagiria.com.br/giria/pendurar-as-chuteiras\">qualeagiria.com.br</a></span></li>\n      <li><span class=\"chip good\">FRASE</span> <strong>acréscimos va en plural</strong> — el tiempo de compensación en Brasil suele llamarse <em>os acréscimos</em>, literalmente \"los añadidos\" (también <em>tempo adicionado</em>). El español mexicano usa el singular: <em>el tiempo añadido</em>, y en las transmisiones, muchas veces, <em>el descuento</em>. <span class=\"src\"><a href=\"https://www.appsbyalejo.com/id/blog/o-que-e-acrescimo-futebol\">appsbyalejo.com</a> · <a href=\"https://www.olympics.com/es/noticias/futbol-que-es-tiempo-anadido-descuento\">olympics.com</a></span></li>\n    </ul></div>"
