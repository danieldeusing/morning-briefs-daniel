      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Die auffälligste Bewegung dieses Sommers ist keine Modellankündigung, sondern ein Berufswechsel: <strong>Microsoft</strong>, <strong>OpenAI</strong>, <strong>Anthropic</strong> und <strong>Amazon</strong> haben 2026 über <strong>8 Mrd. $</strong> in Truppen gesteckt, die Ingenieure <em>in</em> Kundenunternehmen setzen und dort die KI zum Laufen bringen.<sup>[1]</sup> Wer Modelle baut, verkauft jetzt Einbau. Parallel wird dieser Einbau justiziabel: Am <strong>Sonntag</strong> greifen die Transparenzpflichten des EU AI Act, und Deutschland hat die Behörde benannt, die sie durchsetzt.</p>\n    <ul>\n      <li><span class=\"chip hot\">DEPLOY · Global</span> <strong>Die Modellbauer werden Integratoren:</strong> Microsoft Frontier Company <strong>2,5 Mrd. $</strong> / <strong>6.000</strong> Fachleute (02.07.), OpenAI Deployment Co <strong>&gt;4 Mrd. $</strong> (11.05.), Anthropic-JV <strong>1,5 Mrd. $</strong> (04.05.), Amazon rund <strong>1 Mrd. $</strong>.</li>\n      <li><span class=\"chip hot\">REG · EU/DE</span> <strong>Vier Tage bis Artikel 50:</strong> Offenlegung und Kennzeichnung ab <strong>02.08.</strong>, Bußgeld bis <strong>15 Mio. €</strong> oder <strong>3 %</strong> des Weltumsatzes; Bestandssysteme haben bis <strong>02.12.</strong> Zeit — aber nur für die Markierung. Vollzug in Deutschland: die <strong>Bundesnetzagentur</strong>.</li>\n      <li><span class=\"chip good\">DEPLOY · US · Finance</span> <strong>Cisco</strong> rollt ab Ende Juli einen persönlichen Agenten an rund <strong>90.000</strong> Beschäftigte aus. Im Finanzbereich schreibt KI laut CFO bereits <strong>80–90 %</strong> des Erstentwurfs der MD&amp;A-Abschnitte.</li>\n      <li><span class=\"chip\">STUDY · DE</span> <strong>Vier Zahlen, eine Frage:</strong> KI-Nutzung deutscher Unternehmen liegt 2026 bei <strong>20 %</strong>, <strong>41 %</strong>, <strong>51,2 %</strong> oder <strong>54,5 %</strong> — je nach Definition, Größenschwelle und Feldzeit. Bewegt hat sich nur eine: KI-<em>Agenten</em> im Mittelstand, <strong>8,7 % → 16,6 %</strong>.</li>\n      <li><span class=\"chip\">STUDY · Global</span> <strong>Stanford HAI</strong> beziffert die US-Konsumentenrente aus generativer KI auf <strong>172 Mrd. $</strong> jährlich (Vorjahr: 112 Mrd. $) — flaggt aber selbst, dass die Gewinne vor allem in strukturierter, messbarer Arbeit anfallen.</li>\n      <li><span class=\"chip\">POLICY · BR</span> <strong>Brasilien reguliert KI ohne KI-Gesetz:</strong> Die <strong>ANPD</strong> gibt sich als „residuale\" Aufsicht, das Marco Legal (PL 2338/2023) wartet weiter auf die Abstimmung im Plenum.</li>\n      <li><span class=\"chip good\">twiceD</span> Zwei Ideen: ein <strong>Artikel-50-Bausatz</strong> und eine <strong>Erstentwurf-Maschine für Pflichttexte</strong> — Ciscos MD&amp;A-Trick, übersetzt auf den deutschen Lagebericht.</li>\n    </ul></div>",
      "latestTldrHtmlByLang": {
        "de": "<div class=\"tldr\"><p class=\"lead\">Die auffälligste Bewegung dieses Sommers ist keine Modellankündigung, sondern ein Berufswechsel: <strong>Microsoft</strong>, <strong>OpenAI</strong>, <strong>Anthropic</strong> und <strong>Amazon</strong> haben 2026 über <strong>8 Mrd. $</strong> in Truppen gesteckt, die Ingenieure <em>in</em> Kundenunternehmen setzen und dort die KI zum Laufen bringen.<sup>[1]</sup> Wer Modelle baut, verkauft jetzt Einbau. Parallel wird dieser Einbau justiziabel: Am <strong>Sonntag</strong> greifen die Transparenzpflichten des EU AI Act, und Deutschland hat die Behörde benannt, die sie durchsetzt.</p>\n    <ul>\n      <li><span class=\"chip hot\">DEPLOY · Global</span> <strong>Die Modellbauer werden Integratoren:</strong> Microsoft Frontier Company <strong>2,5 Mrd. $</strong> / <strong>6.000</strong> Fachleute (02.07.), OpenAI Deployment Co <strong>&gt;4 Mrd. $</strong> (11.05.), Anthropic-JV <strong>1,5 Mrd. $</strong> (04.05.), Amazon rund <strong>1 Mrd. $</strong>.</li>\n      <li><span class=\"chip hot\">REG · EU/DE</span> <strong>Vier Tage bis Artikel 50:</strong> Offenlegung und Kennzeichnung ab <strong>02.08.</strong>, Bußgeld bis <strong>15 Mio. €</strong> oder <strong>3 %</strong> des Weltumsatzes; Bestandssysteme haben bis <strong>02.12.</strong> Zeit — aber nur für die Markierung. Vollzug in Deutschland: die <strong>Bundesnetzagentur</strong>.</li>\n      <li><span class=\"chip good\">DEPLOY · US · Finance</span> <strong>Cisco</strong> rollt ab Ende Juli einen persönlichen Agenten an rund <strong>90.000</strong> Beschäftigte aus. Im Finanzbereich schreibt KI laut CFO bereits <strong>80–90 %</strong> des Erstentwurfs der MD&amp;A-Abschnitte.</li>\n      <li><span class=\"chip\">STUDY · DE</span> <strong>Vier Zahlen, eine Frage:</strong> KI-Nutzung deutscher Unternehmen liegt 2026 bei <strong>20 %</strong>, <strong>41 %</strong>, <strong>51,2 %</strong> oder <strong>54,5 %</strong> — je nach Definition, Größenschwelle und Feldzeit. Bewegt hat sich nur eine: KI-<em>Agenten</em> im Mittelstand, <strong>8,7 % → 16,6 %</strong>.</li>\n      <li><span class=\"chip\">STUDY · Global</span> <strong>Stanford HAI</strong> beziffert die US-Konsumentenrente aus generativer KI auf <strong>172 Mrd. $</strong> jährlich (Vorjahr: 112 Mrd. $) — flaggt aber selbst, dass die Gewinne vor allem in strukturierter, messbarer Arbeit anfallen.</li>\n      <li><span class=\"chip\">POLICY · BR</span> <strong>Brasilien reguliert KI ohne KI-Gesetz:</strong> Die <strong>ANPD</strong> gibt sich als „residuale\" Aufsicht, das Marco Legal (PL 2338/2023) wartet weiter auf die Abstimmung im Plenum.</li>\n      <li><span class=\"chip good\">twiceD</span> Zwei Ideen: ein <strong>Artikel-50-Bausatz</strong> und eine <strong>Erstentwurf-Maschine für Pflichttexte</strong> — Ciscos MD&amp;A-Trick, übersetzt auf den deutschen Lagebericht.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">This summer's most striking move isn't a model announcement — it's a career change: <strong>Microsoft</strong>, <strong>OpenAI</strong>, <strong>Anthropic</strong>, and <strong>Amazon</strong> have poured more than <strong>$8 billion</strong> into 2026 alone on troops of engineers who get embedded <em>inside</em> customer companies and make the AI actually work there.<sup>[1]</sup> Whoever builds the models now sells the install. In parallel, that install is turning into a legal matter: this <strong>Sunday</strong>, the EU AI Act's transparency obligations take effect, and Germany has named the agency that will enforce them.</p>\n    <ul>\n      <li><span class=\"chip hot\">DEPLOY · Global</span> <strong>The model builders are becoming integrators:</strong> Microsoft Frontier Company <strong>$2.5 billion</strong> / <strong>6,000</strong> specialists (07/02), OpenAI Deployment Co <strong>&gt;$4 billion</strong> (05/11), Anthropic JV <strong>$1.5 billion</strong> (05/04), Amazon roughly <strong>$1 billion</strong>.</li>\n      <li><span class=\"chip hot\">REG · EU/DE</span> <strong>Four days to Article 50:</strong> disclosure and labeling start <strong>08/02</strong>, fines up to <strong>€15 million</strong> or <strong>3%</strong> of global revenue; legacy systems have until <strong>12/02</strong> — but only for the labeling. Enforcement in Germany: the <strong>Bundesnetzagentur</strong>.</li>\n      <li><span class=\"chip good\">DEPLOY · US · Finance</span> <strong>Cisco</strong> is rolling out a personal agent to roughly <strong>90,000</strong> employees starting at the end of July. In finance, AI already writes <strong>80-90%</strong> of the first draft of MD&amp;A sections, per the CFO.</li>\n      <li><span class=\"chip\">STUDY · DE</span> <strong>Four numbers, one question:</strong> German companies' AI use in 2026 sits at <strong>20%</strong>, <strong>41%</strong>, <strong>51.2%</strong>, or <strong>54.5%</strong> — depending on definition, size threshold, and fieldwork timing. Only one figure actually moved: AI <em>agents</em> in SMEs, <strong>8.7% → 16.6%</strong>.</li>\n      <li><span class=\"chip\">STUDY · Global</span> <strong>Stanford HAI</strong> puts the US consumer surplus from generative AI at <strong>$172 billion</strong> a year (prior year: $112 billion) — but flags itself that the gains accrue mostly in structured, measurable work.</li>\n      <li><span class=\"chip\">POLICY · BR</span> <strong>Brazil is regulating AI without an AI law:</strong> the <strong>ANPD</strong> is positioning itself as a \"residual\" overseer, while the Marco Legal (Bill 2338/2023) is still waiting for a floor vote.</li>\n      <li><span class=\"chip good\">twiceD</span> Two ideas: an <strong>Article 50 starter kit</strong> and a <strong>first-draft machine for mandatory reports</strong> — Cisco's MD&amp;A trick, translated into the German Lagebericht.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">O movimento mais chamativo deste verão não é o anúncio de um modelo, mas uma mudança de profissão: <strong>Microsoft</strong>, <strong>OpenAI</strong>, <strong>Anthropic</strong> e <strong>Amazon</strong> investiram, só em 2026, mais de <strong>US$ 8 bilhões</strong> em tropas de engenheiros que se instalam <em>dentro</em> das empresas-clientes e fazem a IA funcionar ali.<sup>[1]</sup> Quem constrói modelos agora vende a instalação. Ao mesmo tempo, essa instalação vira assunto jurídico: no <strong>domingo</strong> entram em vigor as obrigações de transparência do AI Act da UE, e a Alemanha já nomeou o órgão que vai fazer cumpri-las.</p>\n    <ul>\n      <li><span class=\"chip hot\">IMPLANTAÇÃO · Global</span> <strong>Os construtores de modelos estão virando integradores:</strong> Microsoft Frontier Company <strong>US$ 2,5 bilhões</strong> / <strong>6.000</strong> especialistas (02/07), OpenAI Deployment Co <strong>&gt;US$ 4 bilhões</strong> (11/05), joint venture da Anthropic <strong>US$ 1,5 bilhão</strong> (04/05), Amazon cerca de <strong>US$ 1 bilhão</strong>.</li>\n      <li><span class=\"chip hot\">REGULAÇÃO · UE/DE</span> <strong>Quatro dias até o Artigo 50:</strong> divulgação e rotulagem a partir de <strong>02/08</strong>, multa de até <strong>€ 15 milhões</strong> ou <strong>3%</strong> do faturamento mundial; sistemas já existentes têm até <strong>02/12</strong> — mas só para a rotulagem. Fiscalização na Alemanha: a <strong>Bundesnetzagentur</strong>.</li>\n      <li><span class=\"chip good\">IMPLANTAÇÃO · EUA · Finanças</span> A <strong>Cisco</strong> distribui, a partir do fim de julho, um agente pessoal para cerca de <strong>90.000</strong> funcionários. Na área financeira, a IA já escreve, segundo o CFO, <strong>80%–90%</strong> do primeiro rascunho das seções de MD&amp;A.</li>\n      <li><span class=\"chip\">ESTUDO · DE</span> <strong>Quatro números, uma pergunta:</strong> o uso de IA por empresas alemãs em 2026 fica em <strong>20%</strong>, <strong>41%</strong>, <strong>51,2%</strong> ou <strong>54,5%</strong> — dependendo da definição, do porte e do período de coleta. Só um número realmente se moveu: agentes de <em>IA</em> no médio porte, de <strong>8,7% para 16,6%</strong>.</li>\n      <li><span class=\"chip\">ESTUDO · Global</span> O <strong>Stanford HAI</strong> estima o excedente do consumidor americano vindo da IA generativa em <strong>US$ 172 bilhões</strong> ao ano (ano anterior: US$ 112 bilhões) — mas o próprio estudo sinaliza que os ganhos se concentram sobretudo em trabalho estruturado e mensurável.</li>\n      <li><span class=\"chip\">POLÍTICA · BR</span> <strong>O Brasil regula a IA sem uma lei de IA:</strong> a <strong>ANPD</strong> se coloca como supervisão \"residual\", enquanto o Marco Legal (PL 2338/2023) continua esperando votação no plenário.</li>\n      <li><span class=\"chip good\">twiceD</span> Duas ideias: um <strong>kit para o Artigo 50</strong> e uma <strong>máquina de primeiro rascunho para textos obrigatórios</strong> — o truque de MD&amp;A da Cisco, traduzido para o Lagebericht alemão.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">El movimiento más llamativo de este verano no es el anuncio de un modelo, sino un cambio de oficio: <strong>Microsoft</strong>, <strong>OpenAI</strong>, <strong>Anthropic</strong> y <strong>Amazon</strong> invirtieron, solo en 2026, más de <strong>8 mil millones de dólares</strong> en tropas de ingenieros que se instalan <em>dentro</em> de las empresas clientes y hacen que la IA funcione ahí.<sup>[1]</sup> Quien construye modelos ahora vende la instalación. En paralelo, esa instalación se vuelve asunto legal: el <strong>domingo</strong> entran en vigor las obligaciones de transparencia de la Ley de IA de la UE, y Alemania ya nombró a la autoridad que las hará cumplir.</p>\n    <ul>\n      <li><span class=\"chip hot\">DESPLIEGUE · Global</span> <strong>Los constructores de modelos se están volviendo integradores:</strong> Microsoft Frontier Company <strong>2.5 mil millones de dólares</strong> / <strong>6,000</strong> especialistas (02/07), OpenAI Deployment Co <strong>&gt;4 mil millones de dólares</strong> (11/05), empresa conjunta de Anthropic <strong>1.5 mil millones de dólares</strong> (04/05), Amazon cerca de <strong>1,000 millones de dólares</strong>.</li>\n      <li><span class=\"chip hot\">REGULACIÓN · UE/DE</span> <strong>Cuatro días para el Artículo 50:</strong> divulgación y etiquetado a partir del <strong>02/08</strong>, multa de hasta <strong>15 millones de euros</strong> o <strong>3%</strong> de la facturación mundial; los sistemas ya existentes tienen hasta el <strong>02/12</strong> — pero solo para el etiquetado. Aplicación en Alemania: la <strong>Bundesnetzagentur</strong>.</li>\n      <li><span class=\"chip good\">DESPLIEGUE · US · Finanzas</span> <strong>Cisco</strong> reparte, desde fines de julio, un agente personal entre cerca de <strong>90,000</strong> empleados. En el área financiera, la IA ya escribe, según el CFO, <strong>80%–90%</strong> del primer borrador de las secciones de MD&amp;A.</li>\n      <li><span class=\"chip\">ESTUDIO · DE</span> <strong>Cuatro números, una pregunta:</strong> el uso de IA en empresas alemanas en 2026 está en <strong>20%</strong>, <strong>41%</strong>, <strong>51.2%</strong> o <strong>54.5%</strong> — según la definición, el umbral de tamaño y el periodo de campo. Solo un número realmente se movió: los agentes de <em>IA</em> en la mediana empresa, de <strong>8.7% a 16.6%</strong>.</li>\n      <li><span class=\"chip\">ESTUDIO · Global</span> El <strong>Stanford HAI</strong> calcula el excedente del consumidor estadounidense proveniente de la IA generativa en <strong>172 mil millones de dólares</strong> al año (año anterior: 112 mil millones) — pero el propio estudio señala que las ganancias se concentran sobre todo en trabajo estructurado y medible.</li>\n      <li><span class=\"chip\">POLÍTICA · BR</span> <strong>Brasil regula la IA sin una ley de IA:</strong> la <strong>ANPD</strong> se posiciona como supervisión \"residual\", mientras el Marco Legal (PL 2338/2023) sigue esperando votación en el pleno.</li>\n      <li><span class=\"chip good\">twiceD</span> Dos ideas: un <strong>kit para el Artículo 50</strong> y una <strong>máquina de primer borrador para textos obligatorios</strong> — el truco de MD&amp;A de Cisco, traducido al Lagebericht alemán.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Seit die TED-Spur in diesem Brief läuft, endete jede Prüfung gleich: Der Stack passte, die Eignungshürde nicht — <strong>5 Mio. € Mindestumsatz</strong> hier, <strong>zwei Klinik-Referenzen plus ISO 27001</strong> dort, <strong>6 bis 30 Entwickler pro Los</strong> im Extremfall. Heute liegt eine Bekanntmachung vor, bei der diese Wand deutlich niedriger aussieht: Die Oberfinanzdirektion Baden-Württemberg sucht für „TCK Testautomation\" <strong>zwei Lose mit je einer externen Person</strong>, und der Bekanntmachungs-Spiegel nennt als einzigen Eignungsnachweis eine Bankbestätigung oder eine Berufshaftpflicht. Die amtliche Vergabeplattform des Landes listet zum selben Verfahren allerdings <strong>deutlich mehr Dokumente</strong> — Referenzliste, Interview-Wertungsmatrix, Eignungsmatrix, Einwilligung zur Zuverlässigkeitsüberprüfung von Fremdpersonal. Die echte Hürde liegt also vermutlich höher als eine Zeile. Frist ist der <strong>25.08.2026</strong>. Trotzdem der bislang aussichtsreichste Fall dieser Spur — mit vier ehrlichen Vorbehalten. Daneben: Das Board wächst den vierten Tag in Folge auf <strong>87 Einträge</strong>, und der härteste Filter des Tages ist kein Skill, sondern eine Adresse.</p>\n    <ul>\n      <li><span class=\"chip good\">TED</span> <strong>Der erste Fall mit passender Größenordnung</strong>: Oberfinanzdirektion Baden-Württemberg (LZfD), „Dienstleistungen TCK Testautomation\", offenes Verfahren, <strong>2 Lose × 1 externe Person</strong>, Haupt-CPV 72262000 (Software-Entwicklung). Frist <strong>25.08.2026, 11:00 MESZ</strong>, Bieterfragen bis 13.08. Bekanntmachung vom 24.07.2026, TED-ID 512867-2026 / ABl. S 141/2026 — Auftraggeber, Titel, beide Fristen und alle drei CPV sind auf der amtlichen Landes-Vergabeplattform bestätigt.<sup>[1a]</sup></li>\n      <li><span class=\"chip\">TED</span> <strong>Die Eignungshürde ist im Spiegel eine Zeile — auf der Plattform womöglich nicht</strong>: Der Spiegel nennt nur „Vorlage einer Bankbestätigung als Dritterklärung oder alternativ Vorlage eines Nachweises einer bestehenden Berufs-/Betriebshaftpflichtversicherung\" und keinen Mindestumsatz, keine FTE-Zahl, keine Referenzen, keine Zertifikate. Die Dokumentenliste des amtlichen Portals führt daneben eine Referenzliste Testautomation, eine Wertungsmatrix Interview, eine separate Eignungsmatrix und eine Muster-Einwilligung zur Zuverlässigkeitsüberprüfung von Fremdpersonal. Volumen 160 Personentage im ersten Jahr, danach 240 PT/Jahr bis 30.06.2030, Start ca. 01.11.2026.<sup>[1a]</sup></li>\n      <li><span class=\"chip hot\">TED</span> <strong>Vier Vorbehalte</strong>: Der TED-Volltext war heute erneut nicht lesbar (Detailseite JavaScript-Hülle, PDF-Abruf leerer Körper) — Volumen, Lose und Eignungszeile stammen allein vom Bekanntmachungs-Spiegel. Die Unterlagen selbst liegen hinter einer Teilnahme-Registrierung, ihr Inhalt ist also ungeprüft. Wofür „TCK\" steht und welcher Stack gefordert ist, geht aus den zugänglichen Quellen <em>nicht</em> hervor. Und zwei weitere Verfahren aus der heutigen Suche sind bereits abgelaufen.</li>\n      <li><span class=\"chip hot\">twiceD</span> <strong>Fit 88, 22. Tag, Start am Samstag</strong>: Das Telematik-Mandat von Keil Business Solutions wurde heute erneut von Hand geprüft — Anzeige offen, „Bewerben\" aktiv, Start unverändert 01.08.2026. Neu ausgelesen: die Pflichtliste des Kunden nennt <em>je mindestens fünf Jahre</em> Java, Spring/Spring Boot, Kubernetes/Helm/Docker und Gradle, dazu Angular &gt; 18 sowie ePA- und KIM-Erfahrung.</li>\n      <li><span class=\"chip\">Board</span> <strong>87 Listings</strong>: 63 Freelance, 17 Employee, 7 Intriguing. Alle 70 von gestern übernommen, <strong>17 neu, null gefallen</strong> — der vierte Wachstumstag seit dem Einbruch am 26.07. (49 → 60 → 70 → 87) und der größte Zuwachs seit dem 23.07.</li>\n      <li><span class=\"chip hot\">Rate</span> <strong>Vier genannte Freelance-Sätze, alle unter dem Plattform-Schnitt</strong>: 60–70 €/h (Experis), 75 €/h (OC Recruitment, neu), 85 €/h (Randstad), maximal 680 €/Tag ≈ 85 €/h (ProTIP für DB Systel, neu, bestätigt). freelancermap.de weist im eigenen Java-Verzeichnis <strong>87 €/h</strong> als Durchschnitt aus, Spanne 50–123 €/h.</li>\n      <li><span class=\"chip hot\">Wohnsitz</span> <strong>Der Filter läuft heute in beide Richtungen</strong>: Drei Anzeigen verlangen deutschen Wohnsitz (SÜ2 bzw. UK-Clearance) und fallen dadurch auf Fit 43, 37 und 21. Eine verlangt das Gegenteil — Hays sucht einen „Nearshore AI Engineer (Wohnsitz nur außerhalb DE)\", Fit 73, mit Claude Code und GitHub Copilot ausdrücklich im Anforderungsprofil.</li>\n      <li><span class=\"chip\">ANÜ</span> <strong>Fünf Einträge laufen nur über Arbeitnehmerüberlassung</strong> (gestern zwei). Das sind keine Aufträge für eine GmbH, sondern Anstellungen in Vermittler-Verpackung — der Fit-Algorithmus deckelt dafür die Track-Komponente auf 7 von 10, praktisch ist der Abschlag größer.</li>\n      <li><span class=\"chip\">Employee</span> <strong>Vier Schweizer Einträge, keiner nennt eine Zahl</strong>: Spitze bleibt ELCA Zürich mit Fit 81 (Anzeige vom 09.06., also 50 Tage alt). Der heute nachgeprüfte CH-Vergleichswert — Payscale, Senior Software Engineer Schweiz: <strong>Grundgehalt Ø CHF 119.722/Jahr</strong>, Median CHF 120.000, 90. Perzentil CHF 166.000 (Stand 15.12.2025) — liegt klar unter der Pflicht-Schwelle dieser Spur von CHF 150.000.</li>\n    </ul></div>",

        "en": "<div class=\"tldr\"><p class=\"lead\">Ever since the TED lane of this brief has been running, every check has ended the same way: the stack fit, the eligibility bar didn't — <strong>€5 million minimum revenue</strong> here, <strong>two hospital references plus ISO 27001</strong> there, <strong>6 to 30 developers per lot</strong> in the extreme case. Today there's a notice where that wall looks considerably lower: the Oberfinanzdirektion Baden-Württemberg is seeking <strong>two lots with one external person each</strong> for „TCK Testautomation,\" and the notice mirror lists a bank confirmation or professional liability insurance as the only proof of eligibility required. The state's official procurement platform, however, lists <strong>considerably more documents</strong> for the same procedure — a reference list, an interview scoring matrix, an eligibility matrix, consent for a reliability check of external personnel. So the real bar is probably higher than one line. The deadline is <strong>Aug 25, 2026</strong>. Still, it's the most promising case in this lane so far — with four honest caveats. Alongside that: the board grows for the fourth day running to <strong>87 entries</strong>, and today's toughest filter isn't a skill, it's an address.</p>\n    <ul>\n      <li><span class=\"chip good\">TED</span> <strong>The first case with the right order of magnitude</strong>: Oberfinanzdirektion Baden-Württemberg (LZfD), „Dienstleistungen TCK Testautomation,\" open procedure, <strong>2 lots × 1 external person</strong>, main CPV 72262000 (software development). Deadline <strong>Aug 25, 2026, 11:00 CEST</strong>, bidder questions by Aug 13. Notice dated Jul 24, 2026, TED ID 512867-2026 / OJ S 141/2026 — client, title, both deadlines, and all three CPV codes are confirmed on the state's official procurement platform.<sup>[1a]</sup></li>\n      <li><span class=\"chip\">TED</span> <strong>The eligibility bar is one line in the mirror — maybe not on the platform</strong>: the mirror lists only „Vorlage einer Bankbestätigung als Dritterklärung oder alternativ Vorlage eines Nachweises einer bestehenden Berufs-/Betriebshaftpflichtversicherung\" and no minimum revenue, no FTE count, no references, no certificates. The official portal's document list, however, also carries a test-automation reference list, an interview scoring matrix, a separate eligibility matrix, and a template consent form for a reliability check on external personnel. Volume 160 person-days in the first year, then 240 PD/year through Jun 30, 2030, start approx. Nov 1, 2026.<sup>[1a]</sup></li>\n      <li><span class=\"chip hot\">TED</span> <strong>Four caveats</strong>: the TED full text was again unreadable today (detail page is a JavaScript shell, PDF pull returns an empty body) — volume, lot count, and the eligibility line all come from the notice mirror alone. The tender documents themselves sit behind a participation registration, so their contents are unverified. What „TCK\" stands for and which stack is required does <em>not</em> emerge from the accessible sources. And two further procedures from today's search have already expired.</li>\n      <li><span class=\"chip hot\">twiceD</span> <strong>Fit 88, day 22, start on Saturday</strong>: Keil Business Solutions' telematics mandate was hand-checked again today — listing open, \"Apply\" active, start unchanged at Aug 1, 2026. Newly read out: the client's mandatory list calls for <em>at least five years each</em> of Java, Spring/Spring Boot, Kubernetes/Helm/Docker, and Gradle, plus Angular &gt; 18 and ePA and KIM experience.</li>\n      <li><span class=\"chip\">Board</span> <strong>87 listings</strong>: 63 freelance, 17 employee, 7 intriguing. All 70 from yesterday carried over, <strong>17 new, zero dropped</strong> — the fourth growth day running since the Jul 26 drop (49 → 60 → 70 → 87), and the largest daily gain since Jul 23.</li>\n      <li><span class=\"chip hot\">Rate</span> <strong>Four stated freelance rates, all below the platform average</strong>: €60–70/h (Experis), €75/h (OC Recruitment, new), €85/h (Randstad), max. €680/day ≈ €85/h (ProTIP for DB Systel, new, confirmed). freelancermap.de lists <strong>€87/h</strong> as the average in its own Java directory, range €50–123/h.</li>\n      <li><span class=\"chip hot\">Residency</span> <strong>The filter runs both ways today</strong>: three listings require German residency (SÜ2 or UK clearance, respectively) and fall to Fit 43, 37, and 21 as a result. One requires the opposite — Hays is looking for a „Nearshore AI Engineer (Wohnsitz nur außerhalb DE),\" Fit 73, with Claude Code and GitHub Copilot explicitly in the requirements profile.</li>\n      <li><span class=\"chip\">ANÜ</span> <strong>Five entries run only through temporary staffing (Arbeitnehmerüberlassung)</strong> (two yesterday). Those aren't contracts for a GmbH, but employment wrapped in an agency package — for that, the fit algorithm caps the track component at 7 of 10, though the practical discount is larger.</li>\n      <li><span class=\"chip\">Employee</span> <strong>Four Swiss entries, none states a figure</strong>: the top spot stays ELCA Zurich at Fit 81 (listing dated Jun 9, so 50 days old). Today's re-verified CH comparison value — Payscale, Senior Software Engineer Switzerland: <strong>average base salary CHF 119,722/year</strong>, median CHF 120,000, 90th percentile CHF 166,000 (as of Dec 15, 2025) — sits clearly below this lane's mandatory threshold of CHF 150,000.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Desde que a trilha do TED começou neste boletim, toda verificação terminou do mesmo jeito: o stack batia, a barreira de habilitação não — <strong>5 milhões de € de faturamento mínimo</strong> aqui, <strong>duas referências de clínica mais ISO 27001</strong> ali, <strong>de 6 a 30 desenvolvedores por lote</strong> no caso extremo. Hoje há uma convocação em que essa parede parece bem mais baixa: a Oberfinanzdirektion Baden-Württemberg busca, para „TCK Testautomation\", <strong>dois lotes com uma pessoa externa cada</strong>, e o espelho de convocações aponta como única comprovação de habilitação uma confirmação bancária ou um seguro de responsabilidade civil profissional. A plataforma oficial de licitações do estado, porém, lista para o mesmo procedimento documentos bem mais numerosos — <strong>lista de referências, matriz de avaliação de entrevista, matriz de habilitação, consentimento para verificação de confiabilidade de pessoal externo</strong>. A barreira real, portanto, deve ser mais alta que uma única linha. O prazo é <strong>25/08/2026</strong>. Ainda assim, é o caso mais promissor desta trilha até agora — com quatro ressalvas sinceras. Além disso: o board cresce pelo quarto dia seguido, chegando a <strong>87 registros</strong>, e o filtro mais duro do dia não é uma habilidade, é um endereço.</p>\n    <ul>\n      <li><span class=\"chip good\">TED</span> <strong>O primeiro caso com a ordem de grandeza certa</strong>: Oberfinanzdirektion Baden-Württemberg (LZfD), „Dienstleistungen TCK Testautomation\", procedimento aberto, <strong>2 lotes × 1 pessoa externa</strong>, CPV principal 72262000 (desenvolvimento de software). Prazo <strong>25/08/2026, 11h CEST</strong>, perguntas de licitantes até 13/08. Convocação de 24/07/2026, ID TED 512867-2026 / JO S 141/2026 — contratante, título, os dois prazos e todos os três CPV estão confirmados na plataforma oficial de licitações do estado.<sup>[1a]</sup></li>\n      <li><span class=\"chip\">TED</span> <strong>A barreira de habilitação é uma linha no espelho — talvez não na plataforma</strong>: o espelho cita apenas „Vorlage einer Bankbestätigung als Dritterklärung oder alternativ Vorlage eines Nachweises einer bestehenden Berufs-/Betriebshaftpflichtversicherung\" e nenhum faturamento mínimo, nenhum número de FTE, nenhuma referência, nenhum certificado. A lista de documentos do portal oficial, porém, também traz uma lista de referências de automação de testes, uma matriz de avaliação de entrevista, uma matriz de habilitação separada e um modelo de termo de consentimento para verificação de confiabilidade de pessoal externo. Volume de 160 dias-pessoa no primeiro ano, depois 240 dias-pessoa/ano até 30/06/2030, início por volta de 01/11/2026.<sup>[1a]</sup></li>\n      <li><span class=\"chip hot\">TED</span> <strong>Quatro ressalvas</strong>: o texto integral do TED voltou a ficar ilegível hoje (a página de detalhes é uma casca em JavaScript, o download do PDF retorna corpo vazio) — volume, número de lotes e a linha de habilitação vêm todos só do espelho de convocações. Os próprios documentos ficam atrás de um cadastro de participação, portanto seu conteúdo não foi verificado. O que „TCK\" significa e qual stack é exigido <em>não</em> aparece nas fontes acessíveis. E dois outros procedimentos da busca de hoje já expiraram.</li>\n      <li><span class=\"chip hot\">twiceD</span> <strong>Fit 88, 22º dia, início no sábado</strong>: o mandato de telemática da Keil Business Solutions foi reverificado hoje à mão — anúncio aberto, \"Bewerben\" ativo, início mantido em 01/08/2026. Novidade na leitura: a lista obrigatória do cliente pede <em>ao menos cinco anos cada</em> de Java, Spring/Spring Boot, Kubernetes/Helm/Docker e Gradle, além de Angular &gt; 18 e experiência com ePA e KIM.</li>\n      <li><span class=\"chip\">Board</span> <strong>87 vagas</strong>: 63 Freelance, 17 Employee, 7 Intriguing. Todas as 70 de ontem mantidas, <strong>17 novas, zero saíram</strong> — o quarto dia seguido de crescimento desde a queda de 26/07 (49 → 60 → 70 → 87) e o maior ganho desde 23/07.</li>\n      <li><span class=\"chip hot\">Taxa</span> <strong>Quatro taxas freelance informadas, todas abaixo da média da plataforma</strong>: 60–70 €/h (Experis), 75 €/h (OC Recruitment, nova), 85 €/h (Randstad), no máximo 680 €/dia ≈ 85 €/h (ProTIP para DB Systel, nova, confirmada). O freelancermap.de aponta, no próprio diretório de Java, uma média de <strong>87 €/h</strong>, faixa de 50–123 €/h.</li>\n      <li><span class=\"chip hot\">Residência</span> <strong>Hoje o filtro funciona nos dois sentidos</strong>: três anúncios exigem residência alemã (SÜ2 ou clearance britânico) e por isso caem para Fit 43, 37 e 21. Um exige o oposto — a Hays busca um „Nearshore AI Engineer (Wohnsitz nur außerhalb DE)\", Fit 73, com Claude Code e GitHub Copilot explicitamente no perfil de requisitos.</li>\n      <li><span class=\"chip\">ANÜ</span> <strong>Cinco registros passam só por cessão de mão de obra</strong> (ontem eram dois). Não são contratos para uma GmbH, e sim vínculos empregatícios embrulhados por uma intermediária — por isso o algoritmo de Fit limita o componente de track a 7 de 10, mas na prática o desconto é maior.</li>\n      <li><span class=\"chip\">Employee</span> <strong>Quatro registros suíços, nenhum informa valor</strong>: a liderança segue com a ELCA Zurique, Fit 81 (anúncio de 09/06, portanto com 50 dias). O valor de comparação para a Suíça reverificado hoje — Payscale, Senior Software Engineer Suíça: <strong>salário-base médio de CHF 119.722/ano</strong>, mediana de CHF 120.000, percentil 90 de CHF 166.000 (posição de 15/12/2025) — fica claramente abaixo do piso obrigatório desta trilha, de CHF 150.000.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Desde que la vía del TED corre en este boletín, cada revisión terminó igual: el stack encajaba, la barrera de idoneidad no — <strong>5 millones de € de facturación mínima</strong> aquí, <strong>dos referencias de clínica más ISO 27001</strong> allá, <strong>de 6 a 30 desarrolladores por lote</strong> en el caso extremo. Hoy hay una convocatoria en la que ese muro se ve bastante más bajo: la Oberfinanzdirektion Baden-Württemberg busca, para „TCK Testautomation\", <strong>dos lotes con una persona externa cada uno</strong>, y el espejo de convocatorias indica como única prueba de idoneidad una confirmación bancaria o un seguro de responsabilidad civil profesional. La plataforma oficial de contratación del estado, sin embargo, enumera para el mismo procedimiento bastantes más documentos — <strong>lista de referencias, matriz de evaluación de entrevista, matriz de idoneidad, consentimiento para verificación de confiabilidad de personal externo</strong>. Así que la barrera real probablemente sea más alta que una línea. El plazo es el <strong>25/08/2026</strong>. Aun así, es el caso más prometedor de esta vía hasta ahora — con cuatro reservas sinceras. Además: el board crece por cuarto día seguido hasta <strong>87 registros</strong>, y el filtro más duro del día no es una habilidad, es una dirección.</p>\n    <ul>\n      <li><span class=\"chip good\">TED</span> <strong>El primer caso con la magnitud correcta</strong>: Oberfinanzdirektion Baden-Württemberg (LZfD), „Dienstleistungen TCK Testautomation\", procedimiento abierto, <strong>2 lotes × 1 persona externa</strong>, CPV principal 72262000 (desarrollo de software). Plazo <strong>25/08/2026, 11h CEST</strong>, preguntas de licitantes hasta el 13/08. Convocatoria del 24/07/2026, ID TED 512867-2026 / DO S 141/2026 — entidad contratante, título, ambos plazos y los tres CPV están confirmados en la plataforma oficial de contratación del estado.<sup>[1a]</sup></li>\n      <li><span class=\"chip\">TED</span> <strong>La barrera de idoneidad es una línea en el espejo — quizá no en la plataforma</strong>: el espejo solo cita „Vorlage einer Bankbestätigung als Dritterklärung oder alternativ Vorlage eines Nachweises einer bestehenden Berufs-/Betriebshaftpflichtversicherung\" y ninguna facturación mínima, ningún número de FTE, ninguna referencia, ningún certificado. La lista de documentos del portal oficial, en cambio, también incluye una lista de referencias de automatización de pruebas, una matriz de evaluación de entrevista, una matriz de idoneidad separada y un modelo de consentimiento para verificación de confiabilidad de personal externo. Volumen de 160 días-persona en el primer año, luego 240 días-persona/año hasta el 30/06/2030, inicio hacia el 01/11/2026.<sup>[1a]</sup></li>\n      <li><span class=\"chip hot\">TED</span> <strong>Cuatro reservas</strong>: el texto completo del TED volvió a ser ilegible hoy (la página de detalle es una cáscara en JavaScript, la descarga del PDF devuelve un cuerpo vacío) — volumen, número de lotes y la línea de idoneidad vienen todos solo del espejo de convocatorias. Los documentos mismos están detrás de un registro de participación, así que su contenido no está verificado. Qué significa „TCK\" y qué stack se exige <em>no</em> se desprende de las fuentes accesibles. Y otros dos procedimientos de la búsqueda de hoy ya vencieron.</li>\n      <li><span class=\"chip hot\">twiceD</span> <strong>Fit 88, día 22, inicio el sábado</strong>: el mandato de telemática de Keil Business Solutions se reverificó hoy a mano — anuncio abierto, \"Bewerben\" activo, inicio sin cambios en 01/08/2026. Nuevo en la lectura: la lista obligatoria del cliente pide <em>al menos cinco años cada uno</em> de Java, Spring/Spring Boot, Kubernetes/Helm/Docker y Gradle, además de Angular &gt; 18 y experiencia con ePA y KIM.</li>\n      <li><span class=\"chip\">Board</span> <strong>87 vacantes</strong>: 63 Freelance, 17 Employee, 7 Intriguing. Las 70 de ayer se mantienen, <strong>17 nuevas, cero salieron</strong> — el cuarto día seguido de crecimiento desde la caída del 26/07 (49 → 60 → 70 → 87) y el mayor aumento desde el 23/07.</li>\n      <li><span class=\"chip hot\">Tarifa</span> <strong>Cuatro tarifas freelance declaradas, todas por debajo del promedio de la plataforma</strong>: 60–70 €/h (Experis), 75 €/h (OC Recruitment, nueva), 85 €/h (Randstad), máximo 680 €/día ≈ 85 €/h (ProTIP para DB Systel, nueva, confirmada). freelancermap.de indica, en su propio directorio de Java, un promedio de <strong>87 €/h</strong>, con un rango de 50–123 €/h.</li>\n      <li><span class=\"chip hot\">Residencia</span> <strong>Hoy el filtro corre en ambos sentidos</strong>: tres anuncios exigen residencia alemana (SÜ2 o habilitación británica) y por eso caen a Fit 43, 37 y 21. Uno exige lo contrario — Hays busca un „Nearshore AI Engineer (Wohnsitz nur außerhalb DE)\", Fit 73, con Claude Code y GitHub Copilot explícitamente en el perfil de requisitos.</li>\n      <li><span class=\"chip\">ANÜ</span> <strong>Cinco registros pasan solo por cesión de trabajadores</strong> (ayer eran dos). No son contratos para una GmbH, sino empleos envueltos en una intermediaria — por eso el algoritmo de Fit limita el componente de track a 7 de 10, aunque en la práctica el descuento es mayor.</li>\n      <li><span class=\"chip\">Employee</span> <strong>Cuatro registros suizos, ninguno indica cifra</strong>: el primer lugar sigue con ELCA Zúrich, Fit 81 (anuncio del 09/06, por lo tanto con 50 días). El valor de comparación para Suiza reverificado hoy — Payscale, Senior Software Engineer Suiza: <strong>salario base promedio de CHF 119.722/año</strong>, mediana de CHF 120.000, percentil 90 de CHF 166.000 (al 15/12/2025) — queda claramente por debajo del umbral obligatorio de esta vía, de CHF 150.000.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Mittwoch, der 29. Juli, Schultag drei des zweiten Halbjahrs — und der einzige Tag dieser Woche, an dem Regen im Spiel ist. Wie viel Regen, darüber sind sich unsere beiden Wetterportale ungewöhnlich uneins: <strong>40 % gegen 80 %</strong>. Beide sind sich aber einig, dass es wenig ist und dass es nachmittags kommt — und noch wichtiger: beide sehen von morgen bis Sonntag <strong>durchgehend trocken</strong>, mit Samstag als wärmstem Tag. Das Wochenende ist damit offen. Dazu ein echter neuer Fund im Day-Trip-Ring — und zwei Ausflugs-Tipps, die wir heute wieder aussortiert haben, weil sie aus dem falschen Jahr stammen.</p>\n    <ul>\n      <li><span class=\"chip hot\">WETTER</span> <strong>Heute strittig:</strong> Climatempo 28°/19 °C bei <strong>40 %</strong> Regen und 1,1 mm, theweather ≈ 24°/15 °C bei <strong>80 %</strong> und 3,7 mm. Beide: Schauer erst am Nachmittag, beide: unter 4 mm.</li>\n      <li><span class=\"chip good\">WETTER</span> <strong>Ab morgen vier trockene Tage</strong> — Do 23°/17°, Fr 26°/17°, Sa <strong>29°/17°</strong>, So 28°/18°, jeweils 0 % Regen. Hier sind sich beide Portale einig.</li>\n      <li><span class=\"chip good\">EVENT</span> <strong>Neu im Day-Trip-Ring:</strong> CineSolar, das solarbetriebene Open-Air-Kino, zeigt am <strong>Mi 05.08. ab 19 Uhr</strong> „A Pequena Sereia\" in Ourinhos — Eintritt frei, Popcorn frei, ausdrücklich für alle Altersstufen.</li>\n      <li><span class=\"chip good\">EVENT</span> <strong>Sesc Londrina hat aufgestockt:</strong> jetzt <strong>vier</strong> kostenlose Ausstellungen im selben Haus, dazu am So 02.08. um 17 Uhr „Show com Souza\".</li>\n      <li><span class=\"chip\">TRIP</span> <strong>Samstag raus, Sonntag Londrina</strong> — bei 29 °C und 0 % Regen gehört der Samstag nach draußen, der Sonntag ins Sesc.</li>\n      <li><span class=\"chip hot\">ACHTUNG</span> <strong>Zwei Tipps aussortiert:</strong> die „Festa das Nações\" in Ourinhos ist ein Artikel von 2022, das Tiago-Iorc-Konzert im SESI Ourinhos einer von 2024. Der Wochentags-Test entlarvt beide.</li>\n      <li><span class=\"chip\">SCHULE</span> <strong>Tag drei.</strong> Recesso 13.–24.07., Unterricht der Rede Estadual seit Montag 27.07. wieder im Regelbetrieb.</li>\n      <li><span class=\"chip\">GESUNDHEIT</span> <strong>Dengue in Paraná weiter niedrig</strong> (Informe nº 23, SE 01–28/2026: 5.701 bestätigte Fälle landesweit) — aber die Todesfälle stiegen von 2 auf 4, und der oft zitierte „–94 %\"-Vergleich hinkt.</li>\n      <li><span class=\"chip hot\">BABY</span> <strong>Atemwegs-Lage veraltet:</strong> der letzte für Paraná spezifische Stand ist <strong>drei Wochen alt</strong> (SE 26/2026: SRAG-Welle im Staat mit Anzeichen von Abflachen, Curitiba aber weiter auf Alarmniveau). Kein frischeres Bulletin abrufbar.</li>\n      <li><span class=\"chip\">DE-BR</span> <strong>Der Wochentags-Test</strong> — wie man in zehn Sekunden prüft, ob eine brasilianische Veranstaltungsmeldung aus diesem Jahr ist.</li>\n    </ul></div>",

 Artikel von 2022, das Tiago-Iorc-Konzert im SESI Ourinhos einer von 2024. Der Wochentags-Test entlarvt beide.</li>\n      <li><span class=\"chip\">SCHULE</span> <strong>Tag drei.</strong> Recesso 13.–24.07., Unterricht der Rede Estadual seit Montag 27.07. wieder im Regelbetrieb.</li>\n      <li><span class=\"chip\">GESUNDHEIT</span> <strong>Dengue in Paraná weiter niedrig</strong> (Informe nº 23, SE 01–28/2026: 5.701 bestätigte Fälle landesweit) — aber die Todesfälle stiegen von 2 auf 4, und der oft zitierte „–94 %\"-Vergleich hinkt.</li>\n      <li><span class=\"chip hot\">BABY</span> <strong>Atemwegs-Lage veraltet:</strong> der letzte für Paraná spezifische Stand ist <strong>drei Wochen alt</strong> (SE 26/2026: SRAG-Welle im Staat mit Anzeichen von Abflachen, Curitiba aber weiter auf Alarmniveau). Kein frischeres Bulletin abrufbar.</li>\n      <li><span class=\"chip\">DE-BR</span> <strong>Der Wochentags-Test</strong> — wie man in zehn Sekunden prüft, ob eine brasilianische Veranstaltungsmeldung aus diesem Jahr ist.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Wednesday, July 29, day three of school for the second half-year — and the only day this week when rain is in play. How much rain is where our two weather portals unusually disagree: <strong>40% versus 80%</strong>. Both agree, though, that it's light and that it arrives in the afternoon — and more importantly: both show dry straight through from tomorrow to Sunday, with Saturday as the warmest day. That leaves the weekend wide open. On top of that, a genuine new find in the day-trip ring — and two outing tips we sorted back out today because they turned out to be from the wrong year.</p>\n    <ul>\n      <li><span class=\"chip hot\">WEATHER</span> <strong>Disputed today:</strong> Climatempo 28°/19°C with 40% rain and 1.1 mm, theweather ≈ 24°/15°C with 80% and 3.7 mm. Both: showers only in the afternoon, both: under 4 mm.</li>\n      <li><span class=\"chip good\">WEATHER</span> <strong>Starting tomorrow, four dry days</strong> — Thu 23°/17°, Fri 26°/17°, Sat <strong>29°/17°</strong>, Sun 28°/18°, each with 0% rain. Here both portals agree.</li>\n      <li><span class=\"chip good\">EVENT</span> <strong>New in the day-trip ring:</strong> CineSolar, the solar-powered open-air cinema, shows \"A Pequena Sereia\" in Ourinhos on <strong>Wed 08/05 starting at 7 PM</strong> — free admission, free popcorn, explicitly for all ages.</li>\n      <li><span class=\"chip good\">EVENT</span> <strong>Sesc Londrina added more:</strong> now <strong>four</strong> free exhibits under the same roof, plus \"Show com Souza\" on Sun 08/02 at 5 PM.</li>\n      <li><span class=\"chip\">TRIP</span> <strong>Saturday outdoors, Sunday Londrina</strong> — at 29°C and 0% rain, Saturday belongs outside, Sunday at the Sesc.</li>\n      <li><span class=\"chip hot\">HEADS UP</span> <strong>Two tips sorted back out:</strong> the \"Festa das Nações\" in Ourinhos is a 2022 article, the Tiago Iorc concert at SESI Ourinhos a 2024 one. The weekday test exposes both.</li>\n      <li><span class=\"chip\">SCHOOL</span> <strong>Day three.</strong> Recesso ran 07/13–24, classes at the rede estadual back to normal since Monday, 07/27.</li>\n      <li><span class=\"chip\">HEALTH</span> <strong>Dengue in Paraná still low</strong> (Informe nº 23, SE 01–28/2026: 5,701 confirmed cases statewide) — but deaths rose from 2 to 4, and the often-cited \"-94%\" comparison doesn't quite hold up.</li>\n      <li><span class=\"chip hot\">BABY</span> <strong>Respiratory data stale:</strong> the last Paraná-specific status is <strong>three weeks old</strong> (epi week 26/2026: SRAG wave in the state showing signs of flattening, but Curitiba still at alert level). No fresher bulletin available.</li>\n      <li><span class=\"chip\">DE-BR</span> <strong>The weekday test</strong> — how to check in ten seconds whether a Brazilian event listing is actually from this year.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Quarta-feira, 29 de julho, terceiro dia de aula do segundo semestre — e o único dia desta semana em que a chuva entra em cena. Quanto vai chover, aí nossos dois portais de clima discordam de um jeito incomum: <strong>40% contra 80%</strong>. Mas os dois concordam que é pouco e que chega à tarde — e, mais importante: ambos indicam tempo seco direto de amanhã até domingo, com o sábado como o dia mais quente. O fim de semana fica, assim, em aberto. Além disso, um achado novo de verdade no anel de passeios de um dia — e duas dicas de passeio que hoje voltamos a descartar, porque eram de um ano errado.</p>\n    <ul>\n      <li><span class=\"chip hot\">CLIMA</span> <strong>Hoje em disputa:</strong> Climatempo 28°/19 °C com 40% de chuva e 1,1 mm, theweather ≈ 24°/15 °C com 80% e 3,7 mm. Os dois: pancadas só à tarde, os dois: abaixo de 4 mm.</li>\n      <li><span class=\"chip good\">CLIMA</span> <strong>A partir de amanhã, quatro dias secos</strong> — qui 23°/17°, sex 26°/17°, sáb <strong>29°/17°</strong>, dom 28°/18°, todos com 0% de chuva. Aqui os dois portais concordam.</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Novidade no anel de passeios de um dia:</strong> o CineSolar, cinema ao ar livre movido a energia solar, exibe \"A Pequena Sereia\" em Ourinhos na <strong>qua 05/08, a partir das 19h</strong> — entrada gratuita, pipoca gratuita, explicitamente para todas as idades.</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>O Sesc Londrina ampliou:</strong> agora são <strong>quatro</strong> exposições gratuitas no mesmo prédio, além de \"Show com Souza\" no dom 02/08 às 17h.</li>\n      <li><span class=\"chip\">PASSEIO</span> <strong>Sábado ao ar livre, domingo em Londrina</strong> — com 29 °C e 0% de chuva, o sábado é para ficar ao ar livre, o domingo é para o Sesc.</li>\n      <li><span class=\"chip hot\">ATENÇÃO</span> <strong>Duas dicas descartadas:</strong> a \"Festa das Nações\" em Ourinhos é uma matéria de 2022, o show do Tiago Iorc no SESI Ourinhos, de 2024. O teste do dia da semana desmascara os dois.</li>\n      <li><span class=\"chip\">ESCOLA</span> <strong>Terceiro dia.</strong> Recesso de 13 a 24/07, aulas da rede estadual em funcionamento normal desde segunda-feira, 27/07.</li>\n      <li><span class=\"chip\">SAÚDE</span> <strong>Dengue no Paraná continua baixa</strong> (Informe nº 23, SE 01–28/2026: 5.701 casos confirmados em todo o estado) — mas os óbitos subiram de 2 para 4, e a comparação de \"-94%\" tantas vezes citada manca.</li>\n      <li><span class=\"chip hot\">BEBÊ</span> <strong>Situação respiratória desatualizada:</strong> o último dado específico para o Paraná tem <strong>três semanas</strong> (SE 26/2026: onda de SRAG no estado com sinais de estabilização, mas Curitiba ainda em nível de alerta). Nenhum boletim mais recente disponível.</li>\n      <li><span class=\"chip\">DE-BR</span> <strong>O teste do dia da semana</strong> — como checar em dez segundos se uma notícia de evento brasileira é deste ano.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Miércoles 29 de julio, tercer día de clases del segundo semestre — y el único día de esta semana en el que la lluvia entra en juego. Cuánta lluvia, ahí nuestros dos portales del clima discrepan de forma inusual: <strong>40% contra 80%</strong>. Pero ambos coinciden en que es poca y que llega por la tarde — y, más importante: los dos muestran tiempo seco de corrido desde mañana hasta el domingo, con el sábado como el día más cálido. Eso deja el fin de semana totalmente abierto. Además, un hallazgo nuevo de verdad en el anillo de excursiones de un día — y dos recomendaciones de paseo que hoy volvimos a descartar, porque resultaron ser de un año equivocado.</p>\n    <ul>\n      <li><span class=\"chip hot\">CLIMA</span> <strong>Hoy en disputa:</strong> Climatempo 28°/19 °C con 40% de lluvia y 1,1 mm, theweather ≈ 24°/15 °C con 80% y 3,7 mm. Ambos: chubascos solo por la tarde, ambos: por debajo de 4 mm.</li>\n      <li><span class=\"chip good\">CLIMA</span> <strong>Desde mañana, cuatro días secos</strong> — jue 23°/17°, vie 26°/17°, sáb <strong>29°/17°</strong>, dom 28°/18°, todos con 0% de lluvia. Aquí ambos portales coinciden.</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Nuevo en el anillo de excursiones:</strong> CineSolar, el cine al aire libre con energía solar, proyecta \"A Pequena Sereia\" en Ourinhos el <strong>mié 05/08, a partir de las 19:00</strong> — entrada gratis, palomitas gratis, explícitamente para todas las edades.</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>El Sesc Londrina amplió su oferta:</strong> ahora son <strong>cuatro</strong> exposiciones gratuitas bajo el mismo techo, además de \"Show com Souza\" el dom 02/08 a las 17:00.</li>\n      <li><span class=\"chip\">PASEO</span> <strong>Sábado afuera, domingo en Londrina</strong> — con 29 °C y 0% de lluvia, el sábado es para estar al aire libre, el domingo para el Sesc.</li>\n      <li><span class=\"chip hot\">ATENCIÓN</span> <strong>Dos recomendaciones descartadas:</strong> la \"Festa das Nações\" en Ourinhos es un artículo de 2022, el concierto de Tiago Iorc en el SESI Ourinhos, uno de 2024. La prueba del día de la semana desenmascara a ambos.</li>\n      <li><span class=\"chip\">ESCUELA</span> <strong>Tercer día.</strong> Receso del 13 al 24/07, clases de la rede estadual de vuelta a la normalidad desde el lunes 27/07.</li>\n      <li><span class=\"chip\">SALUD</span> <strong>El dengue en Paraná sigue bajo</strong> (Informe nº 23, SE 01–28/2026: 5.701 casos confirmados en todo el estado) — pero las muertes subieron de 2 a 4, y la comparación de \"-94%\" tan citada cojea.</li>\n      <li><span class=\"chip hot\">BEBÉ</span> <strong>Situación respiratoria desactualizada:</strong> el último dato específico para Paraná tiene <strong>tres semanas</strong> (SE 26/2026: la ola de SRAG en el estado muestra señales de estabilizarse, pero Curitiba sigue en nivel de alerta). No hay un boletín más reciente disponible.</li>\n      <li><span class=\"chip\">DE-BR</span> <strong>La prueba del día de la semana</strong> — cómo comprobar en diez segundos si el aviso de un evento brasileño es de este año.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Mittwoch, der 29. Juli — Rotationsthema <em>Familie &amp; Alltag</em>, und heute geht es um das Ereignis, das einen Haushalt schneller umbaut als jeder Umzug: ein Kind kommt. Das Wortfeld ist der wohl ergiebigste Fallenacker, den diese vier Sprachen zu bieten haben: der berühmteste falsche Freund zwischen Spanisch und Portugiesisch (<em>embarazada</em> heißt schwanger, <em>embaraçada</em> heißt verlegen), die deutsche Perfekt-Falle des Jahres (<em>ich habe geboren</em> — die Mutter, nicht das Kind), und ein brasilianisches Wort für den „Baby-Tee\", wo Mexiko einfach das englische übernimmt. <strong>11 Einträge, davon 3 Verben mit voller Konjugation</strong>, plus 2 Auffrischungen vom 8. Juli. Roter Faden: Romanisch packt Braut-Aussteuer, Schul- und Babyausstattung in <em>ein</em> Wort — Deutsch braucht drei.</p>\n    <ul>\n      <li><span class=\"chip hot\">FALSE FRIEND</span> <strong>embarazada ≠ embaraçada</strong> — Spanisch <em>embarazada</em> heißt „schwanger\" (<em>Carolina está embarazada de gemelos</em>). Portugiesisch <em>embaraçada</em> heißt „verlegen, verheddert, verwirrt\" — Priberam: <em>„Causar ou sentir vergonha ou acanhamento\"</em>. Zwei Nachbarsprachen, ein Buchstabe Unterschied, ein Bedeutungsabgrund. <span class=\"src\"><a href=\"https://www.spanishdict.com/translate/embarazada\">spanishdict.com</a> · <a href=\"https://dicionario.priberam.org/embara%C3%A7ada\">priberam.org</a></span></li>\n      <li><span class=\"chip\">KONJUGATION</span> <strong>ich habe geboren, aber ich bin geboren</strong> — verbformen.de führt für <em>gebären</em> das Hilfsverb <strong>haben</strong>: <em>ich habe geboren</em>. Wer <em>ich bin geboren</em> sagt, sagt etwas völlig anderes — das ist das Kind, nicht die Mutter. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/geb%C3%A4ren.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip\">KONJUGATION</span> <strong>eu dou à luz, yo doy a luz</strong> — für „gebären\" nehmen Portugiesisch und Spanisch dasselbe Bild („ans Licht geben\") und dasselbe unregelmäßige Verb <em>dar</em>. Im Perfekt trennen sich die Wege: <em>eu dei</em> gegen <em>yo di</em>, <em>nós demos</em> gegen <em>nosotros dimos</em>. <span class=\"src\"><a href=\"https://www.conjugacao.com.br/verbo-dar/\">conjugacao.com.br</a> · <a href=\"https://conjugator.reverso.net/conjugation-spanish-verb-dar.html\">reverso.net</a></span></li>\n      <li><span class=\"chip\">GENUS</span> <strong>a gravidez (f) ↔ el embarazo (m)</strong> — dasselbe Konzept, gegensätzliches Geschlecht. Portugiesisch endet auf <em>-ez</em> und ist weiblich, Spanisch auf <em>-azo</em> und ist männlich. Bei der Windel dreht sich das Vorzeichen erneut: <em>a fralda</em> (f) gegen <em>el pañal</em> (m).</li>\n      <li><span class=\"chip\">BR-PT</span> <strong>o chá de bebê</strong> — Brasilien lädt zum „Baby-Tee\", nicht zur Dusche: Linguee führt <em>chá de bebê</em> ausdrücklich als <em>„noun, masculine [Braz.] — baby shower\"</em>. Mexiko übernimmt dagegen kommentarlos das englische <em>baby shower</em>. <span class=\"src\"><a href=\"https://www.linguee.com/portuguese-english/translation/ch%C3%A1+de+beb%C3%AA.html\">linguee.com</a></span></li>\n      <li><span class=\"chip\">BR-PT</span> <strong>o enxoval</strong> — ein Wort für drei deutsche: Priberam definiert es als <em>„Conjunto de roupas de um recém-nascido, de um colegial, etc\"</em>. Also Baby-Erstausstattung, Schulausstattung und Braut-Aussteuer in einem Begriff; Spanisch macht mit <em>el ajuar</em> genau dasselbe. <span class=\"src\"><a href=\"https://dicionario.priberam.org/enxoval\">priberam.org</a></span></li>\n      <li><span class=\"chip good\">IDIOM</span> <strong>in anderen Umständen sein</strong> — dict.cc gibt als Entsprechung <em>„to be expecting [coll.] [pregnant]\"</em>, daneben <em>in the family way</em>. Brasilien hat die direktere Variante: Priberam führt <em>de barriga</em> als <em>„Em estado de gravidez\"</em>. <span class=\"src\"><a href=\"https://www.dict.cc/?s=in+anderen+Umst%C3%A4nden\">dict.cc</a> · <a href=\"https://dicionario.priberam.org/barriga\">priberam.org</a></span></li>\n    </ul></div>",

uz</strong> — für „gebären\" nehmen Portugiesisch und Spanisch dasselbe Bild („ans Licht geben\") und dasselbe unregelmäßige Verb <em>dar</em>. Im Perfekt trennen sich die Wege: <em>eu dei</em> gegen <em>yo di</em>, <em>nós demos</em> gegen <em>nosotros dimos</em>. <span class=\"src\"><a href=\"https://www.conjugacao.com.br/verbo-dar/\">conjugacao.com.br</a> · <a href=\"https://conjugator.reverso.net/conjugation-spanish-verb-dar.html\">reverso.net</a></span></li>\n      <li><span class=\"chip\">GENUS</span> <strong>a gravidez (f) ↔ el embarazo (m)</strong> — dasselbe Konzept, gegensätzliches Geschlecht. Portugiesisch endet auf <em>-ez</em> und ist weiblich, Spanisch auf <em>-azo</em> und ist männlich. Bei der Windel dreht sich das Vorzeichen erneut: <em>a fralda</em> (f) gegen <em>el pañal</em> (m).</li>\n      <li><span class=\"chip\">BR-PT</span> <strong>o chá de bebê</strong> — Brasilien lädt zum „Baby-Tee\", nicht zur Dusche: Linguee führt <em>chá de bebê</em> ausdrücklich als <em>„noun, masculine [Braz.] — baby shower\"</em>. Mexiko übernimmt dagegen kommentarlos das englische <em>baby shower</em>. <span class=\"src\"><a href=\"https://www.linguee.com/portuguese-english/translation/ch%C3%A1+de+beb%C3%AA.html\">linguee.com</a></span></li>\n      <li><span class=\"chip\">BR-PT</span> <strong>o enxoval</strong> — ein Wort für drei deutsche: Priberam definiert es als <em>„Conjunto de roupas de um recém-nascido, de um colegial, etc\"</em>. Also Baby-Erstausstattung, Schulausstattung und Braut-Aussteuer in einem Begriff; Spanisch macht mit <em>el ajuar</em> genau dasselbe. <span class=\"src\"><a href=\"https://dicionario.priberam.org/enxoval\">priberam.org</a></span></li>\n      <li><span class=\"chip good\">IDIOM</span> <strong>in anderen Umständen sein</strong> — dict.cc gibt als Entsprechung <em>„to be expecting [coll.] [pregnant]\"</em>, daneben <em>in the family way</em>. Brasilien hat die direktere Variante: Priberam führt <em>de barriga</em> als <em>„Em estado de gravidez\"</em>. <span class=\"src\"><a href=\"https://www.dict.cc/?s=in+anderen+Umst%C3%A4nden\">dict.cc</a> · <a href=\"https://dicionario.priberam.org/barriga\">priberam.org</a></span></li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Wednesday, July 29 — rotation theme <em>Family &amp; Everyday Life</em>, and today's topic is the event that remodels a household faster than any move: a baby arrives. This word field is arguably the richest trap field these four languages have to offer: the most famous false friend between Spanish and Portuguese (<em>embarazada</em> means pregnant, <em>embaraçada</em> means embarrassed), the German perfect-tense trap of the year (<em>ich habe geboren</em> — the mother, not the child), and a Brazilian word for \"baby tea\" where Mexico simply borrows the English term. <strong>11 entries, 3 of them verbs with full conjugation</strong>, plus 2 refreshers from July 8. The through-line: the Romance languages pack bridal trousseau, school kit, and baby layette into <em>one</em> word — German needs three.</p>\n    <ul>\n      <li><span class=\"chip hot\">FALSE FRIEND</span> <strong>embarazada ≠ embaraçada</strong> — Spanish <em>embarazada</em> means \"pregnant\" (<em>Carolina está embarazada de gemelos</em>). Portuguese <em>embaraçada</em> means \"embarrassed, tangled, confused\" — Priberam: <em>„Causar ou sentir vergonha ou acanhamento\"</em>. Two neighboring languages, one letter apart, a world of meaning apart. <span class=\"src\"><a href=\"https://www.spanishdict.com/translate/embarazada\">spanishdict.com</a> · <a href=\"https://dicionario.priberam.org/embara%C3%A7ada\">priberam.org</a></span></li>\n      <li><span class=\"chip\">CONJUGATION</span> <strong>ich habe geboren, but ich bin geboren</strong> — verbformen.de lists <strong>haben</strong> as the auxiliary verb for <em>gebären</em>: <em>ich habe geboren</em>. Whoever says <em>ich bin geboren</em> is saying something completely different — that's the child, not the mother. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/geb%C3%A4ren.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip\">CONJUGATION</span> <strong>eu dou à luz, yo doy a luz</strong> — for \"to give birth,\" Portuguese and Spanish use the same image (\"to give to the light\") and the same irregular verb, <em>dar</em>. In the perfect tense the paths split: <em>eu dei</em> versus <em>yo di</em>, <em>nós demos</em> versus <em>nosotros dimos</em>. <span class=\"src\"><a href=\"https://www.conjugacao.com.br/verbo-dar/\">conjugacao.com.br</a> · <a href=\"https://conjugator.reverso.net/conjugation-spanish-verb-dar.html\">reverso.net</a></span></li>\n      <li><span class=\"chip\">GENDER</span> <strong>a gravidez (f) ↔ el embarazo (m)</strong> — same concept, opposite gender. Portuguese ends in <em>-ez</em> and is feminine, Spanish ends in <em>-azo</em> and is masculine. With the diaper, the sign flips again: <em>a fralda</em> (f) versus <em>el pañal</em> (m).</li>\n      <li><span class=\"chip\">BR-PT</span> <strong>o chá de bebê</strong> — Brazil invites you to \"baby tea,\" not a shower: Linguee explicitly lists <em>chá de bebê</em> as <em>„noun, masculine [Braz.] — baby shower\"</em>. Mexico, by contrast, borrows the English <em>baby shower</em> without comment. <span class=\"src\"><a href=\"https://www.linguee.com/portuguese-english/translation/ch%C3%A1+de+beb%C3%AA.html\">linguee.com</a></span></li>\n      <li><span class=\"chip\">BR-PT</span> <strong>o enxoval</strong> — one word for three German ones: Priberam defines it as <em>„Conjunto de roupas de um recém-nascido, de um colegial, etc\"</em>. So baby layette, school kit, and bridal trousseau in a single term; Spanish does exactly the same with <em>el ajuar</em>. <span class=\"src\"><a href=\"https://dicionario.priberam.org/enxoval\">priberam.org</a></span></li>\n      <li><span class=\"chip good\">IDIOM</span> <strong>in anderen Umständen sein</strong> — dict.cc gives <em>„to be expecting [coll.] [pregnant]\"</em> as the equivalent, alongside <em>in the family way</em>. Brazil has the more direct version: Priberam lists <em>de barriga</em> as <em>„Em estado de gravidez\"</em>. <span class=\"src\"><a href=\"https://www.dict.cc/?s=in+anderen+Umst%C3%A4nden\">dict.cc</a> · <a href=\"https://dicionario.priberam.org/barriga\">priberam.org</a></span></li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Quarta-feira, 29 de julho — tema da rotação <em>Família &amp; Cotidiano</em>, e hoje o assunto é o acontecimento que reforma uma casa mais rápido do que qualquer mudança: a chegada de um bebê. Esse campo lexical é provavelmente o terreno mais fértil de pegadinhas que essas quatro línguas têm a oferecer: o falso cognato mais famoso entre espanhol e português (<em>embarazada</em> quer dizer grávida, <em>embaraçada</em> quer dizer envergonhada), a pegadinha alemã do pretérito perfeito do ano (<em>ich habe geboren</em> — a mãe, não a criança), e uma palavra brasileira para o \"chá de bebê\", enquanto o México simplesmente adota a palavra em inglês. <strong>11 itens, 3 deles verbos com conjugação completa</strong>, além de 2 revisões de 8 de julho. Fio condutor: as línguas românicas empacotam enxoval de noiva, material escolar e enxoval de bebê numa <em>única</em> palavra — o alemão precisa de três.</p>\n    <ul>\n      <li><span class=\"chip hot\">FALSO COGNATO</span> <strong>embarazada ≠ embaraçada</strong> — o espanhol <em>embarazada</em> significa \"grávida\" (<em>Carolina está embarazada de gemelos</em>). O português <em>embaraçada</em> significa \"envergonhada, enrolada, confusa\" — Priberam: <em>„Causar ou sentir vergonha ou acanhamento\"</em>. Duas línguas vizinhas, uma letra de diferença, um abismo de significado. <span class=\"src\"><a href=\"https://www.spanishdict.com/translate/embarazada\">spanishdict.com</a> · <a href=\"https://dicionario.priberam.org/embara%C3%A7ada\">priberam.org</a></span></li>\n      <li><span class=\"chip\">CONJUGAÇÃO</span> <strong>ich habe geboren, mas ich bin geboren</strong> — o verbformen.de indica <strong>haben</strong> como o verbo auxiliar de <em>gebären</em>: <em>ich habe geboren</em>. Quem diz <em>ich bin geboren</em> está dizendo algo completamente diferente — é a criança, não a mãe. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/geb%C3%A4ren.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip\">CONJUGAÇÃO</span> <strong>eu dou à luz, yo doy a luz</strong> — para \"dar à luz\", português e espanhol usam a mesma imagem (\"dar para a luz\") e o mesmo verbo irregular, <em>dar</em>. No pretérito perfeito, os caminhos se separam: <em>eu dei</em> contra <em>yo di</em>, <em>nós demos</em> contra <em>nosotros dimos</em>. <span class=\"src\"><a href=\"https://www.conjugacao.com.br/verbo-dar/\">conjugacao.com.br</a> · <a href=\"https://conjugator.reverso.net/conjugation-spanish-verb-dar.html\">reverso.net</a></span></li>\n      <li><span class=\"chip\">GÊNERO</span> <strong>a gravidez (f) ↔ el embarazo (m)</strong> — mesmo conceito, gênero oposto. O português termina em <em>-ez</em> e é feminino, o espanhol termina em <em>-azo</em> e é masculino. Na fralda, o sinal se inverte de novo: <em>a fralda</em> (f) contra <em>el pañal</em> (m).</li>\n      <li><span class=\"chip\">BR-PT</span> <strong>o chá de bebê</strong> — no Brasil, o convite é pra um \"chá de bebê\", não pra um \"banho\": o Linguee lista <em>chá de bebê</em> explicitamente como <em>„noun, masculine [Braz.] — baby shower\"</em>. Já o México adota sem cerimônia o inglês <em>baby shower</em>. <span class=\"src\"><a href=\"https://www.linguee.com/portuguese-english/translation/ch%C3%A1+de+beb%C3%AA.html\">linguee.com</a></span></li>\n      <li><span class=\"chip\">BR-PT</span> <strong>o enxoval</strong> — uma palavra para três em alemão: o Priberam a define como <em>„Conjunto de roupas de um recém-nascido, de um colegial, etc\"</em>. Ou seja, enxoval de bebê, material escolar e enxoval de noiva num único termo; o espanhol faz exatamente o mesmo com <em>el ajuar</em>. <span class=\"src\"><a href=\"https://dicionario.priberam.org/enxoval\">priberam.org</a></span></li>\n      <li><span class=\"chip good\">EXPRESSÃO</span> <strong>in anderen Umständen sein</strong> — o dict.cc dá como equivalente <em>„to be expecting [coll.] [pregnant]\"</em>, e também <em>in the family way</em>. O Brasil tem a variante mais direta: o Priberam lista <em>de barriga</em> como <em>„Em estado de gravidez\"</em>. <span class=\"src\"><a href=\"https://www.dict.cc/?s=in+anderen+Umst%C3%A4nden\">dict.cc</a> · <a href=\"https://dicionario.priberam.org/barriga\">priberam.org</a></span></li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Miércoles 29 de julio — tema de la rotación <em>Familia y vida cotidiana</em>, y hoy hablamos del acontecimiento que remodela una casa más rápido que cualquier mudanza: la llegada de un bebé. Este campo léxico es probablemente el terreno más fértil de trampas que estos cuatro idiomas tienen para ofrecer: el falso amigo más famoso entre el español y el portugués (<em>embarazada</em> significa en estado de gestación, <em>embaraçada</em> significa avergonzada), la trampa alemana del pretérito perfecto del año (<em>ich habe geboren</em> — la madre, no el niño), y una palabra brasileña para el \"té de bebé\", mientras que México simplemente adopta la palabra en inglés. <strong>11 entradas, 3 de ellas verbos con conjugación completa</strong>, más 2 repasos del 8 de julio. Hilo conductor: los idiomas románicos empacan el ajuar de novia, el kit escolar y el ajuar de bebé en <em>una sola</em> palabra — el alemán necesita tres.</p>\n    <ul>\n      <li><span class=\"chip hot\">FALSO AMIGO</span> <strong>embarazada ≠ embaraçada</strong> — el español <em>embarazada</em> no significa otra cosa que \"en estado de embarazo\" (<em>Carolina está embarazada de gemelos</em>). El portugués <em>embaraçada</em> significa \"avergonzada, enredada, confundida\" — Priberam: <em>„Causar ou sentir vergonha ou acanhamento\"</em>. Dos idiomas vecinos, una letra de diferencia, un abismo de significado. <span class=\"src\"><a href=\"https://www.spanishdict.com/translate/embarazada\">spanishdict.com</a> · <a href=\"https://dicionario.priberam.org/embara%C3%A7ada\">priberam.org</a></span></li>\n      <li><span class=\"chip\">CONJUGACIÓN</span> <strong>ich habe geboren, pero ich bin geboren</strong> — verbformen.de indica <strong>haben</strong> como el verbo auxiliar de <em>gebären</em>: <em>ich habe geboren</em>. Quien dice <em>ich bin geboren</em> está diciendo algo completamente distinto — es el niño, no la madre. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/geb%C3%A4ren.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip\">CONJUGACIÓN</span> <strong>eu dou à luz, yo doy a luz</strong> — para \"dar a luz\", el portugués y el español usan la misma imagen (\"dar hacia la luz\") y el mismo verbo irregular, <em>dar</em>. En el pretérito, los caminos se separan: <em>eu dei</em> frente a <em>yo di</em>, <em>nós demos</em> frente a <em>nosotros dimos</em>. <span class=\"src\"><a href=\"https://www.conjugacao.com.br/verbo-dar/\">conjugacao.com.br</a> · <a href=\"https://conjugator.reverso.net/conjugation-spanish-verb-dar.html\">reverso.net</a></span></li>\n      <li><span class=\"chip\">GÉNERO</span> <strong>a gravidez (f) ↔ el embarazo (m)</strong> — mismo concepto, género opuesto. El portugués termina en <em>-ez</em> y es femenino, el español termina en <em>-azo</em> y es masculino. Con el pañal, el signo se invierte otra vez: <em>a fralda</em> (f) frente a <em>el pañal</em> (m).</li>\n      <li><span class=\"chip\">BR-PT</span> <strong>o chá de bebê</strong> — en Brasil te invitan a un \"té de bebé\", no a una \"ducha\": Linguee registra <em>chá de bebê</em> explícitamente como <em>„noun, masculine [Braz.] — baby shower\"</em>. México, en cambio, adopta sin más el término en inglés <em>baby shower</em>. <span class=\"src\"><a href=\"https://www.linguee.com/portuguese-english/translation/ch%C3%A1+de+beb%C3%AA.html\">linguee.com</a></span></li>\n      <li><span class=\"chip\">BR-PT</span> <strong>o enxoval</strong> — una palabra para tres en alemán: Priberam la define como <em>„Conjunto de roupas de um recém-nascido, de um colegial, etc\"</em>. Es decir, ajuar de bebé, kit escolar y ajuar de novia en un solo término; el español hace exactamente lo mismo con <em>el ajuar</em>. <span class=\"src\"><a href=\"https://dicionario.priberam.org/enxoval\">priberam.org</a></span></li>\n      <li><span class=\"chip good\">MODISMO</span> <strong>in anderen Umständen sein</strong> — dict.cc da como equivalente <em>„to be expecting [coll.] [pregnant]\"</em>, junto con <em>in the family way</em>. Brasil tiene la variante más directa: Priberam registra <em>de barriga</em> como <em>„Em estado de gravidez\"</em>. <span class=\"src\"><a href=\"https://www.dict.cc/?s=in+anderen+Umst%C3%A4nden\">dict.cc</a> · <a href=\"https://dicionario.priberam.org/barriga\">priberam.org</a></span></li>\n    </ul></div>"
