<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daniels Morning Briefs</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="lib/tokens.css">
<script>
  // Pre-paint animation policy (mirrors the terminal core / pagr): an explicit
  // "off" in localStorage — or no pick while the OS prefers reduced motion —
  // marks html.anim-off so components.css kills keyframes (incl. the brand
  // cursor blink) with no flash. The footer anim toggle persists "on"/"off".
  (function () {
    let pref = null;
    try { pref = localStorage.getItem('anim'); } catch (_) {}
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (pref === 'off' || (pref === null && reduced)) {
      document.documentElement.classList.add('anim-off');
    }
  })();
  // Resolution-independent zoom (mirrors pagr): lay out at a 1920px reference, then
  // scale the whole view up on wider screens — a true zoom of everything, never below
  // 1×. Pre-paint to avoid a flash.
  (function () {
    var applyZoom = function () {
      document.documentElement.style.zoom = String(Math.max(1, window.innerWidth / 1920));
    };
    applyZoom();
    window.addEventListener('resize', applyZoom);
  })();
</script>
<style>
  /* Dashboard chrome styles. Design tokens (colours, shadow, typography vars)
     come from lib/tokens.css — keep them there so the dashboard and the
     newsletter content stay in sync. */
  * { box-sizing: border-box; }
  /* Lock the outer document — only inner scroll containers (the .home view
     and the iframe) handle scrolling. Without this, a tiny mismatch between
     header.app + .app-shell heights and 100vh adds a few pixels of overflow
     to <html>, producing a second outer scrollbar alongside the one inside
     .home. overflow: hidden on both html and body kills that outer track. */
  html, body {
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    height: 100%;
    overflow: hidden;
  }
  html { position: relative; }

  /* Paper-grain noise overlay — same texture as the newsletter pages.
     Imperceptible up close, breaks LCD flatness at distance. Disabled under
     reduced-motion / high-contrast preferences. */
  html::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image: none;
    opacity: 0.04;
    mix-blend-mode: multiply;
  }
  @media (prefers-reduced-motion: reduce), (prefers-contrast: more) {
    html::before { display: none; }
  }
  body > *, header.app { position: relative; z-index: 1; }
  body {
    font-family: var(--font-body);
    line-height: 1.5;
    font-size: 15px;
    font-feature-settings: "kern", "liga", "onum";
    -webkit-font-smoothing: antialiased;
  }

  /* Terminal header bar — mirrors the pagr/seedr chrome: a single row on a
     --card surface with a --border bottom rule. LEFT: the brand wordmark
     (mono + .glow) and a blinking .cursor-block. RIGHT: the nav-rail minimize
     toggle. */
  header.app {
    border-bottom: 1px solid var(--border);
    background: var(--card);
    font-family: var(--font-mono); /* chrome is terminal mono; the content stays serif */
    /* Lift the header above the content, which is also a positioned body child
       at z-index 1 and would otherwise paint over it. */
    z-index: 50;
    padding: 0 1rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    min-height: 3rem;
  }
  /* LEFT zone — brand only. */
  .header-left {
    display: flex;
    align-items: center;
    flex: none;
    min-width: 0;
  }
  .header-brand {
    display: inline-flex;
    align-items: center;
    flex: none;
    text-decoration: none;
    cursor: pointer;
  }
  .header-brand .brand-word {
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: -0.01em;
  }

  /* RIGHT zone — the nav-rail minimize toggle, pushed to the far right
     (the header has no center zone). */
  .header-right {
    flex: none;
    margin-left: auto;
    display: flex;
    align-items: center;
  }

  /* Layout: two columns — flexible main + a fixed-width nav-rail on the right.
     The fixed footer is 2rem tall, so the shell is the viewport minus the
     header (3rem) and the footer (2rem). When the rail is collapsed the
     --rail-w track narrows to the icon-only strip. */
  .app-shell {
    display: grid;
    grid-template-columns: minmax(0, 1fr) var(--rail-w, 16rem);
    height: calc(100vh - 3rem - 2rem);
    height: calc(100dvh - 3rem - 2rem);
  }
  .app-shell.rail-collapsed { --rail-w: 3rem; }

  /* The nav lives in the sticky right sidebar (.nav-rail). It holds the
     Übersicht control (#home-btn) and #nav-groups (the grouped category nav,
     populated by JS). */
  .nav-label {
    font-family: var(--font-mono);
    font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--muted-foreground); padding: 0.5rem 0.85rem 0.2rem; font-weight: 600;
  }
  #nav-groups { padding-bottom: 0.2rem; }

  .cat {
    margin: 0;
    border-radius: 0;
    overflow: hidden;
    border: 0;
  }
  .cat-head {
    display: flex; align-items: center; gap: 0.55rem;
    padding: 0.45rem 0.85rem;
    cursor: pointer;
    border-radius: 0;
    transition: background 120ms;
    min-height: 2.1rem;
  }
  .cat-head:hover { background: var(--muted); }
  .cat-head:hover .cat-name { color: var(--primary); }
  .cat.active .cat-head { background: var(--muted); }
  .cat.active .cat-name { color: var(--primary); }
  .cat-color { width: 6px; height: 18px; border-radius: 0; flex: none; }
  .cat-name {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 0.8rem;
    color: var(--foreground);
    transition: color 0.15s ease;
    flex: 1;
    /* Single-line; ellipsise rather than wrap to two lines. */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .cat-icon { font-size: 1.05rem; }
  .cat-latest {
    font-family: var(--font-mono);
    font-size: 0.68rem; color: var(--soft);
    font-feature-settings: "tnum"; font-weight: 500;
  }
  .cat-toggle {
    background: transparent; border: none;
    color: var(--soft); cursor: pointer;
    transition: transform 150ms ease, background 120ms, color 120ms;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    padding: 0.55rem 0.7rem;
    border-radius: var(--radius-inline);
    line-height: 1;
    min-height: 2.25rem; min-width: 2.25rem;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .cat-toggle:hover { background: var(--rule-soft); color: var(--fg); }
  .cat.open > .cat-head .cat-toggle { transform: rotate(90deg); }

  .cat-dates { display: none; padding: 0.15rem 0.7rem 0.4rem 1.45rem; }

  .cat.open .cat-dates { display: block; }
  /* The category dropdown holds only the archive month-picker: days with a
     brief are clickable (ringed in the category accent), the selected day is
     filled, hovering one previews its title. Border + marks use the
     per-category --cat-accent scoped on the .cat row. */
  .cat-cal {
    margin: 0.2rem 0;
    padding: 0.5rem;
    border: 1px solid var(--cat-accent);
    border-radius: 6px;
    background: var(--rule-soft);
  }
  .cal-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 0.45rem;
  }
  .cal-title {
    font-family: var(--font-mono); font-size: 0.74rem;
    font-weight: 600; color: var(--fg);
  }
  .cal-nav {
    width: 1.7rem; height: 1.7rem; line-height: 1;
    background: transparent; border: 1px solid var(--rule); border-radius: 4px;
    color: var(--muted-ink); font-size: 0.95rem; cursor: pointer;
    transition: color 120ms, border-color 120ms;
  }
  .cal-nav:hover:not(:disabled) { color: var(--fg); border-color: var(--soft); }
  .cal-nav:focus-visible { outline: 2px solid var(--cat-accent, var(--fg)); outline-offset: 2px; }
  .cal-nav:disabled { opacity: 0.3; cursor: default; }
  .cal-week, .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
  }
  .cal-week { margin-bottom: 3px; }
  .cal-week span {
    text-align: center; font-family: var(--font-mono);
    font-size: 0.58rem; color: var(--muted-ink);
  }
  .cal-day {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 0.7rem;
    border-radius: 4px; color: var(--soft);
    font-feature-settings: "tnum";
  }
  .cal-day.none { color: var(--rule); }
  .cal-day.blank { visibility: hidden; }
  .cal-day.has {
    color: var(--fg); font-weight: 600; cursor: pointer; text-decoration: none;
    background: var(--panel);
    box-shadow: inset 0 0 0 1px var(--cat-accent);
    transition: background 100ms, color 100ms;
  }
  .cal-day.has:hover, .cal-day.has:focus-visible,
  .cal-day.has.current {
    background: var(--cat-accent); color: #fff; outline: none;
  }
  .cal-preview {
    margin-top: 0.5rem; padding-top: 0.45rem;
    border-top: 1px solid var(--rule);
    font-family: var(--font-body); font-size: 0.72rem;
    color: var(--muted-ink); line-height: 1.35; min-height: 1.7rem;
  }
  /* ────────────────────────────────────────────────────────────────────
     Fixed footer status bar — mirrors the pagr/seedr StatusBar: a 2rem bar
     pinned to the viewport bottom on a --card surface with a --border top
     rule. LEFT: `[briefs] reader@briefs:~/path` status line. RIGHT: the
     relocated controls (theme menu, language menu) + an anim toggle.
     ──────────────────────────────────────────────────────────────────── */
  footer.status-bar {
    position: fixed;
    inset-inline: 0;
    bottom: 0;
    z-index: 60;
    height: 2rem;
    border-top: 1px solid var(--border);
    background: var(--card);
    font-family: var(--font-mono); /* chrome is terminal mono */
    font-size: 11px;
  }
  .status-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    height: 100%;
    padding: 0 0.85rem;
  }
  .status-path {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted-foreground);
  }
  .status-path .status-tag { color: var(--primary); }
  .status-path .status-loc { color: var(--foreground); }
  .status-controls {
    display: flex;
    align-items: center;
    gap: 1.1rem;
    flex: none;
  }
  .status-sep { height: 0.9rem; width: 1px; background: var(--border); flex: none; }

  /* Footer control buttons — flat, muted, warm to --primary on hover. No
     boxes, no shadows; terminal-plain. */
  .status-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: inherit;
    line-height: 1;
    color: var(--muted-foreground);
    text-decoration: none;
    background: none;
    border: 0;
    border-radius: 0;
    padding: 0;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .status-btn:hover { color: var(--primary); }

  /* Theme + language dropdowns reuse the core .dropdown / .dropdown-panel /
     .dropdown-item primitives. The summary mirrors .status-btn. */
  .status-controls .dropdown > summary { font: inherit; }
  /* Settings icons (.dd-dot theme indicator, .dd-flag language flags) come from
     the shared @danieldeusing/design components.css — no local copy here. */

  /* Anim toggle — `[x] anim` / `[ ] anim`, mirroring pagr's footer toggle. */
  .anim-toggle { white-space: nowrap; }
  .anim-toggle[aria-pressed="true"] .anim-box { color: var(--primary); }

  /* Language picker — the trigger anchors the upward dropdown menu. The menu
     reuses the core .dropdown-panel (absolute, opens above, right-aligned),
     toggled open/closed via the [hidden] attribute by the existing JS. */
  .lang-picker { position: relative; }
  .lang-caret { font-size: 0.6rem; margin-left: 0.1rem; }
  .lang-menu[hidden] { display: none; }
  .lang-option[aria-selected="true"] {
    color: var(--primary);
    text-shadow: 0 0 8px var(--glow);
  }

  .cat-empty {
    font-family: var(--font-mono);
    font-size: 0.7rem; color: var(--soft);
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 0.5rem 0.6rem;
  }

  /* Main area — full width, fills the shell (viewport minus header + footer). */
  .main {
    overflow: hidden;
    background: var(--bg);
    position: relative;
    height: 100%;
  }
  .iframe-host { width: 100%; height: 100%; border: none; background: var(--bg); }

  /* ────────────────────────────────────────────────────────────────────
     Sticky right sidebar (.nav-rail) — terminal mono, --card surface with a
     --border left rule, full shell height with its own scroll. Holds the
     Übersicht control + the grouped category nav. Collapses to a 3rem icon-
     only strip; the width animates via the grid track on .app-shell.
     ──────────────────────────────────────────────────────────────────── */
  .nav-rail {
    grid-column: 2;
    font-family: var(--font-mono);
    background: var(--card);
    border-left: 1px solid var(--border);
    height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 2;
  }
  .nav-rail-head {
    display: flex;
    align-items: center;
    min-height: 2.1rem;
    padding: 0.4rem 0.85rem;
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .nav-rail-title {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 600;
    color: var(--muted-foreground);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-rail-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0.3rem 0 0.4rem;
  }

  /* Minimize toggle — the `»`/`«` chevron in the header right zone. Flat, muted,
     warm to --primary on hover (terminal-plain, no box). */
  .rail-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    flex: none;
    background: none;
    border: 0;
    border-radius: 0;
    color: var(--muted-foreground);
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 1rem;
    line-height: 1;
    transition: color 0.15s ease;
  }
  .rail-toggle:hover { color: var(--primary); }
  /* Expanded → `»` (collapse-to-right); collapsed → `«` (re-open). The button's
     aria-expanded drives the glyph; JS rewrites the text content too as a fallback. */
  .rail-toggle[aria-expanded="false"] .rail-toggle-glyph::before { content: "«"; }
  .rail-toggle[aria-expanded="true"]  .rail-toggle-glyph::before { content: "»"; }
  .rail-toggle-glyph { font-size: 0; }
  .rail-toggle-glyph::before { font-size: 1rem; }

  /* Collapsed strip — keep only the per-category accent bar + icon, hide labels,
     calendars and the home wordmark. The 3rem track clips the rest. */
  .app-shell.rail-collapsed .nav-rail-title,
  .app-shell.rail-collapsed .nav-label,
  .app-shell.rail-collapsed .cat-name,
  .app-shell.rail-collapsed .cat-latest,
  .app-shell.rail-collapsed .cat-toggle,
  .app-shell.rail-collapsed .cat-dates,
  .app-shell.rail-collapsed .home-btn .nav-label-text,
  .app-shell.rail-collapsed .home-btn .brand-mark {
    display: none;
  }
  .app-shell.rail-collapsed .nav-rail-head { justify-content: center; padding: 0.4rem 0; }
  .app-shell.rail-collapsed .cat-head,
  .app-shell.rail-collapsed .home-btn {
    justify-content: center;
    padding-left: 0;
    padding-right: 0;
    gap: 0;
  }
  .app-shell.rail-collapsed .cat-color,
  .app-shell.rail-collapsed .home-btn .cat-color { margin-right: 0.4rem; }

  /* The width transition reads off the grid track; animate it. */
  .app-shell { transition: grid-template-columns 0.18s ease; }
  @media (prefers-reduced-motion: reduce) {
    .app-shell { transition: none; }
  }

  /* Mobile re-open button (a floating ☰); shown only when the rail is an
     off-canvas drawer (≤720px). Hidden on desktop. */
  .rail-fab {
    display: none;
    position: fixed;
    right: 0.75rem;
    bottom: 2.6rem;
    z-index: 55;
    width: 2.6rem;
    height: 2.6rem;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--foreground);
    font-family: var(--font-mono);
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow: 0 0 18px var(--glow-soft);
  }

  /* Home view */
  .home {
    display: none;
    padding: 1.5rem 1.8rem;
    overflow-y: auto; height: 100%;
    /* Container for the responsive .tldr-grid below — column-count tracks
       the actual available width, not the viewport (which changes with
       sidebar collapsed/expanded state). */
    container-type: inline-size;
    container-name: home;
  }
  .home.show { display: block; }
  .home h2 {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 48;
    font-size: 1.55rem; font-weight: 600;
    margin: 0 0 0.5rem; letter-spacing: -0.005em;
  }
  .home .lead { color: var(--muted-ink); margin-bottom: 1.4rem; font-family: var(--font-body); }

  /* Freshness line — "Stand: DD.MM.YYYY" from the manifest's `generated`
     date. Mono-caps to read as a dateline, not body copy. When the manifest
     wasn't rebuilt today (a silently-failed nightly task), .stale flips it to
     the warn accent and appends a hint, so a missed run is visible at a glance
     instead of looking like fresh content. */
  .home-stand {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--soft);
    font-feature-settings: "tnum";
    margin: 0 0 1.2rem;
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .home-stand .stand-date { font-weight: 600; color: var(--muted-ink); }
  .home-stand.stale { color: var(--warn); }
  .home-stand.stale .stand-date { color: var(--warn); }
  .home-stand .stand-note { text-transform: none; letter-spacing: 0.02em; font-style: italic; }

  /* Newsprint column grid — the dashboard reads like one paper folded into
     seven adjacent columns. No card chrome: backgrounds, borders, shadows
     and radii are stripped. Adjacent columns are separated only by a
     hairline column rule, the same way the body-grid inside a newsletter
     uses column-rule between deep-dive sections. */
  /* Responsive column grid — caps at 3 wide so the columns stay readable
     on huge screens instead of shrinking to 5-6 narrow strips. The min
     width per column is the larger of 320 px (floor for readability) or
     1/3 of the container (so no more than 3 fit). Single declaration —
     no media or container queries needed.

     The column-rule + row-rule logic uses container queries against .home
     so the layout responds to actual available width (which changes with
     sidebar collapsed/expanded), not viewport. */
  .tldr-grid {
    display: grid;
    grid-template-columns:
      repeat(auto-fit, minmax(min(100%, max(320px, calc((100% - 2px) / 3))), 1fr));
    gap: 0;
    margin-top: 0.5rem;
  }
  .tldr-card {
    background: transparent;
    border: none;
    border-radius: 0;
    padding: var(--space-2) var(--space-4) var(--space-5);
    box-shadow: none;
    cursor: pointer;
    transition: background 150ms;
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    border-left: 1px solid var(--rule);
  }

  /* Grouped layout: a full-width header band (Wirtschaft / IT / Sport / …)
     precedes each group's cards. The header spans every grid column so the
     column flow restarts beneath it — each group reads as its own newsprint
     block, matching the sidebar's grouping. */
  .tldr-group-head {
    grid-column: 1 / -1;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    font-weight: 600;
    color: var(--soft);
    margin: var(--space-5) 0 0;
    padding: var(--space-3) 0 var(--space-2);
    border-top: 1px solid var(--rule);
  }
  /* The first group header sits right under the "Stand:" line — no big top gap
     or top rule, so the grid doesn't open with a stray divider. */
  .tldr-group-head:first-child { margin-top: 0; border-top: none; padding-top: 0; }

  /* The leading card of each group clears its left column rule so the group's
     first column starts clean (JS marks it; nth-child can't track per-group
     position once headers are interspersed). */
  .tldr-card.group-first { border-left: none; padding-left: 0; }

  /* Single-column band (narrow): no column rules at all; cards in the same
     group separate by a dashed row rule. The group header already divides
     groups, so only same-group siblings (a card directly after another card)
     get the dashed top. */
  @container home (max-width: 639px) {
    .tldr-card { border-left: none; padding-left: 0; }
    .tldr-card + .tldr-card {
      margin-top: var(--space-3);
      padding-top: var(--space-5);
      border-top: 1px dashed var(--rule);
    }
  }
  /* Subtle tinted-paper feedback on hover — no transform, no shadow swap,
     so adjacent columns never visually shift. */
  .tldr-card:hover {
    background: color-mix(in srgb, var(--cat-accent) 4%, transparent);
  }
  .tldr-card:focus-visible {
    outline: 2px solid var(--cat-accent, var(--fg));
    outline-offset: 4px;
  }
  .crumb:focus-visible {
    outline: 2px solid var(--fg);
    outline-offset: 2px;
    border-radius: var(--radius-inline);
  }

  /* Kicker line — same mono-caps treatment as the newsletter masthead-issue.
     Icon left, date right, category name in the middle. */
  .tldr-card-head {
    display: flex; align-items: center; gap: var(--space-2);
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.68rem;
    color: var(--muted-ink);
    border-bottom: none;
    padding-bottom: 0;
    margin-bottom: 0;
  }
  .tldr-card-head .tile-icon {
    font-size: 1rem;
    letter-spacing: normal;
    text-transform: none;
  }
  .tldr-card-head .tile-name {
    font-family: inherit;
    font-variation-settings: normal;
    font-weight: 600;
    font-size: inherit;
    color: var(--cat-accent-text, var(--fg));
    flex: 1;
  }
  .tldr-card-head .tile-date {
    font-family: inherit;
    font-size: inherit;
    color: var(--muted-ink);
    font-weight: 500;
    font-feature-settings: "tnum";
    letter-spacing: 0.1em;
  }

  /* Section title — the actual newsletter headline, rendered as a section
     dek in Fraunces with the same accent-bar treatment as .col h2 inside
     a newsletter. Acts as the "front-page headline" for that category. */
  .tldr-card-headline {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 36, "SOFT" 60;
    font-size: 1.18rem;
    font-weight: 600;
    font-style: normal;
    line-height: 1.18;
    color: var(--fg);
    margin: var(--space-2) 0 var(--space-3);
    letter-spacing: -0.005em;
  }
  .tldr-card-headline::before {
    content: "";
    display: block;
    width: 2rem;
    height: 2px;
    background: var(--cat-accent);
    margin-bottom: var(--space-2);
  }

  /* Strip the embedded TL;DR section's own chrome — it inherits the column
     instead. The lead keeps its drop-cap treatment but at a smaller scale
     suited to the narrower column width. */
  .tldr-card-body .tldr {
    background: transparent; border: none; padding: 0; margin: 0; border-radius: 0;
    display: block;       /* override the .tldr:has(.lead) grid from styles.css */
    column-gap: 0;
  }
  .tldr-card-body .tldr > .lead {
    font-family: var(--font-body);
    font-size: 0.92rem;
    line-height: 1.5;
    color: var(--fg);
    margin: 0 0 var(--space-3);
    max-width: none;
  }
  .tldr-card-body .tldr > .lead::first-letter {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 144, "SOFT" 100;
    font-size: 2.7rem;
    float: left;
    line-height: 0.85;
    padding: 0.25rem 0.45rem 0 0;
    color: var(--cat-accent);
    font-weight: 700;
  }
  .tldr-card-body .tldr ul {
    padding-left: 1rem;
    margin: 0;
    column-count: 1;       /* override 2-col bullet layout in narrow card */
  }
  .tldr-card-body .tldr li { font-size: 0.86rem; margin: 0.4rem 0; line-height: 1.5; }
  .tldr-card-body strong { color: var(--fg); font-weight: 700; }
  .tldr-card-body em { color: var(--muted-ink); font-style: italic; }
  .tldr-card-body a { color: inherit; text-decoration: underline; }
  /* Chips inside TL;DR bullets — tinted by the card's accent. */
  .tldr-card-body .chip {
    display: inline-block;
    font-family: var(--font-mono);
    background: color-mix(in srgb, var(--cat-accent, var(--rule-soft)) 14%, transparent);
    color: var(--fg);
    font-size: 0.6rem; font-weight: 600; padding: 0.05rem 0.45rem;
    border-radius: var(--radius-inline); letter-spacing: 0.04em; margin-right: 0.2rem;
    text-transform: uppercase; vertical-align: middle;
  }
  .tldr-card-body .chip.hot  { background: rgba(182, 64, 47, 0.18); color: #b6402f; }
  .tldr-card-body .chip.good { background: rgba(63, 122, 79, 0.18); color: #3f7a4f; }
  /* Suppress the external-link arrow inside TL;DR snippets — too noisy. */
  .tldr-card-body a[href^="http"]::after { content: none; }
  /* "+N weitere" overflow marker — the home snapshot caps the TL;DR at a few
     bullets (the full set is one click away). Reads as a muted continuation
     cue, list-style stripped so it doesn't get its own bullet dot. */
  .tldr-card-body .tldr li.tldr-more {
    list-style: none;
    margin-left: -1rem;
    color: var(--soft);
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    font-style: normal;
  }

  /* DE-fallback chip — shown in a card's kicker when the active language has
     no translation for this date and the card is showing the DE original.
     Understated outline so it informs without competing with the accent. */
  .tldr-card-head .fallback-flag {
    font-family: var(--font-mono);
    font-size: 0.58rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--soft);
    border: 1px solid var(--rule);
    border-radius: var(--radius-inline);
    padding: 0.02rem 0.3rem;
    text-transform: uppercase;
    flex: none;
  }

  .tldr-read {
    background: transparent; border: none; color: var(--fg);
    font-family: var(--font-mono);
    font-weight: 600; cursor: pointer;
    font-size: 0.78rem; text-align: left;
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 0.7rem 0.2rem 0.4rem 0; margin-top: auto;
    min-height: 2.25rem;
    border-radius: var(--radius-inline);
  }
  .tldr-read:focus-visible {
    outline: 2px solid var(--cat-accent);
    outline-offset: 2px;
  }
  .tldr-read:hover { text-decoration: underline; }
  .tldr-empty {
    font-family: var(--font-body);
    font-size: 0.88rem; color: var(--soft); font-style: italic; padding: 0.4rem 0;
  }

  /* Empty-state card — "Heute kein Brief". Same per-category accent stripe
     so the category identity is preserved, but the body is muted, dashed,
     and self-evidently dormant. Not clickable. */
  .tldr-card--empty {
    cursor: default;
    background: color-mix(in srgb, var(--bg) 50%, var(--panel));
    box-shadow: none;
  }
  .tldr-card--empty:hover {
    transform: none;
    box-shadow: none;
  }
  .tldr-card--empty .tile-date {
    color: var(--rule);
  }
  .tldr-empty-block {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.5rem;
    padding: 1.2rem 0.4rem 0.8rem;
    border-top: 1px dashed var(--rule);
    border-bottom: 1px dashed var(--rule);
    margin: 0.4rem 0 0;
  }
  .tldr-empty-kicker {
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.7rem;
    color: var(--cat-accent, var(--muted-ink));
    font-weight: 600;
  }
  .tldr-empty-msg {
    font-family: var(--font-body);
    font-size: 0.88rem;
    color: var(--muted-ink);
    line-height: 1.5;
    font-style: italic;
    margin: 0;
  }

  /* Per-category accents — each card scopes its own --cat-accent and
     --cat-accent-text so descendant rules (kicker tile-name, accent bar above
     the headline, drop cap, chips, CTA) all pick up the right colour. */
  .tldr-card[data-cat="economy"]        { --cat-accent: var(--c-economy);        --cat-accent-text: var(--c-economy-text); }
  .tldr-card[data-cat="software"]       { --cat-accent: var(--c-software);       --cat-accent-text: var(--c-software-text); }
  .tldr-card[data-cat="ai-dev"]         { --cat-accent: var(--c-ai-dev);         --cat-accent-text: var(--c-ai-dev-text); }
  .tldr-card[data-cat="ai-usecases"]    { --cat-accent: var(--c-ai-usecases);    --cat-accent-text: var(--c-ai-usecases-text); }
  .tldr-card[data-cat="family"]         { --cat-accent: var(--c-family);         --cat-accent-text: var(--c-family-text); }

  .tldr-card .tldr-read { color: var(--cat-accent-text); }

  /* Loading */
  .loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;

  }
  .loading.show { opacity: 1; }

  /* Color helpers per category */
  [data-cat="economy"]        .cat-color { background: var(--c-economy); }
  [data-cat="software"]       .cat-color { background: var(--c-software); }
  [data-cat="ai-dev"]         .cat-color { background: var(--c-ai-dev); }

  [data-cat="jobs"]           .cat-color { background: var(--c-jobs); }
  [data-cat="learn-language"] .cat-color { background: var(--c-learn-language); }

  /* Sidebar rows scope their own --cat-accent so the archive calendar's border,
     day rings and selected-day fill match the category colour. */
  .cat[data-cat="economy"]        { --cat-accent: var(--c-economy); }
  .cat[data-cat="software"]       { --cat-accent: var(--c-software); }
  .cat[data-cat="ai-dev"]         { --cat-accent: var(--c-ai-dev); }
  .cat[data-cat="ai-usecases"]    { --cat-accent: var(--c-ai-usecases); }
  .cat[data-cat="family"]         { --cat-accent: var(--c-family); }
  .cat[data-cat="jobs"]           { --cat-accent: var(--c-jobs); }
  .cat[data-cat="learn-language"] { --cat-accent: var(--c-learn-language); }

  /* Home button — the "Übersicht" control at the top of the nav dropdown
     panel. Black accent bar (the dashboard's "house" colour) + favicon-style
     M brand mark + label, styled like a terminal .dropdown-item row. */
  .home-btn {
    display: flex; align-items: center; gap: 0.55rem;
    padding: 0.45rem 0.85rem;
    margin: 0;

    min-height: 2.1rem;
  }
  .home-btn:hover { background: var(--muted); color: var(--primary); }
  .home-btn.active { background: var(--muted); color: var(--primary); }
  .home-btn .cat-color {
    width: 6px; height: 18px; border-radius: 0; flex: none;
    background: var(--foreground);
  }
  /* Brand mark = the favicon design at category-icon size. */
  .home-btn .brand-mark {
    width: 1.1rem;
    height: 1.1rem;
    flex: none;
  }
  .home-btn:focus-visible,
  .cat-head:focus-visible,
  .cat-toggle:focus-visible,
  .cat-date:focus-visible {
    outline: 2px solid var(--ring, var(--primary));
    outline-offset: -2px;
  }

  /* ────────────────────────────────────────────────────────────────────
     Mobile / narrow responsiveness — the nav-rail becomes an off-canvas
     drawer (the .app-shell collapses to a single main column), toggled by
     the floating .rail-fab. The header keeps brand + history controls.
     ──────────────────────────────────────────────────────────────────── */
  @media (max-width: 720px) {
    header.app { padding: 0 0.75rem; gap: 0.6rem; }
    .header-brand .brand-word { font-size: 0.92rem; }
    .home { padding: 1rem 1rem 1.5rem; }
    .tldr-grid { grid-template-columns: 1fr; gap: 0.85rem; }
    .home h2 { font-size: 1.2rem; }
    .status-controls { gap: 0.9rem; }

    /* Single main column; the rail floats as an off-canvas drawer pinned
       under the header / above the footer, slid off to the right until opened. */
    .app-shell,
    .app-shell.rail-collapsed { grid-template-columns: 1fr; }
    .nav-rail {
      position: fixed;
      top: 3rem;
      right: 0;
      bottom: 2rem;
      width: min(80vw, 18rem);
      transform: translateX(100%);
      transition: transform 0.2s ease;
      z-index: 56;
      box-shadow: -8px 0 24px var(--glow-soft);
    }
    .app-shell.rail-open .nav-rail { transform: translateX(0); }
    /* On mobile the drawer always shows full labels — never the icon strip. */
    .app-shell.rail-collapsed .nav-rail-title,
    .app-shell.rail-collapsed .nav-label,
    .app-shell.rail-collapsed .cat-name,
    .app-shell.rail-collapsed .cat-latest,
    .app-shell.rail-collapsed .cat-toggle,
    .app-shell.rail-collapsed .cat-dates,
    .app-shell.rail-collapsed .home-btn .nav-label-text,
    .app-shell.rail-collapsed .home-btn .brand-mark { display: revert; }
    .app-shell.rail-collapsed .nav-rail-head { justify-content: flex-start; padding: 0.4rem 0.85rem; }
    .app-shell.rail-collapsed .cat-head,
    .app-shell.rail-collapsed .home-btn {
      justify-content: flex-start; padding-left: 0.85rem; padding-right: 0.85rem; gap: 0.55rem;
    }
    /* The header chevron toggle is meaningless on mobile (drawer uses the FAB). */
    .rail-toggle--header { display: none; }
    .rail-fab { display: inline-flex; align-items: center; justify-content: center; }
  }
  @media (max-width: 400px) {
    header.app { padding: 0 0.6rem; }
    .header-brand .brand-word { font-size: 0.85rem; }
    .home { padding: 0.85rem 0.85rem 1.2rem; }
    .tldr-card { padding: 0.8rem 0.9rem 0.7rem; }
    .tldr-card-body .tldr li { font-size: 0.8rem; }
  }

<!-- Terminal header bar (mirrors pagr): LEFT brand wordmark + cursor; RIGHT the
     nav-rail minimize toggle. The grouped category nav lives in the sticky right
     sidebar (.nav-rail). -->
<header class="app">
  <div class="header-left">
    <a class="header-brand" id="brand-home" href="#home" title="Übersicht">
      <span class="glow brand-word">Daniels Morning Briefs</span>
      <span class="cursor-block" aria-hidden="true"></span>
    </a>
  </div>

  <div class="header-right">
    <button class="rail-toggle rail-toggle--header" id="rail-toggle" type="button"
            aria-controls="nav-rail" aria-expanded="true" aria-label="Navigation ein-/ausblenden"
            title="Navigation ein-/ausblenden">
      <span class="rail-toggle-glyph" aria-hidden="true">»</span>
    </button>
  </div>
</header>

<div class="app-shell">
  <main class="main">
    <div class="loading" id="loading">lädt…</div>

    </div>

    <iframe class="iframe-host" id="frame" style="display:none;" title="Newsletter"></iframe>
  </main>

  <!-- Sticky right sidebar: the relocated Übersicht control (#home-btn) and the
       grouped category nav (#nav-groups, populated by JS from NAV_GROUPS). Can be
       minimized to an icon-only strip; collapsed state persists in localStorage. -->
  <aside class="nav-rail" id="nav-rail" aria-label="Navigation">
    <div class="nav-rail-head">
      <span class="nav-rail-title">~/briefs</span>
    </div>
    <div class="nav-rail-body">
      <div class="home-btn active" id="home-btn" role="button" tabindex="0" title="Übersicht">
        <span class="cat-color"></span>
        <!-- Full favicon design inline: dark frame + cream page + red
             double-rule + serif M. Identical SVG to favicon.svg so the
             browser tab and the home control read as the same "house" mark. -->
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <rect width="64" height="64" rx="9" fill="#221a13"/>
          <rect x="2.5" y="2.5" width="59" height="59" rx="7" fill="#f1e7d3"/>

        </svg>
        <span class="nav-label-text">Übersicht</span>
      </div>
      <div id="nav-groups"><!-- populated by JS from NAV_GROUPS: grouped category
           nav (Wirtschaft / IT / jobs / Sport / Freizeit / Sprachen), each group
           with its own .nav-label header (standalone groups render headerless). --></div>
    </div>
  </aside>
</div>

<button class="rail-fab" id="rail-fab" type="button" aria-controls="nav-rail"
        aria-label="Navigation öffnen" title="Navigation">☰</button>

<!-- Fixed footer status bar: status path (left), relocated controls + anim
     toggle (right). Controls keep their original ids so the existing handlers
     (theme cycle, language switch) work unchanged. -->

        <span class="anim-box" aria-hidden="true">[x]</span>
        <span>anim</span>
      </button>
    </nav>
  </div>
</footer>

        "en": "<div class=\"tldr\"><h2>The 30-second version</h2>\n    <p class=\"lead\">EUR/BRL is nearly frozen: the ECB fix for Tuesday stands at 5.8503, 0.08% above Monday. That's not calm — it's a cancellation: the real gave up 0.26% against the dollar, the euro 0.17%. The day itself belongs to Copom, which decides tonight after the market close. But the more interesting signal comes from elsewhere: Brazil's default insurance is falling for a second straight day, while the oil price — which this brief described yesterday as half-recovered — lost another seven percent.</p>\n    <ul>\n      <li><span class=\"chip\">FX</span> <strong>EUR/BRL ECB fix 5.8503</strong> (Aug 4) against 5.8454 on Aug 3 — <strong>+0.08%</strong>. Today's fix is taken around 09:15 BRT, so still <em>before</em> the Copom announcement.</li>\n      <li><span class=\"chip hot\">MECHANICS</span> <strong>The breakdown</strong>: EUR/USD <strong>−0.17%</strong>, USD/BRL <strong>+0.26%</strong>. The real was the weaker leg.</li>\n      <li><span class=\"chip hot\">COPOM</span> <strong>Decision tonight after the market close.</strong> B3 options price <strong>75.5%</strong> for −25 basis points to 14.00%; in the Reuters poll, <strong>38 of 42</strong> analysts expect the cut.</li>\n      <li><span class=\"chip good\">RISK</span> <strong>5-year CDS 119.42 basis points</strong> (close Aug 4, −2.71%). Second straight decline — default insurance is getting cheaper while the currency gives ground.</li>\n      <li><span class=\"chip hot\">OIL</span> <strong>Brent below $79</strong> (Aug 5), third straight losing session — roughly <strong>7% below</strong> the price this brief printed yesterday.</li>\n      <li><span class=\"chip\">EXPECTATIONS</span> <strong>Focus revises downward</strong>: year-end Selic <strong>13.75%</strong> (previously 14.00%), 2026 IPCA <strong>5.03%</strong> (previously 5.12%, fifth straight decline). Per Bloomberg; bcb.gov.br delivered no data today.</li>\n      <li><span class=\       "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Gestern früh wurde im npm-Ökosystem ein Wartungs-Konto gekapert — und die Pakete, die daraus entstanden, waren nicht schlecht getarnt, sondern trugen eine <strong>gültige, von GitHub Actions signierte Herkunftsbescheinigung</strong>. Genau die Maßnahme, die seit zwei Jahren als Antwort auf Lieferketten-Angriffe gebaut wird, hat den Angreifer diesmal beglaubigt statt ausgesperrt: 434 Pakete, über zwei Milliarden monatliche Installationen. Passend dazu verkürzt Microsoft die Lebensdauer von NuGet-API-Schlüsseln von 365 auf 30 Tage. Dazu vier KEV-Einträge in zwei Tagen, ein Agent, der einen anderen überredet, und ein CRA-Countdown, der in 25 Tagen abläuft.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>npm-Lieferkette</strong>: <strong>434 Pakete</strong> / 1.381 Versionen / &gt; <strong>2 Mrd.</strong> monatliche Installationen kompromittiert — Stand Aikido <strong>04.08., 13:37 CEST</strong>. Wiz zählt unabhängig „über 400\". <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Die eigentliche Nachricht</strong>: Der Code ging direkt auf <code>main</code>, das Release folgte sofort — die vergifteten Tarballs haben deshalb <strong>valide GitHub-Actions-Provenance</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Beute-Liste</strong>: Cloud-Zugänge, CI/CD-Geheimnisse, Krypto-Wallets — und die Konfigurationsdateien von KI-Werkzeugen (Claude, OpenAI/Codex, Cursor, Gemini). <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">Infra</span> <strong>NuGet</strong>: API-Keys ab <strong>17.08.</strong> nur noch <strong>30 statt 365 Tage</strong> gültig; alle älteren Schlüssel sterben am <strong>01.11.</strong> Trusted Publishing via OIDC als Ausweg. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Google ADK-Python</strong> (90 Mio.+ Downloads): Ein Agent mit wenigen Rechten kann über einen präparierten Pull Request einen Agenten mit vielen Rechten kapern. Gefixt — aber als „Social Engineering\" nicht prämiert. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Vier KEV-Adds in zwei Tagen</strong>: Apache Tomcat <code>CVE-2026-34486</code> (CVSS <strong>7,5</strong> — formal nur Vertraulichkeit, praktisch <strong>unauth. RCE</strong> mit öffentlichem Exploit), IBM Langflow <code>CVE-2026-9198</code>, N-able N-central <code>CVE-2026-18556</code> und <code>-18577</code>. Fristen <strong>06./07.08.</strong> <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Schon wieder ein halber Patch</strong>: Der Tomcat-Bug entsteht laut NVD <em>durch</em> den Fix für <code>CVE-2026-29146</code> — zweiter Fall dieser Art binnen 48 Stunden. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Regulierung</span> <strong>CRA-Countdown</strong>: Typ-A-Produkte <strong>30.08.</strong> (in 25 Tagen), Meldepflicht <strong>11.09.</strong>, Typ B/C <strong>30.10.</strong>, Vollanwendung 11.12.2027. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip good\">Release</span> <strong>FFmpeg 9.0 „Lei\"</strong>: animiertes WebP rein, CELT-Decoder raus, ONNX Runtime als Backend für neuronale Filter. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Browser</span> <strong>Firefox 153.0.3</strong> am 04.08. (Blob-URL-Medien repariert); <strong>154 stable</strong> für den 14.08. erwartet. <span class=\"chip\">Global</span></li>\n    </ul></div>",
      "latestTldrHtmlByLang": {
        "de": "<div class=\"tldr\"><p class=\"lead\">Gestern früh wurde im npm-Ökosystem ein Wartungs-Konto gekapert — und die Pakete, die daraus entstanden, waren nicht schlecht getarnt, sondern trugen eine <strong>gültige, von GitHub Actions signierte Herkunftsbescheinigung</strong>. Genau die Maßnahme, die seit zwei Jahren als Antwort auf Lieferketten-Angriffe gebaut wird, hat den Angreifer diesmal beglaubigt statt ausgesperrt: 434 Pakete, über zwei Milliarden monatliche Installationen. Passend dazu verkürzt Microsoft die Lebensdauer von NuGet-API-Schlüsseln von 365 auf 30 Tage. Dazu vier KEV-Einträge in zwei Tagen, ein Agent, der einen anderen überredet, und ein CRA-Countdown, der in 25 Tagen abläuft.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>npm-Lieferkette</strong>: <strong>434 Pakete</strong> / 1.381 Versionen / &gt; <strong>2 Mrd.</strong> monatliche Installationen kompromittiert — Stand Aikido <strong>04.08., 13:37 CEST</strong>. Wiz zählt unabhängig „über 400\". <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Die eigentliche Nachricht</strong>: Der Code ging direkt auf <code>main</code>, das Release folgte sofort — die vergifteten Tarballs haben deshalb <strong>valide GitHub-Actions-Provenance</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Beute-Liste</strong>: Cloud-Zugänge, CI/CD-Geheimnisse, Krypto-Wallets — und die Konfigurationsdateien von KI-Werkzeugen (Claude, OpenAI/Codex, Cursor, Gemini). <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">Infra</span> <strong>NuGet</strong>: API-Keys ab <strong>17.08.</strong> nur noch <strong>30 statt 365 Tage</strong> gültig; alle älteren Schlüssel sterben am <strong>01.11.</strong> Trusted Publishing via OIDC als Ausweg. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Google ADK-Python</strong> (90 Mio.+ Downloads): Ein Agent mit wenigen Rechten kann über einen präparierten Pull Request einen Agenten mit vielen Rechten kapern. Gefixt — aber als „Social Engineering\" nicht prämiert. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Vier KEV-Adds in zwei Tagen</strong>: Apache Tomcat <code>CVE-2026-34486</code> (CVSS <strong>7,5</strong> — formal nur Vertraulichkeit, praktisch <strong>unauth. RCE</strong> mit öffentlichem Exploit), IBM Langflow <code>CVE-2026-9198</code>, N-able N-central <code>CVE-2026-18556</code> und <code>-18577</code>. Fristen <strong>06./07.08.</strong> <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Schon wieder ein halber Patch</strong>: Der Tomcat-Bug entsteht laut NVD <em>durch</em> den Fix für <code>CVE-2026-29146</code> — zweiter Fall dieser Art binnen 48 Stunden. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Regulierung</span> <strong>CRA-Countdown</strong>: Typ-A-Produkte <strong>30.08.</strong> (in 25 Tagen), Meldepflicht <strong>11.09.</strong>, Typ B/C <strong>30.10.</strong>, Vollanwendung 11.12.2027. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip good\">Release</span> <strong>FFmpeg 9.0 „Lei\"</strong>: animiertes WebP rein, CELT-Decoder raus, ONNX Runtime als Backend für neuronale Filter. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Browser</span> <strong>Firefox 153.0.3</strong> am 04.08. (Blob-URL-Medien repariert); <strong>154 stable</strong> für den 14.08. erwartet. <span class=\"chip\">Global</span></li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Yesterday morning, a maintainer account was hijacked in the npm ecosystem — and the packages that resulted from it weren't poorly disguised, they carried a <strong>valid build-provenance attestation, signed by GitHub Actions</strong>. The very measure that's been built for two years as the answer to supply-chain attacks ended up vouching for the attacker instead of locking him out this time: 434 packages, over two billion monthly installs. Fittingly, Microsoft is shortening the lifespan of NuGet API keys from 365 to 30 days. Add to that four KEV entries in two days, one agent talking another into it, and a CRA countdown that runs out in 25 days.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>npm supply chain</strong>: <strong>434 packages</strong> / 1,381 versions / &gt; <strong>2 billion</strong> monthly installs compromised — as of Aikido, <strong>Aug 4, 1:37 p.m. CEST</strong>. Wiz independently counts \"over 400.\" <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>The real story</strong>: The code went straight to <code>main</code>, the release followed immediately — which is why the poisoned tarballs carry <strong>valid GitHub Actions provenance</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>The loot list</strong>: Cloud credentials, CI/CD secrets, crypto wallets — and the configuration files of AI tools (Claude, OpenAI/Codex, Cursor, Gemini). <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">Infra</span> <strong>NuGet</strong>: API keys valid for only <strong>30 instead of 365 days</strong> starting <strong>Aug 17</strong>; all older keys die on <strong>Nov 1</strong>. Trusted Publishing via OIDC is the way out. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Google ADK-Python</strong> (90 million+ downloads): A low-privilege agent can hijack a high-privilege one via a crafted pull request. Fixed — but not rewarded, since it was ruled \"social engineering.\" <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Four KEV additions in two days</strong>: Apache Tomcat <code>CVE-2026-34486</code> (CVSS <strong>7.5</strong> — formally confidentiality only, but practically <strong>unauth. RCE</strong> with a public exploit), IBM Langflow <code>CVE-2026-9198</code>, N-able N-central <code>CVE-2026-18556</code> and <code>-18577</code>. Deadlines <strong>Aug 6/7</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Yet another half patch</strong>: Per the NVD, the Tomcat bug exists <em>because of</em> the fix for <code>CVE-2026-29146</code> — the second case of this kind within 48 hours. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Regulation</span> <strong>CRA countdown</strong>: Type A products <strong>Aug 30</strong> (in 25 days), reporting duty <strong>Sep 11</strong>, Type B/C <strong>Oct 30</strong>, full application Dec 11, 2027. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip good\">Release</span> <strong>FFmpeg 9.0 \"Lei\"</strong>: animated WebP in, CELT decoder out, ONNX Runtime as backend for neural filters. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Browser</span> <strong>Firefox 153.0.3</strong> on Aug 4 (fixed Blob-URL media playback); <strong>154 stable</strong> expected for Aug 14. <span class=\"chip\">Global</span></li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Ontem de manhã, uma conta de mantenedor foi sequestrada no ecossistema npm — e os pacotes que resultaram disso não estavam mal disfarçados: traziam uma <strong>certificação de procedência válida, assinada pelo GitHub Actions</strong>. Justamente a medida que vem sendo construída há dois anos como resposta a ataques de cadeia de suprimentos, desta vez, autenticou o atacante em vez de barrá-lo: 434 pacotes, mais de dois bilhões de instalações mensais. Combinando com isso, a Microsoft está reduzindo a validade das chaves de API do NuGet de 365 para 30 dias. Some a isso quatro entradas no KEV em dois dias, um agente que convence outro, e uma contagem regressiva do CRA que se esgota em 25 dias.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>Cadeia de suprimentos do npm</strong>: <strong>434 pacotes</strong> / 1.381 versões / &gt; <strong>2 bilhões</strong> de instalações mensais comprometidas — segundo a Aikido, <strong>04/08, 13h37 CEST</strong>. A Wiz conta, de forma independente, \"mais de 400\". <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>A verdadeira notícia</strong>: o código foi direto para a <code>main</code>, e o release veio na sequência imediata — por isso os tarballs envenenados têm <strong>procedência válida do GitHub Actions</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>A lista de despojos</strong>: credenciais de nuvem, segredos de CI/CD, carteiras cripto — e os arquivos de configuração de ferramentas de IA (Claude, OpenAI/Codex, Cursor, Gemini). <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">Infra</span> <strong>NuGet</strong>: chaves de API válidas por apenas <strong>30 em vez de 365 dias</strong> a partir de <strong>17/08</strong>; todas as chaves mais antigas morrem em <strong>01/11</strong>. Trusted Publishing via OIDC é a saída. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Google ADK-Python</strong> (mais de 90 milhões de downloads): um agente com poucos privilégios consegue sequestrar um agente com muitos privilégios via um pull request preparado. Corrigido — mas não premiado, por ter sido classificado como \"engenharia social\". <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Quatro inclusões no KEV em dois dias</strong>: Apache Tomcat <code>CVE-2026-34486</code> (CVSS <strong>7,5</strong> — formalmente só confidencialidade, na prática <strong>RCE não autenticado</strong> com exploit público), IBM Langflow <code>CVE-2026-9198</code>, N-able N-central <code>CVE-2026-18556</code> e <code>-18577</code>. Prazos <strong>06 e 07/08</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Mais um patch pela metade</strong>: segundo a NVD, o bug do Tomcat existe <em>por causa</em> da correção do <code>CVE-2026-29146</code> — o segundo caso desse tipo em 48 horas. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Regulação</span> <strong>Contagem regressiva do CRA</strong>: produtos tipo A <strong>30/08</strong> (em 25 dias), dever de notificação <strong>11/09</strong>, tipo B/C <strong>30/10</strong>, aplicação plena em 11/12/2027. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip good\">Release</span> <strong>FFmpeg 9.0 \"Lei\"</strong>: WebP animado entra, decodificador CELT sai, ONNX Runtime como backend para filtros neurais. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Browser</span> <strong>Firefox 153.0.3</strong> em 04/08 (corrigiu a reprodução de mídia via Blob URL); <strong>154 estável</strong> esperado para 14/08. <span class=\"chip\">Global</span></li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Ayer por la mañana secuestraron una cuenta de mantenedor en el ecosistema npm — y los paquetes que resultaron de eso no estaban mal disfrazados: traían una <strong>certificación de procedencia válida, firmada por GitHub Actions</strong>. Justo la medida que se lleva construyendo desde hace dos años como respuesta a los ataques a la cadena de suministro esta vez avaló al atacante en lugar de bloquearlo: 434 paquetes, más de dos mil millones de instalaciones mensuales. En sintonía con esto, Microsoft está acortando la vigencia de las claves de API de NuGet de 365 a 30 días. A eso se suman cuatro entradas al KEV en dos días, un agente que convence a otro, y una cuenta regresiva del CRA que se agota en 25 días.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>Cadena de suministro de npm</strong>: <strong>434 paquetes</strong> / 1.381 versiones / &gt; <strong>2 mil millones</strong> de instalaciones mensuales comprometidas — según Aikido, <strong>04/08, 13:37 CEST</strong>. Wiz cuenta, de forma independiente, \"más de 400\". <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>La verdadera noticia</strong>: el código fue directo a <code>main</code>, y el release llegó de inmediato — por eso los tarballs envenenados tienen <strong>procedencia válida de GitHub Actions</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>El botín</strong>: credenciales de nube, secretos de CI/CD, carteras cripto — y los archivos de configuración de herramientas de IA (Claude, OpenAI/Codex, Cursor, Gemini). <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">Infra</span> <strong>NuGet</strong>: las claves de API valdrán solo <strong>30 días en lugar de 365</strong> a partir del <strong>17/08</strong>; todas las claves más antiguas mueren el <strong>01/11</strong>. Trusted Publishing vía OIDC es la salida. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Google ADK-Python</strong> (más de 90 millones de descargas): un agente con pocos privilegios puede secuestrar a un agente con muchos privilegios mediante un pull request preparado. Corregido — pero no premiado, por clasificarse como \"ingeniería social\". <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Cuatro ingresos al KEV en dos días</strong>: Apache Tomcat <code>CVE-2026-34486</code> (CVSS <strong>7,5</strong> — formalmente solo confidencialidad, en la práctica <strong>RCE no autenticado</strong> con exploit público), IBM Langflow <code>CVE-2026-9198</code>, N-able N-central <code>CVE-2026-18556</code> y <code>-18577</code>. Plazos <strong>06 y 07/08</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Otro parche a medias</strong>: según la NVD, el bug de Tomcat existe <em>a causa</em> de la corrección del <code>CVE-2026-29146</code> — el segundo caso de este tipo en 48 horas. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Regulación</span> <strong>Cuenta regresiva del CRA</strong>: productos tipo A <strong>30/08</strong> (en 25 días), obligación de reporte <strong>11/09</strong>, tipo B/C <strong>30/10</strong>, aplicación plena el 11/12/2027. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip good\">Release</span> <strong>FFmpeg 9.0 \"Lei\"</strong>: entra el WebP animado, sale el decodificador CELT, ONNX Runtime como backend para filtros neuronales. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Browser</span> <strong>Firefox 153.0.3</strong> el 04/08 (corrigió la reproducción de medios vía Blob URL); se espera <strong>154 estable</strong> para el 14/08. <span class=\"chip\">Global</span></li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Zwei Veröffentlichungen vom selben Montag, und sie erzählen gegensätzliche Geschichten. Alibaba zeigt ein Modell mit <span class=\"stat\">2,4 Billionen</span> Parametern. Microsoft Research zeigt einen Agenten mit rund <span class=\"stat\">3 Milliarden</span> aktiven Parametern, der auf SWE-bench Verified <span class=\"stat\">69,7 %</span> erreicht — und gibt vor allem die Maschinerie frei, mit der er trainiert wurde. Nicht ein weiteres Gewichte-Paket also, sondern der Trainingsapparat, den bisher jedes Labor für sich nachgebaut hat. Dazu eine Sache, die still passiert ist und jeden angeht, der einen MCP-Server betreibt: Die Spezifikation vom <span class=\"stat\">28.07.</span> wirft die Sitzung raus — und drei Funktionen gleich mit.</p>\n    <ul>\n      <li><span class=\"chip hot\">OSS</span> <strong>Orchard ist offen</strong>: Microsoft Research hat am <span class=\"stat\">03.08.</span> sein Agenten-Trainings-Framework quelloffen gestellt. Das Beispielmodell Orchard-SWE erreicht <span class=\"stat\">69,7 %</span> auf SWE-bench Verified, mit nachgeschaltetem Reranking <span class=\"stat\">73 %</span> — bei rund <span class=\"stat\">3 Mrd.</span> aktiven Parametern.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>Der Trick steckt im Aufbau</strong>: Ein Proxy schneidet die Modell-Aufrufe des laufenden Werkzeug-Gerüsts als Trainingsdaten mit, jeder Durchlauf in einem eigenen Container. Der Agent wird also in genau der Umgebung trainiert, in der er später arbeitet.</li>\n      <li><span class=\"chip\">OSS</span> <strong>Zwei weitere Rezepte liegen bei</strong>: Orchard-GUI (Rechner-Bedienung, <span class=\"stat\">68,4 %</span> Schnitt über drei Web-Boards) und Orchard-Claw (<span class=\"stat\">59,6 %</span>, mit stärkerem Gerüst <span class=\"stat\">73,9 %</span>).</li>\n      <li><span class=\"chip hot\">MCP</span> <strong>MCP hat keine Sitzungen mehr</strong>: Die Spezifikation <span class=\"stat\">2026-07-28</span> streicht Sitzungen auf Protokollebene, den <code>Mcp-Session-Id</code>-Header und den <code>initialize</code>-Handshake ersatzlos. Jede Anfrage trägt ihren Kontext selbst.</li>\n      <li><span class=\"chip hot\">MCP</span> <strong>Und dein Server-Code hat eine Uhr laufen</strong>: Roots, Sampling und Logging sind ab dieser Fassung abgekündigt — Mindestfrist zwölf Monate. Auch die dynamische OAuth-Client-Registrierung ist raus.</li>\n      <li><span class=\"chip\">OSS</span> <strong>Qwen3.8-Max — die offenen Gewichte kommen</strong>: angekündigt für die Woche ab <span class=\"stat\">11.08.</span>, zusammen mit Qwen3.8-27B. Es wäre das erste Max-Modell von Alibaba mit offenen Gewichten überhaupt.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Wo Qwen wirklich vorn liegt</strong>: nicht beim Code, sondern beim Bedienen eines Rechners — <span class=\"stat\">86,1</span> auf OSWorld-Verified. Anbieterzahl, heute nicht wörtlich an der Primärquelle prüfbar. Auf der Frontend Code Arena landet es auf Platz <span class=\"stat\">4</span> mit <span class=\"stat\">1.668</span> Punkten.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Continue.dev ist tot</strong>: letzte Veröffentlichung <code>v2.0.0</code> vom <span class=\"stat\">19.06.</span>, nach der Übernahme durch Cursor ausdrücklich nicht mehr gepflegt. Wer die Erweiterung noch im Editor hat, sollte umziehen.</li>\n      <li><span class=\"chip\">Local</span> <strong>Ollama liefert im Wochentakt</strong>: stabil bei <code>v0.32.5</code> vom <span class=\"stat\">27.07.</span>, dazu seit <span class=\"stat\">04.08.</span> die Vorab-Fassung <code>v0.32.6</code>.</li>\n    </ul></div>",
      "latestTldrHtmlByLang": {
        "de": "<div class=\"tldr\"><p class=\"lead\">Zwei Veröffentlichungen vom selben Montag, und sie erzählen gegensätzliche Geschichten. Alibaba zeigt ein Modell mit <span class=\"stat\">2,4 Billionen</span> Parametern. Microsoft Research zeigt einen Agenten mit rund <span class=\"stat\">3 Milliarden</span> aktiven Parametern, der auf SWE-bench Verified <span class=\"stat\">69,7 %</span> erreicht — und gibt vor allem die Maschinerie frei, mit der er trainiert wurde. Nicht ein weiteres Gewichte-Paket also, sondern der Trainingsapparat, den bisher jedes Labor für sich nachgebaut hat. Dazu eine Sache, die still passiert ist und jeden angeht, der einen MCP-Server betreibt: Die Spezifikation vom <span class=\"stat\">28.07.</span> wirft die Sitzung raus — und drei Funktionen gleich mit.</p>\n    <ul>\n      <li><span class=\"chip hot\">OSS</span> <strong>Orchard ist offen</strong>: Microsoft Research hat am <span class=\"stat\">03.08.</span> sein Agenten-Trainings-Framework quelloffen gestellt. Das Beispielmodell Orchard-SWE erreicht <span class=\"stat\">69,7 %</span> auf SWE-bench Verified, mit nachgeschaltetem Reranking <span class=\"stat\">73 %</span> — bei rund <span class=\"stat\">3 Mrd.</span> aktiven Parametern.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>Der Trick steckt im Aufbau</strong>: Ein Proxy schneidet die Modell-Aufrufe des laufenden Werkzeug-Gerüsts als Trainingsdaten mit, jeder Durchlauf in einem eigenen Container. Der Agent wird also in genau der Umgebung trainiert, in der er später arbeitet.</li>\n      <li><span class=\"chip\">OSS</span> <strong>Zwei weitere Rezepte liegen bei</strong>: Orchard-GUI (Rechner-Bedienung, <span class=\"stat\">68,4 %</span> Schnitt über drei Web-Boards) und Orchard-Claw (<span class=\"stat\">59,6 %</span>, mit stärkerem Gerüst <span class=\"stat\">73,9 %</span>).</li>\n      <li><span class=\"chip hot\">MCP</span> <strong>MCP hat keine Sitzungen mehr</strong>: Die Spezifikation <span class=\"stat\">2026-07-28</span> streicht Sitzungen auf Protokollebene, den <code>Mcp-Session-Id</code>-Header und den <code>initialize</code>-Handshake ersatzlos. Jede Anfrage trägt ihren Kontext selbst.</li>\n      <li><span class=\"chip hot\">MCP</span> <strong>Und dein Server-Code hat eine Uhr laufen</strong>: Roots, Sampling und Logging sind ab dieser Fassung abgekündigt — Mindestfrist zwölf Monate. Auch die dynamische OAuth-Client-Registrierung ist raus.</li>\n      <li><span class=\"chip\">OSS</span> <strong>Qwen3.8-Max — die offenen Gewichte kommen</strong>: angekündigt für die Woche ab <span class=\"stat\">11.08.</span>, zusammen mit Qwen3.8-27B. Es wäre das erste Max-Modell von Alibaba mit offenen Gewichten überhaupt.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Wo Qwen wirklich vorn liegt</strong>: nicht beim Code, sondern beim Bedienen eines Rechners — <span class=\"stat\">86,1</span> auf OSWorld-Verified. Anbieterzahl, heute nicht wörtlich an der Primärquelle prüfbar. Auf der Frontend Code Arena landet es auf Platz <span class=\"stat\">4</span> mit <span class=\"stat\">1.668</span> Punkten.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Continue.dev ist tot</strong>: letzte Veröffentlichung <code>v2.0.0</code> vom <span class=\"stat\">19.06.</span>, nach der Übernahme durch Cursor ausdrücklich nicht mehr gepflegt. Wer die Erweiterung noch im Editor hat, sollte umziehen.</li>\n      <li><span class=\"chip\">Local</span> <strong>Ollama liefert im Wochentakt</strong>: stabil bei <code>v0.32.5</code> vom <span class=\"stat\">27.07.</span>, dazu seit <span class=\"stat\">04.08.</span> die Vorab-Fassung <code>v0.32.6</code>.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Two releases from the same Monday, and they tell opposite stories. Alibaba shows off a model with <span class=\"stat\">2.4 trillion</span> parameters. Microsoft Research shows off an agent with roughly <span class=\"stat\">3 billion</span> active parameters that hits <span class=\"stat\">69.7%</span> on SWE-bench Verified — and, above all, open-sources the machinery it was trained with. Not another weights package, then, but the training apparatus that until now every lab has had to rebuild for itself. On top of that, something happened quietly that concerns anyone running an MCP server: the spec from <span class=\"stat\">Jul 28</span> throws out the session — and three features along with it.</p>\n    <ul>\n      <li><span class=\"chip hot\">OSS</span> <strong>Orchard is open</strong>: Microsoft Research open-sourced its agent-training framework on <span class=\"stat\">Aug 3</span>. The example model, Orchard-SWE, hits <span class=\"stat\">69.7%</span> on SWE-bench Verified — <span class=\"stat\">73%</span> with downstream reranking — at around <span class=\"stat\">3B</span> active parameters.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>The trick is in the setup</strong>: A proxy records the model calls made by the running tool harness as training data, with every rollout in its own container. So the agent gets trained in exactly the environment it will later work in.</li>\n      <li><span class=\"chip\">OSS</span> <strong>Two more recipes are included</strong>: Orchard-GUI (computer use, <span class=\"stat\">68.4%</span> average across three web boards) and Orchard-Claw (<span class=\"stat\">59.6%</span>, <span class=\"stat\">73.9%</span> with a stronger harness).</li>\n      <li><span class=\"chip hot\">MCP</span> <strong>MCP no longer has sessions</strong>: The <span class=\"stat\">2026-07-28</span> spec strips out protocol-level sessions, the <code>Mcp-Session-Id</code> header, and the <code>initialize</code> handshake — with no replacement. Every request now carries its own context.</li>\n      <li><span class=\"chip hot\">MCP</span> <strong>And your server code has a clock running</strong>: Roots, Sampling, and Logging are deprecated as of this version — minimum notice period twelve months. Dynamic OAuth client registration is out too.</li>\n      <li><span class=\"chip\">OSS</span> <strong>Qwen3.8-Max — the open weights are coming</strong>: announced for the week of <span class=\"stat\">Aug 11</span>, alongside Qwen3.8-27B. It would be Alibaba's first-ever Max model with open weights.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Where Qwen actually leads</strong>: not at code, but at operating a computer — <span class=\"stat\">86.1</span> on OSWorld-Verified. Vendor figure, not verifiable verbatim against the primary source today. On the Frontend Code Arena it lands in <span class=\"stat\">4th</span> place with <span class=\"stat\">1,668</span> points.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Continue.dev is dead</strong>: last release <code>v2.0.0</code> from <span class=\"stat\">Jun 19</span>, explicitly unmaintained since Cursor's acquisition. Anyone still running the extension in their editor should migrate.</li>\n      <li><span class=\"chip\">Local</span> <strong>Ollama ships weekly</strong>: stable at <code>v0.32.5</code> from <span class=\"stat\">Jul 27</span>, plus the pre-release <code>v0.32.6</code> since <span class=\"stat\">Aug 4</span>.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Duas publicações da mesma segunda-feira, e elas contam histórias opostas. A Alibaba mostra um modelo com <span class=\"stat\">2,4 trilhões</span> de parâmetros. A Microsoft Research mostra um agente com cerca de <span class=\"stat\">3 bilhões</span> de parâmetros ativos que atinge <span class=\"stat\">69,7%</span> no SWE-bench Verified — e, acima de tudo, libera o código da maquinaria com que ele foi treinado. Não é mais um pacote de pesos, portanto, e sim o aparato de treinamento que, até agora, cada laboratório tinha que reconstruir por conta própria. Além disso, uma coisa aconteceu discretamente e afeta todo mundo que roda um servidor MCP: a especificação de <span class=\"stat\">28/07</span> joga a sessão fora — e três funções junto.</p>\n    <ul>\n      <li><span class=\"chip hot\">OSS</span> <strong>O Orchard está aberto</strong>: em <span class=\"stat\">03/08</span>, a Microsoft Research abriu o código do seu framework de treinamento de agentes. O modelo de exemplo, o Orchard-SWE, atinge <span class=\"stat\">69,7%</span> no SWE-bench Verified — <span class=\"stat\">73%</span> com reranking na sequência — com cerca de <span class=\"stat\">3 bi</span> de parâmetros ativos.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>O truque está na montagem</strong>: um proxy registra as chamadas de modelo feitas pelo harness em funcionamento como dado de treinamento, com cada execução no seu próprio container. Assim, o agente é treinado exatamente no ambiente em que vai trabalhar depois.</li>\n      <li><span class=\"chip\">OSS</span> <strong>Mais duas receitas vêm junto</strong>: Orchard-GUI (uso de computador, média de <span class=\"stat\">68,4%</span> em três boards web) e Orchard-Claw (<span class=\"stat\">59,6%</span>, com um harness mais forte <span class=\"stat\">73,9%</span>).</li>\n      <li><span class=\"chip hot\">MCP</span> <strong>O MCP não tem mais sessões</strong>: a especificação <span class=\"stat\">2026-07-28</span> elimina as sessões em nível de protocolo, o header <code>Mcp-Session-Id</code> e o handshake <code>initialize</code>, sem substituto. Cada requisição agora carrega seu próprio contexto.</li>\n      <li><span class=\"chip hot\">MCP</span> <strong>E o código do seu servidor já tem um relógio correndo</strong>: Roots, Sampling e Logging foram descontinuados nesta versão — prazo mínimo de doze meses. O registro dinâmico de cliente OAuth também saiu.</li>\n      <li><span class=\"chip\">OSS</span> <strong>Qwen3.8-Max — os pesos abertos estão chegando</strong>: anunciados para a semana de <span class=\"stat\">11/08</span>, junto com o Qwen3.8-27B. Seria o primeiro modelo Max da Alibaba com pesos abertos da história.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Onde o Qwen realmente lidera</strong>: não em código, mas em operar um computador — <span class=\"stat\">86,1</span> no OSWorld-Verified. Dado do fornecedor, não verificável ao pé da letra na fonte primária hoje. Na Frontend Code Arena, fica em <span class=\"stat\">4º</span> lugar com <span class=\"stat\">1.668</span> pontos.</li>\n      <li><span class=\"chip\">Tool</span> <strong>O Continue.dev está morto</strong>: última versão <code>v2.0.0</code> de <span class=\"stat\">19/06</span>, sem manutenção explícita desde a aquisição pela Cursor. Quem ainda tem a extensão no editor deveria migrar.</li>\n      <li><span class=\"chip\">Local</span> <strong>O Ollama entrega toda semana</strong>: estável na <code>v0.32.5</code> de <span class=\"stat\">27/07</span>, com a versão prévia <code>v0.32.6</code> desde <span class=\"stat\">04/08</span>.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Dos publicaciones del mismo lunes, y cuentan historias opuestas. Alibaba muestra un modelo con <span class=\"stat\">2,4 billones</span> de parámetros. Microsoft Research muestra un agente con alrededor de <span class=\"stat\">3 mil millones</span> de parámetros activos que llega a <span class=\"stat\">69,7%</span> en SWE-bench Verified — y, sobre todo, libera la maquinaria con la que se entrenó. No es otro paquete de pesos, entonces, sino el aparato de entrenamiento que hasta ahora cada laboratorio tenía que reconstruir por su cuenta. Además, algo pasó en silencio que le afecta a cualquiera que opere un servidor MCP: la especificación del <span class=\"stat\">28/07</span> tira la sesión a la basura — y de paso, tres funciones más.</p>\n    <ul>\n      <li><span class=\"chip hot\">OSS</span> <strong>Orchard está abierto</strong>: el <span class=\"stat\">03/08</span>, Microsoft Research liberó el código de su framework de entrenamiento de agentes. El modelo de ejemplo, Orchard-SWE, llega a <span class=\"stat\">69,7%</span> en SWE-bench Verified — <span class=\"stat\">73%</span> con reranking posterior — con cerca de <span class=\"stat\">3 mil millones</span> de parámetros activos.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>El truco está en el montaje</strong>: un proxy registra las llamadas de modelo que hace el harness en funcionamiento como datos de entrenamiento, con cada corrida en su propio contenedor. Así, el agente se entrena exactamente en el entorno en el que va a trabajar después.</li>\n      <li><span class=\"chip\">OSS</span> <strong>Vienen dos recetas más</strong>: Orchard-GUI (uso de computadora, promedio de <span class=\"stat\">68,4%</span> en tres tableros web) y Orchard-Claw (<span class=\"stat\">59,6%</span>, con un harness más fuerte <span class=\"stat\">73,9%</span>).</li>\n      <li><span class=\"chip hot\">MCP</span> <strong>MCP ya no tiene sesiones</strong>: la especificación <span class=\"stat\">2026-07-28</span> elimina las sesiones a nivel de protocolo, el header <code>Mcp-Session-Id</code> y el handshake <code>initialize</code>, sin reemplazo. Ahora cada solicitud lleva su propio contexto.</li>\n      <li><span class=\"chip hot\">MCP</span> <strong>Y el código de tu servidor ya tiene un reloj corriendo</strong>: Roots, Sampling y Logging quedan obsoletos desde esta versión — plazo mínimo de doce meses. El registro dinámico de cliente OAuth también desaparece.</li>\n      <li><span class=\"chip\">OSS</span> <strong>Qwen3.8-Max — llegan los pesos abiertos</strong>: anunciados para la semana del <span class=\"stat\">11/08</span>, junto con Qwen3.8-27B. Sería el primer modelo Max de Alibaba con pesos abiertos de la historia.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Dónde Qwen realmente destaca</strong>: no en código, sino en operar una computadora — <span class=\"stat\">86,1</span> en OSWorld-Verified. Cifra del proveedor, no verificable textualmente en la fuente primaria hoy. En la Frontend Code Arena queda en el lugar <span class=\"stat\">4</span> con <span class=\"stat\">1.668</span> puntos.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Continue.dev está muerto</strong>: última versión <code>v2.0.0</code> del <span class=\"stat\">19/06</span>, sin mantenimiento explícito desde la adquisición por Cursor. Quien todavía tenga la extensión en el editor debería migrar.</li>\n      <li><span class=\"chip\">Local</span> <strong>Ollama entrega cada semana</strong>: estable en <code>v0.32.5</code> del <span class=\"stat\">27/07</span>, más la versión previa <code>v0.32.6</code> desde el <span class=\"stat\">04/08</span>.</li>\n    </ul></div>"
