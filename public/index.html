<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daniels Morning Briefs</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="lib/tokens.css">
<script>
  // Pre-paint animation policy (mirrors the terminal core / pagr): an explicit
  // "off" in localStorage — or no pick while the OS prefers reduced motion —
  // marks html.anim-off so components.css kills keyframes (incl. the brand
  // cursor blink) with no flash. The footer anim toggle persists "on"/"off".
  (function () {
    let pref = null;
    try { pref = localStorage.getItem('anim'); } catch (_) {}
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (pref === 'off' || (pref === null && reduced)) {
      document.documentElement.classList.add('anim-off');
    }
  })();
  // Resolution-independent zoom (mirrors pagr): lay out at a 1920px reference, then
  // scale the whole view up on wider screens — a true zoom of everything, never below
  // 1×. Pre-paint to avoid a flash.
  (function () {
    var applyZoom = function () {
      document.documentElement.style.zoom = String(Math.max(1, window.innerWidth / 1920));
    };
    applyZoom();
    window.addEventListener('resize', applyZoom);
  })();
</script>
<style>
  /* Dashboard chrome styles. Design tokens (colours, shadow, typography vars)
     come from lib/tokens.css — keep them there so the dashboard and the
     newsletter content stay in sync. */
  * { box-sizing: border-box; }
  /* Lock the outer document — only inner scroll containers (the .home view
     and the iframe) handle scrolling. Without this, a tiny mismatch between
     header.app + .app-shell heights and 100vh adds a few pixels of overflow
     to <html>, producing a second outer scrollbar alongside the one inside
     .home. overflow: hidden on both html and body kills that outer track. */
  html, body {
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    height: 100%;
    overflow: hidden;
  }
  html { position: relative; }

  /* Paper-grain noise overlay — same texture as the newsletter pages.
     Imperceptible up close, breaks LCD flatness at distance. Disabled under
     reduced-motion / high-contrast preferences. */
  html::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image: none;
    opacity: 0.04;
    mix-blend-mode: multiply;
  }
  @media (prefers-reduced-motion: reduce), (prefers-contrast: more) {
    html::before { display: none; }
  }
  body > *, header.app { position: relative; z-index: 1; }
  body {
    font-family: var(--font-body);
    line-height: 1.5;
    font-size: 15px;
    font-feature-settings: "kern", "liga", "onum";
    -webkit-font-smoothing: antialiased;
  }

  /* Terminal header bar — mirrors the pagr/seedr chrome: a single row on a
     --card surface with a --border bottom rule. LEFT: the brand wordmark
     (mono + .glow) and a blinking .cursor-block. RIGHT: the nav-rail minimize
     toggle. */
  header.app {
    border-bottom: 1px solid var(--border);
    background: var(--card);
    font-family: var(--font-mono); /* chrome is terminal mono; the content stays serif */
    /* Lift the header above the content, which is also a positioned body child
       at z-index 1 and would otherwise paint over it. */
    z-index: 50;
    padding: 0 1rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    min-height: 3rem;
  }
  /* LEFT zone — brand only. */
  .header-left {
    display: flex;
    align-items: center;
    flex: none;
    min-width: 0;
  }
  .header-brand {
    display: inline-flex;
    align-items: center;
    flex: none;
    text-decoration: none;
    cursor: pointer;
  }
  .header-brand .brand-word {
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: -0.01em;
  }

  /* RIGHT zone — the nav-rail minimize toggle, pushed to the far right
     (the header has no center zone). */
  .header-right {
    flex: none;
    margin-left: auto;
    display: flex;
    align-items: center;
  }

  /* Layout: two columns — flexible main + a fixed-width nav-rail on the right.
     The fixed footer is 2rem tall, so the shell is the viewport minus the
     header (3rem) and the footer (2rem). When the rail is collapsed the
     --rail-w track narrows to the icon-only strip. */
  .app-shell {
    display: grid;
    grid-template-columns: minmax(0, 1fr) var(--rail-w, 16rem);
    height: calc(100vh - 3rem - 2rem);
    height: calc(100dvh - 3rem - 2rem);
  }
  .app-shell.rail-collapsed { --rail-w: 3rem; }

  /* The nav lives in the sticky right sidebar (.nav-rail). It holds the
     Übersicht control (#home-btn) and #nav-groups (the grouped category nav,
     populated by JS). */
  .nav-label {
    font-family: var(--font-mono);
    font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--muted-foreground); padding: 0.5rem 0.85rem 0.2rem; font-weight: 600;
  }
  #nav-groups { padding-bottom: 0.2rem; }

  .cat {
    margin: 0;
    border-radius: 0;
    overflow: hidden;
    border: 0;
  }
  .cat-head {
    display: flex; align-items: center; gap: 0.55rem;
    padding: 0.45rem 0.85rem;
    cursor: pointer;
    border-radius: 0;
    transition: background 120ms;
    min-height: 2.1rem;
  }
  .cat-head:hover { background: var(--muted); }
  .cat-head:hover .cat-name { color: var(--primary); }
  .cat.active .cat-head { background: var(--muted); }
  .cat.active .cat-name { color: var(--primary); }
  .cat-color { width: 6px; height: 18px; border-radius: 0; flex: none; }
  .cat-name {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 0.8rem;
    color: var(--foreground);
    transition: color 0.15s ease;
    flex: 1;
    /* Single-line; ellipsise rather than wrap to two lines. */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .cat-icon { font-size: 1.05rem; }
  .cat-latest {
    font-family: var(--font-mono);
    font-size: 0.68rem; color: var(--soft);
    font-feature-settings: "tnum"; font-weight: 500;
  }
  .cat-toggle {
    background: transparent; border: none;
    color: var(--soft); cursor: pointer;
    transition: transform 150ms ease, background 120ms, color 120ms;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    padding: 0.55rem 0.7rem;
    border-radius: var(--radius-inline);
    line-height: 1;
    min-height: 2.25rem; min-width: 2.25rem;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .cat-toggle:hover { background: var(--rule-soft); color: var(--fg); }
  .cat.open > .cat-head .cat-toggle { transform: rotate(90deg); }

  .cat-dates { display: none; padding: 0.15rem 0.7rem 0.4rem 1.45rem; }

  .cat.open .cat-dates { display: block; }
  /* The category dropdown holds only the archive month-picker: days with a
     brief are clickable (ringed in the category accent), the selected day is
     filled, hovering one previews its title. Border + marks use the
     per-category --cat-accent scoped on the .cat row. */
  .cat-cal {
    margin: 0.2rem 0;
    padding: 0.5rem;
    border: 1px solid var(--cat-accent);
    border-radius: 6px;
    background: var(--rule-soft);
  }
  .cal-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 0.45rem;
  }
  .cal-title {
    font-family: var(--font-mono); font-size: 0.74rem;
    font-weight: 600; color: var(--fg);
  }
  .cal-nav {
    width: 1.7rem; height: 1.7rem; line-height: 1;
    background: transparent; border: 1px solid var(--rule); border-radius: 4px;
    color: var(--muted-ink); font-size: 0.95rem; cursor: pointer;
    transition: color 120ms, border-color 120ms;
  }
  .cal-nav:hover:not(:disabled) { color: var(--fg); border-color: var(--soft); }
  .cal-nav:focus-visible { outline: 2px solid var(--cat-accent, var(--fg)); outline-offset: 2px; }
  .cal-nav:disabled { opacity: 0.3; cursor: default; }
  .cal-week, .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
  }
  .cal-week { margin-bottom: 3px; }
  .cal-week span {
    text-align: center; font-family: var(--font-mono);
    font-size: 0.58rem; color: var(--muted-ink);
  }
  .cal-day {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 0.7rem;
    border-radius: 4px; color: var(--soft);
    font-feature-settings: "tnum";
  }
  .cal-day.none { color: var(--rule); }
  .cal-day.blank { visibility: hidden; }
  .cal-day.has {
    color: var(--fg); font-weight: 600; cursor: pointer; text-decoration: none;
    background: var(--panel);
    box-shadow: inset 0 0 0 1px var(--cat-accent);
    transition: background 100ms, color 100ms;
  }
  .cal-day.has:hover, .cal-day.has:focus-visible,
  .cal-day.has.current {
    background: var(--cat-accent); color: #fff; outline: none;
  }
  .cal-preview {
    margin-top: 0.5rem; padding-top: 0.45rem;
    border-top: 1px solid var(--rule);
    font-family: var(--font-body); font-size: 0.72rem;
    color: var(--muted-ink); line-height: 1.35; min-height: 1.7rem;
  }
  /* ────────────────────────────────────────────────────────────────────
     Fixed footer status bar — mirrors the pagr/seedr StatusBar: a 2rem bar
     pinned to the viewport bottom on a --card surface with a --border top
     rule. LEFT: `[briefs] reader@briefs:~/path` status line. RIGHT: the
     relocated controls (theme menu, language menu) + an anim toggle.
     ──────────────────────────────────────────────────────────────────── */
  footer.status-bar {
    position: fixed;
    inset-inline: 0;
    bottom: 0;
    z-index: 60;
    height: 2rem;
    border-top: 1px solid var(--border);
    background: var(--card);
    font-family: var(--font-mono); /* chrome is terminal mono */
    font-size: 11px;
  }
  .status-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    height: 100%;
    padding: 0 0.85rem;
  }
  .status-path {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted-foreground);
  }
  .status-path .status-tag { color: var(--primary); }
  .status-path .status-loc { color: var(--foreground); }
  .status-controls {
    display: flex;
    align-items: center;
    gap: 1.1rem;
    flex: none;
  }
  .status-sep { height: 0.9rem; width: 1px; background: var(--border); flex: none; }

  /* Footer control buttons — flat, muted, warm to --primary on hover. No
     boxes, no shadows; terminal-plain. */
  .status-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: inherit;
    line-height: 1;
    color: var(--muted-foreground);
    text-decoration: none;
    background: none;
    border: 0;
    border-radius: 0;
    padding: 0;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .status-btn:hover { color: var(--primary); }

  /* Theme + language dropdowns reuse the core .dropdown / .dropdown-panel /
     .dropdown-item primitives. The summary mirrors .status-btn. */
  .status-controls .dropdown > summary { font: inherit; }
  /* Settings icons (.dd-dot theme indicator, .dd-flag language flags) come from
     the shared @danieldeusing/design components.css — no local copy here. */

  /* Anim toggle — `[x] anim` / `[ ] anim`, mirroring pagr's footer toggle. */
  .anim-toggle { white-space: nowrap; }
  .anim-toggle[aria-pressed="true"] .anim-box { color: var(--primary); }

  /* Language picker — the trigger anchors the upward dropdown menu. The menu
     reuses the core .dropdown-panel (absolute, opens above, right-aligned),
     toggled open/closed via the [hidden] attribute by the existing JS. */
  .lang-picker { position: relative; }
  .lang-caret { font-size: 0.6rem; margin-left: 0.1rem; }
  .lang-menu[hidden] { display: none; }
  .lang-option[aria-selected="true"] {
    color: var(--primary);
    text-shadow: 0 0 8px var(--glow);
  }

  .cat-empty {
    font-family: var(--font-mono);
    font-size: 0.7rem; color: var(--soft);
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 0.5rem 0.6rem;
  }

  /* Main area — full width, fills the shell (viewport minus header + footer). */
  .main {
    overflow: hidden;
    background: var(--bg);
    position: relative;
    height: 100%;
  }
  .iframe-host { width: 100%; height: 100%; border: none; background: var(--bg); }

  /* ────────────────────────────────────────────────────────────────────
     Sticky right sidebar (.nav-rail) — terminal mono, --card surface with a
     --border left rule, full shell height with its own scroll. Holds the
     Übersicht control + the grouped category nav. Collapses to a 3rem icon-
     only strip; the width animates via the grid track on .app-shell.
     ──────────────────────────────────────────────────────────────────── */
  .nav-rail {
    grid-column: 2;
    font-family: var(--font-mono);
    background: var(--card);
    border-left: 1px solid var(--border);
    height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 2;
  }
  .nav-rail-head {
    display: flex;
    align-items: center;
    min-height: 2.1rem;
    padding: 0.4rem 0.85rem;
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .nav-rail-title {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 600;
    color: var(--muted-foreground);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-rail-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0.3rem 0 0.4rem;
  }

  /* Minimize toggle — the `»`/`«` chevron in the header right zone. Flat, muted,
     warm to --primary on hover (terminal-plain, no box). */
  .rail-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    flex: none;
    background: none;
    border: 0;
    border-radius: 0;
    color: var(--muted-foreground);
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 1rem;
    line-height: 1;
    transition: color 0.15s ease;
  }
  .rail-toggle:hover { color: var(--primary); }
  /* Expanded → `»` (collapse-to-right); collapsed → `«` (re-open). The button's
     aria-expanded drives the glyph; JS rewrites the text content too as a fallback. */
  .rail-toggle[aria-expanded="false"] .rail-toggle-glyph::before { content: "«"; }
  .rail-toggle[aria-expanded="true"]  .rail-toggle-glyph::before { content: "»"; }
  .rail-toggle-glyph { font-size: 0; }
  .rail-toggle-glyph::before { font-size: 1rem; }

  /* Collapsed strip — keep only the per-category accent bar + icon, hide labels,
     calendars and the home wordmark. The 3rem track clips the rest. */
  .app-shell.rail-collapsed .nav-rail-title,
  .app-shell.rail-collapsed .nav-label,
  .app-shell.rail-collapsed .cat-name,
  .app-shell.rail-collapsed .cat-latest,
  .app-shell.rail-collapsed .cat-toggle,
  .app-shell.rail-collapsed .cat-dates,
  .app-shell.rail-collapsed .home-btn .nav-label-text,
  .app-shell.rail-collapsed .home-btn .brand-mark {
    display: none;
  }
  .app-shell.rail-collapsed .nav-rail-head { justify-content: center; padding: 0.4rem 0; }
  .app-shell.rail-collapsed .cat-head,
  .app-shell.rail-collapsed .home-btn {
    justify-content: center;
    padding-left: 0;
    padding-right: 0;
    gap: 0;
  }
  .app-shell.rail-collapsed .cat-color,
  .app-shell.rail-collapsed .home-btn .cat-color { margin-right: 0.4rem; }

  /* The width transition reads off the grid track; animate it. */
  .app-shell { transition: grid-template-columns 0.18s ease; }
  @media (prefers-reduced-motion: reduce) {
    .app-shell { transition: none; }
  }

  /* Mobile re-open button (a floating ☰); shown only when the rail is an
     off-canvas drawer (≤720px). Hidden on desktop. */
  .rail-fab {
    display: none;
    position: fixed;
    right: 0.75rem;
    bottom: 2.6rem;
    z-index: 55;
    width: 2.6rem;
    height: 2.6rem;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--foreground);
    font-family: var(--font-mono);
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow: 0 0 18px var(--glow-soft);
  }

  /* Home view */
  .home {
    display: none;
    padding: 1.5rem 1.8rem;
    overflow-y: auto; height: 100%;
    /* Container for the responsive .tldr-grid below — column-count tracks
       the actual available width, not the viewport (which changes with
       sidebar collapsed/expanded state). */
    container-type: inline-size;
    container-name: home;
  }
  .home.show { display: block; }
  .home h2 {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 48;
    font-size: 1.55rem; font-weight: 600;
    margin: 0 0 0.5rem; letter-spacing: -0.005em;
  }
  .home .lead { color: var(--muted-ink); margin-bottom: 1.4rem; font-family: var(--font-body); }

  /* Freshness line — "Stand: DD.MM.YYYY" from the manifest's `generated`
     date. Mono-caps to read as a dateline, not body copy. When the manifest
     wasn't rebuilt today (a silently-failed nightly task), .stale flips it to
     the warn accent and appends a hint, so a missed run is visible at a glance
     instead of looking like fresh content. */
  .home-stand {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--soft);
    font-feature-settings: "tnum";
    margin: 0 0 1.2rem;
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .home-stand .stand-date { font-weight: 600; color: var(--muted-ink); }
  .home-stand.stale { color: var(--warn); }
  .home-stand.stale .stand-date { color: var(--warn); }
  .home-stand .stand-note { text-transform: none; letter-spacing: 0.02em; font-style: italic; }

  /* Newsprint column grid — the dashboard reads like one paper folded into
     seven adjacent columns. No card chrome: backgrounds, borders, shadows
     and radii are stripped. Adjacent columns are separated only by a
     hairline column rule, the same way the body-grid inside a newsletter
     uses column-rule between deep-dive sections. */
  /* Responsive column grid — caps at 3 wide so the columns stay readable
     on huge screens instead of shrinking to 5-6 narrow strips. The min
     width per column is the larger of 320 px (floor for readability) or
     1/3 of the container (so no more than 3 fit). Single declaration —
     no media or container queries needed.

     The column-rule + row-rule logic uses container queries against .home
     so the layout responds to actual available width (which changes with
     sidebar collapsed/expanded), not viewport. */
  .tldr-grid {
    display: grid;
    grid-template-columns:
      repeat(auto-fit, minmax(min(100%, max(320px, calc((100% - 2px) / 3))), 1fr));
    gap: 0;
    margin-top: 0.5rem;
  }
  .tldr-card {
    background: transparent;
    border: none;
    border-radius: 0;
    padding: var(--space-2) var(--space-4) var(--space-5);
    box-shadow: none;
    cursor: pointer;
    transition: background 150ms;
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    border-left: 1px solid var(--rule);
  }

  /* Grouped layout: a full-width header band (Wirtschaft / IT / Sport / …)
     precedes each group's cards. The header spans every grid column so the
     column flow restarts beneath it — each group reads as its own newsprint
     block, matching the sidebar's grouping. */
  .tldr-group-head {
    grid-column: 1 / -1;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    font-weight: 600;
    color: var(--soft);
    margin: var(--space-5) 0 0;
    padding: var(--space-3) 0 var(--space-2);
    border-top: 1px solid var(--rule);
  }
  /* The first group header sits right under the "Stand:" line — no big top gap
     or top rule, so the grid doesn't open with a stray divider. */
  .tldr-group-head:first-child { margin-top: 0; border-top: none; padding-top: 0; }

  /* The leading card of each group clears its left column rule so the group's
     first column starts clean (JS marks it; nth-child can't track per-group
     position once headers are interspersed). */
  .tldr-card.group-first { border-left: none; padding-left: 0; }

  /* Single-column band (narrow): no column rules at all; cards in the same
     group separate by a dashed row rule. The group header already divides
     groups, so only same-group siblings (a card directly after another card)
     get the dashed top. */
  @container home (max-width: 639px) {
    .tldr-card { border-left: none; padding-left: 0; }
    .tldr-card + .tldr-card {
      margin-top: var(--space-3);
      padding-top: var(--space-5);
      border-top: 1px dashed var(--rule);
    }
  }
  /* Subtle tinted-paper feedback on hover — no transform, no shadow swap,
     so adjacent columns never visually shift. */
  .tldr-card:hover {
    background: color-mix(in srgb, var(--cat-accent) 4%, transparent);
  }
  .tldr-card:focus-visible {
    outline: 2px solid var(--cat-accent, var(--fg));
    outline-offset: 4px;
  }
  .crumb:focus-visible {
    outline: 2px solid var(--fg);
    outline-offset: 2px;
    border-radius: var(--radius-inline);
  }

  /* Kicker line — same mono-caps treatment as the newsletter masthead-issue.
     Icon left, date right, category name in the middle. */
  .tldr-card-head {
    display: flex; align-items: center; gap: var(--space-2);
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.68rem;
    color: var(--muted-ink);
    border-bottom: none;
    padding-bottom: 0;
    margin-bottom: 0;
  }
  .tldr-card-head .tile-icon {
    font-size: 1rem;
    letter-spacing: normal;
    text-transform: none;
  }
  .tldr-card-head .tile-name {
    font-family: inherit;
    font-variation-settings: normal;
    font-weight: 600;
    font-size: inherit;
    color: var(--cat-accent-text, var(--fg));
    flex: 1;
  }
  .tldr-card-head .tile-date {
    font-family: inherit;
    font-size: inherit;
    color: var(--muted-ink);
    font-weight: 500;
    font-feature-settings: "tnum";
    letter-spacing: 0.1em;
  }

  /* Section title — the actual newsletter headline, rendered as a section
     dek in Fraunces with the same accent-bar treatment as .col h2 inside
     a newsletter. Acts as the "front-page headline" for that category. */
  .tldr-card-headline {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 36, "SOFT" 60;
    font-size: 1.18rem;
    font-weight: 600;
    font-style: normal;
    line-height: 1.18;
    color: var(--fg);
    margin: var(--space-2) 0 var(--space-3);
    letter-spacing: -0.005em;
  }
  .tldr-card-headline::before {
    content: "";
    display: block;
    width: 2rem;
    height: 2px;
    background: var(--cat-accent);
    margin-bottom: var(--space-2);
  }

  /* Strip the embedded TL;DR section's own chrome — it inherits the column
     instead. The lead keeps its drop-cap treatment but at a smaller scale
     suited to the narrower column width. */
  .tldr-card-body .tldr {
    background: transparent; border: none; padding: 0; margin: 0; border-radius: 0;
    display: block;       /* override the .tldr:has(.lead) grid from styles.css */
    column-gap: 0;
  }
  .tldr-card-body .tldr > .lead {
    font-family: var(--font-body);
    font-size: 0.92rem;
    line-height: 1.5;
    color: var(--fg);
    margin: 0 0 var(--space-3);
    max-width: none;
  }
  .tldr-card-body .tldr > .lead::first-letter {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 144, "SOFT" 100;
    font-size: 2.7rem;
    float: left;
    line-height: 0.85;
    padding: 0.25rem 0.45rem 0 0;
    color: var(--cat-accent);
    font-weight: 700;
  }
  .tldr-card-body .tldr ul {
    padding-left: 1rem;
    margin: 0;
    column-count: 1;       /* override 2-col bullet layout in narrow card */
  }
  .tldr-card-body .tldr li { font-size: 0.86rem; margin: 0.4rem 0; line-height: 1.5; }
  .tldr-card-body strong { color: var(--fg); font-weight: 700; }
  .tldr-card-body em { color: var(--muted-ink); font-style: italic; }
  .tldr-card-body a { color: inherit; text-decoration: underline; }
  /* Chips inside TL;DR bullets — tinted by the card's accent. */
  .tldr-card-body .chip {
    display: inline-block;
    font-family: var(--font-mono);
    background: color-mix(in srgb, var(--cat-accent, var(--rule-soft)) 14%, transparent);
    color: var(--fg);
    font-size: 0.6rem; font-weight: 600; padding: 0.05rem 0.45rem;
    border-radius: var(--radius-inline); letter-spacing: 0.04em; margin-right: 0.2rem;
    text-transform: uppercase; vertical-align: middle;
  }
  .tldr-card-body .chip.hot  { background: rgba(182, 64, 47, 0.18); color: #b6402f; }
  .tldr-card-body .chip.good { background: rgba(63, 122, 79, 0.18); color: #3f7a4f; }
  /* Suppress the external-link arrow inside TL;DR snippets — too noisy. */
  .tldr-card-body a[href^="http"]::after { content: none; }
  /* "+N weitere" overflow marker — the home snapshot caps the TL;DR at a few
     bullets (the full set is one click away). Reads as a muted continuation
     cue, list-style stripped so it doesn't get its own bullet dot. */
  .tldr-card-body .tldr li.tldr-more {
    list-style: none;
    margin-left: -1rem;
    color: var(--soft);
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    font-style: normal;
  }

  /* DE-fallback chip — shown in a card's kicker when the active language has
     no translation for this date and the card is showing the DE original.
     Understated outline so it informs without competing with the accent. */
  .tldr-card-head .fallback-flag {
    font-family: var(--font-mono);
    font-size: 0.58rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--soft);
    border: 1px solid var(--rule);
    border-radius: var(--radius-inline);
    padding: 0.02rem 0.3rem;
    text-transform: uppercase;
    flex: none;
  }

  .tldr-read {
    background: transparent; border: none; color: var(--fg);
    font-family: var(--font-mono);
    font-weight: 600; cursor: pointer;
    font-size: 0.78rem; text-align: left;
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 0.7rem 0.2rem 0.4rem 0; margin-top: auto;
    min-height: 2.25rem;
    border-radius: var(--radius-inline);
  }
  .tldr-read:focus-visible {
    outline: 2px solid var(--cat-accent);
    outline-offset: 2px;
  }
  .tldr-read:hover { text-decoration: underline; }
  .tldr-empty {
    font-family: var(--font-body);
    font-size: 0.88rem; color: var(--soft); font-style: italic; padding: 0.4rem 0;
  }

  /* Empty-state card — "Heute kein Brief". Same per-category accent stripe
     so the category identity is preserved, but the body is muted, dashed,
     and self-evidently dormant. Not clickable. */
  .tldr-card--empty {
    cursor: default;
    background: color-mix(in srgb, var(--bg) 50%, var(--panel));
    box-shadow: none;
  }
  .tldr-card--empty:hover {
    transform: none;
    box-shadow: none;
  }
  .tldr-card--empty .tile-date {
    color: var(--rule);
  }
  .tldr-empty-block {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.5rem;
    padding: 1.2rem 0.4rem 0.8rem;
    border-top: 1px dashed var(--rule);
    border-bottom: 1px dashed var(--rule);
    margin: 0.4rem 0 0;
  }
  .tldr-empty-kicker {
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.7rem;
    color: var(--cat-accent, var(--muted-ink));
    font-weight: 600;
  }
  .tldr-empty-msg {
    font-family: var(--font-body);
    font-size: 0.88rem;
    color: var(--muted-ink);
    line-height: 1.5;
    font-style: italic;
    margin: 0;
  }

  /* Per-category accents — each card scopes its own --cat-accent and
     --cat-accent-text so descendant rules (kicker tile-name, accent bar above
     the headline, drop cap, chips, CTA) all pick up the right colour. */
  .tldr-card[data-cat="economy"]        { --cat-accent: var(--c-economy);        --cat-accent-text: var(--c-economy-text); }
  .tldr-card[data-cat="software"]       { --cat-accent: var(--c-software);       --cat-accent-text: var(--c-software-text); }
  .tldr-card[data-cat="ai-dev"]         { --cat-accent: var(--c-ai-dev);         --cat-accent-text: var(--c-ai-dev-text); }

  .loading {

  }

  /* Color helpers per category */

  /* Sidebar rows scope their own --cat-accent so the archive calendar's border,
     day rings and selected-day fill match the category colour. */
  .cat[data-cat="economy"]        { --cat-accent: var(--c-economy); }
  .cat[data-cat="software"]       { --cat-accent: var(--c-software); }
  .cat[data-cat="ai-dev"]         { --cat-accent: var(--c-ai-dev); }
  .cat[data-cat="ai-usecases"]    { --cat-accent: var(--c-ai-usecases); }
  .cat[data-cat="family"]         { --cat-accent: var(--c-family); }

  .cat[data-cat="learn-language"] { --cat-accent: var(--c-learn-language); }

  /* Home button — the "Übersicht" control at the top of the nav dropdown
     panel. Black accent bar (the dashboard's "house" colour) + favicon-style
     M brand mark + label, styled like a terminal .dropdown-item row. */
  .home-btn {

  }
  .home-btn:hover { background: var(--muted); color: var(--primary); }
  .home-btn.active { background: var(--muted); color: var(--primary); }
  .home-btn .cat-color {
    width: 6px; height: 18px; border-radius: 0; flex: none;
    background: var(--foreground);
  }
  /* Brand mark = the favicon design at category-icon size. */
  .home-btn .brand-mark {
    width: 1.1rem;
    height: 1.1rem;
    flex: none;
  }
  .home-btn:focus-visible,
  .cat-head:focus-visible,
  .cat-toggle:focus-visible,

    outline: 2px solid var(--ring, var(--primary));
    outline-offset: -2px;
  }

  /* ────────────────────────────────────────────────────────────────────
     Mobile / narrow responsiveness — the nav-rail becomes an off-canvas
     drawer (the .app-shell collapses to a single main column), toggled by
     the floating .rail-fab. The header keeps brand + history controls.
     ──────────────────────────────────────────────────────────────────── */
  @media (max-width: 720px) {
    header.app { padding: 0 0.75rem; gap: 0.6rem; }

    .tldr-grid { grid-template-columns: 1fr; gap: 0.85rem; }
    .home h2 { font-size: 1.2rem; }
    .status-controls { gap: 0.9rem; }

    /* Single main column; the rail floats as an off-canvas drawer pinned
       under the header / above the footer, slid off to the right until opened. */
    .app-shell,
    .app-shell.rail-collapsed { grid-template-columns: 1fr; }
    .nav-rail {
      position: fixed;
      top: 3rem;
      right: 0;
      bottom: 2rem;
      width: min(80vw, 18rem);
      transform: translateX(100%);
      transition: transform 0.2s ease;
      z-index: 56;
      box-shadow: -8px 0 24px var(--glow-soft);
    }
    .app-shell.rail-open .nav-rail { transform: translateX(0); }
    /* On mobile the drawer always shows full labels — never the icon strip. */
    .app-shell.rail-collapsed .nav-rail-title,
    .app-shell.rail-collapsed .nav-label,
    .app-shell.rail-collapsed .cat-name,
    .app-shell.rail-collapsed .cat-latest,
    .app-shell.rail-collapsed .cat-toggle,
    .app-shell.rail-collapsed .cat-dates,
    .app-shell.rail-collapsed .home-btn .nav-label-text,
    .app-shell.rail-collapsed .home-btn .brand-mark { display: revert; }
    .app-shell.rail-collapsed .nav-rail-head { justify-content: flex-start; padding: 0.4rem 0.85rem; }
    .app-shell.rail-collapsed .cat-head,
    .app-shell.rail-collapsed .home-btn {
      justify-content: flex-start; padding-left: 0.85rem; padding-right: 0.85rem; gap: 0.55rem;

    .rail-toggle--header { display: none; }
    .rail-fab { display: inline-flex; align-items: center; justify-content: center; }
  }
  @media (max-width: 400px) {
    header.app { padding: 0 0.6rem; }
    .header-brand .brand-word { font-size: 0.85rem; }
    .home { padding: 0.85rem 0.85rem 1.2rem; }
    .tldr-card { padding: 0.8rem 0.9rem 0.7rem; }
    .tldr-card-body .tldr li { font-size: 0.8rem; }
  }

<!-- Terminal header bar (mirrors pagr): LEFT brand wordmark + cursor; RIGHT the
     nav-rail minimize toggle. The grouped category nav lives in the sticky right
     sidebar (.nav-rail). -->
<header class="app">
  <div class="header-left">
    <a class="header-brand" id="brand-home" href="#home" title="Übersicht">

      <span class="cursor-block" aria-hidden="true"></span>
    </a>
  </div>

  <div class="header-right">
    <button class="rail-toggle rail-toggle--header" id="rail-toggle" type="button"

            title="Navigation ein-/ausblenden">
      <span class="rail-toggle-glyph" aria-hidden="true">»</span>
    </button>
  </div>
</header>

<div class="app-shell">

  </main>

  <!-- Sticky right sidebar: the relocated Übersicht control (#home-btn) and the
       grouped category nav (#nav-groups, populated by JS from NAV_GROUPS). Can be
       minimized to an icon-only strip; collapsed state persists in localStorage. -->
  <aside class="nav-rail" id="nav-rail" aria-label="Navigation">
    <div class="nav-rail-head">
      <span class="nav-rail-title">~/briefs</span>
    </div>
    <div class="nav-rail-body">
      <div class="home-btn active" id="home-btn" role="button" tabindex="0" title="Übersicht">
        <span class="cat-color"></span>
        <!-- Full favicon design inline: dark frame + cream page + red
             double-rule + serif M. Identical SVG to favicon.svg so the
             browser tab and the home control read as the same "house" mark. -->
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">

          <rect x="2.5" y="2.5" width="59" height="59" rx="7" fill="#f1e7d3"/>

        <span class="nav-label-text">Übersicht</span>
      </div>
      <div id="nav-groups"><!-- populated by JS from NAV_GROUPS: grouped category
           nav (Wirtschaft / IT / jobs / Sport / Freizeit / Sprachen), each group
           with its own .nav-label header (standalone groups render headerless). --></div>
    </div>
  </aside>
</div>

        aria-label="Navigation öffnen" title="Navigation">☰</button>

     toggle (right). Controls keep their original ids so the existing handlers

        <span class="anim-box" aria-hidden="true">[x]</span>
        <span>anim</span>
      </button>
    </nav>
  </div>
</footer>

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Samstag, die Märkte sind zu — Zeit, in Ruhe auf etwas Seltsames zu schauen. Seit Freitag liegt auf brasilianischen Waren in den USA ein Zoll von zusammengerechnet <strong>37,5 %</strong>: die alten 25 % plus ein neuer Aufschlag von 12,5 %. Die Börse in São Paulo hat das sofort bezahlt — <strong>Ibovespa −1,52 %</strong>. Der Devisenmarkt hat es <em>ignoriert</em>: Der ECB-Fix stieg nur um 0,09 % auf <strong>EUR/BRL 5,7826</strong>, der kommerzielle Dollar schloss sogar tiefer. Meine These, mit der man streiten darf: Diese Ruhe ist keine Stärke, sondern Positionierung. Spekulanten sitzen mit <strong>31 Long-Kontrakten auf einen Short</strong> auf einer Seite des Bootes, der Devisenzufluss ist im Juli versiegt, und drei Häuser haben ihre Real-Prognosen binnen Wochen schwächer gestellt.</p>\n    <ul>\n      <li><span class=\"chip hot\">Zoll</span> <strong>37,5 % auf die meisten BR-Waren.</strong> 25 % (bestätigt 15.07.) plus <strong>12,5 %</strong> Aufschlag (angekündigt 23.07., wirksam 24.07.). Stahl/Alu separat bei 50 %; rund <strong>471 Produkte</strong> ausgenommen.</li>\n      <li><span class=\"chip\">FX</span> <strong>Anker ist der Freitags-Fix:</strong> EUR/BRL <strong>5,7826</strong> (+0,09 % ggü. Do). Samstag heißt: kein neuer Fix vor <strong>Montag ~11:15 BRT</strong>. Alle Kurse hier sind Freitags-Stände.</li>\n      <li><span class=\"chip\">BR</span> <strong>Aktien zahlten, Devisen nicht:</strong> Ibovespa <strong>174.041,95</strong> (−1,52 %) am Freitag, auf Wochensicht trotzdem +0,19 %. USD/BRL-Schluss <strong>R$ 5,081</strong> (−0,06 %).</li>\n      <li><span class=\"chip hot\">Positionierung</span> <strong>Alle sind long Real.</strong> CFTC (Stand 14.07.): <strong>55.346</strong> spekulative Longs gegen <strong>1.791</strong> Shorts, rund 31:1 bei 106.059 offenen Kontrakten.</li>\n      <li><span class=\"chip\">Konsens</span> <strong>Die Sell-Side dreht.</strong> Focus hält R$ 5,20 zum Jahre         "de": "<div class=\"tldr\"><p class=\"lead\">Samstag, die Märkte sind zu — Zeit, in Ruhe auf etwas Seltsames zu schauen. Seit Freitag liegt auf brasilianischen Waren in den USA ein Zoll von zusammengerechnet <strong>37,5 %</strong>: die alten 25 % plus ein neuer Aufschlag von 12,5 %. Die Börse in São Paulo hat das sofort bezahlt — <strong>Ibovespa −1,52 %</strong>. Der Devisenmarkt hat es <em>ignoriert</em>: Der ECB-Fix stieg nur um 0,09 % auf <strong>EUR/BRL 5,7826</strong>, der kommerzielle Dollar schloss sogar tiefer. Meine These, mit der man streiten darf: Diese Ruhe ist keine Stärke, sondern Positionierung. Spekulanten sitzen mit <strong>31 Long-Kontrakten auf einen Short</strong> auf einer Seite des Bootes, der Devisenzufluss ist im Juli versiegt, und drei Häuser haben ihre Real-Prognosen binnen Wochen schwächer gestellt.</p>\n    <ul>\n      <li><span class=\"chip hot\">Zoll</span> <strong>37,5 % auf die meisten BR-Waren.</strong> 25 % (bestätigt 15.07.) plus <strong>12,5 %</strong> Aufschlag (angekündigt 23.07., wirksam 24.07.). Stahl/Alu separat bei 50 %; rund <strong>471 Produkte</strong> ausgenommen.</li>\n      <li><span class=\"chip\">FX</span> <strong>Anker ist der Freitags-Fix:</strong> EUR/BRL <strong>5,7826</strong> (+0,09 % ggü. Do). Samstag heißt: kein neuer Fix vor <strong>Montag ~11:15 BRT</strong>. Alle Kurse hier sind Freitags-Stände.</li>\n      <li><span class=\"chip\">BR</span> <strong>Aktien zahlten, Devisen nicht:</strong> Ibovespa <strong>174.041,95</strong> (−1,52 %) am Freitag, auf Wochensicht trotzdem +0,19 %. USD/BRL-Schluss <strong>R$ 5,081</strong> (−0,06 %).</li>\n      <li><span class=\"chip hot\">Positionierung</span> <strong>Alle sind long Real.</strong> CFTC (Stand 14.07.): <strong>55.346</strong> spekulative Longs gegen <strong>1.791</strong> Shorts, rund 31:1 bei 106.059 offenen Kontrakten.</li>\n      <li><span class=\"chip\">Konsens</span> <strong>Die Sell-Side dreht.</strong> Focus hält R$ 5,20 zum Jahresende, <strong>Itaú</strong> hob auf 5,30, <strong>BTG</strong> von 4,90 auf <strong>5,40</strong> — auf Daniels Paar: EUR/BRL <strong>5,92 / 6,03 / 6,14</strong>.</li>\n      <li><span class=\"chip\">BR</span> <strong>Das Fiskal-Loch ist real geworden.</strong> Halbjahres-Primärdefizit <strong>R$ 92,3 Mrd.</strong> gegen R$ 9,8 Mrd. im Vorjahr; 12-Monats-Saldo von <strong>+16,2</strong> auf <strong>−145,2 Mrd.</strong> gekippt.</li>\n      <li><span class=\"chip hot\">USA</span> <strong>FOMC am 28./29.07.</strong> — Termin der Woche, Zielband 3,50–3,75 %, ohne neue Projektionen. Danach <strong>Copom 04./05.08.</strong></li>\n      <li><span class=\"chip\">Global</span> <strong>Brent unter 100:</strong> <strong>98,38 $</strong> (−2,29 % am Fr.) nach rund <strong>+30 % im Monat</strong>. Der Öl-Schock atmet aus — und mit ihm ein Stück Fed-Risiko.</li>\n      <li><span class=\"chip good\">FX</span> <strong>Kreuzkurs-Check sauber:</strong> Fix 5,7826 gegen implizierte 5,7826 = <strong>0,00 % Divergenz</strong> (Schwelle 0,5 %), mit unabhängig gezogenem EUR/USD 1,1377.</li>\n      <li><span class=\"chip\">Hinweis</span> Die Wahrscheinlichkeiten in der Prognose sind <strong>meine Konfidenz</strong>, keine markt-implizite Größe. Die Spot-Anker sind live gezogen und datiert.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Saturday, markets are closed — time to take a calm look at something strange. Since Friday, Brazilian goods entering the US carry a combined tariff of <strong>37.5%</strong>: the existing 25% plus a new 12.5% surcharge. The São Paulo stock exchange paid for it immediately — <strong>Ibovespa −1.52%</strong>. The FX market ignored it: the ECB fix rose only 0.09% to <strong>EUR/BRL 5.7826</strong>, and the commercial dollar even closed lower. My thesis, open for debate: this calm isn't strength, it's positioning. Speculators are sitting <strong>31 long contracts to one short</strong> on one side of the boat, the FX inflow dried up in July, and three houses have marked down their real forecasts within weeks.</p>\n    <ul>\n      <li><span class=\"chip hot\">Tariff</span> <strong>37.5% on most Brazilian goods.</strong> 25% (confirmed Jul 15) plus a <strong>12.5%</strong> surcharge (announced Jul 23, effective Jul 24). Steel/aluminum separately at 50%; roughly <strong>471 products</strong> exempted.</li>\n      <li><span class=\"chip\">FX</span> <strong>The anchor is Friday's fix:</strong> EUR/BRL <strong>5.7826</strong> (+0.09% vs. Thu). Saturday means no new fix before <strong>Monday ~11:15 BRT</strong>. All rates here are Friday levels.</li>\n      <li><span class=\"chip\">BR</span> <strong>Stocks paid, FX didn't:</strong> Ibovespa <strong>174,041.95</strong> (−1.52%) on Friday, still +0.19% for the week. USD/BRL close <strong>R$5.081</strong> (−0.06%).</li>\n      <li><span class=\"chip hot\">Positioning</span> <strong>Everyone is long the real.</strong> CFTC (as of Jul 14): <strong>55,346</strong> speculative longs against <strong>1,791</strong> shorts, about 31:1 on 106,059 open contracts.</li>\n      <li><span class=\"chip\">Consensus</span> <strong>The sell side is turning.</strong> Focus holds R$5.20 by year-end, <strong>Itaú</strong> raised to 5.30, <strong>BTG</strong> went from 4.90 to <strong>5.40</strong> — translated onto Daniel's pair: EUR/BRL <strong>5.92 / 6.03 / 6.14</strong>.</li>\n      <li><span class=\"chip\">BR</span> <strong>The fiscal hole has become real.</strong> First-half primary deficit <strong>R$92.3 billion</strong> against R$9.8 billion a year earlier; the 12-month balance flipped from <strong>+16.2</strong> to <strong>−145.2 billion</strong>.</li>\n      <li><span class=\"chip hot\">US</span> <strong>FOMC Jul 28-29</strong> — the event of the week, target range 3.50–3.75%, no new projections. Then <strong>Copom Aug 4-5</strong>.</li>\n      <li><span class=\"chip\">Global</span> <strong>Brent under 100:</strong> <strong>$98.38</strong> (−2.29% on Fri) after roughly <strong>+30% for the month</strong>. The oil shock is exhaling — and with it a piece of Fed risk.</li>\n      <li><span class=\"chip good\">FX</span> <strong>Cross-rate check clean:</strong> fix 5.7826 against an implied 5.7826 = <strong>0.00% divergence</strong> (threshold 0.5%), with an independently pulled EUR/USD 1.1377.</li>\n      <li><span class=\"chip\">Heads up</span> The probabilities in the forecast are <strong>my confidence levels</strong>, not market-implied figures. The spot anchors are pulled live and dated.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">É sábado, os mercados estão fechados — hora de olhar com calma para algo estranho. Desde sexta-feira, os produtos brasileiros nos EUA carregam uma tarifa combinada de <strong>37,5%</strong>: os antigos 25% mais um novo adicional de 12,5%. A Bolsa de São Paulo pagou a conta na hora — <strong>Ibovespa −1,52%</strong>. O mercado de câmbio ignorou: o fixing do BCE subiu apenas 0,09%, para <strong>EUR/BRL 5,7826</strong>, e o dólar comercial fechou até mais baixo. Minha tese, que pode ser contestada: essa calmaria não é força, é posicionamento. Os especuladores estão sentados com <strong>31 contratos comprados para cada um vendido</strong> de um lado do barco, a entrada de divisas secou em julho, e três casas revisaram suas previsões para o real para baixo em questão de semanas.</p>\n    <ul>\n      <li><span class=\"chip hot\">Tarifa</span> <strong>37,5% sobre a maioria dos produtos brasileiros.</strong> 25% (confirmados em 15/07) mais um adicional de <strong>12,5%</strong> (anunciado em 23/07, em vigor desde 24/07). Aço/alumínio à parte, em 50%; cerca de <strong>471 produtos</strong> ficam de fora.</li>\n      <li><span class=\"chip\">Câmbio</span> <strong>A âncora é o fixing de sexta-feira:</strong> EUR/BRL <strong>5,7826</strong> (+0,09% ante quinta). Sábado significa: nenhum fixing novo antes de <strong>segunda-feira, ~11:15 BRT</strong>. Todas as cotações aqui são de sexta-feira.</li>\n      <li><span class=\"chip\">BR</span> <strong>Ações pagaram, câmbio não:</strong> Ibovespa em <strong>174.041,95</strong> (−1,52%) na sexta, ainda assim +0,19% na semana. Fechamento do USD/BRL em <strong>R$ 5,081</strong> (−0,06%).</li>\n      <li><span class=\"chip hot\">Posicionamento</span> <strong>Todo mundo está comprado em real.</strong> CFTC (posição em 14/07): <strong>55.346</strong> contratos comprados especulativos contra <strong>1.791</strong> vendidos, cerca de 31 para 1 em 106.059 contratos em aberto.</li>\n      <li><span class=\"chip\">Consenso</span> <strong>A sell-side está virando.</strong> O Focus mantém R$ 5,20 para o fim do ano, o <strong>Itaú</strong> subiu para 5,30, o <strong>BTG</strong> foi de 4,90 para <strong>5,40</strong> — no par de Daniel: EUR/BRL <strong>5,92 / 6,03 / 6,14</strong>.</li>\n      <li><span class=\"chip\">BR</span> <strong>O rombo fiscal ficou real.</strong> Déficit primário do semestre de <strong>R$ 92,3 bilhões</strong> contra R$ 9,8 bilhões no ano anterior; saldo em 12 meses virou de <strong>+16,2</strong> para <strong>−145,2 bilhões</strong>.</li>\n      <li><span class=\"chip hot\">EUA</span> <strong>FOMC em 28-29/07</strong> — o compromisso da semana, faixa-alvo em 3,50–3,75%, sem novas projeções. Depois, <strong>Copom em 04-05/08</strong>.</li>\n      <li><span class=\"chip\">Global</span> <strong>Brent abaixo de 100:</strong> <strong>US$ 98,38</strong> (−2,29% na sexta) após cerca de <strong>+30% no mês</strong>. O choque do petróleo perde força — e, com ele, parte do risco para o Fed.</li>\n      <li><span class=\"chip good\">Câmbio</span> <strong>Checagem de câmbio cruzado limpa:</strong> fixing de 5,7826 contra 5,7826 implícito = <strong>0,00% de divergência</strong> (limiar de 0,5%), com EUR/USD 1,1377 coletado de forma independente.</li>\n      <li><span class=\"chip\">Nota</span> As probabilidades na previsão são <strong>minha confiança pessoal</strong>, não uma medida implícita de mercado. As âncoras à vista são coletadas ao vivo e datadas.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Sábado, los mercados están cerrados — momento para mirar con calma algo extraño. Desde el viernes, los productos brasileños que entran a Estados Unidos cargan un arancel combinado de <strong>37,5%</strong>: el 25% de siempre más un nuevo recargo de 12,5%. La bolsa de São Paulo pagó la cuenta de inmediato — <strong>Ibovespa −1,52%</strong>. El mercado cambiario lo ignoró: el fixing del BCE subió solo 0,09%, a <strong>EUR/BRL 5,7826</strong>, y el dólar comercial incluso cerró más bajo. Mi tesis, discutible: esta calma no es fortaleza, es posicionamiento. Los especuladores están sentados con <strong>31 contratos largos por cada uno corto</strong> de un lado del bote, la entrada de divisas se secó en julio, y tres casas revisaron a la baja sus pronósticos para el real en cuestión de semanas.</p>\n    <ul>\n      <li><span class=\"chip hot\">Arancel</span> <strong>37,5% sobre la mayoría de los productos brasileños.</strong> 25% (confirmado el 15/07) más un recargo de <strong>12,5%</strong> (anunciado el 23/07, vigente desde el 24/07). Acero/aluminio aparte, en 50%; alrededor de <strong>471 productos</strong> exentos.</li>\n      <li><span class=\"chip\">FX</span> <strong>El ancla es el fixing del viernes:</strong> EUR/BRL <strong>5,7826</strong> (+0,09% frente al jueves). Sábado significa: sin fixing nuevo antes del <strong>lunes ~11:15 hora de Brasilia</strong>. Todas las cotizaciones aquí son niveles del viernes.</li>\n      <li><span class=\"chip\">BR</span> <strong>Las acciones pagaron, el tipo de cambio no:</strong> Ibovespa en <strong>174.041,95</strong> (−1,52%) el viernes, pese a todo +0,19% en la semana. Cierre del USD/BRL en <strong>R$ 5,081</strong> (−0,06%).</li>\n      <li><span class=\"chip hot\">Posicionamiento</span> <strong>Todos están largos en el real.</strong> CFTC (al 14/07): <strong>55.346</strong> posiciones largas especulativas contra <strong>1.791</strong> cortas, alrededor de 31 a 1 sobre 106.059 contratos abiertos.</li>\n      <li><span class=\"chip\">Consenso</span> <strong>El sell side está girando.</strong> El Focus mantiene R$ 5,20 para fin de año, <strong>Itaú</strong> subió a 5,30, <strong>BTG</strong> pasó de 4,90 a <strong>5,40</strong> — traducido al par de Daniel: EUR/BRL <strong>5,92 / 6,03 / 6,14</strong>.</li>\n      <li><span class=\"chip\">BR</span> <strong>El hueco fiscal se volvió real.</strong> Déficit primario del semestre de <strong>R$ 92,3 mil millones</strong> frente a R$ 9,8 mil millones el año anterior; el saldo de 12 meses pasó de <strong>+16,2</strong> a <strong>−145,2 mil millones</strong>.</li>\n      <li><span class=\"chip hot\">EUA</span> <strong>FOMC el 28-29/07</strong> — la cita de la semana, rango objetivo 3,50–3,75%, sin nuevas proyecciones. Después, <strong>Copom el 04-05/08</strong>.</li>\n      <li><span class=\"chip\">Global</span> <strong>El Brent por debajo de 100:</strong> <strong>98,38 dólares</strong> (−2,29% el viernes) tras subir cerca de <strong>30% en el mes</strong>. El choque petrolero se desinfla — y con él, parte del riesgo para la Fed.</li>\n      <li><span class=\"chip good\">FX</span> <strong>Verificación de tipo cruzado limpia:</strong> fixing de 5,7826 frente a un implícito de 5,7826 = <strong>0,00% de divergencia</strong> (umbral de 0,5%), con un EUR/USD de 1,1377 obtenido de forma independiente.</li>\n      <li><span class=\"chip\">Nota</span> Las probabilidades del pronóstico son <strong>mi propia confianza</strong>, no una cifra implícita del mercado. Las anclas spot son en vivo y con fecha.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Eine Woche, die mit einer Ansage begann, endet mit einer Rechnung. Am Donnerstag hat die EU-Kommission Google zum ersten Mal Geld für DMA-Verstöße abgenommen — 890 Mio. €, aufgeteilt auf zwei Entscheidungen, und die zweite davon ist die für App-Entwickler interessante. Daneben ein Windows-Fund, der in jeder halbwegs großen Domäne wehtut: Ein normaler Domänen-Nutzer schummelt sich zum Domain Controller, Patch seit dem 14.07., Exploit-Code seit gestern öffentlich. Dazu Microsofts eigene Erklärung für die Donnerstags-Störung — ein Automatisierungs-Bug, der zu viele Routen abgeräumt hat — und ein ehrlicher Nachtrag zu RefluXFS: Die 7,8, die überall steht, hat die NVD bis heute früh nicht vergeben.</p>\n    <ul>\n      <li><span class=\"chip hot\">Regulierung</span> <strong>EU vs. Google</strong>: 890 Mio. € Buße am 23.07. — 460 Mio. € für Selbstbevorzugung in der Suche, 430 Mio. € für die Steering-Sperre im Play Store. Kern des zweiten Teils: App-Entwickler sollen Kunden <em>kostenlos</em> auf günstigere Angebote außerhalb hinweisen dürfen. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Certighost (CVE-2026-54121)</strong>: Fehler in Active Directory Certificate Services, CVSS 8,8 — ein schwach privilegierter Domänen-Nutzer gibt sich als Domain Controller aus und zieht per DCSync das krbtgt-Geheimnis. Gepatcht am 14.07., voller PoC seit 24.07. öffentlich. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>Microsoft 365 / Azure</strong>: Microsoft nennt als Ursache der Donnerstags-Störung einen Bug im automatisierten Netzwerk-Wartungssystem — es entfernte IP-Routen von mehr Geräten als vorgesehen. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>RefluXFS-Nachtrag</strong>: Die NVD führt CVE-2026-64600 seit 23.07., zeigt aber für CVSS v3.1 <em>und</em> v4.0 weiterhin „NVD assessment not yet provided\". Die kursierende 7,8 stammt aus Sekundärquellen, nicht von der NVD. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Clop</strong>: neue Datendiebstahl-Erpressung gegen aus dem Internet erreichbare PTC-Windchill- und FlexPLM-Instanzen — dasselbe Muster wie MOVEit und Cleo, nur ein anderes Enterprise-System. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Release</span> <strong>GitLab 19.2</strong> (16.07.): Scheduled Pipeline Execution Policies sind GA — ein Zeitplan im Security-Policy-Projekt, erzwungen über alle Projekte im Geltungsbereich. Dependency-Scanning-Auto-Remediation im Beta. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Frist heute</strong>: Die CISA-KEV-Frist für die SharePoint-Lücke CVE-2026-50522 läuft für US-Behörden heute ab. <span class=\"chip\">USA</span></li>\n      <li><span class=\"chip\">Regulierung</span> <strong>NIS-2</strong>: Die BSI-Nachfrist für die Registrierung endet am Freitag, 31.07. — noch sechs Tage. Relevanz für Solo-Devs: über die Lieferanten-Fragebögen deutscher Kunden. <span class=\"chip\">DE</span></li>\n    </ul></div>",
      "latestTldrHtmlByLang": {
        "de": "<div class=\"tldr\"><p class=\"lead\">Eine Woche, die mit einer Ansage begann, endet mit einer Rechnung. Am Donnerstag hat die EU-Kommission Google zum ersten Mal Geld für DMA-Verstöße abgenommen — 890 Mio. €, aufgeteilt auf zwei Entscheidungen, und die zweite davon ist die für App-Entwickler interessante. Daneben ein Windows-Fund, der in jeder halbwegs großen Domäne wehtut: Ein normaler Domänen-Nutzer schummelt sich zum Domain Controller, Patch seit dem 14.07., Exploit-Code seit gestern öffentlich. Dazu Microsofts eigene Erklärung für die Donnerstags-Störung — ein Automatisierungs-Bug, der zu viele Routen abgeräumt hat — und ein ehrlicher Nachtrag zu RefluXFS: Die 7,8, die überall steht, hat die NVD bis heute früh nicht vergeben.</p>\n    <ul>\n      <li><span class=\"chip hot\">Regulierung</span> <strong>EU vs. Google</strong>: 890 Mio. € Buße am 23.07. — 460 Mio. € für Selbstbevorzugung in der Suche, 430 Mio. € für die Steering-Sperre im Play Store. Kern des zweiten Teils: App-Entwickler sollen Kunden <em>kostenlos</em> auf günstigere Angebote außerhalb hinweisen dürfen. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Certighost (CVE-2026-54121)</strong>: Fehler in Active Directory Certificate Services, CVSS 8,8 — ein schwach privilegierter Domänen-Nutzer gibt sich als Domain Controller aus und zieht per DCSync das krbtgt-Geheimnis. Gepatcht am 14.07., voller PoC seit 24.07. öffentlich. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>Microsoft 365 / Azure</strong>: Microsoft nennt als Ursache der Donnerstags-Störung einen Bug im automatisierten Netzwerk-Wartungssystem — es entfernte IP-Routen von mehr Geräten als vorgesehen. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>RefluXFS-Nachtrag</strong>: Die NVD führt CVE-2026-64600 seit 23.07., zeigt aber für CVSS v3.1 <em>und</em> v4.0 weiterhin „NVD assessment not yet provided\". Die kursierende 7,8 stammt aus Sekundärquellen, nicht von der NVD. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Clop</strong>: neue Datendiebstahl-Erpressung gegen aus dem Internet erreichbare PTC-Windchill- und FlexPLM-Instanzen — dasselbe Muster wie MOVEit und Cleo, nur ein anderes Enterprise-System. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Release</span> <strong>GitLab 19.2</strong> (16.07.): Scheduled Pipeline Execution Policies sind GA — ein Zeitplan im Security-Policy-Projekt, erzwungen über alle Projekte im Geltungsbereich. Dependency-Scanning-Auto-Remediation im Beta. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Frist heute</strong>: Die CISA-KEV-Frist für die SharePoint-Lücke CVE-2026-50522 läuft für US-Behörden heute ab. <span class=\"chip\">USA</span></li>\n      <li><span class=\"chip\">Regulierung</span> <strong>NIS-2</strong>: Die BSI-Nachfrist für die Registrierung endet am Freitag, 31.07. — noch sechs Tage. Relevanz für Solo-Devs: über die Lieferanten-Fragebögen deutscher Kunden. <span class=\"chip\">DE</span></li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">A week that started with a warning ends with a bill. On Thursday, the EU Commission took money from Google for DMA violations for the first time — €890 million, split across two decisions, and the second one is the interesting part for app developers. Alongside that, a Windows finding that hurts in any reasonably large domain: an ordinary domain user talks their way up to Domain Controller, patched since July 14, exploit code public since yesterday. Plus Microsoft's own explanation for Thursday's outage — an automation bug that cleared out too many routes — and an honest follow-up on RefluXFS: the 7.8 score circulating everywhere hadn't been assigned by the NVD as of this morning.</p>\n    <ul>\n      <li><span class=\"chip hot\">Regulation</span> <strong>EU vs. Google</strong>: €890 million fine on July 23 — €460 million for self-preferencing in Search, €430 million for the anti-steering lock in the Play Store. Core of the second part: app developers should be allowed to point customers <em>free of charge</em> to cheaper offers outside the store. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Certighost (CVE-2026-54121)</strong>: a flaw in Active Directory Certificate Services, CVSS 8.8 — a low-privileged domain user impersonates a Domain Controller and pulls the krbtgt secret via DCSync. Patched July 14, full PoC public since July 24. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>Microsoft 365 / Azure</strong>: Microsoft names the cause of Thursday's outage as a bug in its automated network maintenance system — it removed IP routes from more devices than intended. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>RefluXFS follow-up</strong>: the NVD has listed CVE-2026-64600 since July 23, but still shows \"NVD assessment not yet provided\" for both CVSS v3.1 <em>and</em> v4.0. The 7.8 score circulating around comes from secondary sources, not the NVD. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Clop</strong>: a new data-theft extortion campaign against internet-facing PTC Windchill and FlexPLM instances — the same pattern as MOVEit and Cleo, just a different enterprise system. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Release</span> <strong>GitLab 19.2</strong> (July 16): Scheduled Pipeline Execution Policies are GA — a schedule defined once in a security policy project and enforced across every project in scope. Dependency Scanning Auto-Remediation is in beta. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Deadline today</strong>: the CISA KEV deadline for the SharePoint flaw CVE-2026-50522 expires for US federal agencies today. <span class=\"chip\">US</span></li>\n      <li><span class=\"chip\">Regulation</span> <strong>NIS2</strong>: the BSI's grace period for registration ends Friday, July 31 — six days left. Relevance for solo devs: via the supplier questionnaires of German clients. <span class=\"chip\">DE</span></li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Uma semana que começou com um aviso termina com uma conta. Na quinta-feira, a Comissão Europeia cobrou dinheiro do Google pela primeira vez por violações do DMA — 890 milhões de €, divididos em duas decisões, e a segunda delas é a que interessa aos desenvolvedores de apps. Ao lado, uma descoberta no Windows que dói em qualquer domínio de porte razoável: um usuário de domínio comum consegue chegar a Domain Controller, patch desde 14/07, código de exploração público desde ontem. Além disso, a explicação da própria Microsoft para a instabilidade de quinta-feira — um bug de automação que removeu rotas demais — e um adendo honesto sobre o RefluXFS: o 7,8 que circula por aí ainda não tinha sido atribuído pela NVD até esta manhã.</p>\n    <ul>\n      <li><span class=\"chip hot\">Regulação</span> <strong>UE vs. Google</strong>: multa de 890 milhões de € em 23/07 — 460 milhões de € por autopreferência na busca, 430 milhões de € pela trava de steering na Play Store. Núcleo da segunda parte: desenvolvedores de apps devem poder avisar os clientes <em>gratuitamente</em> sobre ofertas mais baratas fora da loja. <span class=\"chip\">UE</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Certighost (CVE-2026-54121)</strong>: falha no Active Directory Certificate Services, CVSS 8,8 — um usuário de domínio com poucos privilégios se passa por Domain Controller e extrai o segredo krbtgt via DCSync. Corrigido em 14/07, PoC completo público desde 24/07. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>Microsoft 365 / Azure</strong>: a Microsoft aponta como causa da instabilidade de quinta-feira um bug no sistema automatizado de manutenção de rede — que removeu rotas de IP de mais dispositivos do que o previsto. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Adendo ao RefluXFS</strong>: a NVD lista o CVE-2026-64600 desde 23/07, mas continua mostrando \"NVD assessment not yet provided\" tanto para CVSS v3.1 <em>quanto</em> para v4.0. O 7,8 que circula vem de fontes secundárias, não da NVD. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Clop</strong>: nova campanha de extorsão por roubo de dados contra instâncias de PTC Windchill e FlexPLM acessíveis pela internet — o mesmo padrão do MOVEit e do Cleo, só que outro sistema enterprise. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Release</span> <strong>GitLab 19.2</strong> (16/07): Scheduled Pipeline Execution Policies chegaram ao GA — um cronograma definido no projeto de política de segurança, imposto sobre todos os projetos no escopo. Dependency Scanning Auto-Remediation em beta. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Prazo hoje</strong>: o prazo da KEV da CISA para a falha do SharePoint CVE-2026-50522 vence hoje para os órgãos federais dos EUA. <span class=\"chip\">EUA</span></li>\n      <li><span class=\"chip\">Regulação</span> <strong>NIS-2</strong>: o prazo de tolerância do BSI para o registro termina na sexta-feira, 31/07 — faltam seis dias. Relevância para devs solo: via os questionários de fornecedores de clientes alemães. <span class=\"chip\">DE</span></li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Una semana que empezó con un aviso termina con una cuenta. El jueves, la Comisión Europea le cobró dinero a Google por primera vez por violaciones al DMA — 890 millones de €, repartidos en dos decisiones, y la segunda es la que le interesa a los desarrolladores de apps. Al lado, un hallazgo en Windows que duele en cualquier dominio de tamaño razonable: un usuario de dominio común logra llegar a Domain Controller, parche desde el 14/07, código de explotación público desde ayer. Además, la propia explicación de Microsoft para la interrupción del jueves — un error de automatización que eliminó demasiadas rutas — y una adenda honesta sobre RefluXFS: el 7,8 que circula por todos lados todavía no había sido asignado por la NVD hasta esta mañana.</p>\n    <ul>\n      <li><span class=\"chip hot\">Regulación</span> <strong>UE vs. Google</strong>: multa de 890 millones de € el 23/07 — 460 millones de € por autopreferencia en la búsqueda, 430 millones de € por el bloqueo de steering en la Play Store. Núcleo de la segunda parte: los desarrolladores de apps deben poder avisarles a los clientes <em>de forma gratuita</em> sobre ofertas más baratas fuera de la tienda. <span class=\"chip\">UE</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Certighost (CVE-2026-54121)</strong>: falla en Active Directory Certificate Services, CVSS 8,8 — un usuario de dominio con pocos privilegios se hace pasar por Domain Controller y extrae el secreto krbtgt vía DCSync. Parcheado el 14/07, PoC completo público desde el 24/07. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>Microsoft 365 / Azure</strong>: Microsoft señala como causa de la interrupción del jueves un error en su sistema automatizado de mantenimiento de red — que eliminó rutas IP de más dispositivos de los previstos. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Adenda de RefluXFS</strong>: la NVD tiene listado el CVE-2026-64600 desde el 23/07, pero sigue mostrando \"NVD assessment not yet provided\" tanto para CVSS v3.1 <em>como</em> para v4.0. El 7,8 que circula viene de fuentes secundarias, no de la NVD. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Clop</strong>: nueva campaña de extorsión por robo de datos contra instancias de PTC Windchill y FlexPLM accesibles desde internet — el mismo patrón que MOVEit y Cleo, solo que otro sistema empresarial. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Release</span> <strong>GitLab 19.2</strong> (16/07): las Scheduled Pipeline Execution Policies llegaron a GA — un calendario definido en el proyecto de política de seguridad, impuesto sobre todos los proyectos dentro del alcance. Dependency Scanning Auto-Remediation en beta. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Plazo hoy</strong>: el plazo de la KEV de la CISA para la falla de SharePoint CVE-2026-50522 vence hoy para las agencias federales de EE. UU. <span class=\"chip\">EUA</span></li>\n      <li><span class=\"chip\">Regulación</span> <strong>NIS-2</strong>: el plazo de gracia del BSI para el registro termina el viernes 31/07 — quedan seis días. Relevancia para devs independientes: vía los cuestionarios de proveedores de clientes alemanes. <span class=\"chip\">DE</span></li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Heute geht es nicht um ein neues Modell, sondern um Stecker und Preis — die zwei Dinge, die deinen Alltag härter treffen als jeder Benchmark. Am Dienstag erscheint die MCP-Spezifikation <strong>2026-07-28</strong>: größte Überarbeitung seit dem Start, das Protokoll wird staatenlos, <code>initialize</code>-Handshake und Session-ID fallen weg — mit ausdrücklichen Breaking Changes. Fünf Wochen später, am 31. August, läuft der Einführungspreis von Claude Sonnet 5 aus und die Token-Kosten steigen um die Hälfte. Dazu habe ich die kursierende „82,1 % auf SWE-bench Verified, erstes Modell über 80\" nachgeschlagen — sie hält der Prüfung nicht stand. Und GitHub lässt zum ersten Mal ein offenes Modell in den Copilot-Wähler.</p>\n    <ul>\n      <li><span class=\"chip hot\">MCP</span> <strong>Finalspec 2026-07-28</strong> erscheint am Dienstag: „die größte Überarbeitung des Protokolls seit dem Start\". Kern wird <strong>staatenlos</strong> — <code>initialize</code>/<code>initialized</code> und der <code>Mcp-Session-Id</code>-Header entfallen, jeder Request darf auf jeder Server-Instanz landen.</li>\n      <li><span class=\"chip hot\">MCP</span> <strong>Breaking Changes, ausdrücklich</strong>: der <code>2025-11-25</code>-Initialize-Flow und session-basiertes Routing funktionieren nicht mehr. Tasks wandert aus dem Core in ein Extension-Framework (<code>tasks/get</code>, <code>tasks/update</code>, <code>tasks/cancel</code>); Roots, Sampling und Logging sind deprecated mit 12-Monats-Frist.</li>\n      <li><span class=\"chip\">Claude</span> <strong>Sonnet-5-Preis-Cliff am 31.08.</strong>: aktuell <span class=\"stat\">2 $</span>/<span class=\"stat\">10 $</span> je Mio. Input-/Output-Tokens, ab 1. September <span class=\"stat\">3 $</span>/<span class=\"stat\">15 $</span> — plus 50 % auf beiden Seiten, bei unverändertem Modell.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Die 82,1 % halten nicht.</strong> Anthropics eigene Ankündigungsseite nennt (Abruf 25.07.) gar keine SWE-bench-Zahl; das datierte BenchLM-Aggregat führt Sonnet 5 mit <span class=\"stat\">85,2 %</span> auf <strong>Rang 6</strong> — hinter fünf Anthropic-Modellen. „Erstes Modell über 80 %\" ist auf diesem Board schlicht falsch: acht Einträge liegen über 80.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Unabhängige Zweitmeinungen</strong> zu Sonnet 5: Artificial Analysis Intelligence Index <span class=\"stat\">53</span> Punkte; Arena.ai WebDev Rang 10 mit <span class=\"stat\">1541</span> ±11. Stark, aber nicht Spitze.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>Kimi K2.7 Code in GitHub Copilot</strong> (01.07.) — laut GitHub „das erste Open-Weight-Modell als wählbare Option im Copilot-Modell-Wähler\". <span class=\"stat\">0,95 $</span>/<span class=\"stat\">4,00 $</span> je Mio. Tokens, also grob ein Drittel bis die Hälfte der proprietären Optionen daneben.</li>\n      <li><span class=\"chip\">Local</span> <strong>NVIDIA Nemotron-Labs-TwoTower</strong> (01.07.): 2,42× Durchsatz bei 98,7 % der Basis-Qualität, offene Gewichte auf Hugging Face. Aber Basismodell ohne Instruction-Tuning, und Code/Mathe verlieren gegenüber der Referenz — heute kein Werkzeug für deine Coding-Kette.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Rundruf</strong>: Cursor Router seit 22.07., Windsurf endgültig „Devin Desktop\", Continue.dev eingestellt, OpenHands 1.0 auf LiteLLM, Cline mit headless CLI 2.0 — und Aiders Board steht weiter auf 20.11.2025.</li>\n      <li><span class=\"chip\">Quelle</span> <strong>Beleglage</strong>: swebench.com war auch heute nicht als Tabelle lesbar; die Bench-Zahlen unten stammen aus einem datierten Aggregat plus zwei unabhängigen Boards. Alles als solches gekennzeichnet.</li>\n    </ul></div>",
