<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daniels Morning Briefs</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="lib/tokens.css">
<script>
  // Pre-paint animation policy (mirrors the terminal core / pagr): an explicit
  // "off" in localStorage — or no pick while the OS prefers reduced motion —
  // marks html.anim-off so components.css kills keyframes (incl. the brand
  // cursor blink) with no flash. The footer anim toggle persists "on"/"off".
  (function () {
    let pref = null;
    try { pref = localStorage.getItem('anim'); } catch (_) {}
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (pref === 'off' || (pref === null && reduced)) {
      document.documentElement.classList.add('anim-off');
    }
  })();
  // Resolution-independent zoom (mirrors pagr): lay out at a 1920px reference, then
  // scale the whole view up on wider screens — a true zoom of everything, never below
  // 1×. Pre-paint to avoid a flash.
  (function () {
    var applyZoom = function () {
      document.documentElement.style.zoom = String(Math.max(1, window.innerWidth / 1920));
    };
    applyZoom();
    window.addEventListener('resize', applyZoom);
  })();
</script>
<style>
  /* Dashboard chrome styles. Design tokens (colours, shadow, typography vars)
     come from lib/tokens.css — keep them there so the dashboard and the
     newsletter content stay in sync. */
  * { box-sizing: border-box; }
  /* Lock the outer document — only inner scroll containers (the .home view
     and the iframe) handle scrolling. Without this, a tiny mismatch between
     header.app + .app-shell heights and 100vh adds a few pixels of overflow
     to <html>, producing a second outer scrollbar alongside the one inside
     .home. overflow: hidden on both html and body kills that outer track. */
  html, body {
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    height: 100%;
    overflow: hidden;
  }
  html { position: relative; }

  /* Paper-grain noise overlay — same texture as the newsletter pages.
     Imperceptible up close, breaks LCD flatness at distance. Disabled under
     reduced-motion / high-contrast preferences. */
  html::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image: none;
    opacity: 0.04;
    mix-blend-mode: multiply;
  }
  @media (prefers-reduced-motion: reduce), (prefers-contrast: more) {
    html::before { display: none; }
  }
  body > *, header.app { position: relative; z-index: 1; }
  body {
    font-family: var(--font-body);
    line-height: 1.5;
    font-size: 15px;
    font-feature-settings: "kern", "liga", "onum";
    -webkit-font-smoothing: antialiased;
  }

  /* Terminal header bar — mirrors the pagr/seedr chrome: a single row on a
     --card surface with a --border bottom rule. LEFT: the brand wordmark
     (mono + .glow) and a blinking .cursor-block. RIGHT: the nav-rail minimize
     toggle. */
  header.app {
    border-bottom: 1px solid var(--border);
    background: var(--card);
    font-family: var(--font-mono); /* chrome is terminal mono; the content stays serif */
    /* Lift the header above the content, which is also a positioned body child
       at z-index 1 and would otherwise paint over it. */
    z-index: 50;
    padding: 0 1rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    min-height: 3rem;
  }
  /* LEFT zone — brand only. */
  .header-left {
    display: flex;
    align-items: center;
    flex: none;
    min-width: 0;
  }
  .header-brand {
    display: inline-flex;
    align-items: center;
    flex: none;
    text-decoration: none;
    cursor: pointer;
  }
  .header-brand .brand-word {
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: -0.01em;
  }

  /* RIGHT zone — the nav-rail minimize toggle, pushed to the far right
     (the header has no center zone). */
  .header-right {
    flex: none;
    margin-left: auto;
    display: flex;
    align-items: center;
  }

  /* Layout: two columns — flexible main + a fixed-width nav-rail on the right.
     The fixed footer is 2rem tall, so the shell is the viewport minus the
     header (3rem) and the footer (2rem). When the rail is collapsed the
     --rail-w track narrows to the icon-only strip. */
  .app-shell {
    display: grid;
    grid-template-columns: minmax(0, 1fr) var(--rail-w, 16rem);
    height: calc(100vh - 3rem - 2rem);
    height: calc(100dvh - 3rem - 2rem);
  }
  .app-shell.rail-collapsed { --rail-w: 3rem; }

  /* The nav lives in the sticky right sidebar (.nav-rail). It holds the
     Übersicht control (#home-btn) and #nav-groups (the grouped category nav,
     populated by JS). */
  .nav-label {
    font-family: var(--font-mono);
    font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--muted-foreground); padding: 0.5rem 0.85rem 0.2rem; font-weight: 600;
  }
  #nav-groups { padding-bottom: 0.2rem; }

  .cat {
    margin: 0;
    border-radius: 0;
    overflow: hidden;
    border: 0;
  }
  .cat-head {
    display: flex; align-items: center; gap: 0.55rem;
    padding: 0.45rem 0.85rem;
    cursor: pointer;
    border-radius: 0;
    transition: background 120ms;
    min-height: 2.1rem;
  }
  .cat-head:hover { background: var(--muted); }
  .cat-head:hover .cat-name { color: var(--primary); }
  .cat.active .cat-head { background: var(--muted); }
  .cat.active .cat-name { color: var(--primary); }
  .cat-color { width: 6px; height: 18px; border-radius: 0; flex: none; }
  .cat-name {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 0.8rem;
    color: var(--foreground);
    transition: color 0.15s ease;
    flex: 1;
    /* Single-line; ellipsise rather than wrap to two lines. */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .cat-icon { font-size: 1.05rem; }
  .cat-latest {
    font-family: var(--font-mono);
    font-size: 0.68rem; color: var(--soft);
    font-feature-settings: "tnum"; font-weight: 500;
  }
  .cat-toggle {
    background: transparent; border: none;
    color: var(--soft); cursor: pointer;
    transition: transform 150ms ease, background 120ms, color 120ms;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    padding: 0.55rem 0.7rem;
    border-radius: var(--radius-inline);
    line-height: 1;
    min-height: 2.25rem; min-width: 2.25rem;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .cat-toggle:hover { background: var(--rule-soft); color: var(--fg); }
  .cat.open > .cat-head .cat-toggle { transform: rotate(90deg); }

  .cat-dates { display: none; padding: 0.15rem 0.7rem 0.4rem 1.45rem; }

  .cat.open .cat-dates { display: block; }
  /* The category dropdown holds only the archive month-picker: days with a
     brief are clickable (ringed in the category accent), the selected day is
     filled, hovering one previews its title. Border + marks use the
     per-category --cat-accent scoped on the .cat row. */
  .cat-cal {
    margin: 0.2rem 0;
    padding: 0.5rem;
    border: 1px solid var(--cat-accent);
    border-radius: 6px;
    background: var(--rule-soft);
  }
  .cal-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 0.45rem;
  }
  .cal-title {
    font-family: var(--font-mono); font-size: 0.74rem;
    font-weight: 600; color: var(--fg);
  }
  .cal-nav {
    width: 1.7rem; height: 1.7rem; line-height: 1;
    background: transparent; border: 1px solid var(--rule); border-radius: 4px;
    color: var(--muted-ink); font-size: 0.95rem; cursor: pointer;
    transition: color 120ms, border-color 120ms;
  }
  .cal-nav:hover:not(:disabled) { color: var(--fg); border-color: var(--soft); }
  .cal-nav:focus-visible { outline: 2px solid var(--cat-accent, var(--fg)); outline-offset: 2px; }
  .cal-nav:disabled { opacity: 0.3; cursor: default; }
  .cal-week, .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
  }
  .cal-week { margin-bottom: 3px; }
  .cal-week span {
    text-align: center; font-family: var(--font-mono);
    font-size: 0.58rem; color: var(--muted-ink);
  }
  .cal-day {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 0.7rem;
    border-radius: 4px; color: var(--soft);
    font-feature-settings: "tnum";
  }
  .cal-day.none { color: var(--rule); }
  .cal-day.blank { visibility: hidden; }
  .cal-day.has {
    color: var(--fg); font-weight: 600; cursor: pointer; text-decoration: none;
    background: var(--panel);
    box-shadow: inset 0 0 0 1px var(--cat-accent);
    transition: background 100ms, color 100ms;
  }
  .cal-day.has:hover, .cal-day.has:focus-visible,
  .cal-day.has.current {
    background: var(--cat-accent); color: #fff; outline: none;
  }
  .cal-preview {
    margin-top: 0.5rem; padding-top: 0.45rem;
    border-top: 1px solid var(--rule);
    font-family: var(--font-body); font-size: 0.72rem;
    color: var(--muted-ink); line-height: 1.35; min-height: 1.7rem;
  }
  /* ────────────────────────────────────────────────────────────────────
     Fixed footer status bar — mirrors the pagr/seedr StatusBar: a 2rem bar
     pinned to the viewport bottom on a --card surface with a --border top
     rule. LEFT: `[briefs] reader@briefs:~/path` status line. RIGHT: the
     relocated controls (theme menu, language menu) + an anim toggle.
     ──────────────────────────────────────────────────────────────────── */
  footer.status-bar {
    position: fixed;
    inset-inline: 0;
    bottom: 0;
    z-index: 60;
    height: 2rem;
    border-top: 1px solid var(--border);
    background: var(--card);
    font-family: var(--font-mono); /* chrome is terminal mono */
    font-size: 11px;
  }
  .status-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    height: 100%;
    padding: 0 0.85rem;
  }
  .status-path {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted-foreground);
  }
  .status-path .status-tag { color: var(--primary); }
  .status-path .status-loc { color: var(--foreground); }
  .status-controls {
    display: flex;
    align-items: center;
    gap: 1.1rem;
    flex: none;
  }
  .status-sep { height: 0.9rem; width: 1px; background: var(--border); flex: none; }

  /* Footer control buttons — flat, muted, warm to --primary on hover. No
     boxes, no shadows; terminal-plain. */
  .status-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: inherit;
    line-height: 1;
    color: var(--muted-foreground);
    text-decoration: none;
    background: none;
    border: 0;
    border-radius: 0;
    padding: 0;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .status-btn:hover { color: var(--primary); }

  /* Theme + language dropdowns reuse the core .dropdown / .dropdown-panel /
     .dropdown-item primitives. The summary mirrors .status-btn. */
  .status-controls .dropdown > summary { font: inherit; }
  /* Settings icons (.dd-dot theme indicator, .dd-flag language flags) come from
     the shared @danieldeusing/design components.css — no local copy here. */

  /* Anim toggle — `[x] anim` / `[ ] anim`, mirroring pagr's footer toggle. */
  .anim-toggle { white-space: nowrap; }
  .anim-toggle[aria-pressed="true"] .anim-box { color: var(--primary); }

  /* Language picker — the trigger anchors the upward dropdown menu. The menu
     reuses the core .dropdown-panel (absolute, opens above, right-aligned),
     toggled open/closed via the [hidden] attribute by the existing JS. */
  .lang-picker { position: relative; }
  .lang-caret { font-size: 0.6rem; margin-left: 0.1rem; }
  .lang-menu[hidden] { display: none; }
  .lang-option[aria-selected="true"] {
    color: var(--primary);
    text-shadow: 0 0 8px var(--glow);
  }

  .cat-empty {
    font-family: var(--font-mono);
    font-size: 0.7rem; color: var(--soft);
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 0.5rem 0.6rem;
  }

  /* Main area — full width, fills the shell (viewport minus header + footer). */
  .main {
    overflow: hidden;
    background: var(--bg);
    position: relative;
    height: 100%;
  }
  .iframe-host { width: 100%; height: 100%; border: none; background: var(--bg); }

  /* ────────────────────────────────────────────────────────────────────
     Sticky right sidebar (.nav-rail) — terminal mono, --card surface with a
     --border left rule, full shell height with its own scroll. Holds the
     Übersicht control + the grouped category nav. Collapses to a 3rem icon-
     only strip; the width animates via the grid track on .app-shell.
     ──────────────────────────────────────────────────────────────────── */
  .nav-rail {
    grid-column: 2;
    font-family: var(--font-mono);
    background: var(--card);
    border-left: 1px solid var(--border);
    height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 2;
  }
  .nav-rail-head {
    display: flex;
    align-items: center;
    min-height: 2.1rem;
    padding: 0.4rem 0.85rem;
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .nav-rail-title {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 600;
    color: var(--muted-foreground);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-rail-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0.3rem 0 0.4rem;
  }

  /* Minimize toggle — the `»`/`«` chevron in the header right zone. Flat, muted,
     warm to --primary on hover (terminal-plain, no box). */
  .rail-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    flex: none;
    background: none;
    border: 0;
    border-radius: 0;
    color: var(--muted-foreground);
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 1rem;
    line-height: 1;
    transition: color 0.15s ease;
  }
  .rail-toggle:hover { color: var(--primary); }
  /* Expanded → `»` (collapse-to-right); collapsed → `«` (re-open). The button's
     aria-expanded drives the glyph; JS rewrites the text content too as a fallback. */
  .rail-toggle[aria-expanded="false"] .rail-toggle-glyph::before { content: "«"; }
  .rail-toggle[aria-expanded="true"]  .rail-toggle-glyph::before { content: "»"; }
  .rail-toggle-glyph { font-size: 0; }
  .rail-toggle-glyph::before { font-size: 1rem; }

  /* Collapsed strip — keep only the per-category accent bar + icon, hide labels,
     calendars and the home wordmark. The 3rem track clips the rest. */
  .app-shell.rail-collapsed .nav-rail-title,
  .app-shell.rail-collapsed .nav-label,
  .app-shell.rail-collapsed .cat-name,
  .app-shell.rail-collapsed .cat-latest,
  .app-shell.rail-collapsed .cat-toggle,
  .app-shell.rail-collapsed .cat-dates,
  .app-shell.rail-collapsed .home-btn .nav-label-text,
  .app-shell.rail-collapsed .home-btn .brand-mark {
    display: none;
  }
  .app-shell.rail-collapsed .nav-rail-head { justify-content: center; padding: 0.4rem 0; }
  .app-shell.rail-collapsed .cat-head,
  .app-shell.rail-collapsed .home-btn {
    justify-content: center;
    padding-left: 0;
    padding-right: 0;
    gap: 0;
  }
  .app-shell.rail-collapsed .cat-color,
  .app-shell.rail-collapsed .home-btn .cat-color { margin-right: 0.4rem; }

  /* The width transition reads off the grid track; animate it. */
  .app-shell { transition: grid-template-columns 0.18s ease; }
  @media (prefers-reduced-motion: reduce) {
    .app-shell { transition: none; }
  }

  /* Mobile re-open button (a floating ☰); shown only when the rail is an
     off-canvas drawer (≤720px). Hidden on desktop. */
  .rail-fab {
    display: none;
    position: fixed;
    right: 0.75rem;
    bottom: 2.6rem;
    z-index: 55;
    width: 2.6rem;
    height: 2.6rem;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--foreground);
    font-family: var(--font-mono);
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow: 0 0 18px var(--glow-soft);
  }

  /* Home view */
  .home {
    display: none;
    padding: 1.5rem 1.8rem;
    overflow-y: auto; height: 100%;
    /* Container for the responsive .tldr-grid below — column-count tracks
       the actual available width, not the viewport (which changes with
       sidebar collapsed/expanded state). */
    container-type: inline-size;
    container-name: home;
  }
  .home.show { display: block; }
  .home h2 {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 48;
    font-size: 1.55rem; font-weight: 600;
    margin: 0 0 0.5rem; letter-spacing: -0.005em;
  }
  .home .lead { color: var(--muted-ink); margin-bottom: 1.4rem; font-family: var(--font-body); }

  /* Freshness line — "Stand: DD.MM.YYYY" from the manifest's `generated`
     date. Mono-caps to read as a dateline, not body copy. When the manifest
     wasn't rebuilt today (a silently-failed nightly task), .stale flips it to
     the warn accent and appends a hint, so a missed run is visible at a glance
     instead of looking like fresh content. */
  .home-stand {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--soft);
    font-feature-settings: "tnum";
    margin: 0 0 1.2rem;
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .home-stand .stand-date { font-weight: 600; color: var(--muted-ink); }
  .home-stand.stale { color: var(--warn); }
  .home-stand.stale .stand-date { color: var(--warn); }
  .home-stand .stand-note { text-transform: none; letter-spacing: 0.02em; font-style: italic; }

  /* Newsprint column grid — the dashboard reads like one paper folded into
     seven adjacent columns. No card chrome: backgrounds, borders, shadows
     and radii are stripped. Adjacent columns are separated only by a
     hairline column rule, the same way the body-grid inside a newsletter
     uses column-rule between deep-dive sections. */
  /* Responsive column grid — caps at 3 wide so the columns stay readable
     on huge screens instead of shrinking to 5-6 narrow strips. The min
     width per column is the larger of 320 px (floor for readability) or
     1/3 of the container (so no more than 3 fit). Single declaration —
     no media or container queries needed.

     The column-rule + row-rule logic uses container queries against .home
     so the layout responds to actual available width (which changes with
     sidebar collapsed/expanded), not viewport. */
  .tldr-grid {
    display: grid;
    grid-template-columns:
      repeat(auto-fit, minmax(min(100%, max(320px, calc((100% - 2px) / 3))), 1fr));
    gap: 0;
    margin-top: 0.5rem;
  }
  .tldr-card {
    background: transparent;
    border: none;
    border-radius: 0;
    padding: var(--space-2) var(--space-4) var(--space-5);
    box-shadow: none;
    cursor: pointer;
    transition: background 150ms;
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    border-left: 1px solid var(--rule);
  }

  /* Grouped layout: a full-width header band (Wirtschaft / IT / Sport / …)
     precedes each group's cards. The header spans every grid column so the
     column flow restarts beneath it — each group reads as its own newsprint
     block, matching the sidebar's grouping. */
  .tldr-group-head {
    grid-column: 1 / -1;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    font-weight: 600;
    color: var(--soft);
    margin: var(--space-5) 0 0;
    padding: var(--space-3) 0 var(--space-2);
    border-top: 1px solid var(--rule);
  }
  /* The first group header sits right under the "Stand:" line — no big top gap
     or top rule, so the grid doesn't open with a stray divider. */
  .tldr-group-head:first-child { margin-top: 0; border-top: none; padding-top: 0; }

  /* The leading card of each group clears its left column rule so the group's
     first column starts clean (JS marks it; nth-child can't track per-group
     position once headers are interspersed). */
  .tldr-card.group-first { border-left: none; padding-left: 0; }

  /* Single-column band (narrow): no column rules at all; cards in the same
     group separate by a dashed row rule. The group header already divides
     groups, so only same-group siblings (a card directly after another card)
     get the dashed top. */
  @container home (max-width: 639px) {
    .tldr-card { border-left: none; padding-left: 0; }
    .tldr-card + .tldr-card {
      margin-top: var(--space-3);
      padding-top: var(--space-5);
      border-top: 1px dashed var(--rule);
    }
  }
  /* Subtle tinted-paper feedback on hover — no transform, no shadow swap,
     so adjacent columns never visually shift. */
  .tldr-card:hover {
    background: color-mix(in srgb, var(--cat-accent) 4%, transparent);
  }
  .tldr-card:focus-visible {
    outline: 2px solid var(--cat-accent, var(--fg));
    outline-offset: 4px;
  }
  .crumb:focus-visible {
    outline: 2px solid var(--fg);
    outline-offset: 2px;
    border-radius: var(--radius-inline);
  }

  /* Kicker line — same mono-caps treatment as the newsletter masthead-issue.
     Icon left, date right, category name in the middle. */
  .tldr-card-head {
    display: flex; align-items: center; gap: var(--space-2);
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.68rem;
    color: var(--muted-ink);
    border-bottom: none;
    padding-bottom: 0;
    margin-bottom: 0;
  }
  .tldr-card-head .tile-icon {
    font-size: 1rem;
    letter-spacing: normal;
    text-transform: none;
  }
  .tldr-card-head .tile-name {
    font-family: inherit;
    font-variation-settings: normal;
    font-weight: 600;
    font-size: inherit;
    color: var(--cat-accent-text, var(--fg));
    flex: 1;
  }
  .tldr-card-head .tile-date {
    font-family: inherit;
    font-size: inherit;
    color: var(--muted-ink);
    font-weight: 500;
    font-feature-settings: "tnum";
    letter-spacing: 0.1em;
  }

  /* Section title — the actual newsletter headline, rendered as a section
     dek in Fraunces with the same accent-bar treatment as .col h2 inside
     a newsletter. Acts as the "front-page headline" for that category. */
  .tldr-card-headline {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 36, "SOFT" 60;
    font-size: 1.18rem;
    font-weight: 600;
    font-style: normal;
    line-height: 1.18;
    color: var(--fg);
    margin: var(--space-2) 0 var(--space-3);
    letter-spacing: -0.005em;
  }
  .tldr-card-headline::before {
    content: "";
    display: block;
    width: 2rem;
    height: 2px;
    background: var(--cat-accent);
    margin-bottom: var(--space-2);
  }

  /* Strip the embedded TL;DR section's own chrome — it inherits the column
     instead. The lead keeps its drop-cap treatment but at a smaller scale
     suited to the narrower column width. */
  .tldr-card-body .tldr {
    background: transparent; border: none; padding: 0; margin: 0; border-radius: 0;
    display: block;       /* override the .tldr:has(.lead) grid from styles.css */
    column-gap: 0;
  }
  .tldr-card-body .tldr > .lead {
    font-family: var(--font-body);
    font-size: 0.92rem;
    line-height: 1.5;
    color: var(--fg);
    margin: 0 0 var(--space-3);
    max-width: none;
  }
  .tldr-card-body .tldr > .lead::first-letter {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 144, "SOFT" 100;
    font-size: 2.7rem;
    float: left;
    line-height: 0.85;
    padding: 0.25rem 0.45rem 0 0;
    color: var(--cat-accent);
    font-weight: 700;
  }
  .tldr-card-body .tldr ul {
    padding-left: 1rem;
    margin: 0;
    column-count: 1;       /* override 2-col bullet layout in narrow card */
  }
  .tldr-card-body .tldr li { font-size: 0.86rem; margin: 0.4rem 0; line-height: 1.5; }
  .tldr-card-body strong { color: var(--fg); font-weight: 700; }
  .tldr-card-body em { color: var(--muted-ink); font-style: italic; }
  .tldr-card-body a { color: inherit; text-decoration: underline; }
  /* Chips inside TL;DR bullets — tinted by the card's accent. */
  .tldr-card-body .chip {
    display: inline-block;
    font-family: var(--font-mono);
    background: color-mix(in srgb, var(--cat-accent, var(--rule-soft)) 14%, transparent);
    color: var(--fg);
    font-size: 0.6rem; font-weight: 600; padding: 0.05rem 0.45rem;
    border-radius: var(--radius-inline); letter-spacing: 0.04em; margin-right: 0.2rem;
    text-transform: uppercase; vertical-align: middle;
  }
  /* Same two rules as .chip.hot/.chip.good in lib/styles.css — the dashboard does not
     load styles.css, so it restates them. Tokens, not the literals that were here
     (#b6402f / #3f7a4f: single hexes on a four-theme page, measuring 3.06–3.83:1).
     The tint is 10%, not the 18% it was: the ink sits on its OWN tint, which is a
     surface the design system never measured — at 18% the composite is 4.15:1 on
     warm and 4.23:1 on paper, under AA. Measured worst case at 10% is 4.66:1. */
  .tldr-card-body .chip.hot  { background: color-mix(in srgb, var(--warn) 10%, transparent); color: var(--warn); }
  .tldr-card-body .chip.good { background: color-mix(in srgb, var(--good) 10%, transparent); color: var(--good); }
  /* Suppress the external-link arrow inside TL;DR snippets — too noisy. */
  .tldr-card-body a[href^="http"]::after { content: none; }
  /* "+N weitere" overflow marker — the home snapshot caps the TL;DR at a few
     bullets (the full set is one click away). Reads as a muted continuation
     cue, list-style stripped so it doesn't get its own bullet dot. */
  .tldr-card-body .tldr li.tldr-more {
    list-style: none;
    margin-left: -1rem;
    color: var(--soft);
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    font-style: normal;
  }

  /* DE-fallback chip — shown in a card's kicker when the active language has
     no translation for this date and the card is showing the DE original.
     Understated outline so it informs without competing with the accent. */
  .tldr-card-head .fallback-flag {
    font-family: var(--font-mono);
    font-size: 0.58rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--soft);
    border: 1px solid var(--rule);
    border-radius: var(--radius-inline);
    padding: 0.02rem 0.3rem;
    text-transform: uppercase;
    flex: none;
  }

  .tldr-read {
    background: transparent; border: none; color: var(--fg);
    font-family: var(--font-mono);
    font-weight: 600; cursor: pointer;
    font-size: 0.78rem; text-align: left;
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 0.7rem 0.2rem 0.4rem 0; margin-top: auto;
    min-height: 2.25rem;
    border-radius: var(--radius-inline);
  }
  .tldr-read:focus-visible {
    outline: 2px solid var(--cat-accent);
    outline-offset: 2px;
  }
  .tldr-read:hover { text-decoration: underline; }
  .tldr-empty {
    font-family: var(--font-body);
    font-size: 0.88rem; color: var(--soft); font-style: italic; padding: 0.4rem 0;
  }

     so the category identity is preserved, but the body is muted, dashed,
     and self-evidently dormant. Not clickable. */
  .tldr-card--empty {
    cursor: default;
    background: color-mix(in srgb, var(--bg) 50%, var(--panel));
    box-shadow: none;
  }
  .tldr-card--empty:hover {
    transform: none;
    box-shadow: none;
  }
  .tldr-card--empty .tile-date {
    color: var(--rule);
  }
  .tldr-empty-block {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.5rem;
    padding: 1.2rem 0.4rem 0.8rem;

    border-bottom: 1px dashed var(--rule);
    margin: 0.4rem 0 0;
  }
  .tldr-empty-kicker {

    font-size: 0.7rem;
    color: var(--cat-accent, var(--muted-ink));
    font-weight: 600;

  .tldr-empty-msg {
    font-family: var(--font-body);
    font-size: 0.88rem;
    color: var(--muted-ink);
    line-height: 1.5;
    font-style: italic;
    margin: 0;
  }

  /* Per-category accents — each card scopes its own --cat-accent and
     --cat-accent-text so descendant rules (kicker tile-name, accent bar above
     the headline, drop cap, chips, CTA) all pick up the right colour. */
  .tldr-card[data-cat="economy"]        { --cat-accent: var(--c-economy);        --cat-accent-text: var(--c-economy-text); }
  .tldr-card[data-cat="software"]       { --cat-accent: var(--c-software);       --cat-accent-text: var(--c-software-text); }
  .tldr-card[data-cat="ai-dev"]         { --cat-accent: var(--c-ai-dev);         --cat-accent-text: var(--c-ai-dev-text); }

  /* Loading */
  .loading {

  /* Sidebar rows scope their own --cat-accent so the archive calendar's border,
     day rings and selected-day fill match the category colour. */
  .cat[data-cat="economy"]        { --cat-accent: var(--c-economy); }
  .cat[data-cat="software"]       { --cat-accent: var(--c-software); }

     panel. Black accent bar (the dashboard's "house" colour) + favicon-style
     M brand mark + label, styled like a terminal .dropdown-item row. */
  .home-btn {

  }

  }

  /* ────────────────────────────────────────────────────────────────────
     Mobile / narrow responsiveness — the nav-rail becomes an off-canvas
     drawer (the .app-shell collapses to a single main column), toggled by
     the floating .rail-fab. The header keeps brand + history controls.
     ──────────────────────────────────────────────────────────────────── */
  @media (max-width: 720px) {

    /* Single main column; the rail floats as an off-canvas drawer pinned
       under the header / above the footer, slid off to the right until opened. */
    .app-shell,
    .app-shell.rail-collapsed { grid-template-columns: 1fr; }
    .nav-rail {
      position: fixed;
      top: 3rem;
      right: 0;
      bottom: 2rem;
      width: min(80vw, 18rem);
      transform: translateX(100%);
      transition: transform 0.2s ease;
      z-index: 56;

    .app-shell.rail-collapsed .nav-rail-title,
    .app-shell.rail-collapsed .nav-label,
    .app-shell.rail-collapsed .cat-name,
    .app-shell.rail-collapsed .cat-latest,
    .app-shell.rail-collapsed .cat-toggle,
    .app-shell.rail-collapsed .cat-dates,

    .app-shell.rail-collapsed .nav-rail-head { justify-content: flex-start; padding: 0.4rem 0.85rem; }
    .app-shell.rail-collapsed .cat-head,

    .rail-fab { display: inline-flex; align-items: center; justify-content: center; }
  }

    header.app { padding: 0 0.6rem; }
    .header-brand .brand-word { font-size: 0.85rem; }

<!-- Terminal header bar (mirrors pagr): LEFT brand wordmark + cursor; RIGHT the
     nav-rail minimize toggle. The grouped category nav lives in the sticky right
     sidebar (.nav-rail). -->
<header class="app">

  </main>

  <!-- Sticky right sidebar: the relocated Übersicht control (#home-btn) and the
       grouped category nav (#nav-groups, populated by JS from NAV_GROUPS). Can be
       minimized to an icon-only strip; collapsed state persists in localStorage. -->
  <aside class="nav-rail" id="nav-rail" aria-label="Navigation">

      <span class="nav-rail-title">~/briefs</span>
    </div>
    <div class="nav-rail-body">
      <div class="home-btn active" id="home-btn" role="button" tabindex="0" title="Übersicht">
        <span class="cat-color"></span>

             browser tab and the home control read as the same "house" mark. -->
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">

           with its own .nav-label header (standalone groups render headerless). --></div>
    </div>
  </aside>
</div>

    </nav>
  </div>
</footer>

uz-Durchfahrten bei <strong>8 pro Tag</strong> statt 125–140, zugleich größter US-Lageraufbau seit Anfang 2023.</li>\n      <li><span class=\"chip\">KORB</span> <strong>DXY 99,97</strong> (13.08.) gegen 99,8754 am 12.08. — der Dollar wurde nach der zahmen Zahl <em>nicht</em> schwächer.</li>\n      <li><span class=\"chip\">BR</span> <strong>Fiskal-Zahlen besser geworden:</strong> Primärdefizit-Schätzung auf 52 Mrd. R$ gesenkt (24.07.). Der Markt handelt trotzdem die Wahl-Erwartung.</li>\n      <li><span class=\"chip\">PROGNOSE-TEST</span> Gestern hier: <strong>5,93–6,00, Punkt 5,96</strong>. Gekommen: <strong>5,9523</strong> — Spanne getroffen, Punkt 0,13 % zu hoch.</li>\n    </ul></div>",

        "en": "<div class=\"tldr\"><h2>The Essentials in 30 Seconds</h2>\n    <p class=\"lead\">US inflation came in tame yesterday, the bet on a Fed hike in September fell from roughly half to just over a third, and stocks rose from New York to Seoul. Exactly the setup where emerging-market currencies usually ride along. The real didn't — instead, the ECB fix caught up on the prior day's move and printed <strong>5.9523</strong>, the highest level since Jun 10. For Daniel's exchange, that's the best window of the month.</p>\n    <ul>\n      <li><span class=\"chip hot\">FX</span> <strong>ECB fix 5.9523</strong> (Aug 12) versus 5.8910 on Aug 11 — <strong>+1.04%</strong> in a single day, the highest fix since <strong>Jun 10, 2026</strong> and a 30-day high.</li>\n      <li><span class=\"chip\">CHECK</span> <strong>Cross rate checks out:</strong> USD/BRL 5.1557 × EUR/USD 1.1545 = <strong>5.9523</strong>, <strong>0.001%</strong> off. The anchors line up.</li>\n      <li><span class=\"chip hot\">BREAKDOWN</span> <strong>96% of the day's move is the real</strong>, 4% the euro: USD/BRL fix +1.00%, EUR/USD fix +0.04%. Not a dollar event.</li>\n      <li><span class=\"chip\">USA</span> <strong>July consumer prices +0.1% for the month, 3.4% year over year</strong> (June: 3.5%); core +0.2% / 2.5%.</li>\n      <li><span class=\"chip good\">FED</span> <strong>September hold odds up to ~62%</strong> (11:32 a.m. New York time), hike bet down to <strong>33–38%</strong> from around 48% before the number.</li>\n      <li><span class=\"chip hot\">SPOT</span> <strong>5.9916</strong> at 02:15 BRT, <strong>0.66% above</strong> the fix — thinly traded with the Brazilian market closed.</li>\n      <li><span class=\"chip good\">EXCHANGE</span> <strong>R$595.23 per €100</strong> at the fix versus R$577.75 at the monthly low (Jul 23) — on €5,000, roughly <strong>R$874 more</strong>.</li>\n      <li><span class=\"chip\">OIL</span> <strong>Brent $88.91</strong> (+1.4%): Strait of Hormuz transits at <strong>8 per day</strong> instead of 125–140, alongside the largest US inventory build since early 2023.</li>\n      <li><span class=\"chip\">BASKET</span> <strong>DXY 99.97</strong> (Aug 13) versus 99.8754 on Aug 12 — the dollar did <em>not</em> weaken after the tame number.</li>\n      <li><span class=\"chip\">BR</span> <strong>Fiscal numbers improved:</strong> primary-deficit estimate cut to R$52 billion (Jul 24). The market is trading the election expectation anyway.</li>\n      <li><span class=\"chip\">FORECAST TEST</span> Yesterday here: <strong>5.93–6.00, point estimate 5.96</strong>. What came in: <strong>5.9523</strong> — range hit, point estimate 0.13% too high.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><h2>O essencial em 30 segundos</h2>\n    <p class=\"lead\">A inflação dos EUA saiu branda ontem, a aposta numa alta do Fed em setembro caiu de cerca da metade para pouco mais de um terço, e as ações subiram de Nova York a Seul. Exatamente a combinação em que as moedas emergentes costumam acompanhar. O real não acompanhou — o fixing do BCE, em vez disso, recuperou o movimento do dia anterior e marcou <strong>5,9523</strong>, o maior nível desde 10/06. Para a troca de Daniel, a melhor janela do mês.</p>\n    <ul>\n      <li><span class=\"chip hot\">FX</span> <strong>Fixing do BCE em 5,9523</strong> (12/08) contra 5,8910 em 11/08 — <strong>+1,04%</strong> num único dia, o maior fixing desde <strong>10/06/2026</strong> e máxima dos últimos 30 dias.</li>\n      <li><span class=\"chip\">VERIFICAÇÃO</span> <strong>Câmbio cruzado confere:</strong> USD/BRL 5,1557 × EUR/USD 1,1545 = <strong>5,9523</strong>, <strong>0,001%</strong> de diferença. As âncoras batem.</li>\n      <li><span class=\"chip hot\">DECOMPOSIÇÃO</span> <strong>96% do movimento do dia é o real</strong>, 4% o euro: fixing USD/BRL +1,00%, fixing EUR/USD +0,04%. Não foi um evento do dólar.</li>\n      <li><span class=\"chip\">EUA</span> <strong>Preços ao consumidor de julho em +0,1% no mês, 3,4% no ano</strong> (junho: 3,5%); núcleo +0,2% / 2,5%.</li>\n      <li><span class=\"chip good\">FED</span> <strong>Chance de manutenção em setembro sobe para ~62%</strong> (11h32, horário de Nova York), aposta de alta cai para <strong>33–38%</strong>, ante cerca de 48% antes do dado.</li>\n      <li><span class=\"chip hot\">SPOT</span> <strong>5,9916</strong> às 02h15, horário de Brasília, <strong>0,66% acima</strong> do fixing — negociação fraca com o mercado brasileiro fechado.</li>\n      <li><span class=\"chip good\">TROCA</span> <strong>R$ 595,23 a cada 100 €</strong> no fixing contra R$ 577,75 na mínima do mês (23/07) — em 5.000 €, cerca de <strong>R$ 874 a mais</strong>.</li>\n      <li><span class=\"chip\">PETRÓLEO</span> <strong>Brent US$ 88,91</strong> (+1,4%): travessias no Estreito de Ormuz em <strong>8 por dia</strong> em vez de 125–140, junto com o maior aumento de estoques dos EUA desde o início de 2023.</li>\n      <li><span class=\"chip\">CESTA</span> <strong>DXY em 99,97</strong> (13/08) contra 99,8754 em 12/08 — o dólar <em>não</em> ficou mais fraco depois do dado brando.</li>\n      <li><span class=\"chip\">BR</span> <strong>Dados fiscais melhoraram:</strong> estimativa de déficit primário reduzida para R$ 52 bilhões (24/07). Ainda assim, o mercado negocia a expectativa eleitoral.</li>\n      <li><span class=\"chip\">TESTE DE PREVISÃO</span> Ontem aqui: <strong>5,93–6,00, ponto central 5,96</strong>. Veio <strong>5,9523</strong> — faixa acertada, ponto central 0,13% alto demais.</li>\n    </ul></div>",

nimo del mes (23/07) — en 5.000 €, unos <strong>R$874 más</strong>.</li>\n      <li><span class=\"chip\">PETRÓLEO</span> <strong>Brent US$88,91</strong> (+1,4%): tránsitos por el Estrecho de Ormuz en <strong>8 por día</strong> en vez de 125–140, junto con el mayor aumento de inventarios de EE. UU. desde inicios de 2023.</li>\n      <li><span class=\"chip\">CANASTA</span> <strong>DXY en 99,97</strong> (13/08) contra 99,8754 el 12/08 — el dólar <em>no</em> se debilitó después del dato moderado.</li>\n      <li><span class=\"chip\">BR</span> <strong>Los datos fiscales mejoraron:</strong> la estimación del déficit primario se redujo a R$52 mil millones (24/07). Aun así, el mercado sigue negociando la expectativa electoral.</li>\n      <li><span class=\"chip\">PRUEBA DE PRONÓSTICO</span> Ayer aquí: <strong>5,93–6,00, punto central 5,96</strong>. Llegó a <strong>5,9523</strong> — rango acertado, punto central 0,13% demasiado alto.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Der große Patchday liegt zwei Tage zurück und war fast ausschließlich Windows (je nach Zähler <strong>400 bis 421</strong> Lücken — die Spanne haben wir gestern auseinandergenommen). Angegriffen wird gerade alles andere: eine <strong>Cisco-Firewall</strong>, deren US-Bundesfrist morgen abläuft; ein <strong>Metabase</strong> mit glatter <strong>10,0</strong>; die <strong>WordPress-Loginseite</strong>; der Vertrauensanker in fast jeder AMD- und Intel-CPU. Dazwischen zwei leise Meldungen, die mehr Arbeit machen als die lauten: Python 3.15 geht in den Release-Candidate, und die CRA-Frist, die überall als „30. August\" herumgereicht wird, ist gar keine Produktfrist.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>Cisco ASA/FTD</strong>: <strong>CVE-2026-20349</strong> (CVSS 8,6) — unauthentifizierte HTTP-Anfragen an den Remote-Access-SSL-VPN lassen die Appliance im Dauer-Reboot hängen. Aktiv ausgenutzt, seit 11.08. im KEV-Katalog, US-Bundesfrist <strong>14.08.</strong> <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Metabase</strong>: <strong>CVE-2026-72898</strong> — glatte <strong>10,0</strong>, unauthentifizierte SQL-Injection über <code>/reset_password</code>, Ergebnis ist ein Admin-Konto auf der Instanz. Ebenfalls neu im KEV. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Web</span> <strong>WordPress „XSS2Shell\"</strong>: <strong>CVE-2026-64638</strong> im Kern-HTML-Filter, Angriff über die Loginseite, Fix in <strong>7.0.3</strong>. Ausnutzung laut kanadischem Cyber-Zentrum bereits beobachtet. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Infra</span> <strong>fTPM 2.0 kaputt</strong>: <strong>CVE-2026-6726</strong> (8,5) und <strong>CVE-2026-6727</strong> (8,3) im Referenzcode der Trusted Computing Group — betroffen sind alle AMD-Zen-CPUs und Intel bis Core Ultra 200. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">Release</span> <strong>Python 3.15.0rc1</strong> (04.08.): Lazy Imports (PEP 810), <code>frozendict</code> (PEP 814), JIT <strong>+8–9 %</strong> auf x86-64-Linux. rc2 am 01.09., final am <strong>01.10.</strong> <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Regulierung</span> <strong>CRA-Realitätscheck</strong>: Der kursierende 30.08.2026 ist eine <em>Normungsfrist</em> für CEN/CENELEC, kein Produkttermin — und der Kommissionsentwurf schiebt sie auf den 31.10. Bindend sind <strong>11.09.2026</strong> (Meldepflichten) und 11.12.2027. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>BSI-Warnung Pixel</strong>: <strong>CVE-2026-0163</strong> im VPU-Treiber erlaubt Rechteausweitung aus der Ferne; Googles August-Update ist seit dem 04.08. draußen. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>npm-Wurm, Nachtrag</strong>: C2-Adressen kommen aus einem <strong>Ethereum-Smart-Contract</strong>, die Ziel-Muster für Zugangsdaten wurden um rund <strong>70 %</strong> erweitert — inklusive Credential-Stores von Coding-Agenten. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>Kernel</strong>: Mainline steht unverändert bei <strong>7.2-rc7</strong> (09.08.). Am Sonntag fällt der Schnitt — 7.2 final oder rc8. <span class=\"chip\">Global</span></li>\n    </ul></div>",
      "latestTldrHtmlByLang": {
        "de": "<div class=\"tldr\"><p class=\"lead\">Der große Patchday liegt zwei Tage zurück und war fast ausschließlich Windows (je nach Zähler <strong>400 bis 421</strong> Lücken — die Spanne haben wir gestern auseinandergenommen). Angegriffen wird gerade alles andere: eine <strong>Cisco-Firewall</strong>, deren US-Bundesfrist morgen abläuft; ein <strong>Metabase</strong> mit glatter <strong>10,0</strong>; die <strong>WordPress-Loginseite</strong>; der Vertrauensanker in fast jeder AMD- und Intel-CPU. Dazwischen zwei leise Meldungen, die mehr Arbeit machen als die lauten: Python 3.15 geht in den Release-Candidate, und die CRA-Frist, die überall als „30. August\" herumgereicht wird, ist gar keine Produktfrist.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>Cisco ASA/FTD</strong>: <strong>CVE-2026-20349</strong> (CVSS 8,6) — unauthentifizierte HTTP-Anfragen an den Remote-Access-SSL-VPN lassen die Appliance im Dauer-Reboot hängen. Aktiv ausgenutzt, seit 11.08. im KEV-Katalog, US-Bundesfrist <strong>14.08.</strong> <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Metabase</strong>: <strong>CVE-2026-72898</strong> — glatte <strong>10,0</strong>, unauthentifizierte SQL-Injection über <code>/reset_password</code>, Ergebnis ist ein Admin-Konto auf der Instanz. Ebenfalls neu im KEV. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Web</span> <strong>WordPress „XSS2Shell\"</strong>: <strong>CVE-2026-64638</strong> im Kern-HTML-Filter, Angriff über die Loginseite, Fix in <strong>7.0.3</strong>. Ausnutzung laut kanadischem Cyber-Zentrum bereits beobachtet. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Infra</span> <strong>fTPM 2.0 kaputt</strong>: <strong>CVE-2026-6726</strong> (8,5) und <strong>CVE-2026-6727</strong> (8,3) im Referenzcode der Trusted Computing Group — betroffen sind alle AMD-Zen-CPUs und Intel bis Core Ultra 200. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">Release</span> <strong>Python 3.15.0rc1</strong> (04.08.): Lazy Imports (PEP 810), <code>frozendict</code> (PEP 814), JIT <strong>+8–9 %</strong> auf x86-64-Linux. rc2 am 01.09., final am <strong>01.10.</strong> <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Regulierung</span> <strong>CRA-Realitätscheck</strong>: Der kursierende 30.08.2026 ist eine <em>Normungsfrist</em> für CEN/CENELEC, kein Produkttermin — und der Kommissionsentwurf schiebt sie auf den 31.10. Bindend sind <strong>11.09.2026</strong> (Meldepflichten) und 11.12.2027. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>BSI-Warnung Pixel</strong>: <strong>CVE-2026-0163</strong> im VPU-Treiber erlaubt Rechteausweitung aus der Ferne; Googles August-Update ist seit dem 04.08. draußen. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>npm-Wurm, Nachtrag</strong>: C2-Adressen kommen aus einem <strong>Ethereum-Smart-Contract</strong>, die Ziel-Muster für Zugangsdaten wurden um rund <strong>70 %</strong> erweitert — inklusive Credential-Stores von Coding-Agenten. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>Kernel</strong>: Mainline steht unverändert bei <strong>7.2-rc7</strong> (09.08.). Am Sonntag fällt der Schnitt — 7.2 final oder rc8. <span class=\"chip\">Global</span></li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">The big Patch Tuesday was two days ago and was almost entirely Windows (400 to 421 flaws, depending on who's counting — we picked apart that range yesterday). What's under active attack right now is everything else: a Cisco firewall whose US federal deadline expires tomorrow; a Metabase flaw with a clean <strong>10.0</strong>; the WordPress login page; the trust anchor baked into nearly every AMD and Intel CPU. In between, two quiet stories that will end up costing more work than the loud ones: Python 3.15 enters release candidate, and the CRA deadline everyone's passing around as \"August 30\" isn't actually a product deadline at all.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>Cisco ASA/FTD</strong>: <strong>CVE-2026-20349</strong> (CVSS 8.6) — unauthenticated HTTP requests to the remote-access SSL VPN put the appliance into an endless reboot loop. Actively exploited, added to the KEV catalog on Aug 11, US federal deadline <strong>Aug 14</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Metabase</strong>: <strong>CVE-2026-72898</strong> — a clean <strong>10.0</strong>, unauthenticated SQL injection via <code>/reset_password</code>, resulting in an admin account on the instance. Also newly added to the KEV. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Web</span> <strong>WordPress \"XSS2Shell\"</strong>: <strong>CVE-2026-64638</strong> in the core HTML filter, attack via the login page, fixed in <strong>7.0.3</strong>. Exploitation already observed according to Canada's cyber center. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Infra</span> <strong>fTPM 2.0 broken</strong>: <strong>CVE-2026-6726</strong> (8.5) and <strong>CVE-2026-6727</strong> (8.3) in the Trusted Computing Group's reference code — affects all AMD Zen CPUs and Intel chips up through Core Ultra 200. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">Release</span> <strong>Python 3.15.0rc1</strong> (Aug 4): Lazy Imports (PEP 810), <code>frozendict</code> (PEP 814), JIT <strong>+8–9%</strong> on x86-64 Linux. rc2 on Sep 1, final on <strong>Oct 1</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Regulation</span> <strong>CRA reality check</strong>: The widely-circulated Aug 30, 2026 date is a <em>standardization deadline</em> for CEN/CENELEC, not a product deadline — and the Commission's draft pushes it to Oct 31. What's actually binding: <strong>Sep 11, 2026</strong> (reporting obligations) and Dec 11, 2027. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>German BSI Pixel warning</strong>: <strong>CVE-2026-0163</strong> in the VPU driver allows remote privilege escalation; Google's August update has been out since Aug 4. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>npm worm, update</strong>: C2 addresses come from an <strong>Ethereum smart contract</strong>, the credential-search patterns were expanded by roughly <strong>70%</strong> — including credential stores of coding agents. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>Kernel</strong>: Mainline still sits unchanged at <strong>7.2-rc7</strong> (Aug 9). The cut lands Sunday — 7.2 final or rc8. <span class=\"chip\">Global</span></li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">O grande dia de patches ficou há dois dias e foi quase inteiramente da Windows (de 400 a 421 falhas, dependendo de quem conta — detalhamos essa variação ontem). O que está sendo atacado agora é tudo o mais: um firewall da Cisco cujo prazo federal dos EUA vence amanhã; um Metabase com nota cheia de <strong>10,0</strong>; a página de login do WordPress; a âncora de confiança presente em quase todo processador AMD e Intel. No meio disso, duas notícias discretas que darão mais trabalho do que as barulhentas: o Python 3.15 entra em release candidate, e o prazo do CRA que circula por aí como \"30 de agosto\" não é, na verdade, um prazo para produtos.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>Cisco ASA/FTD</strong>: <strong>CVE-2026-20349</strong> (CVSS 8,6) — requisições HTTP não autenticadas ao VPN SSL de acesso remoto travam o appliance em reinicialização contínua. Exploração ativa, no catálogo KEV desde 11/08, prazo federal dos EUA em <strong>14/08</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Metabase</strong>: <strong>CVE-2026-72898</strong> — nota cheia de <strong>10,0</strong>, injeção SQL não autenticada via <code>/reset_password</code>, resultando em uma conta de administrador na instância. Também recém-adicionada ao KEV. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Web</span> <strong>WordPress \"XSS2Shell\"</strong>: <strong>CVE-2026-64638</strong> no filtro de HTML do núcleo, ataque via página de login, correção na versão <strong>7.0.3</strong>. Exploração já observada segundo o centro cibernético canadense. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Infra</span> <strong>fTPM 2.0 quebrado</strong>: <strong>CVE-2026-6726</strong> (8,5) e <strong>CVE-2026-6727</strong> (8,3) no código de referência do Trusted Computing Group — afetados são todos os processadores AMD Zen e Intel até o Core Ultra 200. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">Release</span> <strong>Python 3.15.0rc1</strong> (04/08): Lazy Imports (PEP 810), <code>frozendict</code> (PEP 814), JIT <strong>+8–9%</strong> no x86-64 Linux. rc2 em 01/09, versão final em <strong>01/10</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Regulação</span> <strong>CRA na prática</strong>: A data de 30/08/2026 que circula por aí é um <em>prazo de normalização</em> para o CEN/CENELEC, não um prazo para produtos — e a minuta da Comissão adia isso para 31/10. O que é vinculante de fato: <strong>11/09/2026</strong> (obrigações de reporte) e 11/12/2027. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Alerta do BSI alemão sobre o Pixel</strong>: <strong>CVE-2026-0163</strong> no driver de VPU permite escalonamento remoto de privilégios; a atualização de agosto do Google está disponível desde 04/08. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Worm do npm, atualização</strong>: os endereços de C2 vêm de um <strong>smart contract na Ethereum</strong>, os padrões de busca por credenciais foram ampliados em cerca de <strong>70%</strong> — incluindo armazenamentos de credenciais de agentes de código. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>Kernel</strong>: a mainline segue inalterada em <strong>7.2-rc7</strong> (09/08). O corte acontece no domingo — 7.2 final ou rc8. <span class=\"chip\">Global</span></li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">El gran martes de parches quedó hace dos días y fue casi exclusivamente de Windows (entre 400 y 421 fallas, según quién cuente — ayer desglosamos ese rango). Lo que está bajo ataque activo ahora es todo lo demás: un firewall de Cisco cuyo plazo federal en Estados Unidos vence mañana; un Metabase con un <strong>10,0</strong> perfecto; la página de inicio de sesión de WordPress; el ancla de confianza presente en casi todos los procesadores AMD e Intel. En medio, dos noticias discretas que darán más trabajo que las ruidosas: Python 3.15 entra en release candidate, y el plazo del CRA que circula por todas partes como \"30 de agosto\" en realidad no es un plazo para productos.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>Cisco ASA/FTD</strong>: <strong>CVE-2026-20349</strong> (CVSS 8,6) — solicitudes HTTP no autenticadas a la VPN SSL de acceso remoto dejan el equipo atrapado en un reinicio constante. Explotación activa, en el catálogo KEV desde el 11/08, plazo federal en Estados Unidos el <strong>14/08</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Metabase</strong>: <strong>CVE-2026-72898</strong> — un <strong>10,0</strong> perfecto, inyección SQL no autenticada a través de <code>/reset_password</code>, que da como resultado una cuenta de administrador en la instancia. También recién agregada al KEV. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Web</span> <strong>WordPress \"XSS2Shell\"</strong>: <strong>CVE-2026-64638</strong> en el filtro HTML del núcleo, ataque a través de la página de inicio de sesión, corregido en la versión <strong>7.0.3</strong>. Explotación ya observada según el centro cibernético canadiense. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Infra</span> <strong>fTPM 2.0 roto</strong>: <strong>CVE-2026-6726</strong> (8,5) y <strong>CVE-2026-6727</strong> (8,3) en el código de referencia del Trusted Computing Group — afectan a todos los procesadores AMD Zen e Intel hasta el Core Ultra 200. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">Release</span> <strong>Python 3.15.0rc1</strong> (04/08): Lazy Imports (PEP 810), <code>frozendict</code> (PEP 814), JIT <strong>+8–9%</strong> en x86-64 Linux. rc2 el 01/09, versión final el <strong>01/10</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Regulación</span> <strong>CRA, la verdad detrás del rumor</strong>: la fecha del 30/08/2026 que circula es un <em>plazo de normalización</em> para el CEN/CENELEC, no un plazo para productos — y el borrador de la Comisión lo pospone al 31/10. Lo que sí es vinculante: <strong>11/09/2026</strong> (obligaciones de reporte) y 11/12/2027. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Advertencia del BSI alemán sobre Pixel</strong>: <strong>CVE-2026-0163</strong> en el controlador de VPU permite escalamiento remoto de privilegios; la actualización de agosto de Google está disponible desde el 04/08. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Gusano de npm, actualización</strong>: las direcciones de C2 provienen de un <strong>smart contract en Ethereum</strong>, los patrones de búsqueda de credenciales se ampliaron cerca de <strong>70%</strong> — incluyendo almacenes de credenciales de agentes de código. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>Kernel</strong>: la mainline sigue sin cambios en <strong>7.2-rc7</strong> (09/08). El corte cae el domingo — 7.2 final o rc8. <span class=\"chip\">Global</span></li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Die frischen Meldungen von heute sind klein: eine neue OpenHands-Fassung, eine Claude-Code-Nummer weiter. Die eigentliche Nachricht der Woche liegt acht Tage zurück und wurde hier bisher nur als Preiszeile behandelt — <strong>Metas Muse Code</strong>. Wenn man sich ansieht, was das Ding baulich tut statt was es kostet, ist es der erste breit verfügbare Harness, der parallele Unteragenten nicht als Muster zum Nachbauen anbietet, sondern als eingebaute Funktion. Dazu ein Blick auf zwei Ranglisten, die diese Woche vor allem eines zeigen: dass sie als Auswahlkriterium fertig sind.</p>\n    <ul>\n      <li><span class=\"chip hot\">Tool</span> <strong>Muse Code startet Unteragenten in eigenen Arbeitsbäumen</strong> — Terminal-only, macOS und Linux, Beta seit <span class=\"stat\">05.08.</span> Darunter Muse Spark 1.2 mit 1 Mio. Token Kontext und parallelen Werkzeug-Aufrufen.</li>\n      <li><span class=\"chip hot\">Achtung</span> <strong>Der billige Tarif kostet Quelltext</strong>: <span class=\"stat\">0,10 $ / 0,20 $</span> statt 1,25 $ / 4,25 $ je Mio. Token — im Gegenzug trainiert Meta auf deinen Eingaben und den Antworten.</li>\n      <li><span class=\"chip\">Bench</span> <strong>SWE-Bench Verified: Spitzenfeld innerhalb eines Punktes</strong> — 96 % / 95,5 % / 95 % laut Aggregator-Stand vom 13.08. Anbieter-gemeldet, nicht unabhängig nachgerechnet; swebench.com selbst lädt seine Tabelle per JavaScript.</li>\n      <li><span class=\"chip\">Bench</span> <strong>LiveCodeBench hat zwei Erste</strong>: Gemini 3 Pro Preview mit 91,7 % (Stand 12.08.) gegen Qwen3.7 Max mit 91,6 % (Stand 11.08.). Ich kür keinen Sieger — das ist der Punkt.</li>\n      <li><span class=\"chip good\">Claude</span> <strong>Claude Code v2.1.229</strong> nimmt <code>--force</code>, <code>--amend</code> und <code>--no-verify</code> aus der Auto-Freigabe von <code>/commit-push-pr</code>. Kleine Zeile, große Wirkung — zwei Tage vor dem Auto-Modus.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>OpenHands v1.13.0 ist heute erschienen</strong>: Konversationsarchiv, Markdown-Vorschau, eine Anzeige für den verbrauchten Kontext.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Kimi K3 ist allgemein in GitHub Copilot</strong> (seit 06.08.) — ein Modell mit offenen Gewichten im Standardsortiment. Bei Business und Enterprise standardmäßig aus.</li>\n      <li><span class=\"chip\">MCP</span> <strong>Die Spec vom 28.07. macht MCP zustandslos</strong>. Codex CLI hat sein MCP-SDK auf 3.0.0 gehoben und unterstützt sie damit.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Kein Balkendiagramm heute</strong> — es gibt keinen Score, den ich an einer Primärquelle festmachen kann. Lieber eine Lücke.</li>\n    </ul></div>",
      "latestTldrHtmlByLang": {
        "de": "<div class=\"tldr\"><p class=\"lead\">Die frischen Meldungen von heute sind klein: eine neue OpenHands-Fassung, eine Claude-Code-Nummer weiter. Die eigentliche Nachricht der Woche liegt acht Tage zurück und wurde hier bisher nur als Preiszeile behandelt — <strong>Metas Muse Code</strong>. Wenn man sich ansieht, was das Ding baulich tut statt was es kostet, ist es der erste breit verfügbare Harness, der parallele Unteragenten nicht als Muster zum Nachbauen anbietet, sondern als eingebaute Funktion. Dazu ein Blick auf zwei Ranglisten, die diese Woche vor allem eines zeigen: dass sie als Auswahlkriterium fertig sind.</p>\n    <ul>\n      <li><span class=\"chip hot\">Tool</span> <strong>Muse Code startet Unteragenten in eigenen Arbeitsbäumen</strong> — Terminal-only, macOS und Linux, Beta seit <span class=\"stat\">05.08.</span> Darunter Muse Spark 1.2 mit 1 Mio. Token Kontext und parallelen Werkzeug-Aufrufen.</li>\n      <li><span class=\"chip hot\">Achtung</span> <strong>Der billige Tarif kostet Quelltext</strong>: <span class=\"stat\">0,10 $ / 0,20 $</span> statt 1,25 $ / 4,25 $ je Mio. Token — im Gegenzug trainiert Meta auf deinen Eingaben und den Antworten.</li>\n      <li><span class=\"chip\">Bench</span> <strong>SWE-Bench Verified: Spitzenfeld innerhalb eines Punktes</strong> — 96 % / 95,5 % / 95 % laut Aggregator-Stand vom 13.08. Anbieter-gemeldet, nicht unabhängig nachgerechnet; swebench.com selbst lädt seine Tabelle per JavaScript.</li>\n      <li><span class=\"chip\">Bench</span> <strong>LiveCodeBench hat zwei Erste</strong>: Gemini 3 Pro Preview mit 91,7 % (Stand 12.08.) gegen Qwen3.7 Max mit 91,6 % (Stand 11.08.). Ich kür keinen Sieger — das ist der Punkt.</li>\n      <li><span class=\"chip good\">Claude</span> <strong>Claude Code v2.1.229</strong> nimmt <code>--force</code>, <code>--amend</code> und <code>--no-verify</code> aus der Auto-Freigabe von <code>/commit-push-pr</code>. Kleine Zeile, große Wirkung — zwei Tage vor dem Auto-Modus.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>OpenHands v1.13.0 ist heute erschienen</strong>: Konversationsarchiv, Markdown-Vorschau, eine Anzeige für den verbrauchten Kontext.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Kimi K3 ist allgemein in GitHub Copilot</strong> (seit 06.08.) — ein Modell mit offenen Gewichten im Standardsortiment. Bei Business und Enterprise standardmäßig aus.</li>\n      <li><span class=\"chip\">MCP</span> <strong>Die Spec vom 28.07. macht MCP zustandslos</strong>. Codex CLI hat sein MCP-SDK auf 3.0.0 gehoben und unterstützt sie damit.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Kein Balkendiagramm heute</strong> — es gibt keinen Score, den ich an einer Primärquelle festmachen kann. Lieber eine Lücke.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Today's fresh news is small: a new OpenHands release, one more Claude Code version number. The real story of the week happened eight days ago, and until now we'd only covered it as a pricing line — <strong>Meta's Muse Code</strong>. Look at what the thing actually does architecturally instead of what it costs, and it's the first widely available harness that offers parallel sub-agents not as a pattern you build yourself, but as a built-in feature. Plus a look at two leaderboards that this week mostly prove one thing: they're done as a selection criterion.</p>\n    <ul>\n      <li><span class=\"chip hot\">Tool</span> <strong>Muse Code launches sub-agents in their own worktrees</strong> — terminal-only, macOS and Linux, in beta since <span class=\"stat\">Aug 5</span>. Underneath: Muse Spark 1.2 with a 1M-token context and parallel tool calls.</li>\n      <li><span class=\"chip hot\">Heads up</span> <strong>The cheap tier costs you source code</strong>: <span class=\"stat\">$0.10 / $0.20</span> instead of $1.25 / $4.25 per million tokens — in exchange, Meta trains on your inputs and its responses.</li>\n      <li><span class=\"chip\">Bench</span> <strong>SWE-Bench Verified: the top field within a single point</strong> — 96% / 95.5% / 95% per an aggregator's Aug 13 snapshot. Vendor-reported, not independently recomputed; swebench.com itself loads its table via JavaScript.</li>\n      <li><span class=\"chip\">Bench</span> <strong>LiveCodeBench has two winners</strong>: Gemini 3 Pro Preview at 91.7% (as of Aug 12) versus Qwen3.7 Max at 91.6% (as of Aug 11). I'm not crowning a winner — that's the point.</li>\n      <li><span class=\"chip good\">Claude</span> <strong>Claude Code v2.1.229</strong> pulls <code>--force</code>, <code>--amend</code>, and <code>--no-verify</code> out of <code>/commit-push-pr</code>'s auto-approval. Small line, big effect — two days before auto mode.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>OpenHands v1.13.0 shipped today</strong>: a conversation archive, Markdown preview, and a display for context used.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Kimi K3 is now generally available in GitHub Copilot</strong> (since Aug 6) — an open-weight model in the default lineup. Off by default for Business and Enterprise.</li>\n      <li><span class=\"chip\">MCP</span> <strong>The Jul 28 spec makes MCP stateless</strong>. Codex CLI bumped its MCP SDK to 3.0.0 and now supports it.</li>\n      <li><span class=\"chip\">Bench</span> <strong>No bar chart today</strong> — there's no score I can pin to a primary source. A gap beats a guess.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">As notícias frescas de hoje são pequenas: uma nova versão do OpenHands, mais um número de versão do Claude Code. A verdadeira notícia da semana aconteceu há oito dias, e até agora tratamos ela aqui só como linha de preço — o <strong>Muse Code, da Meta</strong>. Olhando para o que a coisa faz estruturalmente, em vez de quanto custa, é o primeiro harness amplamente disponível que oferece subagentes paralelos não como um padrão para você construir na mão, e sim como função embutida. Além disso, um olhar sobre dois rankings que, nesta semana, mostram sobretudo uma coisa: que já não servem mais como critério de escolha.</p>\n    <ul>\n      <li><span class=\"chip hot\">Tool</span> <strong>O Muse Code inicia subagentes em árvores de trabalho próprias</strong> — só terminal, macOS e Linux, em beta desde <span class=\"stat\">05/08</span>. Por baixo: o Muse Spark 1.2, com 1 milhão de tokens de contexto e chamadas de ferramentas paralelas.</li>\n      <li><span class=\"chip hot\">Atenção</span> <strong>A tarifa barata custa código-fonte</strong>: <span class=\"stat\">US$ 0,10 / US$ 0,20</span> em vez de US$ 1,25 / US$ 4,25 por milhão de tokens — em troca, a Meta treina com suas entradas e as respostas.</li>\n      <li><span class=\"chip\">Bench</span> <strong>SWE-Bench Verified: o pelotão de ponta dentro de um único ponto</strong> — 96% / 95,5% / 95% conforme um agregador, posição de 13/08. Reportado pelo fornecedor, não recalculado de forma independente; o próprio swebench.com carrega sua tabela via JavaScript.</li>\n      <li><span class=\"chip\">Bench</span> <strong>O LiveCodeBench tem dois primeiros lugares</strong>: Gemini 3 Pro Preview com 91,7% (posição de 12/08) contra Qwen3.7 Max com 91,6% (posição de 11/08). Eu não elejo um vencedor — esse é o ponto.</li>\n      <li><span class=\"chip good\">Claude</span> <strong>O Claude Code v2.1.229</strong> tira <code>--force</code>, <code>--amend</code> e <code>--no-verify</code> da liberação automática do <code>/commit-push-pr</code>. Linha pequena, efeito grande — dois dias antes do modo automático.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>O OpenHands v1.13.0 saiu hoje</strong>: arquivo de conversas, prévia de Markdown, um indicador de contexto consumido.</li>\n      <li><span class=\"chip\">Tool</span> <strong>O Kimi K3 está disponível de forma geral no GitHub Copilot</strong> (desde 06/08) — um modelo de pesos abertos no sortimento padrão. Desligado por padrão nas contas Business e Enterprise.</li>\n      <li><span class=\"chip\">MCP</span> <strong>A spec de 28/07 torna o MCP sem estado</strong>. O Codex CLI elevou seu SDK do MCP para 3.0.0 e agora dá suporte a ela.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Hoje sem gráfico de barras</strong> — não há nenhum escore que eu consiga vincular a uma fonte primária. Antes uma lacuna.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Las noticias frescas de hoy son pequeñas: una nueva versión de OpenHands, un número más en Claude Code. La verdadera noticia de la semana pasó hace ocho días, y hasta ahora aquí solo la tratamos como línea de precio — <strong>Muse Code, de Meta</strong>. Si te fijas en lo que la cosa hace estructuralmente en vez de en lo que cuesta, es el primer harness ampliamente disponible que ofrece subagentes paralelos no como un patrón para armar tú mismo, sino como función integrada. Además, un vistazo a dos tablas de clasificación que esta semana muestran sobre todo una cosa: que ya no sirven como criterio de selección.</p>\n    <ul>\n      <li><span class=\"chip hot\">Tool</span> <strong>Muse Code lanza subagentes en árboles de trabajo propios</strong> — solo terminal, macOS y Linux, en beta desde el <span class=\"stat\">05/08</span>. Por debajo: Muse Spark 1.2, con 1 millón de tokens de contexto y llamadas a herramientas en paralelo.</li>\n      <li><span class=\"chip hot\">Atención</span> <strong>La tarifa barata cuesta código fuente</strong>: <span class=\"stat\">$0,10 / $0,20</span> en lugar de $1,25 / $4,25 por millón de tokens — a cambio, Meta entrena con tus entradas y las respuestas.</li>\n      <li><span class=\"chip\">Bench</span> <strong>SWE-Bench Verified: el grupo de punta dentro de un solo punto</strong> — 96% / 95,5% / 95% según un agregador, corte del 13/08. Reportado por el proveedor, no recalculado de forma independiente; el propio swebench.com carga su tabla vía JavaScript.</li>\n      <li><span class=\"chip\">Bench</span> <strong>LiveCodeBench tiene dos primeros lugares</strong>: Gemini 3 Pro Preview con 91,7% (corte del 12/08) contra Qwen3.7 Max con 91,6% (corte del 11/08). No voy a nombrar un ganador — ese es el punto.</li>\n      <li><span class=\"chip good\">Claude</span> <strong>Claude Code v2.1.229</strong> saca <code>--force</code>, <code>--amend</code> y <code>--no-verify</code> de la aprobación automática de <code>/commit-push-pr</code>. Línea pequeña, efecto grande — dos días antes del modo automático.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>OpenHands v1.13.0 salió hoy</strong>: archivo de conversaciones, vista previa de Markdown, un indicador de contexto consumido.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Kimi K3 ya está disponible de forma general en GitHub Copilot</strong> (desde el 06/08) — un modelo de pesos abiertos en el catálogo estándar. Apagado por defecto en cuentas Business y Enterprise.</li>\n      <li><span class=\"chip\">MCP</span> <strong>La especificación del 28/07 vuelve al MCP sin estado</strong>. El Codex CLI subió su SDK de MCP a la versión 3.0.0 y ahora es compatible con ella.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Hoy sin gráfica de barras</strong> — no hay ningún puntaje que pueda vincular a una fuente primaria. Mejor un hueco.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Wer ein KI-Feature in Produktion hat, hat auch einen Notausgang eingeplant — und der heißt bei den meisten <em>„dann nehmen wir eben ein offenes Modell\"</em>. In der Nacht wurde dieser Notausgang zum ersten Mal öffentlich getestet, und er ist schmaler als gedacht: Alibaba hat die versprochenen offenen Gewichte zu <strong>Qwen3.8-Max</strong> geliefert, aber beschnitten — kein Bildverständnis, kürzerer Standard-Kontext, eigene Lizenz. Das steht nicht in einem Gerücht, sondern im Modellblatt bei Hugging Face: Alibaba selbst listet auf, was nur die kostenpflichtige Cloud-Version kann.<sup>[1]</sup> Zweite Geschichte, gegenteilige Richtung: eine F-16 unter KI-Steuerung — interessant nicht wegen des Kampfjets, sondern wegen eines Satzes über die Bauweise. Und in Kalifornien entscheidet heute ein Verfahrensschritt über rund 30 KI-Gesetzentwürfe, ohne dass jemand dagegen stimmen muss.</p>\n    <ul>\n      <li><span class=\"chip hot\">DEPLOY · CN</span> <strong>Offene Gewichte mit Sternchen:</strong> Das Modellblatt zu <strong>Qwen3.8-2.4T-A95B</strong> sagt es wörtlich — <em>„a text-only model\"</em>, <em>„Multimodal inputs are not supported\"</em>, Kontext <strong>262.144</strong> Token nativ statt der 1 Mio. der API. Die API-Variante habe <em>„more features, such as vision input &amp; non-thinking support, 1M context length by default, official built-in tools\"</em>.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">POSITION</span> <strong>Das ist keine Panne, das ist Produktpolitik</strong> — und im Forum genau so gelesen: <em>„removing vision is clearly a push for people to use their cloud endpoint so they can make money\"</em>.<sup>[3]</sup> Der Punkt für Daniel ist nicht die Empörung, sondern die Lehre: „offene Gewichte\" ist kein Merkmal des Produkts, sondern ein Hebel des Anbieters.</li>\n      <li><span class=\"chip\">EINORDNUNG</span> <strong>Selbst die volle Fassung wäre kein Ausweg:</strong> 2,4 Billionen Parameter gesamt, 95 Mrd. pro Token aktiv<sup>[1]</sup> — der Speicher richtet sich nach der ersten Zahl. Preislich: Alibabas Max-API kostet <strong>2,00 $</strong> / <strong>6,00 $</strong> je 1 Mio. Ein- bzw. Ausgabe-Token<sup>[2]</sup>, ein deutschgehosteter Endpunkt für ein großes offenes Qwen <strong>0,60 €</strong> / <strong>3,60 €</strong> — anderes Modell, also kein Tausch ohne Test.<sup>[15]</sup></li>\n      <li><span class=\"chip\">PUBLIC · US</span> <strong>KI fliegt F-16 — der wichtige Satz ist der langweilige:</strong> DARPA und US Air Force haben Flugsteuerung und Sensoren einer Standard-F-16 automatisiert, <em>„without changing the jet's core software\"</em>, mit Umschalter Mensch/KI <em>„with the flip of a switch\"</em>. Sechs Jets, Eglin AFB, KI-gesteuerte Flüge seit Juli 2026, Sicherheitspilot immer an Bord.<sup>[6][7]</sup></li>\n      <li><span class=\"chip hot\">POLICY · US</span> <strong>Heute in Kalifornien:</strong> Die Haushaltsausschüsse beider Kammern beginnen ihre <em>Suspense-File</em>-Abstimmungen — Entwürfe ohne Mehrheit sind für diese Sitzungsperiode tot.<sup>[8]</sup> Die kursierende Zahl von rund 30 KI-Entwürfen stammt aus einer Sekundärquelle, die sich nicht direkt öffnen ließ.<sup>[9]</sup></li>\n      <li><span class=\"chip\">REG · EU</span> <strong>Elf Tage Durchsetzung:</strong> Seit dem 02.08.2026 kann die Kommission GPAI-Pflichten tatsächlich ahnden — bis <strong>15 Mio. €</strong> oder <strong>3 %</strong> des Weltumsatzes, rückwirkend auf Verstöße seit dem 02.08.2025.<sup>[10]</sup> Illinois geht den anderen Weg: Pflicht-Audits durch Dritte ab 2028.<sup>[11]</sup></li>\n      <li><span class=\"chip good\">STUDY · DE</span> <strong>Die Basis, auf die das alles trifft:</strong> 51,2 % des deutschen Mittelstands nutzen oder testen KI, KI-Agenten haben sich auf 16,6 % fast verdoppelt — Befragung aber aus <strong>November 2025</strong>, Mitherausgeber ist ein KI-Anbieter.<sup>[12]</sup> Dagegen: 74 % planen agentische KI binnen zwei Jahren, 21 % haben ein reifes Governance-Modell dafür.<sup>[13]</sup></li>\n      <li><span class=\"chip good\">twiceD</span> Zwei Ideen genau aus diesen zwei Meldungen: der <strong>Modell-Exit</strong> als bezahlter Beweis statt als Absichtserklärung — und <strong>der Umschalter</strong>, die Mensch-Übergabe als nachweisbares Bauteil.</li>\n    </ul></div>",
