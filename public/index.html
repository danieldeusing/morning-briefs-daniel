<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daniels Morning Briefs</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="lib/tokens.css">
<script>
  // Pre-paint animation policy (mirrors the terminal core / pagr): an explicit
  // "off" in localStorage — or no pick while the OS prefers reduced motion —
  // marks html.anim-off so components.css kills keyframes (incl. the brand
  // cursor blink) with no flash. The footer anim toggle persists "on"/"off".
  (function () {
    let pref = null;
    try { pref = localStorage.getItem('anim'); } catch (_) {}
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (pref === 'off' || (pref === null && reduced)) {
      document.documentElement.classList.add('anim-off');
    }
  })();
  // Resolution-independent zoom (mirrors pagr): lay out at a 1920px reference, then
  // scale the whole view up on wider screens — a true zoom of everything, never below
  // 1×. Pre-paint to avoid a flash.
  (function () {
    var applyZoom = function () {
      document.documentElement.style.zoom = String(Math.max(1, window.innerWidth / 1920));
    };
    applyZoom();
    window.addEventListener('resize', applyZoom);
  })();
</script>
<style>
  /* Dashboard chrome styles. Design tokens (colours, shadow, typography vars)
     come from lib/tokens.css — keep them there so the dashboard and the
     newsletter content stay in sync. */
  * { box-sizing: border-box; }
  /* Lock the outer document — only inner scroll containers (the .home view
     and the iframe) handle scrolling. Without this, a tiny mismatch between
     header.app + .app-shell heights and 100vh adds a few pixels of overflow
     to <html>, producing a second outer scrollbar alongside the one inside
     .home. overflow: hidden on both html and body kills that outer track. */
  html, body {
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    height: 100%;
    overflow: hidden;
  }
  html { position: relative; }

  /* Paper-grain noise overlay — same texture as the newsletter pages.
     Imperceptible up close, breaks LCD flatness at distance. Disabled under
     reduced-motion / high-contrast preferences. */
  html::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image: none;
    opacity: 0.04;
    mix-blend-mode: multiply;
  }
  @media (prefers-reduced-motion: reduce), (prefers-contrast: more) {
    html::before { display: none; }
  }
  body > *, header.app { position: relative; z-index: 1; }
  body {
    font-family: var(--font-body);
    line-height: 1.5;
    font-size: 15px;
    font-feature-settings: "kern", "liga", "onum";
    -webkit-font-smoothing: antialiased;
  }

  /* Terminal header bar — mirrors the pagr/seedr chrome: a single row on a
     --card surface with a --border bottom rule. LEFT: the brand wordmark
     (mono + .glow) and a blinking .cursor-block. RIGHT: the nav-rail minimize
     toggle. */
  header.app {
    border-bottom: 1px solid var(--border);
    background: var(--card);
    font-family: var(--font-mono); /* chrome is terminal mono; the content stays serif */
    /* Lift the header above the content, which is also a positioned body child
       at z-index 1 and would otherwise paint over it. */
    z-index: 50;
    padding: 0 1rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    min-height: 3rem;
  }
  /* LEFT zone — brand only. */
  .header-left {
    display: flex;
    align-items: center;
    flex: none;
    min-width: 0;
  }
  .header-brand {
    display: inline-flex;
    align-items: center;
    flex: none;
    text-decoration: none;
    cursor: pointer;
  }
  .header-brand .brand-word {
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: -0.01em;
  }

  /* RIGHT zone — the nav-rail minimize toggle, pushed to the far right
     (the header has no center zone). */
  .header-right {
    flex: none;
    margin-left: auto;
    display: flex;
    align-items: center;
  }

  /* Layout: two columns — flexible main + a fixed-width nav-rail on the right.
     The fixed footer is 2rem tall, so the shell is the viewport minus the
     header (3rem) and the footer (2rem). When the rail is collapsed the
     --rail-w track narrows to the icon-only strip. */
  .app-shell {
    display: grid;
    grid-template-columns: minmax(0, 1fr) var(--rail-w, 16rem);
    height: calc(100vh - 3rem - 2rem);
    height: calc(100dvh - 3rem - 2rem);
  }
  .app-shell.rail-collapsed { --rail-w: 3rem; }

  /* The nav lives in the sticky right sidebar (.nav-rail). It holds the
     Übersicht control (#home-btn) and #nav-groups (the grouped category nav,
     populated by JS). */
  .nav-label {
    font-family: var(--font-mono);
    font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--muted-foreground); padding: 0.5rem 0.85rem 0.2rem; font-weight: 600;
  }
  #nav-groups { padding-bottom: 0.2rem; }

  .cat {
    margin: 0;
    border-radius: 0;
    overflow: hidden;
    border: 0;
  }
  .cat-head {
    display: flex; align-items: center; gap: 0.55rem;
    padding: 0.45rem 0.85rem;
    cursor: pointer;
    border-radius: 0;
    transition: background 120ms;
    min-height: 2.1rem;
  }
  .cat-head:hover { background: var(--muted); }
  .cat-head:hover .cat-name { color: var(--primary); }
  .cat.active .cat-head { background: var(--muted); }
  .cat.active .cat-name { color: var(--primary); }
  .cat-color { width: 6px; height: 18px; border-radius: 0; flex: none; }
  .cat-name {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 0.8rem;
    color: var(--foreground);
    transition: color 0.15s ease;
    flex: 1;
    /* Single-line; ellipsise rather than wrap to two lines. */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .cat-icon { font-size: 1.05rem; }
  .cat-latest {
    font-family: var(--font-mono);
    font-size: 0.68rem; color: var(--soft);
    font-feature-settings: "tnum"; font-weight: 500;
  }
  .cat-toggle {
    background: transparent; border: none;
    color: var(--soft); cursor: pointer;
    transition: transform 150ms ease, background 120ms, color 120ms;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    padding: 0.55rem 0.7rem;
    border-radius: var(--radius-inline);
    line-height: 1;
    min-height: 2.25rem; min-width: 2.25rem;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .cat-toggle:hover { background: var(--rule-soft); color: var(--fg); }
  .cat.open > .cat-head .cat-toggle { transform: rotate(90deg); }

  .cat-dates { display: none; padding: 0.15rem 0.7rem 0.4rem 1.45rem; }

  .cat.open .cat-dates { display: block; }
  /* The category dropdown holds only the archive month-picker: days with a
     brief are clickable (ringed in the category accent), the selected day is
     filled, hovering one previews its title. Border + marks use the
     per-category --cat-accent scoped on the .cat row. */
  .cat-cal {
    margin: 0.2rem 0;
    padding: 0.5rem;
    border: 1px solid var(--cat-accent);
    border-radius: 6px;
    background: var(--rule-soft);
  }
  .cal-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 0.45rem;
  }
  .cal-title {
    font-family: var(--font-mono); font-size: 0.74rem;
    font-weight: 600; color: var(--fg);
  }
  .cal-nav {
    width: 1.7rem; height: 1.7rem; line-height: 1;
    background: transparent; border: 1px solid var(--rule); border-radius: 4px;
    color: var(--muted-ink); font-size: 0.95rem; cursor: pointer;
    transition: color 120ms, border-color 120ms;
  }
  .cal-nav:hover:not(:disabled) { color: var(--fg); border-color: var(--soft); }
  .cal-nav:focus-visible { outline: 2px solid var(--cat-accent, var(--fg)); outline-offset: 2px; }
  .cal-nav:disabled { opacity: 0.3; cursor: default; }
  .cal-week, .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
  }
  .cal-week { margin-bottom: 3px; }
  .cal-week span {
    text-align: center; font-family: var(--font-mono);
    font-size: 0.58rem; color: var(--muted-ink);
  }
  .cal-day {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 0.7rem;
    border-radius: 4px; color: var(--soft);
    font-feature-settings: "tnum";
  }
  .cal-day.none { color: var(--rule); }
  .cal-day.blank { visibility: hidden; }
  .cal-day.has {
    color: var(--fg); font-weight: 600; cursor: pointer; text-decoration: none;
    background: var(--panel);
    box-shadow: inset 0 0 0 1px var(--cat-accent);
    transition: background 100ms, color 100ms;
  }
  .cal-day.has:hover, .cal-day.has:focus-visible,
  .cal-day.has.current {
    background: var(--cat-accent); color: #fff; outline: none;
  }
  .cal-preview {
    margin-top: 0.5rem; padding-top: 0.45rem;
    border-top: 1px solid var(--rule);
    font-family: var(--font-body); font-size: 0.72rem;
    color: var(--muted-ink); line-height: 1.35; min-height: 1.7rem;
  }
  /* ────────────────────────────────────────────────────────────────────
     Fixed footer status bar — mirrors the pagr/seedr StatusBar: a 2rem bar
     pinned to the viewport bottom on a --card surface with a --border top
     rule. LEFT: `[briefs] reader@briefs:~/path` status line. RIGHT: the
     relocated controls (theme menu, language menu) + an anim toggle.
     ──────────────────────────────────────────────────────────────────── */
  footer.status-bar {
    position: fixed;
    inset-inline: 0;
    bottom: 0;
    z-index: 60;
    height: 2rem;
    border-top: 1px solid var(--border);
    background: var(--card);
    font-family: var(--font-mono); /* chrome is terminal mono */
    font-size: 11px;
  }
  .status-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    height: 100%;
    padding: 0 0.85rem;
  }
  .status-path {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted-foreground);
  }
  .status-path .status-tag { color: var(--primary); }
  .status-path .status-loc { color: var(--foreground); }
  .status-controls {
    display: flex;
    align-items: center;
    gap: 1.1rem;
    flex: none;
  }
  .status-sep { height: 0.9rem; width: 1px; background: var(--border); flex: none; }

  /* Footer control buttons — flat, muted, warm to --primary on hover. No
     boxes, no shadows; terminal-plain. */
  .status-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: inherit;
    line-height: 1;
    color: var(--muted-foreground);
    text-decoration: none;
    background: none;
    border: 0;
    border-radius: 0;
    padding: 0;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .status-btn:hover { color: var(--primary); }

  /* Theme + language dropdowns reuse the core .dropdown / .dropdown-panel /
     .dropdown-item primitives. The summary mirrors .status-btn. */
  .status-controls .dropdown > summary { font: inherit; }
  /* Settings icons (.dd-dot theme indicator, .dd-flag language flags) come from
     the shared @danieldeusing/design components.css — no local copy here. */

  /* Anim toggle — `[x] anim` / `[ ] anim`, mirroring pagr's footer toggle. */
  .anim-toggle { white-space: nowrap; }
  .anim-toggle[aria-pressed="true"] .anim-box { color: var(--primary); }

  /* Language picker — the trigger anchors the upward dropdown menu. The menu
     reuses the core .dropdown-panel (absolute, opens above, right-aligned),
     toggled open/closed via the [hidden] attribute by the existing JS. */
  .lang-picker { position: relative; }
  .lang-caret { font-size: 0.6rem; margin-left: 0.1rem; }
  .lang-menu[hidden] { display: none; }
  .lang-option[aria-selected="true"] {
    color: var(--primary);
    text-shadow: 0 0 8px var(--glow);
  }

  .cat-empty {
    font-family: var(--font-mono);
    font-size: 0.7rem; color: var(--soft);
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 0.5rem 0.6rem;
  }

  /* Main area — full width, fills the shell (viewport minus header + footer). */
  .main {
    overflow: hidden;
    background: var(--bg);
    position: relative;
    height: 100%;
  }
  .iframe-host { width: 100%; height: 100%; border: none; background: var(--bg); }

  /* ────────────────────────────────────────────────────────────────────
     Sticky right sidebar (.nav-rail) — terminal mono, --card surface with a
     --border left rule, full shell height with its own scroll. Holds the
     Übersicht control + the grouped category nav. Collapses to a 3rem icon-
     only strip; the width animates via the grid track on .app-shell.
     ──────────────────────────────────────────────────────────────────── */
  .nav-rail {
    grid-column: 2;
    font-family: var(--font-mono);
    background: var(--card);
    border-left: 1px solid var(--border);
    height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 2;
  }
  .nav-rail-head {
    display: flex;
    align-items: center;
    min-height: 2.1rem;
    padding: 0.4rem 0.85rem;
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .nav-rail-title {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 600;
    color: var(--muted-foreground);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-rail-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0.3rem 0 0.4rem;
  }

  /* Minimize toggle — the `»`/`«` chevron in the header right zone. Flat, muted,
     warm to --primary on hover (terminal-plain, no box). */
  .rail-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    flex: none;
    background: none;
    border: 0;
    border-radius: 0;
    color: var(--muted-foreground);
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 1rem;
    line-height: 1;
    transition: color 0.15s ease;
  }
  .rail-toggle:hover { color: var(--primary); }
  /* Expanded → `»` (collapse-to-right); collapsed → `«` (re-open). The button's
     aria-expanded drives the glyph; JS rewrites the text content too as a fallback. */
  .rail-toggle[aria-expanded="false"] .rail-toggle-glyph::before { content: "«"; }
  .rail-toggle[aria-expanded="true"]  .rail-toggle-glyph::before { content: "»"; }
  .rail-toggle-glyph { font-size: 0; }
  .rail-toggle-glyph::before { font-size: 1rem; }

  /* Collapsed strip — keep only the per-category accent bar + icon, hide labels,
     calendars and the home wordmark. The 3rem track clips the rest. */
  .app-shell.rail-collapsed .nav-rail-title,
  .app-shell.rail-collapsed .nav-label,
  .app-shell.rail-collapsed .cat-name,
  .app-shell.rail-collapsed .cat-latest,
  .app-shell.rail-collapsed .cat-toggle,
  .app-shell.rail-collapsed .cat-dates,
  .app-shell.rail-collapsed .home-btn .nav-label-text,
  .app-shell.rail-collapsed .home-btn .brand-mark {
    display: none;
  }
  .app-shell.rail-collapsed .nav-rail-head { justify-content: center; padding: 0.4rem 0; }
  .app-shell.rail-collapsed .cat-head,
  .app-shell.rail-collapsed .home-btn {
    justify-content: center;
    padding-left: 0;
    padding-right: 0;
    gap: 0;
  }
  .app-shell.rail-collapsed .cat-color,
  .app-shell.rail-collapsed .home-btn .cat-color { margin-right: 0.4rem; }

  /* The width transition reads off the grid track; animate it. */
  .app-shell { transition: grid-template-columns 0.18s ease; }
  @media (prefers-reduced-motion: reduce) {
    .app-shell { transition: none; }
  }

  /* Mobile re-open button (a floating ☰); shown only when the rail is an
     off-canvas drawer (≤720px). Hidden on desktop. */
  .rail-fab {
    display: none;
    position: fixed;
    right: 0.75rem;
    bottom: 2.6rem;
    z-index: 55;
    width: 2.6rem;
    height: 2.6rem;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--foreground);
    font-family: var(--font-mono);
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow: 0 0 18px var(--glow-soft);
  }

  /* Home view */
  .home {
    display: none;
    padding: 1.5rem 1.8rem;
    overflow-y: auto; height: 100%;
    /* Container for the responsive .tldr-grid below — column-count tracks
       the actual available width, not the viewport (which changes with
       sidebar collapsed/expanded state). */
    container-type: inline-size;
    container-name: home;
  }
  .home.show { display: block; }
  .home h2 {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 48;
    font-size: 1.55rem; font-weight: 600;
    margin: 0 0 0.5rem; letter-spacing: -0.005em;
  }
  .home .lead { color: var(--muted-ink); margin-bottom: 1.4rem; font-family: var(--font-body); }

  /* Freshness line — "Stand: DD.MM.YYYY" from the manifest's `generated`
     date. Mono-caps to read as a dateline, not body copy. When the manifest
     wasn't rebuilt today (a silently-failed nightly task), .stale flips it to
     the warn accent and appends a hint, so a missed run is visible at a glance
     instead of looking like fresh content. */
  .home-stand {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--soft);
    font-feature-settings: "tnum";
    margin: 0 0 1.2rem;
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .home-stand .stand-date { font-weight: 600; color: var(--muted-ink); }
  .home-stand.stale { color: var(--warn); }
  .home-stand.stale .stand-date { color: var(--warn); }
  .home-stand .stand-note { text-transform: none; letter-spacing: 0.02em; font-style: italic; }

  /* Newsprint column grid — the dashboard reads like one paper folded into
     seven adjacent columns. No card chrome: backgrounds, borders, shadows
     and radii are stripped. Adjacent columns are separated only by a
     hairline column rule, the same way the body-grid inside a newsletter
     uses column-rule between deep-dive sections. */
  /* Responsive column grid — caps at 3 wide so the columns stay readable
     on huge screens instead of shrinking to 5-6 narrow strips. The min
     width per column is the larger of 320 px (floor for readability) or
     1/3 of the container (so no more than 3 fit). Single declaration —
     no media or container queries needed.

     The column-rule + row-rule logic uses container queries against .home
     so the layout responds to actual available width (which changes with
     sidebar collapsed/expanded), not viewport. */
  .tldr-grid {
    display: grid;
    grid-template-columns:
      repeat(auto-fit, minmax(min(100%, max(320px, calc((100% - 2px) / 3))), 1fr));
    gap: 0;
    margin-top: 0.5rem;
  }
  .tldr-card {
    background: transparent;
    border: none;
    border-radius: 0;
    padding: var(--space-2) var(--space-4) var(--space-5);
    box-shadow: none;
    cursor: pointer;
    transition: background 150ms;
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    border-left: 1px solid var(--rule);
  }

  /* Grouped layout: a full-width header band (Wirtschaft / IT / Sport / …)
     precedes each group's cards. The header spans every grid column so the
     column flow restarts beneath it — each group reads as its own newsprint
     block, matching the sidebar's grouping. */
  .tldr-group-head {
    grid-column: 1 / -1;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    font-weight: 600;
    color: var(--soft);
    margin: var(--space-5) 0 0;
    padding: var(--space-3) 0 var(--space-2);
    border-top: 1px solid var(--rule);
  }
  /* The first group header sits right under the "Stand:" line — no big top gap
     or top rule, so the grid doesn't open with a stray divider. */
  .tldr-group-head:first-child { margin-top: 0; border-top: none; padding-top: 0; }

  /* The leading card of each group clears its left column rule so the group's
     first column starts clean (JS marks it; nth-child can't track per-group
     position once headers are interspersed). */
  .tldr-card.group-first { border-left: none; padding-left: 0; }

  /* Single-column band (narrow): no column rules at all; cards in the same
     group separate by a dashed row rule. The group header already divides
     groups, so only same-group siblings (a card directly after another card)
     get the dashed top. */
  @container home (max-width: 639px) {
    .tldr-card { border-left: none; padding-left: 0; }
    .tldr-card + .tldr-card {
      margin-top: var(--space-3);
      padding-top: var(--space-5);
      border-top: 1px dashed var(--rule);
    }
  }
  /* Subtle tinted-paper feedback on hover — no transform, no shadow swap,
     so adjacent columns never visually shift. */
  .tldr-card:hover {
    background: color-mix(in srgb, var(--cat-accent) 4%, transparent);
  }
  .tldr-card:focus-visible {
    outline: 2px solid var(--cat-accent, var(--fg));
    outline-offset: 4px;
  }
  .crumb:focus-visible {
    outline: 2px solid var(--fg);
    outline-offset: 2px;
    border-radius: var(--radius-inline);
  }

  /* Kicker line — same mono-caps treatment as the newsletter masthead-issue.
     Icon left, date right, category name in the middle. */
  .tldr-card-head {
    display: flex; align-items: center; gap: var(--space-2);
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.68rem;
    color: var(--muted-ink);
    border-bottom: none;
    padding-bottom: 0;
    margin-bottom: 0;
  }
  .tldr-card-head .tile-icon {
    font-size: 1rem;
    letter-spacing: normal;
    text-transform: none;
  }
  .tldr-card-head .tile-name {
    font-family: inherit;
    font-variation-settings: normal;
    font-weight: 600;
    font-size: inherit;
    color: var(--cat-accent-text, var(--fg));
    flex: 1;
  }
  .tldr-card-head .tile-date {
    font-family: inherit;
    font-size: inherit;
    color: var(--muted-ink);
    font-weight: 500;
    font-feature-settings: "tnum";
    letter-spacing: 0.1em;
  }

  /* Section title — the actual newsletter headline, rendered as a section
     dek in Fraunces with the same accent-bar treatment as .col h2 inside
     a newsletter. Acts as the "front-page headline" for that category. */
  .tldr-card-headline {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 36, "SOFT" 60;
    font-size: 1.18rem;
    font-weight: 600;
    font-style: normal;
    line-height: 1.18;
    color: var(--fg);
    margin: var(--space-2) 0 var(--space-3);
    letter-spacing: -0.005em;
  }
  .tldr-card-headline::before {
    content: "";
    display: block;
    width: 2rem;
    height: 2px;
    background: var(--cat-accent);
    margin-bottom: var(--space-2);
  }

  /* Strip the embedded TL;DR section's own chrome — it inherits the column
     instead. The lead keeps its drop-cap treatment but at a smaller scale
     suited to the narrower column width. */
  .tldr-card-body .tldr {
    background: transparent; border: none; padding: 0; margin: 0; border-radius: 0;
    display: block;       /* override the .tldr:has(.lead) grid from styles.css */
    column-gap: 0;

  .tldr-card-body .tldr > .lead {
    font-family: var(--font-body);
    font-size: 0.92rem;
    line-height: 1.5;
    color: var(--fg);
    margin: 0 0 var(--space-3);
    max-width: none;

  .tldr-card-body .tldr > .lead::first-letter {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 144, "SOFT" 100;
    font-size: 2.7rem;
    float: left;
    line-height: 0.85;
    padding: 0.25rem 0.45rem 0 0;
    color: var(--cat-accent);
    font-weight: 700;
  }
  .tldr-card-body .tldr ul {
    padding-left: 1rem;
    margin: 0;
    column-count: 1;       /* override 2-col bullet layout in narrow card */
  }
  .tldr-card-body .tldr li { font-size: 0.86rem; margin: 0.4rem 0; line-height: 1.5; }
  .tldr-card-body strong { color: var(--fg); font-weight: 700; }
  .tldr-card-body em { color: var(--muted-ink); font-style: italic; }
  .tldr-card-body a { color: inherit; text-decoration: underline; }
  /* Chips inside TL;DR bullets — tinted by the card's accent. */
  .tldr-card-body .chip {
    display: inline-block;
    font-family: var(--font-mono);
    background: color-mix(in srgb, var(--cat-accent, var(--rule-soft)) 14%, transparent);
    color: var(--fg);
    font-size: 0.6rem; font-weight: 600; padding: 0.05rem 0.45rem;
    border-radius: var(--radius-inline); letter-spacing: 0.04em; margin-right: 0.2rem;
    text-transform: uppercase; vertical-align: middle;
  }
  .tldr-card-body .chip.hot  { background: rgba(182, 64, 47, 0.18); color: #b6402f; }
  .tldr-card-body .chip.good { background: rgba(63, 122, 79, 0.18); color: #3f7a4f; }

  .tldr-card-body a[href^="http"]::after { content: none; }
  /* "+N weitere" overflow marker — the home snapshot caps the TL;DR at a few
     bullets (the full set is one click away). Reads as a muted continuation
     cue, list-style stripped so it doesn't get its own bullet dot. */
  .tldr-card-body .tldr li.tldr-more {
    list-style: none;
    margin-left: -1rem;
    color: var(--soft);
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    font-style: normal;
  }

  /* DE-fallback chip — shown in a card's kicker when the active language has
     no translation for this date and the card is showing the DE original.
     Understated outline so it informs without competing with the accent. */
  .tldr-card-head .fallback-flag {
    font-family: var(--font-mono);
    font-size: 0.58rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--soft);
    border: 1px solid var(--rule);
    border-radius: var(--radius-inline);
    padding: 0.02rem 0.3rem;
    text-transform: uppercase;
    flex: none;
  }

  .tldr-read {
    background: transparent; border: none; color: var(--fg);
    font-family: var(--font-mono);
    font-weight: 600; cursor: pointer;
    font-size: 0.78rem; text-align: left;
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 0.7rem 0.2rem 0.4rem 0; margin-top: auto;
    min-height: 2.25rem;
    border-radius: var(--radius-inline);
  }
  .tldr-read:focus-visible {
    outline: 2px solid var(--cat-accent);
    outline-offset: 2px;
  }
  .tldr-read:hover { text-decoration: underline; }
  .tldr-empty {
    font-family: var(--font-body);
    font-size: 0.88rem; color: var(--soft); font-style: italic; padding: 0.4rem 0;
  }

  /* Empty-state card — "Heute kein Brief". Same per-category accent stripe
     so the category identity is preserved, but the body is muted, dashed,
     and self-evidently dormant. Not clickable. */
  .tldr-card--empty {
    cursor: default;
    background: color-mix(in srgb, var(--bg) 50%, var(--panel));
    box-shadow: none;
  }
  .tldr-card--empty:hover {
    transform: none;
    box-shadow: none;
  }
  .tldr-card--empty .tile-date {
    color: var(--rule);
  }
  .tldr-empty-block {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.5rem;
    padding: 1.2rem 0.4rem 0.8rem;
    border-top: 1px dashed var(--rule);
    border-bottom: 1px dashed var(--rule);
    margin: 0.4rem 0 0;
  }
  .tldr-empty-kicker {
    font-family: var(--font-mono);
    text-transform: uppercase;

    font-size: 0.7rem;

  .tldr-empty-msg {
    font-family: var(--font-body);

    color: var(--muted-ink);
    line-height: 1.5;
    font-style: italic;

  /* Per-category accents — each card scopes its own --cat-accent and
     --cat-accent-text so descendant rules (kicker tile-name, accent bar above
     the headline, drop cap, chips, CTA) all pick up the right colour. */
  .tldr-card[data-cat="economy"]        { --cat-accent: var(--c-economy);        --cat-accent-text: var(--c-economy-text); }
  .tldr-card[data-cat="software"]       { --cat-accent: var(--c-software);       --cat-accent-text: var(--c-software-text); }
  .tldr-card[data-cat="ai-dev"]         { --cat-accent: var(--c-ai-dev);         --cat-accent-text: var(--c-ai-dev-text); }

  .loading {

  }

  /* Sidebar rows scope their own --cat-accent so the archive calendar's border,
     day rings and selected-day fill match the category colour. */
  .cat[data-cat="economy"]        { --cat-accent: var(--c-economy); }
  .cat[data-cat="software"]       { --cat-accent: var(--c-software); }
  .cat[data-cat="ai-dev"]         { --cat-accent: var(--c-ai-dev); }
  .cat[data-cat="ai-usecases"]    { --cat-accent: var(--c-ai-usecases); }

  /* Home button — the "Übersicht" control at the top of the nav dropdown
     panel. Black accent bar (the dashboard's "house" colour) + favicon-style
     M brand mark + label, styled like a terminal .dropdown-item row. */
  .home-btn {

  .home-btn:hover { background: var(--muted); color: var(--primary); }
  .home-btn.active { background: var(--muted); color: var(--primary); }
  .home-btn .cat-color {
    width: 6px; height: 18px; border-radius: 0; flex: none;
    background: var(--foreground);
  }
  /* Brand mark = the favicon design at category-icon size. */
  .home-btn .brand-mark {
    width: 1.1rem;
    height: 1.1rem;
    flex: none;
  }
  .home-btn:focus-visible,

    outline-offset: -2px;
  }

  /* ────────────────────────────────────────────────────────────────────
     Mobile / narrow responsiveness — the nav-rail becomes an off-canvas
     drawer (the .app-shell collapses to a single main column), toggled by
     the floating .rail-fab. The header keeps brand + history controls.
     ──────────────────────────────────────────────────────────────────── */
  @media (max-width: 720px) {
    header.app { padding: 0 0.75rem; gap: 0.6rem; }

    .tldr-grid { grid-template-columns: 1fr; gap: 0.85rem; }
    .home h2 { font-size: 1.2rem; }
    .status-controls { gap: 0.9rem; }

    /* Single main column; the rail floats as an off-canvas drawer pinned
       under the header / above the footer, slid off to the right until opened. */
    .app-shell,
    .app-shell.rail-collapsed { grid-template-columns: 1fr; }
    .nav-rail {
      position: fixed;
      top: 3rem;
      right: 0;
      bottom: 2rem;
      width: min(80vw, 18rem);
      transform: translateX(100%);
      transition: transform 0.2s ease;
      z-index: 56;
      box-shadow: -8px 0 24px var(--glow-soft);
    }

    .app-shell.rail-collapsed .nav-rail-title,
    .app-shell.rail-collapsed .nav-label,
    .app-shell.rail-collapsed .cat-name,
    .app-shell.rail-collapsed .cat-latest,
    .app-shell.rail-collapsed .cat-toggle,
    .app-shell.rail-collapsed .cat-dates,
    .app-shell.rail-collapsed .home-btn .nav-label-text,
    .app-shell.rail-collapsed .home-btn .brand-mark { display: revert; }
    .app-shell.rail-collapsed .nav-rail-head { justify-content: flex-start; padding: 0.4rem 0.85rem; }
    .app-shell.rail-collapsed .cat-head,
    .app-shell.rail-collapsed .home-btn {
      justify-content: flex-start; padding-left: 0.85rem; padding-right: 0.85rem; gap: 0.55rem;
    }

    .rail-fab { display: inline-flex; align-items: center; justify-content: center; }
  }

    header.app { padding: 0 0.6rem; }
    .header-brand .brand-word { font-size: 0.85rem; }
    .home { padding: 0.85rem 0.85rem 1.2rem; }
    .tldr-card { padding: 0.8rem 0.9rem 0.7rem; }
    .tldr-card-body .tldr li { font-size: 0.8rem; }

<!-- Terminal header bar (mirrors pagr): LEFT brand wordmark + cursor; RIGHT the
     nav-rail minimize toggle. The grouped category nav lives in the sticky right
     sidebar (.nav-rail). -->
<header class="app">
  <div class="header-left">
    <a class="header-brand" id="brand-home" href="#home" title="Übersicht">
      <span class="glow brand-word">Daniels Morning Briefs</span>
      <span class="cursor-block" aria-hidden="true"></span>
    </a>
  </div>

  <div class="header-right">
    <button class="rail-toggle rail-toggle--header" id="rail-toggle" type="button"
            aria-controls="nav-rail" aria-expanded="true" aria-label="Navigation ein-/ausblenden"
            title="Navigation ein-/ausblenden">
      <span class="rail-toggle-glyph" aria-hidden="true">»</span>
    </button>
  </div>
</header>

<div class="app-shell">
  <main class="main">
    <div class="loading" id="loading">lädt…</div>

    </div>

    <iframe class="iframe-host" id="frame" style="display:none;" title="Newsletter"></iframe>
  </main>

  <!-- Sticky right sidebar: the relocated Übersicht control (#home-btn) and the
       grouped category nav (#nav-groups, populated by JS from NAV_GROUPS). Can be
       minimized to an icon-only strip; collapsed state persists in localStorage. -->
  <aside class="nav-rail" id="nav-rail" aria-label="Navigation">
    <div class="nav-rail-head">
      <span class="nav-rail-title">~/briefs</span>
    </div>
    <div class="nav-rail-body">
      <div class="home-btn active" id="home-btn" role="button" tabindex="0" title="Übersicht">
        <span class="cat-color"></span>
        <!-- Full favicon design inline: dark frame + cream page + red
             double-rule + serif M. Identical SVG to favicon.svg so the
             browser tab and the home control read as the same "house" mark. -->
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <rect width="64" height="64" rx="9" fill="#221a13"/>
          <rect x="2.5" y="2.5" width="59" height="59" rx="7" fill="#f1e7d3"/>

        <span class="nav-label-text">Übersicht</span>
      </div>
      <div id="nav-groups"><!-- populated by JS from NAV_GROUPS: grouped category
           nav (Wirtschaft / IT / jobs / Sport / Freizeit / Sprachen), each group
           with its own .nav-label header (standalone groups render headerless). --></div>
    </div>
  </aside>
</div>

<button class="rail-fab" id="rail-fab" type="button" aria-controls="nav-rail"
        aria-label="Navigation öffnen" title="Navigation">☰</button>

<!-- Fixed footer status bar: status path (left), relocated controls + anim
     toggle (right). Controls keep their original ids so the existing handlers
     (theme cycle, language switch) work unchanged. -->

        <span class="anim-box" aria-hidden="true">[x]</span>
        <span>anim</span>
      </button>
    </nav>
  </div>
</footer>

      "latestTldrHtml": "<div class=\"tldr\"><h2>Das Wichtigste in 30 Sekunden</h2>\n    <p class=\"lead\">Am Wochenende bewegt sich kein Kurs — heute geht es um zwei Dinge, die der Freitag verdeckt hat. Erstens: Der ECB-Fix wird gut sieben Stunden vor Brasiliens Börsenschluss abgegriffen. Rechnet man den echten Freitagsschluss durch, startet der Montag 0,2 bis 0,4 % <em>über</em> dem Fix — meine gestrige Montags-Prognose war damit zu tief. Die Spanne ist ein Quellenkonflikt: Zwei Häuser nennen für denselben Freitag zwei Schlusskurse, an einem Tag, an dem die B3 stundenlang gestört war. Zweitens: Während der Devisenmarkt den Real feierte, meldete das Finanzministerium ein Halbjahres-Primärdefizit von 92,2 Milliarden Real.</p>\n    <ul>\n      <li><span class=\"chip\">FX</span> <strong>EUR/BRL 5,8095</strong> (ECB-Fix, Fr 31.07.). Wochenende ohne Handel — dieser Wert gilt bis Montagvormittag.</li>\n      <li><span class=\"chip hot\">MECHANIK</span> <strong>Der Fix hinkt einen halben Tag hinterher</strong>: Für Brasiliens Freitagsschluss nennen zwei Quellen zwei Werte — 5,0686 (InfoMoney/Reuters) und 5,0793 USD/BRL (Rio Times). Daraus rechnet sich EUR/BRL auf <strong>5,821 bis 5,834</strong>, also 0,20 bis 0,41 % über dem Fix. Richtung eindeutig, Größe nicht.</li>\n      <li><span class=\"chip hot\">KORREKTUR</span> <strong>Gestern stand hier „der Real trug alles, −0,83 %\"</strong>. Präziser: Die Bewegung lief am <em>Donnerstagnachmittag</em>, nach dem Fix. Der Freitag selbst war real-negativ (je nach Quelle −0,13 % oder −0,40 % bis zum Schluss).</li>\n      <li><span class=\"chip hot\">BR</span> <strong>Primärdefizit 92,2 Mrd. R$ im ersten Halbjahr</strong>, allein 48,2 Mrd. R$ im Juni (Fazenda, veröffentlicht 31.07.). Zum Freitags-Fix sind das rund 15,9 Mrd. €.</li>\n      <li><span class=\"chip hot\">BR</span> <strong>Copom #280 tagt Di/Mi 04.–05.08.</strong>, Ansage Mittwochabend nach Börsenschluss. Selic 14,25 %, Focus-Median zum Jahresende 14,00 %.</li>\n      <li><span class=\"chip\">BR</span> <strong>Der BCB zog seine Dollar-Versicherung zurück — Stand Februar.</strong> Bloomberg Línea meldete am <strong>23.02.2026</strong>, der Swap-Bestand laufe auf unter 100 Mrd. $ zu, erstmals seit Mai 2022. Keine Freitagsnachricht: Ein neuerer datierter Stand dieser Kennzahl war heute nicht auffindbar.</li>\n      <li><span class=\"chip\">AKTIEN</span> <strong>Ibovespa +0,47 % auf 177.999 Punkte</strong> — fast vollständig getragen von einer einzigen Aktie: Santander Brasil +13,3 %, nachdem die spanische Mutter am Abend des 30.07. ein Umtauschangebot über bis zu <strong>11,17 Mrd. R$</strong> (15 % Aufschlag) für die restlichen rund 10 % angekündigt hatte. Kein Makro-Votum — und kein Zahlen-Erfolg: Das Quartalsergebnis lag <em>unter</em> den Erwartungen.</li>\n      <li><span class=\"chip\">DOLLAR</span> <strong>DXY rund 99,8–99,9</strong> (31.07.). Die Quellseite führt zwei Werte für denselben Tag — deshalb steht hier keine dritte Nachkommastelle.</li>\n      <li><span class=\"chip\">RISIKO</span> <strong>5-Jahres-CDS 125,90</strong> (Schluss 31.07.) — unverändert gelassen, drei Monate vor der Wahl.</li>\n      <li><span class=\"chip hot\">PROGNOSE</span> <strong>Für den Montag-Fix erwarte ich 5,80–5,89</strong>, am ehesten 5,84 (~26 %) — gegenüber gestern nach oben korrigiert, aber mit weniger Rückendeckung als gedacht: Der Quellenkonflikt beim Freitagsschluss halbiert im ungünstigen Fall die Nachholbewegung.</li>\n    </ul></div>",

        "en": "<div class=\"tldr\"><h2>The 30-second version</h2>\n    <p class=\"lead\">No rate moves on the weekend — today is about two things Friday obscured. First: the ECB fix is captured a good seven hours before Brazil's market close. Working through the actual Friday close, Monday starts 0.2 to 0.4% <em>above</em> the fix — which means my Monday forecast from yesterday was too low. That range is itself a source conflict: two outlets report two different closing levels for the same Friday, on a day B3 was disrupted for hours. Second: while the FX market was celebrating the real, the finance ministry reported a first-half primary deficit of R$92.2 billion.</p>\n    <ul>\n      <li><span class=\"chip\">FX</span> <strong>EUR/BRL 5.8095</strong> (ECB fix, Fri Jul 31). No trading over the weekend — this value holds until Monday morning.</li>\n      <li><span class=\"chip hot\">MECHANICS</span> <strong>The fix lags half a day behind</strong>: two sources give two different values for Brazil's Friday close — 5.0686 (InfoMoney/Reuters) and 5.0793 USD/BRL (Rio Times). That puts EUR/BRL at <strong>5.821 to 5.834</strong>, or 0.20 to 0.41% above the fix. Direction is clear, magnitude isn't.</li>\n      <li><span class=\"chip hot\">CORRECTION</span> <strong>Yesterday this space said \"the real carried it all, −0.83%.\"</strong> More precisely: the move happened <em>Thursday afternoon</em>, after the fix. Friday itself was real-negative (−0.13% or −0.40% by the close, depending on the source).</li>\n      <li><span class=\"chip hot\">BR</span> <strong>Primary deficit R$92.2 billion in the first half</strong>, R$48.2 billion in June alone (Fazenda, published Jul 31). At Friday's fix that's roughly €15.9 billion.</li>\n      <li><span class=\"chip hot\">BR</span> <strong>Copom #280 meets Tue/Wed Aug 4–5</strong>, announcement Wednesday evening after the market close. Selic 14.25%, Focus year-end median 14.00%.</li>\n      <li><span class=\"chip\">BR</span> <strong>The BCB pulled back its dollar insurance — as of February.</strong> Bloomberg Línea reported on <strong>Feb 23, 2026</strong> that the swap stock was heading below $100 billion, for the first time since May 2022. Not Friday news: a more recent dated reading of this figure wasn't findable today.</li>\n      <li><span class=\"chip\">STOCKS</span> <strong>Ibovespa +0.47% to 177,999 points</strong> — almost entirely carried by a single stock: Santander Brasil +13.3%, after the Spanish parent announced on the evening of Jul 30 an exchange offer worth up to <strong>R$11.17 billion</strong> (15% premium) for the remaining roughly 10%. Not a macro vote — and not an earnings win either: the quarterly result came in <em>below</em> expectations.</li>\n      <li><span class=\"chip\">DOLLAR</span> <strong>DXY around 99.8–99.9</strong> (Jul 31). The source page carries two values for the same day — so no third decimal appears here.</li>\n      <li><span class=\"chip\">RISK</span> <strong>5-year CDS 125.90</strong> (Jul 31 close) — left unchanged, three months before the election.</li>\n      <li><span class=\"chip hot\">FORECAST</span> <strong>For Monday's fix I expect 5.80–5.89</strong>, most likely 5.84 (~26%) — revised up from yesterday, but with less support than it looks: the source conflict over Friday's close could halve the catch-up move in the unfavorable case.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><h2>O essencial em 30 segundos</h2>\n    <p class=\"lead\">No fim de semana nenhuma cotação se mexe — hoje o boletim trata de duas coisas que a sexta-feira deixou encobertas. Primeiro: o fixing do BCE é capturado umas boas sete horas antes do fechamento do mercado brasileiro. Refazendo a conta com o fechamento real de sexta-feira, a segunda-feira começa 0,2 a 0,4 % <em>acima</em> do fixing — o que quer dizer que minha previsão de ontem para segunda-feira ficou baixa demais. Essa faixa é, em si, um conflito de fontes: duas casas informam dois fechamentos diferentes para a mesma sexta-feira, num dia em que a B3 ficou horas com problemas. Segundo: enquanto o mercado de câmbio comemorava o real, o Ministério da Fazenda anunciou um déficit primário de 92,2 bilhões de reais no primeiro semestre.</p>\n    <ul>\n      <li><span class=\"chip\">FX</span> <strong>EUR/BRL 5,8095</strong> (fixing do BCE, sex 31/07). Fim de semana sem negociação — esse valor vale até a manhã de segunda-feira.</li>\n      <li><span class=\"chip hot\">MECÂNICA</span> <strong>O fixing está meio dia atrasado</strong>: duas fontes trazem dois valores diferentes para o fechamento brasileiro de sexta-feira — 5,0686 (InfoMoney/Reuters) e 5,0793 USD/BRL (Rio Times). Daí resulta um EUR/BRL de <strong>5,821 a 5,834</strong>, ou seja, 0,20 a 0,41 % acima do fixing. A direção é clara, o tamanho não.</li>\n      <li><span class=\"chip hot\">CORREÇÃO</span> <strong>Ontem este espaço dizia: \"o real carregou tudo, −0,83 %\"</strong>. Mais precisamente: o movimento ocorreu na <em>tarde de quinta-feira</em>, depois do fixing. A sexta-feira em si foi negativa para o real (−0,13 % ou −0,40 % até o fechamento, dependendo da fonte).</li>\n      <li><span class=\"chip hot\">BR</span> <strong>Déficit primário de R$ 92,2 bilhões no primeiro semestre</strong>, sendo R$ 48,2 bilhões só em junho (Fazenda, divulgado em 31/07). Ao fixing de sexta-feira, isso equivale a cerca de € 15,9 bilhões.</li>\n      <li><span class=\"chip hot\">BR</span> <strong>Copom nº 280 se reúne ter/qua 04–05/08</strong>, anúncio na quarta à noite após o fechamento do mercado. Selic em 14,25 %, mediana Focus para o fim do ano em 14,00 %.</li>\n      <li><span class=\"chip\">BR</span> <strong>O BCB retirou seu seguro cambial — situação de fevereiro.</strong> A Bloomberg Línea informou em <strong>23/02/2026</strong> que o estoque de swaps caminhava para abaixo de US$ 100 bilhões, pela primeira vez desde maio de 2022. Não é notícia de sexta-feira: não foi possível encontrar hoje uma situação mais recente e datada desse indicador.</li>\n      <li><span class=\"chip\">AÇÕES</span> <strong>Ibovespa +0,47 %, a 177.999 pontos</strong> — sustentado quase inteiramente por uma única ação: Santander Brasil +13,3 %, depois que a controladora espanhola anunciou, na noite de 30/07, uma oferta de troca de até <strong>R$ 11,17 bilhões</strong> (ágio de 15 %) pelos cerca de 10 % restantes. Não é um voto macro — nem sucesso de balanço: o resultado trimestral ficou <em>abaixo</em> do esperado.</li>\n      <li><span class=\"chip\">DÓLAR</span> <strong>DXY em torno de 99,8–99,9</strong> (31/07). A página-fonte traz dois valores para o mesmo dia — por isso não há uma terceira casa decimal aqui.</li>\n      <li><span class=\"chip\">RISCO</span> <strong>CDS de 5 anos em 125,90</strong> (fechamento de 31/07) — mantido estável, a três meses da eleição.</li>\n      <li><span class=\"chip hot\">PREVISÃO</span> <strong>Para o fixing de segunda-feira, espero 5,80–5,89</strong>, mais provável 5,84 (~26 %) — revisado para cima em relação a ontem, mas com menos sustentação do que parece: o conflito de fontes sobre o fechamento de sexta-feira pode, no cenário desfavorável, reduzir à metade o movimento de recuperação.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><h2>Lo esencial en 30 segundos</h2>\n    <p class=\"lead\">Ningún tipo de cambio se mueve el fin de semana — hoy el boletín trata dos cosas que el viernes dejó veladas. Primero: el fixing del BCE se captura unas siete horas antes del cierre del mercado brasileño. Si se recalcula con el cierre real del viernes, el lunes arranca 0,2 a 0,4 % <em>por encima</em> del fixing — lo que significa que mi pronóstico de ayer para el lunes se quedó corto. Ese rango es, en sí mismo, un conflicto de fuentes: dos casas informan dos cierres distintos para el mismo viernes, un día en que la B3 tuvo horas de problemas técnicos. Segundo: mientras el mercado cambiario celebraba al real, el Ministerio de Hacienda anunció un déficit primario semestral de 92,2 mil millones de reales.</p>\n    <ul>\n      <li><span class=\"chip\">FX</span> <strong>EUR/BRL 5,8095</strong> (fixing del BCE, vie 31/07). Fin de semana sin operaciones — este valor sigue vigente hasta la mañana del lunes.</li>\n      <li><span class=\"chip hot\">MECÁNICA</span> <strong>El fixing va medio día atrasado</strong>: dos fuentes dan dos valores distintos para el cierre brasileño del viernes — 5,0686 (InfoMoney/Reuters) y 5,0793 USD/BRL (Rio Times). De ahí resulta un EUR/BRL de <strong>5,821 a 5,834</strong>, es decir, 0,20 a 0,41 % por encima del fixing. La dirección es clara, la magnitud no.</li>\n      <li><span class=\"chip hot\">CORRECCIÓN</span> <strong>Ayer aquí decía: \"el real cargó con todo, −0,83 %\"</strong>. Más precisamente: el movimiento ocurrió la <em>tarde del jueves</em>, después del fixing. El viernes en sí fue negativo para el real (−0,13 % o −0,40 % hasta el cierre, según la fuente).</li>\n      <li><span class=\"chip hot\">BR</span> <strong>Déficit primario de R$ 92,2 mil millones en el primer semestre</strong>, de los cuales R$ 48,2 mil millones solo en junio (Hacienda, publicado el 31/07). Al fixing del viernes, eso equivale a unos € 15,9 mil millones.</li>\n      <li><span class=\"chip hot\">BR</span> <strong>El Copom nº 280 se reúne mar/mié 04–05/08</strong>, anuncio el miércoles por la noche tras el cierre del mercado. Selic en 14,25 %, mediana Focus para fin de año en 14,00 %.</li>\n      <li><span class=\"chip\">BR</span> <strong>El BCB retiró su seguro cambiario — situación de febrero.</strong> Bloomberg Línea informó el <strong>23/02/2026</strong> que el stock de swaps iba camino a bajar de US$ 100 mil millones, por primera vez desde mayo de 2022. No es noticia del viernes: hoy no fue posible encontrar una lectura más reciente y fechada de este indicador.</li>\n      <li><span class=\"chip\">ACCIONES</span> <strong>Ibovespa +0,47 %, a 177.999 puntos</strong> — sostenido casi por completo por una sola acción: Santander Brasil +13,3 %, después de que la matriz española anunció, la noche del 30/07, una oferta de canje de hasta <strong>R$ 11,17 mil millones</strong> (prima de 15 %) por el 10 % restante. No es un voto macro — ni un éxito de resultados: el trimestre quedó <em>por debajo</em> de lo esperado.</li>\n      <li><span class=\"chip\">DÓLAR</span> <strong>DXY alrededor de 99,8–99,9</strong> (31/07). La página fuente muestra dos valores para el mismo día — por eso aquí no se cita una tercera cifra decimal.</li>\n      <li><span class=\"chip\">RIESGO</span> <strong>CDS a 5 años en 125,90</strong> (cierre del 31/07) — se mantuvo sin cambios, a tres meses de la elección.</li>\n      <li><span class=\"chip hot\">PRONÓSTICO</span> <strong>Para el fixing del lunes espero 5,80–5,89</strong>, lo más probable 5,84 (~26 %) — revisado al alza respecto a ayer, pero con menos respaldo del que parece: el conflicto de fuentes sobre el cierre del viernes podría, en el caso desfavorable, reducir a la mitad el movimiento de recuperación.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Heute, am <strong>02.08.2026</strong>, hätte der größte Teil des EU AI Act scharf geschaltet werden sollen. Passiert ist: nichts — der „Digital Omnibus\" hat den Termin am 27.07. um sechzehn Monate nach hinten geschoben. Fristen sind ohnehin das Motiv der Woche: eine verschwindet, eine dauerte genau <strong>drei Tage</strong> (so lange gab CISA den US-Behörden für einen aktiv ausgenutzten <strong>CVSS 10,0</strong> in Arista VeloCloud), eine beginnt in sechs Wochen. Die beiden Angriffe, die diese Woche wirklich Schaden angerichtet haben, hatten mit keiner davon zu tun.</p>\n    <ul>\n      <li><span class=\"chip\">Regulierung</span> <strong>AI Act verschoben</strong>: Digital Omnibus seit <strong>27.07.</strong> in Kraft — Anhang-III-Hochrisiko jetzt <strong>02.12.2027</strong>, eingebettete Anhang-I-Systeme <strong>02.08.2028</strong>. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Arista VeloCloud</strong>: CVE-2026-16812, OS-Command-Injection, <strong>CVSS 10,0</strong> in v3.1 <em>und</em> v4.0, aktiv ausgenutzt, KEV-Aufnahme 27.07. mit Drei-Tage-Frist. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Adform</strong>: vergiftetes Ad-Skript <code>trackpoint-async.js</code> tauschte BTC-/ETH-/TRON-Adressen in Zwischenablage und Formularfeldern aus. Entdeckt 27.07., öffentlich seit gestern. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Exchange OWA</strong>: CVE-2026-42897 (<strong>CVSS 8,1</strong>) — E-Mail anzeigen genügt. Russischer Akteur pflanzt seit 22.07. das JS-Implant „OWAReaper\" ins Postfach. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Browser</span> <strong>Chrome</strong>: <strong>1.442</strong> Sicherheitsfehler über 149/150/151 — mehr als in den 23 Releases davor zusammen. Darunter ein Sandbox-Ausbruch, der <strong>13 Jahre</strong> im Code stand. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Kubernetes</strong>: <code>vault-secrets-webhook</code> CVE-2026-54725, <strong>CVSS 9,6</strong> — der Webhook schickt das ServiceAccount-Token an eine fremde Vault-Adresse. Fix in <strong>1.23.1</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>B3</strong>: Brasiliens Börse startete Freitag fast <strong>drei Stunden</strong> zu spät — Ursache war eine verspätete Dateiübertragung an die Clearing-Kammer. <span class=\"chip\">BR</span></li>\n      <li><span class=\"chip\">Regulierung</span> <strong>Die andere Uhr läuft</strong>: CRA-Konformität für Typ-A-Produkte ab <strong>30.08.</strong>, Meldepflicht 24h/72h/14 Tage ab <strong>11.09.2026</strong>. Nicht verschoben. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>npm <code>@joyfill</code></strong>: zwei Beta-Pakete mit Socket.IO-Fernsteuerung samt Zwischenablage-Zugriff, gemeldet 29.07. Und: Revolut dementiert die kursierende 75-Mio.-Behauptung. <span class=\"chip\">Global</span></li>\n    </ul></div>",
      "latestTldrHtmlByLang": {
        "de": "<div class=\"tldr\"><p class=\"lead\">Heute, am <strong>02.08.2026</strong>, hätte der größte Teil des EU AI Act scharf geschaltet werden sollen. Passiert ist: nichts — der „Digital Omnibus\" hat den Termin am 27.07. um sechzehn Monate nach hinten geschoben. Fristen sind ohnehin das Motiv der Woche: eine verschwindet, eine dauerte genau <strong>drei Tage</strong> (so lange gab CISA den US-Behörden für einen aktiv ausgenutzten <strong>CVSS 10,0</strong> in Arista VeloCloud), eine beginnt in sechs Wochen. Die beiden Angriffe, die diese Woche wirklich Schaden angerichtet haben, hatten mit keiner davon zu tun.</p>\n    <ul>\n      <li><span class=\"chip\">Regulierung</span> <strong>AI Act verschoben</strong>: Digital Omnibus seit <strong>27.07.</strong> in Kraft — Anhang-III-Hochrisiko jetzt <strong>02.12.2027</strong>, eingebettete Anhang-I-Systeme <strong>02.08.2028</strong>. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Arista VeloCloud</strong>: CVE-2026-16812, OS-Command-Injection, <strong>CVSS 10,0</strong> in v3.1 <em>und</em> v4.0, aktiv ausgenutzt, KEV-Aufnahme 27.07. mit Drei-Tage-Frist. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Adform</strong>: vergiftetes Ad-Skript <code>trackpoint-async.js</code> tauschte BTC-/ETH-/TRON-Adressen in Zwischenablage und Formularfeldern aus. Entdeckt 27.07., öffentlich seit gestern. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Exchange OWA</strong>: CVE-2026-42897 (<strong>CVSS 8,1</strong>) — E-Mail anzeigen genügt. Russischer Akteur pflanzt seit 22.07. das JS-Implant „OWAReaper\" ins Postfach. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Browser</span> <strong>Chrome</strong>: <strong>1.442</strong> Sicherheitsfehler über 149/150/151 — mehr als in den 23 Releases davor zusammen. Darunter ein Sandbox-Ausbruch, der <strong>13 Jahre</strong> im Code stand. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Kubernetes</strong>: <code>vault-secrets-webhook</code> CVE-2026-54725, <strong>CVSS 9,6</strong> — der Webhook schickt das ServiceAccount-Token an eine fremde Vault-Adresse. Fix in <strong>1.23.1</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>B3</strong>: Brasiliens Börse startete Freitag fast <strong>drei Stunden</strong> zu spät — Ursache war eine verspätete Dateiübertragung an die Clearing-Kammer. <span class=\"chip\">BR</span></li>\n      <li><span class=\"chip\">Regulierung</span> <strong>Die andere Uhr läuft</strong>: CRA-Konformität für Typ-A-Produkte ab <strong>30.08.</strong>, Meldepflicht 24h/72h/14 Tage ab <strong>11.09.2026</strong>. Nicht verschoben. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>npm <code>@joyfill</code></strong>: zwei Beta-Pakete mit Socket.IO-Fernsteuerung samt Zwischenablage-Zugriff, gemeldet 29.07. Und: Revolut dementiert die kursierende 75-Mio.-Behauptung. <span class=\"chip\">Global</span></li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Today, <strong>2026-08-02</strong>, most of the EU AI Act was supposed to go into force. What happened: nothing — the \"Digital Omnibus\" pushed the deadline back sixteen months on Jul 27. Deadlines are the theme of the week regardless: one vanishes, one lasted exactly <strong>three days</strong> (that's how long CISA gave US federal agencies for an actively exploited <strong>CVSS 10.0</strong> in Arista VeloCloud), one starts in six weeks. The two attacks that actually did damage this week had nothing to do with any of them.</p>\n    <ul>\n      <li><span class=\"chip\">Regulation</span> <strong>AI Act postponed</strong>: Digital Omnibus in force since <strong>Jul 27</strong> — Annex III high-risk now <strong>2027-12-02</strong>, embedded Annex I systems <strong>2028-08-02</strong>. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Arista VeloCloud</strong>: CVE-2026-16812, OS command injection, <strong>CVSS 10.0</strong> in v3.1 <em>and</em> v4.0, actively exploited, KEV listing Jul 27 with a three-day deadline. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Adform</strong>: poisoned ad script <code>trackpoint-async.js</code> swapped BTC/ETH/TRON addresses in the clipboard and form fields. Discovered Jul 27, public since yesterday. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Exchange OWA</strong>: CVE-2026-42897 (<strong>CVSS 8.1</strong>) — just displaying the email is enough. A Russian actor has been planting the JS implant \"OWAReaper\" in mailboxes since Jul 22. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Browser</span> <strong>Chrome</strong>: <strong>1,442</strong> security bugs across 149/150/151 — more than the 23 releases before that combined. Among them a sandbox escape that sat in the code for <strong>13 years</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Kubernetes</strong>: <code>vault-secrets-webhook</code> CVE-2026-54725, <strong>CVSS 9.6</strong> — the webhook sends the ServiceAccount token to an attacker-controlled Vault address. Fixed in <strong>1.23.1</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>B3</strong>: Brazil's stock exchange opened almost <strong>three hours</strong> late on Friday — the cause was a delayed file transfer to the clearing house. <span class=\"chip\">BR</span></li>\n      <li><span class=\"chip\">Regulation</span> <strong>The other clock keeps running</strong>: CRA conformity for Type A products from <strong>Aug 30</strong>, reporting duty (24h/72h/14 days) from <strong>2026-09-11</strong>. Not postponed. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>npm <code>@joyfill</code></strong>: two beta packages with Socket.IO remote control including clipboard access, reported Jul 29. Also: Revolut denies the circulating 75-million claim. <span class=\"chip\">Global</span></li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Hoje, <strong>02/08/2026</strong>, a maior parte do AI Act da UE deveria ter entrado em vigor. O que aconteceu: nada — o \"Digital Omnibus\" empurrou o prazo em dezesseis meses, em 27/07. Prazos são o tema da semana de qualquer forma: um desaparece, um durou exatamente <strong>três dias</strong> (foi o tempo que a CISA deu às agências federais dos EUA para uma falha <strong>CVSS 10,0</strong> ativamente explorada na Arista VeloCloud), um começa em seis semanas. Os dois ataques que realmente causaram dano nesta semana não tinham relação com nenhum deles.</p>\n    <ul>\n      <li><span class=\"chip\">Regulação</span> <strong>AI Act adiado</strong>: Digital Omnibus em vigor desde <strong>27/07</strong> — Anexo III de alto risco agora em <strong>02/12/2027</strong>, sistemas do Anexo I embutidos em <strong>02/08/2028</strong>. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Arista VeloCloud</strong>: CVE-2026-16812, injeção de comando no SO, <strong>CVSS 10,0</strong> nas versões 3.1 <em>e</em> 4.0, explorada ativamente, entrada no KEV em 27/07 com prazo de três dias. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Adform</strong>: script de anúncio envenenado <code>trackpoint-async.js</code> trocava endereços de BTC/ETH/TRON na área de transferência e em campos de formulário. Descoberto em 27/07, público desde ontem. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Exchange OWA</strong>: CVE-2026-42897 (<strong>CVSS 8,1</strong>) — basta exibir o e-mail. Um agente russo vem plantando o implante em JavaScript \"OWAReaper\" nas caixas de entrada desde 22/07. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Browser</span> <strong>Chrome</strong>: <strong>1.442</strong> falhas de segurança nas versões 149/150/151 — mais do que nas 23 versões anteriores somadas. Entre elas, um escape de sandbox que ficou <strong>13 anos</strong> no código. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Kubernetes</strong>: <code>vault-secrets-webhook</code> CVE-2026-54725, <strong>CVSS 9,6</strong> — o webhook envia o token do ServiceAccount para um endereço do Vault controlado pelo atacante. Correção na <strong>1.23.1</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>B3</strong>: a bolsa brasileira abriu o pregão de sexta-feira quase <strong>três horas</strong> atrasada — a causa foi um atraso no envio de arquivos para a câmara de compensação. <span class=\"chip\">BR</span></li>\n      <li><span class=\"chip\">Regulação</span> <strong>O outro relógio continua correndo</strong>: conformidade do CRA para produtos Tipo A a partir de <strong>30/08</strong>, obrigação de notificação em 24h/72h/14 dias a partir de <strong>11/09/2026</strong>. Não foi adiado. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>npm <code>@joyfill</code></strong>: dois pacotes beta com controle remoto via Socket.IO, incluindo acesso à área de transferência, reportado em 29/07. E mais: a Revolut nega a alegação de 75 milhões que circula por aí. <span class=\"chip\">Global</span></li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Hoy, <strong>02/08/2026</strong>, debía entrar en vigor la mayor parte del AI Act de la UE. Lo que pasó: nada — el \"Digital Omnibus\" corrió la fecha dieciséis meses hacia adelante el 27/07. Los plazos son el tema de la semana de todos modos: uno desaparece, uno duró exactamente <strong>tres días</strong> (así de largo le dio la CISA a las agencias federales de EE. UU. para una falla <strong>CVSS 10,0</strong> explotada activamente en Arista VeloCloud), uno empieza en seis semanas. Los dos ataques que de verdad causaron daño esta semana no tuvieron nada que ver con ninguno de ellos.</p>\n    <ul>\n      <li><span class=\"chip\">Regulación</span> <strong>AI Act pospuesto</strong>: el Digital Omnibus está en vigor desde el <strong>27/07</strong> — el Anexo III de alto riesgo ahora es <strong>02/12/2027</strong>, los sistemas del Anexo I integrados <strong>02/08/2028</strong>. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Arista VeloCloud</strong>: CVE-2026-16812, inyección de comandos del sistema operativo, <strong>CVSS 10,0</strong> en v3.1 <em>y</em> v4.0, explotada activamente, entró al KEV el 27/07 con un plazo de tres días. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Adform</strong>: el script de anuncios envenenado <code>trackpoint-async.js</code> cambiaba direcciones de BTC/ETH/TRON en el portapapeles y en campos de formulario. Descubierto el 27/07, público desde ayer. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Exchange OWA</strong>: CVE-2026-42897 (<strong>CVSS 8,1</strong>) — basta con mostrar el correo. Un actor ruso viene plantando el implante en JavaScript \"OWAReaper\" en buzones desde el 22/07. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Browser</span> <strong>Chrome</strong>: <strong>1.442</strong> fallas de seguridad en las versiones 149/150/151 — más que en las 23 versiones anteriores juntas. Entre ellas, un escape de sandbox que llevaba <strong>13 años</strong> en el código. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Kubernetes</strong>: <code>vault-secrets-webhook</code> CVE-2026-54725, <strong>CVSS 9,6</strong> — el webhook envía el token de ServiceAccount a una dirección de Vault controlada por el atacante. Corregido en <strong>1.23.1</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>B3</strong>: la bolsa brasileña abrió el viernes con casi <strong>tres horas</strong> de retraso — la causa fue una transferencia de archivos tardía a la cámara de compensación. <span class=\"chip\">BR</span></li>\n      <li><span class=\"chip\">Regulación</span> <strong>El otro reloj sigue corriendo</strong>: la conformidad del CRA para productos Tipo A empieza el <strong>30/08</strong>, la obligación de reporte (24h/72h/14 días) desde el <strong>11/09/2026</strong>. No se pospuso. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>npm <code>@joyfill</code></strong>: dos paquetes beta con control remoto vía Socket.IO, incluido acceso al portapapeles, reportado el 29/07. Y además: Revolut niega la afirmación de 75 millones que circula por ahí. <span class=\"chip\">Global</span></li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Zwei Tage nach der ruhigsten Nachrichtenlage der Woche liegt wieder ein echtes Release auf dem Tisch — und es ist ein unangenehmes für alle, die Modellauswahl nach Preisschild sortieren. DeepSeeks günstige Reihe hat ihr eigenes teures Vorschau-Flaggschiff in <em>allen neun</em> veröffentlichten Agenten- und Coding-Benchmarks überholt, bei unverändertem Preis von 0,14 $ / 0,28 $ je Million Token. Daneben füllt sich ein Kalendertag bedenklich: Am <strong>31. August</strong> laufen jetzt gleich drei Preis- und Abschalt-Fristen zusammen. Und die Benchmark-Boards, das Thema von gestern, machen heute genau da weiter, wo sie aufgehört haben — nur schlechter.</p>\n    <ul>\n      <li><span class=\"chip hot\">OSS</span> <strong>DeepSeek-V4-Flash-0731 verlässt die Vorschau</strong>: Terminal Bench 2.1 springt von <span class=\"stat\">61,8</span> auf <span class=\"stat\">82,7</span> — und schlägt das größere V4-Pro-Vorschaumodell (72,1) in jeder der neun Zeilen der Herstellertabelle.</li>\n      <li><span class=\"chip hot\">OSS</span> <strong>Preis unverändert</strong>: <span class=\"stat\">0,14 $</span> Eingabe / <span class=\"stat\">0,28 $</span> Ausgabe je Mio. Token. Zum Vergleich: Claude Sonnet 5 kostet ab September <span class=\"stat\">15 $</span> Ausgabe — rund das Vierundfünfzigfache.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Die einzige unabhängige Zahl</strong>: Artificial Analysis führt das Modell mit Intelligence-Index <span class=\"stat\">50</span> auf <em>„#3 out of 101 models in its class\"</em>. Alles andere sind Herstellerwerte.</li>\n      <li><span class=\"chip\">Local</span> <strong>Offen, aber nicht heimisch</strong>: MIT-Lizenz, Gewichte auf Hugging Face — bei <span class=\"stat\">304 Mrd.</span> Parametern gesamt. Offen heißt hier nicht „läuft auf deinem Mac\".</li>\n      <li><span class=\"chip hot\">Claude</span> <strong>Sonnet-5-Einführungspreis endet am 31.08.</strong>: von 2 $ / 10 $ auf 3 $ / 15 $ je Mio. Token — <span class=\"stat\">+50 %</span> über Nacht, ohne Hinweis auf der Rechnung.</li>\n      <li><span class=\"chip\">Claude</span> <strong>Gleicher Stichtag für Opus 5</strong>: Der Aktionspreis des Fast-Modus (10 $ / 50 $) läuft bis zum 31.08. Was danach gilt, steht in keiner Quelle.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Claude Code hat im Juli zwei gegenläufige Standards gesetzt</strong>: v2.1.200 nennt den Vorgabemodus jetzt „Manual\", v2.1.207 schaltet den Auto-Modus bei Bedrock/Vertex/Foundry ab Werk frei.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Der Board-Streit von gestern wird älter, nicht klarer</strong>: llm-stats trägt heute den 2. August — und führt Opus 5 neun Tage nach dem Erscheinen immer noch nicht. vals.ai steht beim 31.07. und setzt es auf Platz 1.</li>\n      <li><span class=\"chip good\">Tool</span> <strong>Cursor 3.11 nachgetragen</strong> (10.07.): Nebenchats per <code>/side</code>, Suche über alle Agenten-Transkripte, und Hooks, die den Agenten-Dialog selbst abgreifen.</li>\n    </ul></div>",

 $ auf 3 $ / 15 $ je Mio. Token — <span class=\"stat\">+50 %</span> über Nacht, ohne Hinweis auf der Rechnung.</li>\n      <li><span class=\"chip\">Claude</span> <strong>Gleicher Stichtag für Opus 5</strong>: Der Aktionspreis des Fast-Modus (10 $ / 50 $) läuft bis zum 31.08. Was danach gilt, steht in keiner Quelle.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Claude Code hat im Juli zwei gegenläufige Standards gesetzt</strong>: v2.1.200 nennt den Vorgabemodus jetzt „Manual\", v2.1.207 schaltet den Auto-Modus bei Bedrock/Vertex/Foundry ab Werk frei.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Der Board-Streit von gestern wird älter, nicht klarer</strong>: llm-stats trägt heute den 2. August — und führt Opus 5 neun Tage nach dem Erscheinen immer noch nicht. vals.ai steht beim 31.07. und setzt es auf Platz 1.</li>\n      <li><span class=\"chip good\">Tool</span> <strong>Cursor 3.11 nachgetragen</strong> (10.07.): Nebenchats per <code>/side</code>, Suche über alle Agenten-Transkripte, und Hooks, die den Agenten-Dialog selbst abgreifen.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Two days after the quietest news day of the week, a real release is back on the table — and it's an uncomfortable one for anyone who ranks model choice by price tag. DeepSeek's budget line has overtaken its own expensive preview flagship in all nine published agentic and coding benchmarks, at an unchanged price of $0.14 / $0.28 per million tokens. Meanwhile, one date on the calendar is filling up ominously: on August 31, three separate pricing and shutdown deadlines now land on the same day. And the benchmark boards — yesterday's story — pick up today right where they left off, only worse.</p>\n    <ul>\n      <li><span class=\"chip hot\">OSS</span> <strong>DeepSeek-V4-Flash-0731 leaves preview</strong>: Terminal Bench 2.1 jumps from <span class=\"stat\">61.8</span> to <span class=\"stat\">82.7</span> — beating the larger V4-Pro preview model (72.1) on every one of the nine rows in the vendor's own table.</li>\n      <li><span class=\"chip hot\">OSS</span> <strong>Price unchanged</strong>: <span class=\"stat\">$0.14</span> input / <span class=\"stat\">$0.28</span> output per million tokens. For comparison: Claude Sonnet 5's output price rises to <span class=\"stat\">$15</span> in September — roughly 54 times as much.</li>\n      <li><span class=\"chip\">Bench</span> <strong>The one independent number</strong>: Artificial Analysis ranks the model, with an Intelligence Index of <span class=\"stat\">50</span>, \"#3 out of 101 models in its class.\" Everything else here is vendor-reported.</li>\n      <li><span class=\"chip\">Local</span> <strong>Open, but not local</strong>: MIT license, weights on Hugging Face — at <span class=\"stat\">304 billion</span> parameters total. \"Open\" here doesn't mean \"runs on your Mac.\"</li>\n      <li><span class=\"chip hot\">Claude</span> <strong>Sonnet 5's launch price ends Aug 31</strong>: from $2 / $10 to $3 / $15 per million tokens — <span class=\"stat\">+50%</span> overnight, with no note on the invoice.</li>\n      <li><span class=\"chip\">Claude</span> <strong>Same deadline for Opus 5</strong>: the Fast mode's promotional price ($10 / $50) runs through Aug 31. What comes after isn't stated anywhere.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Claude Code set two opposite defaults in July</strong>: v2.1.200 renamed the default mode to \"Manual,\" v2.1.207 unlocked Auto mode by default on Bedrock/Vertex/Foundry.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Yesterday's board dispute gets older, not clearer</strong>: llm-stats now carries August 2 — and still doesn't list Opus 5, nine days after it shipped. vals.ai sits at Jul 31 and ranks it #1.</li>\n      <li><span class=\"chip good\">Tool</span> <strong>Cursor 3.11, backfilled</strong> (Jul 10): side chats via <code>/side</code>, search across all agent transcripts, and hooks that tap into the agent dialogue itself.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Dois dias depois do dia mais tranquilo da semana em notícias, um lançamento de verdade volta à mesa — e é um lançamento incômodo para quem escolhe modelo pelo preço. A linha econômica da DeepSeek ultrapassou seu próprio carro-chefe caro, ainda em prévia, nos nove benchmarks de agentes e programação publicados — todos os nove — com preço inalterado de US$ 0,14 / US$ 0,28 por milhão de tokens. Ao lado disso, uma data do calendário está enchendo de forma preocupante: em 31 de agosto, convergem agora três prazos de preço e desligamento. E os quadros de benchmark, tema de ontem, hoje continuam exatamente de onde pararam — só que pior.</p>\n    <ul>\n      <li><span class=\"chip hot\">OSS</span> <strong>DeepSeek-V4-Flash-0731 sai da prévia</strong>: o Terminal Bench 2.1 salta de <span class=\"stat\">61,8</span> para <span class=\"stat\">82,7</span> — e supera o modelo maior, V4-Pro (prévia), com 72,1, em todas as nove linhas da tabela do próprio fabricante.</li>\n      <li><span class=\"chip hot\">OSS</span> <strong>Preço inalterado</strong>: <span class=\"stat\">US$ 0,14</span> de entrada / <span class=\"stat\">US$ 0,28</span> de saída por milhão de tokens. Para efeito de comparação: o Claude Sonnet 5 vai custar <span class=\"stat\">US$ 15</span> de saída a partir de setembro — cerca de 54 vezes mais.</li>\n      <li><span class=\"chip\">Bench</span> <strong>O único número independente</strong>: a Artificial Analysis classifica o modelo, com índice de inteligência <span class=\"stat\">50</span>, como \"#3 out of 101 models in its class\". Todo o resto é valor informado pelo fabricante.</li>\n      <li><span class=\"chip\">Local</span> <strong>Aberto, mas não caseiro</strong>: licença MIT, pesos no Hugging Face — com <span class=\"stat\">304 bilhões</span> de parâmetros no total. \"Aberto\" aqui não quer dizer \"roda no seu Mac\".</li>\n      <li><span class=\"chip hot\">Claude</span> <strong>Preço de lançamento do Sonnet 5 termina em 31/08</strong>: de US$ 2 / US$ 10 para US$ 3 / US$ 15 por milhão de tokens — <span class=\"stat\">+50%</span> da noite para o dia, sem aviso na fatura.</li>\n      <li><span class=\"chip\">Claude</span> <strong>Mesmo prazo para o Opus 5</strong>: o preço promocional do modo Fast (US$ 10 / US$ 50) vale até 31/08. O que vale depois não está em nenhuma fonte.</li>\n      <li><span class=\"chip\">Tool</span> <strong>O Claude Code fixou dois padrões opostos em julho</strong>: a v2.1.200 renomeou o modo padrão para \"Manual\", a v2.1.207 liberou o modo automático de fábrica no Bedrock/Vertex/Foundry.</li>\n      <li><span class=\"chip\">Bench</span> <strong>A disputa de quadros de ontem fica mais velha, não mais clara</strong>: o llm-stats já traz 2 de agosto — e ainda não lista o Opus 5, nove dias depois do lançamento. O vals.ai está em 31/07 e o coloca em 1º lugar.</li>\n      <li><span class=\"chip good\">Tool</span> <strong>Cursor 3.11, adicionado com atraso</strong> (10/07): chats paralelos via <code>/side</code>, busca em todas as transcrições de agentes e hooks que capturam o próprio diálogo do agente.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Dos días después del día más tranquilo de la semana en noticias, vuelve a haber un lanzamiento de verdad sobre la mesa — y es uno incómodo para quien elige modelo por el precio. La línea económica de DeepSeek superó a su propio buque insignia caro, todavía en vista previa, en los nueve benchmarks de agentes y programación publicados — los nueve — con un precio sin cambios de 0,14 $ / 0,28 $ por millón de tokens. Al lado de eso, una fecha del calendario se está llenando de forma preocupante: el 31 de agosto convergen ahora tres plazos de precio y apagado. Y los tableros de benchmarks, el tema de ayer, hoy siguen justo donde se quedaron — solo que peor.</p>\n    <ul>\n      <li><span class=\"chip hot\">OSS</span> <strong>DeepSeek-V4-Flash-0731 sale de la vista previa</strong>: Terminal Bench 2.1 salta de <span class=\"stat\">61,8</span> a <span class=\"stat\">82,7</span> — y supera al modelo más grande, V4-Pro (vista previa), con 72,1, en las nueve líneas de la tabla del propio fabricante.</li>\n      <li><span class=\"chip hot\">OSS</span> <strong>Precio sin cambios</strong>: <span class=\"stat\">0,14 $</span> de entrada / <span class=\"stat\">0,28 $</span> de salida por millón de tokens. Para comparar: Claude Sonnet 5 va a costar <span class=\"stat\">15 $</span> de salida a partir de septiembre — unas 54 veces más.</li>\n      <li><span class=\"chip\">Bench</span> <strong>La única cifra independiente</strong>: Artificial Analysis ubica al modelo, con índice de inteligencia <span class=\"stat\">50</span>, como \"#3 out of 101 models in its class\". Todo lo demás son cifras del propio fabricante.</li>\n      <li><span class=\"chip\">Local</span> <strong>Abierto, pero no casero</strong>: licencia MIT, pesos en Hugging Face — con <span class=\"stat\">304 mil millones</span> de parámetros en total. \"Abierto\" aquí no significa \"corre en tu Mac\".</li>\n      <li><span class=\"chip hot\">Claude</span> <strong>El precio de lanzamiento de Sonnet 5 termina el 31/08</strong>: de 2 $ / 10 $ a 3 $ / 15 $ por millón de tokens — <span class=\"stat\">+50%</span> de la noche a la mañana, sin ningún aviso en la factura.</li>\n      <li><span class=\"chip\">Claude</span> <strong>Mismo plazo para Opus 5</strong>: el precio promocional del modo Fast (10 $ / 50 $) rige hasta el 31/08. Lo que aplica después no aparece en ninguna fuente.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Claude Code fijó dos estándares opuestos en julio</strong>: la v2.1.200 le puso al modo predeterminado el nombre \"Manual\", la v2.1.207 activó de fábrica el modo automático en Bedrock/Vertex/Foundry.</li>\n      <li><span class=\"chip\">Bench</span> <strong>La disputa de tableros de ayer se hace más vieja, no más clara</strong>: llm-stats ya trae el 2 de agosto — y sigue sin listar a Opus 5, nueve días después de su lanzamiento. vals.ai se quedó en el 31/07 y lo pone en el 1er lugar.</li>\n      <li><span class=\"chip good\">Tool</span> <strong>Cursor 3.11, agregado con retraso</strong> (10/07): chats laterales con <code>/side</code>, búsqueda en todas las transcripciones de agentes, y hooks que capturan el propio diálogo del agente.</li>\n    </ul></div>"
