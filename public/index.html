      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Am Sonntag, dem 2. August, läuft die zweijährige Übergangsfrist des EU AI Act ab. Dann gilt „der Rest der Verordnung\" — und der trifft nicht mehr nur Modell-Hersteller, sondern jeden, der ein KI-System in Europa ausliefert. Die praktisch wichtigste Pflicht ist die unspektakulärste: Wer mit einer Maschine spricht, muss das erfahren.<sup>[1][2]</sup> Zwei Tage vorher hat die EU die Ausschreibung für bis zu sieben KI-Gigafabriken eröffnet — rund 30 Milliarden Euro, von denen genau eine Milliarde zugesagt ist.<sup>[4][5]</sup> Und in China gilt seit Mitte Juli ein Regelwerk, das den KI-Agenten wie ein Gerät behandelt: Meldepflicht, Prüfung, Rückruf.<sup>[8][9]</sup></p>\n    <ul>\n      <li><span class=\"chip hot\">REG · EU</span> <strong>Zwei Tage bis zum 02.08.:</strong> Dann greift „der Rest des AI Act\", Artikel 6(1) ausgenommen.<sup>[2]</sup> Kernstück für Anwender ist Artikel 50 — Offenlegung beim Chatbot, maschinenlesbare Markierung synthetischer Inhalte, Deepfake-Kennzeichnung. Sanktionsrahmen dafür: <strong>15 Mio. €</strong> oder <strong>3 %</strong> Weltjahresumsatz, je nachdem, was höher ist.<sup>[3]</sup></li>\n      <li><span class=\"chip\">REG · EU</span> <strong>Was am Sonntag <em>nicht</em> kommt:</strong> Hochrisiko. Nach der Digital-Omnibus-Einigung gilt Anhang III erst ab <strong>02.12.2027</strong>, in Produkte eingebaute KI (Anhang I) ab <strong>02.08.2028</strong> — so die Kommission selbst.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">ACHTUNG</span> <strong>Datums-Falle:</strong> Mehrere Blogs datieren die Chatbot-Offenlegung auf den 10.07.2026. Weder die Kommissionsseite noch der Verordnungs-Tracker kennen dieses Datum. Beide nennen den 02.08.<sup>[1][2]</sup></li>\n      <li><span class=\"chip\">POLITIK · EU</span> <strong>Gigafabriken ausgeschrieben:</strong> EuroHPC eröffnete am 30.07. die Ausschreibung, bis zu sieben Standorte.<sup>[4]</sup> Von den ~30 Mrd. € ist <strong>1 Mrd. €</strong> fest zugesagt; 4 Mrd. hängen am noch nicht beschlossenen EU-Haushaltsrahmen, 5 Mrd. an den Mitgliedstaaten, 20 Mrd. an Privaten.<sup>[5]</sup></li>\n      <li><span class=\"chip\">REG · CN</span> <strong>China behandelt Agenten als Produkt:</strong> Meldepflicht, Pflichtprüfung und <em>Rückruf</em> für Agenten in Gesundheit, Verkehr, Medien, öffentlicher Sicherheit; 19 benannte Einsatzszenarien.<sup>[8][9]</sup></li>\n      <li><span class=\"chip\">STUDIE · DE</span> <strong>Bitkom: 41 % statt 17 %</strong> — die Zahl zirkuliert diese Woche wieder, stammt aber vom <strong>11.03.2026</strong>. Selten mitzitiert: <strong>33 %</strong> melden deutlich höhere Kosten als erwartet, <strong>19 %</strong> haben wegen KI Stellen abgebaut.<sup>[10]</sup></li>\n      <li><span class=\"chip\">CONSUMER</span> <strong>Gemini Notebook baut an einer „App\"-Kachel</strong>, die aus den Quellen eines Notizbuchs eine Anwendung erzeugt — gesichtet am 29.07., <strong>für niemanden live</strong>, kein Termin.<sup>[7]</sup></li>\n      <li><span class=\"chip good\">twiceD</span> Zwei Ideen mit Stichtag im Rücken: eine <strong>Transparenz-Abnahme nach Artikel 50</strong> zum Festpreis und eine <strong>KI-Kosten-Obduktion</strong>, die den Wert je Vorgang statt der Kosten je Anfrage rechnet.</li>\n    </ul></div>",
      "latestTldrHtmlByLang": {
        "de": "<div class=\"tldr\"><p class=\"lead\">Am Sonntag, dem 2. August, läuft die zweijährige Übergangsfrist des EU AI Act ab. Dann gilt „der Rest der Verordnung\" — und der trifft nicht mehr nur Modell-Hersteller, sondern jeden, der ein KI-System in Europa ausliefert. Die praktisch wichtigste Pflicht ist die unspektakulärste: Wer mit einer Maschine spricht, muss das erfahren.<sup>[1][2]</sup> Zwei Tage vorher hat die EU die Ausschreibung für bis zu sieben KI-Gigafabriken eröffnet — rund 30 Milliarden Euro, von denen genau eine Milliarde zugesagt ist.<sup>[4][5]</sup> Und in China gilt seit Mitte Juli ein Regelwerk, das den KI-Agenten wie ein Gerät behandelt: Meldepflicht, Prüfung, Rückruf.<sup>[8][9]</sup></p>\n    <ul>\n      <li><span class=\"chip hot\">REG · EU</span> <strong>Zwei Tage bis zum 02.08.:</strong> Dann greift „der Rest des AI Act\", Artikel 6(1) ausgenommen.<sup>[2]</sup> Kernstück für Anwender ist Artikel 50 — Offenlegung beim Chatbot, maschinenlesbare Markierung synthetischer Inhalte, Deepfake-Kennzeichnung. Sanktionsrahmen dafür: <strong>15 Mio. €</strong> oder <strong>3 %</strong> Weltjahresumsatz, je nachdem, was höher ist.<sup>[3]</sup></li>\n      <li><span class=\"chip\">REG · EU</span> <strong>Was am Sonntag <em>nicht</em> kommt:</strong> Hochrisiko. Nach der Digital-Omnibus-Einigung gilt Anhang III erst ab <strong>02.12.2027</strong>, in Produkte eingebaute KI (Anhang I) ab <strong>02.08.2028</strong> — so die Kommission selbst.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">ACHTUNG</span> <strong>Datums-Falle:</strong> Mehrere Blogs datieren die Chatbot-Offenlegung auf den 10.07.2026. Weder die Kommissionsseite noch der Verordnungs-Tracker kennen dieses Datum. Beide nennen den 02.08.<sup>[1][2]</sup></li>\n      <li><span class=\"chip\">POLITIK · EU</span> <strong>Gigafabriken ausgeschrieben:</strong> EuroHPC eröffnete am 30.07. die Ausschreibung, bis zu sieben Standorte.<sup>[4]</sup> Von den ~30 Mrd. € ist <strong>1 Mrd. €</strong> fest zugesagt; 4 Mrd. hängen am noch nicht beschlossenen EU-Haushaltsrahmen, 5 Mrd. an den Mitgliedstaaten, 20 Mrd. an Privaten.<sup>[5]</sup></li>\n      <li><span class=\"chip\">REG · CN</span> <strong>China behandelt Agenten als Produkt:</strong> Meldepflicht, Pflichtprüfung und <em>Rückruf</em> für Agenten in Gesundheit, Verkehr, Medien, öffentlicher Sicherheit; 19 benannte Einsatzszenarien.<sup>[8][9]</sup></li>\n      <li><span class=\"chip\">STUDIE · DE</span> <strong>Bitkom: 41 % statt 17 %</strong> — die Zahl zirkuliert diese Woche wieder, stammt aber vom <strong>11.03.2026</strong>. Selten mitzitiert: <strong>33 %</strong> melden deutlich höhere Kosten als erwartet, <strong>19 %</strong> haben wegen KI Stellen abgebaut.<sup>[10]</sup></li>\n      <li><span class=\"chip\">CONSUMER</span> <strong>Gemini Notebook baut an einer „App\"-Kachel</strong>, die aus den Quellen eines Notizbuchs eine Anwendung erzeugt — gesichtet am 29.07., <strong>für niemanden live</strong>, kein Termin.<sup>[7]</sup></li>\n      <li><span class=\"chip good\">twiceD</span> Zwei Ideen mit Stichtag im Rücken: eine <strong>Transparenz-Abnahme nach Artikel 50</strong> zum Festpreis und eine <strong>KI-Kosten-Obduktion</strong>, die den Wert je Vorgang statt der Kosten je Anfrage rechnet.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">On Sunday, August 2, the EU AI Act's two-year transition period expires. From then on, \"the remainder of the Regulation\" applies — and it no longer targets only model makers, but anyone who deploys an AI system in Europe. The practically most important obligation is also the least spectacular: anyone talking to a machine has to be told so.<sup>[1][2]</sup> Two days earlier, the EU opened the call for tenders for up to seven AI Gigafactories — roughly €30 billion, of which exactly €1 billion is committed.<sup>[4][5]</sup> And in China, a framework has applied since mid-July that treats the AI agent like a device: filing requirement, testing, recall.<sup>[8][9]</sup></p>\n    <ul>\n      <li><span class=\"chip hot\">REG · EU</span> <strong>Two days to 08/02:</strong> That's when \"the remainder of the AI Act\" kicks in, Article 6(1) excepted.<sup>[2]</sup> The core piece for deployers is Article 50 — chatbot disclosure, machine-readable marking of synthetic content, deepfake labeling. Penalty cap: <strong>€15 million</strong> or <strong>3%</strong> of worldwide annual revenue, whichever is higher.<sup>[3]</sup></li>\n      <li><span class=\"chip\">REG · EU</span> <strong>What <em>doesn't</em> arrive on Sunday:</strong> high risk. After the Digital Omnibus deal, Annex III doesn't apply until <strong>12/02/2027</strong>, AI built into products (Annex I) not until <strong>08/02/2028</strong> — per the Commission itself.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">HEADS UP</span> <strong>Date trap:</strong> Several blogs date the chatbot disclosure to <strong>07/10/2026</strong>. Neither the Commission page nor the Regulation tracker knows that date. Both name 08/02.<sup>[1][2]</sup></li>\n      <li><span class=\"chip\">POLICY · EU</span> <strong>Gigafactories put out to tender:</strong> EuroHPC opened the call for tenders on <strong>07/30</strong>, up to seven sites.<sup>[4]</sup> Of the ~€30 billion, <strong>€1 billion</strong> is firmly committed; €4 billion hinges on the not-yet-decided EU budget framework, €5 billion on the member states, €20 billion on private investors.<sup>[5]</sup></li>\n      <li><span class=\"chip\">REG · CN</span> <strong>China treats agents as a product:</strong> filing requirement, mandatory testing, and recall for agents in healthcare, transportation, media, public safety; 19 named application scenarios.<sup>[8][9]</sup></li>\n      <li><span class=\"chip\">STUDY · DE</span> <strong>Bitkom: 41% instead of 17%</strong> — the figure is circulating again this week, but it's from <strong>03/11/2026</strong>. Rarely cited alongside it: <strong>33%</strong> report markedly higher costs than expected, <strong>19%</strong> have cut jobs because of AI.<sup>[10]</sup></li>\n      <li><span class=\"chip\">CONSUMER</span> <strong>Gemini Notebook is building an \"app\" tile</strong> that generates an application from a notebook's sources — spotted on <strong>07/29</strong>, <strong>live for no one</strong>, no timeline.<sup>[7]</sup></li>\n      <li><span class=\"chip good\">twiceD</span> Two ideas with a deadline at their back: a fixed-price <strong>Article 50 transparency sign-off</strong> and an <strong>AI cost autopsy</strong> that calculates value per case instead of cost per request.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">No domingo, dia 2 de agosto, termina o prazo de transição de dois anos do AI Act da UE. A partir daí vale \"o restante do Regulamento\" — que deixa de atingir apenas os fabricantes de modelos e passa a valer para quem entrega um sistema de IA na Europa. A obrigação praticamente mais importante é a menos espetacular: quem fala com uma máquina precisa saber disso.<sup>[1][2]</sup> Dois dias antes, a UE abriu a licitação para até sete Gigafábricas de IA — cerca de € 30 bilhões, dos quais exatamente € 1 bilhão está garantido.<sup>[4][5]</sup> E na China, desde meados de julho, vale um conjunto de regras que trata o agente de IA como um aparelho: obrigação de notificação, avaliação, recall.<sup>[8][9]</sup></p>\n    <ul>\n      <li><span class=\"chip hot\">REG · UE</span> <strong>Dois dias até 02/08:</strong> É quando entra em vigor \"o restante do AI Act\", com exceção do Artigo 6(1).<sup>[2]</sup> A peça central para quem usa IA é o Artigo 50 — divulgação no chatbot, marcação legível por máquina de conteúdo sintético, rotulagem de deepfake. Teto de sanção: <strong>€ 15 milhões</strong> ou <strong>3%</strong> do faturamento mundial anual, o que for maior.<sup>[3]</sup></li>\n      <li><span class=\"chip\">REG · UE</span> <strong>O que <em>não</em> chega no domingo:</strong> alto risco. Após o acordo do Digital Omnibus, o Anexo III só vale a partir de <strong>02/12/2027</strong>, e a IA embutida em produtos (Anexo I), a partir de <strong>02/08/2028</strong> — segundo a própria Comissão.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">ATENÇÃO</span> <strong>Armadilha de data:</strong> vários blogs datam a divulgação do chatbot em <strong>10/07/2026</strong>. Nem a página da Comissão nem o rastreador do Regulamento conhecem essa data. Ambos citam 02/08.<sup>[1][2]</sup></li>\n      <li><span class=\"chip\">POLÍTICA · UE</span> <strong>Gigafábricas em licitação:</strong> a EuroHPC abriu a licitação em <strong>30/07</strong>, para até sete localidades.<sup>[4]</sup> Dos ~€ 30 bilhões, <strong>€ 1 bilhão</strong> está firmemente garantido; € 4 bilhões dependem do quadro orçamentário da UE ainda não decidido, € 5 bilhões dos Estados-membros, € 20 bilhões de investidores privados.<sup>[5]</sup></li>\n      <li><span class=\"chip\">REG · CN</span> <strong>China trata os agentes como produto:</strong> obrigação de notificação, avaliação obrigatória e recall para agentes em saúde, transporte, mídia, segurança pública; 19 cenários de aplicação nomeados.<sup>[8][9]</sup></li>\n      <li><span class=\"chip\">ESTUDO · DE</span> <strong>Bitkom: 41% em vez de 17%</strong> — o número volta a circular esta semana, mas é de <strong>11/03/2026</strong>. Raramente citado junto: <strong>33%</strong> relatam custos bem mais altos do que o esperado, <strong>19%</strong> cortaram vagas por causa da IA.<sup>[10]</sup></li>\n      <li><span class=\"chip\">CONSUMER</span> <strong>Gemini Notebook está construindo um bloco de \"app\"</strong> que gera um aplicativo a partir das fontes de um caderno — avistado em <strong>29/07</strong>, <strong>fora do ar para todos</strong>, sem data prevista.<sup>[7]</sup></li>\n      <li><span class=\"chip good\">twiceD</span> Duas ideias com um prazo nas costas: uma <strong>homologação de transparência conforme o Artigo 50</strong> a preço fixo e uma <strong>autópsia de custos de IA</strong> que calcula o valor por caso em vez do custo por solicitação.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">El domingo 2 de agosto vence el período de transición de dos años de la Ley de IA de la UE. A partir de entonces rige \"el resto del Reglamento\" — que ya no afecta solo a los fabricantes de modelos, sino a quien entregue un sistema de IA en Europa. La obligación prácticamente más importante es la menos espectacular: quien habla con una máquina debe saberlo.<sup>[1][2]</sup> Dos días antes, la UE abrió la licitación para hasta siete Gigafábricas de IA — unos 30 mil millones de euros, de los cuales exactamente mil millones están comprometidos.<sup>[4][5]</sup> Y en China, desde mediados de julio, rige un conjunto de normas que trata al agente de IA como un aparato: obligación de registro, revisión, retiro.<sup>[8][9]</sup></p>\n    <ul>\n      <li><span class=\"chip hot\">REG · UE</span> <strong>Dos días para el 02/08:</strong> Ahí entra en vigor \"el resto de la Ley de IA\", con excepción del Artículo 6(1).<sup>[2]</sup> La pieza central para quien despliega IA es el Artículo 50 — divulgación en el chatbot, marcado legible por máquina de contenido sintético, etiquetado de deepfakes. Tope de sanción: <strong>15 millones de euros</strong> o <strong>3%</strong> de la facturación mundial anual, lo que sea mayor.<sup>[3]</sup></li>\n      <li><span class=\"chip\">REG · UE</span> <strong>Lo que <em>no</em> llega el domingo:</strong> alto riesgo. Tras el acuerdo del Digital Omnibus, el Anexo III no rige hasta el <strong>02/12/2027</strong>, y la IA integrada en productos (Anexo I), hasta el <strong>02/08/2028</strong> — según la propia Comisión.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">ATENCIÓN</span> <strong>Trampa de fecha:</strong> varios blogs fechan la divulgación del chatbot el <strong>10/07/2026</strong>. Ni la página de la Comisión ni el rastreador del Reglamento conocen esa fecha. Ambos citan el 02/08.<sup>[1][2]</sup></li>\n      <li><span class=\"chip\">POLÍTICA · UE</span> <strong>Gigafábricas en licitación:</strong> EuroHPC abrió la licitación el <strong>30/07</strong>, para hasta siete sedes.<sup>[4]</sup> De los ~30 mil millones de euros, <strong>mil millones de euros</strong> están firmemente comprometidos; 4 mil millones dependen del marco presupuestario de la UE aún no decidido, 5 mil millones de los Estados miembros, 20 mil millones de inversionistas privados.<sup>[5]</sup></li>\n      <li><span class=\"chip\">REG · CN</span> <strong>China trata a los agentes como un producto:</strong> obligación de registro, revisión obligatoria y retiro para agentes en salud, transporte, medios, seguridad pública; 19 escenarios de aplicación identificados.<sup>[8][9]</sup></li>\n      <li><span class=\"chip\">ESTUDIO · DE</span> <strong>Bitkom: 41% en lugar de 17%</strong> — la cifra vuelve a circular esta semana, pero es del <strong>11/03/2026</strong>. Rara vez se cita junto con ella: el <strong>33%</strong> reporta costos bastante más altos de lo esperado, y el <strong>19%</strong> ha recortado puestos por la IA.<sup>[10]</sup></li>\n      <li><span class=\"chip\">CONSUMER</span> <strong>Gemini Notebook está construyendo un bloque de \"app\"</strong> que genera una aplicación a partir de las fuentes de un cuaderno — visto el <strong>29/07</strong>, <strong>sin estar disponible para nadie</strong>, sin fecha.<sup>[7]</sup></li>\n      <li><span class=\"chip good\">twiceD</span> Dos ideas con una fecha límite en el fondo: una <strong>homologación de transparencia según el Artículo 50</strong> a precio fijo y una <strong>autopsia de costos de IA</strong> que calcula el valor por caso en lugar del costo por solicitud.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Gestern halbierte sich dieses Board, und die Analyse hier lautete: kein Marktereignis, nur eine flachere Stichprobe — weil sich <em>nichts</em> gegeneinander verschob. Heute fällt es erneut, von 42 auf <strong>32</strong>, und diesmal gilt das Gegenteil. Das Board verliert 24 %, der Java-Tag aber 50 % (22× → 11×), Spring Boot und Angular gehen auf je 9×. Gegen den Trend steigt <strong>KI-Integration von 11× auf 12×</strong> und ist damit zum ersten Mal der häufigste Skill-Tag im Board — vor Java. Bei 32 Einträgen ist das eine Beobachtung mit dünner Datenbasis, keine Marktdiagnose; sie zeigt aber in dieselbe Richtung wie die Makro-Zahl des Tages, nach der 42 % der Unternehmen Zusatzbedarf bei KI-Fachkräften sehen und 27 % mit KI-bedingtem Abbau rechnen. Dazu die härteste Zahl der Woche: Der DACH-Durchschnittssatz sinkt erstmals seit Beginn der Studienreihe — von 104 auf 103 €/h. Das Monatseinkommen sinkt um <strong>21 %</strong>. Der Preis hält, die Menge bricht weg.</p>\n    <ul>\n      <li><span class=\"chip hot\">Board</span> <strong>32 Listings, minus 24 %</strong>: 19 Freelance, 9 Employee, 4 Intriguing. 19 Einträge von gestern übernommen, <strong>13 neu, 23 gefallen</strong>. Zweiter Rückgang in Folge (87 → 42 → 32), aber der erste, bei dem die Zusammensetzung mitwandert.</li>\n      <li><span class=\"chip hot\">Board</span> <strong>Die Mischung kippt</strong>: Java 22× → 11× bei einem Gesamtfaktor von 0,76, Spring Boot und Angular je 14× → 9×. Gegen den Trend: <strong>KI-Integration 11× → 12×</strong> und Employee 11× → 12×. Freelance-Anteil 71,4 % → 59,4 %, Median-Fit praktisch unverändert (62,5 → 63,0).</li>\n      <li><span class=\"chip good\">twiceD</span> <strong>Die Spitze wechselt zum ersten Mal seit Wochen</strong>: Das Telematik-Mandat von Keil Business Solutions (gestern Fit 88, Projektstart laut Anzeige morgen) ist aus dem Pull gefallen. Vorn steht jetzt <strong>iSAX mit Fit 87</strong> — Java 21, Spring Boot 3, Angular, Flutter, AWS Cognito, 100 % remote bis 12/2027. Bester der 13 Neuzugänge ist appDev mit <strong>Fit 76</strong> (gestern 66); QUINCEY schreibt zwei Schwester-Mandate gleichzeitig aus (Fit 79 und 74, Bayern, 80 % remote, Start Mitte August).</li>\n      <li><span class=\"chip hot\">Rate</span> <strong>Erster Rückgang der Studienreihe</strong>: Der durchschnittliche Stundensatz im DACH-Raum fällt von <strong>104 auf 103 €/h</strong> — laut Herausgeber der erste Rückgang, seit die Studie erhoben wird. Das durchschnittliche Monatseinkommen fällt im selben Zeitraum von <strong>8.432 € auf 6.653 €</strong>, rund −21 %.<sup>[1]</sup></li>\n      <li><span class=\"chip\">Rate</span> <strong>Genau zwei von 19 Freelance-Einträgen nennen einen Satz selbst</strong> — ProTIP für DB Systel mit rund 85 €/h und OC Recruitment mit 75 €/h. Beide liegen <strong>unter</strong> dem Median von 90 €/h für Software- und Webentwicklung.<sup>[2]</sup> 25 der 32 Bänder im Board sind recherchierter Benchmark, einer nennt gar nichts.</li>\n      <li><span class=\"chip good\">Vergabe</span> <strong>Eine belegte Frist</strong>: Das Beschaffungsamt des BMI schreibt die <strong>Weiterentwicklung des eID Testbed</strong> aus — CPV 72000000, Erfüllungsort Bonn, Abgabefrist <strong>21.08.2026</strong>, Öffentliche Ausschreibung nach UVgO. 21 Kalendertage Vorlauf, deutlich über der Fünf-Werktage-Regel dieser Spur.<sup>[9]</sup></li>\n      <li><span class=\"chip hot\">Vergabe</span> <strong>Und ein unbelegter Stack</strong>: Dieselbe Bekanntmachung nennt weder Leistungsbeschreibung noch geschätzten Auftragswert noch Veröffentlichungsdatum. Ob Java, Angular oder angewandte KI verlangt sind, ist <strong>nicht verifiziert</strong> — das Verdict lautet deshalb nicht „bietbar\", sondern „Unterlagen über eVergabe ziehen, dann entscheiden\".</li>\n      <li><span class=\"chip\">CH</span> <strong>Der Schweiz-Aufschlag steht auf recherchierten Zahlen</strong>: ELCA informatique in Zürich (Fit 81, Agentic-AI-Fokus, Anzeige vom 09.06. und damit 52 Tage alt) nennt kein Gehalt; die CHF 140–190k im Board sind Recherche. Die einzige unabhängige Gegenzahl — Ø CHF 117.100 für Senior SWE in Zürich — ließ sich heute nicht nachladen (HTTP 403). Die Track-1-Schwelle von CHF 150k bleibt damit <strong>unbelegt</strong>.<sup>[10]</sup></li>\n      <li><span class=\"chip\">Markt</span> <strong>Makro-Rahmen</strong>: ifo-Beschäftigungsbarometer Juli <strong>93,0</strong> nach 92,2 — der Abbau verlangsamt sich.<sup>[3]</sup> Stellenanzeigen <strong>−39 %</strong> gegenüber dem Höchststand vom Frühjahr 2022, Gehaltswachstum 3,4 % (März) → 2,8 % (Juni), Industrie rund 15.000 Stellen pro Monat.<sup>[4][5]</sup></li>\n    </ul></div>",

        "en": "<div class=\"tldr\"><p class=\"lead\">Yesterday this board halved, and the analysis here was: not a market event, just a shallower sample — because nothing shifted against anything else. Today it drops again, from 42 to 32, and this time the opposite holds. The board loses 24%, but the Java tag loses 50% (22× → 11×), with Spring Boot and Angular both settling at 9×. Against the trend, AI integration rises from 11× to 12× and becomes, for the first time, the most common skill tag on the board — ahead of Java. At 32 entries, that's a thin-sample observation, not a market diagnosis; but it points in the same direction as today's macro number, which finds 42% of companies reporting additional demand for AI specialists and 27% expecting AI-driven job cuts. On top of that, the hardest number of the week: the DACH average hourly rate falls for the first time since the study series began — from €104 to €103/h. Monthly income falls by 21%. The price holds, the volume collapses.</p>\n    <ul>\n      <li><span class=\"chip hot\">Board</span> <strong>32 listings, down 24%</strong>: 19 freelance, 9 employee, 4 intriguing. 19 entries carried over from yesterday, <strong>13 new, 23 dropped</strong>. Second straight decline (87 → 42 → 32), but the first where the composition shifts too.</li>\n      <li><span class=\"chip hot\">Board</span> <strong>The mix tips over</strong>: Java 22× → 11× against an overall factor of 0.76, Spring Boot and Angular each 14× → 9×. Against the trend: <strong>AI integration 11× → 12×</strong> and employee 11× → 12×. Freelance share 71.4% → 59.4%, median fit practically unchanged (62.5 → 63.0).</li>\n      <li><span class=\"chip good\">twiceD</span> <strong>The lead changes hands for the first time in weeks</strong>: Keil Business Solutions' telematics mandate (fit 88 yesterday, project start per the listing tomorrow) has dropped out of the pull. <strong>iSAX now leads with fit 87</strong> — Java 21, Spring Boot 3, Angular, Flutter, AWS Cognito, 100% remote through 12/2027. The best of the 13 newcomers is appDev at <strong>fit 76</strong> (66 yesterday); QUINCEY is running two sister mandates at once (fit 79 and 74, Bavaria, 80% remote, start mid-August).</li>\n      <li><span class=\"chip hot\">Rate</span> <strong>First decline in this study series</strong>: the average hourly rate across the DACH region falls from <strong>€104 to €103/h</strong> — per the publisher, the first decline since the study began. Average monthly income over the same period falls from <strong>€8,432 to €6,653</strong>, roughly −21%.<sup>[1]</sup></li>\n      <li><span class=\"chip\">Rate</span> <strong>Exactly two of 19 freelance entries state a rate themselves</strong> — ProTIP for DB Systel at around 85 €/h and OC Recruitment at 75 €/h. Both sit <strong>below</strong> the 90 €/h median for software and web development.<sup>[2]</sup> 25 of the 32 bands on the board are a researched benchmark, one states nothing at all.</li>\n      <li><span class=\"chip good\">Tender</span> <strong>One confirmed deadline</strong>: Germany's Federal Office for Procurement (Beschaffungsamt des BMI) is tendering the further development of the eID Testbed — CPV 72000000, place of performance Bonn, submission deadline <strong>Aug 21, 2026</strong>, open procedure under UVgO. That's 21 calendar days' lead time, well past this lane's five-business-day rule.<sup>[9]</sup></li>\n      <li><span class=\"chip hot\">Tender</span> <strong>And an unconfirmed stack</strong>: the same notice states neither a scope description nor an estimated contract value nor a publication date. Whether Java, Angular, or applied AI are required is <strong>not verified</strong> — so the verdict isn't \"biddable,\" but \"pull the documents via eVergabe, then decide.\"</li>\n      <li><span class=\"chip\">CH</span> <strong>The Swiss premium rests on researched figures</strong>: ELCA informatique in Zurich (fit 81, agentic-AI focus, listing dated Jun 9 and thus 52 days old) states no salary; the CHF 140–190k on the board is researched. The only independent counter-figure — an average of CHF 117,100 for senior SWEs in Zurich — wouldn't load today (HTTP 403). The track-1 threshold of CHF 150k therefore remains <strong>unconfirmed</strong>.<sup>[10]</sup></li>\n      <li><span class=\"chip\">Market</span> <strong>Macro backdrop</strong>: the ifo employment barometer for July reads <strong>93.0</strong>, up from 92.2 — cuts are slowing.<sup>[3]</sup> Job postings are down <strong>39%</strong> from the spring-2022 peak, salary growth slid from 3.4% (March) to 2.8% (June), and industry is shedding roughly 15,000 jobs a month.<sup>[4][5]</sup></li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Ontem este board caiu pela metade, e a análise aqui foi: não é um evento de mercado, só uma amostra mais rasa — porque nada se deslocou em relação ao resto. Hoje ele cai de novo, de 42 para 32, e desta vez vale o contrário. O board perde 24%, mas a tag Java perde 50% (22× → 11×), com Spring Boot e Angular indo para 9× cada uma. Na contramão, Integração de IA sobe de 11× para 12× e se torna, pela primeira vez, a tag de habilidade mais comum do board — à frente do Java. Com 32 registros, isso é uma observação de base fina, não um diagnóstico de mercado; mas aponta na mesma direção do número macro do dia, segundo o qual 42% das empresas relatam demanda adicional por profissionais de IA e 27% esperam cortes ligados à IA. Além disso, o número mais duro da semana: a tarifa média na região DACH cai pela primeira vez desde o início da série de estudos — de 104 para 103 €/h. A renda mensal cai 21%. O preço se sustenta, o volume desaba.</p>\n    <ul>\n      <li><span class=\"chip hot\">Board</span> <strong>32 vagas, menos 24%</strong>: 19 Freelance, 9 Employee, 4 Intriguing. 19 registros mantidos de ontem, <strong>13 novos, 23 caíram</strong>. Segunda queda seguida (87 → 42 → 32), mas a primeira em que a composição também muda.</li>\n      <li><span class=\"chip hot\">Board</span> <strong>A mistura vira de vez</strong>: Java 22× → 11× com um fator geral de 0,76, Spring Boot e Angular indo cada um de 14× para 9×. Na contramão: <strong>Integração de IA 11× → 12×</strong> e Employee 11× → 12×. Fatia Freelance 71,4% → 59,4%, fit mediano praticamente inalterado (62,5 → 63,0).</li>\n      <li><span class=\"chip good\">twiceD</span> <strong>A liderança muda pela primeira vez em semanas</strong>: o mandato de telemática da Keil Business Solutions (fit 88 ontem, início de projeto conforme o anúncio amanhã) saiu da coleta. Agora lidera <strong>a iSAX com fit 87</strong> — Java 21, Spring Boot 3, Angular, Flutter, AWS Cognito, 100% remoto até 12/2027. O melhor dos 13 novos registros é a appDev com <strong>fit 76</strong> (66 ontem); a QUINCEY publica dois mandatos-irmãos ao mesmo tempo (fit 79 e 74, Baviera, 80% remoto, início em meados de agosto).</li>\n      <li><span class=\"chip hot\">Taxa</span> <strong>Primeira queda da série de estudos</strong>: a tarifa média por hora na região DACH cai de <strong>104 para 103 €/h</strong> — segundo o editor, a primeira queda desde que o estudo começou a ser feito. A renda mensal média no mesmo período cai de <strong>8.432 € para 6.653 €</strong>, cerca de −21%.<sup>[1]</sup></li>\n      <li><span class=\"chip\">Taxa</span> <strong>Exatamente dois dos 19 registros freelance informam a própria tarifa</strong> — ProTIP para a DB Systel, com cerca de 85 €/h, e OC Recruitment, com 75 €/h. As duas ficam <strong>abaixo</strong> da mediana de 90 €/h para desenvolvimento de software e web.<sup>[2]</sup> 25 das 32 faixas no board são benchmark pesquisado, uma não informa nada.</li>\n      <li><span class=\"chip good\">Licitação</span> <strong>Um prazo comprovado</strong>: o Beschaffungsamt do BMI licita a Weiterentwicklung des eID Testbed — CPV 72000000, local de execução Bonn, prazo de envio <strong>21/08/2026</strong>, licitação aberta conforme a UVgO. São 21 dias corridos de antecedência, bem acima da regra de cinco dias úteis desta trilha.<sup>[9]</sup></li>\n      <li><span class=\"chip hot\">Licitação</span> <strong>E um stack não comprovado</strong>: a mesma convocação não indica nem descrição do objeto, nem valor estimado do contrato, nem data de publicação. Se Java, Angular ou IA aplicada são exigidos <strong>não está verificado</strong> — o veredito, portanto, não é „licitável\", mas „buscar os documentos via eVergabe e então decidir\".</li>\n      <li><span class=\"chip\">CH</span> <strong>O adicional suíço se apoia em números pesquisados</strong>: a ELCA informatique em Zurique (fit 81, foco em Agentic AI, anúncio de 09/06 e, portanto, com 52 dias) não informa salário; os CHF 140–190k no board são pesquisa. O único contraponto independente — média de CHF 117.100 para SWE sênior em Zurique — não carregou hoje (HTTP 403). O limiar de CHF 150k da trilha 1 segue, assim, <strong>não comprovado</strong>.<sup>[10]</sup></li>\n      <li><span class=\"chip\">Mercado</span> <strong>Panorama macro</strong>: barômetro de emprego do ifo em julho <strong>93,0</strong> após 92,2 — os cortes desaceleram.<sup>[3]</sup> Vagas de emprego <strong>−39%</strong> em relação ao pico da primavera de 2022, crescimento salarial de 3,4% (março) → 2,8% (junho), indústria perdendo cerca de 15.000 vagas por mês.<sup>[4][5]</sup></li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Ayer este board se redujo a la mitad, y el análisis aquí fue: no es un evento de mercado, solo una muestra más superficial — porque nada se desplazó frente al resto. Hoy vuelve a caer, de 42 a 32, y esta vez ocurre lo contrario. El board pierde 24 %, pero la etiqueta Java pierde 50 % (22× → 11×), con Spring Boot y Angular bajando a 9× cada una. En contra de la tendencia, la Integración de IA sube de 11× a 12× y se convierte, por primera vez, en la etiqueta de habilidad más frecuente del board — por delante de Java. Con 32 registros, esto es una observación con base de datos delgada, no un diagnóstico de mercado; pero apunta en la misma dirección que la cifra macro del día, según la cual el 42 % de las empresas reporta demanda adicional de especialistas en IA y el 27 % espera recortes ligados a la IA. A eso se suma la cifra más dura de la semana: la tarifa promedio en la región DACH cae por primera vez desde que empezó la serie de estudios — de 104 a 103 €/h. El ingreso mensual cae 21 %. El precio se sostiene, el volumen se desploma.</p>\n    <ul>\n      <li><span class=\"chip hot\">Board</span> <strong>32 vacantes, −24 %</strong>: 19 Freelance, 9 Employee, 4 Intriguing. 19 registros se mantienen de ayer, <strong>13 nuevos, 23 cayeron</strong>. Segunda caída seguida (87 → 42 → 32), pero la primera en la que también cambia la composición.</li>\n      <li><span class=\"chip hot\">Board</span> <strong>La mezcla se inclina</strong>: Java 22× → 11× con un factor general de 0,76, Spring Boot y Angular bajan cada una de 14× a 9×. En contra de la tendencia: <strong>Integración de IA 11× → 12×</strong> y Employee 11× → 12×. Fracción Freelance 71,4 % → 59,4 %, fit mediano prácticamente sin cambios (62,5 → 63,0).</li>\n      <li><span class=\"chip good\">twiceD</span> <strong>La cima cambia por primera vez en semanas</strong>: el mandato de telemática de Keil Business Solutions (fit 88 ayer, inicio de proyecto según el anuncio mañana) salió del rastreo. Ahora encabeza <strong>iSAX con fit 87</strong> — Java 21, Spring Boot 3, Angular, Flutter, AWS Cognito, 100 % remoto hasta 12/2027. El mejor de los 13 registros nuevos es appDev con <strong>fit 76</strong> (66 ayer); QUINCEY publica dos mandatos gemelos al mismo tiempo (fit 79 y 74, Baviera, 80 % remoto, inicio a mediados de agosto).</li>\n      <li><span class=\"chip hot\">Tarifa</span> <strong>Primera caída de la serie de estudios</strong>: la tarifa promedio por hora en la región DACH cae de <strong>104 a 103 €/h</strong> — según el editor, la primera caída desde que se elabora el estudio. El ingreso mensual promedio en el mismo periodo cae de <strong>8.432 € a 6.653 €</strong>, alrededor de −21 %.<sup>[1]</sup></li>\n      <li><span class=\"chip\">Tarifa</span> <strong>Exactamente dos de los 19 registros Freelance declaran una tarifa por cuenta propia</strong> — ProTIP para DB Systel con unos 85 €/h y OC Recruitment con 75 €/h. Ambas quedan <strong>por debajo</strong> de la mediana de 90 €/h para desarrollo de software y web.<sup>[2]</sup> 25 de las 32 bandas en el board son benchmark investigado, una no declara nada.</li>\n      <li><span class=\"chip good\">Licitación</span> <strong>Un plazo confirmado</strong>: el Beschaffungsamt del BMI licita la Weiterentwicklung des eID Testbed — CPV 72000000, lugar de ejecución Bonn, plazo de envío <strong>21/08/2026</strong>, licitación abierta conforme a la UVgO. Son 21 días naturales de margen, muy por encima de la regla de cinco días hábiles de esta vía.<sup>[9]</sup></li>\n      <li><span class=\"chip hot\">Licitación</span> <strong>Y un stack no confirmado</strong>: la misma convocatoria no indica ni descripción del objeto, ni valor estimado del contrato, ni fecha de publicación. Si se exige Java, Angular o IA aplicada <strong>no está verificado</strong> — el veredicto, por tanto, no es „licitable\", sino „descargar los documentos vía eVergabe y luego decidir\".</li>\n      <li><span class=\"chip\">CH</span> <strong>El sobreprecio suizo se apoya en cifras investigadas</strong>: ELCA informatique en Zúrich (fit 81, enfoque en Agentic AI, anuncio del 09/06 y, por tanto, con 52 días) no declara salario; los CHF 140–190k en el board son investigación. La única contracifra independiente — un promedio de CHF 117.100 para SWE senior en Zúrich — no cargó hoy (HTTP 403). El umbral de CHF 150k de la vía 1 sigue, así, <strong>sin confirmar</strong>.<sup>[10]</sup></li>\n      <li><span class=\"chip\">Mercado</span> <strong>Marco macro</strong>: barómetro de empleo del ifo en julio <strong>93,0</strong> tras 92,2 — los recortes se desaceleran.<sup>[3]</sup> Ofertas de empleo <strong>−39 %</strong> frente al máximo de la primavera de 2022, crecimiento salarial de 3,4 % (marzo) → 2,8 % (junio), la industria pierde unas 15.000 vacantes al mes.<sup>[4][5]</sup></li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Freitag, der 31. Juli, Monatswechsel — und ein Wochenende, das man sich nicht besser bestellen könnte: <strong>Samstag und Sonntag beide 27 °C, beide 0 % Regen</strong>, bei zwei unabhängig abgerufenen Portalen. Das ist die gute Hälfte des Tages. Die andere Hälfte kommt aus dem frischesten Gesundheits-Bulletin des Landes und liest sich auf den ersten Blick beruhigend und auf den zweiten gar nicht: Die schweren Atemwegsfälle in Paraná <em>sinken</em> im Jahresvergleich deutlich — und trotzdem war in der Woche bis zum 27. Juli die Altersgruppe mit den <strong>meisten Grippe-Krankenhausaufnahmen die Kinder bis 6 Jahre</strong>. Beides stimmt gleichzeitig, und für einen Haushalt mit einem einen Monat alten Mädchen ändert das den Wochenendplan. Er wird deshalb heute nicht größer, sondern <strong>kleiner und näher</strong>.</p>\n    <ul>\n      <li><span class=\"chip good\">WETTER</span> <strong>Das Wochenende ist offen:</strong> Climatempo Sa <strong>14–27 °C</strong>, So 15–27 °C, Mo 16–27 °C — jeweils <strong>0 % Regen</strong>. theweather.com bestätigt 0 % für alle drei Tage. Zwei Portale, gleicher Niederschlag.</li>\n      <li><span class=\"chip\">WETTER</span> <strong>Kleine Korrektur nach unten:</strong> Gestern standen für Sa/So noch 28 °C im Modell, heute 27 °C. Die Nächte bleiben bei <strong>14–15 °C</strong> — für das Baby am Abend eine lange Jacke.</li>\n      <li><span class=\"chip hot\">BABY</span> <strong>Die Zahl der Woche:</strong> In der <strong>SE 29/2026</strong> (Woche bis 27.07.) war die Altersgruppe mit den meisten Influenza-Hospitalisierungen in Paraná die <strong>Kinder bis 6 Jahre — 708 Fälle</strong>.</li>\n      <li><span class=\"chip\">GESUNDHEIT</span> <strong>Und gleichzeitig sinkt alles:</strong> SRAG gesamt in der SE 29/2026 <strong>−15,5 %</strong>; kumuliert <strong>15.999</strong> Hospitalisierungen 2026 gegen <strong>18.944</strong> im Vorjahreszeitraum. Kein Widerspruch — zwei verschiedene Fragen.</li>\n      <li><span class=\"chip good\">GESUNDHEIT</span> <strong>Unser Day-Trip-Ring führt den Rückgang an:</strong> Die Regional de Saúde <strong>Cornélio Procópio</strong> hatte im selben Bulletin den größten Rückgang aller Regionen: <strong>−54,4 %</strong>.</li>\n      <li><span class=\"chip\">IMPFUNG</span> <strong>Nestschutz statt Piks:</strong> Paraná hat <strong>413.221</strong> Grippe-Dosen an Kinder von 6 Monaten bis unter 6 Jahren verimpft. Unser Baby ist mit einem Monat zu jung — geschützt wird es nur über die Menschen um es herum.</li>\n      <li><span class=\"chip good\">EVENT</span> <strong>Heute frisch bestätigt:</strong> Sesc Londrina Cadeião ist Sa <em>und</em> So <strong>9–18 h</strong> offen, alle Ausstellungen gratis, So <strong>17 h „Show com Souza\"</strong>. Zwei Angebote laufen am 08./09.08. aus.</li>\n      <li><span class=\"chip good\">TRIP</span> <strong>CineSolar Ourinhos, Mi 05.08.:</strong> heute erneut auf der Stadtseite bestätigt — Open-Air-Kino, 19 h Kurzfilme, 20 h „A Pequena Sereia\", Eintritt <strong>und Popcorn gratis</strong>.</li>\n      <li><span class=\"chip\">GESUNDHEIT</span> <strong>Dengue statistisch ruhig, aber nicht abwesend:</strong> Informe nº 23 (SE 01–28/2026) bleibt der neueste Stand — 19ª Regional Jacarezinho <strong>84</strong> Fälle, <strong>0</strong> Tote. Ein Todesfall steht in der Nachbar-Regional.</li>\n      <li><span class=\"chip\">KINO</span> <strong>Nicht heute, sondern am 14.08.:</strong> „Patrulha Canina — O Filme dos Dinossauros\" wurde von Juli auf <strong>Freitag, 14.08.2026</strong> verschoben. Wer den alten Termin im Kalender hat, streicht ihn.</li>\n    </ul></div>",

        "en": "<div class=\"tldr\"><p class=\"lead\">Friday, July 31, the month turns over — and it's a weekend you couldn't have ordered better: <strong>Saturday and Sunday both 27°C, both 0% rain</strong>, according to two independently checked portals. That's the good half of the day. The other half comes from the state's freshest health bulletin, and it reads reassuring at first glance and not at all on the second: severe respiratory cases in Paraná are <em>dropping</em> sharply year-over-year — and yet in the week through July 27, the age group with the <strong>most flu hospitalizations was children up to age 6</strong>. Both are true at once, and for a household with a one-month-old girl, that changes the weekend plan. So today it doesn't get bigger — it gets <strong>smaller and closer to home</strong>.</p>\n    <ul>\n      <li><span class=\"chip good\">WEATHER</span> <strong>The weekend is wide open:</strong> Climatempo has Sat <strong>14–27°C</strong>, Sun 15–27°C, Mon 16–27°C — each with <strong>0% rain</strong>. theweather.com confirms 0% for all three days. Two portals, same rainfall.</li>\n      <li><span class=\"chip\">WEATHER</span> <strong>Small correction downward:</strong> Yesterday the model still had 28°C for Sat/Sun, today it's 27°C. Nights stay at <strong>14–15°C</strong> — a long jacket for the baby in the evening.</li>\n      <li><span class=\"chip hot\">BABY</span> <strong>The number of the week:</strong> In <strong>SE 29/2026</strong> (the week through 07/27), the age group with the most influenza hospitalizations in Paraná was <strong>children up to age 6 — 708 cases</strong>.</li>\n      <li><span class=\"chip\">HEALTH</span> <strong>And at the same time, everything is dropping:</strong> total SRAG in SE 29/2026 <strong>−15.5%</strong>; cumulative <strong>15,999</strong> hospitalizations in 2026 versus <strong>18,944</strong> in the same period last year. No contradiction — two different questions.</li>\n      <li><span class=\"chip good\">HEALTH</span> <strong>Our day-trip ring leads the decline:</strong> the Regional de Saúde <strong>Cornélio Procópio</strong> had the largest drop of any region in the same bulletin: <strong>−54.4%</strong>.</li>\n      <li><span class=\"chip\">VACCINATION</span> <strong>Cocoon protection instead of a shot:</strong> Paraná has administered <strong>413,221</strong> flu doses to children from 6 months to under 6 years old. Our baby, at one month, is too young — it's protected only through the people around it.</li>\n      <li><span class=\"chip good\">EVENT</span> <strong>Freshly confirmed today:</strong> Sesc Londrina Cadeião is open Sat <em>and</em> Sun <strong>9 AM–6 PM</strong>, all exhibits free, Sun <strong>5 PM \"Show com Souza.\"</strong> Two offerings expire on 08/08 and 08/09.</li>\n      <li><span class=\"chip good\">TRIP</span> <strong>CineSolar Ourinhos, Wed 08/05:</strong> reconfirmed again today on the city's site — open-air cinema, 7 PM shorts, 8 PM \"A Pequena Sereia,\" admission <strong>and popcorn free</strong>.</li>\n      <li><span class=\"chip\">HEALTH</span> <strong>Dengue statistically calm, but not absent:</strong> Informe nº 23 (SE 01–28/2026) remains the latest status — 19ª Regional Jacarezinho <strong>84</strong> cases, <strong>0</strong> deaths. One death is recorded in the neighboring region.</li>\n      <li><span class=\"chip\">MOVIES</span> <strong>Not today, but on 08/14:</strong> \"Patrulha Canina — O Filme dos Dinossauros\" was moved from July to <strong>Friday, 08/14/2026</strong>. Anyone with the old date in their calendar should cross it out.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Sexta-feira, 31 de julho, virada do mês — e um fim de semana que não dava para pedir melhor: <strong>sábado e domingo ambos a 27 °C, ambos com 0% de chuva</strong>, segundo dois portais consultados de forma independente. Essa é a metade boa do dia. A outra metade vem do boletim de saúde mais recente do estado, e à primeira vista parece tranquilizadora, mas à segunda, nem tanto: os casos respiratórios graves no Paraná estão <em>caindo</em> bastante na comparação anual — e, mesmo assim, na semana até 27 de julho, a faixa etária com <strong>mais internações por gripe foi a das crianças até 6 anos</strong>. As duas coisas são verdade ao mesmo tempo, e para uma casa com uma menina de um mês isso muda o plano do fim de semana. Por isso, hoje ele não fica maior, mas sim <strong>menor e mais perto</strong>.</p>\n    <ul>\n      <li><span class=\"chip good\">CLIMA</span> <strong>O fim de semana está garantido:</strong> Climatempo indica sáb <strong>14–27 °C</strong>, dom 15–27 °C, seg 16–27 °C — sempre com <strong>0% de chuva</strong>. O theweather.com confirma 0% para os três dias. Dois portais, mesma chuva.</li>\n      <li><span class=\"chip\">CLIMA</span> <strong>Pequena correção para baixo:</strong> ontem o modelo ainda mostrava 28 °C para sáb/dom, hoje são 27 °C. As noites seguem em <strong>14–15 °C</strong> — para o bebê à noite, uma jaqueta comprida.</li>\n      <li><span class=\"chip hot\">BEBÊ</span> <strong>O número da semana:</strong> na <strong>SE 29/2026</strong> (semana até 27/07), a faixa etária com mais hospitalizações por Influenza no Paraná foi a das <strong>crianças até 6 anos — 708 casos</strong>.</li>\n      <li><span class=\"chip\">SAÚDE</span> <strong>E, ao mesmo tempo, tudo cai:</strong> SRAG total na SE 29/2026 <strong>−15,5%</strong>; acumulado de <strong>15.999</strong> hospitalizações em 2026 contra <strong>18.944</strong> no mesmo período do ano passado. Sem contradição — são duas perguntas diferentes.</li>\n      <li><span class=\"chip good\">SAÚDE</span> <strong>Nosso anel de passeios de um dia lidera a queda:</strong> a Regional de Saúde <strong>Cornélio Procópio</strong> teve a maior redução entre todas as regionais no mesmo boletim: <strong>−54,4%</strong>.</li>\n      <li><span class=\"chip\">VACINA</span> <strong>Proteção-ninho em vez de picada:</strong> o Paraná aplicou <strong>413.221</strong> doses de vacina contra a gripe em crianças de 6 meses a menos de 6 anos. Nosso bebê, com um mês, é jovem demais — é protegido só pelas pessoas ao redor.</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Confirmado hoje mesmo:</strong> o Sesc Londrina Cadeião abre sábado <em>e</em> domingo das <strong>9h às 18h</strong>, todas as exposições gratuitas, domingo às <strong>17h \"Show com Souza\"</strong>. Duas ofertas terminam em 08/08 e 09/08.</li>\n      <li><span class=\"chip good\">PASSEIO</span> <strong>CineSolar Ourinhos, qua 05/08:</strong> reconfirmado hoje de novo no site da cidade — cinema ao ar livre, 19h curtas, 20h \"A Pequena Sereia\", entrada <strong>e pipoca gratuitas</strong>.</li>\n      <li><span class=\"chip\">SAÚDE</span> <strong>Dengue estatisticamente calmo, mas não ausente:</strong> o Informe nº 23 (SE 01–28/2026) segue sendo o dado mais recente — 19ª Regional Jacarezinho <strong>84</strong> casos, <strong>0</strong> óbitos. Um óbito consta na regional vizinha.</li>\n      <li><span class=\"chip\">CINEMA</span> <strong>Não hoje, mas em 14/08:</strong> \"Patrulha Canina — O Filme dos Dinossauros\" foi adiado de julho para <strong>sexta-feira, 14/08/2026</strong>. Quem tiver a data antiga na agenda, risca.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Viernes 31 de julio, cambio de mes — y un fin de semana que no se podía pedir mejor: <strong>sábado y domingo, ambos a 27 °C, ambos con 0% de lluvia</strong>, según dos portales consultados de forma independiente. Esa es la mitad buena del día. La otra mitad viene del boletín de salud más reciente del estado, y a primera vista suena tranquilizador, y a la segunda, para nada: los casos respiratorios graves en Paraná están <em>bajando</em> bastante en la comparación anual — y, aun así, en la semana hasta el 27 de julio, el grupo de edad con <strong>más hospitalizaciones por gripe fue el de los niños de hasta 6 años</strong>. Las dos cosas son ciertas al mismo tiempo, y para una casa con una niña de un mes, eso cambia el plan del fin de semana. Por eso, hoy no se hace más grande, sino <strong>más pequeño y más cerca</strong>.</p>\n    <ul>\n      <li><span class=\"chip good\">CLIMA</span> <strong>El fin de semana está asegurado:</strong> Climatempo indica sáb <strong>14–27 °C</strong>, dom 15–27 °C, lun 16–27 °C — siempre con <strong>0% de lluvia</strong>. theweather.com confirma 0% para los tres días. Dos portales, misma lluvia.</li>\n      <li><span class=\"chip\">CLIMA</span> <strong>Pequeña corrección a la baja:</strong> ayer el modelo todavía mostraba 28 °C para sáb/dom, hoy son 27 °C. Las noches se mantienen en <strong>14–15 °C</strong> — para el bebé por la noche, una chamarra larga.</li>\n      <li><span class=\"chip hot\">BEBÉ</span> <strong>El número de la semana:</strong> en la <strong>SE 29/2026</strong> (semana hasta el 27/07), el grupo de edad con más hospitalizaciones por influenza en Paraná fue el de los <strong>niños hasta 6 años — 708 casos</strong>.</li>\n      <li><span class=\"chip\">SALUD</span> <strong>Y, al mismo tiempo, todo baja:</strong> SRAG total en la SE 29/2026 <strong>−15,5%</strong>; acumulado de <strong>15.999</strong> hospitalizaciones en 2026 contra <strong>18.944</strong> en el mismo periodo del año pasado. Sin contradicción — son dos preguntas distintas.</li>\n      <li><span class=\"chip good\">SALUD</span> <strong>Nuestro anillo de excursiones de un día encabeza la baja:</strong> la Regional de Saúde <strong>Cornélio Procópio</strong> tuvo la mayor reducción entre todas las regiones en el mismo boletín: <strong>−54,4%</strong>.</li>\n      <li><span class=\"chip\">VACUNACIÓN</span> <strong>Protección de capullo en lugar de piquete:</strong> Paraná aplicó <strong>413.221</strong> dosis de vacuna contra la gripe a niños de 6 meses a menos de 6 años. Nuestro bebé, con un mes, es demasiado joven — solo queda protegido a través de la gente a su alrededor.</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Confirmado hoy mismo:</strong> el Sesc Londrina Cadeião abre sábado <em>y</em> domingo de <strong>9:00 a 18:00</strong>, todas las exposiciones gratis, domingo a las <strong>17:00 el \"Show com Souza.\"</strong> Dos ofertas vencen el 08/08 y el 09/08.</li>\n      <li><span class=\"chip good\">PASEO</span> <strong>CineSolar Ourinhos, mié 05/08:</strong> reconfirmado hoy otra vez en el sitio de la ciudad — cine al aire libre, 19:00 cortometrajes, 20:00 \"A Pequena Sereia,\" entrada <strong>y palomitas gratis</strong>.</li>\n      <li><span class=\"chip\">SALUD</span> <strong>El dengue sigue estadísticamente tranquilo, pero no ausente:</strong> el Informe nº 23 (SE 01–28/2026) sigue siendo el dato más reciente — 19ª Regional Jacarezinho <strong>84</strong> casos, <strong>0</strong> muertes. Hay una muerte en la regional vecina.</li>\n      <li><span class=\"chip\">CINE</span> <strong>No hoy, sino el 14/08:</strong> \"Patrulha Canina — O Filme dos Dinossauros\" se pospuso de julio al <strong>viernes 14/08/2026</strong>. Quien tenga la fecha vieja en el calendario, que la tache.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Freitag, der 31. Juli — Rotationsthema <em>Reise &amp; Verkehr</em>, achte Folge, und der Anlass kommt aus Minas Gerais: seit Sonntag sind auf der BR-116 acht Menschen bei drei schweren Unfällen ums Leben gekommen, meldet <em>O Estado de Minas</em> am 30. Juli. Die Schulferien enden, die Bundesstraßen sind voll, und die PRF hat für genau dieses Zeitfenster 300 Drohnen über Brasiliens meistbefahrene Strecken geschickt. Daraus wird das Wortfeld des Tages: wie man auf Portugiesisch und Spanisch über Tempolimits, Kontrollen, Bußgelder und Unfälle spricht — inklusive eines Wortes, das aus dem Deutschen kommt und in Brasilien etwas völlig anderes bedeutet als hier. <strong>12 Einträge, davon 3 Verben mit voller Konjugation</strong>, plus 3 Auffrischungen vom 3. und 10. Juli.</p>\n    <ul>\n      <li><span class=\"chip hot\">FALSE FRIEND</span> <strong>der Blitzer ≠ a blitz</strong> — auf Deutsch ist ein Blitzer ein Radargerät, in Brasilien ist <em>a blitz</em> eine Polizeikontrolle. Und das Wort ist deutsch: Priberam führt es als <em>„palavra alemã Blitz, redução de Blitzkrieg\"</em>. <span class=\"src\"><a href=\"https://dicionario.priberam.org/blitz\">priberam.org</a></span></li>\n      <li><span class=\"chip\">BR-PT</span> <strong>a parada / o ponto ↔ a paragem</strong> — Brasilien sagt <em>parada</em> oder <em>ponto de ônibus</em>, Portugal <em>paragem de autocarro</em>. Für deutsche und englische Augen ein Fallstrick: mit einer Parade hat das nichts zu tun. <span class=\"src\"><a href=\"https://ciberduvidas.iscte-iul.pt/consultorio/perguntas/parada-e-paragem--sinonimos/31418\">ciberduvidas.iscte-iul.pt</a></span></li>\n      <li><span class=\"chip\">KONJUGATION</span> <strong>ich bin verunglückt, aber ich habe überschritten</strong> — <em>verunglücken</em> nimmt im Perfekt <strong>sein</strong> (Zustandswechsel), <em>überschreiten</em> nimmt <strong>haben</strong>. Portugiesisch und Spanisch kennen dieses Problem nicht. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/verungl%C3%BCcken.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip good\">PHRASE</span> <strong>o pardal</strong> — brasilianischer Spitzname für den festen Blitzer: „der Spatz\", weil die Kastenkonstruktion auf ihrem Mast hockt wie ein Vogel auf der Stange. <span class=\"src\"><a href=\"https://guiadoscuriosos.com.br/cotidiano/por-que-os-radares-de-transito-ganharam-o-apelido-de-pardais/\">guiadoscuriosos.com.br</a></span></li>\n      <li>Der Anlass: <strong>acht Tote auf der BR-116 seit Sonntag</strong>, in drei schweren Unfällen — allein bei einer Frontalkollision starben fünf Menschen. Von Januar bis Mai zählte Minas Gerais 3.756 Unfälle auf Bundesstraßen, 259 davon mit Todesfolge. <span class=\"src\"><a href=\"https://www.em.com.br/gerais/2026/07/7470514-fim-de-mes-critico-exige-atencao-total-nas-estradas.html\">em.com.br</a></span></li>\n      <li>Die Zahl hinter <em>a multa</em>: <strong>mehr als 50 % über dem Limit kostet R$ 880,41</strong> plus sieben Punkte — bei Wiederholung R$ 2.641,23. Bis 20 % drüber sind es R$ 130,16. <span class=\"src\"><a href=\"https://www.radarnobrasil.com/multas/valor\">radarnobrasil.com</a></span></li>\n      <li><span class=\"chip\">GENUS</span> <strong>die Vorfahrt (f) ↔ a preferência (f) ↔ el derecho de paso (m)</strong> — Portugiesisch bleibt beim Femininum, Spanisch kann femininin (<em>la preferencia</em>) oder maskulin (<em>el derecho de paso</em>), je nach Formulierung.</li>\n    </ul></div>",
      "latestTldrHtmlByLang": {

        "en": "<div class=\"tldr\"><p class=\"lead\">Friday, July 31 — rotation theme <em>Travel &amp; Traffic</em>, eighth installment, and today's hook comes straight out of Minas Gerais: since Sunday, eight people have died in three serious crashes on the BR-116 highway, reports <em>O Estado de Minas</em> on July 30. School vacation is ending, the federal highways are packed, and for exactly this window the PRF has sent 300 drones over Brazil's busiest routes. That gives us today's word field: how to talk about speed limits, checkpoints, fines, and accidents in Portuguese and Spanish — including one word that comes from German and means something completely different in Brazil than it does here. <strong>12 entries, 3 of them verbs with full conjugation</strong>, plus 3 refreshers from July 3 and July 10.</p>\n    <ul>\n      <li><span class=\"chip hot\">FALSE FRIEND</span> <strong>der Blitzer ≠ a blitz</strong> — in German, a <em>Blitzer</em> is a speed camera; in Brazil, <em>a blitz</em> is a police checkpoint. And the word really is German: Priberam lists it as <em>„palavra alemã Blitz, redução de Blitzkrieg\"</em>. <span class=\"src\"><a href=\"https://dicionario.priberam.org/blitz\">priberam.org</a></span></li>\n      <li><span class=\"chip\">BR-PT</span> <strong>a parada / o ponto ↔ a paragem</strong> — Brazil says <em>parada</em> or <em>ponto de ônibus</em>, Portugal says <em>paragem de autocarro</em>. A trap for German and English eyes: it has nothing to do with a parade. <span class=\"src\"><a href=\"https://ciberduvidas.iscte-iul.pt/consultorio/perguntas/parada-e-paragem--sinonimos/31418\">ciberduvidas.iscte-iul.pt</a></span></li>\n      <li><span class=\"chip\">CONJUGATION</span> <strong>ich bin verunglückt, aber ich habe überschritten</strong> — <em>verunglücken</em> takes <strong>sein</strong> in the perfect (change of state), <em>überschreiten</em> takes <strong>haben</strong>. Portuguese and Spanish don't have this problem. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/verungl%C3%BCcken.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip good\">PHRASE</span> <strong>o pardal</strong> — Brazilian nickname for the fixed speed camera: \"the sparrow,\" because the box sits on its pole like a bird perched on a wire. <span class=\"src\"><a href=\"https://guiadoscuriosos.com.br/cotidiano/por-que-os-radares-de-transito-ganharam-o-apelido-de-pardais/\">guiadoscuriosos.com.br</a></span></li>\n      <li>The hook: <strong>eight dead on the BR-116 since Sunday</strong>, in three serious crashes — a single head-on collision alone killed five people. From January to May, Minas Gerais counted 3,756 crashes on federal highways, 259 of them fatal. <span class=\"src\"><a href=\"https://www.em.com.br/gerais/2026/07/7470514-fim-de-mes-critico-exige-atencao-total-nas-estradas.html\">em.com.br</a></span></li>\n      <li>The number behind <em>a multa</em>: <strong>more than 50% over the limit costs R$ 880.41</strong> plus seven points — R$ 2,641.23 on a repeat offense. Up to 20% over, it's R$ 130.16. <span class=\"src\"><a href=\"https://www.radarnobrasil.com/multas/valor\">radarnobrasil.com</a></span></li>\n      <li><span class=\"chip\">GENDER</span> <strong>die Vorfahrt (f) ↔ a preferência (f) ↔ el derecho de paso (m)</strong> — Portuguese stays feminine, Spanish can be feminine (<em>la preferencia</em>) or masculine (<em>el derecho de paso</em>), depending on the phrasing.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Sexta-feira, 31 de julho — tema da rotação <em>Viagem &amp; Trânsito</em>, oitavo capítulo, e o motivo vem de Minas Gerais: desde domingo, oito pessoas morreram em três acidentes graves na BR-116, segundo o <em>O Estado de Minas</em> de 30 de julho. As férias escolares estão terminando, as rodovias federais estão cheias, e a PRF enviou justamente para essa janela 300 drones sobre as rotas mais movimentadas do Brasil. Daí sai o campo lexical de hoje: como se fala, em português e espanhol, sobre limites de velocidade, blitze, multas e acidentes — incluindo uma palavra que vem do alemão e que, no Brasil, significa algo completamente diferente do que aqui. <strong>12 itens, 3 deles verbos com conjugação completa</strong>, além de 3 revisões de 3 e 10 de julho.</p>\n    <ul>\n      <li><span class=\"chip hot\">FALSO COGNATO</span> <strong>der Blitzer ≠ a blitz</strong> — em alemão, <em>der Blitzer</em> é um radar de velocidade; no Brasil, <em>a blitz</em> é uma fiscalização policial de trânsito. E a palavra é mesmo alemã: o Priberam a registra como <em>„palavra alemã Blitz, redução de Blitzkrieg\"</em>. <span class=\"src\"><a href=\"https://dicionario.priberam.org/blitz\">priberam.org</a></span></li>\n      <li><span class=\"chip\">BR-PT</span> <strong>a parada / o ponto ↔ a paragem</strong> — o Brasil diz <em>parada</em> ou <em>ponto de ônibus</em>, Portugal diz <em>paragem de autocarro</em>. Uma pegadinha para olhos alemães e ingleses: não tem nada a ver com desfile. <span class=\"src\"><a href=\"https://ciberduvidas.iscte-iul.pt/consultorio/perguntas/parada-e-paragem--sinonimos/31418\">ciberduvidas.iscte-iul.pt</a></span></li>\n      <li><span class=\"chip\">CONJUGAÇÃO</span> <strong>ich bin verunglückt, aber ich habe überschritten</strong> — <em>verunglücken</em> usa <strong>sein</strong> no pretérito perfeito (mudança de estado), <em>überschreiten</em> usa <strong>haben</strong>. O português e o espanhol não têm e
