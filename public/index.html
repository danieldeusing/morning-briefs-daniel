      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Die europäische Durchsetzung stand hier vor sechs Tagen. Untergegangen war die Meldung, die einen deutschen Mittelständler härter trifft: Deutschland hat <em>seine</em> Behörde bestimmt. Seit dem <strong>29.07.2026</strong> gilt das KI-Marktüberwachungs- und Innovationsförderungsgesetz — die <strong>Bundesnetzagentur</strong> wird zentrale Marktüberwachung und Beschwerdestelle, die <strong>BaFin</strong> bekommt die regulierte Finanztätigkeit.<sup>[1][2]</sup> Einen Tag später hob FedEx Roboter von Dexterity im Hagerstown-Hub in den Produktionsmaßstab — ohne eine einzige Leistungszahl.<sup>[6]</sup> Muster des Tages: Zuständigkeiten werden präzise, Wirkungsnachweise nicht.</p>\n    <ul>\n      <li><span class=\"chip hot\">REG · DE</span> <strong>Das Gesetz hat einen Namen:</strong> KI-MIG, in Kraft seit dem <strong>29.07.2026</strong>. Die Bundesnetzagentur ist zentrale Marktüberwachungs- und Beschwerdestelle; dazu KI-Reallabore als Angebot.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">REG · DE</span> <strong>Banken und Versicherer bekommen die BaFin:</strong> <em>„Die Behörde übernimmt die Marktüberwachung für KI-Systeme, die in direktem Zusammenhang mit einer regulierten Finanztätigkeit stehen.\"</em><sup>[2]</sup></li>\n      <li><span class=\"chip\">REG · EU</span> <strong>Drei Daten, kein Widerspruch:</strong> 02.08.2026 Transparenz + Marktüberwachung Anhang III, 02.12.2027 Hochrisiko, <strong>02.08.2028</strong> Anhang I — letzteres per Digital Omnibus um ein Jahr nach hinten geschoben. Zwei Behörden-Fristen, eine Unternehmens-Frist.<sup>[2][3][4]</sup></li>\n      <li><span class=\"chip hot\">DEPLOY · US</span> <strong>Produktionsmaßstab ohne Zahl:</strong> FedEx und Dexterity heben das autonome Trailer-Beladen am 30.07. über den Pilotstandort hinaus — kein Bestand, kein Durchsatz, keine Fehlerquote.<sup>[6]</sup></li>\n      <li><span class=\"chip\">DEPLOY · US</span> <strong>Was drinsteht:</strong> zweiarmiges „Mech\"-System, Weltmodell „Foresight\", ein <em>„blueprint for network expansion\"</em>. Netzkontext: zehntausende Trailer täglich.<sup>[6]</sup></li>\n      <li><span class=\"chip\">FINANZEN · BR</span> <strong>Brasilien hat das Budget, nicht die Aufsicht:</strong> R$ 50,4 Mrd. Technikbudget 2026, davon KI 2025 R$ 826 Mio. — hier am 02.08. schon behandelt. Neu ist das Datum für den Rest: <strong>24.–26.08.</strong><sup>[7]</sup></li>\n      <li><span class=\"chip\">STUDIE</span> <strong>Alt, aber im Umlauf:</strong> Die drei Adoptionszahlen dieser Woche sind fünf bis vierzehn Monate alt — Bitkom (11.03.), KI-Index Mittelstand (Feldzeit 11/2025), Gartner (25.06.<strong>2025</strong>).<sup>[8][9][10]</sup></li>\n      <li><span class=\"chip good\">twiceD</span> Zwei Ideen: eine <strong>Ereignisbrücke für die eine Roboterzelle</strong> und ein <strong>Merkmals-Screening für Kredit- und Tarifmodelle</strong>.</li>\n    </ul></div>",
      "latestTldrHtmlByLang": {
        "de": "<div class=\"tldr\"><p class=\"lead\">Die europäische Durchsetzung stand hier vor sechs Tagen. Untergegangen war die Meldung, die einen deutschen Mittelständler härter trifft: Deutschland hat <em>seine</em> Behörde bestimmt. Seit dem <strong>29.07.2026</strong> gilt das KI-Marktüberwachungs- und Innovationsförderungsgesetz — die <strong>Bundesnetzagentur</strong> wird zentrale Marktüberwachung und Beschwerdestelle, die <strong>BaFin</strong> bekommt die regulierte Finanztätigkeit.<sup>[1][2]</sup> Einen Tag später hob FedEx Roboter von Dexterity im Hagerstown-Hub in den Produktionsmaßstab — ohne eine einzige Leistungszahl.<sup>[6]</sup> Muster des Tages: Zuständigkeiten werden präzise, Wirkungsnachweise nicht.</p>\n    <ul>\n      <li><span class=\"chip hot\">REG · DE</span> <strong>Das Gesetz hat einen Namen:</strong> KI-MIG, in Kraft seit dem <strong>29.07.2026</strong>. Die Bundesnetzagentur ist zentrale Marktüberwachungs- und Beschwerdestelle; dazu KI-Reallabore als Angebot.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">REG · DE</span> <strong>Banken und Versicherer bekommen die BaFin:</strong> <em>„Die Behörde übernimmt die Marktüberwachung für KI-Systeme, die in direktem Zusammenhang mit einer regulierten Finanztätigkeit stehen.\"</em><sup>[2]</sup></li>\n      <li><span class=\"chip\">REG · EU</span> <strong>Drei Daten, kein Widerspruch:</strong> 02.08.2026 Transparenz + Marktüberwachung Anhang III, 02.12.2027 Hochrisiko, <strong>02.08.2028</strong> Anhang I — letzteres per Digital Omnibus um ein Jahr nach hinten geschoben. Zwei Behörden-Fristen, eine Unternehmens-Frist.<sup>[2][3][4]</sup></li>\n      <li><span class=\"chip hot\">DEPLOY · US</span> <strong>Produktionsmaßstab ohne Zahl:</strong> FedEx und Dexterity heben das autonome Trailer-Beladen am 30.07. über den Pilotstandort hinaus — kein Bestand, kein Durchsatz, keine Fehlerquote.<sup>[6]</sup></li>\n      <li><span class=\"chip\">DEPLOY · US</span> <strong>Was drinsteht:</strong> zweiarmiges „Mech\"-System, Weltmodell „Foresight\", ein <em>„blueprint for network expansion\"</em>. Netzkontext: zehntausende Trailer täglich.<sup>[6]</sup></li>\n      <li><span class=\"chip\">FINANZEN · BR</span> <strong>Brasilien hat das Budget, nicht die Aufsicht:</strong> R$ 50,4 Mrd. Technikbudget 2026, davon KI 2025 R$ 826 Mio. — hier am 02.08. schon behandelt. Neu ist das Datum für den Rest: <strong>24.–26.08.</strong><sup>[7]</sup></li>\n      <li><span class=\"chip\">STUDIE</span> <strong>Alt, aber im Umlauf:</strong> Die drei Adoptionszahlen dieser Woche sind fünf bis vierzehn Monate alt — Bitkom (11.03.), KI-Index Mittelstand (Feldzeit 11/2025), Gartner (25.06.<strong>2025</strong>).<sup>[8][9][10]</sup></li>\n      <li><span class=\"chip good\">twiceD</span> Zwei Ideen: eine <strong>Ereignisbrücke für die eine Roboterzelle</strong> und ein <strong>Merkmals-Screening für Kredit- und Tarifmodelle</strong>.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">European enforcement was the story here six days ago. Buried underneath was the news that hits a German mid-sized company harder: Germany has named <em>its</em> own authority. Since 2026-07-29, the AI Market Surveillance and Innovation Promotion Act has applied — the Bundesnetzagentur becomes the central market-surveillance and complaints body, BaFin gets regulated financial activity.<sup>[1][2]</sup> One day later, FedEx pushed Dexterity's robots into production scale at the Hagerstown hub — without a single performance figure.<sup>[6]</sup> Today's pattern: jurisdictions are getting precise, proof of impact isn't.</p>\n    <ul>\n      <li><span class=\"chip hot\">REG · DE</span> <strong>The law has a name:</strong> KI-MIG, in force since 2026-07-29. The Bundesnetzagentur is the central market-surveillance and complaints body; plus AI regulatory sandboxes on offer.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">REG · DE</span> <strong>Banks and insurers get BaFin:</strong> <em>„The agency takes over market surveillance for AI systems directly tied to regulated financial activity.\"</em><sup>[2]</sup></li>\n      <li><span class=\"chip\">REG · EU</span> <strong>Three dates, no contradiction:</strong> 2026-08-02 transparency + market surveillance under Annex III, 2027-12-02 high-risk, <strong>2028-08-02</strong> Annex I — the latter pushed back a year via the Digital Omnibus. Two authority deadlines, one company deadline.<sup>[2][3][4]</sup></li>\n      <li><span class=\"chip hot\">DEPLOY · US</span> <strong>Production scale, no number:</strong> FedEx and Dexterity take autonomous trailer loading beyond the pilot site on 07/30 — no fleet count, no throughput, no error rate.<sup>[6]</sup></li>\n      <li><span class=\"chip\">DEPLOY · US</span> <strong>What's in it:</strong> a two-armed \"Mech\" system, world model \"Foresight,\" a \"blueprint for network expansion.\" Network context: tens of thousands of trailers daily.<sup>[6]</sup></li>\n      <li><span class=\"chip\">FINANCE · BR</span> <strong>Brazil has the budget, not the oversight:</strong> R$50.4 billion tech budget for 2026, of which AI came to R$826 million in 2025 — covered here on 08/02 already. New is the date for the rest: <strong>08/24–26</strong>.<sup>[7]</sup></li>\n      <li><span class=\"chip\">STUDY</span> <strong>Old, but still circulating:</strong> this week's three adoption figures are five to fourteen months old — Bitkom (03/11), KI-Index Mittelstand (fielded 11/2025), Gartner (2025-06-25).<sup>[8][9][10]</sup></li>\n      <li><span class=\"chip good\">twiceD</span> Two ideas: an <strong>event bridge for the one robot cell</strong> and a <strong>feature screening for credit and pricing models</strong>.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">A fiscalização europeia foi o tema aqui há seis dias. Passou quase despercebida a notícia que atinge mais duramente uma empresa média alemã: a Alemanha definiu <em>sua</em> própria autoridade. Desde 29/07/2026, vale a Lei de Fiscalização de Mercado e Fomento à Inovação em IA — a Bundesnetzagentur se torna a fiscalização de mercado central e o canal de reclamações, a BaFin fica com a atividade financeira regulada.<sup>[1][2]</sup> Um dia depois, a FedEx levou os robôs da Dexterity à escala de produção no hub de Hagerstown — sem um único número de desempenho.<sup>[6]</sup> Padrão do dia: as competências ficam precisas, as provas de resultado não.</p>\n    <ul>\n      <li><span class=\"chip hot\">REGULAÇÃO · DE</span> <strong>A lei tem um nome:</strong> KI-MIG, em vigor desde 29/07/2026. A Bundesnetzagentur é a fiscalização de mercado central e o canal de reclamações; além disso, oferece sandboxes regulatórios de IA.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">REGULAÇÃO · DE</span> <strong>Bancos e seguradoras ficam com a BaFin:</strong> <em>„A autoridade assume a fiscalização de mercado dos sistemas de IA diretamente relacionados a uma atividade financeira regulada.\"</em><sup>[2]</sup></li>\n      <li><span class=\"chip\">REGULAÇÃO · UE</span> <strong>Três datas, nenhuma contradição:</strong> 02/08/2026 transparência + fiscalização de mercado do Anexo III, 02/12/2027 alto risco, <strong>02/08/2028</strong> Anexo I — este último adiado em um ano pelo Digital Omnibus. Dois prazos de autoridade, um prazo de empresa.<sup>[2][3][4]</sup></li>\n      <li><span class=\"chip hot\">DEPLOY · US</span> <strong>Escala de produção sem número:</strong> a FedEx e a Dexterity levam o carregamento autônomo de carretas além do site-piloto em 30/07 — sem frota, sem throughput, sem taxa de erro.<sup>[6]</sup></li>\n      <li><span class=\"chip\">DEPLOY · US</span> <strong>O que consta:</strong> sistema de dois braços \"Mech\", modelo de mundo \"Foresight\", um \"blueprint for network expansion\". Contexto de rede: dezenas de milhares de carretas por dia.<sup>[6]</sup></li>\n      <li><span class=\"chip\">FINANÇAS · BR</span> <strong>O Brasil tem o orçamento, não a fiscalização:</strong> R$ 50,4 bilhões de orçamento de tecnologia para 2026, dos quais R$ 826 milhões em IA no ano de 2025 — já tratado aqui em 02/08. Novidade é a data para o restante: <strong>24–26/08</strong>.<sup>[7]</sup></li>\n      <li><span class=\"chip\">ESTUDO</span> <strong>Velhas, mas em circulação:</strong> os três números de adoção desta semana têm de cinco a quatorze meses — Bitkom (11/03), KI-Index Mittelstand (coleta em 11/2025), Gartner (25/06/2025).<sup>[8][9][10]</sup></li>\n      <li><span class=\"chip good\">twiceD</span> Duas ideias: uma <strong>ponte de eventos para a célula robótica única</strong> e uma <strong>triagem de atributos para modelos de crédito e tarifação</strong>.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">La fiscalización europea fue el tema aquí hace seis días. Pasó casi inadvertida la noticia que golpea más fuerte a una empresa mediana alemana: Alemania definió <em>su propia</em> autoridad. Desde el 29/07/2026 aplica la Ley de Vigilancia de Mercado y Fomento a la Innovación en IA — la Bundesnetzagentur se convierte en la vigilancia de mercado central y el canal de quejas, la BaFin se queda con la actividad financiera regulada.<sup>[1][2]</sup> Un día después, FedEx llevó los robots de Dexterity a escala de producción en el hub de Hagerstown — sin una sola cifra de desempeño.<sup>[6]</sup> Patrón del día: las competencias se vuelven precisas, las pruebas de impacto no.</p>\n    <ul>\n      <li><span class=\"chip hot\">REGULACIÓN · DE</span> <strong>La ley tiene nombre:</strong> KI-MIG, vigente desde el 29/07/2026. La Bundesnetzagentur es la vigilancia de mercado central y el canal de quejas; además, ofrece sandboxes regulatorios de IA.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">REGULACIÓN · DE</span> <strong>Bancos y aseguradoras quedan con la BaFin:</strong> <em>„La autoridad asume la vigilancia de mercado de los sistemas de IA directamente relacionados con una actividad financiera regulada.\"</em><sup>[2]</sup></li>\n      <li><span class=\"chip\">REGULACIÓN · UE</span> <strong>Tres fechas, ninguna contradicción:</strong> 02/08/2026 transparencia + vigilancia de mercado del Anexo III, 02/12/2027 alto riesgo, <strong>02/08/2028</strong> Anexo I — esta última aplazada un año por el Digital Omnibus. Dos plazos de autoridad, un plazo de empresa.<sup>[2][3][4]</sup></li>\n      <li><span class=\"chip hot\">DEPLOY · US</span> <strong>Escala de producción sin cifra:</strong> FedEx y Dexterity llevan la carga autónoma de remolques más allá del sitio piloto el 30/07 — sin conteo de flota, sin throughput, sin tasa de error.<sup>[6]</sup></li>\n      <li><span class=\"chip\">DEPLOY · US</span> <strong>Lo que dice:</strong> sistema de dos brazos \"Mech\", modelo de mundo \"Foresight\", un \"blueprint for network expansion\". Contexto de red: decenas de miles de remolques al día.<sup>[6]</sup></li>\n      <li><span class=\"chip\">FINANZAS · BR</span> <strong>Brasil tiene el presupuesto, no la supervisión:</strong> R$ 50,4 mil millones de presupuesto tecnológico para 2026, de los cuales R$ 826 millones en IA en 2025 — ya tratado aquí el 02/08. Lo nuevo es la fecha para el resto: <strong>24–26/08</strong>.<sup>[7]</sup></li>\n      <li><span class=\"chip\">ESTUDIO</span> <strong>Viejas, pero en circulación:</strong> las tres cifras de adopción de esta semana tienen entre cinco y catorce meses — Bitkom (11/03), KI-Index Mittelstand (levantamiento 11/2025), Gartner (25/06/2025).<sup>[8][9][10]</sup></li>\n      <li><span class=\"chip good\">twiceD</span> Dos ideas: un <strong>puente de eventos para la única celda robótica</strong> y un <strong>filtro de atributos para modelos de crédito y tarifas</strong>.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Von den sechs Neuzugängen des Samstagslaufs tragen zwei denselben ungewöhnlichen Titel: <em>Forward Deployed Engineer</em>. Camunda sucht einen für EMEA, 100 % remote; bei JetBrains steht ein Principal-FDE seit Tagen auf Platz zwei des gesamten Boards. Zusammen mit Cognitions „Deployed Engineer – EMEA\" sind das <strong>drei von neun</strong> Intriguing-Einträgen für dieselbe Rolle — ein Ingenieur, der beim Kunden sitzt und dessen Integration selbst baut. Das ist ziemlich genau das, was twiceD als Projektgeschäft verkauft, nur mit Arbeitsvertrag statt Stundensatz. Der zweite Teil des Tages ist unbequemer: Eine Zahl, die in diesem Brief seit dem 1. Juli in sieben Ausgaben stand, stimmt so nicht — die Erhebungs-Betreiberin selbst nennt eine andere.</p>\n    <ul>\n      <li><span class=\"chip hot\">Intriguing</span> <strong>Camunda, „AI Forward Deployed Engineer, EMEA\"</strong> — 100 % remote, Arbeitgeber mit Berliner Wurzeln, Fit <strong>69</strong>. Das Board führt <strong>157.300–253.600 US$/Jahr</strong> ohne Sternchen, also als bestätigt. <em>Ein eigener Abruf konnte die Spanne heute nicht reproduzieren</em> — dazu unten mehr.<sup>[1][2]</sup></li>\n      <li><span class=\"chip\">Intriguing</span> <strong>JetBrains, „Principal Forward Deployed Engineer – AI-Native Software Development\"</strong>, sieben EU-Städte, Fit <strong>82</strong> — zweithöchster Wert des Boards, heute live nachgezogen. Weiterhin <strong>ohne jede Vergütungsangabe</strong>, und die Begründung addiert sich auf 71 mit dem Zusatz „adjusted 82\".<sup>[3]</sup></li>\n      <li><span class=\"chip warn\">Korrektur</span> <strong>Der Monatsumsatz-Vergleich war falsch basiert.</strong> Dieser Brief druckte siebenmal „8.432 € → 6.653 €, −21 %\". Der Blog der Erhebungs-Betreiberin selbst schreibt: <strong>„Der durchschnittliche monatliche Projektumsatz sinkt 2026 von 8.022 € auf 6.653 €\"</strong> — <strong>rund −17 %</strong>. Der 2026er-Wert stimmt in beiden Quellen; die Basis nicht.<sup>[4]</sup></li>\n      <li><span class=\"chip\">Rate</span> <strong>Der Preis ist nicht das Problem.</strong> Derselbe Kompass: Stundensatz <strong>103 €</strong> nach 104 € — „praktisch stabil\", und laut Betreiberin seit über zehn Jahren Erhebung <strong>nie zuvor gesunken</strong>. Fachgebiet Software &amp; Webentwicklung: <strong>91 €/h</strong>, 54 % Einkommenszufriedenheit.<sup>[4]</sup></li>\n      <li><span class=\"chip\">Board</span> <strong>113 Listings</strong> (93 Freelance, 11 Employee, 9 Intriguing), netto <strong>±0</strong>: sechs neu, sechs gefallen — und alle sechs Abgänge standen bei exakt Fit 60. Zum <strong>sechsten Lauf in Folge</strong> verschiebt sich unter den Bestandseinträgen kein einziger Score. Spitze seit dem 31.07. unverändert 83.</li>\n      <li><span class=\"chip warn\">Vorbehalt</span> <strong>104 der 113 Einträge sind Übernahmen</strong> (92 % nach 89 % gestern) — und <strong>97 davon tragen den Stempel „carried forward from 2026-08-06\"</strong>, sind also den dritten Tag in Folge nicht einzeln nachgeprüft. Live gezogen wurden neun: die sechs Neuen plus exakt die Top 3.</li>\n      <li><span class=\"chip warn\">Vorbehalt</span> <strong>„Neu gefunden\" heißt nicht „neu ausgeschrieben\".</strong> Der beste Neuzugang (Computer Futures, Java/Spring Boot, 100 % remote, Fit 73) nennt in der Anzeige <strong>Start 01.03.2026</strong> — fünf Monate in der Vergangenheit.</li>\n      <li><span class=\"chip\">Employee</span> <strong>Drei Namen von der Wunschliste sind angekommen</strong>: Aleph Alpha (Fit 60), JetBrains „AI for Code\" (58) und Helsing (31) — letzteres mit hartem Tor: Standort-Komponente <strong>0 von 20</strong> wegen der Sicherheitsüberprüfung.</li>\n      <li><span class=\"chip\">Rate</span> <strong>Das Board bleibt unter der Zielmarke.</strong> Von 78 Euro-Stundenbändern starten <strong>35 bei 85 €/h, 35 bei 90 €/h</strong>, nur <strong>sieben</strong> bei 95 €/h oder höher.</li>\n      <li><span class=\"chip\">Vergabe</span> <strong>Keine neue TED-Ausschreibung im Filter.</strong> Die Frist zur Bekanntmachung 512867-2026 (25.08., 11:00 MESZ) steht unverändert aus der Ausgabe vom 07.08.; seitdem ist <strong>kein Werktag vergangen</strong>, es bleiben dieselben elf.<sup>[5]</sup></li>\n    </ul></div>",

      <li><span class=\"chip\">Vergabe</span> <strong>Keine neue TED-Ausschreibung im Filter.</strong> Die Frist zur Bekanntmachung 512867-2026 (25.08., 11:00 MESZ) steht unverändert aus der Ausgabe vom 07.08.; seitdem ist <strong>kein Werktag vergangen</strong>, es bleiben dieselben elf.<sup>[5]</sup></li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Of the six newcomers in Saturday's run, two share an unusual title: <em>Forward Deployed Engineer</em>. Camunda is hiring one for EMEA, 100% remote; at JetBrains, a Principal FDE has held rank two on the entire board for days. Together with Cognition's \"Deployed Engineer – EMEA,\" that's <strong>three of nine</strong> Intriguing entries for the same role — an engineer who sits with the customer and builds the integration themselves. That's pretty much what twiceD sells as project work, just with an employment contract instead of an hourly rate. The second part of today is less comfortable: a figure that has run in this brief in seven issues since July 1 doesn't hold up — the survey operator itself cites a different one.</p>\n    <ul>\n      <li><span class=\"chip hot\">Intriguing</span> <strong>Camunda, \"AI Forward Deployed Engineer, EMEA\"</strong> — 100% remote, employer with Berlin roots, fit <strong>69</strong>. The board lists <strong>$157,300–253,600/year</strong> with no asterisk, meaning confirmed. <em>An independent check could not reproduce that range today</em> — more on that below.<sup>[1][2]</sup></li>\n      <li><span class=\"chip\">Intriguing</span> <strong>JetBrains, \"Principal Forward Deployed Engineer – AI-Native Software Development,\"</strong> seven EU cities, fit <strong>82</strong> — the board's second-highest score, re-verified live today. Still <strong>no compensation figure at all</strong>, and the reasoning adds up to 71 with the appendix \"adjusted 82.\"<sup>[3]</sup></li>\n      <li><span class=\"chip warn\">Correction</span> <strong>The monthly-revenue comparison was based on the wrong number.</strong> This brief printed \"€8,432 → €6,653, −21%\" seven times. The survey operator's own blog states: <strong>\"average monthly project revenue in 2026 falls from €8,022 to €6,653\"</strong> — <strong>roughly −17%</strong>. The 2026 figure matches in both sources; the base year doesn't.<sup>[4]</sup></li>\n      <li><span class=\"chip\">Rate</span> <strong>Price isn't the problem.</strong> Same survey: hourly rate <strong>€103</strong>, down from €104 — \"practically stable,\" and per the operator, it had <strong>never fallen before</strong> in over ten years of surveying. Software &amp; web development specialty: <strong>€91/h</strong>, 54% income satisfaction.<sup>[4]</sup></li>\n      <li><span class=\"chip\">Board</span> <strong>113 listings</strong> (93 freelance, 11 employee, 9 intriguing), net <strong>±0</strong>: six new, six dropped — and all six departures sat at exactly fit 60. For the <strong>sixth run in a row</strong>, not a single score moved among the carried-over entries. Top score unchanged at 83 since Jul 31.</li>\n      <li><span class=\"chip warn\">Caveat</span> <strong>104 of the 113 entries are carry-overs</strong> (92%, up from 89% yesterday) — and <strong>97 of them carry the \"carried forward from 2026-08-06\" stamp</strong>, meaning they haven't been individually re-verified for the third day running. Nine were pulled live: the six new ones plus exactly the top 3.</li>\n      <li><span class=\"chip warn\">Caveat</span> <strong>\"Newly found\" doesn't mean \"newly posted.\"</strong> The best newcomer (Computer Futures, Java/Spring Boot, 100% remote, fit 73) states a <strong>start date of 2026-03-01</strong> in the listing — five months in the past.</li>\n      <li><span class=\"chip\">Employee</span> <strong>Three names from the wish list have shown up</strong>: Aleph Alpha (fit 60), JetBrains \"AI for Code\" (58), and Helsing (31) — the latter with a hard gate: location component <strong>0 out of 20</strong> due to the security clearance requirement.</li>\n      <li><span class=\"chip\">Rate</span> <strong>The board stays below the target mark.</strong> Of 78 euro hourly bands, <strong>35 start at €85/h, 35 at €90/h</strong>, and only <strong>seven</strong> at €95/h or higher.</li>\n      <li><span class=\"chip\">Procurement</span> <strong>No new TED tender in the filter.</strong> The deadline for notice 512867-2026 (Aug 25, 11:00 CEST) remains unchanged from the Aug 7 issue; <strong>no business day has passed</strong> since then, so the same eleven remain.<sup>[5]</sup></li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Das seis novidades da rodada de sábado, duas trazem o mesmo título incomum: <em>Forward Deployed Engineer</em>. A Camunda busca um para EMEA, 100% remoto; na JetBrains, um Principal FDE ocupa há dias o segundo lugar do board inteiro. Somando com o \"Deployed Engineer – EMEA\" da Cognition, são <strong>três das nove</strong> vagas Intriguing para o mesmo papel — um engenheiro que fica ao lado do cliente e constrói a integração ele mesmo. É praticamente o que a twiceD vende como negócio de projeto, só que com vínculo empregatício em vez de valor-hora. A segunda parte do dia é mais incômoda: um número que apareceu neste brief em sete edições desde 1º de julho está errado — a própria operadora da pesquisa cita outro valor.</p>\n    <ul>\n      <li><span class=\"chip hot\">Intriguing</span> <strong>Camunda, \"AI Forward Deployed Engineer, EMEA\"</strong> — 100% remoto, empregadora com raízes em Berlim, fit <strong>69</strong>. O board traz <strong>US$ 157.300–253.600/ano</strong> sem asterisco, ou seja, como confirmado. <em>Uma checagem independente não conseguiu reproduzir essa faixa hoje</em> — mais detalhes abaixo.<sup>[1][2]</sup></li>\n      <li><span class=\"chip\">Intriguing</span> <strong>JetBrains, \"Principal Forward Deployed Engineer – AI-Native Software Development\"</strong>, sete cidades da UE, fit <strong>82</strong> — segundo maior valor do board, reconfirmado ao vivo hoje. Continua <strong>sem qualquer indicação de remuneração</strong>, e a justificativa soma 71 com o adendo \"adjusted 82\".<sup>[3]</sup></li>\n      <li><span class=\"chip warn\">Correção</span> <strong>A comparação de faturamento mensal partiu de uma base errada.</strong> Este brief publicou sete vezes \"€ 8.432 → € 6.653, −21%\". O blog da própria operadora da pesquisa afirma: <strong>\"o faturamento médio mensal de projetos cai em 2026 de € 8.022 para € 6.653\"</strong> — <strong>cerca de −17%</strong>. O valor de 2026 bate nas duas fontes; a base, não.<sup>[4]</sup></li>\n      <li><span class=\"chip\">Rate</span> <strong>O preço não é o problema.</strong> Mesma pesquisa: valor-hora <strong>€ 103</strong>, ante € 104 — \"praticamente estável\", e segundo a operadora, <strong>nunca havia caído antes</strong> em mais de dez anos de levantamento. Especialidade software &amp; desenvolvimento web: <strong>€ 91/h</strong>, 54% de satisfação com a renda.<sup>[4]</sup></li>\n      <li><span class=\"chip\">Board</span> <strong>113 vagas</strong> (93 freelance, 11 CLT, 9 Intriguing), líquido <strong>±0</strong>: seis novas, seis saíram — e todas as seis saídas estavam em exatamente fit 60. Pela <strong>sexta rodada seguida</strong>, nenhum score se move entre as vagas já existentes. Topo segue em 83 desde 31/07.</li>\n      <li><span class=\"chip warn\">Ressalva</span> <strong>104 das 113 vagas são reaproveitadas</strong> (92% ante 89% ontem) — e <strong>97 delas trazem o carimbo \"carried forward from 2026-08-06\"</strong>, ou seja, não são reverificadas individualmente pelo terceiro dia seguido. Nove foram puxadas ao vivo: as seis novas mais exatamente as três primeiras.</li>\n      <li><span class=\"chip warn\">Ressalva</span> <strong>\"Encontrada agora\" não significa \"publicada agora\".</strong> A melhor novidade (Computer Futures, Java/Spring Boot, 100% remoto, fit 73) indica na própria vaga <strong>início em 01/03/2026</strong> — cinco meses no passado.</li>\n      <li><span class=\"chip\">CLT</span> <strong>Três nomes da lista de desejos apareceram</strong>: Aleph Alpha (fit 60), JetBrains \"AI for Code\" (58) e Helsing (31) — esta última com trava dura: componente de localização <strong>0 de 20</strong> por causa da checagem de segurança.</li>\n      <li><span class=\"chip\">Rate</span> <strong>O board segue abaixo da meta.</strong> Das 78 faixas em euros por hora, <strong>35 começam em € 85/h, 35 em € 90/h</strong>, e só <strong>sete</strong> a partir de € 95/h.</li>\n      <li><span class=\"chip\">Licitação</span> <strong>Nenhum edital novo no TED filtrado.</strong> O prazo do edital 512867-2026 (25/08, 11h00 CEST) segue igual ao da edição de 07/08; desde então <strong>nenhum dia útil se passou</strong>, restam os mesmos onze.<sup>[5]</sup></li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">De las seis novedades de la corrida del sábado, dos comparten el mismo título poco común: <em>Forward Deployed Engineer</em>. Camunda busca uno para EMEA, 100% remoto; en JetBrains, un Principal FDE lleva días en el segundo lugar de todo el tablero. Junto con el \"Deployed Engineer – EMEA\" de Cognition, son <strong>tres de las nueve</strong> entradas Intriguing para el mismo rol — un ingeniero que se sienta junto al cliente y construye la integración él mismo. Eso es casi exactamente lo que twiceD vende como negocio de proyectos, solo que con contrato laboral en vez de tarifa por hora. La segunda parte del día es más incómoda: una cifra que apareció en este brief en siete ediciones desde el 1 de julio está mal — la propia operadora de la encuesta cita otro valor.</p>\n    <ul>\n      <li><span class=\"chip hot\">Intriguing</span> <strong>Camunda, \"AI Forward Deployed Engineer, EMEA\"</strong> — 100% remoto, empleadora con raíces en Berlín, fit <strong>69</strong>. El tablero indica <strong>US$ 157.300–253.600/año</strong> sin asterisco, es decir, como confirmado. <em>Una verificación independiente no pudo reproducir esa banda hoy</em> — más detalles abajo.<sup>[1][2]</sup></li>\n      <li><span class=\"chip\">Intriguing</span> <strong>JetBrains, \"Principal Forward Deployed Engineer – AI-Native Software Development\"</strong>, siete ciudades de la UE, fit <strong>82</strong> — el segundo valor más alto del tablero, reconfirmado en vivo hoy. Sigue <strong>sin ninguna cifra de compensación</strong>, y la justificación suma 71 con el añadido \"adjusted 82\".<sup>[3]</sup></li>\n      <li><span class=\"chip warn\">Corrección</span> <strong>La comparación de ingresos mensuales partía de una base equivocada.</strong> Este brief publicó siete veces \"€ 8.432 → € 6.653, −21%\". El blog de la propia operadora de la encuesta dice: <strong>\"el ingreso mensual promedio por proyectos cae en 2026 de € 8.022 a € 6.653\"</strong> — <strong>alrededor de −17%</strong>. La cifra de 2026 coincide en ambas fuentes; la base no.<sup>[4]</sup></li>\n      <li><span class=\"chip\">Rate</span> <strong>El precio no es el problema.</strong> Misma encuesta: tarifa por hora <strong>€ 103</strong>, frente a € 104 — \"prácticamente estable\", y según la operadora, <strong>nunca había bajado antes</strong> en más de diez años de medición. Especialidad software y desarrollo web: <strong>€ 91/h</strong>, 54% de satisfacción con los ingresos.<sup>[4]</sup></li>\n      <li><span class=\"chip\">Board</span> <strong>113 vacantes</strong> (93 freelance, 11 empleo fijo, 9 Intriguing), neto <strong>±0</strong>: seis nuevas, seis salieron — y las seis salidas tenían exactamente fit 60. Por <strong>sexta corrida consecutiva</strong>, ningún puntaje se mueve entre las entradas heredadas. El máximo sigue en 83 desde el 31/07.</li>\n      <li><span class=\"chip warn\">Salvedad</span> <strong>104 de las 113 entradas son heredadas</strong> (92%, frente a 89% ayer) — y <strong>97 de ellas llevan el sello \"carried forward from 2026-08-06\"</strong>, es decir, no se reverifican individualmente por tercer día consecutivo. Nueve se revisaron en vivo: las seis nuevas más exactamente las tres primeras.</li>\n      <li><span class=\"chip warn\">Salvedad</span> <strong>\"Encontrada ahora\" no significa \"publicada ahora\".</strong> La mejor novedad (Computer Futures, Java/Spring Boot, 100% remoto, fit 73) indica en la propia vacante <strong>inicio el 01/03/2026</strong> — cinco meses en el pasado.</li>\n      <li><span class=\"chip\">Empleo</span> <strong>Aparecieron tres nombres de la lista de deseos</strong>: Aleph Alpha (fit 60), JetBrains \"AI for Code\" (58) y Helsing (31) — esta última con un candado duro: componente de ubicación <strong>0 de 20</strong> por la revisión de seguridad.</li>\n      <li><span class=\"chip\">Rate</span> <strong>El tablero se mantiene por debajo de la meta.</strong> De 78 bandas en euros por hora, <strong>35 empiezan en € 85/h, 35 en € 90/h</strong>, y solo <strong>siete</strong> desde € 95/h.</li>\n      <li><span class=\"chip\">Licitación</span> <strong>Ninguna convocatoria nueva de TED en el filtro.</strong> El plazo de la convocatoria 512867-2026 (25/08, 11:00 h CEST) sigue igual que en la edición del 07/08; desde entonces <strong>no ha pasado ningún día hábil</strong>, quedan los mismos once.<sup>[5]</sup></li>\n    </ul></div>"

45 (1 h) / <strong>R$ 60</strong> (Passaporte).</li>\n      <li><span class=\"chip good\">EVENT</span> <strong>Sonntag in Londrina, alles gratis:</strong> Parada do Limoeiro ab <strong>8 h</strong>, Messe mit Vätersegen im Santuário um <strong>11 h</strong>, Kindertheater „Só se entra nessa mata duas vezes\" um <strong>16 h</strong>.</li>\n      <li><span class=\"chip\">EVENT</span> <strong>Kern-Ring: nichts Datiertes.</strong> Für Ribeirão Claro und Jacarezinho ließ sich zum Vatertag erneut kein Termin belegen. Einzige lokale Option heute: Feira de Artesanato Jacarezinho, 9–17 h — draußen, bei 98 % Regen.</li>\n      <li><span class=\"chip\">BABY</span> <strong>Atemwege, die PR-Zahl ist alt:</strong> Letzter landeseigener SRAG-Stand ist <strong>SE 26/2026</strong> (10.07.) — <span class=\"stat\">13.782</span> Klinikaufnahmen 2026, <strong>−14,6 %</strong> gegenüber 2025, davon <strong>5.723 Kinder unter 6</strong>. National (<strong>SE 29/2026</strong>): Paraná weiter auf Alarmniveau.</li>\n      <li><span class=\"chip\">GESUNDHEIT</span> <strong>Dengue unverändert:</strong> Aktuellstes Bulletin bleibt <strong>nº 24 vom 04.08.2026</strong> (SE 01–30/2026). Zu Hause ruhig — <strong>94 Fälle, null Tote</strong> —, Londrina mit <span class=\"stat\">126,92</span> je 100.000 fast fünfmal so hoch.</li>\n      <li><span class=\"chip\">SCHULE</span> <strong>Montag ist Schule.</strong> Dia dos Pais ist kein Feiertag, der August hat kein Ferienfenster.</li>\n      <li><span class=\"chip\">TRIP</span> <strong>Vormerken:</strong> <strong>54ª EFAPI Expo</strong> in Santo Antônio da Platina, <strong>19.–23.08.</strong>, rund eine Stunde Fahrt — der Familientermin des Monats im Day-Trip-Ring.</li>\n    </ul></div>",

        "en": "<div class=\"tldr\"><p class=\"lead\">Saturday, August 8, and tomorrow is <strong>Dia dos Pais</strong>. Rarely has a weekend lined up so kindly: today brings the rain — but only during the day, \"<em>à noite o tempo fica firme</em>\" — and tomorrow's forecast sits at <strong>0.0 mm and 29°C</strong>, the warmest reading of the week. The program follows the same curve. Londrina's Father's Day headliner, the free <strong>Churras do Paizão</strong>, runs straight through from <strong>11 AM to 11 PM</strong> today — and its three music blocks fall in the evening, exactly when the sky clears. Sunday is nearly empty regionally, and that's not bad news — it's an invitation to spend it in your own backyard.</p>\n    <ul>\n      <li><span class=\"chip good\">WEATHER</span> <strong>Tomorrow is the day:</strong> Sun 08/09. <strong>19–29°C, 0.0 mm at 0%</strong> — the only day this week with zero chance of rain, and the warmest one at the same time.</li>\n      <li><span class=\"chip hot\">WEATHER</span> <strong>Today it's rain first, then calm:</strong> <strong>17–27°C, 6.2 mm at 72%</strong>, gusts up to <span class=\"stat\">40 km/h</span> — Climatempo explicitly says \"<em>chuva passageira durante o dia. À noite o tempo fica firme.</em>\" The evening is the dry window.</li>\n      <li><span class=\"chip good\">EVENT</span> <strong>Churras do Paizão, today, free admission:</strong> Londrina Norte Shopping, <strong>running straight through 11 AM–11 PM</strong>, live music at <strong>5:30, 7:30, and 9:00 PM</strong> — and right next door from 6 PM a <strong>classic car meetup</strong>, also free. Two events, one parking lot.</li>\n      <li><span class=\"chip good\">EVENT</span> <strong>Timing resolved — an all-day event:</strong> The event-specific report from 08/04 states \"<em>das 11h até às 23h</em>\"; the music is clustered in the evening. The <strong>kids' play area</strong> there costs R$ 35 (30 min) / R$ 45 (1 h) / <strong>R$ 60</strong> (all-day pass).</li>\n      <li><span class=\"chip good\">EVENT</span> <strong>Sunday in Londrina, all free:</strong> Parada do Limoeiro from <strong>8 AM</strong>, Mass with a father's blessing at the Santuário at <strong>11 AM</strong>, children's theater \"Só se entra nessa mata duas vezes\" at <strong>4 PM</strong>.</li>\n      <li><span class=\"chip\">EVENT</span> <strong>Core ring: nothing dated.</strong> For Ribeirão Claro and Jacarezinho, no dated event could be found for Father's Day again. Today's only local option: Feira de Artesanato Jacarezinho, 9 AM–5 PM — outdoors, with 98% chance of rain.</li>\n      <li><span class=\"chip\">BABY</span> <strong>Respiratory, the PR figure is old:</strong> The latest state-level SRAG figure is <strong>SE 26/2026</strong> (07/10) — <span class=\"stat\">13,782</span> hospital admissions in 2026, <strong>−14.6%</strong> versus 2025, of which <strong>5,723 are children under 6</strong>. Nationally (<strong>SE 29/2026</strong>): Paraná remains at alert level.</li>\n      <li><span class=\"chip\">HEALTH</span> <strong>Dengue unchanged:</strong> The latest bulletin remains <strong>nº 24 from 08/04/2026</strong> (SE 01–30/2026). Calm at home — <strong>94 cases, zero deaths</strong> — Londrina at <span class=\"stat\">126.92</span> per 100,000, nearly five times as high.</li>\n      <li><span class=\"chip\">SCHOOL</span> <strong>Monday is a school day.</strong> Dia dos Pais isn't a holiday, and August has no break window.</li>\n      <li><span class=\"chip\">TRIP</span> <strong>Save the date:</strong> <strong>54ª EFAPI Expo</strong> in Santo Antônio da Platina, <strong>08/19–08/23</strong>, about an hour's drive — the family event of the month in the day-trip ring.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Sábado, 8 de agosto, e amanhã é <strong>Dia dos Pais</strong>. Raramente um fim de semana se organizou de forma tão gentil: hoje chove — mas só de dia, \"<em>à noite o tempo fica firme</em>\" —, e amanhã a previsão marca <strong>0,0 mm e 29 °C</strong>, o valor mais alto da semana. A programação segue a mesma curva. O grande evento de Dia dos Pais em Londrina, o gratuito <strong>Churras do Paizão</strong>, roda hoje sem parar das <strong>11h às 23h</strong> — e seus três blocos de música ficam à noite, exatamente quando o céu abre. O domingo está quase sem programação na região, e isso não é má notícia — é o convite para passá-lo no próprio quintal.</p>\n    <ul>\n      <li><span class=\"chip good\">CLIMA</span> <strong>Amanhã é o dia:</strong> Dom 09/08. <strong>19–29 °C, 0,0 mm a 0%</strong> — o único dia da semana sem qualquer probabilidade de chuva, e ao mesmo tempo o mais quente.</li>\n      <li><span class=\"chip hot\">CLIMA</span> <strong>Hoje primeiro a chuva, depois a calmaria:</strong> <strong>17–27 °C, 6,2 mm a 72%</strong>, rajadas de até <span class=\"stat\">40 km/h</span> — a Climatempo escreve textualmente \"<em>chuva passageira durante o dia. À noite o tempo fica firme.</em>\" A noite é a janela seca.</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Churras do Paizão, hoje, entrada gratuita:</strong> Londrina Norte Shopping, <strong>das 11h às 23h sem parar</strong>, música ao vivo às <strong>17h30, 19h30 e 21h</strong> — e logo ao lado, a partir das 18h, um <strong>Encontro de Carros Antigos</strong>, também grátis. Dois eventos, um único estacionamento.</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Questão de horário resolvida — um evento o dia todo:</strong> A matéria específica sobre o evento, de 04/08, cita \"<em>das 11h até às 23h</em>\"; a música fica concentrada à noite. O <strong>espaço infantil</strong> ali custa R$ 35 (30 min) / R$ 45 (1 h) / <strong>R$ 60</strong> (passaporte livre).</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Domingo em Londrina, tudo grátis:</strong> Parada do Limoeiro a partir das <strong>8h</strong>, missa com bênção aos pais no Santuário às <strong>11h</strong>, teatro infantil \"Só se entra nessa mata duas vezes\" às <strong>16h</strong>.</li>\n      <li><span class=\"chip\">EVENTO</span> <strong>Anel-núcleo: nada com data.</strong> Para Ribeirão Claro e Jacarezinho, mais uma vez não foi possível confirmar nenhum evento datado para o Dia dos Pais. Única opção local hoje: Feira de Artesanato de Jacarezinho, 9h às 17h — ao ar livre, com 98% de chance de chuva.</li>\n      <li><span class=\"chip\">BEBÊ</span> <strong>Vias respiratórias, o número do PR está velho:</strong> O último dado próprio do estado sobre SRAG é da <strong>SE 26/2026</strong> (10/07) — <span class=\"stat\">13.782</span> internações em 2026, <strong>−14,6%</strong> em relação a 2025, sendo <strong>5.723 crianças com menos de 6 anos</strong>. Nacional (<strong>SE 29/2026</strong>): Paraná segue em nível de alerta.</li>\n      <li><span class=\"chip\">SAÚDE</span> <strong>Dengue sem mudança:</strong> O boletim mais recente continua sendo o <strong>nº 24 de 04/08/2026</strong> (SE 01–30/2026). Em casa está calmo — <strong>94 casos, zero óbitos</strong> —, Londrina com <span class=\"stat\">126,92</span> por 100 mil, quase cinco vezes mais alto.</li>\n      <li><span class=\"chip\">ESCOLA</span> <strong>Segunda tem aula.</strong> O Dia dos Pais não é feriado, e agosto não tem janela de recesso.</li>\n      <li><span class=\"chip\">PASSEIO</span> <strong>Anote na agenda:</strong> <strong>54ª EFAPI Expo</strong> em Santo Antônio da Platina, <strong>19 a 23/08</strong>, cerca de uma hora de carro — o compromisso em família do mês no raio de passeio de um dia.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Sábado 8 de agosto, y mañana es <strong>Dia dos Pais</strong>. Pocas veces un fin de semana se ha acomodado de forma tan amable: hoy cae la lluvia — pero solo de día, \"<em>à noite o tempo fica firme</em>\" —, y mañana el pronóstico marca <strong>0,0 mm y 29 °C</strong>, el valor más alto de la semana. La programación sigue la misma curva. El evento estelar de Dia dos Pais en Londrina, el gratuito <strong>Churras do Paizão</strong>, corre hoy sin parar de <strong>11:00 a 23:00</strong> — y sus tres bloques de música caen en la noche, justo cuando el cielo se despeja. El domingo está casi sin programación en la región, y eso no es mala noticia — es la invitación para pasarlo en el propio patio.</p>\n    <ul>\n      <li><span class=\"chip good\">CLIMA</span> <strong>Mañana es el día:</strong> Dom 09/08. <strong>19–29 °C, 0,0 mm al 0 %</strong> — el único día de la semana sin ninguna probabilidad de lluvia, y al mismo tiempo el más cálido.</li>\n      <li><span class=\"chip hot\">CLIMA</span> <strong>Hoy primero la lluvia, después la calma:</strong> <strong>17–27 °C, 6,2 mm al 72 %</strong>, ráfagas de hasta <span class=\"stat\">40 km/h</span> — Climatempo lo dice de forma explícita: \"<em>chuva passageira durante o dia. À noite o tempo fica firme.</em>\" La noche es la ventana seca.</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Churras do Paizão, hoy, entrada gratis:</strong> Londrina Norte Shopping, <strong>de 11:00 a 23:00 sin parar</strong>, música en vivo a las <strong>17:30, 19:30 y 21:00</strong> — y justo al lado, desde las 18:00, un <strong>encuentro de autos antiguos</strong>, también gratis. Dos eventos, un solo estacionamiento.</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Horario resuelto — un evento de todo el día:</strong> El reporte específico sobre el evento, del 04/08, cita \"<em>das 11h até às 23h</em>\"; la música queda concentrada en la noche. El <strong>área infantil</strong> ahí cuesta R$ 35 (30 min) / R$ 45 (1 h) / <strong>R$ 60</strong> (pase libre).</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Domingo en Londrina, todo gratis:</strong> Parada do Limoeiro desde las <strong>8:00</strong>, misa con bendición para los papás en el Santuário a las <strong>11:00</strong>, teatro infantil \"Só se entra nessa mata duas vezes\" a las <strong>16:00</strong>.</li>\n      <li><span class=\"chip\">EVENTO</span> <strong>Anillo núcleo: nada con fecha.</strong> Para Ribeirão Claro y Jacarezinho, otra vez no se pudo confirmar ningún evento con fecha para el Dia dos Pais. Única opción local hoy: Feira de Artesanato de Jacarezinho, de 9:00 a 17:00 — al aire libre, con 98 % de probabilidad de lluvia.</li>\n      <li><span class=\"chip\">BEBÉ</span> <strong>Vías respiratorias, la cifra de PR está vieja:</strong> El último dato propio del estado sobre SRAG es de la <strong>SE 26/2026</strong> (10/07) — <span class=\"stat\">13.782</span> hospitalizaciones en 2026, <strong>−14,6 %</strong> respecto a 2025, de las cuales <strong>5.723 son niñas y niños menores de 6 años</strong>. A nivel nacional (<strong>SE 29/2026</strong>): Paraná sigue en nivel de alerta.</li>\n      <li><span class=\"chip\">SALUD</span> <strong>Dengue sin cambios:</strong> El boletín más reciente sigue siendo el <strong>nº 24 del 04/08/2026</strong> (SE 01–30/2026). En casa está tranquilo — <strong>94 casos, cero muertes</strong> —, Londrina con <span class=\"stat\">126,92</span> por 100 mil, casi cinco veces más alto.</li>\n      <li><span class=\"chip\">ESCUELA</span> <strong>El lunes hay clases.</strong> El Dia dos Pais no es feriado, y agosto no tiene ventana de receso.</li>\n      <li><span class=\"chip\">PASEO</span> <strong>Anótalo en la agenda:</strong> <strong>54ª EFAPI Expo</strong> en Santo Antônio da Platina, <strong>del 19 al 23/08</strong>, cerca de una hora en carro — el compromiso familiar del mes dentro del radio de paseo de un día.</li>\n    </ul></div>"

        "en": "<div class=\"tldr\"><p class=\"lead\">Saturday, August 8 — rotation theme <em>Food, Cooking &amp; Restaurant</em>, ninth installment, and today we finally reach the counter that's the real town square in Brazil: the <em>padaria</em>. The last few Saturdays stayed at the weekly market (July 25), the street-food cart (July 18), and the home stove (July 4) — the bakery counter was still missing. The hook is a false friend more embarrassing than most: read <em>sem preservativos</em> on a label, and in everyday Brazilian usage you're reading \"no condoms.\" Priberam actually lists both meanings under <em>preservativo</em> — the food-chemistry sense <em>and</em> the condom; the unambiguous word for the additive is <strong>conservante</strong>.<sup>[1]</sup> Ten entries: <strong>3 verbs with full conjugation</strong>, five new words from the display case to the register, 2 refreshers from July 18 and 25.</p>\n    <ul>\n      <li><span class=\"chip hot\">FALSE FRIEND</span> <strong>preservativo ≠ preservative</strong> — Priberam lists under <em>preservativo</em> the „substância química destinada a evitar o desenvolvimento de bactérias, geralmente em alimentos\" <em>and</em> the latex condom. On the label and in conversation, the safe word is therefore <strong>conservante</strong>, which carries exactly the same chemical definition — and only that one.<sup>[1][2]</sup></li>\n      <li><span class=\"chip\">CONJUGATION</span> <strong>crescer → eu cresço · crecer → yo crezco</strong> — as the dough rises, Portuguese and Spanish part ways in the 1st person: PT inserts a cedilla (<em>cresço</em>, <em>que eu cresça</em>), ES inserts a whole extra consonant (<em>crezco</em>, <em>que yo crezca</em>). Both are rescuing the same soft sibilant before the <em>o</em>.<sup>[7]</sup></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>pão de queijo</strong> — Priberam: „Bolinho salgado, geralmente pequeno e assado no forno, feito com <strong>polvilho</strong>, ovos, leite, manteiga ou óleo vegetal e queijo ralado.\" So cassava starch instead of wheat flour, naturally gluten-free from the start — and the plural is <em>pães de queijo</em>.<sup>[3]</sup></li>\n      <li><span class=\"chip\">PHRASE</span> <strong>cafezinho</strong> — the coffee served in the small cup has a second, very Brazilian meaning: <em>gorjeta, gratificação</em>. Someone who \"gives a cafezinho\" is, depending on context, giving a tip — or something better left unreceipted.<sup>[4]</sup></li>\n      <li><span class=\"chip good\">IDIOM</span> <strong>no picnic · não ser sopa · no ser pan comido</strong> — the same claim (\"this isn't easy\"), three foods: sugar, soup, ready-made bread. And the polarity flips: German exists almost exclusively in the negative, while Portuguese and Spanish build outward from the positive case.<sup>[6]</sup></li>\n      <li><span class=\"chip\">GENDER</span> <strong>la charola instead of la bandeja</strong> — the tray is called <em>charola</em> in Mexico (and Bolivia, Honduras, Peru). Second meaning, also Mexican: „credencial que identifica a una persona con autoridad\" — the badge.<sup>[5]</sup></li>\n      <li><span class=\"chip\">PHRASE</span> <strong>a comanda</strong> — the slip you get at the padaria's entrance, get stamped at the counter, and pay off at the register. Priberam explicitly flags the word as Brazilian: „Anotação do pedido dos clientes\".<sup>[8]</sup></li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Sábado, 8 de agosto — tema da rotação <em>Comida, Cozinha &amp; Restaurante</em>, nono capítulo, e hoje a gente finalmente chega ao balcão que funciona como a verdadeira praça do bairro no Brasil: a <em>padaria</em>. Os últimos sábados ficaram na feira (25/07), na comida de rua (18/07) e no próprio fogão de casa (04/07) — faltava o balcão da padaria. O gancho de hoje é um falso cognato mais constrangedor do que a maioria: quem lê <em>sem preservativos</em> num rótulo, no dia a dia brasileiro, está lendo \"sem camisinha\". O Priberam traz mesmo as duas acepções em <em>preservativo</em> — a química de alimentos <em>e</em> a camisinha; a palavra sem ambiguidade para o aditivo é <strong>conservante</strong>.<sup>[1]</sup> Dez itens: <strong>3 verbos com conjugação completa</strong>, cinco palavras novas da vitrine ao caixa, 2 revisões de 18 e 25 de julho.</p>\n    <ul>\n      <li><span class=\"chip hot\">FALSO COGNATO</span> <strong>preservativo ≠ conservante</strong> — o Priberam lista, sob <em>preservativo</em>, a „substância química destinada a evitar o desenvolvimento de bactérias, geralmente em alimentos\" <em>e</em> a camisinha de látex. No rótulo e na conversa, a palavra segura é <strong>conservante</strong>, que carrega exatamente a mesma definição química — e só essa.<sup>[1][2]</sup></li>\n      <li><span class=\"chip\">CONJUGAÇÃO</span> <strong>crescer → eu cresço · crecer → yo crezco</strong> — na hora de a massa crescer, português e espanhol se separam na 1ª pessoa: o PT entra com uma cedilha (<em>cresço</em>, <em>que eu cresça</em>), o ES entra com uma consoante inteira a mais (<em>crezco</em>, <em>que yo crezca</em>). Os dois protegem o mesmo som suave antes do <em>o</em>.<sup>[7]</sup></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>pão de queijo</strong> — Priberam: „Bolinho salgado, geralmente pequeno e assado no forno, feito com <strong>polvilho</strong>, ovos, leite, manteiga ou óleo vegetal e queijo ralado.\" Ou seja, fécula de mandioca em vez de farinha de trigo, já nascendo sem glúten — e o plural é <em>pães de queijo</em>.<sup>[3]</sup></li>\n      <li><span class=\"chip\">FRASE</span> <strong>cafezinho</strong> — o café servido na xícara pequena tem um segundo significado, bem brasileiro: <em>gorjeta, gratificação</em>. Quem \"dá um cafezinho\" está, dependendo do contexto, dando uma gorjeta — ou algo melhor não pedir nota fiscal.<sup>[4]</sup></li>\n      <li><span class=\"chip good\">IDIOM</span> <strong>kein Zuckerschlecken · não ser sopa · no ser pan comido</strong> — a mesma ideia (\"isso não é fácil\"), em três alimentos: açúcar, sopa, pão já pronto. E a polaridade se inverte: em alemão, a expressão praticamente só existe na negativa; português e espanhol partem do caso positivo.<sup>[6]</sup></li>\n      <li><span class=\"chip\">GÊNERO</span> <strong>la charola em vez de la bandeja</strong> — a bandeja se chama <em>charola</em> no México (e na Bolívia, em Honduras e no Peru). Segundo significado, também mexicano: „credencial que identifica a una persona con autoridad\" — o distintivo.<sup>[5]</sup></li>\n      <li><span class=\"chip\">FRASE</span> <strong>a comanda</strong> — o papel que você recebe na entrada da padaria, carimba no balcão e paga no caixa. O Priberam marca a palavra explicitamente como uso brasileiro: „Anotação do pedido dos clientes\".<sup>[8]</sup></li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Sábado 8 de agosto — tema de la rotación <em>Comida, Cocina y Restaurante</em>, novena entrega, y hoy por fin llegamos al mostrador que funciona como la verdadera plaza del pueblo en Brasil: la <em>padaria</em>. Los últimos sábados se quedaron en el mercado semanal (25/07), la comida callejera (18/07) y la estufa de casa (04/07) — faltaba el mostrador de la panadería. El gancho de hoy es un falso amigo más vergonzoso que la mayoría: quien lee <em>sem preservativos</em> en una etiqueta, en el día a día brasileño, está leyendo \"sin condones\". Priberam trae de verdad los dos significados en <em>preservativo</em> — la química de alimentos <em>y</em> el condón; la palabra sin ambigüedad para el aditivo es <strong>conservante</strong>.<sup>[1]</sup> Diez entradas: <strong>3 verbos con conjugación completa</strong>, cinco palabras nuevas del aparador a la caja, 2 repasos del 18 y el 25 de julio.</p>\n    <ul>\n      <li><span class=\"chip hot\">FALSO AMIGO</span> <strong>preservativo ≠ conservante</strong> — Priberam lista, bajo <em>preservativo</em>, la „substância química destinada a evitar o desenvolvimento de bactérias, geralmente em alimentos\" <em>y</em> el condón de látex. En la etiqueta y en la conversación, la palabra segura es <strong>conservante</strong>, que lleva exactamente la misma definición química — y solo esa.<sup>[1][2]</sup></li>\n      <li><span class=\"chip\">CONJUGACIÓN</span> <strong>crescer → eu cresço · crecer → yo crezco</strong> — a la hora de que crezca la masa, portugués y español se separan en la 1ª persona: el PT mete una cedilla (<em>cresço</em>, <em>que eu cresça</em>), el ES mete toda una consonante extra (<em>crezco</em>, <em>que yo crezca</em>). Los dos protegen el mismo sonido suave antes de la <em>o</em>.<sup>[7]</sup></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>pão de queijo</strong> — Priberam: „Bolinho salgado, geralmente pequeno e assado no forno, feito com <strong>polvilho</strong>, ovos, leite, manteiga ou óleo vegetal e queijo ralado.\" Es decir, fécula de yuca en vez de harina de trigo, sin gluten desde el origen — y el plural es <em>pães de queijo</em>.<sup>[3]</sup></li>\n      <li><span class=\"chip\">FRASE</span> <strong>cafezinho</strong> — el café servido en taza chica tiene un segundo significado, muy brasileño: <em>gorjeta, gratificação</em>. Quien \"da un cafezinho\" está, según el contexto, dando propina — o algo que mejor no pedir factura.<sup>[4]</sup></li>\n      <li><span class=\"chip good\">IDIOM</span> <strong>kein Zuckerschlecken · não ser sopa · no es pan comido</strong> — la misma idea (\"esto no es fácil\"), en tres alimentos: azúcar, sopa, pan ya hecho. Y la polaridad se invierte: en alemán, la expresión casi solo existe en negativo; portugués y español parten del caso positivo.<sup>[6]</sup></li>\n      <li><span class=\"chip\">GÉNERO</span> <strong>la charola en vez de la bandeja</strong> — la bandeja se llama <em>charola</em> en México (y en Bolivia, Honduras y Perú). Segundo significado, también mexicano: „credencial que identifica a una persona con autoridad\" — la placa.<sup>[5]</sup></li>\n      <li><span class=\"chip\">FRASE</span> <strong>a comanda</strong> — el papel que te dan en la entrada de la padaria, se sella en el mostrador y se paga en la caja. Priberam marca la palabra explícitamente como uso brasileño: „Anotação do pedido dos clientes\".<sup>[8]</sup></li>\n    </ul></div>"
