      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Der 2. August 2026 war jahrelang <em>der</em> Termin: ab dann sollten die Hochrisiko-Pflichten des AI Act greifen. Sie greifen nicht — der „Digital Omnibus\" hat sie auf den <strong>02.12.2027</strong> verschoben.<sup>[1][2]</sup> Während Brüssel Zeit verschenkt, kaufen Microsoft und Amazon für zusammen <strong>3,5 Mrd. US$</strong> Menschen ein, die KI-Piloten in den Betrieb bringen<sup>[8]</sup> — weil 71 % der Führungskräfte das Hindernis in der Organisation sehen, nicht in der Technik.</p>\n    <ul>\n      <li><span class=\"chip hot\">REG · EU</span> <strong>Der Stichtag, der ausfiel:</strong> eigenständige Annex-III-Hochrisiko-Systeme rutschen auf den <strong>02.12.2027</strong>, Annex-I-Produkte auf den <strong>02.08.2028</strong>. Feste Kalenderdaten, kein „Stop-the-clock\".<sup>[1][2]</sup></li>\n      <li><span class=\"chip\">REG · EU</span> <strong>Nicht verschoben:</strong> Artikel-50-Transparenz seit 02.08. anwendbar, Artikel-5-Verbote und GPAI-Anbieterpflichten ohnehin in Kraft.<sup>[2]</sup> Wer „alles vertagt\" liest, liest falsch.</li>\n      <li><span class=\"chip hot\">FAKTENCHECK</span> <strong>Ein „Genfer KI-Abkommen\" gibt es nicht</strong> — real ist der <em>UN Global Dialogue on AI Governance</em>, Genf, 06.–07.07.2026: ein Dialog, kein unterzeichnetes Instrument.<sup>[4]</sup> Auch „Tausende Humanoide im Einsatz\" ist nirgends belegt.<sup>[11][12]</sup></li>\n      <li><span class=\"chip\">STUDIE · GLOBAL</span> <strong>88 % nutzen KI</strong> in mindestens einer Funktion — aber der Bericht schreibt selbst, die Gewinne seien „in einer kleinen führenden Kohorte konzentriert\".<sup>[6]</sup> Konsumentenrente USA: <strong>172 Mrd. US$</strong> nach 112 Mrd. im Vorjahr.</li>\n      <li><span class=\"chip good\">ADOPTION · DE</span> <strong>40 % der deutschen Wirtschaft</strong> nutzen KI — <strong>+118 %</strong> gegenüber 2024, knapp 40 % auch bei Betrieben unter 50 Beschäftigten (IW Consult für eco, n = 500).<sup>[7]</sup></li>\n      <li><span class=\"chip hot\">MARKT · US</span> <strong>3,5 Mrd. US$ gegen ein Organisationsproblem:</strong> Microsofts „Frontier Company\" — 2,5 Mrd. US$ und rund <strong>6.000</strong> Ingenieure und Berater direkt in Kundenorganisationen, Amazon 1 Mrd. US$ dagegen.<sup>[8]</sup> Zielgruppe: Konzerne ab 1 Mrd. US$ Umsatz.</li>\n      <li><span class=\"chip\">FINANZEN · BR</span> <strong>Brasiliens Banken planen R$ 50,4 Mrd.</strong> Technikbudget für 2026; GenAI teilt sich Platz zwei mit 84 % Nennung. In KI flossen 2025 aber nur <strong>R$ 826 Mio.</strong><sup>[10]</sup> — eigene Rechnung: rund 1,8 %.</li>\n      <li><span class=\"chip good\">twiceD</span> Zwei Ideen: ein <strong>KI-Bestandsauszug mit Fristen-Landkarte</strong> und ein <strong>Abnahme-Prüfstand</strong>, der aus einem Pilot eine unterschriebene Entscheidung macht.</li>\n    </ul></div>",
      "latestTldrHtmlByLang": {
        "de": "<div class=\"tldr\"><p class=\"lead\">Der 2. August 2026 war jahrelang <em>der</em> Termin: ab dann sollten die Hochrisiko-Pflichten des AI Act greifen. Sie greifen nicht — der „Digital Omnibus\" hat sie auf den <strong>02.12.2027</strong> verschoben.<sup>[1][2]</sup> Während Brüssel Zeit verschenkt, kaufen Microsoft und Amazon für zusammen <strong>3,5 Mrd. US$</strong> Menschen ein, die KI-Piloten in den Betrieb bringen<sup>[8]</sup> — weil 71 % der Führungskräfte das Hindernis in der Organisation sehen, nicht in der Technik.</p>\n    <ul>\n      <li><span class=\"chip hot\">REG · EU</span> <strong>Der Stichtag, der ausfiel:</strong> eigenständige Annex-III-Hochrisiko-Systeme rutschen auf den <strong>02.12.2027</strong>, Annex-I-Produkte auf den <strong>02.08.2028</strong>. Feste Kalenderdaten, kein „Stop-the-clock\".<sup>[1][2]</sup></li>\n      <li><span class=\"chip\">REG · EU</span> <strong>Nicht verschoben:</strong> Artikel-50-Transparenz seit 02.08. anwendbar, Artikel-5-Verbote und GPAI-Anbieterpflichten ohnehin in Kraft.<sup>[2]</sup> Wer „alles vertagt\" liest, liest falsch.</li>\n      <li><span class=\"chip hot\">FAKTENCHECK</span> <strong>Ein „Genfer KI-Abkommen\" gibt es nicht</strong> — real ist der <em>UN Global Dialogue on AI Governance</em>, Genf, 06.–07.07.2026: ein Dialog, kein unterzeichnetes Instrument.<sup>[4]</sup> Auch „Tausende Humanoide im Einsatz\" ist nirgends belegt.<sup>[11][12]</sup></li>\n      <li><span class=\"chip\">STUDIE · GLOBAL</span> <strong>88 % nutzen KI</strong> in mindestens einer Funktion — aber der Bericht schreibt selbst, die Gewinne seien „in einer kleinen führenden Kohorte konzentriert\".<sup>[6]</sup> Konsumentenrente USA: <strong>172 Mrd. US$</strong> nach 112 Mrd. im Vorjahr.</li>\n      <li><span class=\"chip good\">ADOPTION · DE</span> <strong>40 % der deutschen Wirtschaft</strong> nutzen KI — <strong>+118 %</strong> gegenüber 2024, knapp 40 % auch bei Betrieben unter 50 Beschäftigten (IW Consult für eco, n = 500).<sup>[7]</sup></li>\n      <li><span class=\"chip hot\">MARKT · US</span> <strong>3,5 Mrd. US$ gegen ein Organisationsproblem:</strong> Microsofts „Frontier Company\" — 2,5 Mrd. US$ und rund <strong>6.000</strong> Ingenieure und Berater direkt in Kundenorganisationen, Amazon 1 Mrd. US$ dagegen.<sup>[8]</sup> Zielgruppe: Konzerne ab 1 Mrd. US$ Umsatz.</li>\n      <li><span class=\"chip\">FINANZEN · BR</span> <strong>Brasiliens Banken planen R$ 50,4 Mrd.</strong> Technikbudget für 2026; GenAI teilt sich Platz zwei mit 84 % Nennung. In KI flossen 2025 aber nur <strong>R$ 826 Mio.</strong><sup>[10]</sup> — eigene Rechnung: rund 1,8 %.</li>\n      <li><span class=\"chip good\">twiceD</span> Zwei Ideen: ein <strong>KI-Bestandsauszug mit Fristen-Landkarte</strong> und ein <strong>Abnahme-Prüfstand</strong>, der aus einem Pilot eine unterschriebene Entscheidung macht.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">August 2, 2026 was, for years, <em>the</em> date: that's when the AI Act's high-risk obligations were supposed to kick in. They didn't — the \"Digital Omnibus\" pushed them to <strong>2027-12-02</strong>.<sup>[1][2]</sup> While Brussels gives away time, Microsoft and Amazon are together spending <strong>$3.5 billion</strong> to buy people who bring AI pilots into production<sup>[8]</sup> — because 71% of executives see the obstacle in the organization, not in the technology.</p>\n    <ul>\n      <li><span class=\"chip hot\">REG · EU</span> <strong>The deadline that didn't happen:</strong> standalone Annex III high-risk systems slide to <strong>2027-12-02</strong>, Annex I products to <strong>2028-08-02</strong>. Fixed calendar dates, no \"stop-the-clock.\"<sup>[1][2]</sup></li>\n      <li><span class=\"chip\">REG · EU</span> <strong>Not postponed:</strong> Article 50 transparency has applied since Aug 2, Article 5 bans and GPAI provider obligations were already in force regardless.<sup>[2]</sup> Anyone reading \"everything got delayed\" is reading it wrong.</li>\n      <li><span class=\"chip hot\">FACT CHECK</span> <strong>There is no \"Geneva AI Accord\"</strong> — what's real is the <em>UN Global Dialogue on AI Governance</em>, Geneva, 07/06–07/2026: a dialogue, not a signed instrument.<sup>[4]</sup> \"Thousands of humanoids deployed\" is nowhere substantiated either.<sup>[11][12]</sup></li>\n      <li><span class=\"chip\">STUDY · GLOBAL</span> <strong>88% use AI</strong> in at least one function — but the report itself says the gains are \"concentrated in a small leading cohort.\"<sup>[6]</sup> US consumer surplus: <strong>$172 billion</strong>, up from $112 billion the year before.</li>\n      <li><span class=\"chip good\">ADOPTION · DE</span> <strong>40% of the German economy</strong> uses AI — <strong>+118%</strong> versus 2024, nearly 40% even at businesses under 50 employees (IW Consult for eco, n = 500).<sup>[7]</sup></li>\n      <li><span class=\"chip hot\">MARKET · US</span> <strong>$3.5 billion against an organizational problem:</strong> Microsoft's \"Frontier Company\" — $2.5 billion and roughly <strong>6,000</strong> engineers and consultants embedded directly in customer organizations, Amazon adding $1 billion. Target audience: enterprises with $1 billion+ in revenue.<sup>[8]</sup></li>\n      <li><span class=\"chip\">FINANCE · BR</span> <strong>Brazil's banks plan R$50.4 billion</strong> in tech spending for 2026; GenAI ties for second place with 84% of mentions. Yet only <strong>R$826 million</strong> flowed into AI in 2025<sup>[10]</sup> — own math: about 1.8%.</li>\n      <li><span class=\"chip good\">twiceD</span> Two ideas: an <strong>AI inventory audit with a deadline map</strong> and an <strong>acceptance test bench</strong> that turns a pilot into a signed-off decision.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">O dia 2 de agosto de 2026 foi, por anos, <em>o</em> prazo: a partir dele, as obrigações de alto risco do AI Act deveriam entrar em vigor. Elas não entraram — o \"Digital Omnibus\" as adiou para <strong>02/12/2027</strong>.<sup>[1][2]</sup> Enquanto Bruxelas dá tempo de presente, Microsoft e Amazon compram juntas, por <strong>US$ 3,5 bilhões</strong>, pessoas que colocam pilotos de IA em produção<sup>[8]</sup> — porque 71% dos executivos veem o obstáculo na organização, não na tecnologia.</p>\n    <ul>\n      <li><span class=\"chip hot\">REG · UE</span> <strong>O prazo que não aconteceu:</strong> sistemas de alto risco independentes do Anexo III passam para <strong>02/12/2027</strong>, produtos do Anexo I para <strong>02/08/2028</strong>. Datas fixas de calendário, sem \"parar o relógio\".<sup>[1][2]</sup></li>\n      <li><span class=\"chip\">REG · UE</span> <strong>Não adiado:</strong> a transparência do artigo 50 vale desde 02/08, as proibições do artigo 5 e as obrigações dos provedores de IA de propósito geral já valiam de qualquer forma.<sup>[2]</sup> Quem lê \"tudo foi adiado\" está lendo errado.</li>\n      <li><span class=\"chip hot\">CHECAGEM</span> <strong>Não existe um \"acordo de IA de Genebra\"</strong> — o que é real é o <em>UN Global Dialogue on AI Governance</em>, Genebra, 06–07/07/2026: um diálogo, não um instrumento assinado.<sup>[4]</sup> \"Milhares de humanoides em operação\" também não tem comprovação em lugar nenhum.<sup>[11][12]</sup></li>\n      <li><span class=\"chip\">ESTUDO · GLOBAL</span> <strong>88% usam IA</strong> em pelo menos uma função — mas o próprio relatório escreve que os ganhos estão \"concentrados em uma pequena coorte líder\".<sup>[6]</sup> Excedente do consumidor nos EUA: <strong>US$ 172 bilhões</strong>, ante US$ 112 bilhões no ano anterior.</li>\n      <li><span class=\"chip good\">ADOÇÃO · DE</span> <strong>40% da economia alemã</strong> usa IA — <strong>+118%</strong> em relação a 2024, quase 40% também em empresas com menos de 50 funcionários (IW Consult para a eco, n = 500).<sup>[7]</sup></li>\n      <li><span class=\"chip hot\">MERCADO · EUA</span> <strong>US$ 3,5 bilhões contra um problema organizacional:</strong> a \"Frontier Company\" da Microsoft — US$ 2,5 bilhões e cerca de <strong>6.000</strong> engenheiros e consultores direto dentro das organizações-cliente, a Amazon soma mais US$ 1 bilhão. Público-alvo: empresas com faturamento a partir de US$ 1 bilhão.<sup>[8]</sup></li>\n      <li><span class=\"chip\">FINANÇAS · BR</span> <strong>Os bancos do Brasil planejam R$ 50,4 bilhões</strong> em orçamento de tecnologia para 2026; a IA generativa divide o segundo lugar com 84% das citações. Mas só <strong>R$ 826 milhões</strong> foram investidos em IA em 2025<sup>[10]</sup> — conta própria: cerca de 1,8%.</li>\n      <li><span class=\"chip good\">twiceD</span> Duas ideias: um <strong>levantamento de inventário de IA com mapa de prazos</strong> e um <strong>banco de testes de aceitação</strong> que transforma um piloto em uma decisão assinada.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">El 2 de agosto de 2026 fue, durante años, <em>la</em> fecha: a partir de ahí debían entrar en vigor las obligaciones de alto riesgo del AI Act. No entraron — el \"Digital Omnibus\" las aplazó al <strong>02/12/2027</strong>.<sup>[1][2]</sup> Mientras Bruselas regala tiempo, Microsoft y Amazon compran juntas, por <strong>US$ 3,5 mil millones</strong>, a personas que llevan pilotos de IA a producción<sup>[8]</sup> — porque 71% de los directivos ve el obstáculo en la organización, no en la tecnología.</p>\n    <ul>\n      <li><span class=\"chip hot\">REG · UE</span> <strong>La fecha límite que no ocurrió:</strong> los sistemas de alto riesgo independientes del Anexo III pasan al <strong>02/12/2027</strong>, los productos del Anexo I al <strong>02/08/2028</strong>. Fechas fijas de calendario, sin \"detener el reloj\".<sup>[1][2]</sup></li>\n      <li><span class=\"chip\">REG · UE</span> <strong>No aplazado:</strong> la transparencia del artículo 50 aplica desde el 02/08, las prohibiciones del artículo 5 y las obligaciones de los proveedores de IA de propósito general ya aplicaban de todos modos.<sup>[2]</sup> Quien lea \"todo se aplazó\" está leyendo mal.</li>\n      <li><span class=\"chip hot\">VERIFICACIÓN</span> <strong>No existe un \"acuerdo de IA de Ginebra\"</strong> — lo real es el <em>UN Global Dialogue on AI Governance</em>, Ginebra, 06–07/07/2026: un diálogo, no un instrumento firmado.<sup>[4]</sup> \"Miles de humanoides en operación\" tampoco está comprobado en ningún lado.<sup>[11][12]</sup></li>\n      <li><span class=\"chip\">ESTUDIO · GLOBAL</span> <strong>88% usa IA</strong> en al menos una función — pero el propio reporte dice que las ganancias están \"concentradas en una pequeña cohorte líder\".<sup>[6]</sup> Excedente del consumidor en EE. UU.: <strong>US$ 172 mil millones</strong>, frente a US$ 112 mil millones el año anterior.</li>\n      <li><span class=\"chip good\">ADOPCIÓN · DE</span> <strong>40% de la economía alemana</strong> usa IA — <strong>+118%</strong> frente a 2024, casi 40% también en empresas con menos de 50 empleados (IW Consult para eco, n = 500).<sup>[7]</sup></li>\n      <li><span class=\"chip hot\">MERCADO · EE. UU.</span> <strong>US$ 3,5 mil millones contra un problema organizacional:</strong> la \"Frontier Company\" de Microsoft — US$ 2,5 mil millones y unos <strong>6.000</strong> ingenieros y consultores directo dentro de las organizaciones cliente, Amazon suma otros US$ 1 mil millones. Público objetivo: empresas con ingresos desde US$ 1 mil millones.<sup>[8]</sup></li>\n      <li><span class=\"chip\">FINANZAS · BR</span> <strong>Los bancos de Brasil planean R$ 50,4 mil millones</strong> de presupuesto tecnológico para 2026; la IA generativa comparte el segundo lugar con 84% de menciones. Pero solo <strong>R$ 826 millones</strong> se invirtieron en IA en 2025<sup>[10]</sup> — cuenta propia: alrededor de 1,8%.</li>\n      <li><span class=\"chip good\">twiceD</span> Dos ideas: un <strong>inventario de IA con mapa de plazos</strong> y un <strong>banco de pruebas de aceptación</strong> que convierte un piloto en una decisión firmada.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Der Dienstags-Abruf bringt <strong>96 Listings</strong> nach 82 am Montag — und zum ersten Mal in dieser Serie fällt <strong>kein einziger Eintrag weg</strong>. Das klingt nach einem stabilen Markt und ist in Wahrheit eine Aussage über die Erhebung: <strong>61 der 96 Einträge tragen im Board selbst den Vermerk „carried forward … not individually re-verified today\"</strong>. Live geprüft wurden heute 35. Null Abgänge heißt also nicht, dass nichts vom Markt genommen wurde, sondern dass zwei Drittel des Boards heute nicht angefasst wurden. Der Ertrag wächst trotzdem kaum: <strong>+14 Zeilen ergeben +2 Einträge über Fit 70</strong>. Dafür verdoppelt sich die Schweiz-Zeile — und jeder neue Schweizer Eintrag ist von Brasilien aus unerreichbar.</p>\n    <ul>\n      <li><span class=\"chip hot\">Board</span> <strong>96 Listings</strong>: 81 Freelance, 10 Employee, 5 Intriguing. 82 übernommen, 14 neu, <strong>0 gefallen</strong> — und null Score-Drift über alle 82 Übernahmen. Der zweite saubere Vergleichstag in Folge.</li>\n      <li><span class=\"chip hot\">Board</span> <strong>Nur 35 der 96 Einträge wurden heute live gezogen.</strong> Die restlichen 61 sind ausdrücklich als unverifizierte Übernahme markiert. Wer aus diesem Board heute etwas anschreibt, sollte die Anzeige vorher selbst öffnen.</li>\n      <li><span class=\"chip\">Board</span> <strong>Das Trefferband bewegt sich minimal</strong>: ≥ Fit 70 von 22 auf 24, ≥ 75 von 13 auf 14, Median von 61,5 auf 62,0. Die Spitze bleibt iSAX 83, teclift 82, JetBrains 82, ELCA Zürich 81.</li>\n      <li><span class=\"chip hot\">CH</span> <strong>Die Schweiz-Zeile verdoppelt sich von 4 auf 8</strong> — mit den höchsten Bändern im Board (CHF 130–180/h*). Alle vier Neuzugänge verlangen Präsenz in der Schweiz; ihre Standort-Punkte lauten 3, 3, 9 und 12 von 20.</li>\n      <li><span class=\"chip hot\">CH</span> <strong>Die eigene CH-Schwelle liegt über dem Markt</strong>: IT-Lohnstudie Schweiz 2026 — Senior Software Engineer <strong>CHF 115.000–145.000</strong>, AI &amp; Data Engineer <strong>CHF 130.000–165.000</strong>.<sup>[3]</sup> Die Filterschwelle dieses Briefs (≥ CHF 150 k) schneidet das gesamte Senior-Band weg.</li>\n      <li><span class=\"chip hot\">Rate</span> <strong>Der DACH-Durchschnitt sinkt auf 103 €/h</strong> (Vorjahr 104), 62 % planen keine Preiserhöhung, 9 % wollen senken — Freelancer-Kompass 2026, n = 5.412.<sup>[2]</sup> Das Monatseinkommen fällt von 8.432 € auf <strong>6.653 €</strong>.</li>\n      <li><span class=\"chip hot\">Rate</span> <strong>Java liegt unter dem Durchschnitt</strong>: 87 €/Std. im Java-Verzeichnis von freelancermap<sup>[1]</sup> — der Plattform, die 80 der 96 Einträge liefert. Alle <strong>drei</strong> echten Stundensätze im Board (85, 75, 70 €/h) liegen unter der Untergrenze des recherchierten Bands.</li>\n      <li><span class=\"chip\">Vergabe</span> <strong>Heute keine neue TED-Ausschreibung im Filter.</strong> TED war den zweiten Tag in Folge nicht direkt abrufbar; für keinen der drei Kandidaten ließ sich eine Abgabefrist bestätigen. Kein Verdict, keine geschätzte Zahl.</li>\n      <li><span class=\"chip hot\">Vergabe</span> <strong>Werktag 2 von 5 bis zur BSI-Frist am 10.08.</strong><sup>[6]</sup> Vier volle Werktage bleiben; die Vergabeunterlagen sind weiterhin nur über eine angemeldete Sitzung im Vergabeportal erreichbar.</li>\n      <li><span class=\"chip\">Markt</span> <strong>Bosch streicht rund 1.200 Softwarestellen</strong> bis Ende 2026, davon 950 in Deutschland — automatisiertes Fahren kommt langsamer voran als erwartet.<sup>[4]</sup> Ankündigung vom <strong>19.01.2026</strong>, kein frisches Ereignis.</li>\n    </ul></div>",

die Schweiz 2026 — Senior Software Engineer <strong>CHF 115.000–145.000</strong>, AI &amp; Data Engineer <strong>CHF 130.000–165.000</strong>.<sup>[3]</sup> Die Filterschwelle dieses Briefs (≥ CHF 150 k) schneidet das gesamte Senior-Band weg.</li>\n      <li><span class=\"chip hot\">Rate</span> <strong>Der DACH-Durchschnitt sinkt auf 103 €/h</strong> (Vorjahr 104), 62 % planen keine Preiserhöhung, 9 % wollen senken — Freelancer-Kompass 2026, n = 5.412.<sup>[2]</sup> Das Monatseinkommen fällt von 8.432 € auf <strong>6.653 €</strong>.</li>\n      <li><span class=\"chip hot\">Rate</span> <strong>Java liegt unter dem Durchschnitt</strong>: 87 €/Std. im Java-Verzeichnis von freelancermap<sup>[1]</sup> — der Plattform, die 80 der 96 Einträge liefert. Alle <strong>drei</strong> echten Stundensätze im Board (85, 75, 70 €/h) liegen unter der Untergrenze des recherchierten Bands.</li>\n      <li><span class=\"chip\">Vergabe</span> <strong>Heute keine neue TED-Ausschreibung im Filter.</strong> TED war den zweiten Tag in Folge nicht direkt abrufbar; für keinen der drei Kandidaten ließ sich eine Abgabefrist bestätigen. Kein Verdict, keine geschätzte Zahl.</li>\n      <li><span class=\"chip hot\">Vergabe</span> <strong>Werktag 2 von 5 bis zur BSI-Frist am 10.08.</strong><sup>[6]</sup> Vier volle Werktage bleiben; die Vergabeunterlagen sind weiterhin nur über eine angemeldete Sitzung im Vergabeportal erreichbar.</li>\n      <li><span class=\"chip\">Markt</span> <strong>Bosch streicht rund 1.200 Softwarestellen</strong> bis Ende 2026, davon 950 in Deutschland — automatisiertes Fahren kommt langsamer voran als erwartet.<sup>[4]</sup> Ankündigung vom <strong>19.01.2026</strong>, kein frisches Ereignis.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Tuesday's pull brings <strong>96 listings</strong>, up from 82 on Monday — and for the first time in this series, <strong>not a single entry drops off</strong>. That sounds like a stable market, but it's really a statement about the collection method: <strong>61 of the 96 entries carry the board's own note \"carried forward … not individually re-verified today.\"</strong> Only 35 were live-checked today. Zero departures doesn't mean nothing left the market — it means two-thirds of the board wasn't touched today. The yield still barely grows: <strong>+14 rows produce +2 entries above Fit 70</strong>. Meanwhile the Switzerland line doubles — and every new Swiss entry is unreachable from Brazil.</p>\n    <ul>\n      <li><span class=\"chip hot\">Board</span> <strong>96 listings</strong>: 81 freelance, 10 employee, 5 intriguing. 82 carried over, 14 new, <strong>0 dropped</strong> — and zero score drift across all 82 carry-overs. The second clean comparison day in a row.</li>\n      <li><span class=\"chip hot\">Board</span> <strong>Only 35 of the 96 entries were pulled live today.</strong> The remaining 61 are explicitly marked as unverified carry-overs. Anyone reaching out from this board today should open the listing itself first.</li>\n      <li><span class=\"chip\">Board</span> <strong>The hit band moves only slightly</strong>: ≥ Fit 70 from 22 to 24, ≥ 75 from 13 to 14, median from 61.5 to 62.0. The top stays iSAX 83, teclift 82, JetBrains 82, ELCA Zürich 81.</li>\n      <li><span class=\"chip hot\">CH</span> <strong>The Switzerland line doubles from 4 to 8</strong> — with the highest bands on the board (CHF 130–180/h*). All four new additions require on-site presence in Switzerland; their location scores are 3, 3, 9, and 12 out of 20.</li>\n      <li><span class=\"chip hot\">CH</span> <strong>This profile's own CH threshold sits above the market</strong>: IT Salary Study Switzerland 2026 — Senior Software Engineer <strong>CHF 115,000–145,000</strong>, AI &amp; Data Engineer <strong>CHF 130,000–165,000</strong>.<sup>[3]</sup> This brief's filter threshold (≥ CHF 150k) cuts out the entire senior band.</li>\n      <li><span class=\"chip hot\">Rate</span> <strong>The DACH average falls to €103/h</strong> (prior year 104), 62% plan no price increase, 9% want to lower rates — Freelancer-Kompass 2026, n = 5,412.<sup>[2]</sup> Monthly income falls from €8,432 to <strong>€6,653</strong>.</li>\n      <li><span class=\"chip hot\">Rate</span> <strong>Java sits below the average</strong>: €87/hr in freelancermap's Java directory<sup>[1]</sup> — the platform that supplies 80 of the 96 entries. All <strong>three</strong> real hourly rates on the board (€85, 75, 70/h) sit below the lower end of the researched band.</li>\n      <li><span class=\"chip\">Tenders</span> <strong>No new TED tender in the filter today.</strong> TED was unreachable directly for the second day in a row; none of the three candidates had a confirmable submission deadline. No verdict, no estimated figure.</li>\n      <li><span class=\"chip hot\">Tenders</span> <strong>Business day 2 of 5 until the BSI deadline on 08/10.</strong><sup>[6]</sup> Four full business days remain; the tender documents are still only reachable through a logged-in session on the procurement portal.</li>\n      <li><span class=\"chip\">Market</span> <strong>Bosch is cutting roughly 1,200 software jobs</strong> by end of 2026, 950 of them in Germany — automated driving is progressing more slowly than expected.<sup>[4]</sup> Announcement from <strong>01/19/2026</strong>, not a fresh event.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">A coleta de terça-feira traz <strong>96 vagas</strong>, ante 82 na segunda — e pela primeira vez nesta série, <strong>nenhuma vaga sai da lista</strong>. Isso parece indicar um mercado estável, mas na verdade diz mais sobre o método de coleta: <strong>61 das 96 vagas trazem no próprio board a nota \"carried forward … not individually re-verified today\"</strong>. Apenas 35 foram checadas ao vivo hoje. Zero saídas não significa que nada saiu do mercado — significa que dois terços do board não foram tocados hoje. O rendimento continua quase estagnado: <strong>+14 linhas geram +2 vagas acima de Fit 70</strong>. Enquanto isso, a linha da Suíça dobra — e cada nova vaga suíça é inalcançável a partir do Brasil.</p>\n    <ul>\n      <li><span class=\"chip hot\">Board</span> <strong>96 vagas</strong>: 81 freelance, 10 CLT/efetivo, 5 curiosidades. 82 mantidas, 14 novas, <strong>0 saíram</strong> — e nenhuma variação de score nas 82 mantidas. O segundo dia seguido de comparação limpa.</li>\n      <li><span class=\"chip hot\">Board</span> <strong>Apenas 35 das 96 vagas foram puxadas ao vivo hoje.</strong> As outras 61 estão explicitamente marcadas como mantidas sem reverificação. Quem for entrar em contato a partir deste board hoje deveria abrir o anúncio antes.</li>\n      <li><span class=\"chip\">Board</span> <strong>A faixa de acertos se move pouco</strong>: ≥ Fit 70 foi de 22 para 24, ≥ 75 de 13 para 14, mediana de 61,5 para 62,0. O topo continua com iSAX 83, teclift 82, JetBrains 82, ELCA Zürich 81.</li>\n      <li><span class=\"chip hot\">CH</span> <strong>A linha da Suíça dobra de 4 para 8</strong> — com as faixas mais altas do board (CHF 130–180/h*). As quatro vagas novas exigem presença na Suíça; seus pontos de localização são 3, 3, 9 e 12 de 20.</li>\n      <li><span class=\"chip hot\">CH</span> <strong>O próprio limiar CH deste perfil está acima do mercado</strong>: Estudo Salarial de TI Suíça 2026 — Senior Software Engineer <strong>CHF 115.000–145.000</strong>, AI &amp; Data Engineer <strong>CHF 130.000–165.000</strong>.<sup>[3]</sup> O limiar de filtro deste brief (≥ CHF 150 mil) corta toda a faixa sênior.</li>\n      <li><span class=\"chip hot\">Rate</span> <strong>A média DACH cai para € 103/h</strong> (ano anterior 104), 62% não planejam aumentar preços, 9% querem reduzir — Freelancer-Kompass 2026, n = 5.412.<sup>[2]</sup> A renda mensal cai de € 8.432 para <strong>€ 6.653</strong>.</li>\n      <li><span class=\"chip hot\">Rate</span> <strong>Java fica abaixo da média</strong>: € 87/h no diretório Java da freelancermap<sup>[1]</sup> — a plataforma que fornece 80 das 96 vagas. As <strong>três</strong> únicas taxas horárias reais do board (€ 85, 75, 70/h) ficam abaixo do piso da faixa pesquisada.</li>\n      <li><span class=\"chip\">Licitações</span> <strong>Nenhuma licitação nova no filtro TED hoje.</strong> O TED ficou indisponível pelo segundo dia seguido; nenhum dos três candidatos teve prazo de entrega confirmado. Sem veredito, sem número estimado.</li>\n      <li><span class=\"chip hot\">Licitações</span> <strong>Dia útil 2 de 5 até o prazo do BSI em 10/08.</strong><sup>[6]</sup> Restam quatro dias úteis completos; os documentos de licitação continuam acessíveis apenas por sessão logada no portal.</li>\n      <li><span class=\"chip\">Mercado</span> <strong>A Bosch corta cerca de 1.200 vagas de software</strong> até o fim de 2026, sendo 950 na Alemanha — a direção automatizada avança mais devagar que o esperado.<sup>[4]</sup> Anúncio de <strong>19/01/2026</strong>, não é fato novo.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">La recopilación del martes trae <strong>96 vacantes</strong>, frente a 82 del lunes — y, por primera vez en esta serie, <strong>ninguna vacante desaparece</strong>. Suena a un mercado estable, pero en realidad dice más sobre el método de recopilación: <strong>61 de las 96 vacantes traen en el propio tablero la nota \"carried forward … not individually re-verified today\"</strong>. Solo 35 se verificaron en vivo hoy. Cero bajas no significa que nada haya salido del mercado, sino que dos tercios del tablero no se tocaron hoy. El rendimiento sigue casi estancado: <strong>+14 filas producen +2 vacantes por encima de Fit 70</strong>. Mientras tanto, la línea de Suiza se duplica — y cada vacante suiza nueva es inalcanzable desde Brasil.</p>\n    <ul>\n      <li><span class=\"chip hot\">Tablero</span> <strong>96 vacantes</strong>: 81 freelance, 10 en plantilla, 5 curiosidades. 82 se mantienen, 14 nuevas, <strong>0 bajas</strong> — y cero variación de puntaje en las 82 que se mantienen. El segundo día seguido de comparación limpia.</li>\n      <li><span class=\"chip hot\">Tablero</span> <strong>Solo 35 de las 96 vacantes se extrajeron en vivo hoy.</strong> Las otras 61 están marcadas explícitamente como reportadas sin reverificar. Quien vaya a escribir a partir de este tablero hoy debería abrir antes el anuncio original.</li>\n      <li><span class=\"chip\">Tablero</span> <strong>La franja de aciertos se mueve poco</strong>: ≥ Fit 70 pasó de 22 a 24, ≥ 75 de 13 a 14, mediana de 61.5 a 62.0. La cabeza sigue siendo iSAX 83, teclift 82, JetBrains 82, ELCA Zürich 81.</li>\n      <li><span class=\"chip hot\">CH</span> <strong>La línea de Suiza se duplica de 4 a 8</strong> — con las bandas más altas del tablero (CHF 130–180/h*). Las cuatro incorporaciones exigen presencia en Suiza; sus puntos de ubicación son 3, 3, 9 y 12 de 20.</li>\n      <li><span class=\"chip hot\">CH</span> <strong>El propio umbral CH de este perfil está por encima del mercado</strong>: Estudio Salarial de TI Suiza 2026 — Senior Software Engineer <strong>CHF 115,000–145,000</strong>, AI &amp; Data Engineer <strong>CHF 130,000–165,000</strong>.<sup>[3]</sup> El umbral de filtro de este brief (≥ CHF 150 mil) elimina toda la banda sénior.</li>\n      <li><span class=\"chip hot\">Tarifa</span> <strong>El promedio DACH baja a 103 €/h</strong> (año anterior 104), 62% no planea subir precios, 9% quiere bajarlos — Freelancer-Kompass 2026, n = 5,412.<sup>[2]</sup> El ingreso mensual baja de 8,432 € a <strong>6,653 €</strong>.</li>\n      <li><span class=\"chip hot\">Tarifa</span> <strong>Java queda por debajo del promedio</strong>: 87 €/h en el directorio Java de freelancermap<sup>[1]</sup> — la plataforma que aporta 80 de las 96 vacantes. Las <strong>tres</strong> únicas tarifas por hora reales del tablero (85, 75, 70 €/h) están por debajo del piso de la banda investigada.</li>\n      <li><span class=\"chip\">Licitaciones</span> <strong>Hoy no hay ninguna licitación nueva en el filtro TED.</strong> TED estuvo inaccesible por segundo día consecutivo; para ninguno de los tres candidatos se pudo confirmar una fecha límite de entrega. Sin veredicto, sin cifra estimada.</li>\n      <li><span class=\"chip hot\">Licitaciones</span> <strong>Día hábil 2 de 5 hasta el plazo del BSI el 10/08.</strong><sup>[6]</sup> Quedan cuatro días hábiles completos; los documentos de licitación siguen siendo accesibles solo mediante una sesión iniciada en el portal de contrataciones.</li>\n      <li><span class=\"chip\">Mercado</span> <strong>Bosch recorta cerca de 1,200 puestos de software</strong> para fines de 2026, 950 de ellos en Alemania — la conducción automatizada avanza más despacio de lo esperado.<sup>[4]</sup> Anuncio del <strong>19/01/2026</strong>, no es un hecho reciente.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Dienstag, der 4. August — und die wichtigste Nachricht des Tages ist eine Korrektur an der Prognose von gestern. Für <strong>Dia dos Pais am Sonntag, den 09.08.</strong>, stand hier vor 24 Stunden noch <strong>23,4 mm Regen bei 24 °C</strong>. Dieselbe Climatempo-Seite für Ribeirão Claro sagt heute: <strong>0,0 mm, 0 %, „Não chove\"</strong> — und <strong>31 °C</strong>. Der warme Tag ist vom Samstag auf den Sonntag gerutscht, und die Kaltluft, die für den 8. August angekündigt war, steht in der neueren Meldung erst am <strong>12. August</strong>. Wer den Vatertag draußen plant, kann das jetzt tun — mit Schatten und früh, nicht mittags. Dazu: Die <strong>Multivacinação</strong> läuft seit gestern und gibt vier Wochen Zeit, das Impfheft aller vier Kinder zu schließen.</p>\n    <ul>\n      <li><span class=\"chip good\">WETTER</span> <strong>Der Vatertag dreht:</strong> Climatempo meldet für So 09.08. jetzt <strong>20–31 °C, 0,0 mm, 0 %</strong> und wörtlich „<em>Sol com algumas nuvens. Não chove.</em>\" Gestern stand an derselben Stelle noch 23,4 mm.</li>\n      <li><span class=\"chip hot\">WETTER</span> <strong>Aber nicht unstrittig:</strong> theweather.com sieht für denselben Sonntag <strong>50 % „light rain\"</strong>. Beim Höchstwert sind beide Portale einig — <strong>31 °C</strong> bzw. 89 °F ≈ 32 °C. Wir drucken beide Regenwerte.</li>\n      <li><span class=\"chip good\">WETTER</span> <strong>Heute und morgen trocken:</strong> Di <strong>15–26 °C</strong>, Mi <strong>15–24 °C</strong>, beide Tage 0,0 mm und 0 % — in beiden Portalen. Das ist das verlässlichste Outdoor-Fenster der Woche.</li>\n      <li><span class=\"chip\">WETTER</span> <strong>Do bis Sa bleibt nass:</strong> Do 0,6 mm (48 %), Fr <strong>7,3 mm</strong> (43 %), Sa 3,1 mm (44 %) laut Climatempo; theweather liegt mit 60/80/80 % deutlich höher. Richtung gleich, Menge strittig.</li>\n      <li><span class=\"chip\">WETTER</span> <strong>Di         "de": "<div class=\"tldr\"><p class=\"lead\">Dienstag, der 4. August — und die wichtigste Nachricht des Tages ist eine Korrektur an der Prognose von gestern. Für <strong>Dia dos Pais am Sonntag, den 09.08.</strong>, stand hier vor 24 Stunden noch <strong>23,4 mm Regen bei 24 °C</strong>. Dieselbe Climatempo-Seite für Ribeirão Claro sagt heute: <strong>0,0 mm, 0 %, „Não chove\"</strong> — und <strong>31 °C</strong>. Der warme Tag ist vom Samstag auf den Sonntag gerutscht, und die Kaltluft, die für den 8. August angekündigt war, steht in der neueren Meldung erst am <strong>12. August</strong>. Wer den Vatertag draußen plant, kann das jetzt tun — mit Schatten und früh, nicht mittags. Dazu: Die <strong>Multivacinação</strong> läuft seit gestern und gibt vier Wochen Zeit, das Impfheft aller vier Kinder zu schließen.</p>\n    <ul>\n      <li><span class=\"chip good\">WETTER</span> <strong>Der Vatertag dreht:</strong> Climatempo meldet für So 09.08. jetzt <strong>20–31 °C, 0,0 mm, 0 %</strong> und wörtlich „<em>Sol com algumas nuvens. Não chove.</em>\" Gestern stand an derselben Stelle noch 23,4 mm.</li>\n      <li><span class=\"chip hot\">WETTER</span> <strong>Aber nicht unstrittig:</strong> theweather.com sieht für denselben Sonntag <strong>50 % „light rain\"</strong>. Beim Höchstwert sind beide Portale einig — <strong>31 °C</strong> bzw. 89 °F ≈ 32 °C. Wir drucken beide Regenwerte.</li>\n      <li><span class=\"chip good\">WETTER</span> <strong>Heute und morgen trocken:</strong> Di <strong>15–26 °C</strong>, Mi <strong>15–24 °C</strong>, beide Tage 0,0 mm und 0 % — in beiden Portalen. Das ist das verlässlichste Outdoor-Fenster der Woche.</li>\n      <li><span class=\"chip\">WETTER</span> <strong>Do bis Sa bleibt nass:</strong> Do 0,6 mm (48 %), Fr <strong>7,3 mm</strong> (43 %), Sa 3,1 mm (44 %) laut Climatempo; theweather liegt mit 60/80/80 % deutlich höher. Richtung gleich, Menge strittig.</li>\n      <li><span class=\"chip\">WETTER</span> <strong>Die Kaltluft kommt später — und kaum zu uns:</strong> Neuere Meldung datiert den Tiefpunkt auf <strong>Mi 12.08.</strong> mit 3 °C in Curitiba. Bei uns bleibt das Minimum bis dahin bei <strong>14–16 °C</strong>. Kein Kälteeinbruch im Norte Pioneiro.</li>\n      <li><span class=\"chip\">GESUNDHEIT</span> <strong>Multivacinação läuft:</strong> <strong>03.08.–01.09.</strong> in allen <strong>399</strong> Kommunen Paranás, über <strong>1.800 Impfstellen</strong>, für alle unter 15 — Masern, Polio, Grippe, HPV. „Dia D\" ist Sa <strong>22.08.</strong>, alles kostenlos über den SUS.</li>\n      <li><span class=\"chip good\">BABY</span> <strong>Atemwegs-Lage unverändert:</strong> Kein neues InfoGripe seit <strong>SE 29/2026</strong> (30.07.) — Paraná weiter erhöht, aber ohne Wachstumssignal. Die Regeln fürs Baby bleiben, die Kurve arbeitet für uns.</li>\n      <li><span class=\"chip good\">EVENT</span> <strong>Samstag mit Dach, Sonntag mit Schatten:</strong> „Churrasco do Paizão\" am Londrina Norte Shopping ab <strong>11 h</strong>, gratis — plus das ganzjährig kostenlose <strong>Aquário de Londrina</strong> als Regen-Puffer.</li>\n      <li><span class=\"chip\">EVENT</span> <strong>Neu im Radar:</strong> Gala des <strong>Moscow Ballet</strong> mit Oksana Bondareva am So 09.08. im Teatro Mãe De Deus, Londrina — Uhrzeit und Preis noch unbestätigt. Und <strong>Do 13.08.</strong> startet „Patrulha Canina: Uma Aventura Dino\" im Kino.</li>\n      <li><span class=\"chip\">SCHULE</span> <strong>Normale Woche:</strong> 2. Trimester läuft bis 04.09. Fr <strong>07.08.</strong> Dia do Funcionário de Escola, Di <strong>11.08.</strong> Dia do Estudante — Gedenktage, kein freier Tag. Dia dos Pais ist Sonntag und kein Feiertag.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Tuesday, August 4 — and today's biggest story is a correction to yesterday's forecast. For <strong>Dia dos Pais on Sunday, 08/09</strong>, this brief said 24 hours ago that it would bring <strong>23.4 mm of rain at 24°C</strong>. The same Climatempo page for Ribeirão Claro now says: <strong>0.0 mm, 0%, \"Não chove\"</strong> — and <strong>31°C</strong>. The warm day has slid from Saturday onto Sunday, and the cold air mass forecast for August 8 now shows up, in the newer report, only on <strong>August 12</strong>. Anyone planning to spend Dia dos Pais outdoors can go ahead — with shade, and early rather than at midday. Also today: the <strong>Multivacinação</strong> campaign, which started yesterday, gives four weeks to close out all four kids' vaccination records.</p>\n    <ul>\n      <li><span class=\"chip good\">WEATHER</span> <strong>Dia dos Pais flips:</strong> Climatempo now has Sun 08/09 at <strong>20–31°C, 0.0 mm, 0%</strong> and, literally, \"Sol com algumas nuvens. Não chove.\" Yesterday the same page said 23.4 mm.</li>\n      <li><span class=\"chip hot\">WEATHER</span> <strong>But not undisputed:</strong> theweather.com puts the same Sunday at <strong>50% \"light rain.\"</strong> Both portals agree on the high — <strong>31°C</strong> vs. 89°F ≈ 32°C. We're printing both rain figures.</li>\n      <li><span class=\"chip good\">WEATHER</span> <strong>Dry today and tomorrow:</strong> Tue <strong>15–26°C</strong>, Wed <strong>15–24°C</strong>, both days 0.0 mm and 0% — in both portals. That's the week's most reliable outdoor window.</li>\n      <li><span class=\"chip\">WEATHER</span> <strong>Thu through Sat stays wet:</strong> Thu 0.6 mm (48%), Fri <strong>7.3 mm</strong> (43%), Sat 3.1 mm (44%) per Climatempo; theweather runs well higher at 60/80/80%. Same direction, disputed amount.</li>\n      <li><span class=\"chip\">WEATHER</span> <strong>The cold air comes later — and barely reaches us:</strong> The newer report now dates the low point to <strong>Wed 08/12</strong>, with 3°C in Curitiba. Here, the minimum stays at <strong>14–16°C</strong> until then. No cold snap in the Norte Pioneiro.</li>\n      <li><span class=\"chip\">HEALTH</span> <strong>Multivacinação is underway:</strong> <strong>08/03–09/01</strong> across all <strong>399</strong> municipalities in Paraná, at over <strong>1,800</strong> vaccination sites, for everyone under 15 — measles, polio, flu, HPV. \"Dia D\" is Sat <strong>08/22</strong>, all free through the SUS.</li>\n      <li><span class=\"chip good\">BABY</span> <strong>Respiratory picture unchanged:</strong> No new InfoGripe bulletin since <strong>SE 29/2026</strong> (07/30) — Paraná stays elevated but without a growth signal. The baby rules stand; the curve is working in our favor.</li>\n      <li><span class=\"chip good\">EVENT</span> <strong>Saturday under cover, Sunday under shade:</strong> \"Churrasco do Paizão\" at Londrina Norte Shopping from <strong>11 AM</strong>, free — plus the year-round, free <strong>Aquário de Londrina</strong> as a rain buffer.</li>\n      <li><span class=\"chip\">EVENT</span> <strong>New on the radar:</strong> a <strong>Moscow Ballet</strong> gala with Oksana Bondareva on Sun 08/09 at Teatro Mãe De Deus, Londrina — time and price still unconfirmed. And <strong>Thu 08/13</strong>, \"Patrulha Canina: Uma Aventura Dino\" opens in theaters.</li>\n      <li><span class=\"chip\">SCHOOL</span> <strong>Normal week:</strong> the 2nd trimester runs through 09/04. Fri <strong>08/07</strong> is Dia do Funcionário de Escola, Tue <strong>08/11</strong> is Dia do Estudante — commemorative dates, not days off. Dia dos Pais falls on a Sunday and isn't a holiday.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Terça-feira, 4 de agosto — e a notícia mais importante do dia é uma correção na previsão de ontem. Para o <strong>Dia dos Pais, no domingo, 09/08</strong>, esta edição trazia até 24 horas atrás <strong>23,4 mm de chuva a 24 °C</strong>. A mesma página da Climatempo para Ribeirão Claro diz hoje: <strong>0,0 mm, 0%, \"Não chove\"</strong> — e <strong>31 °C</strong>. O dia quente escorregou do sábado para o domingo, e o ar frio que estava previsto para 8 de agosto só aparece, na notícia mais recente, em <strong>12 de agosto</strong>. Quem planeja o Dia dos Pais ao ar livre já pode fazer isso — com sombra e cedo, não ao meio-dia. Além disso: a <strong>Multivacinação</strong> está em andamento desde ontem e dá quatro semanas para fechar a caderneta de vacinação das quatro crianças.</p>\n    <ul>\n      <li><span class=\"chip good\">CLIMA</span> <strong>O Dia dos Pais vira:</strong> a Climatempo informa agora, para dom 09/08, <strong>20–31 °C, 0,0 mm, 0%</strong> e, literalmente, \"Sol com algumas nuvens. Não chove.\" Ontem, no mesmo lugar, ainda constavam 23,4 mm.</li>\n      <li><span class=\"chip hot\">CLIMA</span> <strong>Mas não é consenso:</strong> o theweather.com prevê para o mesmo domingo <strong>50% de \"light rain.\"</strong> Na máxima, os dois portais concordam — <strong>31 °C</strong> ou 89 °F ≈ 32 °C. Publicamos os dois valores de chuva.</li>\n      <li><span class=\"chip good\">CLIMA</span> <strong>Hoje e amanhã, seco:</strong> ter <strong>15–26 °C</strong>, qua <strong>15–24 °C</strong>, os dois dias com 0,0 mm e 0% — nos dois portais. É a janela mais confiável da semana para atividades ao ar livre.</li>\n      <li><span class=\"chip\">CLIMA</span> <strong>De quinta a sábado, continua chuvoso:</strong> qui 0,6 mm (48%), sex <strong>7,3 mm</strong> (43%), sáb 3,1 mm (44%) segundo a Climatempo; o theweather aponta bem mais alto, com 60/80/80%. Mesma direção, volume em disputa.</li>\n      <li><span class=\"chip\">CLIMA</span> <strong>O ar frio chega mais tarde — e quase não nos atinge:</strong> a notícia mais recente marca o ponto mais baixo para <strong>qua 12/08</strong>, com 3 °C em Curitiba. Aqui, a mínima permanece em <strong>14–16 °C</strong> até lá. Sem onda de frio no Norte Pioneiro.</li>\n      <li><span class=\"chip\">SAÚDE</span> <strong>Multivacinação em andamento:</strong> de <strong>03/08 a 01/09</strong>, em todos os <strong>399</strong> municípios do Paraná, em mais de <strong>1.800</strong> postos, para todos com menos de 15 anos — sarampo, pólio, gripe, HPV. O \"Dia D\" é sáb <strong>22/08</strong>, tudo gratuito pelo SUS.</li>\n      <li><span class=\"chip good\">BEBÊ</span> <strong>Quadro respiratório sem mudanças:</strong> nenhum InfoGripe novo desde a <strong>SE 29/2026</strong> (30/07) — o Paraná segue com incidência elevada, mas sem sinal de crescimento. As regras para o bebê continuam, a curva está a nosso favor.</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Sábado com teto, domingo com sombra:</strong> o \"Churrasco do Paizão\" no Londrina Norte Shopping a partir das <strong>11h</strong>, grátis — mais o <strong>Aquário de Londrina</strong>, gratuito o ano todo, como plano B para a chuva.</li>\n      <li><span class=\"chip\">EVENTO</span> <strong>Novo no radar:</strong> gala do <strong>Moscow Ballet</strong> com Oksana Bondareva no dom 09/08, no Teatro Mãe De Deus, Londrina — horário e preço ainda não confirmados. E na <strong>qui 13/08</strong> estreia \"Patrulha Canina: Uma Aventura Dino\" no cinema.</li>\n      <li><span class=\"chip\">ESCOLA</span> <strong>Semana normal:</strong> o 2º trimestre segue até 04/09. Sex <strong>07/08</strong>, Dia do Funcionário de Escola; ter <strong>11/08</strong>, Dia do Estudante — datas comemorativas, sem folga. O Dia dos Pais é domingo e não é feriado.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Martes 4 de agosto — y la noticia más importante del día es una corrección al pronóstico de ayer. Para el <strong>Dia dos Pais, el domingo 09/08</strong>, esta edición decía hace 24 horas que traería <strong>23,4 mm de lluvia a 24 °C</strong>. La misma página de Climatempo para Ribeirão Claro dice hoy: <strong>0,0 mm, 0 %, \"Não chove\"</strong> — y <strong>31 °C</strong>. El día caluroso se corrió del sábado al domingo, y el aire frío que se anunciaba para el 8 de agosto aparece, en la nota más reciente, hasta el <strong>12 de agosto</strong>. Quien planee el Dia dos Pais al aire libre ya puede hacerlo — con sombra y temprano, no al mediodía. Además: la <strong>Multivacinação</strong> está en marcha desde ayer y da cuatro semanas para poner al día la cartilla de vacunación de las cuatro niñas y niños.</p>\n    <ul>\n      <li><span class=\"chip good\">CLIMA</span> <strong>El Dia dos Pais da un giro:</strong> Climatempo indica ahora, para el dom 09/08, <strong>20–31 °C, 0,0 mm, 0 %</strong> y, literalmente, \"Sol com algumas nuvens. Não chove.\" Ayer, en el mismo lugar, todavía aparecían 23,4 mm.</li>\n      <li><span class=\"chip hot\">CLIMA</span> <strong>Pero no hay consenso:</strong> theweather.com prevé para el mismo domingo <strong>50 % de \"light rain.\"</strong> En la máxima, los dos portales coinciden — <strong>31 °C</strong> u 89 °F ≈ 32 °C. Publicamos los dos valores de lluvia.</li>\n      <li><span class=\"chip good\">CLIMA</span> <strong>Hoy y mañana, secos:</strong> mar <strong>15–26 °C</strong>, mié <strong>15–24 °C</strong>, los dos días con 0,0 mm y 0 % — en ambos portales. Es la ventana más confiable de la semana para actividades al aire libre.</li>\n      <li><span class=\"chip\">CLIMA</span> <strong>De jueves a sábado sigue lloviendo:</strong> jue 0,6 mm (48 %), vie <strong>7,3 mm</strong> (43 %), sáb 3,1 mm (44 %) según Climatempo; theweather marca mucho más alto, con 60/80/80 %. Misma dirección, cantidad en disputa.</li>\n      <li><span class=\"chip\">CLIMA</span> <strong>El aire frío llega más tarde — y casi no nos toca:</strong> la nota más reciente ubica el punto más bajo el <strong>mié 12/08</strong>, con 3 °C en Curitiba. Aquí, la mínima se mantiene en <strong>14–16 °C</strong> hasta entonces. Sin frente frío en el Norte Pioneiro.</li>\n      <li><span class=\"chip\">SALUD</span> <strong>La Multivacinação está en marcha:</strong> del <strong>03/08 al 01/09</strong>, en los <strong>399</strong> municipios de Paraná, en más de <strong>1.800</strong> puntos de vacunación, para todos los menores de 15 años — sarampión, polio, influenza, VPH. El \"Dia D\" es el sáb <strong>22/08</strong>, todo gratis a través del SUS.</li>\n      <li><span class=\"chip good\">BEBÉ</span> <strong>El panorama respiratorio sigue igual:</strong> no hay InfoGripe nuevo desde la <strong>SE 29/2026</strong> (30/07) — Paraná sigue con incidencia elevada, pero sin señal de crecimiento. Las reglas para la bebé se mantienen, la curva está a nuestro favor.</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Sábado bajo techo, domingo con sombra:</strong> el \"Churrasco do Paizão\" en el Londrina Norte Shopping desde las <strong>11:00</strong>, gratis — más el <strong>Aquário de Londrina</strong>, gratuito todo el año, como plan B ante la lluvia.</li>\n      <li><span class=\"chip\">EVENTO</span> <strong>Nuevo en el radar:</strong> gala del <strong>Moscow Ballet</strong> con Oksana Bondareva el dom 09/08, en el Teatro Mãe De Deus, Londrina — horario y precio aún sin confirmar. Y el <strong>jue 13/08</strong> se estrena \"Patrulha Canina: Uma Aventura Dino\" en el cine.</li>\n      <li><span class=\"chip\">ESCUELA</span> <strong>Semana normal:</strong> el 2º trimestre sigue hasta el 04/09. Vie <strong>07/08</strong>, Dia do Funcionário de Escola; mar <strong>11/08</strong>, Dia do Estudante — fechas conmemorativas, sin día libre. El Dia dos Pais cae en domingo y no es feriado.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Dienstag, der 4. August — Rotationsthema <em>Software &amp; Technologie</em>, elfte Folge, und diesmal geht es um das Vokabular, das du beim Bauen der eigenen Seiten wirklich brauchst: <strong>digitale Barrierefreiheit</strong>. Der Anlass ist kein Tages-Newsflash, sondern eine Frist, die seit gut einem Jahr läuft: Das deutsche <strong>Barrierefreiheitsstärkungsgesetz</strong> vom 16. Juli 2021 — die Umsetzung der EU-Richtlinie 2019/882 — ist am <strong>28. Juni 2025</strong> in Kraft getreten und verpflichtet unter anderem E-Commerce-Dienste, E-Books und Verbraucher-Hardware auf Barrierefreiheit. Die dazugehörige technische Messlatte ist noch älter und noch konkreter: Die WCAG des W3C verlangen für normalen Text ein Kontrastverhältnis von mindestens <strong>4,5:1</strong>. Genau diese Wörter fehlen einem im Alltag zwischen Ticket, Code-Review und Kunden-Call — auf Deutsch <em>und</em> auf Portugiesisch. <strong>12 Einträge, davon 3 Verben mit voller Konjugation</strong>, plus 2 Auffrischungen vom 14. und 21. Juli.</p>\n    <ul>\n      <li><span class=\"chip\">KONJUGATION</span> <strong>bedient, angepasst, gekennzeichnet</strong> — drei deutsche Verben, drei verschiedene Partizipien. <em>bedienen</em> bekommt gar kein ge-, <em>anpassen</em> klemmt es in die Mitte, und <em>kennzeichnen</em> — obwohl vorne betont — setzt es brav nach vorn. Der Grund liegt nicht in der Betonung, sondern in der Wortbildung — mehr dazu unten. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/kennzeichnen.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip hot\">FALSE FRIEND</span> <strong>die Fabrik ≠ fabric</strong> — englisch <em>fabric</em> heißt <em>Stoff</em>, deutsch <em>Fabrik</em> heißt <em>factory</em>. Beide stammen vom lateinischen <em>fabrica</em> (Werkstatt), sind aber in entgegengesetzte Richtungen gelaufen. Portugiesisch und Spanisch bleiben beim Deutschen: <em>a fábrica</em>, <em>la fábrica</em>. <span class=\"src\"><a href=\"https://www.duden.de/rechtschreibung/Fabrik\">duden.de</a> · <a href=\"https://yourdailygerman.com/fabric-fabrik-stoff-meaning/\">yourdailygerman.com</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>leitor de tela, nicht leitor de ecrã</strong> — der Screenreader heißt in Brasilien <em>leitor de tela</em>, in Portugal <em>leitor de ecrã</em>. Dieselbe Bruchlinie wie bei <em>celular</em>/<em>telemóvel</em>. Spanisch: <em>lector de pantalla</em>. <span class=\"src\"><a href=\"https://pt.wikipedia.org/wiki/Leitor_de_tela\">pt.wikipedia.org</a></span></li>\n      <li><span class=\"chip\">GENUS</span> <strong>das Kontrastverhältnis, aber a relação de contraste</strong> — Deutsch schiebt zwei Substantive zu einem Neutrum zusammen, Portugiesisch und Spanisch bauen eine feminine Fügung mit <em>de</em>. Vorlesen musst du es auch verschieden: „vier Komma fünf <em>zu</em> eins\" — <em>quatro vírgula cinco <strong>para</strong> um</em> — <em>cuatro coma cinco <strong>a</strong> uno</em>. <span class=\"src\"><a href=\"https://www.w3c.br/traducoes/wcag/wcag21-pt-BR/\">w3c.br</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>Untertitel = legenda</strong> — im Film heißt der Untertitel auf Brasilianisch <em>a legenda</em>, nicht <em>o subtítulo</em>. Priberam führt unter demselben Stichwort auch die Bildunterschrift: Ein portugiesisches Wort deckt zwei deutsche ab. Spanisch trennt wieder: <em>los subtítulos</em> vs. <em>el pie de foto</em>. <span class=\"src\"><a href=\"https://dicionario.priberam.org/legenda\">priberam.org</a></span></li>\n      <li><span class=\"chip\">PHRASE</span> <strong>barrierefrei hat im Duden eine eigene Web-Bedeutung</strong> — nicht nur „ohne Stufen\", sondern ausdrücklich „(von Internetseiten) so gestaltet, dass es auch von Menschen mit Behinderung ohne Erschwernis oder fremde Hilfe genutzt werden kann\". Ein deutsches Wort, das seine zweite Bedeutung im Web bekommen hat. <span class=\"src\"><a href=\"https://www.duden.de/rechtschreibung/barrierefrei\">duden.de</a></span></li>\n    </ul></div>",

        "de": "<div class=\"tldr\"><p class=\"lead\">Dienstag, der 4. August — Rotationsthema <em>Software &amp; Technologie</em>, elfte Folge, und diesmal geht es um das Vokabular, das du beim Bauen der eigenen Seiten wirklich brauchst: <strong>digitale Barrierefreiheit</strong>. Der Anlass ist kein Tages-Newsflash, sondern eine Frist, die seit gut einem Jahr läuft: Das deutsche <strong>Barrierefreiheitsstärkungsgesetz</strong> vom 16. Juli 2021 — die Umsetzung der EU-Richtlinie 2019/882 — ist am <strong>28. Juni 2025</strong> in Kraft getreten und verpflichtet unter anderem E-Commerce-Dienste, E-Books und Verbraucher-Hardware auf Barrierefreiheit. Die dazugehörige technische Messlatte ist noch älter und noch konkreter: Die WCAG des W3C verlangen für normalen Text ein Kontrastverhältnis von mindestens <strong>4,5:1</strong>. Genau diese Wörter fehlen einem im Alltag zwischen Ticket, Code-Review und Kunden-Call — auf Deutsch <em>und</em> auf Portugiesisch. <strong>12 Einträge, davon 3 Verben mit voller Konjugation</strong>, plus 2 Auffrischungen vom 14. und 21. Juli.</p>\n    <ul>\n      <li><span class=\"chip\">KONJUGATION</span> <strong>bedient, angepasst, gekennzeichnet</strong> — drei deutsche Verben, drei verschiedene Partizipien. <em>bedienen</em> bekommt gar kein ge-, <em>anpassen</em> klemmt es in die Mitte, und <em>kennzeichnen</em> — obwohl vorne betont — setzt es brav nach vorn. Der Grund liegt nicht in der Betonung, sondern in der Wortbildung — mehr dazu unten. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/kennzeichnen.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip hot\">FALSE FRIEND</span> <strong>die Fabrik ≠ fabric</strong> — englisch <em>fabric</em> heißt <em>Stoff</em>, deutsch <em>Fabrik</em> heißt <em>factory</em>. Beide stammen vom lateinischen <em>fabrica</em> (Werkstatt), sind aber in entgegengesetzte Richtungen gelaufen. Portugiesisch und Spanisch bleiben beim Deutschen: <em>a fábrica</em>, <em>la fábrica</em>. <span class=\"src\"><a href=\"https://www.duden.de/rechtschreibung/Fabrik\">duden.de</a> · <a href=\"https://yourdailygerman.com/fabric-fabrik-stoff-meaning/\">yourdailygerman.com</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>leitor de tela, nicht leitor de ecrã</strong> — der Screenreader heißt in Brasilien <em>leitor de tela</em>, in Portugal <em>leitor de ecrã</em>. Dieselbe Bruchlinie wie bei <em>celular</em>/<em>telemóvel</em>. Spanisch: <em>lector de pantalla</em>. <span class=\"src\"><a href=\"https://pt.wikipedia.org/wiki/Leitor_de_tela\">pt.wikipedia.org</a></span></li>\n      <li><span class=\"chip\">GENUS</span> <strong>das Kontrastverhältnis, aber a relação de contraste</strong> — Deutsch schiebt zwei Substantive zu einem Neutrum zusammen, Portugiesisch und Spanisch bauen eine feminine Fügung mit <em>de</em>. Vorlesen musst du es auch verschieden: „vier Komma fünf <em>zu</em> eins\" — <em>quatro vírgula cinco <strong>para</strong> um</em> — <em>cuatro coma cinco <strong>a</strong> uno</em>. <span class=\"src\"><a href=\"https://www.w3c.br/traducoes/wcag/wcag21-pt-BR/\">w3c.br</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>Untertitel = legenda</strong> — im Film heißt der Untertitel auf Brasilianisch <em>a legenda</em>, nicht <em>o subtítulo</em>. Priberam führt unter demselben Stichwort auch die Bildunterschrift: Ein portugiesisches Wort deckt zwei deutsche ab. Spanisch trennt wieder: <em>los subtítulos</em> vs. <em>el pie de foto</em>. <span class=\"src\"><a href=\"https://dicionario.priberam.org/legenda\">priberam.org</a></span></li>\n      <li><span class=\"chip\">PHRASE</span> <strong>barrierefrei hat im Duden eine eigene Web-Bedeutung</strong> — nicht nur „ohne Stufen\", sondern ausdrücklich „(von Internetseiten) so gestaltet, dass es auch von Menschen mit Behinderung ohne Erschwernis oder fremde Hilfe genutzt werden kann\". Ein deutsches Wort, das seine zweite Bedeutung im Web bekommen         "en": "<div class=\"tldr\"><p class=\"lead\">Tuesday, August 4 — rotation theme <em>Software &amp; Technology</em>, eleventh installment, and this time it's the vocabulary you actually need while building your own pages: <strong>digital accessibility</strong>. The hook isn't a news flash but a deadline that's been running for about a year: Germany's <strong>Barrierefreiheitsstärkungsgesetz</strong> (Accessibility Strengthening Act) of July 16, 2021 — implementing EU Directive 2019/882 — took effect on <strong>June 28, 2025</strong>, and now binds e-commerce services, e-books, and consumer hardware to accessibility standards, among others. The technical yardstick behind it is even older and more concrete: the W3C's WCAG require a contrast ratio of at least <strong>4.5:1</strong> for normal text. These are exactly the words that go missing day to day between a ticket, a code review, and a client call — in German <em>and</em> in Portuguese. <strong>12 entries, 3 of them verbs with full conjugation</strong>, plus 2 refreshers from July 14 and July 21.</p>\n    <ul>\n      <li><span class=\"chip\">CONJUGATION</span> <strong>bedient, angepasst, gekennzeichnet</strong> — three German verbs, three different past participles. <em>bedienen</em> gets no ge- at all, <em>anpassen</em> wedges it into the middle, and <em>kennzeichnen</em> — despite being stressed on the first syllable — dutifully puts it up front. The reason isn't stress — it's word formation. More on that below. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/kennzeichnen.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip hot\">FALSE FRIEND</span> <strong>die Fabrik ≠ fabric</strong> — English <em>fabric</em> means <em>Stoff</em> (cloth), while German <em>Fabrik</em> means <em>factory</em>. Both trace back to Latin <em>fabrica</em> (workshop), but they drifted in opposite directions. Portuguese and Spanish stick with the German sense: <em>a fábrica</em>, <em>la fábrica</ rrierefrei\">duden.de</a></span></li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Terça-feira, dia 4 de agosto — tema da rotação <em>Software &amp; Tecnologia</em>, décima primeira parte, e desta vez o assunto é o vocabulário que você realmente precisa ao construir seus próprios sites: <strong>acessibilidade digital</strong>. O gancho não é uma notícia do dia, mas um prazo que já corre há mais de um ano: a alemã <strong>Barrierefreiheitsstärkungsgesetz</strong> (lei de fortalecimento da acessibilidade), de 16 de julho de 2021 — a transposição da diretiva europeia 2019/882 —, entrou em vigor em <strong>28 de junho de 2025</strong> e obriga, entre outros, serviços de e-commerce, e-books e hardware de consumo a serem acessíveis. A régua técnica correspondente é ainda mais antiga e mais concreta: as WCAG do W3C exigem, para texto normal, uma relação de contraste de pelo menos <strong>4,5:1</strong>. São exatamente essas palavras que faltam no dia a dia entre o ticket, o code review e a call com o cliente — em alemão <em>e</em> em português. <strong>12 verbetes, sendo 3 verbos com conjugação completa</strong>, mais 2 revisões de 14 e 21 de julho.</p>\n    <ul>\n      <li><span class=\"chip\">CONJUGAÇÃO</span> <strong>bedient, angepasst, gekennzeichnet</strong> — três verbos alemães, três particípios diferentes. <em>bedienen</em> não leva ge- nenhum, <em>anpassen</em> o encaixa no meio, e <em>kennzeichnen</em> — apesar de acentuado no início — o coloca na frente, comportadinho. O motivo não está na acentuação, e sim na formação da palavra — mais abaixo. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/kennzeichnen.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip hot\">FALSO COGNATO</span> <strong>die Fabrik ≠ fabric</strong> — em inglês, <em>fabric</em> significa <em>tecido</em>; em alemão, <em>Fabrik</em> significa <em>fábrica</em>. Ambos vêm do latim <em>fabrica</em> (oficina), mas seguiram direções opostas. Português e espanhol ficam do lado do alemão: <em>a fábrica</em>, <em>la fábrica</em>. <span class=\"src\"><a href=\"https://www.duden.de/rechtschreibung/Fabrik\">duden.de</a> · <a href=\"https://yourdailygerman.com/fabric-fabrik-stoff-meaning/\">yourdailygerman.com</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>leitor de tela, não leitor de ecrã</strong> — o leitor de tela se chama assim no Brasil e <em>leitor de ecrã</em> em Portugal. A mesma linha de fratura de <em>celular</em>/<em>telemóvel</em>. Em espanhol: <em>lector de pantalla</em>. <span class=\"src\"><a href=\"https://pt.wikipedia.org/wiki/Leitor_de_tela\">pt.wikipedia.org</a></span></li>\n      <li><span class=\"chip\">GÊNERO</span> <strong>das Kontrastverhältnis, mas a relação de contraste</strong> — o alemão junta dois substantivos num único neutro, português e espanhol constroem uma expressão feminina com <em>de</em>. Também se lê de forma diferente em voz alta: „vier Komma fünf <em>zu</em> eins\" — <em>quatro vírgula cinco <strong>para</strong> um</em> — <em>cuatro coma cinco <strong>a</strong> uno</em>. <span class=\"src\"><a href=\"https://www.w3c.br/traducoes/wcag/wcag21-pt-BR/\">w3c.br</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>Untertitel = legenda</strong> — no cinema, o alemão <em>Untertitel</em> se traduz por <em>a legenda</em> em português brasileiro, não por <em>o subtítulo</em>. O Priberam traz sob o mesmo verbete também a legenda de imagem: uma palavra portuguesa cobre dois conceitos alemães. O espanhol volta a separar: <em>los subtítulos</em> vs. <em>el pie de foto</em>. <span class=\"src\"><a href=\"https://dicionario.priberam.org/legenda\">priberam.org</a></span></li>\n      <li><span class=\"chip\">FRASE</span> <strong>barrierefrei tem um significado próprio para a web no Duden</strong> — não só „sem degraus\", mas explicitamente „(de sites) projetado de modo que também possa ser usado por pessoas com deficiência sem dificuldade ou ajuda de terceiros\". Uma palavra alemã que ganhou seu segundo sentido na web. <span class=\"src\"><a href=\"https://www.duden.de/rechtschreibung/barrierefrei\">duden.de</a></span></li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Martes 4 de agosto — tema de la rotación <em>Software y Tecnología</em>, undécima entrega, y esta vez se trata del vocabulario que de verdad necesitas al construir tus propias páginas: <strong>la accesibilidad digital</strong>. El motivo no es una noticia del día, sino un plazo que lleva corriendo desde hace más de un año: la <strong>ley alemana de fortalecimiento de la accesibilidad</strong> (Barrierefreiheitsstärkungsgesetz) del 16 de julio de 2021 — la transposición de la directiva de la UE 2019/882 — entró en vigor el <strong>28 de junio de 2025</strong> y obliga, entre otros, a los servicios de comercio electrónico, los libros electrónicos y el hardware de consumo a ser accesibles. El listón técnico correspondiente es todavía más antiguo y más concreto: las WCAG del W3C exigen para el texto normal una relación de contraste de al menos <strong>4,5:1</strong>. Justo esas palabras faltan en el día a día entre el ticket, el code review y la llamada con el cliente — tanto en alemán <em>como</em> en portugués. <strong>12 entradas, 3 de ellas verbos con conjugación completa</strong>, más 2 repasos del 14 y el 21 de julio.</p>\n    <ul>\n      <li><span class=\"chip\">CONJUGACIÓN</span> <strong>bedient, angepasst, gekennzeichnet</strong> — tres verbos alemanes, tres participios distintos. <em>bedienen</em> no lleva ge- en absoluto, <em>anpassen</em> lo mete en medio, y <em>kennzeichnen</em> — aunque acentuado al principio — lo coloca dócilmente al frente. El motivo no está en el acento, sino en la formación de la palabra — más abajo. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/kennzeichnen.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip hot\">FALSO AMIGO</span> <strong>die Fabrik ≠ fabric</strong> — en inglés <em>fabric</em> significa <em>tela</em>, en alemán <em>Fabrik</em> significa <em>factory</em> (fábrica). Ambas vienen del latín <em>fabrica</em> (taller), pero tomaron caminos opuestos. El portugués y el español se quedan del lado alemán: <em>a fábrica</em>, <em>la fábrica</em>. <span class=\"src\"><a href=\"https://www.duden.de/rechtschreibung/Fabrik\">duden.de</a> · <a href=\"https://yourdailygerman.com/fabric-fabrik-stoff-meaning/\">yourdailygerman.com</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>leitor de tela, no leitor de ecrã</strong> — el screen reader se llama en Brasil <em>leitor de tela</em>, y en Portugal <em>leitor de ecrã</em>. La misma línea de fractura que <em>celular</em>/<em>telemóvel</em>. En español: <em>lector de pantalla</em>. <span class=\"src\"><a href=\"https://pt.wikipedia.org/wiki/Leitor_de_tela\">pt.wikipedia.org</a></span></li>\n      <li><span class=\"chip\">GÉNERO</span> <strong>das Kontrastverhältnis, pero a relação de contraste</strong> — el alemán junta dos sustantivos en uno solo, neutro, mientras que el portugués y el español arman una construcción femenina con <em>de</em>. También hay que leerlo en voz alta de forma distinta: „vier Komma fünf <em>zu</em> eins\" — <em>quatro vírgula cinco <strong>para</strong> um</em> — <em>cuatro coma cinco <strong>a</strong> uno</em>. <span class=\"src\"><a href=\"https://www.w3c.br/traducoes/wcag/wcag21-pt-BR/\">w3c.br</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>Untertitel = legenda</strong> — en el cine, el subtítulo se llama en portugués brasileño <em>a legenda</em>, no <em>o subtítulo</em>. El Priberam recoge bajo la misma entrada también el pie de foto: una sola palabra portuguesa cubre dos palabras alemanas. El español vuelve a separarlas: <em>los subtítulos</em> frente a <em>el pie de foto</em>. <span class=\"src\"><a href=\"https://dicionario.priberam.org/legenda\">priberam.org</a></span></li>\n      <li><span class=\"chip\">FRASE</span> <strong>barrierefrei tiene en el Duden un significado propio para la web</strong> — no solo „sin escalones\", sino literalmente „(von Internetseiten) so gestaltet, dass es auch von Menschen mit Behinderung ohne Erschwernis oder fremde Hilfe genutzt werden kann\" (diseñado para que también las personas con discapacidad puedan usarlo sin dificultad ni ayuda ajena). Una palabra alemana que adquirió su segundo significado en la web. <span class=\"src\"><a href=\"https://www.duden.de/rechtschreibung/barrierefrei\">duden.de</a></span></li>\n    </ul></div>"

// ============================================================
