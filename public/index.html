<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daniels Morning Briefs</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="lib/tokens.css">
<script>
  // Pre-paint animation policy (mirrors the terminal core / pagr): an explicit
  // "off" in localStorage — or no pick while the OS prefers reduced motion —
  // marks html.anim-off so components.css kills keyframes (incl. the brand
  // cursor blink) with no flash. The footer anim toggle persists "on"/"off".
  (function () {
    let pref = null;
    try { pref = localStorage.getItem('anim'); } catch (_) {}
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (pref === 'off' || (pref === null && reduced)) {
      document.documentElement.classList.add('anim-off');
    }
  })();
  // Resolution-independent zoom (mirrors pagr): lay out at a 1920px reference, then
  // scale the whole view up on wider screens — a true zoom of everything, never below
  // 1×. Pre-paint to avoid a flash.
  (function () {
    var applyZoom = function () {
      document.documentElement.style.zoom = String(Math.max(1, window.innerWidth / 1920));
    };
    applyZoom();
    window.addEventListener('resize', applyZoom);
  })();
</script>
<style>
  /* Dashboard chrome styles. Design tokens (colours, shadow, typography vars)
     come from lib/tokens.css — keep them there so the dashboard and the
     newsletter content stay in sync. */
  * { box-sizing: border-box; }
  /* Lock the outer document — only inner scroll containers (the .home view
     and the iframe) handle scrolling. Without this, a tiny mismatch between
     header.app + .app-shell heights and 100vh adds a few pixels of overflow
     to <html>, producing a second outer scrollbar alongside the one inside
     .home. overflow: hidden on both html and body kills that outer track. */
  html, body {
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    height: 100%;
    overflow: hidden;
  }
  html { position: relative; }

  /* Paper-grain noise overlay — same texture as the newsletter pages.
     Imperceptible up close, breaks LCD flatness at distance. Disabled under
     reduced-motion / high-contrast preferences. */
  html::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image: none;
    opacity: 0.04;
    mix-blend-mode: multiply;
  }
  @media (prefers-reduced-motion: reduce), (prefers-contrast: more) {
    html::before { display: none; }
  }
  body > *, header.app { position: relative; z-index: 1; }
  body {
    font-family: var(--font-body);
    line-height: 1.5;
    font-size: 15px;
    font-feature-settings: "kern", "liga", "onum";
    -webkit-font-smoothing: antialiased;
  }

  /* Terminal header bar — mirrors the pagr/seedr chrome: a single row on a
     --card surface with a --border bottom rule. LEFT: the brand wordmark
     (mono + .glow) and a blinking .cursor-block. RIGHT: the nav-rail minimize
     toggle. */
  header.app {
    border-bottom: 1px solid var(--border);
    background: var(--card);
    font-family: var(--font-mono); /* chrome is terminal mono; the content stays serif */
    /* Lift the header above the content, which is also a positioned body child
       at z-index 1 and would otherwise paint over it. */
    z-index: 50;
    padding: 0 1rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    min-height: 3rem;
  }
  /* LEFT zone — brand only. */
  .header-left {
    display: flex;
    align-items: center;
    flex: none;
    min-width: 0;
  }
  .header-brand {
    display: inline-flex;
    align-items: center;
    flex: none;
    text-decoration: none;
    cursor: pointer;
  }
  .header-brand .brand-word {
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: -0.01em;
  }

  /* RIGHT zone — the nav-rail minimize toggle, pushed to the far right
     (the header has no center zone). */
  .header-right {
    flex: none;
    margin-left: auto;
    display: flex;
    align-items: center;
  }

  /* Layout: two columns — flexible main + a fixed-width nav-rail on the right.
     The fixed footer is 2rem tall, so the shell is the viewport minus the
     header (3rem) and the footer (2rem). When the rail is collapsed the
     --rail-w track narrows to the icon-only strip. */
  .app-shell {
    display: grid;
    grid-template-columns: minmax(0, 1fr) var(--rail-w, 16rem);
    height: calc(100vh - 3rem - 2rem);
    height: calc(100dvh - 3rem - 2rem);
  }
  .app-shell.rail-collapsed { --rail-w: 3rem; }

  /* The nav lives in the sticky right sidebar (.nav-rail). It holds the
     Übersicht control (#home-btn) and #nav-groups (the grouped category nav,
     populated by JS). */
  .nav-label {
    font-family: var(--font-mono);
    font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--muted-foreground); padding: 0.5rem 0.85rem 0.2rem; font-weight: 600;
  }
  #nav-groups { padding-bottom: 0.2rem; }

  .cat {
    margin: 0;
    border-radius: 0;
    overflow: hidden;
    border: 0;
  }
  .cat-head {
    display: flex; align-items: center; gap: 0.55rem;
    padding: 0.45rem 0.85rem;
    cursor: pointer;
    border-radius: 0;
    transition: background 120ms;
    min-height: 2.1rem;
  }
  .cat-head:hover { background: var(--muted); }
  .cat-head:hover .cat-name { color: var(--primary); }
  .cat.active .cat-head { background: var(--muted); }
  .cat.active .cat-name { color: var(--primary); }
  .cat-color { width: 6px; height: 18px; border-radius: 0; flex: none; }
  .cat-name {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 0.8rem;
    color: var(--foreground);
    transition: color 0.15s ease;
    flex: 1;
    /* Single-line; ellipsise rather than wrap to two lines. */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .cat-icon { font-size: 1.05rem; }
  .cat-latest {
    font-family: var(--font-mono);
    font-size: 0.68rem; color: var(--soft);
    font-feature-settings: "tnum"; font-weight: 500;
  }
  .cat-toggle {
    background: transparent; border: none;
    color: var(--soft); cursor: pointer;
    transition: transform 150ms ease, background 120ms, color 120ms;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    padding: 0.55rem 0.7rem;
    border-radius: var(--radius-inline);
    line-height: 1;
    min-height: 2.25rem; min-width: 2.25rem;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .cat-toggle:hover { background: var(--rule-soft); color: var(--fg); }
  .cat.open > .cat-head .cat-toggle { transform: rotate(90deg); }

  .cat-dates { display: none; padding: 0.15rem 0.7rem 0.4rem 1.45rem; }

  .cat.open .cat-dates { display: block; }
  /* The category dropdown holds only the archive month-picker: days with a
     brief are clickable (ringed in the category accent), the selected day is
     filled, hovering one previews its title. Border + marks use the
     per-category --cat-accent scoped on the .cat row. */
  .cat-cal {
    margin: 0.2rem 0;
    padding: 0.5rem;
    border: 1px solid var(--cat-accent);
    border-radius: 6px;
    background: var(--rule-soft);
  }
  .cal-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 0.45rem;
  }
  .cal-title {
    font-family: var(--font-mono); font-size: 0.74rem;
    font-weight: 600; color: var(--fg);
  }
  .cal-nav {
    width: 1.7rem; height: 1.7rem; line-height: 1;
    background: transparent; border: 1px solid var(--rule); border-radius: 4px;
    color: var(--muted-ink); font-size: 0.95rem; cursor: pointer;
    transition: color 120ms, border-color 120ms;
  }
  .cal-nav:hover:not(:disabled) { color: var(--fg); border-color: var(--soft); }
  .cal-nav:focus-visible { outline: 2px solid var(--cat-accent, var(--fg)); outline-offset: 2px; }
  .cal-nav:disabled { opacity: 0.3; cursor: default; }
  .cal-week, .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
  }
  .cal-week { margin-bottom: 3px; }
  .cal-week span {
    text-align: center; font-family: var(--font-mono);
    font-size: 0.58rem; color: var(--muted-ink);
  }
  .cal-day {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 0.7rem;
    border-radius: 4px; color: var(--soft);
    font-feature-settings: "tnum";
  }
  .cal-day.none { color: var(--rule); }
  .cal-day.blank { visibility: hidden; }
  .cal-day.has {
    color: var(--fg); font-weight: 600; cursor: pointer; text-decoration: none;
    background: var(--panel);
    box-shadow: inset 0 0 0 1px var(--cat-accent);
    transition: background 100ms, color 100ms;
  }
  .cal-day.has:hover, .cal-day.has:focus-visible,
  .cal-day.has.current {
    background: var(--cat-accent); color: #fff; outline: none;
  }
  .cal-preview {
    margin-top: 0.5rem; padding-top: 0.45rem;
    border-top: 1px solid var(--rule);
    font-family: var(--font-body); font-size: 0.72rem;
    color: var(--muted-ink); line-height: 1.35; min-height: 1.7rem;
  }
  /* ────────────────────────────────────────────────────────────────────
     Fixed footer status bar — mirrors the pagr/seedr StatusBar: a 2rem bar
     pinned to the viewport bottom on a --card surface with a --border top
     rule. LEFT: `[briefs] reader@briefs:~/path` status line. RIGHT: the
     relocated controls (theme menu, language menu) + an anim toggle.
     ──────────────────────────────────────────────────────────────────── */
  footer.status-bar {
    position: fixed;
    inset-inline: 0;
    bottom: 0;
    z-index: 60;
    height: 2rem;
    border-top: 1px solid var(--border);
    background: var(--card);
    font-family: var(--font-mono); /* chrome is terminal mono */
    font-size: 11px;
  }
  .status-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    height: 100%;
    padding: 0 0.85rem;
  }
  .status-path {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted-foreground);
  }
  .status-path .status-tag { color: var(--primary); }
  .status-path .status-loc { color: var(--foreground); }
  .status-controls {
    display: flex;
    align-items: center;
    gap: 1.1rem;
    flex: none;
  }
  .status-sep { height: 0.9rem; width: 1px; background: var(--border); flex: none; }

  /* Footer control buttons — flat, muted, warm to --primary on hover. No
     boxes, no shadows; terminal-plain. */
  .status-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: inherit;
    line-height: 1;
    color: var(--muted-foreground);
    text-decoration: none;
    background: none;
    border: 0;
    border-radius: 0;
    padding: 0;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .status-btn:hover { color: var(--primary); }

  /* Theme + language dropdowns reuse the core .dropdown / .dropdown-panel /
     .dropdown-item primitives. The summary mirrors .status-btn. */
  .status-controls .dropdown > summary { font: inherit; }
  /* Settings icons (.dd-dot theme indicator, .dd-flag language flags) come from
     the shared @danieldeusing/design components.css — no local copy here. */

  /* Anim toggle — `[x] anim` / `[ ] anim`, mirroring pagr's footer toggle. */
  .anim-toggle { white-space: nowrap; }
  .anim-toggle[aria-pressed="true"] .anim-box { color: var(--primary); }

  /* Language picker — the trigger anchors the upward dropdown menu. The menu
     reuses the core .dropdown-panel (absolute, opens above, right-aligned),
     toggled open/closed via the [hidden] attribute by the existing JS. */
  .lang-picker { position: relative; }
  .lang-caret { font-size: 0.6rem; margin-left: 0.1rem; }
  .lang-menu[hidden] { display: none; }
  .lang-option[aria-selected="true"] {
    color: var(--primary);
    text-shadow: 0 0 8px var(--glow);
  }

  .cat-empty {
    font-family: var(--font-mono);
    font-size: 0.7rem; color: var(--soft);
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 0.5rem 0.6rem;
  }

  /* Main area — full width, fills the shell (viewport minus header + footer). */
  .main {
    overflow: hidden;
    background: var(--bg);
    position: relative;
    height: 100%;
  }
  .iframe-host { width: 100%; height: 100%; border: none; background: var(--bg); }

  /* ────────────────────────────────────────────────────────────────────
     Sticky right sidebar (.nav-rail) — terminal mono, --card surface with a
     --border left rule, full shell height with its own scroll. Holds the
     Übersicht control + the grouped category nav. Collapses to a 3rem icon-
     only strip; the width animates via the grid track on .app-shell.
     ──────────────────────────────────────────────────────────────────── */
  .nav-rail {
    grid-column: 2;
    font-family: var(--font-mono);
    background: var(--card);
    border-left: 1px solid var(--border);
    height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 2;
  }
  .nav-rail-head {
    display: flex;
    align-items: center;
    min-height: 2.1rem;
    padding: 0.4rem 0.85rem;
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .nav-rail-title {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 600;
    color: var(--muted-foreground);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-rail-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0.3rem 0 0.4rem;
  }

  /* Minimize toggle — the `»`/`«` chevron in the header right zone. Flat, muted,
     warm to --primary on hover (terminal-plain, no box). */
  .rail-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    flex: none;
    background: none;
    border: 0;
    border-radius: 0;
    color: var(--muted-foreground);
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 1rem;
    line-height: 1;
    transition: color 0.15s ease;
  }
  .rail-toggle:hover { color: var(--primary); }
  /* Expanded → `»` (collapse-to-right); collapsed → `«` (re-open). The button's
     aria-expanded drives the glyph; JS rewrites the text content too as a fallback. */
  .rail-toggle[aria-expanded="false"] .rail-toggle-glyph::before { content: "«"; }
  .rail-toggle[aria-expanded="true"]  .rail-toggle-glyph::before { content: "»"; }
  .rail-toggle-glyph { font-size: 0; }
  .rail-toggle-glyph::before { font-size: 1rem; }

  /* Collapsed strip — keep only the per-category accent bar + icon, hide labels,
     calendars and the home wordmark. The 3rem track clips the rest. */
  .app-shell.rail-collapsed .nav-rail-title,
  .app-shell.rail-collapsed .nav-label,
  .app-shell.rail-collapsed .cat-name,
  .app-shell.rail-collapsed .cat-latest,
  .app-shell.rail-collapsed .cat-toggle,
  .app-shell.rail-collapsed .cat-dates,
  .app-shell.rail-collapsed .home-btn .nav-label-text,
  .app-shell.rail-collapsed .home-btn .brand-mark {
    display: none;
  }
  .app-shell.rail-collapsed .nav-rail-head { justify-content: center; padding: 0.4rem 0; }
  .app-shell.rail-collapsed .cat-head,
  .app-shell.rail-collapsed .home-btn {
    justify-content: center;
    padding-left: 0;
    padding-right: 0;
    gap: 0;
  }
  .app-shell.rail-collapsed .cat-color,
  .app-shell.rail-collapsed .home-btn .cat-color { margin-right: 0.4rem; }

  /* The width transition reads off the grid track; animate it. */
  .app-shell { transition: grid-template-columns 0.18s ease; }
  @media (prefers-reduced-motion: reduce) {
    .app-shell { transition: none; }
  }

  /* Mobile re-open button (a floating ☰); shown only when the rail is an
     off-canvas drawer (≤720px). Hidden on desktop. */
  .rail-fab {
    display: none;
    position: fixed;
    right: 0.75rem;
    bottom: 2.6rem;
    z-index: 55;
    width: 2.6rem;
    height: 2.6rem;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--foreground);
    font-family: var(--font-mono);
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow: 0 0 18px var(--glow-soft);
  }

  /* Home view */
  .home {
    display: none;
    padding: 1.5rem 1.8rem;
    overflow-y: auto; height: 100%;
    /* Container for the responsive .tldr-grid below — column-count tracks
       the actual available width, not the viewport (which changes with
       sidebar collapsed/expanded state). */
    container-type: inline-size;
    container-name: home;
  }
  .home.show { display: block; }
  .home h2 {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 48;
    font-size: 1.55rem; font-weight: 600;
    margin: 0 0 0.5rem; letter-spacing: -0.005em;
  }
  .home .lead { color: var(--muted-ink); margin-bottom: 1.4rem; font-family: var(--font-body); }

  /* Freshness line — "Stand: DD.MM.YYYY" from the manifest's `generated`
     date. Mono-caps to read as a dateline, not body copy. When the manifest
     wasn't rebuilt today (a silently-failed nightly task), .stale flips it to
     the warn accent and appends a hint, so a missed run is visible at a glance
     instead of looking like fresh content. */
  .home-stand {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--soft);
    font-feature-settings: "tnum";
    margin: 0 0 1.2rem;
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .home-stand .stand-date { font-weight: 600; color: var(--muted-ink); }
  .home-stand.stale { color: var(--warn); }
  .home-stand.stale .stand-date { color: var(--warn); }
  .home-stand .stand-note { text-transform: none; letter-spacing: 0.02em; font-style: italic; }

  /* Newsprint column grid — the dashboard reads like one paper folded into
     seven adjacent columns. No card chrome: backgrounds, borders, shadows
     and radii are stripped. Adjacent columns are separated only by a
     hairline column rule, the same way the body-grid inside a newsletter
     uses column-rule between deep-dive sections. */
  /* Responsive column grid — caps at 3 wide so the columns stay readable
     on huge screens instead of shrinking to 5-6 narrow strips. The min
     width per column is the larger of 320 px (floor for readability) or
     1/3 of the container (so no more than 3 fit). Single declaration —
     no media or container queries needed.

     The column-rule + row-rule logic uses container queries against .home
     so the layout responds to actual available width (which changes with
     sidebar collapsed/expanded), not viewport. */
  .tldr-grid {
    display: grid;
    grid-template-columns:
      repeat(auto-fit, minmax(min(100%, max(320px, calc((100% - 2px) / 3))), 1fr));
    gap: 0;
    margin-top: 0.5rem;
  }
  .tldr-card {
    background: transparent;
    border: none;
    border-radius: 0;
    padding: var(--space-2) var(--space-4) var(--space-5);
    box-shadow: none;
    cursor: pointer;
    transition: background 150ms;
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    border-left: 1px solid var(--rule);
  }

  /* Grouped layout: a full-width header band (Wirtschaft / IT / Sport / …)
     precedes each group's cards. The header spans every grid column so the
     column flow restarts beneath it — each group reads as its own newsprint
     block, matching the sidebar's grouping. */
  .tldr-group-head {
    grid-column: 1 / -1;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    font-weight: 600;
    color: var(--soft);
    margin: var(--space-5) 0 0;
    padding: var(--space-3) 0 var(--space-2);
    border-top: 1px solid var(--rule);
  }
  /* The first group header sits right under the "Stand:" line — no big top gap
     or top rule, so the grid doesn't open with a stray divider. */
  .tldr-group-head:first-child { margin-top: 0; border-top: none; padding-top: 0; }

  /* The leading card of each group clears its left column rule so the group's
     first column starts clean (JS marks it; nth-child can't track per-group
     position once headers are interspersed). */
  .tldr-card.group-first { border-left: none; padding-left: 0; }

  /* Single-column band (narrow): no column rules at all; cards in the same
     group separate by a dashed row rule. The group header already divides
     groups, so only same-group siblings (a card directly after another card)
     get the dashed top. */
  @container home (max-width: 639px) {
    .tldr-card { border-left: none; padding-left: 0; }
    .tldr-card + .tldr-card {
      margin-top: var(--space-3);
      padding-top: var(--space-5);
      border-top: 1px dashed var(--rule);
    }
  }
  /* Subtle tinted-paper feedback on hover — no transform, no shadow swap,
     so adjacent columns never visually shift. */
  .tldr-card:hover {
    background: color-mix(in srgb, var(--cat-accent) 4%, transparent);
  }
  .tldr-card:focus-visible {
    outline: 2px solid var(--cat-accent, var(--fg));
    outline-offset: 4px;
  }
  .crumb:focus-visible {
    outline: 2px solid var(--fg);
    outline-offset: 2px;
    border-radius: var(--radius-inline);
  }

  /* Kicker line — same mono-caps treatment as the newsletter masthead-issue.
     Icon left, date right, category name in the middle. */
  .tldr-card-head {
    display: flex; align-items: center; gap: var(--space-2);
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.68rem;
    color: var(--muted-ink);
    border-bottom: none;
    padding-bottom: 0;
    margin-bottom: 0;
  }
  .tldr-card-head .tile-icon {
    font-size: 1rem;
    letter-spacing: normal;
    text-transform: none;
  }
  .tldr-card-head .tile-name {
    font-family: inherit;
    font-variation-settings: normal;
    font-weight: 600;
    font-size: inherit;
    color: var(--cat-accent-text, var(--fg));
    flex: 1;
  }
  .tldr-card-head .tile-date {
    font-family: inherit;
    font-size: inherit;
    color: var(--muted-ink);
    font-weight: 500;
    font-feature-settings: "tnum";
    letter-spacing: 0.1em;
  }

  /* Section title — the actual newsletter headline, rendered as a section
     dek in Fraunces with the same accent-bar treatment as .col h2 inside
     a newsletter. Acts as the "front-page headline" for that category. */
  .tldr-card-headline {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 36, "SOFT" 60;
    font-size: 1.18rem;
    font-weight: 600;
    font-style: normal;
    line-height: 1.18;
    color: var(--fg);
    margin: var(--space-2) 0 var(--space-3);
    letter-spacing: -0.005em;

  .tldr-card-headline::before {
    content: "";
    display: block;
    width: 2rem;
    height: 2px;
    background: var(--cat-accent);
    margin-bottom: var(--space-2);
  }

  /* Strip the embedded TL;DR section's own chrome — it inherits the column
     instead. The lead keeps its drop-cap treatment but at a smaller scale
     suited to the narrower column width. */
  .tldr-card-body .tldr {

    font-family: var(--font-body);
    font-size: 0.92rem;
    line-height: 1.5;
    color: var(--fg);
    margin: 0 0 var(--space-3);
    max-width: none;

  .tldr-card-body .tldr > .lead::first-letter {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 144, "SOFT" 100;
    font-size: 2.7rem;
    float: left;
    line-height: 0.85;
    padding: 0.25rem 0.45rem 0 0;
    color: var(--cat-accent);
    font-weight: 700;
  }
  .tldr-card-body .tldr ul {
    padding-left: 1rem;
    margin: 0;
    column-count: 1;       /* override 2-col bullet layout in narrow card */
  }
  .tldr-card-body .tldr li { font-size: 0.86rem; margin: 0.4rem 0; line-height: 1.5; }
  .tldr-card-body strong { color: var(--fg); font-weight: 700; }
  .tldr-card-body em { color: var(--muted-ink); font-style: italic; }
  .tldr-card-body a { color: inherit; text-decoration: underline; }
  /* Chips inside TL;DR bullets — tinted by the card's accent. */
  .tldr-card-body .chip {
    display: inline-block;
    font-family: var(--font-mono);
    background: color-mix(in srgb, var(--cat-accent, var(--rule-soft)) 14%, transparent);
    color: var(--fg);
    font-size: 0.6rem; font-weight: 600; padding: 0.05rem 0.45rem;
    border-radius: var(--radius-inline); letter-spacing: 0.04em; margin-right: 0.2rem;
    text-transform: uppercase; vertical-align: middle;
  }
  .tldr-card-body .chip.hot  { background: rgba(182, 64, 47, 0.18); color: #b6402f; }
  .tldr-card-body .chip.good { background: rgba(63, 122, 79, 0.18); color: #3f7a4f; }

  .tldr-card-body a[href^="http"]::after { content: none; }

     bullets (the full set is one click away). Reads as a muted continuation
     cue, list-style stripped so it doesn't get its own bullet dot. */
  .tldr-card-body .tldr li.tldr-more {
    list-style: none;
    margin-left: -1rem;
    color: var(--soft);
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    font-style: normal;
  }

  /* DE-fallback chip — shown in a card's kicker when the active language has
     no translation for this date and the card is showing the DE original.
     Understated outline so it informs without competing with the accent. */
  .tldr-card-head .fallback-flag {
    font-family: var(--font-mono);
    font-size: 0.58rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--soft);
    border: 1px solid var(--rule);
    border-radius: var(--radius-inline);
    padding: 0.02rem 0.3rem;
    text-transform: uppercase;
    flex: none;
  }

  .tldr-read {
    background: transparent; border: none; color: var(--fg);
    font-family: var(--font-mono);
    font-weight: 600; cursor: pointer;

    padding: 0.7rem 0.2rem 0.4rem 0; margin-top: auto;

    border-radius: var(--radius-inline);

    outline: 2px solid var(--cat-accent);

    font-family: var(--font-body);
    font-size: 0.88rem; color: var(--soft); font-style: italic; padding: 0.4rem 0;
  }

     so the category identity is preserved, but the body is muted, dashed,
     and self-evidently dormant. Not clickable. */
  .tldr-card--empty {
    cursor: default;
    background: color-mix(in srgb, var(--bg) 50%, var(--panel));
    box-shadow: none;
  }
  .tldr-card--empty:hover {
    transform: none;
    box-shadow: none;
  }
  .tldr-card--empty .tile-date {

  .tldr-empty-block {

    border-bottom: 1px dashed var(--rule);

  .tldr-empty-kicker {

    font-style: italic;

  /* Per-category accents — each card scopes its own --cat-accent and

     the headline, drop cap, chips, CTA) all pick up the right colour. */
  .tldr-card[data-cat="economy"]        { --cat-accent: var(--c-economy);        --cat-accent-text: var(--c-economy-text); }
  .tldr-card[data-cat="software"]       { --cat-accent: var(--c-software);       --cat-accent-text: var(--c-software-text); }

  /* Sidebar rows scope their own --cat-accent so the archive calendar's border,
     day rings and selected-day fill match the category colour. */
  .cat[data-cat="economy"]        { --cat-accent: var(--c-economy); }
  .cat[data-cat="software"]       { --cat-accent: var(--c-software); }
  .cat[data-cat="ai-dev"]         { --cat-accent: var(--c-ai-dev); }

  .home-btn.active { background: var(--muted); color: var(--primary); }
  .home-btn .cat-color {
    width: 6px; height: 18px; border-radius: 0; flex: none;

  }

     Mobile / narrow responsiveness — the nav-rail becomes an off-canvas
     drawer (the .app-shell collapses to a single main column), toggled by
     the floating .rail-fab. The header keeps brand + history controls.
     ──────────────────────────────────────────────────────────────────── */
  @media (max-width: 720px) {

    .home h2 { font-size: 1.2rem; }
    .status-controls { gap: 0.9rem; }

    /* Single main column; the rail floats as an off-canvas drawer pinned
       under the header / above the footer, slid off to the right until opened. */
    .app-shell,
    .app-shell.rail-collapsed { grid-template-columns: 1fr; }
    .nav-rail {
      position: fixed;
      top: 3rem;
      right: 0;
      bottom: 2rem;
      width: min(80vw, 18rem);
      transform: translateX(100%);
      transition: transform 0.2s ease;
      z-index: 56;

    .app-shell.rail-collapsed .nav-rail-title,
    .app-shell.rail-collapsed .nav-label,
    .app-shell.rail-collapsed .cat-name,
    .app-shell.rail-collapsed .cat-latest,
    .app-shell.rail-collapsed .cat-toggle,
    .app-shell.rail-collapsed .cat-dates,
    .app-shell.rail-collapsed .home-btn .nav-label-text,

    .app-shell.rail-collapsed .nav-rail-head { justify-content: flex-start; padding: 0.4rem 0.85rem; }
    .app-shell.rail-collapsed .cat-head,
    .app-shell.rail-collapsed .home-btn {
      justify-content: flex-start; padding-left: 0.85rem; padding-right: 0.85rem; gap: 0.55rem;

  }

<!-- Terminal header bar (mirrors pagr): LEFT brand wordmark + cursor; RIGHT the
     nav-rail minimize toggle. The grouped category nav lives in the sticky right
     sidebar (.nav-rail). -->
<header class="app">
  <div class="header-left">
    <a class="header-brand" id="brand-home" href="#home" title="Übersicht">

      <span class="rail-toggle-glyph" aria-hidden="true">»</span>
    </button>
  </div>
</header>

<div class="app-shell">

  </main>

  <!-- Sticky right sidebar: the relocated Übersicht control (#home-btn) and the
       grouped category nav (#nav-groups, populated by JS from NAV_GROUPS). Can be
       minimized to an icon-only strip; collapsed state persists in localStorage. -->
  <aside class="nav-rail" id="nav-rail" aria-label="Navigation">
    <div class="nav-rail-head">
      <span class="nav-rail-title">~/briefs</span>
    </div>
    <div class="nav-rail-body">
      <div class="home-btn active" id="home-btn" role="button" tabindex="0" title="Übersicht">
        <span class="cat-color"></span>

             browser tab and the home control read as the same "house" mark. -->
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">

        <span class="nav-label-text">Übersicht</span>

           nav (Wirtschaft / IT / jobs / Sport / Freizeit / Sprachen), each group
           with its own .nav-label header (standalone groups render headerless). --></div>
    </div>
  </aside>
</div>

        aria-label="Navigation öffnen" title="Navigation">☰</button>

        <span>anim</span>
      </button>
    </nav>
  </div>
</footer>

efallen</em>, während der Real nachgab. Das stützt weiter die Rohstoff-Erklärung gegen die Wahlangst-Erklärung.</li>\n      <li><span class=\"chip hot\">BR</span> <strong>Bruttoschuld 81,9 % des BIP</strong> im Juni (Mai: 81,1 %) — höchster Stand seit Oktober 2021. Der Trend zeigt stetig nach oben, drei Monate vor der Wahl.</li>\n      <li><span class=\"chip\">USA</span> <strong>Fed hält 3,50–3,75 %</strong> (29.07.), drei Stimmen wollten <em>erhöhen</em>. Nächste Sitzung 15./16.09. — dann mit neuem Zinspfad-Diagramm.</li>\n      <li><span class=\"chip\">DOLLAR</span> <strong>DXY 99,99</strong> (04.08., +0,03 %) — der Dollar ist zurück an der 100er-Marke, nachdem er gestern im Tagesverlauf bei 99,7 notierte.</li>\n      <li><span class=\"chip hot\">PROGNOSE</span> <strong>Heute 5,82–5,89</strong> (66 %), am ehesten <strong>5,85</strong> (~30 %). Für die Woche 5,78–5,95 — die Spanne ist wegen des Copom nach beiden Seiten offen.</li>\n    </ul></div>",

        "en": "<div class=\"tldr\"><h2>The 30-second version</h2>\n    <p class=\"lead\">The official reference rate confirmed Monday's jump — but smaller than the live quote, and for a different reason. The ECB fix for August 3 stands at 5.8454, that's 0.62% above Friday, and two-thirds of that comes from the euro, only one-third from the real. My \"almost even split\" call from yesterday turned out to be an artifact of the spot's timing. The real event is tomorrow night: Copom decides, and the market is pricing a cut to 14.00% at 75.5% — so one in five units staked on the real is riding on \"hold.\" Those exact 21 points were undersold here yesterday.</p>\n    <ul>\n      <li><span class=\"chip\">FX</span> <strong>EUR/BRL ECB fix 5.8454</strong> (Aug 3) against 5.8095 on Jul 31 — <strong>+0.62%</strong>. Today's fix won't land until around 11:00 BRT; until then, 5.8454 is the valid anchor.</li>\n      <li><span class=\"chip hot\">MECHANICS</span> <strong>The breakdown, corrected</strong>: EUR/USD +0.43%, USD/BRL +0.18%. Two-thirds euro, one-third real — not \"almost even\" as estimated yesterday on a spot basis.</li>\n      <li><span class=\"chip hot\">COPOM</span> <strong>B3 options price 75.5% for −25 basis points</strong> to 14.00%, <strong>~21% for hold</strong>, 2.3% for −50. In early June, \"hold\" was still around 75% — a complete reversal.</li>\n      <li><span class=\"chip hot\">FORECAST TEST</span> <strong>Yesterday this space called 5.83–5.89, most likely 5.86.</strong> Fix at 5.8454: range held, point 0.25% too high. After three days too low, now an overcorrection.</li>\n      <li><span class=\"chip\">OIL</span> <strong>Brent $85.01</strong> (Aug 4, +1.48%) after $83.82 the day before (−4.68%). The crash held only halfway — on the month, Brent still stands at <strong>+18.1%</strong>.</li>\n      <li><span class=\"chip good\">RISK</span> <strong>5-year CDS 122.74 basis points</strong> (close Aug 3) — <em>fallen</em>, while the real gave up ground. That continues to support the commodity explanation over the election-jitters explanation.</li>\n      <li><span class=\"chip hot\">BR</span> <strong>Gross debt 81.9% of GDP</strong> in June (May: 81.1%) — the highest level since October 2021. The trend points steadily upward, three months before the election.</li>\n      <li><span class=\"chip\">USA</span> <strong>The Fed holds at 3.50–3.75%</strong> (Jul 29), three votes wanted to <em>hike</em>. Next meeting Sep 15–16 — with a new dot-plot rate path.</li>\n      <li><span class=\"chip\">DOLLAR</span> <strong>DXY 99.99</strong> (Aug 4, +0.03%) — the dollar is back near the 100 mark, after trading intraday at 99.7 yesterday.</li>\n      <li><span class=\"chip hot\">FORECAST</span> <strong>Today, 5.82–5.89</strong> (66%), most likely <strong>5.85</strong> (~30%). For the week, 5.78–5.95 — the range is open on both sides because of Copom.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><h2>O essencial em 30 segundos</h2>\n    <p class=\"lead\">A taxa de referência oficial confirmou o salto de segunda-feira — mas menor do que o câmbio em tempo real, e por outro motivo. O fixing do BCE para 3 de agosto está em 5,8454, ou seja, 0,62 % acima de sexta-feira, e dois terços disso vêm do euro, só um terço do real. Minha afirmação de ontem, de que era \"quase meio a meio\", foi um artefato do horário da cotação à vista. O compromisso de verdade é amanhã à noite: o Copom decide, e o mercado precifica um corte para 14,00 % com 75,5 % de probabilidade — ou seja, uma em cada cinco unidades apostadas em real está em \"manter\". Foram exatamente esses 21 pontos que este espaço subestimou ontem.</p>\n    <ul>\n      <li><span class=\"chip\">FX</span> <strong>Fixing do BCE do EUR/BRL em 5,8454</strong> (03/08) contra 5,8095 em 31/07 — <strong>+0,62 %</strong>. O fixing de hoje só sai por volta das 11:00 BRT; até lá, 5,8454 é a âncora válida.</li>\n      <li><span class=\"chip hot\">MECÂNICA</span> <strong>A decomposição, corrigida</strong>: EUR/USD +0,43 %, USD/BRL +0,18 %. Dois terços euro, um terço real — não \"quase meio a meio\" como estimado ontem com base no câmbio à vista.</li>\n      <li><span class=\"chip hot\">COPOM</span> <strong>As opções da B3 precificam 75,5 % para −25 pontos-base</strong>, a 14,00 %, <strong>~21 % para manutenção</strong>, 2,3 % para −50. No início de junho, \"manter\" ainda estava em cerca de 75 % — uma reviravolta completa.</li>\n      <li><span class=\"chip hot\">TESTE DE PREVISÃO</span> <strong>Ontem este espaço apontava 5,83–5,89, mais provável 5,86.</strong> Fixing em 5,8454: faixa acertada, ponto central 0,25 % alto demais. Depois de três dias baixo demais, agora um exagero na direção oposta.</li>\n      <li><span class=\"chip\">PETRÓLEO</span> <strong>Brent a US$ 85,01</strong> (04/08, +1,48 %) depois de US$ 83,82 no dia anterior (−4,68 %). O tombo se sustentou só pela metade — no mês, o Brent ainda está em <strong>+18,1 %</strong>.</li>\n      <li><span class=\"chip good\">RISCO</span> <strong>CDS de 5 anos em 122,74 pontos-base</strong> (fechamento 03/08) — <em>caiu</em>, enquanto o real recuava. Isso continua reforçando a explicação pelas commodities em detrimento da explicação pelo nervosismo eleitoral.</li>\n      <li><span class=\"chip hot\">BR</span> <strong>Dívida bruta em 81,9 % do PIB</strong> em junho (maio: 81,1 %) — o maior nível desde outubro de 2021. A tendência aponta constantemente para cima, a três meses da eleição.</li>\n      <li><span class=\"chip\">EUA</span> <strong>Fed mantém a taxa em 3,50–3,75 %</strong> (29/07), três votos queriam <em>subir</em>. Próxima reunião em 15–16/09 — com novo gráfico de trajetória de juros.</li>\n      <li><span class=\"chip\">DÓLAR</span> <strong>DXY em 99,99</strong> (04/08, +0,03 %) — o dólar está de volta perto da marca de 100, depois de operar em 99,7 ao longo do dia de ontem.</li>\n      <li><span class=\"chip hot\">PREVISÃO</span> <strong>Para hoje, 5,82–5,89</strong> (66 %), mais provável <strong>5,85</strong> (~30 %). Para a semana, 5,78–5,95 — a faixa está aberta nos dois sentidos por causa do Copom.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><h2>Lo esencial en 30 segundos</h2>\n    <p class=\"lead\">El tipo de cambio de referencia oficial confirmó el salto del lunes — pero más pequeño que la cotización en vivo, y por otra causa. El fixing del BCE para el 3 de agosto está en 5,8454, es decir, 0,62 % por encima del viernes, y dos tercios de eso vienen del euro, solo un tercio del real. Mi afirmación de ayer de que era \"casi a la mitad\" fue un artefacto del momento en que se tomó la cotización spot. La cita de verdad es mañana por la noche: el Copom decide, y el mercado descuenta un recorte a 14,00 % con 75,5 % de probabilidad — es decir, una de cada cinco unidades apostadas en reales está en \"mantener\". Fueron exactamente esos 21 puntos los que aquí se subestimaron ayer.</p>\n    <ul>\n      <li><span class=\"chip\">FX</span> <strong>Fixing del BCE del EUR/BRL en 5,8454</strong> (03/08) frente a 5,8095 del 31/07 — <strong>+0,62 %</strong>. El fixing de hoy no llega hasta cerca de las 11:00 BRT; hasta entonces, 5,8454 es el ancla válida.</li>\n      <li><span class=\"chip hot\">MECÁNICA</span> <strong>La descomposición, corregida</strong>: EUR/USD +0,43 %, USD/BRL +0,18 %. Dos tercios euro, un tercio real — no \"casi a la mitad\" como se estimó ayer con base en el spot.</li>\n      <li><span class=\"chip hot\">COPOM</span> <strong>Las opciones de la B3 descuentan 75,5 % para −25 puntos base</strong>, a 14,00 %, <strong>~21 % para mantener</strong>, 2,3 % para −50. A principios de junio, \"mantener\" todavía rondaba el 75 % — un vuelco completo.</li>\n      <li><span class=\"chip hot\">PRUEBA DE PRONÓSTICO</span> <strong>Ayer aquí se decía 5,83–5,89, lo más probable 5,86.</strong> Fixing en 5,8454: rango acertado, punto central 0,25 % demasiado alto. Después de tres días por debajo, ahora una sobrecorrección.</li>\n      <li><span class=\"chip\">PETRÓLEO</span> <strong>Brent en US$ 85,01</strong> (04/08, +1,48 %) tras los US$ 83,82 del día anterior (−4,68 %). El desplome se sostuvo solo a la mitad — en el mes, el Brent sigue en <strong>+18,1 %</strong>.</li>\n      <li><span class=\"chip good\">RIESGO</span> <strong>CDS a 5 años en 122,74 puntos base</strong> (cierre 03/08) — <em>cayó</em>, mientras el real cedía. Eso sigue respaldando la explicación por las materias primas frente a la del nerviosismo electoral.</li>\n      <li><span class=\"chip hot\">BR</span> <strong>Deuda bruta en 81,9 % del PIB</strong> en junio (mayo: 81,1 %) — el nivel más alto desde octubre de 2021. La tendencia apunta constantemente al alza, a tres meses de la elección.</li>\n      <li><span class=\"chip\">EE. UU.</span> <strong>La Fed mantiene la tasa en 3,50–3,75 %</strong> (29/07), tres votos querían <em>subirla</em>. Próxima reunión el 15–16/09 — con nuevo gráfico de trayectoria de tasas.</li>\n      <li><span class=\"chip\">DÓLAR</span> <strong>DXY en 99,99</strong> (04/08, +0,03 %) — el dólar está de vuelta cerca de la marca de 100, después de operar en 99,7 durante la jornada de ayer.</li>\n      <li><span class=\"chip hot\">PRONÓSTICO</span> <strong>Para hoy, 5,82–5,89</strong> (66 %), lo más probable <strong>5,85</strong> (~30 %). Para la semana, 5,78–5,95 — el rango está abierto en ambos sentidos por el Copom.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Die Lücke des Tages ist keine neue Lücke, sondern eine alte, die nicht ganz zugegangen ist. In <strong>N-able N-central</strong> — der Software, mit der Dienstleister die Rechner ihrer Kunden fernwarten — hat ein Patch vom Frühsommer den Weg nur halb versperrt; CISA hat den Nachfolge-CVE gestern in den Katalog der aktiv ausgenutzten Schwachstellen aufgenommen. Über die Hälfte der erreichbaren Server war zum Zeitpunkt der Meldung noch ungepatcht. Daneben zwei Geschichten über Zahlen: die eine, dass 2026 schon jetzt fast so viele CVEs kennt wie das ganze Jahr 2025; die andere, dass bei einem deutschen Versicherer ein paar Stunden Fehlkonfiguration gereicht haben, damit Kundendaten in einem fremden Trainingskorpus landen. Und ab morgen ist Las Vegas.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>N-able N-central</strong>: <code>CVE-2026-18577</code>, unvollständiger Patch für <code>CVE-2026-18556</code> → Authentifizierungs-Umgehung. KEV-Aufnahme <strong>03.08.</strong>, Hotfix <strong>2026.3.1.7</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>55,6 %</strong> der erreichbaren N-central-Cloud-Server waren laut Huntress zum Meldezeitpunkt noch ungepatcht — bei bestätigter laufender Ausnutzung. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Zweiter KEV-Zugang, fünf Tage zuvor</strong>: <code>CVE-2026-20316</code> im <strong>Cisco Secure Firewall Management Center</strong>, aufgenommen 29.07., Bundesbehörden-Frist 01.08. bereits verstrichen. Zweimal die Steuerebene, nicht das Gerät. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>uniVersa</strong>: Ein OpenAI-Crawler griff am <strong>07.07.</strong> während einer IT-Migration Kundendaten ab — Namen, Adressen, Vertragsdaten, teils IBAN/BIC. BayLDA informiert. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>CVE-Flut</strong>: ~<strong>43.000</strong> CVEs bis Anfang August 2026 — gegenüber ~<strong>48.200</strong> im gesamten Jahr 2025. Juni allein: über <strong>7.600</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Spring-Nachtrag</strong>: <code>CVE-2026-41855</code> (CVSS <strong>8,1</strong>), JMS/Jackson-Deserialisierung. Fix in 6.2.19 / 7.0.8 — für <strong>5.3.x und 6.1.x gibt es keinen</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Release</span> <strong>Python 3.14.7</strong> ist für heute terminiert, stand zum Redaktionsschluss aber noch unter „Expected\". <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">OSS</span> <strong>PSF-Förderprogramm</strong>: Bewerbungsfenster öffnet <strong>heute</strong> und läuft bis <strong>25.08.</strong> (AoE) — für Konferenzen und Workshops von Dez. 2026 bis Apr. 2027. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Release</span> <strong>glibc 2.44</strong> schließt drei Lücken, u. a. fehlerhafte DNS-Antwortverarbeitung; dazu Binutils 2.47, ESLint 10.8.0, OpenJDK-Quartalsupdate. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Las Vegas</strong>: Black-Hat-Briefings <strong>05./06.08.</strong>, DEF CON 34 <strong>06.–09.08.</strong>, Microsoft-Patchday am <strong>11.08.</strong> <span class=\"chip\">USA</span></li>\n    </ul></div>",
      "latestTldrHtmlByLang": {
        "de": "<div class=\"tldr\"><p class=\"lead\">Die Lücke des Tages ist keine neue Lücke, sondern eine alte, die nicht ganz zugegangen ist. In <strong>N-able N-central</strong> — der Software, mit der Dienstleister die Rechner ihrer Kunden fernwarten — hat ein Patch vom Frühsommer den Weg nur halb versperrt; CISA hat den Nachfolge-CVE gestern in den Katalog der aktiv ausgenutzten Schwachstellen aufgenommen. Über die Hälfte der erreichbaren Server war zum Zeitpunkt der Meldung noch ungepatcht. Daneben zwei Geschichten über Zahlen: die eine, dass 2026 schon jetzt fast so viele CVEs kennt wie das ganze Jahr 2025; die andere, dass bei einem deutschen Versicherer ein paar Stunden Fehlkonfiguration gereicht haben, damit Kundendaten in einem fremden Trainingskorpus landen. Und ab morgen ist Las Vegas.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>N-able N-central</strong>: <code>CVE-2026-18577</code>, unvollständiger Patch für <code>CVE-2026-18556</code> → Authentifizierungs-Umgehung. KEV-Aufnahme <strong>03.08.</strong>, Hotfix <strong>2026.3.1.7</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>55,6 %</strong> der erreichbaren N-central-Cloud-Server waren laut Huntress zum Meldezeitpunkt noch ungepatcht — bei bestätigter laufender Ausnutzung. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Zweiter KEV-Zugang, fünf Tage zuvor</strong>: <code>CVE-2026-20316</code> im <strong>Cisco Secure Firewall Management Center</strong>, aufgenommen 29.07., Bundesbehörden-Frist 01.08. bereits verstrichen. Zweimal die Steuerebene, nicht das Gerät. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>uniVersa</strong>: Ein OpenAI-Crawler griff am <strong>07.07.</strong> während einer IT-Migration Kundendaten ab — Namen, Adressen, Vertragsdaten, teils IBAN/BIC. BayLDA informiert. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>CVE-Flut</strong>: ~<strong>43.000</strong> CVEs bis Anfang August 2026 — gegenüber ~<strong>48.200</strong> im gesamten Jahr 2025. Juni allein: über <strong>7.600</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Spring-Nachtrag</strong>: <code>CVE-2026-41855</code> (CVSS <strong>8,1</strong>), JMS/Jackson-Deserialisierung. Fix in 6.2.19 / 7.0.8 — für <strong>5.3.x und 6.1.x gibt es keinen</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Release</span> <strong>Python 3.14.7</strong> ist für heute terminiert, stand zum Redaktionsschluss aber noch unter „Expected\". <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">OSS</span> <strong>PSF-Förderprogramm</strong>: Bewerbungsfenster öffnet <strong>heute</strong> und läuft bis <strong>25.08.</strong> (AoE) — für Konferenzen und Workshops von Dez. 2026 bis Apr. 2027. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Release</span> <strong>glibc 2.44</strong> schließt drei Lücken, u. a. fehlerhafte DNS-Antwortverarbeitung; dazu Binutils 2.47, ESLint 10.8.0, OpenJDK-Quartalsupdate. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Las Vegas</strong>: Black-Hat-Briefings <strong>05./06.08.</strong>, DEF CON 34 <strong>06.–09.08.</strong>, Microsoft-Patchday am <strong>11.08.</strong> <span class=\"chip\">USA</span></li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Today's gap isn't a new gap — it's an old one that never quite closed. In <strong>N-able N-central</strong> — the software service providers use to remotely manage their customers' machines — an early-summer patch only half-blocked the path; CISA added the follow-up CVE to its catalog of actively exploited vulnerabilities yesterday. More than half of the reachable servers were still unpatched at the time of the report. Alongside that, two stories about numbers: one, that 2026 has already logged almost as many CVEs as all of 2025; the other, that at a German insurer, a few hours of misconfiguration were enough to land customer data in someone else's training corpus. And starting tomorrow, it's Las Vegas.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>N-able N-central</strong>: <code>CVE-2026-18577</code>, incomplete patch for <code>CVE-2026-18556</code> → authentication bypass. KEV addition <strong>Aug 3</strong>, hotfix <strong>2026.3.1.7</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>55.6%</strong> of reachable N-central cloud servers were still unpatched at report time, per Huntress — with confirmed active exploitation ongoing. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Second KEV addition, five days earlier</strong>: <code>CVE-2026-20316</code> in <strong>Cisco Secure Firewall Management Center</strong>, added Jul 29, federal deadline Aug 1 already lapsed. Twice the control plane, not the device. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>uniVersa</strong>: An OpenAI crawler scraped customer data on <strong>Jul 7</strong> during an IT migration — names, addresses, contract data, in some cases IBAN/BIC. BayLDA notified. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>CVE flood</strong>: ~<strong>43,000</strong> CVEs by early August 2026 — versus ~<strong>48,200</strong> for all of 2025. June alone: over <strong>7,600</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Spring follow-up</strong>: <code>CVE-2026-41855</code> (CVSS <strong>8.1</strong>), JMS/Jackson deserialization. Fixed in 6.2.19 / 7.0.8 — <strong>no fix for 5.3.x or 6.1.x</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Release</span> <strong>Python 3.14.7</strong> is scheduled for today, but as of press time was still listed under \"Expected.\" <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">OSS</span> <strong>PSF grants program</strong>: application window opens <strong>today</strong> and runs through <strong>Aug 25</strong> (AoE) — for conferences and workshops from Dec 2026 through Apr 2027. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Release</span> <strong>glibc 2.44</strong> closes three flaws, including faulty DNS response handling; plus Binutils 2.47, ESLint 10.8.0, an OpenJDK quarterly update. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Las Vegas</strong>: Black Hat Briefings <strong>Aug 5/6</strong>, DEF CON 34 <strong>Aug 6–9</strong>, Microsoft Patch Tuesday on <strong>Aug 11</strong>. <span class=\"chip\">USA</span></li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">A brecha de hoje não é uma brecha nova, e sim uma antiga que não fechou de vez. No <strong>N-able N-central</strong> — o software com que prestadores de serviço fazem a manutenção remota dos computadores dos clientes — um patch do início do verão europeu bloqueou o caminho só pela metade; ontem a CISA incluiu o CVE sucessor no catálogo de vulnerabilidades ativamente exploradas. Mais da metade dos servidores acessíveis ainda estava sem correção no momento do relato. Ao lado, duas histórias sobre números: uma, que 2026 já soma quase tantos CVEs quanto todo o ano de 2025; a outra, que numa seguradora alemã algumas horas de configuração incorreta bastaram para que dados de clientes fossem parar num corpus de treinamento alheio. E a partir de amanhã é Las Vegas.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>N-able N-central</strong>: <code>CVE-2026-18577</code>, patch incompleto para o <code>CVE-2026-18556</code> → contorno de autenticação. Inclusão no KEV em <strong>03/08</strong>, hotfix <strong>2026.3.1.7</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>55,6%</strong> dos servidores em nuvem acessíveis do N-central, segundo a Huntress, ainda estavam sem correção no momento do relato — com exploração ativa confirmada. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Segunda inclusão no KEV, cinco dias antes</strong>: <code>CVE-2026-20316</code> no <strong>Cisco Secure Firewall Management Center</strong>, incluído em 29/07, prazo federal de 01/08 já vencido. Duas vezes a camada de gestão, não o aparelho. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>uniVersa</strong>: um crawler da OpenAI coletou dados de clientes em <strong>07/07</strong> durante uma migração de TI — nomes, endereços, dados contratuais, em parte IBAN/BIC. BayLDA foi informada. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Enxurrada de CVEs</strong>: ~<strong>43 mil</strong> CVEs até o início de agosto de 2026 — ante ~<strong>48.200</strong> em todo o ano de 2025. Só junho: mais de <strong>7.600</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Complemento sobre o Spring</strong>: <code>CVE-2026-41855</code> (CVSS <strong>8,1</strong>), desserialização JMS/Jackson. Correção em 6.2.19 / 7.0.8 — <strong>para 5.3.x e 6.1.x não há correção</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Release</span> <strong>Python 3.14.7</strong> está previsto para hoje, mas até o fechamento desta edição ainda constava como \"Expected\". <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">OSS</span> <strong>Programa de bolsas da PSF</strong>: janela de inscrição abre <strong>hoje</strong> e vai até <strong>25/08</strong> (AoE) — para conferências e workshops de dez. 2026 a abr. 2027. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Release</span> <strong>glibc 2.44</strong> fecha três brechas, entre elas o processamento incorreto de respostas DNS; além de Binutils 2.47, ESLint 10.8.0, atualização trimestral do OpenJDK. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Las Vegas</strong>: Black Hat Briefings <strong>05/06.08</strong>, DEF CON 34 <strong>06–09/08</strong>, Patch Tuesday da Microsoft em <strong>11/08</strong>. <span class=\"chip\">USA</span></li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">La brecha de hoy no es una brecha nueva, sino una vieja que nunca terminó de cerrarse. En <strong>N-able N-central</strong> — el software con el que los proveedores de servicios administran a distancia las computadoras de sus clientes — un parche de principios del verano europeo bloqueó el camino solo a medias; ayer la CISA agregó el CVE sucesor a su catálogo de vulnerabilidades explotadas activamente. Más de la mitad de los servidores accesibles seguía sin parchar al momento del reporte. Junto a eso, dos historias sobre números: una, que 2026 ya casi iguala en CVEs a todo 2025; la otra, que en una aseguradora alemana bastaron unas horas de mala configuración para que datos de clientes terminaran en un corpus de entrenamiento ajeno. Y a partir de mañana, Las Vegas.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>N-able N-central</strong>: <code>CVE-2026-18577</code>, parche incompleto para el <code>CVE-2026-18556</code> → evasión de autenticación. Ingreso al KEV el <strong>03/08</strong>, hotfix <strong>2026.3.1.7</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>55.6 %</strong> de los servidores en la nube accesibles de N-central, según Huntress, seguía sin parchar al momento del reporte — con explotación activa confirmada. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Segundo ingreso al KEV, cinco días antes</strong>: <code>CVE-2026-20316</code> en el <strong>Cisco Secure Firewall Management Center</strong>, agregado el 29/07, plazo federal del 01/08 ya vencido. Dos veces la capa de administración, no el dispositivo. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>uniVersa</strong>: un rastreador de OpenAI extrajo datos de clientes el <strong>07/07</strong> durante una migración de TI — nombres, domicilios, datos contractuales, en algunos casos IBAN/BIC. La BayLDA fue notificada. <span class=\"chip\">DE</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Avalancha de CVEs</strong>: ~<strong>43,000</strong> CVEs para inicios de agosto de 2026 — frente a ~<strong>48,200</strong> en todo 2025. Solo junio: más de <strong>7,600</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Pendiente de Spring</strong>: <code>CVE-2026-41855</code> (CVSS <strong>8.1</strong>), deserialización JMS/Jackson. Corregido en 6.2.19 / 7.0.8 — <strong>para 5.3.x y 6.1.x no hay corrección</strong>. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Release</span> <strong>Python 3.14.7</strong> está programado para hoy, pero al cierre de esta edición seguía en la sección \"Expected\". <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">OSS</span> <strong>Programa de becas de la PSF</strong>: la ventana de solicitudes abre <strong>hoy</strong> y corre hasta el <strong>25/08</strong> (AoE) — para conferencias y talleres de dic. 2026 a abr. 2027. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Release</span> <strong>glibc 2.44</strong> cierra tres fallas, entre ellas un manejo defectuoso de respuestas DNS; además de Binutils 2.47, ESLint 10.8.0, actualización trimestral de OpenJDK. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Las Vegas</strong>: Black Hat Briefings <strong>05/06.08</strong>, DEF CON 34 <strong>06–09/08</strong>, Patch Tuesday de Microsoft el <strong>11/08</strong>. <span class=\"chip\">USA</span></li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Alibaba hat gestern <strong>Qwen3.8-Max</strong> veröffentlicht — 2,4 Billionen Parameter, und in der Berichterstattung steht, es schlage Claude Fable 5 und GPT-5.6 Sol. In derselben Meldung stehen die Coding-Zahlen, und die sagen das Gegenteil: auf SWE-bench Pro <span class=\"stat\">67,7</span> gegen <span class=\"stat\">80,0</span>, auf FrontierSWE <span class=\"stat\">73,5</span> gegen <span class=\"stat\">88,8</span>. Beide Sätze stammen aus demselben Text. Dazu passt der zweite Befund des Tages: Auf die Frage, wer eigentlich SWE-Bench Verified anführt, geben heute drei Auswertungsseiten drei verschiedene Antworten — und die offizielle Tabelle lässt sich nicht abrufen. Wer diese Woche einen Modellwechsel mit einer Rangliste begründet, sollte dazusagen, von welcher Seite die Zahl stammt.</p>\n    <ul>\n      <li><span class=\"chip hot\">OSS</span> <strong>Qwen3.8-Max ist da — und liegt beim Code zurück</strong>: 2,4 Bio. Parameter als Mixture-of-Experts, veröffentlicht am <span class=\"stat\">03.08.</span> Gegen Claude Fable 5 fehlen <span class=\"stat\">12,3</span> Punkte auf SWE-bench Pro und <span class=\"stat\">15,3</span> auf FrontierSWE.</li>\n      <li><span class=\"chip\">OSS</span> <strong>Gegen sich selbst ist der Sprung riesig</strong>: DeepSWE 1.1 von <span class=\"stat\">21,6</span> auf <span class=\"stat\">56,6</span>, FrontierSWE von <span class=\"stat\">40,7</span> auf <span class=\"stat\">73,5</span>. Das ist die ehrlichere Schlagzeile — nur eben keine, die einen Spitzenplatz behauptet.</li>\n      <li><span class=\"chip\">OSS</span> <strong>Zur Veröffentlichung fehlt fast alles</strong>: keine Benchmark-Tabelle, keine Lizenz, keine Angabe zu den aktiven Parametern. Der Qwen-Blog trägt als jüngsten Eintrag den <span class=\"stat\">23.09.2025</span>. Offene Gewichte sind für „nächste Woche\" angekündigt.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>Drei Auswertungsseiten, drei Spitzenreiter</strong>: Claude Opus 5 mit <span class=\"stat\">97,00 %</span> (Vals.ai), Claude Opus 5 mit <span class=\"stat\">96 %</span> (BenchLM) — oder Claude Fable 5 mit <span class=\"stat\">95,0 %</span> und gar kein Opus 5 in den Top 8 (llm-stats). Alle drei mit Stand 03./04.08.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Eine der Seiten sagt selbst, warum</strong>: Das Spitzenfeld liege „innerhalb von 1,0 Punkten\" beieinander, das Board nähere sich der Sättigung. Bei diesem Abstand entscheidet die Auswertungsmethode über den Sieger, nicht das Modell.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Anderes Board, anderes Labor an der Spitze</strong>: Auf LiveCodeBench (Stand 04.08.) belegt DeepSeek die ersten vier Plätze, V4-Pro-Max führt mit <span class=\"stat\">0,935</span>. Kein Anthropic-Modell in den Top 5.</li>\n      <li><span class=\"chip hot\">Claude</span> <strong>27 Tage bis zur Preiserhöhung</strong>: Der Einführungspreis von Claude Sonnet 5 (<span class=\"stat\">2 $</span>/<span class=\"stat\">10 $</span> je Mio. Token) läuft am <span class=\"stat\">31.08.</span> aus, ab dem 01.09. gelten <span class=\"stat\">3 $</span>/<span class=\"stat\">15 $</span>. Das sind +50 % auf beiden Seiten.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Grok 4.5 in GitHub Copilot</strong>: seit dem <span class=\"stat\">28.07.</span> verfügbar, bis <span class=\"stat\">500.000</span> Token Kontext, von Pro bis Enterprise, mit drei Denkstufen.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Das Aider-Board ist weiter tot</strong>: letzte Aktualisierung <span class=\"stat\">20.11.2025</span>, Spitzenreiter unverändert <code>gpt-5 (high)</code> mit 88,0 %. Nur mit Datum zitierbar.</li>\n    </ul></div>",

        "en": "<div class=\"tldr\"><p class=\"lead\">Alibaba released <strong>Qwen3.8-Max</strong> yesterday — 2.4 trillion parameters, and the coverage says it beats Claude Fable 5 and GPT-5.6 Sol. The same report also carries the coding numbers, and they say the opposite: on SWE-bench Pro, <span class=\"stat\">67.7</span> against <span class=\"stat\">80.0</span>; on FrontierSWE, <span class=\"stat\">73.5</span> against <span class=\"stat\">88.8</span>. Both sentences come from the same text. That fits the day's second finding: ask who actually leads SWE-Bench Verified today, and three ranking sites give three different answers — and the official table won't load. Anyone justifying a model switch with a leaderboard this week should say which site the number came from.</p>\n    <ul>\n      <li><span class=\"chip hot\">OSS</span> <strong>Qwen3.8-Max is here — and trails on code</strong>: 2.4T parameters as a mixture-of-experts, released <span class=\"stat\">Aug 3</span>. It's <span class=\"stat\">12.3</span> points behind Claude Fable 5 on SWE-bench Pro and <span class=\"stat\">15.3</span> on FrontierSWE.</li>\n      <li><span class=\"chip\">OSS</span> <strong>Against itself, the jump is huge</strong>: DeepSWE 1.1 goes from <span class=\"stat\">21.6</span> to <span class=\"stat\">56.6</span>, FrontierSWE from <span class=\"stat\">40.7</span> to <span class=\"stat\">73.5</span>. That's the more honest headline — just not one that claims a top spot.</li>\n      <li><span class=\"chip\">OSS</span> <strong>The release is missing almost everything</strong>: no benchmark table, no license, no active-parameter count. The Qwen blog's most recent entry is dated <span class=\"stat\">Sep 23, 2025</span>. Open weights are promised for \"next week.\"</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>Three ranking sites, three leaders</strong>: Claude Opus 5 at <span class=\"stat\">97.00%</span> (Vals.ai), Claude Opus 5 at <span class=\"stat\">96%</span> (BenchLM) — or Claude Fable 5 at <span class=\"stat\">95.0%</span> with no Opus 5 in the top 8 at all (llm-stats). All three dated Aug 3/4.</li>\n      <li><span class=\"chip\">Bench</span> <strong>One of the sites explains why itself</strong>: the top of the field sits \"within 1.0 points\" of each other, it says, with the board approaching saturation. At that margin, the scoring method decides the winner, not the model.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Different board, different lab on top</strong>: on LiveCodeBench (as of Aug 4), DeepSeek holds the top four spots, led by V4-Pro-Max at <span class=\"stat\">0.935</span>. No Anthropic model in the top 5.</li>\n      <li><span class=\"chip hot\">Claude</span> <strong>27 days until the price hike</strong>: Claude Sonnet 5's intro pricing (<span class=\"stat\">$2</span>/<span class=\"stat\">$10</span> per million tokens) ends <span class=\"stat\">Aug 31</span>; from Sep 1 it's <span class=\"stat\">$3</span>/<span class=\"stat\">$15</span> — a 50% increase on both sides.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Grok 4.5 lands in GitHub Copilot</strong>: available since <span class=\"stat\">Jul 28</span>, up to <span class=\"stat\">500,000</span> tokens of context, from Pro through Enterprise, with three reasoning levels.</li>\n      <li><span class=\"chip\">Bench</span> <strong>The Aider board is still dead</strong>: last updated <span class=\"stat\">Nov 20, 2025</span>, still led by <code>gpt-5 (high)</code> at 88.0%. Only citable with a date attached.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">A Alibaba lançou ontem o <strong>Qwen3.8-Max</strong> — 2,4 trilhões de parâmetros, e a cobertura diz que ele supera o Claude Fable 5 e o GPT-5.6 Sol. A mesma reportagem traz os números de coding, e eles dizem o contrário: no SWE-bench Pro, <span class=\"stat\">67,7</span> contra <span class=\"stat\">80,0</span>; no FrontierSWE, <span class=\"stat\">73,5</span> contra <span class=\"stat\">88,8</span>. As duas frases vêm do mesmo texto. Combina com isso a segunda descoberta do dia: pergunte quem realmente lidera o SWE-Bench Verified hoje, e três sites de ranking dão três respostas diferentes — e a tabela oficial não carrega. Quem justificar uma troca de modelo com um ranking esta semana deveria dizer de qual site veio o número.</p>\n    <ul>\n      <li><span class=\"chip hot\">OSS</span> <strong>Qwen3.8-Max chegou — e fica atrás em código</strong>: 2,4 tri de parâmetros como mixture-of-experts, lançado em <span class=\"stat\">03/08</span>. Fica <span class=\"stat\">12,3</span> pontos atrás do Claude Fable 5 no SWE-bench Pro e <span class=\"stat\">15,3</span> no FrontierSWE.</li>\n      <li><span class=\"chip\">OSS</span> <strong>Contra si mesmo, o salto é enorme</strong>: o DeepSWE 1.1 vai de <span class=\"stat\">21,6</span> para <span class=\"stat\">56,6</span>, o FrontierSWE de <span class=\"stat\">40,7</span> para <span class=\"stat\">73,5</span>. Essa é a manchete mais honesta — só que não é uma que reivindique o topo.</li>\n      <li><span class=\"chip\">OSS</span> <strong>Falta quase tudo no lançamento</strong>: nenhuma tabela de benchmark, nenhuma licença, nenhum número de parâmetros ativos. A entrada mais recente do blog do Qwen é de <span class=\"stat\">23/09/2025</span>. Pesos abertos foram anunciados para \"semana que vem\".</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>Três sites de ranking, três líderes</strong>: Claude Opus 5 com <span class=\"stat\">97,00%</span> (Vals.ai), Claude Opus 5 com <span class=\"stat\">96%</span> (BenchLM) — ou Claude Fable 5 com <span class=\"stat\">95,0%</span> e nenhum Opus 5 no top 8 (llm-stats). Os três com data de 03 ou 04/08.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Um dos sites explica o motivo sozinho</strong>: o topo do ranking está \"dentro de 1,0 ponto\" um do outro, segundo o site, com o ranking se aproximando da saturação. Nessa margem, quem decide é o método de contagem, não o modelo.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Outro ranking, outro laboratório na liderança</strong>: no LiveCodeBench (estado em 04/08), a DeepSeek ocupa as quatro primeiras posições, liderada pelo V4-Pro-Max com <span class=\"stat\">0,935</span>. Nenhum modelo da Anthropic no top 5.</li>\n      <li><span class=\"chip hot\">Claude</span> <strong>27 dias até o aumento de preço</strong>: o preço de lançamento do Claude Sonnet 5 (<span class=\"stat\">US$ 2</span>/<span class=\"stat\">US$ 10</span> por milhão de tokens) termina em <span class=\"stat\">31/08</span>; a partir de 01/09 passam a valer <span class=\"stat\">US$ 3</span>/<span class=\"stat\">US$ 15</span> — 50% a mais dos dois lados.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Grok 4.5 chega ao GitHub Copilot</strong>: disponível desde <span class=\"stat\">28/07</span>, até <span class=\"stat\">500.000</span> tokens de contexto, de Pro a Enterprise, com três níveis de raciocínio.</li>\n      <li><span class=\"chip\">Bench</span> <strong>O ranking do Aider continua morto</strong>: última atualização em <span class=\"stat\">20/11/2025</span>, ainda liderado por <code>gpt-5 (high)</code> com 88,0%. Só é citável com data ao lado.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Alibaba lanzó ayer <strong>Qwen3.8-Max</strong> — 2,4 billones de parámetros, y la cobertura dice que supera a Claude Fable 5 y a GPT-5.6 Sol. El mismo reportaje trae las cifras de coding, y dicen lo contrario: en SWE-bench Pro, <span class=\"stat\">67,7</span> contra <span class=\"stat\">80,0</span>; en FrontierSWE, <span class=\"stat\">73,5</span> contra <span class=\"stat\">88,8</span>. Las dos frases vienen del mismo texto. A eso se suma el segundo hallazgo del día: pregunta quién lidera hoy realmente SWE-Bench Verified, y tres sitios de ranking dan tres respuestas distintas — y la tabla oficial no carga. Quien justifique un cambio de modelo con un ranking esta semana debería decir de qué sitio salió la cifra.</p>\n    <ul>\n      <li><span class=\"chip hot\">OSS</span> <strong>Qwen3.8-Max ya está aquí — y va atrás en código</strong>: 2,4 billones de parámetros como mixture-of-experts, lanzado el <span class=\"stat\">03/08</span>. Va <span class=\"stat\">12,3</span> puntos detrás de Claude Fable 5 en SWE-bench Pro y <span class=\"stat\">15,3</span> en FrontierSWE.</li>\n      <li><span class=\"chip\">OSS</span> <strong>Contra sí mismo, el salto es enorme</strong>: DeepSWE 1.1 pasa de <span class=\"stat\">21,6</span> a <span class=\"stat\">56,6</span>, FrontierSWE de <span class=\"stat\">40,7</span> a <span class=\"stat\">73,5</span>. Ese es el titular más honesto — solo que no reclama el primer lugar.</li>\n      <li><span class=\"chip\">OSS</span> <strong>Al lanzamiento le falta casi todo</strong>: sin tabla de benchmark, sin licencia, sin cifra de parámetros activos. La entrada más reciente del blog de Qwen es del <span class=\"stat\">23/09/2025</span>. Los pesos abiertos se anunciaron para \"la próxima semana\".</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>Tres sitios de ranking, tres líderes</strong>: Claude Opus 5 con <span class=\"stat\">97,00%</span> (Vals.ai), Claude Opus 5 con <span class=\"stat\">96%</span> (BenchLM) — o Claude Fable 5 con <span class=\"stat\">95,0%</span> y ningún Opus 5 en el top 8 (llm-stats). Los tres con fecha del 03 o 04/08.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Uno de los sitios explica por qué él solo</strong>: la punta del campo está \"dentro de 1,0 puntos\" entre sí, dice el sitio, con el ranking acercándose a la saturación. En ese margen, quien decide al ganador es el método de conteo, no el modelo.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Otro ranking, otro laboratorio en la cima</strong>: en LiveCodeBench (estado al 04/08), DeepSeek ocupa los primeros cuatro lugares, encabezados por V4-Pro-Max con <span class=\"stat\">0,935</span>. Ningún modelo de Anthropic en el top 5.</li>\n      <li><span class=\"chip hot\">Claude</span> <strong>27 días para el aumento de precio</strong>: el precio de lanzamiento de Claude Sonnet 5 (<span class=\"stat\">US$ 2</span>/<span class=\"stat\">US$ 10</span> por millón de tokens) termina el <span class=\"stat\">31/08</span>; desde el 01/09 rigen <span class=\"stat\">US$ 3</span>/<span class=\"stat\">US$ 15</span> — un 50% más en ambos lados.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Grok 4.5 llega a GitHub Copilot</strong>: disponible desde el <span class=\"stat\">28/07</span>, hasta <span class=\"stat\">500.000</span> tokens de contexto, de Pro a Enterprise, con tres niveles de razonamiento.</li>\n      <li><span class=\"chip\">Bench</span> <strong>El ranking de Aider sigue muerto</strong>: última actualización el <span class=\"stat\">20/11/2025</span>, todavía a la cabeza <code>gpt-5 (high)</code> con 88,0%. Solo citable con la fecha al lado.</li>\n    </ul></div>"
