<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daniels Morning Briefs</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="lib/tokens.css">
<script>
  // Pre-paint animation policy (mirrors the terminal core / pagr): an explicit
  // "off" in localStorage — or no pick while the OS prefers reduced motion —
  // marks html.anim-off so components.css kills keyframes (incl. the brand
  // cursor blink) with no flash. The footer anim toggle persists "on"/"off".
  (function () {
    let pref = null;
    try { pref = localStorage.getItem('anim'); } catch (_) {}
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (pref === 'off' || (pref === null && reduced)) {
      document.documentElement.classList.add('anim-off');
    }
  })();
  // Resolution-independent zoom (mirrors pagr): lay out at a 1920px reference, then
  // scale the whole view up on wider screens — a true zoom of everything, never below
  // 1×. Pre-paint to avoid a flash.
  (function () {
    var applyZoom = function () {
      document.documentElement.style.zoom = String(Math.max(1, window.innerWidth / 1920));
    };
    applyZoom();
    window.addEventListener('resize', applyZoom);
  })();
</script>
<style>
  /* Dashboard chrome styles. Design tokens (colours, shadow, typography vars)
     come from lib/tokens.css — keep them there so the dashboard and the
     newsletter content stay in sync. */
  * { box-sizing: border-box; }
  /* Lock the outer document — only inner scroll containers (the .home view
     and the iframe) handle scrolling. Without this, a tiny mismatch between
     header.app + .app-shell heights and 100vh adds a few pixels of overflow
     to <html>, producing a second outer scrollbar alongside the one inside
     .home. overflow: hidden on both html and body kills that outer track. */
  html, body {
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    height: 100%;
    overflow: hidden;
  }
  html { position: relative; }

  /* Paper-grain noise overlay — same texture as the newsletter pages.
     Imperceptible up close, breaks LCD flatness at distance. Disabled under
     reduced-motion / high-contrast preferences. */
  html::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image: none;
    opacity: 0.04;
    mix-blend-mode: multiply;
  }
  @media (prefers-reduced-motion: reduce), (prefers-contrast: more) {
    html::before { display: none; }
  }
  body > *, header.app { position: relative; z-index: 1; }
  body {
    font-family: var(--font-body);
    line-height: 1.5;
    font-size: 15px;
    font-feature-settings: "kern", "liga", "onum";
    -webkit-font-smoothing: antialiased;
  }

  /* Terminal header bar — mirrors the pagr/seedr chrome: a single row on a
     --card surface with a --border bottom rule. LEFT: the brand wordmark
     (mono + .glow) and a blinking .cursor-block. RIGHT: the nav-rail minimize
     toggle. */
  header.app {
    border-bottom: 1px solid var(--border);
    background: var(--card);
    font-family: var(--font-mono); /* chrome is terminal mono; the content stays serif */
    /* Lift the header above the content, which is also a positioned body child
       at z-index 1 and would otherwise paint over it. */
    z-index: 50;
    padding: 0 1rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    min-height: 3rem;
  }
  /* LEFT zone — brand only. */
  .header-left {
    display: flex;
    align-items: center;
    flex: none;
    min-width: 0;
  }
  .header-brand {
    display: inline-flex;
    align-items: center;
    flex: none;
    text-decoration: none;
    cursor: pointer;
  }
  .header-brand .brand-word {
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: -0.01em;
  }

  /* RIGHT zone — the nav-rail minimize toggle, pushed to the far right
     (the header has no center zone). */
  .header-right {
    flex: none;
    margin-left: auto;
    display: flex;
    align-items: center;
  }

  /* Layout: two columns — flexible main + a fixed-width nav-rail on the right.
     The fixed footer is 2rem tall, so the shell is the viewport minus the
     header (3rem) and the footer (2rem). When the rail is collapsed the
     --rail-w track narrows to the icon-only strip. */
  .app-shell {
    display: grid;
    grid-template-columns: minmax(0, 1fr) var(--rail-w, 16rem);
    height: calc(100vh - 3rem - 2rem);
    height: calc(100dvh - 3rem - 2rem);
  }
  .app-shell.rail-collapsed { --rail-w: 3rem; }

  /* The nav lives in the sticky right sidebar (.nav-rail). It holds the
     Übersicht control (#home-btn) and #nav-groups (the grouped category nav,
     populated by JS). */
  .nav-label {
    font-family: var(--font-mono);
    font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--muted-foreground); padding: 0.5rem 0.85rem 0.2rem; font-weight: 600;
  }
  #nav-groups { padding-bottom: 0.2rem; }

  .cat {
    margin: 0;
    border-radius: 0;
    overflow: hidden;
    border: 0;
  }
  .cat-head {
    display: flex; align-items: center; gap: 0.55rem;
    padding: 0.45rem 0.85rem;
    cursor: pointer;
    border-radius: 0;
    transition: background 120ms;
    min-height: 2.1rem;
  }
  .cat-head:hover { background: var(--muted); }
  .cat-head:hover .cat-name { color: var(--primary); }
  .cat.active .cat-head { background: var(--muted); }
  .cat.active .cat-name { color: var(--primary); }
  .cat-color { width: 6px; height: 18px; border-radius: 0; flex: none; }
  .cat-name {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 0.8rem;
    color: var(--foreground);
    transition: color 0.15s ease;
    flex: 1;
    /* Single-line; ellipsise rather than wrap to two lines. */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .cat-icon { font-size: 1.05rem; }
  .cat-latest {
    font-family: var(--font-mono);
    font-size: 0.68rem; color: var(--soft);
    font-feature-settings: "tnum"; font-weight: 500;
  }
  .cat-toggle {
    background: transparent; border: none;
    color: var(--soft); cursor: pointer;
    transition: transform 150ms ease, background 120ms, color 120ms;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    padding: 0.55rem 0.7rem;
    border-radius: var(--radius-inline);
    line-height: 1;
    min-height: 2.25rem; min-width: 2.25rem;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .cat-toggle:hover { background: var(--rule-soft); color: var(--fg); }
  .cat.open > .cat-head .cat-toggle { transform: rotate(90deg); }

  .cat-dates { display: none; padding: 0.15rem 0.7rem 0.4rem 1.45rem; }

  .cat.open .cat-dates { display: block; }
  /* The category dropdown holds only the archive month-picker: days with a
     brief are clickable (ringed in the category accent), the selected day is
     filled, hovering one previews its title. Border + marks use the
     per-category --cat-accent scoped on the .cat row. */
  .cat-cal {
    margin: 0.2rem 0;
    padding: 0.5rem;
    border: 1px solid var(--cat-accent);
    border-radius: 6px;
    background: var(--rule-soft);
  }
  .cal-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 0.45rem;
  }
  .cal-title {
    font-family: var(--font-mono); font-size: 0.74rem;
    font-weight: 600; color: var(--fg);
  }
  .cal-nav {
    width: 1.7rem; height: 1.7rem; line-height: 1;
    background: transparent; border: 1px solid var(--rule); border-radius: 4px;
    color: var(--muted-ink); font-size: 0.95rem; cursor: pointer;
    transition: color 120ms, border-color 120ms;
  }
  .cal-nav:hover:not(:disabled) { color: var(--fg); border-color: var(--soft); }
  .cal-nav:focus-visible { outline: 2px solid var(--cat-accent, var(--fg)); outline-offset: 2px; }
  .cal-nav:disabled { opacity: 0.3; cursor: default; }
  .cal-week, .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
  }
  .cal-week { margin-bottom: 3px; }
  .cal-week span {
    text-align: center; font-family: var(--font-mono);
    font-size: 0.58rem; color: var(--muted-ink);
  }
  .cal-day {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 0.7rem;
    border-radius: 4px; color: var(--soft);
    font-feature-settings: "tnum";
  }
  .cal-day.none { color: var(--rule); }
  .cal-day.blank { visibility: hidden; }
  .cal-day.has {
    color: var(--fg); font-weight: 600; cursor: pointer; text-decoration: none;
    background: var(--panel);
    box-shadow: inset 0 0 0 1px var(--cat-accent);
    transition: background 100ms, color 100ms;
  }
  .cal-day.has:hover, .cal-day.has:focus-visible,
  .cal-day.has.current {
    background: var(--cat-accent); color: #fff; outline: none;
  }
  .cal-preview {
    margin-top: 0.5rem; padding-top: 0.45rem;
    border-top: 1px solid var(--rule);
    font-family: var(--font-body); font-size: 0.72rem;
    color: var(--muted-ink); line-height: 1.35; min-height: 1.7rem;
  }
  /* ────────────────────────────────────────────────────────────────────
     Fixed footer status bar — mirrors the pagr/seedr StatusBar: a 2rem bar
     pinned to the viewport bottom on a --card surface with a --border top
     rule. LEFT: `[briefs] reader@briefs:~/path` status line. RIGHT: the
     relocated controls (theme menu, language menu) + an anim toggle.
     ──────────────────────────────────────────────────────────────────── */
  footer.status-bar {
    position: fixed;
    inset-inline: 0;
    bottom: 0;
    z-index: 60;
    height: 2rem;
    border-top: 1px solid var(--border);
    background: var(--card);
    font-family: var(--font-mono); /* chrome is terminal mono */
    font-size: 11px;
  }
  .status-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    height: 100%;
    padding: 0 0.85rem;
  }
  .status-path {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted-foreground);
  }
  .status-path .status-tag { color: var(--primary); }
  .status-path .status-loc { color: var(--foreground); }
  .status-controls {
    display: flex;
    align-items: center;
    gap: 1.1rem;
    flex: none;
  }
  .status-sep { height: 0.9rem; width: 1px; background: var(--border); flex: none; }

  /* Footer control buttons — flat, muted, warm to --primary on hover. No
     boxes, no shadows; terminal-plain. */
  .status-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: inherit;
    line-height: 1;
    color: var(--muted-foreground);
    text-decoration: none;
    background: none;
    border: 0;
    border-radius: 0;
    padding: 0;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .status-btn:hover { color: var(--primary); }

  /* Theme + language dropdowns reuse the core .dropdown / .dropdown-panel /
     .dropdown-item primitives. The summary mirrors .status-btn. */
  .status-controls .dropdown > summary { font: inherit; }
  /* Settings icons (.dd-dot theme indicator, .dd-flag language flags) come from
     the shared @danieldeusing/design components.css — no local copy here. */

  /* Anim toggle — `[x] anim` / `[ ] anim`, mirroring pagr's footer toggle. */
  .anim-toggle { white-space: nowrap; }
  .anim-toggle[aria-pressed="true"] .anim-box { color: var(--primary); }

  /* Language picker — the trigger anchors the upward dropdown menu. The menu
     reuses the core .dropdown-panel (absolute, opens above, right-aligned),
     toggled open/closed via the [hidden] attribute by the existing JS. */
  .lang-picker { position: relative; }
  .lang-caret { font-size: 0.6rem; margin-left: 0.1rem; }
  .lang-menu[hidden] { display: none; }
  .lang-option[aria-selected="true"] {
    color: var(--primary);
    text-shadow: 0 0 8px var(--glow);
  }

  .cat-empty {
    font-family: var(--font-mono);
    font-size: 0.7rem; color: var(--soft);
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 0.5rem 0.6rem;
  }

  /* Main area — full width, fills the shell (viewport minus header + footer). */
  .main {
    overflow: hidden;
    background: var(--bg);
    position: relative;
    height: 100%;
  }
  .iframe-host { width: 100%; height: 100%; border: none; background: var(--bg); }

  /* ────────────────────────────────────────────────────────────────────
     Sticky right sidebar (.nav-rail) — terminal mono, --card surface with a
     --border left rule, full shell height with its own scroll. Holds the
     Übersicht control + the grouped category nav. Collapses to a 3rem icon-
     only strip; the width animates via the grid track on .app-shell.
     ──────────────────────────────────────────────────────────────────── */
  .nav-rail {
    grid-column: 2;
    font-family: var(--font-mono);
    background: var(--card);
    border-left: 1px solid var(--border);
    height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 2;
  }
  .nav-rail-head {
    display: flex;
    align-items: center;
    min-height: 2.1rem;
    padding: 0.4rem 0.85rem;
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .nav-rail-title {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 600;
    color: var(--muted-foreground);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-rail-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0.3rem 0 0.4rem;
  }

  /* Minimize toggle — the `»`/`«` chevron in the header right zone. Flat, muted,
     warm to --primary on hover (terminal-plain, no box). */
  .rail-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    flex: none;
    background: none;
    border: 0;
    border-radius: 0;
    color: var(--muted-foreground);
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 1rem;
    line-height: 1;
    transition: color 0.15s ease;
  }
  .rail-toggle:hover { color: var(--primary); }
  /* Expanded → `»` (collapse-to-right); collapsed → `«` (re-open). The button's
     aria-expanded drives the glyph; JS rewrites the text content too as a fallback. */
  .rail-toggle[aria-expanded="false"] .rail-toggle-glyph::before { content: "«"; }
  .rail-toggle[aria-expanded="true"]  .rail-toggle-glyph::before { content: "»"; }
  .rail-toggle-glyph { font-size: 0; }
  .rail-toggle-glyph::before { font-size: 1rem; }

  /* Collapsed strip — keep only the per-category accent bar + icon, hide labels,
     calendars and the home wordmark. The 3rem track clips the rest. */
  .app-shell.rail-collapsed .nav-rail-title,
  .app-shell.rail-collapsed .nav-label,
  .app-shell.rail-collapsed .cat-name,
  .app-shell.rail-collapsed .cat-latest,
  .app-shell.rail-collapsed .cat-toggle,
  .app-shell.rail-collapsed .cat-dates,
  .app-shell.rail-collapsed .home-btn .nav-label-text,
  .app-shell.rail-collapsed .home-btn .brand-mark {
    display: none;
  }
  .app-shell.rail-collapsed .nav-rail-head { justify-content: center; padding: 0.4rem 0; }
  .app-shell.rail-collapsed .cat-head,
  .app-shell.rail-collapsed .home-btn {
    justify-content: center;
    padding-left: 0;
    padding-right: 0;
    gap: 0;
  }
  .app-shell.rail-collapsed .cat-color,
  .app-shell.rail-collapsed .home-btn .cat-color { margin-right: 0.4rem; }

  /* The width transition reads off the grid track; animate it. */
  .app-shell { transition: grid-template-columns 0.18s ease; }
  @media (prefers-reduced-motion: reduce) {
    .app-shell { transition: none; }
  }

  /* Mobile re-open button (a floating ☰); shown only when the rail is an
     off-canvas drawer (≤720px). Hidden on desktop. */
  .rail-fab {
    display: none;
    position: fixed;
    right: 0.75rem;
    bottom: 2.6rem;
    z-index: 55;
    width: 2.6rem;
    height: 2.6rem;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--foreground);
    font-family: var(--font-mono);
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow: 0 0 18px var(--glow-soft);
  }

  /* Home view */
  .home {
    display: none;
    padding: 1.5rem 1.8rem;
    overflow-y: auto; height: 100%;
    /* Container for the responsive .tldr-grid below — column-count tracks
       the actual available width, not the viewport (which changes with
       sidebar collapsed/expanded state). */
    container-type: inline-size;
    container-name: home;
  }
  .home.show { display: block; }
  .home h2 {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 48;
    font-size: 1.55rem; font-weight: 600;
    margin: 0 0 0.5rem; letter-spacing: -0.005em;
  }
  .home .lead { color: var(--muted-ink); margin-bottom: 1.4rem; font-family: var(--font-body); }

  /* Freshness line — "Stand: DD.MM.YYYY" from the manifest's `generated`
     date. Mono-caps to read as a dateline, not body copy. When the manifest
     wasn't rebuilt today (a silently-failed nightly task), .stale flips it to
     the warn accent and appends a hint, so a missed run is visible at a glance
     instead of looking like fresh content. */
  .home-stand {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--soft);
    font-feature-settings: "tnum";
    margin: 0 0 1.2rem;
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .home-stand .stand-date { font-weight: 600; color: var(--muted-ink); }
  .home-stand.stale { color: var(--warn); }
  .home-stand.stale .stand-date { color: var(--warn); }
  .home-stand .stand-note { text-transform: none; letter-spacing: 0.02em; font-style: italic; }

  /* Newsprint column grid — the dashboard reads like one paper folded into
     seven adjacent columns. No card chrome: backgrounds, borders, shadows
     and radii are stripped. Adjacent columns are separated only by a
     hairline column rule, the same way the body-grid inside a newsletter
     uses column-rule between deep-dive sections. */
  /* Responsive column grid — caps at 3 wide so the columns stay readable
     on huge screens instead of shrinking to 5-6 narrow strips. The min
     width per column is the larger of 320 px (floor for readability) or
     1/3 of the container (so no more than 3 fit). Single declaration —
     no media or container queries needed.

     The column-rule + row-rule logic uses container queries against .home
     so the layout responds to actual available width (which changes with
     sidebar collapsed/expanded), not viewport. */
  .tldr-grid {
    display: grid;
    grid-template-columns:
      repeat(auto-fit, minmax(min(100%, max(320px, calc((100% - 2px) / 3))), 1fr));
    gap: 0;
    margin-top: 0.5rem;
  }
  .tldr-card {
    background: transparent;
    border: none;
    border-radius: 0;
    padding: var(--space-2) var(--space-4) var(--space-5);
    box-shadow: none;
    cursor: pointer;
    transition: background 150ms;
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    border-left: 1px solid var(--rule);
  }

  /* Grouped layout: a full-width header band (Wirtschaft / IT / Sport / …)
     precedes each group's cards. The header spans every grid column so the
     column flow restarts beneath it — each group reads as its own newsprint
     block, matching the sidebar's grouping. */
  .tldr-group-head {
    grid-column: 1 / -1;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    font-weight: 600;
    color: var(--soft);
    margin: var(--space-5) 0 0;
    padding: var(--space-3) 0 var(--space-2);
    border-top: 1px solid var(--rule);
  }
  /* The first group header sits right under the "Stand:" line — no big top gap
     or top rule, so the grid doesn't open with a stray divider. */
  .tldr-group-head:first-child { margin-top: 0; border-top: none; padding-top: 0; }

  /* The leading card of each group clears its left column rule so the group's
     first column starts clean (JS marks it; nth-child can't track per-group
     position once headers are interspersed). */
  .tldr-card.group-first { border-left: none; padding-left: 0; }

  /* Single-column band (narrow): no column rules at all; cards in the same
     group separate by a dashed row rule. The group header already divides
     groups, so only same-group siblings (a card directly after another card)
     get the dashed top. */
  @container home (max-width: 639px) {
    .tldr-card { border-left: none; padding-left: 0; }
    .tldr-card + .tldr-card {
      margin-top: var(--space-3);
      padding-top: var(--space-5);
      border-top: 1px dashed var(--rule);
    }
  }
  /* Subtle tinted-paper feedback on hover — no transform, no shadow swap,
     so adjacent columns never visually shift. */
  .tldr-card:hover {
    background: color-mix(in srgb, var(--cat-accent) 4%, transparent);
  }
  .tldr-card:focus-visible {
    outline: 2px solid var(--cat-accent, var(--fg));
    outline-offset: 4px;
  }
  .crumb:focus-visible {
    outline: 2px solid var(--fg);
    outline-offset: 2px;
    border-radius: var(--radius-inline);
  }

  /* Kicker line — same mono-caps treatment as the newsletter masthead-issue.
     Icon left, date right, category name in the middle. */
  .tldr-card-head {
    display: flex; align-items: center; gap: var(--space-2);
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.68rem;
    color: var(--muted-ink);
    border-bottom: none;
    padding-bottom: 0;
    margin-bottom: 0;
  }
  .tldr-card-head .tile-icon {
    font-size: 1rem;
    letter-spacing: normal;
    text-transform: none;
  }
  .tldr-card-head .tile-name {
    font-family: inherit;
    font-variation-settings: normal;
    font-weight: 600;
    font-size: inherit;
    color: var(--cat-accent-text, var(--fg));
    flex: 1;
  }
  .tldr-card-head .tile-date {
    font-family: inherit;
    font-size: inherit;
    color: var(--muted-ink);
    font-weight: 500;
    font-feature-settings: "tnum";
    letter-spacing: 0.1em;
  }

  /* Section title — the actual newsletter headline, rendered as a section
     dek in Fraunces with the same accent-bar treatment as .col h2 inside
     a newsletter. Acts as the "front-page headline" for that category. */
  .tldr-card-headline {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 36, "SOFT" 60;
    font-size: 1.18rem;
    font-weight: 600;
    font-style: normal;
    line-height: 1.18;
    color: var(--fg);
    margin: var(--space-2) 0 var(--space-3);
    letter-spacing: -0.005em;
  }
  .tldr-card-headline::before {
    content: "";
    display: block;
    width: 2rem;
    height: 2px;
    background: var(--cat-accent);
    margin-bottom: var(--space-2);
  }

  /* Strip the embedded TL;DR section's own chrome — it inherits the column
     instead. The lead keeps its drop-cap treatment but at a smaller scale
     suited to the narrower column width. */
  .tldr-card-body .tldr {
    background: transparent; border: none; padding: 0; margin: 0; border-radius: 0;
    display: block;       /* override the .tldr:has(.lead) grid from styles.css */
    column-gap: 0;

  .tldr-card-body .tldr > .lead {
    font-family: var(--font-body);
    font-size: 0.92rem;
    line-height: 1.5;
    color: var(--fg);
    margin: 0 0 var(--space-3);
    max-width: none;
  }
  .tldr-card-body .tldr > .lead::first-letter {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 144, "SOFT" 100;
    font-size: 2.7rem;
    float: left;
    line-height: 0.85;
    padding: 0.25rem 0.45rem 0 0;
    color: var(--cat-accent);
    font-weight: 700;
  }
  .tldr-card-body .tldr ul {
    padding-left: 1rem;
    margin: 0;
    column-count: 1;       /* override 2-col bullet layout in narrow card */
  }
  .tldr-card-body .tldr li { font-size: 0.86rem; margin: 0.4rem 0; line-height: 1.5; }
  .tldr-card-body strong { color: var(--fg); font-weight: 700; }
  .tldr-card-body em { color: var(--muted-ink); font-style: italic; }
  .tldr-card-body a { color: inherit; text-decoration: underline; }
  /* Chips inside TL;DR bullets — tinted by the card's accent. */
  .tldr-card-body .chip {
    display: inline-block;
    font-family: var(--font-mono);
    background: color-mix(in srgb, var(--cat-accent, var(--rule-soft)) 14%, transparent);
    color: var(--fg);
    font-size: 0.6rem; font-weight: 600; padding: 0.05rem 0.45rem;
    border-radius: var(--radius-inline); letter-spacing: 0.04em; margin-right: 0.2rem;
    text-transform: uppercase; vertical-align: middle;
  }
  .tldr-card-body .chip.hot  { background: rgba(182, 64, 47, 0.18); color: #b6402f; }
  .tldr-card-body .chip.good { background: rgba(63, 122, 79, 0.18); color: #3f7a4f; }
  /* Suppress the external-link arrow inside TL;DR snippets — too noisy. */
  .tldr-card-body a[href^="http"]::after { content: none; }
  /* "+N weitere" overflow marker — the home snapshot caps the TL;DR at a few
     bullets (the full set is one click away). Reads as a muted continuation
     cue, list-style stripped so it doesn't get its own bullet dot. */
  .tldr-card-body .tldr li.tldr-more {
    list-style: none;
    margin-left: -1rem;
    color: var(--soft);
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    font-style: normal;
  }

  /* DE-fallback chip — shown in a card's kicker when the active language has
     no translation for this date and the card is showing the DE original.
     Understated outline so it informs without competing with the accent. */
  .tldr-card-head .fallback-flag {
    font-family: var(--font-mono);
    font-size: 0.58rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--soft);
    border: 1px solid var(--rule);
    border-radius: var(--radius-inline);
    padding: 0.02rem 0.3rem;
    text-transform: uppercase;
    flex: none;
  }

  .tldr-read {
    background: transparent; border: none; color: var(--fg);
    font-family: var(--font-mono);
    font-weight: 600; cursor: pointer;
    font-size: 0.78rem; text-align: left;
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 0.7rem 0.2rem 0.4rem 0; margin-top: auto;
    min-height: 2.25rem;
    border-radius: var(--radius-inline);
  }
  .tldr-read:focus-visible {
    outline: 2px solid var(--cat-accent);
    outline-offset: 2px;
  }
  .tldr-read:hover { text-decoration: underline; }
  .tldr-empty {
    font-family: var(--font-body);
    font-size: 0.88rem; color: var(--soft); font-style: italic; padding: 0.4rem 0;
  }

  /* Empty-state card — "Heute kein Brief". Same per-category accent stripe
     so the category identity is preserved, but the body is muted, dashed,
     and self-evidently dormant. Not clickable. */
  .tldr-card--empty {
    cursor: default;
    background: color-mix(in srgb, var(--bg) 50%, var(--panel));
    box-shadow: none;
  }
  .tldr-card--empty:hover {
    transform: none;
    box-shadow: none;
  }
  .tldr-card--empty .tile-date {
    color: var(--rule);
  }
  .tldr-empty-block {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.5rem;
    padding: 1.2rem 0.4rem 0.8rem;
    border-top: 1px dashed var(--rule);
    border-bottom: 1px dashed var(--rule);
    margin: 0.4rem 0 0;
  }
  .tldr-empty-kicker {
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.7rem;
    color: var(--cat-accent, var(--muted-ink));
    font-weight: 600;
  }
  .tldr-empty-msg {
    font-family: var(--font-body);
    font-size: 0.88rem;
    color: var(--muted-ink);
    line-height: 1.5;
    font-style: italic;
    margin: 0;
  }

  /* Per-category accents — each card scopes its own --cat-accent and
     --cat-accent-text so descendant rules (kicker tile-name, accent bar above
     the headline, drop cap, chips, CTA) all pick up the right colour. */
  .tldr-card[data-cat="economy"]        { --cat-accent: var(--c-economy);        --cat-accent-text: var(--c-economy-text); }
  .tldr-card[data-cat="software"]       { --cat-accent: var(--c-software);       --cat-accent-text: var(--c-software-text); }
  .tldr-card[data-cat="ai-dev"]         { --cat-accent: var(--c-ai-dev);         --cat-accent-text: var(--c-ai-dev-text); }
  .tldr-card[data-cat="ai-usecases"]    { --cat-accent: var(--c-ai-usecases);    --cat-accent-text: var(--c-ai-usecases-text); }
  .tldr-card[data-cat="family"]         { --cat-accent: var(--c-family);         --cat-accent-text: var(--c-family-text); }

  .tldr-card .tldr-read { color: var(--cat-accent-text); }

  /* Loading */
  .loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;

  }
  .loading.show { opacity: 1; }

  /* Color helpers per category */
  [data-cat="economy"]        .cat-color { background: var(--c-economy); }

  [data-cat="learn-language"] .cat-color { background: var(--c-learn-language); }

  /* Sidebar rows scope their own --cat-accent so the archive calendar's border,
     day rings and selected-day fill match the category colour. */
  .cat[data-cat="economy"]        { --cat-accent: var(--c-economy); }
  .cat[data-cat="software"]       { --cat-accent: var(--c-software); }
  .cat[data-cat="ai-dev"]         { --cat-accent: var(--c-ai-dev); }
  .cat[data-cat="ai-usecases"]    { --cat-accent: var(--c-ai-usecases); }
  .cat[data-cat="family"]         { --cat-accent: var(--c-family); }
  .cat[data-cat="jobs"]           { --cat-accent: var(--c-jobs); }
  .cat[data-cat="learn-language"] { --cat-accent: var(--c-learn-language); }

  /* Home button — the "Übersicht" control at the top of the nav dropdown
     panel. Black accent bar (the dashboard's "house" colour) + favicon-style
     M brand mark + label, styled like a terminal .dropdown-item row. */
  .home-btn {
    display: flex; align-items: center; gap: 0.55rem;
    padding: 0.45rem 0.85rem;

    min-height: 2.1rem;
  }
  .home-btn:hover { background: var(--muted); color: var(--primary); }
  .home-btn.active { background: var(--muted); color: var(--primary); }
  .home-btn .cat-color {
    width: 6px; height: 18px; border-radius: 0; flex: none;
    background: var(--foreground);
  }
  /* Brand mark = the favicon design at category-icon size. */
  .home-btn .brand-mark {
    width: 1.1rem;
    height: 1.1rem;
    flex: none;
  }
  .home-btn:focus-visible,
  .cat-head:focus-visible,
  .cat-toggle:focus-visible,

    outline: 2px solid var(--ring, var(--primary));
    outline-offset: -2px;
  }

  /* ────────────────────────────────────────────────────────────────────
     Mobile / narrow responsiveness — the nav-rail becomes an off-canvas
     drawer (the .app-shell collapses to a single main column), toggled by
     the floating .rail-fab. The header keeps brand + history controls.
     ──────────────────────────────────────────────────────────────────── */
  @media (max-width: 720px) {
    header.app { padding: 0 0.75rem; gap: 0.6rem; }

    .tldr-grid { grid-template-columns: 1fr; gap: 0.85rem; }
    .home h2 { font-size: 1.2rem; }
    .status-controls { gap: 0.9rem; }

    /* Single main column; the rail floats as an off-canvas drawer pinned
       under the header / above the footer, slid off to the right until opened. */
    .app-shell,
    .app-shell.rail-collapsed { grid-template-columns: 1fr; }
    .nav-rail {
      position: fixed;
      top: 3rem;
      right: 0;
      bottom: 2rem;
      width: min(80vw, 18rem);
      transform: translateX(100%);
      transition: transform 0.2s ease;
      z-index: 56;
      box-shadow: -8px 0 24px var(--glow-soft);
    }
    .app-shell.rail-open .nav-rail { transform: translateX(0); }
    /* On mobile the drawer always shows full labels — never the icon strip. */
    .app-shell.rail-collapsed .nav-rail-title,
    .app-shell.rail-collapsed .nav-label,
    .app-shell.rail-collapsed .cat-name,
    .app-shell.rail-collapsed .cat-latest,
    .app-shell.rail-collapsed .cat-toggle,
    .app-shell.rail-collapsed .cat-dates,
    .app-shell.rail-collapsed .home-btn .nav-label-text,
    .app-shell.rail-collapsed .home-btn .brand-mark { display: revert; }
    .app-shell.rail-collapsed .nav-rail-head { justify-content: flex-start; padding: 0.4rem 0.85rem; }
    .app-shell.rail-collapsed .cat-head,
    .app-shell.rail-collapsed .home-btn {
      justify-content: flex-start; padding-left: 0.85rem; padding-right: 0.85rem; gap: 0.55rem;
    }
    /* The header chevron toggle is meaningless on mobile (drawer uses the FAB). */
    .rail-toggle--header { display: none; }
    .rail-fab { display: inline-flex; align-items: center; justify-content: center; }
  }
  @media (max-width: 400px) {
    header.app { padding: 0 0.6rem; }
    .header-brand .brand-word { font-size: 0.85rem; }
    .home { padding: 0.85rem 0.85rem 1.2rem; }
    .tldr-card { padding: 0.8rem 0.9rem 0.7rem; }
    .tldr-card-body .tldr li { font-size: 0.8rem; }
  }

<!-- Terminal header bar (mirrors pagr): LEFT brand wordmark + cursor; RIGHT the
     nav-rail minimize toggle. The grouped category nav lives in the sticky right
     sidebar (.nav-rail). -->
<header class="app">
  <div class="header-left">
    <a class="header-brand" id="brand-home" href="#home" title="Übersicht">
      <span class="glow brand-word">Daniels Morning Briefs</span>
      <span class="cursor-block" aria-hidden="true"></span>
    </a>
  </div>

  <div class="header-right">
    <button class="rail-toggle rail-toggle--header" id="rail-toggle" type="button"
            aria-controls="nav-rail" aria-expanded="true" aria-label="Navigation ein-/ausblenden"
            title="Navigation ein-/ausblenden">
      <span class="rail-toggle-glyph" aria-hidden="true">»</span>
    </button>
  </div>
</header>

<div class="app-shell">
  <main class="main">
    <div class="loading" id="loading">lädt…</div>

    <div class="home show" id="home-view">

    </div>

    <iframe class="iframe-host" id="frame" style="display:none;" title="Newsletter"></iframe>
  </main>

  <!-- Sticky right sidebar: the relocated Übersicht control (#home-btn) and the
       grouped category nav (#nav-groups, populated by JS from NAV_GROUPS). Can be
       minimized to an icon-only strip; collapsed state persists in localStorage. -->
  <aside class="nav-rail" id="nav-rail" aria-label="Navigation">
    <div class="nav-rail-head">
      <span class="nav-rail-title">~/briefs</span>
    </div>
    <div class="nav-rail-body">
      <div class="home-btn active" id="home-btn" role="button" tabindex="0" title="Übersicht">
        <span class="cat-color"></span>
        <!-- Full favicon design inline: dark frame + cream page + red
             double-rule + serif M. Identical SVG to favicon.svg so the
             browser tab and the home control read as the same "house" mark. -->
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <rect width="64" height="64" rx="9" fill="#221a13"/>
          <rect x="2.5" y="2.5" width="59" height="59" rx="7" fill="#f1e7d3"/>

        </svg>
        <span class="nav-label-text">Übersicht</span>
      </div>
      <div id="nav-groups"><!-- populated by JS from NAV_GROUPS: grouped category
           nav (Wirtschaft / IT / jobs / Sport / Freizeit / Sprachen), each group
           with its own .nav-label header (standalone groups render headerless). --></div>
    </div>
  </aside>
</div>

<button class="rail-fab" id="rail-fab" type="button" aria-controls="nav-rail"
        aria-label="Navigation öffnen" title="Navigation">☰</button>

<!-- Fixed footer status bar: status path (left), relocated controls + anim
     toggle (right). Controls keep their original ids so the existing handlers
     (theme cycle, language switch) work unchanged. -->

      <details class="dropdown theme-dropdown" id="theme-dropdown">

          <span class="dd-dot" aria-hidden="true"></span>

        <span class="anim-box" aria-hidden="true">[x]</span>
        <span>anim</span>
      </button>
    </nav>
  </div>
</footer>

        "en": "<div class=\"tldr\"><h2>The 30-second version</h2>\n    <p class=\"lead\">The catch-up move worked out here yesterday has arrived — bigger than my point estimate. EUR/BRL trades around 5.858 on Monday morning, 0.84% above Friday's fix. What's interesting is the breakdown: almost evenly split between a globally weaker dollar and a weaker real. Both at once is unusual, because a soft dollar normally helps emerging-market currencies. My explanation for the break sits in the commodity market: Brent has dropped 5.3% in a single day, and oil is Brazil's largest export item. Copom decides Wednesday evening — the oil plunge makes the cut easier for it, and that's exactly the problem for the real.</p>\n    <ul>\n      <li><span class=\"chip\">FX</span> <strong>EUR/BRL trading at 5.8582</strong> (Monday morning, investing.com) against Friday's fix of <strong>5.8095</strong>. The new ECB fix won't be published until around 11:00 BRT — until then, Friday's remains the official anchor.</li>\n      <li><span class=\"chip hot\">MECHANICS</span> <strong>The 0.84% splits almost evenly</strong>: EUR/USD +0.43% (dollar broadly softer) and USD/BRL +0.36% (real weaker). Together that works out to +0.79% — the rest is timestamp noise.</li>\n      <li><span class=\"chip hot\">OIL</span> <strong>Brent $83.26 a barrel</strong> (Aug 3), <strong>−5.31%</strong> on the day — down from $87.93 on Jul 31, the peak of the Hormuz panic. Roughly 8% lost on the week.</li>\n      <li><span class=\"chip hot\">READING</span> <strong>My candidate for the break.</strong> Cheaper oil worsens Brazil's terms of trade <em>and</em> lowers inflation pressure — both channels point down for the real. Interpretation, not a sourced claim.</li>\n      <li><span class=\"chip hot\">FORECAST TEST</span> <strong>Yesterday this space called 5.80–5.89, most likely 5.84.</strong> Spot at 5.858: range held, point too low. Third day running I've underestimated the upward move.</li>\n      <li><span class=\"chip hot\">BR</span> <strong>Copom #280 meets Tue/Wed Aug 4–5</strong>, announcement Wednesday evening after the market close. Selic 14.25%, 14.00% expected.</li>\n      <li><span class=\"chip\">BR</span> <strong>The finance ministry is weighing a tighter spending cap</strong> — mandatory spending is currently allowed to grow 2.5% above inflation. The target remains a primary surplus of 0.25% of GDP, around R$34 billion.</li>\n      <li><span class=\"chip\">DOLLAR</span> <strong>DXY 99.695</strong> (−0.22%, Aug 3) — the world-market dollar is softening, yet the real still isn't benefiting.</li>\n      <li><span class=\"chip\">USA</span> <strong>Fed holds at 3.50–3.75%</strong>, but 9:3 — Hammack, Kashkari, and Logan wanted to <em>hike</em> on Jul 29.</li>\n      <li><span class=\"chip\">RISK</span> <strong>5-year CDS 125.90 basis points</strong> (Jul 31) — unbothered, three months before the election.</li>\n      <li><span class=\"chip hot\">FORECAST</span> <strong>For today, 5.83–5.89</strong> (68%), most likely <strong>5.86</strong> (~32%). For the week, 5.80–5.95 tilted higher — Copom decides how far.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><h2>O essencial em 30 segundos</h2>\n    <p class=\"lead\">O movimento de recuperação que este espaço calculou ontem chegou — maior do que o meu ponto central. Nesta segunda-feira de manhã, o EUR/BRL opera perto de 5,858, ou seja, 0,84 % acima do fixing de sexta-feira. O interessante é a decomposição: quase meio a meio entre um dólar globalmente mais fraco e um real mais fraco. As duas coisas ao mesmo tempo são raras, porque um dólar fraco normalmente ajuda as moedas de mercados emergentes. Minha explicação para essa quebra está no mercado de commodities: o Brent caiu 5,3 % em um único dia, e o petróleo é o maior item de exportação do Brasil. Na quarta-feira à noite o Copom decide — o tombo do petróleo facilita o corte de juros, e é exatamente isso que é o problema para o real.</p>\n    <ul>\n      <li><span class=\"chip\">FX</span> <strong>EUR/BRL em tempo real a 5,8582</strong> (segunda-feira de manhã, investing.com) contra o fixing de sexta-feira, de <strong>5,8095</strong>. O novo fixing do BCE só sai por volta das 11:00 BRT — até lá, a âncora oficial ainda é a de sexta-feira.</li>\n      <li><span class=\"chip hot\">MECÂNICA</span> <strong>Os 0,84 % se dividem quase ao meio</strong>: EUR/USD +0,43 % (dólar globalmente mais fraco) e USD/BRL +0,36 % (real mais fraco). Somados, isso dá matematicamente +0,79 % — o resto é ruído de horário entre as fontes.</li>\n      <li><span class=\"chip hot\">PETRÓLEO</span> <strong>Brent a US$ 83,26 o barril</strong> (03/08), <strong>−5,31 %</strong> em relação ao dia anterior — depois de US$ 87,93 em 31/07, o pico do pânico de Hormuz. Cerca de 8 % de queda na semana.</li>\n      <li><span class=\"chip hot\">LEITURA</span> <strong>Minha candidata para explicar a quebra.</strong> Petróleo mais barato piora os termos de troca do Brasil <em>e</em> reduz a pressão inflacionária — os dois canais apontam para baixo no caso do real. Interpretação, não afirmação de fonte.</li>\n      <li><span class=\"chip hot\">TESTE DE PREVISÃO</span> <strong>Ontem este espaço apontava 5,80–5,89, mais provável 5,84.</strong> Câmbio à vista em 5,858: faixa acertada, ponto central baixo demais. Pela terceira vez seguida, subestimei o movimento de alta.</li>\n      <li><span class=\"chip hot\">BR</span> <strong>Copom nº 280 se reúne ter/qua 04–05/08</strong>, anúncio na quarta à noite após o fechamento do mercado. Selic em 14,25 %, esperados 14,00 %.</li>\n      <li><span class=\"chip\">BR</span> <strong>A Fazenda estuda apertar o limite de gastos</strong> — hoje as despesas obrigatórias podem crescer até 2,5 % acima da inflação. A meta continua sendo um superávit primário de 0,25 % do PIB, cerca de R$ 34 bilhões.</li>\n      <li><span class=\"chip\">DÓLAR</span> <strong>DXY em 99,695</strong> (−0,22 %, 03/08) — o dólar do mercado mundial cede, mas mesmo assim o real não se beneficia.</li>\n      <li><span class=\"chip\">EUA</span> <strong>Fed mantém a taxa em 3,50–3,75 %</strong>, mas a votação foi 9 a 3 — Hammack, Kashkari e Logan queriam <em>subir</em> os juros em 29/07.</li>\n      <li><span class=\"chip\">RISCO</span> <strong>CDS de 5 anos em 125,90 pontos-base</strong> (31/07) — tranquilo, a três meses da eleição.</li>\n      <li><span class=\"chip hot\">PREVISÃO</span> <strong>Para hoje, 5,83–5,89</strong> (68 %), mais provável <strong>5,86</strong> (~32 %). Para a semana, 5,80–5,95 com viés de alta — o Copom decide até onde.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><h2>Lo esencial en 30 segundos</h2>\n    <p class=\"lead\">El movimiento de recuperación que aquí se calculó ayer ya llegó — más grande que mi punto central. El lunes por la mañana, el EUR/BRL cotiza cerca de 5,858, es decir, 0,84 % por encima del fixing del viernes. Lo interesante es la descomposición: casi a la mitad entre un dólar globalmente más débil y un real más débil. Que ambas cosas ocurran a la vez es raro, porque un dólar suave normalmente ayuda a las monedas de mercados emergentes. Mi explicación para esta ruptura está en el mercado de materias primas: el Brent se desplomó 5,3 % en un solo día, y el petróleo es el mayor rubro de exportación de Brasil. El miércoles por la noche decide el Copom — el desplome del petróleo le facilita el recorte, y ahí está justamente el problema para el real.</p>\n    <ul>\n      <li><span class=\"chip\">FX</span> <strong>EUR/BRL en vivo en 5,8582</strong> (lunes por la mañana, investing.com) frente al fixing del viernes, de <strong>5,8095</strong>. El nuevo fixing del BCE no se publica hasta cerca de las 11:00 BRT — hasta entonces, el ancla oficial sigue siendo la del viernes.</li>\n      <li><span class=\"chip hot\">MECÁNICA</span> <strong>El 0,84 % se reparte casi a la mitad</strong>: EUR/USD +0,43 % (dólar globalmente más débil) y USD/BRL +0,36 % (real más débil). Sumados, eso da matemáticamente +0,79 % — el resto es ruido de horario entre las fuentes.</li>\n      <li><span class=\"chip hot\">PETRÓLEO</span> <strong>Brent en US$ 83,26 por barril</strong> (03/08), <strong>−5,31 %</strong> respecto al día anterior — tras los US$ 87,93 del 31/07, el pico del pánico de Ormuz. Alrededor de 8 % de caída en la semana.</li>\n      <li><span class=\"chip hot\">LECTURA</span> <strong>Mi candidata para explicar la ruptura.</strong> El petróleo más barato empeora los términos de intercambio de Brasil <em>y</em> reduce la presión inflacionaria — ambos canales apuntan a la baja para el real. Interpretación, no una afirmación con fuente.</li>\n      <li><span class=\"chip hot\">PRUEBA DE PRONÓSTICO</span> <strong>Ayer aquí se decía 5,80–5,89, lo más probable 5,84.</strong> Spot en 5,858: rango acertado, punto central demasiado bajo. Por tercera vez consecutiva subestimé el movimiento al alza.</li>\n      <li><span class=\"chip hot\">BR</span> <strong>El Copom nº 280 se reúne mar/mié 04–05/08</strong>, anuncio el miércoles por la noche tras el cierre del mercado. Selic en 14,25 %, se espera 14,00 %.</li>\n      <li><span class=\"chip\">BR</span> <strong>Hacienda estudia endurecer el límite de gasto</strong> — hoy el gasto obligatorio puede crecer hasta 2,5 % por encima de la inflación. La meta sigue siendo un superávit primario de 0,25 % del PIB, unos R$ 34 mil millones.</li>\n      <li><span class=\"chip\">DÓLAR</span> <strong>DXY en 99,695</strong> (−0,22 %, 03/08) — el dólar del mercado mundial cede, y aun así el real no se beneficia.</li>\n      <li><span class=\"chip\">EE. UU.</span> <strong>La Fed mantiene la tasa en 3,50–3,75 %</strong>, pero la votación fue 9 a 3 — Hammack, Kashkari y Logan querían <em>subirla</em> el 29/07.</li>\n      <li><span class=\"chip\">RIESGO</span> <strong>CDS a 5 años en 125,90 puntos base</strong> (31/07) — sin cambios, a tres meses de la elección.</li>\n      <li><span class=\"chip hot\">PRONÓSTICO</span> <strong>Para hoy, 5,83–5,89</strong> (68 %), lo más probable <strong>5,86</strong> (~32 %). Para la semana, 5,80–5,95 con sesgo al alza — el Copom decide hasta dónde.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Gestern stand hier, der <strong>02.08.</strong> sei ein Stichtag ohne Wirkung. Das war zu grob: Für die Hochrisiko-Pflichten stimmt es, für Kapitel V nicht. Seit gestern kann die EU-Kommission von Anbietern allgemeiner KI-Modelle Unterlagen verlangen, deren Modelle selbst prüfen und sie im Zweifel vom Markt nehmen — Bußgeldrahmen <strong>3 %</strong> des Weltumsatzes. Ansonsten ist heute der Tag der Formulare: eine neue Pflichtfeld-Liste für Software-Stücklisten, ein Genehmigungsschritt vor jedem verdächtigen CI-Lauf, ein Schulungsbündnis für den CRA. Das einzige echte Loch der Woche sitzt derweil in einem Bild-Lader.</p>\n    <ul>\n      <li><span class=\"chip\">Regulierung</span> <strong>AI Act, Kapitel V</strong>: Aufsichts- und Durchsetzungsbefugnisse gegenüber GPAI-Anbietern seit <strong>02.08.</strong> in Kraft — Bußgeld bis <strong>3 %</strong> Weltumsatz oder <strong>15 Mio. €</strong>. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Rails</strong>: <code>CVE-2026-66066</code> — ein hochgeladenes Bild liest beliebige Dateien samt Prozess-Umgebung aus, inklusive <code>secret_key_base</code>. Fixes 7.2.3.2 / 8.0.5.1 / 8.1.3.1. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>SBOM-Neufassung</strong>: CISA &amp; Partner veröffentlichen am <strong>29.07.</strong> neue Mindestelemente — Hash-Verfahren, Lizenzen, Generator-Tool, Signaturfeld. Löst die NTIA-Basis von 2021 ab. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>GitHub Actions</strong>: hält seit <strong>28.07.</strong> als „potentially malicious\" markierte Workflow-Läufe an — Freigabe nur per authentifizierter Web-Session. Vorerst nur öffentliche Repos. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Eclipse + OWASP</strong>: Absichtserklärung vom <strong>29.07.</strong> für CRA-Reife im Open-Source-Ökosystem, fünf Arbeitsfelder inklusive SBOM-Einführung. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">Release</span> <strong>Python 3.14.7</strong> erscheint morgen, <strong>04.08.</strong> — planmäßige Wartungsversion laut PEP 745. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Spring-Nachtrag</strong>: vier Advisories vom <strong>11./12.06.</strong> — WebSocket-Session-ID, Cloud-Gateway-Header, Vector Store, Sleuth. Kein Alarm, aber Wartungsfenster-Material. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>Superlogical</strong>: Mitchell Hashimoto stellt am <strong>30.07.</strong> einen serverseitigen Terminal-Multiplexer vor. Warteliste, kein Produkt. <span class=\"chip\">USA</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Las Vegas</strong>: Black-Hat-Briefings <strong>05./06.08.</strong>, DEF CON 34 vom <strong>06.–09.08.</strong> — das dichteste Offenlegungsfenster des Jahres. <span class=\"chip\">Global</span></li>\n    </ul></div>",
      "latestTldrHtmlByLang": {
        "de": "<div class=\"tldr\"><p class=\"lead\">Gestern stand hier, der <strong>02.08.</strong> sei ein Stichtag ohne Wirkung. Das war zu grob: Für die Hochrisiko-Pflichten stimmt es, für Kapitel V nicht. Seit gestern kann die EU-Kommission von Anbietern allgemeiner KI-Modelle Unterlagen verlangen, deren Modelle selbst prüfen und sie im Zweifel vom Markt nehmen — Bußgeldrahmen <strong>3 %</strong> des Weltumsatzes. Ansonsten ist heute der Tag der Formulare: eine neue Pflichtfeld-Liste für Software-Stücklisten, ein Genehmigungsschritt vor jedem verdächtigen CI-Lauf, ein Schulungsbündnis für den CRA. Das einzige echte Loch der Woche sitzt derweil in einem Bild-Lader.</p>\n    <ul>\n      <li><span class=\"chip\">Regulierung</span> <strong>AI Act, Kapitel V</strong>: Aufsichts- und Durchsetzungsbefugnisse gegenüber GPAI-Anbietern seit <strong>02.08.</strong> in Kraft — Bußgeld bis <strong>3 %</strong> Weltumsatz oder <strong>15 Mio. €</strong>. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Rails</strong>: <code>CVE-2026-66066</code> — ein hochgeladenes Bild liest beliebige Dateien samt Prozess-Umgebung aus, inklusive <code>secret_key_base</code>. Fixes 7.2.3.2 / 8.0.5.1 / 8.1.3.1. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>SBOM-Neufassung</strong>: CISA &amp; Partner veröffentlichen am <strong>29.07.</strong> neue Mindestelemente — Hash-Verfahren, Lizenzen, Generator-Tool, Signaturfeld. Löst die NTIA-Basis von 2021 ab. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>GitHub Actions</strong>: hält seit <strong>28.07.</strong> als „potentially malicious\" markierte Workflow-Läufe an — Freigabe nur per authentifizierter Web-Session. Vorerst nur öffentliche Repos. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Eclipse + OWASP</strong>: Absichtserklärung vom <strong>29.07.</strong> für CRA-Reife im Open-Source-Ökosystem, fünf Arbeitsfelder inklusive SBOM-Einführung. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">Release</span> <strong>Python 3.14.7</strong> erscheint morgen, <strong>04.08.</strong> — planmäßige Wartungsversion laut PEP 745. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Spring-Nachtrag</strong>: vier Advisories vom <strong>11./12.06.</strong> — WebSocket-Session-ID, Cloud-Gateway-Header, Vector Store, Sleuth. Kein Alarm, aber Wartungsfenster-Material. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>Superlogical</strong>: Mitchell Hashimoto stellt am <strong>30.07.</strong> einen serverseitigen Terminal-Multiplexer vor. Warteliste, kein Produkt. <span class=\"chip\">USA</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Las Vegas</strong>: Black-Hat-Briefings <strong>05./06.08.</strong>, DEF CON 34 vom <strong>06.–09.08.</strong> — das dichteste Offenlegungsfenster des Jahres. <span class=\"chip\">Global</span></li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Yesterday this space said Aug 2 was a deadline with no bite. That was too broad a claim: true for the high-risk obligations, not for Chapter V. As of yesterday, the European Commission can demand documentation from providers of general-purpose AI models, run its own technical evaluations of their models, and pull them from the market if in doubt — fine ceiling <strong>3%</strong> of global revenue. Otherwise, today is paperwork day: a new list of mandatory fields for software bills of materials, an approval step ahead of every suspicious CI run, a training alliance for the CRA. The week's one real hole, meanwhile, sits in an image loader.</p>\n    <ul>\n      <li><span class=\"chip\">Regulation</span> <strong>AI Act, Chapter V</strong>: oversight and enforcement powers over GPAI providers in force since <strong>Aug 2</strong> — fines up to <strong>3%</strong> of global revenue or <strong>€15M</strong>. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Rails</strong>: <code>CVE-2026-66066</code> — an uploaded image lets an attacker read arbitrary files including the process environment, including <code>secret_key_base</code>. Fixes 7.2.3.2 / 8.0.5.1 / 8.1.3.1. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>SBOM rewrite</strong>: CISA & partners publish new minimum elements on <strong>Jul 29</strong> — hash algorithms, licenses, generator tool, signature field. Replaces the 2021 NTIA baseline. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>GitHub Actions</strong>: since <strong>Jul 28</strong> holds workflow runs flagged \"potentially malicious\" — approval only via an authenticated web session. Public repos only for now. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Eclipse + OWASP</strong>: letter of intent from <strong>Jul 29</strong> for CRA readiness across the open-source ecosystem, five work streams including an SBOM rollout. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">Release</span> <strong>Python 3.14.7</strong> ships tomorrow, <strong>Aug 4</strong> — a scheduled maintenance release per PEP 745. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Spring backlog</strong>: four advisories from <strong>Jun 11/12</strong> — WebSocket session ID, Cloud Gateway header, Vector Store, Sleuth. No alarm, but maintenance-window material. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>Superlogical</strong>: Mitchell Hashimoto unveils a server-side terminal multiplexer on <strong>Jul 30</strong>. Waitlist, no product yet. <span class=\"chip\">USA</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Las Vegas</strong>: Black Hat Briefings <strong>Aug 5/6</strong>, DEF CON 34 from <strong>Aug 6–9</strong> — the year's densest disclosure window. <span class=\"chip\">Global</span></li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Ontem, aqui, dizíamos que 02/08 era um prazo sem efeito. Isso era grosseiro demais: vale para as obrigações de alto risco, não vale para o Capítulo V. Desde ontem, a Comissão Europeia pode exigir documentação de provedores de modelos de IA de propósito geral, avaliar tecnicamente os próprios modelos e, em caso de dúvida, retirá-los do mercado — teto de multa de <strong>3%</strong> do faturamento mundial. Fora isso, hoje é o dia dos formulários: uma nova lista de campos obrigatórios para listas de materiais de software, uma etapa de aprovação antes de cada execução suspeita de CI, uma aliança de treinamento para o CRA. O único buraco de verdade da semana, aliás, está num carregador de imagens.</p>\n    <ul>\n      <li><span class=\"chip\">Regulação</span> <strong>AI Act, Capítulo V</strong>: poderes de supervisão e execução sobre provedores de GPAI em vigor desde <strong>02/08</strong> — multa de até <strong>3%</strong> do faturamento global ou <strong>15 milhões de €</strong>. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Rails</strong>: <code>CVE-2026-66066</code> — uma imagem enviada permite ler arquivos arbitrários, incluindo o ambiente do processo, com <code>secret_key_base</code> junto. Correções em 7.2.3.2 / 8.0.5.1 / 8.1.3.1. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Reformulação do SBOM</strong>: CISA e parceiros publicam em <strong>29/07</strong> novos elementos mínimos — algoritmos de hash, licenças, ferramenta geradora, campo de assinatura. Substitui a base da NTIA de 2021. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>GitHub Actions</strong>: desde <strong>28/07</strong> retém execuções de workflow marcadas como \"potentially malicious\" — liberação só via sessão web autenticada. Por enquanto, apenas repositórios públicos. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Eclipse + OWASP</strong>: carta de intenções de <strong>29/07</strong> para a maturidade do ecossistema open source frente ao CRA, cinco frentes de trabalho incluindo adoção de SBOM. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">Release</span> <strong>Python 3.14.7</strong> sai amanhã, <strong>04/08</strong> — versão de manutenção programada conforme a PEP 745. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Pendências do Spring</strong>: quatro avisos de <strong>11/12 de junho</strong> — ID de sessão WebSocket, cabeçalho do Cloud Gateway, Vector Store, Sleuth. Sem alarme, mas material para a janela de manutenção. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>Superlogical</strong>: Mitchell Hashimoto apresenta em <strong>30/07</strong> um multiplexador de terminal do lado do servidor. Lista de espera, ainda sem produto. <span class=\"chip\">USA</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Las Vegas</strong>: Black Hat Briefings em <strong>05/06 de agosto</strong>, DEF CON 34 de <strong>06 a 09/08</strong> — a janela de divulgação mais concentrada do ano. <span class=\"chip\">Global</span></li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Ayer, aquí, decíamos que el 02/08 era una fecha límite sin efecto. Eso era demasiado impreciso: es cierto para las obligaciones de alto riesgo, no para el Capítulo V. Desde ayer, la Comisión Europea puede exigir documentación a los proveedores de modelos de IA de propósito general, evaluar sus modelos por su cuenta y, en caso de duda, retirarlos del mercado — el tope de la multa es del <strong>3 %</strong> de la facturación mundial. Fuera de eso, hoy es el día de los formularios: una nueva lista de campos obligatorios para las listas de materiales de software, un paso de aprobación antes de cada ejecución sospechosa de CI, una alianza de capacitación para el CRA. El único agujero real de la semana, por cierto, está en un cargador de imágenes.</p>\n    <ul>\n      <li><span class=\"chip\">Regulación</span> <strong>AI Act, Capítulo V</strong>: las facultades de supervisión y ejecución sobre proveedores de GPAI están vigentes desde el <strong>02/08</strong> — multa de hasta <strong>3 %</strong> de la facturación mundial o <strong>15 millones de €</strong>. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Rails</strong>: <code>CVE-2026-66066</code> — una imagen subida permite leer archivos arbitrarios, incluido el entorno del proceso, con <code>secret_key_base</code> de por medio. Correcciones en 7.2.3.2 / 8.0.5.1 / 8.1.3.1. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Reescritura del SBOM</strong>: CISA y sus socios publican el <strong>29/07</strong> nuevos elementos mínimos — algoritmos de hash, licencias, herramienta generadora, campo de firma. Sustituye la base de la NTIA de 2021. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>GitHub Actions</strong>: desde el <strong>28/07</strong> retiene las ejecuciones de workflow marcadas como \"potentially malicious\" — la aprobación solo se da vía una sesión web autenticada. Por ahora, únicamente repositorios públicos. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Eclipse + OWASP</strong>: carta de intención del <strong>29/07</strong> para la madurez del ecosistema open source frente al CRA, cinco líneas de trabajo, incluida la adopción de SBOM. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">Release</span> <strong>Python 3.14.7</strong> sale mañana, <strong>04/08</strong> — versión de mantenimiento programada según la PEP 745. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Pendientes de Spring</strong>: cuatro avisos del <strong>11/12 de junio</strong> — ID de sesión de WebSocket, encabezado del Cloud Gateway, Vector Store, Sleuth. Sin alarma, pero material para la ventana de mantenimiento. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Infra</span> <strong>Superlogical</strong>: Mitchell Hashimoto presenta el <strong>30/07</strong> un multiplexor de terminal del lado del servidor. Lista de espera, todavía sin producto. <span class=\"chip\">USA</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>Las Vegas</strong>: las Black Hat Briefings serán el <strong>05 y 06/08</strong>, DEF CON 34 del <strong>06 al 09/08</strong> — la ventana de divulgación más densa del año. <span class=\"chip\">Global</span></li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Die interessanteste Meldung des Tages ist eine, die nicht stattgefunden hat: <strong>Gemini 3.5 Pro</strong> ist immer noch nicht draußen, und der Grund ist ausgerechnet das Thema dieses Newsletters. Google hat die Trainingsdaten gezielt nachgeschärft, um die Coding-Fähigkeiten zu verbessern — und die Ergebnisse waren enttäuschend. Dazu passt eine zweite Beobachtung, die sich heute an einer neuen Zahl festmachen lässt: <strong>SWE-Bench Pro</strong> stellt dieselben Modelle in eine völlig andere Reihenfolge als das Verified-Board, um das hier seit Tagen gestritten wird. Wer einen Modellwechsel mit einem Benchmark begründet, sollte deshalb ab heute dazusagen, <em>welchen</em>.</p>\n    <ul>\n      <li><span class=\"chip hot\">Google</span> <strong>Gemini 3.5 Pro verpasste den Juni-Termin wegen des Codes</strong>: Google änderte die Trainingsdaten, um die Programmierfähigkeit zu heben — „die Ergebnisse waren enttäuschend\". Das Modell ist weiter nur im Partner-Test.</li>\n      <li><span class=\"chip\">Google</span> <strong>Der kleine Bruder läuft längst</strong>: Gemini 3.5 Flash ist seit <span class=\"stat\">19.05.</span> allgemein verfügbar und schlägt laut Google das alte Flaggschiff 3.1 Pro — Terminal-Bench 2.1 <span class=\"stat\">76,2 %</span>, MCP Atlas <span class=\"stat\">83,6 %</span>.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Dasselbe Modell, zwei Ränge</strong>: GPT-5.6 Sol führt Terminal-Bench mit <span class=\"stat\">91,9 %</span> an („best verified\") und liegt auf SWE-Bench Pro mit <span class=\"stat\">64,6 %</span> rund <span class=\"stat\">15,7</span> Punkte hinter dem Claude-Spitzenfeld.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Verified-Board neu datiert, Feld unverändert</strong>: llm-stats trägt heute den 03.08. — Claude Fable 5 bei <span class=\"stat\">95,0 %</span>, fünf Anthropic-Einträge vor dem Rest. Aggregator, nicht swebench.com.</li>\n      <li><span class=\"chip\">Tool</span> <strong>GitHub Copilot streicht zwei Google-Modelle</strong>: Gemini 2.5 Pro und Gemini 3 Flash fliegen aus der Modellauswahl. Schlechtes Timing für Google, praktische Aufgabe für alle mit fest verdrahteten Modellkennungen.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>Inkling nachgetragen</strong>: Thinking Machines' erstes offenes Modell (15.07., Apache-2.0, 975 Mrd./41 Mrd.) braucht laut Anbieter <span class=\"stat\">ein Drittel</span> der Token von Nvidias Nemotron 3 Ultra für dieselbe Coding-Leistung.</li>\n      <li><span class=\"chip\">OSS</span> <strong>Vier offene Modelle in acht Wochen — eines läuft auf einem Mac</strong>: Kimi K3 (2,8 Bio.), Inkling (975 Mrd.), DeepSeek-V4-Flash (13 Mrd. aktiv), Qwen4-Coder (3 Mrd. aktiv). Ausgerechnet das kleinste hat bis heute keinen Board-Eintrag.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Aider-Board bleibt tot</strong>: letzte Aktualisierung <span class=\"stat\">20.11.2025</span>, Spitzenreiter weiter <code>gpt-5 (high)</code> mit 88,0 %. Das Edit-Board steht beim 12.04.2025.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Korrektur zu Continue</strong>: Gestern stand hier „aktive Entwicklung beendet\". Auf der Veröffentlichungsseite steht nach der 2.0 noch eine <code>v2.1.0</code> vom 19.06. und kein Wort von einem Projektende.</li>\n    </ul></div>",

ss=\"chip\">Tool</span> <strong>GitHub Copilot streicht zwei Google-Modelle</strong>: Gemini 2.5 Pro und Gemini 3 Flash fliegen aus der Modellauswahl. Schlechtes Timing für Google, praktische Aufgabe für alle mit fest verdrahteten Modellkennungen.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>Inkling nachgetragen</strong>: Thinking Machines' erstes offenes Modell (15.07., Apache-2.0, 975 Mrd./41 Mrd.) braucht laut Anbieter <span class=\"stat\">ein Drittel</span> der Token von Nvidias Nemotron 3 Ultra für dieselbe Coding-Leistung.</li>\n      <li><span class=\"chip\">OSS</span> <strong>Vier offene Modelle in acht Wochen — eines läuft auf einem Mac</strong>: Kimi K3 (2,8 Bio.), Inkling (975 Mrd.), DeepSeek-V4-Flash (13 Mrd. aktiv), Qwen4-Coder (3 Mrd. aktiv). Ausgerechnet das kleinste hat bis heute keinen Board-Eintrag.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Aider-Board bleibt tot</strong>: letzte Aktualisierung <span class=\"stat\">20.11.2025</span>, Spitzenreiter weiter <code>gpt-5 (high)</code> mit 88,0 %. Das Edit-Board steht beim 12.04.2025.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Korrektur zu Continue</strong>: Gestern stand hier „aktive Entwicklung beendet\". Auf der Veröffentlichungsseite steht nach der 2.0 noch eine <code>v2.1.0</code> vom 19.06. und kein Wort von einem Projektende.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">The most interesting story of the day is one that didn't happen: <strong>Gemini 3.5 Pro</strong> is still not out, and the reason happens to be exactly this newsletter's subject. Google specifically retuned the training data to improve coding ability — and the results were disappointing. That fits a second observation that today can be pinned to a new number: <strong>SWE-Bench Pro</strong> puts the same models in a completely different order than the Verified board, the one we've been arguing about here for days. So starting today, anyone who justifies a model switch with a benchmark should specify which one.</p>\n    <ul>\n      <li><span class=\"chip hot\">Google</span> <strong>Gemini 3.5 Pro missed its June date because of code</strong>: Google changed the training data to lift coding ability — \"the results were disappointing.\" The model is still only in partner testing.</li>\n      <li><span class=\"chip\">Google</span> <strong>The little brother has been running for weeks</strong>: Gemini 3.5 Flash has been generally available since <span class=\"stat\">May 19</span> and, per Google, beats the old flagship 3.1 Pro — Terminal-Bench 2.1 <span class=\"stat\">76.2%</span>, MCP Atlas <span class=\"stat\">83.6%</span>.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Same model, two ranks</strong>: GPT-5.6 Sol leads Terminal-Bench with <span class=\"stat\">91.9%</span> (\"best verified\") and sits on SWE-Bench Pro at <span class=\"stat\">64.6%</span> — about <span class=\"stat\">15.7</span> points behind the Claude leaders.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Verified board re-dated, field unchanged</strong>: llm-stats now shows Aug 3 — Claude Fable 5 at <span class=\"stat\">95.0%</span>, five Anthropic entries ahead of everyone else. An aggregator, not swebench.com.</li>\n      <li><span class=\"chip\">Tool</span> <strong>GitHub Copilot drops two Google models</strong>: Gemini 2.5 Pro and Gemini 3 Flash are being pulled from the model picker. Bad timing for Google, a practical task for anyone with hard-coded model IDs.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>Inkling, filed late</strong>: Thinking Machines' first open model (Jul 15, Apache-2.0, 975B/41B) needs, per the vendor, <span class=\"stat\">a third</span> of the tokens Nvidia's Nemotron 3 Ultra needs for the same coding performance.</li>\n      <li><span class=\"chip\">OSS</span> <strong>Four open models in eight weeks — one runs on a Mac</strong>: Kimi K3 (2.8T), Inkling (975B), DeepSeek-V4-Flash (13B active), Qwen4-Coder (3B active). The smallest of the four, of all things, still has no board entry.</li>\n      <li><span class=\"chip\">Bench</span> <strong>The Aider board stays dead</strong>: last updated <span class=\"stat\">Nov 20, 2025</span>, still led by <code>gpt-5 (high)</code> at 88.0%. The edit board is stuck at Apr 12, 2025.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Correction on Continue</strong>: yesterday this said \"active development ended.\" The releases page shows a <code>v2.1.0</code> from Jun 19 after the 2.0, with no word of the project ending.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">A notícia mais interessante do dia é uma que não aconteceu: o <strong>Gemini 3.5 Pro</strong> continua sem sair, e o motivo é justamente o tema deste newsletter. O Google reajustou de propósito os dados de treinamento para melhorar a capacidade de coding — e os resultados foram decepcionantes. Combina com isso uma segunda observação, que hoje se apoia num número novo: o <strong>SWE-Bench Pro</strong> coloca os mesmos modelos numa ordem completamente diferente do ranking Verified, aquele sobre o qual se discute aqui há dias. Por isso, quem justificar uma troca de modelo com um benchmark deveria, a partir de hoje, dizer <em>qual</em>.</p>\n    <ul>\n      <li><span class=\"chip hot\">Google</span> <strong>Gemini 3.5 Pro perdeu o prazo de junho por causa do código</strong>: o Google mudou os dados de treinamento para elevar a capacidade de programação — \"os resultados foram decepcionantes\". O modelo segue só em teste com parceiros.</li>\n      <li><span class=\"chip\">Google</span> <strong>O irmão pequeno já roda há semanas</strong>: o Gemini 3.5 Flash está geralmente disponível desde <span class=\"stat\">19/05</span> e, segundo o Google, supera o antigo carro-chefe 3.1 Pro — Terminal-Bench 2.1 <span class=\"stat\">76,2%</span>, MCP Atlas <span class=\"stat\">83,6%</span>.</li>\n      <li><span class=\"chip\">Bench</span> <strong>O mesmo modelo, duas posições</strong>: o GPT-5.6 Sol lidera o Terminal-Bench com <span class=\"stat\">91,9%</span> (\"best verified\") e fica no SWE-Bench Pro com <span class=\"stat\">64,6%</span>, cerca de <span class=\"stat\">15,7</span> pontos atrás da liderança da Claude.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Ranking Verified com data nova, campo igual</strong>: o llm-stats mostra hoje 03/08 — Claude Fable 5 em <span class=\"stat\">95,0%</span>, cinco entradas da Anthropic à frente do resto. Agregador, não swebench.com.</li>\n      <li><span class=\"chip\">Tool</span> <strong>GitHub Copilot tira dois modelos do Google</strong>: Gemini 2.5 Pro e Gemini 3 Flash saem do seletor de modelos. Timing ruim para o Google, tarefa prática para quem tem IDs de modelo fixados no código.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>Inkling, registrado com atraso</strong>: o primeiro modelo aberto da Thinking Machines (15/07, Apache-2.0, 975 bi/41 bi) precisa, segundo o fornecedor, de <span class=\"stat\">um terço</span> dos tokens que a Nemotron 3 Ultra da Nvidia gasta para o mesmo desempenho de coding.</li>\n      <li><span class=\"chip\">OSS</span> <strong>Quatro modelos abertos em oito semanas — um roda num Mac</strong>: Kimi K3 (2,8 tri), Inkling (975 bi), DeepSeek-V4-Flash (13 bi ativos), Qwen4-Coder (3 bi ativos). Justo o menor deles ainda não tem entrada em nenhum ranking.</li>\n      <li><span class=\"chip\">Bench</span> <strong>O ranking do Aider continua morto</strong>: última atualização em <span class=\"stat\">20/11/2025</span>, ainda liderado por <code>gpt-5 (high)</code> com 88,0%. O ranking de edição está parado em 12/04/2025.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Correção sobre o Continue</strong>: ontem, este espaço dizia \"desenvolvimento ativo encerrado\". A página de lançamentos mostra uma <code>v2.1.0</code> de 19/06 depois da 2.0, e nenhuma palavra sobre o fim do projeto.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">La noticia más interesante del día es una que no ocurrió: <strong>Gemini 3.5 Pro</strong> sigue sin salir, y el motivo es justamente el tema de este newsletter. Google reajustó a propósito los datos de entrenamiento para mejorar la capacidad de coding — y los resultados fueron decepcionantes. A eso se suma una segunda observación que hoy se puede anclar en una cifra nueva: <strong>SWE-Bench Pro</strong> pone a los mismos modelos en un orden completamente distinto al del ranking Verified, el mismo que llevamos días discutiendo aquí. Por eso, quien justifique un cambio de modelo con un benchmark debería, desde hoy, decir <em>cuál</em>.</p>\n    <ul>\n      <li><span class=\"chip hot\">Google</span> <strong>Gemini 3.5 Pro perdió su fecha de junio por el código</strong>: Google cambió los datos de entrenamiento para elevar la capacidad de programación — \"los resultados fueron decepcionantes\". El modelo sigue solo en prueba con socios.</li>\n      <li><span class=\"chip\">Google</span> <strong>El hermano menor lleva semanas funcionando</strong>: Gemini 3.5 Flash está disponible de forma general desde el <span class=\"stat\">19/05</span> y, según Google, supera al viejo buque insignia 3.1 Pro — Terminal-Bench 2.1 <span class=\"stat\">76,2%</span>, MCP Atlas <span class=\"stat\">83,6%</span>.</li>\n      <li><span class=\"chip\">Bench</span> <strong>El mismo modelo, dos lugares</strong>: GPT-5.6 Sol lidera Terminal-Bench con <span class=\"stat\">91,9%</span> (\"best verified\") y en SWE-Bench Pro se queda en <span class=\"stat\">64,6%</span>, unos <span class=\"stat\">15,7</span> puntos detrás de la punta de Claude.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Ranking Verified con fecha nueva, campo sin cambios</strong>: llm-stats muestra hoy el 03/08 — Claude Fable 5 en <span class=\"stat\">95,0%</span>, cinco entradas de Anthropic antes que el resto. Agregador, no swebench.com.</li>\n      <li><span class=\"chip\">Tool</span> <strong>GitHub Copilot quita dos modelos de Google</strong>: Gemini 2.5 Pro y Gemini 3 Flash salen del selector de modelos. Mal momento para Google, tarea práctica para quien tenga IDs de modelo escritos a fuego en su código.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>Inkling, registrado con retraso</strong>: el primer modelo abierto de Thinking Machines (15/07, Apache-2.0, 975 mil millones/41 mil millones) necesita, según el proveedor, <span class=\"stat\">un tercio</span> de los tokens que gasta la Nemotron 3 Ultra de Nvidia para el mismo desempeño de coding.</li>\n      <li><span class=\"chip\">OSS</span> <strong>Cuatro modelos abiertos en ocho semanas — uno corre en una Mac</strong>: Kimi K3 (2,8 billones), Inkling (975 mil millones), DeepSeek-V4-Flash (13 mil millones activos), Qwen4-Coder (3 mil millones activos). Justo el más pequeño de todos sigue sin entrada en ningún ranking.</li>\n      <li><span class=\"chip\">Bench</span> <strong>El ranking de Aider sigue muerto</strong>: última actualización el <span class=\"stat\">20/11/2025</span>, todavía a la cabeza <code>gpt-5 (high)</code> con 88,0%. El ranking de edición está detenido en el 12/04/2025.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Corrección sobre Continue</strong>: ayer aquí se dijo que \"el desarrollo activo terminó\". La página de lanzamientos muestra una <code>v2.1.0</code> del 19/06 después de la 2.0, y ni una palabra sobre el fin del proyecto.</li>\n    </ul></div>"
