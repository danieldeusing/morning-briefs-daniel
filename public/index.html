      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Gestern war die Nachricht ein Stichtag, der ausfiel. Heute ist sie ein Schalter, der verschwindet: Seit Freitag, dem <strong>31.07.2026</strong>, lässt Microsoft niemanden mehr <em>Restricted SharePoint Search</em> neu aktivieren — die Notbremse, die Copilot aus ungeprüften SharePoint-Ablagen heraushielt.<sup>[3]</sup> Zur selben Zeit läuft mit <strong>Scout</strong> ein Agent an, der nicht mehr gefragt werden muss, sondern dauerhaft mitliest.<sup>[1]</sup> Die Reihenfolge stimmt nicht: Der Agent kommt vor der Hausordnung.</p>\n    <ul>\n      <li><span class=\"chip hot\">PLATTFORM · US</span> <strong>Die Notbremse geht in Rente:</strong> Restricted SharePoint Search — Erlaubnisliste von maximal <strong>100 Sites</strong> — nimmt seit 31.07.2026 keine Neuaktivierung mehr an. Microsofts eigene Doku: „isn't a security boundary\".<sup>[3]</sup></li>\n      <li><span class=\"chip\">DEPLOY · US</span> <strong>Scout</strong> ist ein Dauer-Agent im M365-Umfeld auf dem OpenClaw-Framework — Zugang nur über das Frontier-Frühzugriffsprogramm und mit GitHub-Copilot-Abo.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">MARKT · US</span> <strong>Die Rechnung dahinter:</strong> berichtete <strong>4,5 %</strong> von 450 Mio. M365-Sitzen zahlten im April für Copilot (20 Mio. Sitze); in Microsofts eigener Q4-Mitteilung vom 29.07.2026 sind es <strong>über 30 Mio.</strong> — rund 6,7 % — gegen über 50 Mio. Zahler bei ChatGPT.<sup>[2]</sup></li>\n      <li><span class=\"chip\">DEPLOY</span> <strong>Replit lässt den Agenten Marketing machen:</strong> Der SEO Agent (03.06.2026) prüft Crawlbarkeit, Meta-Tags, sitemap.xml und strukturierte Daten und repariert per Klick — eine Geschäftsfunktion, keine Entwickleraufgabe.<sup>[4]</sup></li>\n      <li><span class=\"chip good\">STUDIE · DE</span> <strong>41 % nutzen KI</strong> (Bitkom, n = 604, ab 20 Beschäftigten) — <strong>33 %</strong> sagen: teurer als erwartet, bei <strong>77 %</strong> mit besserer Wettbewerbsposition. Aus einer älteren Bitkom-Befragung: <strong>53 %</strong> nennen fehlendes technisches Know-how als Hürde.<sup>[5]</sup></li>\n      <li><span class=\"chip\">STUDIE · GLOBAL</span> <strong>23 % skalieren ein agentisches System</strong> (McKinsey) — die vielzitierten 88 % standen gestern hier schon, unter anderem Absender. Ab heute: <em>eine</em> Zahl, nicht zwei Bestätigungen.<sup>[6]</sup></li>\n      <li><span class=\"chip hot\">REG · DE</span> <strong>Mitbestimmung schlägt Lizenzvertrag:</strong> § 87 Abs. 1 Nr. 6 BetrVG greift bei technischen Einrichtungen zur Verhaltens- oder Leistungsüberwachung.<sup>[8]</sup> Ein Dauer-Agent im Postfach ist so eine. <em>Meine Lesart, keine Rechtsberatung.</em></li>\n      <li><span class=\"chip good\">twiceD</span> Zwei Ideen: eine <strong>Agenten-Freigabe</strong> (Berechtigungs-Hygiene + Betriebsrat-Vorbereitung) und ein <strong>AI-Sichtbarkeits-Check</strong> — letzterer bewusst nur „Mittel\".</li>\n    </ul></div>",
      "latestTldrHtmlByLang": {
        "de": "<div class=\"tldr\"><p class=\"lead\">Gestern war die Nachricht ein Stichtag, der ausfiel. Heute ist sie ein Schalter, der verschwindet: Seit Freitag, dem <strong>31.07.2026</strong>, lässt Microsoft niemanden mehr <em>Restricted SharePoint Search</em> neu aktivieren — die Notbremse, die Copilot aus ungeprüften SharePoint-Ablagen heraushielt.<sup>[3]</sup> Zur selben Zeit läuft mit <strong>Scout</strong> ein Agent an, der nicht mehr gefragt werden muss, sondern dauerhaft mitliest.<sup>[1]</sup> Die Reihenfolge stimmt nicht: Der Agent kommt vor der Hausordnung.</p>\n    <ul>\n      <li><span class=\"chip hot\">PLATTFORM · US</span> <strong>Die Notbremse geht in Rente:</strong> Restricted SharePoint Search — Erlaubnisliste von maximal <strong>100 Sites</strong> — nimmt seit 31.07.2026 keine Neuaktivierung mehr an. Microsofts eigene Doku: „isn't a security boundary\".<sup>[3]</sup></li>\n      <li><span class=\"chip\">DEPLOY · US</span> <strong>Scout</strong> ist ein Dauer-Agent im M365-Umfeld auf dem OpenClaw-Framework — Zugang nur über das Frontier-Frühzugriffsprogramm und mit GitHub-Copilot-Abo.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">MARKT · US</span> <strong>Die Rechnung dahinter:</strong> berichtete <strong>4,5 %</strong> von 450 Mio. M365-Sitzen zahlten im April für Copilot (20 Mio. Sitze); in Microsofts eigener Q4-Mitteilung vom 29.07.2026 sind es <strong>über 30 Mio.</strong> — rund 6,7 % — gegen über 50 Mio. Zahler bei ChatGPT.<sup>[2]</sup></li>\n      <li><span class=\"chip\">DEPLOY</span> <strong>Replit lässt den Agenten Marketing machen:</strong> Der SEO Agent (03.06.2026) prüft Crawlbarkeit, Meta-Tags, sitemap.xml und strukturierte Daten und repariert per Klick — eine Geschäftsfunktion, keine Entwickleraufgabe.<sup>[4]</sup></li>\n      <li><span class=\"chip good\">STUDIE · DE</span> <strong>41 % nutzen KI</strong> (Bitkom, n = 604, ab 20 Beschäftigten) — <strong>33 %</strong> sagen: teurer als erwartet, bei <strong>77 %</strong> mit besserer Wettbewerbsposition. Aus einer älteren Bitkom-Befragung: <strong>53 %</strong> nennen fehlendes technisches Know-how als Hürde.<sup>[5]</sup></li>\n      <li><span class=\"chip\">STUDIE · GLOBAL</span> <strong>23 % skalieren ein agentisches System</strong> (McKinsey) — die vielzitierten 88 % standen gestern hier schon, unter anderem Absender. Ab heute: <em>eine</em> Zahl, nicht zwei Bestätigungen.<sup>[6]</sup></li>\n      <li><span class=\"chip hot\">REG · DE</span> <strong>Mitbestimmung schlägt Lizenzvertrag:</strong> § 87 Abs. 1 Nr. 6 BetrVG greift bei technischen Einrichtungen zur Verhaltens- oder Leistungsüberwachung.<sup>[8]</sup> Ein Dauer-Agent im Postfach ist so eine. <em>Meine Lesart, keine Rechtsberatung.</em></li>\n      <li><span class=\"chip good\">twiceD</span> Zwei Ideen: eine <strong>Agenten-Freigabe</strong> (Berechtigungs-Hygiene + Betriebsrat-Vorbereitung) und ein <strong>AI-Sichtbarkeits-Check</strong> — letzterer bewusst nur „Mittel\".</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Yesterday's news was a deadline that didn't happen. Today's is a switch that disappears: since Friday, 2026-07-31, Microsoft no longer lets anyone re-enable Restricted SharePoint Search — the emergency brake that kept Copilot out of unvetted SharePoint stores.<sup>[3]</sup> At the same time, Scout is rolling out — an agent that no longer needs to be asked, because it reads along permanently.<sup>[1]</sup> The order is wrong: the agent arrives before the house rules.</p>\n    <ul>\n      <li><span class=\"chip hot\">PLATFORM · US</span> <strong>The emergency brake retires:</strong> Restricted SharePoint Search — an allow list of up to 100 sites — has stopped accepting new activations since 2026-07-31. Microsoft's own docs: \"isn't a security boundary.\"<sup>[3]</sup></li>\n      <li><span class=\"chip\">DEPLOY · US</span> <strong>Scout</strong> is an always-on agent for the M365 environment, built on the OpenClaw framework — access only through the Frontier early-access program and with a GitHub Copilot subscription.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">MARKET · US</span> <strong>The math behind it:</strong> a reported 4.5% of 450 million M365 seats paid for Copilot in April (20 million seats); Microsoft's own Q4 release from 2026-07-29 puts it at over 30 million — roughly 6.7% — versus over 50 million paying ChatGPT users.<sup>[2]</sup></li>\n      <li><span class=\"chip\">DEPLOY</span> <strong>Replit puts an agent on marketing duty:</strong> the SEO Agent (2026-06-03) checks crawlability, meta tags, sitemap.xml, and structured data, and fixes issues with a click — a business function, not a developer task.<sup>[4]</sup></li>\n      <li><span class=\"chip good\">STUDY · DE</span> <strong>41% use AI</strong> (Bitkom Research, n = 604, businesses with 20+ employees) — <strong>33%</strong> say it cost more than expected, while <strong>77%</strong> report an improved competitive position. From an older Bitkom survey: <strong>53%</strong> name their own lack of technical know-how as a hurdle.<sup>[5]</sup></li>\n      <li><span class=\"chip\">STUDY · GLOBAL</span> <strong>23% are scaling an agentic system</strong> (McKinsey) — the widely cited 88% figure appeared here yesterday too, under a different byline. As of today: one number, not two confirmations.<sup>[6]</sup></li>\n      <li><span class=\"chip hot\">REG · DE</span> <strong>Co-determination beats the license agreement:</strong> § 87(1) no. 6 of the German Works Constitution Act (BetrVG) applies to technical systems for monitoring behavior or performance.<sup>[8]</sup> An always-on agent in the inbox is exactly that. <em>My reading, not legal advice.</em></li>\n      <li><span class=\"chip good\">twiceD</span> Two ideas: an <strong>agent clearance package</strong> (permission hygiene + works-council prep) and an <strong>AI visibility check</strong> — the latter deliberately rated only \"Medium.\"</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Ontem a notícia era um prazo que não aconteceu. Hoje é um interruptor que desaparece: desde sexta-feira, 31/07/2026, a Microsoft não deixa mais ninguém reativar o Restricted SharePoint Search — o freio de emergência que mantinha o Copilot longe de repositórios do SharePoint não verificados.<sup>[3]</sup> Ao mesmo tempo, entra em operação o <strong>Scout</strong>, um agente que não precisa mais ser chamado, porque acompanha tudo o tempo todo.<sup>[1]</sup> A ordem está errada: o agente chega antes das regras da casa.</p>\n    <ul>\n      <li><span class=\"chip hot\">PLATAFORMA · EUA</span> <strong>O freio de emergência se aposenta:</strong> o Restricted SharePoint Search — lista de permissões de no máximo 100 sites — deixou de aceitar reativação desde 31/07/2026. A própria documentação da Microsoft: \"isn't a security boundary\".<sup>[3]</sup></li>\n      <li><span class=\"chip\">IMPLANTAÇÃO · EUA</span> O <strong>Scout</strong> é um agente permanente no ambiente M365, construído sobre o framework OpenClaw — acesso só pelo programa de acesso antecipado Frontier e com assinatura do GitHub Copilot.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">MERCADO · EUA</span> <strong>A conta por trás:</strong> reportados 4,5% de 450 milhões de assentos M365 pagaram pelo Copilot em abril (20 milhões de assentos); na própria divulgação de resultados do 4º trimestre fiscal da Microsoft, de 29/07/2026, o número já passa de 30 milhões — cerca de 6,7% — contra mais de 50 milhões de pagantes no ChatGPT.<sup>[2]</sup></li>\n      <li><span class=\"chip\">IMPLANTAÇÃO</span> <strong>A Replit coloca o agente para fazer marketing:</strong> o SEO Agent (03/06/2026) verifica rastreabilidade, meta tags, sitemap.xml e dados estruturados e corrige com um clique — uma função de negócio, não uma tarefa de desenvolvedor.<sup>[4]</sup></li>\n      <li><span class=\"chip good\">ESTUDO · DE</span> <strong>41% usam IA</strong> (Bitkom Research, n = 604, empresas a partir de 20 funcionários) — <strong>33%</strong> dizem: mais caro do que o esperado, com <strong>77%</strong> relatando melhor posição competitiva. De um levantamento mais antigo da Bitkom: <strong>53%</strong> apontam a falta de know-how técnico como obstáculo.<sup>[5]</sup></li>\n      <li><span class=\"chip\">ESTUDO · GLOBAL</span> <strong>23% escalam um sistema agêntico</strong> (McKinsey) — os tão citados 88% já apareceram aqui ontem, sob outro remetente. A partir de hoje: um número, não duas confirmações.<sup>[6]</sup></li>\n      <li><span class=\"chip hot\">REGULAÇÃO · DE</span> <strong>Cogestão vence o contrato de licença:</strong> o § 87, parágrafo 1, nº 6, da BetrVG (lei alemã de constituição das empresas) se aplica a instalações técnicas para monitorar comportamento ou desempenho.<sup>[8]</sup> Um agente permanente na caixa de entrada é exatamente isso. <em>Minha leitura, não é orientação jurídica.</em></li>\n      <li><span class=\"chip good\">twiceD</span> Duas ideias: uma <strong>liberação de agente</strong> (higiene de permissões + preparação para o conselho de trabalhadores) e um <strong>check de visibilidade em IA</strong> — este último, deliberadamente, só \"Média\".</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Ayer la noticia era una fecha límite que no ocurrió. Hoy es un interruptor que desaparece: desde el viernes 31/07/2026, Microsoft ya no deja que nadie reactive Restricted SharePoint Search — el freno de emergencia que mantenía a Copilot fuera de repositorios de SharePoint sin revisar.<sup>[3]</sup> Al mismo tiempo, arranca <strong>Scout</strong>, un agente que ya no hay que llamar, porque lee todo de forma permanente.<sup>[1]</sup> El orden está mal: el agente llega antes que las reglas de la casa.</p>\n    <ul>\n      <li><span class=\"chip hot\">PLATAFORMA · EE. UU.</span> <strong>El freno de emergencia se jubila:</strong> Restricted SharePoint Search — lista de permitidos de máximo 100 sitios — dejó de aceptar reactivaciones desde el 31/07/2026. La propia documentación de Microsoft: \"isn't a security boundary\".<sup>[3]</sup></li>\n      <li><span class=\"chip\">DESPLIEGUE · EE. UU.</span> <strong>Scout</strong> es un agente permanente en el entorno M365, construido sobre el framework OpenClaw — acceso solo mediante el programa de acceso anticipado Frontier y con suscripción a GitHub Copilot.<sup>[1]</sup></li>\n      <li><span class=\"chip hot\">MERCADO · EE. UU.</span> <strong>La cuenta detrás:</strong> un reportado 4,5% de 450 millones de asientos de M365 pagó por Copilot en abril (20 millones de asientos); según el propio informe del 4T del FY26 de Microsoft, del 29/07/2026, la cifra ya supera los 30 millones — alrededor de 6,7% — frente a más de 50 millones de usuarios de pago de ChatGPT.<sup>[2]</sup></li>\n      <li><span class=\"chip\">DESPLIEGUE</span> <strong>Replit pone al agente a hacer marketing:</strong> el SEO Agent (03/06/2026) revisa la rastreabilidad, las meta etiquetas, el sitemap.xml y los datos estructurados, y corrige con un clic — una función de negocio, no una tarea de desarrollador.<sup>[4]</sup></li>\n      <li><span class=\"chip good\">ESTUDIO · DE</span> <strong>41% usa IA</strong> (Bitkom Research, n = 604, empresas desde 20 empleados) — <strong>33%</strong> dice: más caro de lo esperado, con <strong>77%</strong> que reporta mejor posición competitiva. De una encuesta anterior de Bitkom: <strong>53%</strong> nombra la falta de know-how técnico como obstáculo.<sup>[5]</sup></li>\n      <li><span class=\"chip\">ESTUDIO · GLOBAL</span> <strong>23% escala un sistema agéntico</strong> (McKinsey) — el tan citado 88% ya apareció aquí ayer, bajo otro remitente. Desde hoy: una cifra, no dos confirmaciones.<sup>[6]</sup></li>\n      <li><span class=\"chip hot\">REGULACIÓN · DE</span> <strong>La cogestión vence al contrato de licencia:</strong> el § 87, párrafo 1, núm. 6, de la BetrVG (ley alemana de constitución de empresas) aplica a instalaciones técnicas para vigilar el comportamiento o el desempeño.<sup>[8]</sup> Un agente permanente en el buzón es exactamente eso. <em>Mi lectura, no es asesoría legal.</em></li>\n      <li><span class=\"chip good\">twiceD</span> Dos ideas: una <strong>autorización de agente</strong> (higiene de permisos + preparación para el consejo de trabajadores) y una <strong>revisión de visibilidad en IA</strong> — esta última, deliberadamente, solo \"Media\".</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Der Mittwochs-Abruf bringt <strong>99 Listings</strong> nach 96 am Dienstag — und zum ersten Mal lässt sich die eigentliche Frage dieses Briefs sauber beantworten: <em>Was ist dieses Profil auf dem Markt wert?</em> Drei unabhängige Erhebungen sagen heute dasselbe. Der DACH-Schnitt aller Freelancer liegt bei <strong>103 €/h</strong>, der IT-Median bei <strong>95 €/h</strong>, Software- und Web-Entwicklung speziell bei <strong>90 €/h</strong>, Java-spezifisch <strong>87 €/h</strong>. Und das Board bestätigt es aus sich selbst heraus: Von 71 recherchierten Euro-Stundenbändern starten <strong>nur acht bei 95 €/h oder höher</strong>. Die Zielmarke von 100 €/h liegt damit über jedem heute belegbaren Median. Parallel meldet Bitkom 109.000 unbesetzte IT-Stellen — eine Zahl, die vor allem eines zeigt: Mangel-Statistik und Preis sind zwei verschiedene Dinge.</p>\n    <ul>\n      <li><span class=\"chip hot\">Rate</span> <strong>Der Preis dieses Profils, dreifach belegt</strong>: IT-Median <strong>95 €/h</strong>, Software &amp; Web Development <strong>90 €/h</strong>, DACH-Schnitt aller Branchen <strong>103 €/h</strong> (Freelancer-Kompass 2026)<sup>[2][3]</sup>. Java-spezifisch <strong>87 €/h</strong> im freelancermap-Verzeichnis (gestern zitiert); die gestern als zweiter Java-Anker geführte GULP-Zahl von 82 €/h ist heute <strong>nicht reproduzierbar</strong> und fällt weg<sup>[4]</sup>.</li>\n      <li><span class=\"chip hot\">Rate</span> <strong>Das Board sagt dasselbe über sich selbst.</strong> Von <strong>71</strong> recherchierten Euro-Stundenbändern beginnen nur <strong>8</strong> bei ≥ 95 €/h und nur <strong>6</strong> bei ≥ 100 €/h. Häufigstes Band: <strong>85–110 €/h</strong> (34 Einträge), zweithäufigstes 90–115 €/h (22).</li>\n      <li><span class=\"chip\">Markt</span> <strong>109.000 offene IT-Stellen</strong>, 85 % der Firmen melden Mangel, nur 4 % ein Überangebot — Bitkom, 855 befragte Unternehmen.<sup>[1]</sup> <strong>Aber:</strong> die Meldung datiert auf den <strong>07.08.2025</strong> und beschreibt einen <em>Rückgang</em> von 149.000 zwei Jahre zuvor. Kein Widerspruch zum fallenden Preis, sondern die andere Hälfte derselben Geschichte.</li>\n      <li><span class=\"chip hot\">Board</span> <strong>99 Listings</strong>: 84 Freelance, 10 Employee, 5 Intriguing. 94 übernommen, 5 neu, 2 gefallen, <strong>null Score-Drift</strong>. Trefferband ≥ 70 bleibt exakt <strong>24</strong>, ≥ 75 exakt <strong>14</strong>, Median <strong>62</strong>, Spitze <strong>83</strong> — vier Kennzahlen, vier Nullen.</li>\n      <li><span class=\"chip\">Board</span> <strong>77 der 99 Einträge sind unverifizierte Übernahmen</strong> („carried forward … not individually re-verified today\"). Der ungeprüfte Anteil steigt von 64 % gestern auf <strong>78 %</strong> heute. Live gezogen wurden 13 Seiten.</li>\n      <li><span class=\"chip hot\">CH</span> <strong>UBS gibt rund 3.000 Schweizer Stellen frei</strong> — Schwerpunkt zweites Halbjahr 2026 bis Anfang 2027, und diesmal trifft es zuerst die IT. Die externen IT-Köpfe sind schon von <strong>33.013</strong> (Ende 2022) auf rund <strong>16.000</strong> gefallen.<sup>[5]</sup></li>\n      <li><span class=\"chip\">CH</span> <strong>Die zweite CH-Lohnquelle bestätigt die erste</strong>: Senior Software Engineer Zürich <strong>CHF 95.000–140.000</strong>, Median CHF 115.000 (SwissDevJobs, &gt; 750 Stellen).<sup>[6]</sup> Zusammen mit den gestern zitierten CHF 115.000–145.000 liegt das ganze Senior-Band unter der eigenen Filterschwelle von CHF 150.000.</li>\n      <li><span class=\"chip\">Employee</span> <strong>Zehn Einträge, drei mit bestätigtem Gehalt</strong> — alle drei bei Grafana Labs, <strong>97.034–137.000 €</strong>. Der Rest sind recherchierte Bänder. Die Spitze bleibt ELCA Zürich (Fit 81).</li>\n      <li><span class=\"chip\">Markt</span> <strong>Aleph Alpha hat 50 Stellen gestrichen</strong>, laut Bericht rund 17 % der Belegschaft, Schwerpunkt Engineering und Forschung; Gründer Jonas Andrulis hatte den CEO-Posten schon im Oktober 2025 abgegeben.<sup>[7]</sup> Ereignis vom <strong>14.01.2026</strong> — kein frisches Ereignis, aber einer der DACH-KI-Arbeitgeber aus der eigenen Employee-Quellenliste.</li>\n      <li><span class=\"chip\">Vergabe</span> <strong>Dritten Tag in Folge keine TED-Ausschreibung im Filter.</strong> Die Suche über die TED-API scheitert weiter am POST-only-Endpunkt; keine bestätigte laufende Frist. Heute ist <strong>Werktag 3 von 5</strong> bis zur BSI-Frist am 10.08.</li>\n    </ul></div>",
      "latestTldrHtmlByLang": {
        "de": "<div class=\"tldr\"><p class=\"lead\">Der Mittwochs-Abruf bringt <strong>99 Listings</strong> nach 96 am Dienstag — und zum ersten Mal lässt sich die eigentliche Frage dieses Briefs sauber beantworten: <em>Was ist dieses Profil auf dem Markt wert?</em> Drei unabhängige Erhebungen sagen heute dasselbe. Der DACH-Schnitt aller Freelancer liegt bei <strong>103 €/h</strong>, der IT-Median bei <strong>95 €/h</strong>, Software- und Web-Entwicklung speziell bei <strong>90 €/h</strong>, Java-spezifisch <strong>87 €/h</strong>. Und das Board bestätigt es aus sich selbst heraus: Von 71 recherchierten Euro-Stundenbändern starten <strong>nur acht bei 95 €/h oder höher</strong>. Die Zielmarke von 100 €/h liegt damit über jedem heute belegbaren Median. Parallel meldet Bitkom 109.000 unbesetzte IT-Stellen — eine Zahl, die vor allem eines zeigt: Mangel-Statistik und Preis sind zwei verschiedene Dinge.</p>\n    <ul>\n      <li><span class=\"chip hot\">Rate</span> <strong>Der Preis dieses Profils, dreifach belegt</strong>: IT-Median <strong>95 €/h</strong>, Software &amp; Web Development <strong>90 €/h</strong>, DACH-Schnitt aller Branchen <strong>103 €/h</strong> (Freelancer-Kompass 2026)<sup>[2][3]</sup>. Java-spezifisch <strong>87 €/h</strong> im freelancermap-Verzeichnis (gestern zitiert); die gestern als zweiter Java-Anker geführte GULP-Zahl von 82 €/h ist heute <strong>nicht reproduzierbar</strong> und fällt weg<sup>[4]</sup>.</li>\n      <li><span class=\"chip hot\">Rate</span> <strong>Das Board sagt dasselbe über sich selbst.</strong> Von <strong>71</strong> recherchierten Euro-Stundenbändern beginnen nur <strong>8</strong> bei ≥ 95 €/h und nur <strong>6</strong> bei ≥ 100 €/h. Häufigstes Band: <strong>85–110 €/h</strong> (34 Einträge), zweithäufigstes 90–115 €/h (22).</li>\n      <li><span class=\"chip\">Markt</span> <strong>109.000 offene IT-Stellen</strong>, 85 % der Firmen melden Mangel, nur 4 % ein Überangebot — Bitkom, 855 befragte Unternehmen.<sup>[1]</sup> <strong>Aber:</strong> die Meldung datiert auf den <strong>07.08.2025</strong> und beschreibt einen <em>Rückgang</em> von 149.000 zwei Jahre zuvor. Kein Widerspruch zum fallenden Preis, sondern die andere Hälfte derselben Geschichte.</li>\n      <li><span class=\"chip hot\">Board</span> <strong>99 Listings</strong>: 84 Freelance, 10 Employee, 5 Intriguing. 94 übernommen, 5 neu, 2 gefallen, <strong>null Score-Drift</strong>. Trefferband ≥ 70 bleibt exakt <strong>24</strong>, ≥ 75 exakt <strong>14</strong>, Median <strong>62</strong>, Spitze <strong>83</strong> — vier Kennzahlen, vier Nullen.</li>\n      <li><span class=\"chip\">Board</span> <strong>77 der 99 Einträge sind unverifizierte Übernahmen</strong> („carried forward … not individually re-verified today\"). Der ungeprüfte Anteil steigt von 64 % gestern auf <strong>78 %</strong> heute. Live gezogen wurden 13 Seiten.</li>\n      <li><span class=\"chip hot\">CH</span> <strong>UBS gibt rund 3.000 Schweizer Stellen frei</strong> — Schwerpunkt zweites Halbjahr 2026 bis Anfang 2027, und diesmal trifft es zuerst die IT. Die externen IT-Köpfe sind schon von <strong>33.013</strong> (Ende 2022) auf rund <strong>16.000</strong> gefallen.<sup>[5]</sup></li>\n      <li><span class=\"chip\">CH</span> <strong>Die zweite CH-Lohnquelle bestätigt die erste</strong>: Senior Software Engineer Zürich <strong>CHF 95.000–140.000</strong>, Median CHF 115.000 (SwissDevJobs, &gt; 750 Stellen).<sup>[6]</sup> Zusammen mit den gestern zitierten CHF 115.000–145.000 liegt das ganze Senior-Band unter der eigenen Filterschwelle von CHF 150.000.</li>\n      <li><span class=\"chip\">Employee</span> <strong>Zehn Einträge, drei mit bestätigtem Gehalt</strong> — alle drei bei Grafana Labs, <strong>97.034–137.000 €</strong>. Der Rest sind recherchierte Bänder. Die Spitze bleibt ELCA Zürich (Fit 81).</li>\n      <li><span class=\"chip\">Markt</span> <strong>Aleph Alpha hat 50 Stellen gestrichen</strong>, laut Bericht rund 17 % der Belegschaft, Schwerpunkt Engineering und Forschung; Gründer Jonas Andrulis hatte den CEO-Posten schon im Oktober 2025 abgegeben.<sup>[7]</sup> Ereignis vom <strong>14.01.2026</strong> — kein frisches Ereignis, aber einer der DACH-KI-Arbeitgeber aus der eigenen Employee-Quellenliste.</li>\n      <li><span class=\"chip\">Vergabe</span> <strong>Dritten Tag in Folge keine TED-Ausschreibung im Filter.</strong> Die Suche über die TED-API scheitert weiter am POST-only-Endpunkt; keine bestätigte laufende Frist. Heute ist <strong>Werktag 3 von 5</strong> bis zur BSI-Frist am 10.08.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Wednesday's pull brings <strong>99 listings</strong>, up from 96 on Tuesday — and for the first time, this brief's actual question can be answered cleanly: <em>what is this profile actually worth on the market?</em> Three independent surveys say the same thing today. The DACH average across all freelancers sits at <strong>€103/h</strong>, the IT median at <strong>€95/h</strong>, software and web development specifically at <strong>€90/h</strong>, Java-specific at <strong>€87/h</strong>. And the board confirms it from its own data: of 71 researched euro hourly bands, <strong>only eight start at €95/h or higher</strong>. The €100/h target mark thus sits above every median that can be documented today. In parallel, Bitkom reports 109,000 unfilled IT positions — a number that mainly shows one thing: shortage statistics and price are two different things.</p>\n    <ul>\n      <li><span class=\"chip hot\">Rate</span> <strong>This profile's price, confirmed three ways</strong>: IT median <strong>€95/h</strong>, software &amp; web development <strong>€90/h</strong>, DACH average across all industries <strong>€103/h</strong> (Freelancer-Kompass 2026)<sup>[2][3]</sup>. Java-specific <strong>€87/h</strong> in freelancermap's directory (cited yesterday); the GULP figure of €82/h carried yesterday as the second Java anchor is <strong>not reproducible</strong> today and drops out<sup>[4]</sup>.</li>\n      <li><span class=\"chip hot\">Rate</span> <strong>The board says the same thing about itself.</strong> Of <strong>71</strong> researched euro hourly bands, only <strong>8</strong> start at ≥ €95/h and only <strong>6</strong> at ≥ €100/h. Most common band: <strong>€85–110/h</strong> (34 entries), second most common €90–115/h (22).</li>\n      <li><span class=\"chip\">Market</span> <strong>109,000 open IT positions</strong>, 85% of firms report a shortage, only 4% an oversupply — Bitkom, 855 companies surveyed.<sup>[1]</sup> <strong>But:</strong> the report is dated <strong>08/07/2025</strong> and describes a <em>decline</em> from 149,000 two years earlier. No contradiction with the falling price — just the other half of the same story.</li>\n      <li><span class=\"chip hot\">Board</span> <strong>99 listings</strong>: 84 freelance, 10 employee, 5 intriguing. 94 carried over, 5 new, 2 dropped, <strong>zero score drift</strong>. The hit band ≥ 70 stays exactly at <strong>24</strong>, ≥ 75 at exactly <strong>14</strong>, median <strong>62</strong>, top <strong>83</strong> — four metrics, four zeros.</li>\n      <li><span class=\"chip\">Board</span> <strong>77 of the 99 entries are unverified carry-overs</strong> (\"carried forward … not individually re-verified today\"). The unverified share climbs from 64% yesterday to <strong>78%</strong> today. 13 pages were pulled live.</li>\n      <li><span class=\"chip hot\">CH</span> <strong>UBS is freeing up roughly 3,000 Swiss jobs</strong> — with the focus on the second half of 2026 through early 2027, and this time IT gets hit first. The bank's external IT headcount has already fallen from <strong>33,013</strong> (end of 2022) to roughly <strong>16,000</strong>.<sup>[5]</sup></li>\n      <li><span class=\"chip\">CH</span> <strong>A second CH salary source confirms the first</strong>: Senior Software Engineer Zürich <strong>CHF 95,000–140,000</strong>, median CHF 115,000 (SwissDevJobs, &gt; 750 listings).<sup>[6]</sup> Together with yesterday's CHF 115,000–145,000, the entire senior band sits below this brief's own CHF 150,000 filter threshold.</li>\n      <li><span class=\"chip\">Employee</span> <strong>Ten listings, three with a confirmed salary</strong> — all three at Grafana Labs, <strong>€97,034–137,000</strong>. The rest are researched bands. The top spot stays ELCA Zürich (Fit 81).</li>\n      <li><span class=\"chip\">Market</span> <strong>Aleph Alpha has cut 50 positions</strong>, roughly 17% of the workforce according to reporting, focused on engineering and research; founder Jonas Andrulis had already stepped down as CEO back in October 2025.<sup>[7]</sup> Event from <strong>01/14/2026</strong> — not a fresh event, but one of the DACH AI employers from this track's own source list.</li>\n      <li><span class=\"chip\">Tenders</span> <strong>No TED tender in the filter for the third day running.</strong> The search via the TED API still fails on the POST-only endpoint; no confirmable running deadline. Today is <strong>business day 3 of 5</strong> until the BSI deadline on 08/10.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">A coleta de quarta-feira traz <strong>99 vagas</strong>, ante 96 na terça — e pela primeira vez dá para responder com clareza a pergunta central deste brief: <em>quanto vale este perfil no mercado?</em> Três levantamentos independentes dizem hoje a mesma coisa. A média DACH de todos os freelancers está em <strong>€ 103/h</strong>, a mediana de TI em <strong>€ 95/h</strong>, desenvolvimento de software e web especificamente em <strong>€ 90/h</strong>, e Java especificamente em <strong>€ 87/h</strong>. E o board confirma isso por si só: das 71 faixas de valor por hora pesquisadas, <strong>apenas oito começam em € 95/h ou mais</strong>. A marca-alvo de € 100/h fica, portanto, acima de qualquer mediana comprovável hoje. Paralelamente, a Bitkom relata 109.000 vagas de TI em aberto — um número que mostra, acima de tudo, uma coisa: estatística de escassez e preço são coisas diferentes.</p>\n    <ul>\n      <li><span class=\"chip hot\">Rate</span> <strong>O preço deste perfil, confirmado de três formas</strong>: mediana de TI <strong>€ 95/h</strong>, Software &amp; Web Development <strong>€ 90/h</strong>, média DACH de todos os setores <strong>€ 103/h</strong> (Freelancer-Kompass 2026)<sup>[2][3]</sup>. Especificamente para Java, <strong>€ 87/h</strong> no diretório da freelancermap (citado ontem); o número da GULP de € 82/h, levado ontem como segunda âncora para Java, <strong>não é reproduzível</strong> hoje e cai fora<sup>[4]</sup>.</li>\n      <li><span class=\"chip hot\">Rate</span> <strong>O board diz o mesmo sobre si mesmo.</strong> Das <strong>71</strong> faixas de valor por hora pesquisadas, apenas <strong>8</strong> começam em ≥ € 95/h e apenas <strong>6</strong> em ≥ € 100/h. Faixa mais comum: <strong>€ 85–110/h</strong> (34 vagas), segunda mais comum € 90–115/h (22).</li>\n      <li><span class=\"chip\">Mercado</span> <strong>109.000 vagas de TI em aberto</strong>, 85% das empresas relatam escassez, apenas 4% um excedente — Bitkom, 855 empresas entrevistadas.<sup>[1]</sup> <strong>Mas:</strong> o relatório é datado de <strong>07/08/2025</strong> e descreve uma <em>queda</em> em relação a 149.000 dois anos antes. Não é contradição com o preço em queda — é a outra metade da mesma história.</li>\n      <li><span class=\"chip hot\">Board</span> <strong>99 vagas</strong>: 84 freelance, 10 CLT/efetivo, 5 curiosidades. 94 mantidas, 5 novas, 2 saíram, <strong>zero variação de score</strong>. A faixa de acertos ≥ 70 continua exatamente em <strong>24</strong>, ≥ 75 em exatamente <strong>14</strong>, mediana <strong>62</strong>, topo <strong>83</strong> — quatro indicadores, quatro zeros.</li>\n      <li><span class=\"chip\">Board</span> <strong>77 das 99 vagas são mantidas sem reverificação</strong> (\"carried forward … not individually re-verified today\"). A fatia não verificada sobe de 64% ontem para <strong>78%</strong> hoje. 13 páginas foram puxadas ao vivo.</li>\n      <li><span class=\"chip hot\">CH</span> <strong>O UBS está liberando cerca de 3.000 vagas suíças</strong> — com foco no segundo semestre de 2026 até o início de 2027, e desta vez quem é atingido primeiro é a TI. O quadro externo de TI do banco já caiu de <strong>33.013</strong> (fim de 2022) para cerca de <strong>16.000</strong>.<sup>[5]</sup></li>\n      <li><span class=\"chip\">CH</span> <strong>Uma segunda fonte salarial CH confirma a primeira</strong>: Senior Software Engineer em Zürich <strong>CHF 95.000–140.000</strong>, mediana CHF 115.000 (SwissDevJobs, &gt; 750 vagas).<sup>[6]</sup> Somada à faixa de ontem, de CHF 115.000–145.000, toda a faixa sênior fica abaixo do limiar de filtro deste brief, de CHF 150.000.</li>\n      <li><span class=\"chip\">Employee</span> <strong>Dez vagas, três com salário confirmado</strong> — todas as três na Grafana Labs, <strong>€ 97.034–137.000</strong>. O resto são faixas pesquisadas. O topo continua sendo ELCA Zürich (Fit 81).</li>\n      <li><span class=\"chip\">Mercado</span> <strong>A Aleph Alpha cortou 50 vagas</strong>, cerca de 17% da equipe segundo a reportagem, com foco em engenharia e pesquisa; o fundador Jonas Andrulis já havia deixado o cargo de CEO em outubro de 2025.<sup>[7]</sup> Fato de <strong>14/01/2026</strong> — não é evento recente, mas uma das empregadoras de IA da DACH na própria lista de fontes desta seção.</li>\n      <li><span class=\"chip\">Licitações</span> <strong>Terceiro dia seguido sem licitação no filtro TED.</strong> A busca via API do TED continua falhando no endpoint somente-POST; sem prazo de entrega confirmável. Hoje é o <strong>dia útil 3 de 5</strong> até o prazo do BSI em 10/08.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">La recopilación del miércoles trae <strong>99 vacantes</strong>, frente a 96 del martes — y por primera vez se puede responder con claridad la pregunta central de este brief: <em>¿cuánto vale este perfil en el mercado?</em> Tres estudios independientes dicen hoy lo mismo. El promedio DACH de todos los freelancers está en <strong>103 €/h</strong>, la mediana de TI en <strong>95 €/h</strong>, desarrollo de software y web específicamente en <strong>90 €/h</strong>, y Java específicamente en <strong>87 €/h</strong>. Y el tablero lo confirma por sí solo: de las 71 bandas de tarifa por hora investigadas, <strong>solo ocho comienzan en 95 €/h o más</strong>. La marca objetivo de 100 €/h queda así por encima de cualquier mediana comprobable hoy. En paralelo, Bitkom reporta 109.000 puestos de TI sin cubrir — una cifra que sobre todo demuestra algo: la estadística de escasez y el precio son dos cosas distintas.</p>\n    <ul>\n      <li><span class=\"chip hot\">Tarifa</span> <strong>El precio de este perfil, confirmado de tres formas</strong>: mediana de TI <strong>95 €/h</strong>, Software &amp; Web Development <strong>90 €/h</strong>, promedio DACH de todos los sectores <strong>103 €/h</strong> (Freelancer-Kompass 2026)<sup>[2][3]</sup>. Específicamente para Java, <strong>87 €/h</strong> en el directorio de freelancermap (citado ayer); la cifra de GULP de 82 €/h, que ayer figuraba como segunda referencia para Java, <strong>no es reproducible</strong> hoy y queda descartada<sup>[4]</sup>.</li>\n      <li><span class=\"chip hot\">Tarifa</span> <strong>El tablero dice lo mismo sobre sí mismo.</strong> De las <strong>71</strong> bandas de tarifa por hora investigadas, solo <strong>8</strong> comienzan en ≥ 95 €/h y solo <strong>6</strong> en ≥ 100 €/h. Banda más frecuente: <strong>85–110 €/h</strong> (34 vacantes), segunda más frecuente 90–115 €/h (22).</li>\n      <li><span class=\"chip\">Mercado</span> <strong>109.000 puestos de TI sin cubrir</strong>, 85% de las empresas reportan escasez, solo 4% un exceso de oferta — Bitkom, 855 empresas encuestadas.<sup>[1]</sup> <strong>Pero:</strong> el reporte está fechado el <strong>07/08/2025</strong> y describe una <em>caída</em> respecto a 149.000 dos años antes. No contradice el precio a la baja — es la otra mitad de la misma historia.</li>\n      <li><span class=\"chip hot\">Tablero</span> <strong>99 vacantes</strong>: 84 freelance, 10 en plantilla, 5 curiosidades. 94 se mantienen, 5 nuevas, 2 bajas, <strong>cero variación de puntaje</strong>. La franja de aciertos ≥ 70 sigue exactamente en <strong>24</strong>, ≥ 75 en exactamente <strong>14</strong>, mediana <strong>62</strong>, tope <strong>83</strong> — cuatro indicadores, cuatro ceros.</li>\n      <li><span class=\"chip\">Tablero</span> <strong>77 de las 99 vacantes se mantienen sin reverificar</strong> (\"carried forward … not individually re-verified today\"). La fracción sin verificar sube de 64% ayer a <strong>78%</strong> hoy. Se extrajeron 13 páginas en vivo.</li>\n      <li><span class=\"chip hot\">CH</span> <strong>UBS libera cerca de 3.000 puestos suizos</strong> — con foco en el segundo semestre de 2026 hasta principios de 2027, y esta vez a quien golpea primero es a TI. La plantilla externa de TI del banco ya cayó de <strong>33.013</strong> (a fines de 2022) a cerca de <strong>16.000</strong>.<sup>[5]</sup></li>\n      <li><span class=\"chip\">CH</span> <strong>Una segunda fuente salarial CH confirma la primera</strong>: Senior Software Engineer en Zúrich <strong>CHF 95.000–140.000</strong>, mediana CHF 115.000 (SwissDevJobs, &gt; 750 vacantes).<sup>[6]</sup> Junto con los CHF 115.000–145.000 citados ayer, toda la banda sénior queda por debajo del umbral de filtro de este brief, de CHF 150.000.</li>\n      <li><span class=\"chip\">Employee</span> <strong>Diez vacantes, tres con salario confirmado</strong> — las tres en Grafana Labs, <strong>97.034–137.000 €</strong>. El resto son bandas investigadas. La cabeza sigue siendo ELCA Zúrich (Fit 81).</li>\n      <li><span class=\"chip\">Mercado</span> <strong>Aleph Alpha recortó 50 puestos</strong>, cerca del 17% de la plantilla según la cobertura periodística, con foco en ingeniería e investigación; el fundador Jonas Andrulis ya había dejado el puesto de CEO en octubre de 2025.<sup>[7]</sup> Hecho del <strong>14/01/2026</strong> — no es un evento reciente, sino uno de los empleadores de IA de la DACH en la propia lista de fuentes de esta sección.</li>\n      <li><span class=\"chip\">Licitaciones</span> <strong>Tercer día consecutivo sin ninguna licitación nueva en el filtro TED.</strong> La búsqueda vía la API de TED sigue fallando en el endpoint solo-POST; sin fecha límite de entrega confirmable. Hoy es el <strong>día hábil 3 de 5</strong> hasta el plazo del BSI el 10/08.</li>\n    </ul></div>"

        "en": "<div class=\"tldr\"><p class=\"lead\">Wednesday, August 5. Yesterday this brief said today would be \"the last safe day for outdoor plans\" — <strong>0.0 mm, 0%</strong>. This morning, the same Climatempo page says: <strong>1.1 mm at 40%</strong>, showers in the afternoon and evening. And Saturday, which got away with 3.1 mm yesterday, now stands at <strong>11.2 mm</strong>. That's the third version of the weekend in three days. The lesson isn't \"the weather is turning bad\" — it's that <strong>this week's rain numbers aren't stable enough to plan around, while the temperatures are.</strong> Anyone with plans this week should plan around warmth and keep a roof within reach — not around the percentage. And for Saturday, there's now exactly that kind of plan: a complete, free, covered day at SESC Londrina — including the first session explicitly listed for infants.</p>\n    <ul>\n      <li><span class=\"chip hot\">WEATHER</span> <strong>Today isn't dry after all:</strong> Climatempo now reports <strong>15–27°C, 1.1 mm, 40%</strong> for Ribeirão Claro — \"<em>Pancadas de chuva à tarde e à noite</em>.\" Yesterday, the same spot showed 0%.</li>\n      <li><span class=\"chip\">WEATHER</span> <strong>Two portals, one dispute:</strong> theweather.com puts today at <strong>70%</strong> with a thunderstorm, Climatempo at 40%. On temperature they agree (15–27°C vs. 16–26°C) — and on amount, too: both under 2 mm.</li>\n      <li><span class=\"chip hot\">WEATHER</span> <strong>Saturday has quadrupled:</strong> from 3.1 mm to <span class=\"stat\">11.2 mm</span> (47%) — the wettest day of the week. Friday stays the cool one: just <strong>22°C</strong> at the high, with 7.0 mm.</li>\n      <li><span class=\"chip good\">WEATHER</span> <strong>Dia dos Pais stays the warm day:</strong> Sun 08/09 now <strong>20–32°C</strong> — 31°C yesterday. But \"<em>Não chove</em>\" is gone: now 0.2 mm at 38%, showers in the afternoon.</li>\n      <li><span class=\"chip good\">EVENT</span> <strong>For the first time, a slot for the baby:</strong> SESC Londrina Cadeião, Sat 08/08, <strong>9 and 9:30 AM</strong> — \"Musicalização para bebês,\" Sala de Música 3, <strong>free</strong>. Plus 10:30 AM Tambor oceânico and 3:30 PM percussion for the older kids.</li>\n      <li><span class=\"chip good\">EVENT</span> <strong>Saturday is entirely free:</strong> SESC workshops in the morning, \"Churrasco do Paizão\" at Norte Shopping from <strong>11 AM</strong>, Aquário de Londrina <strong>9 AM–5 PM</strong> — all three free of charge, all three with a roof or a roof within walking distance.</li>\n      <li><span class=\"chip good\">BABY</span> <strong>Respiratory: the good news is in the detail:</strong> The InfoGripe bulletin for <strong>SE 29/2026</strong> lists Paraná by name among the 12 states with elevated but <em>not</em> rising SARI incidence. Only MA, RS, and SC show a growth signal.</li>\n      <li><span class=\"chip\">HEALTH</span> <strong>RSV stays the driver:</strong> Over the last four weeks, <strong>57.7%</strong> of all positive samples were RSV — falling nationwide, but for a one-month-old, that's still the number that matters.</li>\n      <li><span class=\"chip\">HEALTH</span> <strong>Dengue bulletin nº 24 is out — and unreadable:</strong> published yesterday, but as a scanned-image PDF. We're sticking with the last machine-readable status: <strong>nº 23, SE 01–28/2026</strong>, 5,701 cases, 4 deaths.</li>\n      <li><span class=\"chip\">SCHOOL</span> <strong>Normal week:</strong> the 2nd trimester runs through 09/04. Fri <strong>08/07</strong> is Dia do Funcionário de Escola, Tue <strong>08/11</strong> is Dia do Estudante — commemorative dates, no loss of class time. Dia dos Pais on Sunday isn't a holiday.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Quarta-feira, 5 de agosto. Ontem esta edição dizia que hoje seria \"o último dia seguro para ficar ao ar livre\" — <strong>0,0 mm, 0%</strong>. A mesma página da Climatempo diz hoje de manhã: <strong>1,1 mm a 40%</strong>, pancadas à tarde e à noite. E o sábado, que ontem estava em 3,1 mm, agora está em <strong>11,2 mm</strong>. É a terceira versão do fim de semana em três dias. A lição não é \"o tempo vai piorar\", e sim: <strong>os números de chuva desta semana não são confiáveis para planejar, as temperaturas são.</strong> Quem tem planos esta semana deve planejar pelo calor e por um teto por perto — não pela porcentagem. E para o sábado já existe exatamente esse plano: um dia completo, gratuito e sob teto no SESC Londrina — incluindo o primeiro horário explicitamente destinado a bebês.</p>\n    <ul>\n      <li><span class=\"chip hot\">CLIMA</span> <strong>Hoje, afinal, não fica seco:</strong> a Climatempo agora informa para Ribeirão Claro <strong>15–27 °C, 1,1 mm, 40%</strong> — \"<em>Pancadas de chuva à tarde e à noite</em>\". Ontem, no mesmo lugar, constava 0%.</li>\n      <li><span class=\"chip\">CLIMA</span> <strong>Dois portais, uma discordância:</strong> o theweather.com vê hoje com <strong>70%</strong> e uma tempestade, a Climatempo, 40%. Na temperatura, concordam (15–27 °C vs. 16–26 °C) — e no volume também: os dois abaixo de 2 mm.</li>\n      <li><span class=\"chip hot\">CLIMA</span> <strong>O sábado quadruplicou:</strong> de 3,1 mm para <span class=\"stat\">11,2 mm</span> (47%) — o dia mais chuvoso da semana. A sexta-feira segue sendo a fria: apenas <strong>22 °C</strong> de máxima, com 7,0 mm.</li>\n      <li><span class=\"chip good\">CLIMA</span> <strong>O Dia dos Pais continua sendo o dia quente:</strong> dom 09/08 agora com <strong>20–32 °C</strong> — ontem, 31 °C. Mas o \"<em>Não chove</em>\" sumiu: agora 0,2 mm a 38%, pancadas à tarde.</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Pela primeira vez, um horário para o bebê:</strong> SESC Londrina Cadeião, sáb 08/08, <strong>9h e 9h30</strong> — \"Musicalização para bebês\", Sala de Música 3, <strong>grátis</strong>. Além disso, 10h30 Tambor oceânico e 15h30 percussão para os maiores.</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Sábado inteiramente gratuito:</strong> oficinas do SESC pela manhã, \"Churrasco do Paizão\" no Norte Shopping a partir das <strong>11h</strong>, Aquário de Londrina <strong>9h às 17h</strong> — os três sem custo, os três com teto ou teto a poucos passos.</li>\n      <li><span class=\"chip good\">BEBÊ</span> <strong>Vias respiratórias: o alívio está no detalhe:</strong> o boletim InfoGripe da <strong>SE 29/2026</strong> cita o Paraná explicitamente entre os 12 estados com incidência de SRAG elevada, mas <em>sem</em> crescimento. Sinal de crescimento só em MA, RS e SC.</li>\n      <li><span class=\"chip\">SAÚDE</span> <strong>O VSR continua sendo o motor:</strong> nas últimas quatro semanas, <strong>57,7%</strong> de todas as amostras positivas eram VSR — em queda no país todo, mas para uma criança de um mês, esse continua sendo o número que importa.</li>\n      <li><span class=\"chip\">SAÚDE</span> <strong>Boletim de dengue nº 24 chegou — e está ilegível:</strong> publicado ontem, mas como PDF de imagem escaneada. Ficamos com o último status legível por máquina: <strong>nº 23, SE 01–28/2026</strong>, 5.701 casos, 4 óbitos.</li>\n      <li><span class=\"chip\">ESCOLA</span> <strong>Semana normal:</strong> o 2º trimestre segue até 04/09. Sex <strong>07/08</strong>, Dia do Funcionário de Escola; ter <strong>11/08</strong>, Dia do Estudante — datas comemorativas, sem perda de aula. O Dia dos Pais, no domingo, não é feriado.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Miércoles 5 de agosto. Ayer esta edición decía que hoy sería \"el último día seguro para estar al aire libre\" — <strong>0,0 mm, 0 %</strong>. La misma página de Climatempo dice hoy por la mañana: <strong>1,1 mm al 40 %</strong>, chubascos por la tarde y por la noche. Y el sábado, que ayer estaba en 3,1 mm, ahora está en <strong>11,2 mm</strong>. Es la tercera versión del fin de semana en tres días. La lección no es \"el clima va a empeorar\", sino: <strong>los números de lluvia de esta semana no son confiables para planear, las temperaturas sí.</strong> Quien tenga planes esta semana debe planear según el calor y según un techo a la mano — no según el porcentaje. Y para el sábado ya existe exactamente ese plan: un día completo, gratis y bajo techo en el SESC Londrina — incluido el primer horario pensado explícitamente para bebés.</p>\n    <ul>\n      <li><span class=\"chip hot\">CLIMA</span> <strong>Hoy, al final, no queda seco:</strong> Climatempo indica ahora para Ribeirão Claro <strong>15–27 °C, 1,1 mm, 40 %</strong> — \"<em>Pancadas de chuva à tarde e à noite</em>\". Ayer, en el mismo lugar, aparecía 0 %.</li>\n      <li><span class=\"chip\">CLIMA</span> <strong>Dos portales, una discrepancia:</strong> theweather.com ve hoy con <strong>70 %</strong> y una tormenta, Climatempo con 40 %. En la temperatura coinciden (15–27 °C vs. 16–26 °C) — y en la cantidad también: los dos por debajo de 2 mm.</li>\n      <li><span class=\"chip hot\">CLIMA</span> <strong>El sábado se cuadruplicó:</strong> de 3,1 mm a <span class=\"stat\">11,2 mm</span> (47 %) — el día más lluvioso de la semana. El viernes sigue siendo el frío: apenas <strong>22 °C</strong> de máxima, con 7,0 mm.</li>\n      <li><span class=\"chip good\">CLIMA</span> <strong>El Dia dos Pais sigue siendo el día caluroso:</strong> dom 09/08 ahora con <strong>20–32 °C</strong> — ayer, 31 °C. Pero el \"<em>Não chove</em>\" desapareció: ahora 0,2 mm al 38 %, chubascos por la tarde.</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>Por primera vez, un horario para la bebé:</strong> SESC Londrina Cadeião, sáb 08/08, <strong>9:00 y 9:30</strong> — \"Musicalização para bebês\", Sala de Música 3, <strong>gratis</strong>. Además, 10:30 Tambor oceânico y 15:30 percusión para los más grandes.</li>\n      <li><span class=\"chip good\">EVENTO</span> <strong>El sábado es totalmente gratis:</strong> talleres del SESC por la mañana, \"Churrasco do Paizão\" en el Norte Shopping desde las <strong>11:00</strong>, Aquário de Londrina <strong>9:00 a 17:00</strong> — los tres sin costo, los tres con techo o techo a pocos pasos.</li>\n      <li><span class=\"chip good\">BEBÉ</span> <strong>Vías respiratorias: el alivio está en el detalle:</strong> el boletín InfoGripe de la <strong>SE 29/2026</strong> menciona a Paraná explícitamente entre los 12 estados con incidencia de SRAG elevada, pero <em>sin</em> crecimiento. Señal de crecimiento solo en MA, RS y SC.</li>\n      <li><span class=\"chip\">SALUD</span> <strong>El VSR sigue siendo el motor:</strong> en las últimas cuatro semanas, el <strong>57,7 %</strong> de todas las muestras positivas fueron VSR — en descenso en todo el país, pero para una bebé de un mes, esa sigue siendo la cifra que importa.</li>\n      <li><span class=\"chip\">SALUD</span> <strong>El boletín de dengue nº 24 llegó — y es ilegible:</strong> publicado ayer, pero como PDF de imagen escaneada. Nos quedamos con el último estatus legible por máquina: <strong>nº 23, SE 01–28/2026</strong>, 5.701 casos, 4 muertes.</li>\n      <li><span class=\"chip\">ESCUELA</span> <strong>Semana normal:</strong> el 2º trimestre sigue hasta el 04/09. Vie <strong>07/08</strong>, Dia do Funcionário de Escola; mar <strong>11/08</strong>, Dia do Estudante — fechas conmemorativas, sin día libre. El Dia dos Pais, en domingo, no es feriado.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Mittwoch, der 5. August — Rotationsthema <em>Familie &amp; Alltag</em>, zwölfte Folge, und diesmal geht es um das Vokabular, das in einem Haushalt jeden einzelnen Tag gebraucht wird und trotzdem in keinem Sprachkurs vorkommt: <strong>Hausarbeit und ihre Verteilung</strong>. Der Anlass ist keine Tagesmeldung, sondern eine Zahl, die in Brasilien die Diskussion am Küchentisch mitbestimmt: Laut der <strong>PNAD Contínua 2022</strong> des IBGE wendeten Frauen im Schnitt <strong>21,3 Stunden pro Woche</strong> für Haushalt und Betreuung auf, Männer <strong>11,7</strong> — eine Differenz von <strong>9,6 Stunden</strong>.<sup>[1]</sup> Wer hier lebt, hört die dazugehörigen Wörter ständig: <em>fazer faxina</em>, <em>lavar a louça</em>, <em>quem passa o aspirador hoje?</em> Heute also zehn Einträge — <strong>4 Verben mit voller Konjugation</strong>, drei Substantive und ein Adjektiv-Paar, dazu 2 Auffrischungen vom 29. und 15. Juli.</p>\n    <ul>\n      <li><span class=\"chip\">KONJUGATION</span> <strong>staubsaugen ist untrennbar</strong> — <em>ich staubsauge</em>, Partizip <em>gestaubsaugt</em>. Obwohl es genau aussieht wie <em>abwaschen</em> (<em>ich wasche ab</em>, <em>abgewaschen</em>). Der Grund: <em>Staub</em> ist keine Vorsilbe, sondern ein festgeschweißtes Substantiv. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/staubsaugen.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip\">PHRASE</span> <strong>Deutsch steckt die Hausarbeit ins Verb, Portugiesisch daneben</strong> — <em>staubsaugen</em> = <em>passar o aspirador de pó</em> = <em>pasar la aspiradora</em>; <em>abwaschen</em> = <em>lavar a louça</em> = <em>lavar los trastes</em>. Ein Wort gegen drei. Wer die Ein-Wort-Übersetzung sucht, sucht vergeblich — man lernt das Paar.</li>\n      <li><span class=\"chip hot\">FALSE FRIEND</span> <strong>das Gift ≠ gift</strong> — englisch <em>gift</em> heißt <em>Geschenk</em>, deut         "en": "<div class=\"tldr\"><p class=\"lead\">Wednesday, August 5 — rotation theme <em>Family &amp; Everyday Life</em>, twelfth installment, and this time it's the vocabulary that gets used every single day in a household and still never shows up in a language course: <strong>housework and how it gets divided</strong>. The hook isn't a news flash but a number that shapes the conversation at Brazilian kitchen tables: according to the IBGE's <strong>PNAD Contínua 2022</strong>, women spent an average of <strong>21.3 hours per week</strong> on housework and caregiving, men <strong>11.7</strong> — a gap of <strong>9.6 hours</strong>.<sup>[1]</sup> Anyone living here hears the words that go with it constantly: <em>fazer faxina</em>, <em>lavar a louça</em>, <em>quem passa o aspirador hoje?</em> So today, ten entries — <strong>4 verbs with full conjugation</strong>, three nouns, and one adjective pair, plus 2 refreshers from July 29 and July 15.</p>\n    <ul>\n      <li><span class=\"chip\">CONJUGATION</span> <strong>staubsaugen is inseparable</strong> — <em>ich staubsauge</em>, participle <em>gestaubsaugt</em>. Even though it looks exactly like <em>abwaschen</em> (<em>ich wasche ab</em>, <em>abgewaschen</em>). The reason: <em>Staub</em> isn't a prefix, it's a noun welded onto the verb. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/staubsaugen.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip\">PHRASE</span> <strong>German packs the housework into the verb, Portuguese puts it next to it</strong> — <em>staubsaugen</em> = <em>passar o aspirador de pó</em> = <em>pasar la aspiradora</em>; <em>abwaschen</em> = <em>lavar a louça</em> = <em>lavar los trastes</em>. One word against three. Anyone looking for a one-word translation is looking in vain — you learn the pair.</li>\n      <li><span class=\"chip hot\">FALSE FRIEND</span> <strong>das Gift ≠ gift</strong> — the English word <em>gift</em> means <em>Geschenk</em> (present), the German word <em>Gift</em> means <em>poison</em>. Practically relevant right here: cleaning products are <em>Gift</em>, Portuguese <em>veneno</em>, and belong out of reach. <span class=\"src\"><a href=\"https://www.thelocal.de/20240206/german-word-of-the-day-gift\">thelocal.de</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>a geladeira, not o frigorífico</strong> — Brazil names the fridge after the feeling you get opening it (<em>gelado</em>, ice-cold), Portugal after the machine's job. The same fault line as <em>celular</em>/<em>telemóvel</em>. <span class=\"src\"><a href=\"https://palavrascomhistoria.com.br/variantes-regionais/geladeira-ou-frigorifico/\">palavrascomhistoria.com.br</a></span></li>\n      <li><span class=\"chip\">GENDER</span> <strong>el bote de basura (MX), not el cubo de basura (Spain)</strong> — and in Portuguese the gender switches too: <em>der</em> Mülleimer, but <em>a</em> lixeira. Three languages, three images for the same container. <span class=\"src\"><a href=\"https://www.linguno.com/wordComparison/esp/cubo-de-basura-bote-de-basura-basurero-tacho-de-basura/\">linguno.com</a></span></li>\n      <li><span class=\"chip\">CONJUGATION</span> <strong>abwaschen is strong</strong> — <em>wäscht ab – wusch ab – hat abgewaschen</em>, ablaut a–u–a plus umlaut in the 2nd and 3rd person singular. The subjunctive II sounds even more old-fashioned: <em>ich wüsche ab</em>. The only irregular verb of the day. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/abwaschen.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip good\">IDIOM</span> <strong>„Ordnung ist das halbe Leben\"</strong> — no fixed equivalent proverb could be confirmed in Portuguese or Spanish. The everyday equivalent is <em>cada coisa no seu lugar</em> / <em>cada cosa en su lugar</em> — an approximation, not a dictionary match. <span class=\"src\"><a href=\"https://www.fremdwort.de/suchen/bedeutung/ordnung-ist-das-halbe-leben/\">fremdwort.de</a></span></li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Quarta-feira, dia 5 de agosto — tema da rotação <em>Família &amp; Cotidiano</em>, décima segunda edição, e desta vez o assunto é o vocabulário que se usa todos os dias numa casa e mesmo assim nunca aparece em curso de idiomas: <strong>trabalho doméstico e sua divisão</strong>. O gancho não é uma notícia do dia, mas um número que ajuda a pautar a conversa na mesa da cozinha no Brasil: segundo a <strong>PNAD Contínua 2022</strong> do IBGE, as mulheres dedicaram em média <strong>21,3 horas por semana</strong> a afazeres domésticos e cuidado de pessoas, os homens <strong>11,7</strong> — uma diferença de <strong>9,6 horas</strong>.<sup>[1]</sup> Quem mora aqui ouve as palavras correspondentes o tempo todo: <em>fazer faxina</em>, <em>lavar a louça</em>, <em>quem passa o aspirador hoje?</em> Hoje, portanto, dez verbetes — <strong>4 verbos com conjugação completa</strong>, três substantivos e um par de adjetivos, mais 2 revisões de 29 e 15 de julho.</p>\n    <ul>\n      <li><span class=\"chip\">CONJUGAÇÃO</span> <strong>staubsaugen é inseparável</strong> — <em>ich staubsauge</em>, particípio <em>gestaubsaugt</em>. Mesmo parecendo exatamente igual a <em>abwaschen</em> (<em>ich wasche ab</em>, <em>abgewaschen</em>). O motivo: <em>Staub</em> não é um prefixo, e sim um substantivo soldado ao verbo. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/staubsaugen.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip\">FRASE</span> <strong>o alemão embute a tarefa doméstica no verbo, o português coloca ao lado</strong> — <em>staubsaugen</em> = <em>passar o aspirador de pó</em> = <em>pasar la aspiradora</em>; <em>abwaschen</em> = <em>lavar a louça</em> = <em>lavar los trastes</em>. Uma palavra contra três. Quem procura a tradução de uma palavra só procura em vão — o que se aprende é o par.</li>\n      <li><span class=\"chip hot\">FALSO COGNATO</span> <strong>das Gift ≠ gift</strong> — em inglês, <em>gift</em> significa <em>Geschenk</em> (presente); em alemão, <em>Gift</em> significa <em>poison</em> (veneno). Relevante bem aqui na prática: produtos de limpeza são <em>Gift</em>, em português <em>veneno</em>, e devem ficar fora de alcance. <span class=\"src\"><a href=\"https://www.thelocal.de/20240206/german-word-of-the-day-gift\">thelocal.de</a></span></li>\n      <li><span class=\"chip good\">BR-PT</span> <strong>a geladeira, e não o frigorífico</strong> — o Brasil nomeia o aparelho pela sensação de abri-lo (<em>gelado</em>), Portugal pela função da máquina. A mesma linha de fratura de <em>celular</em>/<em>telemóvel</em>. <span class=\"src\"><a href=\"https://palavrascomhistoria.com.br/variantes-regionais/geladeira-ou-frigorifico/\">palavrascomhistoria.com.br</a></span></li>\n      <li><span class=\"chip\">GÊNERO</span> <strong>el bote de basura (MX), e não el cubo de basura (Espanha)</strong> — e em português o gênero também muda: <em>der</em> Mülleimer, mas <em>a</em> lixeira. Três línguas, três imagens para o mesmo recipiente. <span class=\"src\"><a href=\"https://www.linguno.com/wordComparison/esp/cubo-de-basura-bote-de-basura-basurero-tacho-de-basura/\">linguno.com</a></span></li>\n      <li><span class=\"chip\">CONJUGAÇÃO</span> <strong>abwaschen é forte</strong> — <em>wäscht ab – wusch ab – hat abgewaschen</em>, Ablaut a–u–a mais trema na 2ª e 3ª pessoa do singular. O Konjunktiv II soa ainda mais arcaico: <em>ich wüsche ab</em>. O único verbo irregular do dia. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/abwaschen.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip good\">IDIOM</span> <strong>„Ordnung ist das halbe Leben\"</strong> — em português e em espanhol não foi possível confirmar um provérbio fixo equivalente. A correspondência do dia a dia é <em>cada coisa no seu lugar</em> / <em>cada cosa en su lugar</em> — uma aproximação, não uma equivalência de dicionário. <span class=\"src\"><a href=\"https://www.fremdwort.de/suchen/bedeutung/ordnung-ist-das-halbe-leben/\">fremdwort.de</a></span></li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Miércoles 5 de agosto — tema de la rotación <em>Familia y vida cotidiana</em>, duodécima entrega, y esta vez se trata del vocabulario que se usa todos los días en cualquier casa y que aun así nunca aparece en un curso de idiomas: <strong>las tareas del hogar y cómo se reparten</strong>. El motivo no es una noticia del día, sino una cifra que marca la conversación en las mesas de las cocinas brasileñas: según la <strong>PNAD Contínua 2022</strong> del IBGE, las mujeres dedicaron en promedio <strong>21,3 horas por semana</strong> a las tareas del hogar y al cuidado de personas, los hombres <strong>11,7</strong> — una diferencia de <strong>9,6 horas</strong>.<sup>[1]</sup> Quien vive aquí escucha las palabras correspondientes todo el tiempo: <em>fazer faxina</em>, <em>lavar a louça</em>, <em>quem passa o aspirador hoje?</em> Hoy, entonces, diez entradas — <strong>4 verbos con conjugación completa</strong>, tres sustantivos y un par de adjetivos, más 2 repasos del 29 y el 15 de julio.</p>\n    <ul>\n      <li><span class=\"chip\">CONJUGACIÓN</span> <strong>staubsaugen es inseparable</strong> — <em>ich staubsauge</em>, participio <em>gestaubsaugt</em>. Aunque se ve exactamente igual que <em>abwaschen</em> (<em>ich wasche ab</em>, <em>abgewaschen</em>). La razón: <em>Staub</em> no es un prefijo, es un sustantivo soldado al verbo. <span class=\"src\"><a href=\"https://www.verbformen.de/konjugation/staubsaugen.htm\">verbformen.de</a></span></li>\n      <li><span class=\"chip\">FRASE</span> <strong>el alemán mete la tarea doméstica dentro del verbo, el portugués la pone al lado</strong> — <em>staubsaugen</em> = <em>passar o aspirador de pó</em> = <em>pasar la aspiradora</em>; <em>abwaschen</em> = <em>lavar a louça</em> = <em>lavar los trastes</em>. Una palabra contra tres. Quien busca la traducción de una sola palabra busca en vano — lo que se aprende es el par.</li>\n      <li><span class=\"chip hot\">FALSO AMIGO</span> <
