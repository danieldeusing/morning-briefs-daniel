<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daniels Morning Briefs</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="lib/tokens.css">
<script>
  // Pre-paint animation policy (mirrors the terminal core / pagr): an explicit
  // "off" in localStorage — or no pick while the OS prefers reduced motion —
  // marks html.anim-off so components.css kills keyframes (incl. the brand
  // cursor blink) with no flash. The footer anim toggle persists "on"/"off".
  (function () {
    let pref = null;
    try { pref = localStorage.getItem('anim'); } catch (_) {}
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (pref === 'off' || (pref === null && reduced)) {
      document.documentElement.classList.add('anim-off');
    }
  })();
  // Resolution-independent zoom (mirrors pagr): lay out at a 1920px reference, then
  // scale the whole view up on wider screens — a true zoom of everything, never below
  // 1×. Pre-paint to avoid a flash.
  (function () {
    var applyZoom = function () {
      document.documentElement.style.zoom = String(Math.max(1, window.innerWidth / 1920));
    };
    applyZoom();
    window.addEventListener('resize', applyZoom);
  })();
</script>
<style>
  /* Dashboard chrome styles. Design tokens (colours, shadow, typography vars)
     come from lib/tokens.css — keep them there so the dashboard and the
     newsletter content stay in sync. */
  * { box-sizing: border-box; }
  /* Lock the outer document — only inner scroll containers (the .home view
     and the iframe) handle scrolling. Without this, a tiny mismatch between
     header.app + .app-shell heights and 100vh adds a few pixels of overflow
     to <html>, producing a second outer scrollbar alongside the one inside
     .home. overflow: hidden on both html and body kills that outer track. */
  html, body {
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    height: 100%;
    overflow: hidden;
  }
  html { position: relative; }

  /* Paper-grain noise overlay — same texture as the newsletter pages.
     Imperceptible up close, breaks LCD flatness at distance. Disabled under
     reduced-motion / high-contrast preferences. */
  html::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image: none;
    opacity: 0.04;
    mix-blend-mode: multiply;
  }
  @media (prefers-reduced-motion: reduce), (prefers-contrast: more) {
    html::before { display: none; }
  }
  body > *, header.app { position: relative; z-index: 1; }
  body {
    font-family: var(--font-body);
    line-height: 1.5;
    font-size: 15px;
    font-feature-settings: "kern", "liga", "onum";
    -webkit-font-smoothing: antialiased;
  }

  /* Terminal header bar — mirrors the pagr/seedr chrome: a single row on a
     --card surface with a --border bottom rule. LEFT: the brand wordmark
     (mono + .glow) and a blinking .cursor-block. RIGHT: the nav-rail minimize
     toggle. */
  header.app {
    border-bottom: 1px solid var(--border);
    background: var(--card);
    font-family: var(--font-mono); /* chrome is terminal mono; the content stays serif */
    /* Lift the header above the content, which is also a positioned body child
       at z-index 1 and would otherwise paint over it. */
    z-index: 50;
    padding: 0 1rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    min-height: 3rem;
  }
  /* LEFT zone — brand only. */
  .header-left {
    display: flex;
    align-items: center;
    flex: none;
    min-width: 0;
  }
  .header-brand {
    display: inline-flex;
    align-items: center;
    flex: none;
    text-decoration: none;
    cursor: pointer;
  }
  .header-brand .brand-word {
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: -0.01em;
  }

  /* RIGHT zone — the nav-rail minimize toggle, pushed to the far right
     (the header has no center zone). */
  .header-right {
    flex: none;
    margin-left: auto;
    display: flex;
    align-items: center;
  }

  /* Layout: two columns — flexible main + a fixed-width nav-rail on the right.
     The fixed footer is 2rem tall, so the shell is the viewport minus the
     header (3rem) and the footer (2rem). When the rail is collapsed the
     --rail-w track narrows to the icon-only strip. */
  .app-shell {
    display: grid;
    grid-template-columns: minmax(0, 1fr) var(--rail-w, 16rem);
    height: calc(100vh - 3rem - 2rem);
    height: calc(100dvh - 3rem - 2rem);
  }
  .app-shell.rail-collapsed { --rail-w: 3rem; }

  /* The nav lives in the sticky right sidebar (.nav-rail). It holds the
     Übersicht control (#home-btn) and #nav-groups (the grouped category nav,
     populated by JS). */
  .nav-label {
    font-family: var(--font-mono);
    font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--muted-foreground); padding: 0.5rem 0.85rem 0.2rem; font-weight: 600;
  }
  #nav-groups { padding-bottom: 0.2rem; }

  .cat {
    margin: 0;
    border-radius: 0;
    overflow: hidden;
    border: 0;
  }
  .cat-head {
    display: flex; align-items: center; gap: 0.55rem;
    padding: 0.45rem 0.85rem;
    cursor: pointer;
    border-radius: 0;
    transition: background 120ms;
    min-height: 2.1rem;
  }
  .cat-head:hover { background: var(--muted); }
  .cat-head:hover .cat-name { color: var(--primary); }
  .cat.active .cat-head { background: var(--muted); }
  .cat.active .cat-name { color: var(--primary); }
  .cat-color { width: 6px; height: 18px; border-radius: 0; flex: none; }
  .cat-name {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 0.8rem;
    color: var(--foreground);
    transition: color 0.15s ease;
    flex: 1;
    /* Single-line; ellipsise rather than wrap to two lines. */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .cat-icon { font-size: 1.05rem; }
  .cat-latest {
    font-family: var(--font-mono);
    font-size: 0.68rem; color: var(--soft);
    font-feature-settings: "tnum"; font-weight: 500;
  }
  .cat-toggle {
    background: transparent; border: none;
    color: var(--soft); cursor: pointer;
    transition: transform 150ms ease, background 120ms, color 120ms;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    padding: 0.55rem 0.7rem;
    border-radius: var(--radius-inline);
    line-height: 1;
    min-height: 2.25rem; min-width: 2.25rem;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .cat-toggle:hover { background: var(--rule-soft); color: var(--fg); }
  .cat.open > .cat-head .cat-toggle { transform: rotate(90deg); }

  .cat-dates { display: none; padding: 0.15rem 0.7rem 0.4rem 1.45rem; }

  .cat.open .cat-dates { display: block; }
  /* The category dropdown holds only the archive month-picker: days with a
     brief are clickable (ringed in the category accent), the selected day is
     filled, hovering one previews its title. Border + marks use the
     per-category --cat-accent scoped on the .cat row. */
  .cat-cal {
    margin: 0.2rem 0;
    padding: 0.5rem;
    border: 1px solid var(--cat-accent);
    border-radius: 6px;
    background: var(--rule-soft);
  }
  .cal-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 0.45rem;
  }
  .cal-title {
    font-family: var(--font-mono); font-size: 0.74rem;
    font-weight: 600; color: var(--fg);
  }
  .cal-nav {
    width: 1.7rem; height: 1.7rem; line-height: 1;
    background: transparent; border: 1px solid var(--rule); border-radius: 4px;
    color: var(--muted-ink); font-size: 0.95rem; cursor: pointer;
    transition: color 120ms, border-color 120ms;
  }
  .cal-nav:hover:not(:disabled) { color: var(--fg); border-color: var(--soft); }
  .cal-nav:focus-visible { outline: 2px solid var(--cat-accent, var(--fg)); outline-offset: 2px; }
  .cal-nav:disabled { opacity: 0.3; cursor: default; }
  .cal-week, .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
  }
  .cal-week { margin-bottom: 3px; }
  .cal-week span {
    text-align: center; font-family: var(--font-mono);
    font-size: 0.58rem; color: var(--muted-ink);
  }
  .cal-day {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 0.7rem;
    border-radius: 4px; color: var(--soft);
    font-feature-settings: "tnum";
  }
  .cal-day.none { color: var(--rule); }
  .cal-day.blank { visibility: hidden; }
  .cal-day.has {
    color: var(--fg); font-weight: 600; cursor: pointer; text-decoration: none;
    background: var(--panel);
    box-shadow: inset 0 0 0 1px var(--cat-accent);
    transition: background 100ms, color 100ms;
  }
  .cal-day.has:hover, .cal-day.has:focus-visible,
  .cal-day.has.current {
    background: var(--cat-accent); color: #fff; outline: none;
  }
  .cal-preview {
    margin-top: 0.5rem; padding-top: 0.45rem;
    border-top: 1px solid var(--rule);
    font-family: var(--font-body); font-size: 0.72rem;
    color: var(--muted-ink); line-height: 1.35; min-height: 1.7rem;
  }
  /* ────────────────────────────────────────────────────────────────────
     Fixed footer status bar — mirrors the pagr/seedr StatusBar: a 2rem bar
     pinned to the viewport bottom on a --card surface with a --border top
     rule. LEFT: `[briefs] reader@briefs:~/path` status line. RIGHT: the
     relocated controls (theme menu, language menu) + an anim toggle.
     ──────────────────────────────────────────────────────────────────── */
  footer.status-bar {
    position: fixed;
    inset-inline: 0;
    bottom: 0;
    z-index: 60;
    height: 2rem;
    border-top: 1px solid var(--border);
    background: var(--card);
    font-family: var(--font-mono); /* chrome is terminal mono */
    font-size: 11px;
  }
  .status-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    height: 100%;
    padding: 0 0.85rem;
  }
  .status-path {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted-foreground);
  }
  .status-path .status-tag { color: var(--primary); }
  .status-path .status-loc { color: var(--foreground); }
  .status-controls {
    display: flex;
    align-items: center;
    gap: 1.1rem;
    flex: none;
  }
  .status-sep { height: 0.9rem; width: 1px; background: var(--border); flex: none; }

  /* Footer control buttons — flat, muted, warm to --primary on hover. No
     boxes, no shadows; terminal-plain. */
  .status-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: inherit;
    line-height: 1;
    color: var(--muted-foreground);
    text-decoration: none;
    background: none;
    border: 0;
    border-radius: 0;
    padding: 0;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .status-btn:hover { color: var(--primary); }

  /* Theme + language dropdowns reuse the core .dropdown / .dropdown-panel /
     .dropdown-item primitives. The summary mirrors .status-btn. */
  .status-controls .dropdown > summary { font: inherit; }
  /* Settings icons (.dd-dot theme indicator, .dd-flag language flags) come from
     the shared @danieldeusing/design components.css — no local copy here. */

  /* Anim toggle — `[x] anim` / `[ ] anim`, mirroring pagr's footer toggle. */
  .anim-toggle { white-space: nowrap; }
  .anim-toggle[aria-pressed="true"] .anim-box { color: var(--primary); }

  /* Language picker — the trigger anchors the upward dropdown menu. The menu
     reuses the core .dropdown-panel (absolute, opens above, right-aligned),
     toggled open/closed via the [hidden] attribute by the existing JS. */
  .lang-picker { position: relative; }
  .lang-caret { font-size: 0.6rem; margin-left: 0.1rem; }
  .lang-menu[hidden] { display: none; }
  .lang-option[aria-selected="true"] {
    color: var(--primary);
    text-shadow: 0 0 8px var(--glow);
  }

  .cat-empty {
    font-family: var(--font-mono);
    font-size: 0.7rem; color: var(--soft);
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 0.5rem 0.6rem;
  }

  /* Main area — full width, fills the shell (viewport minus header + footer). */
  .main {
    overflow: hidden;
    background: var(--bg);
    position: relative;
    height: 100%;
  }
  .iframe-host { width: 100%; height: 100%; border: none; background: var(--bg); }

  /* ────────────────────────────────────────────────────────────────────
     Sticky right sidebar (.nav-rail) — terminal mono, --card surface with a
     --border left rule, full shell height with its own scroll. Holds the
     Übersicht control + the grouped category nav. Collapses to a 3rem icon-
     only strip; the width animates via the grid track on .app-shell.
     ──────────────────────────────────────────────────────────────────── */
  .nav-rail {
    grid-column: 2;
    font-family: var(--font-mono);
    background: var(--card);
    border-left: 1px solid var(--border);
    height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 2;
  }
  .nav-rail-head {
    display: flex;
    align-items: center;
    min-height: 2.1rem;
    padding: 0.4rem 0.85rem;
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .nav-rail-title {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 600;
    color: var(--muted-foreground);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-rail-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0.3rem 0 0.4rem;
  }

  /* Minimize toggle — the `»`/`«` chevron in the header right zone. Flat, muted,
     warm to --primary on hover (terminal-plain, no box). */
  .rail-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    flex: none;
    background: none;
    border: 0;
    border-radius: 0;
    color: var(--muted-foreground);
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 1rem;
    line-height: 1;
    transition: color 0.15s ease;
  }
  .rail-toggle:hover { color: var(--primary); }
  /* Expanded → `»` (collapse-to-right); collapsed → `«` (re-open). The button's
     aria-expanded drives the glyph; JS rewrites the text content too as a fallback. */
  .rail-toggle[aria-expanded="false"] .rail-toggle-glyph::before { content: "«"; }
  .rail-toggle[aria-expanded="true"]  .rail-toggle-glyph::before { content: "»"; }
  .rail-toggle-glyph { font-size: 0; }
  .rail-toggle-glyph::before { font-size: 1rem; }

  /* Collapsed strip — keep only the per-category accent bar + icon, hide labels,
     calendars and the home wordmark. The 3rem track clips the rest. */
  .app-shell.rail-collapsed .nav-rail-title,
  .app-shell.rail-collapsed .nav-label,
  .app-shell.rail-collapsed .cat-name,
  .app-shell.rail-collapsed .cat-latest,
  .app-shell.rail-collapsed .cat-toggle,
  .app-shell.rail-collapsed .cat-dates,
  .app-shell.rail-collapsed .home-btn .nav-label-text,
  .app-shell.rail-collapsed .home-btn .brand-mark {
    display: none;
  }
  .app-shell.rail-collapsed .nav-rail-head { justify-content: center; padding: 0.4rem 0; }
  .app-shell.rail-collapsed .cat-head,
  .app-shell.rail-collapsed .home-btn {
    justify-content: center;
    padding-left: 0;
    padding-right: 0;
    gap: 0;
  }
  .app-shell.rail-collapsed .cat-color,
  .app-shell.rail-collapsed .home-btn .cat-color { margin-right: 0.4rem; }

  /* The width transition reads off the grid track; animate it. */
  .app-shell { transition: grid-template-columns 0.18s ease; }
  @media (prefers-reduced-motion: reduce) {
    .app-shell { transition: none; }
  }

  /* Mobile re-open button (a floating ☰); shown only when the rail is an
     off-canvas drawer (≤720px). Hidden on desktop. */
  .rail-fab {
    display: none;
    position: fixed;
    right: 0.75rem;
    bottom: 2.6rem;
    z-index: 55;
    width: 2.6rem;
    height: 2.6rem;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--foreground);
    font-family: var(--font-mono);
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow: 0 0 18px var(--glow-soft);
  }

  /* Home view */
  .home {
    display: none;
    padding: 1.5rem 1.8rem;
    overflow-y: auto; height: 100%;
    /* Container for the responsive .tldr-grid below — column-count tracks
       the actual available width, not the viewport (which changes with
       sidebar collapsed/expanded state). */
    container-type: inline-size;
    container-name: home;
  }
  .home.show { display: block; }
  .home h2 {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 48;
    font-size: 1.55rem; font-weight: 600;
    margin: 0 0 0.5rem; letter-spacing: -0.005em;
  }
  .home .lead { color: var(--muted-ink); margin-bottom: 1.4rem; font-family: var(--font-body); }

  /* Freshness line — "Stand: DD.MM.YYYY" from the manifest's `generated`
     date. Mono-caps to read as a dateline, not body copy. When the manifest
     wasn't rebuilt today (a silently-failed nightly task), .stale flips it to
     the warn accent and appends a hint, so a missed run is visible at a glance
     instead of looking like fresh content. */
  .home-stand {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--soft);
    font-feature-settings: "tnum";
    margin: 0 0 1.2rem;
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .home-stand .stand-date { font-weight: 600; color: var(--muted-ink); }
  .home-stand.stale { color: var(--warn); }
  .home-stand.stale .stand-date { color: var(--warn); }
  .home-stand .stand-note { text-transform: none; letter-spacing: 0.02em; font-style: italic; }

  /* Newsprint column grid — the dashboard reads like one paper folded into
     seven adjacent columns. No card chrome: backgrounds, borders, shadows
     and radii are stripped. Adjacent columns are separated only by a
     hairline column rule, the same way the body-grid inside a newsletter
     uses column-rule between deep-dive sections. */
  /* Responsive column grid — caps at 3 wide so the columns stay readable
     on huge screens instead of shrinking to 5-6 narrow strips. The min
     width per column is the larger of 320 px (floor for readability) or
     1/3 of the container (so no more than 3 fit). Single declaration —
     no media or container queries needed.

     The column-rule + row-rule logic uses container queries against .home
     so the layout responds to actual available width (which changes with
     sidebar collapsed/expanded), not viewport. */
  .tldr-grid {
    display: grid;
    grid-template-columns:
      repeat(auto-fit, minmax(min(100%, max(320px, calc((100% - 2px) / 3))), 1fr));
    gap: 0;
    margin-top: 0.5rem;
  }
  .tldr-card {
    background: transparent;
    border: none;
    border-radius: 0;
    padding: var(--space-2) var(--space-4) var(--space-5);
    box-shadow: none;
    cursor: pointer;
    transition: background 150ms;
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    border-left: 1px solid var(--rule);
  }

  /* Grouped layout: a full-width header band (Wirtschaft / IT / Sport / …)
     precedes each group's cards. The header spans every grid column so the
     column flow restarts beneath it — each group reads as its own newsprint
     block, matching the sidebar's grouping. */
  .tldr-group-head {
    grid-column: 1 / -1;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    font-weight: 600;
    color: var(--soft);
    margin: var(--space-5) 0 0;
    padding: var(--space-3) 0 var(--space-2);
    border-top: 1px solid var(--rule);
  }
  /* The first group header sits right under the "Stand:" line — no big top gap
     or top rule, so the grid doesn't open with a stray divider. */
  .tldr-group-head:first-child { margin-top: 0; border-top: none; padding-top: 0; }

  /* The leading card of each group clears its left column rule so the group's
     first column starts clean (JS marks it; nth-child can't track per-group
     position once headers are interspersed). */
  .tldr-card.group-first { border-left: none; padding-left: 0; }

  /* Single-column band (narrow): no column rules at all; cards in the same
     group separate by a dashed row rule. The group header already divides
     groups, so only same-group siblings (a card directly after another card)
     get the dashed top. */
  @container home (max-width: 639px) {
    .tldr-card { border-left: none; padding-left: 0; }
    .tldr-card + .tldr-card {
      margin-top: var(--space-3);
      padding-top: var(--space-5);
      border-top: 1px dashed var(--rule);
    }
  }
  /* Subtle tinted-paper feedback on hover — no transform, no shadow swap,
     so adjacent columns never visually shift. */
  .tldr-card:hover {
    background: color-mix(in srgb, var(--cat-accent) 4%, transparent);
  }
  .tldr-card:focus-visible {
    outline: 2px solid var(--cat-accent, var(--fg));
    outline-offset: 4px;
  }
  .crumb:focus-visible {
    outline: 2px solid var(--fg);
    outline-offset: 2px;
    border-radius: var(--radius-inline);
  }

  /* Kicker line — same mono-caps treatment as the newsletter masthead-issue.
     Icon left, date right, category name in the middle. */
  .tldr-card-head {
    display: flex; align-items: center; gap: var(--space-2);
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.68rem;
    color: var(--muted-ink);
    border-bottom: none;
    padding-bottom: 0;
    margin-bottom: 0;
  }
  .tldr-card-head .tile-icon {
    font-size: 1rem;
    letter-spacing: normal;
    text-transform: none;
  }
  .tldr-card-head .tile-name {
    font-family: inherit;
    font-variation-settings: normal;
    font-weight: 600;
    font-size: inherit;
    color: var(--cat-accent-text, var(--fg));
    flex: 1;
  }
  .tldr-card-head .tile-date {
    font-family: inherit;
    font-size: inherit;
    color: var(--muted-ink);
    font-weight: 500;
    font-feature-settings: "tnum";
    letter-spacing: 0.1em;
  }

  /* Section title — the actual newsletter headline, rendered as a section
     dek in Fraunces with the same accent-bar treatment as .col h2 inside
     a newsletter. Acts as the "front-page headline" for that category. */
  .tldr-card-headline {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 36, "SOFT" 60;
    font-size: 1.18rem;
    font-weight: 600;
    font-style: normal;
    line-height: 1.18;
    color: var(--fg);
    margin: var(--space-2) 0 var(--space-3);
    letter-spacing: -0.005em;
  }
  .tldr-card-headline::before {
    content: "";
    display: block;
    width: 2rem;
    height: 2px;
    background: var(--cat-accent);
    margin-bottom: var(--space-2);
  }

  /* Strip the embedded TL;DR section's own chrome — it inherits the column
     instead. The lead keeps its drop-cap treatment but at a smaller scale
     suited to the narrower column width. */
  .tldr-card-body .tldr {
    background: transparent; border: none; padding: 0; margin: 0; border-radius: 0;
    display: block;       /* override the .tldr:has(.lead) grid from styles.css */
    column-gap: 0;
  }
  .tldr-card-body .tldr > .lead {
    font-family: var(--font-body);
    font-size: 0.92rem;
    line-height: 1.5;
    color: var(--fg);
    margin: 0 0 var(--space-3);
    max-width: none;
  }
  .tldr-card-body .tldr > .lead::first-letter {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 144, "SOFT" 100;
    font-size: 2.7rem;
    float: left;
    line-height: 0.85;
    padding: 0.25rem 0.45rem 0 0;
    color: var(--cat-accent);
    font-weight: 700;
  }
  .tldr-card-body .tldr ul {
    padding-left: 1rem;
    margin: 0;
    column-count: 1;       /* override 2-col bullet layout in narrow card */
  }
  .tldr-card-body .tldr li { font-size: 0.86rem; margin: 0.4rem 0; line-height: 1.5; }
  .tldr-card-body strong { color: var(--fg); font-weight: 700; }
  .tldr-card-body em { color: var(--muted-ink); font-style: italic; }
  .tldr-card-body a { color: inherit; text-decoration: underline; }
  /* Chips inside TL;DR bullets — tinted by the card's accent. */
  .tldr-card-body .chip {
    display: inline-block;
    font-family: var(--font-mono);
    background: color-mix(in srgb, var(--cat-accent, var(--rule-soft)) 14%, transparent);
    color: var(--fg);
    font-size: 0.6rem; font-weight: 600; padding: 0.05rem 0.45rem;
    border-radius: var(--radius-inline); letter-spacing: 0.04em; margin-right: 0.2rem;
    text-transform: uppercase; vertical-align: middle;
  }
  .tldr-card-body .chip.hot  { background: rgba(182, 64, 47, 0.18); color: #b6402f; }
  .tldr-card-body .chip.good { background: rgba(63, 122, 79, 0.18); color: #3f7a4f; }
  /* Suppress the external-link arrow inside TL;DR snippets — too noisy. */
  .tldr-card-body a[href^="http"]::after { content: none; }
  /* "+N weitere" overflow marker — the home snapshot caps the TL;DR at a few
     bullets (the full set is one click away). Reads as a muted continuation
     cue, list-style stripped so it doesn't get its own bullet dot. */
  .tldr-card-body .tldr li.tldr-more {
    list-style: none;
    margin-left: -1rem;
    color: var(--soft);
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    font-style: normal;
  }

  /* DE-fallback chip — shown in a card's kicker when the active language has
     no translation for this date and the card is showing the DE original.
     Understated outline so it informs without competing with the accent. */
  .tldr-card-head .fallback-flag {
    font-family: var(--font-mono);
    font-size: 0.58rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--soft);
    border: 1px solid var(--rule);
    border-radius: var(--radius-inline);
    padding: 0.02rem 0.3rem;
    text-transform: uppercase;
    flex: none;
  }

  .tldr-read {
    background: transparent; border: none; color: var(--fg);
    font-family: var(--font-mono);
    font-weight: 600; cursor: pointer;
    font-size: 0.78rem; text-align: left;
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 0.7rem 0.2rem 0.4rem 0; margin-top: auto;
    min-height: 2.25rem;
    border-radius: var(--radius-inline);
  }
  .tldr-read:focus-visible {
    outline: 2px solid var(--cat-accent);
    outline-offset: 2px;
  }
  .tldr-read:hover { text-decoration: underline; }
  .tldr-empty {
    font-family: var(--font-body);
    font-size: 0.88rem; color: var(--soft); font-style: italic; padding: 0.4rem 0;
  }

  /* Empty-state card — "Heute kein Brief". Same per-category accent stripe
     so the category identity is preserved, but the body is muted, dashed,
     and self-evidently dormant. Not clickable. */
  .tldr-card--empty {
    cursor: default;
    background: color-mix(in srgb, var(--bg) 50%, var(--panel));
    box-shadow: none;
  }
  .tldr-card--empty:hover {
    transform: none;
    box-shadow: none;
  }
  .tldr-card--empty .tile-date {
    color: var(--rule);
  }
  .tldr-empty-block {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.5rem;
    padding: 1.2rem 0.4rem 0.8rem;
    border-top: 1px dashed var(--rule);
    border-bottom: 1px dashed var(--rule);
    margin: 0.4rem 0 0;
  }
  .tldr-empty-kicker {
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.7rem;
    color: var(--cat-accent, var(--muted-ink));
    font-weight: 600;
  }
  .tldr-empty-msg {
    font-family: var(--font-body);
    font-size: 0.88rem;
    color: var(--muted-ink);
    line-height: 1.5;
    font-style: italic;
    margin: 0;
  }

  /* Per-category accents — each card scopes its own --cat-accent and
     --cat-accent-text so descendant rules (kicker tile-name, accent bar above
     the headline, drop cap, chips, CTA) all pick up the right colour. */
  .tldr-card[data-cat="economy"]        { --cat-accent: var(--c-economy);        --cat-accent-text: var(--c-economy-text); }
  .tldr-card[data-cat="software"]       { --cat-accent: var(--c-software);       --cat-accent-text: var(--c-software-text); }
  .tldr-card[data-cat="ai-dev"]         { --cat-accent: var(--c-ai-dev);         --cat-accent-text: var(--c-ai-dev-text); }
  .tldr-card[data-cat="ai-usecases"]    { --cat-accent: var(--c-ai-usecases);    --cat-accent-text: var(--c-ai-usecases-text); }

  .tldr-card .tldr-read { color: var(--cat-accent-text); }

  /* Loading */
  .loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;

  }
  .loading.show { opacity: 1; }

  /* Color helpers per category */
  [data-cat="economy"]        .cat-color { background: var(--c-economy); }
  [data-cat="software"]       .cat-color { background: var(--c-software); }

  [data-cat="jobs"]           .cat-color { background: var(--c-jobs); }
  [data-cat="learn-language"] .cat-color { background: var(--c-learn-language); }

  /* Sidebar rows scope their own --cat-accent so the archive calendar's border,
     day rings and selected-day fill match the category colour. */
  .cat[data-cat="economy"]        { --cat-accent: var(--c-economy); }
  .cat[data-cat="software"]       { --cat-accent: var(--c-software); }
  .cat[data-cat="ai-dev"]         { --cat-accent: var(--c-ai-dev); }
  .cat[data-cat="ai-usecases"]    { --cat-accent: var(--c-ai-usecases); }
  .cat[data-cat="family"]         { --cat-accent: var(--c-family); }
  .cat[data-cat="jobs"]           { --cat-accent: var(--c-jobs); }
  .cat[data-cat="learn-language"] { --cat-accent: var(--c-learn-language); }

  /* Home button — the "Übersicht" control at the top of the nav dropdown
     panel. Black accent bar (the dashboard's "house" colour) + favicon-style
     M brand mark + label, styled like a terminal .dropdown-item row. */
  .home-btn {
    display: flex; align-items: center; gap: 0.55rem;
    padding: 0.45rem 0.85rem;

    min-height: 2.1rem;
  }
  .home-btn:hover { background: var(--muted); color: var(--primary); }
  .home-btn.active { background: var(--muted); color: var(--primary); }
  .home-btn .cat-color {
    width: 6px; height: 18px; border-radius: 0; flex: none;
    background: var(--foreground);
  }
  /* Brand mark = the favicon design at category-icon size. */
  .home-btn .brand-mark {
    width: 1.1rem;
    height: 1.1rem;
    flex: none;
  }
  .home-btn:focus-visible,
  .cat-head:focus-visible,
  .cat-toggle:focus-visible,

    outline: 2px solid var(--ring, var(--primary));
    outline-offset: -2px;
  }

  /* ────────────────────────────────────────────────────────────────────
     Mobile / narrow responsiveness — the nav-rail becomes an off-canvas
     drawer (the .app-shell collapses to a single main column), toggled by
     the floating .rail-fab. The header keeps brand + history controls.
     ──────────────────────────────────────────────────────────────────── */
  @media (max-width: 720px) {
    header.app { padding: 0 0.75rem; gap: 0.6rem; }
    .header-brand .brand-word { font-size: 0.92rem; }
    .home { padding: 1rem 1rem 1.5rem; }
    .tldr-grid { grid-template-columns: 1fr; gap: 0.85rem; }
    .home h2 { font-size: 1.2rem; }
    .status-controls { gap: 0.9rem; }

    /* Single main column; the rail floats as an off-canvas drawer pinned
       under the header / above the footer, slid off to the right until opened. */
    .app-shell,
    .app-shell.rail-collapsed { grid-template-columns: 1fr; }
    .nav-rail {
      position: fixed;
      top: 3rem;
      right: 0;
      bottom: 2rem;
      width: min(80vw, 18rem);
      transform: translateX(100%);
      transition: transform 0.2s ease;
      z-index: 56;
      box-shadow: -8px 0 24px var(--glow-soft);
    }
    .app-shell.rail-open .nav-rail { transform: translateX(0); }
    /* On mobile the drawer always shows full labels — never the icon strip. */
    .app-shell.rail-collapsed .nav-rail-title,
    .app-shell.rail-collapsed .nav-label,
    .app-shell.rail-collapsed .cat-name,
    .app-shell.rail-collapsed .cat-latest,
    .app-shell.rail-collapsed .cat-toggle,
    .app-shell.rail-collapsed .cat-dates,
    .app-shell.rail-collapsed .home-btn .nav-label-text,
    .app-shell.rail-collapsed .home-btn .brand-mark { display: revert; }
    .app-shell.rail-collapsed .nav-rail-head { justify-content: flex-start; padding: 0.4rem 0.85rem; }
    .app-shell.rail-collapsed .cat-head,
    .app-shell.rail-collapsed .home-btn {
      justify-content: flex-start; padding-left: 0.85rem; padding-right: 0.85rem; gap: 0.55rem;
    }
    /* The header chevron toggle is meaningless on mobile (drawer uses the FAB). */
    .rail-toggle--header { display: none; }
    .rail-fab { display: inline-flex; align-items: center; justify-content: center; }
  }
  @media (max-width: 400px) {
    header.app { padding: 0 0.6rem; }
    .header-brand .brand-word { font-size: 0.85rem; }
    .home { padding: 0.85rem 0.85rem 1.2rem; }
    .tldr-card { padding: 0.8rem 0.9rem 0.7rem; }
    .tldr-card-body .tldr li { font-size: 0.8rem; }
  }

<!-- Terminal header bar (mirrors pagr): LEFT brand wordmark + cursor; RIGHT the
     nav-rail minimize toggle. The grouped category nav lives in the sticky right
     sidebar (.nav-rail). -->
<header class="app">
  <div class="header-left">
    <a class="header-brand" id="brand-home" href="#home" title="Übersicht">

      <span class="cursor-block" aria-hidden="true"></span>

  </div>

  <div class="header-right">
    <button class="rail-toggle rail-toggle--header" id="rail-toggle" type="button"
            aria-controls="nav-rail" aria-expanded="true" aria-label="Navigation ein-/ausblenden"
            title="Navigation ein-/ausblenden">
      <span class="rail-toggle-glyph" aria-hidden="true">»</span>
    </button>
  </div>
</header>

<div class="app-shell">

  </main>

  <!-- Sticky right sidebar: the relocated Übersicht control (#home-btn) and the
       grouped category nav (#nav-groups, populated by JS from NAV_GROUPS). Can be
       minimized to an icon-only strip; collapsed state persists in localStorage. -->
  <aside class="nav-rail" id="nav-rail" aria-label="Navigation">
    <div class="nav-rail-head">
      <span class="nav-rail-title">~/briefs</span>
    </div>
    <div class="nav-rail-body">
      <div class="home-btn active" id="home-btn" role="button" tabindex="0" title="Übersicht">
        <span class="cat-color"></span>

             double-rule + serif M. Identical SVG to favicon.svg so the
             browser tab and the home control read as the same "house" mark. -->
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">

        <span class="nav-label-text">Übersicht</span>
      </div>
      <div id="nav-groups"><!-- populated by JS from NAV_GROUPS: grouped category
           nav (Wirtschaft / IT / jobs / Sport / Freizeit / Sprachen), each group
           with its own .nav-label header (standalone groups render headerless). --></div>
    </div>
  </aside>
</div>

        aria-label="Navigation öffnen" title="Navigation">☰</button>

     toggle (right). Controls keep their original ids so the existing handlers

        <span class="anim-box" aria-hidden="true">[x]</span>
        <span>anim</span>
      </button>
    </nav>
  </div>
</footer>

        "en": "<div class=\"tldr\"><h2>The Essentials in 30 Seconds</h2>\n    <p class=\"lead\">The Fed decides at 15:00 BRT today — Kevin Warsh's first real acid test, after an overnight escalation in Iran pushed oil prices up nearly four percent. The real moved first: EUR/BRL is trading live around 0.7% above the last ECB fix. What's striking is what <em>didn't</em> happen — the dollar index is actually slightly <em>weaker</em>. So this isn't a dollar story, it's an emerging-market one.</p>\n    <ul>\n      <li><span class=\"chip hot\">FED</span> <strong>Decision today at 15:00 BRT</strong>, press conference at 15:30. Consensus: hold at 3.50–3.75%, the fifth hold in a row. But the June projections point <em>higher</em>.</li>\n      <li><span class=\"chip\">FX</span> <strong>EUR/BRL 5.8158</strong> (ECB fix Tue Jul 28) vs. <strong>5.8557</strong> live (xe.com, Jul 29, 05:05 UTC) — <strong>+0.69%</strong>, above the 0.5% reporting threshold.</li>\n      <li><span class=\"chip hot\">OIL</span> <strong>Brent $87.29</strong> (+3.81%, Jul 29) after an intercepted Iranian missile strike on a US base — the price had fallen around 16% over the prior three sessions.</li>\n      <li><span class=\"chip\">FX</span> <strong>The dollar isn't the culprit:</strong> DXY <strong>101.2689</strong> (−0.15%); USD/BRL +0.43%, EUR/USD +0.26%.</li>\n      <li><span class=\"chip good\">BR INFLATION</span> <strong>IPCA-15 for July up just +0.06%</strong> after +0.41% in June; the 12-month rate falls from 4.80% to <strong>4.52%</strong>. Expected: +0.20%.</li>\n      <li><span class=\"chip\">RATES</span> Selic unchanged at <strong>14.25%</strong>, next Copom <strong>Aug 4-5</strong>. Real interest rate sits nearly <strong>9.7 points</strong> above 12-month inflation.</li>\n      <li><span class=\"chip\">BR FISCAL</span> 2026 primary deficit forecast cut to <strong>R$52 billion</strong> (from 60.3) — on <strong>R$12.3 billion</strong> more in net revenue. The target remains a <em>surplus</em> of 34.3 billion.</li>\n      <li><span class=\"chip\">MARKETS</span> Ibovespa <strong>176,564.75</strong> (+0.70%, Jul 28); US tape mixed (Dow +1.03%, Nasdaq −0.22%).</li>\n      <li><span class=\"chip\">FORECAST</span> Today <strong>5.82–5.92</strong>, most likely <strong>5.86</strong>. Near-term steps shifted higher, the far ones unchanged.</li>\n      <li><span class=\"chip\">GAP</span> <strong>Not verifiable today:</strong> BR 5-yr CDS, DI curve, NTN-B real yields, CFTC positioning, EWZ flows.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><h2>O essencial em 30 segundos</h2>\n    <p class=\"lead\">Às 15h no horário de Brasília o Fed decide — a primeira prova de fogo de verdade para Kevin Warsh, depois que uma escalada da noite para o dia no Irã empurrou o preço do petróleo para cima em quase quatro por cento. O real saiu na frente: o EUR/BRL ao vivo está cerca de 0,7% acima do último fixing do BCE. O que chama atenção é o que <em>não</em> aconteceu — o índice do dólar está, na verdade, levemente <em>mais fraco</em>. Ou seja, não é uma história de dólar, é uma história de mercado emergente.</p>\n    <ul>\n      <li><span class=\"chip hot\">FED</span> <strong>Decisão hoje às 15h BRT</strong>, coletiva às 15h30. Consenso: manutenção em 3,50–3,75%, quinta manutenção seguida. Mas as projeções de junho apontam para <em>cima</em>.</li>\n      <li><span class=\"chip\">Câmbio</span> <strong>EUR/BRL 5,8158</strong> (fixing do BCE, ter. 28/07) vs. <strong>5,8557</strong> ao vivo (xe.com, 29/07, 05h05 UTC) — <strong>+0,69%</strong>, acima do limiar de aviso de 0,5%.</li>\n      <li><span class=\"chip hot\">Petróleo</span> <strong>Brent US$ 87,29</strong> (+3,81%, 29/07) após um ataque de mísseis do Irã contra uma base americana ser interceptado — antes disso, o preço tinha caído cerca de 16% em três pregões.</li>\n      <li><span class=\"chip\">Câmbio</span> <strong>O dólar não é o culpado:</strong> índice do dólar em <strong>101,2689</strong> (−0,15%); USD/BRL +0,43%, EUR/USD +0,26%.</li>\n      <li><span class=\"chip good\">INFLAÇÃO BR</span> <strong>IPCA-15 de julho fica em apenas +0,06%</strong> depois de +0,41% em junho; em 12 meses, cai de 4,80% para <strong>4,52%</strong>. Esperado: +0,20%.</li>\n      <li><span class=\"chip\">JUROS</span> Selic estável em <strong>14,25%</strong>, próximo Copom em <strong>04-05/08</strong>. Juro real de quase <strong>9,7 pontos</strong> acima da inflação em 12 meses.</li>\n      <li><span class=\"chip\">FISCAL BR</span> Previsão de déficit primário de 2026 reduzida para <strong>R$ 52 bilhões</strong> (de 60,3) — puxada por <strong>R$ 12,3 bilhões</strong> a mais em receita líquida. A meta continua sendo um <em>superávit</em> de 34,3 bilhões.</li>\n      <li><span class=\"chip\">MERCADOS</span> Ibovespa em <strong>176.564,75</strong> pontos (+0,70%, 28/07); mercado americano misto (Dow +1,03%, Nasdaq −0,22%).</li>\n      <li><span class=\"chip\">PREVISÃO</span> Hoje <strong>5,82–5,92</strong>, mais provável <strong>5,86</strong>. Os degraus próximos subiram, os distantes seguem inalterados.</li>\n      <li><span class=\"chip\">LACUNA</span> <strong>Não verificável hoje:</strong> CDS de 5 anos do Brasil, curva de DI, rendimentos reais de NTN-B, posicionamento da CFTC, fluxos do EWZ.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><h2>Lo esencial en 30 segundos</h2>\n    <p class=\"lead\">A las 15:00 hora de Brasilia decide la Fed — la primera prueba de fuego de verdad para Kevin Warsh, después de que una escalada nocturna en Irán empujó el precio del petróleo casi cuatro por ciento hacia arriba. El real se adelantó: el EUR/BRL en vivo está cerca de 0.7% por encima del último fixing del BCE. Lo llamativo es lo que <em>no</em> pasó — el índice del dólar está, de hecho, ligeramente <em>más débil</em>. Es decir, no es una historia de dólar, sino de mercados emergentes.</p>\n    <ul>\n      <li><span class=\"chip hot\">FED</span> <strong>Decisión hoy a las 15:00 hora de Brasilia</strong>, conferencia de prensa a las 15:30. Consenso: mantener en 3.50–3.75%, la quinta pausa seguida. Pero las proyecciones de junio apuntan hacia <em>arriba</em>.</li>\n      <li><span class=\"chip\">FX</span> <strong>EUR/BRL 5.8158</strong> (fixing del BCE, mar. 28/07) vs. <strong>5.8557</strong> en vivo (xe.com, 29/07, 05:05 UTC) — <strong>+0.69%</strong>, por encima del umbral de aviso de 0.5%.</li>\n      <li><span class=\"chip hot\">Petróleo</span> <strong>Brent 87.29 dólares</strong> (+3.81%, 29/07) tras interceptarse un ataque de misiles iraníes contra una base de EE. UU. — antes de eso, el precio había caído cerca de 16% en tres sesiones.</li>\n      <li><span class=\"chip\">FX</span> <strong>El dólar no es el culpable:</strong> índice del dólar en <strong>101.2689</strong> (−0.15%); USD/BRL +0.43%, EUR/USD +0.26%.</li>\n      <li><span class=\"chip good\">INFLACIÓN BR</span> <strong>El IPCA-15 de julio queda en solo +0.06%</strong> después de +0.41% en junio; en 12 meses cae de 4.80% a <strong>4.52%</strong>. Esperado: +0.20%.</li>\n      <li><span class=\"chip\">TASAS</span> Selic sin cambios en <strong>14.25%</strong>, próximo Copom el <strong>04-05/08</strong>. La tasa real está a casi <strong>9.7 puntos</strong> por encima de la inflación a 12 meses.</li>\n      <li><span class=\"chip\">FISCAL BR</span> Pronóstico de déficit primario de 2026 recortado a <strong>R$ 52 mil millones</strong> (desde 60.3) — impulsado por <strong>R$ 12.3 mil millones</strong> más en ingresos netos. La meta sigue siendo un <em>superávit</em> de 34.3 mil millones.</li>\n      <li><span class=\"chip\">MERCADOS</span> Ibovespa en <strong>176,564.75</strong> puntos (+0.70%, 28/07); mercado estadounidense mixto (Dow +1.03%, Nasdaq −0.22%).</li>\n      <li><span class=\"chip\">PRONÓSTICO</span> Hoy <strong>5.82–5.92</strong>, lo más probable <strong>5.86</strong>. Los tramos cercanos se movieron al alza, los lejanos siguen igual.</li>\n      <li><span class=\"chip\">VACÍO</span> <strong>No verificable hoy:</strong> CDS a 5 años de Brasil, curva de DI, rendimientos reales de NTN-B, posicionamiento de la CFTC, flujos del EWZ.</li>\n    </ul></div>"

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Gestern ging es hier um die Frage, wer eigentlich die Nummern vergibt. Heute kommt die Antwort in drei Geschmacksrichtungen. Bei <strong>JFrog</strong> ist die Lücke aus der Hugging-Face-Geschichte gepatcht und nummeriert — acht CVE-IDs, Fixes seit Montag. Bei <strong>Fastjson</strong> läuft seit einer Woche eine aktive Kampagne, und für die 1.x-Linie gibt es keinen Fix, nur einen Umzug. Bei 24.650 Servern im offenen Netz ist der Fehler die Spezifikation selbst. Repariert, ungepatcht, unpatchbar — den Rest füllen die Ränder.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>JFrog Artifactory</strong>: acht Zero-Days, Fixes seit dem 28.07., gemeldet von OpenAI-Forschern. Vieles deutet auf den Paket-Cache-Proxy aus dem Hugging-Face-Einbruch — bestätigt hat JFrog das nicht. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Fastjson 1.x</strong>: CVE-2026-16723, CVSS 9,0, seit rund dem 22.07. aktiv ausgenutzt — und für die Linie 1.2.68–1.2.83 gab es Stand 25.07. kein repariertes Build. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>KEV-Katalog</strong>: zwei Neuzugänge am 27.07. — Arista VeloCloud Orchestrator (CVE-2026-16812, CVSS 10,0) mit Behördenfrist <strong>morgen</strong>, dazu ein wiederauferstandener FortiOS-Fehler von 2025. <span class=\"chip\">USA</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>OpenWrt</strong>: CVE-2026-53921, CVSS 9,8 — Stack-Überlauf im DHCPv6-Dienst <code>odhcpd</code>, der als root läuft. Fix in 24.10.8 und 25.12.5, öffentlicher Proof-of-Concept liegt bei. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>24.650 Server-Fernwartungen</strong> geben ihre Passwort-Hashes vor dem Login heraus. Der Fehler steckt in der IPMI-v2.0-Spezifikation, ist von 2013 — und Dell sagt selbst: „es gibt keinen Patch\". <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>vBulletin</strong>: Pre-Auth-RCE über den <code>{vb:math}</code>-Template-Tag (CVE-2026-61511). Fix seit dem 01.07., technische Analyse mit Exploit seit dem 27.07. öffentlich. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Linux-Kernel</strong>: 432 neue CVEs an einem einzigen Wochenende. Greg Kroah-Hartman erklärt nüchtern, warum diese Zahl fast beliebig groß werden kann. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Regulierung</span> <strong>CRA-Meldeuhr</strong>: Der Montags-Leitfaden ist Mitteilung C(2026) 5252, unverbindlich, mit 67 Beispielen. Die Uhr ab 11.09.: 24 Stunden, 72 Stunden, 14 Tage. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">Release</span> <strong>Werkzeugkasten</strong>: Docker Desktop bringt containerd 2.2.3 und wirft <code>docker sandbox</code> zugunsten von <code>docker sbx</code> raus; Chrome 151 ist seit dem 22.07. Early-Stable. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">Infra</span> <strong>Korrektur in eigener Sache</strong>: Tailscales TS-2026-004 trägt im Changelog den 28.07., nicht den 14.07. — hier stand es gestern falsch. <span class=\"chip\">Global</span></li>\n    </ul></div>",

"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>vBulletin</strong>: Pre-Auth-RCE über den <code>{vb:math}</code>-Template-Tag (CVE-2026-61511). Fix seit dem 01.07., technische Analyse mit Exploit seit dem 27.07. öffentlich. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Linux-Kernel</strong>: 432 neue CVEs an einem einzigen Wochenende. Greg Kroah-Hartman erklärt nüchtern, warum diese Zahl fast beliebig groß werden kann. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Regulierung</span> <strong>CRA-Meldeuhr</strong>: Der Montags-Leitfaden ist Mitteilung C(2026) 5252, unverbindlich, mit 67 Beispielen. Die Uhr ab 11.09.: 24 Stunden, 72 Stunden, 14 Tage. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">Release</span> <strong>Werkzeugkasten</strong>: Docker Desktop bringt containerd 2.2.3 und wirft <code>docker sandbox</code> zugunsten von <code>docker sbx</code> raus; Chrome 151 ist seit dem 22.07. Early-Stable. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">Infra</span> <strong>Korrektur in eigener Sache</strong>: Tailscales TS-2026-004 trägt im Changelog den 28.07., nicht den 14.07. — hier stand es gestern falsch. <span class=\"chip\">Global</span></li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Yesterday's question here was who actually assigns the numbers. Today the answer comes in three flavors. At JFrog, the flaw from the Hugging Face story is patched and numbered — eight CVE IDs, fixes since Monday. At Fastjson, an active campaign has been running for a week, and for the 1.x line there is no fix, only a migration. At 24,650 internet-exposed servers, the flaw is the specification itself. Fixed, unpatched, unpatchable — the rest fills in the margins.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>JFrog Artifactory</strong>: eight zero-days, fixes since July 28, reported by OpenAI researchers. Much points to the package cache proxy from the Hugging Face breach — JFrog hasn't confirmed that. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Fastjson 1.x</strong>: CVE-2026-16723, CVSS 9.0, actively exploited since around July 22 — and for the 1.2.68–1.2.83 line, as of July 25 there was still no fixed build. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>KEV catalog</strong>: two new additions on July 27 — Arista VeloCloud Orchestrator (CVE-2026-16812, CVSS 10.0) with a federal deadline <strong>tomorrow</strong>, plus a resurrected 2025 FortiOS flaw. <span class=\"chip\">USA</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>OpenWrt</strong>: CVE-2026-53921, CVSS 9.8 — a stack overflow in the DHCPv6 service <code>odhcpd</code>, which runs as root. Fixed in 24.10.8 and 25.12.5, a public proof-of-concept is included. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>24,650 server remote-management modules</strong> hand over their password hashes before login. The flaw sits in the IPMI v2.0 specification, dates to 2013 — and Dell itself says: \"there is no patch.\" <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>vBulletin</strong>: pre-auth RCE via the <code>{vb:math}</code> template tag (CVE-2026-61511). Fixed since July 1, technical analysis with exploit public since July 27. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Linux kernel</strong>: 432 new CVEs in a single weekend. Greg Kroah-Hartman calmly explains why that number can grow to almost any size. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Regulation</span> <strong>CRA reporting clock</strong>: Monday's guidance is Communication C(2026) 5252, non-binding, with 67 examples. The clock from September 11: 24 hours, 72 hours, 14 days. <span class=\"chip\">EU</span></li>\n      <li><span class=\"chip\">Release</span> <strong>Toolbox</strong>: Docker Desktop ships containerd 2.2.3 and drops <code>docker sandbox</code> in favor of <code>docker sbx</code>; Chrome 151 has been Early Stable since July 22. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">Infra</span> <strong>Correcting ourselves</strong>: Tailscale's TS-2026-004 is dated July 28 in the changelog, not July 14 — we had it wrong here yesterday. <span class=\"chip\">Global</span></li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Ontem, a pergunta aqui era quem realmente atribui os números. Hoje a resposta vem em três sabores. Na JFrog, a falha da história da Hugging Face está corrigida e numerada — oito IDs de CVE, correções desde segunda. No Fastjson, há uma campanha ativa há uma semana, e para a linha 1.x não existe correção, só uma migração. Em 24.650 servidores expostos na internet aberta, a falha é a própria especificação. Corrigido, sem patch, impossível de corrigir — o resto preenche as margens.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>JFrog Artifactory</strong>: oito zero-days, correções desde 28/07, reportados por pesquisadores da OpenAI. Muita coisa aponta para o proxy de cache de pacotes da invasão à Hugging Face — mas a JFrog não confirmou isso. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Fastjson 1.x</strong>: CVE-2026-16723, CVSS 9,0, explorada ativamente desde cerca de 22/07 — e para a linha 1.2.68–1.2.83, até 25/07 não havia build corrigido. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>catálogo KEV</strong>: duas novas entradas em 27/07 — Arista VeloCloud Orchestrator (CVE-2026-16812, CVSS 10,0) com prazo federal <strong>amanhã</strong>, além de uma falha do FortiOS de 2025 que ressurgiu. <span class=\"chip\">EUA</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>OpenWrt</strong>: CVE-2026-53921, CVSS 9,8 — estouro de pilha no serviço DHCPv6 <code>odhcpd</code>, que roda como root. Correção em 24.10.8 e 25.12.5, prova de conceito pública já circula. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>24.650 módulos de gerenciamento remoto de servidores</strong> entregam seus hashes de senha antes do login. A falha está na própria especificação do IPMI v2.0, é de 2013 — e a Dell diz, ela mesma: \"não existe patch\". <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>vBulletin</strong>: RCE pré-autenticação via a tag de template <code>{vb:math}</code> (CVE-2026-61511). Correção desde 01/07, análise técnica com exploit pública desde 27/07. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Kernel Linux</strong>: 432 novos CVEs num único fim de semana. Greg Kroah-Hartman explica, sem drama, por que esse número pode crescer quase à vontade. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Regulação</span> <strong>Relógio de notificação do CRA</strong>: o guia de segunda-feira é a Comunicação C(2026) 5252, sem caráter vinculante, com 67 exemplos. O relógio a partir de 11/09: 24 horas, 72 horas, 14 dias. <span class=\"chip\">UE</span></li>\n      <li><span class=\"chip\">Release</span> <strong>Caixa de ferramentas</strong>: o Docker Desktop traz o containerd 2.2.3 e descarta o <code>docker sandbox</code> em favor do <code>docker sbx</code>; o Chrome 151 é Early Stable desde 22/07. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">Infra</span> <strong>Correção nossa</strong>: o TS-2026-004 do Tailscale está datado de 28/07 no changelog, não 14/07 — publicamos errado ontem. <span class=\"chip\">Global</span></li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Ayer, la pregunta aquí era quién realmente asigna los números. Hoy la respuesta llega en tres sabores. En JFrog, la falla de la historia de Hugging Face está parchada y numerada — ocho IDs de CVE, arreglos desde el lunes. En Fastjson corre una campaña activa desde hace una semana, y para la línea 1.x no hay arreglo, solo una migración. En 24.650 servidores expuestos en la red abierta, la falla es la propia especificación. Reparado, sin parche, imposible de parchar — el resto lo llenan los márgenes.</p>\n    <ul>\n      <li><span class=\"chip hot\">Sec</span> <strong>JFrog Artifactory</strong>: ocho días cero, arreglos desde el 28/07, reportados por investigadores de OpenAI. Mucho apunta al proxy de caché de paquetes de la irrupción en Hugging Face — pero JFrog no lo confirmó. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>Fastjson 1.x</strong>: CVE-2026-16723, CVSS 9,0, explotada activamente desde alrededor del 22/07 — y para la línea 1.2.68–1.2.83, al 25/07 no había ningún build corregido. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>catálogo KEV</strong>: dos nuevas incorporaciones el 27/07 — Arista VeloCloud Orchestrator (CVE-2026-16812, CVSS 10,0) con plazo federal <strong>mañana</strong>, más una falla resucitada de FortiOS de 2025. <span class=\"chip\">EUA</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>OpenWrt</strong>: CVE-2026-53921, CVSS 9,8 — desbordamiento de pila en el servicio DHCPv6 <code>odhcpd</code>, que corre como root. Corregido en 24.10.8 y 25.12.5, ya circula una prueba de concepto pública. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip hot\">Sec</span> <strong>24.650 módulos de administración remota de servidores</strong> entregan sus hashes de contraseña antes de iniciar sesión. La falla está en la propia especificación IPMI v2.0, es de 2013 — y la propia Dell dice: \"no hay parche\". <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Sec</span> <strong>vBulletin</strong>: RCE previo a autenticación mediante la etiqueta de plantilla <code>{vb:math}</code> (CVE-2026-61511). Corregido desde el 01/07, análisis técnico con exploit público desde el 27/07. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">OSS</span> <strong>Kernel de Linux</strong>: 432 CVEs nuevos en un solo fin de semana. Greg Kroah-Hartman explica, sin dramatismo, por qué esa cifra puede crecer casi sin límite. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip\">Regulación</span> <strong>reloj de notificación del CRA</strong>: la guía del lunes es la Comunicación C(2026) 5252, sin carácter vinculante, con 67 ejemplos. El reloj a partir del 11/09: 24 horas, 72 horas, 14 días. <span class=\"chip\">UE</span></li>\n      <li><span class=\"chip\">Release</span> <strong>Caja de herramientas</strong>: Docker Desktop trae containerd 2.2.3 y elimina <code>docker sandbox</code> en favor de <code>docker sbx</code>; Chrome 151 es Early Stable desde el 22/07. <span class=\"chip\">Global</span></li>\n      <li><span class=\"chip good\">Infra</span> <strong>Corrección propia</strong>: el TS-2026-004 de Tailscale está fechado el 28/07 en el changelog, no el 14/07 — ayer lo publicamos mal aquí. <span class=\"chip\">Global</span></li>\n    </ul></div>"
      }

      "latestTldrHtml": "<div class=\"tldr\"><p class=\"lead\">Gestern stand hier ein Fragezeichen hinter der MCP-Spec: angekündigt für den 28.07., aber um 05:13 UTC führte die Doku noch die alte Fassung. Heute ist die Antwort da und sie ist zwiespältig — der Inhalt ist umgestellt, der Initialisierungs-Handshake durch eine Verhandlung pro Anfrage ersetzt, nur das Etikett „aktuelle Version\" hinkt hinterher. Dazu hat das SWE-Bench-Verified-Board über Nacht neue Zahlen bekommen, und beim Draufschauen fällt etwas Unangenehmeres auf als jeder Punktestand.</p>\n    <ul>\n      <li><span class=\"chip hot\">MCP</span> <strong>Der Handshake ist weg, der Ersatz steht</strong>: Jede Anfrage trägt ihre Protokoll-Version selbst im <code>_meta</code>-Feld, der Server nimmt sie <em>„independently\"</em> pro Anfrage an oder ab. Client und Server dürfen mehrere Versionen gleichzeitig sprechen.</li>\n      <li><span class=\"chip\">MCP</span> <strong>Neu: <code>server/discover</code></strong> — eine für Server verpflichtende, für Clients optionale RPC, die Versionen, Capabilities und Identität <em>„in a single request\"</em> zurückgibt. Passt die Version nicht, kommt ein <code>UnsupportedProtocolVersionError</code> mit der Liste dessen, was ginge.</li>\n      <li><span class=\"chip hot\">MCP</span> <strong>Etikett hinkt</strong>: Um 06:40 UTC sagt dieselbe Seite weiter <em>„The current protocol version is 2025-11-25\"</em> — während sie unmittelbar darüber die Verhandlung der neuen Fassung beschreibt. Widerspruch in einem Dokument.</li>\n      <li><span class=\"chip\">MCP</span> <strong>Anthropics Beitrag ist Ankündigung, kein Rollout</strong>: <em>„Support is being rolled out across Claude products soon\"</em> — kein Datum. Dafür <span class=\"stat\">400 Mio.</span> monatliche SDK-Downloads (4× im Jahr) und <span class=\"stat\">950+</span> Server im Connector-Verzeichnis.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>Ein „Verified\"-Board ohne eine einzige Verifikation</strong>: llm-stats weist für SWE-Bench Verified <span class=\"stat\">104</span> Einträge als selbstberichtet und <span class=\"stat\">0</span> als verifiziert aus. Der Name des Boards verspricht genau das Gegenteil.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Bei llm-stats sind sieben der Top Ten Anthropic-Modelle</strong>: Fable 5 führt mit <span class=\"stat\">95,0</span>, dahinter Mythos Preview <span class=\"stat\">93,9</span> und Opus 4.8 <span class=\"stat\">88,6</span>; erstes Nicht-Anthropic-Modell ist Gemini 3.1 Pro auf Rang 8. Auf anderen Trackern ist das Feld deutlich enger.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>Wer fehlt, fehlt nur hier</strong>: Opus 5, Kimi K3, Kimi K2.7, Grok 4.5 und GPT-5.6 stehen auf <em>diesem</em> Board nicht — bei vals.ai sehr wohl: Opus 5 <span class=\"stat\">97,0</span>, GPT-5.6 Sol <span class=\"stat\">96,2</span>, Kimi K3 <span class=\"stat\">93,4</span>, Grok 4.5 <span class=\"stat\">86,6</span>. Kein Ranking-Befund, ein Abdeckungsunterschied.</li>\n      <li><span class=\"chip\">Claude</span> <strong>Kalender-Notiz</strong>: Sonnet 5 kostet noch bis <strong>31.08.</strong> <span class=\"stat\">2 $</span>/<span class=\"stat\">10 $</span> je Mio. Token, danach <span class=\"stat\">3 $</span>/<span class=\"stat\">15 $</span>. Das ist eine Preiserhöhung um 50 %, die auf keinem Änderungsprotokoll auftaucht.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>Copilots Open-Weight-Modell ist schon eine Generation alt</strong>: Kimi K2.7 Code ist seit dem 01.07. das erste offene Modell im Copilot-Picker — Moonshot hat vorgestern K3 veröffentlicht.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Rundruf</strong>: Continue.dev ist endgültig tot (Cloud-Daten seit 15.07. gelöscht), Aiders Board steht weiter auf <strong>20.11.2025</strong>, Clines Changelog führt v4.0.0 ohne Datum. Bei OpenHands, Plandex, Devin, Bolt und JetBrains AI: keine Bewegung.</li>\n    </ul></div>",

>: llm-stats weist für SWE-Bench Verified <span class=\"stat\">104</span> Einträge als selbstberichtet und <span class=\"stat\">0</span> als verifiziert aus. Der Name des Boards verspricht genau das Gegenteil.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Bei llm-stats sind sieben der Top Ten Anthropic-Modelle</strong>: Fable 5 führt mit <span class=\"stat\">95,0</span>, dahinter Mythos Preview <span class=\"stat\">93,9</span> und Opus 4.8 <span class=\"stat\">88,6</span>; erstes Nicht-Anthropic-Modell ist Gemini 3.1 Pro auf Rang 8. Auf anderen Trackern ist das Feld deutlich enger.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>Wer fehlt, fehlt nur hier</strong>: Opus 5, Kimi K3, Kimi K2.7, Grok 4.5 und GPT-5.6 stehen auf <em>diesem</em> Board nicht — bei vals.ai sehr wohl: Opus 5 <span class=\"stat\">97,0</span>, GPT-5.6 Sol <span class=\"stat\">96,2</span>, Kimi K3 <span class=\"stat\">93,4</span>, Grok 4.5 <span class=\"stat\">86,6</span>. Kein Ranking-Befund, ein Abdeckungsunterschied.</li>\n      <li><span class=\"chip\">Claude</span> <strong>Kalender-Notiz</strong>: Sonnet 5 kostet noch bis <strong>31.08.</strong> <span class=\"stat\">2 $</span>/<span class=\"stat\">10 $</span> je Mio. Token, danach <span class=\"stat\">3 $</span>/<span class=\"stat\">15 $</span>. Das ist eine Preiserhöhung um 50 %, die auf keinem Änderungsprotokoll auftaucht.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>Copilots Open-Weight-Modell ist schon eine Generation alt</strong>: Kimi K2.7 Code ist seit dem 01.07. das erste offene Modell im Copilot-Picker — Moonshot hat vorgestern K3 veröffentlicht.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Rundruf</strong>: Continue.dev ist endgültig tot (Cloud-Daten seit 15.07. gelöscht), Aiders Board steht weiter auf <strong>20.11.2025</strong>, Clines Changelog führt v4.0.0 ohne Datum. Bei OpenHands, Plandex, Devin, Bolt und JetBrains AI: keine Bewegung.</li>\n    </ul></div>",
        "en": "<div class=\"tldr\"><p class=\"lead\">Yesterday this space carried a question mark over the MCP spec: announced for July 28, but as of 05:13 UTC the docs still showed the old version. Today the answer is in, and it's mixed — the content has been swapped over, the initialization handshake replaced by per-request negotiation, only the \"current version\" label is lagging behind. On top of that, the SWE-Bench Verified board got fresh numbers overnight, and a closer look turns up something more uncomfortable than any score.</p>\n    <ul>\n      <li><span class=\"chip hot\">MCP</span> <strong>The handshake is gone, the replacement is live</strong>: Every request now carries its own protocol version in the <code>_meta</code> field, and the server accepts or rejects it <em>\"independently\"</em> per request. Client and server may speak multiple versions at the same time.</li>\n      <li><span class=\"chip\">MCP</span> <strong>New: <code>server/discover</code></strong> — an RPC that's mandatory for servers, optional for clients, returning version, capabilities, and identity <em>\"in a single request\"</em>. If the version doesn't match, an <code>UnsupportedProtocolVersionError</code> comes back listing what would work.</li>\n      <li><span class=\"chip hot\">MCP</span> <strong>Label lags behind</strong>: As of 06:40 UTC, the same page still says <em>\"The current protocol version is 2025-11-25\"</em> — right above where it describes negotiating the new version. A contradiction in one document.</li>\n      <li><span class=\"chip\">MCP</span> <strong>Anthropic's post is an announcement, not a rollout</strong>: <em>\"Support is being rolled out across Claude products soon\"</em> — no date given. It does cite <span class=\"stat\">400M</span> monthly SDK downloads (4x this year) and <span class=\"stat\">950+</span> servers in the connector directory.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>A \"Verified\" board with zero verifications</strong>: llm-stats lists <span class=\"stat\">104</span> SWE-Bench Verified entries as self-reported and <span class=\"stat\">0</span> as verified. The board's name promises exactly the opposite.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Seven of the top ten are Anthropic models</strong>: Fable 5 leads with <span class=\"stat\">95.0</span>, followed by Mythos Preview at <span class=\"stat\">93.9</span> and Opus 4.8 at <span class=\"stat\">88.6</span>. First non-Anthropic model: Gemini 3.1 Pro at rank 8.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>Who's missing is missing only here</strong>: Opus 5, Kimi K3, Kimi K2.7, Grok 4.5, and GPT-5.6 aren't on <em>this</em> board — but they are on vals.ai: Opus 5 <span class=\"stat\">97.0</span>, GPT-5.6 Sol <span class=\"stat\">96.2</span>, Kimi K3 <span class=\"stat\">93.4</span>, Grok 4.5 <span class=\"stat\">86.6</span>. Not a ranking finding, a coverage difference.</li>\n      <li><span class=\"chip\">Claude</span> <strong>Calendar note</strong>: Sonnet 5 still costs <span class=\"stat\">$2</span>/<span class=\"stat\">$10</span> per million tokens until <strong>August 31</strong>, then <span class=\"stat\">$3</span>/<span class=\"stat\">$15</span>. That's a 50% price hike that appears in no changelog.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>Copilot's open-weight model is already a generation old</strong>: Kimi K2.7 Code has been the first open model in the Copilot picker since July 1 — Moonshot released K3 the day before yesterday.</li>\n      <li><span class=\"chip\">Tool</span> <strong>Roundup</strong>: Continue.dev is definitively dead (cloud data deleted since July 15), Aider's board still reads November 20, 2025, Cline's changelog lists v4.0.0 with no date. OpenHands, Plandex, Devin, Bolt, and JetBrains AI: no movement.</li>\n    </ul></div>",
        "pt": "<div class=\"tldr\"><p class=\"lead\">Ontem, este espaço trazia uma interrogação sobre a spec do MCP: anunciada para 28/07, mas às 05:13 UTC a documentação ainda mostrava a versão antiga. Hoje a resposta chegou, e ela é ambígua — o conteúdo foi trocado, o handshake de inicialização foi substituído por uma negociação por requisição, só o rótulo \"versão atual\" ficou para trás. Além disso, o quadro SWE-Bench Verified recebeu números novos durante a noite, e ao olhar de perto surge algo mais incômodo do que qualquer pontuação.</p>\n    <ul>\n      <li><span class=\"chip hot\">MCP</span> <strong>O handshake acabou, o substituto está no ar</strong>: Cada requisição agora carrega sua própria versão de protocolo no campo <code>_meta</code>, e o servidor aceita ou rejeita isso <em>\"independently\"</em> a cada requisição. Cliente e servidor podem falar várias versões ao mesmo tempo.</li>\n      <li><span class=\"chip\">MCP</span> <strong>Novidade: <code>server/discover</code></strong> — uma RPC obrigatória para servidores e opcional para clientes, que devolve versão, capacidades e identidade <em>\"in a single request\"</em>. Se a versão não bate, volta um <code>UnsupportedProtocolVersionError</code> com a lista do que funcionaria.</li>\n      <li><span class=\"chip hot\">MCP</span> <strong>Rótulo atrasado</strong>: Às 06:40 UTC, a mesma página ainda diz <em>\"The current protocol version is 2025-11-25\"</em> — logo acima de onde descreve a negociação da nova versão. Contradição no mesmo documento.</li>\n      <li><span class=\"chip\">MCP</span> <strong>O post da Anthropic é anúncio, não rollout</strong>: <em>\"Support is being rolled out across Claude products soon\"</em> — sem data. Em compensação, cita <span class=\"stat\">400 mi</span> de downloads mensais do SDK (4x este ano) e <span class=\"stat\">950+</span> servidores no diretório de conectores.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>Um quadro \"Verified\" sem uma única verificação</strong>: o llm-stats lista <span class=\"stat\">104</span> entradas do SWE-Bench Verified como autorreportadas e <span class=\"stat\">0</span> como verificadas. O nome do quadro promete exatamente o contrário.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Sete dos dez primeiros são modelos da Anthropic</strong>: o Fable 5 lidera com <span class=\"stat\">95,0</span>, seguido do Mythos Preview com <span class=\"stat\">93,9</span> e do Opus 4.8 com <span class=\"stat\">88,6</span>. Primeiro modelo que não é da Anthropic: Gemini 3.1 Pro, na posição 8.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>Quem falta, falta só aqui</strong>: Opus 5, Kimi K3, Kimi K2.7, Grok 4.5 e GPT-5.6 não aparecem <em>neste</em> quadro — no vals.ai, sim: Opus 5 <span class=\"stat\">97,0</span>, GPT-5.6 Sol <span class=\"stat\">96,2</span>, Kimi K3 <span class=\"stat\">93,4</span>, Grok 4.5 <span class=\"stat\">86,6</span>. Não é um achado de ranking, é uma diferença de cobertura.</li>\n      <li><span class=\"chip\">Claude</span> <strong>Nota de calendário</strong>: o Sonnet 5 continua custando <span class=\"stat\">US$ 2</span>/<span class=\"stat\">US$ 10</span> por milhão de tokens até <strong>31/08</strong>, depois <span class=\"stat\">US$ 3</span>/<span class=\"stat\">US$ 15</span>. São 50% de aumento que não aparece em nenhum changelog.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>O modelo aberto do Copilot já é uma geração atrasado</strong>: o Kimi K2.7 Code é, desde 01/07, o primeiro modelo aberto no seletor do Copilot — a Moonshot lançou o K3 anteontem.</li>\n      <li><span class=\"chip\">Ferramenta</span> <strong>Ronda</strong>: o Continue.dev está definitivamente morto (dados na nuvem apagados desde 15/07), o quadro do Aider segue em 20/11/2025, o changelog do Cline traz o v4.0.0 sem data. OpenHands, Plandex, Devin, Bolt e JetBrains AI: sem movimento.</li>\n    </ul></div>",
        "es": "<div class=\"tldr\"><p class=\"lead\">Ayer, este espacio traía un signo de interrogación sobre la especificación de MCP: anunciada para el 28/07, pero a las 05:13 UTC la documentación seguía mostrando la versión anterior. Hoy llegó la respuesta, y es ambigua: el contenido ya se actualizó, el protocolo de inicialización (handshake) fue reemplazado por una negociación por solicitud, solo la etiqueta de \"versión actual\" se quedó atrás. Además, el tablero SWE-Bench Verified recibió cifras nuevas durante la noche, y al mirar de cerca aparece algo más incómodo que cualquier puntaje.</p>\n    <ul>\n      <li><span class=\"chip hot\">MCP</span> <strong>El handshake desapareció, el reemplazo ya está en línea</strong>: cada solicitud lleva ahora su propia versión de protocolo en el campo <code>_meta</code>, y el servidor la acepta o la rechaza <em>\"independently\"</em> en cada solicitud. Cliente y servidor pueden hablar varias versiones al mismo tiempo.</li>\n      <li><span class=\"chip\">MCP</span> <strong>Novedad: <code>server/discover</code></strong> — un RPC obligatorio para servidores y opcional para clientes, que devuelve versión, capacidades e identidad <em>\"in a single request\"</em>. Si la versión no coincide, regresa un <code>UnsupportedProtocolVersionError</code> con la lista de lo que sí funcionaría.</li>\n      <li><span class=\"chip hot\">MCP</span> <strong>La etiqueta se quedó atrás</strong>: a las 06:40 UTC, la misma página todavía dice <em>\"The current protocol version is 2025-11-25\"</em> — justo arriba de donde describe la negociación de la nueva versión. Una contradicción en el mismo documento.</li>\n      <li><span class=\"chip\">MCP</span> <strong>La publicación de Anthropic es un anuncio, no un despliegue</strong>: <em>\"Support is being rolled out across Claude products soon\"</em> — sin fecha. En cambio, cita <span class=\"stat\">400 M</span> de descargas mensuales del SDK (4x en el año) y <span class=\"stat\">950+</span> servidores en el directorio de conectores.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>Un tablero \"Verified\" sin una sola verificación</strong>: llm-stats lista <span class=\"stat\">104</span> entradas de SWE-Bench Verified como autorreportadas y <span class=\"stat\">0</span> como verificadas. El nombre del tablero promete justo lo contrario.</li>\n      <li><span class=\"chip\">Bench</span> <strong>Siete de los diez primeros son modelos de Anthropic</strong>: Fable 5 encabeza con <span class=\"stat\">95,0</span>, seguido de Mythos Preview con <span class=\"stat\">93,9</span> y Opus 4.8 con <span class=\"stat\">88,6</span>. Primer modelo que no es de Anthropic: Gemini 3.1 Pro, en el puesto 8.</li>\n      <li><span class=\"chip hot\">Bench</span> <strong>Quién falta, falta solo aquí</strong>: Opus 5, Kimi K3, Kimi K2.7, Grok 4.5 y GPT-5.6 no aparecen en <em>este</em> tablero — pero sí en vals.ai: Opus 5 <span class=\"stat\">97,0</span>, GPT-5.6 Sol <span class=\"stat\">96,2</span>, Kimi K3 <span class=\"stat\">93,4</span>, Grok 4.5 <span class=\"stat\">86,6</span>. No es un hallazgo de ranking, es una diferencia de cobertura.</li>\n      <li><span class=\"chip\">Claude</span> <strong>Nota de calendario</strong>: Sonnet 5 sigue costando <span class=\"stat\">US$2</span>/<span class=\"stat\">US$10</span> por millón de tokens hasta el <strong>31/08</strong>, después <span class=\"stat\">US$3</span>/<span class=\"stat\">US$15</span>. Eso es 50% más caro, un aumento que no aparece en ningún changelog.</li>\n      <li><span class=\"chip good\">OSS</span> <strong>El modelo abierto de Copilot ya tiene una generación de atraso</strong>: Kimi K2.7 Code es, desde el 01/07, el primer modelo abierto en el selector de Copilot — Moonshot lanzó K3 anteayer.</li>\n      <li><span class=\"chip\">Herramienta</span> <strong>Ronda</strong>: Continue.dev está definitivamente muerto (datos en la nube eliminados desde el 15/07), el tablero de Aider sigue marcando el 20/11/2025, el changelog de Cline muestra v4.0.0 sin fecha. OpenHands, Plandex, Devin, Bolt y JetBrains AI: sin movimiento.</li>\n    </ul></div>"
